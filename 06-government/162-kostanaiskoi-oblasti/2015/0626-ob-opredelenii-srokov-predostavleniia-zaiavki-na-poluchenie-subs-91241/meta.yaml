act_code: '91241'
requisite: Постановление акимата Наурзумского района Костанайской области от 26 июня 2015 года № 172. Зарегистрировано Департаментом юстиции Костанайской области 2 июля 2015 года № 5717. Утратило силу постановлением акимата Наурзумского района Костанайской области от 5 октября 2015 года № 262
title:
  rus: Об определении сроков предоставления заявки на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығының шығымдылығын және өнiм сапасын арттыруға, жанар-жаңармай материалдарының және көктемгi егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнына және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнына субсидиялар алуға арналған өтінімді ұсыну мерзімдерін айқындау туралы

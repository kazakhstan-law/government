title:
  rus: Об утверждении регламента государственной услуги "Выдача паспорта готовности энергопроизводящим и энергопередающим организациям к работе в осенне-зимний период"
  kaz: '"Энергия өндіруші және энергия беруші ұйымдарға күзгі-қысқы кезеңдегі жұмысқа әзірлік паспортын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

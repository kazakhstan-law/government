act_code: '88308'
requisite: Постановление акимата Алтынсаринского района Костанайской области от 27 февраля 2015 года № 42. Зарегистрировано Департаментом юстиции Костанайской области 7 апреля 2015 года № 5501. Утратило силу постановлением акимата Алтынсаринского района Костанайской области от 15 декабря 2015 года № 234
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Алтынсаринском районе
  kaz: Алтынсарин ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

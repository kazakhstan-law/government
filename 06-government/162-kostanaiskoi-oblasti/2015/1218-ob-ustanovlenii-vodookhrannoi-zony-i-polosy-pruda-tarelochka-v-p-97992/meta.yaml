title:
  rus: Об установлении водоохранной зоны и полосы пруда Тарелочка в пределах проектируемого микрорайона "Аэропорт" в городе Костанай, режима и особых условий их хозяйственного использования
  kaz: Қостанай қаласындағы "Әуежай" жобаланатын шағын ауданы шегінде Тарелочка тоғанының су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

requisite: Постановление акимата Узункольского района Костанайской области от 3 марта 2015 года № 72. Зарегистрировано Департаментом юстиции Костанайской области 10 марта 2015 года № 5401. Утратило силу постановлением акимата Узункольского района Костанайской области от 5 января 2016 года № 1
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақыларын мен тарифтік ставкаларын кемінде жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

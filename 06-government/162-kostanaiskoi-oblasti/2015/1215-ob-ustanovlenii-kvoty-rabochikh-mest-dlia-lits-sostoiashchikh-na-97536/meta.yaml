requisite: Постановление акимата Камыстинского района Костанайской области от 15 декабря 2015 года № 170. Зарегистрировано Департаментом юстиции Костанайской области 11 января 2016 года № 6121. Утратило силу постановлением акимата Камыстинского района Костанайской области от 15 июня 2016 года № 89
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квотасын белгілеу туралы

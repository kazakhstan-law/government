act_code: '94450'
requisite: Постановление от 13.10.2015 №281, Акимат Федоровского района
title:
  rus: О признании утратившим силу постановления акимата района от 29 июня 2015 года № 212 "Об утверждении схемы и Правил перевозки в общеобразовательные шкоды детей, проживающих в отдаленных населенных пунктах Федоровского района"
  kaz: '"Федоров ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен қағидаларын бекіту туралы" аудан әкімдігінің 2015 жылғы 29 маусымдағы № 212 қаулысының күші жойылғанын мойындау туралы'

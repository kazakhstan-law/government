requisite: Постановление акимата Костанайской области от 28 июля 2015 года № 314. Зарегистрировано Департаментом юстиции Костанайской области 27 августа 2015 года № 5848. Утратило силу постановлением акимата Костанайской области от 23 мая 2016 года № 242
title:
  rus: Об утверждении норматива субсидий, а также критериев и требований по направлению субсидирования возмещение до 100 % затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100 %-ға дейін өтеуді субсидиялау бағыты бойынша субсидиялар нормативін, сондай-ақ өлшемдер мен талаптарын бекіту туралы

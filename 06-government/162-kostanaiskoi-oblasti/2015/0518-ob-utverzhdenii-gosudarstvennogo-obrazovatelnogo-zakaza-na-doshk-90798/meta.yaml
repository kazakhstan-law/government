act_code: '90798'
requisite: Постановление от 18.05.2015 №122, Акимат Карабалыкского района
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в дошкольных организациях образования Карабалыкского района на 2015 год
  kaz: Қарабалық ауданының 2015 жылға арналған мектепке дейінгі білім беру ұйымдарында мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысы, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

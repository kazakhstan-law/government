act_code: '89853'
requisite: Постановление акимата Костанайской области от 24 апреля 2015 года № 163. Зарегистрировано Департаментом юстиции Костанайской области 21 мая 2015 года № 5614. Утратило силу постановлением акимата Костанайской области от 24 января 2020 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну" мемлекеттiк көрсетiлетiн қызмет регламентін бекіту туралы'

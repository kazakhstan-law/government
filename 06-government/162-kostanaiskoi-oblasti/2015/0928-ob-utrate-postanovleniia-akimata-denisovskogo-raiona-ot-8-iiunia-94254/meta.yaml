title:
  rus: Об утрате постановления акимата Денисовского района от 8 июня  2015   года  №101 «Об утверждении схемы и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Денисовского района»
  kaz: Денисов ауданы әкімдігінің 2015 жылғы 8 маусымдағы № 101 "Денисов ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен қағидаларын бекіту туралы" қаулысының күшін жою туралы

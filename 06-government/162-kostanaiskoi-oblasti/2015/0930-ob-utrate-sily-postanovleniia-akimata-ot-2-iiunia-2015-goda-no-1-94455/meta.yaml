title:
  rus: Об утрате силы постановления акимата от 2 июня 2015 года № 118 «Об утверждении схемы и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Алтынсаринского района»
  kaz: Алтынсарин ауданы әкімдігінің 2015 жылғы 2 маусымдағы № 118 "Алтынсарин ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен қағидаларын бекіту туралы" қаулысының күшін жою туралы

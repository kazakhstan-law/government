requisite: Постановление акимата Костанайской области от 15 декабря 2015 года № 551. Зарегистрировано Департаментом юстиции Костанайской области 11 января 2016 года № 6128. Утратило силу постановлением акимата Костанайской области от 8 января 2020 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги           «Выдача лицензии на осуществление деятельности на производство (формуляции) пестицидов (ядохимикатов), реализацию пестицидов (ядохимикатов), применение пестицидов (ядохимикатов) аэрозольным и фумигационным способами»
  kaz: «Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдiк және фумигациялық тәсiлдермен қолдануға байланысты қызметті жүзеге асыруға лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

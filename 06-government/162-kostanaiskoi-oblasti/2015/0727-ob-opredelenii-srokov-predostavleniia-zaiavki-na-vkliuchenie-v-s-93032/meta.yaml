title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Денисовскому району на 2015 год
  kaz: Денисов ауданы бойынша 2015 жылға арналған субсидия алушылардың тізіміне қосуға өтінімдерді ұсыну мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша оңтайлы себу мерзімдерін айқындау туралы

  title:
    rus: О внесении изменений в постановление акимата от 23 ноября 2015 года № 503 «Об утверждении регламента государственной услуги «Выдача разрешения на использование подземных вод питьевого качества для целей, не связанных с питьевым и хозяйственно-бытовым водоснабжением на территориях, где отсутствуют поверхностные водные объекты, но имеются достаточные запасы подземных вод питьевого качества»
    kaz: Әкімдіктің 2015 жылғы 23 қарашадағы № 503 «Жерүсті су объектілері жоқ, бірақ ауызсу сапасындағы жерасты суларының жеткілікті қоры бар аумақтарда ауызсумен және шаруашылық-тұрмыстық сумен жабдықтауға байланысты емес мақсаттар үшін ауызсу сапасындағы жерасты суларын пайдалануға рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

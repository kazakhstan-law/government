act_code: '96525'
requisite: Постановление акимата Костанайской области от 23 ноября 2015 года № 503. Зарегистрировано Департаментом юстиции Костанайской области 18 декабря 2015 года № 6062. Утратило силу постановлением акимата Костанайской области от 13 января 2020 года № 9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача разрешения на использование подземных вод питьевого качества для целей, не связанных с питьевым и хозяйственно-бытовым водоснабжением на территориях, где отсутствуют поверхностные водные объекты, но имеются достаточные запасы подземных вод питьевого качества»
  kaz: «Жерүсті су объектілері жоқ, бірақ ауызсу сапасындағы жерасты суларының жеткілікті қоры бар аумақтарда ауызсумен және шаруашылық-тұрмыстық сумен жабдықтауға байланысты емес мақсаттар үшін ауызсу сапасындағы жерасты суларын пайдалануға рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

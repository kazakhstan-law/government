act_code: '97078'
requisite: Постановление акимата Алтынсаринского района Костанайской области от 15 декабря 2015 года № 234
title:
  rus: Об утрате силы постановления акимата от 27 февраля 2015 года № 42 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожжденных из мест лишения свободы для несовершеннолетних выпускников интернатных организаций в Алтынсаринском районе"
  kaz: Алтынсарин ауданы әкімдігінің 2014 жылғы 27 ақпандағы № 42 "Алтынсарин ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" қаулысының күшін жою туралы

requisite: Постановление акимата Костанайской области от 14 октября 2015 года № 433. Зарегистрировано Департаментом юстиции Костанайской области 5 ноября 2015 года № 5979. Утратило силу постановлением акимата Костанайской области от 20 января 2020 года № 16 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

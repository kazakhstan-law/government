    kaz: Әкімдіктің 2015 жылғы 14 қазандағы № 433 «Денсаулық сақтау саласының кадрларын даярлықтан өткізу, олардың біліктілігін арттыру және қайта даярлау туралы құжаттарды беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

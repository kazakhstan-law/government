act_code: '93576'
requisite: Постановление акимата Костанайской области от 3 августа 2015 года № 322. Зарегистрировано Департаментом юстиции Костанайской области 9 сентября 2015 года № 5869. Утратило силу постановлением акимата Костанайской области от 12 мая 2016 года № 225
title:
  rus: Об утверждении регламентов государственных услуг "Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан", "Выдача архитектурно-планировочного задания" и "Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования"
  kaz: '"Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау бойынша анықтама беру", "Сәулет-жоспарлау тапсырмасын беру" және "Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертуге байланысты емес қолданыстағы ғимараттардың үй-жайларын (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру" мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы'

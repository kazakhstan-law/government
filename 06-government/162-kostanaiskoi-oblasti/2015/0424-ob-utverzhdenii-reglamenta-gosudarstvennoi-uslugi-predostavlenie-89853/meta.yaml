  title:
    rus: О внесении изменения в постановление акимата от 24 апреля 2015 года № 163 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта   и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: Әкiмдіктiң 2015 жылғы 24 сәуірдегі № 163 «Ауылдық елді мекендерге жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету» мемлекеттiк көрсетiлетiн қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

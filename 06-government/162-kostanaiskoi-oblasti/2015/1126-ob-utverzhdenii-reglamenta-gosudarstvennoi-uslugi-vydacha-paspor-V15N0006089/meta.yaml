requisite: Постановление акимата Костанайской области от 26 ноября 2015 года № 519. Зарегистрировано Департаментом юстиции Костанайской области 28 декабря 2015 года № 6089. Утратило силу постановлением акимата Костанайской области от 16 марта 2020 года № 102 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Выдача паспорта готовности энергопроизводящим и энергопередающим организациям к работе в осенне-зимний период"
  kaz: '"Энергия өндіруші және энергия беруші ұйымдарға күзгі-қысқы кезеңдегі жұмысқа әзірлік паспортын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

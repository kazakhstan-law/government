requisite: Постановление акимата города Лисаковска Костанайской области от 14 декабря 2006 года № 1264. Зарегистрировано Управлением юстиции города Лисаковска Костанайской области 10 января 2007 года № 9-4-70. Утратило силу постановлением акимата города Лисаковска Костанайской области от 15 января 2008 года № 61
title:
  rus: О корректировании средней урожайности (продуктивности), приведенной в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа деиінгі оалаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточкада келтірген орташа түсімді (өнімділікті), сондай-ақ өзіндік қосалқы шаруашылықтан түскен табысты  есептеу үшін статистика органдары ұсынатын, бағаларды түзету туралы

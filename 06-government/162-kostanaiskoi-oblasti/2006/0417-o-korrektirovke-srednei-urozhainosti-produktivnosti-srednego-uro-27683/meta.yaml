title:
  rus: О корректировке средней урожайности (продуктивности), среднего уровня производственных расходов, приведенных в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға ай сайынғы мемлекеттік жәрдемақы тағайындау кезінде жеке қосымша шаруашылығынан түсетін түсімдерді есептеу үшін нормативтік карточкаға келтірілген, сондай-ақ статистика органы ұсынған бағаны, өндірістік шығындардың орташа деңгейін, орташа өнімділігін (өнімді) түзету туралы

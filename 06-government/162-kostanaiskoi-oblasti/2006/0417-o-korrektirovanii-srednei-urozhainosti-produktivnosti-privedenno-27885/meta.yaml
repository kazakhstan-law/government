requisite: Постановление акимата Денисовского района Костанайской области от 17 апреля 2006 года № 134. Зарегистрировано Управлением юстиции Денисовского района Костанайской области 28 апреля 2006 года № 9-8-40. Утратило силу постановлением акимата Денисовского района Костанайской области от 2 февраля 2007 года № 93
title:
  rus: О корректировании средней урожайности (продуктивности), приведенной в нормативной карточке, а также представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточка келтірілген орташа тусімді (өнімділікті), сондай-ақ жеке косалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

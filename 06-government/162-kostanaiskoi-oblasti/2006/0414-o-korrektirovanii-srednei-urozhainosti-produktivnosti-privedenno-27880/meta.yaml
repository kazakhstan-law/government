requisite: Постановление акимата Камыстинского района Костанайской области от 14 апреля 2006 года № 106. Зарегистрировано Управлением юстиции Камыстинского района Костанайской области 12 мая 2006 года № 9-11-35. Утратило силу постановлением акимата Камыстинского района Костанайской области от 9 февраля 2009 года № 26
title:
  rus: О корректировании средней урожайности (продуктивности), приведенной в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікті), сондай-ақ жеке косалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

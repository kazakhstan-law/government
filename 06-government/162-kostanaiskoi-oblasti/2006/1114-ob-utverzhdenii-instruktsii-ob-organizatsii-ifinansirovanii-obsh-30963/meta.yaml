requisite: Постановление акимата города Лисаковска Костанайской области от 14 ноября 2006 года № 1146. Зарегистрировано Управлением юстиции города Лисаковска Костанайской области 20 декабря 2006 года № 9-4-66. Срок действия постановления - до 1 января 2008 года
title:
  rus: "Об утверждении Инструкции об организации ифинансировании общественных работ и перечня предприятий, предоставляющих рабочие места для организации общественных\tработ на 2007 год по городу Лисаковску"
  kaz: Коғамдық жұмыстарды ұйымдастыру мен қаржыландыру туралы нұсқаулықты және 2007 жылға арналған Лисаков қаласы бойынша қоғамдық жұмыстарды ұйымдастыру үшін жұмыс орындарын ұсынатын кәсіпорындардың тізбесін бекіту туралы

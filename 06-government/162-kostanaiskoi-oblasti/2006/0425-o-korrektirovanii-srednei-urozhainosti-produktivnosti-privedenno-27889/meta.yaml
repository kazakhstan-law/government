requisite: Постановление акимата города Лисаковска Костанайской области от 25 апреля 2006 года № 329. Зарегистрировано Управлением юстиции города Лисаковска Костанайской области 16 мая 2006 года № 9-4-50. Утратило силу постановлением акимата города Лисаковска Костанайской области от 8 декабря 2007 года № 2539
title:
  rus: О корректировании средней урожайности (продуктивности), приведенной в нормативной  карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного  хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікті), сондай-ақ өзіндік қосалқы шаруашылықтан тускен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

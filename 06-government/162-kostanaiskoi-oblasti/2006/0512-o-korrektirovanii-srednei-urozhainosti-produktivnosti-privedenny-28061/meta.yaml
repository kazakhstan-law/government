title:
  rus: О корректировании средней урожайности (продуктивности), приведенных в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікті), сондай-ақ жеке қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

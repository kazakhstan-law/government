act_code: '27874'
requisite: Постановление акимата Федоровского района Костанайской области от 18 июня 2006 года № 147. Зарегистрировано Управлением юстиции Федоровского района Костанайской области 18 мая 2006 года № 9-20-26
title:
  rus: О корректировании средней урожайности (продуктивности), приведенных в нормативной карточке, а также цен на 2006 год, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до восемнадцати лет
  kaz: Он сегіз жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікті), сондай-ақ жеке қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары 2006 жылға ұсынатын бағаларды түзету туралы

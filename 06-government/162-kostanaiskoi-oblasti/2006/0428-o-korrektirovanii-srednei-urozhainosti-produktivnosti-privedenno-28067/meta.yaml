act_code: '28067'
requisite: Постановление акимата Сарыкольского района Костанайской области от 28 апреля 2006 года № 159. Зарегистрировано Управлением юстиции Сарыкольского района Костанайской области 24 мая 2006 года № 9-17-28
title:
  rus: О корректировании средней урожайности (продуктивности), приведенной в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікті), өндірістік шығыстардың орташа деңгейін, сондай-ақ жеке қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

act_code: '28224'
requisite: Қостанай облысы Рудный қаласы әкімдігінің 2006 жылғы 15 мамырдағы № 400 қаулысы. Қостанай облысы Рудный қаласы Әділет басқармасында 2006 жылғы 29 мамырда № 9-2-50 болып тіркелді. Қаулының қолданылу мерзімі 2007 жылдың 1 қаңтарына дейін
title:

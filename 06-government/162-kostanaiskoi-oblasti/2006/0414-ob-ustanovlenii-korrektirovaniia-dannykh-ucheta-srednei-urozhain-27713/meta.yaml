act_code: '27713'
requisite: Постановление акимата Тарановского района Костанайской области от 14 апреля 2006 года № 90. Зарегистрировано Управлением юстиции Тарановского района Костанайской области 4 мая 2006 года № 9-18-28
title:
  rus: Об установлении корректирования данных учета средней урожайности (продуктивности), среднего уровня производственных расходов, приведенных в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода отличного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікіті), өндірістік шығыстардың орташа денгейін, сондай-ақ жеке қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

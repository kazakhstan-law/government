requisite: Постановление акимата Костанайской области от 22 апреля 2002 года № 89. Зарегистрировано Управлением юстиции Костанайской области 14 мая 2002 года № 1493. Утратило силу постановлением акимата Костанайской области от 26 августа 2005 года № 291
title:
  rus: О правилах оказания социальной помощи безработным, направленным на профессиональную подготовку, повышение квалификации и переподготовку, по частичному возмещению затрат на проживание, питание, возмещению затрат по медицинскому освидетельствованию и на проезд к месту обучения в пределах региона
  kaz: Кәсiби даярлау, бiлiктiлiктi арттыру және қайта даярлауға жiберiлген жұмыссыздарға тұруға, тамақтануға арналған шығынды iшiнара, медициналық куәландыруға және аймақ шегiнде оқу орнына баратын жолға арналған шығынды өтеу жөнiнде әлеуметтiк көмек көрсетудiң ережесi туралы

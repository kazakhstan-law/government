  title:
    rus: О внесении изменений в постановление акимата Костанайской области от 30 января 2024 года № 40 «О создании государственного учреждения «Управление по мобилизационной подготовке, территориальной обороне и гражданской защите акимата Костанайской области» и утверждении его Положения»
    kaz: Қостанай облысы әкімдігінің 2024 жылғы 30 қаңтардағы № 40 «Қостанай облысы әкімдігінің жұмылдыру дайындығы, аумақтық қорғаныс және азаматтық қорғау басқармасы» мемлекеттік мекемесін құру және оның Ережесін бекіту туралы» қаулысына өзгерістер енгізу туралы

act_code: '201423'
requisite: Постановление акимата Узункольского района Костанайской области от 4 октября 2024 года № 131
title:
  rus: О предоставлении права ограниченного целевого землепользования (публичный сервитут) государственному коммунальному предприятию «Узунколь Су» отдела жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата Узункольского района» для эксплуатации и обслуживания магистрального водопровода, расположенного на территории Ершовского сельского округа Узункольского района
  kaz: «Ұзынкөл ауданы әкімдігінің тұрғын үй-коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімінің «Ұзынкөл Су» мемлекеттік коммуналдық кәсіпорнына Ұзынкөл ауданы Ершов ауылдық округі аумағында орналасқан магистральдық су құбырын пайдалану және қызмет көрсету үшін шектеулі нысаналы жерге пайдалану (қауымдық сервитут) құқығын беру туралы

requisite: Постановление акимата Костанайской области от 20 февраля 2004 года № 35. Зарегистрировано Департаментом юстиции Костанайской области 1 марта 2004 года № 2786. Прекратил действие в связи с истечением срока применения - письмо руководителя аппарата акима Костанайской области от 11 декабря 2006 года № 08-3/3087
title:

act_code: '66309'
requisite: Постановление акимата Карабалыкского района Костанайской области от 29 мая 2012 года № 304. Зарегистрировано Управлением юстиции Карабалыкского района Костанайской области 20 июня 2012 года № 9-12-192. Утратило силу постановлением акимата Карабалыкского района Костанайской области от 5 февраля 2013 года № 22
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен ауылдық (селолық) жерде жұмыс істейтін және жиырма бес процент жоғары лауазымдық жалақылар мен тарифтік ставкаларға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесін белгілеу туралы

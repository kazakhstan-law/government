  title:
    rus: О внесении изменения в постановление акимата от 28 мая 2012 года № 251 "Об установлении водоохранной зоны и полосы реки Аят в пределах земельных участков товарищества с ограниченной ответственностью "Сулу" в селе Николаевка Асенкритовского сельского округа, в Красносельском сельском округе Тарановского района Костанайской области, режима и особых условий их хозяйственного использования"
    kaz: Әкімдіктің 2012 жылғы 28 мамырдағы № 251 "Қостанай облысы Таран ауданының Асенкритов ауылдық округінің Николаев ауылындағы, Красносельск ауылдық округіндегі "Сулу" жауапкершілігі шектеулі серіктестігінің жер учаскелері шегінде Аят өзенінің су қорғау аймағы мен белдеуін, оларды шаруақорлықпен пайдаланудың ерекше жағдайларын және режимін белгілеу туралы" қаулысына өзгеріс енгізу туралы

act_code: '66079'
requisite: Постановление акимата Костанайской области от 28 мая 2012 года № 254. Зарегистрировано Департаментом юстиции Костанайской области 13 июня 2012 года № 3813. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол в пределах Каратомарского водохранилища на территории земельного участка пансионата «Горняк» в районе Беимбета Майлина Костанайской области, режима и особых условий их хозяйственного использования
  kaz: Қостанай облысы Бейімбет Майлин ауданы «Горняк» пансионатының жер учаскесі аумағындағы Қаратомар су қоймасының шегінде Тобыл өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

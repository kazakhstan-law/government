title:
  rus: Об установлении водоохранных зон и полос реки Тобол в границах сел Денисовка, Некрасовка, Антоновка Денисовского района Костанайской области, режима и особых условий их хозяйственного использования
  kaz: Қостанай облысы Денисов ауданы Денисов, Некрасов, Антонов ауылдарының шекарасындағы Тобыл өзенінің су қорғау аймақтары мен белдеулерін, оларды шаруақорлықпен пайдаланудың ерекше жағдайларын және режимін белгілеу туралы

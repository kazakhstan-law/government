requisite: Постановление акимата Амангельдинского района Костанайской области от 23 ноября 2012 года № 315. Зарегистрировано Департаментом юстиции Костанайской области 10 декабря 2012 года № 3927. Утратило силу постановлением акимата Амангельдинского района Костанайской области от 6 мая 2016 года № 125
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

act_code: '66080'
requisite: Постановление акимата Костанайской области от 28 мая 2012 года № 252. Зарегистрировано Департаментом юстиции Костанайской области 15 июня 2012 года № 3814. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол в пределах земельных участков крестьянских хозяйств "Цой Георгий Сергеевич", "Шалыгин Владимир Владимирович", "Простор" и товарищества с ограниченной ответственностью "Альба" в Новоильинском сельском округе Тарановского района, режима и особых условий их хозяйственного использования
  kaz: Таран ауданы Новоильинов ауылдық округінің "Цой Георгий Сергеевич", "Шалыгин Владимир Владимирович", "Простор" шаруа қожалықтары мен "Альба" жауапкершілігі шектеулі серіктестігі жер учаскелерінің шегінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруақорлықпен пайдаланудың ерекше жағдайларын және режимін белгілеу туралы

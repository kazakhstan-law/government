act_code: '68408'
requisite: Постановление акимата Костанайской области от 19 октября 2012 года № 462. Зарегистрировано Департаментом юстиции Костанайской области 6 ноября 2012 года № 3872. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Аят в пределах земельных участков товарищества с ограниченной ответственностью «Адлет-Т» в селе Әйет района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданының Әйет ауылындағы «Адлет-Т» жауапкершілігі шектеулі серіктестігінің жер учаскелері шегінде Әйет өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

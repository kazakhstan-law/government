title:
  rus: Об установлении зон санитарной охраны хозяйственно-питьевых водозаборов товарищества с ограниченной ответственностью «Викторовское» на участке скважин № 1, № 2, № 4 на территории района Беимбета Майлина
  kaz: Бейімбет Майлин ауданының аумағындағы № 1, № 2, № 4 ұңғымалар учаскесінде «Викторовское» жауапкершілігі шектеулі серіктестігінің шаруашылық-ауыз су тартудың санитарлық қорғау аймақтарын белгілеу туралы

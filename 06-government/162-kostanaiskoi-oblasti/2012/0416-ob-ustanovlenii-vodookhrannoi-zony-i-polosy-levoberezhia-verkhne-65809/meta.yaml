requisite: Постановление акимата Костанайской области от 16 апреля 2012 года № 187. Зарегистрировано Департаментом юстиции Костанайской области 24 мая 2012 года № 3805. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы левобережья Верхне-Тобольского водохранилища на орошаемом земельном участке товарищества с ограниченной ответственностью "Сарыагаш" в Денисовском районе Костанайской области, режима и особых условий их хозяйственного использования
  kaz: Қостанай облысы Денисов ауданы "Сарыағаш" жауапкершілігі шектеулі серіктестігінің суармалы жер учаскесінде Жоғары-Тобыл су қоймасының сол жақ жағалауында су қорғау аймағы мен белдеуін, оларды шаруақорлықпен пайдаланудың ерекше жағдайларын және режимін белгілеу туралы

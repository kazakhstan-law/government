requisite: Постановление акимата Костанайской области от 19 октября 2012 года № 461. Зарегистрировано Департаментом юстиции Костанайской области 12 ноября 2012 года № 3883. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы побережья Каратомарского водохранилища в пределах земельного участка товарищества с ограниченной ответственностью «Тогызбай-Агро» в Набережном сельском округе района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданының Набережный ауылдық округіндегі «Тогызбай-Агро» жауапкершілігі шектеулі серіктестігінің жер учаскесі шегінде Қаратомар су қоймасы жағалауының су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

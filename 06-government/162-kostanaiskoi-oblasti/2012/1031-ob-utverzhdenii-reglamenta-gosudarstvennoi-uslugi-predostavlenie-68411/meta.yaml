requisite: Постановление акимата Костанайской области от 31 октября 2012 года № 483. Зарегистрировано Департаментом юстиции Костанайской области 8 ноября 2012 года № 3879. Утратило силу - Постановлением акимата Костанайской области от 20 ноября 2013 года № 508
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызмет көрсету регламентін бекіту туралы'

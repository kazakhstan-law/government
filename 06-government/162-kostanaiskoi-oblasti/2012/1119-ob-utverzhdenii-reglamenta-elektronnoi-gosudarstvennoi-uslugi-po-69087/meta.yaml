requisite: Постановление акимата Костанайской области от 19 ноября 2012 года № 517. Зарегистрировано Департаментом юстиции Костанайской области 6 декабря 2012 года № 3913. Утратило силу - Постановлением акимата Костанайской области от 20 ноября 2013 года № 508
title:
  rus: Об утверждении регламента электронной государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегі" электрондық мемлекеттік қызмет көрсету регламентін бекіту туралы

act_code: '69552'
requisite: Постановление акимата Костанайской области от 25 декабря 2012 года № 587. Зарегистрировано Департаментом юстиции Костанайской области 29 декабря 2012 года № 3963. Утратило силу постановлением акимата Костанайской области от 20 ноября 2013 года № 508
title:
  rus: Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений) и определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения) по согласованию с уполномоченным органом в сфере религиозной деятельности"
  kaz: '"Дін қызметі саласындағы уәкілетті органмен келісім бойынша ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік қызмет көрсету регламентін бекіту туралы'

act_code: '69551'
requisite: Постановление акимата Костанайской области от 10 декабря 2012 года № 569. Зарегистрировано Департаментом юстиции Костанайской области 29 декабря 2012 года № 3962. Утратило силу - Постановлением акимата Костанайской области от 20 ноября 2013 года № 508
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление вида деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түсті және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуі және өткізу жөніндегі қызмет түрін жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" электрондық мемлекеттік қызмет көрсету регламентін бекіту туралы'

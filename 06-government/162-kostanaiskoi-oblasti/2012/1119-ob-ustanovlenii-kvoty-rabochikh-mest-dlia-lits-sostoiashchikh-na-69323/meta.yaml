requisite: Постановление акимата Мендыкаринского района Костанайской области от 19 ноября 2012 года № 334. Зарегистрировано Департаментом юстиции Костанайской области 14 декабря 2012 года № 3940. Утратило силу постановлением акимата Мендыкаринского района Костанайской области от 20 мая 2016 года № 85
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

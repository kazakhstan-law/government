act_code: '69100'
requisite: Постановление акимата Костанайской области от 28 мая 2012 года № 251. Зарегистрировано Департаментом юстиции Костанайской области 5 июня 2012 года № 3808. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Аят в пределах земельных участков товарищества с ограниченной ответственностью «Сулу» в селе Николаевка Асенкритовского сельского округа, в сельском округе Әйет района Беимбета Майлина Костанайской области, режима и особых условий их хозяйственного использования
  kaz: Қостанай облысы Бейімбет Майлин ауданының Асенкритов ауылдық округінің Николаев ауылындағы, Әйет ауылдық округіндегі «Сулу» жауапкершілігі шектеулі серіктестігінің жер учаскелері шегінде Әйет өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

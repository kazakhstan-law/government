act_code: '67592'
requisite: Постановление акимата Тарановского района Костанайской области от 7 августа 2012 года № 315. Зарегистрировано Департаментом юстиции Костанайской области 7 сентября 2012 года № 3829. Утратило силу постановлением акимата Тарановского района Костанайской области от 15 апреля 2016 года № 132
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квоталарын белгілеу туралы

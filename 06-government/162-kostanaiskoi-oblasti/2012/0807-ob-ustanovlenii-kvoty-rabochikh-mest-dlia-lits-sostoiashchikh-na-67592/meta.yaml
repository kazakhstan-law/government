  title:
    rus: О внесении изменений в постановление акимата района от 7 августа 2012 года № 315 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций"
    kaz: Ауданы әкімдігінің 2012 жылғы 7 тамыздағы № 315 "Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квоталарын белгілеу туралы" қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/79989/rus

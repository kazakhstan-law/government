act_code: '69557'
requisite: Постановление акимата Костанайской области от 5 декабря 2012 года № 548. Зарегистрировано Департаментом юстиции Костанайской области 29 декабря 2012 года № 3975. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на земельном участке, предназначенном под размещение карьера на базе месторождения железных руд Елтай-IV, расположенного в Новоильиновском сельском округе района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданының Новоильинов ауылдық округінде орналасқан Елтай-IV темір рудасының кен орны базасында кенішті орналастыруға арналған жер учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

requisite: Постановление акимата города Лисаковска Костанайской области от 9 апреля 2012 года № 171. Зарегистрировано Управлением юстиции города Лисаковска Костанайской области 4 мая 2012 года № 9-4-207. Утратило силу постановлением акимата города Лисаковска Костанайской области от 26 января 2016 года № 43
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Камыстинского района Костанайской области от 16 мая 2012 года № 114. Зарегистрировано Управлением юстиции Камыстинского района Костанайской области 5 июня 2012 года № 9-11-139. Утратило силу постановлением акимата Камыстинского района Костанайской области от 15 декабря 2015 года № 170
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және  интернаттық ұйымдардың кәмелетке толмаған бітірушілері үшін жұмыс орындарының квотасын белгілеу туралы

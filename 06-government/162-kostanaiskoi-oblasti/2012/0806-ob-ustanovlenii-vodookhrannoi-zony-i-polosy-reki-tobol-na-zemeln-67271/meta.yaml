act_code: '67271'
requisite: Постановление акимата Костанайской области от 6 августа 2012 года № 355. Зарегистрировано Департаментом юстиции Костанайской области 27 августа 2012 года № 3826. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на земельном участке под строительство туристического комплекса по улице Парковая (район между лечебно-оздоровительным центром и гаражным обществом № 2) в городе Рудном, режима и особых условий их хозяйственного использования
  kaz: Рудный қаласындағы Парковая көшесінде (емдеу-сауықтыру орталығы мен № 2 гараж қоғамы арасындағы аудан) туристік кешеннің құрылысына арналған жер учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

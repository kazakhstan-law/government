act_code: '66796'
requisite: Постановление акимата Денисовского района Костанайской области от 29 июня 2012 года № 197. Зарегистрировано Управлением юстиции Денисовского района Костанайской области 26 июля 2012 года № 9-8-204. Утратило силу в связи с истечением срока действия (письмо акима Денисовского района Костанайской области от 4 апреля 2013 года № 07-07/375)
title:
  rus: Об определении оптимальных сроков начала и завершения посевных работ по Денисовскому району по видам продукции растениеводства, подлежащим обязательному страхованию в растениеводстве
  kaz: Денисов ауданы бойынша өсімдік шаруашылығындағы міндетті сақтандыруға жататын, өсімдік шаруашылығы өнімдерінің түрлері бойынша егіс жұмыстардың басталуы мен аяқталуының оңтайлы мерзімдерін белгілеу туралы

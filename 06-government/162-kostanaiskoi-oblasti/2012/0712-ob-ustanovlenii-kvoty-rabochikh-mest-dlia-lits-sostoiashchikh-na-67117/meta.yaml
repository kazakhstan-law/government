act_code: '67117'
requisite: Постановление акимата Сарыкольского района Костанайской области от 12 июля 2012 года № 244. Зарегистрировано Департаментом юстиции Костанайской области 16 августа 2012 года № 9-17-142. Утратило силу постановлением акимата Сарыкольского района Костанайской области от 10 февраля 2016 года № 33
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и для несовершеннолетних выпускников интернатных организаций в Сарыкольском районе
  kaz: Сарыкөл ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

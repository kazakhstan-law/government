act_code: '63766'
requisite: Постановление акимата Костанайской области от 27 января 2012 года № 47. Зарегистрировано Департаментом юстиции Костанайской области 29 февраля 2012 года № 3795. Утратило силу постановлением акимата Костанайской области от 28 апреля 2022 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

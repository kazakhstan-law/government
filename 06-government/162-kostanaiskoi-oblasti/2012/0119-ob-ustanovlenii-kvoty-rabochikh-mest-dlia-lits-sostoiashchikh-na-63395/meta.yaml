act_code: '63395'
requisite: Постановление акимата Аулиекольского района Костанайской области от 19 января 2012 года № 41. Зарегистрировано Управлением юстиции Аулиекольского района Костанайской области 15 февраля 2012 года № 9-7-153. Утратило силу постановлением акимата Аулиекольского района Костанайской области от 26 мая 2016 года № 118
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы, и для несовершеннолетних выпускников интернатных организаций в Аулиекольском районе
  kaz: Әулиекөл ауданында қылмыстық-атқару инспекциясының пробация қызметінің есебінде тұрған тұлғаларға, сондай-ақ бостандықтан айыру орнынан шыққан тұлғаларға және интернаттық ұйымдардың кәмелетке толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы

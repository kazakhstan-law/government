act_code: '65783'
requisite: Постановление акимата Костанайской области от 8 мая 2012 года № 216. Зарегистрировано Департаментом юстиции Костанайской области 29 мая 2012 года № 3807. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол в пределах Кызыл-Жарского водохранилища на земельном участке, предназначенном для выращивания овощей, государственного коммунального казенного предприятия "Станция юных натуралистов" отдела образования акимата города Лисаковска", режима и особых условий их хозяйственного использования
  kaz: '"Лисаков қаласы әкімдігі білім бөлімінің "Жас табиғат зерттеушілер станциясы" мемлекеттік коммуналдық қазыналық кәсіпорнының көкөністерді өсіруге арналған Қызыл-Жар су қоймасы шегіндегі жер учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруақорлықпен пайдаланудың ерекше жағдайларын және режимін белгілеу туралы'

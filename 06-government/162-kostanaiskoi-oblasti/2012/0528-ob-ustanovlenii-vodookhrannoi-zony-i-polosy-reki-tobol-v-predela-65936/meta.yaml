act_code: '65936'
requisite: Постановление акимата Костанайской области от 28 мая 2012 года № 253. Зарегистрировано Департаментом юстиции Костанайской области 8 июня 2012 года № 3811. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол в пределах Каратомарского водохранилища на земельных участках, предназначенных под строительство девяти индивидуальных жилых домов в селе Береговое района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданының Береговой ауылындағы тоғыз жеке тұрғын үйдің құрылысына арналған жер учаскелерінде Қаратомар су қоймасы шегінде Тобыл өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдалану режимі мен ерекше жағдайларын белгілеу туралы

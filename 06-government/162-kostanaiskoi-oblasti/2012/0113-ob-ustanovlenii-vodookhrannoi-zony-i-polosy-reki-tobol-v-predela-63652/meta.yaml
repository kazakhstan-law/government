act_code: '63652'
requisite: Постановление акимата Костанайской области от 13 января 2012 года № 12. Зарегистрировано Департаментом юстиции Костанайской области 22 февраля 2012 года № 3794. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол в пределах КызылЖарского водохранилища для земельного участка под обслуживание и эксплуатацию гостиничного комплекса, принадлежащего товариществу с ограниченной ответственностью "Алина", расположенного в городе Лисаковск, режима и особых условий их хозяйственного использования
  kaz: Лисаков қаласында орналасқан "Алина" жаупкершілігі шектеулі серіктестігіне жататын қонақ үй кешенін пайдалануға және қызмет көрсетуге арналған жер телімдері үшін Қызыл-Жар су қоймасы шегінде Тобыл өзенінің су қоймасы шегінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруақорлықпен пайдаланудың ерекше жағдайларын және режимін белгілеу туралы

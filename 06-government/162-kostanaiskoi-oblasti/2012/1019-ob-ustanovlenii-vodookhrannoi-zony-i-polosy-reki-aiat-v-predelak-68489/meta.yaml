act_code: '68489'
requisite: Постановление акимата Костанайской области от 19 октября 2012 года № 463. Зарегистрировано Департаментом юстиции Костанайской области 12 ноября 2012 года № 3882. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Аят в пределах производственных площадок акционерного общества «Север Птица», расположенных на землях Майского сельского округа района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданы Май ауылдық округінің жерлерінде орналасқан «Север Птица» акционерлік қоғамының өндірістік алаңдары шегінде Аят өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

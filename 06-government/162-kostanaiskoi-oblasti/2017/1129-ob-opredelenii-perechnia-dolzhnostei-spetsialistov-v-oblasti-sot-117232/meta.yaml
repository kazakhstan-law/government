act_code: '117232'
requisite: Постановление акимата Сарыкольского района Костанайской области от 29 ноября 2017 года № 316. Зарегистрировано Департаментом юстиции Костанайской области 26 декабря 2017 года № 7421. Утратило силу постановлением акимата Сарыкольского района Костанайской области от 26 июня 2018 года № 175
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, для которых за счет средств районного бюджета устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Аудандық бюджет қаражаты есебінен қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгіленетін азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

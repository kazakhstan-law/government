act_code: '110500'
requisite: Постановление акимата Карасуского района Костанайской области от 17 февраля 2017 года № 35. Зарегистрировано Департаментом юстиции Костанайской области 15 марта 2017 года № 6909. Утратило силу постановлением акимата Карасуского района Костанайской области от 25 января 2018 года № 16
title:
  rus: О корректировании средней урожайности (продуктивности), приведенных в нормативных карточках, а также цен, представляемых органами статистики для исчисления доходов от личного подсобного хозяйства при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда нормативтік карточкаларда келтірілген орташа түсімді (өнімділікті), сондай-ақ жеке қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды  түзету туралы

  title:
    rus: О внесении изменения в постановление акимата от 7 августа 2017 года № 390 «Об утверждении регламента государственной услуги «Выдача направления детям с ограниченными возможностями в специальные коррекционные и другие организации для получения медицинских, специальных образовательных и специальных социальных услуг»
    kaz: Әкімдіктің 2017 жылғы 7 тамыздағы № 390 «Кемтар балаларға арнаулы түзеу ұйымдары мен басқа да ұйымдарға медициналық, арнаулы бiлiм және арнаулы әлеуметтiк қызметтердi алуы үшiн жолдама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

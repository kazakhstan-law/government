act_code: '115116'
requisite: Постановление акимата города Рудного Костанайской области от 12 сентября 2017 года № 1170. Зарегистрировано Департаментом юстиции Костанайской области 3 октября 2017 года № 7241. Утратило силу постановлением акимата города Рудного Костанайской области от 20 мая 2020 года № 394 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении публичного сервитута государственному учреждению «Управление строительства акимата Костанайской области» на земельный участок для строительства газорегуляторного пункта по объекту «Газоснабжение зданий птицефабрики»
  kaz: «Қостанай облысы әкімдігінің құрылыс басқармасы» мемлекеттік мекемесіне «Құс фабрикасы ғимараттарын газбен жабдықтау» объектісі бойынша газ реттеу пунктін салу үшін жер учаскесіне қауымдық сервитутын белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Карабалыкского района от 14 февраля 2017 года № 67 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2017 год»
    kaz: Қарабалық ауданы әкімдігінің 2017 жылғы 14 ақпандағы № 67 «2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата – ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Костанайской области от 28 августа 2017 года № 426. Зарегистрировано Департаментом юстиции Костанайской области 6 октября 2017 года № 7244. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Карасу на территории земельного участка товарищества с ограниченной ответственностью «Люблинка» в селе Люблинка Люблинского сельского округа Карасуского района, режима и особых условий их хозяйственного использования
  kaz: Қарасу ауданы Люблинский ауылдық округінің Люблинка ауылындағы «Люблинка» жауапкершілігі шектеулі серіктестігінің жер учаскесі аумағында Қарасу өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

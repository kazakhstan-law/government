requisite: Постановление акимата Костанайской области от 27 ноября 2017 года № 594. Зарегистрировано Департаментом юстиции Костанайской области 13 декабря 2017 года № 7371. Утратило силу постановлением акимата Костанайской области от 24 января 2020 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения конкурса по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки, расходы которых подлежат субсидированию за счет бюджетов соответствующих приграничных субъектов государств  Сторон
  kaz: Шығыстары Тараптар мемлекеттерінің тиісті шекара маңы субъектілерінің бюджеті есебінен субсидиялауға жататын теміржол жолаушылар тасымалын жүзеге асыратын тасымалдаушыларды айқындау бойынша конкурс өткізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Аулиекольского района от 7 июня 2017 года № 165 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в Аулиекольском районе на 2017 год»
    kaz: Әулиекөл ауданы әкімдігінің 2017 жылғы 7 маусымдағы № 165 «2017 жылғы Әулиекөл ауданында мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата – ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

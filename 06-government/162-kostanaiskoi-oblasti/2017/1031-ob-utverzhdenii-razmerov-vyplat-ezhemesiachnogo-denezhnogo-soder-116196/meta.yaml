  requisite: Постановление акимата Костанайской области от 26 июля 2024 года № 297. Зарегистрировано в Департаменте юстиции Костанайской области 30 июля 2024 года № 10244-10. Утратило силу постановлением акимата Костанайской области от 8 сентября 2025 года № 252 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Костанайской области от 31 октября 2017 года № 532 «Об утверждении размеров выплат ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд»
    kaz: Қостанай облысы әкімдігінің 2017 жылғы 31 қазандағы № 532 «Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерлерін бекіту туралы» қаулысына өзгеріс енгізу туралы

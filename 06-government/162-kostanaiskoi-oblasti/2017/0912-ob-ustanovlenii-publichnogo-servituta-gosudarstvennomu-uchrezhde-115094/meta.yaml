title:
  rus: Об установлении публичного сервитута государственному учреждению «Управление строительства акимата Костанайской области» на земельный участок для строительства газопровода по объекту «Газоснабжение зданий птицефабрики»
  kaz: «Қостанай облысы әкімдігінің құрылыс басқармасы» мемлекеттік мекемесіне «Құс фабрикасы ғимараттарын газбен жабдықтау» объектісі бойынша газ құбырын салу үшін жер учаскесіне қауымдық сервитутын белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата от 10 мая 2017 года № 578 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для всех кандидатов для встреч с избирателями»
    kaz: Әкімдіктің 2017 жылғы 10 мамырдағы № 578 «Үгіттік баспа материалдарын орналастыруға арналған орындарды белгілеу және сайлаушылармен кездесуі үшін барлық кандидаттарға үй-жайлар ұсыну туралы» қаулысына өзгерістер енгізу туралы

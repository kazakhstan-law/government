title:
  rus: Об утверждении государственного образовательного заказа на подготовку кадров с высшим и послевузовским образованием за счет средств местного бюджета на 2021–2022 учебный год по Костанайской области
  kaz: Қостанай облысы бойынша 2021–2022 оқу жылына арналған жергілікті бюджет қаражаты есебінен жоғары және жоғары оқу орнынан кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын бекіту туралы

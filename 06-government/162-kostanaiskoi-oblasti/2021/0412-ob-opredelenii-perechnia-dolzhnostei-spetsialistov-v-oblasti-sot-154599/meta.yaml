  title:
    rus: О внесении изменений в постановление акимата Узункольского района от 12 апреля 2021 года № 47 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ұзынкөл ауданы әкімдігінің 2021 жылғы 12 сәуірдегі № 47 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы

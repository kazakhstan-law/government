  title:
    rus: Об отмене постановления акимата района Беимбета Майлина от 17 октября 2024 года № 253 «О внесении изменения в постановление акимата района Беимбета Майлина от 2 августа 2021 года № 166 «Об определении и утверждении мест размещения нестационарных торговых объектов в районе Беимбета Майлина»
    kaz: «Бейімбет Майлин ауданында стационарлық емес сауда объектілерін орналастыру орындарын белгілеу және бекіту туралы» Бейімбет Майлин ауданы әкімдігінің 2021 жылғы 2 тамыздағы № 166 қаулысына өзгеріс енгізу туралы» Бейімбет Майлин ауданы әкімдігінің 2024 жылғы 17 қазандағы № 253 қаулысын жою туралы

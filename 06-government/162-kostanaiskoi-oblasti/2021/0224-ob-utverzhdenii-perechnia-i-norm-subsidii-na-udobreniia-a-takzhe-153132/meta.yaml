  title:
    rus: О внесении изменения в постановление акимата от 24 февраля 2021 года № 88 «Об утверждении перечня и норм субсидий на удобрения, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2021 год»
    kaz: Әкімдіктің 2021 жылғы 24 ақпандағы № 88 «2021 жылға арналған тыңайтқыштарға субсидиялардың тізбесі мен нормаларын, сондай-ақ тыңайтқыштарды (органикалықтарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

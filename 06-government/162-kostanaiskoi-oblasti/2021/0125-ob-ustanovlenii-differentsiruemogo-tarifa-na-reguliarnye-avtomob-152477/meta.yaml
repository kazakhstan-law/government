  title:
    rus: О внесении изменения в постановление акимата города Костаная Костанайской области от 25 января 2021 года № 105 «Об установлении дифференцируемого тарифа на регулярные автомобильные перевозки пассажиров и багажа в городских и пригородных сообщениях города Костаная»
    kaz: Қостанай облысы Қостанай қаласы әкімдігінің 2021 жылғы 25 қаңтардағы № 105 «Қостанай қаласының қалалық және қала маңындағы қатынастарында жолаушылар мен багажды автомобильмен тұрақты тасымалдауға сараланатын тарифті белгілеу туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Наурзумского района от 5 февраля 2021 года № 43 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Науырзым ауданы әкімдігінің 2021 жылғы 5 ақпандағы № 43 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы

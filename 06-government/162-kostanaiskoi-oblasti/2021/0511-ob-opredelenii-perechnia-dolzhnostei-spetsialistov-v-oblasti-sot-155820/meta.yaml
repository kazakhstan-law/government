  title:
    rus: О внесении изменений в постановление акимата Амангельдинского района от 11 мая 2021 года № 93 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Амангелді ауданы әкімдігінің 2021 жылғы 11 мамырдағы № 93 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

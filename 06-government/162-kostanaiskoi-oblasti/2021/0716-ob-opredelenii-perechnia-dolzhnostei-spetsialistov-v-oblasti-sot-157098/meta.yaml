  title:
    rus: О внесении изменений в постановление акимата Федоровского района от 16 июля 2021 года № 198 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Федоров ауданы әкімдігінің 2021 жылғы 16 шілдедегі № 198 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

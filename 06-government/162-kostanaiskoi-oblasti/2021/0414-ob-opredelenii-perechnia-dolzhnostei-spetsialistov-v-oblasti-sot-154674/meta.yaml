  title:
    rus: О внесении изменений в постановление акимата Камыстинского района от 14 апреля 2021 года № 55 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Қамысты ауданы әкімдігінің 2021 жылғы 14 сәуірдегі № 55 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

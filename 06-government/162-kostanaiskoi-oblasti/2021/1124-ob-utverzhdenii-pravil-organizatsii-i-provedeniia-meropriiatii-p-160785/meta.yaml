requisite: Постановление акимата города Костанай Костанайской области от 24 ноября 2021 года № 2586. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 ноября 2021 года № 25438
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Костанай
  kaz: Қостанай қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата города Костаная от 24 ноября 2021 года № 2586 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Костанай»
    kaz: «Қостанай қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Қостанай қаласы әкімдігінің 2021 жылғы 24 қарашадағы № 2586 қаулысына өзгерістер енгізу туралы

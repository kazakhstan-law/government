  title:
    rus: О внесении изменения в постановление акимата города Рудного от 28 декабря 2021 года № 1618 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Рудный, поселкам Качар, Горняцкий»
    kaz: «Рудный қаласына, Қашар, Горняцк кенттеріне бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Рудный қаласы әкімдігінің 2021 жылғы 28 желтоқсандағы № 1618 қаулысына өзгеріс енгізу туралы»

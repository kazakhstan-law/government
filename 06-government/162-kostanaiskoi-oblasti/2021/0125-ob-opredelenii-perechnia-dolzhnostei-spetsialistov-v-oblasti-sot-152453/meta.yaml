  title:
    rus: О внесении изменений в постановление акимата Житикаринского района Костанайской области от 25 января 2021 года № 17 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Қостанай облысы Жітіқара ауданы әкімдігінің 2021 жылғы 25 қаңтардағы № 17 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы

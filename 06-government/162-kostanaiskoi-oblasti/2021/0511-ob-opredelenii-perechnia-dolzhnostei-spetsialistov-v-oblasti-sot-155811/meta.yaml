  title:
    rus: О внесении изменений в постановление акимата Денисовского района Костанайской области от 11 мая 2021 года № 98 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Қостанай облысы Денисов ауданының әкімдігінің 2021 жылғы 11 мамырдағы № 98 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы

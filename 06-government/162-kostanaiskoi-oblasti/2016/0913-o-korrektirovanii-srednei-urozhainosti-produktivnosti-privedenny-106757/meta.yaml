requisite: Постановление акимата Джангельдинского района Костанайской области от 13 сентября 2016 года № 97. Зарегистрировано Департаментом юстиции Костанайской области 6 октября 2016 года № 6635. Утратило силу постановлением акимата Джангельдинского района Костанайской области от 2 февраля 2018 года № 11
title:
  rus: О корректировании средней урожайности (продуктивности), приведенных в нормативных карточках, а также цен, представляемых органами статистики для исчисления доходов от личного подсобного хозяйства при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдем ақылар тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікті), сондай-ақ жеке қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

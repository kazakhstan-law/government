act_code: '105450'
requisite: Постановление акимата Костанайской области от 8 июля 2016 года № 328. Зарегистрировано Департаментом юстиции Костанайской области 12 августа 2016 года № 6577. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы озера Зоново для территории магазина промышленных и продовольственных товаров с закусочной быстрого обслуживания, расположенного в селе Боровское  Мендыкаринского района, режима и особых условий их  хозяйственного использования
  kaz: Меңдіқара ауданының Боровской ауылында орналасқан тез қызмет көрсету дәмханасы бар өнеркәсіптік және азық-түлік тауарлары дүкенінің аумағы үшін Зоново көлінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

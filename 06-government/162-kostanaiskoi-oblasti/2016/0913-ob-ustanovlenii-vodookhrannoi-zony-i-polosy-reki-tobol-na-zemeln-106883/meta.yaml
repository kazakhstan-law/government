requisite: Постановление акимата Костанайской области от 13 сентября 2016 года № 421. Зарегистрировано Департаментом юстиции Костанайской области 14 октября 2016 года № 6652. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на земельном участке, предназначенном под горный     отвод Южно-Тохтаровского месторождения окисленных руд, расположенного в Камыстинском сельском округе Камыстинского района, режима и особых условий их хозяйственного использования
  kaz: Қамысты ауданының Қамысты ауылдық округінде орналасқан, Оңтүстік-Тоқтар тотыққан кен орнының тау-кендік бөлуіне арналған жер учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

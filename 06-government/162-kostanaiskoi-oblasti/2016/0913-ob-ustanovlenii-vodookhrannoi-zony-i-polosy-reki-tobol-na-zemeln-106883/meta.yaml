  title:
    rus: О внесении изменений в постановление акимата от 13 сентября 2016 года № 421 «Об установлении водоохранной зоны и полосы реки Тобол на земельном участке, предназначенном под горный отвод Южно-Тохтаровского месторождения окисленных руд, расположенного в Свердловском сельском округе Камыстинского района, режима и особых условий их хозяйственного использования»
    kaz: Әкімдіктің 2016 жылғы 13 қыркүйектегі № 421 «Қамысты ауданының Свердлов ауылдық округінде орналасқан, Оңтүстік-Тоқтар тотыққан кен орнының тау-кендік бөлуіне арналған жер учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы» қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Узункольского района Костанайской области от 17 марта 2016 года № 42. Зарегистрировано Департаментом юстиции Костанайской области 14 апреля 2016 года № 6285. Утратило силу постановлением акимата Узункольского района Костанайской области от 21 июня 2018 года № 115
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақылар мен тарифтік мөлшемелерін кемінде жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

requisite: Постановление акимата Тарановского района Костанайской области от 16 мая 2016 года № 164. Зарегистрировано Департаментом юстиции Костанайской области 16 июня 2016 года № 6469. Утратило силу постановлением акимата Тарановского района Костанайской области от 28 июня 2018 года № 192
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, для которых за счет средств районного бюджета устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін, аудандық бюджет қаражатының есебінен кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылары мен тарифтік мөлшерлемелерін белгіленетін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

requisite: Постановление акимата города Аркалыка Костанайской области от 4 апреля 2016 года № 112. Зарегистрировано Департаментом юстиции Костанайской области 29 апреля 2016 года № 6307. Утратило силу постановлением акимата города Аркалыка Костанайской области от 15 мая 2018 года № 166
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін және лауазымдық айлықақылар мен тарифтік мөлшерлемелерін жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

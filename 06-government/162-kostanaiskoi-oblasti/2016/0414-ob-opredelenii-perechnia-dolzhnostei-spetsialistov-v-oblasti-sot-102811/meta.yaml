requisite: Постановление акимата Карасуского района Костанайской области от 14 апреля 2016 года № 77. Зарегистрировано Департаментом юстиции Костанайской области 19 мая 2016 года № 6382. Утратило силу постановлением акимата Карасуского района Костанайской области от 27 июня 2018 года № 92
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақылары мен тарифтік мөлшерлемелерін кемінде жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

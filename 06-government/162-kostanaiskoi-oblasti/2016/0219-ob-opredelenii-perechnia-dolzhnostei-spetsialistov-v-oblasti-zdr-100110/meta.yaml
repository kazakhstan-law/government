  title:
    rus: О внесении изменений в постановление акимата от 19 февраля 2016 года № 71 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования и культуры, являющихся гражданскими служащими и работающих в сельской местности, для которых за счет средств областного бюджета устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях»
    kaz: Әкімдіктің 2016 жылғы 19 ақпандағы № 71 «Облыстық бюджет қаражаты есебінен қызметтің осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгіленетін, азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

act_code: '102921'
requisite: Постановление акимата Мендыкаринского района Костанайской области от 20 мая 2016 года № 85
title:
  rus: Об утрате силы постановления акимата от 19 ноября 2012 года № 334 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций"
  kaz: Әкімдіктің 2012 жылғы 19 қарашадағы № 334 "Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатлыған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квоты белгілеу туралы" қаулысының күшін жою туралы

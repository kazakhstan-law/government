    kaz: Қостанай облысы әкімдігінің 2016 жылғы 5 қыркүйектегі № 418 «Қостанай облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

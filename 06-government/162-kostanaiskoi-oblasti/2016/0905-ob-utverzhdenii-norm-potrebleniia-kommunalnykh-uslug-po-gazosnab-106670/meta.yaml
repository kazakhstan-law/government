  kaz: Қостанай облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы

title:
  rus: Об утверждении норматива субсидий, а также критериев и требований по направлению субсидирования возмещения до 100% затрат по искусственному осеменению маточного поголовья крупного рогатого скота в крестьянских (фермерских), личных подсобных хозяйствах и производственных кооперативах
  kaz: Шаруа (фермерлік), жеке қосалқы шаруашылықтарда  және өндірістік кооперативтерде ірі қара малдың  аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100%-ға дейін өтеуді субсидиялау бағыты бойынша субсидиялар нормативін, сондай-ақ өлшемдері мен талаптарын бекіту туралы

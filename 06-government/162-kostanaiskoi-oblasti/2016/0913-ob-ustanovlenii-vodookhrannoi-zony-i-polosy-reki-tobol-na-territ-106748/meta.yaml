requisite: Постановление акимата Костанайской области от 13 сентября 2016 года № 420. Зарегистрировано Департаментом юстиции Костанайской области 10 октября 2016 года № 6641. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на территории земельного участка товарищества с ограниченной ответственностью «Аэлита-2014», выделенного для строительства и организации объектов базы отдыха в Калининском сельском округе района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданының Калинин ауылдық округіндегі демалу базасы объектілерін салу және ұйымдастыру үшін бөлінген «Аэлита-2014» жауапкершілігі шектеулі серіктестігі жер учаскесі аумағында Тобыл өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

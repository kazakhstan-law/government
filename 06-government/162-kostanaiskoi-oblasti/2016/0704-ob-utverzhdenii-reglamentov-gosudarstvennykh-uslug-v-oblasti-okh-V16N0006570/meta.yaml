  title:
    rus: О внесении изменений в некоторые постановления акимата об утверждении регламентов государственных услуг в сфере природных ресурсов и регулирования природопользования
    kaz: Табиғи ресурстар және табиғат пайдалануды реттеу саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы әкімдіктің кейбір қаулыларына өзгерістер енгізу туралы

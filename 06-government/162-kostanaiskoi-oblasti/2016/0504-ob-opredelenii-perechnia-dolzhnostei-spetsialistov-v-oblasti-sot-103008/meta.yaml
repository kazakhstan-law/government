title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

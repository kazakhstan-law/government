  title:
    rus: О внесении изменений в постановление акимата Карабалыкского района от 4 мая 2016 года № 91 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки»
    kaz: Қарабалық ауданы әкімдігінің 2016 жылғы 4 мамырдағы № 91 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақылар мен тарифтік мөлшемелерін кемінде жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209593/rus

requisite: Постановление акимата Костанайской области от 19 февраля 2016 года № 71. Зарегистрировано Департаментом юстиции Костанайской области 11 марта 2016 года № 6206. Утратило силу постановлением акимата Костанайской области от 5 июня 2026 года № 155 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности, для которых за счет средств областного бюджета устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Облыстық бюджет қаражаты есебінен қызметтің осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгіленетін, азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы

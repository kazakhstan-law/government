act_code: '104726'
requisite: Постановление акимата Федоровского района Костанайской области от 21 июня 2016 года № 189. Зарегистрировано Департаментом юстиции Костанайской области 14 июля 2016 года № 6543. Утратило силу постановлением акимата Федоровского района Костанайской области от 3 января 2019 года № 356 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

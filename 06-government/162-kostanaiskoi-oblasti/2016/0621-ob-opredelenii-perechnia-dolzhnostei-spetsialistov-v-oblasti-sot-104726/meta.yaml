  title:
    rus: О внесении дополнений в постановление акимата Федоровского района от 21 июня 2016 года № 189 «Об определении перечня должностей специалистов в области  социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся  гражданскими служащими и работающих  в сельской  местности»
    kaz: Федоров ауданы әкімдігінің 2016 жылғы 21 маусымдағы № 189 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына толықтырулар енгізу туралы

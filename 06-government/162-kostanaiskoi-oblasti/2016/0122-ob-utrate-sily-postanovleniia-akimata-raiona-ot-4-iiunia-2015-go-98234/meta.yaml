act_code: '98234'
requisite: Постановление акимата Тарановского района Костанайской области от 22 января 2016 года № 21
title:
  rus: Об утрате силы постановления акимата района от 4 июня 2015 года № 162 "Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, для которых за счет средств районного бюджета устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки"
  kaz: Аудан әкімдігінің 2015 жылғы 4 маусымдағы № 162 "Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін, аудандық бюджет қаражатының есебінен кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгіленетін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы" қаулысының күшін жою туралы

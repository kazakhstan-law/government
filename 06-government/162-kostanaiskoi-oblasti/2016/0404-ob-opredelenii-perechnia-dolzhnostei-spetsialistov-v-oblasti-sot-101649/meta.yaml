requisite: Постановление акимата Житикаринского района Костанайской области от 4 апреля 2016 года № 93. Зарегистрировано Департаментом юстиции Костанайской области 26 апреля 2016 года № 6300. Утратило силу постановлением акимата Житикаринского района Костанайской области от 9 апреля 2018 года № 88
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

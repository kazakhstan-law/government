act_code: '102405'
requisite: Постановление акимата Алтынсаринского района Костанайской области от 21 апреля 2016 года № 65. Зарегистрировано Департаментом юстиции Костанайской области 18 мая 2016 года № 6381. Утратило силу постановлением акимата Алтынсаринского района Костанайской области от 18 апреля 2019 года № 49 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақылар мен тарифтік мөлшерлемелерің кешінде жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

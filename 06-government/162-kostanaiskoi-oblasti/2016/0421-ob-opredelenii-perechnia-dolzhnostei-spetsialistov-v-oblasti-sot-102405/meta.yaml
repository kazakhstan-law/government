  title:
    rus: О внесении дополнений в постановление акимата района от 21 апреля 2016 года № 65 «Об определении перечня должностей специалистов в области социального обеспечения, образования,  культуры, спорта и ветеринарии являющихся гражданскими служащими и  работающих в сельской местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки за счет средств районного бюджета»
    kaz: Аудан әкімдігінің 2016 жылғы 21 сәуірдегі № 65 «Аудандық бюджет қаражаты есебінен азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақылар мен тарифтік мөлшерлемелерің кешінде жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/112918/rus

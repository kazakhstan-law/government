requisite: Постановление акимата Амангельдинского района Костанайской области от 3 июня 2016 года № 143. Зарегистрировано Департаментом юстиции Костанайской области 1 июля 2016 года № 6519. Утратило силу постановлением акимата Амангельдинского района Костанайской области от 12 февраля 2018 года № 14
title:
  rus: О корректировании средней урожайности (продуктивности), приведенных в нормативных карточках, а так же цен, представляемых органами статистики для исчисления доходов от личного подсобного хозяйства при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларга арналған ай сайынғы мемлекеттік жәрдем ақылар тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікті), сондай-ақ жеке қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

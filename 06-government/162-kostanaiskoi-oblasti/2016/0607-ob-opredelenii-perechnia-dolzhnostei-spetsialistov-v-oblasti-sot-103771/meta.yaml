  title:
    rus: О внесении изменений в постановление акимата Костанайского района от 7 июня 2016 года № 303 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта, ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Қостанай ауданы әкімдігінің 2016 жылғы 7 маусымдағы № 303 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

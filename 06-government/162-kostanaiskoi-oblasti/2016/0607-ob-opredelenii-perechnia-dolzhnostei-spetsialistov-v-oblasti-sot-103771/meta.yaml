  title:
    rus: О внесении изменений в постановление акимата Костанайского района Костанайской области от 7 июня 2016 года № 303 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Қостанай облысы Қостанай ауданы әкімдігінің «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» 2016 жылғы 7 маусымдағы № 303 қаулысына өзгерістер енгізу туралы

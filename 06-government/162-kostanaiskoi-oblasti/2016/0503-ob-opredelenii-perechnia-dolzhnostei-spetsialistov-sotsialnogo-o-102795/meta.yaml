    kaz: Денисов ауданы әкімдігінің 2016 жылғы 3 мамырдағы № 129 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін анықтау туралы» қаулысына толықтырулар енгізу туралы

act_code: '108014'
requisite: Постановление акимата Наурзумского района Костанайской области от 11 ноября 2016 года № 226. Зарегистрировано Департаментом юстиции Костанайской области 7 декабря 2016 года № 6723
title:
  rus: Об определении сроков представления заявки на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2016 год
  kaz: 2016 жылға арналған басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдарының және көктемгі егіс пен егін жинау жұмыстарын жүргізуге үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнына және ауыл шаруашылығы дақылдарын қорғалған топырақта өндеп өсіру шығындарының құнына субсидиялар алуға арналған өтінімді ұсыну мерзімдерін айқындау туралы

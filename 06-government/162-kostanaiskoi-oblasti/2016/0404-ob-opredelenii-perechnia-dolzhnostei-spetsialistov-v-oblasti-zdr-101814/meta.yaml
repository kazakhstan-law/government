  title:
    rus: О внесении изменения в постановление акимата Камыстинского района от 4 апреля 2016 года № 51 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Қамысты ауданы әкімдігінің 2016 жылғы 4 сәуірдегі № 51 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

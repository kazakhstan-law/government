  title:
    rus: О внесении изменения и дополнения в постановление акимата Аулиекольского района от 1 апреля 2016 года № 67 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих  в сельской местности»
    kaz: Әулиекөл ауданы әкімдігінің 2016 жылғы 1 сәуірдегі № 67 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс пен толықтыру енгізу туралы

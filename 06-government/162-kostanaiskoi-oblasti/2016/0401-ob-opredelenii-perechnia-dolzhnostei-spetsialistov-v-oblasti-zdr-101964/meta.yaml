caused_by:
  code: '122578'
  requisite: Постановление акимата Аулиекольского района Костанайской области от 23 мая 2018 года № 93. Зарегистрировано Департаментом юстиции Костанайской области 14 июня 2018 года № 7843. Утратило силу постановлением акимата Аулиекольского района Костанайской области от 30 ноября 2020 года № 201 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Аулиекольского района от 1 апреля 2016 года № 67 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки»
    kaz: Әулиекөл ауданы әкімдігінің 2016 жылғы 1 сәуірдегі № 67 «Кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер алуға құқығы бар азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/122578/rus

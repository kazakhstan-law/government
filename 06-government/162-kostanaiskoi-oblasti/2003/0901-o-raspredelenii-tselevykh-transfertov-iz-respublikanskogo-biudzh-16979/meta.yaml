requisite: Постановление акимата Костанайской области от 2 сентября 2003 года № 207. Зарегистрировано Управлением юстиции Костанайской области 10 сентября 2003 года № 2475. Утратило силу в связи с истечением срока действия (письмо руководителя аппарата акима Костанайской области от 21 декабря 2004 года № 08-5/2586)
title:

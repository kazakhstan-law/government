title:
  rus: 'Об утверждении Правил оказания социальной помощи: на оздоровление детей в профилакториях и летних лагерях отдыха и семьям, имеющим детей школьного возраста к началу учебного года'
  kaz: Профилакторияларда және жазғы демалыс лагерьлерінде балаларды сауықтыру үшін, оқу жылының басында мектеп жасындағы балалары бар отбасыларға әлеуметтік көмек көрсету ережелерін бекіту туралы

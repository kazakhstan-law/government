  kaz: 'Төмендегі ережелерді бекіту туралы: Ұлы Отан соғысы қатысушылары мен мүгедектеріне әлеуметтік көмекті тағайындау және төлеу, мемлекеттік мерекелерге және жалпықалалық көпшілік іс-шараларға әлеуметтік көмекті төлеу және жұмыс істеген азаматтарды жерлеу үшін әлеуметтік көмек көрсету'

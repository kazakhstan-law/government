title:
  rus: О распределении трансфертов из областного бюджета на 2004 год на организацию общественных работ, социальных рабочих мест для безработных граждан и на оказание государственной адресной социальной помощи малообеспеченным гражданам
  kaz: Қоғамдық жұмыстарды, жұмыссыз азаматтарға әлеуметтік жұмыс орындарын ұйымдастыру және аз қамтылған азаматтарға мемлекеттік атаулы әлеуметтік көмек көрсету үшін 2004 жылға арналған облыстық бюджеттен трансферттер бөлу туралы

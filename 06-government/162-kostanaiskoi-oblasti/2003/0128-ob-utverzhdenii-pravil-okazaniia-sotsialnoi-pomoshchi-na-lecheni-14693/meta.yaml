requisite: Постановление акимата города Рудного Костанайской области от 28 января 2003 года № 22. Зарегистрировано Управлением юстиции Костанайской области 17 февраля 2003 года № 2032. Утратило силу постановлением акимата города Рудного Костанайской области от 21 декабря 2004 года № 866
title:
  rus: 'Об утверждении Правил оказания социальной помощи: на лечение в стационаре, обследование в медицинских учреждениях малообеспеченным гражданам, инвалидам и пенсионерам, малообеспеченным семьям для аренды дачного участка на летний сезон, приобретение семенного материала и проезда на дачные участки и малообеспеченным гражданам, инвалидам и пенсионерам'
  kaz: Аз қамтылған азаматтар, мүгедектер және зейнеткерлер стационарда емделуі, медициналық мекемелерде тексерілуі үшiн; жазғы маусымда саябақ учаскесін жалға алғанына төлеу үшін және тұқым алу мен саябақ учаскелеріне көлікпен жүру үшін аз қамтылған  отбасыларына, аз қамтылған азаматтарға, мүгедектерге және зейнеткерлерге әлеуметтік көмек көрсету ережелерін бекіту туралы

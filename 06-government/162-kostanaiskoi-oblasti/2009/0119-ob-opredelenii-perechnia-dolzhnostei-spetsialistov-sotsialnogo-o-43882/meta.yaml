requisite: Постановление акимата Узункольского района Костанайской области от 19 января 2009 года № 19. Зарегистрировано Управлением юстиции Узункольского района Костанайской области 27 января 2009 года № 9-19-90. Утратило силу постановлением акимата Узункольского района Костанайской области от 11 мая 2014 года № 85

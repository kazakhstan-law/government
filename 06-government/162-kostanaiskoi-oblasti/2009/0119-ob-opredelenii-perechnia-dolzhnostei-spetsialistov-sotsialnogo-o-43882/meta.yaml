  requisite: Постановление акимата Узункольского района Костанайской области от 22 декабря 2010 года № 365. Зарегистрировано Управлением юстиции Узункольского района Костанайской области 20 января 2011 года № 9-19-144. Утратило силу постановлением акимата Узункольского района Костанайской области от 11 мая 2014 года № 85
  title:
    rus: О внесении дополнений в постановление акимата от 19 января 2009 года № 19 "Об определении перечня должностей гражданских служащих социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышение не менее чем на двадцать пять процентов  должностные оклады и тарифные ставки за счет средств районного бюджета"
    kaz: '"Аудандық бюджет қаражаты есебінен кемінде жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет саласының азаматтық қызметшілер лауазымдарының тізбесін анықтауы туралы" әкімдіктің 2009 жылғы 19 қаңтардағы № 19 қаулысына толықтыруларды енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/56948/rus

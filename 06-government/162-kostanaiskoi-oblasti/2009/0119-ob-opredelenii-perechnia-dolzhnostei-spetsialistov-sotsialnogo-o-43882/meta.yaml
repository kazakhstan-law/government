title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающих в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін, әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесін анықтау туралы

requisite: Қостанай облысы Меңдіқара ауданы әкімдігінің 2009 жылғы 9 сәуірдегі № 102 қаулысы. Қостанай облысы Меңдіқара ауданының Әділет басқармасында 2009 жылы 13 сәуірде № 9-15-107 тіркелді

requisite: Постановление акимата Карабалыкского района Костанайской области от 13 мая 2009 года № 140. Зарегистрировано Управлением юстиции Карабалыкского района Костанайской области 13 мая 2009 года № 9-12-113. Утратило силу в связи с истечением срока применения (письмо руководителя аппарата акима Карабалыкского района Костанайской области от 2 мая 2013 года № 05-10/468)
title:

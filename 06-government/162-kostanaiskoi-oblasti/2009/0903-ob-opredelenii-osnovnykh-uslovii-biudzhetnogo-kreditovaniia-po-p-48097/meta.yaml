  title:
    rus: О внесении изменения в постановление акимата от 3 сентября 2009 года № 322 "Об определении основных условий бюджетного кредитования по программе "Кредитование дочерних организаций акционерного общества Национального управляющего холдинга "КазАгро" для финансирования малого и среднего бизнеса и микрокредитования сельского населения"
    kaz: Әкімдіктің 2009 жылғы 3 қыркүйектегі № 322 "Шағын және орта бизнесті қаржыландыру және ауыл тұрғындарына шағын кредит беру үшін "КазАгро" Ұлттық басқару холдингі" акционерлік қоғамының еншілес ұйымдарына кредит беру" бағдарламасы бойынша бюджеттік кредит берудін негізгі талаптарын белгілеу туралы" қаулысына өзгеріс енгізу туралы

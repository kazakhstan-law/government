act_code: '48097'
requisite: Постановление акимата Костанайской области от 3 сентября 2009 года № 322. Зарегистрировано Департаментом юстиции Костанайской области 6 октября 2009 года № 3694. Утратило силу постановлением акимата Костанайской области от 23 сентября 2016 года № 442
title:
  rus: Об определении основных условий бюджетного кредитования по программе "Кредитование дочерних организаций акционерного общества Национального управляющего холдинга "КазАгро" для финансирования малого и среднего бизнеса и микрокредитования сельского населения"
  kaz: '"Шағын және орта бизнесті қаржыландыру және ауыл тұрғындарына шағын кредит беру үшін "КазАгро" Ұлттық басқару холдингі" акционерлік қоғамының еншілес ұйымдарына кредит беру" бағдарламасы бойынша бюджеттік кредит беру негізгі талаптарын белгілеу туралы'

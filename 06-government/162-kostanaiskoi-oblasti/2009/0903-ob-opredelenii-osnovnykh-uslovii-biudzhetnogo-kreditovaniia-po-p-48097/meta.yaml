  title:
    rus: О внесении изменений в постановление акимата от 3 сентября 2009 года № 322 "Об определении основных условий бюджетного кредитования по программе "Кредитование дочерних организаций акционерного общества Национального управляющего холдинга "КазАгро" для финансирования малого и среднего бизнеса и микрокредитования сельских населения"
    kaz: '"Шағын және орта бизнесті қаржыландыру және ауыл тұрғындарына шағын кредит беру үшін "КазАгро" Ұлттық басқару холдингі" акционерлік қоғамының еншілес ұйымдарына кредит беру" бағдарламасы бойынша бюджеттік кредит беру негізгі талаптарын белгілеу туралы" әкімдіктің 2009 жылғы 3 қыркүйектегі № 322 қаулысына өзгерістер енгізу туралы'

  title:
    rus: О внесении изменений в постановление акимата от 23 июня 2009 года № 233 «Об установлении водоохранных зон и полос реки Тобол, Амангельдинского водохранилища и реки Тогузак на участках под строительство объектов, режима и особых условий их хозяйственного использования»
    kaz: Әкімдіктің 2009 жылғы 23 маусымдағы № 233 «Объектілердің құрылысына арналған телімдерде Тобыл өзенінің, Амангелді су қоймасының және Тоғұзақ өзенінің су қорғау аймақтары мен белдеулерін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы» қаулысына өзгерістер енгізу туралы

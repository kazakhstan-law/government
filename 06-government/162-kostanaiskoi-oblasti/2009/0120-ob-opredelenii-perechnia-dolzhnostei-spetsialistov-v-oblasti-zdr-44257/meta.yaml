  title:
    rus: О внесении изменений в постановление акимата от 20 января 2009 года № 45 "Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности, для которых за счет средств областного бюджета устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях"
    kaz: Әкімдіктің 2009 жылғы 20 қаңтардағы № 45 "Облыстық бюджет қаражаты есебінен қызметтің осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және ставкаларымен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк ставкалар белгіленетін, азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы" қаулысына өзгерістер енгізу туралы

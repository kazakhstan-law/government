act_code: '44257'
requisite: Постановление акимата Костанайской области от 20 января 2009 года № 45. Зарегистрировано Департаментом юстиции Костанайской области 19 февраля 2009 года № 3670. Утратило силу постановлением акимата Костанайской области от 19 февраля 2016 года № 71
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования и культуры, являющихся гражданскими служащими и работающих в сельской местности, для которых за счет средств областного бюджета устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Облыстық бюджет қаражаты есебінен қызметтің осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және ставкаларымен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк ставкалар белгіленетін, азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

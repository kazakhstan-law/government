  title:
    rus: О внесении изменения и дополнений в постановление акимата от 20 января 2009 года "Об определении перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности и имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств областного бюджета"
    kaz: '"Облыстық бюджет қаражаты есебінен ауылдық (селолық) жерде жұмыс істейтін және кемінде жиырма бес процент жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандары лауазымдарының тізбесін белгілеу туралы" әкімдіктің 2009 жылғы 20 қантардағы № 45 қаулысына өзгеріс пен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/53376/rus

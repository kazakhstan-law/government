  title:
    rus: О внесении изменений в постановление акимата от 20 января 2009 года № 45 "Об определении перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, для которых устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные  ставки, за счет средств областного бюджета"
    kaz: Әкімдіктің 2009 жылғы 20 қаңтардағы № 45 "Облыстық бюджет қаражаты есебінен ауылдық (селолық) жерде жұмыс істейтін және кемінде жиырма бес процент жоғары лауазымдық  жалақылар мен тарифтік ставкаларды белгіленетін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандары лауазымдарының тізбесін белгілеу туралы" қаулысына өзгерістер енгізу туралы

title:
  rus: О корректировании средней урожайности (продуктивности), среднего уровня производственных расходов, приведенных в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет

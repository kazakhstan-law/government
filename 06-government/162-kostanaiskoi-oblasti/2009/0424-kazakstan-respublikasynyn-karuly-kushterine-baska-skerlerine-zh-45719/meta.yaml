act_code: '45719'
requisite: Қостанай облысы Меңдіқара ауданы әкімдігінің 2009 жылғы 24 сәуірдегі № 141 қаулысы. Қостанай облысы Меңдіқара ауданының Әділет басқармасында 2009 жылғы 8 мамырда № 9-15-111 тіркелді
title:

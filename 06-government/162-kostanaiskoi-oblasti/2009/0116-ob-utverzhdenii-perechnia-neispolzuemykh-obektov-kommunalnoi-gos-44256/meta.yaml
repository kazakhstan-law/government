act_code: '44256'
requisite: Постановление акимата Костанайской области от 16 января 2009 года № 25. Зарегистрировано Департаментом юстиции Костанайской области 18 февраля 2009 года № 3669. Утратило силу в связи с истечением срока применения - письмо акимата Костанайской области от 10 ноября 2010 года № 08-08/3045
title:
  rus: Об утверждении перечня неиспользуемых объектов коммунальной государственной собственности по Костанайской области, подлежащих предоставлению субъектам малого предпринимательства в имущественный наем (аренду) или доверительное управление с правом последующей безвозмездной передачи в собственность в 2009 году
  kaz: 2009 жылы шағын кәсiпкерлiк субъектiлерiне мүліктік жалға алуға (жалға беруге) немесе кейiннен меншiкке өтеусіз беру құқығымен сенiмгерлік басқаруға беруге жататын Қостанай облысы бойынша коммуналдық мемлекеттік меншіктің пайдаланылмайтын объектiлерінің тізбесін бекіту туралы

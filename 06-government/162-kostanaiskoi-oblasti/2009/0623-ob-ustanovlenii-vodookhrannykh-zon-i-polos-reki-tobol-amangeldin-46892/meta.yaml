act_code: '46892'
requisite: Постановление акимата Костанайской области от 23 июня 2009 года № 233. Зарегистрировано Департаментом юстиции Костанайской области 17 июля 2009 года № 3684. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон и полос реки Тобол, Амангельдинского водохранилища и реки Тогузак на участках под строительство объектов, режима и особых условий их хозяйственного использования
  kaz: Объектілердің құрылысына арналған учаскелерде Тобыл өзенінің, Амангелді су қоймасының және Тоғұзақ өзенінің су қорғау аймақтары мен белдеулерін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

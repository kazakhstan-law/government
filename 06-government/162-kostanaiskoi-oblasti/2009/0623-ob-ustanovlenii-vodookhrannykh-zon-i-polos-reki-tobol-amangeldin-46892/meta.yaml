  title:
    rus: О внесении изменений в постановление акимата от 23 июня 2009 года № 233 «Об установлении водоохранных зон и полос реки Тобол, Амангельдинского водохранилища и реки Тогузак на участках под строительство объектов и режима их хозяйственного использования»
    kaz: Әкімдіктің 2009 жылғы 23 маусымдағы № 233 «Объектілердің құрылысына арналған телімдерде Тобыл өзенінің, Амангелді су бөгенінің және Тоғұзақ өзенінің су қорғау аймақтары мен белдеуілерін және оларды шаруақорлықпен пайдалану тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

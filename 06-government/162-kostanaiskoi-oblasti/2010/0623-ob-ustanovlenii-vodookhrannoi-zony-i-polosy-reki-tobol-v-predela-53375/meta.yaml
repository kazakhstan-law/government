act_code: '53375'
requisite: Постановление акимата Костанайской области от 23 июня 2010 года № 235. Зарегистрировано Департаментом юстиции Костанайской области 28 июня 2010 года № 3723. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол в пределах земельных участков товарищества с ограниченной ответственностью «Садчиковское», расположенных в селе Садчиковка Костанайского района, режима и особых условий их хозяйственного использования
  kaz: Қостанай ауданы Садчиков ауылында орналасқан «Садчиковское» жауапкершілігі шектеулі серіктестігі жер учаскелерінің шегіндегі Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

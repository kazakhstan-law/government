requisite: Постановление акимата Алтынсаринского района Костанайской области от 25 января 2010 года № 34. Зарегистрировано Управлением юстиции Алтынсаринского района Костанайской области 4 марта 2010 года № 9-5-103. Утратило силу постановлением акимата Алтынсаринского района Костанайской области от 30 июня 2011 года № 201
title:
  rus: Об определении перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности и имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки за счет бюджетных средств
  kaz: Бюджеттік қаражаты есебінен ауылдық (селолық) жерде жұмыс істейтін және кемінде жиырма бес процент жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандары лауазымдарының тізбесін белгілеу туралы

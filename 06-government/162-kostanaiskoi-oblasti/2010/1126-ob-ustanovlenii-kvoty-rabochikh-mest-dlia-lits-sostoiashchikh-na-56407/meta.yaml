    kaz: Әкімдіктің 2010 жылғы 26 қарашадағы № 2395 "Бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгеріс енгізу туралы

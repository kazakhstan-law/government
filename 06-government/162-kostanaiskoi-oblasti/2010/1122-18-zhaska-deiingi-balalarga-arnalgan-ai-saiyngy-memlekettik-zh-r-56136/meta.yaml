requisite: Қостанай облысы Аманкелді ауданы әкімдігінің 2010 жылғы 22 қарашадағы № 294 қаулысы. Қостанай облысы Аманкелді ауданының Әділет басқармасында 2010 жылғы 21 желтоқсанда № 9-6-118 тіркелді. Күші жойылды - Қостанай облысы Амангелді ауданы әкімдігінің 2015 жылғы 23 желтоқсандағы № 201 қаулысымен

requisite: Постановление акимата Карабалыкского района Костанайской области от 11 мая 2010 года № 187. Зарегистрировано Управлением юстиции Карабалыкского района Костанайской области 3 июня 2010 года № 9-12-140. Утратило силу в связи с истечением срока применения - (письмо руководителя аппарата акима Карабалыкского района Костанайской области от 2 мая 2013 года № 05-10/468)
title:

title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол промышленного комплекса № 1, расположенного на территории промышленной зоны города Лисаковска, режима и особых условий их хозяйственного использования
  kaz: Лисаков қаласының өнеркәсіптік аймағы ауданында орналасқан № 1 өнеркәсіптік кешенінің Тобыл өзені су қорғау аймағы мен белдеуін, оларды шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

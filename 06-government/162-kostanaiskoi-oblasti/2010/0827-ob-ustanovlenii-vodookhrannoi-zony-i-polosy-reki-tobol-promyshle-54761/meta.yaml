requisite: Постановление акимата Костанайской области от 27 августа 2010 года № 327. Зарегистрировано Департаментом юстиции Костанайской области 7 октября 2010 года № 3735. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

act_code: '52318'
requisite: Қостанай облысы Меңдіқара ауданы әкімдігінің 2010 жылғы 16 сәуірдегі № 164 қаулысы. Қостанай облысы Меңдіқара ауданының Әділет басқармасында 2010 жылғы 4 мамырда № 9-15-127 тіркелді
title:

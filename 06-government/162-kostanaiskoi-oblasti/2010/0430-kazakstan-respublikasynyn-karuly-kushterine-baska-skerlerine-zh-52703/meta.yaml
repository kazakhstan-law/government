act_code: '52703'
requisite: Қостанай облысы Аманкелді ауданы әкімдігінің 2010 жылғы 30 сәуірдегі № 107 қаулысы. Қостанай облысы Аманкелді ауданының Әділет басқармасында 2010 жылғы 20 мамырда № 9-6-112 тіркелді
title:

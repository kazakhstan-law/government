act_code: '55773'
requisite: Постановление акимата Костанайской области от 29 октября 2010 года № 436. Зарегистрировано Департаментом юстиции Костанайской области 3 декабря 2010 года № 3741. Утратило силу в связи с прекращением срока действия - письмо руководителя аппарата акима Костанайской области от 23 июня 2011 года № 08-10/1744
title:
  rus: Об утверждении перечня неиспользуемых объектов коммунальной государственной собственности по Костанайской области, подлежащих предоставлению субъектом малого предпринимательства в имущественный наем (аренду) или доверительное управление для организации производственной деятельности и развития сферы услуг населению с последующей безвозмездной передачей в собственность в 2010 году
  kaz: 2010 жылы өндірістік қызметті ұйымдастыру және халыққа қызметтер саласын дамыту үшін меншікке кейіннен өтеусіз бере отырып шағын кәсіпкерлік субъектілеріне мүліктік жалға (жалдауға) немесе сенімгерлік басқаруға беруге жататын Қостанай облысы бойынша мемлекеттік коммуналдық меншіктің пайдаланылмайтын объектілерінің тізбесін бекіту туралы

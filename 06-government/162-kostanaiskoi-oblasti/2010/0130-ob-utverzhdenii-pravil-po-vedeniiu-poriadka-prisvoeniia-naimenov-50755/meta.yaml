act_code: '50755'
requisite: Постановление акимата Костанайской области от 30 января 2010 года № 54. Зарегистрировано Департаментом юстиции Костанайской области 17 февраля 2010 года № 3704. Утратило силу постановлением акимата Костанайской области от 25 февраля 2016 года № 82
title:
  rus: Об утверждении Правил по ведению порядка присвоения наименований и переименований частей населенного пункта, требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Костанайской области
  kaz: Қостанай облысы аумағындағы елді мекеннің құрамдас бөліктеріне атау беру және атауын қайта өзгерту тәртібін жүргізу жөніндегі ережелерін, жер телімдеріне, ғимараттарға және құрылыстарға реттік нөмірлер беру талаптарын бекіту туралы

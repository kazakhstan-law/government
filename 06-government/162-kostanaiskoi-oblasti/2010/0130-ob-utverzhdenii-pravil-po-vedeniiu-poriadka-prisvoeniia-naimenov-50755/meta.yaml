  title:
    rus: О внесении изменения в постановление акимата от 30 января 2010 года № 54 "Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенного пункта, требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Костанайской области"
    kaz: Әкімдіктің 2010 жылғы 30 қаңтардағы № 54 "Қостанай облысы аумағындағы елді мекеннің құрамдас бөліктеріне атау беру және атауын қайта өзгерту тәртібін жүргізу жөніндегі ережелерін, жер телімдеріне, ғимараттарға және құрылыстарға реттік нөмірлер беру талаптарын бекіту туралы" қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата Костанайской области от 1 марта 2010 года № 80. Зарегистрировано Департаментом юстиции Костанайской области 31 марта 2010 года № 3709. Утратило силу - Постановлением акимата Костанайской области от 29 октября 2010 года № 436
title:
  rus: Об утверждении перечня неиспользуемых объектов коммунальной собственности по Костанайской области, подлежащих предоставлению субъектом малого предпринимательства в имущественный наем (аренду) или доверительное управление с правом последующей безвозмездной передачи в собственность в 2010 году
  kaz: 2010 жылы шағын кәсіпкерлік субъектілеріне мүліктік жалға алуға (жалға беруге) немесе кейіннен меншікке өтеусіз беру құқығымен сенімгерлік басқаруға беруге жататын Қостанай облысы бойынша коммуналдық мемлекеттік меншіктің пайдаланылмайтын объектілерінің тізбесін бекіту туралы

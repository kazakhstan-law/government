requisite: Қостанай облысы Меңдіқара ауданы әкімдігінің 2010 жылғы 22 қарашадағы № 388 қаулысы. Қостанай облысы Меңдіқара ауданының Әділет басқармасында 2010 жылғы 24 желтоқсанда № 9-15-139 тіркелді. Күші жойылды - Қостанай облысы Меңдіқара ауданы әкімдігінің 2012 жылғы 19 қарашадағы № 334 қаулысымен

requisite: Постановление акимата Костанайской области от 9 марта 2010 года № 93. Зарегистрировано Департаментом юстиции Костанайской области 16 апреля 2010 года № 3712. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы Каратомарского водохранилища на участке, расположенном в районе Беимбета Майлина, предназначенном для обслуживания и эксплуатации туристической базы «Золотая рыбка», режима и особых условий их хозяйственного использования
  kaz: «Золотая рыбка» туристік базасының қызмет көрсетуі және пайдалануына арналған, Бейімбет Майлин ауданында орналасқан телімде Қаратомар су бөгенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

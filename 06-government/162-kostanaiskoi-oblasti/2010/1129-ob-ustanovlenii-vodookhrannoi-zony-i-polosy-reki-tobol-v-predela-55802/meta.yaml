act_code: '55802'
requisite: Постановление акимата Костанайской области от 29 ноября 2010 года № 468. Зарегистрировано Департаментом юстиции Костанайской области 10 декабря 2010 года № 3743. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол в пределах земельного участка под строительство мельничного комплекса, расположенного в селе Денисовка Денисовского района, режима и особых условий их хозяйственного использования
  kaz: Денисов ауданы Денисов ауылында орналасқан диірмен кешенінің құрылысына арналған жер учаскесі шегіндегі Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

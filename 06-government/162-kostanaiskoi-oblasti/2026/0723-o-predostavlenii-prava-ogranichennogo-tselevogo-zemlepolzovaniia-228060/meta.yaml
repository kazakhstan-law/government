act_code: '228060'
requisite: Постановление акимата Узункольского района Костанайской области от 23 июля 2026 года № 108
title:
  rus: О предоставлении права ограниченного целевого землепользования (публичный сервитут), на неделимый земельный участок из земель, расположенных на территории Ершовского сельского округа, Пресногорьковского сельского округа, акционерному обществу «Казахтелеком» для прокладки волоконно-оптической линии связи
  kaz: «Қазақтелеком» акционерлік қоғамына талшықты-оптикалық байланыс желісін төсеу үшін Ершов ауылдық округі, Пресногорьков ауылдық округі аумағында орналасқан жерлерден бөлінбейтін жер учаскелеріне шектеулі нысаналы жерге пайдалану (қауымдық сервитут) құқығын беру туралы

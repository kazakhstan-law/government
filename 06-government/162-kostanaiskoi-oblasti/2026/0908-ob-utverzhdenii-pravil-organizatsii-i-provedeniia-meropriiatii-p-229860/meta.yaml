requisite: Постановление акимата Алтынсаринского района Костанайской области от 8 сентября 2026 года № 144. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 сентября 2026 года № 39849
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Алтынсаринского района
  kaz: Алтынсарин ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

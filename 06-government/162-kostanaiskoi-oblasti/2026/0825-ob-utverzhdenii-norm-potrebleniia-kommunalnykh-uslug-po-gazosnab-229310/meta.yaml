act_code: '229310'
requisite: Постановление акимата Костанайской области от 25 августа 2026 года № 254
title:
  rus: Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению и водоотведению, теплоснабжению для потребителей, не имеющих приборов учета в Костанайской области
  kaz: Қостанай облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау және су бұру, жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы

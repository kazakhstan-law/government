  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, архив ісі, спорт және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы

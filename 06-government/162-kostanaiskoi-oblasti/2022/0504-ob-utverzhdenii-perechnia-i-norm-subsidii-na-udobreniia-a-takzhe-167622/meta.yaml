  title:
    rus: О внесении изменения и дополнений в постановление акимата Костанайской области от 4 мая 2022 года № 191 «Об утверждении перечня и норм субсидий на удобрения, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2022 год»
    kaz: Қостанай облысы әкімдігінің 2022 жылғы 4 мамырдағы № 191 «2022 жылға арналған тыңайтқыштарға субсидиялардың тізбесі мен нормаларын, сондай-ақ тыңайтқыштарды (органикалықтарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» қаулысына өзгеріс пен толықтырулар енгізу туралы

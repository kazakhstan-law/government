act_code: '167252'
requisite: Постановление акимата города Аркалыка Костанайской области от 26 апреля 2022 года № 198. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 мая 2022 года № 27886
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Аркалыку
  kaz: Арқалық қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

requisite: Постановление акимата Костанайского района Костанайской области от 26 апреля 2022 года № 309. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 мая 2022 года № 27879
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Костанайского района
  kaz: Қостанай ауданының бірыңғай сәулеттік келбетін беруге бағытталған, көп пәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы

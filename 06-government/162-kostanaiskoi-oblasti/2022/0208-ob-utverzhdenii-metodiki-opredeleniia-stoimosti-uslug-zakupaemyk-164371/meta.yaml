act_code: '164371'
requisite: Постановление акимата Костанайской области от 8 февраля 2022 года № 51. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 февраля 2022 года № 26760. Утратило силу постановлением акимата Костанайской области от 14 января 2025 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики определения стоимости услуг, закупаемых для проведения государственной информационной политики в средствах массовой информации на территории Костанайской области
  kaz: Қостанай облысының аумағындағы бұқаралық ақпарат құралдарында мемлекеттік ақпараттық саясатты жүргізу үшін сатып алынатын көрсетілетін қызметтердің құнын айқындау әдістемесін бекіту туралы

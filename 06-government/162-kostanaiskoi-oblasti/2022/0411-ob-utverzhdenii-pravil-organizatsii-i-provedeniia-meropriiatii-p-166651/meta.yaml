  title:
    rus: О внесении изменений в постановление акимата Денисовского района от 11 апреля 2022 года № 88 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Денисовскому району»
    kaz: Денисов ауданы әкімдігінің 2022 жылғы 11 сәуірдегі № 88 «Денисов ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

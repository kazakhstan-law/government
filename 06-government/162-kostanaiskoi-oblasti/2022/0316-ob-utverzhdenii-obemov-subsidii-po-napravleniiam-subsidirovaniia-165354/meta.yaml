  title:
    rus: О внесении изменения в постановление акимата Костанайской области от 16 марта 2022 года № 118 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства на 2022 год»
    kaz: Қостанай облысы әкімдігінің 2022 жылғы 16 наурыздағы № 118 «2022 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

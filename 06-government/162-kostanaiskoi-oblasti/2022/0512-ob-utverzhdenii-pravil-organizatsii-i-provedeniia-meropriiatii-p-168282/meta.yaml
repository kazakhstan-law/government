requisite: Постановление акимата Мендыкаринского района Костанайской области от 12 мая 2022 года № 63. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 мая 2022 года № 28296
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Мендыкаринскому району
  kaz: Меңдіқара ауданына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

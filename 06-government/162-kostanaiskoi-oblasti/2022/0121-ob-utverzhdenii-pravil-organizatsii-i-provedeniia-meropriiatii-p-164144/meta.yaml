  title:
    rus: О внесении изменений в постановление акимата Житикаринского района Костанайской области от 21 января 2022 года № 21 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика по городу Житикара Житикаринского района Костанайской области»
    kaz: Қостанай облысы Жітіқара ауданы әкімдігінің 2022 жылғы 21 қаңтардағы № 21 «Қостанай облысы Жітіқара ауданының Жітіқара қаласы бойынша біріңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/200477/rus

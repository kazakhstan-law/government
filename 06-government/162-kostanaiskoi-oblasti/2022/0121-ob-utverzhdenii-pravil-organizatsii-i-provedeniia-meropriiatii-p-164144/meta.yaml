act_code: '164144'
requisite: Постановление акимата Житикаринского района Костанайской области от 21 января 2022 года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 января 2022 года № 26674
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Житикаринского района Костанайской области
  kaz: Қостанай облысы Жітіқара ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

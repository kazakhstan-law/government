  title:
    rus: О внесении изменений в постановление акимата Карасуского района от 28 января 2022 года № 12 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Карасускому району»
    kaz: Қарасу ауданы әкімдігінің 2022 жылғы 28 қаңтардағы № 12 «Қарасу ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата района Беимбета Майлина от 15 апреля 2022 года № 121 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика району Беимбета Майлина»
    kaz: Бейімбет Майлин ауданы әкімдігінің 2022 жылғы 15 сәуірдегі № 121 «Бейімбет Майлин ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

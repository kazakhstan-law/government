  requisite: Постановление акимата района Беимбета Майлина Костанайской области от 25 декабря 2024 года № 323
  title:
    rus: Об отмене постановления акимата района Беимбета Майлина от 2 августа 2024 года № 192 «О внесении изменения в постановление акимата района Беимбета Майлина от 15 апреля 2022 года № 121 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика району Беимбета Майлина»
    kaz: «Бейімбет Майлин ауданына бірыңғай сәулеттік көрініс беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы» Бейімбет Майлин ауданы әкімдігінің 2022 жылғы 15 сәуірдегі № 121 қаулысына өзгеріс енгізу туралы» Бейімбет Майлин ауданы әкімдігінің 2024 жылғы 2 тамыздағы № 192 қаулысын жою туралы
  link: https://zan.gov.kz/client/#!/doc/204872/rus

requisite: Постановление акимата Карабалыкского района Костанайской области от 3 марта 2022 года № 29. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 марта 2022 года № 27095
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Карабалыкскому району
  kaz: Қарабалық ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Костанайской области от 7 апреля 2022 года № 145 «Об утверждении перечня приоритетных культур и норм субсидий, а также объема бюджетных средств на повышение урожайности и качества продукции растениеводства на 2022 год»
    kaz: Қостанай облысы әкімдігінің 2022 жылғы 7 сәуірдегі № 145 «2022 жылға арналған басым дақылдардың тізбесін және субсидиялар нормаларын, сондай-ақ өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджет қаражатының көлемін бекіту туралы» қаулысына өзгеріс енгізу туралы

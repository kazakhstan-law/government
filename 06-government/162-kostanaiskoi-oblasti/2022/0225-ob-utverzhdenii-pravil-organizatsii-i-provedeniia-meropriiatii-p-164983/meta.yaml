  title:
    rus: О внесении изменения в постановление акимата города Лисаковска от 25 февраля 2022 года № 67 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Лисаковску и поселку Октябрьский»
    kaz: Лисаков қаласы әкімдігінің 2022 жылғы 25 ақпандағы № 67 «Лисаков қаласына және Октябрь кентіне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

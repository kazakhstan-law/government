  title:
    rus: О внесении изменений в постановление акимата города Лисаковска от 25 февраля 2022 года № 67 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Лисаковску и поселку Октябрьский»
    kaz: «Лисаков қаласына және Октябрь кентіне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Лисаков қаласы әкімдігінің 2022 жылғы 25 ақпандағы № 67 қаулысына өзгерістер енгізу туралы

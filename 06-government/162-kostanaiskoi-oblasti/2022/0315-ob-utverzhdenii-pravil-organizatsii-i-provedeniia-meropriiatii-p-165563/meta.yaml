  title:
    rus: О внесении изменений в постановление акимата Федоровского района от 15 марта 2022 года № 43 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Федоровскому району»
    kaz: «Федоров ауданына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Федоров ауданы әкімдігінің 2022 жылғы 15 наурыздағы № 43 қаулысына өзгерістер енгізу туралы

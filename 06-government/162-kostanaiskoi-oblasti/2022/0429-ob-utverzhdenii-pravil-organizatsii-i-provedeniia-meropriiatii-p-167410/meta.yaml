requisite: Постановление акимата Узункольского района Костанайской области от 29 апреля 2022 года № 74. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 мая 2022 года № 27950
title:
  rus: Об утверждении Правил организации и проведения мероприятий по капитальному или текущему ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Узункольского района
  kaz: Ұзынкөл ауданының бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Амангельдинского района от 4 апреля 2022 года № 63 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Амангельдинскому району»
    kaz: «Амангелді ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Амангелді ауданы әкімдігінің 2022 жылғы 4 сәуірдегі № 63 қаулысына өзгерістер енгізу туралы

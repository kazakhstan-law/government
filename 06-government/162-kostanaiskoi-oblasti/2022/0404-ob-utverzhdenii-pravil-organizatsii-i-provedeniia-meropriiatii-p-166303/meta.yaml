  title:
    rus: О внесении изменений в постановление акимата Амангельдинского района от 4 апреля 2022 года № 63 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Амангельдинскому району»
    kaz: Амангелді ауданы әкімдігінің 2022 жылғы 4 сәуірдегі № 63 «Амангелді ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

title:
  rus: О запрещении пребывания физических лиц на территории государственного лесного фонда и ограничении права лесопользования при проведении авиахимических, авиабиологических и аэрозольных мероприятий по борьбе с вредителями и болезнями леса, а также в периоды высокой пожарной опасности в лесу
  kaz: Орман зиянкестері мен ауруларына қарсы күрес жөніндегі авиахимиялық, авиабиологиялық және аэрозольдік іс-шараларды жүргізу кезінде, сондай-ақ орманда өрт қаупі жоғары кезеңдерде жеке тұлғалардың мемлекеттік орман қоры аумағында болуына тыйым салу және орман пайдалану құқығын шектеу туралы

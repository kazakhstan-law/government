  title:
    rus: О внесении изменений в постановление акимата Костанайской области от 26 октября 2020 года № 373 «О запрещении пребывания физических лиц на территории государственного лесного фонда в периоды высокой пожарной опасности»
    kaz: Қостанай облысы әкімдігінің 2020 жылғы 26 қазандағы № 373 «Орманда өрт қаупі жоғары болып тұрған кезеңдерде жеке тұлғалардың мемлекеттік орман қоры аумағында болуына тыйым салу туралы» қаулысына өзгерістер енгізу туралы

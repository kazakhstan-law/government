act_code: '144548'
requisite: Постановление акимата Житикаринского района Костанайской области от 3 июля 2020 года № 145. Зарегистрировано Департаментом юстиции Костанайской области 8 июля 2020 года № 9309. Утратило силу постановлением акимата Житикаринского района Костанайской области от 25 января 2021 года № 17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

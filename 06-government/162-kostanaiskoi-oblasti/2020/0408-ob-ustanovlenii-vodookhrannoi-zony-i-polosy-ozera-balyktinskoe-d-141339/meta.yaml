requisite: Постановление акимата Костанайской области от 8 апреля 2020 года № 139. Зарегистрировано Департаментом юстиции Костанайской области 9 апреля 2020 года № 9095. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы озера Балыктинское для территории запрашиваемого земельного участка под строительство туристической базы «Рыбацкое счастье» в Белозерском сельском округе Костанайского района, режима и особых условий их хозяйственного использования
  kaz: Қостанай ауданының Белозер ауылдық округінде «Рыбацкое счастье» туристік базасын салуға сұратылған жер учаскесінің  аумағы үшін Балықты көлінің су қорғау аймағы мен белдеуін, оларды шаруашылық пайдаланудың режимі мен ерекше  жағдайларын белгілеу туралы

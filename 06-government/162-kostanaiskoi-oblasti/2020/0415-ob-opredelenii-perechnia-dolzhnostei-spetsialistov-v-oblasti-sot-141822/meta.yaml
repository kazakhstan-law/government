  title:
    rus: О внесении изменений в постановление акимата Карасуского района Костанайской области от 15 апреля 2020 года № 56 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки»
    kaz: Қостанай облысы Қарасу ауданының әкімдігінің 2020 жылғы 15 сәуірдегі № 56 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақылары мен тарифтік мөлшерлемелерін кемінде жиырма бес пайызға жоғарылатуға құқығы бар денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178376/rus

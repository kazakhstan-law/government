    kaz: Қостанай облысы Қарасу ауданы әкімдігінің 2020 жылғы 15 сәуірдегі № 56 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгеріс енгізу туралы

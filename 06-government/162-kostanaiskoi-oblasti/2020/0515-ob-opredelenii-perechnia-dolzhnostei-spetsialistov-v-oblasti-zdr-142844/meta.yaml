act_code: '142844'
requisite: Постановление акимата Денисовского района Костанайской области от 15 мая 2020 года № 89. Зарегистрировано Департаментом юстиции Костанайской области 15 мая 2020 года № 9191. Утратило силу постановлением акимата Денисовского района Костанайской области от 11 мая 2021 года № 98 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

  title:
    rus: О внесении изменений в постановление акимата Аулиекольского района Костанайской области от 30 ноября 2020 года № 201 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Қостанай облысы Әулиекөл ауданының әкімдігінің 2020 жылғы 30 қарашадағы № 201 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы

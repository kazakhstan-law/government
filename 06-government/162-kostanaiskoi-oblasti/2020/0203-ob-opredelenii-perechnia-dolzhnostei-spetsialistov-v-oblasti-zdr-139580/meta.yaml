act_code: '139580'
requisite: Постановление акимата района Беимбета Майлина Костанайской области от 3 февраля 2020 года № 17. Зарегистрировано Департаментом юстиции Костанайской области 14 февраля 2020 года № 8972. Утратило силу постановлением акимата района Беимбета Майлина Костанайской области от 18 мая 2021 года № 98 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақылар мен тарифтік мөлшерлемелерін кемінде жиырма бес пайызға жоғарылатуға құқығы бар денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

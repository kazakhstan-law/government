requisite: Постановление акимата Костанайской области от 19 августа 2020 года № 273. Зарегистрировано Департаментом юстиции Костанайской области 20 августа 2020 года № 9390. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на земельном участке, предназначенном для разработки строительного песка месторождения Давыденовское-1, расположенного в Костанайском районе Костанайской области, режима и особых условий их хозяйственного использования
  kaz: Қостанай облысының Қостанай ауданында орналасқан Давыденовское-1 кен орнының құрылыс құмын игеруге арналған жер учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

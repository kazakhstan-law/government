    kaz: Әкімдіктің 2020 жылғы 12 маусымдағы № 206 «2020 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

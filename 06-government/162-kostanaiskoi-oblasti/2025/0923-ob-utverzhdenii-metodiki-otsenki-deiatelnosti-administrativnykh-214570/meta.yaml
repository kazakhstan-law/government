act_code: '214570'
requisite: Постановление акимата Костанайской области от 23 сентября 2025 года № 277
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Костанайской области» и исполнительных органов, финансируемых из областного бюджета
  kaz: Облыстық бюджеттен қаржыландырылатын «Қостанай облысы әкімінің аппараты» мемлекеттік мекемесі мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

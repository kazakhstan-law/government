act_code: '217119'
requisite: Постановление акимата Костанайского района Костанайской области от 11 ноября 2025 года № 663
title:
  rus: Об образовании штаба и утверждении положения Межведомственного штаба по координации деятельности государственных органов по профилактике наркомании и противодействию наркопреступности при акимате Костанайского района
  kaz: Қостанай ауданы әкімдігінің жанындағы нашақорлықтың алдын алу және есірткі қылмысына қарсы іс-қимыл жөніндегі мемлекеттік органдардың қызметін үйлестіру жөніндегі штаб құру және ведомствоаралық штабтың ережесін бекіту туралы

title:
  rus: Об утверждении норматива субсидий, а также критериев получения субсидий, формы заявки и срока подачи заявки на возмещение затрат на содержание племенного поголовья пород лошадей верхового и верхово-упряжного направлений, выведенных на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағында өсірілген мініс және мініс-жегін жылқылар бағытындағы тұқымдарының асыл тұқымды мал басын күтіп-бағуға жұмсалған шығындарды өтеу бойынша cубсидиялар нормативін, сондай-ақ субсидиялар алу өлшемшарттарын, өтінім нысанын және өтінім беру мерзімін бекіту туралы

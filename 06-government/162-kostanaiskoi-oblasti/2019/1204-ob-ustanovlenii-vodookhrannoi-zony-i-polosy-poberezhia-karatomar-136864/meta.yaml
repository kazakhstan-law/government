requisite: Постановление акимата Костанайской области от 4 декабря 2019 года № 518. Зарегистрировано Департаментом юстиции Костанайской области 10 декабря 2019 года № 8817. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы побережья Каратомарского водохранилища в пределах земельного участка туристической базы «Параллель» в районе Беимбета Майлина Костанайской области, режима и особых условий их хозяйственного использования
  kaz: Қостанай облысы Бейімбет Майлин ауданындағы «Параллель» туристік базасының жер телімі шегінде Қаратомар бөгені жағалауының су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

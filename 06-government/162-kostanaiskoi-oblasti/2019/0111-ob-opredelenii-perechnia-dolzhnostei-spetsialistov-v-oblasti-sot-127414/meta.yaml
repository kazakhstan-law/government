  title:
    rus: О внесении изменений в постановление акимата от 11 января 2019 года № 7 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, для которых устанавливаются повышенные на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях»
    kaz: Әкімдіктің 2019 жылғы 11 қаңтардағы № 7 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария саласындағы мамандарға, қызметтiң осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгiленген мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/145404/rus

act_code: '132862'
requisite: Постановление акимата Узункольского района Костанайской области от 19 июня 2019 года № 76. Зарегистрировано Департаментом юстиции Костанайской области 20 июня 2019 года № 8547. Утратило силу постановлением акимата Узункольского района Костанайской области от 12 апреля 2021 года № 47 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

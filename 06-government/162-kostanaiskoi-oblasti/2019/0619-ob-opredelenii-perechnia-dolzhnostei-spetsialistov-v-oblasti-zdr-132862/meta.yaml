  code: '143324'
  requisite: Постановление акимата Узункольского района Костанайской области от 28 мая 2020 года № 87. Зарегистрировано Департаментом юстиции Костанайской области 29 мая 2020 года № 9230. Утратило силу постановлением акимата Узункольского района Костанайской области от 12 апреля 2021 года № 47 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата от 19 июня 2019 года № 76 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта  и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности, для которых устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях»
    kaz: Әкімдіктің 2019 жылғы 19 маусымдағы № 76 «Қызметтiң осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгіленетін, азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/143324/rus

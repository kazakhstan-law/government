  requisite: Постановление акимата района Беимбета Майлина Костанайской области от 19 апреля 2022 года № 128. Отменено постановлением акимата района Беимбета Майлина Костанайской области от 14 сентября 2023 года № 233 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
  title:
    rus: Об утверждении положений о государственных учреждениях акимата района Беимбета Майлина и аппаратов акимов сельских округов, сел, поселка района Беимбета Майлина, о внесении изменения в правовой акт индивидуального применения, об отмене актов индивидуального применения
    kaz: Бейімбет Майлин ауданы әкімдігінің мемлекеттік мекемелері туралы және ауылдық округтер әкімдері аппараттарының ережелерін бекіту туралы, жеке-дара қолданылатын құқықтық актіге өзгеріс енгізу туралы, жеке-дара қолданылатын құқықтық актілерін жою туралы
  link: https://zan.gov.kz/client/#!/doc/167329/rus

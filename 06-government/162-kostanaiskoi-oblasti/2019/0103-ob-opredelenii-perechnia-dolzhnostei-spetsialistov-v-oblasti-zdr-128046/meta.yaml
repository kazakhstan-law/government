act_code: '128046'
requisite: Постановление акимата Федоровского района Костанайской области от 3 января 2019 года № 356. Зарегистрировано Департаментом юстиции Костанайской области 4 января 2019 года № 8237. Утратило силу постановлением акимата Федоровского района Костанайской области от 16 июля 2021 года № 198 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

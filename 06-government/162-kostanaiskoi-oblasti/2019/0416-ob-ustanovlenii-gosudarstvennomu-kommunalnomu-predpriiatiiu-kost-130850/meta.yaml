  title:
    rus: О внесении изменений в постановление акимата от 16 апреля 2019 года № 756 «Об установлении государственному коммунальному предприятию «Костанайская теплоэнергетическая компания» акимата города Костаная государственного учреждения «Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата города Костаная» публичного сервитута на земельные участки»
    kaz: Әкімдіктің 2019 жылғы 16 сәуірдегі № 756 «Қостанай қаласы әкімдігінің тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі және автомобиль жолдары бөлімі» мемлекеттік мекемесінің Қостанай қаласы әкімдігінің «Қостанай жылытуэнергетикалық компаниясы» мемлекеттік коммуналдық кәсіпорнына жер учаскелеріне қауымдық сервитутты белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/148597/rus

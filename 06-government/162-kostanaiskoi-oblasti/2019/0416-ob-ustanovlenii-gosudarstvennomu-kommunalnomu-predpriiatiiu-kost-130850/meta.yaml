act_code: '130850'
requisite: Постановление акимата города Костаная Костанайской области от 16 апреля 2019 года № 756. Зарегистрировано Департаментом юстиции Костанайской области 25 апреля 2019 года № 8371
title:
  rus: Об установлении государственному коммунальному предприятию «Костанайская теплоэнергетическая компания» акимата города Костаная государственного учреждения «Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата города Костаная» публичного сервитута на земельные участки
  kaz: «Қостанай қаласы әкімдігінің тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі және автомобиль жолдары бөлімі» мемлекеттік мекемесінің Қостанай қаласы әкімдігінің «Қостанай жылытуэнергетикалық компаниясы» мемлекеттік коммуналдық кәсіпорнына жер учаскелеріне қауымдық сервитутты белгілеу туралы

  title:
    rus: О внесении изменений и дополнения в постановление акимата города Лисаковска от 21 ноября 2019 года № 406 «Об установлении размера платы за пользование жилищем из коммунального жилищного фонда в государственном арендном доме»
    kaz: Лисаков қаласы әкімдігінің «Мемлекеттік жалға берілетін үйдегі коммуналдық тұрғын үй қорынан тұрғынжайды пайдаланғаны үшін төлемақы мөлшерін белгілеу туралы» 2019 жылғы 21 қарашадағы № 406 қаулысына өзгерістер мен толықтыру енгізу туралы

act_code: '130685'
requisite: Постановление акимата города Костаная Костанайской области от 16 апреля 2019 года № 755. Зарегистрировано Департаментом юстиции Костанайской области 18 апреля 2019 года № 8361
title:
  rus: Об установлении государственному коммунальному предприятию «Костанайская теплоэнергетическая компания» акимата города Костаная государственного учреждения «Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата города Костаная» публичного сервитута на земельный участок
  kaz: «Қостанай қаласы әкімдігінің тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі және автомобиль жолдары бөлімі» мемлекеттік мекемесінің Қостанай қаласы әкімдігінің «Қостанай жылытуэнергетикалық компаниясы» мемлекеттік коммуналдық кәсіпорнына жер учаскесіне қауымдық сервитутты белгілеу туралы

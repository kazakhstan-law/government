  title:
    rus: О внесении изменений в постановление акимата Джангельдинского района от 2 августа 2019 года № 105 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Жангелдин ауданы әкімдігінің 2019 жылғы 2 тамыздағы № 105 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

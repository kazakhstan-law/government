  title:
    rus: О внесении изменений в постановление акимата Джангельдинского района от 2 августа 2019 года № 105 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, спорта и развития языков являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Жангелдин ауданы әкімдігінің 2019 жылғы 2 тамыздағы № 105 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет спорт және тілдерді дамыту саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

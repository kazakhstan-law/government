requisite: Қостанай облысы Науырзым ауданы әкімдігінің 2007 жылғы 20 сәуірдегі № 125 қаулысы. Қостанай облысы Науырзым ауданының Әділет басқармасында 2007 жылғы 25 сәуірде № 9-16-51 болып тіркелді

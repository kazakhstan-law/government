act_code: '33072'
requisite: Қостанай облысы Аманкелді ауданы әкімдігінің 2007 жылғы 20 сәуірдегі № 119 қаулысы. Қостанай облысы Аманкелді ауданының Әділет басқармасында 2007 жылғы 4 мамырда № 9-6-59 болып тіркелді
title:

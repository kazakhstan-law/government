act_code: '36365'
requisite: Постановление акимата города Рудного Костанайской области от 22 ноября 2007 года № 1587. Зарегистрировано управлением юстиции города Рудного Костанайской области 27 декабря 2007 года № 9-2-92. Утратило силу постановлением акимата города Рудного Костанайской области от 21 февраля 2011 года № 141
title:
  rus: Об оказании социальной помощи занятым и лицам, занятым уходом за детьми в возрасте до семи лет, из числа малообеспеченных, а также безработным, направленным на профессиональную подготовку, переподготовку и повышение квалификации
  kaz: Кәсіби даярлау, қайта даярлау және біліктілігін арттыруға жіберілген табысы аз адамдар қатарындағы жұмыспен қамтылғандарға және жеті жасқа дейінгі балаларды бағып-күтумен айналысатын адамдарға, сондай-ақ жұмыссыздарға әлеуметтік көмек көрсету туралы

requisite: Постановление акимата Костанайской области от 29 декабря 2007 года № 584. Зарегистрировано Департаментом юстиции Костанайской области 8 февраля 2008 года № 3592. Утратило силу - постановлением акимата Костанайской области от 9 апреля 2010 года № 115
title:
  rus: Об утверждении стандарта оказания государственной услуги "Регистрация контрактов на разведку, добычу или совмещенную разведку и добычу общераспространенных полезных ископаемых на территории Костанайской области"
  kaz: '"Қостанай облысының аумағында көпшілікке таралған пайдалы қазбаларды барлау, өндіруге немесе барлау мен өндіру қоса атқаруға арналған келісім-шарттарды тіркеу" мемлекеттік қызмет көрсету стандартын бекіту туралы'

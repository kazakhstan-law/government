act_code: '32948'
requisite: Қостанай облысы Меңдіқара ауданы әкімдігіның 2007 жылғы 19 сәуірдегі № 90 қаулысы. Қостанай облысы Меңдіқара ауданының Әділет басқармасында 2007 жылғы 20 сәуірде № 9-15-60 болып тіркелді

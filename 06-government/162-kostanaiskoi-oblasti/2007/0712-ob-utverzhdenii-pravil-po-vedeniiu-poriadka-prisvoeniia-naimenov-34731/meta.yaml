title:
  rus: Об утверждении Правил по ведению порядка присвоения наименований и переименований составных частей населенных пунктов, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Костанайской области
  kaz: Қостанай облысы аумағындағы елді мекендердің құрамдас бөліктеріне атау беру және қайта атау, жер телімдеріне, ғимараттар және имараттарға реттік нөмірлер беру талаптарын белгілеу тәртібін жүргізу жөніндегі қағиданы бекіту туралы

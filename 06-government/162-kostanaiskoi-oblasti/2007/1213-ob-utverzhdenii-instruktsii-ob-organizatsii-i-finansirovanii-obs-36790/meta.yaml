  kaz: Қоғамдық жұмыстарды ұйымдастыру мен қаржыландыру туралы нұсқаулықты және 2008 жылға арналған Лисаков қаласы бойынша қоғамдық жұмыстарды ұйымдастыру үшін жұмыс орындарын ұсынатын кәсіпорындардың тізбесін бекіту туралы

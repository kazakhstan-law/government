requisite: Постановление акимата Житикаринского района Костанайской области от 19 марта 2005 года № 133. Зарегистрировано Департаментом юстиции Костанайской области 4 апреля 2005 года № 3441. Утратило силу постановлением акимата Житикаринского района Костанайской области от 12 декабря 2011 года № 664
title:
  rus: Об утверждении Инструкции ио оказанию социальной помощи безработным, направленным на профессиональную подготовку, повышение квалификации и переподгоговку, по возмещению затрат на проживание, питание, медицинское освидетельствование и на проезд к месту обучения в пределах региона
  kaz: Аймақ шегіндегі оқу орынына жүріп - тұру мен медициналық куәландыруға, тамақтануға, тұруға кеткен шығын орынын толтыру бойынша қайта даярлау мен біліктілікті көтеруге, кәсіби дайындыққа жіберілген жұмыссыздарға әлеуметтік көмек көрсету Нұсқаулығын бекіту туралы

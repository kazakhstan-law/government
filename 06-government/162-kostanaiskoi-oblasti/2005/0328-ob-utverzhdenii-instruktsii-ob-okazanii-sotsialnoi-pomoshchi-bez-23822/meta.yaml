requisite: Постановление акимата города Лисаковска Костанайской области от 28 марта 2005 года № 191. Зарегистрировано Управлением юстиции города Лисаковска Костанайской области 8 апреля 2005 года № 9-4-1. Утратило силу постановлением акимата города Лисаковска Костанайской области от 14 ноября 2006 года № 1145
title:
  rus: Об утверждении Инструкции об оказании социальной помощи безработным, направленным на профессиональную подготовку, повышение квалификации и переподготовку по возмещению затрат на проживание, на питание, на медицинское освидетельствование и на проезд к месту обучения в пределах региона
  kaz: Кәсіби даярлауға, біліктілігін арттыруға және қайта даярлауға жіберілген  жұмыссыздарға тұруына, тамақтануына, медициналық куәландыруына және өңірлердің шегінде оқу орнына жол жүруіне арналған шығындарын өтеу жөнінде әлеуметтік көмек көрсету туралы Нұсқаулықты бекіту туралы

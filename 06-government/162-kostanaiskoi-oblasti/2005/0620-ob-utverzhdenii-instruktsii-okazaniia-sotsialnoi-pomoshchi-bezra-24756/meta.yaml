requisite: Постановление акимата Мендыкаринского района Костанайской области от 20 июня 2005 года № 294. Зарегистрировано Управлением юстиции Мендыкаринского района Костанайской области 11 июля 2005 года № 9-15-13
title:
  rus: Об утверждении инструкции оказания социальной помощи безработным, направленным на профессиональную подготовку, повышение квалификацию и переподготовку, по возмещению затрат на проживание, питание, возмещению затрат по медицинскому освидетельствованию и на проезд к месту обучения в пределах региона
  kaz: Кәсіби даярлау, біліктілікті арттыру және қайта даярлауға жіберілген жұмыссыздарға тұруға, тамақтануға арналған шығынды, медициналық куәландыруға және аймақ шегінде оқу орнына баратын жолға арналған шығынды өтеу жөнінде әлеуметтік көмек көрсетудің нұсқаулығын бекіту туралы

title:
  rus: Об утверждении Инструкции по оказанию социальной помощи безработным, направленным на профессиональную подготовку, повышение квалификации и переподготовку, по возмещению затрат на проживание, питание, медицинское освидетельствование и на проезд к месту обучения в пределах региона
  kaz: Кәсіби даярлау, біліктілікті арттыру және қайта даярлауға жіберілген жұмыссыздарға тұруға, тамақтануға, медициналық куәландыруға және аймақтық шегінде оқу орындарына баратын жолға арналған шығынды өтеу жөнінде әлеуметтік көмек көрсету жөніндегі Нұсқаулықты бекіту туралы

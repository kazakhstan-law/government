  title:
    rus: О внесении изменения в постановление акимата Костанайской области от 3 апреля 2023 года № 138 «Об утверждении перечня и норм субсидий на пестициды, биоагенты (энтомофаги), а также объемов бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2023 год»
    kaz: Қостанай облысы әкімдігінің 2023 жылғы 3 сәуірдегі № 138 «2023 жылға арналған пестицидтердің, биоагенттердің (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

title:
  rus: Об утверждении перечня и норм субсидий на пестициды, биоагенты (энтомофаги), а также объемов бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2023 год
  kaz: 2023 жылға арналған пестицидтердің, биоагенттердің (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы

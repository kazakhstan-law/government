  title:
    rus: О внесении дополнений в постановление акимата района Беимбета Майлина от 14 сентября 2023 года № 233 «Об утверждении положений о государственных учреждениях акимата района Беимбета Майлина и аппаратов акимов сельских округов, поселка Тобол района Беимбета Майлина»
    kaz: «Бейімбет Майлин ауданы әкімдігінің мемлекеттік мекемелері және Бейімбет Майлин ауданы Тобыл кенті, ауылдық округтер әкімдерінің аппараттары туралы Ережелерді бекіту туралы» Бейімбет Майлин ауданы әкімдігінің 2023 жылғы 14 қыркүйектегі № 233 қаулысына толықтырулар енгізу туралы

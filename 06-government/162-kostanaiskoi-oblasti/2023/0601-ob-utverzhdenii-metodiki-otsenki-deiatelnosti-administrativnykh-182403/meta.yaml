  title:
    rus: О внесении изменений и дополнений в постановление акимата района Беимбета Майлина от 1 июня 2023 года № 103 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов района Беимбета Майлина

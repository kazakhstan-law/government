    rus: О внесении дополнений в постановление акимата района Беимбета Майлина от 14 сентября 2023 года № 233 «Об утверждении положений о государственных учреждениях акимата района Беимбета Майлина и аппаратов акимов сельских округов, поселка Тобол района Беимбета Майлина»

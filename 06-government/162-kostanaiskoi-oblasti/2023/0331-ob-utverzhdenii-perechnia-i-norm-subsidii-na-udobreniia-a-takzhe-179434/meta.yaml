  title:
    rus: О внесении изменения в постановление акимата Костанайской области от 31 марта 2023 года № 131 «Об утверждении перечня и норм субсидий на удобрения, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2023 год»
    kaz: Қостанай облысы әкімдігінің 2023 жылғы 31 наурыздағы № 131 «2023 жылға арналған тыңайтқыштарға субсидиялардың тізбесі мен нормаларын, сондай-ақ тыңайтқыштарды (органикалықтарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

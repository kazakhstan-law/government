  title:
    rus: О внесении изменений в постановление акимата Костанайской области от 31 января 2023 года № 44 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства на 2023 год»
    kaz: Қостанай облысы әкімдігінің 2023 жылғы 31 қаңтардағы № 44 «2023 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» қаулысына өзгерістер енгізу туралы

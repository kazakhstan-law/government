requisite: Постановление акимата Костанайской области от 2 сентября 2014 года № 437. Зарегистрировано Департаментом юстиции Костанайской области 9 октября 2014 года № 5111. Утратило силу постановлением акимата Костанайской области от 28 апреля 2022 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении зоны санитарной охраны хозяйственно-питьевого водозабора поверхностных вод на пруду в русле реки Кундузды для железнодорожной станции Койбагор в Карасуском районе
  kaz: Қарасу ауданындағы Қойбағар теміржол стансасы үшін Құндызды өзені арнасындағы тоғанда жер үсті суларының шаруашылық-ауыз су тартуының санитарлық қорғау аймағын белгілеу туралы

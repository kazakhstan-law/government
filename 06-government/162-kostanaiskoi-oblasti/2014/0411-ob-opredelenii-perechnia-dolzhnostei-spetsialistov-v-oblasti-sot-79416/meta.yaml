act_code: '79416'
requisite: Постановление акимата Джангельдинского района Костанайской области от 11 апреля 2014 года № 97. Зарегистрировано Департаментом юстиции Костанайской области 25 апреля 2014 года № 4650. Утратило силу постановлением акимата Джангельдинского района Костанайской области от 17 августа 2015 года № 128
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и ветеринарии являющимся гражданскими служащими и работающим в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және ставкаларымен салыстырғанда кемінде жиырма без пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды алуға құқығы бар мамандар лауазымдарының тізбесін анықтау туралы

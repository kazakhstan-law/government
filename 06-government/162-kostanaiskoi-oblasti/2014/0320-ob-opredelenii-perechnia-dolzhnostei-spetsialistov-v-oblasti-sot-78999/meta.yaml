  code: '92379'
  requisite: Постановление акимата Камыстинского района Костанайской области от 8 июля 2015 года № 96. Зарегистрировано Департаментом юстиции Костанайской области 30 июля 2015 года № 5772. Утратило силу постановлением акимата Камыстинского района Костанайской области от 3 февраля 2016 года № 14
  title:
    rus: О внесении изменений и дополнений в постановление акимата Камыстинского района от 20 марта 2014 года № 99 "Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, на установление повышенных не менее чем на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях, за счет средств районного бюджета"
    kaz: Қамысты ауданы әкімдігінің 2014 жылғы 20 наурыздағы № 99 "Аудандық бюджет қаражаты есебінен азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды алуға құқығы бар мамандар лауазымдарының тізбесін анықтау туралы" қаулысына өзгерістер пен толықтырулар енгізу туралы

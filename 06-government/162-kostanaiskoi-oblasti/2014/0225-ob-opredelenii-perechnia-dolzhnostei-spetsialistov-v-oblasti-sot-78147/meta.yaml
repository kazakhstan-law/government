requisite: Постановление акимата Житикаринского района Костанайской области от 25 февраля 2014 года № 87. Зарегистрировано Департаментом юстиции Костанайской области 18 марта 2014 года № 4505. Утратило силу постановлением акимата Житикаринского района Костанайской области от 8 января 2016 года № 2
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающими в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

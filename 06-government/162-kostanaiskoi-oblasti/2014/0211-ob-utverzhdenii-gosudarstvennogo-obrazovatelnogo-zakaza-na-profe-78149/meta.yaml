    rus: О внесении изменений и дополнений в постановление акимата от 11 февраля 2014 года № 34 "Об утверждении государственного образовательного заказа на профессиональное обучение в рамках Дорожной карты занятости 2020 на 2014 год"
    kaz: Әкімдіктің 2014 жылғы 11 ақпандағы № 34 "Кәсіптік даярлау бойынша 2014 жылға арналған Жұмыспен қамту 2020 жол картасының шегінде кәсіптік оқытуға мемлекеттік білім беру тапсырысын бекіту туралы" қаулысына өзгерістер мен толықтырулар енгізу туралы

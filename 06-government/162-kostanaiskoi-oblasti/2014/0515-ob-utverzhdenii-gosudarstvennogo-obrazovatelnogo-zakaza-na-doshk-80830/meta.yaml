title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в дошкольных организациях образования Карабалыкского района на 2014 год
  kaz: Қарабалық ауданының 2014 жылға арналған мектепке дейінгі білім ұйымның тәрбие мен оқытуға мемлекеттік білім беру тапсырысы, жан басына шаққандағы қаржыландыру, және ата-ананың ақы төлеу мөлшерін бекіту туралы

act_code: '80300'
requisite: Постановление акимата Алтынсаринского района Костанайской области от 24 апреля 2014 года № 91. Зарегистрировано Департаментом юстиции Костанайской области 27 мая 2014 года № 4755
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Алтынсаринском районе на 2014 год
  kaz: 2014 жылға Алтынсарин ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

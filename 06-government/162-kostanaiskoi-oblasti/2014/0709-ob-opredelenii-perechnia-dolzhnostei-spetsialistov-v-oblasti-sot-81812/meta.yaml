requisite: Постановление акимата Федоровского района Костанайской области от 9 июля 2014 года № 232. Зарегистрировано Департаментом юстиции Костанайской области 6 августа 2014 года № 4970. Утратило силу постановлением акимата Федоровского района Костанайской области от 7 июля 2015 года № 221
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности.
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы.

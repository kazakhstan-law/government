requisite: Постановление акимата Костанайской области от 14 февраля 2014 года № 40. Зарегистрировано Департаментом юстиции Костанайской области 18 марта 2014 года № 4504. Утратило силу постановлением акимата Костанайской области от 28 апреля 2022 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

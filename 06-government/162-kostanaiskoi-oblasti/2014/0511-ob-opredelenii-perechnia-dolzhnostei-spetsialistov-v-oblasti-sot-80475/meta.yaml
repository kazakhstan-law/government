act_code: '80475'
requisite: Постановление акимата Узункольского района Костанайской области от 11 мая 2014 года № 85. Зарегистрировано Департаментом юстиции Костанайской области 29 мая 2014 года № 4774. Утратило силу постановлением акимата Узункольского района Костанайской области от 3 марта 2015 года № 72
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, для которых устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен, лауазымдық айлықақылары мен тарифтік ставкалары кемінде жиырма бес пайызға жоғарылатылған, азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

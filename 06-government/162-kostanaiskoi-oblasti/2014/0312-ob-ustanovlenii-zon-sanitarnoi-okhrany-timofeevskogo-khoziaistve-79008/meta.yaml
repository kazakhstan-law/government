  kaz: Әулиекөл ауданындағы Қазанбасы жер асты су көздерінің № 2 (0902), № 1 (0901-резервтік ұнғымалары) учаскесінде Тимофеев шаруашылық-ауыз су тартуының санитарлық қорғау аймақтарын белгілеу туралы

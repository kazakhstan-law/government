  title:
    rus: О внесении изменений и дополнений в постановление акимата от 24 апреля 2014 года № 88 "Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки за счет средств районного бюджета"
    kaz: Әкімдіктің 2014 жылғы 24 сәуірдегі № 88 "Аудандық бюджет қаражаты есебінен тарифтік ставкалар мен лауазымдық айлықақыларын жиырма бес пайызға жоғарылатуға құқығы бар азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы" қаулысына өзгерістер мен толықтырулар енгізу туралы

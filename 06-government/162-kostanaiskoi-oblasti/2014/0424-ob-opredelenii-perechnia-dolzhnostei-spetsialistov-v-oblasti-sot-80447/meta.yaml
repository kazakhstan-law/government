title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен тарифтік ставкалар мен лауазымдық айлықақыларын жиырма бес пайызға жоғарылатуға құқығы бар азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

requisite: Постановление акимата Костанайской области от 18 августа 2014 года № 408. Зарегистрировано Департаментом юстиции Костанайской области 16 сентября 2014 года № 5096. Утратило силу постановлением акимата Костанайской области от 16 ноября 2015 года № 482
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешения на использование подземных вод питьевого качества для целей, не связанных с питьевым и хозяйственно-бытовым водоснабжением на территориях, где отсутствуют поверхностные водные объекты, но имеются достаточные запасы подземных вод питьевого качества"
  kaz: '"Жерүсті су объектілері жоқ, бірақ ауызсу сапасындағы жерасты суларының жеткілікті қоры бар аумақтарда ауызсу және шаруашылық-тұрмыстық сумен жабдықтауға байланысы жоқ мақсаттар үшін ауызсу сапасындағы жерасты суларын пайдалануға рұқсат беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

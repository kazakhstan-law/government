  title:
    rus: О внесении изменения в постановление акимата от 18 августа 2014 года № 406  «Об утверждении регламента государственной услуги «Принятие местными исполнительными органами области решения по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства»
    kaz: Әкімдіктің 2014 жылғы 18 тамыздағы № 406 «Облыстың жергілікті атқарушы органдарының жануарлар дүниесін пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін бекітіп беру мен аңшылық және балық шаруашылықтарының қажеттіліктері үшін сервитуттарды белгілеу жөнінде шешімдер қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

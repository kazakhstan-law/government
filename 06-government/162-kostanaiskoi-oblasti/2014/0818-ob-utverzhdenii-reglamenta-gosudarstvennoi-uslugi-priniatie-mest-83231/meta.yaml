act_code: '83231'
requisite: Постановление акимата Костанайской области от 18 августа 2014 года № 406. Зарегистрировано Департаментом юстиции Костанайской области 18 сентября 2014 года № 5098. Утратило силу постановлением акимата Костанайской области от 16 ноября 2015 года № 482
title:
  rus: Об утверждении регламента государственной услуги "Принятие местными исполнительными органами области решения по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
  kaz: '"Облыстың жергілікті атқарушы органдарының жануарлар дүниесін пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін бекітіп беру мен аңшылық және балық шаруашылықтарының қажеттіліктері үшін сервитуттарды белгілеу жөнінде шешімдер қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

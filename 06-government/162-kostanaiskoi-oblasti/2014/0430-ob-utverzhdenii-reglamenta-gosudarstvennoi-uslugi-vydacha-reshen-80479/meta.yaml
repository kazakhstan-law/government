requisite: Постановление акимата Костанайской области от 30 апреля 2014 года № 187. Зарегистрировано Департаментом юстиции Костанайской области 3 июня 2014 года № 4793. Утратило силу постановлением акимата Костанайской области от 16 ноября 2015 года № 482
title:
  rus: Об утверждении регламента  государственной услуги "Выдача решения о строительстве культовых зданий (сооружений), определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения)"
  kaz: '"Ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру"  мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

requisite: Постановление акимата Костанайской области от 19 сентября 2014 года № 465. Зарегистрировано Департаментом юстиции Костанайской области 17 октября 2014 года № 5118. Утратило силу постановлением акимата Костанайской области от 12 мая 2015 года № 191
title:
  rus: Об утверждении норматива субсидий на возмещение до 100 % затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, а также критерий и требований к поставщикам услуг по искусственному осеменению
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100 %-ға дейін өтеуге арналған субсидиялар нормативі, сондай-ақ көрсетілетін қызметті жеткізушілерге қойылатын өлшемдер мен талаптарды бекіту туралы

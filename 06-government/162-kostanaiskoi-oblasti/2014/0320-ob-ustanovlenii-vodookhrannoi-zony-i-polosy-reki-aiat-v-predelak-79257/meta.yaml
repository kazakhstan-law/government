act_code: '79257'
requisite: Постановление акимата Костанайской области от 20 марта 2014 года № 97. Зарегистрировано Департаментом юстиции Костанайской области 23 апреля 2014 года № 4629. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Аят в пределах Каратомарского водохранилища на земельном участке, предназначенном под строительство бройлерной птицефабрики до одного миллиона голов, в промышленной зоне села Елизаветинка района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданы Елизаветинка ауылының өнеркәсіптік аймағында бір миллион басқа дейінгі бройлерлік құс фабрикасының құрылысына арналған жер учаскесіндегі Қаратомар су қоймасының шегінде Әйет өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

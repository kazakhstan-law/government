    kaz: Қарасу ауданы әкімдігінің 2013 жылғы 4 қарашадағы № 243 "Ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт амандары лауазымдарының тізбесін белгілеу туралы" қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении дополнений в постановление акимата Карасуского района от 4 ноября 2013 года № 243 "Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки"
    kaz: Қарасу ауданы әкімдігінің 2013 жылғы 4 қарашадағы № 243 "Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақыларын және тарифтік ставкаларын кемінде жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы" қаулысына толықтырулар енгізу туралы

act_code: '75768'
requisite: Постановление акимата Карасуского района Костанайской области от 4 ноября 2013 года № 243. Зарегистрировано Департаментом юстиции Костанайской области 5 декабря 2013 года № 4332. Утратило силу постановлением акимата Карасуского района Костанайской области от 21 января 2016 года № 9
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақыларын және тарифтік ставкаларын кемінде жиырма бес пайызға жоғарылатуға құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

requisite: Постановление акимата Костанайской области от 16 октября 2013 года № 444. Зарегистрировано Департаментом юстиции Костанайской области 27 ноября 2013 года № 4309. Утратило силу постановлением акимата Костанайской области от 28 апреля 2022 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении зон санитарной охраны Тобольского централизованного инфильтрационного хозяйственно-питьевого водозабора на участке горизонтальной подрусловой  дрены на реке Тобол в границах села Аксуатское района Беимбета Майлина
  kaz: Бейімбет Майлин ауданының Ақсуат ауылы шекараларындағы Тобыл өзенінде көлденең арна астындағы кәріз учаскесінде Тобыл орталықтандырылған сіңіру шаруашылық-ауыз су тартудың санитарлық қорғау аймақтарын белгілеу туралы

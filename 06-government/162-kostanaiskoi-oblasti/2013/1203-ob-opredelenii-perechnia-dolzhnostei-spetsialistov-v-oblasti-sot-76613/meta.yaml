  title:
    rus: О внесении изменений в постановление акимата от 3 декабря 2013 года № 970 "Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающих в сельской местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки за счет средств районного бюджета"
    kaz: Әкімдіктің 2013 жылғы 3 желтоқсандағы № 970 "Аудандық бюджет қаражаты есебінен жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларға құқығы бар ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесін айқындау туралы" қаулысына өзгерістер енгізу туралы

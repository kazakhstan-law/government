act_code: '76613'
requisite: Постановление акимата Костанайского района Костанайской области от 3 декабря 2013 года № 970. Зарегистрировано Департаментом юстиции Костанайской области 8 января 2014 года № 4400. Утратило силу постановлением акимата Костанайского района Костанайской области от 12 июня 2015 года № 321
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, для которых за счет средств районного бюджета устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Аудандық бюджет қаражаты есебінен азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкалар аудандық бюджет қаражаты есебінен белгіленетін лауазымдарының тізбесін айқындау туралы

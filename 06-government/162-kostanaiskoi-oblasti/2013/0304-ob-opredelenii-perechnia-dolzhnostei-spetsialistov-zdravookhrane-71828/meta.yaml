act_code: '71828'
requisite: Постановление акимата Карабалыкского района Костанайской области от 4 марта 2013 года № 67. Зарегистрировано Департаментом юстиции Костанайской области 28 марта 2013 года № 4075. Утратило силу - Постановлением акимата Карабалыкского района Костанайской области от 26 сентября 2013 года № 311
title:
  rus: Об определении перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен, лауазымдық төлемақы және тарифтік ставканы жиырма бес пайызға арттырылған құқығы бар ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандары лауазымдарының тізбесін айқындау туралы

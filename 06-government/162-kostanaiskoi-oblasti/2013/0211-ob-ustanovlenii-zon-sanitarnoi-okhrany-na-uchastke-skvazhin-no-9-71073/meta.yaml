requisite: Постановление акимата Костанайской области от 11 февраля 2013 года № 49. Зарегистрировано Департаментом юстиции Костанайской области 21 февраля 2013 года № 4032. Утратило силу постановлением акимата Костанайской области от 28 апреля 2022 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

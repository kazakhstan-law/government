act_code: '75735'
requisite: Постановление акимата Амангельдинского района Костанайской области от 8 ноября 2013 года № 185. Зарегистрировано Департаментом юстиции Костанайской области 4 декабря 2013 года № 4329. Утратило силу постановлением акимата Амангельдинского района Костанайской области от 28 февраля 2014 года № 65
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен кемінде жиырма бес процентке жоғары   лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесін анықтау туралы

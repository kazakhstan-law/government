act_code: '76571'
requisite: Постановление акимата Джангельдинского района Костанайской области от 10 декабря 2013 года № 236. Зарегистрировано Департаментом юстиции Костанайской области 6 января 2014 года № 4396. Утратило силу постановлением акимата Джангельдинского района Костанайской области от 11 апреля 2014 года № 97
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесін анықтау туралы

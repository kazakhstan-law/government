act_code: '77109'
requisite: Постановление акимата Костанайской области от 26 декабря 2013 года № 569. Зарегистрировано Департаментом юстиции Костанайской области 24 января 2014 года № 4416. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон и полос реки Тобол в границах города Лисаковск, поселка Октябрьский и реки Аят в границах села Әйет района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Лисаков қаласының, Октябрь кентінің шекарасындағы Тобыл өзенінің және Бейімбет Майлин ауданы Әйет ауылының шекарасындағы Әйет өзенінің су қорғау аймақтары мен белдеулерін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

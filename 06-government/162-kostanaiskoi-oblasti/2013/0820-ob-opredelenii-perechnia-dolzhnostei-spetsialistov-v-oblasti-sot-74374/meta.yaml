act_code: '74374'
requisite: Постановление акимата Сарыкольского района Костанайской области от 20 августа 2013 года № 299. Зарегистрировано Департаментом юстиции Костанайской области 13 сентября 2013 года № 4219. Утратило силу постановлением акимата Сарыкольского района Костанайской области от 25 января 2016 года № 9
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, работающих в сельской местности, являющихся гражданскими служащими и имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебiнен кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк ставкаларды алуға құқығы бар, азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

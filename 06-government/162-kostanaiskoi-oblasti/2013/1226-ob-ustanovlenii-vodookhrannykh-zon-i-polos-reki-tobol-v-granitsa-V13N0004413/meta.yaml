requisite: Постановление акимата Костанайской области от 26 декабря 2013 года № 570. Зарегистрировано Департаментом юстиции Костанайской области 23 января 2014 года № 4413. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон и полос реки Тобол в границах города Рудный и прилегающей территории в пределах Костанайского и Беимбета Майлина районов, режима и особых условий их хозяйственного использования
  kaz: Рудный қаласының шекараларындағы және Қостанай мен Бейімбет Майлин аудандары шегіндегі іргелес аумақта Тобыл өзенінің су қорғау аймақтары мен белдеулерін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

act_code: '71739'
requisite: Постановление акимата Костанайской области от 12 февраля 2013 года № 62. Зарегистрировано Департаментом юстиции Костанайской области 26 марта 2013 года № 4072. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Аят в пределах Каратомарского водохранилища на земельном участке, предназначенном для эксплуатации и обслуживания кафе «Коктем», расположенном в районе Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданында орналасқан «Коктем» кафесін пайдалануға және қызмет көрсетуге арналған жер учаскесіндегі Қаратомар су қоймасы шегінде Әйет өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

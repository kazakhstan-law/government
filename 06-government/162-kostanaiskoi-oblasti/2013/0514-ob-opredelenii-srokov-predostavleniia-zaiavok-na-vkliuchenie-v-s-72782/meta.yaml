act_code: '72782'
requisite: Постановление акимата Денисовского района Костанайской области от 14 мая 2013 года № 135. Зарегистрировано Департаментом юстиции Костанайской области 30 мая 2013 года № 4142. Утратило силу в связи с истечением срока действия (письмо акима Денисовского района Костанайской области от 28 января 2014 года № 07-7/92)
title:
  rus: Об определении сроков предоставления заявок на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Денисовскому району на 2013 год
  kaz: Денисов ауданы бойынша 2013 жылға субсидия алушылардың тізіміне қосуға арналған өтінімдерді ұсыну мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша оңтайлы себу мерзімдерін белгілеу туралы

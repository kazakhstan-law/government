  title:
    rus: О внесении изменений и дополнений в постановление акимата района от 2 октября 2013 года № 347 "Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки"
    kaz: Аудан әкімдігінің 2013 жылғы 2 қазандағы № 347 "Кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, ветеринария саласындағы мамандар лаузымдарының тізбесін айқындау туралы" қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/89337/rus

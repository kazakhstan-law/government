  title:
    rus: О внесении изменений и дополнений в постановление акимата района от 2 октября 2013 года № 347 "Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки"
    kaz: Аудан әкімдігінің 2013 жылғы 2 қазандағы № 347 "Кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды мен тарифтік ставкаларды алуға құқығы бар ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесін анықтау туралы" қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/79828/rus

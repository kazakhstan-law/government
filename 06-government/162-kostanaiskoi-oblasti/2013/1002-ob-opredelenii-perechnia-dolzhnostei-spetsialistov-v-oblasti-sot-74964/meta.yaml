act_code: '74964'
requisite: Постановление акимата Аулиекольского района Костанайской области от 2 октября 2013 года № 347. Зарегистрировано Департаментом юстиции Костанайской области 28 октября 2013 года № 4268. Утратило силу постановлением акимата Аулиекольского района Костанайской области от 25 января 2016 года № 7
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, ветеринария саласындағы мамандар лаузымдарының тізбесін айқындау туралы

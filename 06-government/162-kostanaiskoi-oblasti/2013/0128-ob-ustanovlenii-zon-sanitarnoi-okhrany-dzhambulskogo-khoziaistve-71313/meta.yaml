requisite: Постановление акимата Костанайской области от 28 января 2013 года № 26. Зарегистрировано Департаментом юстиции Костанайской области 28 февраля 2013 года № 4050. Утратило силу постановлением акимата Костанайской области от 28 апреля 2022 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении зон санитарной охраны Джамбульского хозяйственно-питьевого водозабора на участке скважин № 2, № 4, № П, № 25, № 36, № 37, инфильтрационных водоемах озера Джамбульское и реки Тобол в Костанайском районе
  kaz: Қостанай ауданындағы № 2, № 4, № П, № 25, № 36, № 37 ұңғымалар учаскесінде, Жамбыл көлінің және Тобыл өзенінің сіңіретін су айдындарында Жамбыл шаруашылық-ауыз су тартудың санитарлық қорғау аймақтарын белгілеу туралы

act_code: '75594'
requisite: Постановление акимата Костанайской области от 16 октября 2013 года № 449. Зарегистрировано Департаментом юстиции Костанайской области 27 ноября 2013 года № 4317. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Арчаглы-Аят для производственных объектов животноводческого комплекса товарищества с ограниченной ответственностью "Алтай" в селе Приречное Денисовского района, режима и особых условий их хозяйственного использования
  kaz: Денисов ауданының Приречное ауылындағы "Алтай" жауапкершілігі шектеулі серіктестігінің мал шаруашылығы кешенінің өндірістік объектілері үшін Аршалы-Әйет өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

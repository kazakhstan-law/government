requisite: Постановление акимата Карабалыкского района Костанайской области от 26 сентября 2013 года № 311. Зарегистрировано Департаментом юстиции Костанайской области 24 октября 2013 года № 4256. Утратило силу постановлением акимата Карабалыкского района Костанайской области от 22 января 2016 года № 11
title:
  rus: Об определении перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающих в сельской местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен, жиырма бес проценттен жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандары лауазымдарының тізбесін айқындау туралы

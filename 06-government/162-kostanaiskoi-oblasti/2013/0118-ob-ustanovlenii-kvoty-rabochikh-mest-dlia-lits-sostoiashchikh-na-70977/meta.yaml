act_code: '70977'
requisite: Постановление акимата Алтынсаринского района Костанайской области от 18 января 2013 года № 4. Зарегистрировано Департаментом юстиции Костанайской области 19 февраля 2013 года № 4020
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Алтынсаринском районе на 2013 год
  kaz: 2013 жылға Алтынсарин ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

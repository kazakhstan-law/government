act_code: '39020'
requisite: Қостанай облысы Аманкелді ауданы әкімдігінің 2008 жылғы 14 сәуірдегі № 92 қаулысы. Қостанай облысы Аманкелді ауданының Әділет басқармасында 2008 жылғы 18 сәуірде № 9-6-77 болып тіркелді
title:
  rus: Қазақстан Республикасының Қарулы Күштеріне, басқа әскерлеріне және әскери құрылымдарына азаматтарды мерзімді әскери қызметке 2008 жылдың сәуір-маусымында, қазан-желтоқсанында кезекті шақыруды жүргізуді ұйымдастыру және қамтамасыз ету туралы
  kaz: Қазақстан Республикасының Қарулы Күштеріне, басқа әскерлеріне және әскери құрылымдарына азаматтарды мерзімді әскери қызметке 2008 жылдың сәуір-маусымында, қазан-желтоқсанында кезекті шақыруды жүргізуді ұйымдастыру және қамтамасыз ету туралы

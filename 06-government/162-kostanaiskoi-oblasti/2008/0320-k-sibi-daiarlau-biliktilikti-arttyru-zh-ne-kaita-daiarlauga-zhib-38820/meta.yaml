requisite: Қостанай облысы Аманкелді ауданы әкімдігінің 2008 жылғы 20 наурыздағы № 79 қаулысы. Қостанай облысы Аманкелді ауданының Әділет басқармасында 2008 жылы 8 сәуірде № 9-6-74 тіркелді
title:

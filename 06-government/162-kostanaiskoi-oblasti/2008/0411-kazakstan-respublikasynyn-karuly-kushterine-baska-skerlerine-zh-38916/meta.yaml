act_code: '38916'
requisite: Қостанай облысы Меңдіқара ауданы әкімдігіның 2008 жылғы 11 сәуірдегі № 88 қаулысы. Қостанай облысы Меңдіқара ауданының Әділет басқармасында 2008 жылғы 14 сәуірде № 9-15-77 болып тіркелді
title:

  title:
    rus: О внесении изменений в постановление акимата от 5 июня 2008 года № 319 «Об установлении водоохранной зоны и полосы реки Тобол на участке под строительство двух девятиэтажных жилых домов на территории города Костанай по улице Воинов Интернационалистов и режима их хозяйственного использования»
    kaz: Әкімдіктің 2008 жылғы 5 маусымдағы № 319 «Қостанай қаласы аумағындағы Воинов Интернационалистов көшесі бойында екі тоғыз қабатты тұрғын үй құрылысына арналған телімде Тобыл өзенінің су қорғау аймақтары мен белдеулерін және олардың шаруашылық пайдалану тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

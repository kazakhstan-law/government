act_code: '40541'
requisite: Постановление акимата Костанайской области от 5 июня 2008 года № 319. Зарегистрировано департаментом юстиции Костанайской области 4 июля 2008 года № 3643. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на участке под строительство двух девятиэтажных жилых домов на территории города Костанай по улице Воинов Интернационалистов, режима и особых условий их хозяйственного использования
  kaz: Қостанай қаласының аумағындағы Воинов Интернационалистов көшесі бойында екі тоғыз қабатты тұрғын үй құрылысына арналған учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

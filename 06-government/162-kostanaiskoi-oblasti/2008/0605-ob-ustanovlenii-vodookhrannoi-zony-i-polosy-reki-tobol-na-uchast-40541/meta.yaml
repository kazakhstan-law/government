  title:
    rus: О внесении изменений в некоторые постановления акимата по установлению водоохранных зон и полос, режима и особых условий их хозяйственного использования
    kaz: Су қорғау аймақтары мен белдеулерін және оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу жөніндегі әкімдіктің кейбір қаулыларына өзгерістер енгізу туралы

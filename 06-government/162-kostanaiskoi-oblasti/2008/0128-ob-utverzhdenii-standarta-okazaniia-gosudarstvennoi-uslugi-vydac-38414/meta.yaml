title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок в пенсионные фонды, территориальные подразделения Комитета дорожной полиции Министерства внутренних дел для оформления наследства несовершеннолетним детям"
  kaz: '"Зейнеткерлік қорларға, Ішкі істер министрлігі Жол полициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

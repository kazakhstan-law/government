title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов для инвалидов на социальное обслуживание на дому, в том числе для детей-инвалидов, нуждающихся в постороннем уходе и помощи"
  kaz: '"Мүгедектерге, оның ішінде бөгде адамның күтіміне және жәрдеміне мұқтаж мүгедек балаларға үйде әлеуметтік қызмет көрсетуге арналған құжаттарды ресімдеу" мемлекеттік қызмет көрсету стандартын бекіту туралы'

act_code: '39063'
requisite: Постановление акимата Костанайской области от 29 февраля 2008 года № 149. Зарегистрировано Департаментом юстиции Костанайской области 2 апреля 2008 года № 3629. Утратило силу в связи с истечением срока применения - письмо акимата Костанайской области от 10 ноября 2010 года № 08-08/3045
title:
  rus: Об утверждении перечня неиспользуемых объектов коммунальной собственности государственной собственности по Костанайской области, подлежащих предоставлению субъектам малого предпринимательства в имущественный наем (аренду) или доверительное управление с правом последующей безвозмездной передачи в собственность в 2008 году
  kaz: 2008 жылы шағын кәсіпкерлік субъектілеріне мүліктік жалға алуға (жалға беруге) немесе кейіннен меншікке өтеусіз беру құқығымен сенімгерлік басқаруға беруге жататын Қостанай облысы бойынша коммуналдық мемлекеттік меншіктің пайдаланылмайтын объектілерінің тізбесін бекіту туралы

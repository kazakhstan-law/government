  title:
    rus: О внесении дополнения в постановление акимата от 29 февраля 2008 года № 149 "Об утверждении перечня неиспользуемых объектов коммунальной государственной собственности по Костанайской области, подлежащих предоставлению субъектам малого предпринимательства в имущественный наем (аренду) или доверительное управление с правом последующей безвозмездной передачи в собственность в 2008 году"
    kaz: '"2008 жылы шағын кәсiпкерлiк субъектiлерiне мүліктік жалға алуға (жалға беруге) немесе кейiннен меншiкке өтеусіз беру құқығымен сенiмгерлік басқаруға беруге жататын Қостанай облысы бойынша коммуналдық мемлекеттік меншіктің пайдаланылмайтын объектiлерінің тізбесін бекіту туралы" әкімдіктің 2008 жылғы 29 ақпандағы № 149 қаулысына толықтыру енгізу туралы'

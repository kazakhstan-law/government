requisite: Постановление акимата Костанайского района Костанайской области от 10 ноября 2008 года № 528. Зарегистрировано Управлением юстиции Костанайского района Костанайской области 12 декабря 2008 года № 9-14-95. Утратило силу постановлением акимата Костанайского района Костанайской области от 10 июня 2015 года № 317
title:
  rus: Об определении перечня должностей специалистов, работающих в аульной (сельской) местности и имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Ауылдық (селолық) мекенде жұмыс істейтін, лауазымдық еңбекақы мен тарифтік ставкаларын жиырма бес пайыздан кем емес мөлшерде көтеруге құқығы бар мамандар лауазымдарының тізбесін анықтау туралы

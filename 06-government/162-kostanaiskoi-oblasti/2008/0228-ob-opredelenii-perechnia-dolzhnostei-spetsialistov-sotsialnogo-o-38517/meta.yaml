act_code: '38517'
requisite: Постановление акимата Аулиекольского района Костанайской области от 28 февраля 2008 года № 52. Зарегистрировано Управлением юстиции Аулиекольского района Костанайской области 18 марта 2008 года № 9-7-70. Утратило силу постановлением акимата Аулиекольского района Костанайской области от 23 сентября 2013 года № 336
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающим в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет мамандары лауазымдарының тізбесін анықтау туралы

requisite: Постановление акимата Костанайской области от 12 мая 2008 года № 286. Зарегистрировано департаментом юстиции Костанайской области 3 июня 2008 года № 3637. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на участке под строительство объекта "Туристский супермаркет комплексного обслуживания туристского коттеджного городка" на территории Мичуринского сельского округа Костанайского района, режима и особых условий их хозяйственного использования
  kaz: Қостанай ауданы Мичурин ауылдық округі аумағындағы «Туристік коттедж қалашығының кешенді қызмет көрсету туристік супермаркеті» объектісінің құрылысына арналған учаскеде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

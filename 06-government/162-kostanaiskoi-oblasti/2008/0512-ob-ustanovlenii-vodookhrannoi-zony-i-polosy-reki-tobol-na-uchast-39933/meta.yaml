  title:
    rus: О внесении изменений в постановление акимата от 12 мая 2008 года № 286 «Об установлении водоохранной зоны и полосы реки Тобол на участке под строительство объекта «Туристский супермаркет комплексного обслуживания туристского коттеджного городка» на территории Мичуринского сельского округа Костанайского района и режима их хозяйственного использования»
    kaz: Әкімдіктің 2008 жылғы 12 мамырдағы № 286 «Қостанай ауданы Мичурин ауылдық округі аумағындағы «Туристік коттедж қалашығының кешенді қызмет көрсету туристік супермаркеті» объектісінің құрылысына арналған телімде Тобыл өзенінің су қорғау аймағы мен белдеуі және олардың шаруашылық пайдалану тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

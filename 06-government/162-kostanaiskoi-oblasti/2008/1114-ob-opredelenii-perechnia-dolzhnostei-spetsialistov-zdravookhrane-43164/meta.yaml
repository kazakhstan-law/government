act_code: '43164'
requisite: Постановление акимата Костанайской области от 14 ноября 2008 года № 548. Зарегистрировано департаментом юстиции Костанайской области 19 декабря 2008 года № 3663. Утратило силу в связи с истечением срока применения - письмо акимата Костанайской области от 10 ноября 2010 года № 08-08/3045
title:
  rus: Об определении перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности и имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств областного бюджета на 2008 год
  kaz: 2008 жылға арналған облыстық бюджет қаражаты есебінен ауылдық (селолық) жерде жұмыс істейтін және кемінде жиырма бес процент жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандары лауазымдарының тізбесін белгілеу туралы

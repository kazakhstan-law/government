requisite: Постановление акимата города Аркалыка Костанайской области от 31 января 2008 года № 29а. Зарегистрировано Управлением юстиции города Аркалыка Костанайской области 12 марта 2008 года № 9-3-80. Утратило силу постановлением акимата города Аркалыка Костанайской области от 29 января 2016 года № 40
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими, работающих в сельской местности и имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметші болып табылатын, ауылдық елді мекендерде жұмыс істейтін және жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар әлеуметтік қамтамасыз ету, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға лауазымдарының тізбесін белгілеу туралы

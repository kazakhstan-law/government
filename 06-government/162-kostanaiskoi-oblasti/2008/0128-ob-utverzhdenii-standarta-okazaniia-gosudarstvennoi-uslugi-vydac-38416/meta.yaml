title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок решения совета опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей, являющихся собственниками жилища"
  kaz: '"Тұрғын үйдің меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қорғайтын мәмілелерді жасау үшін қорғаншылар мен қамқоршылар кеңесінің шешіміне анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

title:
  rus: Об установлении водоохранных зон и полос реки Тобол, Амангельдинского водохранилища и озера Безымянное на участках под строительство объектов, режима и особых условий их хозяйственного использования
  kaz: Объектілердің құрылысына арналған учаскелерде Тобыл өзенінің, Амангелді су қоймасының және Безымянный көлінің су қорғау аймақтары мен белдеулерін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата от 5 июня 2008 года № 320  «Об установлении водоохранной зоны и полосы реки Тобол, Амангельдинского водохранилища и озера Безымянное на участках под строительство объектов и режим их хозяйственного использования»
    kaz: Әкімдіктің 2008 жылғы 5 маусымдағы № 320 «Объектілердің құрылысына арналған телімде Амангелді су қоймасының Тобыл өзені және Безымянный көлінің су қорғау аймағы мен белдеуін және олардың шаруашылық пайдаланудың тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

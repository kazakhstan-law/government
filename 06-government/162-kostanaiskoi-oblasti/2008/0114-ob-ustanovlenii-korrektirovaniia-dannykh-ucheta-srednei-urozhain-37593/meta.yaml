requisite: Постановление акимата Тарановского района Костанайской области от 14 января 2008 года № 19. Зарегистрировано управлением юстиции Тарановского района Костанайской области 8 февраля 2008 года № 9-18-63. Утратило силу постановлением акимата Тарановского района Костанайской области от 27 апреля 2009 года № 129
title:
  rus: Об установлении корректирования данных учета средней урожайности (продуктивности), среднего уровня производственных расходов, приведенных в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: 18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақы тағайындағанда нормативтік карточкада келтірілген орташа түсімді (өнімділікті), өндірістік шығыстардың орташа көрсеткіштерін үйлестіру және жеке қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы

act_code: '39824'
requisite: Постановление акимата Узункольского района Костанайской области от 16 апреля 2008 года № 79. Зарегистрировано Управлением юстиции Узункольского района Костанайской области 26 мая 2008 года № 9-19-76. Утратило силу в связи с истечением срока давности (письмо акима Узункольского района Костанайской области от 9 июня 2014 года № 08-1239)
title:
  rus: Об определении Перечня должностей гражданских служащих социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Кемінде жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуа құқығы бар, ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет саласының азаматтық кызметшілер лауазымдарының тізбесін анықтау туралы

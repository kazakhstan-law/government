  title:
    rus: О внесении изменений в постановление акимата от 7 апреля 2008 года № 203 «Об установлении водоохранной зоны и полосы реки Тобол на участке под строительство спортивно-оздоровительного комплекса туристских услуг на территории Мичуринского сельского округа Костанайского района и режима их хозяйственного использования»
    kaz: Әкімдіктің 2008 жылғы 7 сәуірдегі № 203 «Қостанай ауданы Мичурин ауылдық округі аумағындағы туристік қызметтердің спорттық-сауықтыру кешені құрылысына арналған телімде Тобыл өзенінің су қорғау аймағы мен белдеуін және олардың шаруашылық пайдалану тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

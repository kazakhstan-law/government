act_code: '39339'
requisite: Постановление акимата Костанайской области от 7 апреля 2008 года № 203. Зарегистрировано Департаментом юстиции Костанайской области 30 апреля 2008 года № 3635. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на участке под строительство спортивно-оздоровительного комплекса туристских услуг на территории Мичуринского сельского округа Костанайского района, режима и особых условий их хозяйственного использования
  kaz: Қостанай ауданы Мичурин ауылдық округі аумағындағы туристік қызметтердің спорттық-сауықтыру кешені құрылысына арналған учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

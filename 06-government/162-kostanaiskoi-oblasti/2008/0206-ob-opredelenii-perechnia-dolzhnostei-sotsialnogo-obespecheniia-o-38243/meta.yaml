  title:
    rus: О внесении дополнений в постановление акимата от 6 февраля 2008 года № 158 "Об определении перечня должностей специалистов социального обеспечения, образования, работающих в аульной (сельской) местности, которым устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств районного бюджета
    kaz: '"Аудандық бюджет қаржысы есебінен, лауазымдық жалақылары мен тарифтік ставкілері жиырма бес пайызға көтерілетін ауылдық (селолық) жерлерде жұмыс істейтін білім, әлеуметтік қамтамасыз ету мамандарының тізбесін анықтау туралы" 2008 жылғы 6 ақпандағы № 158 әкімдік қаулысына толықтырулар енгізу туралы'

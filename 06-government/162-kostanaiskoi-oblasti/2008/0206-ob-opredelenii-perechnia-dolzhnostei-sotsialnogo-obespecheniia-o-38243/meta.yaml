requisite: Постановление акимата Житикаринского района Костанайской области от 6 февраля 2008 года № 158. Зарегистрировано Управлением юстиции Житикаринского района Костанайской области 7 марта 2008 года № 9-10-94. Утратило силу постановлением акимата Житикаринского района Костанайской области от 10 октября 2013 года № 542
title:
  rus: Об определении перечня должностей социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, которым устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств районного бюджета
  kaz: Аудандық бюджет қаржысы есебінен, лауазымдық жалақылары мен тарифтік ставкалары жиырма бес пайызға көтерілетін ауылдық (селолық) жерлерде жұмыс істейтін білім, мәдениет, әлеуметтік қамтамасыз ету мамандарының тізбесін анықтау туралы

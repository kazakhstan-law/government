  title:
    rus: О внесении изменения в постановление акимата от 5 июня 2008 года № 326 "Об установлении водоохранной зоны и полосы озера Шошкалы на участке под строительство туристских комплексов на территории Киевского и Куйбышевского сельских округов Узункольского района и режима их хозяйственного использования"
    kaz: Әкімдіктің 2008 жылғы 5 маусымдағы № 326 "Ұзынкөл ауданы Киевский және Куйбышевский ауылдық округтері аумағындағы туристік кешендер құрылысына арналған телімде Шошқалы көлінің су қорғау аймағы мен белдеуін және олардың шаруашылық пайдалану тәртібін белгілеу туралы" қаулысына өзгеріс енгізу туралы

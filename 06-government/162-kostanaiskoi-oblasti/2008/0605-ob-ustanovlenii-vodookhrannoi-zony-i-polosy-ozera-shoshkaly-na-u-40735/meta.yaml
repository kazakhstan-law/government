act_code: '40735'
requisite: Постановление акимата Костанайской области от 5 июня 2008 года № 326. Зарегистрировано департаментом юстиции Костанайской области 15 июля 2008 года № 3644. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы озера Шошкалы на участке под строительство туристских комплексов на территории Ершовского сельского округа и села Варваровка Узункольского района, режима и особых условий их хозяйственного использования
  kaz: Ұзынкөл ауданы Ершов ауылдық округі және Варваровка ауылының аумақтарындағы туристік кешендер құрылысына арналған учаскеде Шошқалы көлінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

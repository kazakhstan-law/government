  title:
    rus: О внесении изменений в постановление акимата   от  7 апреля 2008 года № 201  «Об установлении водоохранной зоны и полосы реки Тобол на участке под строительство микрорайона «Наурыз» на территории города Костанай по улице Маяковского и режима их хозяйственного использования»
    kaz: Әкімдіктің 2008 жылғы 7 сәуірдегі № 201 «Қостанай қаласы Маяковский көшесі аумағындағы «Наурыз» шағын ауданының құрылысына арналған телімде Тобыл өзенінің су қорғау аймағы мен белдеуін және олардың шаруашылық пайдалану тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

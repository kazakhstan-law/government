act_code: '39615'
requisite: Постановление акимата Костанайской области от 7 апреля 2008 года № 201. Зарегистрировано департаментом юстиции Костанайской области 16 мая 2008 года № 3636. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на участке под строительство микрорайона "Наурыз" на территории города Костанай по улице Маяковского, режима и особых условий их хозяйственного использования
  kaz: Қостанай қаласы аумағында Маяковский көшесіндегі "Наурыз" шағын ауданының құрылысына арналған учаскесінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

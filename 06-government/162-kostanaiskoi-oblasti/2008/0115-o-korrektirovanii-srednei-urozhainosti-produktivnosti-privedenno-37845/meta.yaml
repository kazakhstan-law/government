requisite: Постановление акимата города Лисаковска Костанайской области от 12 января 2008 года № 61. Зарегистрировано Управлением юстиции города Лисаковска Костанайской области 12 февраля 2008 года № 9-4-108. Утратило силу постановлением акимата города Лисаковска Костанайской области от 6 января 2009 года № 3
title:
  rus: О корректировании средней урожайности (продуктивности), приведенной в нормативной карточке, а также цен, представляемых органами статистики для исчисления дохода от личного подсобного хозяйства, при назначении ежемесячного государственного пособия на детей до 18 лет
  kaz: "18 жасқа дейінгі балаларға арналған ай сайынғы мемлекеттік жәрдемақылар тағайындағанда\tнормативтік карточкада келтірген орташа түсімді (онімділікті), сондай-ақ өзіндік қосалқы шаруашылықтан түскен табысты есептеу үшін статистика органдары ұсынатын бағаларды түзету туралы"

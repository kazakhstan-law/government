requisite: Постановление акимата Костанайской области от 16 марта 2018 года № 117. Зарегистрировано Департаментом юстиции Костанайской области 12 апреля 2018 года № 7699. Утратило силу постановлением акимата Костанайской области от 13 января 2020 года № 11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование ставок вознаграждения по выдаваемым кредитам банками второго уровня субъектам частного предпринимательства для целей жилищного строительства»
  kaz: «Тұрғын үй құрылысы мақсаттары үшін жеке кәсіпкерлік субъектілеріне екінші деңгейдегі банктер беретін кредиттер бойынша сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

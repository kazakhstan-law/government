  title:
    rus: О внесении изменения в постановление акимата от 27 июня 2018 года № 1716 «Об установлении государственному коммунальному предприятию «Костанай-Су» акимата города Костаная государственного учреждения «Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата города Костаная» публичного сервитута на земельные участки»
    kaz: Әкімдіктің 2018 жылғы 27 маусымдағы № 1716 «Қостанай қаласы әкімдігінің тұрғын үй-коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімі» мемлекеттік мекемесінің Қостанай қаласы әкімдігінің «Қостанай-Су» мемлекеттік коммуналдық кәсіпорнының жер учаскесіне қауымдық сервитутты белгілеу туралы» қаулысына өзгеріс енгізу туралы

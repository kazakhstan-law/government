title:
  rus: Об установлении государственному коммунальному предприятию «Костанай-Су» акимата города Костаная государственного учреждения «Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата города Костаная» публичного сервитута на земельные участки
  kaz: «Қостанай қаласы әкімдігінің тұрғын үй коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімі» мемлекеттік мекемесінің Қостанай қаласы әкімдігінің «Қостанай-Су» мемлекеттік коммуналдық кәсіпорнының жер учаскесіне қауымдық сервитутты белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Костанайской области от 20 марта 2018 года № 121 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Костанайской области» и исполнительных органов, финансируемых из областного бюджета»
    kaz: Қостанай облысы әкімдігінің 2018 жылғы 20 наурыздағы № 121 «Облыстық бюджеттен қаржыландырылатын «Қостанай облысы әкімінің аппараты» мемлекеттік мекемесі және атқарушы органдары «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

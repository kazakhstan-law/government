requisite: Постановление акимата Костанайской области от 20 марта 2018 года № 121. Зарегистрировано Департаментом юстиции Костанайской области 12 апреля 2018 года № 7700. Утратило силу постановлением акимата Костанайской области от 29 октября 2025 года № 314 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Костанайской области» и исполнительных органов, финансируемых из областного бюджета
  kaz: Облыстық бюджеттен қаржыландырылатын «Қостанай облысы әкімінің аппараты» мемлекеттік мекемесі және атқарушы органдары «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

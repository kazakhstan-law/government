  title:
    rus: О внесении изменений в постановление акимата от 25 июня 2018 года № 105 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Әкімдіктің 2018 жылғы 25 маусымдағы № 105 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға, лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

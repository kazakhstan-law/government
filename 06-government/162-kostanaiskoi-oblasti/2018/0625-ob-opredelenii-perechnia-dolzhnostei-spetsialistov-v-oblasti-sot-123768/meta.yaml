  title:
    rus: О внесении изменений в постановление акимата Мендыкаринского района от 25 июня 2018 года № 105 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Меңдіқара ауданы әкімдігінің 2018 жылғы 25 маусымдағы № 105 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы

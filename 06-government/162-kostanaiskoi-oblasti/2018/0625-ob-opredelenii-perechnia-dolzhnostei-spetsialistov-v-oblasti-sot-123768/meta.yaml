title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности Мендыкаринского района
  kaz: Меңдіқара ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

  title:
    rus: О признании утратившими силу постановлений акимата района Беимбета Майлина Костанайской области от 14 марта 2018 года № 90 «Об установлении норматива отчисления части чистого дохода коммунальных государственных предприятий района Беимбета Майлина» и от 3 марта 2020 года № 44 «О внесении изменений в постановление акимата от 14 марта 2018 года № 90 «Об установлении норматива отчисления части чистого дохода коммунальных государственных предприятий района Беимбета Майлина»
    kaz: «Бейімбет Майлин ауданы коммуналдық мемлекеттік кәсіпорындарының таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» Қостанай облысы Бейімбет Майлин ауданы әкімдігінің 2018 жылғы 14 наурыздағы № 90 және «Бейімбет Майлин ауданы коммуналдық мемлекеттік кәсіпорындарының таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» әкімдіктің 2018 жылғы 14 наурыздағы № 90 қаулысына өзгерістер енгізу туралы» 2020 жылғы 3 наурыздағы № 44 қаулыларының күші жойылды деп тану туралы

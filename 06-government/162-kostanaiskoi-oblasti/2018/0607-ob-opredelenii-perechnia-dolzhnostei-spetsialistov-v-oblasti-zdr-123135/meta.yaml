act_code: '123135'
requisite: Постановление акимата Джангельдинского района Костанайской области от 7 июня 2018 года № 58. Зарегистрировано Департаментом юстиции Костанайской области 27 июня 2018 года № 7907. Утратило силу постановлением акимата Джангельдинского района Костанайской области от 2 августа 2019 года № 105 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

act_code: '122824'
requisite: Постановление акимата Амангельдинского района Костанайской области от 4 июня 2018 года № 59. Зарегистрировано Департаментом юстиции Костанайской области 14 июня 2018 года № 7845. Утратило силу постановлением акимата Амангельдинского района Костанайской области от 11 мая 2021 года № 93 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

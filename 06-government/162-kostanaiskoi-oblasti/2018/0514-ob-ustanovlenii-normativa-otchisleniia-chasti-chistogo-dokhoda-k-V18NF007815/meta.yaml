  title:
    rus: О признании утратившими силу постановлений акимата Амангельдинского района Костанайской области от 14 мая 2018 года № 47 «Об установлении норматива отчисления части чистого дохода коммунальных государственных предприятий Амангельдинского района» и от 7 июня 2021 года № 109 «О внесении изменение в постановление акимата от 14 мая 2018 года № 47 «Об установлении норматива отчисления части чистого дохода коммунальных государственных предприятий Амангельдинского района»
    kaz: «Амангелді ауданы коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» 2018 жылғы 14 мамырдағы № 47 және «Әкімдіктің 2018 жылғы 14 мамырдағы № 47 «Амангелді ауданы коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» қаулысына өзгеріс енгізу туралы» 2021 жылғы 7 маусымдағы № 109 Қостанай облысы Амангелді ауданы әкімдігінің қаулыларының күші жойылды деп тану туралы

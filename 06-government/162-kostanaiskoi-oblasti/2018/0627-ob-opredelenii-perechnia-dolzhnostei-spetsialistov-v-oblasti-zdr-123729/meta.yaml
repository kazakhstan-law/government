act_code: '123729'
requisite: Постановление акимата Карасуского района Костанайской области от 27 июня 2018 года № 92. Зарегистрировано Департаментом юстиции Костанайской области 13 июля 2018 года № 7973. Утратило силу постановлением акимата Карасуского района Костанайской области от 15 апреля 2020 года № 56 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін лауазымдық айлықақылары мен тарифтік мөлшерлемелерін кемінде жиырма бес пайызға жоғарылатуға құқығы бар денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

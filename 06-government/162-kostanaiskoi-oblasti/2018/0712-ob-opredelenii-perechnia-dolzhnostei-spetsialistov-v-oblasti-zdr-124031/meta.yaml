  requisite: Постановление акимата Наурзумского района Костанайской области от 19 апреля 2019 года № 28. Зарегистрировано Департаментом юстиции Костанайской области 23 апреля 2019 года № 8367. Утратило силу постановлением акимата Наурзумского района Костанайской области от 5 февраля 2021 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Наурзумского района от 12 июля 2018 года № 83 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающим в сельской местности»
    kaz: Науырзым ауданы әкімдігінің 2018 жылғы 12 шілдедегі № 83 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

act_code: '124031'
requisite: Постановление акимата Наурзумского района Костанайской области от 12 июля 2018 года № 83. Зарегистрировано Департаментом юстиции Костанайской области 3 августа 2018 года № 8001. Утратило силу постановлением акимата Наурзумского района Костанайской области от 5 февраля 2021 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта являющихся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

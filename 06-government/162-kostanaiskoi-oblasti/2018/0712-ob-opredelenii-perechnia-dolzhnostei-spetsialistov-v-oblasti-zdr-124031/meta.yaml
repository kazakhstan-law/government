  title:
    rus: О внесении изменений в постановление акимата от 12 июля 2018 года № 83 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающим в сельской местности»
    kaz: Әкімдіктің 2018 жылғы 12 шілдедегі № 83 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысының өзгерістер енгізу туралы

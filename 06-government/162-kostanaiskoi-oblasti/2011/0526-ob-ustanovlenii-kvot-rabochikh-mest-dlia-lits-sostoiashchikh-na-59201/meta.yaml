act_code: '59201'
requisite: Постановление акимата Узункольского района Костанайской области от 26 мая 2011 года № 145. Зарегистрировано Управлением юстиции Узункольского района Костанайской области 8 июня 2011 года № 9-19-157. Утратило силу постановлением акимата Узункольского района Костанайской области от 5 января 2016 года № 2
title:
  rus: Об установлении квот рабочих мест для лиц, состоящих на учете службы пробации уголовно – исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квоталар белгілеу туралы

    kaz: Әкімдіктің 2011 жылғы 26 мамырдағы № 145 "Бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квоталар белгілеу туралы" қаулысына өзгерістер енгізу туралы

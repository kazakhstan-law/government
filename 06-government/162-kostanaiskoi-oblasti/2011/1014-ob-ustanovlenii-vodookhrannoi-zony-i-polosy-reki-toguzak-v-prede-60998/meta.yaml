act_code: '60998'
requisite: Постановление акимата Костанайской области от 14 октября 2011 года № 411. Зарегистрировано Департаментом юстиции Костанайской области 31 октября 2011 года № 3778. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тогузак в пределах производственной площадки акционерного общества "Комсомольская птицефабрика" в селе Гурьяновское Карабалыкского района, режима и особых условий их хозяйственного использования
  kaz: Қарабалық ауданы Гурьянов ауылындағы "Комсомольская птицефабрика" акционерлік қоғамының өндірістік алаңы шегінде Тоғызақ өзенінің су қорғау аймағы мен белдеуін, оларды шаруақорлықпен пайдаланудың ерекше шарттарын және тәртібін белгілеу туралы

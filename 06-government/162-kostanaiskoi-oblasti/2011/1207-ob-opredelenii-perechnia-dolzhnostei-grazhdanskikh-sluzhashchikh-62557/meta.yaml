requisite: Постановление акимата Сарыкольского района Костанайской области от 7 декабря 2011 года № 383. Зарегистрировано Управлением юстиции Сарыкольского района Костанайской области 30 декабря 2011 года № 9-17-130. Утратило силу - постановлением акимата Сарыкольского района Костанайской области от 9 июля 2013 года № 251
title:
  rus: Об определении перечня должностей гражданских служащих социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен кемінде жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар, ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет саласының азаматтық қызметшілер лауазымдарының тізбесін анықтау туралы

act_code: '61241'
requisite: Постановление акимата Костанайской области от 7 октября 2011 года № 399. Зарегистрировано Департаментом юстиции Костанайской области 7 ноября 2011 года № 3781. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон и полос акватории реки Тобол и примыкающих к ней территорий в границах города Костанай и Костанайского района, режима и особых условий их хозяйственного использования
  kaz: Қостанай қаласы және Қостанай ауданы шекарасындағы Тобыл өзені және соған іргелес аумақ акваториясының су қорғау аймақтары мен белдеулерін, оларды шаруақорлықпен пайдаланудың тәртібі мен ерекше шарттарын белгілеу туралы

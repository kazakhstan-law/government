requisite: Постановление акимата Алтынсаринского района Костанайской области от 23 мая 2011 года № 159. Зарегистрировано Управлением юстиции Алтынсаринского района Костанайской области 17 июня 2011 года № 9-5-124. Утратило силу постановлением акимата Алтынсаринского района Костанайской области от 24 апреля 2014 года № 88
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования и культуры, работающих в аульной (сельской) местности и имеющих право на повышение не менее чем на двадцать пять процентов должностные оклады и тарифные ставки, за счет бюджетных средств
  kaz: Бюджет қаражаты есебінен ауылдық (селолық) жерде жұмыс істейтін және кемінде жиырма бес процент жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар әлеуметтік қамсыздандыру, білім беру және мәдениет мамандары лауазымдарының тізбесін белгілеу туралы

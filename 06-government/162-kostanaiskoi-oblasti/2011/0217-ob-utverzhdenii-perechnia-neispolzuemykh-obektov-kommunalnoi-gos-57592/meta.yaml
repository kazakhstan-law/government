requisite: Постановление акимата Костанайской области от 17 февраля 2011 года № 63. Зарегистрировано Департаментом юстиции Костанайской области 4 марта 2011 года № 3753. Утратило силу - Постановлением акимата Костанайской области от 31 августа 2011 года № 362
title:
  rus: Об утверждении перечня неиспользуемых объектов коммунальной государственной собственности по Костанайской области, подлежащих предоставлению субъектом малого предпринимательства в имущественный наем (аренду) или доверительное управление для организации производственной деятельности и развития сферы услуг населению с последующей безвозмездной передачей в собственность
  kaz: Өндірістік қызметті ұйымдастыру және халыққа қызметтер көрсету саласын дамыту үшін меншікке кейіннен өтеусіз бере отырып шағын кәсіпкерлік субъектілеріне мүліктік жалға (жалдауға) немесе сенімгерлік басқаруға беруге жататын Қостанай облысы бойынша мемлекеттік коммуналдық меншіктің пайдаланылмайтын объектілерінің тізбесін бекіту туралы

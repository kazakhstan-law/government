  title:
    rus: О внесении изменений в постановление акимата от 31 октября 2011 года № 452 «Об установлении водоохранной зоны и полосы реки Карасу на земельном участке, предназначенном под строительство животноводческого комплекса на 3000 голов крупного рогатого скота в селе Достияр Тарановского района, режима и особых условий их хозяйственного использования»
    kaz: Әкімдіктің 2011 жылғы 31 қазандағы № 452 «Таран ауданы Достияр ауылындағы 3000 бас ірі қара малға малшаруашылығы кешенінің құрылысына арналған жер телімінде Қарасу өзенінің су қорғау аймағы мен белдеуін, оларды шаруақорлықпен пайдаланудың ерекше шарттарын және тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

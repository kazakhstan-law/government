act_code: '61653'
requisite: Постановление акимата Костанайской области от 31 октября 2011 года № 452. Зарегистрировано Департаментом юстиции Костанайской области 29 ноября 2011 года № 3787. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Карасу на земельном участке, предназначенном под строительство животноводческого комплекса на 3000 голов крупного рогатого скота в селе Максут района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданы Мақсұт ауылындағы 3000 бас ірі қара малға мал шаруашылығы кешенін салуға арналған жер телімінде Қарасу өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

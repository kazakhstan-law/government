act_code: '61497'
requisite: Постановление акимата Костанайской области от 14 октября 2011 года № 415. Зарегистрировано Департаментом юстиции Костанайской области 23 ноября 2011 года № 3786. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон и полос рек Тобол и Аят на участках под строительство объекта "Склады стройматериалов", базы зоны отдыха, обслуживание и эксплуатация туристической базы, режима и особых условий их хозяйственного использования
  kaz: «Құрылыс материалдар қоймалары» объектісін, демалыс  аймағы базасын салуға, туристік базаны пайдалануға және қызмет көрсетуге  арналған учаскелерде Тобыл және Аят өзендерінің су қорғау аймақтары мен белдеулерін, оларды шаруашылықта пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

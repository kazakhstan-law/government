title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол в пределах земельных участков крестьянского хозяйства «Жемис» в селе Юбилейное района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданы Юбилейное ауылындағы «Жемис» шаруа қожалығының жер телімі шегінде Тобыл өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

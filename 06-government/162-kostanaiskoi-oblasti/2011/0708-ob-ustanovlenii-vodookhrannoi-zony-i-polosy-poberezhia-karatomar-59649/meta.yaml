title:
  rus: Об установлении водоохранной зоны и полосы побережья Каратомарского водохранилища в пределах земельного участка туристической базы «Дружба» в районе Беимбета Майлина Костанайской области, режима и особых условий их хозяйственного использования
  kaz: Қостанай облысы Бейімбет Майлин ауданындағы «Дружба» туристік базасының жер телімі шегінде Қаратомар бөгені жағалауының су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

requisite: Постановление акимата Карасуского района Костанайской области от 30 марта 2011 горда № 85. Зарегистрировано Управлением юстиции Карасуского района Костанайской области 15 апреля 2011 года № 9-13-125. Прекращено действие по истечении срока, на который постановление было принято (письмо акимата Карасуского района Костанайской области от 10 апреля 2012 года № 09-04/568)
title:
  rus: Об организации и обеспечении проведения очередного призыва граждан на срочную воинскую службу в Вооруженные Силы, другие войска и воинские формирования Республики Казахстан в апреле-июне, октябре-декабре 2011 года
  kaz: Қазақстан Республикасының Қарулы Күштерiне, басқа әскерлерiне және әскери құрылымдарына азаматтарды 2011 жылдың сәуір-маусымында, қазан-желтоқсанында кезектi мерзiмдi әскери қызметке шақыруды жүргiзудi ұйымдастыру және қамтамасыз ету туралы

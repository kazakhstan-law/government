  title:
    rus: О внесении изменений в постановление акимата от 14 октября 2011 года № 415 «Об установлении водоохранных зон и полос рек Тобол и Аят на участках под строительство объекта «Склады стройматериалов», базы зоны отдыха, обслуживание и эксплуатация туристической базы, режима и особых условий их хозяйственного использования»
    kaz: Әкімдіктің 2011 жылғы 14 қазандағы № 415 «Демалыс  аймағы базасы, туристік базаны пайдалану және қызмет көрсету, «Құрылыс материалдар қоймасы» объектісінің құрылысына арналған телімдерде Тобыл және Аят өзендерінің су қорғау аймақтары мен белдеулерін, оларды шаруақорлықпен пайдаланудың ерекше шарттарын және тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

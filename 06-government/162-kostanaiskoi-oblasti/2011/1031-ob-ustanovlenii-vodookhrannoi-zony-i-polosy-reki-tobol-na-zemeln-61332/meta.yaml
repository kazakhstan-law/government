act_code: '61332'
requisite: Постановление акимата Костанайской области от 31 октября 2011 года № 451. Зарегистрировано Департаментом юстиции Костанайской области 14 ноября 2011 года № 3783. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Тобол на земельном участке, предназначенном под реконструкцию животноводческих помещений на 1000 голов свиней в селе Гришенка Денисовского сельского округа Денисовского района, режима и особых условий их хозяйственного использования
  kaz: Денисов ауданы Денисов ауылдық округінің Гришенка ауылындағы 1000 бас шошқаға малшаруашылығы жайларын қалпына келтіруге арналған жер телімінде Тобыл өзенінің су қорғау аймағы мен белдеуін, оларды шаруақорлықпен пайдаланудың ерекше шарттарын және тәртібін белгілеу туралы

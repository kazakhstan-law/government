act_code: '57771'
requisite: Постановление акимата Костанайской области от 17 февраля 2011 года № 71. Зарегистрировано Департаментом юстиции Костанайской области 15 марта 2011 года № 3754. Утратило силу постановлением акимата Костанайской области от 3 августа 2022 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы реки Аят на четырех земельных участках, предназначенных для ведения горных работ по разработке золотомедного месторождения «Варваринское», расположенных в Асенкритовском сельском округе района Беимбета Майлина, режима и особых условий их хозяйственного использования
  kaz: Бейімбет Майлин ауданының Асенкритов ауылдық округінде орналасқан «Варварин» алтынмыс кен орнын әзірлеу жөніндегі тау жұмыстарын жүргізуге арналған төрт жер учаскілерінде Аят өзенінің су қорғау аймағы мен белдеуін шаруашылық пайдаланудың режимі мен ерекше жағдайларын белгілеу туралы

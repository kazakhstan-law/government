requisite: Постановление акимата Костанайского района Костанайской области от 6 апреля 2011 года № 209. Зарегистрировано Управлением юстиции Костанайского района Костанайской области 4 мая 2011 года № 9-14-149. Утратило силу постановлением акимата Костанайского района Костанайской области от 22 декабря 2015 года № 747
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясының пробация қызметінде есепте тұрған тұлғаларға, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарға және интернат ұйымдарының кәмелетке толмаған түлектерге жұмыс орындарына квота белгілеу туралы

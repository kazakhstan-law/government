  title:
    rus: О внесении изменений в постановление акимата от 30 декабря 2011 года № 372 "Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Алтынсаринском районе на 2012 год"
    kaz: Әкімдіктің 2011 жылғы 30 желтоқсандағы № 372 "2012 жылға Алтынсарин ауданында бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгерістер енгізу туралы

act_code: '62759'
requisite: Постановление акимата Алтынсаринского района Костанайской области от 30 декабря 2011 декабря № 372. Зарегистрировано Управлением юстиции Алтынсаринского района Костанайской области 16 января 2012 года № 9-5-138
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Алтынсаринском районе на 2012 год
  kaz: 2012 жылға Алтынсарин ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

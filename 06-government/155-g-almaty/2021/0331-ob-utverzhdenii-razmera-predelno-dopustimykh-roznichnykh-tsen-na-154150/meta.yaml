title:
  rus: Об утверждении размера предельно допустимых розничных цен на социально значимые продовольственные товары в городе Алматы
  kaz: Алматы қаласындағы әлеуметтік маңызы бар азық-түлік тауарларына рұқсат етілген шекті бөлшек сауда бағаларының мөлшерін бекіту туралы

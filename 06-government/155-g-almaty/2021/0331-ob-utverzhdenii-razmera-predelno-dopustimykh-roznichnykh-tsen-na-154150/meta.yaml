  title:
    rus: О внесении изменения в постановление акимата города Алматы от 31 марта 2021 года № 1/204 «Об утверждении размера предельно допустимых розничных цен на социально значимые продовольственные товары в городе Алматы»
    kaz: Алматы қаласы әкімдігінің «Алматы қаласындағы әлеуметтік маңызы бар азық-түлік тауарларына рұқсат етілген шекті бөлшек сауда бағаларының мөлшерін бекіту туралы» 2021 жылғы 31 наурыздағы № 1/204 қаулысына өзгеріс енгізу туралы

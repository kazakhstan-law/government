requisite: Постановление акимата города Алматы от 25 ноября 2021 года № 4/603. Зарегистрировано Министерством юстиции Республики Казахстан 3 декабря 2021 года № 25521
title:
  rus: Об утверждении перечня субсидируемых видов удобрений и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2021 год
  kaz: 2021 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ, тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға арналған бюджет қаражаттың көлемдерін бекіту туралы

title:
  rus: Об определении территорий испытательных полигонов и маршрутов дорог общего пользования в городе Алматы для реализации пилотного проекта по внедрению автотранспортных средств с условной и высокой автоматизацией управления
  kaz: Басқаруды шартты және жоғары автоматтандырумен автокөлік құралдарын енгізу жөніндегі пилоттық жобаны іске асыру үшін Алматы қаласындағы сынақ полигондарының аумақтары мен жалпы пайдаланымдағы автомобиль жолдарының маршруттарын айқындау туралы

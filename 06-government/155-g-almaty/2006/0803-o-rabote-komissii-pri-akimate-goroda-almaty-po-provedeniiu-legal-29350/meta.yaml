act_code: '29350'
requisite: Постановление Акимата города Алматы от 3 августа 2006 года N 5/989. Зарегистрировано Департаментом юстиции города Алматы 8 августа 2006 года за N 709. Утратило силу постановлением Акимата города Алматы от 11 декабря 2009 года № 5/803
title:
  rus: О работе комиссий при акимате города Алматы по проведению легализации недвижимого имущества, находящегося на территории города Алматы, права на которое не оформлены в соответствии с законодательством Республики Казахстан
  kaz: Алматы қаласы әкімдігінің жанынан Алматы қаласының аумағында орналасқан, құқықтары Қазақстан Республикасының заңнамасына сәйкес ресімделмеген жылжымайтын мүлікті жария етуді жүргізу жөніндегі комиссияның жұмысы туралы

  title:
    rus: О внесении изменений в постановление акимата города Алматы от 3 августа 2006 года N 5/989 "Об образовании комиссий при акимате города Алматы по проведению легализации недвижимого имущества, находящегося на территории города Алматы права на которое не оформлены в соответствии с законодательством Республики Казахстан"
    kaz: Алматы қаласы әкімдігінің 2006 жылғы 3 тамыздағы "Алматы қаласы әкімдігінің жанынан Алматы қаласының аумағында орналасқан, құқықтары Қазақстан  Республикасының заңнамасына сәйкес ресімделмеген жылжымайтын мүлікті жария етуді жүргізу жөніндегі комиссия құру туралы" N 5/989 қаулысына өзгерістер енгізу туралы

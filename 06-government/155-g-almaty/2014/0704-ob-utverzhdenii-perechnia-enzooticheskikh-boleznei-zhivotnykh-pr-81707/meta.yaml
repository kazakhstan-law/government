requisite: Постановление акимата города Алматы от 04 июля 2014 года № 3/549. Зарегистрировано в Департаменте юстиции города Алматы 31 июля 2014 года № 1075. Утратило силу постановлением акимата города Алматы от 27 апреля 2021 года № 2/247 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

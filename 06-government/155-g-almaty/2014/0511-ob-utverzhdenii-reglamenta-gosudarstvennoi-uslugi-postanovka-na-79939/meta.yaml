act_code: '79939'
requisite: Постановление акимата города Алматы от 11 мая 2014 года № 2/341. Зарегистрировано Департаментом юстиции города Алматы 13 мая 2014 года № 1045. Утратило силу постановлением акимата города Алматы от 29 июня 2015 года № 2/404
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет и очередность, а также принятие местным исполнительным органом города Алматы решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом города Алматы в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан Алматы қаласының жергілікті атқарушы органы жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ Алматы қаласы жергілікті атқарушы органының тұрғын үй беру туралы шешім қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

act_code: '80917'
requisite: Постановление акимата города Алматы от 16 мая 2014 года № 2/371. Зарегистрировано в Департаменте юстиции города Алматы 20 июня 2014 года за № 1065. Утратило силу постановлением акимата города Алматы от 1 сентября 2016 года № 3/423
title:
  rus: Об утверждении регламентов государственных услуг "Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан", "Выдача архитектурно-планировочного задания", и "Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования" оказываемых в городе Алматы
  kaz: Алматы қаласында көрсетілетін "Қазақстан Республикасы аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау жөнінде анықтама беру", "Сәулет-жоспарлау тапсырмасын беру" және "Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертуге байланысты емес қолданыстағы ғимараттардың үй-жайларын (жекелеген бөліктерін) реконструкциялауға (қайта жабдықтауға) шешім беру" мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы

  title:
    rus: О внесении дополнений в постановления акимата города Алматы от 21 мая 2014 года № 2/379 "Об утверждении регламентов государственных услуг в области животноводства и сельского хозяйства, оказываемых в городе Алматы" и от 4 августа 2014 года № 3/646 "Об утверждении регламента государственной услуги "Аттестация лабораторий по экспертизе качества семян", оказываемой в городе Алматы"
    kaz: Алматы қаласы әкімдігінің "Алматы қаласында көрсетілетін мал шаруашылығы саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы" 2014 жылғы 21 мамырдағы № 2/379 қаулысына және "Алматы қаласында көрсетілетін "Тұқымның сапасына сараптама жасау жөніндегі зертханаларды аттестаттау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" 2014 жылғы 4 тамыздағы № 3/646 қаулысына толықтырулар енгізу туралы

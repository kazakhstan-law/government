  code: '20279'
  requisite: Постановление акимата города алматы от 2 июня 2004 года N 3/470. Зарегистрировано в Департаменте юстиции города Алматы 16 июня 2004 года за N 605. Утратило силу постановлением акимата города Алматы от 12 февраля 2014 № 1/102
  title:
    rus: О внесении изменений в постановление акимата города Алматы от 23 апреля 2003 года N 1/257 "Об оказании единовременной материальной помощи остронуждающимся гражданам города Алматы" (зарегистрировано в Управлении юстиции города Алматы за N 529 от 8 мая 2003 года) и постановление акимата города Алматы от 17 июня 2002 года N 3/390 "Об утверждении Положения о порядке назначения и выплаты пособия семьям, воспитывающим и обучающим на дому детей-инвалидов" (зарегистрировано в Управлении юстиции города Алматы за N 460 от 8 июля 2002 года)
    kaz: Алматы қаласы Әкімшілігінің 2003 жылы 23 сәуірдегі N 1/257 "Алматы қаласының аса мұқтажды азаматтарына бір жолдық материалдық көмек көрсету туралы" (Алматы қаласының Әділет басқармасында 2003 жылы 8 мамырда N 529 тіркелген) қаулысы және Алматы қаласы Әкімшілігінің 2002 жылы 17 маусымдағы N 3/390 "Мүгедек балаларды үйде тәрбиелеп оқытатын отбасыларына жәрдемақы тағайындау және төлеу тәртібі жөніндегі Ережені бекіту туралы" (Алматы қаласының Әділет басқармасында 2002 жылы 8 шілдеде N 460 тіркелген) қаулысына өзгертулер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/20279/rus

act_code: '15854'
requisite: Постановление акимата города Алматы N 1/257 от 23 апреля 2003 года. Зарегистрировано Управлением юстиции города Алматы 8 мая 2003 года за N 529. Утратило силу постановлением акимата города Алматы 27 декабря 2013 года № 4/1119
title:
  rus: Об оказании единовременной материальной помощи остронуждающимся гражданам города Алматы

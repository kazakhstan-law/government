  title:
    rus: О внесении изменений в постановление акимата города Алматы от 30 декабря 2015 года № 4/705 "Об утверждении регламентов государственных услуг в области регулирования использования водного фонда, лесного хозяйства и особо охраняемых природных территорий, а также животного мира, оказываемых в городе Алматы"
    kaz: Алматы қаласы  әкімдігінің «Алматы қаласында көрсетілетін су қорын пайдалануды реттеу, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар, сондай-ақ жануарлар дүниесі саласындағы мемлекеттік қызметтер регламенттерін бекіту туралы» 2015 жылғы 30 желтоқсандағы № 4/705 қаулысына өзгерістер енгізу туралы

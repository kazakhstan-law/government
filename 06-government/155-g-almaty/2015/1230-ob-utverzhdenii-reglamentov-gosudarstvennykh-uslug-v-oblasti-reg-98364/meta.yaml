act_code: '98364'
requisite: Постановление акимата города Алматы от 30 декабря 2015 года № 4/705. Зарегистрировано Департаментом юстиции города Алматы 27 января 2016 года за № 1247. Утратило силу постановлением акимата города Алматы от 16 сентября 2020 года № 3/372 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг в области регулирования использования водного фонда, лесного хозяйства и особо охраняемых природных территорий, а также животного мира, оказываемых в городе Алматы
  kaz: Алматы қаласында көрсетілетін су қорын пайдалануды реттеу, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар, сондай-ақ жануарлар дүниесі саласындағы мемлекеттік қызметтер регламенттерін бекіту туралы

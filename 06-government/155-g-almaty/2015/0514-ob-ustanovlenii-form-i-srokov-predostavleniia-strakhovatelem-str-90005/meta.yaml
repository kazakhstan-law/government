act_code: '90005'
requisite: Постановление акимата города Алматы от 14 мая 2015 года № 2/290. Зарегистрировано в Департаменте юстиции города Алматы 03 июня 2015 года № 1167. Утратило силу постановлением акимата города Алматы от 25 сентября 2020 года № 3/392 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

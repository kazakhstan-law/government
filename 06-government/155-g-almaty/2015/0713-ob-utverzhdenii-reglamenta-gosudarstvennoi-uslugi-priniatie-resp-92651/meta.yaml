  title:
    rus: О внесении изменений и дополнения в постановление акимата города Алматы от 13 июля 2015 года № 3/435 "Об утверждении регламента государственной услуги "Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения в порядке, определяемом правительством Республики Казахстан"
    kaz: Алматы қаласы әкімдігінің "Қазақстан Республикасының Үкіметі айқындайтын тәртіппен сыйға тарту шарты бойынша мемлекеттік емес заңды тұлғалардың және жеке тұлғалардың мүлік құқықтарын Қазақстан Республикасының қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" 2015 жылғы 13 шілдедегі № 3/435 қаулысына өзгерістер мен толықтыру енгізу туралы

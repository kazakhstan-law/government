requisite: Постановление акимата города Алматы от 11 ноября 2015 года № 4/619. Зарегистрировано Департаментом юстиции города Алматы 09 декабря 2015 года № 1234. Утратило силу постановлением акимата города Алматы от 29 сентября 2020 года № 3/399 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг по приему документов для участия в конкурсах на присуждение звания "Лучший педагог" и на замещение руководителей государственных учреждений среднего образования, оказываемых Управлением образования города Алматы
  kaz: Алматы қаласы Білім басқармасы көрсететін "Үздік педагог" атағын беру және мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурстарына қатысу үшін құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы

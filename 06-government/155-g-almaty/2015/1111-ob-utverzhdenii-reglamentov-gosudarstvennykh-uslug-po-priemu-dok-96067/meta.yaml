  title:
    rus: О внесении изменений в постановление акимата города Алматы от 11 ноября 2015 года № 4/619 "Об утверждении регламентов государственных услуг по приему документов для участия в конкурсах на присуждение звания "Лучший педагог" и на замещение руководителей государственных учреждений среднего образования, оказываемых Управлением образования города Алматы"
    kaz: Алматы қаласы әкімдігінің "Алматы қаласы Білім басқармасы көрсететін "Үздік педагог" атағын беру және мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурстарына қатысу үшін құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы" 2015 жылғы 11 қарашадағы  № 4/619 қаулысына өзгерістер енгізу туралы

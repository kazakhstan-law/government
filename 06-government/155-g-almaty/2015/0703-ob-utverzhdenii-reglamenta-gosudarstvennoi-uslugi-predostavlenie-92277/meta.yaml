    kaz: Алматы қаласы әкімдігінің «Туристік, оның ішінде туристік әлеует, туризм объектілері және туристік қызметті жүзеге асыратын тұлғалар туралы туристік ақпарат беру» мемлекеттік көрсетілетін қызмет көрсету регламентін бекіту туралы» 2015 жылғы 3 шілдедегі № 3/420 қаулысына өзгерістер енгізу туралы

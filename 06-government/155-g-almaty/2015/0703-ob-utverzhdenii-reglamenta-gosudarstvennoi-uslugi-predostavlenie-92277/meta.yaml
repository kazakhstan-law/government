title:
  rus: Об утверждении регламента государственной услуги «Предоставление туристской информации, в том числе о туристском потенциале, объектах туризма и лицах, осуществляющих туристскую деятельность
  kaz: «Туристік ақпаратты, оның ішінде туристік әлеует, туризм объектілері мен туристік қызметті жүзеге асыратын тұлғалар туралы ақпаратты беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы.

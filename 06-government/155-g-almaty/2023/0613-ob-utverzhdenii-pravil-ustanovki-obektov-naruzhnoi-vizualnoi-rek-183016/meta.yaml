act_code: '183016'
requisite: Постановление акимата города Алматы от 13 июня 2023 года № 2/341. Зарегистрировано в Департаменте юстиции города Алматы 16 июня 2023 года № 1724
title:
  rus: Об утверждении Правил установки объектов наружной (визуальной) рекламы на открытом пространстве за пределами помещений в городе Алматы, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений города Алматы и вне полосы отвода автомобильных дорог общего пользования
  kaz: Алматы қаласындағы үй-жайлардың шегінен тыс ашық кеңістікте,  ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, Алматы қаласындағы үй-жайлардың шегінен тыс ашық кеңістікте және ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде сыртқы (көрнекі) жарнама объектілерін орнату қағидаларын бекіту туралы

  title:
    rus: О внесении дополнения в постановление акимата города Алматы от 14 сентября 2023 года № 3/496 «Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения»
    kaz: Алматы қаласы әкімдігінің «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту туралы» 2023 жылғы 14 қыркүйектегі № 3/496 қаулысына толықтыру енгізу туралы

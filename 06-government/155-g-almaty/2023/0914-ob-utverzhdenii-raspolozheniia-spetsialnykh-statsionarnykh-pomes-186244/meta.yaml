requisite: Постановление акимата города Алматы от 14 сентября 2023 года № 3/496. Зарегистрировано в Департаменте юстиции города Алматы 19 сентября 2023 года № 1738. Утратило силу постановлением акимата города Алматы от 9 февраля 2026 года № 1/77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

  title:
    rus: О внесении изменения в постановление акимата города Алматы от 12 апреля 2005 года N 2/211 "О некоторых вопросах деятельности уполномоченных государственных органов города Алматы в области регулирования земельных правоотношений"
    kaz: Алматы қаласы әкімдігінің 2005 жылғы 12 сәуірдегі "Алматы қаласы мемлекеттік өкілетті органдарының жер құқық қатынастарын реттеу саласындағы қызметінің кейбір мәселелері туралы" N 2/211 қаулысына өзгеріс енгізу туралы

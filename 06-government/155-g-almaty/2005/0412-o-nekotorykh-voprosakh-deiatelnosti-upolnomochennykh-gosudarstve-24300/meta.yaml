  title:
    rus: О внесении изменений в постановление акимата города Алматы от 12 апреля 2005 года N 2/211 "О некоторых вопросах деятельности уполномоченных государственных органов города Алматы в области регулирования земельных правоотношений"
    kaz: Алматы қаласы Әкімдігінің 2005 жылғы 12 сәуірдегі N 2/211 "Жер құқық қатынастарын реттеу салалары бойынша Алматы қаласының мемлекеттік өкілетті органдарының қызметі жайлы кейбір мәселелері туралы" қаулысына (Әділет департаментінде 2005 жылы 20 мамырда 658 тіркелді) өзгерістер енгізу туралы

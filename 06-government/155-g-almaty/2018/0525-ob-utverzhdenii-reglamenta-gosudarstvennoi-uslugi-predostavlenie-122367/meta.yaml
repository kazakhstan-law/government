act_code: '122367'
requisite: Постановление акимата города Алматы от 25 мая 2018 года № 2/228. Зарегистрировано Департаментом юстиции города Алматы 8 июня 2018 года № 1485. Утратило силу постановлением акимата города Алматы от 28 декабря 2020 года № 4/620 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего и высшего образования"
  kaz: '"Техникалық және кәсіптік, орта білімнен кейінгі және жоғарғы білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну" мемлекеттік көрселілетін қызмет регламентін бекіту туралы'

act_code: '122362'
requisite: Постановление акимата города Алматы от 25 мая 2018 года № 2/227. Зарегистрировано Департаментом юстиции города Алматы 8 июня 2018 года № 1486. Утратило силу постановлением акимата города Алматы от 28 декабря 2020 года № 4/620 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Прием документов на конкурс по размещению образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием"
  kaz: «Техникалық, кәсiптiк және орта бiлiмнен кейiнгi бiлiмi бар кадрларды даярлауға арналған мемлекеттiк бiлiм беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттiк көрсетiлетiн қызмет регламентін бекіту туралы

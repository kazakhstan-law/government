requisite: Постановление акимата города Алматы от 14 сентября 2009 года N 5/571. Зарегистрировано в Департаменте юстиции города Алматы 22 сентября 2009 года за N 823. Утратило силу постановлением Акимата города Алматы от 27 июня 2012 года № 2/572
title:
  rus: Об определении помещений для проведения встреч с избирателями и мест для размещения агитационных печатных материалов кандидатов в период проведения выборов депутата маслихата города Алматы IV-го созыва вместо выбывшего по 6 избирательному округу
  kaz: 6-сайлау округі бойынша шығып қалған депутаттың орнына ІV cайланған Алматы қаласы мәслихатының депутатын cайлау өткізу кезеңінде сайлаушылармен кездесетін үй-жайларды және үміткерлердің үгіттік баспа материалдарын орналастыратын орындарды белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата города Алматы от 13 апреля 2011 года № 2/225 "Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций в городе Алматы"
    kaz: Алматы қаласы әкімдігінің "Алматы қаласында бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" 2011 жылғы 13 сәуірдегі № 2/225 қаулысына өзгеріс енгізу туралы

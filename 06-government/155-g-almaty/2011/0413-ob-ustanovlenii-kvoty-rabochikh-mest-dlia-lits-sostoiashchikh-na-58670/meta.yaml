act_code: '58670'
requisite: Постановление акимата города Алматы от 13 апреля 2011 года № 2/225. Зарегистрировано Департаментом юстиции города Алматы 5 мая 2011 года № 888. Утратило силу постановлением акимата города Алматы от 2 августа 2016 года № 3/354
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций в городе Алматы
  kaz: Алматы қаласында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

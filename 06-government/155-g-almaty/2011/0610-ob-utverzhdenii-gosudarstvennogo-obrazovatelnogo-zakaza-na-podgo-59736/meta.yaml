requisite: Постановление акимата города Алматы от 10 июня 2011 года N 2/360. Зарегистрировано в Департаменте юстиции города Алматы 12 июля 2011 года за N 894. Утратило силу постановлением акимата города Алматы от 14 июля 2014 года N 3/586

act_code: '73247'
requisite: Постановление акимата города Алматы от 19 июня 2013 года N 2/512. Зарегистрировано в Департаменте юстиции города Алматы 2 июля 2013 года за N 985. Утратило силу постановлением акимата города Алматы от 6 февраля 2014 года N 1/80
title:
  rus: Об утверждении регламента электронной государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде, в городе Алматы"
  kaz: '"Алматы қаласының мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергiлiктi атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегі электрондық мемлекеттік қызмет регламентін бекіту туралы'

  title:
    rus: О внесении изменения в постановление Акимата города Алматы от 12 ноября 2004 года N 4/928 "О мерах по реализации постановления Правительства Республики Казахстан от 1 сентября 2004 года N 923 "Об утверждении Правил реализации местными исполнительными органами областей, городов Астаны и Алматы гражданам Республики Казахстан жилья, построенного в рамках реализации Государственной программы развития жилищного строительства в Республике Казахстан на 2005-2007 годы"
    kaz: 2004 жылдың 12 қарашасындағы Алматы қaласы Әкiмдiгiнiң "2004 жылдың 1-ші қыркүйектегі Қазақстан Республикасы Үкіметінің "Қазақстан Республикасында тұрғын үй құрылысын дамытудың 2005-2007 жылдарға арналған Мемлекеттік бағдарламасы бойынша облыстардың, Астана және Алматы қалалары жергілікті атқарушы органдарының Қазақстан Республикасы азаматтарын тұрғын үймен қамтамасыз ету ережесін бекіту жөніндегі" N 923 қаулысын жүзеге асыру шаралары туралы" N 4/928 қаулысына өзгерiс енгiзу туралы

  requisite: Постановление Акимата города Алматы от 19 сентября 2005 года N 4/613. Зарегистрировано в Департаменте юстиции города Алматы 17 октября 2005 года за N 674. Утратило силу постановлением акимата города Алматы от 16 января 2007 года N 1/79
  title:
    rus: О внесении изменений в постановление Акимата города Алматы от 12 ноября 2004 года N 4/928 "О мерах по реализации постановления Правительства Республики Казахстан от 1 сентября 2004 года N 923 "Об утверждении Правил реализации местными исполнительными органами областей, городов Астаны и Алматы гражданам Республики Казахстан жилья, построенного в рамках реализации Государственной программы развития жилищного строительства в Республике Казахстан на 2005-2007 годы"
    kaz: 2004 жылдың 12 қарашасындағы Алматы қаласы Әкімдігінің "2004 жылдың 1-ші қыркүйектегі Қазақстан Республикасы Үкіметінің "Облыстардың, Астана және Алматы қалалары жергілікті атқарушы органдарының Қазақстан Республикасында тұрғын үй құрылысын дамытудың 2005-2007 жылдарға арналған мемлекеттік бағдарламасын іске асыру шеңберінде салынған тұрғын үйді Қазақстан Республикасының азаматтарына сату ережесін бекіту туралы" N 923 қаулысын жүзеге асыру шаралары туралы" N 4/928 Қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/25632/rus

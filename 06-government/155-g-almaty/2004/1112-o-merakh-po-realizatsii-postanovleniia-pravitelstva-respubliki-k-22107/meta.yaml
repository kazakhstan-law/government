  title:
    rus: О мерах по реализации распоряжения Премьер-Министра Республики Казахстан "О создании рабочей группы по проведению ревизии действующих подзаконных нормативных правовых актов на предмет наличия в них норм, создающих условия для коррупционных правонарушений" от 8 апреля 2005 года N 82-р
    kaz: Қазақстан Республикасы Премьер-Министрінің 2005 жылғы 8 сәуірдегі N 82-ө "Қолданыстағы заңға тәуелдi нормативтiк құқықтық актілерге оларда сыбайлас жемқорлық құқық бұзушылықтарға жағдай туғызатын нормалардың болуы тұрғысында тексеру жүргiзу жөнiндегі жұмыс тобын құру туралы" өкімін жүзеге асыру жайындағы шаралар туралы

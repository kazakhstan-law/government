  title:
    rus: О внесении изменения в постановление акимата города Алматы от 30 декабря 2020 года № 4/636 «Об утверждении размера предельно допустимых розничных цен на социально значимые продовольственные товары в городе Алматы»
    kaz: Алматы қаласы әкімдігінің «Алматы қаласындағы әлеуметтік маңызы бар азық-түлік тауарларына рұқсат етілген шекті бөлшек сауда бағаларының мөлшерін бекіту туралы» 2020 жылғы 30 желтоқсандағы № 4/636 қаулысына өзгерістер енгізу туралы

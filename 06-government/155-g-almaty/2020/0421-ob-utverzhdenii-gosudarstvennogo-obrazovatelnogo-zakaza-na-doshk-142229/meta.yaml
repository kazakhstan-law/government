title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение и размера родительской платы в дошкольных организациях города Алматы на 2020 год
  kaz: Алматы қаласының мектепке дейiнгi ұйымдарындағы 2020 жылға арналған мектепке дейiнгi тәрбие мен оқытуға мемлекеттiк бiлiм беру тапсырысын және ата-ананың ақы төлеу мөлшерiн бекiту туралы

  title:
    rus: О внесении изменений и дополнений в постановление акимата города Алматы от 21 апреля 2020 года № 2/125 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение и размера родительской платы в дошкольных организациях города Алматы на 2020 год»
    kaz: Алматы қаласы әкiмдiгiнiң «Алматы қаласының мектепке дейiнгi ұйымдарындағы 2020 жылға арналған мектепке дейiнгi тәрбие мен оқытуға мемлекеттiк бiлiм беру тапсырысын және ата-ананың ақы төлеу мөлшерiн бекiту туралы» 2020 жылғы 21 сәуірдегі № 2/125 қаулысына өзгерістер мен толықтырулар енгізу туралы

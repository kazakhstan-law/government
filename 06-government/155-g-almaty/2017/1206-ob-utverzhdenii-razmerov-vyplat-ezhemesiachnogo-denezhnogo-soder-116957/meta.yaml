act_code: '116957'
requisite: Постановление акимата города Алматы от 6 декабря 2017 года № 4/513. Зарегистрировано Департаментом юстиции города Алматы 21 декабря 2017 года № 1439. Утратило силу постановлением акимата города Алматы от 20 марта 2024 года № 1/214 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размеров выплат ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд города Алматы
  kaz: Алматы  қаласының спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командаларының) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы

requisite: Постановление Акимата города Алматы от 6 ноября 2012 года N 4/945. Зарегистрировано в Департаменте юстиции города Алматы 15 ноября 2012 года за N 956. Утратило силу постановлением акимата города Алматы от 14 сентября 2023 года № 3/496 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

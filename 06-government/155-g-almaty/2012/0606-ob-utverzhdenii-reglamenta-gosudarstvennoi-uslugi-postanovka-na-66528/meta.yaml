act_code: '66528'
requisite: Постановление Акимата города Алматы от 6 июня 2012 года N 2/516. Зарегистрировано Департаментом юстиции города Алматы 9 июля 2012 года за N 942. Утратило силу постановлением Акимата города Алматы от 19 июня 2013 года N 2/512
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде, в местном исполнительном органе города Алматы"
  kaz: '"Алматы қаласының жергiлiктi атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергiлiктi атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызмет регламентін бекіту туралы'

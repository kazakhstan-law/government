requisite: Постановление акимата города Алматы от 4 февраля 2016 года № 1/42. Зарегистрировано Департаментом юстиции города Алматы 25 февраля 2016 года за № 1255. Утратило силу постановлением акимата города Алматы от 18 апреля 2017 года № 2/121
title:

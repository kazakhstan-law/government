act_code: '104675'
requisite: Постановление акимата города Алматы от 21 июня 2016 года № 2/286. Зарегистрировано Департаментом юстиции города Алматы 18 июля 2016 года за № 1300. Утратило силу постановлением акимата города Алматы от 9 декабря 2020 года № 4/564 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Аккредитация организаций по управлению проектами в области архитектуры, градостроительства и строительства, оказываемых в городе Алматы»
  kaz: «Алматы қаласында сәулет, қала құрылысы және құрылыс саласындағы жобаларды  басқару жөніндегі ұйымдарды аккредиттеу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

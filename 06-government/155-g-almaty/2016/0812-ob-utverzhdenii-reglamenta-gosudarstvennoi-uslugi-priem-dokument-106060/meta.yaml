  title:
    rus: О внесении изменения в постановление акимата города Алматы от 12 августа 2016 года № 3/380 «Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
    kaz: Алматы қаласы әкiмдiгiнiң «Мектепке дейiнгi тәрбие мен оқыту, бастауыш, негiзгi орта, жалпы орта, техникалық және кәсiптiк, орта бiлiмнен кейiнгi бiлiм беру бағдарламаларын iске асыратын бiлiм беру ұйымдарының педагог қызметкерлерi мен оларға теңестiрiлген тұлғаларға бiлiктiлiк санаттарын беру (растау) үшiн оларды аттестаттаудан өткiзуге құжаттарды қабылдау» мемлекеттiк көрсетiлетiн қызмет регламентін бекіту туралы» 2016 жылғы 12 тамыздағы № 3/380 қаулысына өзгеріс енгізу туралы

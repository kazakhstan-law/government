act_code: '106060'
requisite: Постановление акимата города Алматы от 12 августа 2016 года № 3/380. Зарегистрировано Департаментом юстиции города Алматы 14 сентября 2016 года № 1308. Утратило силу постановлением акимата города Алматы от 28 декабря 2020 года № 4/620 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейiнгi тәрбие мен оқыту, бастауыш, негiзгi орта, жалпы орта, техникалық және кәсiптiк, орта бiлiмнен кейiнгi бiлiм беру бағдарламаларын iске асыратын бiлiм беру ұйымдарының педагог қызметкерлерi мен оларға теңестiрiлген тұлғаларға бiлiктiлiк санаттарын беру (растау) үшiн оларды аттестаттаудан өткiзуге құжаттарды қабылдау» мемлекеттiк көрсетiлетiн қызмет регламентін бекіту туралы

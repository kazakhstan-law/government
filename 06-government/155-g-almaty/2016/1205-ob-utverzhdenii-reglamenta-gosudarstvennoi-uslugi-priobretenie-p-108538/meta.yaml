requisite: Постановление акимата города Алматы от 5 декабря 2016 года № 4/566. Зарегистрировано Департаментом юстиции города Алматы 30 декабря 2016 года № 1338. Утратило силу постановлением акимата города Алматы от 29 сентября 2020 года № 3/398 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Приобретение прав на земельные 10 участки, которые находятся в государственной собственности,не требующее проведения торгов (конкурсов, аукционов)»
  kaz: «Сауда-саттықты (конкурстарды, аукциондарды) өткізуді талап етпейтін мемлекет меншігіндегі жер учаскелеріне құқықтарды алу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

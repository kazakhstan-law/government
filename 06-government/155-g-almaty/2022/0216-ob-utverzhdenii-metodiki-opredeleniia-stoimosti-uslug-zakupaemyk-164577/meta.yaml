requisite: Постановление акимата города Алматы от 16 февраля 2022 года № 1/39. Зарегистрировано Министерством юстиции Республики Казахстан 17 февраля 2022 года № 26829. Утратило силу постановлением акимата города Алматы от 26 февраля 2025 года № 1/212 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

  title:
    rus: О внесении изменения в постановление акимата города Алматы от 20 июля 2022 года № 3/342 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера родительской платы в дошкольных организациях города Алматы»
    kaz: Алматы қаласы әкімдігінің «Алматы қаласының мектепке дейiнгi ұйымдарында мектепке дейiнгi тәрбие мен оқытуға мемлекеттiк бiлiм беру тапсырысын, ата-ана төлемақысының мөлшерiн бекiту туралы» 2022 жылғы 20 шілдедегі № 3/342 қаулысына өзгеріс енгізу туралы

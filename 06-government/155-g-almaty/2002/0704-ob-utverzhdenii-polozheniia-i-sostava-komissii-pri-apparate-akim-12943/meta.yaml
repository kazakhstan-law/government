  title:
    rus: '"О внесении изменений и дополнений в постановление акимата города Алматы от 5 июля 2002 года N 3/446 "Об утверждении Положения и состава Комиссии при аппарате акима города Алматы по соблюдению порядка реализации периодических печатных изданий, публикующих материалы эротического характера"'
    kaz: '"Алматы қаласы Әкімшілігінің 2002 жылдың 5 шілдесіндегі N 3/446 "Эротикалық сипаттағы материалдар жариялайтын мерзімді баспасөз басылымдарын тарату тәртібін сақтау жөніндегі Алматы қаласы Әкімі аппараты жанындағы Комиссияның Ережесі мен құрамын бекіту туралы" қаулысына өзгертулер мен толықтырулар енгізу туралы"'

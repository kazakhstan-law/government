act_code: '12943'
requisite: Постановление Акимата города Алматы от 5 июля 2002 г. N 3/446. Зарегистрировано Управлением юстиции г.Алматы 19 июля 2002 года за N 461. Утратило силу постановлением Акимата города Алматы 8 октября 2004 года N 4/824
title:
  rus: Об утверждении Положения и состава Комиссии при аппарате Акима г.Алматы по соблюдению порядка реализации периодических печатных изданий, публикующих материалы эротического характера
  kaz: '"Алматы қаласы Әкiмi аппараты жанындағы эротикалық сипаттағы материалдар жариялайтын мерзiмдi баспасөз басылымдарын тарату тәртiбiн сақтайтын Комиссияның Ережесi мен құрамын бекiту туралы"'

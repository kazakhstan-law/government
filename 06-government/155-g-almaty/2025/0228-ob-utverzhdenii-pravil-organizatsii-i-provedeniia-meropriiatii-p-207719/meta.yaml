act_code: '207719'
requisite: Постановление акимата города Алматы от 28 февраля 2025 года № 1/215. Зарегистрировано в Департаменте юстиции города Алматы 5 марта 2025 года № 1802-02
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, включая услуги, в том числе декоративно-светового оформления, направленных на придание единого архитектурного облика городу Алматы
  kaz: Алматы қаласына бірыңғай сәулеттік келбет беруге бағытталған көрсетілетін қызметтерді, оның ішінде сәндік-жарықпен безендіру қызметтерін қоса алғанда, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

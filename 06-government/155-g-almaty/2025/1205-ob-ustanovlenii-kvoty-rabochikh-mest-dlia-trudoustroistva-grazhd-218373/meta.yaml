act_code: '218373'
requisite: Постановление акимата города Алматы от 5 декабря 2025 года № 4/792
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до достижения восемнадцатилетнего возраста без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в городе Алматы на 2026 год
  kaz: Алматы қаласында он сегіз жасқа толғанға дейін ата-анасынан айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін 2026 жылға арналған жұмыс орындарына квота белгілеу туралы

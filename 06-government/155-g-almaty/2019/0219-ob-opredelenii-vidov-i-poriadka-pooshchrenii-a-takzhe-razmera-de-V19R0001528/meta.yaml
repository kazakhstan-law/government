    kaz: Алматы қаласы әкімдігінің «Алматы қаласында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ ақшалай сыйақының мөлшерін айқындау туралы» 2019 жылғы 19 ақпандағы № 1/108 қаулысының күші жойылды деп тану туралы

title:
  rus: Постановление акимата города Алматы «Об установлении предельных уровней цен (тарифов) на услуги по перевозке пассажиров по социально значимым межрайонным (междугородным внутриобластным) и пригородным сообщениям города Алматы»
  kaz: «Алматы қаласының әлеуметтік маңызы бар ауданаралық (облысiшiлік қалааралық) және қала маңындағы қатынастарда жолаушылар тасымалы бойынша көрсетілетін қызметтерге бағалардың (тарифтердің) шекті деңгейлерін белгілеу туралы» Алматы қаласының әкімдігінің қаулысы

    kaz: «Жалағаш ауданының ауылдық округтеріндегі инженерлік тұрғыда әзірленген суармалы жерде дақылдарды кезектестіру (ротациялау) схемасын бекіту туралы» Жалағаш ауданы әкімдігінің 2018 жылғы 18 маусымдағы № 120 қаулысына өзгеріс енгізу туралы

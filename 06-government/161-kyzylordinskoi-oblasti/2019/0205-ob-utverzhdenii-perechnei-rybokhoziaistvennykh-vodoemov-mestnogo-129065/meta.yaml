  title:
    rus: О внесении изменений в постановление акимата Кызылординской области от 5 февраля 2019 года № 1318 «Об утверждении перечней рыбохозяйственных водоемов местного значения и рыбохозяйственных водоемов и (или) участков местного значения в разрезе водоемов и (или) участков для ведения промыслового рыболовства, любительского (спортивного) рыболовства, озерно-товарного рыбоводного хозяйства»
    kaz: «Жергілікті маңызы бар балық шаруашылығы су айдындарының және кәсіпшілік балық аулауды, әуесқойлық (спорттық) балық аулауды, көлде тауарлы балық өсіру шаруашылығын жүргізуге арналған су айдындары және (немесе) учаскелер бөлінісіндегі жергiлiктi маңызы бар балық шаруашылығы су айдындарының және (немесе) учаскелерінің тізбелерін бекіту туралы» Қызылорда облысы әкімдігінің 2019 жылғы 5 ақпандағы № 1318 қаулысына өзгерістер енгізу туралы

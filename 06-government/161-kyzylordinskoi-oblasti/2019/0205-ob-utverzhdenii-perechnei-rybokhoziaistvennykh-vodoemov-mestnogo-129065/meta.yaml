act_code: '129065'
requisite: Постановление акимата Кызылординской области от 5 февраля 2019 года № 1318. Зарегистрировано Департаментом юстиции Кызылординской области 5 февраля 2019 года № 6674
title:
  rus: Об утверждении перечней рыбохозяйственных водоемов местного значения и рыбохозяйственных водоемов и (или) участков местного значения в разрезе водоемов и (или) участков для ведения промыслового рыболовства, любительского (спортивного) рыболовства, озерно-товарного рыбоводного хозяйства, садкового рыбоводного хозяйства
  kaz: Жергілікті маңызы бар балық шаруашылығы су айдындарының және кәсіпшілік балық аулауды, әуесқойлық (спорттық) балық аулауды, көлде тауарлы балық өсіру шаруашылығын, тор қоршамада балық өсіру шаруашылығын жүргізуге арналған су айдындары және (немесе) учаскелер бөлінісіндегі жергiлiктi маңызы бар балық шаруашылығы су айдындарының және (немесе) учаскелерінің тізбелерін бекіту туралы

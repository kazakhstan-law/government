    kaz: Қармақшы ауданы әкімдігінің 2019 жылғы 20 тамыздағы № 1002 «Қармақшы ауданы бойынша жалпыға ортақ пайдаланылатын аудандық маңызы бар автомобиль жолдарының тізбесін, атаулары мен индекстерін бекіту туралы» қаулысына өзгеріс енгізу туралы

act_code: '179266'
requisite: Постановление акимата Кызылординской области от 27 марта 2023 года № 48. Зарегистрировано Департаментом юстиции Кызылординской области 28 марта 2023 года № 8380-11
title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) по Кызылординской области на 2023 год
  kaz: Қызылорда облысы бойынша 2023 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы

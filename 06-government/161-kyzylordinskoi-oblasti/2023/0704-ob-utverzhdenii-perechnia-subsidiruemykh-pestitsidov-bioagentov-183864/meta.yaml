act_code: '183864'
requisite: Постановление акимата Кызылординской области от 4 июля 2023 года № 116. Зарегистрировано Департаментом юстиции Кызылординской области 12 июля 2023 года № 8442-11
title:
  rus: Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и нормы субсидий на 1 литр (килограмм, грамм, штук) пестицидов, биоагентов (энтомофагов), а также объемы бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) по Кызылординской области на 2023 год
  kaz: Қызылорда облысы бойынша 2023 жылға арналған субсидияланатын пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі және пестицидтердің, биоагенттердiң (энтомофагтардың) 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы

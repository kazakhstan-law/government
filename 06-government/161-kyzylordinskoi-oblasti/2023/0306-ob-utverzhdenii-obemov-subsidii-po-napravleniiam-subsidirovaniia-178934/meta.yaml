  title:
    rus: О внесении изменения в постановление акимата Кызылординской области от 6 марта 2023 года № 42 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, а также нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Кызылординской области на 2023 год»
    kaz: «Қызылорда облысы бойынша 2023 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, сондай-ақ ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттары және субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы» Қызылорда облысы әкімдігінің 2023 жылғы 6 наурыздағы № 42 қаулысына өзгеріс енгізу туралы

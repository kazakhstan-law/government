title:
  rus: Об установлении охранной зоны республиканского государственного учреждения «Барсакельмесский государственный природный заповедник» Комитета лесного хозяйства и животного мира Министерства экологии, геологии и природных ресурсов Республики Казахстан
  kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігі Орман шаруашылығы және жануарлар дүниесі комитетінің «Барсакелмес мемлекеттік табиғи қорығы» республикалық мемлекеттік мекемесінің күзет аймағын белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Кызылординской области от 16 июня 2014 года №613 «Об установлении охранной зоны Республиканского государственного учреждения «Барсакельмесский государственный природный заповедник» Министерства окружающей среды и водных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Қоршаған орта және су ресурстары министрлігінің «Барсакелмес мемлекеттік табиғи қорығы» республикалық мемлекеттік мекемесінің қорғау аймағын белгілеу туралы» Қызылорда облысы әкімдігінің 2014 жылғы 16 маусымдағы №613 қаулысына өзгерістер енгізу туралы

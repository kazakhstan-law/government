    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігінің «Барсакелмес мемлекеттік табиғи қорығы» республикалық мемлекеттік мекемесінің қорғау аймағын белгілеу туралы» Қызылорда облысы әкімдігінің 2014 жылғы 16 маусымдағы № 613 қаулысына өзгерістер енгізу туралы

    kaz: “Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы” Жалағаш ауданы әкімдігінің 2014 жылғы  10 сәуірдегі №103 қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении норм потребления коммунальных услуг по продаже тепловой энергии для потребителей, не имеющих приборов учета в Кызылординской области, в том числе приборов коммерческого учета
  kaz: Қызылорда облысында есептеу аспаптары жоқ тұтынушылар үшін коммерциялық есепке алу аспаптары жоқ тұтынушылар үшін жылу энергиясын сату бойынша коммуналдық қызметтерді тұтыну нормаларын бекіту туралы

requisite: ППостановление акимата города Кызылорда Кызылординской области от 11 января 2016 года № 4826
title:
  rus: О признании утратившим силу постановления акимата города Кызылорда от 09 июня 2015 года № 3630 "Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса "Б" местных исполнительных органов города Кызылорда"
  kaz: '"Қызылорда қаласы жергілікті атқарушы органдарының "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы" Қызылорда қаласы әкімдігінің 2015 жылғы 09 маусымдағы №3630 қаулысының күшін жою туралы'

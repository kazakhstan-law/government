requisite: Постановление Аральского районного акимата Кызылординской области от 18 января 2016 года N 7-қ. Зарегистрировано Департаментом юстиции Кызылординской области 22 февраля 2016 года N 5363. Утратило силу постановлением Аральского районного акимата Кызылординской области от 3 декабря 2019 года № 168-қ
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

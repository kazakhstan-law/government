  kaz: Акциялардың мемлекеттік пакеттері (жарғылық капиталдағы қатысу үлесі) облыстық коммуналдық меншіктегі акционерлік қоғамдардың, жауапкершілігі шектеулі серіктестіктердің дивидендтерінің (кірістерінің) көлемдерін белгілеу туралы

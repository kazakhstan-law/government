act_code: '47507'
requisite: Қызылорда облысы Шиелі ауданы әкімідігінің 2009 жылғы 15 шілдедегі N 591 қаулысы. Қызылорда облысының Әділет департаменті Шиелі ауданының әділет басқармасында 2009 жылы 24 тамызда N 10-9-92 тіркелді. Күші жойылды - Қызылорда облысы Шиелі ауданы әкімдігінің 2012 жылғы 20 қаңтардағы N 1790 қаулысымен
title:

act_code: '47506'
requisite: Қызылорда облысы Шиелі ауданы әкімдігінің 2009 жылғы 15 шілдедегі N 589 қаулысы. Қызылорда облысының Әділет департаменті Шиелі ауданының әділет басқармасында 2009 жылы 24 тамызда N 10-9-91 тіркелді. Күші жойылды - Қызылорда облысы Шиелі ауданы әкімдігінің 2011 жылғы 04 тамыздағы N 1546 қаулысымен
title:

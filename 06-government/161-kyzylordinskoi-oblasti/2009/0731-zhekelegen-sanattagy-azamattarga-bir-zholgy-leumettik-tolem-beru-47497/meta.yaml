requisite: Қызылорда облысы Қызылорда қаласы әкімдігінің 2009 жылғы 31 шілдедегі N 1587 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қаласының Әділет басқармасында 2009 жылы 27 тамызда N 10-1-114 тіркелді. Күші жойылды - Қызылорда қалалық әкiмдігінің 2012 жылғы 23 қарашадағы N 4929 Қаулысымен

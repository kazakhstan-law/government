title:
  rus: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алуға жұмсалатын шығынды өтеу үшін әлеуметтік көмек беру ережесін бекіту туралы

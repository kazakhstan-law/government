  requisite: Қызылорда облысы Сырдария ауданы әкімдігінің 2010 жылғы 29 маусымдағы N 229 қаулысы. Қызылорда облысының Әділет департаменті Сырдария ауданының Әділет басқармасында 2010 жылы 29 шілдеде N 10-8-124 тіркелді. Күші жойылды - Қызылорда облысы Сырдария ауданы әкімдігінің 2011 жылғы 25 шілдедегі N 310 қаулысымен

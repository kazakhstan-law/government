  requisite: Қызылорда облысы Сырдария ауданы әкімдігінің 2009 жылғы 26 тамыздағы N 427 қаулысы. Қызылорда облысының Әділет департаменті Сырдария ауданының әділет басқармасында 2009 жылғы 16 қыркүйекте N 10-8-100 тіркелді. Күші жойылды - Қызылорда облысы Сырдария ауданы әкімдігінің 2011 жылғы 25 шілдедегі N 310 қаулысымен

requisite: Қызылорда облысы Сырдария ауданы әкімдігінің 2009 жылғы 24 шілдедегі N 383 қаулысы. Қызылорда облысының Әділет департаменті Сырдария ауданының Әділет басқармасында 2009 жылғы 25 тамызда N 10-8-99 тіркелді. Күші жойылды - Қызылорда облысы Сырдария ауданы әкімдігінің 2014 жылғы 04 маусымдағы N 244 қаулысымен
title:

requisite: Постановление акимата Кызылординской области от 17 декабря 2024 года № 190. Зарегистрировано Департаментом юстиции Кызылординской области 17 декабря 2024 года № 8569-11.
title:
  rus: Об утверждении норматива субсидий, а также критерии получения субсидий, формы заявки и срок подачи заявки на удешевление стоимости затрат на корма поголовью сельскохозяйственных животных на 2024 год по Кызылординской области
  kaz: Қызылорда облысы бойынша 2024 жылға арналған ауыл шаруашылығы жануарлары басының азығына жұмсалатын шығындардың құнын арзандатуға субсидия нормативін, сондай-ақ субсидия алу өлшемшарттарын, өтінім нысанын және өтінім беру мерзімін бекіту туралы

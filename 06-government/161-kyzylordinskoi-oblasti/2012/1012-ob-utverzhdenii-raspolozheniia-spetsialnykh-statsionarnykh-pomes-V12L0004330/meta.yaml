    kaz: '"Діни әдебиеттерді және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту туралы" Қызылорда облысы әкімдігінің 2012 жылғы 12 қазандағы № 593 қаулысына толықтыру енгізу туралы'

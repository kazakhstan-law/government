requisite: Постановление Кызылординского областного акимата от 30 ноября 2012 года № 652. Зарегистрировано Департаментом юстиции Кызылординской области 11 января 2013 года за № 4391. Утратило силу постановлением Кызылординского областного акимата от 18 апреля 2013 года № 92
title:
  rus: Об утверждении регламента государственной услуги "Принятие местными исполнительными органами области решения по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
  kaz: '"Облыстың жергілікті атқарушы органдарының жануарлар дүниесін пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін  бекітіп беру мен аңшылық және балық шаруашылықтарының қажеттіліктері үшін сервитуттарды белгілеу жөнінде шешімдер қабылдауы" мемлекеттік қызмет көрсету регламентін бекіту туралы'

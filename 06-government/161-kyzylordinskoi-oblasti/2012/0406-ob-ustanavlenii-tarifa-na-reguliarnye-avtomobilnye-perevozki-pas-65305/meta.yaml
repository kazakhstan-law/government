  title:
    rus: О внесении изменений в постановление акимата города Кызылорда от 06 апреля 2012 года №3438 «Об установлении тарифа на регулярные автомобильные перевозки пассажиров и багажа в городе Кызылорда»
    kaz: «Қызылорда қаласында жолаушыларды және багажды тұрақты автомобильмен тасымалдау тарифiн белгiлеу туралы» Қызылорда қаласы әкімдігінің 2012 жылғы 06 сәуірдегі №3438 қаулысына өзгерістер енгізу туралы

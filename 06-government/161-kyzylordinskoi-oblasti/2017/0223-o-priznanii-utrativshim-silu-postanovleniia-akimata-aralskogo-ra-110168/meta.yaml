title:
  rus: О признании утратившим силу постановления акимата Аральского района от 31 марта 2016 года №59 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов Аральского района»
  kaz: «Арал ауданы жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Арал ауданы әкімдігінің 2016 жылғы 31 наурыздағы №59 қаулысының күшін жою туралы

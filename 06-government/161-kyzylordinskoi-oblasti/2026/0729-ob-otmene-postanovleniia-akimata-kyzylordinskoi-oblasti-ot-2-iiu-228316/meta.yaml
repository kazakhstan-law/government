title:
  rus: Об отмене постановления акимата Кызылординской области от 2 июня 2026 года № 103 «Об утверждении Правил поощрения, видов, а также размера денежного вознаграждения граждан, участвующих в профилактике правонарушений в Кызылординской области»
  kaz: «Қызылорда облысында құқық бұзушылық профилактикасына қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақы мөлшерін айқындау туралы» Қызылорда облысы әкімдігінің 2026 жылғы 2 маусымдағы № 103 қаулысын жою туралы

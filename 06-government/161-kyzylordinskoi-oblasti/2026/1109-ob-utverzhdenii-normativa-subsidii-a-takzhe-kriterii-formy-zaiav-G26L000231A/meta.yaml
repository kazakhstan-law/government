title:
  rus: Об утверждении норматива субсидии, а также критерии, формы заявки и срока подачи заявки на получение субсидии на удешевление стоимости затрат на корма поголовью сельскохозяйственных животных на 2026 год по Кызылординской области
  kaz: Қызылорда облысы бойынша 2026 жылға арналған ауыл шаруашылығы жануарлары басының азығына жұмсалатын шығындардың құнын арзандатуға субсидия нормативін, сондай-ақ өлшемшарттарын, субсидия алуға өтінім нысанын және өтінім беру мерзімін бекіту туралы

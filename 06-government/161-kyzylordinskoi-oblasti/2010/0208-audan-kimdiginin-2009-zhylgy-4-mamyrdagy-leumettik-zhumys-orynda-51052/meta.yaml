act_code: '51052'
requisite: Қызылорда облысы Арал қаласы әкімдігінің 2010 жылғы 08 ақпандағы  N 17 қаулысы. Қызылорда облысының Әділет департаменті Арал ауданының әділет басқармасында 2010 жылы 01 наурызда N 10-3-152 тіркелді. Күші жойылды - Қызылорда облысы Арал ауданы әкімдігінің 2011 жылғы 06 сәуірдегі N 38 Қаулысымен.

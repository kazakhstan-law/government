act_code: '51894'
requisite: Қызылорда облысы Қармақшы ауданы әкімдігінің 2010 жылғы 01 сәуірдегі N 853 қаулысы. Қызылорда облысының Әділет департаменті Қармақшы ауданының Әділет басқармасында 2010 жылы 19 сәуірде N 10-5-130 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды - (Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасының 2011 жылғы 24 тамыздағы N 2-9/2549 хатымен)

act_code: '54342'
requisite: Қызылорда облысы Жаңақорған ауданы әкімдігінің 2010 жылғы 12 шілдедегі N 773 қаулысы. Қызылорда облысының Әділет департаменті Жаңақорған аудандық Әділет басқармасында 2010 жылы 13 тамызда N 10-7-108 тіркелді. Күші жойылды - Қызылорда облысы Жаңақорған ауданы әкімдігінің 2013 жылғы 07 наурыздағы N 300 қаулысымен

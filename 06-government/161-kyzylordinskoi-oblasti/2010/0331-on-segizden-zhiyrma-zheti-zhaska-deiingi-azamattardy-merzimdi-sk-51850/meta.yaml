requisite: Қызылорда облысы Қызылорда қаласы әкімдігінің 2010 жылғы 31 наурыздағы N 2781 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2010 жылы 16 сәуірде N 10-1-134 тіркелді. Күші жойылды - Қызылорда қалалық әкiмдігінің 2012 жылғы 23 қарашадағы N 4929 Қаулысымен

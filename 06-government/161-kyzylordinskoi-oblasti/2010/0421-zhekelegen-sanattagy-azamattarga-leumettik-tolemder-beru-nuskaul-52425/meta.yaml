requisite: Қызылорда облысы Қармақшы аудандық әкімдігінің 2010 жылғы 21 сәуірдегі N 868 қаулысы. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2010 жылы 12 мамырда  N 10-5-138 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы ауданы әкімдігінің 2011 жылғы 18 сәуірдегі N 1178 қаулысымен

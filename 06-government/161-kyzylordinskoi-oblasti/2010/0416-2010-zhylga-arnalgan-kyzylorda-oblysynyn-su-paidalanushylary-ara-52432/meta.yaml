requisite: Қызылорда облысы әкімдігінің 2010 жылғы 16 сәуірдегі N 736 қаулысы. Қызылорда облысының Әділет департаментінде 2010 жылы 15 мамырда N 4250 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қызылорда облысы әкімі аппаратының 2011 жылғы 10 тамыздағы N 13-11/2962 хатымен)

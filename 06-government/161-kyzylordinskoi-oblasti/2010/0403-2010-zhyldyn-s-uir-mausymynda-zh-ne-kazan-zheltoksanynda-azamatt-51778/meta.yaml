requisite: Қызылорда облысы Сырдария ауданы әкімдігінің 2010 жылғы 03 сәуірдегі N 129 қаулысы. Қызылорда облысының Әділет департаменті Сырдария ауданының Әділет басқармасында 2010 жылы 14 сәуірде N 10-8-116 тіркелді. Күші жойылды - Қызылорда облысы Сырдария ауданы әкімдігінің 2011 жылғы 10 қаңтардағы N 9 қаулысымен

title:
  rus: Қызылорда облысы аумағында елді мекеннің құрамдас бөліктеріне атау беру және атауын қайта өзгерту тәртібін жүргізу жөніндегі қағидаларды, жер учаскелеріне, ғимараттарға және құрылыстарға реттік нөмірлер беру талаптарын бекіту туралы

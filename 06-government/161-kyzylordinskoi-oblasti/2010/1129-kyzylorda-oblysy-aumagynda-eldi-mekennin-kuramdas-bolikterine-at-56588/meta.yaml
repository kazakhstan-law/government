  title:
    rus: О внесении изменений в постановление акимата Кызылординской области от 29 ноября 2010 года N 949 "Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенного пункта, требования к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Кызылординской области"
    kaz: '"Қызылорда облысы аумағында елді мекеннің құрамдас бөліктеріне атау беру және атауын қайта өзгерту тәртібін жүргізу жөніндегі қағидаларды, жер учаскелеріне, ғимараттарға және құрылыстарға реттік нөмерлер беру талаптарын бекіту туралы" Қызылорда облысы әкімдігінің 2010 жылғы 29 қарашадағы N 949 қаулысына өзгерістер енгізу туралы'

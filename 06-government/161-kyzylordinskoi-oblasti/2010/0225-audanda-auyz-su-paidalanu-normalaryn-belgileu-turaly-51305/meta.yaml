act_code: '51305'
requisite: Қызылорда облысы Қармақшы ауданы әкімдігінің 2010 жылғы 25 ақпандағы N 804 қаулысы. Қызылорда облысының Әділет департаменті Қармақшы ауданының Әділет басқармасында 2010 жылы 15 наурызда N 10-5-126 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы ауданы әкімдігінің 2013 жылғы 07 наурыздағы N 15 қаулысымен

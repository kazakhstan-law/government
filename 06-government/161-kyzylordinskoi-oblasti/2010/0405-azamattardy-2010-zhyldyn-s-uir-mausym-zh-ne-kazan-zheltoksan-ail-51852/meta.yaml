requisite: Қызылорда облысы Жаңақорған ауданы әкімдігінің 2010 жылғы 05 сәуірдегі N 666 қаулысы. Қызылорда облысының Әділет департаменті Жаңақорған аудандық Әділет басқармасында 2010 жылы 12 сәуірде N 10-7-95 тіркелді. Күші жойылды - Қызылорда облысы Жаңақорған ауданы әкімдігінің 2011 жылғы 28 наурыздағы N 1027 қаулысымен

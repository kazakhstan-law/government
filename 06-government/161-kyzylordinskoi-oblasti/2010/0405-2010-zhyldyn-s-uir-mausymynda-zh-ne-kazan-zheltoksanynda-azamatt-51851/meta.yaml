requisite: Қызылорда облыстық әкімдігінің 2010 жылғы 05 сәуәрдегі N 718 қаулысы. Қызылорда облысының Әділет департаментінде 2010 жылы 16 сәуірде N 4244 тіркелді. Қолдану мерзімінің аяқталуына байланысты қаулының күші жойылды - Қызылорда облысы әкімі аппаратының 2011 жылғы 10 тамыздағы N 13-11/2962 Хатымен.

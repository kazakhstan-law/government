requisite: Қызылорда облысы Қармақшы ауданы әкімдігінің 2010 жылғы 09 ақпандағы N 794 қаулысы. Қызылорда облысының Әділет департаменті Қармақшы ауданының әділет басқармасында 2010 жылы 16 наурызда N 10-5-127 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы ауданы әкімдігінің 2011 жылғы 24 қаңтардағы N 1127 қаулысымен

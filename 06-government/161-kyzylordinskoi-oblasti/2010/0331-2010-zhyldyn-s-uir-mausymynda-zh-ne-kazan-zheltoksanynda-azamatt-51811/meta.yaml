requisite: Қызылорда облысы Арал ауданы әкімдігінің 2010 жылғы 31 наурыздағы N 44 қаулысы. Қызылорда облысының Әділет департаменті Арал ауданының Әділет басқармасында 2010 жылы 15 сәуірде N 10-3-157 тіркелді. Күші жойылды - Қызылорда облысы Арал ауданы әкімдігінің 2011 жылғы 11 ақпандағы N 14 Қаулысымен.

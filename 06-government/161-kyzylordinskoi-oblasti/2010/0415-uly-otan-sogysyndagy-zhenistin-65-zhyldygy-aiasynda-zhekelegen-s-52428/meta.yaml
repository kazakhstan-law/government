requisite: Қызылорда облысы Қызылорда қалалық әкімдігінің 2010 жылғы 15 сәуірдегі N 2854 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2010 жылы 13 мамырда N 10-1-141 тіркелді. Күші жойылды - Қызылорда қалалық әкiмдігінің 2012 жылғы 23 қарашадағы N 4929 қаулысымен

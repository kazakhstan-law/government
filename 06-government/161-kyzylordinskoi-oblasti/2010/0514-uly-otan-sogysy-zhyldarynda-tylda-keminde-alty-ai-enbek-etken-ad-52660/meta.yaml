requisite: Қызылорда облысы Жалағаш ауданы әкімдігінің 2010 жылғы 14 мамырдағы N 177 қаулысы. Қызылорда облысының Әділет департаменті Жалағаш ауданының әділет басқармасында 2010 жылы 24 мамырдағы N 10-6-160 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш ауданы әкімдігінің 2011 жылғы 31 қаңтардағы N 44 қаулысымен

act_code: '52067'
requisite: Қызылорда облысы Қармақшы ауданы әкімдігінің 2010 жылғы 21 сәуірдегі N 869 қаулысы. Қызылорда облысының Әділет департаменті Қармақшы ауданының әділет басқармасында 2010 жылы 26 сәуірде N 10-5-132 тіркелді. Күші жойылды - Қызылорда облысы Қармақшы ауданы әкімдігінің 2011 жылғы 18 сәуірдегі N 1178 Қаулысымен.
title:

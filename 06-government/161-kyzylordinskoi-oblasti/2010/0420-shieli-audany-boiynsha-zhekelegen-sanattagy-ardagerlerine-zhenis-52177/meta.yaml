requisite: Қызылорда облысы Шиелі ауданы әкімдігінің 2010 жылғы 20 сәуірдегі N 977 қаулысы. Қызылорда облысының Әділет департаменті Шиелі ауданының әділет басқармасында 2010 жылы 28 сәуірде N 10-8-117 тіркелді. Күші жойылды - Қызылорда облысы Шиелі ауданы әкімдігінің 2011 жылғы 18 қаңтардағы N 1315 қаулысымен

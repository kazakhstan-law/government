act_code: '51379'
requisite: Қызылорда облысы Шиелі ауданы әкімдігінің 2010 жылғы 15 ақпандағы N 856 қаулысы. Қызылорда облысының Әділет департаменті Шиелі ауданының әділет басқармасында 2010 жылы 17 наурызда N 10-8-110 тіркелді. Күші жойылды - Қызылорда облысы Шиелі ауданы әкімдігінің 2012 жылғы 04 мамырдағы N 1911 қаулысымен

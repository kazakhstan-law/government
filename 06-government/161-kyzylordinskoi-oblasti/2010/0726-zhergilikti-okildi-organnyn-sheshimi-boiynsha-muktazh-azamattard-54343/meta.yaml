requisite: Қызылорда облысы Қазалы ауданы әкімдігінің 2010 жылғы 26 шілдедегі N 215 қаулысы. Қызылорда облысының Әділет департаменті Қазалы ауданының Әділет басқармасында 2010 жылы 01 қыркүйекте N 10-4-126 тіркелді. Күші жойылды - Қызылорда облысы Қазалы ауданы әкімдігінің 2011 жылғы 04 ақпандағы N 52 Қаулысымен

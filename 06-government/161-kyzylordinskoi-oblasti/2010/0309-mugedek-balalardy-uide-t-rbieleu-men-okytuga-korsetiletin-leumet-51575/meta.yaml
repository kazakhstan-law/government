requisite: Қызылорда облысы Шиелі ауданы әкімдігінің 2010 жылғы 09 наурыздағы N 888 қаулысы. Қызылорда облысының Әділет департаменті Шиелі ауданының Әділет басқармасында 2010 жылы 01 сәуірде N 10-9-112 тіркелді. Күші жойылды - Қызылорда облысы Шиелі ауданы әкімдігінің 2013 жылғы 15 сәуірдегі N 77 қаулысымен

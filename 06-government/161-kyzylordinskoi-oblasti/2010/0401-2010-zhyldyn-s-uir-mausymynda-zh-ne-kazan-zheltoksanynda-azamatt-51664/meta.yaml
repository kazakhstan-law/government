requisite: Қызылорда облысы Жалағаш ауданы әкімдігінің 2010 жылғы 01 сәуірдегі N 103 қаулысы. Қызылорда облысының Әділет департаменті Жалағаш ауданының әділет басқармасында 2010 жылы 06 сәуірде N 10-6-146 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш ауданы әкімдігінің 2011 жылғы 28 наурыздағы N 82 қаулысымен

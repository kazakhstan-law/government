requisite: Қызылорда облысы Шиелі ауданы әкімдігінің 2010 жылғы 12 шілдедегі N 1085 қаулысы. Қызылорда облысының Әділет департаменті Шиелі ауданының Әділет басқармасында 2010 жылы 18 тамызда  N 10-9-128 тіркелді. Күші жойылды - Қызылорда облысы Шиелі ауданы әкімдігінің 2010 жылғы 27 қазандағы N 1188 қаулысымен

requisite: Қызылорда облысы Арал ауданы әкімдігінің  2010 жылғы 17 тамыздағы N 101 қаулысы.  Қызылорда облысының Әділет департаменті Арал ауданының Әділет басқармасында 2010 жылғы 20 қыркүйекте N 10-3-167 тіркелді. Күші жойылды - Қызылорда облысы Арал ауданы әкімдігінің 2014 жылғы 03 маусымдағы N 266-қ қаулысымен

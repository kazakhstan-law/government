act_code: '52315'
requisite: Қызылорда облысы Қармақшы аудандық әкімдігінің 2010 жылғы 01 сәуірдегі N 854 қаулысы. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2010 жылы 04 мамырда  N 10-5-135 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды - (Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасының 2011 жылғы 24 тамыздағы N 2-9/2549 хатымен)

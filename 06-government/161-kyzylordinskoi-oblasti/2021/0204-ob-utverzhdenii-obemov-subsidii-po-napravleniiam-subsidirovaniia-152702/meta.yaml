act_code: '152702'
requisite: Постановление акимата Кызылординской области от 4 февраля 2021 года № 198. Зарегистрировано Департаментом юстиции Кызылординской области 4 февраля 2021 года № 8140
title:
  rus: Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных на 2021 год
  kaz: 2021 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарын, субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы

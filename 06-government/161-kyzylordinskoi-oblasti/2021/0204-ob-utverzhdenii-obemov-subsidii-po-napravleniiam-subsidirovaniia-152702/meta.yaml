  requisite: Постановление акимата Кызылординской области от 8 декабря 2021 года № 434. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 декабря 2021 года № 25741
  title:
    rus: О внесении изменений в постановление акимата Кызылординской области от 4 февраля 2021 года № 198 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных на 2021 год»
    kaz: Қызылорда облысы әкімдігінің 2021 жылғы 4 ақпандағы № 198 «2021 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарын, субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161616/rus

  title:
    rus: О внесении изменений и дополнений в постановление акимата Кызылординской области от 4 февраля 2021 года № 198 «Об утверждении объемов субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства на 2021 год»
    kaz: Қызылорда облысы әкімдігінің 2021 жылғы 4 ақпандағы № 198 «2021 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау көлемдерін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

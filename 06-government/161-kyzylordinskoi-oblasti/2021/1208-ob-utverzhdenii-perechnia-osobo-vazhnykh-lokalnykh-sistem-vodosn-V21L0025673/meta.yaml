  requisite: Постановление акимата Кызылординской области от 26 ноября 2025 года № 222
  title:
    rus: Об утверждении перечня систем водоснабжения, стоимость услуг по подаче питьевой воды которых подлежит субсидированию, в соответствии с критериями включения систем водоснабжения населенных пунктов в перечень систем водоснабжения, стоимость услуг по подаче питьевой воды которых подлежит субсидированию
    kaz: Ауыз су беру бойынша көрсетілетін қызметтердің құны субсидиялауға жататын сумен жабдықтау жүйелерінің тізбесіне елді мекендердің сумен жабдықтау жүйелерін енгізудің өлшемшарттарына сәйкес ауыз су беру бойынша көрсетілетін қызметтердің құны субсидиялауға жататын сумен жабдықтау жүйелерінің тізбесін бекіту туралы

title:
  rus: «Об утверждении перечня особо важных локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения»
  kaz: «Ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды оқшау жүйелерінің тізбесін бекіту туралы»

act_code: '161387'
requisite: Постановление акимата Кызылординской области от 8 декабря 2021 года № 427. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 декабря 2021 года № 25650
title:
  rus: «Об утверждении перечня приоритетных культур и норм субсидии, а также объемов бюджетных средств на повышение урожайности и качества продукции растениеводства на 2021 год по Кызылординской области»
  kaz: «Қызылорда облысы бойынша 2021 жылға арналған басым дақылдар тiзбесін және субсидия нормаларын, сондай-ақ, өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджет қаражатының көлемін бекіту туралы»

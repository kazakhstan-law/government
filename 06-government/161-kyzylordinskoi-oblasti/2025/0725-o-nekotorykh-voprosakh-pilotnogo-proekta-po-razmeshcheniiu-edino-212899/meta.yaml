  kaz: Көрсетілетін қызметті алушылар бойынша дербестендірілген қаржыландыруды ескере отырып, балаларға арналған қосымша білім беруге бірыңғай мемлекеттік тапсырысты (шығармашылық және спорттық тапсырыстар, қосымша білім беруге білім беру тапсырысы) орналастыру жөніндегі пилоттық жобаның кейбір мәселелері туралы

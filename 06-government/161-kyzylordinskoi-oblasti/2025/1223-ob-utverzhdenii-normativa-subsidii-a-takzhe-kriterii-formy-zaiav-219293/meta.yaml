act_code: '219293'
requisite: Постановление акимата Кызылординской области от 23 декабря 2025 года № 241
title:
  rus: Об утверждении норматива субсидий, а также критерии, формы заявки и срок подачи заявки на удешевление стоимости затрат на корма поголовью сельскохозяйственных животных на 2025 год по Кызылординской области
  kaz: Қызылорда облысы бойынша 2025 жылға арналған ауыл шаруашылығы жануарлары басының азығына жұмсалатын шығындардың құнын арзандатуға субсидия нормативін, сондай-ақ өлшемшарттарын, өтінім нысанын және өтінім беру мерзімін бекіту туралы

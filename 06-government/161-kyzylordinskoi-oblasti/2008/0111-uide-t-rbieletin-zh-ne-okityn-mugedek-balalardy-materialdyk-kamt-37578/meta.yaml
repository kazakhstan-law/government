act_code: '37578'
requisite: Қызылорда облысы Арал аудандық әкімдігінің 2008 жылғы 11 қаңтардағы N 12 қаулысы. Қызылорда облысының Әділет департаменті Арал ауданының Әділет басқармасында 2008 жылғы 30 қаңтарда N 10-3-114 тіркелді. Күші жойылды - Қызылорда облысы Арал аудандық әкімдігінің 2012 жылғы 16 сәуірдегі N 96 қаулысымен

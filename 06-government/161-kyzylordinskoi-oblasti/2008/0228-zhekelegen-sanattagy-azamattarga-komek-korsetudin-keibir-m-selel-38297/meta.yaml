requisite: Қызылорда облысы Қызылорда қалалық әкімдігінің 2008 жылғы 28 ақпандағы N 1964 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 11 наурызда N 10-1-83 тіркелді. Күші жойылды - Қызылорда қалалық әкiмдігінің 2012 жылғы 23 қарашадағы N 4929 қаулысымен

act_code: '41253'
requisite: Қызылорда облысы Арал ауданы әкімдігінің 2008 жылғы 26 мамырдағы N 122 қаулысы. Қызылорда облысының Әділет департаменті Арал аудандық Әділет басқармасында 2008 жылғы 20 маусымда N 10-3-121 тіркелді. Күші жойылды - Қызылорда облысы Арал ауданы әкімдігінің 2011 жылғы 25 шілдедегі N 86 қаулысымен
title:

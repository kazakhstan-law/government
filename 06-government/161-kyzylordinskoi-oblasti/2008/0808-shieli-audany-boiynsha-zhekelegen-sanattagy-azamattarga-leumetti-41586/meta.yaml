requisite: Қызылорда облысы Шиелі ауданы әкімиятының 2008 жылғы 08 тамыздағы N 180 қаулысы. Қызылорда облысының Әділет департаменті Шиелі аудандық Әділет басқармасында 2008 жылы 19 қыркүйекте N 10-9-62 тіркелді. Күші жойылды - Қызылорда облысы Шиелі ауданы әкімдігінің 2010 жылғы 28 қаңтардағы N 1322 қаулысымен

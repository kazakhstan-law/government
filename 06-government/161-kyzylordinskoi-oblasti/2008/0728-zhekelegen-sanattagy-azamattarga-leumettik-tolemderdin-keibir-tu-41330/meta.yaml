requisite: Қызылорда облысы Жалағаш ауданы әкімдігінің 2008 жылғы 28 шілдедегі N 547 қаулысы. Қызылорда облысының Әділет департаменті Жалағаш аудандық Әділет басқармасында 2008 жылғы 22 тамызда N 10-6-99 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш ауданы әкімдігінің 2011 жылғы 04 шілдедегі N 222 қаулысымен

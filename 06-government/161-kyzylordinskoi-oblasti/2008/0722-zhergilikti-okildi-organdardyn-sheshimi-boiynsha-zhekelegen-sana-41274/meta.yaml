requisite: Қызылорда облысы Қазалы ауданы әкімдігінің 2008 жылғы 22 шілдедегі N 224 қаулысы. Қызылорда облысының Әділет департаменті Қазалы аудандық Әділет басқармасында 2008 жылы 22 тамызда N 10-4-84 тіркелді. Күші жойылды - Қызылорда облысы Қазалы ауданы әкімдігінің 2013 жылғы 04 наурыздағы N 18 қаулысымен

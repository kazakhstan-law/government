requisite: Қызылорда облысы Арал ауданы әкімдігінің 2008 жылғы 6 мамырдағы N 118 қаулысы. Қызылорда облысының Әділет департаменті Арал ауданының Әділет басқармасында 2008 жылғы 5 маусымда N 10-3-120 тіркелді. Күші жойылды - Қызылорда облысы Арал ауданы әкімдігінің 2010 жылғы 09 наурыздағы N 30 қаулысымен

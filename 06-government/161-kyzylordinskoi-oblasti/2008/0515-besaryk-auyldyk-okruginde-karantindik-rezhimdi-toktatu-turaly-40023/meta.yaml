act_code: '40023'
requisite: Қызылорда облысы Cырдария ауданы әкімдігінің 2008 жылғы 15 мамырдағы N 280 қаулысы. Қызылорда облысының Әділет департаменті Сырдария аудандық Әділет басқармасында 2008 жылғы 12 маусымда N 10-8-68 тіркелді. Күші жойылды - Қызылорда облысы Сырдария ауданы әкімдігінің 2010 жылғы 12 ақпандағы N 52 қаулысымен

requisite: Қызылорда облысы Сырдария ауданы әкімдігінің 2008 жылғы 24 қарашадағы N 616 қаулысы. Қызылорда облысының Әділет департаменті Сырдария аудандық Әділет басқармасында 2008 жылы 11 желтоқсанда N 10-8-78 тіркелді. Күші жойылды - Қызылорда облысы Сырдария ауданы әкімдігінің 2010 жылғы 12 ақпандағы N 52 қаулысымен

requisite: Қызылорда облыстық әкімдігінің 2008 жылғы 26 қарашадағы N 162 қаулысы. Қызылорда облысының Әділет департаментінде 2008 жылғы 24 желтоқсанда N 4215 тіркелді. Күші жойылды - Қызылорда облысының Әділет Департаментінің 2009 жылғы 11 тамыздағы N 2/5977 хатымен.

act_code: '42903'
requisite: Қызылорда облысы Жаңақорған ауданы әкімдігінің 2008 жылғы 03 желтоқсандағы N 22 қаулысы. Қызылорда облысының Әділет департаменті Жаңақорған аудандық Әділет басқармасында 2008 жылы 24 желтоқсанда N 10-7-65 тіркелді. Күші жойылды - Қызылорда облысы Жаңақорған ауданы әкімдігінің 2012 жылғы 13 желтоқсандағы N 242 қаулысымен
title:

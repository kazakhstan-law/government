act_code: '42746'
requisite: Қызылорда облысы Сырдария ауданы әкімдігінің 2008 жылғы 24 қарашадағы N 617 қаулысы. Қызылорда облысының Әділет департаменті Сырдария аудандық Әділет басқармасында 2008 жылы 12 желтоқсанда N 10-8-79 тіркелді. Күші жойылды - Сырдария ауданы әкімдігінің 2009 жылғы 11 қарашадағы N 566 қаулысымен

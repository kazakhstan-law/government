act_code: '41329'
requisite: Қызылорда облысы Жалағаш ауданы әкімдігінің 2008 жылғы 11 тамыздағы N 555 қаулысы. Қызылорда облысының Әділет департаменті Жалағаш аудандық Әділет басқармасында 2008 жылы 22 тамызда N 10-6-98 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш ауданы әкімдігінің 2011 жылғы 26 шілдедегі N 248 қаулысымен

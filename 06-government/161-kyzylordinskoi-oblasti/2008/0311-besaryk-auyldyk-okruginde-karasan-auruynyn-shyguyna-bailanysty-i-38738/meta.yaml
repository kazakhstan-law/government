requisite: Қызылорда облысы Сырдария ауданы әкімдігінің 2008 жылғы 11 наурыздағы N 149 қаулысы. Қызылорда облысының Әділет департаменті Сырдария ауданының әділет басқармасында 2008 жылы 07 сәуірде N 10-8-64 тіркелді. Күші жойылды - Қызылорда облысы Cырдария ауданы әкімдігінің 2008 жылғы 15 мамырдағы N 280 қаулысымен

act_code: '42392'
requisite: Қызылорда облысы Қызылорда қалалық әкімдігінің 2008 жылғы 17 қарашадағы N 592 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 24 қарашада N 10-1-96 тіркелді. Күші жойылды - Қызылорда қалалық әкiмдігінің 2012 жылғы 23 қарашадағы N 4929 қаулысымен

requisite: "Қызылорда облысы әкімдігінің 2008 жылғы 2 сәуірдегі N 461 қаулысы.\r\nҚызылорда облысының Әділет департаментінде 2008 жылы 16 сәуірде N 4203 тіркелді. Күші жойылды - Қызылорда облысы әкімдігінің 2010 жылғы 23 сәуірдегі N 377 Қаулысымен."

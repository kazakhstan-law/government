requisite: Қызылорда облыстық әкімдігінің 2008 жылғы 31 қазандағы N 140 қаулысы. Қызылорда облысының Әділет департаментінде 2008 жылы 24 қарашада N 4212 тіркелді. Күші жойылды - Қызылорда облысының Әділет Департаментінің 2009 жылғы 11 тамыздағы N 2/5977 хатымен.

act_code: '42718'
requisite: Қызылорда облысы Қызылорда қаласы әкімдігінің 2008 жылғы 04 желтоқсандағы N 624 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 12 желтоқсанда N 10-1-99 тіркелді. Күші жойылды - Қызылорда қалалық әкiмдігінің 2012 жылғы 23 қарашадағы N 4929 қаулысымен

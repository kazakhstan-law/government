requisite: Қызылорда облысы Жалағаш ауданы әкімдігінің 2008 жылғы 11 наурыздағы N 415 қаулысы. Қызылорда облысының Әділет департаменті Жалағаш аудандық Әділет басқармасында 2008 жылғы 14 сәуірде N 10-6-90 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш ауданы әкімдігінің 2011 жылғы 12 шілдедегі N 232 қаулысымен

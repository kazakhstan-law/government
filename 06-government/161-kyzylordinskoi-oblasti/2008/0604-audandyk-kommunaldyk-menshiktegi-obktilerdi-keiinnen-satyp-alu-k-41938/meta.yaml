act_code: '41938'
requisite: Қызылорда облысы Жалағаш ауданы әкімдігінің 2008 жылғы 04 маусымдағы N 494 қаулысы. Қызылорда облысының Әділет департаменті Жалағаш аудандық Әділет басқармасында 2008 жылы 03 шілдеде N 10-6-95 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш ауданы әкімдігінің 2011 жылғы 04 шілдедегі N 222 қаулысымен

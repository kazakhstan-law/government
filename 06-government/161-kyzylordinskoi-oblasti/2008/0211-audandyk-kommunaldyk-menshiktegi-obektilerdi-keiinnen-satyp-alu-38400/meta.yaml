act_code: '38400'
requisite: Қызылорда облысы Қазалы ауданы әкімдігінің 2008 жылғы 11 ақпандағы N 71 қаулысы. Қызылорда облысының Әділет департаменті Қазалы аудандық Әділет басқармасында 2008 жылы 15 наурызда N 10-4-78 тіркелді. Күші жойылды - Күші жойылды - Қызылорда облысы Қазалы ауданы әкімдігінің 2011 жылғы 02 тамыздағы N 218 Қаулысымен.
title:

requisite: Қызылорда облысы Жалағаш ауданы әкімдігінің 2008 жылғы 17 қарашадағы N 659 қаулысы. Қызылорда облысының Әділет департаменті Жалағаш аудандық Әділет басқармасында 2008 жылғы 12 желтоқсанда N 10-6-109 тіркелді. Күші жойылды - Қызылорда облысы Жалағаш ауданы әкімдігінің 2010 жылғы 30 наурыздағы N 99 қаулысымен

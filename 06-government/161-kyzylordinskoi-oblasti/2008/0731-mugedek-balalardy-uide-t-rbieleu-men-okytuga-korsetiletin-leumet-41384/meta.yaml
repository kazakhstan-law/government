requisite: Қызылорда облысы Cырдария ауданы әкімдігінің 2008 жылғы 31 шілдедегі N 427 қаулысы. Қызылорда облысының Әділет департаменті Сырдария аудандық Әділет басқармасында 2008 жылы 02 қыркүйекте N 10-8-72 тіркелді. Күші жойылды - Қызылорда облысы Cырдария ауданы әкімдігінің 2012 жылғы 13 наурыздағы N 102 қаулысымен

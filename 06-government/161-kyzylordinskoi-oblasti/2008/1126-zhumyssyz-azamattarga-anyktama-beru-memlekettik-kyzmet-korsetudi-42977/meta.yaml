requisite: Қызылорда облысы әкімдігінің 2008 жылғы 26 қарашадағы N 161 қаулысы. Қызылорда облысының Әділет департаментінде 2008 жылы 24 желтоқсанда N 4214 тіркелді. Күші жойылды - Қызылорда облысының Әділет Департаментінің 2009 жылғы 11 тамыздағы N 2/5977 хатымен.

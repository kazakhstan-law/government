requisite: Қызылорда облысы Арал ауданы әкімдігінің 2008 жылғы 13 қарашадағы N 250 қаулысы. Қызылорда облысының Әділет департаменті Арал аудандық Әділет басқармасында 2008 жылы 15 желтоқсанда N 10-3-127 тіркелді. Күші жойылды - Қызылорда облысы Арал ауданы әкімдігінің 2010 жылғы 17 ақпандағы N 8 қаулысымен

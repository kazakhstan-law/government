act_code: '39638'
requisite: Қызылорда облысы Қармақшы ауданы әкімдігінің 2008 жылғы 11 сәуірдегі N 280 қаулысы. Қызылорда облысының Әділет департаменті Қармақшы аудандық Әділет басқармасында 2008 жылы 14 мамырда 10-5-91 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды - (Қызылорда облысының Әділет департаменті Қармақшы ауданының Әділет басқармасының 2011 жылғы 24 тамыздағы N 2-9/2549 хатымен)

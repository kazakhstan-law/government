act_code: '38298'
requisite: Қызылорда облысы Қызылорда қалалық әкімдігінің 2008 жылғы 26 ақпандағы N 1962 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 11 наурызда N 10-1-84 тіркелді. Күші жойылды - Қызылорда облысы Қызылорда қалалық әкімдігінің 2009 жылғы 17 наурыздағы N 1149 қаулысымен
title:

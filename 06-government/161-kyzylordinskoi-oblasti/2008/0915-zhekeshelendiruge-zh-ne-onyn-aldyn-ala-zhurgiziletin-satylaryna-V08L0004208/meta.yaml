requisite: Қызылорда облысы әкімдігінің 2008 жылғы 15 қыркүйектегі N 99 қаулысы. Қызылорда облысының Әділет департаментінде 2008 жылғы 14 қазанда N 4208 тіркелді. Күші жойылды - Қызылорда облысы әкімдігінің 2011 жылғы 16 тамыздағы N 113 Қаулысымен.

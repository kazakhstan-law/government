act_code: '42760'
requisite: Қызылорда облысы Қазалы ауданы әкімдігінің 2008 жылғы 21 қарашадағы N 295 қаулысы. Қызылорда облысының Әділет департаменті Қазалы аудандық Әділет басқармасында 2008 жылғы 18 желтоқсанда N 10-4-86 тіркелді. Күші жойылды - Қызылорда облысы Қазалы ауданы әкімдігінің 2009 жылғы 05 қазандағы N 210 Қаулысымен

requisite: Қызылорда облысы Қызылорда қалалық әкімдігінің 2008 жылғы 02 желтоқсандағы N 620 қаулысы. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2008 жылы 12 желтоқсанда N 10-1-100 тіркелді. Күші жойылды - Қызылорда облысы Қызылорда қалалық әкімдігінің 2013 жылғы 01 ақпандағы N 5609 қаулысымен

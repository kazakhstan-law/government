  title:
    rus: О внесении изменений в постановление акимата Жалагашского района от 22 мая 2015 года № 99 "Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса "Б" акимата Жалагашского района"
    kaz: Жалағаш ауданы әкімдігінің "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы" Жалағаш ауданы әкімдігінің 2015 жылғы 22 мамырдағы № 99 қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса “Б” местных исполнительных органов Жалагашского района
  kaz: Жалағаш ауданы жергілікті атқарушы органдарының “Б” корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

act_code: '94765'
requisite: Постановление акимата города Кызылорда Кызылординской области от 15 октября 2015 года N 4461
title:
  rus: О признании утратившим силу постановление акимата города Кызылорда от 15 мая 2015 года № 3422 об утверждении схемы и порядок перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах города Кызылорда
  kaz: '"Қызылорда қаласының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы" Қызылорда қаласы әкімдігінің 2015 жылғы 15 мамырдағы № 3422 қаулысының күшін жою туралы'

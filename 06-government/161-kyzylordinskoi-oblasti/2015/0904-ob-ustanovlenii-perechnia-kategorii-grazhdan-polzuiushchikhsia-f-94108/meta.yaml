requisite: Постановление Аральского районного акимата Кызылординской области от 04 сентября 2015 года N 231-қ. Зарегистрировано Департаментом юстиции Кызылординской области 30 сентября 2015 года N 5154. Утратило силу постановлением акимата Аральского района Кызылординской области от 28 июня 2018 года № 351-қ
title:
  rus: Об установлении перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а также размеров льгот
  kaz: Мүгедектерді қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы

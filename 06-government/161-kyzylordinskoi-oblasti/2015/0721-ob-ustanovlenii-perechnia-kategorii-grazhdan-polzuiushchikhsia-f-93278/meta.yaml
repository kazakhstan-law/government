  title:
    rus: О внесении изменении в постановление акимата Казалинского района от 21 июля 2015 года № 188 «Об установлении перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а также размеров льгот по Казалинскому району»
    kaz: «Қазалы ауданы бойынша мүгедектерді қоспағанда, дене шынықтыру - сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы» Қазалы ауданы әкімдігінің 2015 жылғы 21 шілдедегі №188 қаулысына өзгерістер енгізу туралы

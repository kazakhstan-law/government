act_code: '93278'
requisite: Постановление Казалинского районного акимата Кызылординской области от 21 июля 2015 года N 188. Зарегистрировано Департаментом юстиции Кызылординской области 18 августа 2015 года N 5105
title:
  rus: Об установлении перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размер льгот по Казалинскому району
  kaz: Қазалы ауданы бойынша мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру көрсетілетін қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктердің мөлшерін белгілеу туралы

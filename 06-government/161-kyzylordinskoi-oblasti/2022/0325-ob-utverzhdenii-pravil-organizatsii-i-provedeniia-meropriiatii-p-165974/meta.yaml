  title:
    rus: О внесении изменений в постановление акимата Жалагашского района Кызылординской области от 25 марта 2022 года № 65 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жалагашскому району»
    kaz: «Жалағаш ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Қызылорда облысы Жалағаш ауданы әкімдігінің 2022 жылғы 25 наурыздағы № 65 қаулысына өзгерістер енгізу туралы

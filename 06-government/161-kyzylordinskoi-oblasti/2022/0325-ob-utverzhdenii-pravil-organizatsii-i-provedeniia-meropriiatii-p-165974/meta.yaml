requisite: Постановление акимата Жалагашского района Кызылординской области от 25 марта 2022 года № 65. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2022 года № 27359
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жалагашскому району
  kaz: Жалағаш ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

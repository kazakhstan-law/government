  title:
    rus: О внесении изменения и дополнения в постановление акимата Кызылординской области от 13 июня 2022 года № 570 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) по Кызылординской области на 2022 год
    kaz: Қызылорда облысы әкімдігінің 2022 жылғы 13 маусымдағы № 570 «Қызылорда облысы бойынша 2022 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» қаулысына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/174152/rus

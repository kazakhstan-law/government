  title:
    rus: О внесении изменения к постановление акимата Жанакорганского района от 15 декабря 2022 года № 836 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов Жанакорганского района»
    kaz: Жаңақорған ауданы әкімдігінің 2022 жылғы 15 желтоқсандағы «Жаңақорған ауданының жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» № 836 қаулысына өзгеріс енгізу туралы

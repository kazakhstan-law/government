  title:
    rus: О внесении изменений в постановление акимата Жанакорганского района от 22 августа 2022 года № 732 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жанакорганскому району»
    kaz: Жаңақорған ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Жаңақорған ауданы әкімдігінің 2022 жылғы 22 тамыздағы № 732 қаулысына өзгерістер енгізу туралы

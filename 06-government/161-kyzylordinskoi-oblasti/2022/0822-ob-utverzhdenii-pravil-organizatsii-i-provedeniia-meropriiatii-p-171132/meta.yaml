act_code: '171132'
requisite: Постановление акимата Жанакорганского района Кызылординской области от 22 августа 2022 года № 732. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 августа 2022 года № 29283
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жанакорганскому району
  kaz: Жаңақорған ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы

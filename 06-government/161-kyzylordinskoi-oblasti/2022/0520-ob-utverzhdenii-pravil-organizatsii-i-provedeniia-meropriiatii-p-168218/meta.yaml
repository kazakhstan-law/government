title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту реконструкции наружных стен, крыш многоквартирных жилых домов, направленных на придание единого архитектурного облика поселку Теренозек
  kaz: Тереңөзек кентіне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

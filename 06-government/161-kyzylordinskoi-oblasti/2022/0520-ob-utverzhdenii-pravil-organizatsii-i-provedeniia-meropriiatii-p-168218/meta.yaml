  title:
    rus: О внесении изменений в постановление акимата Сырдарьинского района от 20 мая 2022 года №164 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, крыш многоквартирных жилых домов, направленных на придание единому архитектурному облику поселка Теренозек»
    kaz: «Тереңөзек кентіне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Сырдария ауданы әкімдігінің 2022 жылғы 20 мамырдағы №164 қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении перечня приоритетных культур и норм субсидий, а также объемов бюджетных средств на повышение урожайности и качества продукции растениеводства на 2022 год по Кызылординской области
  kaz: Қызылорда облысы бойынша 2022 жылға арналған басым дақылдар тiзбесін және субсидия нормаларын, сондай-ақ, өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджет қаражатының көлемін бекіту туралы

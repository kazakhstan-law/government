act_code: '167234'
requisite: Постановление Кармакшинского районного акимата Кызылординской области от 25 апреля 2022 года № 22. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 апреля 2022 года № 27822
title:
  rus: Об утверждении Правил организации и проведения мероприятий потекущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Кармакшинского района
  kaz: Қармақшы ауданына бірыңғай сәулеттік келбет беруге бағытталған,көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

requisite: Постановление Аральского районного акимата Кызылординской области от 11 марта 2022 года № 33-қ. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 марта 2022 года № 27196
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту реконструкции наружных стен, крыш многоквартирных жилых домов, направленных на придание единого архитектурного облика Аральскому району
  kaz: Арал ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау ағымдағы немесе күрделі жөндеу жөніндегі іс- шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

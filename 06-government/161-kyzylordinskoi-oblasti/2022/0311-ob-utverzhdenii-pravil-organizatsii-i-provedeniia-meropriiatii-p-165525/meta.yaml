  title:
    rus: О внесении изменений в постановление акимата Аральского района от 11 марта 2022 года № 33-қ «Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Аральскому району»
    kaz: «Арал ауданына бірыңғай сәулеттік  келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Арал ауданы әкімдігінің 2022 жылғы 11 наурыздағы № 33-қ қаулысына өзгерістер енгізу туралы

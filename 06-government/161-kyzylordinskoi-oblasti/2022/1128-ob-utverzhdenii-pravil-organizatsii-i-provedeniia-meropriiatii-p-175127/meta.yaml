act_code: '175127'
requisite: Постановление акимата города Кызылорда Кызылординской области от 28 ноября 2022 года № 1361. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 декабря 2022 года № 30962
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Кызылорда
  kaz: Қызылорда қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы

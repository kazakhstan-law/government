act_code: '168223'
requisite: Постановление Шиелийского районного акимата Кызылординской области от 23 мая 2022 года № 212. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 мая 2022 года № 28215
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика району Шиели
  kaz: Шиелі ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

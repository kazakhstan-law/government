  code: '219974'
  requisite: Постановление акимата Шиелийского района Кызылординской области от 17 декабря 2025 года № 313
  title:
    rus: О внесении изменений в постановление акимата Шиелийского района от 23 мая 2022 года №212 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Шиелийскому району»
    kaz: «Шиелі ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Шиелі ауданы әкімдігінің 2022 жылғы 23 мамырдағы №212 қаулысына өзгерістер енгізу туралы

act_code: '168027'
requisite: Постановление акимата Кызылординской области от 17 мая 2022 года № 558. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 мая 2022 года № 28110
title:
  rus: Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, а также нормативов субсидий критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Кызылординской области на 2022 год
  kaz: Қызылорда облысы бойынша 2022 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, сондай-ақ ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттары және субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы

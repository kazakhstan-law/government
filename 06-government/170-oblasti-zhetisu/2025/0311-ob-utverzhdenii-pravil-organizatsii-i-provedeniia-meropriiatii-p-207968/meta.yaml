requisite: Постановление акимата Кербулакского района области Жетісу от 11 марта 2025 года № 126. Зарегистрировано Департаментом юстиции области Жетісу от 12 марта 2025 года № 281-19
title:
  rus: Об утверждении правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Кербулакского района
  kaz: Кербұлақ ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

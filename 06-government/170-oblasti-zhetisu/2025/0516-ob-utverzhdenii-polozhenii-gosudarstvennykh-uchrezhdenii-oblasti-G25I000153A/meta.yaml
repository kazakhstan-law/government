  title:
    rus: О внесения изменения в постановление акимата области Жетісу от 15 октября 2025 года № 336 «Об утверждении Положения государственного учреждения «Управление туризма области Жетісу» и внесения изменения в постановление акимата области Жетісу от 16 мая 2025 года № 153 «Об утверждении положений государственных учреждений области Жетісу»
    kaz: «Жетісу облысының туризм басқармасы» мемлекеттік мекемесінің ережесін бекіту және «Жетісу облысы мемлекеттік мекемелерінің ережелерін бекіту туралы» Жетісу облысы әкімдігінің 2025 жылғы 16 мамырдағы № 153 қаулысына өзгеріс енгізу туралы» Жетісу облысы әкімдігінің 2025 жылғы 15 қазандағы № 336 қаулысына өзгеріс енгізу туралы

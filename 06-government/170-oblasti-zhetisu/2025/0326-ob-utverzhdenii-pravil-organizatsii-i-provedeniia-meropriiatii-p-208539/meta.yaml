act_code: '208539'
requisite: Постановление акимата Ескельдинского района области Жетісу от 26 марта 2025 года № 88. Зарегистрировано Департаментом юстиции области Жетісу от 27 марта 2025 года № 285-19
title:
  rus: Об утверждении правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Ескельдинского района
  kaz: Ескелді ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Ескельдинского района от 26 марта 2025 года № 88 «Об утверждении правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Ескельдинского района»
    kaz: «Ескелді ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Ескелді ауданы әкімдігінің 2025 жылғы 26 наурыздағы № 88 қаулысына өзгерістер енгізу туралы

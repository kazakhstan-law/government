title:
  rus: О признании утратившим силу постановления акимата Сарканского района от 04 октября 2021 года «Об утверждении правил расчетов прогнозных объемов доходов и затрат бюджетов городов районного значения, сел, поселков, сельских округов» № 278
  kaz: Сарқан ауданы әкімдігінің 2021 жылғы 04 қазандағы «Аудандық маңызы бар қалалар, ауылдар, кенттер, ауылдық округтер бюджеттерінің кipicтepi мен шығындарының болжамды көлемін есептеу қағидасын бекіту туралы» № 278 қаулысының күшін жою туралы

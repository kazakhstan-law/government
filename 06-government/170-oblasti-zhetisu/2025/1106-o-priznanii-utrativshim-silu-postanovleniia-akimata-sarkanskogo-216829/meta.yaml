act_code: '216829'
requisite: Постановление акимата Сарканского района области Жетісу от 6 ноября 2025 года № 380
title:
  rus: О признании утратившим силу постановления акимата Сарканского района от 29 сентября 2023 года № 340 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащимии работающих в сельской местности»
  kaz: Сарқан ауданы әкімдігінің 2023 жылғы 29 қыркүйектегі «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн жиырма бес пайызға жоғарылатылған ауазымдық айлыақылар мен тарифтік мөлшемелерді алуға құқығы бар әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» № 340 қаулысының күшін жою туралы

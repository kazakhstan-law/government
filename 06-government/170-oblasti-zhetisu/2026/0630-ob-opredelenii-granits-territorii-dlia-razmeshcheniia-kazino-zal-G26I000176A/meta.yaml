title:
  rus: Об определении границ территорий для размещения казино, залов игровых автоматов, букмекерских контор и тотализаторов (касс букмекерских контор и (или) тотализаторов) на побережье озера Алаколь области Жетісу
  kaz: Жетісу облысы Алакөл көлінің жағалауында  казино, ойын автоматтары залдарын, букмекерлік кеңселер мен тотализаторларды (букмекерлік кеңселердің және (немесе) тотализаторлардың кассаларын) орналастыруға арналған аумақтардың шекараларын айқындау туралы

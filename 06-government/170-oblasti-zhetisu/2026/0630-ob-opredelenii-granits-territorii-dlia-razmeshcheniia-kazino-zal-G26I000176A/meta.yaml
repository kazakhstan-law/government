  requisite: Постановление акимата области Жетісу от 22 октября 2026 года № 282
  title:
    rus: Об определении границ территорий для размещения казино и залов игровых автоматов, в которые допускаются только иностранные граждане, лица без гражданства, работники игорного заведения и иные лица, находящиеся в игорном заведении в связи с выполнением трудовых (служебных) обязанностей в области Жетісу
    kaz: Жетісу облысында шетел азаматтарының, азаматтығы жоқ адамдардың, ойын мекемесінің жұмыскерлерінің және еңбек (қызметтік) міндеттерін орындаумен байланысты ойын мекемесінде болатын өзге де адамдардың ғана кіруіне жол берілетін казино мен ойын автоматтары залдарын орналастыру үшін аумақтардың шекараларын айқындау туралы

requisite: Постановление акимата города Талдыкорган области Жетісу от 19 марта 2026 года № 255
title:
  rus: Об утверждении Правил обеспечения возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирных жилых домов в городе Талдыкорган
  kaz: Талдықорған қаласы бойынша пәтерлер, тұрғын емес үй-жайлар меншік иелерінің көппәтерлі тұрғын үйде лифтілерді жөндеуге және ауыстыруға, күрделі жөндеуге байланысты ақшаны қайтаруын қамтамасыз ету қағидаларын бекіту туралы

title:
  rus: Об утверждении правил обеспечения возвратности денег собственниками квартир, нежилых помещений, парковочных мест, кладовок, связанных с ремонтом и заменой лифтов, капитальным ремонтом общего имущества объекта кондоминиума по Алакольскому району
  kaz: Алакөл ауданы бойынша пәтерлер, тұрғын емес үй-жайлар, орынтұрақ орындары, қоймалар меншік иелерінің лифтілерді жөндеуге және ауыстыруға, кондоминиум объектісінің ортақ мүлкін күрделі жөндеуге байланысты ақшаны қайтаруын қамтамасыз қағидаларын бекіту туралы

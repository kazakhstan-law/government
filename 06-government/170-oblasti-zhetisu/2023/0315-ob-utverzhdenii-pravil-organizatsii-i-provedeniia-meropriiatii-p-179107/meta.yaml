  title:
    rus: О внесении изменений в постановление акимата Коксуского района от 15 марта 2023 года № 106 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Коксуского района»
    kaz: Көксу ауданы әкімдігінің 2023 жылғы 15 наурыздағы «Көксу ауданының бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» № 106 қаулысына өзгерістер енгізу туралы

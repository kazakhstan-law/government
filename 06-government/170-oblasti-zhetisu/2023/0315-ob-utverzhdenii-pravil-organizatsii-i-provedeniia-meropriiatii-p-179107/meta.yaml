requisite: Постановление акимата Коксуского района области Жетісу от 15 марта 2023 года № 106. Зарегистрировано Департаментом юстиции области Жетісу 16 марта 2023 года № 4-19
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Коксуского района
  kaz: Көксу ауданының бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Панфиловского района от 26 апреля 2023 года №174 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов Панфиловского района, финансируемых из районного бюджета»
    kaz: «Аудандық бюджеттен қаржыландырылатын Панфилов ауданының жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Панфилов ауданы әкімдігінің 2023 жылғы 23 сәуірдегі №174 қаулысына өзгертулер енгізу туралы

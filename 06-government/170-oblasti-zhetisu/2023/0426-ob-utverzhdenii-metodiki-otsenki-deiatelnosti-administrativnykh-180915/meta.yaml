title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов Панфиловского района, финансируемых из районного бюджета
  kaz: Аудандық бюджеттен қаржыландырылатын Панфилов ауданының жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

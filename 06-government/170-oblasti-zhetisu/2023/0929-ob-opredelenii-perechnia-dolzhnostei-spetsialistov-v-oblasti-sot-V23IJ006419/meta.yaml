requisite: Постановление акимата Сарканского района области Жетісу от 29 сентября 2023 года № 340. Зарегистрировано Департаментом юстиции области Жетісу 2 октября 2023 года № 64-19. Утратило силу постановлением акимата Сарканского района области Жетісу от 6 ноября 2025 года № 380 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді алуға құқығы бар әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

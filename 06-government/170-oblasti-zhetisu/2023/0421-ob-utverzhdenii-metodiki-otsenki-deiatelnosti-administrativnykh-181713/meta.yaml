    kaz: «Аудандық бюджеттен қаржыландырылатын Ақсу ауданының жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Ақсу ауданы  әкімдігінің 2023 жылғы 21 cәуірдегі № 98 қаулысына өзгертулер енгізу туралы

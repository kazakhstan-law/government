  title:
    rus: О внесении изменений в постановление акимата Сарканского района от 10 мая 2023 года № 173 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Сарканского района»
    kaz: Сарқан ауданы әкімдігінің 2023 жылғы 10 мамырдағы «Сарқан ауданының бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» № 173 қаулысына өзгерістер енгізу туралы

  requisite: Постановление акимата Кербулакского района области Жетісу от 10 августа 2023 года № 237
  title:
    rus: О внесении изменений в постановление акимата Кербулакского района от 20 апреля 2023 года № 115 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов сельских округов и исполнительных органов района, финансируемых из Кербулакского районного бюджета»
    kaz: Кербұлақ ауданы әкімдігінің 2023 жылғы 20 сәуірдегі «Кербұлақ аудандық бюджеттен қаржыландырылатын ауданның ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» № 115 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/185192/rus

act_code: '180011'
requisite: Постановление акимата Кербулакского района области Жетісу от 20 апреля 2023 года № 115
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, сельских округов и исполнительных органов финансируемых из Кербулакского районного бюджета
  kaz: Кербұлақ аудандық бюджеттен қаржыландырылатын ауданның ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

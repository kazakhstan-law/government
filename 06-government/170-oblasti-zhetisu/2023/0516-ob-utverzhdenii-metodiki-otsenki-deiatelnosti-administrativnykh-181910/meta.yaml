requisite: Постановление акимата города Талдыкорган области Жетісу от 16 мая 2023 года № 327. Утратило силу постановлением акимата города Талдыкорган области Жетісу от 12 сентября 2025 года № 570
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима города Талдыкорган, городских отделов и аппаратов акимов сельских округов города
  kaz: Талдықорған қаласы әкімі аппаратының, қалалық бөлімдер мен қаланың ауылдық округтері әкімдері аппараттарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата области Жетісу от 7 февраля 2023 года № 33. Зарегистрировано Департаментом юстиции области Жетісу 14 февраля 2023 года № 1-19. Утратило силу постановлением акимата области Жетісу от 27 декабря 2024 года № 424 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

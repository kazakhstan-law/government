  title:
    rus: О внесении изменений в постановление акимата города Текели от 6 июня 2023 года № 211 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Текели»
    kaz: Текелі қаласы әкімдігінің 2023 жылғы 6 маусымдағы «Текелі қаласына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» № 211 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата области Жетісу от 28 февраля 2023 года №54 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства по области Жетісу на 2023 год»
    kaz: Жетісу облысы әкімдігінің 2023 жылғы 28 ақпандағы «2023 жылға Жетісу облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» №54 қаулысына өзгеріс енгізу туралы

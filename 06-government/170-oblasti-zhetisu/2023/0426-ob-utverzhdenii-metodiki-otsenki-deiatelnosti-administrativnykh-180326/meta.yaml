  title:
    rus: О внесении изменений в постановление акимата Ескельдинского района от 26 апреля 2023 года №90 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов Ескельдинского района области Жетісу»
    kaz: «Аудандық бюджеттен қаржыландырылатын Ескелді ауданының жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Ескелді ауданы әкімдігінің 2023 жылғы 26 cәуірдегі № 90 қаулысына өзгертулер енгізу туралы

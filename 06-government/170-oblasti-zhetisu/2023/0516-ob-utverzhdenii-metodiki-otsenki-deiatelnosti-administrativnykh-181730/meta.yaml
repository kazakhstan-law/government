  title:
    rus: О внесении изменения в постановление акимата Коксуского района от 16 мая 2023 года №195 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов Коксуского района области Жетісу»
    kaz: «Аудандық бюджеттен қаржыландырылатын Көксу ауданының жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Көксу ауданы әкімдігінің 2023 жылғы 16 мамырдағы № 195 қаулысына өзгертулер енгізу туралы

title:
  rus: Об отмене постановления  акимата  Кербулакского района от 10 июня 2024 года  №176 «Об утверждении тарифов на сбор, транспортировку, сортировку, захоронение твердых бытовых отходов для населения по Кербулакскому району на 2024-2026 годы»
  kaz: Кербұлақ ауданы әкімдігінің 2024 жылдың 10 маусымындағы №176 «Кербұлақ ауданы бойынша 2024-2026 жылдарға халық үшін тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға, және көмуге арналған тарифтерін бекіту туралы» қаулысын жою туралы

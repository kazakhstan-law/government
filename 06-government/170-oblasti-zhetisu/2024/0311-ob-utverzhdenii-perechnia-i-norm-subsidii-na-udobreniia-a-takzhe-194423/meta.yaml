title:
  rus: Об утверждении перечня и норм субсидий на удобрения, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2024 год
  kaz: 2024 жылға тыңайтқыштарға арналған субсидиялардың тізбесі мен нормалары, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға арналған бюджет қаражатының көлемін бекіту туралы

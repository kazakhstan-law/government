  title:
    rus: О внесении изменении в постановление акимата области Жетісу от 11 марта 2024 года №74 «Об утверждении перечня и норм субсидий на удобрения, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2024 год»
    kaz: «2024 жылға тыңайтқыштарға арналған субсидиялардың тізбесі мен нормалары, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға арналған бюджет қаражатының көлемін бекіту туралы» Жетісу облысы әкімдігінің 2024 жылғы 11 наурыздағы №74 қаулысына өзгерістер енгізу туралы

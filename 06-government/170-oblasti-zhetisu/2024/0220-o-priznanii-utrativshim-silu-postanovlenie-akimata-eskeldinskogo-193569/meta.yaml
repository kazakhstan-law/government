act_code: '193569'
requisite: Постановление акимата Ескельдинского района области Жетісу от 20 февраля 2024 года № 36. Зарегистрировано Департаментом юстиции области Жетісу 21 февраля 2024 года № 145-19
title:
  rus: О признании утратившим силу постановление акимата Ескельдинского района от 29 мая 2017 года №106 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования»
  kaz: Ескелді ауданы әкімдігінің 2017 жылғы 29 мамырдағы «Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» №106 қаулысының күшін жою туралы

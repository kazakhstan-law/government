requisite: Постановление акимата Ескельдинского района области Жетісу от 28 октября 2024 года № 541
title:
  rus: Об отмене постановления акимата Ескельдинского района «Об установлении дефференицрованного тарифа на регулярные автомобильные перевозки пассажиров и багажа в сельских сообщениях на территории Карабулакского сельского округа Ескельдинского района»
  kaz: «Ескелді ауданы Қарабұлақ ауылдық округінің аумағында ауылдық қатынастарда жолаушылар мен багажды автомобильмен тұрақты тасымалдауға сараланған тарифті белгілеу туралы» Ескелді ауданы әкімдігінің қаулысының күшін жою туралы

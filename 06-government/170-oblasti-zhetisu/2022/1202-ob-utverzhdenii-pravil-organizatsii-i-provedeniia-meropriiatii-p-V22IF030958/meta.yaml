requisite: Постановление акимата Каратальского района области Жетісу от 2 декабря 2022 года № 485. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 декабря 2022 года № 30958
title:
  rus: Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Каратальского района
  kaz: Қаратал ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

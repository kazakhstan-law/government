requisite: Постановление акимата Каркаралинского района Карагандинской области от 17 мая 2021 года № 195. Зарегистрировано Департаментом юстиции Карагандинской области 21 мая 2021 года № 6339. Утратило силу постановлением акимата Каркаралинского района Карагандинской области от 4 октября 2024 года № 293 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения поощрений государственных служащих государственного учреждения «Аппарат акима Каркаралинского района» и исполнительных органов, финансируемых из бюджета Каркаралинского района
  kaz: «Қарқаралы ауданы әкімінің аппараты» мемлекеттік мекемесінің және Қарқаралы ауданының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне көтермелеулерді қолдану Қағидаларын бекіту туралы

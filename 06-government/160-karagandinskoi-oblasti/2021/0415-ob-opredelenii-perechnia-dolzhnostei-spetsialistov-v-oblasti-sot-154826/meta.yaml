  title:
    rus: О внесении изменения в постановление акимата Абайского района от 15 апреля 2021 года № 19/01 «Об определении перечня должностей специалистов в области социального обеспечения, культуры и спорта, являющихся гражданскими служащими, работающих в сельской местности и имеющих право на повышенные должностные оклады и тарифные ставки на двадцать пять процентов, за счет средств местного бюджета»
    kaz: Абай ауданы әкімдігінің 2021 жылғы 15 сәуірдегі «Азаматтық қызметші болып табылатын ауылдық жерлерде жұмыс істейтін әлеуметтiк қамтамасыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының және жергілікті бюджетінің қаражаттары есебінен лауазымдық жалақылары мен тарифтік ставкаларына жиырма бес пайыз көбейту құқығына ие лауазымдардың тізбесін айқындау туралы» № 19/01 қаулысына өзгеріс енгізу туралы

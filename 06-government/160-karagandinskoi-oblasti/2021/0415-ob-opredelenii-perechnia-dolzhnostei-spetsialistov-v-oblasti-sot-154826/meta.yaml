act_code: '154826'
requisite: Постановление акимата Абайского района Карагандинской области от 15 апреля 2021 года № 19/01. Зарегистрировано Департаментом юстиции Карагандинской области 19 апреля 2021 года № 6314
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры и спорта, являющихся гражданскими служащими, работающих в сельской местности и имеющих право на повышенные должностные оклады и тарифные ставки на двадцать пять процентов, за счет средств местного бюджета
  kaz: Азаматтық қызметші болып табылатын ауылдық жерлерде жұмыс істейтін әлеуметтiк қамтамасыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының және жергілікті бюджетінің қаражаттары есебінен лауазымдық жалақылары мен тарифтік ставкаларына жиырма бес пайыз көбейту құқығына ие лауазымдардың тізбесін айқындау туралы

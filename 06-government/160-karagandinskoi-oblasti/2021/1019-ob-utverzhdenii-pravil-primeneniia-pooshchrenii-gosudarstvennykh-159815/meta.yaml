act_code: '159815'
requisite: Постановление акимата города Сарани Карагандинской области от 19 октября 2021 года № 73/02. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 октября 2021 года № 24936. Утратило силу постановлением акимата города Сарани Карагандинской области от 7 ноября 2024 года № 84/21 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения поощрений государственных служащих государственного учреждения «Аппарат акима города Сарани» и исполнительных органов, финансируемых из бюджета города Сарани
  kaz: «Саран қаласы әкімінің аппараты» мемлекеттік мекемесінің және Саран қаласының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне көтермелеуді қолдану қағидаларын бекіту туралы

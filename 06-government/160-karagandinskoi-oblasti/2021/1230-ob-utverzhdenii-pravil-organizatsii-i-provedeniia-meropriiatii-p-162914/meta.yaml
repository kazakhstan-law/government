  title:
    rus: О внесении изменения в постановление акимата города Шахтинска от 30 декабря 2021 года № 72/01 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Шахтинск»
    kaz: Шахтинск қаласы әкімдігінің 2021 жылғы 30 желтоқсандағы № 72/01 «Шахтинск қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

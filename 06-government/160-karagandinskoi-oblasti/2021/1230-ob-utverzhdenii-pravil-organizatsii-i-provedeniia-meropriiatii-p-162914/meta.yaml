act_code: '162914'
requisite: Постановление акимата города Шахтинска Карагандинской области от 30 декабря 2021 года № 72/01. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 января 2022 года № 26342. Утратило силу постановлением акимата города Шахтинска Карагандинской области от 18 апреля 2025 года № 17/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Шахтинск
  kaz: Шахтинск қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

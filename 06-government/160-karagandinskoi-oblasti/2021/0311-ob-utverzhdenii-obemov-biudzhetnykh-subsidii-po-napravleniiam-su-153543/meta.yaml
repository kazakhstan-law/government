    kaz: Қарағанды облысы әкімдігінің 2021 жылғы 11 наурыздағы № 17/01 «2021 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша бюджеттік субсидиялар көлемдерін бекіту туралы» қаулысына өзгерістер енгізу туралы

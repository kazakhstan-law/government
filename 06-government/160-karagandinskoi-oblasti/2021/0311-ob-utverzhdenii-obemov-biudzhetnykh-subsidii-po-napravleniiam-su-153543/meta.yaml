  title:
    rus: О внесении изменений и дополнений в постановление акимата Карагандинской области от 11 марта 2021 года № 17/01 «Об утверждении объемов бюджетных субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства на 2021 год»
    kaz: Қарағанды облысы әкімдігінің 2021 жылғы 11 наурыздағы № 17/1 «2021 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша бюджеттік субсидиялар көлемдерін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

    kaz: «Мемлекеттік білім беру ұйымдарында орта білім беруге, мектепке дейінгі тәрбие мен оқытуға арналған мемлекеттік білім беру тапсырыстарын, ата-ана төлемақысының мөлшерін бекіту туралы» Қарағанды облысы әкімдігінің 2021 жылғы 21 қаңтардағы № 06/01 қаулысына өзгерістер енгізу туралы

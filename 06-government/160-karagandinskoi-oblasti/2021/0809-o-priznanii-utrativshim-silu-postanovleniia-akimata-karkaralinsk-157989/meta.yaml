title:
  rus: О признании утратившим силу постановления акимата Каркаралинского района Карагандинской области от 25 октября 2017 года № 299 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера родительской платы»
  kaz: Қарағанды облысы Қарқаралы ауданы әкімдігінің 2017 жылғы 25 қазандағы № 299 «Мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, ата-ана төлемақысының мөлшерін бекіту туралы» қаулысының күшін жою туралы

requisite: Постановление акимата Бухар-Жырауского района Карагандинской области от 15 февраля 2021 года № 09/02. Зарегистрировано Департаментом юстиции Карагандинской области 18 февраля 2021 года № 6193. Утратило силу постановлением акимата Бухар-Жырауского района Карагандинской области от 26 декабря 2024 года № 97/01 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения поощрений государственных служащих государственного учреждения «Аппарат акима Бухар-Жырауского района» и исполнительных органов, финансируемых из бюджета Бухар-Жырауского района
  kaz: «Бұқар жырау ауданы әкімінің аппараты» мемлекеттік мекемесінің және Бұқар жырау ауданының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне көтермелеулерді қолдану қағидаларын бекіту туралы

requisite: Постановление акимата Нуринского района Карагандинской области от 18 ноября 2021 года № 37/02. Зарегистрировано в Министерстве юстиции 26 ноября 2021 года № 25436. Утратило силу постановлением акимата Нуринского района Карагандинской области от 4 ноября 2024 года № 40/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика поселку Нура
  kaz: Нұра кентіне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

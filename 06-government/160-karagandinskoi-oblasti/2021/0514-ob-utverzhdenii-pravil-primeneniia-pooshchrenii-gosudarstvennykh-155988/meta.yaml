requisite: Постановление акимата города Караганды от 14 мая 2021 года № 33/53. Зарегистрировано Департаментом юстиции Карагандинской области 19 мая 2021 года № 6336
title:
  rus: Об утверждении Правил применения поощрений государственных служащих государственного учреждения «Аппарат акима города Караганды» и исполнительных органов, финансируемых из бюджета города Караганды
  kaz: «Қарағанды қаласы әкімінің аппараты» мемлекеттік мекемесінің және Қарағанды қаласының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне көтермелеуді қолдану Ережесін бекіту туралы

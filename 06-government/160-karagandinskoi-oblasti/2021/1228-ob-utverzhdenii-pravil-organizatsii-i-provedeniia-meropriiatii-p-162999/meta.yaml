act_code: '162999'
requisite: Постановление акимата Каркаралинского района Карагандинской области от 28 декабря 2021 года № 404. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 января 2022 года № 26407. Утратило силу постановлением акимата Каркаралинского района Карагандинской области от 9 апреля 2025 года № 114 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Каркаралинского района
  kaz: Қарқаралы ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  code: '201501'
  requisite: Постановление акимата Каркаралинского района Карагандинской области от 7 октября 2024 года № 297. Зарегистрировано в Департаменте юстиции Карагандинской области 9 октября 2024 года № 6671-09. Утратило силу постановлением акимата Каркаралинского района Карагандинской области от 9 апреля 2025 года № 114 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Каркаралинского района Карагандинской области от 28 декабря 2021 года № 404 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Каркаралинского района»
    kaz: Қарағанды облысы Қарқаралы ауданының әкімдігінің 2021 жылғы 28 желтоқсандағы № 404 «Қарқаралы ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201501/rus

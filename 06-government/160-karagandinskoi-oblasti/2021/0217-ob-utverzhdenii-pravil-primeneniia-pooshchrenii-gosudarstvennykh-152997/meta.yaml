title:
  rus: Об утверждении Правил применения поощрений государственных служащих государственного учреждения «Аппарат акима города Жезказган» и исполнительных органов, финансируемых из бюджета города Жезказган
  kaz: «Жезқазған қаласы әкімі аппараты» мемлекеттік мекемесінің және Жезқазған қаласының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне көтермелеулерді қолдану қағидаларын бекіту туралы

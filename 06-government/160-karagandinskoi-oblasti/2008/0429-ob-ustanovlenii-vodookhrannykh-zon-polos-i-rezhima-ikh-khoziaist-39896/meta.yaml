  kaz: Қарағанды облысының әкімшілік шекарасындағы Нұра өзенінде, Шерубай-Нұра, Сарысу, Соқыр өзендерінде, Самарқант және Федоров бөгендерінде су қорғау аймақтары мен су нысандары жолақтарын орнату және оларды шаруашылыққа пайдалану тәртібі туралы

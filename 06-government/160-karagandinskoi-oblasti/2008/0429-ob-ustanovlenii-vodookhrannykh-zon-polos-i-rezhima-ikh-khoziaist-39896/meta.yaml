requisite: Постановление акимата Карагандинской области от 29 апреля 2008 года № 11/02. Зарегистрировано Департаментом юстиции Карагандинской области 29 мая 2008 года № 1843. Утратило силу постановлением акимата Карагандинской области от 9 июня 2014 года № 28/04
title:

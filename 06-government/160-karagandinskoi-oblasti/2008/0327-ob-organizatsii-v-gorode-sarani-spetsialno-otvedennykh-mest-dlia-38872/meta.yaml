act_code: '38872'
requisite: Постановление акимата города Сарани Карагандинской области от 27 марта 2008 года № 109. Зарегистрировано Управлением юстиции города Сарани Карагандинской области 16 апреля 2008 года № 8-7-61. Утратило силу постановлением акимата города Сарани Карагандинской области от 7 октября 2021 года № 70/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об организации в городе Сарани специально отведенных мест для мелкорозничной продажи овощной, плодово-ягодной продукции и выездной торговли продовольственными товарами и сельскохозяйственной продукцией
  kaz: Саран қаласында көкөніс, жеміс-жидек өнімдерінің және азық-түлік тауарлары мен ауылшаруашылығы өнімдерінің көшпелі шағын бөлшек саудасын жүргізу үшін арнайы бөлінген орындар ұйымдастыру туралы

act_code: '43250'
requisite: Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2008 жылғы 12 желтоқсандағы № 493 қаулысы. Қарағанды облысы Жаңаарқа ауданы Әділет басқармасында 2009 жылғы 5 қаңтарда № 8-12-49 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2009 жылғы 18 ақпандағы № 22 қаулысымен

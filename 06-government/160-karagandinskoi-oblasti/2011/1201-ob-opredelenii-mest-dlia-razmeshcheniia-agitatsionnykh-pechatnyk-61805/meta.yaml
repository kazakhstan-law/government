requisite: Постановление акимата города Балхаш Карагандинской области от 1 декабря 2011 года № 48/04. Зарегистрировано Управлением юстиции города Балхаша Карагандинской области 7 декабря 2011 года № 8-4-254. Утратило силу постановлением акимата города Балхаш Карагандинской области от 20 октября 2023 года № 51/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в Президенты, депутаты Мажилиса Парламента и маслихатов Республики Казахстан
  kaz: Қазақстан Республикасы Президентінің, Парламент Мәжілісінің және мәслихаттар депутаттығына кандидаттардың үгіттік баспа материалдарын орналастыру орындарын және сайлаушылармен кездесу өткізетін үй-жайлардың орнын белгілеу туралы

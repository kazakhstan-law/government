  kaz: Сайлаушылармен кездесу үшін үй-жайды беру және Қазақстан Республикасының Президенттігіне, Қазақстан Республикасы Парламентінің депутаттығына, мәслихат депутаттығына кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды анықтау туралы

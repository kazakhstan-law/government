  kaz: Қарқаралы ауданының кәсіпорындары мен ұйымдарында мүгедектерге және интернаттық ұйымдарды бітіруші кәмелетке толмағандар қылмыстық-атқару инспекциясы пробациясы қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Жанааркинского района Карагандинской области от 5 июля 2011 года № 172. Зарегистрировано Управлением юстиции Жанааркинского района Карагандинской области 11 июля 2011 года № 8-12-109. Утратило силу постановлением акимата Жанааркинского района Карагандинской области от 13 мая 2016 года № 45/03
title:
  rus: Об установлении квоты рабочих мест для инвалидов, лиц, освобожденных из мест лишения свободы, условно осужденных лиц состоящих на учете службы пробации уголовно-исполнительной инспекции и несовершеннолетних выпускников интернатных организаций на предприятиях и организациях Жанааркинского района
  kaz: Жаңаарқа ауданындағы кәсіпорындары мен ұйымдарында мүгедектерге, бас бостандығынан айыру орындарынан босатылған адамдарға, қылмыстық - атқару инспекциясы пробация қызметінің есебінде тұрған шартты түрде сотталғандарға және интернаттық ұйымдарды бітіруші кәмелетке толмаған түлектер үшін жұмыс орындарының квотасын белгілеу туралы

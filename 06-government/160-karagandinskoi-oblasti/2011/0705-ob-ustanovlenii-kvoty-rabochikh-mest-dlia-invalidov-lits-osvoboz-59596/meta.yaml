    kaz: '"Жаңаарқа ауданындағы кәсіпорындары мен ұйымдарында мүгедектерге, бас бостандығынан айыру орындарынан босатылған адамдарға және интернаттық ұйымдарды бітіруші кәмелетке толмаған түлектер үшін жұмыс орындарының квотасын белгілеу туралы" Жаңаарқа ауданы әкімдігінің 2011 жылғы 5 шілдедегі № 172 қаулысына өзгеріс пен толықтыру енгізу туралы'

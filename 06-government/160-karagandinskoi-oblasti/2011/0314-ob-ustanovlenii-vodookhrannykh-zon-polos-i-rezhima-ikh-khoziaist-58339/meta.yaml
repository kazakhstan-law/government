act_code: '58339'
requisite: Постановление акимата Карагандинской области от 15 марта 2011 года № 09/10. Зарегистрировано Департаментом юстиции Карагандинской области 19 апреля 2011 года № 1891. Утратило силу постановлением акимата Карагандинской области от 4 октября 2024 года № 60/03 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон, полос и режима их хозяйственного использования в северной части озера Балхаш в границах Карагандинской области, для берегового участка озера Балхаш с расположенным на нем профилакторием Производственного Объединения "Балхашцветмет" товарищества с ограниченной ответственностью "Корпорация Казахмыс" и на реке Токырау Карагандинской области
  kaz: Қарағанды облысының шекарасындағы Балқаш көлінің солтүстік бөлігінде, "Қазақмыс Корпорациясы" жауапкершілігі шектеулі серіктестігі "Балқашцветмет" Өндірістік Қоғамының профилакториясы орналасқан Балқаш көлінің жағалау учаскесі мен Тоқырау өзені үшін, су қорғау аймақтары мен белдеулерін орнату және оларды шаруашылыққа пайдалану тәртібі туралы

  kaz: Қазақстан Республикасының Президентін, Қазақстан Республикасының Парламент депутаттарын, облыс және қала мәслихаттары депутаттарын сайлау кезінде үгіттік баспа материалдарын орналастыру орындарын, сайлаушылармен кездесулер үшін үй-жайларды анықтау туралы

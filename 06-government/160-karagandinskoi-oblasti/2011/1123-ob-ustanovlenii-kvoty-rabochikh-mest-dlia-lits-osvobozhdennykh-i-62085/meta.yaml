title:
  rus: Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы, а также лиц, состоящих на учете в службе пробации уголовно-исполнительной инспекции и несовершеннолетних выпускников интернатных организаций
  kaz: Бас бостандығынан айыру орындарынан босатылған тұлғалар, сондай-ақ, қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар және интернат ұйымдарының кәмелетке толмаған түлектері үшін жұмыс орындарына квота белгілеу туралы

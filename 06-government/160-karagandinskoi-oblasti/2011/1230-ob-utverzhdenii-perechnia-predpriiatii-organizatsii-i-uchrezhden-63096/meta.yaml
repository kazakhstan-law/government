    kaz: '"2012 жылы қоғамдық жұмыстар жүргізілетін Балқаш қаласының кәсіпорындары, ұйымдары мен мекемелерінің тізбесін, жұмыс түрлерін, шарттарын, көлемін және жалақы мөлшерін бекіту туралы" Балқаш қаласы әкімдігінің 2011 жылғы 30 желтоқсандағы № 52/12 қаулысына толықтыру енгізу туралы'

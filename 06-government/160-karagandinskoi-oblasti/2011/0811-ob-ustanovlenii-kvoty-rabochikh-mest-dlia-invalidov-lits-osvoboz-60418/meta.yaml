title:
  rus: Об установлении квоты рабочих мест для инвалидов, лиц освобожденных из мест лишения свободы, несовершеннолетних выпускников интернатных организаций и лиц состоящих на учете службы пробации уголовно-исполнительной инспекции
  kaz: Мүгедектер, бас бостандығынан айыру орындарынан босатылған адамдар, интернаттық ұйымдарды бітіруші кәмелетке толмағандар және қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата города Караганды от 21 июня 2011 года N 28/07. Зарегистрировано Управлением юстиции города Караганды 25 июля 2011 года N 8-1-136. Утратило силу постановлением акимата города Караганды от 8 июня 2016 года N 23/07
title:
  rus: Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в городе Караганде
  kaz: Қарағанды қаласында бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

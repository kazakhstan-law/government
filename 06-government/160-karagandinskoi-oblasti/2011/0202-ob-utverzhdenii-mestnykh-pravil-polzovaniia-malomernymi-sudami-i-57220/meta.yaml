act_code: '57220'
requisite: Постановление акимата Карагандинской области от 2 февраля 2011 года № 04/01. Зарегистрировано Департаментом юстиции Карагандинской области 8 февраля 2011 года № 1889. Утратило силу постановлением акимата Карагандинской области от 4 июля 2012 года № 32/01
title:
  rus: Об утверждении Местных правил пользования маломерными судами и базами (сооружениями) для их стоянок на акватории водоемов Карагандинской области, в том числе озера Балхаш в пределах административных границ Карагандинской области
  kaz: Қарағанды облысының су қоймалары акваториясында, оның ішінде Қарағанды облысының әкімшілік шекаралары шегіндегі Балқаш көлінде шағын өлшемді кемелерді және олардың тұрағы үшін базаларды (құрылыстарды) пайдалану Жергілікті ережесін бекіту туралы

    kaz: '"Қаражал қаласында бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы" Қаражал қаласы әкімдігінің 2011 жылғы 3 тамыздағы № 210 қаулысына толықтырулар енгізу туралы'

act_code: '60206'
requisite: Постановление акимата города Каражал Карагандинской области от 3 августа 2011 года № 210. Зарегистрировано Управлением юстиции города Каражал Карагандинской области 24 августа 2011 года № 8-5-113. Утратило силу постановлением акимата города Каражал Карагандинской области от 16 мая 2016 года № 68/2
title:
  rus: Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете в службе пробации уголовно-исполнительной инспекции и для несовершеннолетних выпускников интернатных организаций в городе Каражал
  kaz: Қаражал қаласында бас бостандығынан айыру орындарынан босатылған адамдар, қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

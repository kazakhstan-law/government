act_code: '61927'
requisite: Постановление акимата города Каражал Карагандинской области от 30 ноября 2011 года № 359. Зарегистрировано Управлением юстиции города Каражал Карагандинской области 12 декабря 2011 года № 8-5-117. Утратило силу постановлением акимата города Каражал области Ұлытау от 17 февраля 2023 года № 8 (вводится в действие по истечении десяти календарных дней после дня их первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в Президенты Республики Казахстан, депутаты Мажилиса Парламента Республики Казахстан по партийным спискам, областного и городского маслихатов на территории города Каражал
  kaz: Қаражал қаласының аумағында Қазақстан Республикасы Президенттiгiне, Қазақстан Республикасы Парламент Мәжiлiсiне партиялық тiзiмдер бойынша, облыстық және қалалық мәслихат депутаттығына үмiткерлердiң сайлаушылармен кездесу өткiзу үшiн үй-жайларды және үгiттiк баспа материалдарын орналастыру үшiн орындарды анықтау туралы

title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в Президенты и депутаты Мажилиса Парламента Республики Казахстан
  kaz: Қазақстан Республикасы Президентінің және Парламент Мәжілісінің депутаттығына кандидаттардың үгіттік баспа материалдарын орналастыру орындарын және сайлаушылармен кездесу өткізетін үй-жайлардың орнын белгілеу туралы

requisite: Постановление акимата Актогайского района Карагандинской области от 1 марта 2011 года № 04/01. Зарегистрировано Управлением юстиции Актогайского района Карагандинской области 2 марта 2011 года № 8-10-131. Утратило силу постановлением акимата Актогайского района Карагандинской области от 15 февраля 2024 года № 07/01 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении помещений для встреч с избирателями и определении мест для размещения агитационных печатных материалов кандидатов в Президенты Республики Казахстан, депутаты Парламента Республики Казахстан и депутаты маслихата
  kaz: Қазақстан Республикасы Президенттігіне, Қазақстан Республикасы Парламентінің депутаттығына және мәслихаттың депутаттығына кандидаттардың сайлаушылармен кездесуі үшін үй-жай беру және үгіттік баспа материалдарын орналастыру үшін орындарды анықтау туралы

requisite: Постановление акимата Шетского района Карагандинской области от 14 декабря 2011 года № 23/01. Зарегистрировано Управлением юстиции Шетского района Карагандинской области 27 декабря 2011 года № 8-17-128. Утратило силу постановлением акимата Шетского района Карагандинской области от 13 марта 2024 года № 18/01 (вводится в действие со дня его первого официального опубликования)
title:

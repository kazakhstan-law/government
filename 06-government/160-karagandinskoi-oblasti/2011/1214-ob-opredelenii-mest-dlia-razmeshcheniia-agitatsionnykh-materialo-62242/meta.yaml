  kaz: Қазақстан Республикасы Парламент Мәжілісіне партиялық тізімдер бойынша, облыстық және аудандық мәслихат депутаттығына үміткерлердің сайлаушылармен кездесуі үшін үй-жайларды және үгіттік баспа материалдарын орналастыру орындарын анықтау туралы

  requisite: Постановление акимата города Приозерск Карагандинской области от 21 декабря 2011 года № 43/1. Зарегистрировано Управлением юстиции города Балхаш Карагандинской области 28 декабря 2011 года № 8-4-261
  title:
    rus: О внесении изменения в постановление акимата города Приозерск от 24 февраля 2011 года № 5/7 "Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в Президенты Республики Казахстан, депутаты Мажилиса Парламента Республики Казахстан по партийным спискам, областного и городского маслихата на территории города Приозерск
    kaz: Приозерск қаласы әкімдігінің 2011 жылғы 24 ақпандағы № 5/7 "Приозерск қаласының аумағында Қазақстан Республикасы Президенттігіне, Қазақстан Республикасы Парламент Мәжілісіне партиялық тізімдер бойынша, облыстық және қалалық мәслихат депутаттарына үміткерлерінің сайлаушылармен кездесу өткізу үшін үй-жайларды және үгіттік баспа материалдарын орналастыру үшін орындарды анықтау туралы" қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/62250/rus

act_code: '57500'
requisite: Постановление акимата города Приозерск Карагандинской области от 24 февраля 2011 года N 5/7. Зарегистрировано Управлением юстиции города Балхаша Карагандинской области 2 марта 2011 года N 8-4-223. Утратило силу постановлением акимата города Приозерск Карагандинской области от 21 января 2016 года № 2/1
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в Президенты Республики Казахстан, депутаты Мажилиса Парламента Республики Казахстан по партийным спискам, областного и городского маслихата на территории города Приозерск
  kaz: Приозерск қаласының аумағында Қазақстан Республикасы Президенттігіне, Қазақстан Республикасы Парламент Мәжілісіне партиялық тізімдер бойынша, облыстық және қалалық мәслихат депутаттарына үміткерлерінің сайлаушылармен кездесу өткiзу үшiн үй-жайларды және үгiттiк баспа материалдарын орналастыру үшiн орындарды анықтау туралы

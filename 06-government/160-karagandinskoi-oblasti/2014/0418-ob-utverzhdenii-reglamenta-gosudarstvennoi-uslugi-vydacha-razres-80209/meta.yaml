act_code: '80209'
requisite: Постановление акимата Карагандинской области от 18 апреля 2014 года № 19/03. Зарегистрировано Департаментом юстиции Карагандинской области 23 мая 2014 года № 2650. Утратило силу постановлением акимата Карагандинской области от 8 октября 2015 года № 59/03
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешения на размещение объектов наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах"
  kaz: '"Облыстық және аудандық маңызы бар, сондай-ақ елді мекендердегі жалпы пайдаланымдағы автомобиль жолдарының бөлінген белдеуінде сыртқы (көрнекі) жарнама объектілерін орналастыруға рұқсат беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

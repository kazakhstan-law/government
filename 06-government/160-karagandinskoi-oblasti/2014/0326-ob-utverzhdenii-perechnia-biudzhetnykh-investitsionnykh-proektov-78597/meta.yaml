act_code: '78597'
requisite: Постановление акимата Карагандинской области от 26 марта 2014 года № 14/02. Зарегистрировано Департаментом юстиции Карагандинской области 8 апреля 2014 года № 2577. Утратило силу постановлением акимата Карагандинской области от 4 ноября 2014 года № 59/01
title:
  rus: Об утверждении перечня бюджетных инвестиционных проектов и концессионных проектов, финансирование разработки или корректировки, а также проведение необходимых экспертиз технико-экономических обоснований которых осуществляется за счет средств распределяемой бюджетной программы 064 "Разработка или корректировка технико-экономического обоснования местных бюджетных инвестиционных проектов и концессионных проектов и проведение его экспертизы, консультативное сопровождение концессионных проектов" государственного учреждения "Управление экономики и финансов Карагандинской области" на 2014 год
  kaz: '"Қарағанды облысының экономика және қаржы басқармасы" мемлекеттік мекемесінің 2014 жылға арналған "Жергілікті бюджеттік инвестициялық жобалардың және концессиялық жобалардың техника-экономикалық негіздемесін әзірлеу немесе түзету және оған сараптама жүргізу, концессиялық жобаларды консультациялық сүйемелдеу" 064 бөлінетін бюджеттік бағдарламасының қаражаты есебінен жүзеге асырылатын техникалық-экономикалық негіздемелерін әзірлеуді немесе түзетуді, сондай-ақ қажетті сараптамалар жүргізуді қаржыландыру, бюджеттік инвестициялық жобалардың және концессиялық жобалардың тізбесін бекіту туралы'

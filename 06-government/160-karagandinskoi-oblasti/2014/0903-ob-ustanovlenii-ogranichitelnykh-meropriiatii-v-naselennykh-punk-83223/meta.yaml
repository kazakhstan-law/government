requisite: Постановление акимата Каркаралинского района Карагандинской области от 3 сентября 2014 года № 238. Зарегистрировано Департаментом юстиции Карагандинской области 19 сентября 2014 года № 2753. Утратило силу постановлением акимата Каркаралинского района Карагандинской области от 30 декабря 2015 года № 399
title:
  rus: Об установлении ограничительных мероприятий в населенных пунктах Талды, Акбай-Кызылбай, Сарыобалы, зимовках "Уштобе", "Озен", "Карамолла" сельского округа К. Аманжолов, и в населенном пункте Ынталы, Ынталинского сельского округа
  kaz: Қ. Аманжолов ауылдық округінің Талды, Ақбай-Кызылбай, Сарыобалы елді мекендеріне, "Үштөбе", "Өзен", "Қарамолла" қыстақтарына және Ынталы  ауылдық округінің Ынталы елді-мекені аумағында шектеу іс-шараларын  белгілеу туралы

requisite: Постановление акимата Карагандинской области от 26 марта 2014 года № 14/10. Зарегистрировано Департаментом юстиции Карагандинской области 8 апреля 2014 года № 2580. Утратило силу постановлением акимата Карагандинской области от 23 июня 2015 года № 34/14
title:
  rus: Об утверждении норматива субсидий на возмещение до 100 % затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, критериев и требований к поставщикам услуг по искусственному осеменению, а также объемов субсидий по направлениям субсидирования развития племенного животноводства и повышения продуктивности и качества продукции животноводства
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100 %-ға дейін өтеуге арналған субсидиялар нормативін, қолдан ұрықтандыру жөніндегі қызметтерді жеткізушіге қойылатын өлшемдер мен талаптарды, сондай ақ асыл тұқымды мал шаруашылығын дамытуды және мал шаруашылығы өнімінің өнімділігі мен сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы

act_code: '84713'
requisite: Постановление акимата Нуринского района Карагандинской области от 30 октября 2014 года № 25/10. Зарегистрировано Департаментом юстиции Карагандинской области 2 декабря 2014 года № 2835. Утратило силу постановлением акимата Нуринского района Карагандинской области от 17 марта 2016 года № 08/03
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные должностные оклады и тарифные ставки на двадцать пять процентов, за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен жиырма бес пайызға тарифтік мөлшерлеме және лауазымдық жалақысын көтеруге құқығы бар азаматтық қызметші болып табылатын, ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

act_code: '82013'
requisite: Постановление акимата города Сатпаев Карагандинской области от 2 июля 2014 года № 11/01. Зарегистрировано Департаментом юстиции Карагандинской области 14 августа 2014 года № 2721
title:
  rus: Об утверждении перечня бюджетных инвестиционных проектов и концессионных проектов, финансирование разработки или корректировки, а также проведение необходимых экспертиз технико-экономических обоснований которых осуществляется за счет средств распределяемой бюджетной программы государственного учреждения "Отдел экономики и финансов города Сатпаев" на 2014 год
  kaz: 2014 жылға арналған "Сәтбаев қаласының экономика және қаржы бөлімі" мемлекеттік мекемесінің бөлінетін бюджеттік бағдарламасының қаражаттары есебінен техникалық-экономикалық негіздемелерін әзірлеуді немесе түзетуді, сонымен қатар қажетті сараптамалар жүргізуді қаржыландыру жүзеге асырылатын бюджеттік инвестициялық жобалар мен концессиялық жобалар тізбесін бекіту туралы

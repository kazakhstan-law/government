act_code: '81435'
requisite: Постановление акимата Жанааркинского района Карагандинской области от 26 июня 2014 года № 49/01. Зарегистрировано Департаментом юстиции Карагандинской области 21 июля 2014 года № 2694. Утратило силу постановлением акимата Жанааркинского района Карагандинской области от 6 апреля 2016 года № 32/02
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Жанааркинского района
  kaz: Жаңаарқа ауданында азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

act_code: '86237'
requisite: Постановление акимата города Балхаш Карагандинской области от 26 декабря 2014 года № 53/01. Зарегистрировано Департаментом юстиции Карагандинской области 23 января 2015 года № 2944. Прекращено действие в связи с истечением срока, на который постановление было принято (письмо акимата города Балхаш Карагандинской области от 6 января 2016 года № 4-14/10)
title:
  rus: Об утверждении перечня предприятий, организаций и учреждений города Балхаш, в которых будут проводиться общественные работы в 2015 году, видов, конкретных условий, объемов работ и размера оплаты труда
  kaz: 2015 жылы қоғамдық жұмыстар жүргізілетін Балқаш қаласының кәсіпорындары, ұйымдары мен мекемелерінің тізбесін, жұмыстардың түрлерін, нақты жағдайларын, көлемдерін және еңбекақы төлеу мөлшерін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата города Балхаш от 26 декабря 2014 года № 53/01 «Об утверждении перечня предприятий, организаций и учреждений города Балхаш, в которых будут проводиться общественные работы в 2015 году, видов, конкретных условий, объемов работ и размера оплаты труда»
    kaz: Балқаш қаласы әкімдігінің 2014 жылғы 26 желтоқсандағы № 53/01 «2015 жылы қоғамдық жұмыстар жүргізілетін Балқаш қаласының кәсіпорындары, ұйымдары мен мекемелерінің тізбесін, жұмыстардың түрлерін, нақты жағдайларын, көлемдерін және еңбекақы төлеу мөлшерін бекіту туралы» қаулысына өзгеріс енгізу туралы

act_code: '84112'
requisite: Постановление акимата Карагандинской области от 4 ноября 2014 года № 59/01. Зарегистрировано Департаментом юстиции Карагандинской области 7 ноября 2014 года № 2811.
title:
  rus: Об утверждении перечня бюджетных инвестиционных и концессионных проектов, финансирование которых осуществляется за счет средств распределяемой бюджетной программы 064 "Разработка или корректировка, а также проведение необходимых экспертиз технико-экономических обоснований местных бюджетных инвестиционных проектов и конкурсных документаций концессионных проектов, консультативное сопровождение концессионных проектов" государственного учреждения "Управление экономики и финансов Карагандинской области" на 2014 год
  kaz: '"Қарағанды облысының экономика және қаржы басқармасы" мемлекеттік мекемесінің 2014 жылға арналған "Жергілікті бюджеттік инвестициялық жобалардың техникалық-экономикалық негіздемелерін және концессиялық жобалардың конкурстық құжаттамаларын әзірлеу немесе түзету, сондай-ақ қажетті сараптамаларын жүргізу, концессиялық жобаларды консультативтік сүйемелдеу" 064 бөлінетін бюджеттік бағдарламасының қаражаты есебінен қаржыландыру жүзеге асырылатын бюджеттік инвестициялық және концессиялық жобалардың тізбесін бекіту туралы'

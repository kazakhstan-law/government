  title:
    rus: О внесении изменения в постановление акимата города Караганды от 13 августа 2014 года № 33/08 «Об определении помещений для встреч с избирателями, мест размещения печатных агитационных материалов на период выборов Президента, депутатов Сената и Мажилиса Парламента Республики Казахстан, маслихатов»
    kaz: «Қазақстан Республикасының Президентін, Парламент Мәжілісі және Сенат, мәслихаттар депутаттарын сайлау кезінде үгіттік баспа материалдарын орналастыру орындарын, сайлаушылармен кездесу үшін үй-жайларды анықтау туралы» Қарағанды қаласы әкімдігінің 2014 жылғы 13 тамыздағы № 33/08 қаулысына өзгеріс енгізу туралы

act_code: '82693'
requisite: Постановление акимата города Караганды от 13 августа 2014 года № 33/08. Зарегистрировано Департаментом юстиции Карагандинской области 29 августа 2014 года № 2729. Утратило силу постановлением акимата города Караганды от 18 июня 2024 года № 32/01 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении помещений для встреч с избирателями, мест размещения печатных агитационных материалов на период выборов Президента, депутатов Сената и Мажилиса Парламента Республики Казахстан, маслихатов
  kaz: Қазақстан Республикасының Президентін, Парламент Мәжілісі және Сенат, мәслихаттар депутаттарын сайлау кезінде үгіттік баспа материалдарын орналастыру орындарын, сайлаушылармен кездесу үшін үй-жайларды анықтау туралы

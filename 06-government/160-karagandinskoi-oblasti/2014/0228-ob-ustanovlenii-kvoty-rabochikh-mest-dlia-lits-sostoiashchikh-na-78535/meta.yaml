act_code: '78535'
requisite: Постановление акимата Нуринского района Карагандинской области от 28 февраля 2014 года № 07/02. Зарегистрировано Департаментом юстиции Карагандинской области 4 апреля 2014 года № 2574. Утратило силу постановлением акимата Нуринского района Карагандинской области от 6 мая 2016 года № 13/06
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, для лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Нуринском районе
  kaz: Нұра ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

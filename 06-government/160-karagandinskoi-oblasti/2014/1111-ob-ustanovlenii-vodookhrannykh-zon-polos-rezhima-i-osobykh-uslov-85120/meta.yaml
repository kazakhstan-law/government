requisite: Постановление акимата Карагандинской области от 11 ноября 2014 года № 61/05. Зарегистрировано Департаментом юстиции Карагандинской области 18 декабря 2014 года № 2876. Утратило силу постановлением акимата Карагандинской области от 15 октября 2025 года № 60/02 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

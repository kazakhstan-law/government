title:
  rus: Об установлении водоохранных зон, полос, режима и особых условий их хозяйственного использования на водохранилищах Ботакара, Буденовское, Ошагандинское, Чкаловское, Актастинское, Бидаикское, Клыч, Коммунарское, Комсомольское и Кызылтау Карагандинской области
  kaz: Қарағанды облысының Ботақара, Буденов, Ошағанды, Чкалов, Ақтасты, Бидаиқ, Қылыш, Коммунар, Комсомол және Қызылтау су қоймаларында су қорғау аймақтары, белдеулерін және оларды шаруашылыққа пайдалану тәртібі мен ерекше жағдайларын белгілеу туралы

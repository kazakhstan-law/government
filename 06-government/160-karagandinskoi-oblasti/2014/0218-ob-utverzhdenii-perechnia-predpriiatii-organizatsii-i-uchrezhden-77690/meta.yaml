act_code: '77690'
requisite: Постановление акимата города Балхаш Карагандинской области от 18 февраля 2014 года № 07/01. Зарегистрировано Департаментом юстиции Карагандинской области 27 февраля 2014 года № 2545.
title:
  rus: Об утверждении перечня предприятий, организаций и учреждений города Балхаш, в которых будут проводиться общественные работы в 2014 году, видов, конкретных условий, объемов работ и размера оплаты труда
  kaz: 2014 жылы қоғамдық жұмыстар жүргізілетін Балқаш қаласының кәсіпорындары, ұйымдары мен мекемелерінің тізбесін, жұмыстардың түрлерін, нақты жағдайларын, көлемдерін және еңбекақы төлеу мөлшерін бекіту туралы

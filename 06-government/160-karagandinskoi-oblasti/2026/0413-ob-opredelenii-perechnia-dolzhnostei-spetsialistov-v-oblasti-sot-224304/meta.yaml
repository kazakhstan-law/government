act_code: '224304'
requisite: Постановление акимата Бухар-Жырауского района Карагандинской области от 13 апреля 2026 года № 28/06
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры и спорта, являющиеся гражданскими служащими, работающих в сельской местности и имеющих право на повышенные должностные оклады и тарифные ставки на двадцать пять процентов, за счет средств местного бюджета
  kaz: Азаматтық қызметші болып табылатын, ауылдық жерлерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының және жергілікті бюджеттің қаражаты есебінен лауазымдық жалақылары мен тарифтік ставкаларына жиырма бес пайыз көбейту құқығына ие лауазымдардың тізбесін айқындау туралы

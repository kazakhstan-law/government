requisite: Постановление акимата города Приозерск Карагандинской области от 8 января 2026 года № 2/4
title:
  rus: Об определении порядка и условий установления за счет средств местного бюджета стимулирующих надбавок к должностным окладам работников организаций или учреждений, финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын ұйымдар немесе мекемелер жұмыскерлерінің лауазымдық айлықақыларына жергілікті бюджет қаражаты есебінен ынталандыру үстемеақыларын белгілеу тәртібі мен шарттарын айқындау туралы

act_code: '109770'
requisite: Постановление акимата Осакаровского района Карагандинской области от 19 января 2017 года № 03/01. Зарегистрировано Департаментом юстиции Карагандинской области 7 февраля 2017 года № 4139. Утратило силу постановлением акимата Осакаровского района Карагандинской области от 11 января 2021 года № 03/01 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Осакаровскому району на 2017 год
  kaz: Осакаров ауданы бойынша 2017 жылға арналған пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

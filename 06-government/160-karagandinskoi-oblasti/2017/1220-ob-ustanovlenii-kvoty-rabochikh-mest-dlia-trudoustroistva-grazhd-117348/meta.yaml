act_code: '117348'
requisite: Постановление акимата города Каражал Карагандинской области от 20 декабря 2017 года № 150. Зарегистрировано Департаментом юстиции Карагандинской области 28 декабря 2017 года № 4508
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы и лиц, состоящих на учете службы пробации по городу Каражал на 2018 год
  kaz: 2018 жылға Қаражал қаласы бойынша ата- анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды және пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

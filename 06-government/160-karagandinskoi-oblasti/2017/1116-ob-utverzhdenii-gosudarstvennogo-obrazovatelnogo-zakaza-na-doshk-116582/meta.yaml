requisite: Постановление акимата города Приозерск Карагандинской области от 16 ноября 2017 года № 47/446. Зарегистрировано Департаментом юстиции Карагандинской области 5 декабря 2017 года № 4462. Утратило силу постановлением акимата города Приозерск Карагандинской области от 18 марта 2019 года № 11/61 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)

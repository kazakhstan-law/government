act_code: '117784'
requisite: Постановление акимата Карагандинской области от 26 декабря 2017 года № 84/03. Зарегистрировано Департаментом юстиции Карагандинской области 10 января 2018 года № 4555. Утратило силу постановлением акимата Карагандинской области от 3 июля 2020 года № 41/03 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об утверждении размеров выплат ежемесячного денежного содержания спортсменам Карагандинской области, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд
  kaz: Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командаларының) құрамына кіретін Қарағанды облысының спортшыларына, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының құрамдарында (ұлттық құрама командаларының) қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемінің мөлшерін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 28 ноября 2017 года № 76/03 «Об утверждении регламента государственной услуги «Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием»
    kaz: Қарағанды облысы әкімдігінің 2017 жылғы 28 қарашадағы № 76/03 «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

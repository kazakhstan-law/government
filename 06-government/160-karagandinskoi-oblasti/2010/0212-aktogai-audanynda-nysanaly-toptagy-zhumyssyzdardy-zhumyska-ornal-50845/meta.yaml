requisite: Қарағанды облысы Ақтоғай ауданы әкімдігінің 2010 жылғы 12 ақпандағы № 02/25 қаулысы. Қарағанды облысы Ақтоғай ауданы Әділет басқармасында 2010 жылғы 24 ақпанда № 8-10-102 тіркелді. Күші жойылды - Қарағанды облысы Ақтоғай ауданы әкімдігінің 2012 жылғы 13 ақпандағы № 02/01 қаулысымен

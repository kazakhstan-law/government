requisite: Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2010 жылғы 29 наурыздағы № 57 қаулысы. Қарағанды облысы Жаңаарқа ауданының Әділет басқармасында 2010 жылғы 8 сәуірде № 8-12-70 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2011 жылғы 28 желтоқсандағы № 392 қаулысымен

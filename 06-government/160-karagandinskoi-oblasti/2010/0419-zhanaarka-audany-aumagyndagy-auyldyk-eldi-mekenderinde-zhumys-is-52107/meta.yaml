act_code: '52107'
requisite: Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2010 жылғы 19 сәуірдегі № 81 қаулысы. Қарағанды облысы Жаңаарқа ауданының Әділет басқармасында 2010 жылғы 27 сәуірде № 8-12-73 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2014 жылғы 26 маусымдағы № 49/01 қаулысымен
title:
  rus: Жаңаарқа ауданы аумағындағы ауылдық елді мекендерінде жұмыс істегені үшін лауазымдық айлықақыларын көтеру белгіленген білім, мәдениет және әлеуметтік қамсыздандыру мамандары лауазымдарының тізбесін айқындау туралы

act_code: '52860'
requisite: Қарағанды облысы Ұлытау ауданы әкімдігінің 2010 жылғы 23 сәуірдегі № 07/01 қаулысы. Қарағанды облысы Ұлытау ауданының Әділет басқармасында 2010 жылғы 28 мамырда № 8-16-58 тіркелді. Күші жойылды – Ұлытау облысы Ұлытау ауданының әкімдігінің 2024 жылғы 29 қазандағы № 39/01 (оның алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) қаулысымен

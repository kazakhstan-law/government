requisite: Қарағанды облысы Ақтоғай ауданының әкімдігінің 2010 жылғы 24 желтоқсандағы № 18/37 қаулысы. Қарағанды облысы Ақтоғай ауданы Әділет басқармасында 2011 жылғы 21 қаңтарда № 8-10-129 тіркелді. Күші жойылды – Қарағанды облысы Ақтоғай ауданының әкімдігінің 2024 жылғы 4 қыркүйектегі № 46/01 (оның алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) қаулысымен

act_code: '27559'
requisite: Қарағанды облысы Жезқазған қалаcының әкімдігінің 2006 жылғы 20 сәуірдегі № 328/4 қаулысы. Жезқазған қаласы Әділет басқармасында 2006 жылғы 4 мамырда № 8-2-24 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Қарағанды облысы Жезқазған қалаcы әкімінің аппаратының 2013 жылғы 28 маусымдағы № 3-9/895 хатымен)

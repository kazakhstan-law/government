  title:
    rus: О внесении изменения в постановление акимата города Каражал от 10 декабря 2020 года № 163 «Об утверждении Правил применения поощрений государственных служащих исполнительных органов города Каражал, финансируемых из местного бюджета»
    kaz: Қаражал қаласының әкімдігінің 2020 жылғы 10 желтоқсандағы «Жергілікті бюджеттен қаржыландырылатын Қаражал қаласының атқарушы органдарының мемлекеттік қызметшілеріне көтермелеулерді қолдану қағидаларын бекіту туралы» № 163 қаулысына өзгеріс енгізу туралы

title:
  rus: О признании утратившим силу постановления акимата Карагандинской области от 21 июля 2016 года № 53/02 «Об утверждении Правил выдачи служебного удостоверения местных исполнительных органов, финансируемых из областного, городского и районного бюджетов Карагандинской области и его описания»
  kaz: Қарағанды облысы әкімдігінің 2016 жылғы 21 шілдедегі № 53/02 «Қарағанды облысының облыстық, қалалық және аудандық бюджеттерінен қаржыландырылатын жергілікті атқарушы органдардың қызметтік куәлікті беру қағидаларын және оның сипаттамасын бекіту туралы» қаулысының күшін жою туралы

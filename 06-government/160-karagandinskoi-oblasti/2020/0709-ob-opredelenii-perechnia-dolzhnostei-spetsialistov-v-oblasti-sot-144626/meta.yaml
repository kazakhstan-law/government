act_code: '144626'
requisite: Постановление акимата Актогайского района Карагандинской области от 9 июля 2020 года № 29/01. Зарегистрировано Департаментом юстиции Карагандинской области 10 июля 2020 года № 5941. Утратило силу постановлением акимата Актогайского района Карагандинской области от 11 апреля 2025 года № 20/01 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования и распространяется на правоотношения возникшие с 1 января 2025 года)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности, которым за счет бюджетных средств устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Бюджет қаражаты есебiнен кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгiленетiн, азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

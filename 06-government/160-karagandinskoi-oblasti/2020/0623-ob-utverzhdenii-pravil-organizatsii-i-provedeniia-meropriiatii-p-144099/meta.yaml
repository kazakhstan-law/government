requisite: Постановление акимата города Темиртау Карагандинской области от 23 июня 2020 года № 26/1. Зарегистрировано Департаментом юстиции Карагандинской области 25 июня 2020 года № 5905
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Темиртау
  kaz: Теміртау қаласына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

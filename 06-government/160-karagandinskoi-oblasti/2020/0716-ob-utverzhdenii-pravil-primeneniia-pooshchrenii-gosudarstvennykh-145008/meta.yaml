title:
  rus: Об утверждении Правил применения поощрений государственных служащих государственного учреждения «Аппарат акима города Темиртау» и исполнительных органов, финансируемых из бюджета города Темиртау
  kaz: «Теміртау қаласы әкімінің аппараты» мемлекеттік мекемесінің және Теміртау қаласының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне көтермелеулерді қолдану қағидаларын бекіту туралы

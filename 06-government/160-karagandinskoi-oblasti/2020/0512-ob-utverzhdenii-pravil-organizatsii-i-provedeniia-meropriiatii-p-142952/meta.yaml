act_code: '142952'
requisite: Постановление акимата города Караганды от 12 мая 2020 года № 33/01. Зарегистрировано Департаментом юстиции Карагандинской области 19 мая 2020 года № 5843
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Караганде
  kaz: Қарағанды қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

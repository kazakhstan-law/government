requisite: Постановление акимата Актогайского района Карагандинской области от 27 ноября 2020 года № 56/01. Зарегистрировано Департаментом юстиции Карагандинской области 3 декабря 2020 года № 6111. Утратило силу постановлением акимата Актогайского района Карагандинской области от 9 октября 2024 года № 56/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения поощрений государственных служащих государственного учреждения «Аппарат акима Актогайского района» и исполнительных органов, финансируемых из бюджета Актогайского района
  kaz: «Ақтоғай ауданы әкімінің аппараты» мемлекеттік мекемесінің және Ақтоғай ауданының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне көтермелеулерді қолдану қағидаларын бекіту туралы

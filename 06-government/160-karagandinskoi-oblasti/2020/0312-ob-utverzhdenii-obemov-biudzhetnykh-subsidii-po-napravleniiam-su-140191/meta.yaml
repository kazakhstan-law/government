  title:
    rus: О внесении изменений в постановление акимата Карагандинской области от 12 марта 2020 года № 15/01 «Об утверждении объемов бюджетных субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства на 2020 год»
    kaz: Қарағанды облысы әкімдігінің 2020 жылғы 12 наурыздағы «2020 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша бюджеттік субсидиялар көлемдерін бекіту туралы» № 15/01 қаулысына өзгерістер енгізу туралы

    kaz: Жаңаарқа ауданы әкімдігінің 2020 жылғы 21 мамырдағы № 53/01 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата города Балхаш от 09 июля 2020 года № 29/01 «Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Балхаш»
    kaz: Балқаш қаласы әкімдігінің 2020 жылғы 09 шілдедегі № 29/01 «Балқаш қаласына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

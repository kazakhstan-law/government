act_code: '144682'
requisite: Постановление акимата города Балхаш Карагандинской области от 9 июля 2020 года № 29/01. Зарегистрировано Департаментом юстиции Карагандинской области 10 июля 2020 года № 5945. Утратило силу постановлением акимата города Балхаш Карагандинской области от 2 мая 2025 года № 21/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Балхаш
  kaz: Балқаш қаласына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

act_code: '144053'
requisite: Постановление акимата Нуринского района Карагандинской области от 23 июня 2020 года № 17/01. Зарегистрировано Департаментом юстиции Карагандинской области 24 июня 2020 года № 5898
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельских населенных пунктах, а также указанных специалистов, работающих в государственных организациях, финансируемых из местных бюджетов Нуринского района
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет, спорт саласындағы мамандарға, сондай-ақ Нұра ауданының жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандардың лауазымдар тізбесін белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Нуринского района от 23 июня 2020 года № 17/01 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельских населенных пунктах, а также указанных специалистов, работающих в государственных организациях, финансируемых из местных бюджетов»
    kaz: Нұра ауданы әкімдігінің 2020 жылғы 23 маусымдағы № 17/01 «Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандардың лауазымдар тізбесін белгілеу туралы» қаулысына өзгерістер енгізу туралы

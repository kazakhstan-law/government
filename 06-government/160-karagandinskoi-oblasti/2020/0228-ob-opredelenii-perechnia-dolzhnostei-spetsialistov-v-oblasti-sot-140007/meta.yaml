  title:
    rus: О внесении изменений в постановление акимата Осакаровского района от 28 февраля 2020 года № 11/01 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Осакаров ауданы әкімдігінің 2020 жылғы 28 ақпандағы № 11/01 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

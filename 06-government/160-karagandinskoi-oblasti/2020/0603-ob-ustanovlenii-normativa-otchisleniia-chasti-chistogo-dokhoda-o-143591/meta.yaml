requisite: Постановление акимата Карагандинской области от 3 июня 2020 года № 35/02. Зарегистрировано Департаментом юстиции Карагандинской области 5 июня 2020 года № 5860. Утратило силу постановлением акимата Карагандинской области от 11 сентября 2025 года № 52/01 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении норматива отчисления части чистого дохода областных коммунальных государственных предприятий, за исключением организаций среднего образования в организационно-правовой форме государственных предприятий на праве хозяйственного ведения
  kaz: Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық-құқықтық нысанындағы орта білім беру ұйымдарын қоспағанда, облыстық коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы

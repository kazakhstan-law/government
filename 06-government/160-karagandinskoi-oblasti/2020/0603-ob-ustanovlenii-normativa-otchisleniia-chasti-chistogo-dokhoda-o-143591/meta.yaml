  title:
    rus: О внесении изменений в постановление акимата Карагандинской области от 3 июня 2020 года № 35/02 «Об установлении норматива отчисления части чистого дохода областных коммунальных государственных предприятий»
    kaz: Қарағанды облысы әкімдігінің 2020 жылғы 3 маусымдағы «Облыстық коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» № 35/02 қаулысына өзгерістер енгізу туралы

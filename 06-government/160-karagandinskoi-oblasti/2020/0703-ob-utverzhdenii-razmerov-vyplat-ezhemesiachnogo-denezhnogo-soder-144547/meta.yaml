act_code: '144547'
requisite: Постановление акимата Карагандинской области от 3 июля 2020 года № 41/03. Зарегистрировано Департаментом юстиции Карагандинской области 8 июля 2020 года № 5938. Утратило силу постановлением акимата Карагандинской области от 25 июля 2025 года № 41/07 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении размеров выплат ежемесячного денежного содержания спортсменам Карагандинской области, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд
  kaz: Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін Қарағанды облысының спортшыларына, олардың жаттықтырушыларына, сондай-ақ спорттық ойын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамында ойнайтын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайын ақшалай үлес төлемінің мөлшерін бекіту туралы

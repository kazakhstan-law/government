act_code: '202284'
requisite: Постановление акимата Нуринского района Карагандинской области от 4 ноября 2024 года № 40/01. Зарегистрировано в Департаменте юстиции Карагандинской области 5 ноября 2024 года № 6679-09
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика в поселках Нура и Шубарколь Нуринского района Карагандинской области
  kaz: Қарағанды облысы Нұра ауданының, Нұра және Шұбаркөл кенттеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановление акимата Нуринского района Карагандинской области от 4 ноября 2024 года № 40/01 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика в поселках Нура и Шубарколь Нуринского района Карагандинской области»
    kaz: Нұра ауданы әкімдігінің 2024 жылғы 4 қарашадағы № 40/01 «Қарағанды облысы Нұра ауданының, Нұра және Шұбаркөл кенттеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 2 апреля 2024 года № 20/04 «Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2024 год»
    kaz: Қарағанды облысы әкімдігінің 2024 жылғы 2 сәуірдегі № 20/04 «2024 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына,) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

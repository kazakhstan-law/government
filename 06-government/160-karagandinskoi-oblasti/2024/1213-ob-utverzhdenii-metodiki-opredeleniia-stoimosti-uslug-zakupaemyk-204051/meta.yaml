title:
  rus: Об утверждении методики определения стоимости услуг, закупаемых для осуществления государственного заказа по проведению государственной информационной политики на территории Карагандинской области на 2025-2027 годы
  kaz: Қарағанды облысының мемлекеттік ақпараттық саясатты жүргізу жөніндегі 2025-2027 жылдарына мемлекеттік тапсырысты жүзеге асыру үшін сатып алынатын, көрсетілетін қызметтердің құнын айқындаудың әдістемесін бекіту туралы

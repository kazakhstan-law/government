title:
  rus: О реализации пилотного проекта по размещению единого государственного заказа на дополнительное образование для детей (творческий и спортивный заказы, образовательный заказ на дополнительное образование) с учетом персонифицированного финансирования по получателям услуг
  kaz: Көрсетілетін қызметті алушылар бойынша дербестендірілген қаржыландыруды ескере отырып, балаларға арналған қосымша білім беруге бірыңғай мемлекеттік тапсырысты (шығармашылық және спорттық тапсырыстар, қосымша білім беруге білім беру тапсырысы) орналастыру бойынша пилоттық жобаны іске асыру туралы

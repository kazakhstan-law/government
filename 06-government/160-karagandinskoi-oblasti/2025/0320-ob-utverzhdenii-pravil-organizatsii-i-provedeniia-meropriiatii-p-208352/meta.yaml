  title:
    rus: О внесении изменения в постановление акимата Актогайского района от 20 марта 2025 года № 18/01 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Актогайского района»
    kaz: «Ақтоғай ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Ақтоғай ауданы әкімдігінің 2025 жылғы 20 наурыздағы № 18/01 қаулысына өзгеріс енгізу туралы

act_code: '209910'
requisite: Постановление акимата города Балхаш Карагандинской области от 2 мая 2025 года № 21/01. Зарегистрировано Департаментом юстиции Карагандинской области 8 мая 2025 года № 6768-09
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Балхаш
  kaz: Балқаш қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

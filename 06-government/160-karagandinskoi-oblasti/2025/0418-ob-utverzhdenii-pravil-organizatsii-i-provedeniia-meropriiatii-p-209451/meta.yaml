  title:
    rus: О внесении изменений и дополнений в постановление акимата города Шахтинска области от 18 апреля 2025 года № 17/01 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Шахтинску»
    kaz: Шахтинск қаласы әкімдігінің 2025 жылғы 18 сәуірдегі № 17/01 «Шахтинск қаласына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

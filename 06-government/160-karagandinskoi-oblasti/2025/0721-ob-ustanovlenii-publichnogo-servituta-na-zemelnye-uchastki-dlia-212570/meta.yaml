  title:
    rus: О внесении изменения в постановление акимата Осакаровского района от 21 июля 2025 года № 68/05 «Об установлении публичного сервитута на земельные участки для проведения операций по разведке твердых полезных ископаемых товариществом с ограниченной ответственностью «CUPRUM MINING GROUP»

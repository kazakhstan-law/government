  title:
    rus: О внесении изменения в постановление акимата Осакаровского района от 13 июня 2025 года № 55/03 «Об установлении публичного сервитута на земельный участок государственному коммунальному предприятию на праве хозяйственного ведения «Elorda Aqua» акимата города Астаны»
    kaz: «Астана қаласы әкімдігінің «Elorda Aqua» шаруашылық жүргізу құқығындағы мемлекеттік коммуналдық кәсіпорнына жер учаскесіне қауымдық сервитут белгілеу туралы» Осакаров ауданы әкімдігінің 2025 жылғы 13 маусымдағы № 55/03 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 20 июня 2022 года № 39/01 «Об утверждении перечня и норм субсидий на пестициды, биоагенты (энтомофаги), а также объема бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2022 год»
    kaz: Қарағанды облысы әкімдігінің «2022 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемін бекіту туралы» 2022 жылғы 20 маусымдағы № 39/01 қаулысына өзгеріс енгізу туралы

title:
  rus: Об утверждении перечня и норм субсидий на пестициды, биоагенты (энтомофаги), а также объема бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2022 год
  kaz: 2022 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемін бекіту туралы

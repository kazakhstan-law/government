  title:
    rus: О внесении изменений в постановление акимата города Караганды от 19 сентября 2022 года № 45/01 «Об установлении дифференцированного тарифа на регулярные автомобильные перевозки пассажиров и багажа в городском сообщении на территории города Караганды»
    kaz: Қарағанды қаласы әкімдігінің 2022 жылғы 19 қыркүйектегі № 45/01 «Қарағанды қаласының аумағында жолаушылар мен багажды қалалық қатынаста автомобильмен тұрақты тасымалдауға сараланатын тарифті белгілеу туралы» қаулысына өзгерістер енгізу туралы

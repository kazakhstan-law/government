title:
  rus: О признании утратившим силу постановления акимата Шетского района Карагандинской области от 1 апреля 2020 года № 15/01 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера родительской платы по Шетскому району»
  kaz: Қарағанды облысы Шет ауданының әкімдігінің 2020 жылғы 1 сәуірдегі № 15/01 «Шет ауданы бойынша мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, ата-ана төлемақысының мөлшерін бекіту туралы» қаулысының күшін жою туралы

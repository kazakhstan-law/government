act_code: '167647'
requisite: Постановление акимата Осакаровского района Карагандинской области от 4 мая 2022 года № 34/01. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 мая 2022 года № 28046. Утратило силу постановлением акимата Осакаровского района Карагандинской области от 8 мая 2025 года № 44/03 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Осакаровского района
  kaz: Осакаров ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

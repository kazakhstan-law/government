  title:
    rus: О внесении изменений в постановление акимата Осакаровского района от 04 мая 2022 года № 34/01 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Осакаровского района»
    kaz: Осакаров ауданы әкімдігінің 2022 жылғы 04 мамырдағы № 34/01 «Осакаров ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

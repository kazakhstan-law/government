  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 26 апреля 2022 года № 26/01 «Об утверждении перечня и норм субсидий на удобрения, объема субсидий на удобрения на 2022 год и о признании утратившим силу некоторые постановления акимата Карагандинской области»
    kaz: Қарағанды облысы әкімдігінің «2022 жылға тыңайтқыштар тізбесі мен субсидиялар нормаларын, тыңайтқыштарға арналған субсидиялар көлемін бекіту және Қарағанды облысы әкімдігінің кейбір қаулыларының күші жойылды деп танылсын туралы» 2022 жылғы 26 сәуірдегі № 26/01 қаулысына өзгеріс енгізу туралы

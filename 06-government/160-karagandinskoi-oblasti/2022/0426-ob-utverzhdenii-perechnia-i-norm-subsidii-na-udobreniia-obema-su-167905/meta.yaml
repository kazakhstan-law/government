title:
  rus: Об утверждении перечня и норм субсидий на удобрения, объема субсидий на удобрения на 2022 год и о признании утратившим силу некоторые постановления акимата Карагандинской области
  kaz: 2022 жылға тыңайтқыштар тізбесі мен субсидиялар нормаларын, тыңайтқыштарға арналған субсидиялар көлемін бекіту және Қарағанды облысы әкімдігінің кейбір қаулыларының күші жойылды деп танылсын туралы

act_code: '166796'
requisite: Постановление акимата города Приозерск Карагандинской области от 12 апреля 2022 года № 14/110. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 апреля 2022 года № 27687. Утратило силу постановлением акимата города Приозерск Карагандинской области от 20 мая 2025 года № 21/81 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Приозерск
  kaz: Приозерск қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

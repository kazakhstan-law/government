    rus: О внесении изменения в постановление акимата Каркаралинского района Карагандинской области от 22 ноября 2022 года № 346 «Об определении и утверждении мест размещения нестационарных торговых объектов на территории Каркаралинского района»
    kaz: Қарағанды облысы Қарқаралы ауданының әкімдігінің 2022 жылғы 22 қарашадағы № 346 «Қарқаралы ауданының аумағында стационарлық емес сауда объектілерін орналастыру орындарын айқындау және бекіту туралы» қаулысына өзгеріс енгізу туралы

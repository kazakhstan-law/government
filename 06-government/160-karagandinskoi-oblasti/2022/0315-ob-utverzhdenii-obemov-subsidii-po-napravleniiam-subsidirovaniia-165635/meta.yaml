  title:
    rus: О внесении изменений и дополнений в постановление акимата Карагандинской области от 15 марта 2022 года № 15/01 «Об утверждении объемов бюджетных субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства на 2022 год»
    kaz: Қарағанды облысы әкімдігінің 2022 жылғы 15 наурыздағы № 15/01 «2022 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша бюджеттік субсидиялар көлемдерін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

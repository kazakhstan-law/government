act_code: '169435'
requisite: Постановление акимата города Сарани Карагандинской области от 7 июня 2022 года № 39/01. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 июня 2022 года № 28654
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Сарани и поселку Актас
  kaz: Саран қаласы мен Ақтас кентіне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

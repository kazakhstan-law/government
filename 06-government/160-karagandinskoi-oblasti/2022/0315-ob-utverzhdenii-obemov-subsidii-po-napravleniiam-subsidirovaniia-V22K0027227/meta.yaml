  title:
    rus: О внесении изменения в постановления акимата Карагандинской области от 15 марта 2022 года № 15/01 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, а также нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных на 2022 год»
    kaz: Қарағанды облысы әкімдігінің 2022 жылғы 15 наурыздағы № 15/01 «2022 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша бюджеттік субсидиялар көлемдерін, сондай-ақ ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарды және өтінім беру мерзімдерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/176564/rus

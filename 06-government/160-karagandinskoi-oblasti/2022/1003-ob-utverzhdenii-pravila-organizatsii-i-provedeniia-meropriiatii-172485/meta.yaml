act_code: '172485'
requisite: Постановление акимата Бухар-Жырауского района Карагандинской области от 3 октября 2022 года № 54/01. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 октября 2022 года № 30039
title:
  rus: Об утверждении Правила организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Бухар – Жыраускому району
  kaz: Бұқар жырау ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

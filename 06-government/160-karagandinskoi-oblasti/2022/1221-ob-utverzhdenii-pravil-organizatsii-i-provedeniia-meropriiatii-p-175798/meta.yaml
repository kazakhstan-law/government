act_code: '175798'
requisite: Постановление акимата Актогайского района Карагандинской области от 21 декабря 2022 года № 72/01. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 декабря 2022 года № 31205. Утратило силу постановлением акимата Актогайского района Карагандинской области от 20 марта 2025 года № 18/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Актогайского района
  kaz: Ақтоғай ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

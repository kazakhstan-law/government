  title:
    rus: О внесении изменения в постановление акимата Актогайского района от 21 декабря 2022 года № 72/01 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Актогайского района»
    kaz: Ақтоғай ауданының әкімдігінің 2022 жылғы 21 желтоқсандағы № 72/01 «Ақтоғай ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

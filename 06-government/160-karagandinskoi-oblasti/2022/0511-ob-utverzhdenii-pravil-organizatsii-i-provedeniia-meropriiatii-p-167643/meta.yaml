requisite: Постановление акимата Шетского района Карагандинской области от 11 мая 2022 года № 26/03. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 мая 2022 года № 28045
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Шетского района
  kaz: Шет ауданының елді-мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

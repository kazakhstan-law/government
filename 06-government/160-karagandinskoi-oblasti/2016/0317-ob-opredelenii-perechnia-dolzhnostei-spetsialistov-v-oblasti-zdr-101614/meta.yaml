act_code: '101614'
requisite: Постановление акимата Нуринского района Карагандинской области от 17 марта 2016 года № 08/03. Зарегистрировано Департаментом юстиции Карагандинской области 12 апреля 2016 года № 3750. Утратило силу постановлением акимата Нуринского района Карагандинской области от 23 июня 2020 года № 17/01 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные должностные оклады и тарифные ставки на двадцать пять процентов, за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен жиырма бес пайызға тарифтік мөлшерлеме және лауазымдық айлықақыларын көтеруге құқығы бар азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

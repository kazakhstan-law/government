act_code: '102289'
requisite: Постановление акимата Жанааркинского района Карагандинской области от 6 апреля 2016 года № 32/02. Зарегистрировано Департаментом юстиции Карагандинской области 26 апреля 2016 года № 3763. Утратило силу постановлением акимата Жанааркинского района Карагандинской области от 21 мая 2020 года № 53/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении  перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Жанааркинского района
  kaz: Жаңаарқа ауданы аумағындағы азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

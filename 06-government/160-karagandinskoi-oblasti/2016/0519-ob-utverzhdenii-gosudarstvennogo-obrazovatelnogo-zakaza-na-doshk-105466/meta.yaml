title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в расчете на одного воспитанника на 2016 год в дошкольных организациях города Приозерск
  kaz: Приозерск қаласының мектепке дейінгі ұйымдарындағы 2016 жылға арналған бір тәрбиеленушіге мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

title:
  rus: О признании утратившим силу постановление акимата города Темиртау от 2 апреля 2015 года № 13/1 «Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» исполнительных органов, финансируемых из бюджета города Темиртау»
  kaz: Теміртау қаласы әкімдігінің 2015 жылғы 2 сәуірдегі № 13/1 «Теміртау қаласының бюджетінен қаржыландырылатын атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы» қаулысының күшін жою туралы

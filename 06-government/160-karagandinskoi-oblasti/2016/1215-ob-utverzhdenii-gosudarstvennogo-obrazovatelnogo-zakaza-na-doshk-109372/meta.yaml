requisite: Постановление акимата города Приозерск Карагандинской области от 15 декабря 2016 года № 48/1. Зарегистрировано Департаментом юстиции Карагандинской области 18 января 2017 года № 4117. Утратило силу постановлением акимата города Приозерск Карагандинской области от 16 ноября 2017 года № 47/446
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в расчете на одного воспитанника на 2017 год в дошкольных организациях города Приозерск
  kaz: Приозерск қаласының мектепке дейінгі ұйымдарындағы 2017 жылға арналған бір тәрбиеленушіге мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Актогайского района от 23 февраля 2016 года № 30 «Об определении для заказчиков единого организатора государственных закупок и бюджетных программ, товаров, работ, услуг, по которым организация и проведение государственных закупок выполняется единым организатором»
    kaz: Ақтоғай аудандық әкімдігінің 2016 жылғы 23 ақпандағы «Тапсырыс берушілер үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушыны және мемлекеттік сатып алуды ұйымдастыру және өткізу бірыңғай ұйымдастырушымен орындалатын бюджеттік бағдарламалар, тауарлар, жұмыстар, көрсетілетін қызметтерді айқындау туралы» № 30 қаулысына өзгеріс енгізу туралы

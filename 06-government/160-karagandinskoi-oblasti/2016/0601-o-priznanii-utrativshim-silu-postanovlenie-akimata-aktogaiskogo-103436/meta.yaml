requisite: Постановление акимата Актогайского района Карагандинской области от 1 июня 2016 года № 22/02
title:
  rus: О признании утратившим силу постановление акимата Актогайского района от 01 февраля 2016 года № 04/01 "Об утверждении перечня предприятий, организаций, учреждений Актогайского района, в которых будут проводиться общественные работы на 2016 год"
  kaz: Ақтоғай ауданының әкімдігінің 2016 жылғы 01 ақпандағы № 04/01 "2016 жылға арналған қоғамдық жұмыстар жүргізілетін Ақтоғай ауданының кәсіпорындарының, ұйымдарының, мекемелерінің тізбесін бекіту туралы" қаулысының күшін жою туралы

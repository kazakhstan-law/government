requisite: Постановление акимата Карагандинской области от 19 февраля 2016 года № 09/03. Зарегистрировано Департаментом юстиции Карагандинской области 15 марта 2016 года № 3719. Утратило силу постановлением акимата Карагандинской области от 30 марта 2017 года № 19/05
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов, финансируемых из областного, городского и районного бюджетов Карагандинской области
  kaz: Қарағанды облысының облыстық, қалалық және аудандық бюджеттерінен қаржыландырылатын жергілікті атқарушы органдардың «Б»  корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

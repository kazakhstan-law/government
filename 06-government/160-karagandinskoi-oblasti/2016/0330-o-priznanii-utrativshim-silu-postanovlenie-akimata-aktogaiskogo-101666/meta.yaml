title:
  rus: О признании утратившим силу постановление акимата Актогайского района от 12 марта 2015 года № 08/01 "Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса "Б" местных исполнительных органов Актогайского района"
  kaz: Ақтоғай ауданының әкімдігінің 2015 жылғы 12 наурыздағы № 08/01 "Ақтоғай ауданының жергілікті атқарушы органдарының "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы" қаулысының күшін жою туралы

requisite: Постановление акимата Актогайского района Павлодарской области от 9 ноября 2016 года № 275 . Зарегистрировано Департаментом юстиции Павлодарской области 17 ноября 2016 года № 5268. Утратило силу постановлением акимата Актогайского района Павлодарской области от 5 июня 2017 года № 133 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, освобожденных из мест лишения свободы и лиц, состоящих на учете службы пробации в организациях Актогайского района на 2017 год
  kaz: Бас бостандығынан айыру орындарынан босатылған адамдарды және пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін 2017 жылға Ақтоғай ауданының ұйымдарында жұмыс орындарының квотасын белгілеу туралы

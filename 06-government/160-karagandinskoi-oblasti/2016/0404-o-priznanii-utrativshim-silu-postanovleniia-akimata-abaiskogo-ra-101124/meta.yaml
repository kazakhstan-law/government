title:
  rus: О признании утратившим силу постановления акимата Абайского района № 12/02 от 19 апреля 2012 года «Об определении сроков предоставления заявок на включение в список получателей субсидий и оптимальных сроков сева сельскохозяйственных культур»
  kaz: Абай ауданы әкімдігінің 2012 жылғы 19 сәуірдегі № 12/02 «Ауыл шаруашылық дақылдарының оңтайлы себу мерзімдері мен субсидия алушылардың тізіміне қосуға өтінімдерді ұсыну мерзімін анықтау туралы» қаулысының күшін жою туралы

act_code: '107619'
requisite: Постановление акимата города Приозерск Карагандинской области от 4 августа 2016 года № 28/4
title:
  rus: О признании утратившим силу постановления акимата города Приозерск от 3 октября 2013 года № 27/4  «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно исполнительной инспекции, а также лиц,освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций»
  kaz: Приозерск қаласы әкімдігінің 2013 жыл 3 қазандағы № 27/04 «Қылмыстық - атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдардың кәмелетке толмаған түлектері үшін жұмыс орындары квотасын белгілеу туралы» қаулысының күшін жою туралы

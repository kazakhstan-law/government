  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 26 января 2016 года № 05/01 «Об утверждении норматива субсидий на возмещение до 100% затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, критериев и требований к поставщикам услуг по искусственному осеменению, а также объемов субсидий по направлениям субсидирования развития племенного животноводства и повышения продуктивности и качества продукции животноводства»
    kaz: Қарағанды облысы әкімдігінің 2016 жылғы 26 қаңтардағы № 05/01 «Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100%-ға дейін өтеуге арналған субсидиялар нормативін, қолдан ұрықтандыру жөніндегі қызметтерді жеткізушіге қойылатын өлшемдер мен талаптарды, сондай-ақ асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/106581/rus

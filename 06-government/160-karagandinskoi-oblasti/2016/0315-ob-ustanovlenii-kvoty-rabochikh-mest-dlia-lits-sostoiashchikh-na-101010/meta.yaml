act_code: '101010'
requisite: Постановление акимата Актогайского района Павлодарской области от 15 марта 2016 года № 51. Зарегистрировано Департаментом юстиции Павлодарской области 06 апреля 2016 года № 5053. Утратило силу постановлением акимата Актогайского района Павлодарской области от 16 мая 2016 года № 102-1 (вводится в действие со дня подписания)
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

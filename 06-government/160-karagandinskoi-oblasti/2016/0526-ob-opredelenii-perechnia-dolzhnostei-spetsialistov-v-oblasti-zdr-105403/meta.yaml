  title:
    rus: О внесении изменения в постановление акимата Каркаралинского района от 26 мая 2016 года № 125 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Қарқаралы ауданы әкімдігінің 2016 жылғы 26 мамырдағы № 125 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына  өзгеріс енгізу туралы

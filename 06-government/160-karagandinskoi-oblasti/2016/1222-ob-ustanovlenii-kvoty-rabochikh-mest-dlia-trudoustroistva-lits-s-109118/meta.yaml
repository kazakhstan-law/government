act_code: '109118'
requisite: Постановление акимата Нуринского района Карагандинской области от 22 декабря 2016 года № 37/02. Зарегистрировано Департаментом юстиции Карагандинской области 6 января 2017 года № 4084. Утратило силу постановлением акимата Нуринского района Карагандинской области от 12 января 2018 года № 03/13
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц освобожденных из мест лишения свободы и для граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

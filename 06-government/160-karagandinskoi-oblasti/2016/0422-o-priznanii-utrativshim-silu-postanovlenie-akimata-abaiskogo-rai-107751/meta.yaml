  kaz: Абай ауданы әкімдігінің 2015 жылғы 3 желтоқсандағы № 39/05 «2016 жылы халықтың нысаналы топтарын және оларды жұмыспен қамтуға жәрдемдесу мен әлеуметтік қорғау бойынша шараларды анықтау жөніндегі» қаулысының күшін жою туралы

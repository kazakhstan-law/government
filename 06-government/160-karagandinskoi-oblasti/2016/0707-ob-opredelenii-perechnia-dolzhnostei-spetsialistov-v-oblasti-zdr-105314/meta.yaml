  title:
    rus: О внесении изменений в постановление акимата Карагандинской области от 7 июля 2016 года № 49/05 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими, работающих в сельской местности и имеющих право на повышенные должностные оклады и тарифные ставки на двадцать пять процентов, за счет средств областного бюджета»
    kaz: «Ауылдық жерлерде жұмыс істейтін, азаматтық қызметші болып табылатын денсаулық сақтау, әлеуметтiк қамтамасыз ету, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының және облыс бюджетінің қаражаттары есебінен лауазымдық жалақылары мен тарифтік ставкаларына жиырма бес пайыз көбейту құқығына ие лауазымдардың тізбесін айқындау туралы» Қарағанды облысы әкімдігінің 2016 жылғы 7 шілдедегі № 49/05 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/139790/rus

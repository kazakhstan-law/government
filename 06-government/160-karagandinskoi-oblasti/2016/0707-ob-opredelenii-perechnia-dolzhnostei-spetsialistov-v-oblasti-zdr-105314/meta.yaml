  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 7 июля 2016 года № 49/05 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности, которым за счет бюджетных средств устанавливаются повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки»
    kaz: «Бюджет қаражаты есебiнен кемiнде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгiленетiн, азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Қарағанды облысы әкімдігінің 2016 жылғы 7 шілдедегі № 49/05 қаулысына өзгеріс енгізу туралы

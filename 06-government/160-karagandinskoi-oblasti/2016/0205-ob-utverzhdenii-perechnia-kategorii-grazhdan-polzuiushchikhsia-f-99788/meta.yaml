requisite: Постановление акимата города Шахтинска Карагандинской области от 5 февраля 2016 года № 3/1. Зарегистрировано Департаментом юстиции Карагандинской области 1 марта 2016 года № 3681. Утратило силу постановлением акимата города Шахтинска Карагандинской области от 22 июня 2023 года № 29/01 (вводится в действие со дня его первого официального опубликования)
title:

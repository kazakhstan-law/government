requisite: Постановление акимата города Сарани Карагандинской области от 28 июля 2016 года № 30/04. Зарегистрировано Департаментом юстиции Карагандинской области 10 августа 2016 года № 3930. Утратило силу постановлением акимата города Сарани Карагандинской области от 16 февраля 2017 года № 08/01
title:

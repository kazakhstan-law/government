act_code: '101537'
requisite: Постановление акимата города Приозерск Карагандинской области от 21 января 2016 года № 2/1. Зарегистрировано Департаментом юстиции Карагандинской области 4 февраля 2016 года № 3648. Утратило силу постановлением акимата города Приозерск Карагандинской области от 29 февраля 2024 года № 10/39 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в Президенты  Республики Казахстан, депутаты Мажилиса Парламента Республики Казахстан по партийным спискам, областного и городского маслихата на территории города Приозерск
  kaz: Приозерск қаласының аумағында Қазақстан Республикасы Президенттігіне, Қазақстан Республикасы Парламент Мәжілісіне партиялық тізімдер бойынша, облыстық және қалалық мәслихат депутаттарына үміткерлерінің сайлаушылармен кездесу өткізу үшін үй-жайларды  және үгіттік баспа материалдарын  орналастыру үшін орындарды анықтау туралы

requisite: Постановление акимата Карагандинской области от 20 марта 2018 года № 12/02. Зарегистрировано Департаментом юстиции Карагандинской области 4 апреля 2018 года № 4679. Утратило силу постановлением акимата Карагандинской области от 25 апреля 2023 года № 27/01 (вводится в действие со дня его первого официального опубликования)
title:

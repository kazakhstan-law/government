act_code: '119755'
requisite: Постановление акимата Карагандинской области от 27 февраля 2018 года № 08/02. Зарегистрировано Департаментом юстиции Карагандинской области 19 марта 2018 года № 4656. Утратило силу постановлением акимата Карагандинской области от 26 марта 2020 года № 18/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего образования»
  kaz: «Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

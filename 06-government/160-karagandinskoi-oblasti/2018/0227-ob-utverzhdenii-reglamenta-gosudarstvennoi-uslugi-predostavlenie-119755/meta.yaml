  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 27 февраля 2018 года № 08/02 «Об утверждении регламента государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего образования»
    kaz: Қарағанды облысы әкімдігінің 2018 жылғы 27 ақпандағы № 08/02 «Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

title:
  rus: Об установлении государственному учреждению «Отдел жилищно-коммунального хозяйства, пассажирского транспорта, автомобильных дорог, строительства и жилищной инспекции города Темиртау» публичного сервитута на земельный участок
  kaz: «Теміртау қаласының тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі, автомобиль жолдары, құрылыс және тұрғын үй инспекциясы бөлімі» мемлекеттік мекемесіне жер учаскесiне қауымдық сервитут белгілеу туралы

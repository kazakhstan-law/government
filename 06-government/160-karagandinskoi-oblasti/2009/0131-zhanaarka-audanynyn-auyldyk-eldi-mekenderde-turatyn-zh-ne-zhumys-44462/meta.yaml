requisite: Қарағанды облысы Жаңаарқа ауданы мәслихатының 2009 жылғы 31 қаңтардағы № 13/123 шешімі. Қарағанды облысы Жаңаарқа ауданы Әділет басқармасында 2009 жылғы 23 ақпанда № 8-12-51 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа ауданы мәслихатының 2010 жылғы 16 тамыздағы № 25/228 шешімімен

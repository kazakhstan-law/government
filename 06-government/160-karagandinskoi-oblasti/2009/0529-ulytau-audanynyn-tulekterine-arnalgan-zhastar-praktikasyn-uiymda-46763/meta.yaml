act_code: '46763'
requisite: Қарағанды облысы Ұлытау ауданы әкімдігінің 2009 жылғы 29 мамырдағы № 09/05 қаулысы. Қарағанды облысы Ұлытау ауданының Әділет басқармасында 2009 жылғы 08 шілдеде № 8-16-45 тіркелді. Күші жойылды – Ұлытау облысы Ұлытау ауданының әкімдігінің 2024 жылғы 29 қазандағы № 39/01 (оның алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) қаулысымен

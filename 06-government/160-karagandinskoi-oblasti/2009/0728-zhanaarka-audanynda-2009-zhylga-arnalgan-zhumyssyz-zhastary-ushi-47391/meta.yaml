requisite: Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2009 жылғы 28 шілдедегі № 235 қаулысы. Қарағанды облысы Жаңаарқа ауданы Әділет басқармасында 2009 жылғы 14 тамызда № 8-12-56 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2010 жылғы 18 мамырдағы № 99 қаулысымен

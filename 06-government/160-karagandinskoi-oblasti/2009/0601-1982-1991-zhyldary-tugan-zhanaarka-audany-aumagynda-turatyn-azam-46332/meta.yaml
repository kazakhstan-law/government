requisite: Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2009 жылғы 1 маусымдағы № 170 қаулысы. Қарағанды облысы Жаңаарқа ауданы Әділет басқармасында 2009 жылғы 5 маусымда № 8-12-55 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2010 жылғы 22 сәуірдегі № 83 қаулысымен

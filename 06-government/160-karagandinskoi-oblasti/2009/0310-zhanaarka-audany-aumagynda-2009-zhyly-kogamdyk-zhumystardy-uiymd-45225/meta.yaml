requisite: Жаңаарқа ауданы аумағында 2009 жылы қоғамдық жұмыстарды ұйымдастыру туралы Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2009 жылғы 10 наурыздағы № 41 қаулысы. Қарағанды облысы Жаңаарқа ауданы әділет басқармасында 2009 жылғы 3 сәуірде № 8-12-53 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа ауданы әкімдігінің 2010 жылғы 10 қаңтардағы № 1 қаулысымен

act_code: '49567'
requisite: Қарағанды облысы Ақтоғай ауданы әкімдігінің 2009 жылғы 10 желтоқсандағы № 17/04 қаулысы. Қарағанды облысы Ақтоғай ауданының Әділет басқармасында 2009 жылғы 28 желтоқсанда № 8-10-97 тіркелді. Күші жойылды - Қарағанды облысы Ақтоғай ауданының әкімдігінің 2016 жылғы 16 қыркүйектегі № 44/02 қаулысымен

act_code: '34469'
requisite: Постановление акимата города Приозерск Карагандинской области № 20/2 от 16 июля 2007 года. Зарегистрировано управлением юстиции города Балхаша Карагандинской области 3 августа 2007 года № 8-4-82. Утратило силу постановлением акимата города Приозерск Карагандинской области от 24 февраля 2011 года № 5/7
title:
  rus: О согласовании дислокации мест для размещения агитационных печатных материалов и перечня помещения для организации и проведения встреч с избирателями во время выборов кандидатов в депутаты областного и городского маслихата, в Мажилис Парламента Республики Казахстан по партийным спискам по городу Приозерск
  kaz: Приозерск қаласы бойынша Қазақстан Ресупбликасы Парламенті Мәжілісінің партиялық тізімдер бойынша, облыстық және қалалық мәслихат депутаттарына үміткерлерінің сайлау мерзімінде сайлаушылармен кездесуге арналған орындары, үгіттік баспа материалдарын орналастыруға орындарын белгілеу туралы

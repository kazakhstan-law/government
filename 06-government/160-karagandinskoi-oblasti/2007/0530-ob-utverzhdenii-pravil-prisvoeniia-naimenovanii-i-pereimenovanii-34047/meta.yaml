requisite: Постановление акимата Карагандинской области от 30 мая 2007 года № 12/16. Зарегистрировано Департаментом юстиции Карагандинской области 10 июля 2007 года № 1831. Утратило силу постановлением акимата Карагандинской области от 22 февраля 2013 года № 09/07
title:
  rus: Об утверждении Правил присвоения наименований и переименования составных частей населенного пункта, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Карагандинской области
  kaz: Қарағанды облысы аумағындағы елді мекеннің құрамдас бөліктеріне атау беру және қайта атау, жер учаскелеріне, ғимараттар мен имараттарға реттік нөмірлер беру талаптарын белгілеу ережесін бекіту туралы

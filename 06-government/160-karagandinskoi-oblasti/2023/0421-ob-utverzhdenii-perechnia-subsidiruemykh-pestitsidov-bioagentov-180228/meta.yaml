  title:
    rus: О внесении изменений в постановление акимата Карагандинской области от 21 апреля 2023 года № 26/01 «Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и нормы субсидий на 1 литр (килограмм, грамм, штук) пестицидов, биоагентов (энтомофагов), а также объема бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2023 год»
    kaz: Қарағанды облысы әкімдігінің 2023 жылғы 21 сәуірдегі № 26/01 «2023 жылға арналған субсидияланатын пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі және пестицидтердің, биоагенттердiң (энтомофагтардың) 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормалары, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» қаулысына өзгерістер енгізу туралы

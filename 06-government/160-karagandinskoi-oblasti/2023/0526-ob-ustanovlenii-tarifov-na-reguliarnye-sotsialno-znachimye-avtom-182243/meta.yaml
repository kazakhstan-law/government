  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 26 мая 2023 года № 34/01 «Об установлении тарифов на регулярные социально значимые автомобильные перевозки пассажиров в межрайонном (междугородном внутриобластном) сообщении по Карагандинской области»
    kaz: Қарағанды облысы әкімдігінің 2023 жылғы 26 мамырдағы № 34/01 «Қарағанды облысы бойынша жолаушыларды ауданаралық (облысішілік қалааралық) қатынаста автомобильмен әлеуметтік мәні бар тұрақты тасымалдау тарифтерін белгілеу туралы» қаулысына өзгеріс енгізу туралы

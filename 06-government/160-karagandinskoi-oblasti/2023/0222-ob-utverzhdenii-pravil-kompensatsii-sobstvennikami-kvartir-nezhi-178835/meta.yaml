act_code: '178835'
requisite: Постановление акимата города Шахтинска Карагандинской области от 22 февраля 2023 года № 9/01. Зарегистрировано Департаментом юстиции Карагандинской области 27 февраля 2023 года № 6366-09. Утратило силу постановлением акимата города Шахтинска Карагандинской области от 14 марта 2025 года № 12/06 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил компенсации собственниками квартир, нежилых помещений затрат, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в городе Шахтинске Карагандинской области
  kaz: Қарағанды облысы Шахтинск қаласындағы пәтерлердің, тұрғын емес үй-жайлардың меншік иелерінің лифтілерді жөндеуге және ауыстыруға, көп пәтерлі тұрғын үйлерді күрделі жөндеуге байланысты шығындарды өтеу қағидаларын бекіту

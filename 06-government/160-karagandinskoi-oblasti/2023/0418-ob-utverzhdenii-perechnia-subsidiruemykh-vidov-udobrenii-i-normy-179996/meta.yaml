title:
  rus: Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2023 год
  kaz: 2023 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына,) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы

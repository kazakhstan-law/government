  title:
    rus: О внесении изменений в постановление акимата Карагандинской области от 18 апреля 2023 года № 25/02 «Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2023 год»
    kaz: Қарағанды облысы әкімдігінің 2023 жылғы 18 сәуірдегі № 25/02 «2023 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына,) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/188307/rus

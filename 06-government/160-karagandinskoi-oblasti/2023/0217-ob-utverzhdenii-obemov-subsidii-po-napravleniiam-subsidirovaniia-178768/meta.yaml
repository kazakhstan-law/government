  title:
    rus: О внесении изменений и дополнений в постановление акимата Карагандинской области от 17 февраля 2023 года № 12/01 «Об утверждении объемов бюджетных субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства на 2023 год»
    kaz: Қарағанды облысы әкімдігінің 2023 жылғы 17 ақпандағы № 12/01 «2023 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша бюджеттік субсидиялар көлемдерін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

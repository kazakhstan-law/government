  requisite: Постановление акимата Карагандинской области от 12 декабря 2023 года № 90/03. Зарегистрировано в Департаменте юстиции Карагандинской области 19 декабря 2023 года № 6533-09
  title:
    rus: О внесении изменений в постановление акимата Карагандинской области от 17 февраля 2023 года № 12/01 «Об утверждении объемов бюджетных субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, а также нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных на 2023 год»
    kaz: Қарағанды облысы әкімдігінің 2023 жылғы 17 ақпандағы № 12/01 «2023 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, сондай-ақ ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарды және өтінім беру мерзімдерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/190203/rus

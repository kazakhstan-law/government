  title:
    rus: О внесении изменений в постановление акимата Абайского района Карагандинской области от 08 февраля 2023 года № 06/07 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Абайского района»
    kaz: Қарағанды облысы Абай ауданының әкімдігінің 2023 жылғы 08 ақпандағы № 06/07 «Абай ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

act_code: '178608'
requisite: Постановление акимата Абайского района Карагандинской области от 8 февраля 2023 года № 06/07. Зарегистрировано Департаментом юстиции Карагандинской области 10 февраля 2023 года № 6358-09. Утратило силу постановлением акимата Абайского района Карагандинской области от 16 апреля 2025 года № 22/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Абайского района
  kaz: Абай ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

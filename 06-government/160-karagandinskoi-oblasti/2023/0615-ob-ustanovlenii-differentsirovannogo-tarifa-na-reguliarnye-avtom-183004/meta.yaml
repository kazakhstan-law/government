requisite: Постановление акимата города Балхаш Карагандинской области от 15 июня 2023 года № 27/01. Зарегистрировано в Департаменте юстиции Карагандинской области 16 июня 2023 года № 6433-09. Утратило силу постановлением акимата города Балхаш Карагандинской области от 7 августа 2025 года № 38/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

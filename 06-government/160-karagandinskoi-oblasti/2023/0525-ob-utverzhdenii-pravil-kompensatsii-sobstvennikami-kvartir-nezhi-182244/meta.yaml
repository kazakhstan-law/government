requisite: Постановление акимата Каркаралинского района Карагандинской области от 25 мая 2023 года № 129. Зарегистрировано Департаментом юстиции Карагандинской области 30 мая 2023 года № 6422-09. Утратило силу постановлением акимата Каркаралинского района Карагандинской области от 10 апреля 2025 года № 117 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил компенсации собственниками квартир, нежилых помещений затрат, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в Каркаралинском районе
  kaz: Қарқаралы ауданындағы пәтерлердің, тұрғын емес үй-жайлардың меншік иелерінің лифттерді жөндеуге және ауыстыруға, көппәтерлі тұрғын үйді күрделі жөндеуге байланысты шығындарды өтеу қағидаларын бекіту туралы

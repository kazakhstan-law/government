  title:
    rus: О внесении изменений в постановление акимата Карагандинской области от 26 мая 2015 года №27/04 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: Қарағанды облысы әкімдігінің 2015 жылғы 26 мамырдағы №27/04 «Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

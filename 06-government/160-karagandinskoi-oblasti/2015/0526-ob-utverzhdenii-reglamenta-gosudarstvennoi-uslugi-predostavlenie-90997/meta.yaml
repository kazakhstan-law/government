  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 26 мая 2015 года № 27/04 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елдi мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын көрсету» мемлекеттiк көрсетілетін қызмет регламентiн бекiту туралы» Қарағанды облысы әкімдігінің 2015 жылғы 26 мамырдағы № 27/04 қаулысына өзгеріс енгізу туралы

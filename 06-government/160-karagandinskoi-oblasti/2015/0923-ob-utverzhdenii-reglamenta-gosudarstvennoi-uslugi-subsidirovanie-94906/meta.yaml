    kaz: Қарағанды облысы әкімдігінің 2015 жылғы 23 қыркүйектегі № 56/04 «Өсiмдiктердi қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердiң, биоагенттердiң (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

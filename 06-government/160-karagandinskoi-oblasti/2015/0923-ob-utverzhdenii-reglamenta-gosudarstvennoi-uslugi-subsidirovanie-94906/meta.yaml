  title:
    rus: О внесении изменений и дополнения в постановление акимата Карагандинской области от 23 сентября 2015 года № 56/04 «Об утверждении регламента государственной услуги «Субсидирование стоимости гербицидов, биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений»
    kaz: Қарағанды облысы әкімдігінің 2015 жылғы 23 қыркүйектегі № 56/04 «Өсiмдiктердi қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердiң, биоагенттердiң (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер мен толықтыру енгізу туралы

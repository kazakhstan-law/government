  title:
    rus: О внесении изменения и дополнения в постановление акимата Каркаралинского района от 17 ноября 2015 года № 353 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Каркаралинского района»
    kaz: Қарқаралы ауданы әкімдігінің 2015 жылғы 17 қарашадағы № 353 «Қарқаралы ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы» қаулысына өзгеріс пен толықтыру енгізу туралы

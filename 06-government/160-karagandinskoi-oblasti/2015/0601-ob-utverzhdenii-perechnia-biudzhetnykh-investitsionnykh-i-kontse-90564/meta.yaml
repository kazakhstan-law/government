act_code: '90564'
requisite: Постановление акимата Карагандинской области от 1 июня 2015 года № 29/02. Зарегистрировано Департаментом юстиции Карагандинской области 10 июня 2015 года № 3251. Прекращено действие в связи с истечением срока (письмо управления экономики и финансов Карагандинской области от 8 апреля 2016 года № 15-9.587)
title:
  rus: Об утверждении перечня бюджетных инвестиционных и концессионных проектов, финансирование которых осуществляется за счет средств распределяемой бюджетной программы 064 "Разработка или корректировка, а также проведение необходимых экспертиз технико-экономических обоснований местных бюджетных инвестиционных проектов и конкурсных документаций концессионных проектов, консультативное сопровождение концессионных проектов" государственного учреждения "Управление экономики и финансов Карагандинской области" на 2015 год
  kaz: '"Қарағанды облысының экономика және қаржы басқармасы" мемлекеттік мекемесінің 2015 жылға арналған "Жергілікті бюджеттік инвестициялық жобалардың техникалық-экономикалық негіздемелерін және концессиялық жобалардың конкурстық құжаттамаларын әзірлеу немесе түзету, сондай-ақ қажетті сараптамаларын жүргізу, концессиялық жобаларды консультативтік сүйемелдеу" 064 бөлінетін бюджеттік бағдарламасының қаражаты есебінен қаржыландыру жүзеге асырылатын бюджеттік инвестициялық және концессиялық жобалардың тізбесін бекіту туралы'

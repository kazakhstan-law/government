act_code: '98880'
requisite: Постановление акимата города Балхаш Карагандинской области от 18 декабря 2015 года № 51/01. Зарегистрировано Департаментом юстиции Карагандинской области 14 января 2016 года № 3614. Утратило силу постановлением акимата города Балхаш Карагандинской области от 12 мая 2016 года № 18/02
title:
  rus: Об утверждении перечня предприятий, организаций и учреждений города Балхаш, в которых будут проводиться общественные работы в 2016 году, видов, конкретных условий, объемов работ и размера оплаты труда
  kaz: 2016 жылы қоғамдық жұмыстар жүргізілетін Балқаш қаласының кәсіпорындары, ұйымдары мен мекемелерінің тізбесін, жұмыстардың түрлерін, нақты жағдайларын, көлемдерін және еңбекақы төлеу мөлшерін бекіту туралы

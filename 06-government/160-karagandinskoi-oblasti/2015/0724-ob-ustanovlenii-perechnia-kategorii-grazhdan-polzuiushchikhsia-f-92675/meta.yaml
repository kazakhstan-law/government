requisite: Постановление акимата Актогайского района Павлодарской области от 24 июля 2015 года № 204. Зарегистрировано Департаментом юстиции Павлодарской области 11 августа 2015 года № 4652
title:
  rus: Об установлении перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а также размеров льгот в Актогайском районе
  kaz: Ақтоғай ауданында мүгедектерді қоспағанда, дене шынықтыру -сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы

act_code: '92784'
requisite: Постановление от 04.05.2015 №11/01, Акимат г. Сатпаева
title:
  rus: Об утверждении перечня бюджетных инвестиционных проектов и концессионных проектов, финансирование разработки или корректировки, а также проведение необходимых экспертиз технико-экономических обоснований которых осуществляется за счет средств распределяемой бюджетной программы государственного учреждения «Отдел экономики и финансов города Сатпаев» на 2015 год
  kaz: 2015 жылға арналған «Сәтбаев қаласының экономика және қаржы бөлімі» мемлекеттік мекемесінің бөлінетін бюджеттік бағдарламасының қаражаттары есебінен техникалық - экономикалық негіздемелерін әзірлеуді немесе түзетуді, сонымен қатар қажетті сараптамалар жүргізуді қаржыландыру жүзеге асырылатын бюджеттік инвестициялық жобалар мен концессиялық  жобалар тізбесін бекіту туралы

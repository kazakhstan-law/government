title:
  rus: О признании утратившим силу постановления акимата города Каражал №13 от 23 января 2015 года «Об утверждении Правил расчета ставки арендной платы при передаче коммунального имущества города Каражал в имущественный наем (аренду)»
  kaz: Қаражал қаласы әкімдігінің 2015 жылғы 23 қаңтардағы «Қаражал қаласының коммуналдық мүлікті мүліктік жалдауға (жалға алуға) беру кезінде жалдау ақысының мөлшерлемесін есептеу қағидаларын бекіту туралы» №13 қаулысының күшін жою туралы

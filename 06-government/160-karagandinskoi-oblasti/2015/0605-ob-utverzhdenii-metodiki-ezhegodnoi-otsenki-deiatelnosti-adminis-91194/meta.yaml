requisite: Постановление акимата Карагандинской области от 5 июня 2015 года № 30/03. Зарегистрировано Департаментом юстиции Карагандинской области 30 июня 2015 года № 3309. Утратило силу постановлением акимата Карагандинской области от 19 февраля 2016 года № 09/03
title:
  rus: Об утверждении Методики ежегодной оценки деятельности  административных государственных служащих корпуса «Б» местных исполнительных органов, финансируемых из областного, городского и районного бюджетов Карагандинской области
  kaz: Қарағанды облысының облыстық, қалалық және аудандық бюджеттерден қаржыландырылатын жергілікті атқарушы органдардың «Б»  корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

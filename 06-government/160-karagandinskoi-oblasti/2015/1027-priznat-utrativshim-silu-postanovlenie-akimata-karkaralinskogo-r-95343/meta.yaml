title:
  rus: Признать утратившим силу постановление акимата Каркаралинского района от 14 июля 2015 года № 211 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Каркаралинского района»
  kaz: Қарқаралы ауданы әкімдігінің 2015 жылғы 14 шілдедегі № 211 «Қарқаралы ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы» қаулысының күшін жою туралы

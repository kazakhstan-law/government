requisite: Постановление акимата Осакаровского района Карагандинской области от 15 сентября 2015 года № 47/03. Зарегистрировано Департаментом юстиции Карагандинской области 6 октября 2015 года № 3432. Утратило силу постановлением акимата Осакаровского района Карагандинской области от 19 июля 2024 года № 63/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а также размеров льгот
  kaz: Мүгедектерді қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата города Жезказган от 27 августа 2015 года № 19/34 «Об утверждении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а так же размеров льгот»
    kaz: Жезқазған қаласының әкімдігінің 2015 жылғы 27 тамыздағы № 19/34 «Мүгедектерді қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

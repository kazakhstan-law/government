act_code: '98178'
requisite: Постановление акимата города Сатпаев Карагандинской области от 4 ноября 2015 года № 26/01. Зарегистрировано Департаментом юстиции Карагандинской области 27 ноября 2015 года № 3517. Утратило силу постановлением акимата города Сатпаев области Ұлытау от 22 мая 2024 года № 36/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а также размеров  льгот
  kaz: Мүгедектерді қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін бекіту туралы

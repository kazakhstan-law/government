requisite: Постановление акимата города Сатпаев Карагандинской области от 24 февраля 2015 года № 05/04. Зарегистрировано Департаментом юстиции Карагандинской области 10 марта 2015 года № 3021. Утратило силу постановлением акимата города Сатпаев Карагандинской области от 10 марта 2022 года № 18/01 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об утверждении Положения государственного  учреждения «Отдел жилищно-коммунального хозяйства, пассажирского транспорта, автомобильных дорог, строительства и жилищной инспекции города Сатпаев»
  kaz: «Сәтбаев қаласының тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі, автокөлік жолдары, құрылыс және тұрғын үй инспекциясы бөлімі» мемлекеттік мекемесініңережесін бекіту туралы

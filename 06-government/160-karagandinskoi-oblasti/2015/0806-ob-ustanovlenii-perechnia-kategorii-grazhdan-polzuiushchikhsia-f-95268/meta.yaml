act_code: '95268'
requisite: Постановление акимата города Сарани Карагандинской области от 6 августа 2015 года № 30/03. Зарегистрировано Департаментом юстиции Карагандинской области 7 сентября 2015 года № 3397. Утратило силу постановлением акимата города Сарани Карагандинской области от 30 апреля 2024 года № 28/01 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об установлении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а также размеров льгот
  kaz: Мүгедектерді қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы

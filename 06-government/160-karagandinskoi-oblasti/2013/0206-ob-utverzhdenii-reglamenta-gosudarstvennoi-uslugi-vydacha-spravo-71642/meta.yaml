act_code: '71642'
requisite: Постановление акимата города Сатпаев Карагандинской области от 6 февраля 2013 года № 02/32. Зарегистрировано Департаментом юстиции Карагандинской области 20 марта 2013 года № 2255. Утратило силу постановлением акимата города Сатпаев Карагандинской области от 27 мая 2013 года № 12/14
title:
  rus: Об утверждении регламента государственной услуги "Выдача справок в пенсионные фонды, банки для распоряжения вкладами несовершеннолетних детей, в территориальные подразделения Комитета дорожной полиции Министерства внутренних дел Республики Казахстан для оформления наследства несовершеннолетним детям"
  kaz: '"Зейнетақы қорларына, банктерге кәмелетке толмағандардың салымдарына иелік ету үшін, Қазақстан Республикасы Ішкі істер министрлігі Жол полициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтамалар беру" мемлекеттік қызмет регламентін бекіту туралы'

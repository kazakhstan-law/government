requisite: Постановление акимата города Сатпаев Карагандинской области от 6 февраля 2013 года № 02/33. Зарегистрировано Департаментом юстиции Карагандинской области 20 марта 2013 года № 2256. Утратило силу постановлением акимата города Сатпаев Карагандинской области от 27 мая 2013 года № 12/15
title:
  rus: Об утверждении регламента государственной услуги "Выдача справок органов осуществляющих функции по опеке и попечительству для оформления сделок с имуществом, принадлежащим на праве собственности несовершеннолетним детям"
  kaz: '"Қамқорлық және қорғау жөніндегі қызмет атқарушы органдарымен, кәмелетке толмаған балалардың меншік құқығындағы жылжымалы мүлікке қатысты мәмiлелердiң ресiмдеуi үшін анықтама беру" мемлекеттік қызмет регламентін бекіту туралы'

act_code: '71556'
requisite: Постановление акимата Нуринского района Карагандинской области от 20 февраля 2013 года № 06/01. Зарегистрировано Департаментом юстиции Карагандинской области 14 марта 2013 года № 2229. Утратило силу постановлением акимата Нуринского района Карагандинской области от 28 февраля 2014 года № 07/02
title:
  rus: Об установлении квоты рабочих мест для лиц состоящих на учете службы пробации уголовно-исполнительной инспекции, лиц освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Нуринском районе
  kaz: Нұра ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, интернат ұйымдарының кәмелетке толмаған бітірушілері үшін және бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

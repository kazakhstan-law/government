act_code: '71424'
requisite: Постановление акимата Осакаровского района Карагандинской области от 6 февраля 2013 года № 06/01. Зарегистрировано Департаментом юстиции Карагандинской области 7 марта 2013 года № 2215. Утратило силу постановлением акимата Осакаровского района Карагандинской области от 29 апреля 2013 года № 23/01
title:
  rus: Об утверждении регламента оказания государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтiк қолдау шараларын ұсыну" мемлекеттік қызмет көрсету регламентін бекіту туралы'

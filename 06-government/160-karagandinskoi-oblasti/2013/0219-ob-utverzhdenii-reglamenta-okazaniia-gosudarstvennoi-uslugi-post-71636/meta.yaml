act_code: '71636'
requisite: Постановление акимата Жанааркинского района Карагандинской области от 19 февраля 2013 года № 09/01. Зарегистрировано Департаментом юстиции Карагандинской области 20 марта 2013 года № 2249. Утратило силу постановлением акимата Жанааркинского района Карагандинской области от 30 апреля 2013 года № 31/01
title:
  rus: Об утверждении регламента оказания государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттiк тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергiлiктi атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегі" мемлекеттік қызмет көрсету регламентін бекіту туралы'

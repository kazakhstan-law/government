act_code: '72008'
requisite: Постановление акимата Жанааркинского района Карагандинской области от 5 марта 2013 года № 13/01. Зарегистрировано Департаментом юстиции Карагандинской области 12 апреля 2013 года № 2298. Утратило силу постановлением акимата Жанааркинского района Карагандинской области от 30 апреля 2013 года № 31/01
title:
  rus: Об утверждении регламента оказания государственной услуги "Выдача справок в пенсионные фонды, банки для распоряжения вкладами несовершеннолетних детей, в территориальные подразделения Комитета дорожной полиции Министерства внутренних дел Республики Казахстан для оформления наследства несовершеннолетним детям"
  kaz: '"Зейнетақы қорларына, банктерге кәмелетке толмағандардың салымдарына иелік ету үшін, Қазақстан Республикасы Ішкі істер министрлігі Жол полициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтамалар беру" мемлекеттік қызмет көрсету регламентін бекіту туралы'

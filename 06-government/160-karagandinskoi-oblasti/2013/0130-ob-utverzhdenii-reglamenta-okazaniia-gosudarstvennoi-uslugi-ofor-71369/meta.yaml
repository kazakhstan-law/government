act_code: '71369'
requisite: Постановление акимата Актогайского района Карагандинской области от 30 января 2013 года № 03/03. Зарегистрировано Департаментом юстиции Карагандинской области 5 марта 2013 года № 2197. Утратило силу постановлением акимата Актогайского района Карагандинской области от 2 мая 2013 года № 12/02
title:
  rus: Об утверждении регламента оказания государственной услуги "Оформление документов на социальное обслуживание в государственных и негосударственных медико-социальных учреждениях (организациях), предоставляющих услуги за счет государственных бюджетных средств"
  kaz: '"Мемлекеттiк бюджет қаражаты есебінен қызмет көрсететін мемлекеттiк және мемлекеттік емес медициналық-әлеуметтiк мекемелерде (ұйымдарда) әлеуметтiк қызмет көрсетуге арналған құжаттарды ресiмдеу" мемлекеттік қызмет көрсету регламентін бекіту туралы'

act_code: '75023'
requisite: Постановление акимата города Приозерск Карагандинской области от 3 октября 2013 года № 27/04. Зарегистрировано Департаментом юстиции Карагандинской области 31 октября 2013 года № 2411. Утратило силу постановлением акимата города Приозерск Карагандинской области от 4 августа 2016 года № 28/4
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдардың кәмелетке толмаған түлектерi үшiн жұмыс орындары квотасын белгiлеу туралы

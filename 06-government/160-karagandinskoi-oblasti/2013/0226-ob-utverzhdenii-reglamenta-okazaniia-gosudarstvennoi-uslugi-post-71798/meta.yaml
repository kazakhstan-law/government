act_code: '71798'
requisite: Постановление акимата Актогайского района Карагандинской области от 26 февраля 2013 года № 06/02. Зарегистрировано Департаментом юстиции Карагандинской области 29 марта 2013 года № 2273. Утратило силу постановлением акимата Актогайского района Карагандинской области от 2 мая 2013 года № 12/02
title:
  rus: Об утверждении регламента оказания государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегі" мемлекеттік қызмет көрсету регламентін бекіту туралы'

title:
  rus: Об утверждении регламента оказания государственной услуги "Оформление документов на инвалидов для обеспечения их сурдо-тифлотехническими средствами и обязательными гигиеническими средствами"
  kaz: '"Мүгедектерді сурдо-тифлотехникалық құралдармен және міндетті гигиеналық құралдармен қамтамасыз ету үшін оларға құжаттар ресімдеу" мемлекеттік қызмет көрсету регламентін бекіту туралы'

act_code: '73482'
requisite: Постановление акимата Карагандинской области от 10 июня 2013 года № 35/07. Зарегистрировано Департаментом юстиции Карагандинской области 16 июля 2013 года № 2361. Утратило силу постановлением акимата Карагандинской области от 12 сентября 2014 года № 47/02
title:
  rus: Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений) и определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения) по согласованию с уполномоченным органом в сфере религиозной деятельности"
  kaz: '"Дін қызметі саласындағы уәкілетті органмен келісім бойынша ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

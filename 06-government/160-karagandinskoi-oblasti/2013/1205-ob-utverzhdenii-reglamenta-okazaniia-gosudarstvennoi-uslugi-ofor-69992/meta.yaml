requisite: Постановление акимата Улытауского района Карагандинской области от 5 декабря 2012 года № 30/04. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2013 года № 2104. Утратило силу постановлением акимата Улытауского района Карагандинской области от 20 июня 2013 года № 16/05
title:
  rus: Об утверждении регламента оказания государственной услуги "Оформление документов на социальное обслуживание в государственных и негосударственных медико-социальных учреждениях (организациях), предоставляющих услуги за счет государственных бюджетных средств"
  kaz: '"Мемлекеттiк бюджет қаражаты есебiнен қызмет көрсететiн мемлекеттiк және мемлекеттiк емес медициналық-әлеуметтiк мекемелерде (ұйымдарда) әлеуметтiк қызмет көрсетуге арналған құжаттарды ресiмдеу" мемлекеттік қызмет көрсету регламентін бекіту туралы'

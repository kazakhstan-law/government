act_code: '71883'
requisite: Постановление акимата города Темиртау Карагандинской области от 28 февраля 2013 года № 9/4. Зарегистрировано Департаментом юстиции Карагандинской области 4 апреля 2013 года № 2275. Утратило силу постановлением акимата города Темиртау Карагандинской области от 2 мая 2013 года № 18/23
title:
  rus: Об утверждении регламента оказания государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою" мемлекеттік қызмет көрсету регламентін бекіту туралы'

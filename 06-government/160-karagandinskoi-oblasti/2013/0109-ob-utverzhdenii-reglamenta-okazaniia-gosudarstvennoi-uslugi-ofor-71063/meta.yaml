requisite: Постановление акимата Улытауского района Карагандинской области от 9 января 2013 года № 01/04. Зарегистрировано Департаментом юстиции Карагандинской области 20 февраля 2013 года № 2174. Утратило силу постановлением акимата Улытауского района Карагандинской области от 20 июня 2013 года № 16/05
title:
  rus: Об утверждении регламента оказания государственной услуги "Оформление документов на социальное обслуживание на дому для одиноких, одиноко проживающих престарелых, инвалидов и детей-инвалидов, нуждающихся в постороннем уходе и помощи"
  kaz: '"Жалғызiлiктi, жалғыз тұратын қарттарға, бөгде адамның күтiмiне және жәрдемiне мұқтаж мүгедектерге және мүгедек балаларға үйде әлеуметтiк қызмет көрсетуге құжаттарды ресiмдеу" мемлекеттік қызмет көрсету регламентін бекіту туралы'

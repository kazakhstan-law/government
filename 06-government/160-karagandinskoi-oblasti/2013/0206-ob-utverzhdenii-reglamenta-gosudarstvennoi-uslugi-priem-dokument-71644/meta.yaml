act_code: '71644'
requisite: Постановление акимата города Сатпаев Карагандинской области от 6 февраля 2013 года № 02/37. Зарегистрировано Департаментом юстиции Карагандинской области 20 марта 2013 года № 2257. Утратило силу постановлением акимата города Сатпаев Карагандинской области от 27 мая 2013 года № 12/18
title:
  rus: Об утверждении регламента государственной услуги "Прием документов для организации индивидуального бесплатного обучения на дому детей, которые по состоянию здоровья в течении длительного времени не могут посещать организации начального, основного, общего среднего образования"
  kaz: '"Бастауыш, негізгі орта, жалпы орта білім беру ұйымдарына денсаулығына байланысты ұзақ уақыт бойы бара алмайтын балаларды үйде жеке тегін оқытуды ұйымдастыру үшін құжаттарды қабылдау" мемлекеттік қызмет регламентін бекіту туралы'

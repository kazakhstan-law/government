requisite: Постановление акимата Жанааркинского района Карагандинской области от 5 марта 2013 года № 13/05. Зарегистрировано Департаментом юстиции Карагандинской области 12 апреля 2013 года № 2300. Утратило силу постановлением акимата Жанааркинского района Карагандинской области от 30 апреля 2013 года № 31/01
title:
  rus: Об утверждении регламента оказания государственной услуги "Выдача справок органов, осуществляющих функции по опеке или попечительству для оформления сделок с имуществом, принадлежащим на праве собственности несовершеннолетним детям"
  kaz: '"Кәмелетке толмағандарға меншік құқығында тиесілі мүлікпен мәмілелерді ресімдеу үшін қорғаншылық немесе қамқоршылық жөніндегі функцияларды жүзеге асыратын органдардың анықтамаларын беру" мемлекеттік қызмет көрсету регламентін бекіту туралы'

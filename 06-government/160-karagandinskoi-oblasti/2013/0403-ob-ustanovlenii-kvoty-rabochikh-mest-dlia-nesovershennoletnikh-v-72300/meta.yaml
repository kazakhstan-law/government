  kaz: Интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар, бас бостандығынан айыру орындарынан босатылған адамдар және қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшiн жұмыс орындарына квота белгiлеу туралы

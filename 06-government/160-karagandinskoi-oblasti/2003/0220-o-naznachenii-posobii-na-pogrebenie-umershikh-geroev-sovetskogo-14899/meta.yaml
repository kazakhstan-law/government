act_code: '14899'
requisite: Постановление Акимата города Караганды от 20 февраля 2003 года № 4/48. Зарегистрировано Управлением юстиции Карагандинской области 11 марта 2003 года за № 1109. Утратило силу постановлением Акимата города Караганды от 19 января 2005 года № 3/15
title:
  rus: О назначении пособий на погребение умерших Героев Советского Союза, "Халык кахарманы", Героев Социалистического труда, награжденных Орденом Славы трех степеней и орденом "Отан" из числа участников и инвалидов войны на 2003 год
  kaz: «2003 жылға арналған соғыс мүгедектерді мен қатысушылары санынан Кеңес Одағаның Батыры, «Халық қаһарманы», Социалистік Еңбек Ері, «Даңқ» орденінің үш дәрежесімен, «Отан» орденімен марапатталған азаматтардың қайтыс болғандарын жерлеуге жәрдемақы тағайындау туралы»

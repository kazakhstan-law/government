requisite: Қарағанды облысы Ақтоғай ауданы әкімиятының 2003 жылғы 27 наурыздағы № 03/22 қаулысы. Қарағанды облысының әділет басқармасында 2003 жылғы 8 мамырда № 1172 тіркелді. Күші жойылды – Қарағанды облысы Ақтоғай ауданының әкімдігінің 2024 жылғы 4 қыркүйектегі № 46/01 (оның алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) қаулысымен

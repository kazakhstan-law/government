act_code: '132397'
requisite: Постановление акимата Абайского района Карагандинской области от 7 июня 2019 года № 23/01. Зарегистрировано Департаментом юстиции Карагандинской области 7 июня 2019 года № 5380. Утратило силу постановлением акимата Абайского района Карагандинской области от 21 февраля 2024 года № 09/01 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
  rus: О предоставлении помещений для встреч с избирателями и определении мест для размещения агитационных печатных материалов кандидатов в Президенты Республики Казахстан, депутаты Парламента Республики Казахстан и депутаты маслихата
  kaz: Қазақстан Республикасының Президенттігіне, Қазақстан Республикасы Парламентінің депутаттығына және мәслихат депутаттығына кандидаттардың сайлаушылармен кездесу үшін үй-жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

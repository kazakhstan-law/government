requisite: Постановление акимата города Каражал Карагандинской области от 9 января 2019 года № 1. Зарегистрировано Департаментом юстиции Карагандинской области 15 января 2019 года № 5153. Утратило силу постановлением акимата города Каражал области Ұлытау от 1 февраля 2023 года № 5 (вводится в действие со дня его первого официального опубликования)
title:

act_code: '134349'
requisite: Постановление акимата Абайского района Карагандинской области от 28 августа 2019 года № 36/01. Зарегистрировано Департаментом юстиции Карагандинской области 29 августа 2019 года № 5445. Утратило силу постановлением акимата Абайского района Карагандинской области от 15 апреля 2021 года № 19/01 (вводится в действие с 1 января 2021 года)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими, работающих в сельской местности и имеющих право на повышенные должностные оклады и тарифные ставки на двадцать пять процентов, за счет средств местного бюджета
  kaz: Азаматтық қызметші болып табылатын ауылдық жерлерде жұмыс істейтін, денсаулық сақтау, әлеуметтiк қамтамасыз ету, бiлiм беру, мәдениет, спорт және ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының және жергілікті бюджетінің қаражаттары есебінен лауазымдық жалақылары мен тарифтік ставкаларына жиырма бес пайыз көбейту құқығына ие лауазымдардың тізбесін айқындау туралы

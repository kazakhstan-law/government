act_code: '129792'
requisite: Постановление акимата города Сарани Карагандинской области от 18 марта 2019 года № 14/02. Зарегистрировано Департаментом юстиции Карагандинской области 20 марта 2019 года № 5243
title:
  rus: Об установлении публичного сервитута на земельный участок, на территории города Сарани, для строительства отводящих газопроводов от автономной газораспределительной станции – «Караганда» до поселка Дубовка, поселка Актас и города Сарани с учетом внутриквартальных сетей
  kaz: «Қарағанды» автономды газ тарату станциясынан Дубовка кентіне, Ақтас кентіне және Саран қаласына дейін бұратын газ құбырларын салу үшін кварталішілік желілерді есепке ала отырып Саран қаласының аумағында жер учаскесіне қауымдық сервитут белгілеу туралы

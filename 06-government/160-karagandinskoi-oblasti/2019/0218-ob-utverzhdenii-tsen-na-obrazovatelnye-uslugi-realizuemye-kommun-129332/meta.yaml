  kaz: Саран қаласы әкімдігінің, «Саран қаласының білім бөлімі» мемлекеттік мекемесінің «Балалар өнер мектебі» коммуналдық мемлекеттік қазыналық кәсіпорны өткізетін білім беру қызметтеріне бағалар бекіту туралы

requisite: Постановление акимата города Сарани Карагандинской области от 18 февраля 2019 года № 08/02. Зарегистрировано Департаментом юстиции Карагандинской области 22 февраля 2019 года № 5200. Утратило силу постановлением акимата города Сарани Карагандинской области от 18 сентября 2024 года № 64/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

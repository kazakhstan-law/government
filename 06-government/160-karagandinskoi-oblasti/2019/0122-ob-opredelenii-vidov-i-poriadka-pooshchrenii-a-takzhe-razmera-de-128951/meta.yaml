requisite: Постановление акимата Осакаровского района Карагандинской области от 22 января 2019 года № 05/01. Зарегистрировано Департаментом юстиции Карагандинской области 28 января 2019 года № 5170. Утратило силу постановлением акимата Осакаровского района Карагандинской области от 17 августа 2026 года № 82/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Осакаровском районе
  kaz: Осакаров ауданында қоғамдық тәртiптi қамтамасыз етуге қатысатын азаматтарды көтермелеудiң түрлерi мен тәртiбiн, сондай-ақ оларға ақшалай сыйақының мөлшерiн айқындау туралы

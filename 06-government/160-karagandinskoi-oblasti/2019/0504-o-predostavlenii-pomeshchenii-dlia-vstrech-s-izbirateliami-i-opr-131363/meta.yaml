requisite: Постановление акимата Каркаралинского района Карагандинской области от 4 мая 2019 года № 163. Зарегистрировано Департаментом юстиции Карагандинской области 6 мая 2019 года № 5321. Утратило силу постановлением акимата Каркаралинского района Карагандинской области от 9 апреля 2024 года № 86 (вводится в действие со дня его первого официального опубликования)
title:

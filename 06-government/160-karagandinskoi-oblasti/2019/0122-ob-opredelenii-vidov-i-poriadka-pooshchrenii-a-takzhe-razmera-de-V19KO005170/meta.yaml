  kaz: Осакаров ауданында қоғамдық тәртiптi қамтамасыз етуге қатысатын азаматтарды көтермелеудiң түрлерi мен тәртiбiн, сондай-ақ оларға ақшалай сыйақының мөлшерiн айқындау туралы

  title:
    rus: О признании утратившим силу постановления акимата Осакаровского района Карагандинской области от 22 января 2019 года № 05/01 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Осакаровском районе»
    kaz: Осакаров ауданы әкімдігінің 2019 жылғы 22 қаңтардағы № 05/01 «Осакаров ауданында қоғамдық тәртiптi қамтамасыз етуге қатысатын азаматтарды көтермелеудiң түрлерi мен тәртiбiн, сондай-ақ оларға ақшалай сыйақының мөлшерiн айқындау туралы» қаулысының күші жойылды деп тану туралы

  title:
    rus: О внесении изменения в постановление акимата Карагандинской области от 2 мая 2019 года № 27/01 «Об утверждении объемов бюджетных субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства на 2019 год»
    kaz: Қарағанды облысы әкімдігінің 2019 жылғы 2 мамырдағы № 27/01 «2019 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша бюджеттік субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

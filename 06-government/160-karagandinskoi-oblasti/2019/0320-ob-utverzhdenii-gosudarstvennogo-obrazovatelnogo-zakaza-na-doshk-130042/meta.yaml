  kaz: 2019 жылға арналған Балқаш қаласы бойынша мектепке дейінгі ұйымдардағы бір тәрбиеленушіге есептегенде мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, ата-ана төлемақысының мөлшерін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата города Балхаш от 20 марта 2019 года № 12/03 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера родительской платы в расчете на одного воспитанника в дошкольных организациях по городу Балхаш на 2019 год»
    kaz: Балқаш қаласы әкімдігінің 2019 жылғы 20 наурыздағы № 12/03 «2019 жылға арналған Балқаш қаласы бойынша мектепке дейінгі ұйымдардағы бір тәрбиеленушіге есептегенде мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, ата-ана төлемақысының мөлшерін бекіту туралы» қаулысына өзгеріс енгізу туралы

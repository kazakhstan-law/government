title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории Бухар-Жырауского района
  kaz: Бұқар жырау ауданының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

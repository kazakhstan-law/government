act_code: '129431'
requisite: Постановление акимата города Каражал Карагандинской области от 21 февраля 2019 года № 36. Зарегистрировано Департаментом юстиции Карагандинской области 25 февраля 2019 года № 5206. Утратило силу постановлением акимата города Каражал Карагандинской области от 15 января 2020 года № 5 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы и лиц, состоящих на учете службы пробации города Каражал
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды және Қаражал қаласы пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

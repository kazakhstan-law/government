  title:
    rus: О признании утратившим силу постановления акимата Каркаралинского района Карагандинской области от 4 февраля 2019 года № 38 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Каркаралинском районе»
    kaz: «Қарқаралы ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» Қарағанды облысы Қарқаралы ауданы әкімдігінің 2019 жылғы 4 ақпандағы № 38 қаулысының күші жойылды деп тану туралы

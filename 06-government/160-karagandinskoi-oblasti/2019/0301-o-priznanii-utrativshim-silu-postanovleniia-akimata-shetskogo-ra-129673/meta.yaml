title:
  rus: О признании утратившим силу постановления акимата Шетского района от 09 января 2017 года № 01/02 «Об утверждении перечня товаров, работ, услуг, по которым организация и проведение государственных закупок осуществляется единым организатором»
  kaz: Шет ауданы әкімдігінің 2017 жылғы 09 қаңтардағы «Мемлекеттік сатып алуды ұйымдастыруды және өткізуді бірыңғай ұйымдастырушы жүзеге асыратын тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы» № 01/02 қаулысының күшін жою туралы

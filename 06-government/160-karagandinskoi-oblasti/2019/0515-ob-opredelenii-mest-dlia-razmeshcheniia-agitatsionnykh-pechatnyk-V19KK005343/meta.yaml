  title:
    rus: О внесении изменений в постановление акимата Бухар-Жырауского района Карагандинской области от 15 мая 2019 года № 22/01 «О предоставлении помещений для встреч с избирателями и определении мест для размещения агитационных печатных материалов кандидатов в Президенты Республики Казахстан, депутаты Парламента Республики Казахстан и депутаты маслихата»
    kaz: «Қазақстан Республикасының Президенттігіне, Қазақстан Республикасы Парламентінің депутаттығына және мәслихат депутаттығына кандидаттардың сайлаушылармен кездесу үшін үй-жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы» Қарағанды облысы Бұқар жырау ауданы әкімдігінің 2019 жылғы 15 мамырындағы № 22/01 қаулысына өзгерістер енгізу туралы

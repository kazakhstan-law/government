title:
  rus: Об оказании дополнительного вида социальной помощи в виде дополнительных надбавок на уход к государственным социальным пособиям одиноким инвалидам 1, 2 группы, нуждающимся в посторонней помощи
  kaz: Басқа адамның көмегіне мұқтаж 1, 2 топтағы жалғыз басты мүгедектерді күтуге мемлекеттік әлеуметтік жәрдемақыларға қосымша үстемақылар түрінде әлеуметтік көмектің қосымша түрін көрсету туралы

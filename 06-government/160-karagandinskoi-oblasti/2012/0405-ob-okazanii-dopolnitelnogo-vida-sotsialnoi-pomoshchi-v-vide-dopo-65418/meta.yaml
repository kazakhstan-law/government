requisite: Постановление акимата Карагандинской области от 5 апреля 2012 года № 11/12. Зарегистрировано Департаментом юстиции Карагандинской области 11 мая 2012 года № 1907. Утратило силу постановлением акимата Карагандинской области от 15 сентября 2023 года № 66/01 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:

act_code: '70149'
requisite: Постановление акимата города Балхаша Карагандинской области от 24 декабря 2012 года № 49/02. Зарегистрировано Департаментом юстиции Карагандинской области 18 января 2013 года № 2115. Утратило силу в связи с истечением срока применения (письмо акима города Балхаш Карагандинской области от 31 января 2014 года № 4-13/140)
title:
  rus: Об утверждении перечня предприятий, организаций и учреждений города Балхаш, видов, конкретных условий, объемов и размера оплаты труда, в которых будут проводиться общественные работы в 2013 году
  kaz: 2013 жылы қоғамдық жұмыстар жүргізілетін Балқаш қаласының кәсіпорындары, ұйымдары мен мекемелерінің тізбесін, жұмыстардың түрлерін, нақты жағдайларын, көлемдерін және еңбекақы төлеу мөлшерін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата города Балхаша от 24 декабря 2012 года № 49/02 "Об утверждении перечня предприятий, организаций и учреждений города Балхаш, видов, конкретных условий, объемов и размера оплаты труда, в которых будут проводиться общественные работы в 2013 году"
    kaz: Балқаш қаласы әкімдігінің 2012 жылғы 24 желтоқсандағы № 49/02 "2013 жылы қоғамдық жұмыстар жүргізілетін Балқаш қаласының кәсіпорындары, ұйымдары мен мекемелерінің тізбесін, жұмыстардың түрлерін, нақты жағдайларын, көлемдерін және еңбекақы төлеу мөлшерін бекіту туралы" қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата города Сатпаев Карагандинской области от 12 декабря 2012 года № 26/25. Зарегистрировано Департаментом юстиции Карагандинской области 22 января 2013 года № 2121. Утратило силу постановлением акимата города Сатпаев Карагандинской области от 27 мая 2013 года № 12/33
title:
  rus: Об утверждении регламента государственной услуги "Оформление документов на социальное обслуживание на дому для одиноких, одиноко проживающих престарелых, инвалидов и детей-инвалидов, нуждающихся в постороннем уходе и помощи"
  kaz: '"Жалғызілікті, жалғыз тұратын қарттарға, бөгде адамның күтіміне және жәрдеміне мұқтаж мүгедектерге және мүгедек балаларға үйде әлеуметтік қызмет көрсетуге құжаттарды ресімдеу" мемлекеттік қызмет регламентін бекiту туралы'

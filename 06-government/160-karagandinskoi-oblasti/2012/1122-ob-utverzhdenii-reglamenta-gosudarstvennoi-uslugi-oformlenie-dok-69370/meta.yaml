requisite: Постановление акимата города Сарани Карагандинской области от 22 ноября 2012 года № 43/19. Зарегистрировано Департаментом юстиции Карагандинской области 21 декабря 2012 года № 2050. Утратило силу постановлением акимата города Сарани Карагандинской области от 17 мая 2013 года № 19/01
title:
  rus: Об утверждении регламента государственной услуги "Оформление документов на инвалидов для предоставления им услуг индивидуального помощника для инвалидов первой группы, имеющих затруднение в передвижении, и специалиста жестового языка для инвалидов по слуху"
  kaz: '"Қозғалуға қиындығы бар бірінші топтағы мүгедектерге жеке көмекшінің және есту бойынша мүгедектерге қолмен көрсететін тіл маманының қызметтерін ұсыну үшін мүгедектерге құжаттарды ресімдеу" мемлекеттік қызмет регламентін бекіту туралы'

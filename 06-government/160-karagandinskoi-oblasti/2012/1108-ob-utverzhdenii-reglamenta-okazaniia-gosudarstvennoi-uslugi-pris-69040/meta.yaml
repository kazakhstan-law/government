act_code: '69040'
requisite: Постановление акимата города Сарани Карагандинской области от 8 ноября 2012 года № 41/02. Зарегистрировано Департаментом юстиции Карагандинской области 7 декабря 2012 года № 2010. Утратило силу постановлением акимата города Сарани Карагандинской области от 17 мая 2013 года № 19/01
title:
  rus: 'Об утверждении регламента оказания государственной услуги "Присвоение спортивных разрядов и категорий: второй и третий, первый, второй и третий юношеские, тренер высшего и среднего уровня квалификации второй категории, инструктор-спортсмен высшего уровня квалификации второй категории, методист высшего и среднего уровня квалификации второй категории, судья по спорту"'
  kaz: '"Екінші және үшінші разрядтар, бірінші, екінші және үшінші жасөспірімдік разрядтар, біліктілігі жоғары және орта деңгейдегі екінші санатты жаттықтырушы, біліктілігі жоғары деңгейдегі екінші санатты нұсқаушы-спортшы, біліктілігі жоғары және орта деңгейдегі екінші санатты әдіскер, спорт төрешісі спорттық разрядтары мен санаттарын беру" мемлекеттік қызмет көрсету регламентін бекіту туралы'

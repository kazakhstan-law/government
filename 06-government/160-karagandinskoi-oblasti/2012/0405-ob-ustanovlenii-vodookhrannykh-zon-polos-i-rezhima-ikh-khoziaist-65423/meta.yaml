act_code: '65423'
requisite: Постановление акимата Карагандинской области от 5 апреля 2012 года № 11/05. Зарегистрировано Департаментом юстиции Карагандинской области 11 мая 2012 года № 1912. Утратило силу постановлением акимата Карагандинской области от 4 октября 2024 года № 60/03 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон, полос и режима их хозяйственного использования на Саранском, Ащисуском, Шокайском, Кокпектинском, Краснополянском, Шерубай-Нуринском водохранилищах, на озерах Сасыкколь, Балыктыколь, Карасор, Балыкты Карагандинской области
  kaz: Қарағанды облысының Саран, Ащысу, Шоқай, Көкпекті, Краснополянский, Шерубай-Нұра су қоймаларында, Сасықкөл, Балықтыкөл, Қарасор, Балықты көлдерінде су қорғау аймақтары мен белдеулерін орнату және оларды шаруашылыққа пайдалану тәртібі туралы

act_code: '69237'
requisite: Постановление акимата города Сарани Карагандинской области от 15 ноября 2012 года № 42/04. Зарегистрировано Департаментом юстиции Карагандинской области 14 декабря 2012 года № 2023. Утратило силу постановлением акимата города Сарани Карагандинской области от 17 мая 2013 года № 19/01
title:
  rus: Об утверждении регламента оказания государственной услуги "Прием документов для организации индивидуального бесплатного обучения на дому детей, которые по состоянию здоровья в течение длительного времени не могут посещать организации начального, основного среднего, общего среднего образования"
  kaz: '"Бастауыш, негізгі орта, жалпы орта білім беру ұйымдарына денсаулығына байланысты ұзақ уақыт бойы бара алмайтын балаларды үйде жеке тегін оқытуды ұйымдастыру үшін құжаттарды қабылдау" мемлекеттік қызмет көрсету регламентін бекіту туралы'

requisite: Постановление акимата Карагандинской области от 5 апреля 2012 года № 11/06. Зарегистрировано Департаментом юстиции Карагандинской области 11 мая 2012 года № 1913. Утратило силу постановлением акимата Карагандинской области от 15 октября 2025 года № 60/02 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон, полос и режима их хозяйственного использования на реках Нура в административных границах Карагандинской области, Шерубай-Нура, Сарысу, Сокыр, Карагандинка, на озерах Копколь, Баракколь, Ащиколь, на Федоровском, Самаркандском, Ынтымакском и Жартасском водохранилищах Карагандинской области
  kaz: Қарағанды облысының әкімшілік шекарасындағы Нұра өзенінде, Қарағанды облысының Шерубай-Нұра, Сарысу, Соқыр, Карагандинка өзендерінде, Көпкөл, Барақкөл, Ащыкөл көлдерінде, Федоров, Самарқант, Ынтымақ, Жартас Cу қоймаларында су қорғау аймақтары мен белдеулерін орнату және оларды шаруашылыққа пайдалану тәртібі туралы

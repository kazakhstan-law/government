requisite: Постановление акимата Актогайского района Павлодарской области от 11 декабря 2012 года № 338. Зарегистрировано Департаментом юстиции Павлодарской области 27 декабря 2012 года № 3305. Утратило силу постановлением акимата Актогайского района Павлодарской области от 20 июня 2013 года № 142
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегі" мемлекеттік регламентін бекіту туралы

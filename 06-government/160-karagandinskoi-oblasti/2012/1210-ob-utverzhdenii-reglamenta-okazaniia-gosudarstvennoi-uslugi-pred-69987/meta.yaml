act_code: '69987'
requisite: Постановление акимата Жанааркинского района Карагандинской области от 10 декабря 2012 года № 65/02. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2013 года № 2099. Утратило силу постановлением акимата Жанааркинского района Карагандинской области от 30 апреля 2013 года № 31/01
title:
  rus: Об утверждении регламента оказания государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызмет көрсету регламентін бекіту туралы'

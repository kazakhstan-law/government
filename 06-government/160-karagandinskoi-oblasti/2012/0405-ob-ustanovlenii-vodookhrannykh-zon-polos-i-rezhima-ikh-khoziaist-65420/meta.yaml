act_code: '65420'
requisite: Постановление акимата Карагандинской области от 5 апреля 2012 года N 11/02. Зарегистрировано Департаментом юстиции Карагандинской области 11 мая 2012 года N 1909. Утратило силу постановлением акимата Карагандинской области от 15 октября 2025 года № 60/02 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон, полос и режима их хозяйственного использования на реках Кон, Жаманкон, Жаксыкон, Улкенкундузды, Соналы, Куланотпес, Жаксысарысу, Жамансарысу Карагандинской области
  kaz: Қарағанды облысының Қон, Жаманқон, Жақсықон, Үлкенқұндызды, Соналы, Құланөтпес, Жақсысарысу, Жамансарысу өзендерінде су қорғау аймақтары мен белдеулерін орнату және оларды шаруашылыққа пайдалану тәртібі туралы

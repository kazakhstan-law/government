act_code: '68811'
requisite: Постановление акимата Нуринского района Карагандинской области от 21 ноября 2012 года № 29/01. Зарегистрировано Департаментом юстиции Карагандинской области 26 ноября 2012 года № 1990. Утратило силу постановлением акимата Нуринского района Карагандинской области от 6 мая 2013 года № 12/02
title:
  rus: Об утверждении регламента оказания государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елдi мекендерге жұмыс істеуге және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтiк қолдау шараларын ұсыну" мемлекеттік қызмет көрсету регламентін бекіту туралы'

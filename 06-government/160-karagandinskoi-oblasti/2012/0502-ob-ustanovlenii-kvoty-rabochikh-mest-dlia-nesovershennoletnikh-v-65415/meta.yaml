title:
  rus: Об установлении квоты рабочих мест для несовершеннолетних выпускников интернатных организаций, лиц, освобожденных из мест лишения свободы и лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции
  kaz: Интернаттық ұйымдарды бітіруші кәмелетке толмағандар, бас бостандығынан айыру орындарынан босатылған адамдар және қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін жұмыс орындарына квота белгілеу туралы

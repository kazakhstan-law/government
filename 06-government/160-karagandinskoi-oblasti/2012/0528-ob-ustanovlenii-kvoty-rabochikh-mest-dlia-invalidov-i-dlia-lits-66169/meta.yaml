requisite: Постановление акимата Шетского района Карагандинской области от 28 мая 2012 года № 13/01. Зарегистрировано Управлением юстиции Шетского района Карагандинской области 19 июня 2012 года № 8-17-135. Утратило силу постановлением акимата Шетского района Карагандинской области от 6 мая 2016 года № 21/03
title:
  rus: Об установлении квоты рабочих мест для инвалидов и для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы по Шетскому району
  kaz: Шет ауданы бойынша мүгедектер үшін және қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшiн жұмыс орындарының квотасын белгiлеу туралы

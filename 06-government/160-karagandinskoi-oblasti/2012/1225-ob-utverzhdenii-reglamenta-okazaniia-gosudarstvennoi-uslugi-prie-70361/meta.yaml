requisite: Постановление акимата Абайского района Карагандинской области от 25 декабря 2012 года № 41/19. Зарегистрировано Департаментом юстиции Карагандинской области 24 января 2013 года № 2137. Утратило силу постановлением акимата Абайского района Карагандинской области от 20 мая 2013 года № 17/24
title:
  rus: Об утверждении регламента оказания государственной услуги "Прием документов для предоставления бесплатного подвоза к общеобразовательным организациям и обратно домой детям, проживающим в отдаленных сельских пунктах"
  kaz: '"Шалғайдағы ауылдық елдi мекендерде тұратын балаларды жалпы бiлiм беру ұйымдарына және үйлерiне керi тегiн тасымалдауды ұсыну үшiн құжаттар қабылдау" мемлекеттiк қызмет көрсету регламентiн бекіту туралы'

requisite: Постановление акимата города Сарани Карагандинской области от 22 ноября 2012 года № 43/08. Зарегистрировано Департаментом юстиции Карагандинской области 21 декабря 2012 года № 2053. Утратило силу постановлением акимата города Сарани Карагандинской области от 17 мая 2013 года № 19/01
title:
  rus: Об утверждении регламента государственной услуги "Оформление документов на социальное обслуживание в государственных и негосударственных медико-социальных учреждениях (организациях), предоставляющих услуги за счет государственных бюджетных средств"
  kaz: '"Мемлекеттік бюджет қаражаты есебінен қызмет көрсететін мемлекеттік және мемлекеттік емес медициналық әлеуметтік мекемелерде (ұйымдарда) әлеуметтік қызмет көрсетуге арналған құжаттарды ресімдеу" мемлекеттік қызмет регламентін бекіту туралы'

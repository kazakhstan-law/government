act_code: '67629'
requisite: Постановление акимата города Сарани Карагандинской области от 23 августа 2012 года N 31/01. Зарегистрировано Департаментом юстиции Карагандинской области 20 сентября 2012 года N 1940. Утратило силу постановлением акимата города Сарани Карагандинской области от 2 июня 2016 года N 21/02
title:
  rus: Об установлении квоты рабочих мест для инвалидов, лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Мүгедектер, қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдардың кәмелетке толмаған түлектері үшін жұмыс орындары квотасын белгілеу туралы

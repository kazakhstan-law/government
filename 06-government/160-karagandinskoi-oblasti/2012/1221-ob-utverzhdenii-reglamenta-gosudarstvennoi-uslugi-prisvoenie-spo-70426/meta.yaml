requisite: Постановление акимата Каркаралинского района Карагандинской области от 21 декабря 2012 года № 406. Зарегистрировано Департаментом юстиции Карагандинской области 25 января 2013 года № 2139. Утратило силу постановлением акимата Каркаралинского района Карагандинской области от 18 декабря 2013 года № 377
title:
  rus: 'Об утверждении регламента государственной услуги "Присвоение спортивных разрядов и категорий: второй и третий, первый, второй и третий юношеские, тренер высшего и среднего уровня квалификации второй категории, инструктор-спортсмен высшего уровня квалификации второй категории, методист высшего и среднего уровня квалификации второй категории, судья по спорту"'
  kaz: '"Екiншi және үшiншi, жасөспiрiмдер арасындағы бiрiншi, екiншi және үшiншi, бiлiктiлiгi жоғары және орта деңгейдегi екiншi санатты жаттықтырушы, бiлiктiлiгi жоғары деңгейдегi екiншi санатты нұсқаушы-спортшы, бiлiктiлiгi жоғары және орта деңгейдегi екiншi санатты әдiскер, спорт төрешiсi спорттық разрядтары мен санаттарын беру" мемлекеттiк қызмет көрсету регламентін бекiту туралы'

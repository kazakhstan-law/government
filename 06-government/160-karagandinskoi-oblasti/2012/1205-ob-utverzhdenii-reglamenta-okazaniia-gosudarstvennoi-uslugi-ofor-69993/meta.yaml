act_code: '69993'
requisite: Постановление акимата Улытауского района Карагандинской области от 5 декабря 2012 года № 30/05. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2013 года № 2105. Утратило силу постановлением акимата Улытауского района Карагандинской области от 20 июня 2013 года № 16/05
title:
  rus: Об утверждении регламента оказания государственной услуги "Оформление документов на инвалидов для предоставления им услуг индивидуального помощника для инвалидов первой группы, имеющих затруднение в передвижении и специалиста жестового языка для инвалидов по слуху"
  kaz: '"Қозғалуға қиындығы бар бірінші топтағы мүгедектерге жеке көмекшінің және есту бойынша мүгедектерге қолмен көрсететін тіл маманының қызметтерін ұсыну үшін мүгедектерге құжаттарды ресімдеу" мемлекеттік қызмет көрсету регламентін бекіту туралы'

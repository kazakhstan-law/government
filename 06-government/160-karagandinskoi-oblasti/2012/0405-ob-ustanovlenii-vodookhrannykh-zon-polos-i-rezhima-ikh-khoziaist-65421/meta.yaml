act_code: '65421'
requisite: Постановление акимата Карагандинской области от 5 апреля 2012 года № 11/03. Зарегистрировано Департаментом юстиции Карагандинской области 11 мая 2012 года № 1910. Утратило силу постановлением акимата Карагандинской области от 4 октября 2024 года № 60/03 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

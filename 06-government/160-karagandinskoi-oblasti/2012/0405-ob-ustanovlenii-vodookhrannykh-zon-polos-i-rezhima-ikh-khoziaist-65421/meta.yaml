  kaz: Қарағанды облысының Ащилыайрық, Кіші Бұқпа, Үлкен Бұқпа, Солонка, Узенка, Веснянка, Көкпекті, Талды, Шажағай, Сарыбұлақ өзендерінде су қорғау аймақтары мен белдеулерін орнату және оларды шаруашылыққа пайдалану тәртібі туралы

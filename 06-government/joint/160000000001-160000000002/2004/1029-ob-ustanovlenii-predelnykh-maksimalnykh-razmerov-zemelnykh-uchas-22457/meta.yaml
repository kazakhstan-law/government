act_code: '22457'
requisite: Постановление Акимата Карагандинской области от 29 октября 2004 года № 21/02 и решение X сессии Маслихата Карагандинской области от 11 декабря 2004 года № 152. Зарегистрировано Департаментом юстиции Карагандинской области 7 января 2005 года за № 1679. Утратило силу совместным постановлением акимата Карагандинской области от 26 июня 2025 года № 35/01 и решением Карагандинского областного маслихата от 26 июня 2025 года № 300 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении предельных (максимальных) размеров земельных участков, которые могут находиться в частной собственности граждан Республики Казахстан по Карагандинской области
  kaz: Қазақстан Республикасы азаматтарының жеке меншігінде болуы мүмкін жер телімдерінің Қарағанды облысы бойынша шекті (барынша) мөлшерлерін белгілеу туралы

  title:
    rus: О внесении изменения в совместное постановление акимата Карагандинской области от 12 марта 2013 года № 14/05 и решение Карагандинского областного маслихата от 28 марта 2013 года № 141 «Об установлении минимальных размеров земельных участков сельскохозяйственного назначения в зависимости от местных условий и особенностей использования указанных земель, предоставляемых в собственность или землепользование в Карагандинской области»
    kaz: «Қарағанды облысындағы жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы» Қарағанды облысы әкімдігінің 2013 жылғы 12 наурыздағы № 14/05 және Қарағанды облыстық мәслихатының 2013 жылғы 28 наурыздағы № 141 бірлескен қаулысы және шешіміне өзгеріс енгізу туралы

act_code: '64001'
requisite: Совместное постановление акимата Карагандинской области от 27 февраля 2012 года N 07/01 и решение II сессии Карагандинского областного маслихата от 2 марта 2012 года N 27. Зарегистрировано Департаментом юстиции Карагандинской области 11 марта 2012 года N 1905. Утратило силу совместным постановлением акимата Карагандинской области от 11 апреля 2016 года N 24/07 и решением II сессии Карагандинского областного маслихата от 28 апреля 2016 года N 30
title:
  rus: Об установлении базовых ставок платы за земельные участки при их предоставлении в частную собственность в областном центре, городах областного и районного значения, поселках и сельских населенных пунктах
  kaz: Облыс орталығында, облыстық және аудандық маңызы бар қалаларда, кенттер мен ауылдық елді мекендерде жер учаскелері жеке меншікке берілген кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы

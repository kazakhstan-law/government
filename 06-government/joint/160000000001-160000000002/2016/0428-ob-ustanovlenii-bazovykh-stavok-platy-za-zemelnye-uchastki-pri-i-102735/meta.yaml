title:
  rus: Об установлении базовых ставок платы за земельные участки при их предоставлении в частную собственность в областном центре, городах  областного  и районного значения, поселках и сельских населенных  пунктах
  kaz: Облыс орталығында, облыстық және  аудандық  маңызы  бар қалаларда,  кенттер мен ауылдық елді мекендерде жер учаскелері жеке меншікке берілген кезде  олар үшін төлемақының базалық  ставкаларын  белгілеу туралы

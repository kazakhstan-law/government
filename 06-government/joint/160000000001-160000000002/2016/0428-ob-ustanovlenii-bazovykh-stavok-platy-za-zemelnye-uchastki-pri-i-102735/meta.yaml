  title:
    rus: О внесении изменения в совместное постановление акимата Карагандинской области от 11 апреля 2016 года № 24/07 и решение Карагандинского областного маслихата от 28 апреля 2016 года № 30 «Об установлении базовых ставок платы за земельные участки при их предоставлении в частную собственность в областном центре, городах областного и районного значения, поселках и сельских населенных пунктах»
    kaz: Қарағанды облысы әкімдігінің 2016 жылғы 11 сәуірдегі № 24/07 бірлескен қаулысына және Қарағанды облыстық мәслихатының 2016 жылғы 28 сәуірдегі № 30 «Облыс орталығында, облыстық және аудандық маңызы бар қалаларда, кенттер мен ауылдық елді мекендерде жер учаскелері жеке меншікке берілген кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы» шешіміне өзгеріс енгізу туралы

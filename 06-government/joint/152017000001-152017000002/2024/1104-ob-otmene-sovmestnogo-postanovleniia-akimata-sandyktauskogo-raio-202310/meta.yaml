act_code: '202310'
requisite: Совместные постановление акимата Сандыктауского района Акмолинской области от 4 ноября 2024 года № А-11/246 и решение Сандыктауского районного маслихата Акмолинской области от 4 ноября 2024 года № 15/5
title:
  rus: Об отмене совместного постановления акимата Сандыктауского района Акмолинской области от 5 сентября 2024 года № А-9/209 и решения Сандыктауского районного маслихата Акмолинской области от 5 сентября 2024 года № 14/7 «О расширении границ (черты) населенного пункта села Хуторок, в связи с переводом земельного участка из категории лесного фонда в земли населенных пунктов»
  kaz: Ақмола облысы Сандықтау ауданы әкімдігінің 2024 жылғы 5 қыркүйектегі № А-9/209 бірлескен қаулысының және Ақмола облысы Сандықтау аудандық мәслихатының 2024 жылғы 5 қыркүйектегі № 14/7 «жер учаскесін орман қоры санатынан елді мекендердің жерлеріне ауыстыруға байланысты Хуторок ауылының елді мекенінің шекарасын (шегін) кеңейту туралы» шешімінің күшін жою туралы

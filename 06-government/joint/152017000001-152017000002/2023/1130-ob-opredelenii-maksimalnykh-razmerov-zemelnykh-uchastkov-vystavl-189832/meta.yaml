act_code: '189832'
requisite: Совместное постановление акимата Сандыктауского района Акмолинской области от 30 ноября 2023 года № А-12/277 и решение Сандыктауского районного маслихата Акмолинской области от 30 ноября 2023 года № 7/3. Зарегистрировано Департаментом юстиции Акмолинской области 11 декабря 2023 года № 8665-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства по Сандыктаускому району
  kaz: Сандықтау ауданы бойынша шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

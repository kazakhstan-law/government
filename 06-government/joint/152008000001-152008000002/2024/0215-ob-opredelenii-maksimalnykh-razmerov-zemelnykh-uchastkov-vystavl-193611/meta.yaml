act_code: '193611'
requisite: Совместное постановление акимата Буландынского района Акмолинской области от 15 февраля 2024 года № А-2/60 и решение Буландынского районного маслихата Акмолинской области от 15 февраля 2024 года № 8С-15/1. Зарегистрировано Департаментом юстиции Акмолинской области 22 февраля 2024 года № 8697-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства по Буландынскому району
  kaz: Бұланды ауданы бойынша шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с акиматом города Шымкент при проведении национальной переписи населения Республики Казахстан в 2020 году в учреждениях и организациях акимата города Шымкент
  kaz: Шымкент қаласы әкімдігінің мекемелері мен ұйымдарында 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Шымкент қаласының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

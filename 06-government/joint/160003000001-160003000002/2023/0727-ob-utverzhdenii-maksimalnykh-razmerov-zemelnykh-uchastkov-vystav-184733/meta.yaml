act_code: '184733'
requisite: Совместные постановление акимата города Сарани Карагандинской области от 27 июля 2023 года № 47/05 и решение Саранского городского маслихата Карагандинской области от 3 августа 2023 года № 52
title:
  rus: Об утверждении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства по городу Сарани и поселку Актас
  kaz: Саран қаласы және Ақтас кенті бойынша шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін бекіту туралы

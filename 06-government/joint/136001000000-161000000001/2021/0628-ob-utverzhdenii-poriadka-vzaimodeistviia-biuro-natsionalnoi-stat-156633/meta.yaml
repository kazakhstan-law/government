act_code: '156633'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 140 и Постановление акимата Кызылординской области от 28 июня 2021 года № 293
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Кызылординской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Кызылординской области
  kaz: Қызылорда облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Қызылорда облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

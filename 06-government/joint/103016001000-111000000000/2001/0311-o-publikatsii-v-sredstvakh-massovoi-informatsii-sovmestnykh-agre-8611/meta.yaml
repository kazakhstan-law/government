requisite: Совместное постановление Национальной комиссии Республики Казахстан по ценным бумагам от 11 марта 2001 года № 793 и Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 11 марта 2001 года № 23-П. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2001 года № 1464. Утратило силу - постановлением Правления Национального Банка Республики Казахстан от 29 мая 2003 года № 178
title:

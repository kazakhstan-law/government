  title:
    rus: О внесении изменения в совместное постановление акимата города Усть-Каменогорска от 22 января 2021 года № 235 и решение Усть-Каменогорского городского маслихата от 22 января 2021 года № 2/4-VII «Об установлении льготы по оплате проезда отдельной категории граждан на общественном транспорте (кроме такси) города Усть-Каменогорска»
    kaz: Өскемен қаласы әкімдігінің 2021 жылғы 22 қаңтардағы № 235 және Өскемен қалалық мәслихатының 2021 жылғы 22 қаңтардағы № 2/4-VII «Өскемен қаласының қоғамдық көлігінде (таксиден басқа) азаматтардың жекелеген санаттарының жолақысын төлеу бойынша жеңілдік белгілеу туралы» бірлескен қаулысы мен шешіміне өзгеріс енгізу туралы

act_code: '152606'
requisite: Совместное постановление акимата города Усть-Каменогорска от 22 января 2021 года № 235 и решение Усть-Каменогорского городского маслихата от 22 января 2021 года № 2/4-VII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 января 2021 года № 8387. Утратило силу совместным постановлением акимата города Усть-Каменогорска Восточно-Казахстанской области от 25 августа 2025 года № 2638 и решением Усть-Каменогорского городского маслихата Восточно-Казахстанской области от 21 августа 2025 года № 37/8-VIII (вводится в действие после дня его первого официального опубликования)
title:

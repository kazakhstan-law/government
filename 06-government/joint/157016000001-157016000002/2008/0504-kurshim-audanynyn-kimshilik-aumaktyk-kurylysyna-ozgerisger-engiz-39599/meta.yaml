act_code: '39599'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2008 жылғы 4 мамырдағы № 717 қаулысы, Күршім аудандық мәслихатының 2008 жылғы 14 мамырдағы № 6-2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2008 жылғы 15 мамырда № 5-14-68 тіркелді

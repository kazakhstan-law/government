requisite: Алматы облысы Балқаш аудандық мәслихатының 2008 жылғы 19 маусымдағы № 10-48 шешімі және Балқаш ауданы әкімдігінің 2008 жылғы 17 маусымдағы № 6-9 қаулысы. Алматы облысының әділет департаменті Балқаш ауданының әділет басқармасында 2008 жылы 21 шілдеде № 2-6-47 тіркелді. Күші жойылды - Алматы облысы Балқаш ауданы әкімінің 2009 жылғы 10 желтоқсандағы № 12-13 шешімімен және Алматы облысы Балқаш аудандық мәслихатының 2009 жылғы 1 желтоқсандағы № 25-128 шешімімен

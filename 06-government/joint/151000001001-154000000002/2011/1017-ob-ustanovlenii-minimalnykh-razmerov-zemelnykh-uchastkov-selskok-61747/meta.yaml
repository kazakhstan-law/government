requisite: Решение маслихата Алматинской области от 14 октября 2011 года № 51-286 и постановление акимата Алматинской области от 17 октября 2011 года № 212. Зарегистрировано Департаментом юстиции Алматинской области 25 ноября 2011 года № 2080. Утратило силу совместным решением Алматинского областного маслихата от 22 октября 2025 года № 42-233 и постановлением акимата Алматинской области от 22 октября 2025 года № 321 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

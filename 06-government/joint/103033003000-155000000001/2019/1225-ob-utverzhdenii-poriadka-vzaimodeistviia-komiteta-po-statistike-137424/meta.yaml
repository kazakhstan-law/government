title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с акиматом города Алматы при проведении национальной переписи населения Республики Казахстан в 2020 году в учреждениях и организациях акимата города Алматы
  kaz: Алматы қаласы әкімдігінің мекемелері мен ұйымдарында 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Алматы қаласының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

requisite: Совместное постановление акимата района Шал акына Северо-Казахстанской области от 17 июля 2007 года № 135 и решение маслихата района Шал акына Северо-Казахстанской области от 17 июля 2007 года № 46/1. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 14 августа 2007 года № 13-14-49. Утратило силу совместным решением маслихата района Шал акына Северо-Казахстанской области от 20 ноября 2024 года № 24/3 и постановлением акимата района Шал акына Северо-Казахстанской области от 20 ноября 2024 года № 297 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для встреч политических партий, по выборам депутатов Мажилиса Парламента Республики Казахстан, избираемых по партийным спискам и кандидатов в депутаты областного и районного маслихатов с избирателями

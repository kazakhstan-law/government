  title:
    rus: О внесении изменений и дополнений в совместное постановление акимата города Семей от 4 февраля 2021 года № 244 и решение маслихата города Семей от 1 февраля 2021 года № 3/17-VII «О льготном проезде отдельных категорий граждан города Семей для проезда на внутригородском общественном транспорте (кроме такси)»
    kaz: Семей қаласы әкімдігінің 2021 жылғы 4 ақпандағы № 244 және Семей қаласы мәслихатының 2021 жылғы 1 ақпандағы № 3/17-VII «Семей қаласы азаматтарының жекелеген санаттарының қала ішіндегі қоғамдық көлікте (таксиден басқа) жеңілдікпен жол жүруі туралы» бірлескен қаулысы мен шешіміне өзгерістер мен толықтырулар енгізу туралы

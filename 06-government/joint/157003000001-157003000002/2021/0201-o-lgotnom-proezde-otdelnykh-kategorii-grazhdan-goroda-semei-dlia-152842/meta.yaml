act_code: '152842'
requisite: Совместное решение маслихата города Семей от 1 февраля 2021 года № 3/17-VII и постановление акимата города Семей от 4 февраля 2021 года № 244. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 февраля 2021 года № 8402. Утратило силу совместным постановлением акимата города Семей области Абай от 30 сентября 2024 года № 890 и решением маслихата города Семей области Абай от 27 сентября 2024 № 32/170-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

act_code: '225801'
requisite: Совместное решение маслихата города Текели области Жетісу от 21 мая 2026 года № 45-186 и постановление акимата города Текели области Жетісу от 21 мая 2026 года № 95
title:
  rus: «О внесении изменение в совместное решение Текелийского городского маслихата от 26 января 2026 № 42-172 и в постановление акимата города Текели от 26 января 2026 года № 2 «О предоставлении льготного проезда на городском общественном транспорте (кроме такси) отдельным категориям граждан города Текели»
  kaz: «Текелі қаласы азаматтарының жекелеген санаттарына қалалық қоғамдық көлікте (таксиден басқа) жолақы жеңілдігін беру туралы» бірлескен Текелі қалалық мәслихатының 2026 жылғы 26 қаңтардағы № 42-172 шешіміне және Текелі қаласы әкімдігінің 2026 жылғы 26 қаңтардағы № 2 бірлескен қаулысына өзеріс енгізу туралы

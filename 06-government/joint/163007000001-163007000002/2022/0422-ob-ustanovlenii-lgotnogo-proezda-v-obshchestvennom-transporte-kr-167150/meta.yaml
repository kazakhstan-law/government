    rus: О внесении изменения в совместное постановление акимата Бейнеуского района от 22 апреля 2022 года № 173 и решение Бейнеуского районного маслихата от 22 апреля 2022 года № 19/189 «Об установлении льготного проезда в общественном транспорте (кроме такси) отдельным категориям граждан Бейнеуского района»
    kaz: Бейнеу ауданы әкімдігінің 2022 жылғы 22 сәуірдегі № 173 және Бейнеу аудандық мәслихатының 2022 жылғы 22 сәуірдегі № 19/189 «Бейнеу ауданы азаматтарының жекелеген санаттарына қоғамдық көлікте (таксиден басқа) жолақы жеңілдігін белгілеу туралы» бірлескен қаулысы және шешіміне өзгеріс енгізу туралы

requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2010 жылғы 26 қазандағы № 191 қаулысы, Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2010 жылғы 28 қазандағы № 01-02/28-11 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық әділет басқармасында 2010 жылғы 15 қарашада № 5-6-122 тіркелді

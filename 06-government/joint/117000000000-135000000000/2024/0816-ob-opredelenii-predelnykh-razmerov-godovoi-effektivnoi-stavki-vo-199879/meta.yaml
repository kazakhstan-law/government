  title:
    rus: О приостановлении действия структурного элемента совместного постановления Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 августа 2024 года № 62 и Правления Национального Банка Республики Казахстан от 19 августа 2024 года № 45 «Об определении предельных размеров годовой эффективной ставки вознаграждения»
    kaz: «Жылдық тиімді сыйақы мөлшерлемесінің шекті мөлшерлерін айқындау туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2024 жылғы 16 тамыздағы № 62 және Қазақстан Республикасы Ұлттық Банкі Басқармасының 2024 жылғы 19 тамыздағы № 45 бірлескен қаулысының құрылымдық элементінің қолданылуын тоқтата тұру туралы

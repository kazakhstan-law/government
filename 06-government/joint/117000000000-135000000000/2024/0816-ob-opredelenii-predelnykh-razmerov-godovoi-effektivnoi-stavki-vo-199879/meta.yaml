act_code: '199879'
requisite: Совместное постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 августа 2024 года № 62 и постановление Правления Национального Банка Республики Казахстан от 19 августа 2024 года № 45. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 августа 2024 года № 34960. Утратило силу совместным постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 апреля 2026 года № 84 и постановлением Правления Национального Банка Республики Казахстан от 29 апреля 2026 года № 51 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

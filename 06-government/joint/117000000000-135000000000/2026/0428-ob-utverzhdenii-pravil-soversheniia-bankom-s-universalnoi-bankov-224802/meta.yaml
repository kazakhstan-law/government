act_code: '224802'
requisite: Совместное постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 апреля 2026 года № 87 и постановление Правления Национального Банка Республики Казахстан от 29 апреля 2026 года № 50. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 апреля 2026 года № 38606
title:
  rus: Об утверждении Правил совершения банком с универсальной банковской лицензией, исламским банком, филиалом банка – нерезидента Республики Казахстан и филиалом исламского банка – нерезидента Республики Казахстан сделок с цифровыми финансовыми активами
  kaz: Әмбебап банк лицензиясы бар банктің, ислам банкінің, Қазақстан Республикасының бейрезидент банкі филиалының және Қазақстан Республикасының бейрезидент ислам банкі филиалының цифрлық қаржы активтерімен мәмілелер жасасу қағидаларын бекіту туралы

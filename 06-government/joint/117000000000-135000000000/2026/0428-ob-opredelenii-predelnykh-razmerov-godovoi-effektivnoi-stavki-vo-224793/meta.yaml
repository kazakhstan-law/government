  title:
    rus: О внесении изменений в совместное постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 апреля 2026 года № 84 и Правления Национального Банка Республики Казахстан от 29 апреля 2026 года № 51 «Об определении предельных размеров годовой эффективной ставки вознаграждения по займам и микрокредитам»
    kaz: «Қарыздар және микрокредиттер бойынша жылдық тиімді сыйақы мөлшерлемесінің шекті мөлшерлерін айқындау туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2026 жылғы 28 сәуірдегі № 84 және Қазақстан Республикасы Ұлттық Банкі Басқармасының 2026 жылғы 29 сәуірдегі № 51 бірлескен қаулысына өзгерістер енгізу туралы

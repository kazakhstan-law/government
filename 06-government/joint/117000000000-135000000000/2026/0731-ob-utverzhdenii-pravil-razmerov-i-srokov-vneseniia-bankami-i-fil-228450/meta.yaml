act_code: '228450'
requisite: Совместное постановление Правления Национального Банка Республики Казахстан от 31 июля 2026 года № 97 и Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 июля 2026 года № 114. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 августа 2026 года № 39474
title:
  rus: Об утверждении Правил, размеров и сроков внесения банками и филиалами банков-нерезидентов Республики Казахстан обязательных денежных взносов для возмещения (покрытия) убытков (средств), возникших (использованных) в результате урегулирования системно значимого банка
  kaz: Банктердің және Қазақстан Республикасының бейрезидент банктері филиалдарының жүйелік маңызы бар банкті реттеу салдарынан туындаған (пайдаланылған) залалдарды (қаражатты) өтеу (жабу) үшін міндетті ақшалай жарналарды енгізу қағидаларын, мөлшерлері мен мерзімдерін бекіту туралы

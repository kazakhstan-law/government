act_code: '227265'
requisite: Совместное постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 июня 2026 года № 99 и постановление Правления Национального Банка Республики Казахстан от 29 июня 2026 года № 72. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 июля 2026 года № 39186
title:
  rus: Об утверждении Правил проведения биометрической аутентификации финансовыми и платежными организациями, включая случаи обязательного использования и (или) наполнения биометрическими данными национальной системы биометрической аутентификации, полученными центром обмена идентификационными данными Национального Банка Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық Банкінің сәйкестендіру деректерімен алмасу орталығы алған ұлттық биометриялық аутентификация  жүйесінің биометриялық деректерін міндетті пайдалану және (немесе) толтыру жағдайларын қоса алғанда, қаржы және төлем ұйымдарының биометриялық аутентификация жүргізу қағидаларын бекіту туралы

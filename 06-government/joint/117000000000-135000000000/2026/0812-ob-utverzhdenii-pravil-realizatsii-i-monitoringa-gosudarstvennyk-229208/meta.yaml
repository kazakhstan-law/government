requisite: Совместное постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 августа 2026 года № 121 и Правления Национального Банка Республики Казахстан от 13 августа 2026 года № 100. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 августа 2026 года № 39658
title:
  rus: Об утверждении Правил реализации и мониторинга государственных инвестиционных проектов, направленных на урегулирование системно значимых банков путем приобретения акций системно значимого банка, находящегося в режиме урегулирования, либо акций стабилизационного банка, которому передаются активы и обязательства системно значимого банка, находящегося в режиме урегулирования

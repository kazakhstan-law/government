  title:
    rus: О внесении изменений в совместное постановление Правления Национального Банка Республики Казахстан от 5 мая 2020 года № 62 и Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 5 мая 2020 года № 56 «Об утверждении Правил о займах последней инстанции, предоставляемых Национальным Банком Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық Банкі беретін соңғы сатыдағы қарыздар туралы қағидаларды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2020 жылғы 5 мамырдағы № 62 және Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 5 мамырдағы № 56 бірлескен қаулысына өзгерістер енгізу туралы

requisite: Совместные приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 23 декабря 2019 года № 183 и постановление акимата Восточно-Казахстанской области от 19 декабря 2019 года № 450
title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с Восточно-Казахстанским областным акиматом при проведении национальной переписи населения Республики Казахстан в 2020 году в учреждениях и организациях Восточно-Казахстанского областного акимата
  kaz: Шығыс Қазақстан облысы әкімдігінің мекемелері мен ұйымдарында 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Шығыс Қазақстан облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

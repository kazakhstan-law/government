act_code: '34562'
requisite: Совместное постановление акимата Акжарского района Северо-Казахстанской области от 12 июля 2007 года № 241 и решение маслихата Акжарского района Северо-Казахстанской области от 12 июля 2007 года № 37-2. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 3 августа 2007 года № 13-4-46. Утратило силу совместным постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 10 октября 2024 года № 269 и решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 10 октября 2024 года № 21-27 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении помещений предоставляемых на договорной основе, для встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан избираемых по партийным спискам, кандидатов в депутаты Северо-Казахстанского областного и Акжарского районного маслихатов для встреч кандидатов с избирателями
  kaz: Партиялық тізім бойынша сайланатын Қазақстан Республикасының Парламенті Мәжілісінің депутаттығына кандидаттардың, Солтүстік Қазақстан облыстық және Ақжар аудандық мәслихатының депутаттығына кандидаттардың сайлаушыларымен кездесулер өтетін шарттық негізде берілетін үй-жайлар анықтау туралы

  title:
    rus: О внесении изменения в совместное постановление акимата Аккольского района Акмолинской области от 29 мая 2024 года № А-5/126 и решение Аккольского районного маслихата Акмолинской области от 29 мая 2024 года № С 22-6 «Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Аккольском районе»
    kaz: «Ақкөл ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айкындау туралы» Ақмола облысы Ақкөл ауданы әкімдігінің 2024 жылғы 29 мамырдағы № А-5/126 бірлескен қаулысына және Ақмола облысы Ақкөл аудандық мәслихатының 2024 жылғы 29 мамырдағы № С 22-6 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/221845/rus

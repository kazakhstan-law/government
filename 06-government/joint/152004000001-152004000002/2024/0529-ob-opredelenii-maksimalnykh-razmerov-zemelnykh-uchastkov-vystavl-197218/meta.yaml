act_code: '197218'
requisite: Совместное постановление акимата Аккольского района Акмолинской области от 29 мая 2024 года № А-5/126 и решение Аккольского районного маслихата Акмолинской области от 29 мая 2024 года № С 22-6. Зарегистрировано Департаментом юстиции Акмолинской области 30 мая 2024 года № 8759-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Аккольском районе
  kaz: Ақкөл ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

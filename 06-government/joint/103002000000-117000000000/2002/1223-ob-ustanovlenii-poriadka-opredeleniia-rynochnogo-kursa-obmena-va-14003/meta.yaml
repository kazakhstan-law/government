act_code: '14003'
requisite: Приказ Министра финансов Республики Казахстан от 23 декабря 2002 года N 629 и постановление Правления Национального Банка Республики Казахстан от 23 декабря 2002 года N 512. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2002 года N 2106. Утратил силу приказом Министра финансов Республики Казахстан от 28 января 2009 года N 36 и Постановлением Правления Национального Банка Республики Казахстан от 26 января 2009 года N 4.

act_code: '88964'
requisite: Приказ Министра финансов Республики Казахстан от 26 ноября 2014 года № 519 и постановление Правления Национального Банка Республики Казахстан от 24 декабря 2014 года № 237. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 февраля 2015 года № 10207. Утратили силу совместным постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 октября 2020 года № 104 и приказом Министра финансов Республики Казахстан от 30 октября 2020 года № 1055 (вводятся в действие с 15 ноября 2020 года)
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для фондовой биржи
  kaz: Қылмыстық жолмен алынған кiрiстердi заңдастыруға (жылыстатуға) және терроризмдi қаржыландыруға қарсы iс-қимыл жасау мақсатында қор биржасы үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

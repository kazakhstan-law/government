requisite: Приказ Министра финансов Республики Казахстан от 26 ноября 2014 года № 520 и постановление Правления Национального Банка Республики Казахстан от 24 декабря 2014 года № 239. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 февраля 2015 года № 10216. Утратили силу совместным постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 октября 2020 года № 104 и приказом Министра финансов Республики Казахстан от 30 октября 2020 года № 1055 (вводятся в действие с 15 ноября 2020 года)
title:

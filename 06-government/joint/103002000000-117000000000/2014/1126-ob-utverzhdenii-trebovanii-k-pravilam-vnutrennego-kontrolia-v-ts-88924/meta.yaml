act_code: '88924'
requisite: Приказ Министра финансов Республики Казахстан от 26 ноября 2014 года № 521 и постановление Правления Национального Банка Республики Казахстан от 24 декабря 2014 года № 235. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 февраля 2015 года № 10212. Утратил силу совместным постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 августа 2020 года № 75 и приказом Министра финансов Республики Казахстан от 1 сентября 2020 года № 799 (вводится в действие по истечении десяти календарных дней после дня их первого официального опубликования)
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для банков второго уровня и Национального оператора почты
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында екінші деңгейдегі банктер мен Ұлттық пошта операторы үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

act_code: '88962'
requisite: Приказ Министра финансов Республики Казахстан от 26 ноября 2014 года № 518 и постановление Правления Национального Банка Республики Казахстан от 24 декабря 2014 года № 236. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 февраля 2015 года № 10215. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 10 июня 2022 года № 25 и постановлением Правления Национального Банка Республики Казахстан от 22 июня 2022 года № 53 (вводятся в действие по истечении десяти календарных дней после дня их первого официального опубликования)
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для отдельных организаций, осуществляющих отдельные виды банковских операций
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында банк операцияларының жекелеген түрлерін жүзеге асыратын жекелеген ұйымдар үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

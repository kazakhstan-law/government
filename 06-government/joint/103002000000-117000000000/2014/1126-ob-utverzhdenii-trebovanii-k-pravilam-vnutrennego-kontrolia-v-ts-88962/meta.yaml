caused_by:
  code: '138124'
  requisite: Совместные приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 26 декабря 2019 года № 1423 и постановление Правления Национального Банка Республики Казахстан от 31 декабря 2019 года № 271. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 января 2020 года № 19857. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 10 июня 2022 года № 25 и постановлением Правления Национального Банка Республики Казахстан от 22 июня 2022 года № 53 (вводятся в действие по истечении десяти календарных дней после дня их первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 26 ноября 2014 года № 518 и постановление Правления Национального Банка Республики Казахстан от 24 декабря 2014 года № 236 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для организаций, осуществляющих отдельные виды банковских операций, за исключением оператора межбанковской системы переводов денег, и микрофинансовых организаций»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ақша аударымының банкаралық жүйесінің операторын қоспағанда, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар және микроқаржы ұйымдары үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 26 қарашадағы № 518 бұйрығына және Қазақстан Республикасы Ұлттық Банкі Басқармасының 2014 жылғы 24 желтоқсандағы № 236 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/138124/rus

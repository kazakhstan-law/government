  requisite: Совместные Постановление Правления Национального Банка Республики Казахстан от 31 июля 2017 года № 160 и приказ Министра финансов Республики Казахстан от 31 августа 2017 года № 531. Зарегистрированы в Министерстве юстиции Республики Казахстан 4 октября 2017 года № 15842. Утратили силу совместным постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 октября 2020 года № 104 и приказом Министра финансов Республики Казахстан от 30 октября 2020 года № 1055 (вводятся в действие с 15 ноября 2020 года)
  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 26 ноября 2014 года № 522 и постановление Правления Национального Банка Республики Казахстан от 24 декабря 2014 года № 240 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для профессиональных участников рынка ценных бумаг и центрального депозитария»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында бағалы қағаздар нарығының кәсіби қатысушылары және орталық депозитарий үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 26 қарашадағы № 522 бұйрығына және Қазақстан Республикасы Ұлттық Банкі Басқармасының 2014 жылғы 24 желтоқсандағы № 240 қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений в совместные постановление Правления Национального Банка Республики Казахстан от 29 сентября 2023 года № 78 и приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 4 октября 2023 года № 1054 «Об утверждении Правил осуществления экспортно-импортного валютного контроля в Республике Казахстан»
    kaz: «Қазақстан Республикасында экспорттық-импорттық валюталық бақылауды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2023 жылғы 29 қыркүйектегі № 78 және Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2023 жылғы 4 қазандағы № 1054 бірлескен қаулысы мен бұйрығына өзгерістер енгізу туралы

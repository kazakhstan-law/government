  title:
    rus: О внесении изменений и дополнения в приказ Министра финансов Республики Казахстан от 4 октября 2016 года № 532 и постановление Правления Национального Банка Республики Казахстан от 28 октября 2016 года № 262 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для платежных организаций»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында төлем ұйымдары үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 4 қазандағы № 532 бұйрығына және Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 28 қазандағы № 262 қаулысына өзгерістер мен толықтыру енгізу туралы

requisite: Совместный приказ Министра финансов Республики Казахстан от 4 октября 2016 года № 532 и постановление Правления Национального Банка Республики Казахстан от 28 октября 2016 года № 262. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 декабря 2016 года № 14476. Утратил силу Совместным приказом и.о. Председателя Агентства Республики Казахстан по финансовому мониторингу от 20 октября 2022 года № 36 и постановлением Правления Национального Банка Республики Казахстан от 20 октября 2022 года № 90 (вводятся в действие по истечении десяти календарных дней после дня их первого официального опубликования)
title:

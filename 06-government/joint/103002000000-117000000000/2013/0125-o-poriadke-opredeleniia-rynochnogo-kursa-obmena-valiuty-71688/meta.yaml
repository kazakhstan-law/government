    kaz: '"Валюталарды айырбастаудың нарықтық бағамын айқындау және қолдану тәртібін белгілеу туралы" Қазақстан Республикасы Ұлттық Банкі Басқармасының 2013 жылғы 25 қаңтардағы № 15 қаулысына және Қазақстан Республикасы Қаржы Министрінің 2013 жылғы 22 ақпандағы № 99 бұйрығына өзгеріс енгізу туралы'

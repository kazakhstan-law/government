requisite: Қызылорда облысы Сырдария ауданы әкімдігінің 2008 жылғы 22 қазандағы N 545 қаулысы мен Қызылорда облысы Сырдария аудандық мәслихатының 2008 жылғы 22 қазандағы N 104 шешімі. Қызылорда облысының Әділет департаменті Сырдария аудандық Әділет басқармасында 2008 жылы 28 қарашада N 10-8-76 тіркелді. Күші жойылды - Қызылорда облысы Сырдария аудандық мәслихатының 2014 жылғы 30 сәуірдегі N 236 шешімімен

act_code: '49633'
requisite: Постановление акимата Костанайской области от 20 ноября 2009 года № 9 св и решение маслихата Костанайской области от 20 ноября 2009 года № 235. Зарегистрировано Департаментом юстиции Костанайской области 31 декабря 2009 года № 3701. Утратило силу решением маслихата Костанайской области от 11 декабря 2015 года № 471 и постановлением акимата Костанайской области от 11 декабря 2015 года № 6
title:
  rus: Об установлении минимальных размеров земельных участков сельскохозяйственного назначения, предоставляемых в собственность или землепользование гражданам, негосударственным юридическим лицам, иностранным гражданам, лицам без гражданства и иностранным юридическим лицам для ведения крестьянского или фермерского хозяйства, или товарного сельскохозяйственного производства
  kaz: Шаруа немесе фермерлік қожалығын, немесе тауарлы ауыл шаруашылығы өндірісін жүргізу үшін азаматтарға, мемлекеттік емес заңды тұлғаларға, шетел азаматтарына, азаматтығы жоқ адамдарға және шетелдік заңды тұлғаларға жеке меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер телімдерінің ең аз көлемдері туралы

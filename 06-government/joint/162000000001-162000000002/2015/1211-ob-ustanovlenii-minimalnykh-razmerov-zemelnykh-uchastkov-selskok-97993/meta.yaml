    kaz: Әкімдіктің 2015 жылғы 11 желтоқсандағы № 6 және мәслихаттың 2015 жылғы 11 желтоқсандағы № 471 «Қостанай облысында жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы» қаулысы мен шешіміне өзгерістер енгізу туралы

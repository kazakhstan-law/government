  title:
    rus: О внесении изменения в постановление акимата от 11 декабря 2015 года № 6 и решение маслихата от 11 декабря 2015 года № 471 "Об установлении минимальных размеров земельных участков сельскохозяйственного назначения в зависимости от местных условий и особенностей использования указанных земель, предоставляемых в собственность или землепользование в Костанайской области"
    kaz: Әкімдіктің 2015 жылғы 11 желтоқсандағы № 6 және мәслихаттың 2015 жылғы 11 желтоқсандағы № 471 "Қостанай облысында жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы" қаулысы мен шешіміне өзгеріс енгізу туралы

act_code: '183992'
requisite: Совместные постановление Бескарагайского районного акимата от 5 июля 2023 года № 195 и решение Бескарагайского районного маслихата области Абай от 5 июля 2023 года № 4/18-VIII. Зарегистрировано Департаментом юстиции области Абай 13 июля 2023 года № 99-18
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства по Бескарагайскому району области Абай
  kaz: Абай облысы Бесқарағай ауданы бойынша шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын  жер учаскелерінің ең жоғары  мөлшерін айқындау туралы

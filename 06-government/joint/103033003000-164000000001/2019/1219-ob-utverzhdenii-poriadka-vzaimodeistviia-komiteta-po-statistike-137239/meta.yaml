title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с акиматом Павлодарской области при проведении национальной переписи населения Республики Казахстан в 2020 году в учреждениях и организациях акимата Павлодарской области
  kaz: Павлодар облысы әкімдігінің мекемелері мен ұйымдарында 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Павлодар облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

  title:
    rus: О внесении изменения в совместное постановление акимата Западно-Казахстанской области от 6 декабря 2012 года № 227 и решение Западно-Казахстанского областного маслихата от 7 декабря 2012 года № 5-3 «Об установлении минимальных размеров земельных участков сельскохозяйственного назначения, предоставляемых в собственность или землепользование в Западно-Казахстанской области»
    kaz: Батыс Қазақстан облысы әкімдігінің 2012 жылғы 6 желтоқсандағы № 227 және Батыс Қазақстан облыстық мәслихатының 2012 жылғы 7 желтоқсандағы № 5-3 «Батыс Қазақстан облысында меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы» бірлескен қаулысына және шешіміне өзгеріс енгізу туралы

act_code: '70118'
requisite: Постановление акимата Западно-Казахстанской области от 6 декабря 2012 года № 227 и решение Западно-Казахстанского областного маслихата от 7 декабря 2012 года № 5-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 18 января 2013 года № 3154
title:
  rus: Об установлении минимальных размеров земельных участков сельскохозяйственного назначения, предоставляемых в собственность или землепользование в зависимости от местных условий и особенностей использования указанных земель в Западно-Казахстанской области
  kaz: Батыс Қазақстан облысындағы жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы

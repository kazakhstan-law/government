    kaz: «Жер учаскелері жеке меншікке берілген кезде олар үшін төлемақының базалық ставкалары туралы» Батыс Қазақстан облысы әкімдігінің 2013 жылғы 11 наурыздағы № 31 бірлескен қаулысына және Батыс Қазақстан облыстық мәслихатының 2013 жылғы 28 наурыздағы № 7-4 шешіміне өзгеріс енгізу туралы

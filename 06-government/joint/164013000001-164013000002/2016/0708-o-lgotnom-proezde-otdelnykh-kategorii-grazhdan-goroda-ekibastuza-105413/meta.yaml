requisite: Совместное постановление акимата города Экибастуза Павлодарской области от 08 июля 2016 года № 733-1/7 и решение маслихата города Экибастуза Павлодарской области от 08 июля 2016 года № 43/7. Зарегистрировано Департаментом юстиции Павлодарской области 09 августа 2016 года № 5198. Утратило силу совместным постановлением акимата города Экибастуза Павлодарской области от 28 апреля 2021 года № 328/4 и решением Экибастузского городского маслихата Павлодарской области от 28 апреля 2021 года № 31/4 (вводятся в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

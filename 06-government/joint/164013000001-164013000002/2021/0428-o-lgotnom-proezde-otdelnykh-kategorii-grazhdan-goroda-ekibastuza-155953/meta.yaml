requisite: Совместные постановление акимата города Экибастуза Павлодарской области от 28 апреля 2021 года № 328/4 и решение Экибастузского городского маслихата Павлодарской области от 28 апреля 2021 года № 31/4. Зарегистрированы Департаментом юстиции Павлодарской области 18 мая 2021 года № 7284. Утратило силу совместным постановлением акимата города Экибастуза Павлодарской области от 17 декабря 2025 года № 969/12 и решением Экибастузского городского маслихата Павлодарской области от 17 декабря 2025 года № 299/38 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

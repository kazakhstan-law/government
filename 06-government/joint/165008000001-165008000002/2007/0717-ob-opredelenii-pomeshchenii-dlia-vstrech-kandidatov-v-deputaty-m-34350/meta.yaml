requisite: Совместное постановление акимата Кызылжарского района Северо-Казахстанской области от 17 июля 2007 года № 240 и решение маслихата Кызылжарского района Северо-Казахстанской области от 20 июля 2007 года № 37/6. Зарегистрировано Управлением юстиции Кызылжарского района Северо-Казахстанской области 24 июля 2007 года № 13-8-40. Утратило силу совместным постановлением акимата Кызылжарского района Северо-Казахстанской области от 29 октября 2024 года № 314 и решением Кызылжарского районного маслихата Северо-Казахстанской области от 29 октября 2024 года № 16/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

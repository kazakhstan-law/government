  requisite: Постановление акимата города Кокшетау Акмолинской области от 6 мая 2021 года № А-5/897 и решение Кокшетауского городского маслихата Акмолинской области от 6 мая 2021 года № С-6/9. Зарегистрировано Департаментом юстиции Акмолинской области 14 мая 2021 года № 8481
  title:
    rus: О внесении изменения в совместное постановление акимата города Кокшетау от 28 августа 2019 года № А-8/1531 и решение Кокшетауского городского маслихата от 28 августа 2019 года № С-36/4 «Об установлении льготы по оплате проезда отдельной категории граждан города Кокшетау на общественном транспорте (кроме такси) в городе Кокшетау»
    kaz: Көкшетау қаласы әкімдігінің 2019 жылғы 28 тамыздағы № А-8/1531 бірлескен қаулысы мен Көкшетау қалалық мәслихатының 2019 жылғы 28 тамыздағы № С-36/4 «Көкшетау қаласында қоғамдық көлікте (таксиден басқа) Көкшетау қаласы азаматтарының жекелеген санатының жол жүру төлеу бойынша жеңілдік белгілеу туралы» шешіміне өзгеріс енгізу туралы

requisite: Постановление акимата города Кокшетау Акмолинской области от 28 августа 2019 года № А-8/1531 и решение Кокшетауского городского маслихата Акмолинской области от 28 августа 2019 года № С-36/4. Зарегистрировано Департаментом юстиции Акмолинской области 3 сентября 2019 года № 7350
title:
  rus: Об установлении льготы по оплате проезда отдельной категории граждан города Кокшетау на общественном транспорте (кроме такси) в городе Кокшетау
  kaz: Көкшетау қаласында қоғамдық көлікте (таксиден басқа) Көкшетау қаласы азаматтарының жекелеген санатының жол жүру төлеу бойынша жеңілдік белгілеу туралы

caused_by:
  code: '197284'
  requisite: Совместные постановление акимата города Кокшетау Акмолинской области от 28 мая 2024 года № А-5/658 и решение Кокшетауского городского маслихата Акмолинской области от 28 мая 2024 года № С-12/7. Зарегистрировано Департаментом юстиции Акмолинской области 30 мая 2024 года № 8762-03. Утратило силу совместными постановлением акимата города Кокшетау Акмолинской области от 2 февраля 2026 года № А-2/198 и решением Кокшетауского городского маслихата Акмолинской области от 30 января 2026 года № С-30/2 (вводится в действие после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в совместное постановление акимата города Кокшетау от 28 августа 2019 года № А-8/1531 и решение Кокшетауского городского маслихата от 28 августа 2019 года № С-36/4 «Об установлении льготы по оплате проезда отдельной категории граждан города Кокшетау на общественном транспорте (кроме такси) в городе Кокшетау»
    kaz: «Көкшетау қаласында қоғамдық көлікте (таксиден басқа) Көкшетау қаласы азаматтарының жекелеген санатының жол жүру төлеу бойынша жеңілдік белгілеу туралы» бірлескен Көкшетау қаласы әкімдігінің 2019 жылғы 28 тамыздағы № A-8/1531 қаулысына және Көкшетау қалалық мәслихатының 2019 жылғы 28 тамыздағы № С-36/4 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/197284/rus

  requisite: Совместные постановление акимата города Кокшетау Акмолинской области от 30 декабря 2024 года № А-12/1571 и решение Кокшетауского городского маслихата Акмолинской области от 30 декабря 2024 года № С-19/2. Зарегистрировано Департаментом юстиции Акмолинской области 31 декабря 2024 года № 8880-03
  title:
    rus: О внесении дополнения в совместное постановление акимата города Кокшетау от 28 августа 2019 года № А-8/1531 и решение Кокшетауского городского маслихата от 28 августа 2019 года № С-36/4 «Об установлении льготы по оплате проезда отдельной категории граждан города Кокшетау на общественном транспорте (кроме такси) в городе Кокшетау»
    kaz: «Көкшетау қаласында қоғамдық көлікте (таксиден басқа) Көкшетау қаласы азаматтарының жекелеген санатының жол жүру төлеу бойынша жеңілдік белгілеу туралы» бірлескен Көкшетау қаласы әкімдігінің 2019 жылғы 28 тамыздағы № A-8/1531 қаулысына және Көкшетау қалалық мәслихатының 2019 жылғы 28 тамыздағы № С-36/4 шешіміне толықтыру енгізу туралы

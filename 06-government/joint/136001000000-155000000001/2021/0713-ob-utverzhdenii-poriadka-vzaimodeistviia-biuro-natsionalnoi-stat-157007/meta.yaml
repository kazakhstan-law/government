act_code: '157007'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 13 июля 2021 года № 159 и Постановление акимата города Алматы от 2 июля 2021 года № 3/356
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом города Алматы при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата города Алматы
  kaz: Алматы қаласы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Алматы қаласының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

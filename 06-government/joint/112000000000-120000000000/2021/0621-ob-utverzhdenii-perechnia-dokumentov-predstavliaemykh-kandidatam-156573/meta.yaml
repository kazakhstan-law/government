  requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы от 23 января 2023 года № 17 и Постановление Центральной избирательной комиссии Республики Казахстан от 25 января 2023 года № 26/670. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 января 2023 года № 31780
  title:
    rus: О внесении изменений в совместные приказ Председателя Агентства Республики Казахстан по делам государственной службы от 21 июня 2021 года № 102 и Постановление Центральной избирательной комиссии Республики Казахстан от 22 июня 2021 года № 4/407 «Об утверждении перечня документов, представляемых кандидатами в акимы города районного значения, села, поселка, сельского округа в районную (городскую) избирательную комиссию для проверки соответствия требованиям законодательства Республики Казахстан в сфере государственной службы»
    kaz: «Қазақстан Республикасының мемлекеттік қызмет саласындағы заңнамасының талаптарына сәйкестікті тексеру үшін аудандық маңызы бар қала, ауыл, кент, ауылдық округ әкімдеріне кандидаттардың аудандық (қалалық) сайлау комиссиясына ұсынатын құжаттарының тізбесін бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі Төрағасының 2021 жылғы 21 маусымдағы № 102 және Қазақстан Республикасы Орталық сайлау комиссиясының 2021 жылғы 22 маусымдағы № 4/407 бірлескен бұйрығы мен қаулысына өзгерістер енгізу туралы

act_code: '156573'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы от 21 июня 2021 года № 102 и Постановление Центральной избирательной комиссии Республики Казахстан от 22 июня 2021 года № 4/407. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июня 2021 года № 23158
title:
  rus: Об утверждении перечня документов, представляемых кандидатами в акимы района, городов областного значения, города районного значения, села, поселка, сельского округа в соответствующую территориальную избирательную комиссию для проверки соответствия требованиям законодательства Республики Казахстан в сфере государственной службы
  kaz: Қазақстан Республикасының мемлекеттік қызмет саласындағы заңнамасының талаптарына сәйкестікті тексеру үшін аудандар, облыстық маңызы бар қалалар, аудандық маңызы бар қалалар, ауылдар, кенттер, ауылдық округтер әкімдеріне кандидаттардың тиісті аумақтық сайлау комиссиясына ұсынатын құжаттарының тізбесін бекіту туралы

requisite: Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2010 жылғы 28 қыркүйектегі N 31/204-IV шешімі және Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2010 жылғы 28 қыркүйектегі N 22 қаулысы. Оңтүстік Қазақстан облысы Әділет департаментінде 2010 жылғы 20 қазанда N 14-13-77 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2013 жылғы 12 желтоқсандағы № 25/112-V шешімімен

requisite: Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2008 жылғы 26 маусымдағы N 313 қаулысы және Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2008 жылғы 26 маусымдағы N 7/53-IV шешімі. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2008 жылғы 25 шілдеде N 14-13-43 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби аудандық мәслихатының 2013 жылғы 4 қаңтардағы № 13/69-V шешімімен

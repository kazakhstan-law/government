requisite: Постановление Правления Национального Банка Республики Казахстан от 30 сентября 2011 года № 156 и приказ Министра экономического развития и торговли Республики Казахстан от 1 декабря 2011 года № 372. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 декабря 2011 года № 7350. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 30 июня 2015 года № 125 и приказом Министра национальной экономики Республики Казахстан от 21 июля 2015 года № 551
title:
  rus: Об утверждении Критериев оценки степени рисков и формы проверочного листа в сфере частного предпринимательства за деятельностью участников регионального финансового центра города Алматы в области трудового законодательства Республики Казахстан
  kaz: Алматы қаласының өңірлік қаржы орталығы қатысушыларының Қазақстан Республикасының еңбек заңнамасы саласындағы қызметіне жеке кәсіпкерлік саласындағы тәуекелдер дәрежесін бағалау өлшемдерін және тексеру парағының нысанын бекіту туралы

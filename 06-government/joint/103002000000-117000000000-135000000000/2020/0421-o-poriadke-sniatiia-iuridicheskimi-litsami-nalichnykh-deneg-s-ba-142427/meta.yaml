act_code: '142427'
requisite: Совместные постановления Правления Национального Банка Республики Казахстан от 21 апреля 2020 года № 51, Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 апреля 2020 года № 54 и приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 29 апреля 2020 года № 435. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2020 года № 20544. Действовал по 31 декабря 2020 года в соответствии с пунктом 5 настоящего постановления
title:
  rus: О порядке снятия юридическими лицами наличных денег с банковских счетов, снятия наличных денег сверх установленных предельных размеров и предоставления в Министерство финансов Республики Казахстан информации о снятии юридическими лицами наличных денег сверх установленных предельных размеров
  kaz: Заңды тұлғалардың банктік шоттардан қолма-қол ақшаны алу, белгіленген шекті мөлшерден артық қолма-қол ақшаны алу және Қазақстан Республикасының Қаржы министрлігіне заңды тұлғалардың белгіленген шекті мөлшерден артық қолма-қол ақшаны алуы туралы ақпаратты ұсыну тәртібі туралы

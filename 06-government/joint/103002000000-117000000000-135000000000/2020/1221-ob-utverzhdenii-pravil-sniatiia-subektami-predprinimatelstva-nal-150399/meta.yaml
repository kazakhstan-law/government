  requisite: Совместные постановление Правления Национального Банка Республики Казахстан от 26 сентября 2023 года № 73, Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 сентября 2023 года № 73 и приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 2 октября 2023 года № 1042. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 октября 2023 года № 33514. Утратил силу совместными постановлениями Правления Национального Банка Республики Казахстан от 26 сентября 2025 года № 58, Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 сентября 2025 года № 60 и приказом Министра финансов Республики Казахстан от 29 сентября 2025 года № 545 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в совместные постановления Правления Национального Банка Республики Казахстан от 21 декабря 2020 года № 151, Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 декабря 2020 года № 125 и приказ Министра финансов Республики Казахстан от 22 декабря 2020 года № 1223 «Об утверждении Правил снятия субъектами предпринимательства наличных денег с банковских счетов»
    kaz: «Кәсіпкерлік субъектілерінің банктік шоттардан қолма-қол ақшаны алу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2020 жылғы 21 желтоқсандағы № 151, Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 22 желтоқсандағы № 125 және Қазақстан Республикасы Қаржы министрінің 2020 жылғы 22 желтоқсандағы № 1223 бірлескен қаулысы мен бұйрығына өзгерістер енгізу туралы

act_code: '150399'
requisite: Совместные постановления Правления Национального Банка Республики Казахстан от 21 декабря 2020 года № 151, Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 декабря 2020 года № 125 и приказ Министра финансов Республики Казахстан от 22 декабря 2020 года № 1223. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 декабря 2020 года № 21885. Утратил силу совместными постановлениями Правления Национального Банка Республики Казахстан от 26 сентября 2025 года № 58, Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 сентября 2025 года № 60 и приказом Министра финансов Республики Казахстан от 29 сентября 2025 года № 545 (вводится в действие с 1 января 2026 года)

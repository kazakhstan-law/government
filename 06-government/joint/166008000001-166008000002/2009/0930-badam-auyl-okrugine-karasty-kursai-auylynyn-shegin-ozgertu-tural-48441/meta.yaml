requisite: Бірлескен Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2009 жылғы 30 қыркүйектегі N 22-232/IV Шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2009 жылғы 30 қыркүйектегі N 16 Қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 5 қарашада N 14-10-124 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2014 жылғы 15 мамырдағы № 31-199/V шешімімен

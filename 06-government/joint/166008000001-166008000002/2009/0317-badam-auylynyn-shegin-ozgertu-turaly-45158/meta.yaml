requisite: Бірлескен Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2009 жылғы 17 наурыздағы N 18-196/IV шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2009 жылғы 17 наурыздағы N 3 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 6 сәуірде N 14-10-116 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2014 жылғы 15 мамырдағы № 31-199/V шешімімен

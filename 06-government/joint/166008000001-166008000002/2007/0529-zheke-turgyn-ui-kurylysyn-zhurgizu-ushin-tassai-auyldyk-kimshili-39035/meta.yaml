requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2007 жылғы 29 мамырдағы N 42-428/III шешімі және Сайрам ауданы әкімдігінің 2007 жылғы 29 мамырдағы N 971 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2007 жылғы 7 шілдеде N 14-10-67 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2014 жылғы 15 мамырдағы № 31-199/V шешімімен

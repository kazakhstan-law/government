requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2007 жылғы 25 желтоқсандағы N 3-58/IV шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2007 жылғы 10 желтоқсандағы N 2538 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2008 жылғы 4 ақпанда N 14-10-83 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2014 жылғы 15 мамырдағы № 31-199/V шешімімен

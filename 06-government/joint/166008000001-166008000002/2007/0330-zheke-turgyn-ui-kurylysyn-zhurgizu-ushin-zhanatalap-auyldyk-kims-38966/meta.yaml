requisite: Бірлескен Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2007 жылғы 30 наурыздағы N 40-397/III шешімі және Сайрам ауданы әкімдігінің қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2007 жылғы 14 сәуірде N 14-10-65 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2014 жылғы 15 мамырдағы № 31-199/V шешімімен

requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2007 жылғы 25 желтоқсандағы N 3-56/IV шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2007 жылғы 10 желтоқсандағы N 2520 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2008 жылғы 4 ақпанда N 14-10-81 тіркелді

requisite: Бірлескен Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2010 жылғы 18 наурыздағы N 29-283/IV шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2010 жылғы 18 наурыздағы N 3 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2010 жылғы 21 сәуірде N 14-10-137 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2014 жылғы 15 мамырдағы № 31-199/V шешімімен

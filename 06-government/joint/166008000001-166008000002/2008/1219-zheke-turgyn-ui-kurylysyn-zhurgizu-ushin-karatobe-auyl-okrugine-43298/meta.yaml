requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2008 жылғы 19 желтоқсандағы N 13-150/IV шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2008 жылғы 19 желтоқсандағы N 14 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 9 қаңтарда N 14-10-106 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2014 жылғы 15 мамырдағы № 31-199/V шешімімен

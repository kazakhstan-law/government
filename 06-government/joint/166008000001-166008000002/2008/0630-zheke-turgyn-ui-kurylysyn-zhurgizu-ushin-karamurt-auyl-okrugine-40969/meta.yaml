act_code: '40969'
requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2008 жылғы 30 маусымдағы N 8-105/IV шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2008 жылғы 30 маусымдағы N 7 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2008 жылғы 1 тамызда N 14-10-98 тіркелді

requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2008 жылғы 8 ақпандағы N 4-68/IV шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2008 жылғы 8 ақпандағы N 2 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2008 жылғы 5 наурызда N 14-10-89 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам аудандық мәслихатының 2014 жылғы 15 мамырдағы № 31-199/V шешімімен

requisite: Оңтүстік Қазақстан облысы Сайрам аудандық мәслихат сессиясының 2008 жылғы 30 маусымдағы N 8-104/IV шешімі және Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2008 жылғы 30 маусымдағы N 6 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2008 жылғы 30 шілдеде N 14-10-96 тіркелді

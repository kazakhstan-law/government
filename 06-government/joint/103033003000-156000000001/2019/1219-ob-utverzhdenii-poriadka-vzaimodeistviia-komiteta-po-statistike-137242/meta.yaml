requisite: Совместные приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 19 декабря 2019 года № 177 и постановление акимата Атырауской области от 29 ноября 2019 года № 269
title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с акиматом Атырауской области при проведении национальной переписи населения Республики Казахстан в 2020 году в учреждениях и организациях акимата Атырауской области
  kaz: Атырау облысы әкімдігінің мекемелері мен ұйымдарында 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Атырау облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

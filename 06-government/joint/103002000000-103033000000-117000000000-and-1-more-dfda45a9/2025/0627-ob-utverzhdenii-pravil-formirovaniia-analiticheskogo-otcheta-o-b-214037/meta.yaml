  title:
    rus: О внесении изменений и дополнений в совместные приказы и.о. Министра национальной экономики Республики Казахстан от 27 июня 2025 года № 61, Министра финансов Республики Казахстан от 30 июня 2025 года № 330, постановления Правления Национального Банка Республики Казахстан от 25 июля 2025 года № 41, Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 августа 2025 года № 31 «Об утверждении Правил формирования аналитического отчета о бюджетных рисках»
    kaz: «Бюджеттік тәуекелдер туралы талдамалық есепті қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің м.а. 2025 жылғы 27 маусымдағы № 61, Қазақстан Республикасы Қаржы министрінің 2025 жылғы 30 маусымдағы № 330 бірлескен бұйрықтарына, Қазақстан Республикасы Ұлттық Банкі Басқармасының 2025 жылғы 25 шілдедегі № 41, Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2025 жылғы 12 тамыздағы № 31 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/220068/rus

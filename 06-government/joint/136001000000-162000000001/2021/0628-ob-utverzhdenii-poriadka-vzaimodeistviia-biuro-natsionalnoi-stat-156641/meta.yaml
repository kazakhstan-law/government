act_code: '156641'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 139 и Постановление акимата Костанайской области от 16 июня 2021 года № 1
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Костанайской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Костанайской области
  kaz: Қостанай облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Қостанай облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

act_code: '141472'
requisite: Постановление акимата Мойынкумского района Жамбылской области от 29 января 2020 года № 12 и решение Мойынкумского районного маслихата от 31 марта 2020 года № 56-7. Зарегистрировано Департаментом юстиции Жамбылской области 10 апреля 2020 года № 4547. Утратило силу Совместные постановлением акимата Мойынкумского района Жамбылской области от 9 декабря 2024 года № 302 и решением Мойынкумского районного маслихата Жамбылской области от 9 декабря 2024 года № 32-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об изменении границы (черты) населенных пунктов Акбакай, Биназар, Берлик, Бурылбайтал, Кашкантениз, Кияхты, Кумозек, Кенес, Мойынкум, Мынарал, станция Мынарал, Назарбеков, Уланбел и Хантау Мойынкумского района Жамбылской области
  kaz: Жамбыл облысы Мойынқұм ауданының Ақбақай, Биназар, Бірлік, Бурылбайтал, Қашқантеңіз, Қияхты, Құмөзек, Кеңес, Мойынқұм, Мыңарал, Мыңарал стансасы, Назарбеков, Ұланбел және Хантау елді мекендерінің шекарасын (шегін) өзгерту туралы

act_code: '38024'
requisite: Атырау облысы Махамбет аудандық әкімиятының 2008 жылғы 22 қаңтардағы № 24 бірлескен қаулысы және Атырау облыстық Махамбет аудандық мәслихатының 2008 жылғы 22 қаңтардағы № 37 шешімі. Атырау облысы Махамбет аудандық Әділет басқармасында 2008 жылғы 25 ақпанда № 4-3-87 болып тіркелді

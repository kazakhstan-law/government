requisite: Cовместное постановление Махамбетского районного акимата Атырауской области от 11 ноября 2015 года № 481 и решение Махамбетского районного маслихата Атырауской области от 20 ноября 2015 года № 334. Зарегистрировано Департаментом юстиции Атырауской области 29 декабря 2015 года № 3409. Утратило силу совместным решением маслихата Махамбетского района Атырауской области от 25 декабря 2020 года № 491 и постановлением акимата Махамбетского района Атырауской области от 29 декабря 2020 года № 316 (вводится в действие по истечении десяти календарных дней после дня их первого официального опубликования)

  title:
    rus: О внесении изменения в совместные постановление акимата города Темиртау от 4 октября 2024 года № 48/62 и решение Темиртауского городского маслихата от 4 октября 2024 года № 20/6 «Об установлении льготы отдельным категориям граждан для проезда на городском общественном транспорте (кроме такси) в городе Темиртау»
    kaz: Теміртау қаласының әкімдігінің 2024 жылғы 4 қазандағы № 48/62 бірлескен қаулысына және Теміртау қалалық мәслихатының 2024 жылғы 4 қазандағы № 20/6 «Теміртау қаласы азаматтарының қалалық қоғамдық көлікте жүру үшін (таксиден басқа) жекелеген санаттарына жеңілдіктер белгілеу туралы» шешіміне өзгеріс енгізу туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 123. Зарегистрировано в Министерстве юстиции Республики Казахстан от 18 сентября 2008 года № 5308. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года № 130
  title:
    rus: О внесении изменений в совместное постановление Правлений Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 года № 112 и Национального Банка Республики Казахстан от 12 апреля 2004 года № 53 "Об утверждении форм и сроков представления отчетов о структуре портфеля ценных бумаг банков второго уровня и инвестиций банков второго уровня в капитал других юридических лиц"
    kaz: '"Екінші деңгейдегі банктердің бағалы қағаздар портфелінің құрылымы және екінші деңгейдегі банктердің басқа заңды тұлғалардың капиталына инвестициялар туралы есептерді ұсыну нысандары мен мерзімдерін бекіту туралы" Қазақстан Республикасы Ұлттық Банкі басқармасының 2004 жылғы 12 сәуірдегі № 53, Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөніндегі агенттігі Басқармасының 2004 жылғы 12 сәуірдегі № 112 бірлескен қаулысына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/41596/rus

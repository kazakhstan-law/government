requisite: Совместное постановление Правлений Национального Банка Республики Казахстан от 12 апреля 2004 г. № 53 и Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 г. № 112. Зарегистрировано Министерством юстиции Республики Казахстан 17 мая 2004 года № 2856. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года № 130
title:
  rus: Об утверждении форм и сроков представления отчетов о структуре портфеля ценных бумаг банков второго уровня и инвестиций банков второго уровня в капитал других юридических лиц
  kaz: Екінші деңгейдегі банктердің бағалы қағаздар портфелінің құрылымы және екінші деңгейдегі банктердің басқа заңды тұлғалардың капиталына инвестициялар туралы есептерді ұсыну нысандары мен мерзімдерін бекіту туралы

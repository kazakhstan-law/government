  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года № 14. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 января 2006 года № 4067. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года № 130
  title:
    rus: О внесении изменения в совместное постановление Правлений Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 года № 112 и Национального Банка Республики Казахстан от 12 апреля 2004 года № 53 "Об утверждении форм и сроков представления отчетов о структуре портфеля ценных бумаг банков второго уровня и инвестиций банков второго уровня в капитал других юридических лиц"
    kaz: '"Екінші деңгейдегі банктердің бағалы қағаздар портфелінің құрылымы және екінші деңгейдегі банктердің басқа заңды тұлғалардың капиталына инвестициялар туралы есептерді ұсыну нысандары мен мерзімдерін бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің 2004 жылғы 12 сәуірдегі № 112 және Қазақстан Республикасының Ұлттық Банкі Басқармаларының 2004 жылғы 12 сәуірдегі № 53 бірлескен қаулысына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/26516/rus

  requisite: Совместное постановление Правлений Национального Банка Республики Казахстан от 12 апреля 2004 г. № 56 и Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 г. № 117. Зарегистрировано Министерством юстиции Республики Казахстан 11 мая 2004 года № 2839. Утратило силу совместным постановлением Правлений Национального Банка Республики Казахстан от 15 марта 2005 года № 35 и Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2005 года № 43
  title:
    rus: О внесении изменений и дополнения в совместное постановление Правлений Национального Банка Республики Казахстан от 24 января 2004 года № 10 и Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 января 2004 года № 29 "О перечне, формах и сроках представления и публикации годовой финансовой отчетности банками второго уровня", зарегистрированное в Министерстве юстиции Республики Казахстан под № 2702
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2702 тіркелген, "Екінші деңгейдегі банктердің жылдық қаржылық есебін ұсыну және жариялау тәртібі, нысандары мен мерзімдері туралы" Қазақстан Республикасының Ұлттық Банкі Басқармасының 2004 жылғы 24 қаңтардағы N 10 және Қазақстан Республикасының қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөніндегі агенттігінің 2004 жылғы 24 қаңтардағы N 29 бірлескен қаулыларына өзгерістер мен толықтыру енгізу туралы

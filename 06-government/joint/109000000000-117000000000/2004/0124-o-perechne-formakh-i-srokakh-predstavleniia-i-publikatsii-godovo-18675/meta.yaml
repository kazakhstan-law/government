act_code: '18675'
requisite: Совместное постановление Правления Национального Банка Республики Казахстан от 24 января 2004 года № 10 и Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 января 2004 года № 29. Зарегистрировано Министерством юстиции Республики Казахстан 10 февраля 2004 года № 2702. Утратило силу совместным постановлением Правлений Национального Банка Республики Казахстан от 15 марта 2005 года № 35 и Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2005 года № 43

act_code: '156631'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 143 и Постановление акимата Северо-Казахстанской области от 16 июня 2021 года № 121
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Северо-Казахстанской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Солтүстік Қазақстан облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

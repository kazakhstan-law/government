act_code: '157081'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 13 июля 2021 года № 160 и Постановление акимата города Нур-Султана от 14 июля 2021 года № 504-2474
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом города Нур-Султана при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата города Нур-Султана
  kaz: Нұр-Сұлтан қаласы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Нұр-Сұлтан қаласының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

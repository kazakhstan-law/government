act_code: '51423'
requisite: Қызылорда облысы Жаңақорған ауданы әкімдігінің 2010 жылғы 16 ақпандағы N 589 қаулысы. Қызылорда облысының Әділет департаменті Жаңақорған ауданының Әділет басқармасында 2010 жылғы 18 наурызда N 10-7-92 болып тіркелді. Күші жойылды - Қызылорда облысы Жаңақорған ауданы әкімдігінің 2011 жылғы 15 шілдедегі N 1200 Қаулысымен

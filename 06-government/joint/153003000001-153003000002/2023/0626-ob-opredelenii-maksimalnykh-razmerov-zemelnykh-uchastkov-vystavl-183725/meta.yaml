act_code: '183725'
requisite: Постановление акимата Айтекебийского района Актюбинской области от 26 июня 2023 года № 112 и решение Айтекебийского районного маслихата Актюбинской области от 26 июня 2023 года № 60. Зарегистрировано Департаментом юстиции Актюбинской области 1 июля 2023 года № 8376
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства, в зависимости от местных условий и особенностей по Айтекебийскому району
  kaz: Әйтеке би ауданы бойынша шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін жергілікті жағдайлар мен ерекшеліктеріне қарай айқындау туралы

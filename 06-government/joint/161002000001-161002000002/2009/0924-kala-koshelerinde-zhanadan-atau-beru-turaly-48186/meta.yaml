requisite: Қызылорда облысы Қызылорда қаласы әкімдігінің 2009 жылғы 24 қыркүйектегі N 1938/1 қаулысы және Қызылорда облысы Қызылорда қалалық мәслихатының 2009 жылғы 24 қыркүйектегі N 21/5 шешімі. Қызылорда облысының Әділет департаменті Қызылорда қалалық Әділет басқармасында 2009 жылы 14 қазанда N 10-1-119 тіркелді. Күші жойылды - Қызылорда облысы Қызылорда қаласы әкімдігінің 2012 жылғы 29 наурыздағы N 344 Қаулысымен және Қызылорда облысы Қызылорда қалалық мәслихатының 2012 жылғы 29 наурыздағы N 3/6 Шешімімен

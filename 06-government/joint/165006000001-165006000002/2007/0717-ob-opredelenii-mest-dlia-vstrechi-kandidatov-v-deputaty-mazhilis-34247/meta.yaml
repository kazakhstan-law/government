requisite: Совместное постановление акимата Есильского района Северо-Казахстанской области от 17 июля 2007 года № 214 и решение маслихата Есильского района Северо-Казахстанской области от 16 июля 2007 года № 258. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 19 июля 2007 года № 13-6-44. Утратило силу совместным постановлением акимата Есильского района Северо-Казахстанской области от 29 марта 2011 года № 51 и решением маслихата Есильского района Северо-Казахстанской области от 29 марта 2011 года № 38/229

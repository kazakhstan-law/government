requisite: Совместное постановление акимата Айыртауского района Северо-Казахстанской области от 17 июля 2007 года № 234 и решение маслихата Айыртауского района Северо-Казахстанской области от 17 июля 2007 года № 3-36-7. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 1 августа 2007 года № 13-3-52. Утратило силу совместным решением маслихата Айыртауского района Северо-Казахстанской области от 27 декабря 2024 года № 8-22-18 и постановлением акимата Айыртауского района Северо-Казахстанской области от 27 декабря 2024 года № 515 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

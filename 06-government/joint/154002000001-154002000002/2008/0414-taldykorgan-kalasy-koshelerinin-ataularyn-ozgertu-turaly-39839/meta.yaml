requisite: Алматы облысы Талдықорған қаласы мәслихатының 2008 жылғы 14 сәуірдегі № 53 шешімі және Алматы облысы Талдықорған қаласы әкімдігінің 2008 жылғы 14 сәуірдегі № 9-365 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының әділет басқармасында 2008 жылы 23 мамырда № 2-1-80 тіркелді

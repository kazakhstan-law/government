requisite: Алматы облысы Талдықорған қалалық мәслихатының 2008 жылғы 22 ақпандағы № 40 шешімі және Талдықорған қаласы әкімдігінің 2008 жылғы 18 ақпандағы № 5-206 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының әділет басқармасында 2008 жылы 28 наурызда № 2-1-72 тіркелді. Күші жойылды - Алматы облысы Талдықорған қалалық мәслихатының 2009 жылғы 10 желтоқсандағы № 160 шешімімен және Талдықорған қаласы әкімдігінің 2009 жылғы 10 желтоқсандағы № 30-956 қаулысымен

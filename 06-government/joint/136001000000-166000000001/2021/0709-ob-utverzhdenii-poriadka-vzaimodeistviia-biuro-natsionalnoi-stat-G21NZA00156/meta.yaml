requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 9 июля 2021 года № 156 и Постановление акимата Туркестанской области от 30 июня 2021 года № 146
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Туркестанской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Туркестанской области
  kaz: Түркістан облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Түркістан облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

  title:
    rus: О внесении дополнения в совместные постановление акимата города Рудного от 27 июня 2023 года № 552 и решение Рудненского городского маслихата от 27 июня 2023 года № 38 «Об установлении льгот отдельным категориям граждан города Рудного для проезда на городском общественном транспорте (кроме такси)»
    kaz: Рудный қаласы әкімдігінің 2023 жылғы 27 маусымдағы № 552 «Рудный қаласы азаматтарының жекелеген санаттарына қалалық қоғамдық көлікте (таксиден басқа) жол жүру үшін жеңілдіктер белгілеу туралы» бірлескен қаулысына және Рудный қалалық мәслихатының 2023 жылғы 27 маусымдағы № 38 шешіміне толықтыру енгізу туралы

  title:
    rus: О внесении изменений в совместное нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 28 ноября 2015 года № 10-НҚ и приказ Министра финансов Республики Казахстан от 27 ноября 2015 года № 590 «Об утверждении Единых принципов и подходов к системе управления рисками, применяемых органами государственного аудита и финансового контроля»
    kaz: Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2015 жылғы 28 қарашадағы № 10-НҚ және Қазақстан Республикасы Қаржы министрінің 2015 жылғы 27 қарашадағы № 590 «Мемлекеттік аудит және қаржылық бақылау органдары қолданатын тәуекелдерді басқару жүйесіне бірыңғай қағидаттар мен тәсілдерді бекіту туралы» бірлескен нормативтік қаулысы мен бұйрығына өзгерістер енгізу туралы

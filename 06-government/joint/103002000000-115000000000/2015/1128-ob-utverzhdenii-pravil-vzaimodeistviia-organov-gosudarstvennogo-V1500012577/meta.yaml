  title:
    rus: О внесении изменения в совместные нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 28 ноября 2015 года № 9-НҚ и приказ Министра финансов Республики Казахстан от 27 ноября 2015 года № 589 «Об утверждении Правил взаимодействия органов государственного аудита и финансового контроля»
    kaz: «Мемлекеттік аудит және қаржылық бақылау органдарымен өзара іс-қимыл қағидаларын бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2015 жылғы 28 қарашадағы № 9-НҚ және Қазақстан Республикасы Қаржы министрінің 2015 жылғы 27 қарашадағы № 589 бірлескен нормативтік қаулысы мен бұйрығына өзгеріс енгізу туралы

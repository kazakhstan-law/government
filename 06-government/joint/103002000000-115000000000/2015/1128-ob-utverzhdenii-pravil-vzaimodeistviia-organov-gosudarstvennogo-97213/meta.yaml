    kaz: «Мемлекеттік аудит және қаржылық бақылау органдарымен өзара іс-қимыл қағидаларын бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2015 жылғы 28 қарашадағы № 9-НҚ және Қазақстан Республикасы Қаржы министрінің 2015 жылғы 27 қарашадағы № 589 бірлескен нормативтік қаулысы мен бұйрығына өзгерістер мен толықтыру енгізу туралы

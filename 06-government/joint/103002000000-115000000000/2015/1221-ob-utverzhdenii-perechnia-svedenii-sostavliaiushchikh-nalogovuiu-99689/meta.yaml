requisite: Совместный приказ Министра финансов Республики Казахстан от 21 декабря 2015 года № 672 и нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 26 января 2016 года № 2-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2016 года № 13128. Утратил силу совместным приказом Министра финансов Республики Казахстан от 8 февраля 2019 года № 86 и нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 8 февраля 2019 года № 1-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

requisite: Совместное постановление акимата Тайыншинского района Северо-Казахстанской области от 13 июля 2007 года № 227 и решение маслихата Тайыншинского района Северо-Казахстанской области от 13 июля 2007 года № 223. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 27 июля 2007 года № 13-11-65
title:
  rus: Об определении помещений для встреч политических партий, по выборам депутатов Мажилиса Парламента Республики Казахстан, избираемых по партийным спискам и кандидатов в депутаты Северо-Казахстанского областного и Тайыншинского районного маслихатов с избирателями Тайыншинского района
  kaz: Партиялық тізім бойынша сайланатын Қазақстан Республикасы Парламенті Мәжілісінің депутаттарын сайлау бойынша саяси партиялардың Солтүстік Қазақстан облысы және Тайынша ауданы мәслихаты депутаттығына кандидаттардын Тайынша ауданының сайлаушыларымен кездесулері үшін үй-жайларды белгілеу туралы

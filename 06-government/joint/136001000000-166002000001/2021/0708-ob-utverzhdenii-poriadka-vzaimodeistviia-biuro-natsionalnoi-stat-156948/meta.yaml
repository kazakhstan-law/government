act_code: '156948'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 8 июля 2021 года № 155 и Постановление акимата города Шымкент от 28 июня 2021 года № 532
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом города Шымкент при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата города Шымкент
  kaz: Шымкент қаласы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Шымкент қаласының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

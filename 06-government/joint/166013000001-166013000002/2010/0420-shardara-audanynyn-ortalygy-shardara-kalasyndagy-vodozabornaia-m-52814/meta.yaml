act_code: '52814'
requisite: Бірлескен Оңтүстік Қазақстан облысы Шардара аудандық мәслихатының 2010 жылғы 20 сәуірдегі N 30-225-IV шешімі және Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2010 жылғы 20 сәуірдегі N 299 қаулысы. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2010 жылғы 27 мамырда N 14-15-92 тіркелді

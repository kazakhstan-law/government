requisite: Бірлескен Оңтүстік Қазақстан облысы Сарыағаш аудандық мәслихатының 2010 жылғы 14 қыркүйектегі N 40-279-IV шешімі және Оңтүстік Қазақстан облысы Сарыағаш ауданы әкімдігінің 2010 жылғы 14 қыркүйектегі N 657 қаулысы. Оңтүстік Қазақстан облысы Сарыағаш ауданының Әділет басқармасында 2010 жылғы 4 қазанда N 14-11-146 тіркелді

  title:
    rus: О внесении изменений в постановление акимата Жамбылской области от 19 июля 2012 года № 222 и решение маслихата Жамбылской области от 7 декабря 2012 года № 10-8 «Об установлении минимальных размеров земельных участков сельскохозяйственного назначения предоставляемых в собственность или землепользование в Жамбылской области»
    kaz: «Жамбыл облысында меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы» Жамбыл облысы әкімдігінің 2012 жылғы 19 шілдедегі № 222 қаулысы және Жамбыл облыстық мәслихатының 2012 жылғы 7 желтоқсандағы № 10-8 шешіміне өзгерістер енгізу туралы

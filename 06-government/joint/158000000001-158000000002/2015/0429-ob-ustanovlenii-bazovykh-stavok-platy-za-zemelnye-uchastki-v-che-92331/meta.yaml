  kaz: Жамбыл облысы бойынша ауыл шаруашылығы мақсатындағы жерлерді қоспағанда, елді мекендер шегінде  жер учаскелері жеке меншікке берілген  кезде олар үшін төлемақының базалық  ставкаларын белгілеу  туралы

act_code: '209361'
requisite: Совместное постановление акимата Астраханского района Акмолинской области от 16 апреля 2025 года № А-4/105 и решение Астраханского районного маслихата Акмолинской области от 16 апреля 2025 года № 8С-35-2. Зарегистрировано Департаментом юстиции Акмолинской области 22 апреля 2025 года № 8914-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Астраханском районе
  kaz: Астрахан ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

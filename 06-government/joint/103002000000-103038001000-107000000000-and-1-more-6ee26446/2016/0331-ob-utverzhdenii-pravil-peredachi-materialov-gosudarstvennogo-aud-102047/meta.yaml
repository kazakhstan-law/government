requisite: Совместное нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 31 марта 2016 года № 6-НҚ и приказ Министра финансов Республики Казахстан от 19 февраля 2016 года № 76, Национального бюро по противодействию коррупции (Антикоррупционная служба) Министерства по делам государственной службы Республики Казахстан от 26 февраля 2016 года № 20 и Генерального Прокурора Республики Казахстан от 30 марта 2016 года № 51. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2016 года № 13679. Утратил силу совместным нормативным постановлением Высшей аудиторской палаты Республики Казахстан от 9 февраля 2024 года № 4-НҚ и приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 21 февраля 2024 года № 41, Председателя Агентства Республики Казахстан по финансовому мониторингу от 1 марта 2024 года № 1, Генерального Прокурора Республики Казахстан от 12 марта 2024 года № 37 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

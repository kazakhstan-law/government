title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с акиматом Северо-Казахстанской области при проведении национальной переписи населения Республики Казахстан в 2020 году в учреждениях и организациях акимата Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы әкімдігінің мекемелері мен ұйымдарында 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Солтүстік Қазақстан облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

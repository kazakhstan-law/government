title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с акиматом Алматинской области при проведении национальной переписи населения Республики Казахстан в 2020 году в учреждениях и организациях акимата Алматинской области
  kaz: Алматы облысы әкімдігінің мекемелері мен ұйымдарында 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Алматы облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

act_code: '197356'
requisite: Совместные постановление акимата Есильского района Акмолинской области от 21 мая 2024 года № а-5/101 и решение Есильского районного маслихата Акмолинской области от 21 мая 2024 года № 8С-21/3. Зарегистрировано Департаментом юстиции Акмолинской области 3 июня 2024 года № 8766-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Есильском районе
  kaz: Есіл ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

act_code: '156639'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 137 и Постановление акимата Жамбылской области от 29 июня 2021 года № 134
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Жамбылской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Жамбылской области
  kaz: Жамбыл облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Жамбыл облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

requisite: Совместные постановление акимата города Павлодара Павлодарской области от 18 декабря 2024 года № 1722/2 и решение Павлодарского городского маслихата Павлодарской области от 18 декабря 2024 года № 209/23. Зарегистрированы в Департаменте юстиции Павлодарской области 20 декабря 2024 года № 7625-14. Утратило силу совместным постановлением акимата города Павлодара Павлодарской области от 18 марта 2026 года № 502/1 и решением Павлодарского городского маслихата Павлодарской области от 18 марта 2026 года № 306/39 (вводятся в действие со дня их первого официального опубликования)

requisite: Совместное постановление акимата Жаксынского района Акмолинской области от 6 марта 2025 года № a-1/26 и решение Жаксынского районного маслихата Акмолинской области от 6 марта 2025 года № 8С-40-2. Зарегистрировано Департаментом юстиции Акмолинской области 14 марта 2025 года № 8899-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Жаксынском районе
  kaz: Жақсы ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

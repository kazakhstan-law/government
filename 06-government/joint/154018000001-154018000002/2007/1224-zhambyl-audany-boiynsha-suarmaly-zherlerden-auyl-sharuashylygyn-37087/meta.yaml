act_code: '37087'
requisite: Алматы облысы Жамбыл аудандық мәслихатының 2007 жылғы 24 желтоқсандағы № 6-29 шешімі және Жамбыл ауданы әкімдігінің 2007 жылғы 24 желтоқсандағы № 1193 бірлескен қаулысы. Алматы облысының Әділет департаменті Жамбыл ауданының Әділет басқармасында 2008 жылдың 18 қаңтарында № 2-7-52 тіркелді. Күші жойылды - Алматы облысы Жамбыл аудандық мәслихатының 2009 жылғы 21 желтоқсандағы № 31-135 және Жамбыл ауданы әкімдігінің 2009 жылғы 21 желтоқсандағы № 718 бірлескен қаулысымен
title:

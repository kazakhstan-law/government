act_code: '156890'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 9 июля 2021 года № 157 и Постановление акимата Атырауской области от 25 июня 2021 года № 151
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Атырауской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Атырауской области
  kaz: Атырау облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Атырау облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

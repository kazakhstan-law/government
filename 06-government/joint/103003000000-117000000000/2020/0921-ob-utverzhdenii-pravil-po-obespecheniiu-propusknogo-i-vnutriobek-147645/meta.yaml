  title:
    rus: О внесении изменений и дополнений в совместные постановление Правления Национального Банка Республики Казахстан от 21 сентября 2020 года № 115 и приказ Министра внутренних дел Республики Казахстан от 7 октября 2020 года № 679 «Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов в зданиях Национального Банка Республики Казахстан и его территориальных филиалах»
    kaz: «Қазақстан Республикасы Ұлттық Банкінің ғимараттарында және оның аумақтық филиалдарында өткізу және объектішілік режимдерді қамтамасыз ету жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2020 жылғы 21 қыркүйектегі № 115 бірлескен қаулысына және Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 7 қазандағы № 679 бұйрығына өзгерістер мен толықтырулар енгізу туралы

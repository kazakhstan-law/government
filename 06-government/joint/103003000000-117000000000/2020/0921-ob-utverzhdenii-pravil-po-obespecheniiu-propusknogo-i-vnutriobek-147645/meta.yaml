  rus: Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов в зданиях Национального Банка Республики Казахстан и его территориальных филиалах
  kaz: Қазақстан Республикасы Ұлттық Банкінің ғимараттарында және оның аумақтық филиалдарында өткізу және объектішілік режимдерді қамтамасыз ету жөніндегі қағидаларды бекіту туралы

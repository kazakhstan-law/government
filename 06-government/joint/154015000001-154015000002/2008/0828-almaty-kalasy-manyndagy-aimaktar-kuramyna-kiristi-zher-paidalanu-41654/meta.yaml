requisite: Алматы облысы Қарасай ауданы мәслихатының 2008 жылғы 28 тамыздағы № 14-3 шешімі және Қарасай ауданы әкімдігінің 2008 жылғы 28 тамыздағы № 8-1111 қаулысы. Алматы облысының Әділет департаменті Қарасай ауданының Әділет басқармасында 2008 жылдың 19 қыркүйегінде № 2-11-56 тіркелді. Күші жойылды - Алматы облысы Қарасай ауданы мәслихатының 2009 жылғы 22 желтоқсандағы N 36-4 шешімі және Қарасай ауданы әкімдігінің 2009 жылғы 22 желтоқсандағы № 12-1223 қаулысымен

act_code: '191464'
requisite: Совместные постановление акимата города Семей от 27 декабря 2023 года № 1086 и решение маслихата города Семей области Абай от 26 декабря 2023 года № 17/106-VIII. Зарегистрировано Департаментом юстиции области Абай 3 января 2024 года № 205-18
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства, в зависимости от местных условий и особенностей по городу Семей области Абай
  kaz: Абай облысы Семей қаласы бойынша шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің жергілікті жағдайлар мен ерекшеліктеріне қарай ең жоғары мөлшерлерін айқындау туралы

requisite: Совместное постановление акимата Жамбылского района Северо-Казахстанской области от 16 июля 2007 года № 208 и решение маслихата Жамбылского района Северо-Казахстанской области от 16 июля 2007 года № 9/39. Зарегистрировано Управлением юстиции Жамбылского района Северо-Казахстанской области 20 июля 2007 года № 13-7-55. Утратило силу совместным решением маслихата Жамбылского района Северо-Казахстанской области от 25 декабря 2024 года № 24/11 и постановлением акимата Жамбылского района Северо-Казахстанской области от 25 декабря 2024 года № 377 (вводится в действие по истечении десяти календарных дней после дня его первого официально опубликования)

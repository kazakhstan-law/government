requisite: Атырау қалалық әкімиятының 2007 жылғы 6 желтоқсандағы № 883 қаулысы және Атырау қалалық мәслихатының 2007 жылғы 14 желтоқсандағы № 33 бірлескен шешімі. Атырау қалалық Әділет басқармасында 2008 жылғы 24 қаңтарда № 4-1-78 болып тіркелді

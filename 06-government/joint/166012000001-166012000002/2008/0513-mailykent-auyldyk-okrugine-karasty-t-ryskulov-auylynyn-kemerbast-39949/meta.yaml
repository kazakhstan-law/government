requisite: Бірлескен Оңтүстік Қазақстан облысы Түлкібас аудандық мәслихатының 2008 жылғы 13 мамырдағы N 7/2-04 шешімі және Түлкібас ауданы әкімдігінің 2008 жылғы 13 мамырдағы N 233 қаулысы. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2008 жылғы 29 мамырда N 14-14-52 тіркелді
title:
  rus: Майлыкент ауылдық округіне қарасты Т.Рысқұлов ауылының, Кемербастау ауылдық округіне қарасты Алғабас және Мәнтай Жәрімбетов атындағы ауылдарының, Рысқұлов ауылдық округіне қарасты Азаттық ауылының шекараларын өзгерту туралы
  kaz: Майлыкент ауылдық округіне қарасты Т.Рысқұлов ауылының, Кемербастау ауылдық округіне қарасты Алғабас және Мәнтай Жәрімбетов атындағы ауылдарының, Рысқұлов ауылдық округіне қарасты Азаттық ауылының шекараларын өзгерту туралы

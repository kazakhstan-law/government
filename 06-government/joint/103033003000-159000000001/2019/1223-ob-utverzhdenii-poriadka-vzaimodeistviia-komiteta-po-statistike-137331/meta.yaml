act_code: '137331'
requisite: Совместные приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 23 декабря 2019 года № 185 и постановление акимата Западно-Казахстанской области от 13 декабря 2019 года № 332
title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с акиматом Западно-Казахстанской области при проведении национальной переписи населения Республики Казахстан в 2020 году в учреждениях и организациях акимата Западно-Казахстанской области
  kaz: Батыс Қазақстан облысы әкімдігінің мекемелері мен ұйымдарында 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Батыс Қазақстан облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

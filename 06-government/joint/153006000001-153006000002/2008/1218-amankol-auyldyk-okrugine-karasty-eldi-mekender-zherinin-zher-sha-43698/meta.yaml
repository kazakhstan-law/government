requisite: Бірлескен Ақтөбе облысы Ырғыз аудандық әкімдігінің 2008 жылғы 18 желтоқсандағы № 255 қаулысы және Ақтөбе облысы Ырғыз аудандық мәслихатының № 61 шешімі. Ақтөбе облысының Ырғыз аудандық әділет басқармасында 2009 жылдың 23 қаңтарда № 3-5-87 тіркелді

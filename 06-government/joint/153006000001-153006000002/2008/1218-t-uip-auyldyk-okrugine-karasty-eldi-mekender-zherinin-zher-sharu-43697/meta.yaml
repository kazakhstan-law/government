requisite: Бірлескен Ақтөбе облысы Ырғыз аудандық әкімдігінің 2008 жылғы 18 желтоқсандағы № 254 қаулысы және Ақтөбе облысы Ырғыз аудандық мәслихатының 2008 жылғы 18 желтоқсандағы № 60 шешімі. Ақтөбе облысының Ырғыз аудандық әділет басқармасында 2009 жылдың 23 қаңтарда N 3-5-86 тіркелді

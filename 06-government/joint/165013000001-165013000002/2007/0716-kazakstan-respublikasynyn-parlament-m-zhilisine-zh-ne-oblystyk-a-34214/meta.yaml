requisite: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2007 жылғы 16 шілдедегі № 112 және Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2007 жылғы 17 шілдедегі № 8-33 с бірлескен қаулы мен шешімі. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2007 жылғы 19 шілдеде № 13-13-52 болып тіркелді. Күші жойылды – Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2024 жылғы 13 қарашадағы № 217 және Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2024 жылғы 13 қарашадағы № 11-23 с (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) бірлескен қаулысымен және шешімімен
title:

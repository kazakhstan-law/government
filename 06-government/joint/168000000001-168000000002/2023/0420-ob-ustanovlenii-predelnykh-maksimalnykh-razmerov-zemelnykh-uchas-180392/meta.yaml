  title:
    rus: О внесении изменений в совместное постановление акимата области Абай от 21 апреля 2023 года № 81 и решение маслихата области Абай от 20 апреля 2023 года № 2/14-VIII «Об установлении предельных (максимальных) размеров земельных участков, которые могут быть предоставлены бесплатно в частную собственность гражданам области Абай»
    kaz: «Абай облысының азаматтарына жеке меншікке тегін ұсынылуы мүмкін жер учаскелерінің шекті (ең жоғары) мөлшерін белгілеу туралы» Абай облысы әкімдігінің 2023 жылғы 21 сәуірдегі № 81 бірлескен қаулысы және Абай облысы мәслихатының 2023 жылғы 20 сәуірдегі № 2/14-VIII шешіміне өзгерістер енгізу туралы

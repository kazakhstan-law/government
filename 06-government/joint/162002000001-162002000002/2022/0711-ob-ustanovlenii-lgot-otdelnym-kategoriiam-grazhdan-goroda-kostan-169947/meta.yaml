  title:
    rus: О внесении изменений в совместное постановление акимата города Костаная от 11 июля 2022 года № 1441 и решение Костанайского городского маслихата от 11 июля 2022 года № 130 «Об установлении льгот отдельным категориям граждан города Костаная для проезда на городском и пригородном общественном транспорте (кроме такси)»
    kaz: Қостанай қаласы әкімдігінің 2022 жылғы 11 шілдедегі № 1441 және Қостанай қалалық мәслихатының 2022 жылғы 11 шілдедегі № 130 «Қостанай қаласы азаматтарының жекелеген санаттарына қалалық және қала маңындағы қоғамдық көлікте (таксиден басқа) жол жүру үшін жеңілдіктер белгілеу туралы» бірлескен қаулысына және шешіміне өзгерістер енгізу туралы

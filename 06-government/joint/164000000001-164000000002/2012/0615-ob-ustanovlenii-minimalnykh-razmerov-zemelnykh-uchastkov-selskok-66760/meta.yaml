  requisite: Совместные постановление акимата Павлодарской области от 14 апреля 2022 года № 2 и решение Павлодарского областного маслихата от 14 апреля 2022 года № 148/12. Зарегистрированы в Министерстве юстиции Республики Казахстан 22 апреля 2022 года № 27737
  title:
    rus: О внесении изменений в совместные постановление акимата Павлодарской области от 15 июня 2012 года № 4 и решение маслихата Павлодарской области от 15 июня 2012 года № 58/5 «Об установлении минимальных размеров земельных участков сельскохозяйственного назначения, предоставляемых в собственность или землепользование в Павлодарской области»
    kaz: Павлодар облысы әкімдігінің 2012 жылғы 15 маусымдағы № 4 және Павлодар облыстық мәслихатының 2012 жылғы 15 маусымдағы № 58/5 «Павлодар облысында меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы» бірлескен қаулысы мен шешіміне өзгерістер енгізу туралы

act_code: '66760'
requisite: Решение маслихата Павлодарской области от 15 июня 2012 года № 58/5 и постановление акимата Павлодарской области от 15 июня 2012 года № 4. Зарегистрировано Департаментом юстиции Павлодарской области 20 июля 2012 года № 3212
title:
  rus: Об установлении минимальных размеров земельных участков сельскохозяйственного назначения в зависимости от местных условий и особенностей использования указанных земель, предоставляемых в собственность или землепользование в Павлодарской области
  kaz: Павлодар облысында жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы

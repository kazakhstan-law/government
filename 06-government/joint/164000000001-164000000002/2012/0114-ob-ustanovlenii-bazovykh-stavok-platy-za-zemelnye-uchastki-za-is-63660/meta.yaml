  title:
    rus: О внесении изменений и дополнений в постановление акимата от 14 января 2012 года № 1 и решение маслихата Павлодарской области (XLI (внеочередная) сессия, IV созыв) от 14 января 2012 года № 413/41 "О базовых ставках платы за земельные участки, предоставляемые в частную собственность в областном центре, городах, поселках и сельских населенных пунктах области"
    kaz: Павлодар облысы әкімдігінің 2012 жылғы 14 қаңтардағы № 1 қаулысына және Павлодар облыстық мәслихатының (IV сайланған XLI (кезектен тыс) сессиясы) 2012 жылғы 14 қаңтардағы "Облыс орталығында, облыс қалаларында, кенттерінде және ауылдық елді мекендерінде жеке меншікке берілетін жер учаскелері үшін төлемақының базалық ставкалары туралы" № 413/41 шешіміне өзгерістер мен толықтырулар енгізу туралы

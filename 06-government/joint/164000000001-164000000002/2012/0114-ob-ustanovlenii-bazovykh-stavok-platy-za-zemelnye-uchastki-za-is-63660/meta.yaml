act_code: '63660'
requisite: Постановление акимата Павлодарской области от 14 января 2012 года № 1 и решение маслихата Павлодарской области от 14 января 2012 года № 413/41. Зарегистрировано Департаментом юстиции Павлодарской области 16 февраля 2012 года № 3199
title:
  rus: Об установлении базовых ставок платы за земельные участки, за исключением  земель сельскохозяйственного назначения, предоставляемые в частную собственность  в областном центре, городах областного значения, поселках и сельских населенных пунктах области
  kaz: Ауыл шаруашылығы мақсатындағы жерлерден басқа облыс орталығында, облыстық маңызы бар қалаларда, кенттерде және облыстың ауылдық елді мекендерінде жеке меншікке берілетін жер учаскелеріне төлемақының базалық ставкаларын бекіту туралы

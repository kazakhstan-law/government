  requisite: Совместные постановление акимата Павлодарской области от 26 ноября 2021 года № 2 и решение Павлодарского областного маслихата от 26 ноября 2021 года № 84/8. Зарегистрированы в Министерстве юстиции Республики Казахстан 11 декабря 2021 года № 25739
  title:
    rus: О внесении изменений в совместные постановление акимата Павлодарской области от 14 января 2012 года № 1 и решение Павлодарского областного маслихата от 14 января 2012 года № 413/41 «О базовых ставках платы за земельные участки, предоставляемые в частную собственность в областном центре, городах, поселках и сельских населенных пунктах области»
    kaz: Павлодар облысы әкімдігінің 2012 жылғы 14 қаңтардағы № 1 және Павлодар облыстық мәслихатының 2012 жылғы 14 қаңтардағы № 413/41 «Облыс орталығында, облыс қалаларында, кенттерінде және ауылдық елді мекендерінде жеке меншікке берілетін жер учаскелері үшін төлемақының базалық ставкалары туралы» бірлескен қаулысы мен шешіміне өзгерістер енгізу туралы

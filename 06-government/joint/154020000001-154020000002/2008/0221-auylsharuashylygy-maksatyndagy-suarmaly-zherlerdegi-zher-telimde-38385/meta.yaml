requisite: Алматы облысы Қапшағай қалалық мәслихатының 2008 жылғы 21 ақпандағы № 50-9 және Қапшағай қалалық әкімдігінің 2008 жылғы 19 ақпандағы № 828 бірлескен шешімі мен қаулысы. Алматы облысы Қапшағай қаласының Әділет басқармасында 2008 жылғы 18 наурызда № 2-2-62 тіркелді. Күші жойылды - Алматы облысы Қапшағай қалалық мәслихатының 2009 жылғы 23 желтоқсандағы № 176-33 және Қапшағай қалалық әкімдігінің 2009 жылғы 22 желтоқсандағы № 1454 бірлескен шешімі мен қаулысымен

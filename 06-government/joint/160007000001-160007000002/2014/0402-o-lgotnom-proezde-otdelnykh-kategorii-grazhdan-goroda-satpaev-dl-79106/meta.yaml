  title:
    rus: О внесении изменения в совместное постановление акимата города Сатпаев от 2 апреля 2014 года № 06/01 и решение Сатпаевского городского маслихата от 31 марта 2014 года № 223 «О льготном проезде отдельных категорий граждан города Сатпаев для проезда на внутригородском общественном транспорте (кроме такси)»

act_code: '79106'
requisite: Совместное постановление акимата города Сатпаев Карагандинской области от 2 апреля 2014 года № 06/01 и решение Сатпаевского городского маслихата Карагандинской области от 31 марта 2014 года № 223. Зарегистрировано Департаментом юстиции Карагандинской области 22 апреля 2014 года № 2601. Утратило силу совместным постановлением акимата города Сатпаев области Ұлытау от 20 марта 2026 года № 14/03 и решением Сатпаевского городского маслихата области Ұлытау от 20 марта 2026 года № 262 (вводится в действие по истечении десяти календарных дней после дня их первого официального опубликования)

  title:
    rus: О внесении изменений в совместное постановление акимата города Аксу Павлодарской области от 26 декабря 2016 года № 1038/11 и решение Аксуского городского маслихата Павлодарской области от 26 декабря 2016 года № 74/10 «О льготном проезде отдельных категорий граждан города Аксу на общественном пассажирском транспорте (кроме такси)»
    kaz: Павлодар облысы Ақсу қалалық әкімдігінің 2016 жылғы 26 желтоқсандағы № 1038/11 және Павлодар облысы Ақсу қалалық мәслихатының 2016 жылғы 26 желтоқсандағы № 74/10 «Ақсу қаласының жекелеген санаттағы азаматтарының қоғамдық жолаушылар көлігінде (таксиден басқа) жеңілдікпен жол жүруі туралы» бірлескен қаулысы мен шешіміне өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в совместное постановление акимата Южно-Казахстанской области от 28 апреля 2014 года № 100 и решение Южно-Казахстанского областного маслихата от 15 апреля 2014 года № 26/210-V «Об установлении минимальных размеров земельных участков сельскохозяйственного назначения в зависимости от местных условий и особенностей использования указанных земель, предоставляемых в собственность или землепользование в Туркестанской области»
    kaz: «Түркістан облысындағы жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы» бірлескен Оңтүстік Қазақстан облыстық әкімдігінің 2014 жылғы 28 сәуірдегі № 100 қаулысына және Оңтүстік Қазақстан облыстық мәслихатының 2014 жылғы 15 сәуірдегі № 26/210-V шешіміне өзгеріс енгізу туралы

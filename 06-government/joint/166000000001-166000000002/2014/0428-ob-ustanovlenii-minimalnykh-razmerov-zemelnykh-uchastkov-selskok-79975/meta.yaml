title:
  rus: Об установлении минимальных размеров земельных участков сельскохозяйственного назначения в зависимости от местных условий и особенностей использования указанных земель, предоставляемых в собственность или землепользование в Туркестанской области
  kaz: Түркістан облысындағы жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы

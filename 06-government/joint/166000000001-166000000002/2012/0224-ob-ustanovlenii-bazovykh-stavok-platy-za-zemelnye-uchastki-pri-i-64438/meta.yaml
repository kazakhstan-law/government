  title:
    rus: О внесении изменений в совместное постановление Южно-Казахстанского областного акимата от 15 марта 2012 года № 90 и решение Южно-Казахстанского областного маслихата от 24 февраля 2012 года № 2/16-V «Об установлении базовых ставок платы за земельныеучастки при их предоставлении в частную собственность по Южно-Казахстанской области»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2012 жылғы 15 наурыздағы № 90 және Оңтүстік Қазақстан облыстық мәслихатының 2012 жылғы 24 ақпандағы № 2/16-V «Оңтүстік Қазақстан облысы бойынша жер учаскелері жеке меншікке берілген кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы» бірлескен қаулысы мен шешіміне өзгерістер енгізу туралы

act_code: '193846'
requisite: Совместное постановление акимата Атбасарского района Акмолинской области от 20 февраля 2024 года № а-2/56 и решение Атбасарского районного маслихата Акмолинской области от 20 февраля 2024 года № 8С 12/2. Зарегистрировано Департаментом юстиции Акмолинской области 28 февраля 2024 года № 8699-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Атбасарском районе
  kaz: Атбасар ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

act_code: '65739'
requisite: Постановление акимата Алматинской области от 3 мая 2012 года № 114 и решение маслихата Алматинской области от 3 мая 2012 года № 4-23. Зарегистрировано Департаментом юстиции Алматинской области 21 мая 2012 года за № 2092. Утратило силу решением Алматинского областного маслихата от 31 июля 2019 года № 51-259 и постановлением акимата Алматинской области от 6 августа 2019 года № 333
title:
  rus: Об установлении базовых ставок платы за земельные участки при их предоставлении в частную собственность в областном центре, городах областного и районного значения, поселках и сельских населенных пунктах Алматинской области
  kaz: Алматы облысының орталығында, облыстық және аудандық маңызы бар қалаларда, кенттер мен ауылдық елді мекендерде жер учаскелерi жеке меншiкке берiлген кезде олар үшiн төлемақының базалық ставкаларын бекiту туралы

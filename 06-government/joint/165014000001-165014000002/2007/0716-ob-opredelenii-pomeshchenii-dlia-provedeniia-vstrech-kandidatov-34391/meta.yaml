act_code: '34391'
requisite: Совместное постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 16 июля 2007 года № 127 и решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 17 июля 2007 года № 37-8. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 25 июля 2007 года № 13-5-42. Утратило силу совместным постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 10 октября 2024 года № 269 и решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 10 октября 2024 года № 21-27 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении помещении для проведения встреч кандидатов политических партий по выборам депутатов Мажилиса Парламента Республики Казахстан, избираемых по партийным спискам, кандидатов в депутаты областного и районного маслихатов с избирателями
  kaz: Қазақстан Республикасы Парламенті Мәжілісіне, партиялық тізім бойынша сайланатын, депутаттар сайлау жөнінде саяси партиялардың, облыстық және аудандық мәслихаттарға депутаттыққа кандидаттардың сайлаушылармен кездесулер өткізу үшін орындар белгілеу туралы

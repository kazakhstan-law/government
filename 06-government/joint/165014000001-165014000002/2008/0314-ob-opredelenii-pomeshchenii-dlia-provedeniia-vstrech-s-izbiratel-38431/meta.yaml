requisite: Совместное постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 14 марта 2008 года № 47 и решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 19 марта 2008 года № 5-8. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 26 марта 2008 года № 13-5-58. Утратило силу совместным постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 10 октября 2024 года № 269 и решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 10 октября 2024 года № 21-27 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

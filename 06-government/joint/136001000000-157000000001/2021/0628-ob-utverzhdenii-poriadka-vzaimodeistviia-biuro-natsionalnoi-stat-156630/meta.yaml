act_code: '156630'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 136 и Постановление акимата Восточно-Казахстанской области от 18 июня 2021 года № 209
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с Восточно-Казахстанским областным акиматом при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях Восточно-Казахстанского областного акимата
  kaz: Шығыс Қазақстан облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Шығыс Қазақстан облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

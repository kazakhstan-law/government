  title:
    rus: О внесении изменений и дополнения в постановление акимата Кызылординской области от 27 августа 2003 года № 600 решение Кызылординского областного маслихата от 27 августа 2003 года № 226 "О предельных (максимальных) размерах земельных участков, которые могут находиться в частной собственности, минимальных размерах земельных участков сельскохозяйственного назначения на орошаемых землях"
    kaz: '"Жер учаскелерінің жеке меншікте болуы мүмкін шекті (ең жоғары) мөлшері, суармалы жерлердегі ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшері туралы" Қызылорда облысы әкімдігінің 2003 жылғы 27 тамыздағы № 600 қаулысына және Қызылорда облыстық мәслихатының 2003 жылғы 27 тамыздағы № 226 шешіміне өзгерістер мен толықтыру енгізу туралы'

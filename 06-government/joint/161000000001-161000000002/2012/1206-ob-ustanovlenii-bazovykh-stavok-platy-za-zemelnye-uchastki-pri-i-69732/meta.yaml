  title:
    rus: О внесении изменения в совместные постановление акимата Кызылординской области от 6 декабря 2012 года № 667 и решение Кызылординского областного маслихата от 6 декабря 2012 года № 65 «Об установлении базовых ставок платы за земельные участки при их предоставлении в частную собственность в городах районного значения, поселках и сельских населенных пунктах Кызылординской области»
    kaz: «Қызылорда облысының аудандық маңызы бар қалаларда, кенттер мен ауылдық елді мекендерде жер учаскелері жеке меншікке берілген кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы» бірлескен Қызылорда облысы әкімдігінің 2012 жылғы 6 желтоқсандағы № 667 қаулысына және Қызылорда облыстық мәслихатының 2012 жылғы 6 желтоқсандағы № 65 шешіміне өзгеріс енгізу туралы

act_code: '156634'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 29 июня 2021 года № 145 и Постановление акимата Западно-Казахстанской области от 22 июня 2021 года № 111
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Западно-Казахстанской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Западно-Казахстанской области
  kaz: Батыс Қазақстан облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Батыс Қазақстан облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

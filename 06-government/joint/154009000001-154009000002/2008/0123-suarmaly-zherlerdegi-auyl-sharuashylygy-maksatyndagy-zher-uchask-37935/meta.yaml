requisite: Алматы облысы Қаратал аудандық мәслихатының 2008 жылғы 23 қаңтардағы № 4-26 шешімі және Алматы облысы Қаратал ауданы әкімдігінің 2008 жылғы 23 қаңтардағы № 16 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының әділет басқармасында 2008 жылы 20 ақпанда № 2-12-68 тіркелді. Күші жойылды - Алматы облысы Қаратал аудандық мәслихатының 2009 жылғы 16 қарашадағы № 29-137 шешімімен

  title:
    rus: О внесении изменений в некоторые нормативные правовые акты по вопросам административно - территориального устройства Актюбинской области и признании утратившими силу некоторых постановлений акимата и решений маслихата Актюбинской области
    kaz: Ақтөбе облысының әкімшілік-аумақтық құрылысы мәселелері бойынша кейбір нормативтік құқықтық актілерге өзгерістер енгізу және Ақтөбе облысы әкімдігінің кейбір қаулыларының және мәслихатының шешімдерінің күші жойылды деп тану туралы

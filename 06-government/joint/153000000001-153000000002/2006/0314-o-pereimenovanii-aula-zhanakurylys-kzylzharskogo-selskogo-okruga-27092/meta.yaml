requisite: Совместное решение Актюбинского областного маслихата от 14 марта 2006 года № 242 и постановление Акимата Актюбинской области от 14 марта 2006 года № 89. Зарегистрировано Департаментом юстиции Актюбинской области от 10 апреля 2006 года N 3178. Заголовок с изменениями, внесенные постановлением акимата Актюбинской области от 11 декабря 2015 года № 452 и решением Актюбинского областного маслихата от 11 декабря 2015 года № 359
title:
  rus: О переименовании аула Жанакурылыс Кзылжарского сельского округа в село Жаныс би, села Коминтерн Аманкульского сельского округа в село Кутикул, населенный пункт Кзылпартизан Иргизского сельского округа Иргизского района в село Акши
  kaz: Ырғыз ауданының, Қызылжар ауылдық округінің Жаңақұрылыс ауылын Жаныс би ауылы, Аманкөл ауылдық округі Коминтерн ауылын - Құтикөл ауылы, Ырғыз ауылдық округінің Қызылпартизан елді мекенін - Ақши ауылы деп қайта атау туралы

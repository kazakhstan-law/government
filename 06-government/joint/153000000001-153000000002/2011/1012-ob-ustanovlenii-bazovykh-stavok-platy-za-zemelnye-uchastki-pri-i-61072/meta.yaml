  title:
    rus: О внесении изменений и дополнений в совместное постановление акимата Актюбинской области от 12 октября 2011 года № 328 и решение Актюбинского областного маслихата от 12 октября 2011 года № 415 «Об установлении базовых ставок платы за земельные участки при их предоставлении в частную собственность по Актюбинской области»
    kaz: «Ақтөбе облысы бойынша жер учаскелері жеке меншікке берілген кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы» Ақтөбе облысы әкімдігінің 2011 жылғы 12 қазандағы № 328 және Ақтөбе облыстық мәслихатының 2011 жылғы 12 қазандағы № 415 бірлескен қаулысына және шешіміне өзгерістер мен толықтырулар енгізу туралы

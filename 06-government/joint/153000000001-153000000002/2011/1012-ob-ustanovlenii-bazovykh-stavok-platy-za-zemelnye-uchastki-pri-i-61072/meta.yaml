    kaz: Ақтөбе облысы әкімдігінің 2011 жылғы 12 қазандағы № 328 және Ақтөбе облыстық мәслихатының 2011 жылғы 12 қазандағы № 415 «Ақтөбе облысы бойынша жер учаскелері жеке меншікке берілген кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы» бірлескен қаулысына және шешіміне өзгеріс пен толықтыру енгізу туралы

requisite: Бірлескен Оңтүстік Қазақстан облысы Ордабасы аудандық мәслихатының 2009 жылғы 27 сәуірдегі N 17/6 шешімі және Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2009 жылғы 20 сәуірдегі N 203 қаулысы. Оңтүстік Қазақстан облысы Ордабасы ауданының Әділет басқармасында 2009 жылғы 21 мамырда N 14-8-68 тіркелді

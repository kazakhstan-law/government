  title:
    rus: О внесении изменения в совместное постановление акимата Бурлинского района Западно-Казахстанской области от 15 мая 2025 года № 175 и решение Бурлинского районного маслихата Западно-Казахстанской области от 15 мая 2025 года № 27-18 «О льготном проезде отдельных категорий пассажиров Бурлинского района для проезда на внутригородском общественном транспорте (кроме такси)»
    kaz: Батыс Қазақстан облысы Бөрлі ауданы әкімдігінің 2025 жылғы 15 мамырдағы № 175 және Батыс Қазақстан облысы Бөрлі аудандық мәслихатының 2025 жылғы 15 мамырдағы № 27-18 «Бөрлі ауданы жолаушыларының жекелеген санаттарының қала ішіндегі қоғамдық көлікте (таксиден басқа) жеңілдікпен жол жүруі туралы» бірлескен қаулысы мен шешіміне өзгеріс енгізу туралы

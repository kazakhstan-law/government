requisite: Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2009 жылғы 11 маусымдағы № 12-5 шешімі және Батыс Қазақстан облысы Бөрлі ауданы әкімдігінің 2009 жылғы 9 маусымдағы № 445 қаулысы. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2009 жылғы 22 маусымда № 7-3-80 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі аудандық мәслихатының 2009 жылғы 30 қарашадағы № 15-3 шешімі және Батыс Қазақстан облысы Бөрлі ауданы әкімдігінің 2009 жылғы 29 қазандағы № 955 қаулысымен

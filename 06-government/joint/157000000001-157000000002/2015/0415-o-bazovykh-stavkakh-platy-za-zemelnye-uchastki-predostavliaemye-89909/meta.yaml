act_code: '89909'
requisite: Постановление Восточно-Казахстанского областного акимата от 15 апреля 2015 года № 88, решение Восточно-Казахстанского областного маслихата от 17 апреля 2015 года № 27/336-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 мая 2015 года N 3957. Утратило силу совместным постановлением Восточно-Казахстанского областного акимата от 18 мая 2023 года № 104 и решением Восточно-Казахстанского областного маслихата от 31 мая 2023 года № 3/30-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О базовых ставках платы за земельные участки, предоставляемые в частную собственность в областном центре, городах областного и районного значения, поселках и сельских населенных пунктах области
  kaz: Облыс орталығында, облыстық және аудандық маңызы бар қалаларда, облыс кенттері мен ауылдық елді мекендерінде жеке меншікке берілетін жер учаскелері үшін төлемақының базалық ставкалары туралы

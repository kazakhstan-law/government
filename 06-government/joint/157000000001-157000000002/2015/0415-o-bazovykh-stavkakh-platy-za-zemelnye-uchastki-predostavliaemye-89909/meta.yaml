  title:
    rus: О внесении изменения в решение Восточно-Казахстанского областного маслихата от 17 апреля 2015 года № 27/336-V и постановление Восточно-Казахстанского областного акимата от 15 апреля 2015 года № 88 «О базовых ставках платы за земельные участки, предоставляемые в частную собственность в областном центре, городах областного и районного значения, поселках и сельских населенных пунктах области»
    kaz: «Облыс орталығында, облыстық және аудандық маңызы бар қалаларда, облыс кенттері мен ауылдық елді мекендерінде жеке меншікке берілетін жер учаскелері үшін төлемақының базалық ставкалары туралы» Шығыс Қазақстан облыстық мәслихатының 2015 жылғы 17 сәуірдегі № 27/336-V шешіміне және Шығыс Қазақстан облысы әкімдігінің 2015 жылғы 15 сәуірдегі № 88 қаулысына өзгеріс енгізу туралы

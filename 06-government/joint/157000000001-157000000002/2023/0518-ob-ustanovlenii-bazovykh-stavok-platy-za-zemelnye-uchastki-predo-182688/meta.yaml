  code: '209235'
  requisite: Совместные постановление Восточно-Казахстанского областного акимата от 3 апреля 2025 года № 78 и решение Восточно-Казахстанского областного маслихата от 9 апреля 2025 года № 20/161-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 апреля 2025 года № 9180-16
  title:
    rus: О внесении изменения в совместное постановление Восточно-Казахстанского областного акимата от 18 мая 2023 года № 104 и решение Восточно-Казахстанского областного маслихата от 31 мая 2023 года № 3/30-VIII «Об установлении базовых ставок платы за земельные участки, предоставляемые в частную собственность в областном центре, городах областного и районного значения, поселках и сельских населенных пунктах Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысының облыс орталығында, облыстық және аудандық маңызы бар қалаларында, облыс кенттері мен ауылдық елді мекендерінде жеке меншікке берілетін жер учаскелері үшін төлемақының базалық ставкаларын белгілеу туралы» бірлескен Шығыс Қазақстан облысы әкімдігінің 2023 жылғы 18 мамырдағы № 104 қаулысы мен Шығыс Қазақстан облыстық мәслихатының 2023 жылғы 31 мамырдағы № 3/30-VIII шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209235/rus

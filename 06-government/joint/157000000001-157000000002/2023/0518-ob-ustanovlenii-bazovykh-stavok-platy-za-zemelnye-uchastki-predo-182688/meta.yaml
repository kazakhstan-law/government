act_code: '182688'
requisite: Совместные постановление Восточно-Казахстанского областного акимата от 18 мая 2023 года № 104 и решение Восточно-Казахстанского областного маслихата от 31 мая 2023 года № 3/30-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 июня 2023 года № 8863-16
title:
  rus: Об установлении базовых ставок платы за земельные участки, предоставляемые в частную собственность в областном центре, городах областного и районного значения, поселках и сельских населенных пунктах Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысының облыс орталығында, облыстық және  аудандық маңызы бар қалаларында, облыс кенттері мен ауылдық елді мекендерінде жеке меншікке берілетін жер учаскелері үшін төлемақының базалық ставкаларын белгілеу туралы

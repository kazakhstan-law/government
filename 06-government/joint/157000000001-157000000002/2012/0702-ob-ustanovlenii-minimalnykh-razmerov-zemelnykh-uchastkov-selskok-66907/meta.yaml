title:
  rus: Об установлении минимальных размеров земельных участков сельскохозяйственного назначения в зависимости от местных условий и особенностей использования указанных земель, предоставляемых в собственность или землепользование в Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысында жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерлерін белгілеу туралы

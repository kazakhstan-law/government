  title:
    rus: О внесении дополнений в совместное постановление Восточно-Казахстанского областного акимата от 2 июля 2012 года № 153 и решение Восточно-Казахстанского областного маслихата от 3 июля 2012 года № 4/65-V «Об установлении минимальных размеров земельных участков сельскохозяйственного назначения в зависимости от местных условий и особенностей использования указанных земель, предоставляемых в собственность или землепользование в Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысында жергілікті жағдайларға және көрсетілген жерді пайдалану ерекшеліктеріне байланысты меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерлерін белгілеу туралы» бірлескен Шығыс Қазақстан облысы әкімдігінің 2012 жылғы 2 шілдедегі № 153 қаулысы мен Шығыс Қазақстан облыстық мәслихатының 2012 жылғы 3 шілдедегі № 4/65-V шешіміне толықтырулар енгізу туралы

  title:
    rus: О внесении изменений в совместное постановление Восточно-Казахстанского областного акимата от 2 июля 2012 года № 153 и решение Восточно-Казахстанского областного маслихата от 3 июля 2012 года № 4/65-V «Об установлении минимальных размеров земельных участков сельскохозяйственного назначения, предоставляемых в собственность или землепользование»
    kaz: «Меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерлерін белгілеу туралы» Шығыс Қазақстан облысы әкімдігінің 2012 жылғы 2 шілдедегі № 153 бірлескен қаулысына және Шығыс Қазақстан облыстық мәслихатының 2012 жылғы 3 шілдедегі № 4/65-V шешіміне өзгерістер енгізу туралы

requisite: Совместное постановление акимата города Жезказгана Карагандинской области от 3 октября 2016 года № 28/36 и решение Жезказганского городского маслихата Карагандинской области от 13 октября 2016 года № 5/57. Зарегистрировано Департаментом юстиции Карагандинской области 31 октября 2016 года № 4021. Утратило силу совместным постановлением акимата города Жезказган Карагандинской области от 7 июня 2019 года № 19/02 и решением Жезказганского городского маслихата Карагандинской области от 11 июня 2019 года № 36/319 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О льготном проезде отдельных категорий граждан города Жезказган для проезда на внутригородском общественном транспорте (кроме такси)

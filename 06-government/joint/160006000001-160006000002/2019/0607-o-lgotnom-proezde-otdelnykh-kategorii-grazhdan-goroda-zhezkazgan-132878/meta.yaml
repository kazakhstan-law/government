requisite: Совместное постановление акимата города Жезказган Карагандинской области от 7 июня 2019 года № 19/02 и решение Жезказганского городского маслихата Карагандинской области от 11 июня 2019 года № 36/319. Зарегистрировано Департаментом юстиции Карагандинской области 21 июня 2019 года № 5394. Утратило силу совместным постановлением акимата города Жезказган области Ұлытау от 6 марта 2024 года № 11/01 и решением Жезказганского городского маслихата области Ұлытау от 6 марта 2024 года № 16/93 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О льготном проезде отдельных категорий граждан города Жезказган на общественном пассажирском транспорте (кроме такси)

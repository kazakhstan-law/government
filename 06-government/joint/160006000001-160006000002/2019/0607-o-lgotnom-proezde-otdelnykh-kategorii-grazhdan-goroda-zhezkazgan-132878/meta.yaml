  requisite: Совместные постановление акимата города Жезказган Карагандинской области от 19 февраля 2021 года № 07/01 и решение Жезказганского городского маслихата Карагандинской области от 19 февраля 2021 года № 2/19. Зарегистрировано Департаментом юстиции Карагандинской области 1 марта 2021 года № 6221. Утратило силу совместным постановлением акимата города Жезказган области Ұлытау от 6 марта 2024 года № 11/01 и решением Жезказганского городского маслихата области Ұлытау от 6 марта 2024 года № 16/93 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в совместное постановление акимата города Жезказган от 7 июня 2019 года № 19/02 и решение Жезказганского городского маслихата от 11 июня 2019 года № 36/319 «О льготном проезде отдельных категорий граждан города Жезказган на общественном пассажирском транспорте (кроме такси)»
    kaz: «Жезқазған қаласының жекеленген санаттағы азаматтарының қоғамдық жолаушылар көлігінде (таксиден басқа) жеңілдікпен жол жүруі туралы» Жезқазған қаласының әкімдігінің 2019 жылғы 7 маусымдағы № 19/02 бірлескен қаулысы және Жезқазған қалалық мәслихатының 2019 жылғы 11 маусымдағы № 36/319 шешіміне өзгеріс енгізу туралы

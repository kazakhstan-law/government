  title:
    rus: О внесении изменений в совместное постановление акимата города Актобе Актюбинской области от 1 сентября 2021 года № 4595 и решение маслихата города Актобе Актюбинской области от 31 августа 2021 года № 78 «Об установлении льготного проезда на регулярном городском общественном транспорте (кроме такси) отдельным категориям граждан города Актобе»
    kaz: Ақтөбе облысы Ақтөбе қаласы әкімдігінің 2021 жылғы 1 қыркүйектегі № 4595 және Ақтөбе облысы Ақтөбе қалалық мәслихатының 2021 жылғы 31 тамыздағы № 78 «Ақтөбе қаласы азаматтарының жекелеген санаттарына тұрақты қалалық қоғамдық көлікте (таксиден басқа) жолақы жеңілдігін белгілеу туралы» бірлескен қаулысы және шешіміне өзгерістер енгізу туралы

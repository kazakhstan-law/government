requisite: Постановление акимата города Актобе Актюбинской области от 1 сентября 2021 года № 4595 и решение маслихата города Актобе Актюбинской области от 31 августа 2021 года № 78. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 сентября 2021 года № 24355. Утратило силу постановлением акимата города Актобе Актюбинской области от 3 апреля 2024 года № 1806 и решением маслихата города Актобе Актюбинской области от 3 апреля 2024 года № 154

act_code: '156629'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 135 и Постановление акимата Актюбинской области от 17 июня 2021 года № 201
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Актюбинской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Актюбинской области
  kaz: Ақтөбе облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Ақтөбе облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

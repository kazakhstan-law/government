act_code: '202554'
requisite: Совместные постановление акимата Урджарского района области Абай от 26 сентября 2024 года № 229 и решение Урджарского районного маслихата области Абай от 4 ноября 2024 года № 19-363/VIII. Зарегистрировано Департаментом юстиции области Абай 12 ноября 2024 года № 368-18
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в зависимости от местных условий и особенностей по Урджарскому району области Абай
  kaz: Абай облысы Үржар ауданы бойынша шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін жергілікті жағдайлар мен ерекшеліктерге қарай айқындау туралы

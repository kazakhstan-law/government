act_code: '156642'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 142 и Постановление акимата Павлодарской области от 21 июня 2021 года № 4-03/9
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Павлодарской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Павлодарской области
  kaz: Павлодар облысы әкімдігінің мекемелері мен ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Павлодар облысының әкімдігімен өзара іс-қимыл тәртібін бекіту туралы

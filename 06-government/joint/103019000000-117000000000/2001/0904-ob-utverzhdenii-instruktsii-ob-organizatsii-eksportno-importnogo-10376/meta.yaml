  code: '18580'
  requisite: 'Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2003 года N 484 и приказ Председателя Агентства таможенного контроля Республики Казахстан от 9 января 2004 года N 3. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 февраля 2004 года за N 2696. Примечание РЦПИ: постановление утрачивает силу постановлением Правления Национального Банка Республики Казахстан от 17 августа 2006 года N 86 (порядок введения в действие см. п. 5)'
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 5 сентября 2001 года N 343 "Об утверждении Инструкции об организации экспортно-импортного валютного контроля в Республике Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1669 и "О внесении изменений и дополнений в приказ Министра государственных доходов Республики Казахстан от 10 октября 2001 года N 1409 "Об утверждении Инструкции об организации экспортно-импортного валютного контроля в Республике Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан под N 1669
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1669 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасында экспорт-импорт валюта бақылауын ұйымдастыру туралы нұсқаулықты бекіту туралы" 2001 жылғы 5 қыркүйектегі N 343 қаулысына және Қазақстан Республикасының Әділет министрлігінде N 1669 тіркелген, Қазақстан Республикасының Мемлекеттік Кірістер Министрінің "Қазақстан Республикасында экспорт-импорт валюта бақылауын ұйымдастыру туралы нұсқаулықты бекіту туралы" 2001 жылғы 10 қазандағы N 1409 бұйрығына өзгерістер мен толықтырулар енгізу туралы

    kaz: '"Қазақстан Республикасында экспорттық-импорттық валюталық бақылауды ұйымдастыру жөнiнде нұсқаулықты бекiту туралы" Қазақстан Республикасы Мемлекеттiк кiрiс министрлiгiнiң 2001 жылғы 10 қазандағы N 1409 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы"'

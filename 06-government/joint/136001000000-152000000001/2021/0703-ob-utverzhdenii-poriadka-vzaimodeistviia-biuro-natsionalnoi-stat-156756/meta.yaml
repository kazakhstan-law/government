act_code: '156756'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 3 июля 2021 года № 154 и Постановление акимата Акмолинской области от 24 июня 2021 года № А-6/322
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с акиматом Акмолинской области при проведении национальной переписи населения Республики Казахстан в 2021 году в учреждениях и организациях акимата Акмолинской области
  kaz: Ақмола облысы әкімдігінің мекемелерінде және ұйымдарында 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Ақмола облысының әкімдігімен өзара іс-қимыл тәртібі

requisite: Алматы облысы Ескелді аудандық мәслихатының 2008 жылғы 27 мамырдағы № 13-79 шешімі және Ескелді ауданы әкімдігінің 2008 жылғы 27 мамырдағы № 230 қаулысы. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2008 жылы 25 маусымда № 2-9-60 тіркелді

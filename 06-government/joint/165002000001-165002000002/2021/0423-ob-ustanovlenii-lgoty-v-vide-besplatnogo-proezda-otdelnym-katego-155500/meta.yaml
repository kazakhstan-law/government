  requisite: Совместное постановление акимата города Петропавловска Северо-Казахстанской области от 30 мая 2023 года № 695 и решение маслихата города Петропавловска Северо-Казахстанской области от 30 мая 2023 года № 4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 июня 2023 года № 7523-15
  title:
    rus: О внесении изменений в совместные постановление акимата города Петропавловска Северо-Казахстанской области от 23 апреля 2021 года № 631 и решение маслихата города Петропавловска Северо-Казахстанской области от 23 апреля 2021 года № 1 «Об установлении льготы в виде бесплатного проезда отдельным категориям граждан города Петропавловск на общественном транспорте (кроме такси) в городе Петропавловск»
    kaz: Солтүстік Қазақстан облысы Петропавл қаласы әкімдігінің 2021 жылғы 23 сәуірдегі № 631 қаулысына және «Петропавл қаласында қоғамдық көлікте (таксиден басқа) Петропавл қаласы азаматтарының жекелеген санаттарына тегін жол жүру түріндегі жеңілдікті белгілеу туралы» Солтүстік Қазақстан облысы Петропавл қаласы мәслихатының 2021 жылғы 23 сәуірдегі № 1  бірлескен шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/182522/rus

title:
  rus: Об установлении льготы в виде бесплатного проезда отдельным категориям граждан города Петропавловск на общественном транспорте(кроме такси) в городе Петропавловск
  kaz: Петропавл қаласы азаматтарының жекелеген санаттарына Петропавл қаласында қоғамдық көлікте (таксиден басқа) тегін жол жүру түріндегі жеңілдіктер белгілеу туралы

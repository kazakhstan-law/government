  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 7 декабря 2012 года № А-13/598 и решение Акмолинского областного маслихата от 7 декабря 2012 года № 5С-8-6 «Об установлении минимальных размеров земельных участков сельскохозяйственного назначения, предоставляемых в собственность или землепользование в Акмолинской области»
    kaz: «Ақмола облысындағы меншікке немесе жер пайдалануға берілетін ауыл шаруашылығы мақсатындағы жер учаскелерінің ең аз мөлшерін белгілеу туралы» Ақмола облысы әкімдігінің 2012 жылғы 7 желтоқсандағы № А-13/598 қаулысына және Ақмола облыстық мәслихатының 2012 жылғы 7 желтоқсандағы № 5С-8-6 шешіміне өзгеріс енгізу туралы

act_code: '40224'
requisite: Решение Акмолинского областного маслихата от 20 июня 2008 года № 4С-7-16 и постановление акимата Акмолинской области от 20 июня 2008 года № а-5/245. Зарегистрировано Департаментом юстиции Акмолинской области 26 июня 2008 года № 3253
title:
  rus: О переименовании некоторых населенных пунктов и сельских округов Акмолинской области по Ерейментаускому, Аршалынскому, Шортандынскому и Щучинскому районам
  kaz: Ерейментау, Аршалы, Шортанды және Щучье аудандары бойынша Ақмола облысының кейбір елді мекендері мен ауылдық округтерінің атауларын өзгерту туралы

  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 5 декабря 2007 года № А-13/399 и решение Акмолинского областного маслихата от 5 декабря 2007 года № 4С-3-7 «О переименовании некоторых населенных пунктов Акмолинской области по Зерендинскому и Аршалынскому районам»
    kaz: «Зеренді және Аршалы аудандары бойынша Ақмола облысының кейбір елді мекендерінің атауларын өзгерту туралы» Ақмола облысы әкімдігінің 2007 жылғы 5 желтоқсандағы № А-13/399 қаулысына және Ақмола облыстық мәслихатының 2007 жылғы 5 желтоқсандағы № 4С-3-7 шешіміне өзгеріс енгізу туралы

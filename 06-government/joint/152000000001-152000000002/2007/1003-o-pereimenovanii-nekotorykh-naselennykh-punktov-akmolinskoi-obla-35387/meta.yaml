    kaz: «Ақкөл, Ерейментау, Аршалы, Еңбекшілдер, Целиноград аудандары бойынша Ақмола облысының кейбір елді мекендерінің атауларын өзгерту туралы» Ақмола облысы әкімдігінің 2007 жылғы 3 қазандағы № А-10/325 қаулысы мен Ақмола облыстық мәслихатының 2007 жылғы 3 қазандағы № 4С-2-9 шешіміне өзгерістер енгізу туралы

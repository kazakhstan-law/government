  title:
    rus: О внесении изменений в постановление акимата Акмолинской области от 21 октября 2015 года № А-10/480 и решение Акмолинского областного маслихата от 21 октября 2015 года № 5С-42-3 «Об установлении базовых ставок платы за земельные участки при их предоставлении в частную собственность на территории населенных пунктов Акмолинской области»
    kaz: «Ақмола облысының елді мекендер аумағында жер учаскелері жеке меншікке беру кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы» Ақмола облысы әкiмдiгiнiң 2015 жылғы 21 қазандағы № А-10/480 қаулысына және Ақмола облыстық мәслихатының 2015 жылғы 21 қазандағы № 5С-42-3 шешіміне өзгерістер енгізу туралы

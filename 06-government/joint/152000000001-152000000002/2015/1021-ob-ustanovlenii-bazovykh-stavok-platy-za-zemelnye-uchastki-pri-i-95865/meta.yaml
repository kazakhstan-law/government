    kaz: «Ақмола облысының елді мекендер аумағында жер учаскелері жеке меншікке беру кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы» бірлескен Ақмола облысы әкiмдiгiнiң 2015 жылғы 21 қазандағы № А-10/480 қаулысына және Ақмола облыстық мәслихатының 2015 жылғы 21 қазандағы № 5С-42-3 шешіміне өзгеріс енгізу туралы

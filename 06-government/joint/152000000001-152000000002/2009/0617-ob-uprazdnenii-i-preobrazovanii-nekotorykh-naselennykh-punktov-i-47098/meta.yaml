  title:
    rus: О внесении изменений в некоторые совместные решения акима Акмолинской области и Акмолинского областного маслихата, постановления акимата Акмолинской области и решения Акмолинского областного маслихата об изменениях в административно-территориальном устройстве Акмолинской области
    kaz: Ақмола облысының әкімшілік-аумақтық құрылысындағы өзгерістер туралы Ақмола облысы әкімінің және Ақмола облыстық мәслихатының кейбір бірлескен шешімдеріне, Ақмола облысы әкімдігінің қаулылары мен Ақмола облыстық мәслихатының шешімдеріне өзгерістер енгізу туралы

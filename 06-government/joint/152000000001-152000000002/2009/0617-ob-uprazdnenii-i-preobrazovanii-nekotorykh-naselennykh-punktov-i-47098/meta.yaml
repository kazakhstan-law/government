act_code: '47098'
requisite: Постановление акимата Акмолинской области от 17 июня 2009 года № а-7/264 и решение Акмолинского областного маслихата от 17 июня 2009 года № 4С-15-9. Зарегистрировано Департаментом юстиции Акмолинской области 24 июля 2009 года № 3327
title:
  rus: Об упразднении и преобразовании некоторых населенных пунктов и сельских округов Акмолинской области по Атбасарскому, Астраханскому и Енбекшильдерскому районам
  kaz: Ақмола облысының Атбасар, Астрахан және Еңбекшілдер аудандары бойынша кейбір елді мекендер мен ауылдық округтерді таратып, қайта құру туралы

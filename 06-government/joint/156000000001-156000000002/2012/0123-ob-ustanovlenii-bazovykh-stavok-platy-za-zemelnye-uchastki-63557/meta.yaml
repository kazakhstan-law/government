  title:
    rus: О внесений изменения в совместное постановление акимата Атырауской области от 23 января 2012 года № 10а и решение Атырауского областного маслихата от 25 января 2012 года № 11-V «Об установлении базовых ставок платы за земельные участки, за исключением земельных участков сельскохозяйственного назначения при их предоставлении в частную собственность»
    kaz: «Ауыл шаруашылығы мақсатындағы жер учаскелерді қоспағанда, жер учаскелері жеке меншiкке берілген кезде олар үшін төлемақының базалық ставкаларын белгілеу туралы» бірлескен Атырау облысы әкімдігінің 2012 жылғы 23 қаңтардағы № 10а қаулысы мен Атырау облыстық мәслихатының 2012 жылғы 25 қаңтардағы № 11-V шешіміне өзгеріс енгізу туралы

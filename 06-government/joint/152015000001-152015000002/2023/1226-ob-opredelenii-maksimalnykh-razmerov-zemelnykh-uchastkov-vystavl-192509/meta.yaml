act_code: '192509'
requisite: Совместное постановление акимата Зерендинского района Акмолинской области от 26 декабря 2023 года № А-12/725 и решение Зерендинского районного маслихата Акмолинской области от 26 декабря 2023 года № 13-92. Зарегистрировано Департаментом юстиции Акмолинской области 9 января 2024 года № 8683-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Зерендинском районе
  kaz: Зеренді ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

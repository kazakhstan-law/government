requisite: Совместные постановление акимата Ерейментауского района Акмолинской области от 26 января 2026 года № а-1/15 и решение Ерейментауского районного маслихата Акмолинской области от 26 января 2026 года № 8С-50/4-26
title:
  rus: «Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Ерейментауском районе»
  kaz: Ерейментау ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

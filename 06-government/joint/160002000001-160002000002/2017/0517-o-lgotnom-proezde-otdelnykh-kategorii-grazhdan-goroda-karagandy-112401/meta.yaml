    kaz: '"Қарағанды қаласы азаматтарының жекелеген санаттарының қала ішіндегі қоғамдық көлікте (таксиден басқа) жеңілдікпен жол жүруі туралы" Қарағанды қаласы әкімдігінің 2017 жылғы 17 мамырдағы № 19/15 және Қарағанды қалалық мәслихатының 2017 жылғы 10 мамырдағы № 149 бірлескен қаулысы және шешіміне толықтыру енгізу туралы'

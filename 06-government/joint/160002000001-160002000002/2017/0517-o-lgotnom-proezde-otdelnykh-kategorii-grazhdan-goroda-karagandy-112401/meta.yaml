  title:
    rus: О внесении изменений в совместное постановление акимата города Караганды от 17 мая 2017 года № 19/15 и решение Карагандинского городского маслихата от 10 мая 2017 года № 149 «О льготном проезде отдельных категорий граждан города Караганды для проезда на внутригородском общественном транспорте (кроме такси)»
    kaz: «Қарағанды қаласы азаматтарының жекелеген санаттарының қала ішіндегі қоғамдық көлікте (таксиден басқа) жеңілдікпен жол жүруі туралы» Қарағанды қаласы әкімдігінің 2017 жылғы 17 мамырдағы № 19/15 және Қарағанды қалалық мәслихатының 2017 жылғы 10 мамырдағы № 149 бірлескен қаулысы және шешіміне өзгерістер енгізу туралы

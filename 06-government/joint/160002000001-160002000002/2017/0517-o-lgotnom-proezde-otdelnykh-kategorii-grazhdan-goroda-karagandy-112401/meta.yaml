  requisite: Совместные постановление акимата города Караганды от 29 июня 2022 года № 31/02 и решение Карагандинского городского маслихата от 29 июня 2022 года № 173. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 июля 2022 года № 28743
  title:
    rus: О внесении изменений и дополнений в совместные постановление акимата города Караганды от 17 мая 2017 года № 19/15 и решение Карагандинского городского маслихата от 10 мая 2017 года № 149 «О льготном проезде отдельных категорий граждан города Караганды для проезда на внутригородском общественном транспорте (кроме такси)»
    kaz: «Қарағанды қаласы азаматтарының жекелеген санаттарының қала ішіндегі қоғамдық көлікте (таксиден басқа) жеңілдікпен жол жүруі туралы» Қарағанды қаласы әкімдігінің 2017 жылғы 17 мамырдағы № 19/15 және Қарағанды қалалық мәслихатының 2017 жылғы 10 мамырдағы № 149 бірлескен қаулысы және шешіміне өзгерістер мен толықтырулар енгізу туралы

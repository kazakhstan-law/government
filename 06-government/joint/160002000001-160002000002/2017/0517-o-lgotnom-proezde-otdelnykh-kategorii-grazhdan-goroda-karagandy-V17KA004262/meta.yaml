  requisite: Совместные постановление акимата города Караганды от 17 марта 2021 года № 19/01 и решение Карагандинского городского маслихата от 17 марта 2021 года № 30. Зарегистрировано Департаментом юстиции Карагандинской области 5 апреля 2021 года № 6277
  title:
    rus: О внесении изменения и дополнения в совместное постановление акимата города Караганды от 17 мая 2017 года № 19/15 и решение Карагандинского городского маслихата от 10 мая 2017 года № 149 «О льготном проезде отдельных категорий граждан города Караганды для проезда на внутригородском общественном транспорте (кроме такси)»
    kaz: «Қарағанды қаласы азаматтарының жекелеген санаттарының қала ішіндегі қоғамдық көлікте (таксиден басқа) жеңілдікпен жол жүруі туралы» Қарағанды қаласы әкімдігінің 2017 жылғы 17 мамырдағы № 19/15 және Қарағанды қалалық мәслихатының 2017 жылғы 10 мамырдағы № 49 бірлескен қаулысы және шешіміне өзгеріс пен толықтыру енгізу туралы

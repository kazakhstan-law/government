act_code: '205394'
requisite: Совместное постановление акимата Шортандинского района Акмолинской области от 24 декабря 2024 года № А-4/293 и решение Шортандинского районного маслихата Акмолинской области от 24 декабря 2024 года № 8С-30/3. Зарегистрировано Департаментом юстиции Акмолинской области 26 декабря 2024 года № 8874-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Шортандинском районе
  kaz: Шортанды ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

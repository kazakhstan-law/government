  title:
    rus: О внесении изменений в совместное постановление акимата Шортандинского района от 14 мая 2015 года № А-4/116 и решение Шортандинского районного маслихата от 14 мая 2015 года № С-39/5 «Об установлении границ (черты) села Бозайгыр и станции Тонкерис сельского округа Бозайгыр Шортандинского района»
    kaz: «Шортанды ауданы Бозайғыр ауылдық округінің Бозайғыр ауылы мен Төңкеріс бекетінің шекараларын (шегін) белгілеу туралы» бірлескен Шортанды ауданы әкімдігінің 2015 жылғы 14 мамырдағы № А-4/116 қаулысы мен Шортанды аудандық мәслихатының 2015 жылғы 14 мамырдағы № С-39/5 шешіміне өзгерістер енгізу туралы

act_code: '7602'
requisite: Cовместное постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 30 сентября 2000 года N 83 и Правления Национального Банка Республики Казахстан от 3 ноября 2000 года N 415. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 декабря 2000 года N 1323. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 26.03.2005г. N 77
title:
  rus: О требованиях к банкам второго уровня, совмещающим осуществление кастодиальной и брокерско-дилерской деятельности на рынке ценных бумаг Республики Казахстан
  kaz: Қазақстан Республикасының бағалы қағаздар рыногында кастодиандық және брокерлік-дилерлік қызметті жүзеге асыруды қоса атқаратын екінші деңгейдегі банктерге қойылатын талаптар туралы

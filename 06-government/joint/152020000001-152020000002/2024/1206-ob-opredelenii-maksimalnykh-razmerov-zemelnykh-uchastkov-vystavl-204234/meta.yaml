act_code: '204234'
requisite: Совместные постановление акимата Бурабайского района Акмолинской области от 6 декабря 2024 года № a-12/493 и решение Бурабайского районного маслихата Акмолинской области от 6 декабря 2024 года № 8С-25/1. Зарегистрировано Департаментом юстиции Акмолинской области 17 декабря 2024 года № 8866-03
title:
  rus: Об определении максимальных размеров земельных участков, выставляемых на конкурс по предоставлению права временного возмездного землепользования (аренды) для ведения крестьянского или фермерского хозяйства, сельскохозяйственного производства в Бурабайском районе
  kaz: Бурабай ауданында шаруа немесе фермер қожалығын, ауыл шаруашылығы өндірісін жүргізу үшін уақытша өтеулі жер пайдалану (жалға алу) құқығын беру жөніндегі конкурсқа шығарылатын жер учаскелерінің ең жоғары мөлшерін айқындау туралы

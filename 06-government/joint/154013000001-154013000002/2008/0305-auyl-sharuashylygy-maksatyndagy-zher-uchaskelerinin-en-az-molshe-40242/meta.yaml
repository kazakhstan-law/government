requisite: Алматы облысы Талғар аудандық мәслихатының 2008 жылғы 5 наурыздағы № 8-40 шешімі және Талғар ауданы әкімдігінің 2008 жылғы 5 наурыздағы № 03-387 қаулысы. Алматы облысының Әділет департаменті Талғар ауданының Әділет басқармасында 2008 жылы 18 сәуірде № 2-18-66 тіркелді. Күші жойылды - Алматы облысы Талғар аудандық мәслихатының 2009 жылғы 08 желтоқсандағы № 26-152 шешімі және Талғар ауданы әкімдігінің 2009 жылғы 08 желтоқсандағы № 12-666 қаулысымен

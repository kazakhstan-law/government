title:
  rus: Об утверждении предельных размеров сумм снятия субъектами предпринимательства наличных денег с банковских счетов, а также субъектов предпринимательства, на которые не распространяется требование по снятию наличных денег с банковских счетов
  kaz: Кәсіпкерлік субъектілерінің банктік шоттардан қолма-қол ақшаны алу сомасының шекті мөлшерін, сондай-ақ банктік шоттардан қолма-қол ақшаны алу жөніндегі талап қолданылмайтын кәсіпкерлік субъектілерін бекіту туралы

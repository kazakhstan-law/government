  title:
    rus: О внесении изменений в постановление акимата Тарбагатайского района от 10 октября 2022 года №656 «Об утверждении Правил организации и проведения  мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Тарбагатайскому району»
    kaz: Тарбағатай ауданы әкімдігінің 2022 жылғы 10 қазандағы № 656 «Тарбағатай ауданына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

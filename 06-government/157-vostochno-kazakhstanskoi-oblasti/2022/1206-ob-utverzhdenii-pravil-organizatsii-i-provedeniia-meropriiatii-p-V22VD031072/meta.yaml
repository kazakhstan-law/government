  title:
    rus: О внесении изменения в постановление акимата города Риддера от 6 декабря 2022 года № 1119 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Риддеру»
    kaz: «Риддер қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Риддер қаласы әкімдігінің 2022 жылғы 6 желтоқсандағы № 1119 қаулысына өзгерту енгізу туралы

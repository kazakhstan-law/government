act_code: '166968'
requisite: Постановление акимата Курчумского района Восточно-Казахстанской области от 4 апреля 2022 года № 153. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 апреля 2022 года № 27706
title:
  rus: О признании утратившим силу постановления акимата Курчумского района от 14 мая 2021 года № 250 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации»
  kaz: «Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» Күршім ауданы әкімдігінің 2021 жылғы 14 мамырдағы № 250 қаулысын жою туралы

act_code: '175211'
requisite: Постановление акимата города Риддера Восточно-Казахстанской области от 6 декабря 2022 года № 1119. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 декабря 2022 года № 31072
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Риддеру
  kaz: Риддер қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата города Риддера от 6 декабря 2022 года № 1119 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Риддеру»
    kaz: Риддер қаласы әкімдігінің 2022 жылғы 6 желтоқсан № 1119 «Риддер қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

act_code: '164986'
requisite: Постановление акимата Кокпектинского района Восточно-Казахстанской области от 24 января 2022 года № 11
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2022 год
  kaz: 2022 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

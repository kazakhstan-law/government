act_code: '174331'
requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 24 ноября 2022 года № 394
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, а также лиц, состоящих на учете службы пробации по Шемонаихинскому району на 2023 год
  kaz: Шемонаиха ауданы бойынша 2023 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, сондай-ақ пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квоталарын белгілеу туралы

act_code: '167882'
requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 11 апреля 2022 года № 113. Отменен постановлением Глубоковского районного акимата Восточно-Казахстанской области от 18 июля 2022 года № 273 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Глубоковского района Восточно-Казахстанской области»
  kaz: Шығыс Қазақстан облысы Глубокое ауданының елді мекендеріне бірыңғай сәулеттік келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу Ережесін бекіту туралы

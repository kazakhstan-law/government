  title:
    rus: О внесении изменений в постановление акимата Шемонаихинского района от 26 января 2022 года № 15 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Шемонаихинского района»
    kaz: «Шемонаиха ауданының бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Шемонаиха ауданы әкімдігінің 2022 жылғы 26 қантардағы № 15 қаулысына өзгерістер енгізу туралы

act_code: '164296'
requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 26 января 2022 года № 15. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 февраля 2022 года № 26725
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Шемонаихинскому району
  kaz: Шемонаиха ауданына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Зайсанского района от 28 июля 2022 года № 438 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Зайсанскому району»
    kaz: «Зайсан ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және  жүргізу қағидаларын бекіту туралы» Зайсан ауданы әкімдігінің 2022 жылғы 28 шілдедегі № 438 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Зайсанского района от 28 июля 2022 года №438 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Зайсанскому району»
    kaz: Зайсан ауданы әкімдігінің 2022 жылғы 28 шілдедегі №438 «Зайсан ауданына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

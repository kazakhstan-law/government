  title:
    rus: О внесении изменений в постановление Восточно-Казахстанского областного акимата от 21 июля 2022 года № 166 «Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и норм субсидий на 1 литр (килограмм, грамм, штук), а так же объемов субсидий на удешевление стоимости пестицидов, биоагентов (энтомофагов) на 2022 год»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2022 жылғы 21 шілдедегі № 166 «2022 жылға арналған субсидияланатын пестицидтердің, биоагенттердің (энтомофагтардың) тізбесін және 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормаларын, сондай-ақ пестицидтердің, биоагенттердің (энтомофагтардың) құнын арзандатуға арналған субсидия көлемдерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/173455/rus

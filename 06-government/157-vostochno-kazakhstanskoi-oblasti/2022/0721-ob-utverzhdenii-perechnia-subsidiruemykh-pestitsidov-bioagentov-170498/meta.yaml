title:
  rus: Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и норм субсидий на 1 литр (килограмм, грамм, штук), а так же объемов субсидий на удешевление стоимости пестицидов, биоагентов (энтомофагов) на 2022 год
  kaz: 2022 жылға арналған субсидияланатын пестицидтердің, биоагенттердің (энтомофагтардың) тізбесін және 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормаларын, сондай-ақ пестицидтердің, биоагенттердің (энтомофагтардың) құнын арзандатуға арналған  субсидия көлемдерін бекіту туралы

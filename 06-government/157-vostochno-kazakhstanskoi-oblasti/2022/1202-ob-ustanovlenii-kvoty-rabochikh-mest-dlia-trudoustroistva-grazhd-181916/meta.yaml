  requisite: Постановление акимата района Самар Восточно-Казахстанской области от 21 февраля 2023 года № 41
  title:
    rus: О внесении изменений в постановление акимата района Самар Восточно-Казахстанской области от 2 декабря 2022 года № 37 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц,  освобожденных из мест лишения свободы и лиц, состоящих  на учете службы пробации  на 2023 год»
    kaz: «2023 жылға  арналған ата-анасынан кәмелеттік  жасқа толғанға дейін айырылған  немесе ата-анасының қамқорлығынсыз қалған, білім  беру ұйымдарының түлектері  болып табылатын жастар  қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды және пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу  туралы» Шығыс Қазақстан облысы Самар ауданы әкімдігінің 2022 жылғы 2 желтоқсандағы № 37 қаулысына өзгерістер  мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/182084/rus

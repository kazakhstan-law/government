  title:
    rus: О внесении изменений в постановление Восточно-Казахстанского областного акимата от 12 мая 2022 года № 113 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2022 год»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2022 жылғы 12 мамырдағы № 113 «2022 жылға арналған субсидияланатын тыңайтқыштар (органикалықтарды қоспағанда) түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалықтарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/173353/rus

act_code: '174378'
requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 25 ноября 2022 года № 476
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2023 год
  kaz: Білім беру ұйымдарының түлектері болып табылатын, ата-анасынан айырылған немесе кәмелетке толғанға дейін қамқорлығынсыз қалған жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, 2023 жылға арналған пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

act_code: '175092'
requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 22 ноября 2022 года № 467. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 декабря 2022 года № 31012. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 30 января 2025 года № 40 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Глубоковского района Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы  Глубокое ауданының елді мекендеріне  бірыңғай сәулеттік келбет беруге бағытталған,  көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

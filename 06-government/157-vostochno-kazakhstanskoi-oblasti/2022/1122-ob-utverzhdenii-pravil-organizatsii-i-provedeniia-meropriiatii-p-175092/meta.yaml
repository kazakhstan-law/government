  code: '194315'
  requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 11 марта 2024 года № 140. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 марта 2024 года № 8965-16. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 30 января 2025 года № 40 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Глубоковского района Восточно-Казахстанской области от 22 ноября 2022 года № 467 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Глубоковского района Восточно-Казахстанской области»
    kaz: Шығыс Қазақстан облысы Глубокое ауданы әкімдігінің 2022 жылғы 22 қарашадағы № 467 «Шығыс Қазақстан облысы Глубокое ауданының елді мекендеріне  бірыңғай сәулеттік келбет беруге бағытталған,  көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/194315/rus

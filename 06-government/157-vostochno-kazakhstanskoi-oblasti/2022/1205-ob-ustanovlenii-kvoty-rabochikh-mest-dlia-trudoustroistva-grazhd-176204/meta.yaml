act_code: '176204'
requisite: Постановление акимата Тарбагатайского района Восточно-Казахстанской области от 5 декабря 2022 года № 691
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц освобожденных из мест лишения свободы, лиц состоящих на учете службы пробации на 2023 год
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызмет есебінде тұрған адамдарды жұмысқа орналастыру үшін 2023 жылға арналған жұмыс орындарына квота белгілеу туралы

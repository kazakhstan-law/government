act_code: '169905'
requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 18 июля 2022 года № 273
title:
  rus: Об отмене постановления акимата Глубоковского района Восточно-Казахстанской области от 11 апреля 2022 года № 113 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Глубоковского района Восточно-Казахстанской области»
  kaz: Шығыс Қазақстан облысы Глубокое ауданы әкімдігінің 2022 жылғы 11 сәуірдегі № 113 «Шығыс Қазақстан облысы Глубокое ауданының елді мекендеріне бірыңғай сәулеттік келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу Ережесін бекіту туралы» қаулының күшін жою туралы

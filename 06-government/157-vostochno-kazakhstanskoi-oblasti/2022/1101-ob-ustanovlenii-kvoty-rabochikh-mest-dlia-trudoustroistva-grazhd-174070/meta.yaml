act_code: '174070'
requisite: Постановление акимата Курчумского района Восточно-Казахстанской области от 1 ноября 2022 года № 520
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или ставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускникам организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих  на учете службы пробации на 2023 год
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің  есебінде тұрған адамдарды жұмысқа орналастыру үшін 2023 жылға арналған жұмыс орындарына квота белгілеу туралы

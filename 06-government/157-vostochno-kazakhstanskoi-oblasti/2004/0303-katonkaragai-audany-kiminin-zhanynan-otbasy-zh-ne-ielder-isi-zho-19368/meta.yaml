requisite: Шығыс Қазақстан облысының Катонқарағай аудандық әкімиятының 2004 жылғы 3 наурыздағы № 954 қаулысы. Шығыс Қазақстан облысының Әділет департаментінде 2004 жылғы 13 сәуірде № 1697 тіркелді. Күші жойылды - Катонқарағай ауданы әкімдігінің 2009.04.15 № 4002 қаулысымен

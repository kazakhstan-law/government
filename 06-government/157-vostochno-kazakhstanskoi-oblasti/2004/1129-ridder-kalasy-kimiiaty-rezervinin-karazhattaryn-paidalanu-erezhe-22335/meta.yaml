act_code: '22335'
requisite: Шығыс Қазақстан облысы Риддер қаласы әкімиятының 2004 жылғы 29 қарашадағы № 1316 қаулысы. Шығыс Қазақстан облысының Әділет департаментінде 2004 жылғы 10 желтоқсанда № 2062 тіркелді. Күші жойылды -Риддер қаласы әкімдіктің 2007 жылғы 13 сәуірдегі № 2-15-1719 хатымен

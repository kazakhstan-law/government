act_code: '57561'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық әкімдігінің 2011 жылғы 21 ақпандағы № 282 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2011 жылғы 3 наурызда № 5-13-86 тіркелді. Күші жойылды - Катонқарағай аудандық әкімдігінің 2011 жылғы 19 мамырдағы № 366 қаулысыме

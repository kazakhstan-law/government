act_code: '57301'
requisite: Постановление акимата города Усть-Каменогорска Восточно-Казахстанской области от 4 февраля 2011 года № 10323. Зарегистрировано Управлением юстиции города Усть-Каменогорск Департамента юстиции Восточно-Казахстанской области 18 февраля 2011 года за № 5-1-160. Прекращено действие по истечении срока, на который постановление было принято (письмо акимата города Усть-Каменогорска ВКО от 4 января 2012 года № Ин-5/2)
title:
  rus: Об оказании материальной помощи лицам, которым назначены пенсии за особые заслуги перед Республикой Казахстан и областью, на компенсацию  расходов по коммунальным услугам в 2011 году
  kaz: 2011 жылы Қазақстан Республикасы және облыс алдындағы ерекше еңбегi  үшiн зейнетақы тағайындалған тұлғаларға коммуналдық қызметтер бойынша  шығындар өтемақысына материалдық көмек көрсету туралы

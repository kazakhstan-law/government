act_code: '60910'
requisite: Постановление акимата Курчумского района Восточно-Казахстанской области от 28 сентября 2011 года № 2253. Зарегистрировано управлением юстиции Курчумского района Департамента юстиции Восточно-Казахстанской области 21 октября 2011 года за № 5-14-137. Утратило силу - постановлением акимата Курчумского района Восточно-Казахстанской области от 21 января 2016 года № 25
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамтамасыз ету, бiлiм беру, мәдениет және ветеринария саласындағы мамандар лауазымдарының тiзбесiн анықтау туралы

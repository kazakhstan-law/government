  title:
    rus: О внесении изменений и дополнения в постановление акимата Курчумского района от 28 сентября 2011 года № 2253 "Об определении перечня должностей специалистов социального обеспечения, образования, культуры, которым установлено повышение к должностным окладам  за работу в (аульной) сельской местности"
    kaz: Күршім ауданы әкімдігінің 2011 жылғы 28 қыркүйектегі № 2253 "Ауылдық (селолық) жердегі жұмысы үшін лауазымдық айлықақыларын көтеру белгіленген әлеуметтік қамтамасыз ету, бiлiм беру, мәдениет мамандары лауазымдарының тiзбесiн айқындау туралы" қаулысына өзгерістер мен толықтыру енгізу туралы

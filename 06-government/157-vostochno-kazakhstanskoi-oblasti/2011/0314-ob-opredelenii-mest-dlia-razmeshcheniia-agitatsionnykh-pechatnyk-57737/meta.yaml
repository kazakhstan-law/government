requisite: Постановление акимата Кокпектинского района Восточно-Казахстанской области от 14 марта 2011 года № 956. Зарегистрировано управлением юстиции Кокпектинского района департамента юстиции Восточно-Казахстанской области 16 марта 2011 года за № 5-15-82. Утратило силу постановлением акимата Кокпектинского района от 17 мая 2011 года № 1066
title:
  rus: Об определении мест для размещения агитационных печатных материалов для  кандидатов в депутаты Кокпектинского районного маслихата по избирательному округу № 6 вместо выбывшего

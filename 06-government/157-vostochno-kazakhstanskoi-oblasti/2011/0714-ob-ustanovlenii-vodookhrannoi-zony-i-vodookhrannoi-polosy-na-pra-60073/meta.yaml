title:
  rus: Об установлении водоохранной зоны и водоохранной полосы на правом берегу Бухтарминского водохранилища в створах от поселка Октябрьский до плотины Бухтарминской гидроэлектростанции Зыряновского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Зырян ауданының Октябрьский кентінен бастап Бұқтырма су электрстанциясының бөгетіне дейінгі тұстардағы Бұқтырма су қоймасының оң  жағалауында су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

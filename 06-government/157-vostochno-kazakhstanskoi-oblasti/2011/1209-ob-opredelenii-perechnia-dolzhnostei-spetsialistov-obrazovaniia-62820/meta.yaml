requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 9 декабря 2011 года № 1422. Зарегистрировано управлением юстиции Глубоковского района Департамента юстиции Восточно-Казахстанской области 12 января 2012 года за № 5-9-160. Утратило силу постановлением Глубоковского районного акимата от 30 июня 2014 года № 1151
title:
  rus: Об определении перечня должностей специалистов образования, культуры, спорта, социального обеспечения, которым установлено повышение к должностным окладам за работу в аульной (сельской) местности
  kaz: Ауылдық (селолық) жердегі жұмысы үшін лауазымдық айлықақыларын көтеру белгіленген әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мамандары лауазымдарының тізбесін анықтау туралы

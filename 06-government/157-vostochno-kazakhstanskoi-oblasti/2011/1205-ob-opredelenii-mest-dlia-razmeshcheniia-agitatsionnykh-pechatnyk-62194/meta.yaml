  kaz: Қазақстан Республикасы Парламенті Мәжілісінің депутаттарын сайлау бойынша саяси партиялар үшін, Шығыс Қазақстан облыстық мәслихаты мен Зырян ауданы мәслихатының депутаттығына кандидаттарға үгіт баспа материалдарын орналастыру үшін орындар белгілеу туралы

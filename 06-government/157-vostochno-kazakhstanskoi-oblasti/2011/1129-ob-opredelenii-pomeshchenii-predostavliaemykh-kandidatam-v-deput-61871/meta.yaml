requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 29 ноября 2011 года № 198. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 9 декабря 2011 года за № 5-8-140. Прекращено действие по истечении срока, на который постановление было принято, на основании письма аппарата акима Бородулихинского района Восточно-Казахстанской области от 4 мая 2012 года № 1153
title:
  rus: Об определении помещений предоставляемых кандидатам в депутаты мажилиса Парламента Республики Казахстан, областного и районного маслихатов на договорной основе для встреч с избирателями

requisite: Постановление акимата Зыряновского района Восточно-Казахстанской области от 21 декабря 2011 года № 816. Зарегистрировано управлением юстиции Зыряновского района Департамента юстиции Восточно-Казахстанской области 16 января 2012 года за № 5-12-132. Прекращено действие по истечении срока, на который постановление было принято (письмо аппарата акима Зыряновского района от 22 января 2013 года № 07-06/59)
title:

act_code: '62686'
requisite: Постановление акимата города Семей Восточно-Казахстанской области от 13 декабря 2011 года № 1473. Зарегистрировано Управлением юстиции города Семей Департамента юстиции Восточно-Казахстанской области 7 января 2012 года за № 5-2-152. Утратило силу постановлением акимата города Семей Восточно-Казахстанской области 1 августа 2014 года № 1195
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясының пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

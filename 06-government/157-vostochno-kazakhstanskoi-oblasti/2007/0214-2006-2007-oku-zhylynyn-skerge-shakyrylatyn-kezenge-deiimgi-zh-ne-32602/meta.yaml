act_code: '32602'
requisite: Шығыс Қазақстан облысы Зайсан ауданыны әкімдігінің 2007 жылғы 14 ақпандағы N 763 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық басқармасында 2007 жылғы 19 наурызда N 5-11-58 тіркелді

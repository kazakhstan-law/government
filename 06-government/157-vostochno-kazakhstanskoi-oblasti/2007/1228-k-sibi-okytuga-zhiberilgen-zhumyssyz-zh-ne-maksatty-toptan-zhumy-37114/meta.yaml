act_code: '37114'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2007 жылғы 28 желтоқсандағы № 340 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2008 жылғы 28 қаңтарда № 5-5-72 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2009 жылғы 23 қаңтардағы № 525 қаулысымен
title:
  rus: Кәсіби оқытуға жіберілген жұмыссыз және мақсатты топтан жұмыспен қамтылмаған азаматтардың жол жүру, тамақтану, тұру және медициналық куәландыру шығындарын өтеудің қағидасын бекіту туралы

act_code: '37113'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2007 жылғы 28 желтоқсандағы № 339 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2008 жылғы 28 қаңтарда № 5-5-71 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2009 жылғы 23 қаңтардағы № 526 қаулысымен

requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 28 июня 2007 года № 223. Зарегистрировано управлением юстиции Глубоковского района Департамента юстиции Восточно-Казахстанской области 18 июля 2007 года за № 5-9-67. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 26 августа 2024 года № 389 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О размещении агитационных печатных материалов кандидатов в депутаты Мажилиса Парламента избираемых по партийным спискам, и в депутаты маслихатов Республики Казахстан

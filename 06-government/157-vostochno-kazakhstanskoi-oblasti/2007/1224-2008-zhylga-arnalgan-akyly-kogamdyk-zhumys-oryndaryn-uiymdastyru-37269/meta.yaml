act_code: '37269'
requisite: Шығыс Қазақстан облысы Зайсан аудандық әкімдігінің 2007 жылғы 24 желтоқсандағы № 101 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2008 жылғы 18 қаңтарда № 5-11-69 тіркелді

act_code: '36035'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2007 жылғы 7 қарашадағы № 352 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2007 жылғы 20 қарашада № 5-16-43 тіркелді

  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 2 октября 2015 года № 260 «Об утверждении регламента государственной услуги «Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
    kaz: «Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық - материалдық құндылықтардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2015 жылғы 2 қазандағы № 260 қаулысына өзгеріс енгізу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Аблакетка в селе Мамай батыр и реки Сагыр в селе Сагыр Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданының Мамай батыр ауылындағы Аблакетка өзенінің және Сағыр ауылындағы Сағыр өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылық пайдаланудың режимін белгілеу туралы

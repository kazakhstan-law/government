title:
  rus: 'Об установлении объемов субсидий по районам Восточно-Казахстанской области  на субсидирование стоимости гербицидов,   предназначенных для обработки  сельскохозяйственных культур в целях  защиты растений, на 2015 год '
  kaz: 'Шығыс Қазақстан облысының аудандары бойынша өсімдіктерді қорғау мақсатында  ауылшаруашылық дақылдарын өңдеуге  арналған гербицидтердің құнын  субсидиялауға берілетін субсидиялардың 2015 жылға арналған көлемдерін белгілеу туралы '

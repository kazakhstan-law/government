requisite: Постановление Восточно-Казахстанского областного акимата от 9 ноября 2015 года № 292. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 14 декабря 2015 года № 4272. Утратило силу постановлением Восточно-Казахстанского областного акимата от 26 марта 2020 года № 97 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование стоимости гербицидов, биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений»
  kaz: «Өсiмдiктердi қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердiң, биоагенттердiң (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

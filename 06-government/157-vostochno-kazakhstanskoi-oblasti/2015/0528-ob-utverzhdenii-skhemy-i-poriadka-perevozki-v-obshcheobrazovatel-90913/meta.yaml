  title:
    rus: О внесении дополнения в постановление акимата Бородулихинского района № 149 от 28 мая 2015 года «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Бородулихинского района»
    kaz: «Бородулиха ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы» Бородулиха ауданы әкімдігінің 2015 жылғы 28 мамырдағы № 149 қаулысына толықтыру енгізу туралы

requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 5 мая 2015 года № 126. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 мая 2015 года № 3960. Утратило силу постановлением акимата Бородулихинского района области Абай от 10 ноября 2023 года № 288 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

  title:
    rus: О внесении изменения в постановление акимата Бородулихинского района Восточно-Казахстанской области от 05 мая 2015 года № 126 «Об определении оптимальных сроков начала и завершения посевных работ на территории Бородулихинского района Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысы Бородулиха ауданы аумағында егіс жұмыстарының басталуы мен аяқталуының оңтайлы мерзімін белгілеу туралы» Шығыс Қазақстан облысы Бородулиха ауданы әкімдігінің 2015 жылғы 5 мамырдағы № 126 қаулысына өзгерту енгізу туралы

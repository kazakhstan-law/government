requisite: Постановление Зайсанского районного акимата Восточно-Казахстанской области от 7 июля 2015 года № 388. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 июля 2015 года № 4057. Утратило силу - постановлением Зайсанского районного акимата Восточно-Казахстанской области от 29 августа 2016 года № 119
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ, бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

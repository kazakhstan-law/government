  title:
    rus: О внесении изменений и дополнения в постановление Восточно-Казахстанского областного акимата от 11 сентября 2015 года № 230 «Об утверждении регламента государственной услуги «Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения в порядке, определяемом Правительством Республики Казахстан»
    kaz: «Қазақстан Республикасының Үкіметі айқындайтын тәртіппен сыйға тарту шарты бойынша мемлекеттік емес заңды тұлғалардың және жеке тұлғалардың мүлік құқықтарын Қазақстан Республикасының қабылдауы» мемлекеттiк көрсетілетін қызмет регламентiн бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2015 жылғы 11 қыркүйектегі № 230 қаулысына өзгерістер мен толықтыру енгізу туралы

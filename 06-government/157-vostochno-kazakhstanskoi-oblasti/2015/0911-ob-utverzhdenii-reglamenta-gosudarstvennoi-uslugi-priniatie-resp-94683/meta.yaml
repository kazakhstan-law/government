requisite: Постановление Восточно-Казахстанского областного акимата от 11 сентября 2015 года № 230. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 14 октября 2015 года № 4176. Утратило силу - постановлением Восточно-Казахстанского областного акимата от 13 марта 2018 года № 67
title:
  rus: Об утверждении регламента государственной услуги «Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения в порядке, определяемом Правительством Республики Казахстан»
  kaz: «Қазақстан Республикасының Үкіметі айқындайтын тәртіппен сыйға тарту шарты бойынша мемлекеттік емес заңды тұлғалардың және жеке тұлғалардың мүлік құқықтарын Қазақстан Республикасының қабылдауы» мемлекеттiк көрсетілетін қызмет регламентiн бекіту туралы

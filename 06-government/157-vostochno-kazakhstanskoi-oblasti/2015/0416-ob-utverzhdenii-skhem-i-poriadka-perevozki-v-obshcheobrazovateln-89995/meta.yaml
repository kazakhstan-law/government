  title:
    rus: О внесении изменений и дополнений в постановление акимата Зыряновского района от 16 апреля 2015 года № 126 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Зыряновского района»
    kaz: «Зырян ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы» Зырян ауданы әкімдігінің 2015 жылғы 16 сәуірдегі № 126 қаулысына өзгерістер мен толықтырулар енгізу туралы

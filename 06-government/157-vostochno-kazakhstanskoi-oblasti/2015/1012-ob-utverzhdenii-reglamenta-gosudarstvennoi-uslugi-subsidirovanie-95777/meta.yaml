requisite: Постановление Восточно-Казахстанского областного акимата от 12 октября 2015 года № 271. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 ноября 2015 года № 4232. Утратило силу постановлением Восточно-Казахстанского областного акимата от 26 марта 2020 года № 97 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда»
  kaz: «Жеміс-жидек дақылдарының және жүзімнің көпжылдық көшеттерін отырғызу және өсіру (оның ішінде қалпына келтіру) шығындарының құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

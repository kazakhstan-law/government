    kaz: «Өсiмдiктердi қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердiң, биоагенттердiң (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2015 жылғы 9 қарашадағы № 292 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Восточно-Казахстанского областного акимата от 29 июня 2015 года № 160 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елдi мекендерге жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын ұсыну» мемлекеттiк көрсетілетін қызмет регламентiн бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2015 жылғы 29 маусымдағы № 160 қаулысына өзгерістер мен толықтырулар енгізу туралы

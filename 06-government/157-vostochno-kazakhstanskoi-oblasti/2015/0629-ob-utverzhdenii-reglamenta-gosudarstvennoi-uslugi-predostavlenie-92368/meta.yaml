  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 29 июня 2015 года № 160 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2015 жылғы 29 маусымдағы № 160 қаулысына өзгеріс енгізу туралы

act_code: '147899'
requisite: Постановление Восточно-Казахстанского областного акимата от 26 октября 2020 года № 377. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 октября 2020 года № 7728
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Козловка (правый берег) и реки Секисовка (левый берег) в створе земельного участка для проектирования линии электроснабжения западнее села Малоубинка Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Малоубинка ауылының батысына қарай электрмен жабдықтау желісін жобалауға арналған жер учаскесі тұстамасындағы Козловка өзенінің (оң жағалау) және Секисовка өзенінің (сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья без названия в створе испрашиваемых земельных участков в районе села Ново-Одесское в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Ново-Одесское ауылы ауданында сұралып отырған жер учаскелері тұстамасындағы атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

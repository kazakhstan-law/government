title:
  rus: Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием и перечня организаций образования, реализующих образовательные программы технического и профессионального, послесреднего образования на 2020-2021 учебный год
  kaz: 2020-2021 оқу жылына арналған техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын бекіту және мемлекеттік білім беру тапсырысы орналастырылатын техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының тізбесін бекіту туралы

  title:
    rus: О внесении изменений в постановление Восточно-Казахстанского областного акимата от 22 июля 2020 года № 244 «Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием и перечня организаций образования, реализующих образовательные программы технического и профессионального, послесреднего образования на 2020-2021 учебный год»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2020 жылғы 22 шілдедегі № 244 «2020-2021 оқу жылына арналған техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын бекіту және мемлекеттік білім беру тапсырысы орналастырылатын техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының тізбесін бекіту туралы» қаулысына өзгерістер енгізу туралы

  kaz: Шығыс Қазақстан облысы Күршім ауданындағы Тарлаулы шағын өзенінің және оның саласы Үлкен Тарлаулы бұлағы және Тасқайнар бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

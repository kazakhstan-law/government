title:
  rus: Об установлении водоохранной зоны и водоохранной полосы левобережного участка реки Бутачиха и правобережного участка реки Козлушка на территории города Риддер Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласының аумағындағы Бутачиха өзенінің сол жағалауындағы учаскесі және Козлушка өзенінің оң жағалауындағы учаскесінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

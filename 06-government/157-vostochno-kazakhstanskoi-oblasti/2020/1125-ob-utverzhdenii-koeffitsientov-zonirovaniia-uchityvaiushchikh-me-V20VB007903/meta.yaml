  title:
    rus: О внесении изменений в постановление акимата города Семей от 25 ноября 2020 года № 2039 «Об утверждении коэффициентов зонирования, учитывающих месторасположение объектов налогообложения города Семей и территории, переданной в его административное подчинение»

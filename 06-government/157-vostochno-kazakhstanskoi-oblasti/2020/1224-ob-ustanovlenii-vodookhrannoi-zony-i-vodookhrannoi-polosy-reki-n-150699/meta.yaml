act_code: '150699'
requisite: Постановление Восточно-Казахстанского областного акимата от 24 декабря 2020 года № 463. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 декабря 2020 года № 8058
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Нарын (левый берег) и ручья без названия (правый берег) в створе испрашиваемого земельного участка, расположенного в 0,9 км севернее села Кокбастау Катон-Карагайского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданы Көкбастау ауылынан солтүстікке қарай 0,9 км орналасқан сұралып отырған жер учаскесі тұстамасындағы Нарын өзенінің (сол жағалау) және атауы жоқ бұлақтың (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

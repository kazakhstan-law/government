act_code: '150091'
requisite: Постановление Восточно-Казахстанского областного акимата от 20 декабря 2020 года № 429. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 декабря 2020 года № 7995
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Койшилик и его притоков ручьев Киынсу и Каражал в створе земельных участков, предназначенных для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы аукцион арқылы өткізуге арналған жер учаскелері тұстамасындағы Қойшілік бұлағы мен оның салалары Қиынсу және Қаражал бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Пихтовка, ручьев без названия №№ 1-3 и родников №№ 1-3 в районе Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы Пихтовка өзенінің, атауы жоқ №№ 1-3 бұлақтарының және №№ 1-3 бастауларының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

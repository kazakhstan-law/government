title:
  rus: Об утверждении перечня субсидируемых пестицидов, биоагентов (этномофагов) и норм субсидий на 1 литр (килограмм, грамм, штук), а так же объемов субсидий на удешевление стоимости пестицидов, биоагентов (этномофагов) на 2020 год
  kaz: 2020 жылға арналған субсидияланатын пестицидтердің, биоагенттердің (энтомофагтардың) тізбесін және 1 литрге (килограмм, грамм, дана) арналған субсидиялар нормаларын, сондай-ақ пестицидтердің, биоагенттердің (энтомофагтардың) құнын арзандатуға арналған субсидия көлемдерін бекіту туралы

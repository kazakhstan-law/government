  title:
    rus: О признании утратившими силу постановления акимата Жарминского района Восточно-Казахстанской области от 30 ноября 2020 года № 432 «Об утверждении коэффициентов зонирования, учитывающих месторасположение объекта налогообложения в населенных пунктах Жарминского района» и от 12 ноября 2021 года № 486 «О внесении изменения в постановление акимата Жарминского района Восточно-Казахстанской области от 30 ноября 2020 года № 432 «Об утверждении коэффициентов зонирования, учитывающих месторасположение объекта налогообложения в населенных пунктах Жарминского района»
    kaz: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2020 жылғы 30 қарашадағы № 432 «Жарма ауданының елді мекендеріндегі салық салу объектісінің орналасқан жерін ескеретін аймаққа бөлу коэффиценттерін бекіту туралы» және 2021 жылғы 12 қарашадағы № 486 «Жарма ауданының елді мекендердегі салық салу объектісінің орналасқан жерін ескеретін аймаққа бөлу коэффициенттерін бекіту туралы 2020 жылғы 30 қарашадағы № 432 қаулысына өзгеріс енгізу туралы» қаулыларының күшін жою туралы

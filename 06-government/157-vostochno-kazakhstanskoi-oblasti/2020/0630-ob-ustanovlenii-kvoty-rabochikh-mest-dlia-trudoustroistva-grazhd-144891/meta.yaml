  title:
    rus: О внесении изменения в постановление акимата Жарминского района от 30 июня 2020 года № 270 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования»
    kaz: Жарма ауданы әкімдігінің 2020 жылғы 30 маусымдағы № 270 «Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгеріс енгізу туралы

  kaz: Шығыс Қазақстан облысы Риддер қаласы Поперечное ауылы аумағындағы Сергеев бұлағы, атауы жоқ бұлақтың және бастаудың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '143479'
requisite: Постановление Восточно-Казахстанского областного акимата от 21 мая 2020 года № 158. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 июня 2020 года № 7138
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Сарыозек (правый берег) и ручьев без названия №№ 1-3 (правый и левый берег) в створе земельного участка в районе села Алмасай Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Алмасай ауылы аумағындағы жер учаскесі тұстамасындағы Сарыөзек өзенінің (оң жағалау) және атауы жоқ №№ 1-3 бұлақтарының (оң және сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

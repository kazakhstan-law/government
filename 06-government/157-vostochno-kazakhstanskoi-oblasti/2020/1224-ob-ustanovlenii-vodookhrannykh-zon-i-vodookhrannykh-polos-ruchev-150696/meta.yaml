act_code: '150696'
requisite: Постановление Восточно-Казахстанского областного акимата от 24 декабря 2020 года № 464. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 декабря 2020 года № 8063
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев без названия №№ 1,2, Байша, Белый Ключ, Родник № 1, Родник № 2 в створе земельных участков, предоставляемых товариществу с ограниченной ответственностью «Каскад-Н» в Кокпектинском районе Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Көкпекті ауданындағы «Каскад-Н» жауапкершілігі шектеулі серіктестігіне берілетін жер учаскесі тұстамасындағы атауы жоқ №№ 1,2, Байша, Белый Ключ, Родник № 1, Родник № 2 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '144673'
requisite: Постановление акимата Курчумского района Восточно-Казахстанской области от 1 июля 2020 года № 232. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 июля 2020 года № 7288. Утратило силу постановлением акимата Курчумского района Восточно-Казахстанской области от 14 мая 2021 года № 250 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

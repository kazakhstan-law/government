act_code: '147721'
requisite: Постановление Восточно-Казахстанского областного акимата от 19 октября 2020 года № 370. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 23 октября 2020 года № 7713
title:
  rus: Об установлении водоохранных зон и водоохранных полос для истоков ручья Кайракты и ручья без названия в створе земельного участка, предназначенного для реализации через аукцион для выпаса сельскохозяйственных животных на территории Курчумского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданы аумағында ауыл шаруашылығы жануарларын жаю үшін аукцион арқылы өткізуге арналған жер учаскесінің тұстамасындағы Қайрақты бұлағы мен атауы жоқ бұлақ бастаулары үшін су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

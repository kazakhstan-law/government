requisite: Постановление Восточно-Казахстанского областного акимата от 14 апреля 2020 года № 126. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 апреля 2020 года № 6919
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Дресвянка (правый и левый берег) и ручьев без названия №№ 1-3 (правый и левый берег) в районе села Отрадное Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Отрадное ауылы аумағындағы Дресвянка өзенінің (оң және сол жағалау) және атауы жоқ №№ 1-3 бұлақтардың (оң және сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

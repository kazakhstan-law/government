act_code: '143377'
requisite: Постановление акимата района Алтай Восточно-Казахстанской области от 21 мая 2020 года № 173. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 мая 2020 года № 7131. Утратило силу постановлением акимата района Алтай Восточно-Казахстанской области от 15 января 2021 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта, являющихся гражданскими служащими и работающих в сельской местности района Алтай
  kaz: Азаматтық қызметшілер болып табылатын және Алтай ауданының ауылдық жерлерінде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандар лауазымдарының тiзбесiн анықтау туралы

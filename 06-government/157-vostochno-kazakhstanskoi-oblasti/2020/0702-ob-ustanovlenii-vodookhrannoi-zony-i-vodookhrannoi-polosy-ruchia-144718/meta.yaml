title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Егинбулак в створе испрашиваемого земельного участка на территории учетного квартала 05-079-017 (в 7,2 км юго-восточнее села Бурсак) в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы 05-079-017 есеп кварталының (Борсақ ауылынан оңтүстік-шығысқа қарай 7,2 км) аумағындағы сұралып отырған жер учаскесінің тұстамасындағы Егінбұлақ бұлағының су қорғау аймағы мен су қорғау белдеуі және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Березовка и ее протоки в створе земельных участков, предоставляемых для сенокошения, в районе Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданында шөп шабу үшін берілетін жер учаскелерінің тұстамасындағы Березовка шағын өзені және оның тармағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '146254'
requisite: Постановление Восточно-Казахстанского областного акимата от 25 августа 2020 года № 299. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 сентября 2020 года № 7517
title:
  rus: Об установлении водоохранных зон и полос ручьев без названия №№ 1, 2 на испрашиваемом крестьянским хозяйством «Гемма» земельном участке, расположенном в учетном квартале 05-083-051, район урочища Серый Луг, города Риддер Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласы Серый Луг шатқалы ауданы, 05-083-051 есептік кварталында орналасқан «Гемма» шаруа қожалығы сұрап отырған жер учаскесіндегі №№ 1, 2 атауы жоқ бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

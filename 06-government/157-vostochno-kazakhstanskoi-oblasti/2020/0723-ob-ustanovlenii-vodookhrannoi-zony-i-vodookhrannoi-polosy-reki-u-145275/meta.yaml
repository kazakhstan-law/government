title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Уланка на участке протяженностью 3,0 км от водохранилища в селе Герасимовка Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Герасимовка ауылындағы су қоймасынан ұзақтығы 3,0 км учаскеде Ұлан өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

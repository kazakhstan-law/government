  kaz: Шығыс Қазақстан облысы Күршім ауданы аумағындағы жер учаскесі тұстамасындағы атауы жоқ ағыстың және № 1 және № 2 бастауларының су қорғау аймақтары мен су қорғау белдеулері және оларды шаруашылыққа пайдалану режимін белгілеу туралы

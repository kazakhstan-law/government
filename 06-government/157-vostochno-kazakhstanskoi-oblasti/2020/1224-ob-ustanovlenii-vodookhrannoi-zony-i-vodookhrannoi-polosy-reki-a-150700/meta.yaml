title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Аблакетка (правый берег) в створе земельного участка в районе села Самсоновка города Усть-Каменогорск Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласы Самсоновка ауылы ауданындағы жер учаскесі тұстамасындағы Аблакетка өзенінің (оң жақ жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

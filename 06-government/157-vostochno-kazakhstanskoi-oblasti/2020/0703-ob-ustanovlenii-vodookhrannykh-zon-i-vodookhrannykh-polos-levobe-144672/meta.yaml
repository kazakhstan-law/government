act_code: '144672'
requisite: Постановление Восточно-Казахстанского областного акимата от 3 июля 2020 года № 227. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 июля 2020 года № 7286
title:
  rus: Об установлении водоохранных зон и водоохранных полос левобережных притоков реки Калжыр ручьев без названия №№ 1, 2, 3 в створе земельных участков, предназначенных для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданында аукцион арқылы өткізуге арналған жер учаскелері тұстамасындағы Қалжыр өзенінің сол жағалау ағыстарының және атауы жоқ №№ 1, 2, 3 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Боко (правый берег) в районе расположения карьера Аульный товарищества с ограниченной ответственностью «Шұғыла Gold» в Жарминском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданындағы «Шұғыла Gold» жауапкершілігі шектеулі серіктестігінің Аульный карьерінің орналасқан ауданындағы Боко өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

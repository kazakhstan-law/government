requisite: Постановление Восточно-Казахстанского областного акимата от 25 августа 2020 года № 298. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 сентября 2020 года № 7505
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Большая Поперечная (правый берег) на испрашиваемом крестьянским хозяйством «Гемма» земельном участке, расположенном в учетном квартале 05-083-051, район урочища Серый Луг, города Риддер Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласы Серый Луг шатқалы ауданы 05-083-051 есептік кварталында орналасқан «Гемма» шаруа қожалығы сұрап отырған жер учаскесінде Большая Поперечная (оң жағалау) өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '145278'
requisite: Постановление Восточно-Казахстанского областного акимата от 27 июля 2020 года № 251. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 августа 2020 года № 7422
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Тополевка, ее притоков ручья без названия и родника в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Тополевка өзені, оның ағыстары атауы жоқ бұлақтың және бастаудың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

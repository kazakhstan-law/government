act_code: '150312'
requisite: Постановление Восточно-Казахстанского областного акимата от 21 декабря 2020 года № 443. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 23 декабря 2020 года № 8017
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев Большой Шигилек, Малый Шигилек и Толагай в створе земельного участка, предоставляемого товариществу с ограниченной ответственностью «Толагай Кен», на территории Кокпектинского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Көкпекті ауданының аумағындағы «Толағай Кен» жауапкершілігі шектеулі серіктестігіне берілетін жер учаскесі тұстамасындағы Үлкен Шігілек, Кіші Шігілек және Толағай бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

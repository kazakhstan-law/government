title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Балабай и ручья без названия в районе села Акжартас в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Ақжартас ауылы аумағында сұралып отырған жер учаскесі тұстамасындағы Балабай бұлағы мен атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

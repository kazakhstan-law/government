requisite: Постановление Восточно-Казахстанского областного акимата от 22 июля 2020 года № 246. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 августа 2020 года № 7429
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия в створе земельного участка, предназначенного для реализации через аукцион для выпаса сельскохозяйственных животных, на территории Курчумского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданының аумағында ауыл шаруашылығы жануарларын жаю үшін аукцион арқылы өткізуге арналған жер учаскесінің тұстамасындағы атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '146911'
requisite: Постановление Восточно-Казахстанского областного акимата от 25 августа 2020 года № 302. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 сентября 2020 года № 7597
title:
  rus: Об установлении водоохранных зон и водоохранных полос истоков речки Поперечная, ручьев без названия №№ 1, 2, и истоков речки Орта Теректы, ручьев без названия №№ 3, 4, в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданында аукцион арқылы өткізуге арналған жер учаскесінің тұстамасындағы Поперечная шағын өзенінің, атауы жоқ №№ 1, 2 бұлақтардың бастауларының және Орта Теректі шағын өзені, атауы жоқ №№ 3, 4 бұлақтардың бастауларының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

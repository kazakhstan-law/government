act_code: '141755'
requisite: Постановление Восточно-Казахстанского областного акимата от 8 апреля 2020 года № 117. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 14 апреля 2020 года № 6888
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Быструха (левый берег), реки Секисовка (правый берег и левый берег), реки Вторая Зайчиха (правый берег), реки Деревка (правый и левый берег) и ручья без названия (правый и левый берег) в створе земельных участков для проектирования линии электроснабжения южнее села Малоубинка Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданының Малоубинка ауылынан оңтүстікке қарай электрмен жабдықтау желілерін жобалауға арналған жер учаскелері тұстамасындағы Быструха өзенінің (сол жағалау), Секисовка өзенінің (оң жағалау және сол жағалау), Вторая Зайчиха өзенінің (оң жағалау), Деревка өзенінің (оң және сол жағалау) және атауы жоқ бұлақтың (оң және сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін  белгілеу туралы

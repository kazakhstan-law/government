title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Березовка в створе земельных участков № 1 и № 2, расположенных в 8,4 км северо-западнее села Путинцево и в районе села Бобровка района Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданы Путинцево ауылынан солтүстік-батысқа қарай 8,4 км және Бобровка ауылы аумағында орналасқан № 1 және № 2 жер учаскелерінің тұстамасындағы Березовка өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

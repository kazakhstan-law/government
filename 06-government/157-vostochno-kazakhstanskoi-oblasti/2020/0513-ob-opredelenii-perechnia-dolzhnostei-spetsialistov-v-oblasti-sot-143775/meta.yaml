requisite: Постановление акимата Уланского района Восточно-Казахстанской области от 13 мая 2020 года № 143. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 июня 2020 года № 7168. Утратило силу постановлением Уланского районного акимата Восточно-Казахстанской области от 30 декабря 2020 года № 428 (вводится в действие с 01.01.2021)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельских населенных пунктах
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

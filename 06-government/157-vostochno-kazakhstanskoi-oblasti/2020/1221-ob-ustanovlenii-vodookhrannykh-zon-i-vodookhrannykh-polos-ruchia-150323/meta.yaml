title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья без названия и притока № 1 в створе испрашиваемого земельного участка в Глубоковском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданындағы сұралып отырған жер учаскесі тұстамасындағы атауы жоқ бұлақтың және оның № 1 саласының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление акимата Кокпектинского района Восточно-Казахстанской области от 20 октября 2020 года № 346. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 октября 2020 года № 7716. Утратило силу постановлением акимата Кокпектинского района Восточно-Казахстанской области от 15 января 2021 года № 10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта, являющихся гражданскими служащими и работающих в сельской местности

  kaz: Шығыс Қазақстан облысы Алтай ауданындағы сұралып отырған жер учаскесінің тұстамасындағы атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

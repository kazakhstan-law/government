title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев без названия №№ 1-2 в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы атауы жоқ №№ 1-2 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

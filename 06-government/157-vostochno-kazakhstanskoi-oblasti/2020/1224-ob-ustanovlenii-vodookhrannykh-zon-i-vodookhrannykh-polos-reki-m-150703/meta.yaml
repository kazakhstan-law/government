act_code: '150703'
requisite: Постановление Восточно-Казахстанского областного акимата от 24 декабря 2020 года № 459. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 декабря 2020 года № 8054
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Мякотиха, ее притоков ручьев Козачий, Большая Тополевка, Игнатиха, Топкий и Широкий в створе земельного участка на территории района Алтай Восточно – Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданы аумағындағы жер учаскесі тұстамасындағы Мякотиха өзені мен оның ағыстары Козачий, Большая Тополевка, Игнатиха, Топкий және Широкий бұлақтарының су қорғау аймақтары мен су қорғау белдеулері және оларды шаруашылыққа пайдалану режимін белгілеу туралы

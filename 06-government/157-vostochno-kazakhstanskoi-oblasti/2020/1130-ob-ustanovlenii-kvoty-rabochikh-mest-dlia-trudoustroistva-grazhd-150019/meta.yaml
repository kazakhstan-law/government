requisite: Постановление акимата города Курчатов Восточно-Казахстанской области от 30 ноября 2020 года № 429. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 декабря 2020 года № 7988
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2021 год
  kaz: 2021 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған тұлғаларды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу  туралы

  kaz: Шығыс Қазақстан облысы Глубокое ауданы Тарханка ауылынан солтүстікке қарай 9,5 км орналасқан жер учаскесі тұстамасындағы Черемшаночка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

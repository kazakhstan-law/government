title:
  rus: Об установлении публичного сервитута товариществу с ограниченной ответственностью «Казникель» для проведения разведки полезных ископаемых и геологического изучения на территории Долонского сельского округа в районе месторождения «Горностаевское»
  kaz: «Казникель» жауапкершілігі шектеулі серіктестігіне пайдалы қазбаларды барлау және геологиялық зерттеуді жүргізу үшін Долон ауылдық округінің аумағындағы «Горностаевское» кен орынында қауымдық сервитут орнату туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Аблакетка (правый и левый берег) в створе земельного участка, расположенного западнее села Самсоновка города Усть-Каменогорск Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласы Самсоновка ауылынан батысқа қарай орналасқан жер учаскесі тұстамасындағы Аблакетка өзенінің (оң және сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

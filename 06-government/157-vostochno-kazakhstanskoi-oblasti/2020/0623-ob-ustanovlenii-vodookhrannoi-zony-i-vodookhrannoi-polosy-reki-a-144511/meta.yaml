  kaz: Шығыс Қазақстан облысы Өскемен қаласы Самсоновка ауылында орналасқан жер учаскесі тұстамасындағы Аблакетка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

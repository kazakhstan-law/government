title:
  rus: Об установлении водоохранных зон и водоохранных полос рек Дресвянка и Куржыра в створе земельного участка, расположенного в 6,7 км  к юго-востоку от села Отрадное Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Отрадное ауылынан оңтүстік-шығысқа қарай 6,7 км жерде орналасқан жер учаскесі тұстамасындағы Дресвянка және Құржыра өзендерінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

requisite: Постановление акимата Тарбагатайского района Восточно-Казахстанской области от 14 апреля 2020 года № 269. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 апреля 2020 года № 7030. Утратило силу постановлением акимата Тарбагатайского района Восточно-Казахстанской области от 29 апреля 2021 года № 438 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

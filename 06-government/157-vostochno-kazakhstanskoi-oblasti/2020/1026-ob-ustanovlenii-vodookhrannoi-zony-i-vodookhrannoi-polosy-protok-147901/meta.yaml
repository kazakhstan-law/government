requisite: Постановление Восточно-Казахстанского областного акимата от 26 октября 2020 года № 378. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 октября 2020 года № 7729
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы протоки реки Ульба «Комендантка» в створе земельного участка, расположенного по проспекту Н. Назарбаева, 36 нежилое помещение 24 в городе Усть-Каменогорск Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласының Н. Назарбаев даңғылы, 36 орналасқан 24 тұрғын емес үй-жай жер учаскесі тұстамасындағы Үлбі өзенінің «Комендантка» ағысының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

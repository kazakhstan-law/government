act_code: '151054'
requisite: Постановление Восточно-Казахстанского областного акимата от 29 декабря 2020 года № 482. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 декабря 2020 года № 8132
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Бухтарма и ее протоки, Бухтарминского водохранилища и реки Мельничная в створе земельного участка на территории района Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданы аумағындағы жер учаскесінің тұстамасындағы Бұқтырма өзені мен оның салалары, Бұқтырма су қоймасының және Мельничная өзенінің су қорғау аймақтары мен су қорғау белдеулерін және шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '144715'
requisite: Постановление Восточно-Казахстанского областного акимата от 2 июля 2020 года № 223. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 июля 2020 года № 7331
title:
  rus: Об установлении водоохранных зон и водоохранных полос родника Канжыгабулак и ручьев без названия №№ 1-4 в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Қанжығабұлақ бастауының және атауы жоқ №№ 1-4 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

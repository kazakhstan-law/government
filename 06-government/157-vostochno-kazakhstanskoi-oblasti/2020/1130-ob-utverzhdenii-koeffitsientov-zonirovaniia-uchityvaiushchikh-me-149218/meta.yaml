  requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 22 ноября 2024 года № 541. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 ноября 2024 года № 9109-16. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 21 ноября 2025 года № 481 (вводится в действие с 01.01.2026 и подлежит официальному опубликованию)
  title:
    rus: О внесении изменения в постановление акимата Глубоковского района Восточно-Казахстанской области от 30 ноября 2020 года № 430 «Об утверждении коэффициентов зонирования, учитывающих месторасположение объекта налогообложения в населенных пунктах Глубоковского района»
    kaz: Шығыс Қазақстан облысы Глубокое ауданы әкімдігінің 2020 жылғы 30 қарашадағы № 430 «Глубокое ауданының елді мекендерінде салық салу объектісінің орналасқан жерін ескеретін аймаққа бөлу коэфициенттерін бекіту туралы» қаулысына өзгеріс енгізу туралы

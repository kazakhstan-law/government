requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 30 ноября 2020 года № 430. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 декабря 2020 года № 7906. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 21 ноября 2025 года № 481 (вводится в действие с 01.01.2026 и подлежит официальному опубликованию)

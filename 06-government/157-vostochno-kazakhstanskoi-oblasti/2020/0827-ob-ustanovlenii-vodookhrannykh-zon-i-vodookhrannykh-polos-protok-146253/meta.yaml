requisite: Постановление Восточно-Казахстанского областного акимата от 27 августа 2020 года № 308. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 сентября 2020 года № 7516
title:
  rus: Об установлении водоохранных зон и водоохранных полос протоки Комендантка (правый берег) и пруда в парке «Металлург» на испрашиваемом земельном участке, расположенном по проспекту Н. Назарбаева города Усть-Каменогорск Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласының Н. Назарбаев даңғылы бойында орналасқан сұралып отырған жер учаскесіндегі Комендантка ағысының (оң жағалау) және «Металлург» саябағындағы тоғанның су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы  реки Сурка (правый берег) в створе земельного участка, расположенного в 0,8 км западнее села Улкен Нарын Катон-Карагайского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданы Үлкен Нарын ауылынан батысқа қарай 0,8 км жерде орналасқан жер учаскесі тұстамасындағы Сурка өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

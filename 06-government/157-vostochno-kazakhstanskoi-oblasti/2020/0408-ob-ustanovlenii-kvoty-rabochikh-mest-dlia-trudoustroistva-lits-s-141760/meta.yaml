requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 8 апреля 2020 года № 142. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 14 апреля 2020 года № 6890. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 23 апреля 2021 года № 185 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

act_code: '148359'
requisite: Постановление Восточно-Казахстанского областного акимата от 2 ноября 2020 года № 394. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 ноября 2020 года № 7782. Утратило силу постановлением Восточно-Казахстанского областного акимата от 22 мая 2024 года № 120 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысындаесептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау,сумен жабдықтау, су бұру және жылумен жабдықтау бойынша коммуналдық қызметтерді тұтыну нормаларын бекіту туралы

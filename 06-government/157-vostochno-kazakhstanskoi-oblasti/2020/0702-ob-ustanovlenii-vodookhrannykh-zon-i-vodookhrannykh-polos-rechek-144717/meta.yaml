requisite: Постановление Восточно-Казахстанского областного акимата от 2 июля 2020 года № 220. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 июля 2020 года № 7325
title:
  rus: Об установлении водоохранных зон и водоохранных полос речек Сорная и Мостовая в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданында аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Сорная және Мостовая шағын өзендерінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

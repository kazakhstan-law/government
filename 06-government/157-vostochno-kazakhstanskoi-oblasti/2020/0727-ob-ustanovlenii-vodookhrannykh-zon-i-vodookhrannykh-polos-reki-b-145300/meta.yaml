act_code: '145300'
requisite: Постановление Восточно-Казахстанского областного акимата от 27 июля 2020 года № 252. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 августа 2020 года № 7425
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Бухтарма (левый берег) и озера без названия на испрашиваемых земельных участках, расположенных в 4,0 км западнее села Енбек Катон-Карагайского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданы Еңбек ауылынан батысқа қарай 4,0 км жерде орналасқан сұралып отырған жер учаскелеріндегі Бұқтырма өзенінің (сол жағалау) және атауы жоқ көлдің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Орта Теректы и ручья без названия в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Орта Теректі өзені және атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

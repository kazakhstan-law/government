act_code: '146160'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 сентября 2020 года № 313. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 сентября 2020 года № 7513
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Большая Разливанка (левый берег) и ручья без названия в створе испрашиваемого крестьянским хозяйством «Гемма» земельного участка, расположенного в учетном квартале 05-083-051, район урочища Серый Луг, города Риддер Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласы Серый Луг шатқалы ауданы, 05-083-051 есептік кварталында орналасқан, «Гемма» шаруа қожалығы сұрап отырған жер учаскесінің тұстамасындағы Большая Разливанка өзенінің (сол жағалау) және атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

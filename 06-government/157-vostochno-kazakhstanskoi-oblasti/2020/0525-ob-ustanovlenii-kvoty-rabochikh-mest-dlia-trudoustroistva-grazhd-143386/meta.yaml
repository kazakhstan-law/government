requisite: Постановление акимата Кокпектинского района Восточно-Казахстанской области от 25 мая 2020 года № 175. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 мая 2020 года № 7128
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы на 2020 год
  kaz: 2020 жылға арналған ата – анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата – анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, пробация қызметінің есебінде тұрған адамдарды, сондай- ақ бас бостандығынан айыру орындарынан босатылған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

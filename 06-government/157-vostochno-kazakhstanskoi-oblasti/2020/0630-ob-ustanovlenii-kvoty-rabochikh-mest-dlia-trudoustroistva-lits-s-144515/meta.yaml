requisite: Постановление акимата Жарминского района Восточно-Казахстанской области от 30 июня 2020 года № 271. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 июля 2020 года № 7267. Утратило силу постановлением акимата Жарминского района Восточно-Казахстанской области от 6 мая 2021 года № 204 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Сурка (правый и левый берег) в створе земельного участка, расположенного в 3 км севернее села Улкен Нарын Катон-Карагайского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданы Үлкен Нарын ауылынан солтүстікке қарай 3 км жерде орналасқан жер учаскесі тұстамасындағы Сурка өзенінің (оң және сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы магистрального канала «Ровенский» в створе земельного участка, предназначенного для реализации через конкурс, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы конкурс арқылы өткізуге арналған жер учаскесі тұстамасындағы «Ровенский» магистралдық каналының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

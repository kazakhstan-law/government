  title:
    rus: О внесении изменений в постановление акимата Уланского района от 30 декабря 2020 года  № 428 «Об  определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельских населенных пунктах»
    kaz: Ұлан ауданы әкімдігінің 2020 жылғы 30 желтоқсандағы № 428 «Азаматтық қызметшілер болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

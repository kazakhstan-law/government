title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Карасу в створе испрашиваемого земельного участка, расположенного в учетном квартале 05-079-041 (в 7,9 км южнее села Митрофановка) в Уланском районе Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданының аумағында 05-079-041 есептік кварталында (Митрофановка ауылының оңтүстігіне қарай 7,9 км) сұралып отырған жер учаскесінің тұстамасындағы Қарасу өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

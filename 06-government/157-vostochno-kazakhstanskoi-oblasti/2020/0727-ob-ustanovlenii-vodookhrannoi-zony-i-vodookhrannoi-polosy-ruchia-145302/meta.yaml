title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия (левобережная сторона) в районе села Ушбулак, в створе испрашиваемого земельного участка, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданы Үшбұлақ ауылы ауданындағы сұралып отырған жер учаскесінің тұстамасындағы атауы жоқ бұлақтың (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

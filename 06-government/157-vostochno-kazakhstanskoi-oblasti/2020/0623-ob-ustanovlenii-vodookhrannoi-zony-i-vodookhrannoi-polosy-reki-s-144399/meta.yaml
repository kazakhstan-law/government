title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Сибинка (левый берег) в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскесі тұстамасындағы Сибинка өзенінің (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '144401'
requisite: Постановление Восточно-Казахстанского областного акимата от 23 июня 2020 года № 211. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 1 июля 2020 года № 7242
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Буланды, ручьев Инженер и без названия в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Бұланды өзені, Инженер және атауы жоқ бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

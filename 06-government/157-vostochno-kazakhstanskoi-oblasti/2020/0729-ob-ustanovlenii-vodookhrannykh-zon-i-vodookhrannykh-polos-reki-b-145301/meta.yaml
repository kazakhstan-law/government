act_code: '145301'
requisite: Постановление Восточно-Казахстанского областного акимата от 29 июля 2020 года № 258. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 августа 2020 года № 7426
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Большая Буконь, ручьев Бокенбай, Нурлыбай, без названия №№ 1-4 в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскесінің тұстамасындағы Үлкен Бөкен өзені, Бөкенбай, Нұрлыбай, атауы жоқ №№ 1-4 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '151052'
requisite: Постановление Восточно-Казахстанского областного акимата от 29 декабря 2020 года № 483. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 декабря 2020 года № 8130
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев без названия №№ 1, 2, 3, 4, 5, 6, 7, 8 в створе земельных участков, предназначенных для проведения разведки золотосодержащих руд на блоках М-44-93 (10г-5а-24) и М-44-93 (10г-5в-4), расположенных в 7 км к юго-востоку от села Койтас Жарминского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданы Қойтас ауылынан оңтүстік-шығысқа қарай 7 км жерде орналасқан М-44-93 (10г-5а-24) және М-44-93 (10г-5в-4) блоктарында құрамында алтыны бар кендерге барлау жүргізуге арналған жер учаскелерінің тұстамасындағы №№ 1, 2, 3, 4, 5, 6, 7, 8 атауы жоқ бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

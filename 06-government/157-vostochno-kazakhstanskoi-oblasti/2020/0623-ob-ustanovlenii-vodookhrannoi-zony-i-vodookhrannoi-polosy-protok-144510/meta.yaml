title:
  rus: Об установлении водоохранной зоны и водоохранной полосы протоки Тихая реки Иртыш в створе испрашиваемого земельного участка в районе села Ново-Явленка города Усть-Каменогорск Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласы Ново-Явленка ауылы аумағындағы сұралып отырған жер учаскесі тұстамасындағы Ертіс өзені Тихая ағысының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Мельничная, ручьев Ревнюха и без названия в районе Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы Мельничная шағын өзенінің, Ревнюха және атауы жоқ бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

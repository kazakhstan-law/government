act_code: '142574'
requisite: Постановление акимата Аягозского района Восточно-Казахстанской области от 20 апреля 2020 года № 193. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 мая 2020 года № 7039. Утратило силу постановлением акимата Аягозского района области Абай от 21 декабря 2023 года № 169 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

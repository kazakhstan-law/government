title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Кимастинские ключи в створе земельных участков №№ 507, 508, 544, расположенных в 27 жилом районе города Усть-Каменогорска Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласының 27 тұрғын ауданында орналасқан №№ 507, 508, 544 жер учаскелерінің тұстамасындағы Кимастин бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

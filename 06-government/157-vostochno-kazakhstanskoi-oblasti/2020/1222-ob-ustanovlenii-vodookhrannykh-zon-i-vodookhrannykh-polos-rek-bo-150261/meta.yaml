title:
  rus: 'Об установлении водоохранных зон и водоохранных полос рек Большая и Малая Шыбынды и их притоков: ручьев без названия, Лабыза, Левый ключ в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования'
  kaz: 'Шығыс Қазақстан облысы Ұлан ауданындағы Үлкен және Кіші Шыбынды өзендері мен олардың салалары: атауы жоқ, Лабыза, Левый ключ бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы'

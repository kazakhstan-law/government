requisite: Постановление Восточно-Казахстанского областного акимата от 24 августа 2020 года № 291. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 августа 2020 года № 7488
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Боко (левый берег) в районе расположения карьера Жалпак - Тобе товарищества с ограниченной ответственностью «Шұғыла Gold» в Жарминском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданындағы «Шұғыла Gold» жауапкершілігі шектеулі серіктестігінің Жалпақ-Төбе карьері орналасқан ауданындағы Боко өзенінің (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

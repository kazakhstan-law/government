  title:
    rus: О внесении изменения в постановление акимата Жарминского района Восточно-Казахстанской области от 30 ноября 2020 года № 432 «Об утверждении коэффициентов зонирования, учитывающих месторасположение объекта налогообложения в населенных пунктах Жарминского района»
    kaz: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2020 жылғы 30 қарашадағы № 432 «Жарма ауданының елді мекендеріндегі салық салу объектіcінің орналасқан жерін ескеретін аймаққа бөлу коэффициенттерін бекіту туралы» қаулысына өзгеріс енгізу туралы

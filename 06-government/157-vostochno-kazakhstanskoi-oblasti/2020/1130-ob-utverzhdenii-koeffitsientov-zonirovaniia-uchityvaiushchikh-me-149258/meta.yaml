requisite: Постановление акимата Жарминского района Восточно-Казахстанской области от 30 ноября 2020 года № 432. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 декабря 2020 года № 7910. Утратило силу постановлением акимата Жарминского района области Абай от 8 апреля 2026 года № 120 (вводится в действие после дня его первого официального опубликования)

act_code: '143586'
requisite: Постановление Восточно-Казахстанского областного акимата от 4 июня 2020 года № 183. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 июня 2020 года № 7152
title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Саркырама и ее притоков ручьев без названия № 1, № 2, № 3, № 4 в створе земельных участков, предназначенных для реализации через аукцион для выпаса сельскохозяйственных животных, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданында ауыл шаруашылығы жануарларын жаю үшін аукцион арқылы өткізуге арналған жер учаскелерінің тұстамасындағы Сарқырама өзенінің және атауы жоқ № 1, № 2, № 3, № 4 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

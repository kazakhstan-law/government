act_code: '143587'
requisite: Постановление Восточно-Казахстанского областного акимата от 4 июня 2020 года № 184. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 июня 2020 года № 7153
title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Теректы, ее притока ручья без названия № 1 и ручья без названия № 2 в створе земельного участка, предназначенного для реализации через аукцион для выпаса сельскохозяйственных животных, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданында ауыл шаруашылығы жануарларын жаю үшін аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Теректі өзені және оның сағасы атауы жоқ № 1 бұлақ және атауы жоқ № 2 бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

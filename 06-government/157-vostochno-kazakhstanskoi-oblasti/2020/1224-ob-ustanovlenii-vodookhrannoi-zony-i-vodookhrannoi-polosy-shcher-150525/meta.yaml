title:
  rus: Об установлении водоохранной зоны и водоохранной полосы Щербаковского водохранилища, закрепленного за товариществом с ограниченной ответственностью «АкваФиш», расположенного в Кокентауском сельском округе города Семей Восточно – Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Семей қаласы Көкентау ауылдық округінде орналасқан «АкваФиш» жауапкершілігі шектеулі серіктестігіне бекітілген Щербаково су қоймасының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Дунгурсай в створе земельного участка, предназначенного для реализации через аукцион в Курчумском районе Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Дүңгірсай бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '145308'
requisite: Постановление Восточно-Казахстанского областного акимата от 22 июля 2020 года № 248. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 августа 2020 года № 7431
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Иртыш и проток в районе села Ново-Явленка в створе земельных участков, предоставляемых товариществу с ограниченной ответственностью «ВЕРФ-строй» для проведения разведки с последующей добычей песчано-гравийной смеси, на территории города Усть-Каменогорск Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласының аумағында барлау жүргізіп, кейіннен құм-қиыршықтас қоспасын өндіру үшін «ВЕРФ-строй» жауапкершілігі шектеулі серіктестігіне берілетін жер учаскелерінің тұстамасындағы Ново-Явленка ауылы ауданындағы Ертіс өзені мен ағысына су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление акимата Аягозского района Восточно-Казахстанской области от 20 апреля 2020 года № 194. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 23 апреля 2020 года № 6991. Утратило силу постановлением акимата Аягозского района Восточно-Казахстанской области от 16 апреля 2021 года № 365 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы

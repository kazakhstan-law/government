title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Шелекты в створе испрашиваемого земельного участка, расположенного в учетном квартале 05-079-015 (в 6,0 км юго-западнее села Айыртау) в Уланском районе Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы 05-079-015 есептік кварталында (Айыртау ауылынан оңтүстік-батысқа қарай 6,0 км) сұралып отырған жер учаскесінің тұстамасындағы Шелекті бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

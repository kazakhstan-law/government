title:
  rus: Об установлении водоохранных зон и водоохранных полос протоки реки Иртыш и ручья без названия в створе испрашиваемого земельного участка в районе села Макеевка Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Макеевка ауылы аумағында сұралып отырған жер учаскесі тұстамасындағы Ертіс өзені сағасының және атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

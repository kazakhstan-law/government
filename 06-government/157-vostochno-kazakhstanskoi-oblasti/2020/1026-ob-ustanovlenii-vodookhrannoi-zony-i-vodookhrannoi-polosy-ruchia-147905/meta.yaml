title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

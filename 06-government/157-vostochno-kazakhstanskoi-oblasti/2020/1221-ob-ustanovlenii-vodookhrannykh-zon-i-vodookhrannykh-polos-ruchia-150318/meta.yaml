act_code: '150318'
requisite: Постановление Восточно-Казахстанского областного акимата от 21 декабря 2020 года № 442. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 23 декабря 2020 года № 8016
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья без названия № 1 (левый берег) и ручья без названия № 2 (правый берег) в створе земельного участка, расположенного в 6,2 км севернее города Риддер Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласынан солтүстікке қарай 6,2 км орналасқан жер учаскесі тұстамасындағы атауы жоқ № 1 (сол жағалау) және № 2 (оң жағалау) бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '148360'
requisite: Постановление Восточно-Казахстанского областного акимата от 2 ноября 2020 года № 390. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 ноября 2020 года № 7783
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Буланды, ручья Караайгыр и ручьев без названия №№ 1, 2 в створе земельного участка, предназначенного для реализации через аукцион для выпаса сельскохозяйственных животных на территории Курчумского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданы аумағында ауыл шаруашылығы жануарларын жаю үшін аукцион арқылы өткізуге арналған жер учаскесінің тұстамасындағы Бұланды өзенінің, Қараайғыр бұлағы мен атауы жоқ №№ 1, 2 бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

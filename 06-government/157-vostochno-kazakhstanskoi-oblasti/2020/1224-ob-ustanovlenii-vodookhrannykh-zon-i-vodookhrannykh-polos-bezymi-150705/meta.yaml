act_code: '150705'
requisite: Постановление Восточно-Казахстанского областного акимата от 24 декабря 2020 года № 457. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 декабря 2020 года № 8052
title:
  rus: Об установлении водоохранных зон и водоохранных полос безымянных ручьев № 1 и № 2 в створе земельного участка, расположенного в 4,9 км северо – западнее поселка Новая Бухтарма района Алтай Восточно – Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданы Жаңа Бұқтырма кентінен солтүстік – батысқа қарай 4,9 км қашықтықта орналасқан жер учаскесі тұстамасындағы атауы жоқ № 1 және № 2 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

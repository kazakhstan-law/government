act_code: '144720'
requisite: Постановление Восточно-Казахстанского областного акимата от 2 июля 2020 года № 218. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 июля 2020 года № 7322
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья без названия № 1 и впадающего в озеро Карамырза ручья без названия № 2 в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданында аукцион арқылы өткізуге арналған жер учаскесінің тұстамасындағы атауы жоқ № 1, және Қарамырза көліне құятын атауы жоқ № 2 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

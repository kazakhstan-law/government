act_code: '142992'
requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 22 апреля 2020 года № 110. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 мая 2020 года № 7087. Утратило силу постановлением акимата Шемонаихинского района Восточно-Казахстанской области от 6 января 2021 года № 01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін белгілеу туралы

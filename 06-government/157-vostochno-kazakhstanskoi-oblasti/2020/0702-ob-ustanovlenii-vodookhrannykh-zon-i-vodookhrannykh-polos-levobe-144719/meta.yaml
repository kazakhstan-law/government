title:
  rus: Об установлении водоохранных зон и водоохранных полос левобережной стороны реки Филипповка и ручьев без названия №№ 1, 2 в створе испрашиваемого земельного участка в районе рудника Шубин города Риддер Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласының Шубин кеніші ауданындағы Филипповка өзенінің сол жағалауының және №№ 1, 2 атауы жоқ бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

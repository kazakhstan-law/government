requisite: Постановление Восточно-Казахстанского областного акимата от 24 августа 2020 года № 297. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 августа 2020 года № 7494
title:
  rus: Об установлении водоохранных зон и полос реки Белая Уба (левый берег) и реки Большая Разливанка (левый берег) на испрашиваемом крестьянским хозяйством «Гемма» земельном участке, расположенном в учетном квартале 05-083-051, район урочища Серый Луг, города Риддер Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласы Серый Луг шатқалы ауданы 05-083-051 есептік кварталында орналасқан «Гемма» шаруа қожалығы сұрап отырған жер учаскесінде Белая Уба (сол жағалау) өзенінің және Большая Разливанка (сол жағалау) өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

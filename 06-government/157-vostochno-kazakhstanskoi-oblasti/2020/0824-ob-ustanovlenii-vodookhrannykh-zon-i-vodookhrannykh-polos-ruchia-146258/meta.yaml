title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Безымянный в створе земельного участка, предоставляемого для ведения сельского подсобного хозяйства, расположенного на землях запаса в Глубоковском районе Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданының босалқы жерлерінде орналасқан қосалқы ауыл шаруашылығын жүргізу үшін беріліп отырған жер учаскесі тұстамасындағы Безымянный бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

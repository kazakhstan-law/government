requisite: Постановление акимата города Риддера Восточно-Казахстанской области от 11 июня 2020 года № 356. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 июня 2020 года № 7195. Утратило силу постановлением акимата города Риддера Восточно-Казахстанской области от 23 декабря 2020 года № 843 (вводится в действие с 01.01.2021)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2020 год
  kaz: 2020 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

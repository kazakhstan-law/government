act_code: '147898'
requisite: Постановление Восточно-Казахстанского областного акимата от 26 октября 2020 года № 380. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 октября 2020 года № 7727
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Ертенбулак и ручья без названия в створе испрашиваемого земельного участка (в 7 км юго-западнее села Акжартас) в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданында сұралып отырған жер учаскесі тұстамасындағы (Ақжартас ауылынан оңтүстік-батысқа қарай 7 км) Ертенбұлақ бұлағы мен атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Крестовка в створе земельного участка, предоставляемого товариществу с ограниченной ответственностью «Нивы Чапаево», в районе Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы «Нивы Чапаево» жауапкершілігі шектеулі серіктестігіне берілетін жер учаскесі тұстамасындағы Крестовка бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Черемшанка, ее притока ручья Аксенов лог и истоков ручья Тополевка в створе земельного участка на территории района Алтай Восточно – Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданы аумағындағы жер учаскесі тұстамасындағы Черемшанка өзені, оның ағыны Аксенов лог бұлағы мен Тополевка бұлағы бастауларының су қорғау аймақтары мен су қорғау белдеулері және оларды шаруашылыққа пайдалану режимін белгілеу туралы

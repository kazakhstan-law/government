act_code: '145453'
requisite: Постановление Восточно-Казахстанского областного акимата от 3 августа 2020 года № 264. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 августа 2020 года № 7443
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Аягоз и ее притоков ручьев без названия 1 и без названия 2 в створе земельных участков, предоставляемых товариществу с ограниченной ответственностью «АBS групп» для добычи общераспространенных полезных ископаемых на территории Аягозского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Аягөз ауданы аумағындағы кең таралған пайдалы қазбаларды өндіру үшін «АBЅ групп» жауапкершілігі шектеулі серіктестігіне берілетін жер учаскелерінің тұстамасындағы Аягөз өзені және оның ағыстары атауы жоқ 1 және атауы жоқ 2 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '141890'
requisite: Постановление Восточно-Казахстанского областного акимата от 14 апреля 2020 года № 124. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 апреля 2020 года № 6908
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья без названия № 1 (левый берег) и ручья без названия № 2 (правый берег) в районе Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы атауы жоқ № 1 бұлақтың (сол жағалау) және атауы жоқ № 2 бұлақтың (оң жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Терисайрык и ее притока ручья без названия в створе земельного участка на территории Жарминского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданы аумағындағы қатты пайдалы қазбаларды барлау үшін ұсынылатын жер учаскесі тұстамасындағы Терісайрық шағын өзені мен оның саласы атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

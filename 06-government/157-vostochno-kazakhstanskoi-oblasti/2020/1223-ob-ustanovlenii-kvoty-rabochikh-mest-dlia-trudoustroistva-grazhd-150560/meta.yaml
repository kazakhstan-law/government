act_code: '150560'
requisite: Постановление акимата города Риддера Восточно-Казахстанской области от 23 декабря 2020 года № 843. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 декабря 2020 года № 8034
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2021 год
  kaz: Ата-анасынан кәмелеттік жасқатолғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін 2021 жылға арналған жұмыс орындарына квота белгілеу туралы

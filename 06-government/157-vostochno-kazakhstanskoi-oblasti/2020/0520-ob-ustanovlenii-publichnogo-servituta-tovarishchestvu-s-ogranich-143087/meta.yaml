title:
  rus: Об установлении публичного сервитута товариществу с ограниченной ответственностью «Казникель» для проведения разведки полезных ископаемых и геологического изучения на территории Жетижарского сельского округа в районе месторождения «Горностаевское»
  kaz: «Казникель» жауапкершілігі шектеулі серіктестігіне пайдалы қазбаларды барлау және геологиялық зерттеуді жүргізу үшін Жетіжар ауылдық округінің аумағындағы «Горностаевское» кен орынында қауымдық сервитут орнату туралы

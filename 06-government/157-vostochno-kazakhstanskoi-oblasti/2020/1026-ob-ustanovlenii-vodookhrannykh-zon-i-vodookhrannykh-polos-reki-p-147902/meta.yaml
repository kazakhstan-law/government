act_code: '147902'
requisite: Постановление Восточно-Казахстанского областного акимата от 26 октября 2020 года № 382. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 октября 2020 года № 7730
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Песчанка (правый и левый берег) и ручьёв без названия № 1-6 (правый и левый берег) в створе земельного участка в районе села Пролетарка Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Пролетарка ауылының аумағындағы жер учаскесі тұстамасындағы Песчанка өзені (оң және сол жақ жағалауы) мен атауы жоқ № 1-6 бұлақтардың (оң және сол жақ жағалауы) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

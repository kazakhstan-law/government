title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручьев Быстрый ключ и Безымянный на участке проектируемого строительства шахтных стволов "Вентиляционный" и "Обручевский" Риддерского горно-обогатительного комплекса товарищества с ограниченной ответственностью "Казцинк" и режима их хозяйственного использования
  kaz: '"Қазмырыш" жауапкершілігі шектеулі серіктестігінің Риддер тау-кен байыту  кешенінің "Вентиляционный" және "Обручевский" шахта діңдерінің құрылысы жобаланып отырған учаскеде Быстрый ключ және Безымянный бұлақтарының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы'

act_code: '70491'
requisite: Постановление Восточно-Казахстанского областного акимата от 28 декабря 2012 года № 338. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 января 2013 года № 2860. Утратило силу - постановлением Восточно-Казахстанского областного акимата от 12 августа 2013 года № 212
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление вида деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуi және өткiзу жөніндегі қызмет түрін жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" электрондық мемлекеттік қызмет регламентін бекіту туралы'

title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдарын бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгiлеу туралы

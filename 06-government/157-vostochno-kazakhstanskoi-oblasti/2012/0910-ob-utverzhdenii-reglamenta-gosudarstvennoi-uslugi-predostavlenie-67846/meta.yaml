act_code: '67846'
requisite: Постановление Восточно-Казахстанского областного акимата от 10 сентября 2012 года № 215. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 1 октября 2012 года за № 2682. Утратило силу - постановлением Восточно-Казахстанского областного акимата от 12 августа 2013 года № 212
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтiк қолдау шараларын ұсыну" мемлекеттiк қызмет көрсету регламентiн бекiту туралы'

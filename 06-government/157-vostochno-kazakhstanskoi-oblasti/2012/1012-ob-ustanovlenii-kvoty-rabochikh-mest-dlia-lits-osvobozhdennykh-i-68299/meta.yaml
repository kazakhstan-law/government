act_code: '68299'
requisite: Постановление акимата Урджарского района Восточно-Казахстанской области от 12 октября 2012 года N 410. Зарегистрировано департаментом юстиции Восточно-Казахстанской области 31 октября 2012 года N 2710. Утратило силу -  постановлением акимата Урджарского района от 01 апреля 2013 года N 153
title:
  rus: Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы, и несовершеннолетним выпускникам интернатных организаций, а также для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции
  kaz: Бас бостандығынан айыру орындарынан босатылған тұлғалар, интернаттық ұйымдарды бітіруші кәмелетке толмағандар, сондай-ақ қылмыстық-атқару нспекциясы пробация қызметінің есебінде тұрған адамдар үшін жұмыс орындарына квота белгілеу туралы

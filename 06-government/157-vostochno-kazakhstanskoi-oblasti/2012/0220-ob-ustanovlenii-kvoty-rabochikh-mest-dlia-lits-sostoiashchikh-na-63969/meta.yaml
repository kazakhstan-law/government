  title:
    rus: О внесении изменений в постановление акимата от 20 февраля 2012 года № 73 "Об установлении квоты рабочих мест для лиц, освободившихся из мест лишения свободы, и для несовершеннолетних выпускников интернатных организаций"
    kaz: '"Бас бостандығынан айыру орындарынан босатылған тұлғаларға және интернаттық ұйымдардың кәмелетке толмаған түлектеріне жұмыс орындары квотасын белгілеу туралы" әкімдігінің 2012 жылғы 20 ақпандағы № 73 қаулысына өзгерістер енгізу туралы'

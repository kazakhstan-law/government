act_code: '69027'
requisite: Постановление Зайсанского районного акимата Восточно-Казахстанской области от 9 ноября 2012 года № 1254. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 7 декабря 2012 года № 2754. Утратило силу - постановлением Зайсанского районного акимата от 28 марта 2013 года № 1519
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также освободившихся из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

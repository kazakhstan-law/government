  kaz: Глубокое ауданындағы "Hambledon Mining Company Limited" Компаниясының "Секисовское" тау-кен кәсіпорны" еншілес жауапкершілігі шектеулі серіктестігінің тау–кен байыту кешенінің жер учаскесінің тұсында Секисовка және Волчевка өзендерінің су қорғау аймағы мен су қорғау  белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

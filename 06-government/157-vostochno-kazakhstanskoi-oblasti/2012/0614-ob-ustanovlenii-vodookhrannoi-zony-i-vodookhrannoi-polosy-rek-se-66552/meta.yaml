title:
  rus: Об установлении водоохранной зоны и водоохранной полосы рек Секисовка и Волчевка в створе земельного участка горно-обогатительного комплекса дочернего товарищества с ограниченной ответственностью "Горнорудное предприятие "Секисовское" Компании "Hambledon Mining Company Limited" в Глубоковском районе и режима их хозяйственного использования
  kaz: Глубокое ауданындағы "Hambledon Mining Company Limited" Компаниясының "Секисовское" тау-кен кәсіпорны" еншілес жауапкершілігі шектеулі серіктестігінің тау–кен байыту кешенінің жер учаскесінің тұсында Секисовка және Волчевка өзендерінің су қорғау аймағы мен су қорғау  белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

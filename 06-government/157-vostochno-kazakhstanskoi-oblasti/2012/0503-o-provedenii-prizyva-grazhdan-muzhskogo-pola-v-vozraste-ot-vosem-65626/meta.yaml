requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 3 мая 2012 года № 363. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 21 мая 2012 года за № 5-8-150. Утратило силу в связи с истечением срока действия (письмо аппарата акима Бородулихинского района Восточно-Казахстанской области от 04 апреля 2013 года № 911)
title:
  rus: О проведении призыва граждан мужского пола в возрасте от восемнадцати до двадцати семи лет на срочную воинскую службу в апреле-июне и октябре-декабре 2012 года

act_code: '63221'
requisite: Постановление акимата Абайского района Восточно-Казахстанской области от 23 января 2012 года № 148. Зарегистрировано Управлением юстиции Абайского района Департамента юстиции Восточно-Казахстанской области 7 февраля 2012 года за № 5-5-137. Утратило силу постановлением акимата Абайского района Восточно-Казахстанской области от 26 марта 2013 года № 386
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясының пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшiн жұмыс орындарына квота белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата от 23 января 2012 года № 148 "Об установлении квоты рабочих мест для несовершеннолетних выпускников интернатных организаций и лиц, освобожденных из мест лишения свободы"
    kaz: '"Интернат ұйымдарының кәмелетке толмаған түлектерi және бас бостандығынан айыру орындарынан босатылған тұлғалар үшiн жұмыс орындарының квотасын белгiлеу туралы" әкімдіктің 2012 жылғы 23 қаңтардағы № 148 қаулысына өзгерістер енгізу туралы'

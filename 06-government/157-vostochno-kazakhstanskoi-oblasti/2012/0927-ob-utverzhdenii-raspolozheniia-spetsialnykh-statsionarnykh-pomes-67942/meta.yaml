title:
  rus: Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения и согласовании  расположения помещений для проведения религиозных обрядов за пределами культовых зданий (сооружений)
  kaz: Дiни әдебиеттi және дiни мазмұндағы өзге де ақпараттық материалдарды, дiни мақсаттағы заттарды тарату үшiн арнайы тұрақты үй-жайлардың орналастырылуын бекiту, ғибадат үйлерiнен (ғимараттарынан) тыс жерлерде дiни жораларды өткiзуге арналған үй-жайлардың орналастырылуын келiсу туралы

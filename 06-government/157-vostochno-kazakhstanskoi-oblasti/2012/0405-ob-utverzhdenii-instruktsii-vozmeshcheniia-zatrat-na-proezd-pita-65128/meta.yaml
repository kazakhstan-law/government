  kaz: Кәсіби оқытуға жіберілген табысы аз адамдар қатарындағы жұмыспен қамтылғандардың және жеті жасқа дейінгі балаларды бағып-күтумен айналысатын адамдардың, сондай-ақ, жұмыссыз азаматтардың жол жүру, тамақтану, түру және медициналық куәландыру шығындарын өтеудің Нұсқаулығын бекіту туралы

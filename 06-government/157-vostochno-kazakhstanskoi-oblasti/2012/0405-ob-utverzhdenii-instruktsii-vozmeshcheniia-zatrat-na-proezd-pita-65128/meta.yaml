requisite: Постановление акимата города Риддера Восточно-Казахстанской области от 5 апреля 2012 года № 205. Зарегистрировано управлением юстиции города Риддера Департамента юстиции Восточно-Казахстанской области 2 мая 2012 года за № 5-4-167. Утратило силу - постановлением акимата города Риддера от 26 февраля 2013 года № 126
title:

act_code: '68631'
requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 19 октября 2012 года № 461. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 ноября 2012 года за № 2722. Утратило силу - постановлением Глубоковского районного акимата от 27 марта 2013 года № 206
title:
  rus: Об установлении квоты рабочих мест для инвалидов, лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Мүгедектер, қылмыстық-атқару инспекциясының пробация қызметінің есебінде тұрған тұлғалар үшін, сонымен қатар бас бостандығынан айыру орындарынан босатылған тұлғалар және интернат ұйымдарының кәмелетке толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы

act_code: '68703'
requisite: Постановление Уланского районного акимата Восточно-Казахстанской области от 1 ноября 2012 года № 437. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 ноября 2012 года № 2726. Утратило силу постановлением Уланского районного акимата от 27 января 2014 года № 384
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясының пробация қызметінің есебінде тұрған тұлғалар үшін, сонымен қатар бас бостандығынан айыру орындарынан босатылған тұлғалар және интернат ұйымдарының кәмелетке толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы

act_code: '69751'
requisite: Постановление акимата Курчумского района Восточно-Казахстанской области от 5 декабря 2012 года № 2698. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 декабря 2012 года № 2792. Утратило силу - постановлением акимата Курчумского района от 24 июня 2013 года № 2949
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдарын бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

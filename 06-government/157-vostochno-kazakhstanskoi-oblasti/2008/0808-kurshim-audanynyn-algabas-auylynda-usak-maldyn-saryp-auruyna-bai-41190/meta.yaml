requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2008 жылғы 8 тамыздағы № 776 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2008 жылғы 14 тамызда № 5-14-72 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2009 жылғы 9 қарашадағы № 1370 қаулысымен

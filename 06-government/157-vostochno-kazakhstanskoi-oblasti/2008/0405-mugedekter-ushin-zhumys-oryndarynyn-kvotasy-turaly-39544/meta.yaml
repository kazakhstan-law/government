act_code: '39544'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық әкімдігінің 2008 жылғы 5 сәуірдегі № 3313 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық Әділет басқармасында 2008 жылғы 18 сәуірде № 5-13-44 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды (Катонқарағай ауданы әкімдігінің 2011 жылғы 23 ақпандағы № 02-15/30 хаты)

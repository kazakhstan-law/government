act_code: '42679'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2008 жылғы 2 желтоқсандағы № 129 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2008 жылғы 4 желтоқсанында № 5-6-84 тіркелді. Күші жойылды - Аягөз ауданы әкімдігінің 2010 жылғы 16 сәуірдегі № 2137 қаулысымен

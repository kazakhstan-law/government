  title:
    rus: О внесении изменения в постановление от 18 января 2008 года № 421 "Об определении перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, которым установлено повышение к должностным окладам за работу в аульной (сельской) местности"
    kaz: '"Ауылдық (селолық) жердегі жұмысы үшін лауазымдық айлықақыларын көтеру белгіленген денсаулық сақтау, әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мамандары лауазымдарының тізбесін айқындау туралы" 2008 жылғы 18 қаңтардағы № 421 қаулыға өзгеріс енгізу туралы'

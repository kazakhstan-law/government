act_code: '38118'
requisite: Постановление акимата Восточно-Казахстанской области от 18 января 2008 года N 421. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 февраля 2008 года за N 2477. Утратило силу - постановлением акимата Восточно-Казахстанской области от 20.04.2016 № 118
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности областных администраторов бюджетных программ
  kaz: Облыстық бюджеттік бағдарламалар әкімшілерінің азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

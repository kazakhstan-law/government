act_code: '41356'
requisite: Шығыс Қазақстан облысы Ұлан аудандық әкімдігінің 2008 жылғы 6 тамыздағы № 820 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2008 жылғы 19 тамызда № 5-17-89 тіркелді. Күші жойылды - Ұлан аудандық әкімдігінің 2009 жылғы 3 шілдедегі № 05/2059 хатымен
title:

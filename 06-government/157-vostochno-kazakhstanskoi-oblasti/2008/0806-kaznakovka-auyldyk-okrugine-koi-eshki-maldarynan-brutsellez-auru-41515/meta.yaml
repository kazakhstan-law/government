requisite: Шығыс Қазақстан облысы Көкпекті аудандық әкімиятының 2008 жылғы 6 тамыздағы № 11875 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2008 жылғы 4 қыркүйекте № 5-15-42 тіркелді. Күші жойылды - ШҚО Көкпекті аудандық әкімдігінің 2009 жылғы 16 қарашадағы № 380 қаулысымен

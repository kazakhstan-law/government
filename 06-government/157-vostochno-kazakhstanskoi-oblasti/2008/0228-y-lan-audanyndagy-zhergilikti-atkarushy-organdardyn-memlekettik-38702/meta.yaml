act_code: '38702'
requisite: Шығыс Қазақстан облысы Ұлан ауданының әкімдігінің 2008 жылғы 28 ақпандағы № 526 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2008 жылғы 24 наурызда № 5-17-79 тіркелді

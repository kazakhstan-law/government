act_code: '39423'
requisite: Шығыс Қазақстан облысы Күршім ауданының әкімдігінің 2008 жылғы 14 сәуірдегі № 670 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2008 жылғы 28 сәуірде № 5-14-66 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2009 жылғы 28 тамыздағы № 1320 қаулысымен

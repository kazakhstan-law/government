act_code: '38860'
requisite: Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2008 жылғы 3 наурыздағы № 372 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2008 жылғы 9 сәуірде № 5-5-76 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 16 маусымдағы № 222 қаулысымен

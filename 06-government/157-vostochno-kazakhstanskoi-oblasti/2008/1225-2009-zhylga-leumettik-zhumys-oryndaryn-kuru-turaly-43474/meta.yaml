act_code: '43474'
requisite: Шығыс Қазақстан облысы Катон-Қарағай аудандық әкімдігінің 2008 жылғы 25 желтоқсандағы № 3738 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Катон-Қарағай аудандық Әділет басқармасында 2009 жылғы 14 қаңтарда № 5-13-53 тіркелді. Қаулының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Катонқарағай ауданы әкімінің 2010 жылғы 12 қаңтардағы № 6 хатымен

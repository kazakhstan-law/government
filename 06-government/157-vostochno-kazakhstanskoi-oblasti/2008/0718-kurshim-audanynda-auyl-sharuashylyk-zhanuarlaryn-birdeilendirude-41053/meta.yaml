act_code: '41053'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2008 жылғы 18 шілдедегі № 766 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2008 жылғы 7 тамызда № 5-14-71 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2011 жылғы 20 маусымдағы № 2120 қаулысымен

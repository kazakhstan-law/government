act_code: '40218'
requisite: Шығыс Қазақстан облысы Зайсан ауданының әкімдігінің 2008 жылғы 29 мамырдағы № 316 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2008 жылғы 25 маусымда № 5-11-79 тіркелді. Күші жойылды - Зайсан ауданы әкімдігінің 2009 жылғы 9 шілдедегі № 776 қаулысымен
title:

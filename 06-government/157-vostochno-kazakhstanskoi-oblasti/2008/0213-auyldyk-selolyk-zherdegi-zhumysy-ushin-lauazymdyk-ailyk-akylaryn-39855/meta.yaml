act_code: '39855'
requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімдігінің 2008 жылғы 13 ақпандағы № 509 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2008 жылғы 22 мамырда № 5-17-84 тіркелді. Күші жойылды - Ұлан ауданы әкімдігінің 2014 жылғы 27 маусымдағы № 652 қаулысымен

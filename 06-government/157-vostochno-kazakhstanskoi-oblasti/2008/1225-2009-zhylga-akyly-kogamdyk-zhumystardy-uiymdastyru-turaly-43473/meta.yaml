act_code: '43473'
requisite: Шығыс Қазақстан облысы Катонқарағай ауданы әкімдігінің 2008 жылғы 25 желтоқсандағы № 3739 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық Әділет басқармасында 2009 жылғы 14 қаңтарда № 5-13-52 тіркелді. Қаулының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Катонқарағай ауданы әкімінің 2010 жылғы 12 қаңтардағы № 6 хатымен

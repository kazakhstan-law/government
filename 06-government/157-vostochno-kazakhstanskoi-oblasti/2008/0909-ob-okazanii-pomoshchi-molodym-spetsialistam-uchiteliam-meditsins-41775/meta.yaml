act_code: '41775'
requisite: Постановление акимата Зыряновского района Восточно-Казахстанской области от 9 сентября 2008 года № 541. Зарегистрировано Управлением юстиции Зыряновского района Департамента юстиции Восточно-Казахстанской области 22 сентября 2008 года за № 5-12-69. Утратило силу постановлением акимата Зыряновского района от 20 мая 2009 года № 37
title:
  rus: Об оказании помощи молодым специалистам (учителям, медицинским работникам) из числа малообеспеченных семей (граждан), желающим работать в населенных пунктах Зыряновского района после завершения учебного заведения
  kaz: Оқу орнын аяқтағаннан кейін Зырян ауданының елді мекендерінде жұмыс істеуге ниет білдірген табысы аз отбасыларынан (азаматтардан) шыққан жас мамандарға (мұғалімдерге, медицина қызметкерлеріне) материалдық көмек көрсету туралы

requisite: ығыс Қазақстан облысы Абай ауданы әкімдігінің 2008 жылғы 3 наурыздағы № 371 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2008 жылғы 9 сәуірде № 5-5-75 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай аудандық мәслихатының 2009 жылғы 31 наурыздағы № 10 шешімімен

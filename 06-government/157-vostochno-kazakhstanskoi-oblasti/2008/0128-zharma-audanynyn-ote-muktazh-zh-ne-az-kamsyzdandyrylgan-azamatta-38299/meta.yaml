act_code: '38299'
requisite: Шығыс Қазақстан облысы Жарма аудандық әкімдігінің 2008 жылғы 28 қаңтардағы № 38 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық Әділет басқармасында 2008 жылғы 15 ақпанда № 5-10-57 тіркелді. Күші жойылды - Жарма ауданы әкімдігінің 2009 жылғы 16 шілдедегі № 225 қаулысымен
title:

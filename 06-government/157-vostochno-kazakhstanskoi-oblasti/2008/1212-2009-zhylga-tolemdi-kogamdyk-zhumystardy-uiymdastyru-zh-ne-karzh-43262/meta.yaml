requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2008 жылғы 12 желтоқсандағы № 200 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2009 жылғы 5 қаңтарда № 5-6-87 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2009 жылғы 2 маусымдағы № 663 қаулысымен

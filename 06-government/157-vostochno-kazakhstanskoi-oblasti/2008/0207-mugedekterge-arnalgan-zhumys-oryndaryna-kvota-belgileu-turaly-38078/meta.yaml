requisite: Шығыс Қазақстан облысы Үржар аудандық әкімдігінің 2008 жылғы 7 ақпандағы № 22 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2008 жылғы 18 ақпанда № 5-18-56 тіркелді. Күші жойылды - Үржар аудандық әкімдігінің 2009 жылғы 5 мамырдағы № 297 қаулысымен

act_code: '42354'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2008 жылғы 24 қазандағы № 453 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2008 жылғы 14 қарашада № 5-16-63 тіркелді

act_code: '40871'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2008 жылғы 9 шілдедегі № 742 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2008 жылғы 24 шілдеде № 5-14-70 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2009 жылғы 9 қарашадағы № 1371 қаулысымен

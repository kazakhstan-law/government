requisite: Постановление акимата города Усть-Каменогорска Восточно-Казахстанской области от 7 ноября 2008 года № 1735. Зарегистрировано управлением юстиции города Усть-Каменогорска Восточно-Казахстанской области 27 ноября 2008 года за № 5-1-94. Прекращено действие по истечении срока, на который постановление было принято, на основании письма аппарата акима города Усть-Каменогорска от 10 января 2010 года № Ин-5/16

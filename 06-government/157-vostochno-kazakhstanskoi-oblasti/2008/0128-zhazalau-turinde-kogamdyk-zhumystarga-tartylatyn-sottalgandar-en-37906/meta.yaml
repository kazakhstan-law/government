act_code: '37906'
requisite: Шығыс Қазақстан облысы Жарма аудандық әкімдігінің 2008 жылғы 28 қаңтардағы № 37 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық Әділет басқармасында 2008 жылғы 7 ақпанда № 5-10-56 тіркелді. Күші жойылды - ШҚО Жарма ауданы әкімдігінің 2010 жылғы 16 сәуірдегі № 147 қаулысымен

act_code: '42353'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2008 жылғы 24 қазандағы N 452 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2008 жылғы 14 қарашада N 5-16-62 тіркелді

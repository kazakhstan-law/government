act_code: '42604'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2008 жылғы 14 қарашадағы № 895 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2008 жылғы 4 желтоқсанда № 5-14-75 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2008 жылғы 18 желтоқсандағы № 982 қаулысымен
title:

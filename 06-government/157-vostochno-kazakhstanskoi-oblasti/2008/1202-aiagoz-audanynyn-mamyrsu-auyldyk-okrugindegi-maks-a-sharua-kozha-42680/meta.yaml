act_code: '42680'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2008 жылғы 2 желтоқсандағы № 130 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2008 жылғы 4 желтоқсанда № 5-6-85 тіркелді. Күші жойылды - Аягөз ауданы әкімдігінің 2009 жылғы 29 мамырдағы № 612 қаулысымен

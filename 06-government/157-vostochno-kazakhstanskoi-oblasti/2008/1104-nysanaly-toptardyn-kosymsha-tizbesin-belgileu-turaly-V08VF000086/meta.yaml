requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2008 жылғы 4 қарашадағы № 107 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық әділет басқармасында 2008 жылғы 18 желтоқсанда № 5-6-86 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Аягөз ауданы әкімінің аппаратының 2012 жылғы 20 наурыздағы № 05/754 хаты)

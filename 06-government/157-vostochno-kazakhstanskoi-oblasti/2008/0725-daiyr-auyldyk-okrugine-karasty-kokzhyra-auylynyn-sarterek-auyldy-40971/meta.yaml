requisite: Шығыс Қазақстан облысы Зайсан ауданы әкімдігінің 2008 жылғы 25 шілдедегі № 412 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық әділет басқармасында 2008 жылғы 1 тамызда № 5-11-81 тіркелді. Күші жойылды - Зайсан ауданы әкімдігінің 2009 жылғы 28 тамыздағы № 832 қаулысымен
title:
  rus: Дайыр ауылдық округіне қарасты Көкжыра ауылының, Сартерек ауылдық округінің Сартерек ауылының тұрғындарының қой-ешкі малдарынан бруцеллез ауруы анықталуына байланысты шектеу іс-шараларын енгізе отырып ветеринариялық режим белгілеу туралы
  kaz: Дайыр ауылдық округіне қарасты Көкжыра ауылының, Сартерек ауылдық округінің Сартерек ауылының тұрғындарының қой-ешкі малдарынан бруцеллез ауруы анықталуына байланысты шектеу іс-шараларын енгізе отырып ветеринариялық режим белгілеу туралы

act_code: '39450'
requisite: Шығыс Қазақстан облысы Аягөз ауданының әкімдігінің 2008 жылғы 20 ақпандағы № 595 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2008 жылғы 4 сәуірде № 5-6-70 тіркелді. Күші жойылды - Аягөз ауданы әкімдігінің 2009 жылғы 29 мамырдағы № 612 қаулысымен

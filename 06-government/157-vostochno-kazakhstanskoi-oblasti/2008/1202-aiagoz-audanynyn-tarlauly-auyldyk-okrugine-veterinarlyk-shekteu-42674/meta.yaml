act_code: '42674'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2008 жылғы 2 желтоқсандағы № 124 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2008 жылғы 4 желтоқсанда № 5-6-79 тіркелді. Күші жойылды - Аягөз ауданы әкімдігінің 2010 жылғы 16 сәуірдегі № 2137 қаулысымен

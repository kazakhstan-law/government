act_code: '37409'
requisite: Постановление Риддерского городского акимата Восточно-Казахстанской области от 15 января 2008 года № 526. Зарегистрировано Управлением юстиции города Риддера Департамента юстиции Восточно-Казахстанской области 7 февраля 2008 года за № 5-4-80. Утратило силу постановлением акимата города Риддера от 27 мая 2009 года № 1625
title:
  rus: Об утверждении Инструкции по возмещению затрат за приобретение и установку индивидуальных приборов учета коммунальных услуг получателям жилищной и государственной адресной социальной помощи города Риддера
  kaz: Риддер қаласының тұрғын үй және мемлекеттік атаулы әлеуметтік көмегін алушыларына коммуналдық қызметтерді есептейтін жеке құралдарын сатып алу және орнату шығындарын өтеу бойынша Нұсқаулығын бекіту туралы

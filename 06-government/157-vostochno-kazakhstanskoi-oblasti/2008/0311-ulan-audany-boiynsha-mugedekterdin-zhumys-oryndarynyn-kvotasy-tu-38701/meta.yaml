act_code: '38701'
requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімдігінің 2008 жылғы 11 наурыздағы № 561 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2008 жылғы 21 наурызда № 5-17-78 тіркелді. Күші жойылды - Ұлан ауданы әкімдігінің 2013 жылғы 30 наурыздағы № 681 қаулысымен

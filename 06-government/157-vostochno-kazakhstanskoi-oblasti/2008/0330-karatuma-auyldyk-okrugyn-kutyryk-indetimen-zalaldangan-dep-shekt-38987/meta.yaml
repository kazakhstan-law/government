requisite: Шығыс Қазақстан облысы Үржар аудандық әкімдігінің 2008 жылғы 31 наурыздағы № 67 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2008 жылғы 10 сәуірде № 5-18-61 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2009 жылғы 17 маусымдағы № 385 қаулысымен

act_code: '38986'
requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2008 жылғы 7 наурыздағы № 54 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2008 жылғы 10 сәуірде № 5-18-60 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2009 жылғы 17 маусымдағы № 385 қаулысымен

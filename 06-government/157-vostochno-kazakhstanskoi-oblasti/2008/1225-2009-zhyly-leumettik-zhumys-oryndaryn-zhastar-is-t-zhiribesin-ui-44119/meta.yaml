act_code: '44119'
requisite: Шығыс Қазақстан облысы Үржар аудандық әкімдігінің 2008 жылғы 25 желтоқсандағы № 421 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2009 жылғы 20 қаңтарында № 5-18-74 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2009 жылғы 17 маусымдағы № 385 қаулысымен

act_code: '37907'
requisite: Шығыс Қазақстан облысы Күршім ауданының әкімдігінің 2008 жылғы 5 ақпандағы № 507 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2008 жылғы 14 ақпанда № 5-14-61 тіркелді. Қолдану мерзімінің бітуіне байланысты күші жойылды - Күршім ауданы әкімдігінің 2010 жылғы 29 маусымдағы № 1691 қаулысымен

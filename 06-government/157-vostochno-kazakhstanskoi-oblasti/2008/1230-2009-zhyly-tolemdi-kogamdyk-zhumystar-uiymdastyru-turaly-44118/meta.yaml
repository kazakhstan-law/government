act_code: '44118'
requisite: Шығыс Қазақстан облысы Үржар аудандық әкімдігінің 2008 жылғы 30 желтоқсандағы № 425 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2009 жылғы 20 қаңтарында № 5-18-73 тіркелді. Күші жойылды - қабылданған мерзімінің бітуіне байланысты (Үржар аудандық әділет басқармасының 2010 жылғы 11 қаңтардағы № 152 хаты)

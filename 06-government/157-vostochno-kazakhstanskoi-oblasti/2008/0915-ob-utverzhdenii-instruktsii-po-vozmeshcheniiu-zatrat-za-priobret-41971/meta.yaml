requisite: Постановление акимата города Усть-Каменогорска от 15 сентября 2008 года № 716. Зарегистрировано Управлением юстиции города Усть-Каменогорска 21 октября 2008 года за № 5-1-92. Утратило силу - в связи с истечением срока, на который оно было принято, на основании письма аппарата акима города Усть-Каменогорска от 05.03.2009 № Ин-5/166

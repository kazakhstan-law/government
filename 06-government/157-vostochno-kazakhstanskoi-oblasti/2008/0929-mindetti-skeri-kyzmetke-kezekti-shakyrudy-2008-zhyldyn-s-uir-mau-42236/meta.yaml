act_code: '42236'
requisite: Шығыс Қазақстан облысы Үржар аудандық әкімдігінің 2008 жылғы 29 қыркүйектегі № 410 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2008 жылғы 24 қазанда № 5-18-70 тіркелді
title:
  rus: “Міндетті әскери қызметке кезекті шақыруды 2008 жылдың сәуір-маусым, қазан-желтоқсан айларында ұйымдастыру туралы” 2008 жылғы 7 сәуірдегі № 75 қаулысына (Нормативтік қуқықтық актілердің мемлекеттік тіркеу тізілімінде 2008 жылы 4 мамыр күні № 5-18-64 тіркелген) өзгерістер еңгізу туралы

requisite: Шығыс Қазақстан облысы Ұлан аудандық әкімдігінің 2008 жылғы 3 маусымдағы № 674 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық әділет басқармасында 2008 жылғы 9 шілдеде № 5-17-86 тіркелді. Күші жойылды - Ұлан аудандық әкімдігінің 2009 жылғы 3 шілдедегі № 05/2059 хаты

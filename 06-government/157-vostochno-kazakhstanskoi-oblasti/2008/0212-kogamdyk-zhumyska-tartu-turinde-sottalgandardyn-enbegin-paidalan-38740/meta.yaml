act_code: '38740'
requisite: Шығыс Қазақстан облысы Аягөз ауданының әкімдігінің 2008 жылғы 12 ақпандағы № 564 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2008 жылғы 17 наурызында № 5-6-68 тіркелді. Күші жойылды - Аягөз ауданы әкімдігінің 2009 жылғы 29 мамырдағы № 612 қаулысымен.

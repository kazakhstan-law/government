requisite: Шығыс Қазақстан облысы Тарбағатай ауданының әкімдігінің 2006 жылғы 26 желтоқсандағы № 717 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық басқармасында 2007 жылғы 5 ақпанда № 5-16-32 тіркелді

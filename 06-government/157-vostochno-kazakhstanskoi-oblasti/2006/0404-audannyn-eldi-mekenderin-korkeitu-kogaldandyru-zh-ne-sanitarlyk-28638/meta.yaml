act_code: '28638'
requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2006 жылғы 4 сәуірдегі № 113 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық Әділет басқармасында 2006 жылғы 13 сәуірде № 5-10-28 тіркелді

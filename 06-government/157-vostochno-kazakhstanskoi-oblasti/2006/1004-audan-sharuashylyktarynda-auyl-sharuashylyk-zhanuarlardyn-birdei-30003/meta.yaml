act_code: '30003'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2006 жылғы 4 қазандағы № 603 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2006 жылғы 18 қазанда № 5-16-24 тіркелді

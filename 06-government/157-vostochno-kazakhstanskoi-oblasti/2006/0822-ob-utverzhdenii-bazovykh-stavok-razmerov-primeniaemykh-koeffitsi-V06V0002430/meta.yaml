  kaz: Шығыс Қазақстан облысынының мемлекеттік коммуналдық меншік мүлкін пайдаланғаны үшін төленетін жалдық ақының базалық ставкаларын, қолданылатын коэффициенттер мөлшерлері мен есеп айырысу ставкаларын анықтау тәртібін бекіту туралы

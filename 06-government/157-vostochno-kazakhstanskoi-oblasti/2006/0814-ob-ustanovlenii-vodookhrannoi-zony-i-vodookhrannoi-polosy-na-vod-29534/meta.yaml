  kaz: Шығыс Қазақстан облысы Ұлан ауданының Бетқұдық, Таврия, Макеевка, Саратовка, Тарғын, Манат ауылдық елді мекендері мен Асу-Бұлақ кентіндегі су объектілерінің су қорғау аймағы мен су қорғау белдеуін және оны шаруашылыққа пайдалану режимін белгілеу туралы

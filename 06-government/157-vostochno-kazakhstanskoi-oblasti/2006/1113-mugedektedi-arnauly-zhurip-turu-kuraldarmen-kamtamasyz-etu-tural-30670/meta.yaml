requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2006 жылғы 13 қарашадағы № 475 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2006 жылғы 15 желтоқсанда № 5-6-41 болып тіркелді. Күші жойылды - Аягөз ауданы әкімдігінің 2009 жылғы 29 маусымдағы № 612 қаулысымен

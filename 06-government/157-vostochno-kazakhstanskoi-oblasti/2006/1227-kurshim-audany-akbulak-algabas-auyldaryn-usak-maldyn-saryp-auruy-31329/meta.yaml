requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2006 жылғы 27 желтоқсандағы № 2025 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2006 жылғы 27 желтоқсанда № 5-14-42 тіркелді

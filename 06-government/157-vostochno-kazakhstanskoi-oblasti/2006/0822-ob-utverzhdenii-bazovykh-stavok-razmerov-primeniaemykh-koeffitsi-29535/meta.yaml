  title:
    rus: О внесении изменений и дополнений в постановление от 22 августа 2006 года № 730 "Об утверждении базовых ставок, размеров применяемых коэффициентов и порядка определения расчетных ставок арендной платы за пользование имуществом государственной коммунальной собственности Восточно-Казахстанской области"
    kaz: '"Шығыс Қазақстан облысының мемлекеттік коммуналдық меншік мүлкін пайдаланғаны үшін төленетін жалдық ақының базалық ставкаларын, қолданылатын коэффициенттер мөлшерлері мен есеп айырысу ставкаларын анықтау тәртібін бекіту туралы" 2006 жылғы 22 тамыздағы № 730 қаулыға өзгерістер мен толықтырулар енгізу туралы'

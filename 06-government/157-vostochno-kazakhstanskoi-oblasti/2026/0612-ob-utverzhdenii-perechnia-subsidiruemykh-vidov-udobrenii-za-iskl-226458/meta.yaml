title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений на 2026 год
  kaz: 2026 жылға арналған субсидияланатын тыңайтқыштар (органикалықтарды қоспағанда) түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын бекіту туралы

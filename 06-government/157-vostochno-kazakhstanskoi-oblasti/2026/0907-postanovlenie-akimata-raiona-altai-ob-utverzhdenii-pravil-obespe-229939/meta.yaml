act_code: '229939'
requisite: Постановление акимата района Алтай Восточно-Казахстанской области от 7 сентября 2026 года № 432. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 сентября 2026 года № 39860
title:
  rus: Постановление акимата района Алтай "Об утверждении Правил обеспечения возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в населенных пунктах района Алтай"
  kaz: Алтай ауданының әкімдігінің қаулысы "Алтай ауданының елді мекендеріндегі пәтерлердің, тұрғын емес үй-жайлардың меншік иелерінің, көппәтерлі тұрғын үйде лифттерді жөндеуге және ауыстыруға, күрделі жөндеуге байланысты ақшаны қайтаруды қамтамасыз ету қағидаларын бекіту туралы"

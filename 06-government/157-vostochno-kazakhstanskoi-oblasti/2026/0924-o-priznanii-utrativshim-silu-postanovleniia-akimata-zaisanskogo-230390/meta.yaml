title:
  rus: О признании утратившим силу постановления акимата Зайсанского района от 28 марта 2022 года № 160 «Об утверждении коэффициента зонирования, учитывающего местоположение объектов налогообложения в населённых пунктах Зайсанского района»
  kaz: Зайсан ауданы әкімдігінің 2022 жылғы 28 наурыздағы «Зайсан ауданының елді мекендеріндегі салық салу объектілерінің орналасқан жерін ескеретін аймаққа  бөлу коэффициентін бекіту туралы» №160 қаулысының күшін жою туралы

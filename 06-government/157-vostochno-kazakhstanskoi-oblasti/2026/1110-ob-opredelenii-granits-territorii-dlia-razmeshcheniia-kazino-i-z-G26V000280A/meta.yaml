key: G26V000280A
akn: /akn/kz/act/2026-11-10/G26V000280A
act_code: '232346'
requisite: Постановление Восточно-Казахстанского областного акимата от 10 ноября 2026 года № 280
title:
  rus: Об определении границ территории для размещения казино и залов игровых автоматов, в которые допускаются только иностранные граждане, лица без гражданства, работники игорного заведения  и иные лица, находящиеся в игорном заведении в связи с выполнением трудовых (служебных) обязанностей в районе Марқакөл Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысының Марқакөл ауданында шетел азаматтарының, азаматтығы жоқ адамдардың, ойын мекемесінің жұмыскерлерінің және еңбек (қызметтік) міндеттерін орындаумен байланысты ойын мекемесінде болатын өзге де адамдардың ғана кіруіне жол берілетін казино мен ойын автоматтары залдарын орналастыру үшін аумақ шекараларын айқындау туралы

title:
  rus: Об отмене постановления Восточно-Казахстанского областного акимата от 26 апреля 2024 года № 106 «Об утверждении регламента личного приема физических лиц и представителей юридических лиц должностными лицами государственных органов Восточно-Казахстанской области»
  kaz: «Шығыс Қазақстан облысы мемлекеттік органдарының лауазымды адамдарының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдауының регламентін бекіту туралы» Шығыс Қазақстан облысының 2024 жылғы 26 сәуірдегі № 106 қаулысының күшін жою туралы

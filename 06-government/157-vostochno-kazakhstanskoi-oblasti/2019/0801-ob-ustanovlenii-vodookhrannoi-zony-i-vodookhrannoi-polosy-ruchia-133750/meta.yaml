act_code: '133750'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 августа 2019 года № 244. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2019 года № 6102
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Карасу на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 27 (для проведения добычи осадочных пород), расположенном в 2,0 км северо-западнее села Акмектеп Тарбагатайского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Тарбағатай ауданы Ақмектеп ауылынан солтүстік-батысқа қарай 2,0 км орналасқан «КазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 27 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Қарасу бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

  title:
    rus: О внесении изменений в постановление Восточно-Казахстанского областного акимата от 26 июня 2019 года № 209 «Об утверждении перечня организаций технического и профессионального, послесреднего образования для размещения государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием на 2019-2020 учебный год»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2019 жылғы 26 маусымдағы № 209 «2019-2020 оқу жылына арналған техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру үшін техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының тізбесін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134968/rus

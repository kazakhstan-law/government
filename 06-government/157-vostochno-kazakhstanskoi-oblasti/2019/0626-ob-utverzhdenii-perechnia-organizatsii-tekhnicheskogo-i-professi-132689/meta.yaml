title:
  rus: Об утверждении перечня организаций технического и профессионального, послесреднего образования для размещения государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием на 2019-2020 учебный год
  kaz: 2019-2020 оқу жылына арналған техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру үшін техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының тізбесін бекіту туралы

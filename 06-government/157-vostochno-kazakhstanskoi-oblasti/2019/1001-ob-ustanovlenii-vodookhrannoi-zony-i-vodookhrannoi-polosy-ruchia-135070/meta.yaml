act_code: '135070'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 октября 2019 года № 337. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 октября 2019 года № 6186
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Мочалка (левый берег) на испрашиваемом земельном участке, расположенном в 2 км западнее поселка Верхнеберезовка Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Верхнеберезовка кентінен батысқа қарай 2 км орналасқан сұралып отырған жер учаскесіндегі Мочалка бұлағының (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

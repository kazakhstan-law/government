title:
  rus: Об установлении водоохранной зоны и водоохранной полосы протоки Комендантка (правый берег) в створе земельного участка, расположенного по проспекту Нурсултана Назарбаева, 42/2 города Усть-Каменогорск Восточно-Казахстанской области, и режима их хозяйственного использования

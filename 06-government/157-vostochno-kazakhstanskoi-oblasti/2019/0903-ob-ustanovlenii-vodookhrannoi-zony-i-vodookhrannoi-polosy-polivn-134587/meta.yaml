act_code: '134587'
requisite: Постановление Восточно-Казахстанского областного акимата от 3 сентября 2019 года № 300. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 сентября 2019 года № 6153
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы поливной арычной системы на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 42 (для проведения добычи осадочных пород), расположенном в 2,0 км южнее села Каратал Зайсанского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Зайсан ауданы Қаратал ауылынан оңтүстікке қарай 2,0 км орналасқан «КазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 42 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) суармалы арық жүйесінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

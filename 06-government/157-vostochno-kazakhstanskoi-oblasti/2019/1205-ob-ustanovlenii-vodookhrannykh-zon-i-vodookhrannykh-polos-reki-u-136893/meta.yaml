title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Уланка на испрашиваемых земельных участках (для ведения личного подсобного хозяйства), расположенных в селе Украинка Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданының Украинка ауылында орналасқан сұралып отырған жер учаскелеріндегі (жеке қосалқы шаруашылық жүргізу үшін) Уланка өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

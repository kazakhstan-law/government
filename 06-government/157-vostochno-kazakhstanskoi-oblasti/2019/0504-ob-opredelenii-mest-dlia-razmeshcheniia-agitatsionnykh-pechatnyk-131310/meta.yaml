requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 4 мая 2019 года № 135. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 мая 2019 года № 5926. Утратило силу постановлением акимата Шемонаихинского района Восточно-Казахстанской области от 14 июля 2021 года № 205 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов кандидатов и помещений для проведения встреч с избирателями на период выборов по Шемонаихинскому району
  kaz: Шемонаиха ауданы бойынша сайлау науқаны кезеңінде кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды және сайлаушылармен кездесу өткізу үшін үй-жайларды белгілеу туралы

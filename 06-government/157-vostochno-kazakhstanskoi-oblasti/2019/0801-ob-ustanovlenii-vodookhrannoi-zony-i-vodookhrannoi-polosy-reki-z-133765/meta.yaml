act_code: '133765'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 августа 2019 года № 250. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2019 года № 6106
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Жеменей на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 39 (для проведения добычи осадочных пород), расположенном в 1,4 км северо-восточнее города Зайсан Зайсанского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Зайсан ауданы Зайсан қаласынан солтүстік-шығысқа қарай 1,4 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 39 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Жеменей өзенінің су қорғау аймағы мен су қорғау белдеуін белгілеу және оларды шаруашылыққа пайдалану режимін белгілеу туралы

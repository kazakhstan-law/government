  title:
    rus: О внесении изменений в постановление акимата Жарминского района от 19 апреля 2019 года № 101 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещения для встреч с избирателями»
    kaz: Жарма ауданы әкімдігінің 2019 жылғы 19 сәуірдегі № 101 «Үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесу үшін кандидаттарға үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

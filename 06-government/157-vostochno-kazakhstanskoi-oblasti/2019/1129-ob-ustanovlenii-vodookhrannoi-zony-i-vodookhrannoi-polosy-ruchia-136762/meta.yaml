requisite: Постановление Восточно-Казахстанского областного акимата от 29 ноября 2019 года № 412. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 декабря 2019 года № 6358
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия в створе земельного участка, предоставляемого товариществу с ограниченной ответственностью «АБК-Автодор НС» в районе Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданында «АБК-Автодор НС» жауапкершілігі шектеулі серіктестігіне берілетін жер учаскесінің тұсындағы атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

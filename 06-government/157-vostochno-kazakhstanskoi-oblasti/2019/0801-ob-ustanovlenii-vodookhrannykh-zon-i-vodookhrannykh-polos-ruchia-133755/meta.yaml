act_code: '133755'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 августа 2019 года № 249. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2019 года № 6105
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Чернов Ключ и ручья без названия на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 11 (для проведения добычи осадочных пород), расположенном в 23,0 км северо-западнее села Кокпекты Кокпектинского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Көкпекті ауданы Көкпекті ауылынан солтүстік-батысқа қарай 23,0 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 11 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Чернов Ключ бұлағының және атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы Бухтарминского водохранилища в створе земельного участка урочища Рыбачий залив, предоставляемого для рекреационных целей в районе Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы рекреациялық мақсаттар үшін берілетін Рыбачий шығанағы шатқалындағы жер учаскесі тұстамасындағы Бұқтырма су қоймасының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

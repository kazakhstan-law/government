requisite: Постановление Восточно-Казахстанского областного акимата от 5 декабря 2019 года № 416. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 декабря 2019 года № 6388
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Ортажурек в створе испрашиваемых земельных участков на территории учетного квартала 05-079-002 (юго-восточнее села Алгабас) в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы 05-079-002 есеп кварталының аумағындағы (Алғабас ауылынан оңтүстік-шығысқа қарай) сұралып отырған жер учаскелерінің тұстамасындағы Ортажүрек өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

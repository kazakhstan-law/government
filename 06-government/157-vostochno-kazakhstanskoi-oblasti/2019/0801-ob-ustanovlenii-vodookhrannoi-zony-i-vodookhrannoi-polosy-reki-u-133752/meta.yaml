act_code: '133752'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 августа 2019 года № 245. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2019 года № 6101
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Уйдене на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 38 (для проведения добычи осадочных пород), расположенном в 2,5 км севернее села Кенсай Зайсанского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Зайсан ауданы Кеңсай ауылынан солтүстікке қарай 2,5 км орналасқан «КазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 38 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Үйдене өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

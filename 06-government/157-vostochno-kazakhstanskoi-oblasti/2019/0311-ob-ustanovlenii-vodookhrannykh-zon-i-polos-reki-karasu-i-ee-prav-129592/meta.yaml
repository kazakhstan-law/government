title:
  rus: Об установлении водоохранных зон и полос реки Карасу и ее правобережных притоков в створе земельного участка, расположенного в районе села Привольное Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Привольное ауылы аумағында орналасқан жер учаскесі тұстамасындағы Қарасу өзенінің және оның оң жағалау саласының су қорғау аймақтары мен белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

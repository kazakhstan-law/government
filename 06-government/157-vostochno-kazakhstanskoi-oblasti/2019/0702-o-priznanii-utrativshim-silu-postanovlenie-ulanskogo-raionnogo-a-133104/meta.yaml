requisite: Постановление акимата Уланского района Восточно-Казахстанской области от 2 июля 2019 года № 280. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 июля 2019 года № 6065
title:
  rus: О признании утратившим силу постановление Уланского районного акимата от 29 июня 2018 года № 238 «Об утверждении коэффициентов зонирования, учитывающих месторасположение объекта налогообложения в населенных пунктах Уланского района»
  kaz: Ұлан ауданы әкімдігінің 2018 жылғы 29 маусымдағы № 238 «Ұлан ауданының елді мекендерінде салық салу объектісінің орналасқан жерін ескеретін аймаққа бөлу коэффициенттерін бекіту туралы» қаулысының күшін жою туралы

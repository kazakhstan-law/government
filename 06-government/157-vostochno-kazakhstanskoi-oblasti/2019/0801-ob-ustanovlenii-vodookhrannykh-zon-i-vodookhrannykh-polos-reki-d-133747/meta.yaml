act_code: '133747'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 августа 2019 года № 251. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2019 года № 6107
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Даубай и ручья Кыз-Бастау на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 6 (для проведения добычи осадочных пород), расположенном в 5,0 км южнее села Кентарлау Жарминского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданы Кеңтарлау ауылынан оңтүстікке қарай 5,0 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 6 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Даубай өзені және Қыз-Бастау бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

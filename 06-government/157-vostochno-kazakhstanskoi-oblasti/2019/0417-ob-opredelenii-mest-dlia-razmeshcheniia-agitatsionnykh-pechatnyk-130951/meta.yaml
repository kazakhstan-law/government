  requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 26 сентября 2022 года № 372. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 октября 2022 года № 30106. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 1 октября 2024 года № 469 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Глубоковского района Восточно-Казахстанской области от 17 апреля 2019 года № 138 «Об определении мест для размещения агитационных печатных материалов кандидатов и помещений для проведения встреч с избирателями на период выборов»
    kaz: Шығыс Қазақстан облысы Глубокое ауданы әкімдігінің 2019 жылғы 17 сәуірдегі № 138 «Сайлау өткізу кезеңінде сайлаушылармен кездесу өткізу үшін үй-жайлар мен кандидаттардың үгіт баспа материалдарын орналастыру үшін орындарды белгілеу туралы» қаулысына өзгерістер енгізу туралы

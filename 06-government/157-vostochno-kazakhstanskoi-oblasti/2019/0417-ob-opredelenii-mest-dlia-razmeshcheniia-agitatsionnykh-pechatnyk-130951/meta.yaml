requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 17 апреля 2019 года № 138. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 23 апреля 2019 года № 5875. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 1 октября 2024 года № 469 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

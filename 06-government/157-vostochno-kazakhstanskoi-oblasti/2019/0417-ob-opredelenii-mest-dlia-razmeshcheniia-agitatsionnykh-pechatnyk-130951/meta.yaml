  title:
    rus: О внесении изменения в постановление Глубоковского районного акимата от 17 апреля 2019 года № 138 «Об определении мест для размещения агитационных печатных материалов кандидатов и помещений для проведения встреч с избирателями на период выборов»
    kaz: Глубокое ауданы әкімдігінің 2019 жылғы 17 сәуірдегі № 138 «Сайлау өткізу кезеңінде сайлаушылармен кездесу өткізу үшін үй-жайлар мен кандидаттардың үгіт баспа материалдарын орналастыру үшін орындарды белгілеу туралы» қаулысына өзгеріс енгізу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Шолаккайын в створе земельного участка в 7,6 км северо-западнее села Алгабас Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Алғабас ауылынан солтүстік-батысқа қарай 7,6 км қашықтықтағы жер учаскесі тұстамасындағы Шолаққайын өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 25 декабря 2019 года № 463. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 декабря 2019 года № 6463
title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Медведка и ее притоков ручьев без названия № 1 и № 2 в районе Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы Медведка өзені және оның сағалары атауы жоқ № 1 және № 2 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

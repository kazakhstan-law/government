requisite: Постановление Восточно-Казахстанского областного акимата от 11 сентября 2019 года № 315. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 сентября 2019 года № 6165
title:
  rus: Об установлении водоохранных зон и водоохранных полос рек Шолаккайын и Сарыбулак в створе испрашиваемого земельного участка, расположенного на территории учетного квартала 05-079-022 (в 5,0 км юго-восточнее села Бозанбай) в Уланском районе Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы 05-079-022 есеп кварталы аумағындағы (Бозанбай ауылынан оңтүстік-шығысқа қарай 5,0 км) сұралып отырған жер учаскесі тұстамасындағы Шолаққайын және Сарыбұлақ өзендерінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

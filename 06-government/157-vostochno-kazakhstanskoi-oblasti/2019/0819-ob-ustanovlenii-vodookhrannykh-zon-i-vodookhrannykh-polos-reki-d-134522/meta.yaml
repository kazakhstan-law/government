act_code: '134522'
requisite: Постановление Восточно-Казахстанского областного акимата от 19 августа 2019 года № 276. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 сентября 2019 года № 6149
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Даубай и ручья без названия на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 8 (для проведения добычи осадочных пород), расположенном в 17,1 км южнее села Кентарлау Жарминского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданы Кентарлау ауылынан оңтүстікке қарай 17,1 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 8 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Даубай өзені мен атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін белгілеу және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '133757'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 августа 2019 года № 246. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2019 года № 6103
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Бурхан на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 26, (для проведения добычи осадочных пород), расположенном в 11,0 км северо-западнее села Акмектеп Тарбагатайского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Тарбағатай ауданы Ақмектеп ауылынан солтүстік-батысқа қарай 11,0 км орналасқан «КазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 26 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Бұрхан бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

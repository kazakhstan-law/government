requisite: Постановление Восточно-Казахстанского областного акимата от 25 декабря 2019 года № 459. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 января 2020 года № 6707
title:
  rus: Об установлении водохранных зон и водоохранных полос реки Уранкай в створе испрашиваемых земельных участков на территории учетного квартала 05-079-020 (в 2,5 км южнее села Изгутты Айтыкова) в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы 05-079-020 есеп кварталы аумағындағы (Ізғұтты Айтықов ауылынан 2,5 км оңтүстікке қарай) сұралып отырған жер учаскелерінің тұсындағы Ұранқай өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

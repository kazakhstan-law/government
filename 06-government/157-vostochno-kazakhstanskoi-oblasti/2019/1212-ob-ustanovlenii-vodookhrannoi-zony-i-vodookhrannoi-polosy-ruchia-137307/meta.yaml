title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия в створе земельного участка, расположенного в 1,5 км северо-восточнее села Ушаново Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Ушаново ауылынан солтүстік-шығысқа қарай 1,5 км орналасқан жер учаскесі тұстамасындағы атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

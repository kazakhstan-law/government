act_code: '129038'
requisite: Постановление акимата Аягозского района Восточно-Казахстанской области от 11 февраля 2019 года № 70. Зарегистрировано Управлением юстиции Аягозского района Департамента юстиции Восточно-Казахстанской области 12 февраля 2019 года № 5-6-195. Утратило силу постановлением акимата Аягозского района Восточно-Казахстанской области от 20 апреля 2020 года № 194 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы
  kaz: Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

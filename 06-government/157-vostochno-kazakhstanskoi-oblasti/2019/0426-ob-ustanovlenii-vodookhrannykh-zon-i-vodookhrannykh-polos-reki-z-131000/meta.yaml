requisite: Постановление Восточно-Казахстанского областного акимата от 26 апреля 2019 года № 128. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 мая 2019 года № 5901
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Жартас в створе земельного участка в 4,8 км северо-восточнее села Гагарино Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Гагарино ауылынан солтүстік-шығысқа қарай 4,8 км қашықтықтағы жер учаскесі тұстамасындағы Жартас өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

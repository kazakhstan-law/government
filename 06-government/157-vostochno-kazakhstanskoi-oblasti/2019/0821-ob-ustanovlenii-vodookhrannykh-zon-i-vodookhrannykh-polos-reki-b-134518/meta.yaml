requisite: Постановление Восточно-Казахстанского областного акимата от 21 августа 2019 года № 281. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 сентября 2019 года № 6143
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Березовка (левый берег) и ручья Мочалка (левый берег) на испрашиваемом земельном участке, расположенном в 5,2 км западнее поселка Верхнеберезовка Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Верхнеберезовка кентінен батысқа қарай 5,2 км орналасқан сұралып отырған жер учаскесіндегі Березовка өзенінің (сол жағалау) және Мочалка бұлағының (сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

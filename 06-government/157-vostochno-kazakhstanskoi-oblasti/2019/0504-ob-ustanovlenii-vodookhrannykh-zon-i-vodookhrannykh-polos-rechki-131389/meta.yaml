title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Карасу в створе земельного участка, предоставляемого товариществу с ограниченной ответственностью «Производственная компания «Цементный завод Семей», в городе Семей Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Семей қаласындағы «Семей Цемент зауыты» Өндірістік компаниясы» жауапкершілігі шектеулі серіктестігіне берілетін жер учаскесі тұстамасындағы Қарасу өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '134512'
requisite: Постановление Восточно-Казахстанского областного акимата от 3 сентября 2019 года № 303. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 сентября 2019 года № 6148
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Александровка (правый берег), реки Медведка (левый берег), ручья Крестовец и его левобережных притоков №№ 1-2 на земельном участке, расположенном в районе Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданында орналасқан жер учаскесіндегі Александровка өзенінің (оң жағалау), Медведка өзенінің (сол жағалау), Крестовец бұлағының және оның №№ 1-2 сол жағалау салаларының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

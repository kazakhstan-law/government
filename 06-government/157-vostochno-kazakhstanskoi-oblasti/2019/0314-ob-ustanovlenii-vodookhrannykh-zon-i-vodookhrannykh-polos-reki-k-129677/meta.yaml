act_code: '129677'
requisite: Постановление Восточно-Казахстанского областного акимата от 14 марта 2019 года № 75. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 19 марта 2019 года № 5788
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Каракоба (правый берег) с учетом родников, ручья без названия (правый берег) и озера без названия юго-западнее села Урыль Катон-Карагайского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданы Өрел ауылынан оңтүстік-батысқа қарай атауы жоқ көлдің және атауы жоқ бұлақтың (оң жағалау), бастауларды ескере отырып Қарақоба өзенінің (оң жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 27 ноября 2019 года № 401. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 ноября 2019 года № 6330
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев Кузнецов и Дементьев, притоков речки Селезневка, в створе земельного участка, предоставляемого Сабанову К.С. для выпаса скота в районе Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы К.С. Сабановқа мал жаю үшін берілетін жер учаскесінің тұстамасындағы Кузнецов және Дементьев бұлақтарының, Селезневка өзені салаларының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

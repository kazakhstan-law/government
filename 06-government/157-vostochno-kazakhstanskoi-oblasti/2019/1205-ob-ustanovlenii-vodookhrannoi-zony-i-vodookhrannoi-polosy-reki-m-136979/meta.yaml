title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Моховка в створе земельного участка, предназначенного для ведения личного подсобного хозяйства, расположенного в поселке Солнечное Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Солнечное кентінде орналасқан жеке қосалқы шаруашылық жүргізуге арналған жер учаскесінің тұстамасындағы Моховка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 19 августа 2019 года № 279. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 сентября 2019 года № 6161
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Аблакетка (правый берег) на испрашиваемом земельном участке (для индивидуального жилищного строительства), расположенном по улице Береговая села Самсоновка города Усть-Каменогорск Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласы Самсоновка ауылы Береговая көшесінде орналасқан сұралып отырған жер учаскесіндегі (жеке тұрғын үй құрылысы үшін) Аблакетка өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

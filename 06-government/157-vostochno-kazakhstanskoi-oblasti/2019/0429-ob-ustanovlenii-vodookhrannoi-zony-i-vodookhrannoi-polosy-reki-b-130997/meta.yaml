title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Бобровка в створе земельных участков для установления линии электропередачи, расположенных в селе Бобровка Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Бобровка ауылындағы электр беру желілерін орнатуға арналған жер учаскелері тұстамасындағы Бобровка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

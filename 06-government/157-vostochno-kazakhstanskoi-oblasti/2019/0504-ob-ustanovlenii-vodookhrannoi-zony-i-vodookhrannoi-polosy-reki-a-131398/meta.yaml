requisite: Постановление Восточно-Казахстанского областного акимата от 4 мая 2019 года № 153. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 мая 2019 года № 5928
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Аблакетка (левый берег) на земельном участке, расположенном в садоводческом товариществе «Мелиоратор» в районе села Самсоновка города Усть-Каменогорск Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласы Самсоновка ауылы аумағындағы «Мелиоратор» бау-бақша серіктестігінде орналасқан жер учаскесіндегі Аблакетка өзенінің (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

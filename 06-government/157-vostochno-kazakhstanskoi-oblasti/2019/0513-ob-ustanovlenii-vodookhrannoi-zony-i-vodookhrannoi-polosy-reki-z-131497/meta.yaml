requisite: Постановление Восточно-Казахстанского областного акимата от 13 мая 2019 года № 161. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 16 мая 2019 года № 5949
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Жельдыозек в створе земельных участков для ведения садоводства, расположенных на территории производственного кооператива «Шашу», в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы «Шашу» өнеркәсіптік кооперативінің аумағында орналасқан бақша шаруашылығын жүргізуге арналған жер учаскелері тұстамасында Желдіөзек өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '129425'
requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 27 февраля 2019 года № 54. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 марта 2019 года № 5742. Утратило силу постановлением акимата Шемонаихинского района Восточно-Казахстанской области от 5 января 2020 года № 385 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, а также лиц, состоящих на учете службы пробации
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, сондай-ақ пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квоталарын белгілеу туралы

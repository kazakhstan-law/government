  kaz: Өскемен қаласы Севастопольская көшесі, 4/1 мекенжайы бойынша орналасқан жер учаскесі үшін Комендантка ағысының (Ертіс өзенінің оң ағысы) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '136891'
requisite: Постановление Восточно-Казахстанского областного акимата от 5 декабря 2019 года № 420. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 декабря 2019 года № 6367
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев без названия 1, без названия 2, без названия 3 в створе земельного участка, расположенного в 2 км восточнее села Ермаковка района Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданы Ермаковка ауылынан шығысқа қарай 2 км орналасқан жер учаскесі тұстамасындағы атауы жоқ 1, атауы жоқ 2, атауы жоқ 3 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

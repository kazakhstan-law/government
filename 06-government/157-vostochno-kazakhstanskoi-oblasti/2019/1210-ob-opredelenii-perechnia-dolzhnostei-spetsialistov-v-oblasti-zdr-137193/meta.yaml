requisite: Постановление акимата Курчумского района Восточно-Казахстанской области от 10 декабря 2019 года № 410. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 декабря 2019 года № 6402. Утратило силу постановлением акимата Курчумского района Восточно-Казахстанской области от 28 декабря 2020 года № 511 (вводится в действие c 01.01.2021)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы

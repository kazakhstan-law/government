act_code: '131401'
requisite: Постановление Восточно-Казахстанского областного акимата от 4 мая 2019 года № 150. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 мая 2019 года № 5927
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Быструха (левый берег) и ее левобережных притоков № 1-4 в створе земельных участков для проектирования линии электроснабжения юго-западнее села Быструха Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданының Быструха ауылынан оңтүстік-батысқа қарай электрмен жабдықтау желілерін жобалауға арналған жер учаскелері тұстамасындағы Быструха өзенінің (сол жағалау) және оның № 1-4 сол жағалау салаларының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

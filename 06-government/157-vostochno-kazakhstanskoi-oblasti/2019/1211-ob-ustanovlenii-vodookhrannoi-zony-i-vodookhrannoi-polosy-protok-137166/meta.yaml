title:
  rus: Об установлении водоохранной зоны и водоохранной полосы протоки Тихая в створе земельного участка № 10 садоводческого товарищества «Алмаз», расположенного в городе Усть – Каменогорск Восточно – Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласында орналасқан «Алмаз» бау – бақша серіктестігінің № 10 жер учаскесі тұстамасындағы Тихая ағынының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

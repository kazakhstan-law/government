  title:
    rus: О внесении изменений в постановление акимата Зайсанского района Восточно-Казахстанской области от 2 мая 2019 года № 282 «Об определении мест для размещения агитационных печатных материалов и помещении на договорной основе для  встреч кандидатов с избирателями в период избирательных кампаний по Зайсанскому району»
    kaz: Шығыс Қазақстан облысы Зайсан ауданы әкімдігінің 2019 жылғы 2 мамырдағы №282 «Зайсан ауданы бойынша сайлау науқаны кезеңінде үгіттеу баспа материалдарын орналастыру орындарын және шарттық негізде кандидаттардың сайлаушылармен кездесуі өткізілетін үй-жайларының тізімін белгілеу туралы» қаулысына өзгерістер енгізу туралы

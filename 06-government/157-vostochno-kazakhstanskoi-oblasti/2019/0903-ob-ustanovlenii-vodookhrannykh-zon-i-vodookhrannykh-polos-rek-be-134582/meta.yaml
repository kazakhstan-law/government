  kaz: Шығыс Қазақстан облысы Риддер қаласында орналасқан жер учаскесінің тұстамасындағы Белая Уба, Богданиха өзендерінің және Зеленков ключ бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

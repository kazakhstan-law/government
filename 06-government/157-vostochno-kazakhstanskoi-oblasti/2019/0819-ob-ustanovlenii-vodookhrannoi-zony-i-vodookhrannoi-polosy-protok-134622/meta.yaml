requisite: Постановление Восточно-Казахстанского областного акимата от 19 августа 2019 года № 275. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 сентября 2019 года № 6164
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы протоки Комендантка в границах земельного участка, предоставляемого коммунальному государственному предприятию на праве хозяйственного ведения «Усть-Каменогорский медицинский колледж» управления здравоохранения Восточно-Казахстанской области, в городе Усть-Каменогорск и режима их хозяйственного использования
  kaz: Өскемен қаласындағы Шығыс Қазақстан облысы денсаулық сақтау басқармасының «Өскемен медициналық колледжі» шаруашылық жүргізу құқығындағы коммуналдық мемлекеттік кәсіпорнына берілетін жер учаскесі шекарасындағы Комендантка ағысының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

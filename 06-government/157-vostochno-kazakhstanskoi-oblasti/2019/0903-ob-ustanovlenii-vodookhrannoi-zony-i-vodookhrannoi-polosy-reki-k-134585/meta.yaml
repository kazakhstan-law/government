title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Красноярка на земельных участках с кадастровыми номерами 05-068-025-347 и 05-068-025-353, расположенных в селе Предгорное Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданының Предгорное ауылында орналасқан кадастрлық нөмірлері 05-068-025-347 және 05-068-025-353 жер учаскелеріндегі Красноярка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

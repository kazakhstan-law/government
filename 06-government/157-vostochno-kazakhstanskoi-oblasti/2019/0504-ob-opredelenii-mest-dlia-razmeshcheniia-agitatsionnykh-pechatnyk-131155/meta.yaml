  title:
    rus: О внесении изменений в постановление акимата города Семей от 4 мая 2019 года № 793 «Об определении мест для размещения агитационных печатных материалов кандидатов и помещений для проведения встреч с избирателями на период выборов»
    kaz: «Сайлау өткізу кезеңінде сайлаушылармен кездесу өткізу үшін үй-жайлар мен кандидаттардың үгіт баспа материалдарын орналастыру үшін орындарды белгілеу туралы» Семей қаласы әкімдігінің 2019 жылғы 4 мамырдағы № 793 қаулысына өзгерістер енгізу туралы

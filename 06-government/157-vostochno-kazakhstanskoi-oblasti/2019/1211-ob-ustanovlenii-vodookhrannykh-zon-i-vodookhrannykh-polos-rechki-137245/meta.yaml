title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Мельничная и ручья без названия в створе земельного участка в районе Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы жер учаскесі тұстамасындағы Мельничная өзенінің және атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

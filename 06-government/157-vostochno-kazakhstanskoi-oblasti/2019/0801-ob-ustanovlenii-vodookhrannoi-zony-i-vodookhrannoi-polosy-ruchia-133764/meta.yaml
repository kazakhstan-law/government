act_code: '133764'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 августа 2019 года № 252. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2019 года № 6108
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Жузагаш на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 16 (для проведения добычи осадочных пород), расположенном в 4,5 км юго-восточнее села Ажа Кокпектинского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Көкпекті ауданы Ажа ауылынан оңтүстік-шығысқа қарай 4,5 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 16  жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Жүзағаш бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

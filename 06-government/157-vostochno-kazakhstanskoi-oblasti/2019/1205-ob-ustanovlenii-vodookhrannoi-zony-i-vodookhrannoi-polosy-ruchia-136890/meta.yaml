act_code: '136890'
requisite: Постановление Восточно-Казахстанского областного акимата от 5 декабря 2019 года № 422. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 декабря 2019 года № 6368
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия в створе земельного участка, предоставляемого коммунальному государственному учреждению «Усть-Каменогорское лесное хозяйство» для выращивания посадочного материала в районе Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы «Өскемен орман шаруашылығы» коммуналдық мемлекеттік мекемесіне отырғызу материалын өсіру үшін  берілетін жер учаскесі тұстамасындағы атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

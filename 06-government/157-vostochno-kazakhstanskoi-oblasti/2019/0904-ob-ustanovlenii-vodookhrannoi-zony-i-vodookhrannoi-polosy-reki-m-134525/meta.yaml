act_code: '134525'
requisite: Постановление Восточно-Казахстанского областного акимата от 4 сентября 2019 года № 306. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 сентября 2019 года № 6151
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Мазанкина в створе земельного участка для ведения сельского подсобного хозяйства, расположенного в 4,3 км юго-восточнее села Секисовка Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Секисовка ауылынан оңтүстік-шығысқа қарай 4,3 км орналасқан ауыл қосалқы шаруашылығын жүргізуге арналған жер учаскесінің тұстамасындағы Мазанкин өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

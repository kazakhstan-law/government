    rus: О внесении изменений в постановление акимата города Курчатов от 30 мая 2019 года № 32 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещения для встреч с избирателями»
    kaz: Курчатов қаласы әкімдігінің 2019 жылғы 30 мамырдағы № 32 «Үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесу үшін кандидаттарға үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Сухова (левый берег) на земельном участке, расположенном в 4,5 км северо-восточнее села Александровка района Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданы Александровка ауылының солтүстік-шығысына қарай 4,5 км орналасқан жер учаскесіндегі Сухов бұлағының (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

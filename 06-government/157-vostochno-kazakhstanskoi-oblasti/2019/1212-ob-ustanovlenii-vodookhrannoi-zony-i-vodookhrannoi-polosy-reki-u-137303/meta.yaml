  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 12 декабря 2019 года № 444 «Об установлении водоохранной зоны и водоохранной полосы реки Уранкай в створе земельного участка (учетный квартал 05-079-001), расположенного в 0,145 км северо-западнее села Бестерек Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2019 жылғы 12 желтоқсандағы № 444 «Шығыс Қазақстан облысы Ұлан ауданы Бестерек ауылынан солтүстік-батысқа қарай 0,145 км орналасқан (есеп кварталы 05-079-001) жер учаскесі тұстамасындағы Ұранқай өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы» қаулысына өзгеріс енгізу туралы

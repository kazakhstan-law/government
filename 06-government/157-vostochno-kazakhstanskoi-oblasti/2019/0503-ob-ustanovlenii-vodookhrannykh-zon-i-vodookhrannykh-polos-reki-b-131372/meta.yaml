act_code: '131372'
requisite: Постановление Восточно-Казахстанского областного акимата от 3 мая 2019 года № 147. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 мая 2019 года № 5917
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Бобровка (правый берег) и ее правобережного притока (левый берег) на земельном участке, расположенном в селе Бобровка Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Бобровка ауылында орналасқан жер учаскесіндегі Бобровка өзенінің (оң жағалау) және оның оң жағалау саласының (сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 5 декабря 2019 года № 417. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 декабря 2019 года № 6383
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья без названия в створе испрашиваемого земельного участка в  Уланском районе Восточно-Казахстанской области на территории учетного квартала 05-079-002 (в 2,7 км севернее села Сагыр), и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы 05-079-002 есеп кварталының аумағындағы (Сағыр ауылынан солтүстікке қарай 2,7 км) сұралып отырған жер учаскесінің тұстамасындағы атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

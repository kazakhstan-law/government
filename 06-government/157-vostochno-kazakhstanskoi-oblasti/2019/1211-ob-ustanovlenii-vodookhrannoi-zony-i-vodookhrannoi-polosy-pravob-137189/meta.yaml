requisite: Постановление Восточно-Казахстанского областного акимата от 11 декабря 2019 года № 435. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 декабря 2019 года № 6403
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы правобережного участка ручья Тюлюгун в створе 3 км и 3,7 км вниз по течению от истока в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы бастау ағысы бойынша 3 км және 3,7 км төмен тұстамада Тюлюгун бұлағының оң жағалау учаскесінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Аблакетка (левый берег) на испрашиваемом земельном участке в районе села Самсоновка города Усть-Каменогорск Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласы Самсоновка ауылы аумағындағы сұралып отырған жер учаскесіндегі Аблакетка өзенінің (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

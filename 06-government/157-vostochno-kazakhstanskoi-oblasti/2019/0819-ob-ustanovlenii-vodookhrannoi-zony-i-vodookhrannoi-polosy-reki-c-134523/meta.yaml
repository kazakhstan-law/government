act_code: '134523'
requisite: Постановление Восточно-Казахстанского областного акимата от 19 августа 2019 года № 274. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 сентября 2019 года № 6150
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Чар на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 4 (для проведения добычи общераспространенных полезных ископаемых), расположенном в 2,5 км южнее села Каратобе Жарминского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданы Қаратөбе ауылынан оңтүстікке қарай 2,5 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 4 жер учаскесіндегі (кең таралған пайдалы қазбаларды өндіруді жүргізу үшін) Шар өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Никольского в створе земельного участка № 48, расположенного в садоводческом товариществе «Березка» Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы «Березка» бау-бақша серіктестігінде орналасқан № 48 жер учаскесі тұстамасындағы Никольский бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

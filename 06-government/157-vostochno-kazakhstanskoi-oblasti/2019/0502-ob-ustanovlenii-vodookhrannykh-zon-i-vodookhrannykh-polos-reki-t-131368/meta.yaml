title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Талдыбулак в створе земельного участка в 0,3 км северо-восточнее села Алгабас Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Алғабас ауылынан солтүстік-шығысқа қарай 0,3 км қашықтықтағы жер учаскесі тұстамасындағы Талдыбұлақ өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

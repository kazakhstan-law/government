act_code: '134519'
requisite: Постановление Восточно-Казахстанского областного акимата от 19 августа 2019 года № 272. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 сентября 2019 года № 6142
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Жузагаш на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 18 (для проведения добычи осадочных пород), расположенном в 40,0 км юго-восточнее села Кокпекты Кокпектинского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Көкпекті ауданы Көкпекті ауылынан оңтүстік-шығысқа қарай 40,0 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 18 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Жүзағаш бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

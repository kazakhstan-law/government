requisite: Постановление Восточно-Казахстанского областного акимата от 9 декабря 2019 года № 431. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 декабря 2019 года № 6381
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Карасу для строительства 2-х гидропостов до и после Жузагашского водозабора товариществом с ограниченной ответственностью «KAZ Minerals Aktogay» в Аягозском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Аягөз ауданында «KAZ Minerals Aktogay» жауапкершілігі шектеулі серіктестігінің Жүзағаш су жинағышының арғы және бергі жағында 2 гидропост салу үшін Қарасу өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

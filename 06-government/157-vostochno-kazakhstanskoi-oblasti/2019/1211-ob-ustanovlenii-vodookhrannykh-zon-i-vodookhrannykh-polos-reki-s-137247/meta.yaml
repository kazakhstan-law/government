act_code: '137247'
requisite: Постановление Восточно-Казахстанского областного акимата от 11 декабря 2019 года № 434. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 декабря 2019 года № 6421
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Стрежная в створе испрашиваемых товариществом с ограниченной ответственностью «DRIVEN FORCE company» земельных участков в учетном квартале № 05-083-053, расположенного в 18 км северо-восточнее города Риддер Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласынан 18 км солтүстік-шығысқа қарай орналасқан № 05-083-053 есеп кварталы жер учаскелерінің тұстамасындағы «DRIVEN FORCE company» жауапкершілігі шектеулі серіктестігі сұрап отырған Стрежная өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 21 августа 2019 года № 283. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 сентября 2019 года № 6146
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Сарымсакты и ее притоков речки Медведка и ручья без названия в Катон-Карагайском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданы Сарымсақты өзенінің және оның салалары Медведка өзені мен атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

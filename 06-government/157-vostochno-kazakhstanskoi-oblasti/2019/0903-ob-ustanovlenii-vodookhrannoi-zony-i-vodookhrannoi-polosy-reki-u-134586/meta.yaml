requisite: Постановление Восточно-Казахстанского областного акимата от 3 сентября 2019 года № 304. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 сентября 2019 года № 6155
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Уланка (правый берег) на земельных участках, расположенных в садоводческом товариществе «Восточник-Степной» в районе села Акимовка Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Акимовка ауылының аумағындағы "Восточник-Степной" бау-бақша серіктестігінде орналасқан жер учаскелеріндегі Ұлан өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

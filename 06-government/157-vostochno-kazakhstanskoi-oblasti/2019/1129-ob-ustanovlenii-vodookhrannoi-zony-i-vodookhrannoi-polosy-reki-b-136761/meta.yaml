act_code: '136761'
requisite: Постановление Восточно-Казахстанского областного акимата от 29 ноября 2019 года № 411. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 декабря 2019 года № 6356
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Бухтарма (левый берег) на испрашиваемых земельных участках, расположенных в 1 км южнее села Аршаты Катон-Карагайского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданындағы Аршаты ауылынан оңтүстікке қарай 1 км орналасқан сұралып отырған жер учаскелерінің тұстамасындағы Бұқтырма өзенінің (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

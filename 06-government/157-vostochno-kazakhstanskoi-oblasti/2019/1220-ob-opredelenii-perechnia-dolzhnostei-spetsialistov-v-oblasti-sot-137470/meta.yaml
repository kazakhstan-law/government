  title:
    rus: О внесении изменений в постановление акимата Катон-Карагайского района от 20 декабря 2019 года № 512 «Об определении перечня должностей специалистов в области, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Катонқарағай ауданының әкімдігінің 2019 жылғы 20 желтоқсандағы № 512 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

requisite: Постановление Катон-Карагайского районного акимата Восточно-Казахстанской области от 20 декабря 2019 года № 512. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 декабря 2019 года № 6456. Утратило силу постановлением Катон-Карагайского районного акимата Восточно-Казахстанской области от 1 февраля 2021 года № 10 (вводится в действие с 01.01.2021)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

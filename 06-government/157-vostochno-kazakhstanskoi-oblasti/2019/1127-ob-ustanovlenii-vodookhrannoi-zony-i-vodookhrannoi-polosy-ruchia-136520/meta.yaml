title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия на земельных участках, расположенных на землях села Ушаново Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Ушанов ауылының жерлерінде орналасқан жер учаскелеріндегі атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

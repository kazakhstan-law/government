act_code: '133749'
requisite: Постановление Восточно-Казахстанского областного акимата от 1 августа 2019 года № 247. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2019 года № 6104
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 37 (для проведения добычи осадочных пород), расположенном в 1,5 км западнее села Карабулак Зайсанского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Зайсан ауданы Қарабұлақ ауылынан батысқа қарай 1,5 км орналасқан «КазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 37 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '136894'
requisite: Постановление Восточно-Казахстанского областного акимата от 5 декабря 2019 года № 415. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 декабря 2019 года № 6365
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Уланка (правый берег), реки Караозек (левый берег) и ручья без названия (правый берег) на земельном участке, расположенном в 1,5 км северо-восточнее поселка Касыма Кайсенова Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Қасым Қайсенов кентінің солтүстік-шығысына қарай 1,5 км орналасқан жер учаскесіндегі Ұланка өзенінің (оң жағалау), Қараөзек өзенінің (сол жағалау) және атауы жоқ бұлақтың (оң жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Уланка в створе земельного участка протяженностью 2,5 км в городе Усть-Каменогорск Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Өскемен қаласындағы ұзындығы 2,5 км жер учаскесі тұстамасындағы Ұланка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

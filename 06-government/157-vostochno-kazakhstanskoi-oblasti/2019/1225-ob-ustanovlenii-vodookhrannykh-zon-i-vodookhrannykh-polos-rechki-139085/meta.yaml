title:
  rus: Об установлении водоохранных зон и водоохранных полос речки Медведевка, ее притока ручья Артамонов и ручья Ираниха в створе земельного участка в районе Алтай Восточно – Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы жер учаскесі тұстамасындағы Медведевка өзенінің, оның Артамонов және Ираниха  бұлақтары салаларының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

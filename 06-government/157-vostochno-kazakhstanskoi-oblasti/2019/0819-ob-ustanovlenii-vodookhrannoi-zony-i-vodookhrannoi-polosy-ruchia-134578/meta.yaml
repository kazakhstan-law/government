act_code: '134578'
requisite: Постановление Восточно-Казахстанского областного акимата от 19 августа 2019 года № 278. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 сентября 2019 года № 6154
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья без названия на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 45 (для проведения добычи осадочных пород), расположенном в 22 км юго-восточнее села Улкен Каратал Зайсанского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Зайсан ауданы Үлкен Қаратал ауылынан оңтүстік-шығысқа қарай 22 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 45 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) атауы жоқ бұлақтың су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление акимата Зайсанского района Восточно-Казахстанской области от 25 января 2019 года № 33. Зарегистрировано Управлением юстиции Зайсанского района Департамента юстиции Восточно-Казахстанской области 31 января 2019 года № 5-11-191. Утратило силу постановлением акимата Зайсанского района Восточно-Казахстанской области от 28 декабря 2020 года № 743 (вводится в действие с 01.01.2021)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, cоциального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы

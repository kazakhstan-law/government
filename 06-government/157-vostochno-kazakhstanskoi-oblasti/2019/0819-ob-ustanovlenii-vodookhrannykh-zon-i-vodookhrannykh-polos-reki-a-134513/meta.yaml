act_code: '134513'
requisite: Постановление Восточно-Казахстанского областного акимата от 19 августа 2019 года № 273. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 сентября 2019 года № 6147
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Аршалы и ручья Кызылбастау на испрашиваемом товариществом с ограниченной ответственностью «Совместное предприятие КазГерСтрой» земельном участке № 10 (для проведения добычи осадочных пород), расположенном в 31,0 км северо-западнее села Кокпекты Кокпектинского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Көкпекті ауданы Көкпекті ауылынан  солтүстік-батысқа қарай 31,0 км орналасқан «ҚазГерСтрой бірлескен кәсіпорны» жауапкершілігі шектеулі серіктестігі сұрап отырған № 10 жер учаскесіндегі (шөгінді жыныстарды өндіруді жүргізу үшін) Аршалы өзені және Қызылбастау бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 15 мая 2019 года № 162. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 16 мая 2019 года № 5948
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Уланка (правый берег) и реки Караозек (левый берег) на земельном участке, расположенном в 3,4 км северо-восточнее поселка Касыма Кайсенова Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданының Қасым Қайсенов кентінен 3,4 км солтүстік-шығысқа қарай орналасқан жер учаскесіндегі Уланка өзенінің (оң жағалау) және Қараөзек өзенінің (сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

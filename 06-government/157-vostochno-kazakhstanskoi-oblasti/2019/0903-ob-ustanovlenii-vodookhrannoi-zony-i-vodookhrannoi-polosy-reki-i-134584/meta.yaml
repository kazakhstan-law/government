requisite: Постановление Восточно-Казахстанского областного акимата от 3 сентября 2019 года № 297. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 сентября 2019 года № 6157
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Иртыш (правый берег) на испрашиваемом земельном участке, расположенном в 2,1 км юго-западнее села Березовка Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Березовка ауылынан оңтүстік-батысқа қарай 2,1 км орналасқан сұралып отырған жер учаскесіндегі Ертіс өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '46541'
requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2009 жылғы 23 сәуірдегі № 31 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2009 жылғы 3 маусымда № 5-15-53 тіркелді. Күші жойылды - ШҚО Көкпекті ауданы әкімдігінің 2010 жылғы 7 маусымдағы № 659 қаулысымен

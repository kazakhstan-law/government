act_code: '46709'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2009 жылғы 19 маусымдағы № 233 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай аудандық Әділет басқармасында 2009 жылғы 26 маусымда № 5-7-67 тіркелді. Қаулының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Шығыс Қазақстан облысы Бесқарағай ауданындағы Әділет басқармасының бастығының 2010 жылғы 7 маусымдағы № 2383 хатымен

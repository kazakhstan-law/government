requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2009 жылғы 7 сәуірдегі № 310 қаулысы. Шығыс Қазақстан облысы Аягөз аудандық Әділет басқармасында 2009 жылғы 20 мамырда № 5-6-93 тіркелді. Күші жойылды - Аягөз ауданы әкімдігінің 2010 жылғы 16 сәуірдегі № 2137 қаулысымен

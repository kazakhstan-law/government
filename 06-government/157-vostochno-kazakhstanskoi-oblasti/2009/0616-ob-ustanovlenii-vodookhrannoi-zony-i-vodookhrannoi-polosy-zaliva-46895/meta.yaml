title:
  rus: Об установлении водоохранной зоны и водоохранной полосы залива Гладковский на левобережье Бухтарминского водохранилища в створе земельного участка товарищества с ограниченной ответственностью "Гладковский залив" Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданының "Гладковский залив" жауапкершілігі шектеулі серіктестігінің жер учаскесі тұсындағы Бұқтырма су қоймасының сол жағалауындағы Гладковский бұғазының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

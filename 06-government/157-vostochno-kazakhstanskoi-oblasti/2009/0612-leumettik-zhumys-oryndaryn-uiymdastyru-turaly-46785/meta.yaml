requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2009 жылғы 12 маусымдағы № 371 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2009 жылғы 30 маусымда № 5-18-82 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2012 жылғы 7 мамырдағы № 181 қаулысымен

requisite: Шығыс Қазақстан облысы Зайсан ауданы әкімдігінің 2009 жылғы 20 сәуірдегі № 668 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2009 жылғы 12 мамырда № 5-11-93 тіркелді. Күші жойылды - Зайсан ауданы әкімдігінің 2010 жылғы 16 ақпандағы № 1064 қаулысымен

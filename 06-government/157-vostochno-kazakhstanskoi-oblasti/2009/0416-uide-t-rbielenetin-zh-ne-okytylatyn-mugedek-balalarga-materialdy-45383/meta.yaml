act_code: '45383'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2009 жылғы 16 сәуірдегі № 131 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2009 жылғы 24 сәуірде № 5-7-63 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2012 жылғы 23 сәуірдегі № 168 қаулысымен

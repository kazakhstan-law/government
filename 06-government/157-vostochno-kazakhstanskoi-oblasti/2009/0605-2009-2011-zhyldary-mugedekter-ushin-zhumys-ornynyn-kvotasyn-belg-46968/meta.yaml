act_code: '46968'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2009 жылғы 5 маусымдағы № 48 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2009 жылғы 15 шілдеде № 5-5-95 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2012 жылғы 23 қаңтардағы № 149 қаулысымен

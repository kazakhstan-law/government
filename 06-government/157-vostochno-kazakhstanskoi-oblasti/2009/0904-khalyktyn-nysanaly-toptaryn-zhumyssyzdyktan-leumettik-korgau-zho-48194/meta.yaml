requisite: Шығыс Қазақстан облысы Зайсан ауданы әкімдігінің 2009 жылғы 4 қыркүйектегі № 833 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2009 жылғы 16 қазанда № 5-11-104 тіркелді. Күші жойылды - Зайсан ауданы әкімдігінің 2012 жылғы 06 қыркүйектегі № 1156 қаулысымен

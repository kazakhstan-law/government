requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімдігінің 2009 жылғы 7 желтоқсандағы № 403 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2010 жылғы 6 қаңтарда № 5-17-120 тіркелді. Қаулының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Ұлан аудандық әкімдігінің 2010 жылғы 30 маусымдағы № 05/2488 хаты

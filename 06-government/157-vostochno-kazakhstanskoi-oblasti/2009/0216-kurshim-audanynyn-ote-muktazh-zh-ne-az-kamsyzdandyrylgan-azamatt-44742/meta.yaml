act_code: '44742'
requisite: Шығыс Қазақстан облысы Күршім ауданының әкімдігінің 2009 жылғы 16 ақпандағы № 1081 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2009 жылғы 27 ақпанда № 5-14-80 тіркелді. Күші жойылды - Күршім ауданының әкімдігінің 2012 жылғы 8 мамырдағы № 2509 қаулысымен
title:
  rus: Күршім ауданының өте мұқтаж және аз қамсыздандырылған азаматтарына біржолғы материалдық көмек және Қазақстан Республикасына, облысқа сіңірген еңбектері үшін дербес зейнеткерлікке шыққан азаматтарға коммуналдық шығындары үшін ай сайын материалдық көмек тағайындау және төлеу Нұсқаулығын бекіту туралы

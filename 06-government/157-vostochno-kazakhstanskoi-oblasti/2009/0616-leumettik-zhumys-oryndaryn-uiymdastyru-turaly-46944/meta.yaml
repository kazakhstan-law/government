requisite: Шығыс Қазақстан облысы Зайсан аудандық әкімдігінің 2009 жылғы 16 маусымдағы № 728 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық әділет басқармасында 2009 жылғы 15 шілдеде № 5-11-98 тіркелді. Күші жойылды - Зайсан аудандық әкімдігінің 2012 жылғы 26 сәуірдегі № 964 қаулысымен

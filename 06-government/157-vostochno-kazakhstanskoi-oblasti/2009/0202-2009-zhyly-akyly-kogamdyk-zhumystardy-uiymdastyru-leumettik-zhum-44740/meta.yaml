requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2009 жылғы 2 ақпандағы № 1034 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2009 жылғы 11 ақпанда № 5-14-77 тіркелді. Күші жойылды - ШҚО Күршім ауданы әкімдігінің 2010 жылғы 10 қаңтардағы № 1458 қаулысымен

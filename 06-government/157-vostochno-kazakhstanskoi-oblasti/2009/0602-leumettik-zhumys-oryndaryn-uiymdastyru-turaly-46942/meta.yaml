act_code: '46942'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2009 жылғы 2 маусымдағы № 664 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2009 жылғы 3 шілдеде № 5-6-94 тіркелді. Күші жойылды - қабылданған мерзімінің бітуіне байланысты Аягөз аудандық Әділет басқармасының 2010 жылғы 9 ақпандағы № 1057 хатымен

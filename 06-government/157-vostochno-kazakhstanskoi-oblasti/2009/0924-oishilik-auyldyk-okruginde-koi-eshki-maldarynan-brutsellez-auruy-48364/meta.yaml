requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2009 жылғы 24 қыркүйектегі № 338 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2009 жылғы 19 қазанда № 5-16-81 тіркелді. Күші жойылды - Тарбағатай ауданы әкімдігінің 2010 жылғы 1 желтоқсандағы № 382 қаулысымен

requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімдігінің 2009 жылғы 13 қарашадағы № 359 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2009 жылғы 7 желтоқсанда № 5-17-118 тіркелді. Күші жойылды - ШҚО Ұлан ауданы әкімдігінің 2010 жылғы 5 маусымдағы № 793 қаулысымен

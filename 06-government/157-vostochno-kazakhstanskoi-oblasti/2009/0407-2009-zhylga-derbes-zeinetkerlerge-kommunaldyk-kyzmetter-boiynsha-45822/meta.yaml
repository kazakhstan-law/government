act_code: '45822'
requisite: Шығыс Қазақстан облысы Зайсан ауданы әкімдігінің 2009 жылғы 7 сәуірдегі № 645 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2009 жылғы 6 мамырда № 5-11-92 тіркелді. Күші жойылды - Зайсан ауданы әкімдігінің 2010 жылғы 10 ақпандағы № 1062 қаулысымен

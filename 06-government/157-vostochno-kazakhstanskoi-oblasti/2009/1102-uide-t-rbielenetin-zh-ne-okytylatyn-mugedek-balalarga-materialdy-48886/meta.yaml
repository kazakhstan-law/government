act_code: '48886'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2009 жылғы 2 қарашадағы № 118 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2009 жылғы 30 қарашада № 5-5-100 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2012 жылғы 11 мамырдағы № 220 қаулысымен

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Уба на участке охотничьей базы товарищества с ограниченной ответственностью "Тау Тур" Шемонаихинского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Шемонаиха ауданындағы "Тау Тур" жауапкершілігі шектеулі серіктестігі аңшылық базасының учаскесіндегі Уба өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '48039'
requisite: Шығыс Қазақстан облысы Ұлан аудандық әкімдігінің 2009 жылғы 18 қыркүйектегі № 268 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2009 жылғы 25 қыркүйекте № 5-17-110 тіркелді. Қаулының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Ұлан аудандық әкімдігінің 2010 жылғы 30 маусымдағы № 05/2488 хаты
title:
  rus: Ауданның өте мұқтажды және аз қамтылған азаматтарына бір жолғы материалдық көмек бөлу және төлеу туралы Нұсқаулық

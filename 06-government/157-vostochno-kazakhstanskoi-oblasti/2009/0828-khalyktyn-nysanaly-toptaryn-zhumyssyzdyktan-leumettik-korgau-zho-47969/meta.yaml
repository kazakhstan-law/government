act_code: '47969'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2009 жылғы 28 тамыздағы № 1320 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2009 жылғы 16 қыркүйекте № 5-14-91 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2012 жылғы 21 мамырдағы № 2527 қаулысымен

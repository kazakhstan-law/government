act_code: '45911'
requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2009 жылғы 18 сәуірдегі № 195а қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2009 жылғы 6 мамырда № 5-18-78 тіркелді. Күші жойылды - қабылданған мерзімінің бітуіне байланысты (Үржар аудандық әділет басқармасының 2010 жылғы 11 қаңтардағы № 152 хаты)
title:
  rus: Үржар ауданында 2009 жылдың сәуір-маусымында және қазан-желтоқсанда қезекті мерзімді әскери қызметке шақыру туралы

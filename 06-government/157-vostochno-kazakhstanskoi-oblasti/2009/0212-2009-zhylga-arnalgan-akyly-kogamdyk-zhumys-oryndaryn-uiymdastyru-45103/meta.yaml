act_code: '45103'
requisite: Шығыс Қазақстан облысы Зайсан ауданы әкімдігінің 2009 жылғы 12 ақпандағы № 591 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2009 жылғы 20 наурызда № 5-11-90 тіркелді. Күші жойылды - Зайсан ауданы әкімдігінің 2009 жылғы 23 қарашадағы № 938 қаулысымен

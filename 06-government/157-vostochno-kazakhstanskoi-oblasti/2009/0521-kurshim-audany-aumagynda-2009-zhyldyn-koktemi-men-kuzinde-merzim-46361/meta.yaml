act_code: '46361'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2009 жылғы 21 мамырдағы № 1187 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2009 жылғы 4 маусымда № 5-14-84 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2010 жылғы 29 қаңтардағы № 1508 қаулысымен

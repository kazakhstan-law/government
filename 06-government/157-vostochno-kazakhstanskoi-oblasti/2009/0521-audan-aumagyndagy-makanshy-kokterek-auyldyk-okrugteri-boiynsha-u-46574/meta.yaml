act_code: '46574'
requisite: Шығыс Қазақстан облысы Үржар аудандық әкімдігінің 2009 жылғы 21 мамырдағы № 306 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2009 жылғы 15 маусымда № 5-18-80 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2009 жылғы 3 қарашадағы № 573 қаулысымен
title:
  rus: Аудан аумағындағы Мақаншы, Көктерек ауылдық округтері бойынша ұсақ мүйізді малдарынан бруцеллез індетінің шығуына байланысты шектеу қою туралы

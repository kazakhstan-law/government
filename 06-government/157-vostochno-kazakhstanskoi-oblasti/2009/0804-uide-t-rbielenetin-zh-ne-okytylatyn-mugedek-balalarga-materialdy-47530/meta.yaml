act_code: '47530'
requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2009 жылғы 4 тамыздағы № 244 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық Әділет басқармасында 2009 жылғы 21 тамызда № 5-10-85 тіркелді. Күші жойылды - Жарма ауданы әкімдігінің 2012 жылғы 20 сәуірдегі № 90 қаулысымен

requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2009 жылғы 6 сәуірдегі № 106 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2009 жылғы 13 мамырда № 5-10-80 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Жарма ауданы әкімдігінің 2010 жылғы 2 наурыздағы № 425 хаты

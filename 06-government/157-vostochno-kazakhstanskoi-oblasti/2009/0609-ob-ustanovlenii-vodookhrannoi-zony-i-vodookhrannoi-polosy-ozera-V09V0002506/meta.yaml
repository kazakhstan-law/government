title:
  rus: Об установлении водоохранной зоны и водоохранной полосы озера Алаколь (восточное побережье) и впадающих в него водных объектов Урджарского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Үржар ауданының Алакөл көлінің (шығыс жағалауы) және оған құятын су объектілерінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

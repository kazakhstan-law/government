act_code: '44271'
requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкмідігінің 2009 жылғы 29 қаңтардағы № 12155 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2009 жылғы 11 ақпанда № 5-15-47 тіркелді. Күші жойылды - ШҚО Көкпекті ауданы әкмідігінің 2010 жылғы 16 наурыздағы № 558 қаулысымен

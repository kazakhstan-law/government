requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2009 жылғы 20 сәуірдегі № 23 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2009 жылғы 21 мамырда № 5-15-51 тіркелді. Күші жойылды - Көкпекті ауданы әкімдігінің 2012 жылғы 16 сәуірдегі № 143 қаулысымен

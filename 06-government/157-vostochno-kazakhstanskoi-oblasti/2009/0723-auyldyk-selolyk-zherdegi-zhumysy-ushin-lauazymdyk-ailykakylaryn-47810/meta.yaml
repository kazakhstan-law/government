act_code: '47810'
requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2009 жылғы 23 шілдедегі № 224 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2009 жылғы 3 қыркүйекте № 5-15-58 тіркелді. Күші жойылды - Көкпекті ауданы әкімдігінің 2014 жылғы 18 тамыздағы № 227 қаулысымен
title:

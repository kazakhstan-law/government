act_code: '46784'
requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2009 жылғы 12 маусымдағы № 370 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2009 жылғы 30 маусымда № 5-18-81 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Үржар ауданы әкімінің аппаратының 2012 жылғы 14 қыркүйектегі № 04-13/2260 хаты)
title:
  rus: Аудан тұрғындарының нысаналы топтарға жататын адамдарының қосымша тізбесі туралы

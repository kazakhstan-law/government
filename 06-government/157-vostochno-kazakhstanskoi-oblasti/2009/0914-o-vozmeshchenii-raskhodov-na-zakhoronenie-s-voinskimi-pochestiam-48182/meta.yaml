title:
  rus: О возмещении расходов на захоронение с воинскими почестями и установлении надгробий на могилах лиц, удостоенных звания Героя Советского Союза, "Халық қаһарманы", Героя Социалистического Труда, награжденных орденом Славы трех степеней и орденом "Отан" из числа участников и инвалидов войны
  kaz: Соғысқа қатысушылар мен мүгедектер қатарынан Кеңес Одағының Батыры, "Халық қаһарманы", Социалистік Еңбек Ері атағына ие болған, Даңқ орденінің үш бірдей дәрежесімен және "Отан" орденімен марапатталған тұлғаларды әскери құрметпен жерлеуге және қабірлеріне құлпытастар орнатуға жұмсалған шығындардың орнын толтыру туралы

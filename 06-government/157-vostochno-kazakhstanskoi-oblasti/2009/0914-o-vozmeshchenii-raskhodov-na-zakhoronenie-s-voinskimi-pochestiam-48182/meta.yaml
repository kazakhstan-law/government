  title:
    rus: О признании утратившим силу постановления акимата города Усть-Каменогорска от 14 сентября 2009 года № 3652 «О возмещении расходов на захоронение с воинскими почестями и установлении надгробий на могилах лиц, удостоенных звания Героя Советского Союза, «Халық қаһарманы», Героя Социалистического Труда, награжденных Орденом Славы трех степенейи орденом «Отан» из числа участников и инвалидов войны»
    kaz: Өскемен қаласы әкімдігінің 2009 жылғы 14 қыркүйектегі № 3652 «Соғысқа қатысушылар мен мүгедектер қатарынан Кеңес Одағының Батыры, «Халық қаһарманы», Социалистік Еңбек Ері атағына ие болған, Даңқ орденінің үш бірдей дәрежесімен және «Отан» орденімен марапатталған тұлғаларды әскери құрметпен жерлеуге және қабірлеріне құлпытастар орнатуға жұмсалған шығындардың  орнын толтыру туралы» қаулысының күші жойылды деп тану туралы

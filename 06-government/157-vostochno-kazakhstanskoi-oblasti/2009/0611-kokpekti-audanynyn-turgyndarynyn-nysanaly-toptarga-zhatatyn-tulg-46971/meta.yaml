act_code: '46971'
requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2009 жылғы 11 маусымдағы № 136 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2009 жылғы 10 шілдеде № 5-15-54 тіркелді. Күші жойылды - Көкпекті ауданы әкімдігінің 2011 жылғы 17 мамырдағы № 1066 қаулысымен

act_code: '46334'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2009 жылғы 14 мамырдағы № 192 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай аудандық Әділет басқармасында 2009 жылғы 25 мамырда № 5-7-66 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2012 жылғы 30 наурыздағы № 119 қаулысымен

requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 22 мая 2009 года № 296. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 1 июля 2009 года за № 5-8-88. Утратило силу постановлением акимата Бородулихинского района Восточно-Казахстанской области от 7 марта 2013 года № 636
title:
  rus: Об утверждении инструкции возмещения затрат на проезд, питание, проживание и медицинское освидетельствование занятым и лицам, занятым уходом за детьми в возрасте до семи лет, из числа малообеспеченных, а также безработным, направленным на профессиональное обучение
  kaz: Кәсіби оқуға жіберілген аз қамтамасыз етілген отбасылардан шыққан жұмыспен қамтылған және жеті жасқа дейінгі бала тәрбиесімен шұғылданатын, сондай-ақ жұмыссыз азаматтардың жол жүру, тамақтану, тұру және медициналық куәландыру шығындарын өтеу нұсқаулығын бекіту туралы

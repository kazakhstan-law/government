requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2009 жылғы 24 қыркүйектегі № 339 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2009 жылғы 19 қазанда № 5-16-83 тіркелді. Күші жойылды - Тарбағатай ауданы әкімдігінің 2010 жылғы 01 желтоқсандағы № 382 қаулысымен

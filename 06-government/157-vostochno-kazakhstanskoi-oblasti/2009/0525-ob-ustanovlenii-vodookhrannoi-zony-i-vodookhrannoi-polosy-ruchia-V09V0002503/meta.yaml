title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Карасай в створе земельного участка товарищества с ограниченной ответственностью "Усть-Каменогорский завод полиэтиленовых труб" Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы "Полиэтилен құбырларының Өскемен зауыты" жауапкершілігі шектеулі серіктестігінің жер учаскесі тұсындағы Қарасай бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '48632'
requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2009 жылғы 28 қыркүйектегі № 325 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2009 жылғы 3 қарашада № 5-15-61 тіркелді. Күші жойылды - Көкпекті ауданы әкімдігінің 2010 жылғы 29 қарашадағы № 791 қаулысымен
title:
  rus: Қой-ешкі малдарынан бруцеллез ауруының шығуына байланысты Карағандыкөл, Тассай, Үлкенбөкен селолық округтеріне, қой-ешкі және ірі қара малдарының бруцеллез ауруының шығуына байланысты Көкжайық селолық округіне шектеу қою туралы

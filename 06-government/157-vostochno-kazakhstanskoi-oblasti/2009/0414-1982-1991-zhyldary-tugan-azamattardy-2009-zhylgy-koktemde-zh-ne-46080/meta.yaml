requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2009 жылғы 14 сәуірдегі № 121 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2009 жылғы 14 мамырда № 5-16-74 тіркелді. Күші жойылды - Тарбағатай ауданы әкімдігінің 2010 жылғы 18 мамырдағы № 130 қаулысымен

requisite: Постановление акимата города Усть-Каменогорска Восточно-Казахстанской области от 24 сентября 2009 года № 3764. Зарегистрировано Управлением юстиции города Усть-Каменогорска Восточно-Казахстанской области 15 октября 2009 года за № 5-1-122. Прекращено действие по истечении срока, на который постановление было принято, на основании письма аппарата акима города Усть-Каменогорска от 10 января 2010 года № Ин-5/16

requisite: Шығыс Қазақстан облысы Зайсан аудандық әкімдігінің 2009 жылғы 22 қыркүйектегі № 887 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2009 жылғы 7 қазанда № 5-11-103 тіркелді. Күші жойылды - Зайсан ауданы әкімдігінің 2010 жылғы 17 қарашадағы № 145 қаулысымен
title:

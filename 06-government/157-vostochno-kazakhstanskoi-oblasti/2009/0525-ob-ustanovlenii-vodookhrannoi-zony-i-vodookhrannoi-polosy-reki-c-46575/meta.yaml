title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Чар и головной части магистрального канала "Центральный" республиканского государственного предприятия "Востокводхоз" Жарминского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданы Шар өзенінің және «Шығыссушар» республикалық мемлекеттік кәсіпорнының "Центральный" магистральдық каналының бас жағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

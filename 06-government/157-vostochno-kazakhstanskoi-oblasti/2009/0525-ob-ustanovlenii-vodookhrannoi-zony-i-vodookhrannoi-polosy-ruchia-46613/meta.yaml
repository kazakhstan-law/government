  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы "Полиэтилен құбырларының Өскемен зауыты" жауапкершілігі шектеулі серіктестігінің жер учаскесі тұсындағы Қарасай бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

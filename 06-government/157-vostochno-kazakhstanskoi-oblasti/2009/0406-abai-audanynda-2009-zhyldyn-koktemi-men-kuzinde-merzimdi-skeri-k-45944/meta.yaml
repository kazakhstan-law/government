act_code: '45944'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2009 жылғы 6 сәуірдегі № 18 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2009 жылғы 12 мамырда № 5-5-92 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 22 сәуірдегі № 208 қаулысымен

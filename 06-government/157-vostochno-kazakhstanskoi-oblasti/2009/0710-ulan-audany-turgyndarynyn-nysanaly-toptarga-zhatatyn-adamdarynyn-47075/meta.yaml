act_code: '47075'
requisite: Шығыс Қазақстан облысы Ұлан аудандық әкімдігінің 2009 жылғы 10 шілдедегі № 162 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2009 жылғы 29 шілдеде № 5-17-106 тіркелді. Күші жойылды - Ұлан ауданы әкімдігінің 2013 жылғы 17 шілдедегі № 19 қаулысымен

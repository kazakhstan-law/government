requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2009 жылғы 28 желтоқсандағы № 1450 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 6 қаңтарда № 5-14-101 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2010 жылғы 8 желтоқсандағы № 1843 қаулысымен

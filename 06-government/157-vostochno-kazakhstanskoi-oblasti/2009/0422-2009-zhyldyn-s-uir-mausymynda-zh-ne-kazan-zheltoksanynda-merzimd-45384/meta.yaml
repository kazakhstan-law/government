act_code: '45384'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2009 жылғы 22 сәуірдегі № 139 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2009 жылғы 24 сәуірде № 5-7-64 тіркелді. Қаулының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Шығыс Қазақстан облысы Бесқарағай ауданындағы Әділет басқармасының бастығының 2010 жылғы 7 маусымдағы № 2383 хатымен

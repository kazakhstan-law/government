act_code: '48743'
requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2009 жылғы 3 қарашадағы № 572 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2009 жылғы 19 қарашада № 5-18-86 тіркелді. Күші жойылды - ШҚО Үржар ауданы әкімдігінің 2010 жылғы 22 қарашадағы № 552 қаулысымен

requisite: Шығыс Қазақстан облысы Ұлан аудандық әкімдігінің 2009 жылғы 6 ақпандағы № 101 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2009 жылғы 10 сәуірде № 5-17-101 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Ұлан ауданы әкімі аппаратының 2010 жылғы 15 ақпандағы № 05/525 хаты

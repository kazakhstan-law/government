act_code: '46969'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2009 жылғы 5 маусымдағы № 51 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2009 жылғы 15 шілдеде № 5-5-96 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 16 маусымдағы № 223 қаулысымен
title:

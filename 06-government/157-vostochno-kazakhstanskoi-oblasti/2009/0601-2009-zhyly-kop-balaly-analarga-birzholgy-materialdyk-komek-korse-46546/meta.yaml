act_code: '46546'
requisite: Шығыс Қазақстан облысы Ұлан аудандық әкімдігінің 2009 жылғы 1 маусымдағы № 108 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2009 жылғы 12 маусымда № 5-17-104 тіркелді. Қаулының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Ұлан аудандық әкімдігінің 2010 жылғы 30 маусымдағы № 05/2488 хаты

requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2009 жылғы 12 маусымдағы № 192 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық Әділет басқармасында 2009 жылғы 1 шілдеде № 5-10-82 тіркелді. Күші жойылды - Жарма ауданы әкімдігінің 2010 жылғы 25 наурыздағы № 118 қаулысымен

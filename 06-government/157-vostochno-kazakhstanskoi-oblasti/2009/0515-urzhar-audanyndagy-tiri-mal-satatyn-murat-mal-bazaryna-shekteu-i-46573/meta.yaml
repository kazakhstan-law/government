act_code: '46573'
requisite: Шығыс Қазақстан облысы Үржар аудандық әкімдігінің 2009 жылғы 15 мамырдағы № 304 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2009 жылғы 8 маусымда № 5-18-79 тіркелді. Күші жойылды - Үржар аудандық әкімдігінің 2009 жылғы 10 шілдедегі № 420 қаулысымен

act_code: '45483'
requisite: ПШығыс Қазақстан облысы Абай ауданы әкімдігінің 2009 жылғы 25 наурыздағы № 3 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2009 жылғы 28 сәуірде № 5-5-90 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Шығыс Қазақстан облысы Абай ауданы әкімі аппаратының 2010 жылғы 11 қаңтардағы № 5 хатымен

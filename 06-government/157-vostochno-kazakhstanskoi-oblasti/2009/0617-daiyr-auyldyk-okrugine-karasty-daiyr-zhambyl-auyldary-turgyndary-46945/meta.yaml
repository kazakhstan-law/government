requisite: Шығыс Қазақстан облысы Зайсан аудандық әкімдігінің 2009 жылғы 17 маусымдағы № 730 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық әділет басқармасында 2009 жылғы 15 шілдеде № 5-11-99 тіркелді. Күші жойылды - Зайсан аудандық әкімдігінің 2009 жылғы 3 қарашадағы № 909 қаулысымен

act_code: '44641'
requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2009 жылғы 10 ақпандағы № 48 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық Әділет басқармасында 2009 жылғы 25 ақпанда № 5-10-76 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Жарма ауданы әкімдігінің 2010 жылғы 22 қаңтардағы № 69 қаулысымен

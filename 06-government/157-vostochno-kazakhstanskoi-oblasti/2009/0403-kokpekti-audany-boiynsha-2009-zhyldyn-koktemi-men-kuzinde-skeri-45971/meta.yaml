requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2009 жылғы 3 сәуірдегі № 81 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2009 жылғы 14 мамырда № 5-15-50 тіркелді. Күші жойылды - ШҚО Көкпекті ауданы әкімдігінің 2010 жылғы 23 сәуірдегі № 596 қаулысымен

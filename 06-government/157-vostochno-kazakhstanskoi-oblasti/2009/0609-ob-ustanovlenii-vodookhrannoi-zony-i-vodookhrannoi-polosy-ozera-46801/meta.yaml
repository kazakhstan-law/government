  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 9 июня 2009 года № 92 «Об установлении водоохранной зоны и водоохранной полосы озера Алаколь (восточное побережье) и впадающих в него водных объектов Урджарского района Восточно-Казахстанской области и режима их хозяйственного использования»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2009 жылғы 9 маусымдағы № 92 «Шығыс Қазақстан облысы Үржар ауданының Алакөл көлінің (шығыс жағалауы) және оған құятын су объектілерінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы» қаулысына өзгеріс енгізу туралы

requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2009 жылғы 23 желтоқсандағы № 1040 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз ауданының Әділет басқармасында 2010 жылғы 25 қаңтарда № 5-6-101 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Аягөз ауданының әділет басқармасының 2011 жылғы 20 қаңтардағы № 04-05/263 хаты

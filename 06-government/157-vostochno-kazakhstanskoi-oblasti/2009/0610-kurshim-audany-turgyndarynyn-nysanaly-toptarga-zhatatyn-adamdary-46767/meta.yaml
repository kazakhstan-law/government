act_code: '46767'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2009 жылғы 10 маусымдағы № 1230 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2009 жылғы 1 шілдеде № 5-14-86 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2010 жылғы 29 қаңтардағы № 1508 қаулысымен

act_code: '46638'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2009 жылғы 5 маусымдағы № 210 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2009 жылғы 12 маусымда № 5-16-77 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2010 жылғы 9 маусымдағы № 191 қаулысымен

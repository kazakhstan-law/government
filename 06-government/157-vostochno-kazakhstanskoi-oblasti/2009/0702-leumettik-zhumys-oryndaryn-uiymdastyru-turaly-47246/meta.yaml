act_code: '47246'
requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2009 жылғы 2 шілдедегі № 166 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2009 жылғы 31 шілдеде № 5-15-55 тіркелді. Күші жойылды - Көкпекті ауданы әкімдігінің 2012 жылғы 27 сәуірдегі № 169 қаулысымен

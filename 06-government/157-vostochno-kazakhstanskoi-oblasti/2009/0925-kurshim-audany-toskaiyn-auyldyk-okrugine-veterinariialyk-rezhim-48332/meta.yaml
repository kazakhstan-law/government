act_code: '48332'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2009 жылғы 25 қыркүйектегі № 1338 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2009 жылғы 26 қазанда № 5-14-92 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2010 жылғы 2 қарашадағы № 1800 қаулысымен

act_code: '46967'
requisite: Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2009 жылғы 5 маусымдағы № 50 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2009 жылғы 15 шілдеде № 5-5-94 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2011 жылғы 29 қарашадағы № 106 қаулысымен

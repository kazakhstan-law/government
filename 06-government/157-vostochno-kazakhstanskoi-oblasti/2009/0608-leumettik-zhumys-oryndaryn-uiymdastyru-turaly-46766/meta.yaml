requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2009 жылғы 8 маусымдағы № 1223 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2009 жылғы 1 шілдеде № 5-14-85 тіркелді. Күші жойылды - ШҚО Күршім ауданы әкімдігінің 2010 жылғы 12 мамырдағы № 1643 қаулысымен

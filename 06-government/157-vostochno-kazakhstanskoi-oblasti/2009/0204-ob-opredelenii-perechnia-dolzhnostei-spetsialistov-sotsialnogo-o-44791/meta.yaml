requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 4 февраля 2009 года № 180. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 13 марта 2009 года за № 5-8-83. Утратило силу постановлением акимата Бородулихинского района Восточно-Казахстанской области от 28 октября 2014 года № 256
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования и культуры, которым установлено повышение к должностным окладам за работу в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерлерде жұмыс істегені үшін лауазымдық айлықақыларын көтеру белгіленген әлеуметтік қамтамасыз ету, білім беру және мәдениет мамандары лауазымдарының тізбесін анықтау туралы

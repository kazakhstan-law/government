requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2009 жылғы 15 желтоқсандағы № 637 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2010 жылғы 13 қаңтарда № 5-18-89 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2011 жылғы 24 қаңтардағы № 31 қаулысымен

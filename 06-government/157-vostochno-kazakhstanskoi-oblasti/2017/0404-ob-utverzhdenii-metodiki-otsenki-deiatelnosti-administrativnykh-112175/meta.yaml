act_code: '112175'
requisite: Постановление акимата города Курчатов Восточно-Казахстанской области от 4 апреля 2017 года № 88. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 мая 2017 года № 5008. Утратило силу постановлением акимата города Курчатова Восточно-Казахстанской области от 25 мая 2018 года № 698
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Курчатов Восточно-Казахстанской области», исполнительных органов, финансируемых из местного бюджета
  kaz: «Шығыс Қазақстан облысы Курчатов қаласы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау Әдістемесін бекіту туралы

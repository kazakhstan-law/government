act_code: '111954'
requisite: Постановление акимата города Семей Восточно-Казахстанской области от 10 апреля 2017 года № 452. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 мая 2017 года № 5007. Утратило силу - постановлением акимата города Семей Восточно-Казахстанской области от 5 апреля 2018 года № 575
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Семей Восточно-Казахстанской области», исполнительных органов, финансируемых из местного бюджета
  kaz: «Шығыс Қазақстан облысы Семей қаласы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттiк әкімшілік қызметшiлерiнiң қызметiн бағалау әдiстемесiн бекiту туралы

act_code: '111778'
requisite: Постановление акимата Аягозского района Восточно-Казахстанской области от 28 марта 2017 года № 200. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 апреля 2017 года № 4986. Утратило силу постановлением акимата Аягозского района Восточно-Казахстанской области от 27 марта 2020 года № 143 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Аягозского района Восточно-Казахстанской области», исполнительных органов, финансируемых из местного бюджета
  kaz: Шығыс Қазақстан облысы Аягөз ауданы әкімінің аппараты мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

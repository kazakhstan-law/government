act_code: '111581'
requisite: Постановление Бескарагайского районного акимата Восточно-Казахстанской области от 17 марта 2017 года № 84. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 апреля 2017 года № 4960. Утратило силу постановлением Бескарагайского районного акимата Восточно-Казахстанской области от 29 мая 2018 года № 150
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Бескарагайского района», исполнительных органов, финансируемых из местного бюджета
  kaz: «Бесқарағай ауданы әкімі аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

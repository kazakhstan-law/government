  kaz: Шығыс Қазақстан облысының «Васильевское» таукен металлургиялық компаниясы» жауапкершілігі шектеулі серіктестігі өндірістік учаскелерінің аумағында орналасқан Боко өзенінің оң жақ және сол жақ жағалауларының су қорғау аймақтары мен су қорғау белдеулерін белгілеу туралы

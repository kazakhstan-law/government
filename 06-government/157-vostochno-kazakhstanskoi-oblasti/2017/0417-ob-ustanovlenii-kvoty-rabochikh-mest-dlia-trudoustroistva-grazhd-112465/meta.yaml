act_code: '112465'
requisite: Постановление акимата Зайсанского района Восточно-Казахстанской области от 17 апреля 2017 года № 206. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 22 мая 2017 года № 5030. Утратило силу постановлением акимата Зайсанского района Восточно-Казахстанской области от 4 мая 2020 года № 226 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін квота белгілеу туралы

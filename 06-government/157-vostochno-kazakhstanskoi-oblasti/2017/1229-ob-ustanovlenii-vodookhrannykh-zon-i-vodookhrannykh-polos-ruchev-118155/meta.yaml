act_code: '118155'
requisite: Постановление Восточно-Казахстанского областного акимата от 29 декабря 2017 года № 366. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 22 января 2018 года № 5458
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев № 1 и № 2 в створе участков под строительство воздушной линии электропередач 6 кВт товарищества с ограниченной ответственностью «Алем Петролеум» в Зыряновском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысының Зырян ауданында «Алем Петролеум» жауапкершілігі шектеулі серіктестігінің 6 кВт әуе электр жеткізу желісінің құрылысы учаскелерінің тұстамасында № 1 және № 2 бұлақтарының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

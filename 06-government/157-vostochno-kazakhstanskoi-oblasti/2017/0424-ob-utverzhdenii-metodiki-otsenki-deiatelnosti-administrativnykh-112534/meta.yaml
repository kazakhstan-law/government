requisite: Постановление акимата Абайского района Восточно-Казахстанской области от 24 апреля 2017 года № 228. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 мая 2017 года № 5038.  Утратило силу - постановлением акимата Абайского района Восточно-Казахстанской области от 19 апреля 2018 года № 71
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Абайского района», местных исполнительных органов, финансируемых из местного бюджета
  kaz: «Абай ауданы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

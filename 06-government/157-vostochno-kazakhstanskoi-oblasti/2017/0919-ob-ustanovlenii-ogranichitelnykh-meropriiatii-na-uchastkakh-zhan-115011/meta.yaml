act_code: '115011'
requisite: Постановление акимата Тарбагатайского района Восточно-Казахстанской области от 19 сентября 2017 года № 403. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 сентября 2017 года № 5221. Утратило силу - постановлением акимата Тарбагатайского района Восточно-Казахстанской области от 28 февраля 2018 года № 114
title:
  rus: Об установлении ограничительных мероприятий на участках «Жаңаауыл», «Көкжыра» Кокжиринского сельского округа, участке «Қызылқора» Кумколского сельского округа, участке «Жүніс» Ойшиликского сельского округа, участке «Үмбет» Киндиктинского сельского округа и участке «Көкжайдақ» Аксуатского сельского округа Тарбагатайского  района
  kaz: Тарбағатай ауданының Көкжыра ауылдық округiнiң «Жаңаауыл», «Көкжыра» учаскелеріне, Құмкөл ауылдық округiнiң «Қызылқора» учаскесіне, Ойшілік ауылдық округiнiң «Жүніс» учаскесіне, Кіндікті ауылдық округінің «Үмбет» учаскесіне және Ақсуат ауылдық округінің «Көкжайдақ» бөлігіне шектеу iс-шараларын белгiлеу туралы

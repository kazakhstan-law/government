requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 14 апреля 2017 года № 98. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 16 мая 2017 года № 5019. Утратило силу - постановлением акимата Шемонаихинского района Восточно-Казахстанской области от 29 июня 2017 года № 160
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квоталарын белгілеу туралы

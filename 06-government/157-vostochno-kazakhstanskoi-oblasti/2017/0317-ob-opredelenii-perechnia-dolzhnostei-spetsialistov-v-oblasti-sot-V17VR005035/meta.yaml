  title:
    rus: О внесении изменения в постановление акимата Урджарского района от 17 марта 2017 года № 72 «Об определении перечня должностей специалистов в области социального обеспечения и культуры являющихся гражданскими служащими и работающих в сельской местности Урджарского района области Абай»
    kaz: Үржар ауданы әкімдігінің 2017 жылғы 17 наурыздағы № 72 «Абай облысы Үржар ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

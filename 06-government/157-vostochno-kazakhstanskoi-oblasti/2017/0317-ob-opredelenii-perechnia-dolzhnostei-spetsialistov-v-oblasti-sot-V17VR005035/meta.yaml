title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения и культуры являющихся гражданскими служащими и работающих в сельской местности Урджарского района области Абай
  kaz: Абай облысы Үржар ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

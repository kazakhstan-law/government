title:
  rus: Об установлении водоохранной зоны и водоохранной полосы правого берега реки Кедровка в створе земельного участка, расположенного по улице Кедровская 32, в городе Риддер (поселок Ульба) Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласында (Үлбі кенті) Кедровская көшесі, 32-де орналасқан жер учаскесінің тұстамасындағы Кедровка өзенінің оң жағалауының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

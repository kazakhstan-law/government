title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Иртыш в створе земельных участков, предназначенных для промышленной разработки Семиярского месторождения песчано-гравийной смеси в Бескарагайском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Бесқарағай ауданындағы Семияр құм-қиыршық қоспасы кенорнын өнеркәсіптік игеруге арналған жер учаскелері тұстамасындағы Ертіс өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

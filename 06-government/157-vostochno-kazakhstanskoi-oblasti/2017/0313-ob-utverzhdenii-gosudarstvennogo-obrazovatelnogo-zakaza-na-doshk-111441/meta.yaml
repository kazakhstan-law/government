  title:
    rus: О внесении изменений в постановление акимата Бородулихинского района Восточно-Казахстанской области от 13 марта 2017 года № 43  «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размеров подушевого финансирования и родительской платы на 2017 год по Бородулихинскому району»
    kaz: «Бородулиха ауданы бойынша 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» Шығыс Қазақстан облысы Бородулиха ауданы әкімдігінің 2017 жылғы 13 наурыздағы № 43 қаулысына өзгерістер енгізу туралы

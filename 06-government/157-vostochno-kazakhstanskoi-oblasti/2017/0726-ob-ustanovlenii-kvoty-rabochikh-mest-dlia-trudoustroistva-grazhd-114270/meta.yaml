requisite: Постановление Катон-Карагайского районного акимата Восточно-Казахстанской области от 26 июля 2017 года № 261. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 августа 2017 года № 5179. Утратило силу постановлением акимата Катон-Карагайского района Восточно-Казахстанской области от 16 июля 2018 года № 307
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся  выпускниками организаций образования по Катон-Карагайскому району на 2017 год
  kaz: Катонқарағай ауданы бойынша 2017 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

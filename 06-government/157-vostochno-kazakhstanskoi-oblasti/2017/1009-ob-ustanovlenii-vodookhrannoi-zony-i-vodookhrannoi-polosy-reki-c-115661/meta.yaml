title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Чар на участке горного отвода месторождения песчано-гравийной смеси «Вознесенское» в Жарминском районе  Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданындағы «Вознесенское» құм-қиыршық қоспалы кен орнының кен иелігі учаскесінде Шар өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

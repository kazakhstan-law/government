title:
  rus: Об установлении водоохранной зоны и водоохранной полосы Усть-Каменогорского водохранилища в створе участков под строительство пирса, цеха по выращиванию мальков рыб и бытовых помещений в селе Ермаковка Зыряновского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Зырян ауданының Ермаковка ауылында пирс, балық шабақтарын өсіру цехы және тұрмыстық үй-жайлар құрылысына арналған жер учаскелерінің тұсындағы Өскемен су қоймасының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '112100'
requisite: Постановление Зайсанского районного акимата Восточно-Казахстанской области от 27 марта 2017 года № 162. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 апреля 2017 года № 4973. Утратило силу постановлением акимата Зайсанского района Восточно-Казахстанской области от 4 марта 2019 года № 164
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Зайсанского района Восточно-Казахстанской области», исполнительных органов, финансируемых из местного бюджета
  kaz: «Шығыс Қазақстан облысы Зайсан ауданы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

requisite: Постановление Уланского районного акимата Восточно-Казахстанской области от 4 апреля 2017 года № 131. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 мая 2017 года № 5000. Утратило силу - постановлением Уланского районного акимата Восточно-Казахстанской области от 16 апреля 2018 года № 142
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Уланского района», исполнительных органов, финансируемых из местного бюджета
  kaz: «Ұлан ауданы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

act_code: '111286'
requisite: Постановление акимата Урджарского района Восточно-Казахстанской области от 28 марта 2017 года № 77. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 7 апреля 2017 года № 4939. Утратило силу постановлением акимата Урджарского района Восточно-Казахстанской области от 24 мая 2018 года № 176
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса "Б" местных исполнительных органов, финансируемых из бюджета Урджарского района и административных государственных служащих ГУ «Аппарат акима Урджарского района»
  kaz: Үржар ауданы бюджетінен қаржыландырылатын атқарушы органдардың "Б" корпусы мемлекеттік әкiмшiлiк қызметшiлерiнiң және «Үржар ауданы әкімі аппараты» мемлекеттік мекемесінің әкiмшiлiк қызметшiлерiнiң қызметiн бағалау әдiстемесiн бекiту туралы

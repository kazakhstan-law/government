act_code: '111796'
requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 30 марта 2017 года № 141. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 апреля 2017 года № 4976. Утратило силу постановлением Глубоковского районного акимата от 25 мая 2018 года № 290
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Глубоковского района Восточно-Казахстанской области», исполнительных органов, финансируемых из местного бюджета
  kaz: «Шығыс Қазақстан облысы Глубокое ауданы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

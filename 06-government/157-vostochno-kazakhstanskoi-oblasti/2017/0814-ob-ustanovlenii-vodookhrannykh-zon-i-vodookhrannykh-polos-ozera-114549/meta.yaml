title:
  rus: Об установлении водоохранных зон и водоохранных полос озера Дубыгалинское, озера Маленькое, двух ручьев без названия, впадающих в озеро Дубыгалинское, в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданының Дұбығалы көлі, Дұбығалы көліне құятын Маленькое көлі, атауы жоқ екі бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

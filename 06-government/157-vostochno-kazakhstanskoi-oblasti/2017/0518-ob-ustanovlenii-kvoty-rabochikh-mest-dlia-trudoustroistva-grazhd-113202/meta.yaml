act_code: '113202'
requisite: Постановление акимата Урджарского района Восточно-Казахстанской области от 18 мая 2017 года № 155. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 июня 2017 года № 5089. Утратило силу постановлением акимата Урджарского района области Абай от 13 октября 2023 года № 330 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе олардың қамқорлығынсыз қалған білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін квота белгілеу туралы

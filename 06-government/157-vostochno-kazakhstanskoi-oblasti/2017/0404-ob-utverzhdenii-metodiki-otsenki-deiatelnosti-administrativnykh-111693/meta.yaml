requisite: Постановление акимата Тарбагатайского района Восточно-Казахстанской области от 4 апреля 2017 года № 154. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 апреля 2017 года № 4991. Утратило силу постановлением акимата Тарбагатайского района Восточно-Казахстанской области от 8 июня 2018 года № 312
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса "Б" государственного учреждения «Аппарат акима Тарбагатайского района», исполнительных органов, финансируемых из местного бюджета
  kaz: «Тарбағатай ауданы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың "Б" корпусы мемлекеттік әкiмшiлiк қызметшiлерiнiң қызметiн бағалау әдiстемесiн бекiту туралы

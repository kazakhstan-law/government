act_code: '117126'
requisite: Постановление акимата Зыряновского района Восточно-Казахстанской области от 11 декабря 2017 года № 451. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 декабря 2017 года № 5375. Утратило силу постановлением акимата района Алтай Восточно-Казахстанской области от 21 июля 2023 года № 458 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об установлении единого тарифа для всех маршрутов на регулярные автомобильные перевозки пассажиров и багажа в городском сообщении на территории городов Зыряновск и Серебрянск
  kaz: Зырян және Серебрянск қалаларының аумағында жолаушылар мен багажды қалалық қатынаста автомобильмен тұрақты тасымалдауға бірыңғай тарифін барлық маршруттар үшін белгілеу туралы

  requisite: Постановление акимата Урджарского района Восточно-Казахстанской области от 3 апреля 2019 года № 98. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 апреля 2019 года № 5837. Действие постановления приостановлено постановлением акимата Урджарского района Восточно-Казахстанской области от 21 мая 2019 года № 172
  title:
    rus: О внесении изменений в постановление акимата Урджарского района от 17 марта 2017 года № 72 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта являющихся гражданскими служащими работающих в сельской местности»
    kaz: Үржар ауданы әкімдігінің 2017 жылғы 17 наурыздағы № 72 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

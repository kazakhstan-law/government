  title:
    rus: О внесении изменений в постановление акимата Урджарского района от 17 марта 2017 года № 72 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта являющихся гражданскими служащими работающих в сельской местности»
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Үржар ауданы әкімдігінің 2017 жылғы 17 наурыздағы № 72 қаулысына өзгерістер енгізу туралы

  code: '143001'
  requisite: Постановление акимата Урджарского района Восточно-Казахстанской области от 18 мая 2020 года № 181. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 мая 2020 года № 7095
  title:
    rus: О внесении изменений в постановление акимата Урджарского района от 17 марта 2017 года № 72 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий являющихся гражданскими служащими работающих в сельской местности»
    kaz: Үржар ауданы әкімдігінің 2017 жылғы 17 наурыздағы № 72 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/143001/rus

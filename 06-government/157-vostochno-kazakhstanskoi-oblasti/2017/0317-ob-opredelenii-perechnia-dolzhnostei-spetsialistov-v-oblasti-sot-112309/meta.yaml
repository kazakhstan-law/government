  title:
    rus: О внесении изменений в постановление акимата Урджарского района от 17 марта 2017 года № 72 «Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности Урджарского района области Абай
    kaz: Үржар ауданы әкімдігінің 2017 жылғы 17 наурыздағы № 72 «Азаматтық қызметшілер болып табылатын және Абай облысы Үржар ауданының ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Тарбагатайского района Восточно-Казахстанской области от 28 апреля 2017 года № 178. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 1 июня 2017 года № 5054
title:
  rus: О признании утратившим силу постановления акимата Тарбагатайского района за № 214 от 11 мая 2016 года «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размеров подушевого финансирования и родительской платы на 2016 год»
  kaz: Тарбағатай ауданы әкімдігінің 2016 жылғы 11 мамырдағы «2016 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерлерін бекіту туралы» № 214 қаулысының күшін жою туралы

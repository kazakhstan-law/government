title:
  rus: Об установлении водоохранной зоны и водоохраной полосы для левого берега ручья Безымянный, в створе артезианской скважины Ак-Кайнар, расположенного в 0,5 км западнее села Караой Курчумского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданының Қараой ауылынан батысқа қарай 0,5 км қашықтықта орналасқан Ақ-Қайнар артезиан ұңғымасы тұстамасындағы Безымянный бұлағының сол жағалауына арналған су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

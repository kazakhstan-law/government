requisite: Постановление акимата Кокпектинского района Восточно-Казахстанской области от 26 апреля 2017 года № 114. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 мая 2017 года № 5040. Утратило силу постановлением акимата Кокпектинского района области Абай от 13 ноября 2023 года № 335 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Кокпектинского района», исполнительных органов, финансируемых из местного бюджета
  kaz: «Көкпекті ауданы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 5 декабря 2017 года № 319. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 декабря 2017 года № 5345. Утратило силу постановлением Восточно-Казахстанского областного акимата от 26 марта 2020 года № 97 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства продуктов ее глубокой переработки»
  kaz: «Қайта өңдеуші кәсіпорындардың  ауыл шаруашылығы өнімін тереңдете қайта өңдеп өнім өндіру үшін оны сатып алуға арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

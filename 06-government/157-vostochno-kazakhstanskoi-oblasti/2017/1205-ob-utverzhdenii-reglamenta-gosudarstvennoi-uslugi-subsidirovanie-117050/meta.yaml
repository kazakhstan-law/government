  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 5 декабря 2017 года № 319 «Об утверждении регламента государственной услуги «Субсидирование затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства продуктов ее глубокой переработки»
    kaz: «Қайта өңдеуші кәсіпорындардың ауыл шаруашылығы өнімін тереңдете қайта өңдеп өнім өндіру үшін оны сатып алуға арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2017 жылғы 5 желтоқсандағы № 319 қаулысына өзгеріс енгізу туралы

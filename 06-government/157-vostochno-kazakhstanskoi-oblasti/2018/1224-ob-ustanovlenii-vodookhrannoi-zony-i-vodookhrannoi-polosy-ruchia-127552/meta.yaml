  kaz: Шығыс Қазақстан облысы Глубокое ауданы 05-068-086 есеп кварталы аумағында (Радужный ауылының оңтүстік - шығысына қарай) Безымянный ключ бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

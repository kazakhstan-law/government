requisite: Постановление акимата Абайского района Восточно-Казахстанской области от 26 марта 2018 года № 62. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 апреля 2018 года № 5592. Утратило силу постановлением акимата Абайского района Восточно-Казахстанской области от 1 апреля 2021 года № 46 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

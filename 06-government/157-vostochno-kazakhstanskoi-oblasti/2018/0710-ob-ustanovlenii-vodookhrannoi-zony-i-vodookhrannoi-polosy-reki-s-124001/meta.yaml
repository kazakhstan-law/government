act_code: '124001'
requisite: Постановление Восточно-Казахстанского областного акимата от 10 июля 2018 года № 220. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 августа 2018 года № 5665
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Сарыозек на испрашиваемом товариществом с ограниченной ответственностью «TODINI CENTRAL ASIA» (Тодини Централ Азия) земельном участке в учетном квартале № 05-079-009 в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы № 05-079-009 есеп кварталы жер учаскесіндегі «TODINI CENTRAL ASIA» (Тодини Централ Азия) жауапкершілігі шектеулі серіктестігі сұрап отырған Сарыөзек өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '124002'
requisite: Постановление Восточно-Казахстанского областного акимата от 10 июля 2018 года № 221. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 августа 2018 года № 5671
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Сартымбет на испрашиваемом товариществом с ограниченной ответственностью «TODINI CENTRAL ASIA» (Тодини Централ Азия) земельном участке в учетном квартале № 05-079-017 в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы № 05-079-017 есеп Кварталы жер учаскесіндегі «TODINI CENTRAL ASIA» (Тодини Централ Азия) жауапкершілігі шектеулі серіктестігі сұрап отырған Сартымбет өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

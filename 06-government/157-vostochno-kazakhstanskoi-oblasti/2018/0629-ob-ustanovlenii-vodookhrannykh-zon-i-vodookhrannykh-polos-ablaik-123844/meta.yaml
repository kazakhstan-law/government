act_code: '123844'
requisite: Постановление Восточно-Казахстанского областного акимата от 29 июня 2018 года № 207. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 июля 2018 года № 5662
title:
  rus: 'Об установлении водоохранных зон и водоохранных полос Аблайкетских (Сибинских) озер, в том числе: Караколь, Коржинколь, Шалкар, Торткара, Садырколь, реки Талдыбулак и безымянных ручьев в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования'
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Абылайкет (Сибинское) көлдерінің, соның ішінде Қаракөл, Қоржынкөл, Шалқар, Төртқара, Садыркөл көлдерінің, Талдыбұлақ өзенінің және атауы жоқ бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

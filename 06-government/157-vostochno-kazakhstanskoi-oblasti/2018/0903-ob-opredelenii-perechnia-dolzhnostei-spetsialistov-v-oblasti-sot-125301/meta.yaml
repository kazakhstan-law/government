act_code: '125301'
requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 3 сентября 2018 года № 447. Зарегистрировано Управлением юстиции Глубоковского района Департамента юстиции Восточно-Казахстанской области 28 сентября 2018 года № 5-9-182. Утратило силу постановлением Глубоковского районного акимата Восточно-Казахстанской области от 6 декабря 2023 года № 525 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

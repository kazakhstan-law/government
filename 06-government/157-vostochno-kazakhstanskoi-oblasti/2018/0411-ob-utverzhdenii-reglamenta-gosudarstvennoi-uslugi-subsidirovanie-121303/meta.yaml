  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 11 апреля 2018 года № 104 «Об утверждении регламента государственной услуги «Субсидирование ставок вознаграждения при кредитовании, а также лизинге на приобретение сельскохозяйственных животных, техники и технологического оборудования»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2018 жылғы 11 сәуірдегі № 104 «Ауыл шаруашылығы малын, техниканы және технологиялық жабдықты сатып алуға кредит беру, сондай-ақ лизинг кезінде сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

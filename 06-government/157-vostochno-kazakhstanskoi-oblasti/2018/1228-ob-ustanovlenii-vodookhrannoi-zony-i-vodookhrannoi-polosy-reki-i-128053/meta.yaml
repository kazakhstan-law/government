act_code: '128053'
requisite: Постановление Восточно-Казахстанского областного акимата от 28 декабря 2018 года № 394. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 января 2019 года № 5725
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Иртыш (правый берег) на земельном участке для организации подъездных путей, моста к острову «Глухой» в селе Прапорщиково Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Прапорщиково ауылындағы «Глухой» аралына кірме жолдар, көпір ұйымдастыруға арналған жер учаскесінде Ертіс өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '127608'
requisite: Постановление Восточно-Казахстанского областного акимата от 24 декабря 2018 года № 385. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 декабря 2018 года № 5716
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Малая Убинка и реки Быструха (левый берег) в створе земельных участков для проектирования линии электроснабжения северо-восточнее села Быструха Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Быструха ауылының солтүстік-шығысына қарай электр беру желісін жобалауға арналған жер учаскелері тұстамасындағы Малая Убинка өзенінің және Быструха өзенінің (сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

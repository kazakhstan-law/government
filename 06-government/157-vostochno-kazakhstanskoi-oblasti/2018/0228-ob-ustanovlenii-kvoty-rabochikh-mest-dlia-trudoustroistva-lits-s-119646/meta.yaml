    kaz: «Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» Зайсан ауданының әкімдігінің 2018 жылғы 28 ақпандағы № 164 қаулысына өзгеріс енгізу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 12 декабря 2018 года № 362. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 декабря 2018 года № 5705
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы притока реки Иртыш (правый берег) на участке промышленной разработки строительного камня «Уваровский» Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданының «Уваровский» құрылыс тасын өнеркәсіптік игеру учаскесіндегі Ертіс өзені ағынының (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

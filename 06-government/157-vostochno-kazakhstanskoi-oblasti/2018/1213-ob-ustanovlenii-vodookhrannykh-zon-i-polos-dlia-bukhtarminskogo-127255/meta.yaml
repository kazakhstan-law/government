  kaz: Шығыс Қазақстан облысы Катонқарағай ауданы № 05-071-038 есеп кварталында демалыс базасын салу үшін «Музтау и К» жауапкершілігі шектеулі серіктестігі сұрап отырған жер учаскесінде Бұқтырма су қоймасының су қорғау аймақтары мен белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

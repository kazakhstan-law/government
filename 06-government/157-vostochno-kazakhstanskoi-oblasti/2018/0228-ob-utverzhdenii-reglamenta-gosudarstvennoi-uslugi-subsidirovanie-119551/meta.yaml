  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 28 февраля 2018 года № 53 «Об утверждении регламента государственной услуги «Субсидирование процентной ставки по кредитным и лизинговым обязательствам в рамках направления по финансовому оздоровлению субъектов агропромышленного комплекса»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2018 жылғы 28 ақпандағы № 53 «Агроөнеркәсіптік кешен субъектілерін қаржылық сауықтыру жөніндегі бағыт шеңберінде кредиттік және лизингтік міндеттемелер бойынша пайыздық мөлшерлемені субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

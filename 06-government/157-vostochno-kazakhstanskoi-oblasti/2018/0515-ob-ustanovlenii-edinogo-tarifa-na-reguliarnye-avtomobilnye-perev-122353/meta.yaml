  title:
    rus: О внесении изменений в постановление акимата города Риддера от 15 мая 2018 года № 369 «Об установлении единого тарифа на регулярные автомобильные перевозки пассажиров и багажа в городском сообщении на территории города Риддера»
    kaz: Риддер қаласы әкімдігінің 2018 жылғы 15 мамырдағы № 369 «Риддер қаласының аумағында жолаушылар мен багажды қалалық қатынаста автомобильмен тұрақты тасымалдауға бірыңғай тарифті белгілеу туралы» қаулысына өзгерістер енгізу туралы

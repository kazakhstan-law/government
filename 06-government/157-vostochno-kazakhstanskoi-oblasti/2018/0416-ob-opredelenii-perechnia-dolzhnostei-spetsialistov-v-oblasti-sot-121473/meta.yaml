act_code: '121473'
requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 16 апреля 2018 года № 78. Зарегистрировано Управлении юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 2 мая 2018 года № 5-8-154. Утратило силу постановлением акимата Бородулихинского района области Абай от 15 декабря 2023 года № 337 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

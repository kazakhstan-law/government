  requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 17 февраля 2020 года № 39. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 февраля 2020 года № 6735. Утратило силу постановлением акимата Бородулихинского района области Абай от 15 декабря 2023 года № 337 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Бородулихинского района Восточно-Казахстанской области от 16 апреля 2018 года № 78 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» Шығыс Қазақстан облысы Бородулиха ауданы әкімдігінің 2018 жылғы 16 сәуірдегі № 78 қаулысына өзгеріс енгізу туралы

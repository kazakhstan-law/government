requisite: Постановление Восточно-Казахстанского областного акимата от 4 декабря 2018 года № 349. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 декабря 2018 года № 5703
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Рулевка в створе земельных участков животноводческого комплекса товарищества с ограниченной ответственностью «Рулиха» в селе Михайловка Шемонаихинского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Шемонаиха ауданының Михайловка ауылындағы «Рулиха» жауапкершілігі шектеулі серіктестігі мал шаруашылығы кешені жер учаскелерінің тұстамасындағы Рулевка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

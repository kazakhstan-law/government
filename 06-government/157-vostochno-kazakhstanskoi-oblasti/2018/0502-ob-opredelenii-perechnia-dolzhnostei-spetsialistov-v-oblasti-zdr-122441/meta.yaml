act_code: '122441'
requisite: Постановление акимата Уланского района Восточно-Казахстанской области от 2 мая 2018 года № 177. Зарегистрировано Управлением юстиции Уланского района Департамента юстиции Восточно-Казахстанской области 8 июня 2018 года № 5-17-182. Утратило силу постановлением Уланского районного акимата Восточно-Казахстанской области от 13 мая 2020 года № 143 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, являющихся гражданскими служащими и работающих в сельских населенных пунктах
  kaz: Азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандар лауазымдарының тізбесін анықтау туралы

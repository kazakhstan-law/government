act_code: '118964'
requisite: Постановление Катон-Карагайского районного акимата Восточно-Казахстанской области от 6 февраля 2018 года № 43. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 февраля 2018 года № 5489
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы,  лиц, состоящих на учете службы пробации по Катон-Карагайскому району на 2018 год
  kaz: Катонқарағай ауданы бойынша 2018 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

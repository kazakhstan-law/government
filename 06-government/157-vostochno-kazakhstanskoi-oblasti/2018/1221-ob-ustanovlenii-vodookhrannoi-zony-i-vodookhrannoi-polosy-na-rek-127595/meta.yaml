title:
  rus: Об установлении водоохранной зоны и водоохранной полосы на реках Кызылсу и Жалгызагаш в границах геологического отвода товарищества с ограниченной ответственностью «IRG Kazakhstan» в Жарминском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданында «IRG Kazakhstan» жауапкершілігі шектеулі серіктестігінің геологиялық бұру шекараларындағы Қызылсу және Жалғызағаш өзендерінде су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '124000'
requisite: Постановление Восточно-Казахстанского областного акимата от 10 июля 2018 года № 219. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 августа 2018 года № 5670
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Балгабай на испрашиваемом товариществом с ограниченной ответственностью «TODINI CENTRAL ASIA» (Тодини Централ Азия) земельном участке в учетном квартале № 05-079-015 в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы № 05-079-015 есеп кварталы жер учаскесіндегі «TODINI CENTRAL ASIA» (Тодини Централ Азия) жауапкершілігі шектеулі серіктестігі сұрап отырған Балғабай өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

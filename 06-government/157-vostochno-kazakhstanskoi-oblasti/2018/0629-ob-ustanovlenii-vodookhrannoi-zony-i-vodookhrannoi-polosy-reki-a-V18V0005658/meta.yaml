title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Аблакетка в створе земельных участков №№ 44, 45, 46, 47, 86 садоводческого товарищества «Ветерок» в селе Самсоновка Восточно-Казахстанской области и режима их хозяйственного использования

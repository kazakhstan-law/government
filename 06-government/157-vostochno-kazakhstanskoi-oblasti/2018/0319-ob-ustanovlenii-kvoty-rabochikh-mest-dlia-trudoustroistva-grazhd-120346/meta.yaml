  requisite: Постановление акимата Зыряновского района Восточно-Казахстанской области от 24 июля 2018 года № 254. Зарегистрировано Управлением юстиции Зыряновского района Департамента юстиции Восточно-Казахстанской области 10 августа 2018 года № 5-12-164
  title:
    rus: О внесении изменения в постановление акимата Зыряновского района от 19 марта 2018 года № 92 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2018 год»
    kaz: «2018 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» Зырян ауданы әкімдігінің 2018 жылғы 19 наурыздағы № 92 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/124136/rus

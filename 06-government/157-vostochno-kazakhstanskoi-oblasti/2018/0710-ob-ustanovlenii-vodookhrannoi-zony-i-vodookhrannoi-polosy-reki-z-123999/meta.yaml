requisite: Постановление Восточно-Казахстанского областного акимата от 10 июля 2018 года № 218. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 августа 2018 года № 5669
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Жанама на испрашиваемом товариществом с ограниченной ответственностью «TODINI CENTRAL ASIA» (Тодини Централ Азия) земельном участке в учетном квартале № 05-243-008 в Жарминском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Жарма ауданындағы № 05-243-008 есеп кварталы жер учаскесіндегі «TODINI CENTRAL ASIA» (Тодини Централ Азия) жауапкершілігі шектеулі серіктестігі сұрап отырған Жанама өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

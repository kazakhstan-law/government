title:
  rus: Об установлении публичного сервитута товариществу с ограниченной ответственностью «Казцинк» для проведения наземных геофизических и геохимических работ, разведки полезных ископаемых в пределах границ геологического отвода Ревнюшинской площади
  kaz: «Казцинк» жауапкершілігі шектеулі серіктестігіне Ревнюшинский алаңында геологиялық бөлу шекарасы шегінде жер үсті геофизикалық және геохимиялық жұмыстарды, пайдалы қазбаларға барлау жүргізу үшін  қауымдық сервитут орнату туралы

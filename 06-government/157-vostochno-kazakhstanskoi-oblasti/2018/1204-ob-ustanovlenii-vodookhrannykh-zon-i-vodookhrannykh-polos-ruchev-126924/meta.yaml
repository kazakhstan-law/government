  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Р.М. Сәулебаев сұрап отырған 05-079-002 есеп кварталы жер учаскесіндегі (босалқы жерлер) Ортажүрек және Талдыбұлақ бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

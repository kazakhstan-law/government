act_code: '127253'
requisite: Постановление Восточно-Казахстанского областного акимата от 14 декабря 2018 года № 369. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 декабря 2018 года № 5707
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Уланка, левобережного притока реки Уланка (правый берег) и оросительного канала для проектирования системы водоснабжения и электроснабжения на территории села Герасимовка Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Герасимовка ауылының аумағында сумен жабдықтау және электрмен жабдықтау жүйесін жобалау үшін Уланка өзенінің, Уланка өзенінің сол жағалау сағасының (оң жағалау) және суару каналының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

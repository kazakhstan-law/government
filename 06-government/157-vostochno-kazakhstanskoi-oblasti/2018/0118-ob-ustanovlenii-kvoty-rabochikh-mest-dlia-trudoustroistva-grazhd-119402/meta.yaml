requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 18 января 2018 года № 13. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 марта 2018 года № 5514. Утратило силу постановлением акимата Шемонаихинского района Восточно-Казахстанской области от 27 февраля 2019 года № 54
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2018 год
  kaz: 2018 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

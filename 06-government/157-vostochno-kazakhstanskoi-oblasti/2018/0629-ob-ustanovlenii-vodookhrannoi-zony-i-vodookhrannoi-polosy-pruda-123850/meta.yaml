requisite: Постановление Восточно-Казахстанского областного акимата от 29 июня 2018 года № 206. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 июля 2018 года № 5660
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы пруда на реке Маховка в створе границ земельных участков для строительства многоквартирного жилого дома в селе Солнечное Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысының Глубокое ауданының Солнечное ауылындағы көппәтерлі тұрғын үй құрылысына арналған жер учаскелері шекараларының тұстамасындағы Маховка өзеніндегі тоғанның су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

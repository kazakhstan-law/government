act_code: '127258'
requisite: Постановление Восточно-Казахстанского областного акимата от 12 декабря 2018 года № 361. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 декабря 2018 года № 5711
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Правая Убинка, реки Талмачиха, реки Киргинчиха, реки Левая Убинка и ручьев без названия в створе испрашиваемых товариществом с ограниченной ответственностью «Самырсын» земельных участков в учетном квартале № 05-068 Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы № 05-068 есеп кварталындағы «Самырсын» жауапкершілігі шектеулі серіктестігі сұрап отырған жер учаскелерінің тұстамасындағы Правая Убинка өзені, Талмачиха өзені, Киргинчиха өзені, Левая Убинка өзені және атауы жоқ бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

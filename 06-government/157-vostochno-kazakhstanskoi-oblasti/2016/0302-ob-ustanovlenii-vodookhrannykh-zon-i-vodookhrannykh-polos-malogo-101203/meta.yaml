title:
  rus: Об установлении водоохранных зон и водоохранных полос малого ручья, родников и руслового пруда на участке культурно-досугового центра в 23 жилом районе города Усть-Каменогорска Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы Өскемен қаласының 23 тұрғын ауданындағы мәдени-демалыс участкесінде шағын жылғалар, бұлақтар және арналық тоғанның су қорғау аймақтарын және су қорғау белдеулерін белгілеу туралы

act_code: '106578'
requisite: Постановление Зайсанского районного акимата Восточно-Казахстанской области от 29 августа 2016 года № 119
title:
  rus: О признании утратившим силу постановление акимата Зайсанского района «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций» № 388 от 7 июля 2015 года
  kaz: Зайсан ауданының әкімдігінің 2015 жылғы 7 шілдедегі «Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ, бас бостандығынан айыру  орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы» № 388 қаулысының күшін жою туралы

  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 22 декабря 2016 года № 393 «Об установлении мест для массового отдыха, туризма и спорта на водных объектах и водохозяйственных сооружениях Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысының су объектiлерi мен су шаруашылығы құрылыстарындағы көпшiлiктiң демалуына, туризм мен спортқа арналған жерлерін белгілеу туралы» Шығыс Қазақстан облысы әкімдігінің 2016 жылғы 22 желтоқсандағы № 393 қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата Кокпектинского района Восточно-Казахстанской области от 16 марта 2016 года № 74. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 апреля 2016 года № 4479. Утратило силу постановлением акимата Кокпектинского района Восточно-Казахстанской области от 6 августа 2020 года № 253 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в  сельской местности
  kaz: Азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария, саласындағы мамандар лауазымдарының  тізбесін айқындау туралы

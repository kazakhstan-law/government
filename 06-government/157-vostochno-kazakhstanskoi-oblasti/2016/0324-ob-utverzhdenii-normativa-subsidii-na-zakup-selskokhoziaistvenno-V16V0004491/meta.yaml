  title:
    rus: О внесении изменений в постановление Восточно-Казахстанского областного акимата от 24 марта 2016 года № 80 «Об утверждении норматива субсидий закупаемой сельскохозяйственной продукции, по которой устанавливаются гарантированная закупочная цена и закупочная цена»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2016 жылғы 24 наурыздағы № 80 «Кепілдендірілген сатып алу бағасы мен сатып алу бағасы белгіленетін сатып алынатын ауылшаруашылық өнімі субсидияларының нормативін бекіту туралы» қаулысына өзгерістер енгізу туралы

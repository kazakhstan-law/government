act_code: '109364'
requisite: Постановление акимата Курчумского района Восточно-Казахстанской области от 7 декабря 2016 года № 331. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 января 2017 года № 4854. Утратило силу постановлением акимата Курчумского района Восточно-Казахстанской области от 10 декабря 2019 года № 410 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

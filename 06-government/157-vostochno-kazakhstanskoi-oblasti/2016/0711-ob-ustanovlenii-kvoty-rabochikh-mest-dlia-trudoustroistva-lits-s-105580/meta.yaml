act_code: '105580'
requisite: Постановление акимата города Семей Восточно-Казахстанской области от 11 июля 2016 года № 1070. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 1 августа 2016 года № 4621. Утратило силу - постановлением акимата города Семей Восточно-Казахстанской области от 12 июня 2017 года № 821
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы, граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдарды, ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

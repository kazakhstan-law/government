  title:
    rus: Об отмене карантинного режима на территории Восточно-Казахстанской области в объемах зараженных площадей разновидностями черного усача (Monochamus) и внесении изменений в постановление Восточно-Казахстанского областного акимата от 15 декабря 2016 года № 378 «Об установлении карантинной зоны с введением карантинного режима на территории Восточно-Казахстанской области»
    kaz: Шығыс Қазақстан облысы аумағында қара сүгенің әр түрлігімен (Monochamus) зақымданған алқаптар көлемінде карантин режимінің күшін жою және Шығыс Қазақстан облысы әкімдігінің 2016 жылғы 15 желтоқсандағы № 378 «Шығыс Қазақстан облысы аумағында карантин режимін енгізе отырып, карантин аймағын белгілеу туралы» қаулысына өзгерістер енгізу туралы

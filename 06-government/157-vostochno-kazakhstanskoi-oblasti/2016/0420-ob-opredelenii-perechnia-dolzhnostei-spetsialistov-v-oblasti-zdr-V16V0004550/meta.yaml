  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 20 апреля 2016 года № 118 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2016 жылғы 20 сәуірдегі № 118 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

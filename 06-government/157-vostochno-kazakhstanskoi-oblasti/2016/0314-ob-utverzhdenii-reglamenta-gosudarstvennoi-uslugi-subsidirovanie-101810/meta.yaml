requisite: Постановление Восточно-Казахстанского областного акимата от 14 марта 2016 года № 70. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 апреля 2016 года № 4502. Утратило силу постановлением Восточно-Казахстанского областного акимата от 26 марта 2020 года № 97 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование по возмещению части расходов, понесенных субъектом агропромышленного комплекса при инвестиционных вложениях»
  kaz: «Агроөнеркәсіптік кешен субъектісі инвестициялық салынымдар кезінде жұмсаған шығыстардың бір бөлігінің орнын толтыру бойынша субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

title:
  rus: Об утрате силу постановление акимата Урджарского района от 27 февраля 2013 года № 91 «Об определении перечня должностей специалистов социального обеспечения, образования, культуры которым установлено повышение к должностным окладам за работу в аульной (сельской) местности»
  kaz: Үржар ауданының әкімдігінің 2013 жылғы 27 ақпандағы «Ауылдық (селолық) жердегі жұмысы үшін лауазымдық айлықақыларын көтеру белгіленген әлеуметтік қамтамасыз ету, білім, мәдениет мамандары лауазымдарының тізбесін  айқындау туралы» № 91 қаулысының күшін жою туралы

    kaz: Өскемен қаласы әкімдігінің 2016 жылғы 15 қыркүйектегі № 2188 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

requisite: 'Постановление акимата Кокпектинского района Восточно-Казахстанской области от 28 января 2016 года № 16 '
title:
  rus: 'О признании утратившим силу постановление акимата Кокпектинского района от 10 июля 2015 года № 165 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности» '
  kaz: 'Көкпекті ауданы әкімдігінің 2015 жылғы 10 шілдедегі «Азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария, саласындағы мамандар лауазымдарының тізбесін айқындау туралы» № 165 қаулысының күшін жою туралы '

title:
  rus: О признании утратившим силу постановление акимата Кокпектинского района от 31 июля 2015 года № 186 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Кокпектинского района»
  kaz: Көкпекті ауданы әкімдігінің 2015 жылғы 31 шілдедегі «Көкпекті ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы» №186 қаулысының күшін жою туралы

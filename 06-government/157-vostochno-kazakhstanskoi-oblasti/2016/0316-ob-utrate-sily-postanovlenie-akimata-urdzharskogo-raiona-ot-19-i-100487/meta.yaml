title:
  rus: Об утрате силы постановление акимата Урджарского района от 19 января 2016 года № 19 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах по Урджарскому району»
  kaz: Үржар ауданы әкімдігінің 2016 жылғы 19 қаңтардағы «Үржар ауданы бойынша 2016 жылға шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың сызбасы мен тәртібін бекіту туралы» № 19 қаулысының күшін жою туралы

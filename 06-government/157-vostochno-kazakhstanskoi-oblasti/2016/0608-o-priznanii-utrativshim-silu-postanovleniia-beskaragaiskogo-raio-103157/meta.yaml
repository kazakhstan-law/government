act_code: '103157'
requisite: Постановление акимата Бескарагайского района Восточно-Казахстанской области от 08 июня 2016 года № 213
title:
  rus: О признании утратившим силу постановления Бескарагайского районного акимата от 31 марта 2015 года №106 «Об утверждении Положения государственного учреждения «Отдел архитектуры, строительства,  жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог Бескарагайского района Восточно-Казахстанской области"
  kaz: «Шығыс Қазақстан облысы Бесқарағай аудандық сәулет, құрылыс, тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі және автомобиль жолдары бөлімі» мемлекеттік мекемесінің Ережесін бекіту туралы» Бесқарағай аудандық әкімдігінің 2015 жылғы 31 наурыздағы №106 қаулысының күшін жою туралы

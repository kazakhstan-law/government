    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Шығыс Қазақстан облысы әкімдігінің 2016 жылғы 20 сәуірдегі № 118 қаулысына өзгерістер енгізу туралы

act_code: '102861'
requisite: Постановление акимата Бескарагайского района Восточно-Казахстанской области от 12 апреля 2016 года № 139. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 мая 2016 года № 4541. Утратило силу  постановлением Бескарагайского районного акимата Восточно-Казахстанской области от 21 апреля 2021 года № 176 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении  перечня должностей специалистов  в области социального обеспечения, образования, культуры, спорта и ветеринарии  являющихся гражданскими служащими и работающих в сельской местности
  kaz: Ауылдық жерлерде жұмыс істейтін, азаматтық  қызметші болып табылатын әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандардың лауазымдарының тiзбесiн анықтау туралы

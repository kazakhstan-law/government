act_code: '101655'
requisite: Постановление акимата Зыряновского района Восточно-Казахстанской области от 5 марта 2016 года № 66. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 апреля 2016 года № 4477. Утратило силу постановлением акимата района Алтай Восточно-Казахстанской области от 21 мая 2020 года № 173 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

title:
  rus: 'О признании утратившим силу постановления акимата Курчумского района «Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» по Курчумскому району» № 82 от 10 марта 2015 года    '
  kaz: 'Күршім ауданы әкімдігінің 2015 жылғы 10 наурыздағы «Күршім ауданы бойынша «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін  жыл сайынғы бағалаудың әдістемесін бекіту туралы» № 82 қаулысының күшін жою туралы   '

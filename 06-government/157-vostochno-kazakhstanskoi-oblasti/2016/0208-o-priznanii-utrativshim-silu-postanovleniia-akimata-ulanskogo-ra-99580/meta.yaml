act_code: '99580'
requisite: Постановление акимата Уланского района Восточно-Казахстанской области от 08 февраля 2016 года N 38
title:
  rus: О признании утратившим силу постановления акимата Уланского района № 564 от 11 мая 2014 года «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций»
  kaz: Ұлан ауданының әкімдігінің 2014 жылғы 11 мамырдағы № 564 «Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сонымен қатар бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарының кәмелетке толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы» қаулысының күшін жою туралы

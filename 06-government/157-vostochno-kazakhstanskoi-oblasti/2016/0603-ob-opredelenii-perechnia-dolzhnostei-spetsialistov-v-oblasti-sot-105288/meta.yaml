act_code: '105288'
requisite: Постановление Уланского районного акимата Восточно-Казахстанской области от 3 июня 2016 года № 292. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 июля 2016 года № 4611. Утратило силу постановлением Уланского районного акимата Восточно-Казахстанской области от 13 мая 2020 года № 143 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін анықтау туралы

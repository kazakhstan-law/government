act_code: '105681'
requisite: Постановление Восточно-Казахстанского областного акимата от 11 июля 2016 года № 211. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 19 августа 2016 года № 4651. Утратило силу постановлением Восточно-Казахстанского областного акимата от 10 марта 2020 года № 69 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі  білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін аттестаттаудан өткізуге  құжаттарды қабылдау»  мемлекеттік  көрсетілетін қызмет регламентін бекіту туралы

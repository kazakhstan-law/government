    kaz: «Тегін медициналық көмектің кепілдік берілген көлемін көрсету жөніндегі әлеуетті қызметтер берушінің қойылатын талаптарға сәйкестігін (сәйкес келмейтінін) анықтау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2016 жылғы 8 қаңтардағы № 2 қаулысына өзгерістер енгізу туралы

act_code: '99160'
requisite: Постановление Восточно-Казахстанского областного акимата от 8 января 2016 года № 2. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 февраля 2016 года № 4400. Утратило силу постановлением Восточно-Казахстанского областного акимата от 24 апреля 2020 года № 136 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Определение соответствия (несоответствия) потенциального поставщика услуг гарантированного объема бесплатной медицинской помощи предъявляемым требованиям»
  kaz: «Тегін медициналық көмектің кепілдік берілген көлемін көрсету жөніндегі әлеуетті қызметтер берушінің қойылатын талаптарға сәйкестігін (сәйкес келмейтінін) анықтау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

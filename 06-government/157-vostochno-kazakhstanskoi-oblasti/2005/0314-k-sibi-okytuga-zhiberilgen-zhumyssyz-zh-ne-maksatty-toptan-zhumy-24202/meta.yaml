requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2005 жылғы 14 наурыздағы № 751 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2005 жылғы 27 сәуірде № 2322 тіркелді

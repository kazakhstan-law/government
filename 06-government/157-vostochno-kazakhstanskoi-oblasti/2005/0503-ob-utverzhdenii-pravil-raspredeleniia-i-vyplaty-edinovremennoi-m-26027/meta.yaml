requisite: Постановление акимата Бородулихинского района от 3 мая 2005 года № 1299. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 мая 2005 года за № 2341. Утратило силу постановлением акимата Бородулихинского района области Абай от 22 апреля 2024 года № 122 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

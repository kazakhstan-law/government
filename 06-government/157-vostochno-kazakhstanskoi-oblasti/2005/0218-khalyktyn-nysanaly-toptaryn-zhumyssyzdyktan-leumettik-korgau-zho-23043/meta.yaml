requisite: Шығыс Қазақстан облысы Күршім ауданы әкімиятының 2005 жылғы 18 ақпандағы № 1004 қаулысы. Шығыс Қазақстан облысының Әділет департаментінде 2005 жылғы 25 ақпанда № 2197 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2008 жылғы 14 сәуірдегі № 670 қаулысымен

requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 7 февраля 2005 года № 1169. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 февраля 2005 года за № 2180. Утратило силу постановлением акимата Бородулихинского района области Абай от 22 апреля 2024 года № 122 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

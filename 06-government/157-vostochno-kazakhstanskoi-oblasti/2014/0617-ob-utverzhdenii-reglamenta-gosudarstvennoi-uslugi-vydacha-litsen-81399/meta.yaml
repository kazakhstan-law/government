act_code: '81399'
requisite: Постановление Восточно-Казахстанского областного акимата от 17 июня 2014 года № 159. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 22 июля 2014 года N 3406. Утратило силу - постановлением акимата Восточно-Казахстанской области от 10.06.2016 № 166
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов, за исключением деятельности по реализации лома и отходов цветных и черных металлов, образовавшихся у юридических лиц в ходе собственного производства и в результате приобретения имущественного комплекса, в составе которого находились лом и (или) отходы цветных и (или) черных металлов, лицензиатам"
  kaz: '"Заңды тұлғаларда өз өндiрiсi барысында және құрамында түстi және (немесе) қара металл сынықтары және (немесе) қалдықтары болған мүлiктiк кешендi сатып алу нәтижесiнде пайда болған түстi және қара металл сынықтары мен қалдықтарын өткiзу жөнiндегi қызметтi қоспағанда, заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және лицензиаттарға өткiзу жөніндегі қызметтi жүзеге асыруға лицензия беру, қайта ресiмдеу, лицензияның телнұсқаларын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

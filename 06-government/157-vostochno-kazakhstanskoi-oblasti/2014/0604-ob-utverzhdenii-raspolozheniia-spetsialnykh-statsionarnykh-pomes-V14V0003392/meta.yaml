  requisite: Постановление Восточно-Казахстанского областного акимата от 10 октября 2017 года № 265. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 октября 2017 года № 5261. Утратило силу постановлением Восточно-Казахстанского областного акимата от 2 февраля 2024 года № 37 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в постановление Восточно-Казахстанского областного акимата от 4 июня 2014 года № 147 «Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения и  согласовании расположения помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)»
    kaz: «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту, ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шараларды өткізуге арналған үй-жайлардың орналастырылуын келісу туралы» Шығыс Қазақстан облысы әкімдігінің 2014 жылғы 4 маусымдағы № 147 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/115669/rus

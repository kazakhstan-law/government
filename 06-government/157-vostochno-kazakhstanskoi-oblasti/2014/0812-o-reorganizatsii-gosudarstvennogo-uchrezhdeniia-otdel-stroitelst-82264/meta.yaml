requisite: Постановление акимата Зыряновского района Восточно-Казахстанской области от 12 августа 2014 года № 2599. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 14 августа 2014 года № 3456. Утратило силу - постановлением акимата Зыряновского района Восточно-Казахстанской области от 9 декабря 2016 года № 428
title:
  rus: О реорганизации государственного учреждения "Отдел строительства Зыряновского района" и государственного учреждения "Отдел архитектуры и градостроительства Зыряновского района" путем слияния в государственное учреждение "Отдел архитектуры, градостроительства и строительства Зыряновского района"
  kaz: '"Зырян ауданының құрылыс бөлімі" мемлекеттік мекемесі мен "Зырян ауданының сәулет және қала құрылысы бөлімі" мемлекеттік мекемесін біріктіру жолымен "Зырян ауданының сәулет, қала құрылысы және құрылыс бөлімі" мемлекеттік мекемесін қайта құру туралы'

act_code: '84658'
requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 28 октября 2014 года № 346. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 ноября 2014 года № 3558. Утратило силу постановлением акимата Шемонаихинского района Восточно-Казахстанской области от 22 апреля 2020 года № 110 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін анықтау туралы

  title:
    rus: О внесении изменения в постановление акимата Шемонаихинского района от 28 октября 2014 года № 346 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін анықтау туралы» Шемонаиха ауданы әкімдігінің 2014 жылғы 28 қазандағы № 346 қаулысына өзгеріс енгізу туралы

requisite: Постановление Уланского районного акимата Восточно-Казахстанской области от 11 мая 2014 года N 564. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 05 июня 2014 года N 3369. Утратило силу - постановлением акимата Уланского района Восточно-Казахстанской области от 08.02.2016 № 38
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сонымен қатар бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарының кәмелетке толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы

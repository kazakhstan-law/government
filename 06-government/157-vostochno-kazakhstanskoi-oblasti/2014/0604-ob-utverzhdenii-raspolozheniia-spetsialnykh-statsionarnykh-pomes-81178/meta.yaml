act_code: '81178'
requisite: Постановление Восточно-Казахстанского областного акимата от 4 июня 2014 года № 147. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 июля 2014 года № 3392. Утратило силу постановлением Восточно-Казахстанского областного акимата от 2 февраля 2024 года № 37 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения и согласовании расположения помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)
  kaz: Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту, ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шараларды өткізуге арналған үй-жайлардың орналастырылуын келісу туралы

  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 4 июня 2014 года № 147 «Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения и согласовании расположения помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)»
    kaz: «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту, ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шараларды өткізуге арналған үй-жайлардың орналастырылуын келісу туралы» Шығыс Қазақстан облысы әкімдігінің 2014 жылғы 4 маусымдағы № 147 қаулысына өзгеріс енгізу туралы

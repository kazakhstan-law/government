act_code: '80017'
requisite: Постановление Восточно-Казахстанского областного акимата от 25 апреля 2014 года № 117. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 19 мая 2014 года № 3336. Утратило силу постановлением Восточно-Казахстанского областного акимата от 7 августа 2023 года № 173 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении положения об участковых комиссиях, а также критериев определения нуждаемости в государственной адресной социальной помощи по результатам обследования материального положения заявителя
  kaz: Учаскелік комиссиялар туралы ережені, сонымен қатар өтініш берушінің материалдық жағдайын тексеру қорытындысы бойынша мемлекеттік атаулы әлеуметтік көмекке мұқтаждығын айқындау өлшемшарттарын бекіту туралы

  title:
    rus: Об отмене карантинного режима на территории Восточно-Казахстанской области в объемах зараженных площадей золотистой картофельной нематодой (globodera rostochiensis (Woll.) M. et. St.) и внесении изменения в постановление Восточно-Казахстанского областного акимата от 28 июля 2014 года № 202 «Об установлении карантинной зоны с введением карантинного режима на территории Восточно-Казахстанской области»
    kaz: Шығыс Қазақстан облысы аумағында алтын түсті картоп жұмырқұртымен (globodera rostochiensis (Woll.) M. et. St.) зақымданған алқаптар көлемінде карантин режимінің күшін жою және Шығыс Қазақстан облысы әкімдігінің 2014 жылғы 28 шілдедегі № 202 «Шығыс Қазақстан облысы аумағында карантин режимін енгізе отырып, карантин аймағын белгілеу туралы» қаулысына өзгеріс енгізу туралы

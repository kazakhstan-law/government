  title:
    rus: О внесении изменений в постановление акимата района Үлкен Нарын от 21 августа 2024 года № 89 «Об определении перечня должностей специалистов в области социального обеспечения и культуры являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Үлкен Нарын ауданының әкімдігінің 2024 жылғы 21 тамыздағы № 89 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

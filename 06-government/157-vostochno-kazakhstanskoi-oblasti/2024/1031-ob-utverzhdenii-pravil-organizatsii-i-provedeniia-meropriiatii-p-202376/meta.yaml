  title:
    rus: О внесении изменений в постановление акимата Уланского района от 31 октября 2024 года № 431 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Уланского района»
    kaz: Ұлан ауданы әкімдігінің 2024 жылғы 31 қазандағы № 431 «Ұлан ауданының елді мекендеріне бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

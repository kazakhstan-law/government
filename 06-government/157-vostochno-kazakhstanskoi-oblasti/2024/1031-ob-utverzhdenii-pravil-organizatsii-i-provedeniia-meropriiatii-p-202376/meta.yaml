requisite: Постановление акимата Уланского района Восточно-Казахстанской области от 31 октября 2024 года № 431. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 ноября 2024 года № 9102-16
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Уланского района
  kaz: Ұлан ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

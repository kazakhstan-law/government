act_code: '197029'
requisite: Постановление Восточно-Казахстанского областного акимата от 22 мая 2024 года № 120. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 мая 2024 года № 9020-16
title:
  rus: О признании утратившим силу постановления Восточно-Казахстанского областного акимата от 2 ноября 2020 года № 394 «Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в Восточно-Казахстанской области»
  kaz: «Шығыс Қазақстан облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау бойынша коммуналдық қызметтерді тұтыну нормаларын бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2020 жылғы 2 қарашадағы № 394 қаулысының күшін жою туралы

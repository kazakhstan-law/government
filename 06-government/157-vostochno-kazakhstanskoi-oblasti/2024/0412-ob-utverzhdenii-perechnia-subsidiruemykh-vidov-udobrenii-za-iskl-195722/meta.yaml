  title:
    rus: О внесении изменений и дополнений в постановление Восточно-Казахстанского областного акимата от 12 апреля 2024 года № 85 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2024 год»
    kaz: «2024 жылға арналған субсидияланатын тыңайтқыштар (органикалықтарды қоспағанда) түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалықтарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2024 жылғы 12 сәуірдегі № 85 қаулысына өзгерістер және толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202842/rus

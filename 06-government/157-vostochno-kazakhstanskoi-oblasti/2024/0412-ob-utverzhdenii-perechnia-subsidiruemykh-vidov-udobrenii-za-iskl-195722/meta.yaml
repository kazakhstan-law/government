title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений на 2024 год
  kaz: 2024 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын бекіту туралы

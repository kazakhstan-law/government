requisite: Постановление акимата района Үлкен Нарын Восточно-Казахстанской области от 6 марта 2025 года № 80. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 марта 2025 года № 9145-16
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам района Үлкен Нарын»
  kaz: Үлкен Нарын ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі  іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата района Үлкен Нарын от 6 марта 2025 года № 80«Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам района Үлкен Нарын»
    kaz: Үлкен Нарын ауданының әкімдігінің 2025 жылғы 6 наурыздағы № 80 «Үлкен Нарын ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/223298/rus

requisite: Постановление акимата района Марқакөл Восточно-Казахстанской области от 18 марта 2025 года № 52. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 19 марта 2025 года № 9157-16
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам района Марқакөл
  kaz: Марқакөл ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

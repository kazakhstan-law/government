  kaz: Шығыс Қазақстан облысы бойынша 2025 жылға арналған акваөсіру (балық өсіру шаруашылығы) өнімінің өнімділігі мен сапасын арттыруды, сондай-ақ асыл тұқымды балық өсіруді дамытуды субсидиялау көлемдерін бекіту туралы

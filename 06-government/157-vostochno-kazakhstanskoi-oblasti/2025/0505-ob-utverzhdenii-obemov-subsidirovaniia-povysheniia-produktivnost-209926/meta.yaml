  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 5 мая 2025 года № 109 «Об утверждении объемов субсидирования повышения продуктивности и качества продукции аквакультуры (рыбоводства), а также развития племенного рыбоводства по Восточно-Казахстанской области на 2025 год»
    kaz: «Шығыс Қазақстан облысы бойынша 2025 жылға арналған акваөсіру (балық өсіру шаруашылығы) өнімінің өнімділігі мен сапасын арттыруды, сондай-ақ асыл тұқымды балық өсіруді дамытуды субсидиялау көлемдерін бекіту туралы» Шығыс Қазақстан облысы әкімдігінің 2025 жылғы 5 мамырдағы № 109 қаулысына өзгеріс енгізу туралы

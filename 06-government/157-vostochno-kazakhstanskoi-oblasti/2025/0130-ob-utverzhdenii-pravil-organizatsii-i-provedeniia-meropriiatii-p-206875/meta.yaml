act_code: '206875'
requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 30 января 2025 года № 40. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 31 января 2025 года № 9130-16
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Глубоковского района Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы Глубокое ауданының елді мекендеріне  бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

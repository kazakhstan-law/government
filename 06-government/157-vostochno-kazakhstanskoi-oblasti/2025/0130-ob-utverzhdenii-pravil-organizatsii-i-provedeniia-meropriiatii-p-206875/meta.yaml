  code: '209051'
  requisite: Постановление Глубоковского районного акимата Восточно-Казахстанской области от 10 апреля 2025 года № 163. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 апреля 2025 года № 9171-16
  title:
    rus: О внесении изменения в постановление акимата Глубоковского района Восточно-Казахстанской области от 30 января 2025 года № 40 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Глубоковского района Восточно-Казахстанской области»
    kaz: Шығыс Қазақстан облысы  Глубокое ауданы әкімдігінің 2025 жылғы 30 қаңтардағы № 40 «Шығыс Қазақстан облысы Глубокое ауданының елді мекендеріне  бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209051/rus

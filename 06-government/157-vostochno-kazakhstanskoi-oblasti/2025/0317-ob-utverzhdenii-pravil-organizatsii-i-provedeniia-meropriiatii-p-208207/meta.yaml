requisite: Постановление Катон-Карагайского районного акимата Восточно-Казахстанской области от 17 марта 2025 года № 59. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 марта 2025 года № 9151-16
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции,текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Катон-Карагайского района
  kaz: Катонқарағай ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі  іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

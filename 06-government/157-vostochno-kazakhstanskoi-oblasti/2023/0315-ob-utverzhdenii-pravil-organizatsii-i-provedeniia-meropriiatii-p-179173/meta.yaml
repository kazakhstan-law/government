act_code: '179173'
requisite: Постановление акимата Курчумского района Восточно-Казахстанской области от 15 марта 2023 года № 175. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 марта 2023 года № 8823-16
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Курчумскому району
  kaz: Күршім ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

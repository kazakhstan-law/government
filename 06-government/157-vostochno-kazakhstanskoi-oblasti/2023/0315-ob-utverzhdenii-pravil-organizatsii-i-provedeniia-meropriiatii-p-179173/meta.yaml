  title:
    rus: О внесении изменений в постановление акимата Курчумского района от 15 марта 2023 года № 175 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Курчумского района»
    kaz: «Күршім ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыружәне жүргізу қағидаларын бекіту туралы» Күршім ауданы әкімдігінің 2023 жылғы 15 наурыздағы № 175 қаулысына өзгерістер енгізу туралы

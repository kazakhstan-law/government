requisite: Постановление Восточно-Казахстанского областного акимата от 28 сентября 2023 года № 213. Отменен постановлением Восточно-Казахстанского областного акимата от 3 ноября 2023 года № 235 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об отмене карантинного режима на территории Восточно-Казахстанской области в объемах зараженных площадей разновидностями черного усача (Monochamus) и признании утратившими силу некоторых постановлений Восточно-Казахстанского областного акимата

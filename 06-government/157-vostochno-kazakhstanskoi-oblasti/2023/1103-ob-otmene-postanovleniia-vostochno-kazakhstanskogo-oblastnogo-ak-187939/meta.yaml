act_code: '187939'
requisite: Постановление Восточно-Казахстанского областного акимата от 3 ноября 2023 года № 235
title:
  rus: Об отмене постановления Восточно-Казахстанского областного акимата от 28 сентября 2023 года № 213 «Об отмене карантинного режима на территории Восточно-Казахстанской области в объемах зараженных площадей разновидностями черного усача (Monochamus) и признании утратившими силу некоторых постановлений Восточно-Казахстанского областного акимата»
  kaz: Шығыс Қазақстан облысы әкімдігінің 2023 жылғы 28 қыркүйектегі № 213 «Шығыс Қазақстан облысы аумағында қара сүгенің әр түрлігімен (Monochamus) зақымданған алқаптар көлемінде карантин режимінің күшін жою және Шығыс Қазақстан облысы әкімдігінің кейбір қаулыларының күшін жою туралы» қаулысының күшін жою туралы

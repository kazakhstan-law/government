    kaz: «2023 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемін бекіту туралы» Шығыс Қазақстан облысы әкімдігінің  2023 жылғы 5 маусымдағы № 121 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата района Алтай от 11 мая 2023 года № 268 «Об утверждении правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам района Алтай»
    kaz: «Алтай ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу бойынша іс-шараларды ұйымдастыру және жүргізу қағидасын бекіту туралы» Алтай ауданы әкімдігінің 2023 жылғы 11 мамырдағы № 268  қаулысына өзгерістер енгізу туралы

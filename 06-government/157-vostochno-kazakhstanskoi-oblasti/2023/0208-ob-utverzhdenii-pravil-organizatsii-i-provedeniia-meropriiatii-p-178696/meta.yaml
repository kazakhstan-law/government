  title:
    rus: О внесении изменений в постановление акимата города Усть-Каменогорска от 8 февраля 2023 года № 479 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Усть-Каменогорску»
    kaz: Өскемен қаласы әкімдігінің 2023 жылғы 8 ақпандағы № 479 «Өскемен қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

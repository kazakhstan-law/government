  title:
    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 5 апреля 2023 года № 66 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства на 2023 год»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2023 жылғы 5 сәуірдегі № 66 «Асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша 2023 жылға арналған субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

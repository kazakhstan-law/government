  title:
    rus: О внесении изменений и дополнения в постановление акимата района Алтай от 11 мая 2023 года № 268 «Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика по району Алтай»
    kaz: «Алтай ауданы бойынша бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу бойынша іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Алтай ауданы әкімдігінің 2023 жылғы 11 мамырдағы № 268 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/194319/rus

act_code: '181744'
requisite: Постановление акимата района Алтай Восточно-Казахстанской области от 11 мая 2023 года № 268. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 19 мая 2023 года № 8849-16
title:
  rus: Об утверждении правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам района Алтай
  kaz: Алтай ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу бойынша іс-шараларды ұйымдастыру және жүргізу қағидасын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата города Усть-Каменогорска от 8 февраля 2023 года № 479 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Усть-Каменогорску»

  title:
    rus: О внесении изменений в постановление акимата города Усть-Каменогорска от 8 февраля 2023 года № 479 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Усть-Каменогорску»
    kaz: «Өскемен қаласы әкімдігінің 2023 жылғы 8 ақпандағы № 479 «Өскемен қаласына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Такыр и ручья Орташа в створе горного отвода товарищества с ограниченной ответственностью «Geomonitoring Systems» в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданындағы «Geomonitoring Systems» жауапкершілігі шектеулі серіктестігінің тау-кендік бөлу тұстамасындағы Тақыр өзені мен Орташа бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

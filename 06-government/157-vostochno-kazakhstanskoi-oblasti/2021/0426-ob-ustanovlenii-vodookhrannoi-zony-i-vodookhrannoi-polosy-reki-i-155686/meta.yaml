title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Иртыш (левый берег) в створе испрашиваемого земельного участка в селе Приречное Приречного сельского округа города Семей Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Семей қаласы Приречный ауылдық округінің Приречное ауылында сұралып отырған жер учаскесі тұстамасындағы Ертіс өзенінің (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

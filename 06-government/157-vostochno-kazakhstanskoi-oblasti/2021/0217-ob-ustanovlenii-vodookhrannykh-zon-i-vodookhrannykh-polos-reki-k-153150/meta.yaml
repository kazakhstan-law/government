act_code: '153150'
requisite: Постановление Восточно-Казахстанского областного акимата от 17 февраля 2021 года № 28. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 февраля 2021 года № 8411
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Кыстау-Курчум (устье) и ручья без названия в створе земельного участка, предназначенного для реализации через аукцион, в Курчумском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданында аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Қыстау-Күршім өзенінің (сағасы) және атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

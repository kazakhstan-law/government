title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Березовка и ее притока ручья Топтушка в створе земельного участка, предназначенного для реализации через аукцион, в районе Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы Березовка өзені және оның саласы Топтушка бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

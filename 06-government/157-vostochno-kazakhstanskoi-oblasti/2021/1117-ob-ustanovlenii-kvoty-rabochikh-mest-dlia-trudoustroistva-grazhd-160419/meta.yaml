  requisite: Постановление акимата города Риддера Восточно-Казахстанской области от 25 августа 2022 года № 809
  title:
    rus: О внесении изменений в постановление акимата города Риддера от 17 ноября 2021 года № 948 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2022 год»
    kaz: Риддер қаласының әкімдігінің 2021 жылғы 17 қарашадағы № 948 «Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін 2022 жылға арналған жұмыс орындарына квота белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/171355/rus

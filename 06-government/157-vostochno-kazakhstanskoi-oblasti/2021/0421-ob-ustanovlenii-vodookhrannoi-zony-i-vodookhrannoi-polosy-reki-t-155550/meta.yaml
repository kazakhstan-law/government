title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Тайынты (правый и левый берег) в створе испрашиваемого земельного участка в районе села Верхние Тайынты Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Жоғарғы Тайынты ауылы ауданындағы сұралып отырған жер учаскесі тұстамасындағы Тайынты өзенінің (оң және сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

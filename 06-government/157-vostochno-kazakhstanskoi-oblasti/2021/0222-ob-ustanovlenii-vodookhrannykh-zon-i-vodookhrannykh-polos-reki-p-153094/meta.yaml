title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Погуляйка, ручья Андреев в створе земельного участка на территории района Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданы аумағындағы жер учаскесінің тұстамасындағы Погуляйка өзенінің, Андреев бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

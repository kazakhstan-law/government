title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Егинбулак (левый берег) в створе испрашиваемых земельных участков в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскелері тұстамасындағы Егінбұлақ (сол жағалау) бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление акимата Тарбагатайского района Восточно-Казахстанской области от 26 апреля 2021 года № 430. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 апреля 2021 года № 8714. Утратило силу постановлением акимата Тарбагатайского района Восточно-Казахстанской области от 4 апреля 2022 года № 288 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

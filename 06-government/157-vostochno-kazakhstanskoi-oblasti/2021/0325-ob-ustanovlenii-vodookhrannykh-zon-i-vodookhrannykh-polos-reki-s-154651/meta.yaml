act_code: '154651'
requisite: Постановление Восточно-Казахстанского областного акимата от 25 марта 2021 года № 90. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 апреля 2021 года № 8577
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Шолаккайын (левый берег), ручья Бутагора (правый берег), ручья без названия № 1 (левый берег) и ручья без названия № 2 в створе земельных участков, расположенных в Уланском районе Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданында орналасқан жер учаскелері тұстамасындағы Шолаққайың өзені (сол жағалау), Бутагора бұлағы (оң жағалау), № 1 атауы жоқ бұлағы (сол жағалау) және № 2 атауы жоқ бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Веселовка в створе земельных участков, расположенных северо-восточнее села Веселовка Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданындағы Веселовка ауылынан солтүстік-шығысқа қарай орналасқан жер учаскелері тұстамасындағы Веселовка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды

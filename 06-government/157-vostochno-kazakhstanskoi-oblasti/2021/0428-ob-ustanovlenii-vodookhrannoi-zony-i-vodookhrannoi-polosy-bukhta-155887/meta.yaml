title:
  rus: Об установлении водоохранной зоны и водоохранной полосы Бухтарминского водохранилища в створе земельного участка, предоставляемого для устройства причала паромной переправы, на территории района Алтай Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданының аумағында паромдық өткел айлағын орнату үшін берілетін жер учаскесі тұстамасындағы Бұқтырма су қоймасының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

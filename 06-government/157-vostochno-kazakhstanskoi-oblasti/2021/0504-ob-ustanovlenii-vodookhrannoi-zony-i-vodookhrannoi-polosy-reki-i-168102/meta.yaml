title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Иртыш в створе испрашиваемого земельного участка, расположенного в 1,0-2,0 км восточнее села Холодный Ключ на землях города Семей Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Семей қаласының Холодный Ключ ауылының шығысына қарай 1,0-2,0 км жерде орналасқан сұралып отырған жер учаскесі тұстамасындағы Ертіс өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

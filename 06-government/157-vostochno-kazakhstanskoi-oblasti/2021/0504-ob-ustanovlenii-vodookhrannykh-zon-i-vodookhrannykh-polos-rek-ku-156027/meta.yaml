title:
  rus: Об установлении водоохранных зон и водоохранных полос рек Кулуджун и Купырлы в пределах контрактной территории месторождения Кулуджун Кокпектинского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Көкпекті ауданы Қулынжун кен орнының келісімшарттық аумағы шегіндегі Қулынжун және Купырлы өзендерінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

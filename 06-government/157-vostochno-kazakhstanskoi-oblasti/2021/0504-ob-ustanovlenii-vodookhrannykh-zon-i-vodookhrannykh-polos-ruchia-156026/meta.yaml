title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Орда в створе испрашиваемого земельного участка в районе села Жиделы Курчумского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданы Жиделі ауылы ауданындағы сұралып отырған жер учаскесінің тұстамасындағы Орда бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

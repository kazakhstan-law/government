title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемов бюджетных средств на субсидирование удобрений на 2021 год
  kaz: 2021 жылға арналған субсидияланатын тыңайтқыштар (органикалықтарды қоспағанда) түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды субсидиялауға бюджеттік қаржы  көлемдерін бекіту туралы

act_code: '168179'
requisite: Постановление Восточно-Казахстанского областного акимата от 4 мая 2021 года № 166. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 мая 2021 года № 8774
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Нарын (правый берег) в створе испрашиваемого земельного участка, расположенного южнее села Үлкен Нарын Катон-Карагайского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданы Үлкен Нарын ауылының оңтүстігінде орналасқан сұралып отырған жер учаскесі тұстамасындағы Нарын өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Глубочанка в створе земельных участков, предоставляемых для ведения личного подсобного хозяйства, в селе Прогресс Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданының Прогресс ауылында жеке қосалқы шаруашылық жүргізу үшін берілетін жер учаскелерінің тұстамасындағы Глубочанка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

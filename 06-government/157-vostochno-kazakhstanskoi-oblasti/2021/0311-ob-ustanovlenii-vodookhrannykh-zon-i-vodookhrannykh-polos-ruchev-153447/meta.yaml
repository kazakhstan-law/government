act_code: '153447'
requisite: Постановление Восточно-Казахстанского областного акимата от 11 марта 2021 года № 72. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 марта 2021 года № 8447
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев без названия №№ 1-5 в створе земельного участка, предназначенного для реализации через аукцион для выпаса сельскохозяйственных животных и сенокошения, на территории Курчумского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданы аумағындағы ауыл шаруашылығы жануарларын жаю және шөп шабу үшін аукцион арқылы өткізуге арналған жер учаскесі тұстамасындағы №№ 1-5 атауы жоқ бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

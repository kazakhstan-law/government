title:
  rus: Об установлении водоохранных зон и водоохранных полос рек Верхняя и Средняя Теректы в створе горного отвода товарищества с ограниченной ответственностью «ГДК Альянс» в Катон-Карагайском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданының «Альянс ГДК» жауапкершілігі шектеулі серіктестігінің кен иелігі тұстамасындағы Жоғарғы және Орта Теректі өзендерінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

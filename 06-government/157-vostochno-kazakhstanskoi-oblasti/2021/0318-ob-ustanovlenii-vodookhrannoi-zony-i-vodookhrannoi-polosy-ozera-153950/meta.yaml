title:
  rus: Об установлении водоохранной зоны и водоохранной полосы озера Зайсан и реки Кусты в створе земельного участка для проектируемого водозабора Тарбагатайского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Тарбағатай ауданының жобаланып отырған су тоғанына арналған жер учаскесінің тұстамасындағы Зайсан көлі мен Құсты өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

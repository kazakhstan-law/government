title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Тогай, ручья без названия и заболоченного участка в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскесінің тұстамасындағы Тоғай өзенінің, атауы жоқ бұлақтың және батпақты учаскенің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

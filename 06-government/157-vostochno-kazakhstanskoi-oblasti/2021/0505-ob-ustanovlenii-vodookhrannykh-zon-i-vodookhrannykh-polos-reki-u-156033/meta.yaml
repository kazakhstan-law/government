title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Уранкай и ее притоков ручьев Сагыр и Тулеке в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Ұранқай өзенінің және оның салалары Сағыр мен Төлеке бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

act_code: '153446'
requisite: Постановление Восточно-Казахстанского областного акимата от 11 марта 2021 года № 71. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 марта 2021 года № 8446
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Уланка и ручья без названия на испрашиваемых земельных участках расположенных в садоводческом товариществе «Восточник-Степной» в районе села Акимовка Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Акимовка ауылы ауданындағы «Восточник-Степной» бағбандық серіктестігінде орналасқан сұралып отырған жер учаскелеріндегі Ұлан өзені мен атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

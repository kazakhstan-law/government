requisite: Постановление Восточно-Казахстанского областного акимата от 3 марта 2021 года № 48. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 марта 2021 года № 8441
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Кызылагаш и его притоков родников № 1, № 2, № 3 в створе земельных участков на территории Курчумского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданының аумағындағы жер учаскелерінің тұстамасындағы Қызылағаш бұлағы және оның салалары № 1, № 2, № 3 бастауларының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

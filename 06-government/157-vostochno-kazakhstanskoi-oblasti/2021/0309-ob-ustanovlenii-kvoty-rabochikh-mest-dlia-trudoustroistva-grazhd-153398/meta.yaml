requisite: Постановление акимата Кокпектинского района Восточно-Казахстанской области от 9 марта 2021 года № 119. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 марта 2021 года № 8439
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, для трудоустройства лиц, состоящих на учете службы пробации, а также для трудоустройства лиц, освобожденных из мест лишения свободы на 2021 год
  kaz: 2021 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін, сондай ақ бас бостандығынан айыру орындарынан босатылған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

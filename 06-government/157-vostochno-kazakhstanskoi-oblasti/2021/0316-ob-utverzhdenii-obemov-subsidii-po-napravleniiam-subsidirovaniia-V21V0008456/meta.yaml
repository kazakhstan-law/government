    rus: О внесении изменения в постановление Восточно-Казахстанского областного акимата от 16 марта 2021 года № 77 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства на 2021 год»
    kaz: Шығыс Қазақстан облысы әкімдігінің 2021 жылғы 16 наурыздағы № 77 «Асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша 2021 жылға арналған субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

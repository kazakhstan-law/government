act_code: '155600'
requisite: Постановление Восточно-Казахстанского областного акимата от 21 апреля 2021 года № 131. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 апреля 2021 года № 8699
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Урунхай (левый берег), реки Луконь, ручья Демин Лог и ручья без названия в створе испрашиваемого земельного участка в районе села Изгутты Айтыков Уланского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Ізғұтты Айтықов ауылы ауданындағы сұралып отырған жер учаскесі тұстамасындағы Ұранқай өзені (сол жағалау), Луконь өзені, Демин Лог бұлағы және атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

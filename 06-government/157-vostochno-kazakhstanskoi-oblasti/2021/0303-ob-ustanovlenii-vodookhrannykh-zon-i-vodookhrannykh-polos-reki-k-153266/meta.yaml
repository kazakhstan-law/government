act_code: '153266'
requisite: Постановление Восточно-Казахстанского областного акимата от 3 марта 2021 года № 54. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 марта 2021 года № 8429
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Кошонай (правый берег) и ручья без названия (правый приток реки Гусельничиха) в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданында сұралып отырған жер учаскесінің тұстамасындағы Қошонай өзенінің (оң жағалау) және атауы жоқ бұлақтың (Гусельничиха өзенінің оң саласы) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы пруда без названия в створе земельного участка, расположенного в 1,3 км южнее села Ново-Явленка Меновновского сельского округа Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Меновное ауылдық округінің Ново-Явленка ауылынан оңтүстікке қарай 1,3 км жерде орналасқан жер учаскесі тұстамасындағы атауы жоқ тоғанның су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

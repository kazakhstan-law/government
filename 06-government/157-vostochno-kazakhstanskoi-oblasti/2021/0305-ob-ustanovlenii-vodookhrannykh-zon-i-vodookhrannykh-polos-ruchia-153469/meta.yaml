act_code: '153469'
requisite: Постановление Восточно-Казахстанского областного акимата от 5 марта 2021 года № 61. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 марта 2021 года № 8454
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Ксемаз (левый берег) и ручьев без названия №№ 1, 2 в створе испрашиваемых земельных участков в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскелерінің тұстамасындағы Ксемаз бұлағы (сол жағалау) және атауы жоқ №№ 1, 2 бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

act_code: '153151'
requisite: Постановление Восточно-Казахстанского областного акимата от 17 февраля 2021 года № 29. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 февраля 2021 года № 8412
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Кызылсу и ручьев без названия №№ 1, 2 в районе села Кызылсу в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданында сұралып отырған жер учаскесінің тұстамасындағы Қызылсу ауылы ауданындағы Қызылсу өзені мен №№ 1, 2 атауы жоқ бұлақтардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

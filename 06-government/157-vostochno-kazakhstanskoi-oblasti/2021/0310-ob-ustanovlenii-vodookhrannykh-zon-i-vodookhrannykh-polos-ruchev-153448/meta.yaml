act_code: '153448'
requisite: Постановление Восточно-Казахстанского областного акимата от 10 марта 2021 года № 69. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 марта 2021 года № 8448
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев Кызылсу № 1, № 2, ручьев без названия № 1, № 2 и родников № 1, № 2 в 10,4 км юго-восточнее аула Кызылсу в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскесінің тұстамасындағы Қызылсу ауылынан оңтүстік-шығысқа қарай 10,4 км жердегі № 1, № 2 Қызылсу бұлақтарының, № 1, № 2 атауы жоқ бұлақтардың және № 1, № 2 бастаулардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

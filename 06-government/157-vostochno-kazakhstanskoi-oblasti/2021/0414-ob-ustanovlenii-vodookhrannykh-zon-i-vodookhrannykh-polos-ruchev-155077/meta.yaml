title:
  rus: Об установлении водоохранных зон и водоохранных полос ручьев Попереченка, Козлушка, Бурнашев, без названия, левобережных притоков ручья Таловка, в створе земельных участков, расположенных в районе Алтай Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Алтай ауданындағы Таловка бұлағының сол жағалау салалары Попереченка, Козлушка, Бурнашев, атауы жоқ бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Кедровка (правый берег) в створе испрашиваемых земельных участков, расположенных в поселке Ульба города Риддер Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласының Үлбі кентінде орналасқан сұралып отырған жер учаскелері тұстамасындағы Кедровка өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

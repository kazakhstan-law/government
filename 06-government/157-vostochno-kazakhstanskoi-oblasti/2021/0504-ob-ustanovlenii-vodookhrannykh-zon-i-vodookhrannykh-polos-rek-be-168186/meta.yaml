act_code: '168186'
requisite: Постановление Восточно-Казахстанского областного акимата от 4 мая 2021 года № 165. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 мая 2021 года № 8772
title:
  rus: Об установлении водоохранных зон и водоохранных полос рек Белая Уба, Большая Разливанка, Большая Поперечная и ручья Гаврин ключ в створе испрашиваемых крестьянским хозяйством «Гемма» земельных участков, расположенных в районе урочища Серый Луг города Риддер Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Риддер қаласының Серый Луг шатқалы ауданында орналасқан "Гемма" шаруа қожалығы сұрап отырған жер учаскелерінің тұстамасындағы Белая Уба, Большая Разливанка, Большая Поперечная өзендерінің және Гаврин ключ бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

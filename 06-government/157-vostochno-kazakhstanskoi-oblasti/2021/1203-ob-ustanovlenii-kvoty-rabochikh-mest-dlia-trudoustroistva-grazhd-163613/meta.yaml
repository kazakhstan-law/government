act_code: '163613'
requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 3 декабря 2021 года № 357
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, а также лиц, состоящих на учете службы пробации на 2022 год
  kaz: 2022 жылга ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, сондай-ақ пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшінжұмыс орындарының квоталарын белгілеу туралы

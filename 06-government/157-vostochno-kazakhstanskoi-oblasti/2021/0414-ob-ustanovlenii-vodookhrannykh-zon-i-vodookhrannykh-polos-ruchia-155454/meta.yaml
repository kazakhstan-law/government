act_code: '155454'
requisite: Постановление Восточно-Казахстанского областного акимата от 14 апреля 2021 года № 111. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 апреля 2021 года № 8664
title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Бокенбай и его притока ручья Майлысай, истоков ручья Большой Шыбынды – родников №№ 1 - 4 и ручья Данебулак в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: 'Шығыс Қазақстан облысы Ұлан ауданындағы Бөкенбай бұлағы және оның саласы Майлысай бұлағы, Үлкен Шыбынды бұлағы салалары: №№ 1 - 4 бастаулары және Дәнебұлақ бұлағының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы'

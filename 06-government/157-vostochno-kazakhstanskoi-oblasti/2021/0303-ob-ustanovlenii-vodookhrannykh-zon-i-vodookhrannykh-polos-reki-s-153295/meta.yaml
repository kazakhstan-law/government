act_code: '153295'
requisite: Постановление Восточно-Казахстанского областного акимата от 3 марта 2021 года № 52. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 марта 2021 года № 8433
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Шолаккайын (левый берег), ручья Бутагора (правый берег) и ручья без названия в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскесінің тұстамасындағы Шолаққайың өзенінің (сол жағалауы), Бутагора бұлағының (оң жағалауы) және атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белделерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 25 марта 2021 года № 88. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 апреля 2021 года № 8575
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Сибинка и ее притоков ручьев без названия №№ 1, 2 в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: 'Шығыс Қазақстан облысы Ұлан ауданындағы Сибинка өзені және оның салалары: атауы жоқ №№ 1, 2 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы'

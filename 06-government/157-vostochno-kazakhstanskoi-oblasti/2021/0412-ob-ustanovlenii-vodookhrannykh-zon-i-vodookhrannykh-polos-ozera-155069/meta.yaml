requisite: Постановление Восточно-Казахстанского областного акимата от 12 апреля 2021 года № 106. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 апреля 2021 года № 8624
title:
  rus: Об установлении водоохранных зон и водоохранных полос озера Балыктыколь, озера без названия и реки Шаган в створе испрашиваемого земельного участка в Жиеналинском сельском округе города Семей Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Семей қаласының Жиеналы ауылдық округіндегі сұралып отырған жер учаскесі тұстамасындағы Балықтыкөл көлінің, атауы жоқ көлдің және Шаған өзенінің су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

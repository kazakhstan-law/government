  title:
    rus: О внесении изменения в постановление акимата города Усть-Каменогорска от 26 ноября 2021 года № 4827 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2022 год
    kaz: Өскемен қаласы әкімдігінің 2021 жылғы 26 қарашадағы № 4827 «2022 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе  ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/172137/rus

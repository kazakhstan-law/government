title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Малая Ульба (левый берег) в створе испрашиваемого земельного участка в Глубоковском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданындағы сұралып отырған жер учаскесі тұстамасындағы Кіші Үлбі өзенінің (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 17 февраля 2021 года № 30. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 февраля 2021 года № 8413
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Кыстау-Курчум и ручья без названия в створе земельного участка, предназначенного для реализации через аукцион для выпаса сельскохозяйственных животных на территории Курчумского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Күршім ауданы аумағында ауыл шаруашылығы жануарларын жаю үшін аукцион арқылы өткізуге арналған жер учаскесінің тұстамасындағы Қыстау-Күршім өзені мен атауы жоқ бұлақтың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

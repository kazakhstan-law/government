title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Алибек и ее притоков ручьев Тюлюгун и Бозунбай в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Әлібек өзені және оның салалары Тюлюгун және Бозымбай бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

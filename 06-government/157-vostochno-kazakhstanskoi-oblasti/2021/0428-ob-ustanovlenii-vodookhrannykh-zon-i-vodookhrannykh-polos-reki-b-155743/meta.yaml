act_code: '155743'
requisite: Постановление Восточно-Казахстанского областного акимата от 28 апреля 2021 года № 150. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 мая 2021 года № 8737
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Бобровка (правый берег) и ее правобережного притока (левый берег) в створе испрашиваемого земельного участка в Глубоковском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданындағы сұралып отырған жер учаскесі тұстамасындағы Бобровка өзенінің (оң жағалауы) және оның оң жағалау ағысының (сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

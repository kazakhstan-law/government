title:
  rus: Об установлении водоохранной зоны и водоохранной полосы пруда на реке Маховка в створе испрашиваемых земельных участков, расположенных в селе Солнечное Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Солнечное ауылында орналасқан сұралып отырған жер учаскелерінің тұстамасындағы Маховка өзеніндегі тоғанның су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

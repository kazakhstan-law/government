    kaz: «Азаматтық қызметшілер болып табылатын және Алтай ауданының ауылдық жерлерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін анықтау туралы» Алтай ауданы әкімдігінің 2021 жылғы 15 қаңтардағы № 2 қаулысына толықтыру енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата района Алтай от 15 января 2021 года № 2 «Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности района Алтай»
    kaz: «Азаматтық қызметшілер болып табылатын және Алтай ауданының ауылдық жерлерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін анықтау туралы» Алтай ауданы әкімдігінің 2021 жылғы 15 қаңтардағы № 2 қаулысына өзгеріс енгізу туралы

title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Бобровка в створе испрашиваемого земельного участка в селе Бобровка Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданының Бобровка ауылындағы сұралып отырған жер учаскесінің тұстамасындағы Бобровка өзенінің су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

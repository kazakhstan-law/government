requisite: Постановление Восточно-Казахстанского областного акимата от 28 апреля 2021 года № 149. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 мая 2021 года № 8729
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Бухтарма (левый берег) и реки Курту (правый и левый берег) в Катон-Карагайском районе Восточно-Вазахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Катонқарағай ауданындағы Бұқтырма өзенінің (сол жағалау) және Курты өзенінің (оң және сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

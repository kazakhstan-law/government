title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Ковалевка и родников Таскудук и Теренкудук в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы Ковалевка өзені мен Тасқұдық және Тереңқұдық бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

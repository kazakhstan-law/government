act_code: '152311'
requisite: Постановление акимата Шемонаихинского района Восточно-Казахстанской области от 6 января 2021 года № 01. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 января 2021 года № 8326. Утратило силу постановлением акимата Шемонаихинского района Восточно-Казахстанской области от 28 апреля 2025 года № 121 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін белгілеу туралы

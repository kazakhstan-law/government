title:
  rus: Об установлении водоохранных зон и водоохранных полос ручья Бутагора и ручьев без названия №№ 1-3 в створе испрашиваемого земельного участка в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскесі тұстамасындағы Бутагора бұлағының және атауы жоқ №№ 1-3 бұлақтарының су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

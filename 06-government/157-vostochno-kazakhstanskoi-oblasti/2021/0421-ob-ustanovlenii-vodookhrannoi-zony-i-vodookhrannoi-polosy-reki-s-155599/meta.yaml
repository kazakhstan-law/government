requisite: Постановление Восточно-Казахстанского областного акимата от 21 апреля 2021 года № 130. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 апреля 2021 года № 8698
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Сибинка и ее притоков в створе испрашиваемого земельного участка, расположенного в 14,0 км южнее села Алгабас Уланского района Восточно–Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Алғабас ауылынан оңтүстікке қарай 14,0 км орналасқан сұралып отырған жер учаскесі тұстамасындағы Сибинка өзені мен оның салаларының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

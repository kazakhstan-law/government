requisite: Постановление Восточно-Казахстанского областного акимата от 12 мая 2021 года № 179. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 мая 2021 года № 8802
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Красноярка (правый берег) и ручья Березовский (левый берег) в створе испрашиваемого товариществом с ограниченной ответственностью  «Rich Land int» земельного участка, расположенного северо-восточнее поселка Верхнеберезовка Глубоковского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданы Верхнеберезовка кентінің солтүстік-шығысында орналасқан «Rich Land int» жауапкершілігі шектеулі серіктестігі сұрап отырған жер учаскесі тұстамасындағы Красноярка өзенінің (оң жағалау) және Березовский бұлағының (сол жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

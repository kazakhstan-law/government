title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Караозек (правый берег) на испрашиваемом земельном участке, расположенном в 0,5 км северо-восточнее поселка Касыма Кайсенова Уланского района Восточно-Казахстанской области, и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Қасым Қайсенов кентінің солтүстік-шығысына қарай 0,5 км орналасқан сұралып отырған жер учаскесіндегі Қараөзек өзенінің (оң жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

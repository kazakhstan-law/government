act_code: '155547'
requisite: Постановление Бескарагайского районного акимата Восточно-Казахстанской области от 21 апреля 2021 года № 177. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 апреля 2021 года № 8686
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы, граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования на 2021 год
  kaz: Пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдарды, ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін 2021 жылға арналған жұмыс орындарына квота белгілеу туралы

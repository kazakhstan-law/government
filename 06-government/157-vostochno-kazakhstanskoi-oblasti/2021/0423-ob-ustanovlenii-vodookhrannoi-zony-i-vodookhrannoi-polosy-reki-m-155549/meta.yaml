requisite: Постановление Восточно-Казахстанского областного акимата от 23 апреля 2021 года № 138. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 апреля 2021 года № 8687
title:
  rus: Об установлении водоохранной зоны и водоохранной полосы реки Малая Ульба (левый берег) в створе испрашиваемых земельных участков, расположенных в селе Новая Ульба Глубоковского района Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Глубокое ауданының Жаңа Үлбі ауылында орналасқан сұралып отырған жер учаскелерінің тұстамасындағы Кіші Үлбі өзенінің (сол жағалау) су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

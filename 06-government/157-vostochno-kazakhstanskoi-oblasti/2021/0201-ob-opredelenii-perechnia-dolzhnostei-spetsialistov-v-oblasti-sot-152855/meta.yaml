  title:
    rus: О внесении изменений в постановление акимата Катон-Карагайского района от 1 февраля 2021 года № 10 «Об определении перечня должностей специалистов в области социального обеспечения и культуры являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Катонқарағай ауданының әкімдігінің 2021 жылғы 1 ақпандағы № 10 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

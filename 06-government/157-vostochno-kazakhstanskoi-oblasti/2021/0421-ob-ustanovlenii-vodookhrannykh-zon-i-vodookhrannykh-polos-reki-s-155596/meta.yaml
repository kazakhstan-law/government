act_code: '155596'
requisite: Постановление Восточно-Казахстанского областного акимата от 21 апреля 2021 года № 127. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 апреля 2021 года № 8694
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Сартымбет, ручья Канжигабулак, ручья без названия и прудов №№ 1, 2 в створе испрашиваемых земельных участков в Уланском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Ұлан ауданындағы сұралып отырған жер учаскелері тұстамасындағы Сартымбет өзені, Қанжығабұлақ бұлағы, атауы жоқ бұлақ және №№ 1, 2 тоғандардың су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

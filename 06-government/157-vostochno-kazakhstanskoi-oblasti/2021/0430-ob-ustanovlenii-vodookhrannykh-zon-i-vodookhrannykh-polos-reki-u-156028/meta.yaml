act_code: '156028'
requisite: Постановление Восточно-Казахстанского областного акимата от 30 апреля 2021 года № 158. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 мая 2021 года № 8777
title:
  rus: Об установлении водоохранных зон и водоохранных полос реки Уба (левый берег) и реки Выдриха (левый и правый берег) в створе земельных участков в районе села Выдриха в Шемонаихинском районе Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысы Шемонаиха ауданы Выдриха ауылы аумағындағы жер учаскелері тұстамасындағы Оба өзенінің (сол жағалау) және Выдриха өзенінің (сол және оң жағалау) су қорғау аймақтары мен су қорғау белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

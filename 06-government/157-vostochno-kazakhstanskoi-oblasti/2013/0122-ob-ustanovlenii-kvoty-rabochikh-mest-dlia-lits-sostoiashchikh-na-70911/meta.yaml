act_code: '70911'
requisite: Постановление акимата Бескарагайского района Восточно-Казахстанской области от 22 января 2013 года № 22. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 февраля 2013 года № 2877. Утратило силу постановлением акимата Бескарагайского района Восточно-Казахстанской области от 3 апреля 2013 года № 153
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясының пробациялық қызметі есебінде тұрған тұлғалар, сонымен қатар бас бостандығынан айыру орындарынан босатылған тұлғалар және интернат ұйымдарының кәмелеттік жасқа толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы

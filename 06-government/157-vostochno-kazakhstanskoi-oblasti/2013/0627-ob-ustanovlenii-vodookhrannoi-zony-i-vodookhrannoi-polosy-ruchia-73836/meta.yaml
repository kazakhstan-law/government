title:
  rus: Об установлении водоохранной зоны и водоохранной полосы ручья Шешек в створе земельного участка, предоставленного для проектирования и строительства парка семейного отдыха "Чечек" в городе Усть-Каменогорске Восточно-Казахстанской области и режима их хозяйственного использования
  kaz: Шығыс Қазақстан облысының Өскемен қаласында "Шешек" отбасылық демалыс саябағын жобалау және құрылысын салу үшін берілген жер учаскесінің тұсындағы Шешек бұлағының су қорғау аймағы мен су қорғау белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

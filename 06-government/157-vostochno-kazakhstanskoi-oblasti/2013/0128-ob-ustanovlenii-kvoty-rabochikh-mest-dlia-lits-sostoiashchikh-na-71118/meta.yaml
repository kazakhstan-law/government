act_code: '71118'
requisite: Постановление акимата города Усть-Каменогорска Восточно-Казахстанской области от 28 января 2013 года № 5071. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 февраля 2013 года № 2880. Утратило силу - постановлением акимата города Усть-Каменогорска Восточно-Казахстанской области от 19 сентября 2016 года № 2251
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

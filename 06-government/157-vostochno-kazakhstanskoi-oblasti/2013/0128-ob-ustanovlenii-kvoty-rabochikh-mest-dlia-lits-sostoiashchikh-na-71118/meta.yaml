  title:
    rus: О внесении изменения в постановление акимата города Усть-Каменогорска от 28 января 2013 года № 5071 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также  для лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций"
    kaz: Өскемен қаласы әкімдігінің 2013 жылғы 28 қаңтардыағы № 5071 "Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына  квота белгілеу туралы" қаулысына өзгеріс енгізу туралы

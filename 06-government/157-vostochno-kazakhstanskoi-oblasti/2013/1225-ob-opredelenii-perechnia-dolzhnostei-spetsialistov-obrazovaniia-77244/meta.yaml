    kaz: '"Ауылдық жердегі жұмысы үшін лауазымдық айлықақыларын көтеру белгіленген әлеуметтік қамтамасыз ету, бiлiм беру, мәдениет мамандары лауазымдарының  тiзбесiн айқындау туралы" Бесқарағай ауданы әкімдігінің 2013 жылғы 25 желтоқсандағы № 542 қаулысына өзгерістер мен толықтыру енгізу туралы'

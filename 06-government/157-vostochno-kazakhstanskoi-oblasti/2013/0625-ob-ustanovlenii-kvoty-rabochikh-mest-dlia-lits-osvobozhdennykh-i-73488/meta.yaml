act_code: '73488'
requisite: Постановление акимата Урджарского района Восточно-Казахстанской области от 25 июня 2013 года № 321. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 июля 2013 года № 2989. Утратило силу постановлением акимата Урджарского района от 31 марта 2014 года № 108
title:
  rus: Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы, и несовершеннолетним выпускникам интернатных организаций, а также для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции
  kaz: Бас бостандығынан айыру орындарынан босатылған тұлғалар, интернаттық ұйымдарды бітіруші кәмелетке толмағандар, сондай-ақ қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін жұмыс орындарына квота белгілеу туралы

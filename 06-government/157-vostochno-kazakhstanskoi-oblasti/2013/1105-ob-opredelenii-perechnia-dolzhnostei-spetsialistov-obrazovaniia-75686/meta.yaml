act_code: '75686'
requisite: Постановление акимата Тарбагатайского района Восточно-Казахстанской области от 5 ноября 2013 года № 394. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 декабря 2013 года № 3109. Утратило силу постановлением акимата Тарбагатайского района Восточно-Казахстанской области от 14 апреля 2020 года № 269 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов образования, социального обеспечения, культуры, ветеринарии, которым установлено повышение к должностным окладам за работу в сельской местности
  kaz: Ауылдық жердегi жұмысы үшiн лауазымдық айлықақыларын көтеру белгiленген бiлiм беру, әлеуметтiк қамтамасыз ету, мәдениет, ветеринария мамандары лауазымдарының тiзбесiн айқындау туралы

requisite: Постановление Восточно-Казахстанского областного акимата от 23 апреля 2002 года N 139. Зарегистрировано Управлением юстиции Восточно-Казахстанской области 6 мая 2002 года за N 814. Утратило силу постановлением акимата ВКО от 21 мая 2003 года N 71

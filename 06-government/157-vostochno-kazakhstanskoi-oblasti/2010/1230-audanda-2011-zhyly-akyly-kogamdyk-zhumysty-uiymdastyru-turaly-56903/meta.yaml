act_code: '56903'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2010 жылғы 30 желтоқсандағы № 441 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2010 жылғы 17 қаңтарда № 5-16-107 тіркелді. Күші жойылды - ШҚО Тарбағатай ауданы әкімдігінің 2012 жылғы 17 қаңтардағы № 08 қаулысымен

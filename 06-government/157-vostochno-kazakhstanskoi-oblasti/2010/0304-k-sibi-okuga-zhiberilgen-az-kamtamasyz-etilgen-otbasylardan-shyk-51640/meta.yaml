act_code: '51640'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 4 наурыздағы № 184 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданының Әділет басқармасында 2010 жылғы 7 сәуірде № 5-5-106 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2013 жылғы 6 наурыздағы № 368 қаулысымен
title:
  rus: Кәсiби оқуға жiберiлген аз қамтамасыз етiлген отбасылардан шыққан жұмыспен қамтылған және жетi жасқа дейiнгi бала тәрбиесiмен шұғылданатын, сондай-ақ жұмыссыз азаматтардың жол жүру, тамақтану, тұру және медициналық куәландыру шығындарын өтеу нұсқаулығын бекiту туралы
  kaz: Кәсiби оқуға жiберiлген аз қамтамасыз етiлген отбасылардан шыққан жұмыспен қамтылған және жетi жасқа дейiнгi бала тәрбиесiмен шұғылданатын, сондай-ақ жұмыссыз азаматтардың жол жүру, тамақтану, тұру және медициналық куәландыру шығындарын өтеу нұсқаулығын бекiту туралы

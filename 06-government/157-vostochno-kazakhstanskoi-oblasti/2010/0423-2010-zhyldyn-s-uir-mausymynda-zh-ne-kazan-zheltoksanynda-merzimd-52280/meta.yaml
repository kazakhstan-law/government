act_code: '52280'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2010 жылғы 23 сәуірдегі № 141 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай аудандық Әділет басқармасында 2010 жылғы 4 мамырда № 5-7-80 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2011 жылғы 28 ақпандағы № 60 қаулысымен

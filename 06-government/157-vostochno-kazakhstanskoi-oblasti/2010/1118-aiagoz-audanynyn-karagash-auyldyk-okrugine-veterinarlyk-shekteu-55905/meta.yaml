act_code: '55905'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2010 жылғы 18 қарашадағы № 238 қаулысы. Шығыс Қазақстан облысы Аягөз аудандық әділет басқармасында 2010 жылғы 10 желтоқсанда № 5-6-126 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Аягөз ауданы әкімінің аппаратының 2012 жылғы 20 наурыздағы № 05/754 хаты)

requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2010 жылғы 3 қыркүйектегі № 1755 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 4 қазанда № 5-14-114 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2010 жылғы 2 қарашадағы № 1799 қаулысымен

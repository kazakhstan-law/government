act_code: '54697'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2010 жылғы 3 қыркүйектегі № 1756 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 4 қазанда № 5-14-115 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2011 жылғы 29 қарашадағы № 2337 қаулысымен

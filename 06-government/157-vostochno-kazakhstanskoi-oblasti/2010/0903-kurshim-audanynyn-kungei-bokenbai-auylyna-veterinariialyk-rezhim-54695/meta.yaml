act_code: '54695'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2010 жылғы 3 қыркүйектегі № 1754 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 4 қазанда № 5-14-113 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2011 жылғы 12 қазандағы № 2273 қаулысымен

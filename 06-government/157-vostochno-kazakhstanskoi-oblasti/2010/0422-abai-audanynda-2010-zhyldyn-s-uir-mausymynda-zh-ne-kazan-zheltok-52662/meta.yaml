act_code: '52662'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 22 сәуірдегі № 208 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2010 жылғы 21 мамырда № 5-5-109 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2011 жылғы 24 наурыздағы № 359 қаулысымен

requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2010 жылғы 27 қазандағы № 526 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2010 жылғы 22 қарашада № 5-18-105 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2010 жылғы 27 желтоқсандағы № 597 қаулысымен

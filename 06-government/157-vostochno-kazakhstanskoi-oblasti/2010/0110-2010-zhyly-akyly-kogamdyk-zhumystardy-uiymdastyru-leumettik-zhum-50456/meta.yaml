act_code: '50456'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2010 жылғы 10 қаңтардағы № 1458 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 4 ақпанда № 5-14-104 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Күршім ауданы әкімі аппаратының 2011 жылғы 8 шілдедегі 01-05/1494 хаты)
title:
  rus: 2010 жылы ақылы қоғамдық жұмыстарды ұйымдастыру, әлеуметтік жұмыс орындарын құру туралы

act_code: '50201'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық әкімдігінің 2010 жылғы 22 қаңтардағы № 4533 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2010 жылғы 22 қаңтарда № 5-13-68 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды (Катонқарағай аудандық әкімдігінің 2011 жылғы 26 қаңтардағы № 02-15/23 хаты)

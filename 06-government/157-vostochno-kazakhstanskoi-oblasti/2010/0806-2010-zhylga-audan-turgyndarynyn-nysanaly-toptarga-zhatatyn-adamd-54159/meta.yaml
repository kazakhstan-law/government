act_code: '54159'
requisite: Шығыс Қазақстан облысы Катонқарағай ауданы әкімдігінің 2010 жылғы 6 тамыздағы № 37 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2010 жылғы 20 тамызда № 5-13-77 тіркелді. Күші жойылды - Катонқарағай ауданы әкімдігінің 2010 жылғы 27 желтоқсандағы № 184 қаулысымен

act_code: '52241'
requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2010 жылғы 23 сәуірдегі № 150 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2010 жылғы 7 мамырда № 5-10-98 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Жарма ауданы әкімі аппаратының 2011 жылғы 11 мамырдағы № 1113 хаты

act_code: '57233'
requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2010 жылғы 30 желтоқсандағы № 345 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2011 жылғы 10 ақпанда № 5-10-110 тіркелді. Күші жойылды - Жарма ауданы әкімдігінің 2012 жылғы 20 сәуірдегі № 90 қаулысымен

requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2010 жылғы 2 сәуірдегі № 208 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2010 жылғы 14 сәуірде № 5-18-93 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2012 жылғы 7 мамырдағы № 181 қаулысымен

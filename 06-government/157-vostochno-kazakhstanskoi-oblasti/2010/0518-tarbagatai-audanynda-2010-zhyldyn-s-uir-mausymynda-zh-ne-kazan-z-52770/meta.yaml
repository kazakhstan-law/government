act_code: '52770'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2010 жылғы 18 мамырдағы № 130 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2010 жылғы 25 мамырда № 5-16-93 тіркелді. Күші жойылды - Тарбағатай ауданы әкімдігінің 2011 жылғы 2 наурыздағы № 83 қаулысымен

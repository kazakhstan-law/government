act_code: '53391'
requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімдігінің 2010 жылғы 5 маусымдағы № 793 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық әділет басқармасында 2010 жылғы 7 шілдеде № 5-17-132 тіркелді. Күші жойылды (Ұлан ауданы әкімі аппаратының 2012 жылғы 7 мамырдағы № 04/04-20-1940 хаты)

act_code: '56497'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2010 жылғы 7 желтоқсандағы № 502 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай аудандық Әділет басқармасында 2010 жылғы 27 желтоқсанда № 5-7-87 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2012 жылғы 10 қыркүйектегі № 386 қаулысымен
title:
  rus: Бесқарағай ауданында бас бостандығынан айыру орындарынан босатылғандар мен интернат ұйымдарының кәмелетке толмаған түлектері үшін квота белгілеу туралы

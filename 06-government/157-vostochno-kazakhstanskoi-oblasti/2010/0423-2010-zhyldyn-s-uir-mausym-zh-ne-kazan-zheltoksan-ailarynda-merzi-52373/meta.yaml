requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2010 жылғы 23 сәуірдегі № 2166 қаулысы. Шығыс Қазақстан облысы Аягөз аудандық әділет басқармасында 2010 жылғы 12 мамырда № 5-6-107 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Аягөз ауданының әділет басқармасының 2011 жылғы 20 қаңтардағы № 04-05/263 хаты

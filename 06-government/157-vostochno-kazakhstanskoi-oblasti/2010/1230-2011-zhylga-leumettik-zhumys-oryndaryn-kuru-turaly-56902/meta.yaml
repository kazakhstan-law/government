act_code: '56902'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық әкімдігінің 2010 жылғы 30 желтоқсандағы № 234 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2011 жылғы 18 қаңтарда № 5-13-83 тіркелді. Күші жойылды - ШҚО Катонқарағай аудандық әкімдігінің 2012 жылғы 10 ақпандағы № 698 қаулысымен

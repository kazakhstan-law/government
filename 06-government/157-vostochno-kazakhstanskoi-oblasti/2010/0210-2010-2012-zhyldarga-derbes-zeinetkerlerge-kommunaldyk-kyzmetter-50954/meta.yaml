act_code: '50954'
requisite: Шығыс Қазақстан облысы Зайсан ауданы әкімдігінің 2010 жылғы 10 ақпандағы № 1062 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық әділет басқармасында 2010 жылғы 3 наурызда № 5-11-112 тіркелді. Күші жойылды - Зайсан ауданы әкімдігінің 2012 жылғы 29 тамыздағы № 1146 қаулысымен

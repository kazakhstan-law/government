requisite: Постановление акимата города Усть-Каменогорска Восточно-Казахстанской области от 21 января 2010 года № 5248. Зарегистрировано Управлением юстиции города Усть-Каменогорск Департамента юстиции Восточно-Казахстанской области 5 февраля 2010 года за № 5-1-132. Утратило силу в связи с истечением срока действия - письмо аппарата акима города Усть-Каменогорска от 5 января 2011 года № Ин-6/751
title:
  rus: Об оказании материальной помощи лицам, которым назначены пенсии за особые заслуги перед Республикой Казахстан и областью на компенсацию расходов по коммунальным услугам в 2010 году
  kaz: 2010 жылы Қазақстан Республикасы және облыс алдындағы ерекше еңбегі үшін зейнетақы тағайындалған тұлғаларға коммуналдық қызметтер бойынша шығындар өтемақысына материалдық көмек көрсету туралы

requisite: Шығыс Қазақстан облысы Үржар ауданы әкімдігінің 2010 жылғы 11 наурыздағы № 187 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2010 жылғы 1 сәуірде № 5-18-92 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2012 жылғы 7 мамырдағы № 181 қаулысымен

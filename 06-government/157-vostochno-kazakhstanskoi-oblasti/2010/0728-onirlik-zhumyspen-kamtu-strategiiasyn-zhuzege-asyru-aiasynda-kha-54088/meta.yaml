act_code: '54088'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2010 жылғы 28 шілдедегі № 09 қаулысы. Шығыс Қазақстан облысы Аягөз аудандық әділет басқармасында 2010 жылғы 19 тамызда № 5-6-114 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Аягөз ауданы әкімінің аппаратының 2012 жылғы 20 наурыздағы № 05/754 хаты)
title:

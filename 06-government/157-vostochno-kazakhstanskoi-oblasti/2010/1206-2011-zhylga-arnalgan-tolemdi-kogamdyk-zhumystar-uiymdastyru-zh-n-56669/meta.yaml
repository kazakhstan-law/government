act_code: '56669'
requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімдігінің 2010 жылғы 6 желтоқсандағы № 207 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2010 жылғы 30 желтоқсанда № 5-17-142 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Ұлан аудынының әкімі аппаратының 2012 жылғы 27 қаңтардағы № 11/01-26-296 хаты)

act_code: '54089'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2010 жылғы 28 шілдедегі № 10 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Аягөз ауданының Әділет басқармасында 2010 жылғы 19 тамызда № 5-6-115 тіркелді. Күші жойылды - Аягөз ауданы әкімдігінің 2012 жылғы 2 мамырдағы № 248 қаулысымен

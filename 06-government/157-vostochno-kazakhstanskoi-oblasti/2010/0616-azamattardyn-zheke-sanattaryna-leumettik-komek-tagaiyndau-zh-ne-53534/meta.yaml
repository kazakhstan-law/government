act_code: '53534'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 16 маусымдағы № 222 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2010 жылғы 16 шілдеде № 5-5-113 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2012 жылғы 11 маусымдағы № 238 қаулысымен

requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2010 жылғы 23 сәуірдегі № 596 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2010 жылғы 26 мамырда № 5-15-68 тіркелді. Күші жойылды - Көкпекті ауданы әкімдігінің 2011 жылғы 5 сәуірдегі № 993 қаулысымен

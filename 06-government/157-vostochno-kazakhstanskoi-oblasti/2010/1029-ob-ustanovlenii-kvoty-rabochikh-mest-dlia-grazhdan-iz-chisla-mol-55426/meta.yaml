act_code: '55426'
requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 29 октября 2010 года № 807. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 15 ноября 2010 года за № 5-8-118. Утратило силу - постановлением акимата Бородулихинского района Восточно-Казахстанской области от 29 августа 2016 года № 152
title:
  rus: Об установлении квоты рабочих мест для граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования и лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтар және пробация қызметінің есебінде тұрған адамдар, сонымен қатар бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

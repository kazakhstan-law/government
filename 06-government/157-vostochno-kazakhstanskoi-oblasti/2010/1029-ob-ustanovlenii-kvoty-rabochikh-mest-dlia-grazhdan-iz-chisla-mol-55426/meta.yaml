  requisite: Постановление акимата Бородулихинского района Восточно-Казахстанской области от 09 июня 2016 года № 114. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 июля 2016 года № 4601. Утратило силу - постановлением акимата Бородулихинского района Восточно-Казахстанской области от 23 сентября 2016 года № 172
  title:
    rus: О внесении изменений в постановление акимата Бородулихинского района Восточно-Казахстанской области от 29 октября 2010 года № 807 «Об установлении квоты рабочих мест для несовершеннолетних выпускников интернатных организаций и лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы»
    kaz: «Интернаттық ұйымдарды бітіруші кәмелетке толмағандар және қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы» Шығыс Қазақстан облысы Бородулиха ауданы әкімдігінің 2010 жылғы 29 қазандағы № 807 қаулысына өзгертулер енгізу туралы

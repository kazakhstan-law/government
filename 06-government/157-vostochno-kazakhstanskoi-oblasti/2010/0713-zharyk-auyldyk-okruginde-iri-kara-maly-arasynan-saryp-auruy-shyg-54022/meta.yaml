requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2010 жылғы 13 шілдедегі № 196 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2010 жылғы 16 тамызда № 5-10-104 тіркелді. Күші жойылды - Жарма ауданы әкімдігінің 2011 жылғы 26 қыркүйектегі № 278 қаулысымен

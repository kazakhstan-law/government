act_code: '53554'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 16 маусымдағы № 223 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2010 жылғы 16 шілдеде № 5-5-114 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2011 жылғы 29 қарашадағы № 106 қаулысымен

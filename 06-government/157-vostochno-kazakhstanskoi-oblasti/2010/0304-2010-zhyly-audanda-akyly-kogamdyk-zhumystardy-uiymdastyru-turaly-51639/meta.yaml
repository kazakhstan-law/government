act_code: '51639'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 4 наурыздағы № 183 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданының Әділет басқармасында 2010 жылғы 7 сәуірде № 5-5-105 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2011 жылғы 1 шілдедегі № 23 қаулысымен

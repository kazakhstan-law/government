act_code: '51385'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2010 жылғы 23 ақпандағы № 55 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай аудандық Әділет басқармасында 2010 жылғы 19 наурызда № 5-7-78 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2011 жылғы 28 ақпандағы № 60 қаулысымен

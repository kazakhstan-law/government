requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2010 жылғы 16 тамыздағы № 712 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2010 жылғы 24 қыркүйекте № 5-15-73 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2011 жылғы 25 қаңтардағы № 1317 қаулысымен

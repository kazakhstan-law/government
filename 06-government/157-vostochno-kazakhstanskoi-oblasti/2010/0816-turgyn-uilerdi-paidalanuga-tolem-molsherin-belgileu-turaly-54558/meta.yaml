requisite: Шығыс Қазақстан облысы Жарма ауданы әкімдігінің 2010 жылғы 16 тамыздағы № 232 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2010 жылғы 17 қыркүйекте № 5-10-105 тіркелді. Күші жойылды - Жарма ауданы әкімдігінің 2013 жылғы 20 мамырдағы № 115 қаулысымен

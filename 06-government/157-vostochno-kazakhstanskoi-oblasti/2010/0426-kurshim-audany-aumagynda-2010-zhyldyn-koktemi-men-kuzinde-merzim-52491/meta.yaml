act_code: '52491'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2010 жылғы 26 сәуірдегі № 1624 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 17 мамырда № 5-14-107 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2011 жылғы 17 ақпандағы № 1948 қаулысымен
title:

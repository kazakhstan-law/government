act_code: '50697'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2010 жылғы 25 қаңтардағы № 17 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2010 жылғы 8 ақпанда № 5-16-90 тіркелді. Күші жойылды - Тарбағатай ауданы әкімдігінің 2010 жылғы 30 желтоқсандағы № 441 қаулысымен

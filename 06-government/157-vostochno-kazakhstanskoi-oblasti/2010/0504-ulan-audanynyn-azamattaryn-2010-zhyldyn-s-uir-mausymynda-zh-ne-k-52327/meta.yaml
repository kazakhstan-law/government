act_code: '52327'
requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімдігінің 2010 жылғы 4 мамырдағы № 726 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық әділет басқармасында 2010 жылғы 11 мамырда № 5-17-128 тіркелді. Қаулы қамтылған тапсырмаларды орындауына байланысты қолданылуы тоқтатылды (Ұлан ауданы әкімінің 2011 жылғы 11 мамырдағы № 05/1623 хаты)

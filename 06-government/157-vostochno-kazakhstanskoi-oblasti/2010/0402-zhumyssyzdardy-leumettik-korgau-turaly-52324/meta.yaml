act_code: '52324'
requisite: Шығыс Қазақстан облысы Үржар аудандық әкімдігінің 2010 жылғы 2 сәуірдегі № 209 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2010 жылғы 5 мамырда № 5-18-95 тіркелді. Күші жойылды - Үржар ауданы әкімдігінің 2012 жылғы 7 мамырдағы № 181 қаулысымен

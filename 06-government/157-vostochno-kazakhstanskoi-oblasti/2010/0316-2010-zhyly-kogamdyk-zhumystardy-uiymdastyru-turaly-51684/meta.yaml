requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімдігінің 2010 жылғы 16 наурыздағы № 558 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2010 жылғы 13 сәүірде № 5-15-66 тіркелді. Күші жойылды - Көкпекті ауданы әкімдігінің 2011 жылғы 28 қыркүйектегі № 1240 қаулысымен

requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімдігінің 2010 жылғы 2 желтоқсандағы № 204 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2010 жылғы 28 желтоқсанда № 5-17-141 тіркелді. Күші жойылды - Ұлан ауданы әкімдігінің 2011 жылғы 8 желтоқсандағы № 749 қаулысымена
title:

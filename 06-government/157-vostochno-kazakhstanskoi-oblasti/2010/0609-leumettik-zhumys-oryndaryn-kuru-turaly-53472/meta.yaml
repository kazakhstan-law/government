act_code: '53472'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2010 жылғы 9 маусымдағы № 191 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2010 жылғы 16 маусымда № 5-16-95 тіркелді. Күші жойылды - ШҚО Тарбағатай ауданы әкімдігінің 2012 жылғы 13 ақпандағы № 42 қаулысымен

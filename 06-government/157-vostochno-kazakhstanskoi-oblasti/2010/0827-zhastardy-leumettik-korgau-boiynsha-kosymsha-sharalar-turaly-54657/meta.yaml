act_code: '54657'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімдігінің 2010 жылғы 27 тамыздағы № 96 қаулысы. Шығыс Қазақстан облысы Аягөз аудандық әділет басқармасында 2010 жылғы 30 қыркүйекте № 5-6-118 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Аягөз ауданы әкімінің аппаратының 2012 жылғы 20 наурыздағы № 05/754 хаты)

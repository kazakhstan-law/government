requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімдігінің 2010 жылғы 27 желтоқсандағы № 436 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2011 жылғы 14 қаңтарда № 5-16-106 тіркелді. Күші жойылды - Тарбағатай ауданы әкімдігінің 2011 жылғы 21 қарашадағы № 323 қаулысымен

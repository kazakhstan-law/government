act_code: '52771'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімдігінің 2010 жылғы 12 мамырдағы № 1643 қаулысы. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 28 мамырда № 5-14-108 тіркелді. Күші жойылды - Күршім ауданы әкімдігінің 2012 жылғы 21 мамырдағы № 2527 қаулысымен

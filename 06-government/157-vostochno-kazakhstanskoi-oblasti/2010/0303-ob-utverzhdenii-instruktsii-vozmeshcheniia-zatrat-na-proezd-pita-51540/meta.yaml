title:
  rus: Об утверждении Инструкции возмещения затрат на проезд, питание, проживание и медицинское освидетельствование занятым и лицам, занятым уходом за детьми в возрасте до семи лет, из числа малообеспеченных, а также безработным, направленным на профессиональное обучение
  kaz: Кәсіби оқытуға жіберілген табысы аз адамдар қатарындағы жұмыспен қамтылғандардың және жеті жасқа дейінгі балаларды бағып-күтумен айналысатын адамдардың, сондай-ақ, жұмыссыз азаматтардың жол жүру, тамақтану, тұру және медициналық куәландыру шығындарын өтеудің Нұсқаулығын бекіту туралы

  title:
    rus: О внесении изменений в постановление от 3 марта 2010 года № 181 "Об утверждении Инструкции возмещения затрат на проезд, питание, проживание и медицинское освидетельствование занятым и лицам, занятым уходом за детьми в возрасте до семи лет из числа малообеспеченных, работникам, занятым в режиме неполного рабочего времени, а также безработным, направленным на профессиональное обучение"
    kaz: '"Кәсіби оқытуға жіберілген  табысы аз адамдар қатарындағы жұмыспен қамтылғандардың және жеті жасқа дейінгі балаларды бағып-күтумен айналысатын адамдардың, толық емес жұмыс уақыты режиміндегі жұмыспен қамтылған қызметкерлердің, сондай-ақ, жұмыссыз азаматтардың жол жүру, тамақтану, тұру және медициналық куәландыру шығындарын өтеудің Нұсқаулығын бекіту туралы"  2010 жылғы 3 наурыздағы № 181 қаулыға өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/63978/rus

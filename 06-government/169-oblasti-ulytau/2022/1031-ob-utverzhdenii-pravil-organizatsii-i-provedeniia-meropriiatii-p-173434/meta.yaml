act_code: '173434'
requisite: Постановление акимата города Сатпаев области Ұлытау от 31 октября 2022 года № 85/01. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 ноября 2022 года № 30418
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Сатпаев
  kaz: Сәтбаев қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

act_code: '171166'
requisite: Постановление акимата города Жезказган области Ұлытау от 19 июля 2022 года № 25/01. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 сентября 2022 года № 29379
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Жезказган
  kaz: Жезқазған қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

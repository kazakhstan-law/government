  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Информационно-консультативный центр по вопросам религий города Сатпаев» государственного учреждения «Отдел внутренней политики города Сатпаев»
  kaz: «Сәтбаев қаласының ішкі саясат бөлімі» мемлекеттік мекемесінің «Сәтбаев қаласының дін сұрақтары бойынша ақпарат және кеңес беру орталығы» коммуналдық мемлекеттік мекемесі жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу тәртібі мен шарттарын айқындау туралы

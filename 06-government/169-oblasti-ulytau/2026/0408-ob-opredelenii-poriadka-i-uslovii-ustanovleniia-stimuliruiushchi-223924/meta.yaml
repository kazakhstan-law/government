requisite: Постановление акимата области Ұлытау от 8 апреля 2026 года № 32/01. Утратило силу постановлением акимата области Ұлытау от 21 мая 2026 года № 48/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Центр изучения религий» управления по делам религий области Ұлытау
  kaz: Ұлытау облысының дін істері басқармасының «Діндерді зерттеу орталығы» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық жалақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы

requisite: Постановление акимата города Сатпаев области Ұлытау от 22 мая 2024 года № 36/01. Зарегистрировано в Департаменте юстиции области Ұлытау 22 мая 2024 года № 120-20
title:
  rus: Об установлении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размеров льгот
  kaz: Мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру көрсетілетін қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктердің мөлшерін белгілеу туралы

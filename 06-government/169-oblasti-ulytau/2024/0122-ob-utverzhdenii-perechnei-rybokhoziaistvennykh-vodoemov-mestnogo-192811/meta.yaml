act_code: '192811'
requisite: Постановление акимата области Ұлытау от 22 января 2024 года № 04/01. Зарегистрировано в Департаменте юстиции области Ұлытау 23 января 2024 года № 89-20. Утратило силу постановлением акимата области Ұлытау от 17 июля 2024 года № 44/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечней рыбохозяйственных водоемов местного значения и рыбохозяйственных водоемов и (или) участков местного значения в разрезе водоемов и (или) участков для ведения промыслового рыболовства, любительского (спортивного) рыболовства, озерно-товарного рыбоводного хозяйства, садкового рыбоводного хозяйства
  kaz: Жергілікті маңызы бар балық шаруашылығы су айдындарының және кәсіпшілік балық аулауды, әуесқойлық (спорттық) балық аулауды, көлде тауарлы балық өсіру шаруашылығын, тор қоршамада балық өсіру шаруашылығын жүргізуге арналған су айдындары және (немесе) учаскелер бойынша жергілікті маңызы бар балық шаруашылығы су айдындарының және (немесе) учаскелерінің тізбелерін бекіту туралы

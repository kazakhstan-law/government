act_code: '204538'
requisite: Постановление акимата области Ұлытау от 23 декабря 2024 года № 96/01
title:
  rus: Об отмене постановления акимата области Ұлытау № 82/02 от 20 ноября 2024 года «Об утверждении норм потребления коммунальных услуг по электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в области Ұлытау»
  kaz: Ұлытау облысы әкімдігінің 2024 жылдың 20 қарашадағы № 82/02 «Ұлытау облысында есептеу аспаптары жоқ тұтынушылар үшін электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау бойынша көрсетілетін коммуналдық қызметтерді тұтыну нормаларын бекіту туралы» қаулысын жою туралы

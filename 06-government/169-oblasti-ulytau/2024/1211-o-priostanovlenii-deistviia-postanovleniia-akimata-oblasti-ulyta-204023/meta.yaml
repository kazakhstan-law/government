title:
  rus: О приостановлении действия постановления акимата области Ұлытау от 3 декабря 2024 года № 85/01 «Об установлении тарифов на регулярные межрайонные (междугородные внутриобластные) социально значимые перевозки пассажиров по области Ұлытау»
  kaz: Ұлытау облысы әкімдігінің «Ұлытау облысы бойынша жолаушыларды тұрақты ауданаралық (облысішілік қалааралық) әлеуметтік мәні бар тасымалдауға тарифтерін белгілеу туралы» 2024 жылғы 3 желтоқсандағы № 85/01 қаулысының қолданылуын тоқтата тұру туралы

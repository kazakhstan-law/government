act_code: '196916'
requisite: Постановление акимата области Ұлытау от 15 мая 2024 года № 27/01. Зарегистрировано в Департаменте юстиции области Ұлытау 22 мая 2024 года № 119-20
title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) по области Ұлытау на 2024 год
  kaz: Ұлытау облысы бойынша 2024 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялардың нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы

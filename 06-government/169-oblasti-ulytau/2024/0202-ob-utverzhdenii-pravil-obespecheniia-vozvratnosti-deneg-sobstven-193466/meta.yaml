requisite: Постановление акимата города Сатпаев области Ұлытау от 2 февраля 2024 года № 08/04. Зарегистрировано в Департаменте юстиции области Ұлытау 19 февраля 2024 года № 98-20. Утратило силу постановлением акимата города Сатпаев области Ұлытау от 22 ноября 2024 года № 81/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил обеспечения возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в городе Сатпаев
  kaz: Сәтбаев қаласында пәтерлер, тұрғын емес үй-жайлар меншік иелерінің көппәтерлі тұрғын үйде лифтілерді жөндеуге және ауыстыруға, күрделі жөндеуге байланысты ақшаны қайтаруын қамтамасыз ету қағидаларын бекіту туралы

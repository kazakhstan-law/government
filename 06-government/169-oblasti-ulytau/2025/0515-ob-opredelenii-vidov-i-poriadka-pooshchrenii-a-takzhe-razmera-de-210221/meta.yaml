requisite: Постановление акимата области Ұлытау от 15 мая 2025 года № 41/01. Зарегистрировано Департаментом юстиции области Ұлытау 16 мая 2025 года № 197-20. Утратило силу постановлением акимата области Ұлытау от 4 августа 2026 года № 69/03 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

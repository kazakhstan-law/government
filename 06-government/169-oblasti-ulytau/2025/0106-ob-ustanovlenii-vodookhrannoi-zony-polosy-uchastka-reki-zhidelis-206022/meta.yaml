act_code: '206022'
requisite: Постановление акимата области Ұлытау от 6 января 2025 года № 02/01. Зарегистрировано Департаментом юстиции области Ұлытау 8 января 2025 года № 174-20. Утратило силу постановлением акимата области Ұлытау от 10 октября 2025 года № 81/01 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны, полосы участка реки Жиделисай на рассматриваемом створе, расположенного в Борсенгирском сельском округе Улытауского района области Ұлытау, и режима их хозяйственного использования
  kaz: Ұлытау облысы Ұлытау ауданы Борсеңгір ауылдық округінде орналасқан, қаралып отырған тұста Жиделісай өзені учаскесінің су қорғау аймағын, белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

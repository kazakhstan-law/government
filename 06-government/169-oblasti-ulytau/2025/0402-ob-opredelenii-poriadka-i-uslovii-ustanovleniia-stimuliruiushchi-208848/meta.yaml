act_code: '208848'
requisite: Постановление акимата города Жезказган области Ұлытау от 2 апреля 2025 года № 13/01
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунального государственного казенного предприятия «Управление парками культуры и отдыха» акимата города Жезказган Отдела жилищно-коммунального хозяйства города Жезказгана
  kaz: Жезқазған қаласы әкімдігінің Жезқазған қаласының тұрғын үй-коммуналдық шаруашылық бөлімінің «Мәдениет және демалыс парктерін басқару» коммуналдық мемлекеттік қазыналық кәсіпорны жұмыскерлерінің лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы

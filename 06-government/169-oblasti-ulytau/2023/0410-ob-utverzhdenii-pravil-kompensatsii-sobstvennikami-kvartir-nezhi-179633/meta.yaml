requisite: Постановление акимата города Жезказган области Ұлытау от 10 апреля 2023 года № 13/01. Зарегистрировано Департаментом юстиции области Ұлытау 12 апреля 2023 года № 12-20. Утратило силу постановлением акимата города Жезказган области Ұлытау от 24 мая 2024 года № 23/01 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил компенсации собственниками квартир, нежилых помещений затрат, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в городе Жезказган
  kaz: Жезқазған қаласында көппәтерлі тұрғын үйдің пәтерлері, тұрғын емес үй-жайлары меншік иелерінің лифтілерді жөндеу және ауыстыруға, көппәтерлі тұрғын үйді күрделі жөндеуге байланысты шығындарды өтеу қағидаларын бекіту туралы

requisite: Постановление акимата области Ұлытау от 9 февраля 2023 года № 08/01. Зарегистрировано Департаментом юстиции области Ұлытау 10 февраля 2023 года № 6-20. Утратило силу постановлением акимата области Ұлытау от 9 декабря 2024 года № 88/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

act_code: '191674'
requisite: Постановление акимата области Ұлытау от 28 декабря 2023 года № 70/01. Зарегистрировано в Департаменте юстиции области Ұлытау 29 декабря 2023 года № 86-20
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности области Ұлытау
  kaz: Ұлытау облысының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы

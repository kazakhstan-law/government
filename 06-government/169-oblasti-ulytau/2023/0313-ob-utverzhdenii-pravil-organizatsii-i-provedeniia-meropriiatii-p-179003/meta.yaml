requisite: Постановление акимата города Каражал области Ұлытау от 13 марта 2023 года № 17. Зарегистрировано Департаментом юстиции области Ұлытау 14 марта 2023 года № 10-20
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Каражал
  kaz: Қаражал қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

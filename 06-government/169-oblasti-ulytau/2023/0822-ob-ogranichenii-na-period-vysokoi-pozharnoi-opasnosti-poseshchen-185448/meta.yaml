requisite: Постановление акимата области Ұлытау от 22 августа 2023 года № 46/01. Зарегистрировано в Департаменте юстиции области Ұлытау 28 августа 2023 года № 43-20
title:
  rus: Об ограничении на период высокой пожарной опасности посещения физическими лицами лесов и въезда в них транспортных средств, а также проведения определенных видов работ на территории государственного лесного фонда области Ұлытау
  kaz: Ұлытау облысы мемлекеттік орман қоры аумағында өрт қаупі жоғары кезеңде жеке тұлғалардың орманда болуына және оған көлік құралдарымен кіруіне, сондай-ақ жұмыстың белгілі бір түрлерін жүргізуге шектеу қою туралы

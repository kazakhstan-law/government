title:
  rus: Об установлении охранной зоны республиканского государственного учреждения «Государственный национальный природный парк «Ұлытау» Комитета лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан» на территории области Ұлытау
  kaz: Ұлытау облысының аумағындағы «Қазақстан Республикасы Экология және табиғи ресурстар министрлігі Орман шаруашылығы және жануарлар дүниесі комитетінің «Ұлытау» мемлекеттік ұлттық табиғи паркі» республикалық мемлекеттік мекемесінің күзет аймағын белгілеу туралы

act_code: '189837'
requisite: Постановление акимата области Ұлытау от 6 декабря 2023 года № 64/01. Зарегистрировано в Департаменте юстиции области Ұлытау 12 декабря 2023 года № 76-20. Утратило силу постановлением акимата области Ұлытау от 10 октября 2025 года № 81/01 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны, полосы участка реки Кокпекты в пределах границ месторождения «Кужал» по добыче твердых полезных ископаемых в Жанааркинском районе области Ұлытау и режима их хозяйственного использования
  kaz: Ұлытау облысы Жаңаарқа ауданында қатты пайдалы қазбалар өндіру бойынша «Қужал» кен орнының шекарасындағы Көкпекті өзені учаскесінің су қорғау аймағын, белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата области Ұлытау от 6 декабря 2023 года № 64/01 «Об установлении водоохранной зоны, полосы участка реки Кокпекты в пределах границ месторождения «Кужал» по добыче твердых полезных ископаемых в Жанааркинском районе области Ұлытау и режима их хозяйственного использования»
    kaz: Ұлытау облысы әкімдігінің 2023 жылғы 6 желтоқсандағы № 64/01 «Ұлытау облысы Жаңаарқа ауданында қатты пайдалы қазбалар өндіру бойынша «Қужал» кен орнының шекарасындағы Көкпекті өзені учаскесінің су қорғау аймағын, белдеуін және оларды шаруашылықта пайдалану режимін белгілеу туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/208989/rus

  title:
    rus: О внесении изменения в постановление акимата Алматинской области от  2 мая 2024 года № 165 «Об утверждении перечня и норм субсидий на удобрения, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2024 год»
    kaz: Алматы облысы әкімдігінің 2024 жылғы 2 мамырдағы «2024 жылға тыңайтқыштарға арналған субсидиялар тізбесі мен нормаларын, сондай-ақ тыңайтқыштарды (органикалықтарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» № 165 қаулысына өзгеріс енгізу туралы

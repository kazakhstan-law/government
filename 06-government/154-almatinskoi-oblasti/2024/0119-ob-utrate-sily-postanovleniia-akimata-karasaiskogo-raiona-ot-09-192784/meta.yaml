act_code: '192784'
requisite: Постановление акимата Карасайского района Алматинской области от 19 января 2024 года № 24. Зарегистрировано Департаментом юстиции Алматинской области 19 января 2024 года № 6075-05
title:
  rus: Об утрате силы постановления акимата Карасайского района от 09 января 2017 года № 4 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования»
  kaz: Қарасай ауданы әкімдігінің «Пробация қызметiнiң есебiнде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айрылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» 2017 жылғы 09 қаңтардағы № 4 қаулысының күшін жою туралы

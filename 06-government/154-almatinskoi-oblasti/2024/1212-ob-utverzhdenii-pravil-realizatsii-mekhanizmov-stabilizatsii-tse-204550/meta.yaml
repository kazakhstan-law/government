    rus: О внесении изменений и дополнений в постановление акимата Алматинской области от 12 декабря 2024 года № 370 «Об утверждении Правил реализации механизмов стабилизации цен на социально значимые продовольственные товары в Алматинской области»
    kaz: Алматы облысы әкімдігінің 2024 жылғы 12 желтоқсандағы «Алматы облысында әлеуметтік маңызы бар азық-түлік тауарларына бағаны тұрақтандыру тетіктерін іске асыру қағидаларын бекіту туралы» № 370 қаулысына өзгерістер мен толықтырулар енгізу туралы

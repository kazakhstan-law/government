act_code: '121103'
requisite: Постановление акимата Алматинской области от 29 марта 2018 года № 125. Зарегистрировано Департаментом юстиции Алматинской области 12 апреля 2018 года № 4637. Утратило силу постановлением акимата Алматинской области от 3 апреля 2020 года № 138
title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на право занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении»
  kaz: «Жолаушыларды облысаралық қалааралық, ауданаралық (облысішiлiк қалааралық) және халықаралық қатынаста автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау қызметiмен айналысу үшін лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

requisite: Постановление акимата Уйгурского района Алматинской области от 26 февраля 2018 года № 79. Зарегистрировано Департаментом юстиции Алматинской области 16 марта 2018 года № 4570. Утратило силу постановлением акимата Уйгурского района Алматинской области от 27 августа 2026 года № 222 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

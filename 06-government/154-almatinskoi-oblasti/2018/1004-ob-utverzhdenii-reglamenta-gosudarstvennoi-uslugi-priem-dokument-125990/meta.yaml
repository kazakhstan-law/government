act_code: '125990'
requisite: Постановление акимата Алматинской области от 4 октября 2018 года № 459. Зарегистрировано Департаментом юстиции Алматинской области 19 ноября 2018 года № 4859. Утратило силу постановлением акимата Алматинской области от 31 января 2020 года № 35
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін аттестаттаудан өткізуге құжаттар қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

requisite: Алматы облысы Алакөл ауданы әкімдігінің 2009 жылғы 25 маусымдағы № 6-183 қаулысы. Алматы облысы Әділет департаменті Алакөл ауданының әділет басқармасында 2009 жылы 16 шілдеде № 2-5-72 тіркелді.Күші жойылды - Алматы облысы Алакөл ауданы әкімдігінің 2010 жылғы 11 қаңтардағы № 1-3 қаулысымен

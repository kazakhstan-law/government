requisite: Алматы облысы Панфилов ауданы әкімдігінің 2009 жылғы 23 шілдедегі № 394 қаулысы. Алматы облысының Әділет департаменті Панфилов ауданының Әділет басқармасында 2009 жылы 27 тамызда № 2-16-93 тіркелді. Күші жойылды - Алматы облысы Панфилов ауданы әкімдігінің 2011 жылғы 28 қарашадағы № 799 қаулысымен

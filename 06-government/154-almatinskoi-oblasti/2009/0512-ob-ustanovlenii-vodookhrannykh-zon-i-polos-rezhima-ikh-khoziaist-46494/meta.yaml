act_code: '46494'
requisite: Постановлением Алматинского областного акимата от 12 мая 2009 года № 93. Зарегистрировано Департаментом юстиции Алматинской области 12 июня 2009 года № 2032. Утратило силу постановлением акимата Алматинской области от 16 февраля 2026 года № 17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон и полос, режима их хозяйственного использования в пределах административных границ Алматинской области на озерах Балхаш, Алаколь, Капчагайском водохранилище, реки Или, реки Каратал на участках строительства гидроэлектростанции - 2, гидроэлектростанции - 3, гидроэлектростанции - 4
  kaz: Алматы облысының әкімшілік шекарасындағы Балқаш, Алакөл көлінің, Қапшағай су қоймасының, Іле өзенінің, 2 - су электр станциясының, 3 - су электр станциясының, 4 - су электр станциясының құрылысын Қаратал өзенінің учаскелерінде су қорғау аймақтары мен белдеулерін белгілеу және оларды шаруашылыққа пайдалану режимі туралы

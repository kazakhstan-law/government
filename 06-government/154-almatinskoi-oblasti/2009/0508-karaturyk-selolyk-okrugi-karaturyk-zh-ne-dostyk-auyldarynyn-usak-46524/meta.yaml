requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 8 мамырдағы № 370 қаулысы. Алматы облсының Әділет департаменті Еңбекшіқазақ ауданының әділет басқармасында 2009 жылы 12 маусымда № 2-8-113 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 28 қазандағы № 1089 қаулысымен
title:

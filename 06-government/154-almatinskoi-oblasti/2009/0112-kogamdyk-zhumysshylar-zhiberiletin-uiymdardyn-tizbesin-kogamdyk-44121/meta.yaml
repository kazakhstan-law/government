act_code: '44121'
requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 12 қаңтардағы № 01 қаулысы. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының әділет басқармасында 2009 жылы 5 ақпанда № 2-8-105 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2010 жылғы 05 қаңтардағы № 01 қаулысымен
title:
  rus: Қоғамдық жұмысшылар жіберілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлері, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

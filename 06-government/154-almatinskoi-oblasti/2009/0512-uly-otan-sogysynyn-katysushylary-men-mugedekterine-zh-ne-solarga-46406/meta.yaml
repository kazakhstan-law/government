requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2009 жылғы 12 мамырдағы № 12-286 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының Әділет басқармасында 2009 жылы 11 маусымда № 2-1-100 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2009 жылғы 10 желтоқсандағы № 30-957 қаулысымен

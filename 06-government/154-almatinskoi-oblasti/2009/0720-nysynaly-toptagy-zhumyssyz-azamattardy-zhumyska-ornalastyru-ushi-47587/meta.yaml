requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2009 жылғы 20 шілдедегі № 16-473 қаулысы. Алматы облысының әділет департаменті Талдықорған қаласының әділет басқармасында 2009 жылы 28 тамызда № 2-1-103 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2011 жылғы 19 қыркүйектегі № 22-999 қаулысымен

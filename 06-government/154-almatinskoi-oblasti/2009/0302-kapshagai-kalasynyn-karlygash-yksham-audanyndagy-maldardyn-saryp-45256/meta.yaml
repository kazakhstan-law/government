requisite: Алматы облысы Қапшағай қаласы әкімдігінің 2009 жылғы 2 наурыздағы N 37 қаулысы. Алматы облысының Әділет департаменті Қапшағай қаласының Әділет басқармасында 2009 жылдың 10 сәуірінде N 2-2-79 тіркелді. Күші жойылды - Алматы облысы Қапшағай қаласы әкімдігінің 2014 жылғы 15 сәуірдегі N 256 қаулысымен

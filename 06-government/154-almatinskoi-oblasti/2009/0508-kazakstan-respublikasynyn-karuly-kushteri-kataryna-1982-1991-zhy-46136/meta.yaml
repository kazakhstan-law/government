requisite: Алматы облысы Райымбек ауданы әкімдігінің 2009 жылғы 8 мамырдағы № 142 қаулысы. Алматы облысы Әділет департаменті Райымбек ауданының Әділет басқармасында 2009 жылы 27 мамырда № 2-15-70 тіркелді. Күші жойылды - Райымбек ауданы әкімдігінің 2010 жылғы 26 сәуірдегі № 158 қаулысымен
title:

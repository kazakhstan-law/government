requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 22 маусымдағы № 508 қаулысы. Алматы облысы Әділет департаменті Еңбекшіқазақ ауданының әділет басқармасында 2009 жылы 21 шілдеде № 2-8-119 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 24 тамыздағы № 867 қаулысымен
title:

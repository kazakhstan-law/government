requisite: Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 8 сәуірдегі № 76 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының әділет басқармасында 2009 жылы 13 мамырда № 2-12-106 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 01 сәуірдегі № 46 қаулысымен

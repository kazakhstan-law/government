requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 4 мамырдағы № 352 қаулысы. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының әділет басқармасында 2009 жылы 9 маусымда № 2-8-112 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2010 жылғы 20 сәуірдегі № 315 қаулысымен

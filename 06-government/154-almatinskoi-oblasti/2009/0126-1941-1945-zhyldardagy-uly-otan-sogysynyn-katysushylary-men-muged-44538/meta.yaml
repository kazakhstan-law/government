requisite: Алматы облысы Жамбыл ауданы әкімдігінің 2009 жылғы 26 қаңтардағы № 35 қаулысы. Алматы облысының Әділет департаменті Жамбыл ауданының Әділет басқармасында 2009 жылдың 23 ақпанында № 2-7-69 тіркелді. Күші жойылды - Алматы облысы Жамбыл ауданы әкімдігінің 2010 жылғы 22 ақпандағы № 84 қаулысымен

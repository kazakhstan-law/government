requisite: Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 29 шілдедегі № 179 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2009 жылы 21 тамызда № 2-12-115 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 09 қарашадағы № 348 қаулысымен

requisite: Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 21 мамырдағы № 114 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының әділет басқармасында 2009 жылы 10 маусымда № 2-12-113 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 22 қазандағы № 338 қаулысымен

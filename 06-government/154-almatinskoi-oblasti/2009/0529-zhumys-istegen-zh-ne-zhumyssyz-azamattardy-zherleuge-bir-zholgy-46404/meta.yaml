requisite: Алматы облысы Қапшағай қаласы әкімдігінің 2009 жылғы 29 мамырдағы № 468 қаулысы. Алматы облысының Қапшағай қаласының әділет басқармасында 2009 жылғы 10 маусымда № 2-2-85 тіркелді. Күші жойылды - Алматы облысы Қапшағай қаласы әкімдігінің 2014 жылғы 15 сәуірдегі № 256 қаулысымен

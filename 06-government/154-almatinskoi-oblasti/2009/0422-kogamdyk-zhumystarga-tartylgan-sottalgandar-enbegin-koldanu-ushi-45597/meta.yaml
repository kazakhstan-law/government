requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2009 жылғы 22 сәуірде N 9-248 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының Әділет басқармасында 2009 жылы 5 мамырда N 2-1-98 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2013 жылғы 26 маусымдағы N 12-640 қаулысымен

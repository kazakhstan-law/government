requisite: Алматы облысы Ақсу ауданы әкімдігінің 2009 жылғы 5 қаңтардағы № 1 қаулысы. Алматы облысы Әділет департаменті Ақсу ауданының әділет басқармасында 2009 жылы 2 ақпанда № 2-4-84 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімдігінің 2010 жылғы 31 желтоқсандағы № 558 қаулысымен
title:
  rus: Қоғамдық жұмысшылар жіберілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлері, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

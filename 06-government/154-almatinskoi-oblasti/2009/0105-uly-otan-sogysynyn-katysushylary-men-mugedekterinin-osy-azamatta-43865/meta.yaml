act_code: '43865'
requisite: Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 5 қаңтардағы № 3 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының әділет басқармасында 2009 жылғы 29 қаңтарда № 2-12-100 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 14 қаңтардағы № 2 қаулысымен
title:

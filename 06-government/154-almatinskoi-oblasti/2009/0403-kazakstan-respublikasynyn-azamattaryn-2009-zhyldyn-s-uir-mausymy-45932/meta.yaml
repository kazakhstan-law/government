requisite: Алматы облысы Қарасай ауданы әкімдігінің 2009 жылғы 3 сәуірдегі № 4-319 қаулысы. Алматы облысының Әділет департаменті Қарасай ауданының Әділет басқармасында 2009 жылдың 13 мамырында № 2-11-70 тіркелді. Күші жойылды - Қарасай ауданы әкімдігінің 2010 жылғы 19 сәуірдегі № 4-268 шешімімен

requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 22 маусымдағы № 509 қаулысы. Алматы облысы Әділет департаменті Еңбекшіқазақ ауданының әділет басқармасында 2009 жылы 21 шілдеде № 2-8-116 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 28 қазандағы № 1089 қаулысымен
title:
  rus: Қаражота селолық округі Қаражота, Сарыбұлақ, Ақтоған ауылдарындағы және Нұра селолық округі Нұра ауылындағы ұсақ малдарына жануарлар мен адамға ортақ жұқпалы аурулардың (бруцеллез) профилактикасы және олармен күресу бойынша шектеу іс-шараларын енгізе отырып ветеринариялық режимін белгілеу туралы

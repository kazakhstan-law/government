requisite: Алматы облысы Балқаш ауданы әкімдігінің 2009 жылғы 18 мамырдағы № 72 қаулысы. Алматы облысының Әділет департаменті Балқаш ауданының Әділет басқармасында 2009 жылы 18 маусымда № 2-6-58 тіркелді. Күші жойылды - Алматы облысы Балқаш ауданы әкімдігінің 2011 жылғы 31 наурыздағы № 34 қаулысымен

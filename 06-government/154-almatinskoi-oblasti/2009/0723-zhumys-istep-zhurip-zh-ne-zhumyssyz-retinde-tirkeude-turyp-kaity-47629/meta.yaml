requisite: Алматы облысы Панфилов ауданы әкімдігінің 2009 жылғы 23 шілдедегі № 397 қаулысы. Алматы облысының әділет департаменті Панфилов ауданының әділет басқармасында 2009 жылы 27 тамызда № 2-16-96 тіркелді. Күші жойылды - Алматы облысы Панфилов ауданы әкімдігінің 2010 жылғы 29 наурыздағы № 126 қаулысымен

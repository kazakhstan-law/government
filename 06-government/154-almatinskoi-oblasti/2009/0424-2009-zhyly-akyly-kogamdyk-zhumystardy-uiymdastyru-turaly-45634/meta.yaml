requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2009 жылғы 24 сәуірдегі N 10-258 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының әділет басқармасында 2009 жылы 6 мамырда N 2-1-99 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2010 жылғы 15 ақпандағы N 3-51 қаулысы

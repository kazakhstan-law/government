act_code: '46140'
requisite: Алматы облысы Іле ауданы әкімдігінің 2009 жылғы 22 сәуірдегі № 4-673 қаулысы. Алматы облысы Іле ауданының Әділет басқармасында 2009 жылғы 21 мамырда № 2-10-92 тіркелді. Күші жойылды - Алматы облысы Іле ауданы әкімдігінің 2009 жылғы 29 желтоқсандағы № 12-2174 қаулысымен
title:
  rus: Іле ауданы бойынша 2009 жылы қоғамдық жұмыс істейтін мекемелердің тізбесі, істелетін қоғамдық жұмыстардың түрлері, көлемі мен нақты жағдайлары, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы
  kaz: Іле ауданы бойынша 2009 жылы қоғамдық жұмыс істейтін мекемелердің тізбесі, істелетін қоғамдық жұмыстардың түрлері, көлемі мен нақты жағдайлары, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы

requisite: Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 18 мамырдағы № 113 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының әділет басқармасында 2009 жылы 10 маусымда № 2-12-112 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 23 қыркүйектегі № 281 қаулысымен

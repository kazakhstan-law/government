requisite: Алматы облысы Қапшағай қаласы әкімдігінің 2009 жылғы 6 сәуірдегі N 229 қаулысы. Алматы облысының Әділет департаменті Қапшағай қаласының Әділет басқармасында 2009 жылдың 24 сәуірінде N 2-2-80 тіркелді. Күші жойылды - Алматы облысы Қапшағай қаласы әкімдігінің 2009 жылғы 15 қыркүйектегі N 957 қаулысымен

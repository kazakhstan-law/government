act_code: '50257'
requisite: Алматы облысы Іле ауданы әкімдігінің 2009 жылғы 29 желтоқсандағы № 12-2174 қаулысы. Алматы облысы Іле ауданының Әділет басқармасында 2010 жылғы 21 қаңтарда № 2-10-106 тіркелді. Күші жойылды - Алматы облысы Іле ауданы әкімдігінің 2010 жылғы 24 желтоқсандағы № 11-1942 қаулысымен
title:
  rus: '"Iле ауданы бойынша 2010 жылы қоғамдық жұмыс iстейтiн мекемелердiң тiзбесi, iстелетiн қоғамдық жұмыстардың түрлерi, көлемi мен нақты жағдайлары, қатысушылардың еңбегiне төленетiн ақының мөлшерi және оларды қаржыландыру көздерiн бекiту туралы"'
  kaz: '"Iле ауданы бойынша 2010 жылы қоғамдық жұмыс iстейтiн мекемелердiң тiзбесi, iстелетiн қоғамдық жұмыстардың түрлерi, көлемi мен нақты жағдайлары, қатысушылардың еңбегiне төленетiн ақының мөлшерi және оларды қаржыландыру көздерiн бекiту туралы"'

requisite: Алматы облысы Панфилов ауданы әкімдігінің 2009 жылғы 23 сәуірдегі № 220 қаулысы. Алматы облысы Әділет департаменті Панфилов ауданының әділет басқармасында 2009 жылы 25 мамырда № 2-16-85 тіркелді. Күші жойылды - Алматы облысы Панфилов ауданы әкімдігінің 2010 жылғы 29 қаңтардағы № 11 қаулысымен

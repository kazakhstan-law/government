requisite: Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 24 маусымдағы № 141 қаулысы. Алматы облысы Әділет департаменті Қаратал ауданының әділет басқармасында 2009 жылы 24 шілдеде № 2-12-114 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 22 қазандағы № 339 қаулысымен

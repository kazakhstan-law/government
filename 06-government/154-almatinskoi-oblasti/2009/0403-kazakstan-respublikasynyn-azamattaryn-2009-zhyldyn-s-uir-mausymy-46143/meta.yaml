requisite: Алматы облысы Кербұлақ ауданы әкімдігінің 2009 жылғы 3 сәуірдегі N 72 қаулысы. Алматы облысы Әділет департаменті Кербұлақ ауданының әділет басқармасында 2009 жылы 16 мамырда N 2-13-94 тіркелді. Күші жойылды - Алматы облысы Кербұлақ ауданы әкімдігінің 2010 жылғы 01 сәуірдегі N 60 қаулысымен

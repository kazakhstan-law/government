requisite: Алматы облысы Балқаш ауданы әкімдігінің 2009 жылғы 18 мамырдағы № 70 қаулысы. Алматы облысының Әділет департаменті Балқаш ауданының әділет басқармасында 2009 жылы 18 маусымда № 2-6-59 тіркелді. Күші жойылды - Алматы облысы Балқаш ауданы әкімдігінің 2010 жылғы 07 сәуірдегі № 41 қаулысымен

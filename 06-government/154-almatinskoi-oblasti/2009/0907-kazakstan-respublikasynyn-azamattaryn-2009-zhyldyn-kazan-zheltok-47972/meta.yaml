requisite: Алматы облысы Ақсу ауданы әкімдігінің 2009 жылғы 7 қыркүйектегі № 255 қаулысы. Алматы облысының әділет департаменті Ақсу ауданының әділет басқармасында 2009 жылы 28 қыркүйекте № 2-4-92 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімдігінің 2010 жылғы 31 наурыздағы № 121 қаулысымен

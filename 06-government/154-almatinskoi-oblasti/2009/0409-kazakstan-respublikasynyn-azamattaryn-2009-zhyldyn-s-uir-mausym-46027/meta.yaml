requisite: Алматы облысы Ұйғыр ауданы әкімдігінің 2009 жылғы 9 сәуірдегі № 9-128 қаулысы. Алматы облысының Әділет департаменті Ұйғыр ауданының Әділет басқармасында 2009 жылы 14 мамырда № 2-19-77 тіркелді. Күші жойылды - Алматы облысы Ұйғыр ауданы әкімдігінің 2010 жылғы 25 қаңтардағы № 02-50 қаулысымен

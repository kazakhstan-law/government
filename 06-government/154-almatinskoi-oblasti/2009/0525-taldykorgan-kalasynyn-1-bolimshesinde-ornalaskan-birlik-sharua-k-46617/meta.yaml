act_code: '46617'
requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2009 жылғы 25 мамырдағы № 13-326 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының әділет басқармасында 2009 жылы 19 маусымда № 2-1-101 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2009 жылғы 12 тамыздағы № 18-539 қаулысымен
title:

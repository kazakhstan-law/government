requisite: Алматы облысы Қапшағай қаласы әкімдігінің 2009 жылғы 15 қыркүйектегі № 957 қаулысы. Алматы облысы Қапшағай қаласының Әділет басқармасында 2009 жылдың 7 қазанында № 2-2-90 тіркелді. Күші жойылды - Қапшағай қаласы әкімдігінің 2010 жылғы 16 сәуірдегі № 373 қаулысымен

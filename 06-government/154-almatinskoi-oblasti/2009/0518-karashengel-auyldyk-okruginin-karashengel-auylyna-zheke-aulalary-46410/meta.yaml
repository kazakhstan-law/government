requisite: Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 18 мамырдағы № 111 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының әділет басқармасында 2009 жылы 10 маусымда № 2-12-110 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 23 қыркүйектегі № 282 қаулысымен

act_code: '44699'
requisite: Алматы облысы Ұйғыр ауданы әкімдігінің 2009 жылғы 2 ақпандағы N 3-14 қаулысы. Алматы облысының Әділет департаменті Ұйғыр ауданының Әділет басқармасында 2009 жылы 5 наурызда N 2-19-71 тіркелді. Күші жойылды - Алматы облысы Ұйғыр ауданы әкімдігінің 2010 жылғы 4 наурыздағы N 06-76 қаулысымен

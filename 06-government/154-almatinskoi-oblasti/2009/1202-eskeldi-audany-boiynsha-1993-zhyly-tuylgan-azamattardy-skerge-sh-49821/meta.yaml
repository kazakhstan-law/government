act_code: '49821'
requisite: Алматы облысы Ескелді ауданы әкімдігінің 2009 жылғы 2 желтоқсандағы № 15 қаулысы. Алматы облысының Әділет департаменті Ескелді ауданының әділет басқармасында 2010 жылы 6 қаңтарда № 2-9-93 тіркелді. Күші жойылды - Алматы облысы Ескелді ауданы әкімінің 2010 жылғы 31 желтоқсандағы № 24 шешімімен

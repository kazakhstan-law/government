requisite: Алматы облысы Ескелді ауданы әкімдігінің 2009 жылғы 4 маусымдағы № 112 қаулысы. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2009 жылы 22 маусымда № 2-9-85 тіркелді. Күші жойылды - Алматы облысы Ескелді ауданы әкімдігінің 2009 жылғы 18 қарашадағы № 210 қаулысымен

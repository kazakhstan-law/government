requisite: Алматы облысы Сарқан ауданы әкімдігінің 2009 жылғы 13 сәуірдегі N 108 қаулысы. Алматы облысының әділет департаменті Сарқан ауданының әділет басқармасында 2009 жылы 27 сәуірде N 2-17-73 тіркелді. Күші жойылды - Алматы облысы Сарқан ауданы әкімдігінің 2010 жылғы 18 қаңтардағы N 2 қаулысымен

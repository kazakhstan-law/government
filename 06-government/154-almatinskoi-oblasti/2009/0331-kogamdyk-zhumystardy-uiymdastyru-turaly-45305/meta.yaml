requisite: Алматы облысы Райымбек аудандық әкімиятының 2009 жылғы 31 наурыздағы № 75 қаулысы. Алматы облысының әділет департаменті Райымбек ауданының әділет басқармасында 2009 жылы 16 сәуірде № 2-15-67 тіркелді. Күші жойылды - Алматы облысы Райымбек ауданы әкімдігінің 2010 жылғы 19 ақпандағы № 22 қаулысымен

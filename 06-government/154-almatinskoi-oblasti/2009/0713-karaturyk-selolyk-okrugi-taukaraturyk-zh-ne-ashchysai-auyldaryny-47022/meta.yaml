requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 13 шілдедегі № 537 қаулысы. Алматы облысы Әділет департаменті Еңбекшіқазақ ауданының әділет басқармасында 2009 жылы 21 шілдеде № 2-8-121 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 28 қазандағы № 1089 қаулысымен

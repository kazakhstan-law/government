act_code: '17997'
requisite: Алматы облысы Ұйғыр ауданы әкімиятының 2003 жылғы 5 желтоқсандағы N 20-137 қаулысы. Алматы облыстық әділет басқармасында 2003 жылы 22 желтоқсанда N 1423 тіркелді. Күші жойылды - Алматы облысы Ұйғыр ауданы әкімдігінің 2007 жылғы 01 ақпандағы N 3-69 қаулысымен

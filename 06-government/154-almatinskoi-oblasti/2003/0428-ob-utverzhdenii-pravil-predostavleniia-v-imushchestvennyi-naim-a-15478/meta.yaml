title:
  rus: Об утверждении Правил предоставления в имущественный найм (аренду) как с правом выкупа так и без права выкупа объектов, находящихся на балансе государственных предприятий и учреждений области (коммунальная собственность Акимата Алматинской области)
  kaz: Облыстың мемлекеттік кәсіпорындарының және мекемелерінің балансында тұрған объектілерді (Алматы облысы Әкімінің коммуналдық меншігі) кейіннен сатып алу құқығымен және сатып алу құқығынсыз мүліктік жалға (арендаға) беру Ережелерін бекіту туралы

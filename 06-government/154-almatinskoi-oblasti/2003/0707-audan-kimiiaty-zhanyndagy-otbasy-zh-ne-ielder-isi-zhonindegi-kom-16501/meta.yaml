requisite: Алматы облысы Көксу ауданы әкімиятының 2003 жылғы 8 шілдедегі N 8-35 қаулысы. Алматы облыстық Әділет басқармасында 2003 жылы 28 шілдеде N 1260 тіркелді. Күші жойылды - Алматы облысы Көксу ауданы әкімдігінің 2011 жылғы 12 қаңтардағы N 07 қаулысымен

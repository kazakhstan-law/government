requisite: Алматы облысы Сарқан аудандық әкімиятының 2003 жылғы 16 қыркүйектегі N 114 қаулысы. Алматы облыстық Әділет басқармасында 2003 жылы 25 қыркүйекте N 1335 тіркелді. Күші жойылды - Алматы облысы Сарқан аудандық әкімдігінің 2011 жылғы 13 желтоқсандағы N 462 қаулысымен

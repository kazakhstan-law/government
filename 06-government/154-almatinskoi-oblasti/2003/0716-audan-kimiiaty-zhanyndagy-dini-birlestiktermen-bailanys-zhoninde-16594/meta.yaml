requisite: Алматы облысы Көксу ауданы әкімиятының 2003 жылғы 17 шілдедегі N 8-39 қаулысы. Алматы облыстық Әділет басқармасында 2003 жылы 22 шілдеде N 1257 тіркелді. Күші жойылды - Алматы облысы Көксу ауданы әкімдігінің 2011 жылғы 12 қаңтардағы N 07 қаулысымен

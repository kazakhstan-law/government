requisite: Алматы облысы Райымбек ауданы әкімиятының 2003 жылғы 28 мамырдағы N 25 қаулысы. Алматы облыстық Әділет басқармасында 2003 жылы 9 шілдеде N 1248 тіркелді. Күші жойылды - Алматы облысы Райымбек ауданы әкімдігінің 2011 жылғы 10 мамырдағы N 148 қаулысымен

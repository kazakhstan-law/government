requisite: Алматы облысы Ұйғыр ауданы әкімиятының 2003 жылғы 05 желтоқсандағы N 20-139 қаулысы. Алматы облыстық Әділет басқармасында 2003 жылы 22 желтоқсанда N 1424 тіркелді. Күші жойылды - Алматы облысы Ұйғыр ауданы әкімдігінің 2007 жылғы 01 ақпандағы N 3-67 қаулысымен

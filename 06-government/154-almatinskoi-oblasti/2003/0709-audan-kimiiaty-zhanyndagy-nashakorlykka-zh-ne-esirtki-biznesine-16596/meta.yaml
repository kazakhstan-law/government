requisite: Алматы облысы Көксу ауданы әкімиятының 2003 жылғы 10 шілдедегі N 8-36 қаулысы. Алматы облыстық Әділет басқармасында 2003 жылы 28 шілдеде N 1262 тіркелді. Күші жойылды - Алматы облысы Көксу ауданы әкімдігінің 2011 жылғы 12 қаңтардағы N 07 қаулысымен

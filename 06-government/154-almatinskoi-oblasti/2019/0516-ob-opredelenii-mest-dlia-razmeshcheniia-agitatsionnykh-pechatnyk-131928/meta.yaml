  title:
    rus: О внесении изменений в постановление акимата Панфиловского района от 16 мая 2019 года № 241 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями в Панфиловском районе»
    kaz: Панфилов ауданы әкімдігінің 2019 жылғы 16 мамырдағы «Панфилов ауданында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жайлар беру туралы» № 241 қаулысына өзгерістер енгізу туралы

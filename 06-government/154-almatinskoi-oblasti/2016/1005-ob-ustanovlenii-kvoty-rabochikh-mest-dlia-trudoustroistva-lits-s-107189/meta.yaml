act_code: '107189'
requisite: Постановление акимата города Талдыкорган Алматинской области от 05 октября 2016 года № 43-688. Зарегистрировано Департаментом юстиции Алматинской области 1 ноября 2016 года № 3990. Утратило силу постановлением акимата города Талдыкорган области Жетісу от 23 февраля 2024 года № 109
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по городу Талдыкорган
  kaz: Талдықорған қаласы бойынша пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

act_code: '108333'
requisite: Постановление акимата Коксуского района Алматинской области от 25 ноября 2016 года № 367. Зарегистрировано Департаментом юстиции Алматинской области 12 декабря 2016 года № 4029. Утратило силу постановлением акимата Коксуского района области Жетісу от 20 февраля 2024 года № 71
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и для граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметiнiң есебiнде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-аналарының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды жұмысқа орналастыру үшін квота белгілеу туралы

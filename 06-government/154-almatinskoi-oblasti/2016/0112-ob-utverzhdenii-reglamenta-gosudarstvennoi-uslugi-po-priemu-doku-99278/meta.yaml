title:
  rus: Об утверждении регламента государственной услуги по приему документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам
  kaz: Педагог қызметкерлер мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттар қабылдау бойынша мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

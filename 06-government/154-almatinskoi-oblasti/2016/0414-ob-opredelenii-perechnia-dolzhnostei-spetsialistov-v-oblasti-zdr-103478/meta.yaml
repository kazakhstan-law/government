title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

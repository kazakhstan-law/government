  title:
    rus: О внесении изменений и дополнения в постановление акимата Алматинской области от 14 апреля 2016 года № 192 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими работающих в сельской местности»
    kaz: Алматы облысы әкімдігінің 2016 жылғы 14 сәуірдегі «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» № 192 қаулысына өзгерістер мен толықтыру енгізу туралы

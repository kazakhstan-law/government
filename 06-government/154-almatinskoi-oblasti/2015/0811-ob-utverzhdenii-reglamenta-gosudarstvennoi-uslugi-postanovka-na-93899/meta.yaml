  requisite: Постановление акимата Алматинской области от 29 ноября 2019 года № 540. Зарегистрировано Департаментом юстиции Алматинской области 3 декабря 2019 года № 5311. Утратило силу постановлением акимата Алматинской области от 28 июля 2020 года № 283
  title:
    rus: О внесении изменения в постановление акимата Алматинской области от 11 августа 2015 года № 354 «Об утверждении регламента государственной услуги «Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде»
    kaz: Алматы облысы әкімдігінің «Алматы облысының әкімдігінің 2015 жылғы 11 тамыздағы «Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 354 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/136782/rus

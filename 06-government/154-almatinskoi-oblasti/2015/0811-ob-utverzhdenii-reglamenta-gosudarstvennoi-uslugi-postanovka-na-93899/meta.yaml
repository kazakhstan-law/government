  title:
    rus: О внесении изменений в постановление акимата Алматинской области от 11 сентября 2015 года № 354 "Об утверждении регламента государственной услуги "Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
    kaz: Алматы облысы әкімдігінің 2015 жылғы 11 тамыздағы "Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" № 354 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Алматинской области от 01 сентября 2015 года № 402. Зарегистрировано Департаментом юстиции Алматинской области 02 октября 2015 года № 3463. Утратило силу постановлением акимата Алматинской области от 28 декабря 2018 года № 621
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түстi және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және өткізу бойынша қызметті жүзеге асыруына лицензия беру" мемлекеттiк көрсетілетін қызмет регламентін бекіту туралы'

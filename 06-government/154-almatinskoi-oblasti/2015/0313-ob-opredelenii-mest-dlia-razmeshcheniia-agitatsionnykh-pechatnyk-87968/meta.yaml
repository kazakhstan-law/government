    rus: О внесении изменений и дополнений в постановление акимата Илийского района Алматинской области от 13 марта 2015 года №3-145 «Об определении мест для размещения агитационных печатных материалов и предоставления кандидатам помещений для встреч с избирателями в Илийском районе»

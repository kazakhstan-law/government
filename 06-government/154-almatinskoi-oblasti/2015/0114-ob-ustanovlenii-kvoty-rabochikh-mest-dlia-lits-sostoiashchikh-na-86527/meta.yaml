requisite: Постановление акимата Коксуского района Алматинской области от 14 января 2015 года № 10. Зарегистрировано Департаментом юстиции Алматинской области 04 февраля 2015 года № 3019. Утратило силу постановлением акимата Коксуского района области Жетісу от 20 февраля 2024 года № 71
title:
  rus: Об установлении квоты рабочих мест  для лиц, состоящих на учете службы  пробации уголовно-исполнительной  инспекции, а также лиц, освобожденных  из мест лишения свободы и для  несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы  пробация қызметiнiң есебiнде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар  және интернаттық ұйымдарды бітіруші кәмелетке  толмағандар үшін жұмыс орындарына  квота белгілеу туралы

act_code: '109345'
requisite: Постановление акимата Карасайского района Алматинской области от 9 января 2017 года № 4. Зарегистрировано Департаментом юстиции Алматинской области 20 января 2017 года № 4071. Утратило силу постановлением акимата Карасайского района Алматинской области от 19 января 2024 года № 24
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметiнiң есебiнде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

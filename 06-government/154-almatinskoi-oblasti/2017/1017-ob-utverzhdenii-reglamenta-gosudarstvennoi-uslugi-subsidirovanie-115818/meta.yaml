  title:
    rus: О внесении изменения в постановление акимата Алматинской области от 17 октября 2017 года № 435 «Об утверждении регламента государственной услуги «Субсидирование затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства продуктов ее глубокой переработки»
    kaz: Алматы облысы әкімдігінің 2017 жылғы 17 қазандағы «Қайта өңдеуші кәсіпорындардың ауыл шаруашылығы өнімін тереңдете қайта өңдеп өнім өндіру үшін оны сатып алуға арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 435 қаулысына өзгеріс енгізу туралы

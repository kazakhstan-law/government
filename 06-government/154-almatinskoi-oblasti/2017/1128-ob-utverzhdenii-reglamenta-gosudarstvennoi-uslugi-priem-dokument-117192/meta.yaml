    kaz: Алматы облысы әкімдігінің 2017 жылғы 28 қарашадағы «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 533 қаулысына өзгеріс енгізу туралы

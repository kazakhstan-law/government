title:
  rus: Об утверждении регламента государственной услуги «Субсидирование ставок вознаграждения при кредитовании, а также лизинге на приобретение сельскохозяйственных животных, техники и технологического оборудования»
  kaz: «Ауыл шаруашылығы малын, техниканы және технологиялық жабдықты сатып алуға кредит беру, сондай-ақ лизинг кезінде сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

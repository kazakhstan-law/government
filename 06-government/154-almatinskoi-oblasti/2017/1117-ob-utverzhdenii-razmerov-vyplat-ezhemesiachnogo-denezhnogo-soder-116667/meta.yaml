  code: '121932'
  requisite: Постановление акимата Алматинской области от 10 мая 2018 года № 218. Зарегистрировано Департаментом юстиции Алматинской области 24 мая 2018 года № 4715. Утратило силу постановлением акимата Алматинской области от 18 сентября 2025 года № 289 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Алматинской области от 17 ноября 2017 года № 508 «Об утверждении размеров выплат ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и  руководителям клубных команд»
    kaz: Алматы облысы әкімдігінің 2017 жылғы 17 қарашадағы «Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы» № 508 қаулысына өзгеріс енгізу туралы

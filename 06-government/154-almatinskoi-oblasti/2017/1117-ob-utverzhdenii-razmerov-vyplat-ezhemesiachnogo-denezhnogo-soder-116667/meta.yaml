  code: '158454'
  requisite: Постановление акимата Алматинской области от 9 августа 2021 года № 308. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 сентября 2021 года № 24246. Утратило силу постановлением акимата Алматинской области от 18 сентября 2025 года № 289 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Алматинской области от 17 ноября 2017 года № 508 «Об утверждении размеров выплат ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд»
    kaz: Алматы облысы әкімдігінің 2017 жылғы 17 қарашадағы № 508  «Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы» қаулысына өзгеріс енгізу туралы

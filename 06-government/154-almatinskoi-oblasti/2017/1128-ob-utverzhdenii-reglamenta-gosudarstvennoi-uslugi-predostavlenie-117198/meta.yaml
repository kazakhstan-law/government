  title:
    rus: О внесении изменения в постановление акимата Алматинской области от 28 ноября 2017 года № 532 «Об утверждении регламента государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего и высшего образования»
    kaz: Алматы облысы әкімдігінің 2017 жылғы 28 қарашадағы «Техникалық және кәсіптік, орта білімнен кейінгі және жоғары білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 532 қаулысына өзгеріс енгізу туралы

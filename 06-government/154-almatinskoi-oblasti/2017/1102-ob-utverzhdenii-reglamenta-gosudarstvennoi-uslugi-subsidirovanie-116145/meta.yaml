  title:
    rus: О внесении изменения в постановление акимата Алматинской области от 2 ноября 2017 года № 473 «Об утверждении регламента государственной услуги субсидирование затрат ревизионных союзов сельскохозяйственных кооперативов на проведение внутреннего аудита сельскохозяйственных кооперативов»
    kaz: Алматы облысының әкімдігінің 2017 жылғы 2 қарашадағы «Ауыл шаруашылығы кооперативтерінің тексеру одақтарының ауыл шаруашылығы кооперативтерінің ішкі аудитін жүргізуге арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 473 қаулысына өзгеріс енгізу туралы

act_code: '109172'
requisite: Постановление акимата Кербулакского района Алматинской области от 10 января 2017 года № 03. Зарегистрировано Департаментом юстиции Алматинской области 20 января 2017 года № 4077. Утратило силу постановлением акимата Кербулакского района области Жетісу от 13 февраля 2024 года № 55
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметiнiң есебiнде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру  үшін жұмыс орындарына  квоталар белгілеу туралы

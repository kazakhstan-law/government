  title:
    rus: О внесении изменений в постановление акимата Алматинской области от 9 октября 2017 года № 412 «Об утверждении регламента государственной услуги «Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
    kaz: Алматы облысы әкімдігінің 2017 жылғы 9 қазандағы «Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгi-егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 412 қаулысына өзгерістер енгізу туралы

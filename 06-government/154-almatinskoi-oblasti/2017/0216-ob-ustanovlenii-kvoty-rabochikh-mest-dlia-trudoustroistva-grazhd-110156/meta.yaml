act_code: '110156'
requisite: Постановление акимата города Текели Алматинской области от 16 февраля 2017 года № 31. Зарегистрировано Департаментом юстиции Алматинской области 02 марта 2017 года № 4115. Утратило силу постановлением акимата города Текели области Жетісу от 22 февраля 2024 года № 48
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации
  kaz: Пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды, ата-анасынан  кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

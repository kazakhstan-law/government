act_code: '110870'
requisite: Постановление акимата Алакольского района Алматинской области от 27 февраля 2017 года № 46. Зарегистрировано Департаментом юстиции Алматинской области 15 марта 2017 года № 4142. Утратило силу постановлением акимата Алакольского района области Жетісу от 16 февраля 2024 года № 62
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Алматинской области от 11 октября 2017 года № 422. Зарегистрировано Департаментом юстиции Алматинской области 31 октября 2017 года № 4353. Утратило силу постановлением акимата Алматинской области от 31 января 2020 года № 35
title:
  rus: Об утверждении регламента государственной услуги "Выдача направленияч детям с ограниченными возможностями в специальные коррекционные и другие организации для получения медицинских, специальных образовательных и специальные социальных услуг"
  kaz: «Кемтар балаларға арнаулы түзеу ұйымдары мен басқа да ұйымдарға медициналық, арнаулы білім және арнаулы әлеуметтік қызметтерді алуы үшін жолдама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

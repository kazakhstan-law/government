    kaz: Алматы облысы әкімдігінің 2017 жылғы 17 қазандағы «Агроөнеркәсіптік кешен субъектілерін қаржылық сауықтыру жөніндегі бағыт шеңберінде кредиттік және лизингтік міндеттемелер бойынша пайыздық мөлшерлемені субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 434 қаулысына өзгерістер енгізу туралы

act_code: '109422'
requisite: Постановление акимата Илийского района Алматинской области от 12 января 2017 года № 12. Зарегистрировано Департаментом юстиции Алматинской области 1 февраля 2017 года № 4087. Утратило силу постановлением акимата Илийского района Алматинской области от 18 мая 2022 года № 170
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы, граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметiнiң есебiнде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды, ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған,  білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

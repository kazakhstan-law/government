title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на осуществление деятельности на производство (формуляции) пестицидов (ядохимикатов), реализацию пестицидов (ядохимикатов), применение пестицидов (ядохимикатов) аэрозольным и фумигационным способами»
  kaz: «Пестицидтерді (улы химикаттарды) өндіру (формуляциялау), пестицидтерді (улы химикаттарды) өткізу, пестицидтерді (улы химикаттарды) аэрозольдік және фумигациялық тәсілдермен қолдануға байланысты қызметті жүзеге асыруға лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

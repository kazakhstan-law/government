requisite: Алматы облысы Райымбек ауданы әкімдігінің 2011 жылғы 23 ақпандағы № 55 қаулысы. Алматы облысының Әділет департаменті Райымбек ауданының әділет басқармасында 2011 жылы 28 ақпанда № 2-15-99 тіркелді. Күші жойылды - Алматы облысы Райымбек аудандық әкімдігінің 2014 жылғы 03 ақпандағы № 55 қаулысымен

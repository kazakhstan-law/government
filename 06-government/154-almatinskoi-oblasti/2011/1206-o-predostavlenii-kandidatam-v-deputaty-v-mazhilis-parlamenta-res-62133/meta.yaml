act_code: '62133'
requisite: Постановление акимата города Талдыкорган Алматинской области от 06 декабря 2011 года № 31-1234. Зарегистрировано Управлением юстиции города Талдыкорган Департамента юстиции Алматинской области 14 декабря 2011 года № 2-1-150. Утратило силу - Постановлением акимата города Талдыкорган Алматинской области от 06 февраля 2012 года № 3-89
title:
  rus: О предоставлении кандидатам в депутаты в Мажилис Парламента Республики Казахстан, в Алматинский областной и Талдыкорганский городской маслихаты на договорной основе помещений для встреч с избирателями и об определении мест для размещения агитационных печатных материалов кандидатов в депутаты в Мажилис Парламента Республики Казахстан, в Алматинский областной и Талдыкорганский городской маслихаты
  kaz: Қазақстан Республикасы Парламентінің Мәжілісіне, Алматы облыстық және Талдықорған қалалық мәслихаттарына кандидаттарға сайлаушылармен кездесуі үшін шарттық негізде үй-жай беру және Қазақстан Республикасы Парламентінің Мәжілісіне, Алматы облыстық және Талдықорған қалалық мәслихаттарына кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орын белгілеу туралы

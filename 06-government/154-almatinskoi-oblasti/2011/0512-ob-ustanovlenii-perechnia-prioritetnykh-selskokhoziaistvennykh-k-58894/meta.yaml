act_code: '58894'
requisite: Постановление акимата Алматинской области от 12 мая 2011 года № 105. Зарегистрировано Департаментом юстиции Алматинской области 20 мая 2011 года за № 2073. Утратило силу - Постановлением акимата Алматинской области от 11 июня 2012 года № 180
title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур, нормативов субсидий на приоритетные сельскохозяйственные культуры и на закладку и выращивание многолетных насаждений плодово-ягодных культур и винограда, нормативов субсидий на удобрения и гербициды
  kaz: Басым ауыл шаруашылығы дақылдарының тізбесі, басым ауыл шаруашылығы дақылдарына және жеміс-жидек дақылдары мен жүзімнің көп жылдық екпелерін отырғызуға және өсіруге субсидия нормативтерін, тыңайтқыштар мен гербицидтер субсидиялардың нормативтерін белгілеу туралы

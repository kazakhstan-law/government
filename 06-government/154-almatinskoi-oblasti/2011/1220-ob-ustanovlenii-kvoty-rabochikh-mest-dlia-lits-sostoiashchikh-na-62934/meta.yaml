    kaz: Қарасай ауданы әкімдігінің 2011 жылғы 20 желтоқсандағы "Қарасай ауданында бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы" N 12-1362 қаулысына өзгерістер енгізу туралы

title:
  rus: Об установлении квоты рабочих мест для лиц состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы по Карасайскому району
  kaz: Қарасай ауданы бойынша қылмыстық атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

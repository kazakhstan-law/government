requisite: Алматы облысы Райымбек ауданы әкімдігінің 2011 жылғы 31 наурыздағы № 80 қаулысы. Алматы облысы Райымбек ауданының Әділет басқармасында 2011 жылғы 18 сәуірде № 2-15-104 тіркелді. Күші жойылды - Алматы облысы Райымбек ауданы әкімдігінің 2013 жылғы 14 қазандағы № 192 шешімімен
title:

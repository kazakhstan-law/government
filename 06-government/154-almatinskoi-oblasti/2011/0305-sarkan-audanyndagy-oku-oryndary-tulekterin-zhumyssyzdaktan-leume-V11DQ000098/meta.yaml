requisite: Алматы облысы Сарқан ауданы әкімдігінің 2011 жылғы 05 наурыздағы № 85 қаулысы. Алматы облысының Әділет департаменті Сарқан ауданының Әділет басқармасында 2011 жылы 14 наурызда № 2-17-98 тіркелді. Күші жойылды - Алматы облысы Сарқан аудандық әкімдігінің 2011 жылғы 13 желтоқсандағы № 462 қаулысымен

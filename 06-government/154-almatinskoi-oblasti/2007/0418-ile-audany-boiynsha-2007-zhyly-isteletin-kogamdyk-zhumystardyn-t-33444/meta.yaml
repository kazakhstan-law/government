act_code: '33444'
requisite: Алматы облысы Іле ауданы әкімдігінің 2007 жылғы 18 сәуірдегі № 4-2127 қаулысы. Алматы облысының Әділет департаменті Іле ауданының Әділет басқармасында 2007 жылдың 16 мамырында № 2-10-48 тіркелді
title:
  rus: «Іле ауданы бойынша 2007 жылы істелетін қоғамдық жұмыстардың түрлері мен көлемі, оларды қаржыландыру көздері және қоғамдық жұмыс істейтін мекемелердің тізбесін бекіту туралы»
  kaz: «Іле ауданы бойынша 2007 жылы істелетін қоғамдық жұмыстардың түрлері мен көлемі, оларды қаржыландыру көздері және қоғамдық жұмыс істейтін мекемелердің тізбесін бекіту туралы»

title:
  rus: Об утверждении Правил присвоения наименований и переименований составных частей населенного пункта, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Алматинской области
  kaz: Алматы облысы аумағындағы елді мекеннің құрамдас бөліктеріне атау беру және атауын қайта өзгерту, жер учаскелеріне, ғимараттар мен құрылыстарға реттік нөмірлерін беру талаптарын бекіту ережелері туралы

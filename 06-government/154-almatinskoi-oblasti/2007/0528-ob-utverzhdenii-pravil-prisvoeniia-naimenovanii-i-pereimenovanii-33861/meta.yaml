  title:
    rus: О внесении изменений в постановление акимата Алматинской области N 114 от 28 мая 2007 года "Об утверждении Правил присвоения наименований составных частей населенного пункта, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Алматинской области"
    kaz: Алматы облысы әкімдігінің 2007 жылғы 28 мамырдағы "Алматы облысы аумағындағы елді мекеннің құрамдас бөліктеріне атау беру және аталуын қайта өзгерту, жер учаскелеріне, ғимараттар мен құрылыстарға реттік нөмірлерін беру талаптарын бекіту ережелері туралы" N 114 қаулысына өзгертулер енгізу туралы

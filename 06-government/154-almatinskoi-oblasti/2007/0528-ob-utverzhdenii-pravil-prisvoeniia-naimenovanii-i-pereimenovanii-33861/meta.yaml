requisite: Постановление акимата Алматинской области от 28 мая 2007 года № 114. Зарегистрировано Департаментом юстиции Алматинской области 25 июня 2007 года за № 1989. Утратило силу постановлением акимата Алматинской области от 31 января 2013 года № 25-а
title:

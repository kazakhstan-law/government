requisite: Алматы облысы Текелі қаласы әкімдігінің 2007 жылы 28 наурыздағы № 109 қаулысы. Алматы облысының Әділет департаменті Текелі қаласының әділет басқармасында 2007 жылы 16 сәуірде № 2-3-30 тіркелді. Күші жойылды - Алматы облысы Текелі қаласы әкімдігінің 2014 жылғы 28 желтоқсандағы № 21 қаулысымен

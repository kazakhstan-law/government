act_code: '72626'
requisite: Постановление акимата Кербулакского района Алматинской области от 15 апреля 2013 года № 72. Зарегистрировано Департаментом юстиции Алматинской области 13 мая 2013 года № 2353. Утратило силу постановлением акимата Кербулакского района Алматинской области от 05 декабря 2013 N 321
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освободивщихся из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в Кербулакском районе
  kaz: Кербұлақ ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

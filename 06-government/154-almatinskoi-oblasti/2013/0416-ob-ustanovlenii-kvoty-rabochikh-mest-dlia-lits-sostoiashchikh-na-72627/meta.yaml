requisite: Постановление акимата Сарканского района Алматинской области от 16 апреля 2013 года № 213. Зарегистрировано Департаментом юстиции Алматинской области 13 мая 2013 года № 2354. Утратило силу постановлением акимата Сарканского района Алматинской области от 03 августа 2016 года № 294
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы в Сарканском районе
  kaz: Сарқан ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

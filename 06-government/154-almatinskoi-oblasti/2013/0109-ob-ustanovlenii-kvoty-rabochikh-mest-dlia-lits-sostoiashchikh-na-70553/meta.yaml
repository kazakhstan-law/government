title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы в Аксуском районе
  kaz: Ақсу ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

act_code: '73404'
requisite: Постановление акимата Коксуского района Алматинской области от 18 июня 2013 года № 179. Зарегистрировано Департаментом юстиции Алматинской области 10 июля 2013 года № 2392. Утратило силу постановлением акимата Коксуского района Алматинской области от 18 декабря 2013 года № 340
title:
  rus: Об установления квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

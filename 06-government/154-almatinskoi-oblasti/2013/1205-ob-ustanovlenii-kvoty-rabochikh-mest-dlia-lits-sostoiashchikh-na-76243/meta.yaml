act_code: '76243'
requisite: Постановление акимата Кербулакского района Алматинской области от 05 декабря 2013 года N 321. Зарегистрировано Департаментом юстиции Алматинской области 23 декабря 2013 года N 2527. Утратило силу постановлением акимата Кербулакского района Алматинской области от 30 сентября 2016 года № 405
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Кербулакском районе
  kaz: Кербұлақ ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Алматинской области от 03 июля 2013 года № 191. Зарегистрировано Департаментом юстиции Алматинской области 07 августа 2013 года № 2420. Утратило силу постановлением акимата Алматинской области от 02 июня 2014 года № 196
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на оказание услуг по складской деятельности с выдачей хлопковых расписок"
  kaz: '"Мақта қолхаттарын беру арқылы қойма қызметі бойынша қызметтер көрсетуге лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" электрондық мемлекеттік қызмет көрсету регламентін бекіту туралы'

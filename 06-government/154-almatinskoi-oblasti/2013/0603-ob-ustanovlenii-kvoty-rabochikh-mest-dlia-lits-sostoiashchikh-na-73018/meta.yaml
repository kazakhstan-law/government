act_code: '73018'
requisite: Постановление акимата Жамбылского района Алматинской области от 03 июня 2013 года № 400. Зарегистрировано Департаментом юстиции Алматинской области 12 июня 2013 года № 2377. Утратило силу постановлением акимата Жамбылского района Алматинской области от 10 октября 2016 года № 504
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и для несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

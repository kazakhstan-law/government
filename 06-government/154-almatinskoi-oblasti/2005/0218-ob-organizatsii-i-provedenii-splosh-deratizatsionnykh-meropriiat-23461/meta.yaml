act_code: '23461'
requisite: Постановление акимата Алматинской области от 18 февраля 2005 года № 41. Зарегистрировано Департаментом юстиции Алматинской области 23 марта 2005 года № 1920
title:
  rus: Об организации и проведении сплош дератизационных мероприятий в населен пунктах (помещения и открытые территории; Алматинской области, находящихся в зонеивно действующих природных очагов чумы, тул и с высокой численностью серых крыс; проведение истребительных мероприятий против малярийных комаров на анофелогенных площадях Капчагайского водохранилища
  kaz: Алматы облысының оба, туляремчя ауруларының табиғи белсенді ошақтары аймақтарында орналасқан және сұр егеуқұйрықтардың саны көп елді мекендерінде (үй-жайлар мен ашық аумақтар) жаппай дератизациялау шараларын ұйымдастыру және өткізу; Қапшағай су қоймасындағы анофелогенді аландарда безгек ауруын тарататын масаны қырып-жою шараларын өткізу туралы

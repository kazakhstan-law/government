act_code: '56328'
requisite: Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2008 жылғы 08 қаңтардағы N  33 қаулысы. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2008 жылы 23 қаңтарда N 2-8-66 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 12 қаңтардағы N 01 қаулысымен

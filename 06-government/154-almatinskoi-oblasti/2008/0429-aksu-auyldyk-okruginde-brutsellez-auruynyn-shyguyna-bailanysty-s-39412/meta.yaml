requisite: Алматы облысы Ақсу ауданы әкімдігінің 2008 жылғы 29 сәуірдегі № 105 қаулысы. Алматы облысының Әділет департаменті Ақсу ауданының әділет басқармасында 2008 жылы 6 мамырда № 2-4-69 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімдігінің 2009 жылғы 7 қыркүйектегі № 254 қаулысымен

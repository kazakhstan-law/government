requisite: Алматы облысы Ақсу ауданы әкімдігінің 2008 жылғы 8 сәуірдегі № 67 қаулысы. Алматы облысының Әділет департаменті Ақсу ауданының әділет басқармасында 2008 жылы 18 сәуірде № 2-4-66 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімдігінің 2009 жылғы 7 қыркүйектегі № 254 қаулысымен

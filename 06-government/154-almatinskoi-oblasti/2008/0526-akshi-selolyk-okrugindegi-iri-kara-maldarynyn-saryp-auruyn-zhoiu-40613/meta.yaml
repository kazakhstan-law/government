requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2008 жылғы 26 мамырдағы № 2031 қаулысы. Алматы облысының Әділет департаменті Еңбешіқазақ ауданының әділет басқармасында 2008 жылы 27 маусымда № 2-8-92 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2009 жылғы 24 тамыздағы № 867 қаулысымен

requisite: Алматы облысы Қаратал ауданы әкімдігінің 2008 жылғы 14 қаңтардағы № 7 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2008 жылы 7 ақпанда № 2-12-64 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2011 жылғы 20 желтоқсандағы № 365 қаулысымен

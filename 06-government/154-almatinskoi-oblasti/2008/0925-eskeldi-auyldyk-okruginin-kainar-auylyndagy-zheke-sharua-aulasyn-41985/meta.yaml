requisite: Алматы облысы Қаратал ауданы әкімдігінің 2008 жылғы 25 қыркүйектегі № 124 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2008 жылы 22 қазанда № 2-12-93 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2009 жылғы 25 желтоқсандағы № 384 қаулысымен

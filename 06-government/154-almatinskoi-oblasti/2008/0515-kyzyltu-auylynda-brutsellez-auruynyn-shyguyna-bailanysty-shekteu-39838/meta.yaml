requisite: Алматы облысы Ақсу ауданы әкімдігінің 2008 жылғы 15 мамырдағы № 119 қаулысы. Алматы облысының Әділет департаменті Ақсу ауданының әділет басқармасында 2008 жылы 26 мамырда № 2-4-73 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімдігінің 2008 жылғы 23 желтоқсандағы № 375 қаулысымен

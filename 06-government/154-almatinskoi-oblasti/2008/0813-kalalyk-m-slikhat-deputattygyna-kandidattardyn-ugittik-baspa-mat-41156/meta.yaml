requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2008 жылғы 13 тамыздағы № 20-736 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының әділет басқармасында 2008 жылғы 14 тамызда № 2-1-85 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2009 жылғы 08 маусымдағы № 14-386 қаулысымен

title:
  rus: Об определении границ территорий для размещения казино, залов игровых автоматов, букмекерских контор и тотализаторов (касс букмекерских контор и (или) тотализаторов) на побережье Капшагайского водохранилища
  kaz: Қапшағай су қоймасының жағалауында казиноларды, ойын автоматтары залдарын, букмекерлік кеңселер мен тотализаторларды (букмекерлік кеңселердің және (немесе) тотализаторлардың кассаларын) орналастыруға арналған аумақтардың шекараларын айқындау туралы

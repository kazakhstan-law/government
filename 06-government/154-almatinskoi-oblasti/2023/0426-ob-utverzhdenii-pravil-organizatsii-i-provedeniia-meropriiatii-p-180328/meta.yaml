  title:
    rus: О внесении изменений в постановление акимата Карасайского района от 26 апреля 2023 года № 211 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика по Карасайскому району»
    kaz: Қарасай ауданы әкімдігінің 2023 жылғы 26 сәуірдегі № 211«Қарасай ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

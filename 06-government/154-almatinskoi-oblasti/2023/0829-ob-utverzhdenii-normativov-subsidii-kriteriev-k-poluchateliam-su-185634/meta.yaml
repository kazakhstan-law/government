title:
  rus: Об утверждении нормативов субсидий, критериев к получателям субсидий и сроки подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Алматинской области на 2023 год
  kaz: Алматы облысы бойынша 2023 жылға арналған ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттар және субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы

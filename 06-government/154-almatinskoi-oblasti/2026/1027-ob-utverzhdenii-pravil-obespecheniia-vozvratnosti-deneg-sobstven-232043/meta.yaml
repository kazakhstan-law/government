requisite: Постановление акимата Карасайского района Алматинской области от 27 октября 2026 года № 346. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 октября 2026 года № 40249
title:
  rus: Об утверждении Правил обеспечения возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в Карасайском районе
  kaz: Қарасай ауданындағы пәтерлер, тұрғын емес үй-жайлар  меншік иелерінің көппәтерлі тұрғын үйде лифтілерді жөндеуге  және ауыстыруға, күрделі жөндеуге байланысты ақшаны  қайтаруын қамтамасыз ету қағидаларын бекіту туралы

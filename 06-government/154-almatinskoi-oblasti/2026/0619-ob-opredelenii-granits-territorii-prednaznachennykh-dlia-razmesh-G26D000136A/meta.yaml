requisite: Постановление акимата Алматинской области от 19 июня 2026 года № 136. Утратило силу постановлением акимата Алматинской области от 27 октября 2026 года № 282 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении границ территорий, предназначенных для размещения казино, залов игровых автоматов, букмекерских контор и тотализаторов (касс букмекерских контор и (или) тотализаторов) в Алатауском сельском округе Талгарского района Алматинской области
  kaz: Алматы облысы Талғар ауданы Алатау ауылдық округінде казино, ойын автоматтары залдарын, букмекерлік кеңселер мен тотализаторларды (букмекерлік кеңселердің және (немесе) тотализаторлардың кассаларын) орналастыруға арналған аумақтардың шекараларын айқындау туралы

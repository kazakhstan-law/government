requisite: Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 9 шілдедегі № 162 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2010 жылы 28 шілдеде № 2-12-155 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 21 қазандағы № 289 Қаулысымен

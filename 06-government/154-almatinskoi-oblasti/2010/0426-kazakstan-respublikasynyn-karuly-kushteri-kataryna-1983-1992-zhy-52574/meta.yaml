requisite: Алматы облысы Райымбек ауданы әкімдігінің 2010 жылғы 26 сәуірдегі № 158 қаулысы. Алматы облысы Райымбек ауданының Әділет басқармасында 2010 жылғы 21 мамырда № 2-15-89 тіркелді. Күші жойылды - Алматы облысы Райымбек ауданы әкімдігінің 2011 жылғы 31 наурыздағы № 80 қаулысымен
title:

requisite: Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 23 сәуірдегі № 74 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының әділет басқармасында 2010 жылы 28 сәуірде № 2-12-147 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 21 қазандағы № 281 Қаулысымен

requisite: Алматы облысы Қапшағай қаласы әкімдігінің 2010 жылғы 16 сәуірдегі № 373 қаулысы. Алматы облысы Қапшағай қаласының Әділет басқармасында 2010 жылғы 6 мамырда № 2-2-105 тіркелді. Күші жойылды - Қапшағай қаласы әкімдігінің 2011 жылғы 04 сәуірдегі № 151 қаулысымен

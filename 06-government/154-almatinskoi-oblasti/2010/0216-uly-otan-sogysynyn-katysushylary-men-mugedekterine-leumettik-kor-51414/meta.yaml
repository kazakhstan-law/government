requisite: Алматы облысы Ескелді ауданы әкімдігінің 2010 жылғы 16 ақпандағы № 28 қаулысы. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2010 жылы 25 наурызда № 2-9-100 тіркелді. Күші жойылды - Алматы облысы Ескелді ауданы әкімдігінің 2011 жылғы 14 қаңтардағы № 2 қаулысымен

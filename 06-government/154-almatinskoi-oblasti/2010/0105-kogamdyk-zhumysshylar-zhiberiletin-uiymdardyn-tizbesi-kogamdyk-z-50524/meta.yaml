act_code: '50524'
requisite: Алматы облысы Еңбекшіқазақ ауданы әкімшілігінің 2010 жылғы 05 қаңтардағы № 01 қаулысы. Алматы облысы Әділет департаменті Еңбекшіқазақ ауданының әділет басқармасында 2010 жылы 02 ақпанда № 2-8-134 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2011 жылғы 10 қаңтардағы № 01 қаулысымен
title:
  rus: Қоғамдық жұмысшылар жіберілетін ұйымдардың тізбесі, қоғамдық жұмыстардың түрлері, көлемі мен нақты жағдайлары, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

requisite: Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 15 маусымдағы № 140 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2010 жылы 08 шілдеде № 2-12-151 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 21 қазандағы № 285 Қаулысымен

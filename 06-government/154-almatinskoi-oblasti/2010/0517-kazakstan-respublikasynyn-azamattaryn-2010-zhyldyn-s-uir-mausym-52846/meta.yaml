requisite: Алматы облысы Көксу ауданы әкімдігінің 2010 жылғы 17 мамырдағы № 134 қаулысы. Алматы облысының Әділет департаменті Көксу ауданының Әділет басқармасында 2010 жылы 26 мамырда № 2-14-94 тіркелді. Күші жойылды - Алматы облысы Көксу ауданы әкімінің 2011 жылғы 12 қаңтардағы № 01 қаулысымен

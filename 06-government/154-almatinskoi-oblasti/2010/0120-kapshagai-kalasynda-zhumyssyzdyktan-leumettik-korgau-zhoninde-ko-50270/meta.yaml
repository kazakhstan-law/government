requisite: Алматы облысы Қапшағай қаласы әкімдігінің 2010 жылғы 20 қаңтардағы № 1 қаулысы. Алматы облысы Қапшағай қаласының Әділет басқармасында 2010 жылғы 22 қаңтарда № 2-2-100 тіркелді. Күші жойылды - Алматы облысы Қапшағай қаласы әкімдігінің 2012 жылғы 03 ақпандағы № 40 қаулысымен

requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2010 жылғы 08 қарашадағы № 31-1026 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының Әділет басқармасында 2010 жылы 15 желтоқсанда № 2-1-133 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2013 жылғы 26 маусымдағы № 12-638 қаулысымен

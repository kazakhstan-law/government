requisite: Алматы облысы Ақсу ауданы әкімдігінің 2010 жылғы 26 мамырдағы № 108 қаулысы. Алматы облысының Әділет департаменті Ақсу ауданының Әділет басқармасында 2010 жылы 16 маусымда № 2-4-114 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімдігінің 2011 жылғы 11 сәуірдегі № 117 қаулысымен

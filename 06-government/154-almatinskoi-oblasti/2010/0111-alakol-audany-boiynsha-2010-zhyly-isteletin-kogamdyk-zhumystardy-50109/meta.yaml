act_code: '50109'
requisite: Алматы облысы Алакөл ауданы әкімдігінің 2010 жылғы 11 қаңтардағы № 1-3 қаулысы. Алматы облысының әділет департаменті Алакөл ауданының әділет басқармасында 2010 жылы 21 қаңтарда № 2-5-78 тіркелді. Күші жойылды - Алматы облысы Алакөл ауданы әкімдігінің 2010 жылғы 30 желтоқсандағы № 12-323 қаулысымен
title:
  rus: Алакөл ауданы бойынша 2010 жылы істелетін қоғамдық жұмыстардың түрлері, көлемі, нақты жағдайлары, оларды қаржыландыру көздерін және қоғамдық жұмыс істейтін мекемелердің тізбесін бекіту

requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2010 жылғы 20 сәуірдегі № 315 қаулысы. Алматы облысы Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2010 жылы 06 мамырда № 2-8-143 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2011 жылғы 04 сәуірдегі № 283 қаулысымен

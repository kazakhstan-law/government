requisite: Алматы облысы Райымбек ауданы әкімдігінің 2010 жылғы 8 ақпандағы № 12 қаулысы. Алматы облысы Райымбек ауданының Әділет басқармасында 2010 жылғы 3 наурызда № 2-15-84 тіркелді. Күші жойылды - Алматы облысы Райымбек ауданы әкімдігінің 2013 жылғы 14 қарашадағы № 191 қаулысымен

requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2010 жылғы 12 шілдедегі № 18-572 қаулысы. Алматы облысының Әділет департаменті Талдықорған қаласының Әділет басқармасында 2010 жылы 28 шілдеде № 2-1-127 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2010 жылғы 24 қыркүйектегі № 25-857 Қаулысымен

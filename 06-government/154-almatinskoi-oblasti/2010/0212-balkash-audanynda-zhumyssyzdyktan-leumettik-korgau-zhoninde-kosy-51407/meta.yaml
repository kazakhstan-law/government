act_code: '51407'
requisite: Алматы облысы Балқаш ауданы әкімдігінің 2010 жылғы 12 ақпандағы № 8 қаулысы. Алматы облысының Әділет департаменті Балқаш ауданының Әділет басқармасында 2010 жылы 18 наурызда № 2-6-66 тіркелді. Күші жойылды - Алматы облысы Балқаш аудандық әкімдігінің 2012 жылғы 6 ақпандағы № 25 қаулысымен

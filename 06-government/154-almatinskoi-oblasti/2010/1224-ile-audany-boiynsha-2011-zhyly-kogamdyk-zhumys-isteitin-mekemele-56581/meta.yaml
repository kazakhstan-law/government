act_code: '56581'
requisite: Алматы облысы Іле ауданы әкімдігінің 2010 жылғы 24 желтоқсандағы № 11-1942 қаулысы. Алматы облысы Әділет департаменті Іле ауданының Әділет басқармасында 2010 жылы 31 желтоқсанда № 2-10-138 тіркелді. Күші жойылды - Алматы облысы Іле ауданы әкімдігінің 2012 жылғы 08 ақпандағы № 1-169 қаулысымен
title:
  rus: Іле ауданы бойынша 2011 жылы қоғамдық жұмыс істейтін мекемелердің тізбесі, істелетін қоғамдық жұмыстардың түрлері, көлемі мен нақты жағдайлары, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы
  kaz: Іле ауданы бойынша 2011 жылы қоғамдық жұмыс істейтін мекемелердің тізбесі, істелетін қоғамдық жұмыстардың түрлері, көлемі мен нақты жағдайлары, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы

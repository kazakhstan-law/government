act_code: '51170'
requisite: Алматы облысы Кербұлақ ауданы әкімдігінің 2010 жылғы 27 қаңтардағы № 17 қаулысы. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2010 жылы 9 наурызда 2-13-109 тіркелді. Күші жойылды - Алматы облысы Кербұлақ ауданы әкімдігінің 2012 жылғы 22 ақпандағы № 32 қаулысымен

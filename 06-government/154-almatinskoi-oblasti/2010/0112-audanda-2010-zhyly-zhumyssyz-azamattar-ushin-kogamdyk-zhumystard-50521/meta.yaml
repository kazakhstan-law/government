act_code: '50521'
requisite: Алматы облысы Ескелді ауданы әкімдігінің 2010 жылғы 12 қаңтардағы № 5 қаулысы. Алматы облысының Әділет департаменті Ескелді ауданының әділет басқармасында 2010 жылы 29 қаңтарда № 2-9-94 тіркелді. Күші жойылды - Алматы облысы Ескелді ауданы әкімдігінің 2011 жылғы 14 қаңтардағы № 2 қаулысымен

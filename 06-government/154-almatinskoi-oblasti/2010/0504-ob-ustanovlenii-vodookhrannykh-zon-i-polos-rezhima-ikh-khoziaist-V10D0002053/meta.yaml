requisite: Постановление акимата Алматинской области от 04 мая 2010 года N 60. Зарегистрировано Департаментом юстиции Алматинской области 08 июня 2010 года N 2053. Утратило силу постановлением акимата Алматинской области от 16 февраля 2026 года № 17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранных зон и полос, режима их хозяйственного использования в пределах административных границ Алматинской области на реках Малая Алматинка, Каскелен, Талгар, Есик, Каратал и Коксу
  kaz: Алматы облысының әкімшілік шекарасындағы Кіші Алматы, Қаскелең, Талғар, Есік, Қаратал және Көксу өзендерінің, су қорғау аймақтары мен белдеулерін белгілеу және оларды шаруашылыққа пайдалану режимі туралы

act_code: '52231'
requisite: Алматы облысы Талдықорған қаласы әкімдігінің 2010 жылғы 19 сәуірдегі № 8-237 қаулысы. Алматы облысының әділет департаменті Талдықорған қаласының әділет басқармасында 2010 жылы 27 сәуірде № 2-1-119 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімдігінің 2014 жылғы 27 қаңтардағы № 2-38 қаулысымен
title:

act_code: '53439'
requisite: Алматы облысы Ескелді ауданы әкімдігінің 2010 жылғы 25 маусымдағы № 171 қаулысы. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2010 жылы 12 шілдеде № 2-9-110 тіркелді. Күші жойылды - Алматы облысы Ескелді ауданы әкімдігінің 2014 жылғы 29 желтоқсандағы № 407 қаулысымен
title:

requisite: Алматы облысы Ескелді ауданы әкімдігінің 2010 жылғы 12 қаңтардағы № 8 қаулысы. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2010 жылы 29 қаңтарда № 2-9-96 тіркелді. Күші жойылды - Алматы облысы Ескелді ауданы әкімдігінің 2011 жылғы 14 қаңтардағы № 2 қаулысымен

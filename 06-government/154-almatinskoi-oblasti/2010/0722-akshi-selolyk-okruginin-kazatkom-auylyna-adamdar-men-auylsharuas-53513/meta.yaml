requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2010 жылғы 22 шілдедегі № 708 қаулысы. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2010 жылы 22 шілдеде № 2-8-156 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2010 жылғы 16 тамыздағы № 743 қаулысымен

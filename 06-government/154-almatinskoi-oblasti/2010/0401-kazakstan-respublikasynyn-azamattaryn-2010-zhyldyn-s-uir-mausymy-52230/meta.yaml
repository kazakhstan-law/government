requisite: Алматы облысы Кербұлақ ауданы әкімдігінің 2010 жылғы 01 сәуірдегі № 60 қаулысы. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2010 жылы 06 мамырда 2-13-114 тіркелді. Күші жойылды - Алматы облысы Кербұлақ ауданы әкімдігінің 2011 жылғы 31 наурыздағы № 85 қаулысымен

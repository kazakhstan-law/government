requisite: Алматы облысы Сарқан ауданы әкімдігінің 2010 жылғы 18 қаңтардағы № 1 қаулысы. Алматы облысының Әділет департаменті Сарқан ауданының Әділет басқармасында 2010 жылы 9 ақпанда № 2-17-81 тіркелді. Күші жойылды - Алматы облысы Сарқан ауданы әкімдігінің 2011 жылғы 05 наурыздағы № 85 қаулысымен

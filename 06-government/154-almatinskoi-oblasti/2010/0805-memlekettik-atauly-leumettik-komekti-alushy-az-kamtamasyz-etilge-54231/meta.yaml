requisite: Алматы облысы Райымбек ауданы әкімдігінің 2010 жылғы 5 тамыздағы № 484 қаулысы. Алматы облысы Райымбек ауданының Әділет басқармасында 2010 жылғы 1 қыркүйекте № 2-15-91 тіркелді. Күші жойылды - Алматы облысы Райымбек ауданы әкімдігінің 2013 жылғы 31 желтоқсандағы № 226 шешімімен

requisite: Алматы облысы Ақсу ауданы әкімдігінің 2010 жылғы 30 наурыздағы № 115 қаулысы. Алматы облысының Әділет департаменті Ақсу ауданының әділет басқармасында 2010 жылы 12 сәуірде № 2-4-110 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімдігінің 2014 жылғы 16 шілдегі № 467 қаулысымен

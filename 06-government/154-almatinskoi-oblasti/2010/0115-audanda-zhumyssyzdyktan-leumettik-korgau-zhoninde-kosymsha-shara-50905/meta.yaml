requisite: Алматы облысы Алакөл ауданы әкімдігінің 2010 жылғы 15 қаңтардағы № 1-13 қаулысы. Алматы облысының Әділет департаменті Алакөл ауданының Әділет басқармасында 2010 жылы 25 ақпанда № 2-5-81 тіркелді. Күші жойылды - Алматы облысы Алакөл ауданы әкімдігінің 2011 жылғы 23 қарашадағы № 4-320 қаулысымен

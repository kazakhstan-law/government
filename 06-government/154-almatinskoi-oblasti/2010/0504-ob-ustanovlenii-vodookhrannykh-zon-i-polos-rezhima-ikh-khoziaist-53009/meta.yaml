  kaz: Алматы облысының әкімшілік шекарасындағы Кіші Алматы, Қаскелең, Талғар, Есік, Қаратал және Көксу өзендерінің, су қорғау аймақтары мен белдеулерін белгілеу және оларды шаруашылыққа пайдалану режимі туралы

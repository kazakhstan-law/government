  title:
    rus: О внесении изменений и дополнений в постановление акимата области от 4 мая 2010 года № 60 "Об установлении водоохранных зон и полос, режима их хозяйственного использования в пределах административных границ Алматинской области на реках Малая Алматинка, Каскелен, Талгар, Есик, Каратал и Коксу"
    kaz: Облысы әкімдігінің 2010 жылғы 4 мамырдағы "Алматы облысының әкімшілік шекарасындағы Кіші Алматы, Қаскелең, Талғар, Есік, Қаратал және Көксу өзендерінің су қорғау аймақтары мен белдеулерін белгілеу және оларды шаруашылыққа пайдалану режимі туралы" № 60 қаулысына өзгерістер мен толықтырулар енгізу туралы

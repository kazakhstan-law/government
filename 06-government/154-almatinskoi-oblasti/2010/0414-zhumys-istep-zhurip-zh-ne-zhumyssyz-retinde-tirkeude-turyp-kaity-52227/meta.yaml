requisite: Алматы облысы Панфилов ауданы әкімдігінің 2010 жылғы 14 сәуірдегі № 157 қаулысы. Алматы облысының Әділет департаменті Панфилов ауданының Әділет басқармасында 2010 жылғы 05 мамырда № 2-16-110 тіркелді. Күші жойылды - Алматы облысы Панфилов ауданы әкімдігінің 2011 жылғы 28 қарашадағы № 799 қаулысымен

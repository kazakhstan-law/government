requisite: Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 17 мамырдағы № 99 қаулысы. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2010 жылы 18 маусымда № 2-12-148 тіркелді. Күші жойылды - Алматы облысы Қаратал ауданы әкімдігінің 2010 жылғы 21 қазандағы № 282 Қаулысымен

requisite: Алматы облысы Панфилов ауданы әкімдігінің 2010 жылғы 05 мамырдағы № 234 қаулысы. Алматы облысының Әділет департаменті Панфилов ауданының Әділет басқармасында 2010 жылғы 25 мамырда № 2-16-114 тіркелді. Күші жойылды - Алматы облысы Панфилов ауданы әкімдігінің 2011 жылғы 30 наурыздағы № 179 қаулысымен

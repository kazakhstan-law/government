requisite: Алматы облысы Балқаш ауданы әкімдігінің 2010 жылғы 12 ақпандағы № 9 қаулысы. Алматы облысының Әділет департаменті Балқаш ауданының Әділет басқармасында 2010 жылы 18 наурызда № 2-6-67 тіркелді. Күші жойылды - Алматы облысы Балқаш ауданы әкімдігінің 2011 жылғы 11 наурыздағы № 25 қаулысымен

requisite: Алматы облысы Ескелді ауданы әкімдігінің 2010 жылғы 12 қаңтардағы № 7 қаулысы. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2010 жылы 19 ақпанда № 2-9-98 тіркелді. Күші жойылды - Алматы облысы Ескелді ауданы әкімдігінің 2011 жылғы 14 қаңтардағы № 2 қаулысымен

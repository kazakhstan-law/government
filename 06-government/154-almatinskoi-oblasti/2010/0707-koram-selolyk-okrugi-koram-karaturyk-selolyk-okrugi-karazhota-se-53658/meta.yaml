requisite: Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2010 жылғы 7 шілдедегі № 695 қаулысы. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2010 жылы 26 шілдеде № 2-8-157 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ ауданы әкімдігінің 2010 жылғы 08 желтоқсандағы № 1167 қаулысымен
title:
  rus: Қорам селолық округі Қорам, Қаратұрық селолық округі, Қаражота селолық округі, Малыбай селолық округі Малыбай, Октябрь селолық округі Бижанова, Шелек селолық округі Шелек, Нұра селолық округі Нұра, Тескенсу селолық округі Тескенсу, Ақши селолық округі Ақши, Бәйтерек селолық округі, Рахат селолық округі, Қаракемер селолық округі Талдыбұлақ, Қазақстан селолық округі, Масақ селолық округі, Евгенемаловодное селолық округі, Асы селолық округі Таусүгір, Қызылшарық, Түрген селолық округі Таутүрген, Балтабай селолық округі Балтабай ауылдарының ұсақ малдары мен ірі қара малдарына жануарлар мен адамға ортақ жұқпалы аурулардың (бруцеллез) профилактикасы және олармен күресу бойынша шектеу іс-шараларын енгізе отырып ветеринариялық режимін белгілеу туралы

requisite: Алматы облысы Қарасай ауданы әкімдігінің 2010 жылғы 19 сәуірдегі № 4-268 қаулысы. Алматы облысы Қарасай ауданының Әділет басқармасында 2010 жылғы 22 сәуірде № 2-11-87 тіркелді. Күші жойылды - Қарасай ауданы әкімдігінің 2011 жылғы 05 сәуірдегі № 4-229 шешімімен

requisite: Алматы облысы Текелі қаласы әкімдігінің 2010 жылғы 01 сәуірдегі № 79 қаулысы. Алматы облысының Әділет департаменті Текелі қаласының Әділет басқармасында 2010 жылы 27 сәуірде № 2-3-78 тіркелді. Күші жойылды - Алматы облысы Текелі қаласы әкімдігінің 2011 жылғы 30 наурыздағы № 67 қаулысымен

requisite: Алматы облысы Балқаш ауданы әкімдігінің 2010 жылғы 07 сәуірдегі № 41 қаулысы. Алматы облысының Әділет департаменті Балқаш ауданының Әділет басқармасында 2010 жылы 13 мамырда № 2-6-70 тіркелді. Күші жойылды - Алматы облысы Балқаш ауданы әкімдігінің 2011 жылғы 31 наурыздағы № 31 қаулысымен

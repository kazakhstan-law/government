requisite: Алматы облысы Ұйғыр ауданы әкімдігінің 2010 жылғы 16 сәуірдегі № 10-122 қаулысы. Алматы облысының Әділет департаменті Ұйғыр ауданының Әділет басқармасында 2010 жылы 27 мамырда № 2-19-101 тіркелді. Күші жойылды - Алматы облысы Ұйғыр ауданы әкімдігінің 2011 жылғы 14 наурыздағы № 08-49 Қаулысымен

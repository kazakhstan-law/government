requisite: Алматы облысы Ақсу ауданы әкімдігінің 2010 жылғы 22 ақпандағы № 75 қаулысы. Алматы облысының Әділет департаменті Ақсу ауданының Әділет басқармасында 2010 жылы 25 наурызда № 2-4-106 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімдігінің 2011 жылғы 21 желтоқсандағы № 949 қаулысымен

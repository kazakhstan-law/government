requisite: Алматы облысы Талғар ауданы әкімдігінің 2010 жылғы 31 желтоқсандағы № 12-874 қаулысы. Алматы облысының Әділет департаменті Талғар ауданының Әділет басқармасында 2011 жылы 28 қаңтарда № 2-18-123 тіркелді. Қолданылу мерзімінің аяқталуына байланысты қаулының күші жойылды - Алматы облысы Талғар аудандық әкімдігінің 2013 жылғы 20 мамырдағы № 05-311 қаулысымен

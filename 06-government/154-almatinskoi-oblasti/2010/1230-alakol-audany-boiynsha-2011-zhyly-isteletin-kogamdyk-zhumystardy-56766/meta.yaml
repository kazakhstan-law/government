act_code: '56766'
requisite: Алматы облысы Алакөл ауданы әкімдігінің 2010 жылғы 30 желтоқсандағы № 12-323 қаулысы. Алматы облысының Әділет департаменті Алакөл ауданының Әділет басқармасында 2011 жылы 11 қаңтарда № 2-5-140 тіркелді. Күші жойылды - Алматы облысы Алакөл ауданы әкімдігінің 2011 жылғы 21 желтоқсандағы № 12-349 қаулысымен
title:

act_code: '19108'
requisite: Постановление акимата Алматинской области от 23 февраля 2004 года № 23. Зарегистрировано Департаментом юстиции Алматинской области 23 марта 2004 года № 1521. Утратило силу постановлением акимата Алматинской области от 18 февраля 2005 года № 41
title:
  rus: '"Об организации и проведении сплошных дератизационных мероприятий в населенных пунктах (помещения и открытые территории) Алматинской области, находящихся в зоне активно действующих природных очагов чумы, туляремии и с высокой численностью серых крыс; проведение истребительных мероприятий  против малярийных комаров на анофелогенных площадях Капчагайского водохранилища"'
  kaz: '"Алматы облысының оба, туляремия ауруларының табиғи белсендi ошақтары аймақтарында орналасқан және сұр егеуқұйрықтардың саны көп елдi мекендерiнде (үй-жайлар мен ашық аумақтар) жаппай дератизациялау шараларын ұйымдастыру және өткiзу; Қапшағай су қоймасындағы анафелогендi алаңдарда безгек ауруын тарататын масаны қырып-жою шараларын өткiзу туралы"'

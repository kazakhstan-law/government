requisite: Постановление акимата Алматинской области от 10 декабря 2012 года № 389. Зарегистрировано Департаментом юстиции Алматинской области 21 декабря 2012 года № 2252. Утратило силу постановлением акимата Алматинской области от 23 сентября 2025 года № 293 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения
  kaz: Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту туралы

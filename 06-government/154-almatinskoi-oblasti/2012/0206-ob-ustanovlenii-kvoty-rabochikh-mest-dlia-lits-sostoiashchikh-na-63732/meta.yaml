act_code: '63732'
requisite: Постановление акимата города Талдыкорган Алматинской области от 06 февраля 2012 года N 3-85. Зарегистрировано Управлением юстиции города Талдыкорган Департамента юстиции Алматинской области 22 февраля 2012 года N 2-1-155. Утратило силу постановлением акимата города Талдыкорган Алматинской области от 27 июня 2016 года № 29-421
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций по городу Талдыкорган
  kaz: Талдықорған қаласы бойынша қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

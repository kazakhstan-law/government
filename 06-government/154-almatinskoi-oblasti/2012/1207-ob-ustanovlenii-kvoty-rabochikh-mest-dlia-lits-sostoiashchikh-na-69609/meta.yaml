requisite: Постановление акимата Илийского района Алматинской области от 07 декабря 2012 года № 11-1219. Зарегистрировано Департаментом юстиции Алматинской области 26 декабря 2012 года № 2254. Утратило силу постановлением акимата Илийского района Алматинской области от 21 июля 2016 года № 286
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы,и для несовершеннолетних выпускников интернатных организаций в Илийском районе
  kaz: Іле ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

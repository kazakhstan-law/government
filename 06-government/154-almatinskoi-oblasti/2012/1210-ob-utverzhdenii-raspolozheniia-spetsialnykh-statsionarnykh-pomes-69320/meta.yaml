caused_by:
  code: '165145'
  requisite: Постановление акимата Алматинской области от 1 марта 2022 года № 46. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 марта 2022 года № 27053. Утратило силу постановлением акимата Алматинской области от 23 сентября 2025 года № 293 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменении в постановление акимата Алматинской области от 10 декабря 2012 года № 389 «Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения и согласовании расположения помещений для проведения религиозных обрядов за пределами культовых зданий (сооружений)»
    kaz: Алматы облысы әкімдігінің 2012 жылғы 10 желтоқсандағы № 389 «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту, ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни жораларды өткізуге арналған үй-жайлардың орналастырылуын келісу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/165145/rus

  title:
    rus: О внесении изменении в постановление акимата Алматинской области от 10 декабря 2012 года № 389 «Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения»
    kaz: Алматы облысы әкімдігінің 2012 жылғы 10 желтоқсандағы № 389 «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту туралы» қаулысына өзгерістер енгізу туралы

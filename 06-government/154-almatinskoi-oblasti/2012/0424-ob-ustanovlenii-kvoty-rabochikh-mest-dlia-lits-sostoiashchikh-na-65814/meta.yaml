requisite: Постановление акимата Талгарского района Алматинской области от 24 апреля 2012 года N 04-388. Зарегистрировано Управлением юстиции Талгарского района Департамента юстиции Алматинской области 28 мая 2012 года 2-18-147. Утратило силу постановлением акимата Талгарского района Алматинской области от 16 сентября 2016 года № 09-594
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы по Талгарскому району
  kaz: Талғар ауданы бойынша қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай- ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

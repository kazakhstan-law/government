act_code: '70529'
requisite: Постановление акима Алматинской области от 24 декабря 2012 года № 424. Зарегистрировано Департаментом юстиции Алматинской области 28 января 2013 года № 2292. Утратило силу постановлением акимата Алматинской области от 02 июня 2014 года № 196
title:
  rus: Об утверждении регламента электронной государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилища, арендованным местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттiк тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергiлiктi атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегi" электрондық мемлекеттік қызмет көрсету регламентін  бекіту туралы'

act_code: '69155'
requisite: Постановление акимата Алматинской области от 22 ноября 2012 года № 366. Зарегистрировано Департаментом юстиции Алматинской области 10 декабря 2012 года № 2211. Утратило силу постановлением акимата Алматинской области от 21 ноября 2014 года № 410
title:
  rus: Об утверждении регламента государственной услуги "Принятие местными  исполнительными органами области решения по закреплению охотничьих угодий  и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
  kaz: '"Облыстық жергiлiктi атқарушы органдарының жануарлар дүниесiн пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерiн бекiтiп беру мен аңшылық және балық шаруашылықтарының қажеттiлiктерi үшiн сервитуттарды белгiлеу жөнiнде шешiмдер қабылдауы" мемлекеттік қызмет регламентін бекіту туралы'

  title:
    rus: О внесении изменений в постановление акимата области от 22 ноября 2012 года N 366 "Об утверждении регламента государственной услуги "Принятие местными  исполнительными органами области решения по закреплению охотничьих угодий  и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
    kaz: '"Облыстың жергiлiктi атқарушы органдарының жануарлар дүниесiн пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерiн бекiтiп беру мен аңшылық және балық шаруашылықтарының қажеттiлiктерi үшiн сервитуттарды белгiлеу жөнiнде шешiмдер қабылдауы" мемлекеттік қызмет регламентін бекіту туралы" облыс әкімдігінің 2012 жылғы  22 қарашадағы N 366 қаулысына өзгерістер енгізу туралы'

    kaz: Райымбек ауданы әкімдігінің 2012 жылғы 18 қаңтардағы "Райымбек ауданында бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы" N 8 қаулысына өзгерістер енгізу туралы

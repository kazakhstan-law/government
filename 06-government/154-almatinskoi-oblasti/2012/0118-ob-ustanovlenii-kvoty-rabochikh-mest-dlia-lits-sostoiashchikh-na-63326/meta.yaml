requisite: Постановление акимата Райымбекского района Алматинской области от 18 января 2012 года N 8. Зарегистрировано Управлением юстиции Райымбекского района Департамента юстиции Алматинской области 10 февраля 2012 года N 2-15-112. Утратило силу постановлением акимата Райымбекского района Алматинской области от 13 сентября 2016 года № 264
title:
  rus: Об установлении квоты рабочих мест для лиц состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц. Освобожденных из мест лишения свободы по Райымбекскому району
  kaz: Райымбек ауданы бойынша қылмыстық атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

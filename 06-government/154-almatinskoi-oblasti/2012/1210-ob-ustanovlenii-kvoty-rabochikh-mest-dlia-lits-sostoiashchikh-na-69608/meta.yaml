act_code: '69608'
requisite: Решение маслихата Балхашского района Алматинской области от 10 декабря 2012 года № 211. Зарегистрировано Департаментом юстиции Алматинской области 24 декабря 2012 года № 2253. Утратило силу постановлением акимата Балхашского района Алматинской области от 08 сентября 2016 года № 137
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Балхашском районе
  kaz: Балқаш ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

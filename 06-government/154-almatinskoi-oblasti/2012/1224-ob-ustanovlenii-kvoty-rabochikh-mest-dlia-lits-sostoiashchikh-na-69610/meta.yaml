act_code: '69610'
requisite: Постановление акимата города Текели Алматинской области от 24 декабря 2012 года N 420. Зарегистрировано Департаментом юстиции Алматинской области 26 декабря 2012 года N 2255. Утратило силу постановлением акимата города Текели Алматинской области от 16 февраля 2017 года № 31
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций города Текели
  kaz: Текелі қаласындағы қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

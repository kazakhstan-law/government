  title:
    rus: О внесении изменений в постановление акимата района от 4 июля 2012 года N 210 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершенолетних выпускников интернатных организации по Ескельдинскому району"
    kaz: Ескелді ауданы әкімдігінің 2012 жылғы 4 шілдедегі N 210 "Ескелді ауданы бойынша қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы" қаулысына өзгерістер енгізу туралы

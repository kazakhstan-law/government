  requisite: Постановление акимата Ескельдинского района Алматинской области от 28 января 2013 года № 17, зарегистрировано Департаментом юстиции Алматинской области 22 февраля 2013 года № 2305. Утратило силу постановлением акимата Ескельдинского района области Жетісу от 23 апреля 2024 года № 142
  title:
    rus: О внесении изменений в постановление акимата района от 4 июля 2012 года N 210 "Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций по Ескельдинскому району"
    kaz: Ескелді ауданы әкімдігінің 2012 жылғы 4 шілдедегі N 210 "Ескелді ауданы бойынша бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы" қаулысына өзгерістер енгізу туралы

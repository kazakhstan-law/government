act_code: '66812'
requisite: Постановление акимата Ескельдинского района Алматинской области от 04 июля 2012 года № 210. Зарегистрировано Управлением юстиции Ескельдинского района Департамента юстиции Алматинской области 20 июля 2012 года № 2-9-140. Утратило силу постановлением Ескельдинского районного акимата Алматинской области от 29 декабря 2014 года № 408
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организации по Ескельдинскому району
  kaz: Ескелді ауданы бойынша қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

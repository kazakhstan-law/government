  kaz: Талдықорған қалалық мәслихатына № 1 сайлау округі бойынша депутаттыққа кандидаттардың сайлаушылармен кездесуі үшін үй-жай беру туралы және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

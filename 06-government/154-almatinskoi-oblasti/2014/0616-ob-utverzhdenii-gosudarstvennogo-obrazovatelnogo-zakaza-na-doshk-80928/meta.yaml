act_code: '80928'
requisite: Постонавление акимата города Капшагай Алматинской области от 16 июня 2014 года № 384. Зарегистрировано Департаментом юстиции Алматинской области 23 июня 2014 года № 2758. Утратило силу постановлением акимата города Капшагай Алматинской области от 13 декабря 2017 года № 993
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по Заречному, Шенгельдинскому сельским округам и городу Капшагай
  kaz: Заречный, Шеңгелді ауылдық округтері және Қапшағай қаласы бойынша мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

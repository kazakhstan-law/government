act_code: '78396'
requisite: Постановление акимата Алматинской области от 26 марта 2014 года № 83. Зарегистрировано Департаментом юстиции Алматинской области 27 марта 2014 года № 2639. Утратило силу постановлением акимата Алматинской области от 30 сентября 2024 года № 301
title:
  rus: Об утверждении нормативов субсидий на возмещение до 100 % затрат по искусственному осеменению маточного поголовья крупного рогатого скота  в личных подсобных хозяйствах, критериев и требований к поставщикам услуг по искусственному осеменению, а также объемов субсидий по направлениям субсидирования развития племенного животноводства и повышения продуктивности и качества продукции животноводства
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100 %-ға дейін өтеуге арналған субсидиялар нормативтерін, қолдан ұрықтандыру қызметін жеткізушілерге қойылатын өлшемдер мен талаптарды, сондай-ақ асыл тұқымды мал шаруашылығын дамытуды  және мал шаруашылығы өнiмiнiң өнiмдiлiгi мен сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы

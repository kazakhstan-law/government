  title:
    rus: О внесении изменений в постановление акимата области от 26 марта  2014 года № 83 «Об утверждении нормативов субсидий на возмещение до 100 % затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, критериев и требований к поставщикам услуг по искусственному осеменению,  а также объемов субсидий по направлениям субсидирования развития племенного  животноводства и повышения  продуктивности и качества продукции животноводства»
    kaz: «Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100 %-ға дейін өтеуге арналған субсидиялар нормативтерін,  қолдан ұрықтандыру қызметін жеткізушілерге қойылатын өлшемдер мен талаптарды, сондай-ақ асыл тұқымды мал шаруашылығын дамытуды  және мал шаруашылығы өнiмiнiң өнiмдiлiгi мен сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» облыс әкімдігінің 2014 жылғы  26 наурыздағы № 83 қаулысына өзгерістер енгізу туралы

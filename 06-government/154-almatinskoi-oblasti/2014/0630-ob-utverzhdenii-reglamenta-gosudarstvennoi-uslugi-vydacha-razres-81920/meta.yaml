requisite: Постановление акимата Алматинской области от 30 июня 2014 года № 244. Зарегистрировано Департаментом юстиции Алматинской области 08 августа 2014 года № 2795. Утратило силу постановлением акимата Алматинской области от 22 сентября 2015 года № 426
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешения на размещение объектов наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах"
  kaz: '"Облыстық және аудандық маңызы бар, сондай-ақ елдi мекендердегi жалпы пайдаланымдағы автомобиль жолдарының бөлiнген белдеуінде сыртқы (көрнекi) жарнама объектісін орналастыруға рұқсат беру" мемлекеттiк көрсетілетін қызмет регламентiн бекiту туралы'

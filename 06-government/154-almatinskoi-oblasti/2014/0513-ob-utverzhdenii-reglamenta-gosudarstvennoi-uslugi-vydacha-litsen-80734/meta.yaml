act_code: '80734'
requisite: Постановление от 13.05.2014 №161, Акимат Алматинской области. Утратило силу постановлением акимата Алматинской области от 01.09.2015 № 402
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии,  переоформление, выдача дубликатов лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов, за исключением деятельности по реализации лома и отходов цветных и черных металлов, образовавшихся у юридических лиц в ходе собственного производства и в результате приобретения имущественного комплекса, в составе которого находились лом и (или) отходы цветных и (или) черных металлов, лицензиатам"
  kaz: '"Заңды тұлғаларда өз өндiрiсi барысында және құрамында түстi және (немесе) қара металл сынықтары және (немесе) қалдықтары болған мүлiктiк кешендi сатып алу нәтижесiнде пайда болған түстi және қара металл сынықтары мен қалдықтарын өткiзу жөнiндегi қызметтi қоспағанда, заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және лицензиаттарға өткiзу жөніндегі қызметтi жүзеге асыруға лицензия беру, қайта ресiмдеу, лицензияның телнұсқаларын беру" мемлекеттiк көрсетілетін қызмет регламентін бекіту туралы'

title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления кандидатам помещений для встреч с избирателями в Карасайском районе
  kaz: Қарасай ауданында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жайлар беру туралы

  title:
    rus: О внесении изменений в постановление акимата Карасайского района Алматинской области от 19 ноября 2020 года № 345 «Об определении мест для размещения агитационных печатных материалов и предоставления кандидатам помещений для встреч с избирателями в Карасайском районе»
    kaz: «Қарасай ауданында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жайлар беру туралы» Алматы облысы Қарасай ауданы әкімдігінің 2020 жылғы 19 қарашадағы № 345 қаулысына өзгерістер енгізу туралы

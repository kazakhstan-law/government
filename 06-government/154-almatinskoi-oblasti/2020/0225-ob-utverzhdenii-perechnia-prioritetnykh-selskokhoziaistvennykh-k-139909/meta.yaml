requisite: Постановление акимата Алматинской области от 25 февраля 2020 года № 66. Зарегистрировано Департаментом юстиции Алматинской области 28 февраля 2020 года № 5429. Утратило силу постановлением акимата Алматинской области от 10 июня 2020 года № 231
title:
  rus: Об утверждении перечня приоритетных сельскохозяйственных культур, объем и нормы субсидий на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур на 2020 год
  kaz: 2020 жылға арналған басым ауыл шаруашылығы дақылдарының тізбесін, басым дақылдар өндіруді субсидиялау жолымен өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдары мен көктемгі егіс және егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын арзандатуға арналған субсидиялар көлемі мен нормаларын бекіту туралы

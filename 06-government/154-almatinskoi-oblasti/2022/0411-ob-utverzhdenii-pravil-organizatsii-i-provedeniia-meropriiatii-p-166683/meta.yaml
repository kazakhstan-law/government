  title:
    rus: О внесении изменений в постановление акимата Аксуского района от 11 апреля 2022 года № 105 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Аксуского района»
    kaz: Ақсу ауданы әкімдігінің 2022 жылғы 11 сәуірдегі «Ақсу ауданының бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» № 105 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Балхашского района от 1 июня 2022 года № 91 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Балхашского района
    kaz: Балқаш ауданы әкімдігінің 2022 жылғы 1 маусымдағы № 91 «Балқаш ауданында бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

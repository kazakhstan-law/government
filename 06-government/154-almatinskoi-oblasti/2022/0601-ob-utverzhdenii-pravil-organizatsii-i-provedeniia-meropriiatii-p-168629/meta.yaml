requisite: Постановление акимата Балхашского района Алматинской области от 1 июня 2022 года № 91. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 июня 2022 года № 28409
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика по Балхашскому району
  kaz: Балқаш ауданына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

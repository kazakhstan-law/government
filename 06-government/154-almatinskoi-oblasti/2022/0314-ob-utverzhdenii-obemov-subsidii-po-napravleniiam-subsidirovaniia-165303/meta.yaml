  title:
    rus: О внесении изменения в постановление акимата Алматинской области от 14 марта 2022 года № 57 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства по Алматинской области на 2022 год»
    kaz: Алматы облысы әкімдігінің 2022 жылғы 14 наурыздағы № 57 «Алматы облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша 2022 жылға арналған субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

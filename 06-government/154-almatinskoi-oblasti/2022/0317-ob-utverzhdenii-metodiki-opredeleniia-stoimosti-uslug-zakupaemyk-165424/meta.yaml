requisite: Постановление акимата Алматинской области от 17 марта 2022 года № 71. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 марта 2022 года № 27163. Утратило силу постановлением акимата Алматинской области от 29 января 2025 года № 27 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

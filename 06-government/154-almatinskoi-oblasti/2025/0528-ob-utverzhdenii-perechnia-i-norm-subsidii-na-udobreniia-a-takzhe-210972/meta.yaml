  title:
    rus: О внесении изменения в постановление акимата Алматинской области от 28 мая 2025 года № 141 «Об утверждении перечня и норм субсидий на удобрения, а также объем бюджетных средств на субсидирование удобрений (за исключением органических) на 2025 год»
    kaz: Алматы облысы әкімдігінің 2025 жылғы 28 мамырдағы «2025 жылға тыңайтқыштарға арналған субсидиялар тізбесі мен нормаларын, сондай-ақ тыңайтқыштарды (органикалықтарды қоспағанда) субсидиялауға бюджеттік қаражат көлемін бекіту туралы» № 141 қаулысына өзгеріс енгізу туралы

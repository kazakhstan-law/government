  requisite: Постановление акимата Жамбылского района Алматинской области от 27 августа 2026 года № 316
  title:
    rus: О внесении изменений в постановление акимата Жамбылского района от 24 июня 2025 года № 263 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жамбылскому району»
    kaz: «Жамбыл ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Жамбыл ауданы әкімдігінің 2025 жылғы 24 маусымдағы № 263 қаулысына өзгерістер енгізу туралы

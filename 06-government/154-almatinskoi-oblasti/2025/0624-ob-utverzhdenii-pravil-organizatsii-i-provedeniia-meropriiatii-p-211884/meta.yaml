act_code: '211884'
requisite: Постановление акимата Жамбылского района Алматинской области от 24 июня 2025 года № 263
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Жамбылского района
  kaz: Жамбыл ауданының елді мекендеріне біріңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу, жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

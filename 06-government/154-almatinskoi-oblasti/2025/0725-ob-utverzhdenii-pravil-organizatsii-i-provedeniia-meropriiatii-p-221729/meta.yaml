act_code: '221729'
requisite: Постановление акимата города Қонаев Алматинской области от 25 июля 2025 года № 548
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, включая услуги, в том числе декоративно-светового оформления, направленных на придание единого архитектурного облика городу Қонаев
  kaz: Қонаев қаласына бірыңғай сәулеттік келбет беруге бағытталған көрсетілетін қызметтерді, оның ішінде сәндік-жарықпен безендіру қызметтерін қоса алғанда, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын қайта жаңарту, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

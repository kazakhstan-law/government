requisite: Совместные решение маслихата города Қонаев Алматинской области от 21 февраля 2025 года № 39-144 и постановление акимата города Қонаев Алматинской области от 21 февраля 2025 года № 194. Зарегистрировано Департаментом юстиции Алматинской области 25 февраля 2025 года № 6215-05. Утратило силу совместным решением маслихата города Қонаев Алматинской области от 10 марта 2026 года № 60-201 и постановлением акимата города Қонаев Алматинской области от 10 марта 2026 года № 178 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

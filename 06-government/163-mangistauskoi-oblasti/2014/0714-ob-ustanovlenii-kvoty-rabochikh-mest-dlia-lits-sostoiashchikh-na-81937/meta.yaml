  title:
    rus: О внесении изменений в постановление акимата города Актау от 14 июля  2014 года №962  «Об установлении квоты рабочих мест для лиц,  состоящих  на учете службы пробации уголовно-исполнительной инспекции, а также  освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций»
    kaz: Ақтау қаласы әкімдігінің 2014  жылғы 14 шілдедегі  №962 «Қылмыстық - атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан  босатылған  тұлғалар  және  интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгерістер енгізу туралы

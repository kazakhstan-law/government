act_code: '81937'
requisite: Постановление Актауского городского акимата от 14 июля 2014 года № 962. Зарегистрировано Департаментом юстиции Мангистауской области от 08 августа 2014 года № 2483.Утратило силу постановлением акимата города Актау Мангистауской области от 14 марта 2017 года № 512
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организации
  kaz: Қылмыстық - атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

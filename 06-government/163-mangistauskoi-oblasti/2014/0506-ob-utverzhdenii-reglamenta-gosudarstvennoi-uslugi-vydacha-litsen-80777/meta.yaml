act_code: '80777'
requisite: Постановление акимата Мангистауской области от 06 мая 2014 года № 93. Зарегистрировано Департаментом юстиции Мангистауской области 13 июня 2014 года № 2447. Утратило силу постановлением акимата Мангистауской области от 25 сентября 2015 года № 290
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов, за исключением деятельности по реализации лома и отходов цветных и черных металлов, образовавшихся у юридических лиц в ходе собственного производства и в результате приобретения имущественного комплекса, в составе которого находились лом и (или) отходы цветных и (или) черных металлов, лицензиатам"
  kaz: '"Заңды тұлғаларда өз өндірісі барысында және құрамында түстi және (немесе) қара металл сынықтары және (немесе) қалдықтары болған мүліктік кешенді сатып алу нәтижесінде пайда болған түсті және қара металл сынықтары мен қалдықтарын өткізу жөніндегі қызметті қоспағанда, заңды тұлғалардың түсті және қара металл сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және лицензиаттарға өткiзу жөніндегі қызметті жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

  title:
    rus: О внесении изменения и дополнений в постановление акимата Мангистауской области от 24 апреля 2014 года № 81 «Об утверждении регламента государственной услуги «Выдача решения о строительстве культовых зданий (сооружений), определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения)»
    kaz: Маңғыстау облысы әкімдігінің 2014 жылғы 24 сәуірдегі № 81 «Ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері  (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысынаөзгеріс пен толықтырулар енгізу туралы

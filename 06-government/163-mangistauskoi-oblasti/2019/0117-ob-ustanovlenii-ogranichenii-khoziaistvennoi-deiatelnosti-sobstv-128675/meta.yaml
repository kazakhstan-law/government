act_code: '128675'
requisite: Постановление акимата Мангистауской области от 17 января 2019 года № 4. Зарегистрировано Департаментом юстиции Мангистауской области 21 января 2019 года № 3788
title:
  rus: Об установлении ограничений хозяйственной деятельности собственников земельных участков и землепользователей в пределах территорий государственных природных (комплексных) и государственных природных (зоологических) заказников местного значения, находящихся в ведении коммунального государственного учреждения «Государственный региональный природный парк «Кызылсай» Управления природных ресурсов и регулирования природопользования Мангистауской области
  kaz: Маңғыстау облысының табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Қызылсай» мемлекеттік өңірлік табиғи паркі» коммуналдық мемлекеттік мекемесінің қарауындағы жергілікті маңызы бар мемлекеттік табиғи (кешенді) және мемлекеттік табиғи (зоологиялық) қаумалдар аумағы шегінде жер учаскелерінің меншік иелері мен жер пайдаланушылардың шаруашылық қызметіне шектеулер белгілеу туралы

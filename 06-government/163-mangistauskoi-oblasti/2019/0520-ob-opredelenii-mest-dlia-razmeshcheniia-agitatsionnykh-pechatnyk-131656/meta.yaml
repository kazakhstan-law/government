  title:
    rus: О внесении изменений в постановление акимата города Актау  от 20 мая 2019 года № 1073 «О предоставлении кандидатам помещений на договорной основе для встреч с избирателями и определении мест для размещения агитационных печатных материалов на территории города Актау»
    kaz: Ақтау қаласының әкімдігінің 2019 жылғы 20 мамырдағы №1073 «Ақтау қаласы аумағында кандидаттарға сайлаушылармен кездесуі үшін шарттық негізде үй-жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Мунайлинского района от 27 мая 2019 года № 98-қ «О предоставлении кандидатам помещений на договорной основе для встреч с избирателями и определении мест для размещения агитационных печатных материалов»
    kaz: Мұнайлы ауданы әкімдігінің 2019 жылғы 27 мамырдағы № 98-қ «Кандидаттарға сайлаушылармен кездесуі үшін шарттық негізде үй-жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы» қаулысына өзгерістер енгізу туралы

title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории Мунайлинского район
  kaz: Мұнайлы ауданы аумағындағы барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды анықтау туралы

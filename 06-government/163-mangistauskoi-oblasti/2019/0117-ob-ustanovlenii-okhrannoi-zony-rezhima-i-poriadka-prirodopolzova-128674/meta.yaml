title:
  rus: Об установлении охранной зоны, режима и порядка природопользования на территории охранной зоны коммунального государственного учреждения «Государственный региональный природный парк «Кызылсай» Управления природных ресурсов и регулирования природопользования Мангистауской области
  kaz: Маңғыстау облысының табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Қызылсай» мемлекеттік өңірлік паркі» коммуналдық мемлекеттік мекемесінің қорғау аймағын, қорғау аймағының аумағында табиғат пайдалану режимі мен тәртібін белгілеу туралы

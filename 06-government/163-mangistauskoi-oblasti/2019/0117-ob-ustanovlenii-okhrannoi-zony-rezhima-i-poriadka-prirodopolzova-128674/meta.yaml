  title:
    rus: «О внесении изменения в постановление акимата Мангистауской области от 17 января 2019 года № 5 «Об установлении охранной зоны, размера, границы, режима и порядка природопользования коммунального государственного учреждения «Государственный региональный природный парк «Кызылсай» Управления природных ресурсов и регулирования природопользования Мангистауской области»
    kaz: «Маңғыстау облысы әкімдігінің «Маңғыстау облысының табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Қызылсай» мемлекеттік өңірлік табиғи паркі» коммуналдық мемлекеттік мекемесінің қорғау аймағын, табиғат пайдалану мөлшерін, шекарасын, режимін және тәртібін белгілеу туралы» 2019 жылғы 17 қаңтардағы № 5 қаулысына өзгеріс енгізу туралы

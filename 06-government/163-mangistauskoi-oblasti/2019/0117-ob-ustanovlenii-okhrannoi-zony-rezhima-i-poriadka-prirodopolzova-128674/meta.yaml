  title:
    rus: О внесении изменений в постановление акимата Мангистауской области от 17 января 2019 года № 5 «Об установлении охранной зоны, размера, границы, режима и порядка природопользования коммунального государственного учреждения «Государственный региональный природный парк «Кызылсай» Управления природных ресурсов и регулирования природопользования Мангистауской области»
    kaz: Маңғыстау облысы әкімдігінің 2019 жылғы 17 қаңтардағы № 5 «Маңғыстау облысының табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Қызылсай» мемлекеттік өңірлік паркі» коммуналдық мемлекеттік мекемесінің қорғау аймағын, табиғат пайдалану мөлшерін, шекарасын, режимін және тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

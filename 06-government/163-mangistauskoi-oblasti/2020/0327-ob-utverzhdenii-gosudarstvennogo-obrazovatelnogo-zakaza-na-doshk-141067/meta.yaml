  title:
    rus: О внесении изменения в постановление акимата Каракиянского района от 27 марта 2020 года № 72 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера родительской платы на 2020 год»
    kaz: Қарақия ауданы әкімдігінің 2020 жылғы 27 наурыздағы № 72 «Қарақия ауданы бойынша 2020 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, ата-ана төлемақысының мөлшерін бекіту туралы» қаулысына өзгеріс енгізу туралы

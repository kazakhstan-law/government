  title:
    rus: О внесении изменений в постановление акимата города Жанаозен Мангистауской области от 30 марта 2021 года № 138 «Об установлении тарифа на регулярные автомобильные перевозки пассажиров и багажа в городском и пригородном сообщении в городе Жанаозен»
    kaz: Маңғыстау облысы Жаңаөзен қалаcы әкімдігінің 2021 жылғы 30 наурыздағы № 138 «Жаңаөзен қаласында жолаушылар мен багажды қалалық және қала маңындағы қатынаста автомобильмен тұрақты тасымалдаудың тарифін белгілеу туралы» қаулысына өзгерістер енгізу туралы

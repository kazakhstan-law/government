  title:
    rus: О внесении изменений и дополнений в постановление акимата Мангистауской области от 26 февраля 2021 года № 48 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства на 2021 год»
    kaz: Маңғыстау облысы әкімдігінің «2021 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» 2021 жылғы 26 ақпандағы № 48 қаулысына өзгерістер мен толықтырулар енгізу туралы

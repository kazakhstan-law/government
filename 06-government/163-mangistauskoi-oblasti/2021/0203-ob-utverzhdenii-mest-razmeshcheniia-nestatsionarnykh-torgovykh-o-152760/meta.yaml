    kaz: Маңғыстау облысының Маңғыстау ауданы әкімдігінің 2021 жылғы 3 ақпандағы №195 «Маңғыстау ауданының аумағында cтационарлық емес сауда объектілерін орналастыру орындарын және маршруттарын айқындау және бекіту туралы» қаулысына өзгерістер енгізу туралы

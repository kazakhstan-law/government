act_code: '161972'
requisite: Постановление акимата Мангистауской области от 3 декабря 2021 года № 288. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 декабря 2021 года № 25900. Утратило силу постановлением акимата Мангистауской области от 12 января 2026 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня особо важных локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения Мангистауской области

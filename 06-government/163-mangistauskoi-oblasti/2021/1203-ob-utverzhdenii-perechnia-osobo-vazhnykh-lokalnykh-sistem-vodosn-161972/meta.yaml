  title:
    rus: О внесении изменения в постановление акимата Мангистауской области от 3 декабря 2021 года № 288 «Об утверждении Перечня особо важных локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения Мангистауской области»
    kaz: Маңғыстау облысы әкімдігінің «Маңғыстау облысының ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды оқшау жүйелерінің тізбесін бекіту туралы» 2021 жылғы 3 желтоқсандағы № 288 қаулысына өзгеріс енгізу туралы

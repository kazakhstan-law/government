  title:
    rus: О внесении изменения в постановление акимата Бейнеуского района от 10 декабря 2021 года № 366 «Об установлении единого для всех маршрутов тарифа на регулярные автомобильные перевозки пассажиров и багажа в селе Бейнеу»
    kaz: «Бейнеу ауылында жолаушылар мен багажды автомобильмен тұрақты тасымалдаудың барлық маршруттары үшін бірыңғай тарифін белгілеу туралы» Бейнеу ауданы әкімдігінің 2021 жылғы 10 желтоқсандағы №366 қаулысына өзгеріс енгізу туралы

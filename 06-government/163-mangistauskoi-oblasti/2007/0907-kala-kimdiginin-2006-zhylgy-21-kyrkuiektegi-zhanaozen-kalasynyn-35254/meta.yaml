requisite: Маңғыстау облысы Жаңаөзен қаласы әкімдігінің 2007 жылғы 7 қыркүйектегі № 3743 қаулы. Маңғыстау облысы Әділет департаменті Жаңаөзен қаласының Әділет басқармасында 2007 жылғы 5 қазанда № 11-2-61 болып тіркелді
title:
  rus: Қала әкімдігінің 2006 жылғы 21 қыркүйектегі «Жаңаөзен қаласының  жалпы білім беретін мектептерінің  түлектеріне Қазақстан Республикасының жоғарғы оқу орындарында оқу ақысын төлеу үшін әлеуметтік көмек тағайындау туралы» № 2050 қаулысына өзгерістер мен  толықтырулар енгізілуі туралы

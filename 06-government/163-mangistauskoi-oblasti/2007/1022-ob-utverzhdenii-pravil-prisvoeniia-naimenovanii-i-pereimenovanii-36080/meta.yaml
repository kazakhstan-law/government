act_code: '36080'
requisite: Постановление Акимата Мангистауской области от 22 октября 2007 года N 364. Зарегистрировано Департаментом юстиции Мангистауской области 5 декабря 2007 года N 1991. Утратило силу постановлением акимата Мангистауской области от 14 июня 2013 года № 171
title:
  rus: Об утверждении Правил присвоения наименований и переименования составных частей населенного пункта, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Мангистауской области
  kaz: Маңғыстау облысының ғимараттары мен имараттарына, жер телімдеріне реттік нөмірлер тағайындаудың талаптарын белгілеудің, елді мекендердің құрамдас бөліктеріне атаулар беру және қайта атау ережесін бекіту туралы

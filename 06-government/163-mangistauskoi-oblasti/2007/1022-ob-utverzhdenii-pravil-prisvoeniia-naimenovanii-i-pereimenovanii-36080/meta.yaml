    rus: О внесении изменений в некоторые постановления акимата Мангистауской области и признании утратившими силу постановлений акимата области
    kaz: Маңғыстау облысы әкімдігінің кейбір қаулыларына өзгерістер енгізу және кейбіреуінің күші жойылды деп тану туралы

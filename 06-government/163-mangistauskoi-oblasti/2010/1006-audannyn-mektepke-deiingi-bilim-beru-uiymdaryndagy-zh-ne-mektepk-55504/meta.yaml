act_code: '55504'
requisite: Маңғыстау облысы Түпқараған ауданы әкімдігінің 2010 жылғы 6 қазандағы № 240 қаулысы. Маңғыстау облысы Түпқараған ауданының Әділет басқармасында 2010 жылғы 17 қарашада № 11-6-126 тіркелді. Күші жойылды - Маңғыстау облысы Түпқараған аудандық әкімдігінің 2012 жылғы 2 шілдедегі № 463 қаулысымен
title:

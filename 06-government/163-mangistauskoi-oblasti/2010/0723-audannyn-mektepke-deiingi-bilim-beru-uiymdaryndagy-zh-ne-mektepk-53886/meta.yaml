requisite: Мұнайлы аудандық әкімдігінің 2010 жылғы 23 шілдедегі № 149-қ қаулысы. Мұнайлы ауданының Әділет басқармасында 2010 жылғы 9 тамызда № 11-7-75 тіркелді. Күші жойылды – Маңғыстау облысы Мұнайлы аудандық мәслихатының 2012 жылғы 16 мамырдағы № 131-қ қаулысымен

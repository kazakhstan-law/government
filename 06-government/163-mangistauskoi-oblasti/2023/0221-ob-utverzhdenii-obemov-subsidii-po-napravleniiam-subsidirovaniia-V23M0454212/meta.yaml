  title:
    rus: О внесении изменения в постановление акимата Мангистауской области от 21 февраля 2023 года № 12 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных на 2023 год»
    kaz: Маңғыстау облысы әкімдігінің 2023 жылғы  21 ақпандағы № 12 «2023 жылға арналған асыл тұқымды мал шаруашылығын дамытуға, мал шаруашылығының өнімділігін және өнім сапасын арттыруға субсидиялау бағыттары бойынша субсидиялар көлемдерін, ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарын және субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

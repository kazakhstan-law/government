requisite: Постановление акимата Тупкараганского района Мангистауской области от 5 апреля 2023 года № 40. Утратило силу постановлением акимата Тупкараганского района Мангистауской области от 19 ноября 2025 года № 172(вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Тупкараганского района», районных исполнительных органов, финансируемых из районного бюджета
  kaz: «Түпқараған ауданы әкімінің аппараты» мемлекеттік мекемесінің, аудандық бюджеттен қаржыландырылатын аудандық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

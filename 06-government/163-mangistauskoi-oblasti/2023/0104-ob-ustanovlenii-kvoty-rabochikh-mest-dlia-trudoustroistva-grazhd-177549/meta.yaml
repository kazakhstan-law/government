act_code: '177549'
requisite: Постановление акимата Тупкараганского района Мангистауской области от 4 января 2023 года № 2
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц освобожденных из мест лишения свободы, лиц состоящих на учете службы пробации на 2023 год
  kaz: Ата - анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота 2023 жылға белгілеу туралы

  requisite: Постановление акимата Бейнеуского района Мангистауской области от 29 апреля 2024 года № 118
  title:
    rus: О внесении изменения в постановление акимата Бейнеуского района 2023 года 20 октября № 283 «Об установлении норматива отчисления части чистого дохода коммунальных государственных предприятий, за исключением организаций среднего образования в организационно-правовой форме государственных предприятий на праве хозяйственного ведения по Бейнеускому району»
    kaz: Бейнеу ауданының әкімдігінің 2023 жылғы 20 қазандағы № 283 «Бейнеу ауданы бойынша шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық-құқықтық нысанындағы орта білім беру ұйымдарын қоспағанда, коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» қаулысына өзгеріс енгізу туралы

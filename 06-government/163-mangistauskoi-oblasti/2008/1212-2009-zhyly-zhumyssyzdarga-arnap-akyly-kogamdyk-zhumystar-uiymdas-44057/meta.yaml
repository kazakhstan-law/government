act_code: '44057'
requisite: Маңғыстау облысы Түпқараған аудандық әкімдігінің 2008 жылғы 12 желтоқсандағы № 816 қаулысы. Маңғыстау облысының Әділет департаменті Түпқараған ауданының Әділет басқармасында 2009 жылғы 24 қаңтарда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-6-83 болып енгізілді

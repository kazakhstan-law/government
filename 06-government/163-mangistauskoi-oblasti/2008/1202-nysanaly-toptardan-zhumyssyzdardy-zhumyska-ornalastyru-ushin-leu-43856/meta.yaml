act_code: '43856'
requisite: Маңғыстау облысы Жаңаөзен қалалық әкімдігінің 2008 жылғы 2 желтоқсандағы № 2012 қаулысы. Маңғыстау облысының Әділет департаменті Жаңаөзен қаласының Әділет басқармасында 2009 жылдың 14 қаңтарында нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-2-99 болып енгізілді

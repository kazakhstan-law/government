act_code: '39688'
requisite: Маңғыстау облысы Қарақия ауданы әкімдігінің 2008 жылғы 3 сәуірдегі № 96 қаулысы. Қарақия ауданының Әділет басқармасында 2008 жылғы 14 мамырда № 11-4-59 болып тіркелді. Күші жойылды - Маңғыстау облысы Қарақия ауданы әкімдігінің 2012 жылғы 7 мамырдағы № 98 қаулысымен

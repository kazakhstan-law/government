act_code: '40026'
requisite: Маңғыстау облысы Мұнайлы ауданы әкімдігінің 2008 жылғы 23 сәуірдегі № 63-қ қаулысы. Маңғыстау облысы  Әділет департаменті Мұнайлы ауданының әділет басқармасында 2008 жылғы 23 мамырда № 11-7-5 болып тіркелді

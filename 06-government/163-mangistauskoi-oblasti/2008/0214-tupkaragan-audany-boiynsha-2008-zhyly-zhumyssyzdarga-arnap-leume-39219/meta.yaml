act_code: '39219'
requisite: Маңғыстау облысы Түпқараған ауданы әкімдігінің 2008 жылғы 14 ақпандағы № 27 қаулысы. Маңғыстау облысы Әділет департаменті Түпқараған ауданының әділет басқармасында 2008 жылғы 13 наурызда  № 11-6-50 болып тіркелді

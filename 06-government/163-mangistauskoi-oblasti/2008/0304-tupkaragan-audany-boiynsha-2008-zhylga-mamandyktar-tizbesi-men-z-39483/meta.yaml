act_code: '39483'
requisite: Маңғыстау облысы Түпқараған ауданы әкімдігінің 2008 жылғы 4 наурыздағы № 42 қаулысы. Маңғыстау облысы Әділет департаменті Түпқараған ауданының әділет басқармасында 2008 жылғы 2 сәуірде  № 11-6-52 болып тіркелді
title:

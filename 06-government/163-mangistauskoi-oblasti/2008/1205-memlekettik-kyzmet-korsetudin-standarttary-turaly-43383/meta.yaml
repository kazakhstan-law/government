requisite: Маңғыстау облысы Мұнайлы ауданы әкімдігінің 2008 жылғы 5 желтоқсандағы № 233 қаулысы. Маңғыстау облысы Мұнайлы ауданының Әділет басқармасында 2008 жылғы 30 желтоқсанда № 11-7-29 тіркелді. Күші жойылды - Маңғыстау облысы Мұнайлы аудандық әкімдігінің 2011 жылғы 28 маусымдағы № 80-қ қаулысымен

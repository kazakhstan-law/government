act_code: '41399'
requisite: Маңғыстау облысы Мұнайлы ауданы әкімдігінің 2008 жылғы 30 маусымдағы № 109-қ қаулысы. Маңғыстау облысы Әділет департаменті Мұнайлы ауданының әділет басқармасында 2008 жылғы 8 тамызда  № 11-7-14 болып тіркелді

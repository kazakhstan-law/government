act_code: '41394'
requisite: Маңғыстау облысы Мұнайлы ауданы әкімдігінің 2008 жылғы 30 маусымдағы № 107-қ қаулысы. Маңғыстау облысы Әділет департаменті Мұнайлы ауданының әділет басқармасында 2008 жылғы 8 тамызда № 11-7-13 болып тіркелді
title:

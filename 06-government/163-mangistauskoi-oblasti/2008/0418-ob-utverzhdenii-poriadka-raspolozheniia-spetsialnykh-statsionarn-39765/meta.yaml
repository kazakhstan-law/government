title:
  rus: Об утверждении Порядка расположения специальных стационарных помещений и правил реализации в них периодической печатной продукции, публикующей материалы эротического характера на территории Мангистауской области
  kaz: Маңғыстау облысы аумағында арнайы станционарлық үй-жайларды орналастыру тәртібі және онда эротикалық сипаттағы материалдар жариялайтын мерзімді баспасөз өнімін өткізу ережесі туралы

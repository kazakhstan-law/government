act_code: '43854'
requisite: Маңғыстау облысы Жаңаөзен қалалық әкімдігінің 2008 жылғы 2 желтоқсандағы № 2010 қаулысы. Маңғыстау облысының Әділет департаменті Жаңаөзен қаласының Әділет басқармасында 2009 жылғы 14 қаңтарда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-2-97 болып енгізілді

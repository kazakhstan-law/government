title:
  rus: Об утверждении Инструкции по использованию средств, предусмотренных в областном бюджете по программе "Кредитование АО "Фонд развития малого предпринимательства" на реализацию государственной инвестиционной политики"
  kaz: '"Мемлекеттік инвестициялық саясатты іске асыруға арналған "ДАМУ" кәсіпкерлікті дамыту қоры" АҚ несиелендіру" бағдарламасы бойынша облыстық бюджетте қаралған қаражатты пайдалану Нұсқаулығын бекіту туралы'

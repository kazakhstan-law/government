    kaz: Маңғыстау облысы әкімдігінің "Мемлекеттік инвестициялық саясатты іске асыруға арналған "ДАМУ" кәсіпкерлікті дамыту қоры" АҚ несиелендіру" бағдарламасы бойынша облыстық бюджетте қаралған қаражатты пайдалану жөніндегі Нұскаулығын бекіту туралы" 2008 жылғы 3 маусымдағы № 404 қаулысына өзгерістер енгізу туралы

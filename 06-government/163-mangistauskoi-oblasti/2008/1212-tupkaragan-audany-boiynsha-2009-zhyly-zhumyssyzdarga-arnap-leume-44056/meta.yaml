act_code: '44056'
requisite: Маңғыстау облысы Түпқараған аудандық әкімдігінің 2008 жылғы 12 желтоқсандағы № 817 қаулысы. Маңғыстау облысының Әділет департаменті Түпқараған ауданының Әділет басқармасында 2009 жылғы 24 қаңтарда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-6-82 болып енгізілді

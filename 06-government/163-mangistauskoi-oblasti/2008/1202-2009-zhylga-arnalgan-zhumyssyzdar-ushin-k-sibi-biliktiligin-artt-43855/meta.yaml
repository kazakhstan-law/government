act_code: '43855'
requisite: Маңғыстау облысы Жаңаөзен қалалық әкімдігінің 2008 жылғы 2 желтоқсандағы № 2011 қаулысы. Маңғыстау облысының Әділет департаменті Жаңаөзен қаласының Әділет басқармасында 2009 жылғы 14 қаңтарда ормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-2-98 болып енгізілді

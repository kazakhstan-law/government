requisite: Постановление акимата Мангистауского района Мангистауской области от 15 июля 2013 года № 243. Зарегистрировано Департаментом юстиции Мангистауской области 19 июля 2013 года № 2272. Утратило силу постановлением акимата Мангистауского района  Мангистауской области от 07  июля  2016 года № 220
title:
  rus: Об определений мест для размещения агитационных печатных материалов кандидатов в период проведения выборов акимов сельских округов и сел не входящих в состав сельского округа на территории Мангистауского района
  kaz: Маңғыстау ауданының аумағында ауылдық округ және ауылдық округ құрамына кірмейтін ауыл әкімдерін сайлауды өткізу кезеңінде кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

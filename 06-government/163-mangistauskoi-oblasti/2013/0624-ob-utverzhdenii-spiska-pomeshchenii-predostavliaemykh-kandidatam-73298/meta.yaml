requisite: Постановление акимата Бейнеуского района Мангистауской области от 24 июня 2013 года № 60. Зарегистрировано Департаментом юстиции Мангистауской области 2 июля 2013 года № 2259. Утратило силу постановлением акимата Бейнеуского района Мангистауской области от 17 мая 2017 года № 95
title:

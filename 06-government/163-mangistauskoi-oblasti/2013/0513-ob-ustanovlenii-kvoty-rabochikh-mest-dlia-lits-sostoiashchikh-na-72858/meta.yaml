act_code: '72858'
requisite: Постановление Тупкараганского районного акимата Мангистауской области от 13 май 2013 года № 112. Зарегистрировано Департаментом юстиции Мангистауской области 4 июня 2013 года № 2249. Утратило силу постановлением Тупкараганского районного акимата Мангистауской области от 9 декабря 2016 года № 236
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно - исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в Тупкараганском районе
  kaz: Түпқараған ауданында қылмыстық - атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

act_code: '71389'
requisite: Постановление Мангистауского районного акимата Мангистауской области от 27 февраля 2013 года N 55. Зарегистрировано Департаментом юстиции Мангистауской области 12 марта 2013 года за N 2223. Утратило силу постановлением акимата Мангистауского района  Мангистауской области от 07  июля  2016 года № 220
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в Мангистауском районе
  kaz: Маңғыстау ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

act_code: '73300'
requisite: Постановление акимата Мунайлинского района Мангистауской области от 12 июня 2013 года № 123-қ. Зарегистрировано Департаментом юстиции Мангистауской области 05 июля 2013 года N 2261. Утратило силу постановлением акимата Мунайлинского района Мангистауской области от 20 мая 2016 года № 125-қ
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно- исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в Мунайлинском районе
  kaz: Мұнайлы ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

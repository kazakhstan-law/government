act_code: '74544'
requisite: Постановление акимата Каракиянского района Мангистауской области от 12 сентября 2013 года № 184. Зарегистрировано Департаментом юстиции Мангистауской области 27 сентября 2013 года № 2300. Утратило силу постановлением акимата Каракиянского района Мангистауской области от 23 мая 2016 года № 151
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в Каракиянском районе
  kaz: Қарақия ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

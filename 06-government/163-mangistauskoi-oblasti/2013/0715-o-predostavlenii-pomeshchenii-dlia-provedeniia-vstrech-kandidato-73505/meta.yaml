requisite: Постановление Мангистауского районного акимата Мангистауской области от 15 июля 2013 года № 242. Зарегистрировано Департаментом юстиции Мангистауской области 19 июля 2013 года № 2274. Утратило силу постановлением акимата Мангистауского района  Мангистауской области от 07  июля  2016 года № 220
title:
  rus: О предоставлении помещений для проведения встреч кандидатов с избирателями на договорной основе в период проведения выборов акимов сельских округов и сел не входящих в состав сельского округа на территории Мангистауского района
  kaz: Маңғыстау ауданының аумағында ауылдық округ және ауылдық округ құрамына кірмейтін ауыл әкімдерін сайлауды өткізу кезеңінде кандидаттарға сайлаушылармен кездесу өткізу үшін шарттық негізде үй-жайларды беру туралы

act_code: '46745'
requisite: Маңғыстау облысы Мұнайлы аудандық әкімдігінің 2009 жылғы 1 маусымдағы № 123 шешімі. Маңғыстау облысы Мұнайлы ауданының Әділет басқармасында 2009 жылғы 3 шілдеде № 11-7-54 тіркелді. Күші жойылды - Маңғыстау облысы Бейнеу аудандық әкімдігінің 2014 жылғы 24 қыркүйектегі № 157 қаулысымен.
title:

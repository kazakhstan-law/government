requisite: Маңғыстау облысы Қарақия ауданы әкімдігінің 2009 жылғы 27 ақпандағы № 54 қаулысы. Қарақия ауданының Әділет басқармасында 2009 жылғы 26 наурызда № 11-4-80 тіркелді. Күші жойылды - Маңғыстау облысы Қарақия ауданы әкімдігінің 2012 жылғы 26 қаңтардағы № 8 қаулысымен

requisite: Маңғыстау облысы Жаңаөзен қаласы әкімдігінің 2009 жылғы 23 желтоқсандағы № 1829 қаулысы. Маңғыстау облысының Әділет департаменті Жаңаөзен қаласының Әділет басқармасында 2009 жылғы 30 желтоқсанда № 11-2-127 тіркелді. Күші жойылды - Маңғыстау облысы Жаңаөзен қаласы әкімдігінің 2010 жылғы 29 желтоқсандағы № 947 қаулысымен

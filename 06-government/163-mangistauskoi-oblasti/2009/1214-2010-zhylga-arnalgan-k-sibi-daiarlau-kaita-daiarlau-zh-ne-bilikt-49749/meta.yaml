requisite: Маңғыстау облысы Жаңаөзен қаласы әкімдігінің 2009 жылғы 14 желтоқсандағы № 1741 қаулысы. Жаңаөзен қаласының Әділет басқармасында 2009 жылғы 30 желтоқсанда № 11-2-125 тіркелді. Күші жойылды - Жаңаөзен қаласы әкімдігінің 2010 жылғы 29 желтоқсандағы № 950 қаулысымен

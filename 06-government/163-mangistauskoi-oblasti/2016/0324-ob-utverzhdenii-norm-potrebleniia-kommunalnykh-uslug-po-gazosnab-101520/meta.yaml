  title:
    rus: О внесении изменения в постановление акимата Мангистауской области от 24 марта 2016 года № 79 «Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в Мангистауской области»
    kaz: Маңғыстау облысы әкімдігінің «Маңғыстау облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау бойынша коммуналдық қызметтерді тұтыну нормаларын бекіту туралы» 2016 жылғы 24 наурыздағы № 79 қаулысына өзгеріс енгізу туралы

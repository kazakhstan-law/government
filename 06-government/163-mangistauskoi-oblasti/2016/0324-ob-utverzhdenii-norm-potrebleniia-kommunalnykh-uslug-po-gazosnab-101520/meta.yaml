title:
  rus: Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению,  водоотведению и теплоснабжению для  потребителей, не имеющих приборов учета   в Мангистауской области
  kaz: Маңғыстау облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау бойынша коммуналдық қызметтерді тұтыну нормаларын бекіту туралы

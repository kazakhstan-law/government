  kaz: «Түпқараған ауданы әкімінің аппараты» мемлекеттік мекемесінің, аудандық бюджеттен қаржыландырылатын аудандық атқарушы органдарының қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы

act_code: '103884'
requisite: Постановление акимата Мангистауской области от 31 мая 2016 года № 154. Зарегистрировано Департаментом юстиции Мангистауской области от 04 июля 2016 года № 3076. Утратило силу постановлением акимата Мангистауской области от 20 марта 2020 года № 44
title:
  rus: Об утверждении регламента государственной  услуги по приему  документов для прохождения аттестации  на присвоение (подтверждение)  квалификационных категорий  педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и  профессионального, послесреднего образования
  kaz: Мектепке дейінгі тәрбие мен оқыту,бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

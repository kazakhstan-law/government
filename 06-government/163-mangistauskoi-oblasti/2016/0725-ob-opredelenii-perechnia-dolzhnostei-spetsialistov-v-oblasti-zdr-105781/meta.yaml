  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы

  title:
    rus: О внесении изменения в постановление акимата Мангистауской области от 25 июля 2016 года № 233 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии и лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Маңғыстау облысы әкімдігінің 2016 жылғы 25 шілдедегі № 233 қаулысына өзгеріс енгізу туралы

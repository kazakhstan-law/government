    kaz: Маңғыстау облысы әкімдігінің 2016 жылғы 25 шілдедегі № 233 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

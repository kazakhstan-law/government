act_code: '108466'
requisite: Постановление акимата Тупкараганского района Мангистауской области от 9 декабря 2016 года № 236. Зарегистрировано Департаментом юстиции Мангистауской области 27 декабря 2016 года № 3225. Утратило силу постановлением акимата Тупкараганского района Мангистауской области от 21 ноября 2022 года № 222
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц освобожденных из мест лишения свободы, лиц состоящих на учете службы пробации
  kaz: "Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды,\tбас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы"

act_code: '101063'
requisite: Постановление акимата Каракиянского района Мангистауской области от 18 марта 2016 года № 67. ЗарегистрированМаңғыстау облысы Қарақия ауданы әкімдігінің 2016 жылғы 18 наурыздағы № 67 қаулысы.
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2016 год по Каракиянскому району
  kaz: Қарақия ауданы бойынша 2016 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата - ананың ақы төлеу мөлшерін бекіту туралы

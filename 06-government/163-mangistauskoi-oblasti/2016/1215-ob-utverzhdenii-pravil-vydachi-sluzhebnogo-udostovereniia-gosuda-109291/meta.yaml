act_code: '109291'
requisite: Постановление акимата города Актау Мангистауской области от 15 декабря 2016 года № 2282. Зарегистрировано Департаментом юстиции Мангистауской области 20 января 2017 года № 3261. Утратило силу постановлением акимата города Актау Мангистауской области от 7 августа 2020 года № 1327
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственного учреждения "Аппарат акима города Актау", государственного учреждения "Аппарат акима села Умирзак" и городских исполнительных органов, финансируемых из городского бюджета и его описание
  kaz: '"Ақтау қаласы әкімінің аппараты" мемлекеттік мекемесінің, "Өмірзақ ауылы әкімінің аппараты" мемлекеттік мекемесі мен қалалық бюджеттен қаржыландырылатын қалалық атқарушы органдарының қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы'

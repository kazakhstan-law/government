act_code: '108684'
requisite: Постановление акимата Бейнеуского района Мангистауской области от 2 декабря 2016 года № 259. Зарегистрировано Департаментом юстиции Мангистауской области 5 января 2017 года № 3236. Утратило силу постановлением акимата Бейнеуского района Мангистауской области от 10 июля 2020 года № 170
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственного учреждения «Аппарат акима Бейнеуского района», аппаратов акимов сел, сельских округов Бейнеуского района, исполнительных органов, финансируемых из бюджета Бейнеуского района и его описание
  kaz: «Бейнеу ауданы әкімінің аппараты» мемлекеттік мекемесінің, Бейнеу ауданының ауылдар, ауылдық округтер әкімдерінің аппараттарының, Бейнеу ауданының бюджетінен қаржыландырылатын атқарушы органдардың қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы

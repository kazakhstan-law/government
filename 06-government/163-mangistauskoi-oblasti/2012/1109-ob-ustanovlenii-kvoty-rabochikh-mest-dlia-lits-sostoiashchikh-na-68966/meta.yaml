requisite: Постановление акимата города Актау от 9 ноября 2012 года № 1025. Зарегистрировано Департаментом юстиции Мангистауской области 7 декабря 2012 года  № 2169. Утратило силу- постановлением акимата города Актау Мангистауской области от 2 апреля 2014 года № 434
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін,сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін  және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгiлеу туралы

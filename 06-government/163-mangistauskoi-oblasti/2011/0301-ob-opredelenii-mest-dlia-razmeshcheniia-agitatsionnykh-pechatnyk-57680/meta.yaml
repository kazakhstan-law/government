  title:
    rus: О внесении изменений в постановление акимата Тупкараганского района от 1 марта 2011 года № 38 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и оснащении их стендами, щитами, тумбами по Тупкараганскому району»
    kaz: Түпқараған ауданы әкімдігінің 2011 жылғы 1 наурыздағы № 38 «Түпқараған ауданы бойынша барлық кандидаттарға үгіттік баспа материалдарын орналастыру орындарын белгілеу және оларды стендтермен, тақталармен, тұғырлықтармен жарақтандыру туралы» қаулысына өзгерістер енгізу туралы

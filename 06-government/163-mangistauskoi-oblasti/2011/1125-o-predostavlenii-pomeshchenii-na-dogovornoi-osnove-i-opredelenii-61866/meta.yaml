requisite: Постановление акимата города Актау от 25 ноября 2011 года № 1510. Зарегистрировано Департаментом юстиции Мангистауской области 12 декабря 2011 года № 11-1-167. Утратило силу постановлением акимата города Актау Мангистауской области от 11 декабря 2017 года № 2438
title:
  rus: О предоставлении помещений на договорной основе и определении мест для размещения агитационных печатных материалов на территории города Актау для встреч кандидатов с избирателями
  kaz: Ақтау қаласы аумағында кандидаттардың сайлаушылармен кездесу өткізу үшін шарттық негізде үй-жайларды беру және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

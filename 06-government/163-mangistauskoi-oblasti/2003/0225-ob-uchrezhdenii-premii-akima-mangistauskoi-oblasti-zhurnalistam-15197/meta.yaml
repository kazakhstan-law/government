act_code: '15197'
requisite: Постановление акимата Мангистауской области от 25 февраля 2003 года № 52. Зарегистрировано Управлением юстиции Мангистауской области 14 марта 2003 года № 1417. Утратило силу по истечению срока действия - письмом департамента  юстиции Мангистауской области от 10 января 2005 года № 2/46
title:

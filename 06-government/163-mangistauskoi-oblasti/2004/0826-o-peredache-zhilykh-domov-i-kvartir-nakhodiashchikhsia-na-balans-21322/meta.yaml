title:
  rus: О передаче жилых домов и квартир, находящихся на балансе областного управления труда, занятости и социальной защиты населения, в жилищные фонды акимов городов Актау, Жанаозен и Каракиянского района
  kaz: Облыстық еңбек, халықты жұмыспен қамту және әлеуметтік қорғау басқармасы  балансында тұрған тұрғын үйлер мен пәтерлерді Ақтау, Жаңаөзен қалалары мен  Қарақия ауданы әкімдерінің тұрғын үй қорларына беру туралы

  title:
    rus: О внесении дополнения в постановление акимата Мангистауской области от 27 августа 2004 года № 183 "О передаче жилых домов и квартир, находящихся на балансе областного управления труда, занятости и  социальной защиты населения, в жилищные фонды акимов городов Актау, Жанаозен и Каракиянского района" (зарегистрировано в Департаменте юстиции 21 сентября 2004 года № 1755)
    kaz: Маңғыстау облысы әкімиятының "Облыстық еңбек, халықты жұмыспен қамту және әлеуметтік қорғау басқармасы балансында тұрған тұрғын үйлер мен пәтерлерді Ақтау, Жаңаөзен қалалары мен Қарақия ауданы әкімдерінің тұрғын үй қорларына беру туралы" 2004 жылғы 27 тамыздағы № 183 қаулысына (әділет Департаментінде 2004 жылы 21 қыркүйекте № 1755 болып тіркелген) толықтыру енгізу туралы

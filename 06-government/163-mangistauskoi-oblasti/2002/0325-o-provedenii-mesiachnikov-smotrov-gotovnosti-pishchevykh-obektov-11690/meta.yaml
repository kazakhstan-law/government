requisite: Постановление акимата  Мангистауской области от 25 марта 2002 года № 70. Зарегистрировано Управлением юстиции Мангистауской области 28 марта 2002 года № 776.  Утратило силу по истечению срока действия - письмом департамента  юстиции Мангистауской области от 10 января 2005 года № 2/46
title:

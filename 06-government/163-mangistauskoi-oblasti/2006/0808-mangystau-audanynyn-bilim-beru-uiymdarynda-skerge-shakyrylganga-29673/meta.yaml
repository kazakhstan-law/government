act_code: '29673'
requisite: Маңғыстау облысы Маңғыстау ауданы әкімдігінің 2006 жылғы 8 тамыздағы № 93 қаулысы. Маңғыстау облысы Әділет департаменті Маңғыстау ауданының әділет басқармасында 2008 жылғы 11 қыркүйіекте  № 11-5-28 болып тіркелді

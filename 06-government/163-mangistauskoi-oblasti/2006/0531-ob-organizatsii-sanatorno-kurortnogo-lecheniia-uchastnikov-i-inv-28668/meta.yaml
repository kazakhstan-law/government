title:
  rus: Об организации санаторно-курортного лечения участников и инвалидов Великой Отечественной войны, лиц, приравненных к ним, граждан, трудившихся и проходивших воинскую службу в тылу, лиц, которым назначены пенсии за особые заслуги перед Республикой Казахстан и областью
  kaz: Ұлы Отан соғысының қатысушылары мен мүгедектерін, оларға теңестірілген адамдарды, тылда еңбек етіп, әскери қызмет өткерген азаматтарды, Қазақстан республикасына және облысқа сіңірген ерекше еңбегі үшін зейнетақы тағайындалған адамдарды санаторлық-курорттық емдеуді ұйымдастыру туралы

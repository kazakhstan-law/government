act_code: '31415'
requisite: Маңғыстау облысы Маңғыстау ауданы әкімдігінің 2006 жылғы 25 желтоқсандағы № 165 қаулысы. Маңғыстау облысы Әділет департаменті Маңғыстау ауданының әділет басқармасында 2007 жылғы 10 қаңтарда  № 11-5-35 болып тіркелді. Күші жойылды - Маңғыстау облысы Маңғыстау ауданы әкімдігінің 2022 жылғы 14 ақпандағы № 38 қаулысымен

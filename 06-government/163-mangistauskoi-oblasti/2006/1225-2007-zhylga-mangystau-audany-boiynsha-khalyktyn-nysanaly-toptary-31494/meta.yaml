act_code: '31494'
requisite: Маңғыстау облысы Маңғыстау ауданы әкімдігінің 2006 жылғы 25 желтоқсандағы № 171 қаулысы. Маңғыстау облысы Әділет департаменті Маңғыстау ауданының әділет басқармасында 2007 жылғы 25 қаңтарда № 11-5-36 болып тіркелді

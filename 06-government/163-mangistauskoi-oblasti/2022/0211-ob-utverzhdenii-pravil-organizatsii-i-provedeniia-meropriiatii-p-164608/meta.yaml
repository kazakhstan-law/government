  title:
    rus: О внесении изменения в постановление акимата Бейнеуского района от 11 февраля 2022 года № 27 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных  на придание единого архитектурного облика Бейнеускому району»
    kaz: «Бейнеу ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Бейнеу ауданы әкімдігінің 2022 жылғы 11 ақпандағы № 27 қаулысына өзгеріс енгізу туралы

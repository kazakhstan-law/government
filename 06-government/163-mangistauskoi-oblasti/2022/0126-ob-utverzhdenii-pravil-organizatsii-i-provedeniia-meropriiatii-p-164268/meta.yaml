  title:
    rus: О внесении изменений в постановление акимата Каракиянского района от 26 января 2022 года № 16 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Каракиянского района»
    kaz: Қарақия ауданы әкімдігінің 2022 жылғы 26 қаңтардағы № 16 «Қарақия ауданына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Мунайлинского района от 11 октября 2022 года № 250-қ «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика по Мунайлинскому району»
    kaz: «Мұнайлы ауданы бойынша бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Мұнайлы ауданы әкімдігінің 2022 жылғы 11 қазандағы № 250-қ қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/208794/rus

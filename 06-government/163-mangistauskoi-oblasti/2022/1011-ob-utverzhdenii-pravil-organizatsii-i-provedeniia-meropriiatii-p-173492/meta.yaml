act_code: '173492'
requisite: Постановление акимата Мунайлинского района Мангистауской области от 11 октября 2022 года № 250-қ. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 ноября 2022 года № 30423
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Мунайлинскому району
  kaz: Мұнайлы ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

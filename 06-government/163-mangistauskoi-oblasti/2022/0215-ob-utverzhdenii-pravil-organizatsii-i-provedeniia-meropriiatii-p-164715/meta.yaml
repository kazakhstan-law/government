  title:
    rus: О внесении изменения в постановление акимата города Актау от 15 февраля 2022 года № 02-02/236 «Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Актау»
    kaz: Ақтау қаласының әкімдігінің 2022 жылғы 15 ақпандағы № 02-02/236 «Ақтау қаласына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

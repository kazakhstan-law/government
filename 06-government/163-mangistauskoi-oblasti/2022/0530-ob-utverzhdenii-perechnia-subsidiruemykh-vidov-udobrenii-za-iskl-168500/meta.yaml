requisite: Постановление акимата Мангистауской области от 30 мая 2022 года № 79. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 июня 2022 года № 28365
title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2022 год
  kaz: 2022 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литр, килограмм) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы

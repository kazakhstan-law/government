title:
  rus: Об утверждении механизма определения объемов сжиженного нефтяного газа для владельцев газонаполнительных станций, газонаполнительных пунктов, групповых резервуарных установок, автогазозаправочных станций по Мангистауской области
  kaz: Маңғыстау облысы бойынша газ толтыру станцияларының, газ толтыру пункттерінің, топтық резервуарлық қондырғылардың, автогаз құю станцияларының иелері үшін сұйытылған мұнай газы көлемдерін айқындау тетігін бекіту туралы

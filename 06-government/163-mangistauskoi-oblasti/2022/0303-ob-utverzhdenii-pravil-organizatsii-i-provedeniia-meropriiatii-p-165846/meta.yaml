  title:
    rus: О внесении изменений в постановление акимата города Жанаозен от 3 марта 2022 года № 98 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Жанаозен»
    kaz: Жаңаөзен қаласы әкімдігінің 2022 жылғы 3 наурыздағы № 98 «Жаңаөзен қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Мангистауского района от 25 июля 2022 года № 211 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Мангистауского района»
    kaz: «Маңғыстау ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Маңғыстау ауданы әкімдігінің 2022 жылғы 25 шілдедегі № 211 қаулысына өзгерістер енгізу туралы

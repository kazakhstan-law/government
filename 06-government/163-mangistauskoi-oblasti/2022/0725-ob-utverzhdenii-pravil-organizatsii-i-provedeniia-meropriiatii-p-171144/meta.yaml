requisite: Постановление акимата Мангистауского района Мангистауской области от 25 июля 2022 года № 211. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 сентября 2022 года № 29361
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Мангистаускому району
  kaz: Маңғыстау ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Мангистауской области от 14 апреля 2022 года № 54 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных на 2022 год»
    kaz: Маңғыстау облысы әкімдігінің 2022 жылғы 14 сәуірдегі № 54  «2022  жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарын және субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

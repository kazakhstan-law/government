act_code: '111740'
requisite: Постановление акимата Каракиянского района Мангистауской области от 24 марта 2017 года № 82. Зарегистрировано Департаментом юстиции Мангистауской области 26 апреля 2017 года № 3347. Утратило силу постановлением акимата Каракиянского района Мангистауской области от 18 июня 2020 года № 119
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственного учреждения «Аппарат акима Каракиянского района», аппаратов акимов сел, сельских округов Каракиянского района, исполнительных органов, финансируемых из бюджета Каракиянского района и его описание
  kaz: «Қарақия ауданы әкімінің аппараты» мемлекеттік мекемесінің, Қарақия ауданының ауылдар, ауылдық округтер әкімдерінің аппараттарының, Қарақия ауданының бюджетінен қаржыландырылатын атқарушы органдардың қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы

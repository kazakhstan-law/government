requisite: Постановление акимата Мунайлинского района Мангистауской области от 7 апреля 2017 года № 73-қ. Зарегистрировано Департаментом юстиции Мангистауской области 20 апреля 2017 года № 3335. Утратило силу постановлением акимата Мунайлинского района Мангистауской области от 12 марта 2018 года № 77-қ
title:

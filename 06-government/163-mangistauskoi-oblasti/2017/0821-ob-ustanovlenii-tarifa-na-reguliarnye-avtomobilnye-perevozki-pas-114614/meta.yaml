  title:
    rus: О внесении изменений в постановление акимата  города Жанаозен от 21 августа  2017 года  № 580 «Об установлении тарифа на регулярные автомобильные перевозки пассажиров и багажа в городском и пригородном сообщении в городе Жанаозен»
    kaz: Жаңаөзен қаласы әкімдігінің 2017 жылғы 21 тамыздағы № 580 «Жаңаөзен қаласында жолаушылар мен багажды қалалық және қала маңындағы қатынаста автомобильмен тұрақты тасымалдаудың тарифін белгілеу туралы» қаулысына өзгерістер енгізу туралы

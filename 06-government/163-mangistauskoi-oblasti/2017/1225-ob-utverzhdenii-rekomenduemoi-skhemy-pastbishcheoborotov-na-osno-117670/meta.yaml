  title:
    rus: О внесении изменений в постановление акимата Каракиянского района от 25 декабря 2017 года № 277 «Об утверждении схемы пастбищеоборотов по Каракиянскому району на основании геоботанического обследования пастбищ»
    kaz: Қарақия ауданы әкімдігінің 2017 жылғы 25 желтоқсандағы № 277 «Жайылымдарды геоботаникалық зерттеп-қарау негізінде Қарақия ауданы бойынша жайылым айналымдарының схемасын бекіту туралы» қаулысына өзгерістер енгізу туралы

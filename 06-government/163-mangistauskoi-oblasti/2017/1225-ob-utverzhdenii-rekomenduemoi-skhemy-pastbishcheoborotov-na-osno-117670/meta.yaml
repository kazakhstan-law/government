  title:
    rus: О внесении изменений в постановление акимата Каракиянского района от 25 декабря 2017 года № 277 «Об утверждении схемы пастбищеоборотов на основании геоботанического обследования пастбищ по Каракиянскому району»
    kaz: Қарақия ауданы әкімдігінің 2017 жылғы 25 желтоқсандағы № 277 «Қарақия ауданы бойынша жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемасын бекіту туралы» қаулысына өзгерістер енгізу туралы

act_code: '111750'
requisite: Постановление акимата Бейнеуского района Мангистауской области от 24 марта 2017 года № 53. Зарегистрировано Департаментом юстиции Мангистауской области 27 апреля 2017 года № 3349. Утратило силу постановлением акимата Бейнеуского района Мангистауской области от 26 марта 2018 года № 39
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Бейнеуского района», аппаратов акимов сел,  сельских округов Бейнеуского района, исполнительных органов, финансируемых из бюджета Бейнеуского района
  kaz: «Бейнеу ауданы әкімінің аппараты» мемлекеттік мекемесінің, Бейнеу ауданының ауылдар, ауылдық округтер әкімдерінің аппараттарының, Бейнеу ауданының бюджетінен қаржыландырылатын  атқарушы  органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

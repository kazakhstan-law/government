requisite: Постановление акимата Мангистауского района Мангистауской области от 6 февраля 2017 года № 35. Зарегистрировано Департаментом юстиции Мангистауской области 17 февраля 2017 года № 3273
title:
  rus: О  признании  утратившим  силу постановления  акимата  Мангистауского района  от  31 марта  2016 года  №98 «Об  утверждении  Методики  оценки деятельности  административных  государственных  служащих  корпуса «Б»  государственного  учреждения  «Аппарат  акима  Мангистауского  района», районных  исполнительных  органов, финансируемых  из районного  бюджета»
  kaz: Маңғыстау ауданы әкімдігінің 2016  жылғы  31 наурыздағы №98 «Маңғыстау  ауданы  әкімінің  аппараты»   мемлекеттік  мекемесінің, аудандық бюджеттен  қаржыландырылатын аудандық  атқарушы  органдарының  «Б»  корпусы  мемлекеттік  әкімшілік қызметшілерінің  қызметін  бағалаудың әдістемесін  бекіту  туралы»  қаулысының күші  жойылды  деп  тану  туралы

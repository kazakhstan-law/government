requisite: Постановление акимата города Жанаозен Мангистауской области от 8 февраля 2017 года № 79. Зарегистрировано Департаментом юстиции Мангистауской области 10 марта 2017 года № 3287. Утратило силу постановлением акимата города Жанаозен Мангистауской области от 20 марта 2018 года № 153
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Жанаозен» и исполнительных  органов, финансируемых из местного бюджета
  kaz: «Жаңаөзен қаласы әкімінің аппараты» мемлекеттік мекемесінің және  жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

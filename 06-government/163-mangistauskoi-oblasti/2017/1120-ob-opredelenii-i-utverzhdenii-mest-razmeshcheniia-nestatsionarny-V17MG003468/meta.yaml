    kaz: «Мұнайлы ауданының аумағында cтационарлық емес сауда объектілерін орналастыру орындарын айқындау және бекіту туралы» Мұнайлы ауданы әкімдігінің 2017 жылғы 20 қарашадағы № 238-қ қаулысына өзгеріс енгізу туралы

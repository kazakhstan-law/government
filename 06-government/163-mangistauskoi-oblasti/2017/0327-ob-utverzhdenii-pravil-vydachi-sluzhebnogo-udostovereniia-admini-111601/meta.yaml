act_code: '111601'
requisite: Постановление акимата города Жанаозен Мангистауской области от 27 марта 2017 года № 138. Зарегистрировано Департаментом юстиции Мангистауской области 26 апреля 2017 года № 3344. Утратило силу постановлением акимата города Жанаозен Мангистауской области от 24 июня 2020 года № 359
title:
  rus: Об утверждении Правил выдачи служебного удостоверения  административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Жанаозен» и исполнительных органов, финансируемых из местного бюджета и его описание
  kaz: «Жаңаөзен қаласы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметтік куәлігін беру қағидалары мен оның сипаттамасын бекіту туралы

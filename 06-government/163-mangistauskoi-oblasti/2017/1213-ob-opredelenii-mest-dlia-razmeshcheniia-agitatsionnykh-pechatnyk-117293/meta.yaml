title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов в Каракиянском районе
  kaz: Қарақия ауданында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

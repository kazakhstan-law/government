  title:
    rus: О внесении изменений в постановление акимата Каракиянского района от 13 декабря 2017 года № 262 «О предоставлении помещений кандидатам на договорной основе для встречи с избирателями и определение мест для размещения агитационных печатных материалов в период выборов»
    kaz: Қарақия ауданы әкімдігінің 2017 жылғы 13 желтоқсандағы № 262 «Сайлаулар кезінде сайлаушылармен кездесуі үшін кандидаттарға шарттық негізде үй-жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы» қаулысына өзгерістер енгізу туралы

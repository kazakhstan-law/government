act_code: '110860'
requisite: Постановление акимата города Актау Мангистауской области от 14 марта 2017 года № 512. Зарегистрировано Департаментом юстиции Мангистауской области 30 марта 2017 года № 3303
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лицы  освобожденных из мест лишения свободы и состоящих на учете службы пробации по городу Актау на 2017 год
  kaz: Ақтау қаласы бойынша 2017 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы  азаматтарды, бас бостандығынан айыру орындарынан босатылған  және пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін  жұмыс орындарына квота белгілеу туралы

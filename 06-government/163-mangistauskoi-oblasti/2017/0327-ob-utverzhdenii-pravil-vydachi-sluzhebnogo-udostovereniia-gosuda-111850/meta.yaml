act_code: '111850'
requisite: Постановление акимата Мангистауского района Мангистауской области от 27 марта 2017 года № 91. Зарегистрировано Департаментом юстиции Мангистауской области 28 апреля 2017 года № 3350. Утратило силу постановлением акимата Мангистауского района Мангистауской области от 18 июня 2020 года № 133
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственного учреждения «Аппарат акима Мангистауского района», аппаратов акимов сел, сельских округов Мангистауского района,  районных исполнительных органов, финансируемых из районного бюджета и его описание
  kaz: «Маңғыстау ауданы әкімінің аппараты» мемлекеттік мекемесінің, Маңғыстау ауданының ауылдар, ауылдық округтер әкімдері аппараттарының, аудандық бюджеттен қаржыландырылатын аудандық  атқарушы органдарының қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы

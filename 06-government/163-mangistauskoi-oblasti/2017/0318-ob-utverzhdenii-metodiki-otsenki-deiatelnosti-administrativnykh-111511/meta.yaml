requisite: Постановление акимата города Актау Мангистауской области от 18 марта 2017 года № 555. Зарегистрировано Департаментом юстиции Мангистауской области 14 апреля 2017 года № 3330. Утратило силу постановлением акимата города Актау Мангистауской области от 2 апреля 2018 года № 645
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Актау», государственного учреждения «Аппарат акима села Умирзак» и городских исполнительных органов, финансируемых из местного бюджета
  kaz: «Ақтау қаласы әкімінің аппараты» мемлекеттік мекемесінің, «Өмірзақ ауылы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыландырылатын қалалық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

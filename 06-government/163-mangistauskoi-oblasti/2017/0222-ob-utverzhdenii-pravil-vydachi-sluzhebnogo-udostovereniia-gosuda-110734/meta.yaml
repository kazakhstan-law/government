act_code: '110734'
requisite: Постановление акимата Мунайлинского района Мангистауской области от 22 февраля 2017 года № 33-қ. Зарегистрировано Департаментом юстиции Мангистауской области 30 марта 2017 года № 3302. Утратило силу постановлением акимата Мунайлинского района Мангистауской области от 7 июля 2020 года № 182-қ
title:
  rus: Об утверждении правил выдачи служебного удостоверения государственного учреждения «Аппарат акима Мунайлинского района», аппаратов акимов сел, сельских округов Мунайлинского  района, районных исполнительных органов, финансируемых из районного бюджета и его описание
  kaz: «Мұнайлы ауданы әкімінің аппараты» мемлекеттік мекемесінің, Мұнайлы ауданының ауылдар мен ауылдық округтер әкімдері аппараттарының, аудандық бюджеттен қаржыландырылатын аудандық атқарушы органдарының қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы

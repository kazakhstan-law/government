  title:
    rus: О внесении изменений и дополнения в постановление акимата Мангистауской области от 6 октября 2017 года № 229 «Об утверждении размера выплаты ежемесячного денежного содержания спортсменам Мангистауской области»
    kaz: Маңғыстау облысы әкімдігінің 2017 жылғы 6 қазандағы № 229 «Маңғыстау облысының спортшыларына ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы» қаулысына өзгерістер мен толықтыру енгізу туралы

act_code: '115285'
requisite: Постановление акимата Мангистауской области от 6 октября 2017 года № 229. Зарегистрировано Департаментом юстиции Мангистауской области 17 октября 2017 года № 3440. Утратило силу постановлением акимата Мангистауской области от 21 июля 2026 года № 116 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размеров выплат ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам
  kaz: Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерлерін бекіту туралы

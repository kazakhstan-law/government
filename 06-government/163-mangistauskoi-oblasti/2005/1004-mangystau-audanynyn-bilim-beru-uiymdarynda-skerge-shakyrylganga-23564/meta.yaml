act_code: '23564'
requisite: Маңғыстау облысы Маңғыстау ауданы әкімдігінің 2005 жылғы 4 қазандағы № 152 қаулысы. Маңғыстау облысы Әділет департаменті Маңғыстау ауданының әділет басқармасында 2005 жылғы 4 қазанда № 11-5-14 болып тіркелді

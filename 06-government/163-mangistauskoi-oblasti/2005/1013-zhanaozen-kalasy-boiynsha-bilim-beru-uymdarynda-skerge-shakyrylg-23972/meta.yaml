act_code: '23972'
requisite: Маңғыстау облысы Жаңаөзен қаласы әкімдігінің 2005 жылғы 15 қазандағы № 1325 қаулы. Маңғыстау облысы Әділет департаменті Жаңаөзен қаласының Әділет басқармасында 2005 жылғы 29 қазанда № 11-2-13 болып тіркелді
title:

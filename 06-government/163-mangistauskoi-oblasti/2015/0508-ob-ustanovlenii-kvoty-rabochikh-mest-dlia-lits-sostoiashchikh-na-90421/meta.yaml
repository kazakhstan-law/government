  title:
    rus: О внесении изменений в постановление акимата города Жанаозен от 08 мая 2015 года № 560 «Об установлении квоты  рабочих мест для лиц, состоящих на учете службы пробации уголовно- исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций»
    kaz: Жаңаөзен қаласы  әкімдігінің 2015 жылдың 08 мамырдағы № 560  «Қылмыстық– атқару инспекциясы пробация қызметінің есебінде тұрған  адамдар үшін, сондай-ақ бас  бостандығынан айыру  орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгерістер енгізу туралы

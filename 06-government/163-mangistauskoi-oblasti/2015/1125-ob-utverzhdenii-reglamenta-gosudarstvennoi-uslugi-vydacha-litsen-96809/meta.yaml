    kaz: Маңғыстау облысы әкімдігінің 2015 жылғы 25 қарашадағы № 362 «Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдiк және фумигациялық тәсiлдермен қолдануға байланысты қызметті жүзеге асыруға лицензия беру» мемлекеттiк көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Мангистауской области от 28 сентября 2015 года № 291 «Об утверждении регламентов государственных услуг в сфере туризма» и о признании утратившим силу постановления акимата Мангистауской области от 28 марта 2016 года № 82 «Об утверждении регламента государственной услуги «Выписка из государственного реестра туристских маршрутов и троп»
    kaz: Маңғыстау облысы әкімдігінің 2015 жылғы 28 қыркүйектегі № 291 «Туризм саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» қаулысына өзгеріс енгізу туралы және Маңғыстау облысы әкімдігінің 2016 жылғы 28 наурыздағы № 82 «Туристік маршруттар мен соқпақтардың мемлекеттік тізілімінен үзінді» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы қаулысының күші жойылсын деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/136727/rus

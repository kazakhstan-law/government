act_code: '93575'
requisite: Постановление акимата Мангистауской области от 13 августа 2015 года № 250. Зарегистрировано Департаментом юстиции Мангистауской области от 11 сентября 2015 года № 2825. Утратило силу постановлением акимата Мангистауской области от 10 марта 2020 года № 40
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
  kaz: «Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

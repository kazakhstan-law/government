act_code: '96069'
requisite: Постановление акимата Мангистауской области от 4 ноября 2015 года № 343. Зарегистрировано Департаментом юстиции Мангистауской области от 7 декабря 2015 года № 2903. Утратило силу постановлением акимата Мангистауской области от 27 марта 2020 года № 49
title:
  rus: Об утверждении регламента государственной услуги «Выдача и продление разрешения на привлечение иностранной рабочей силы работодателям для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы, либо в рамках внутрикорпоративного перевода»
  kaz: «Тиісті әкімшілік-аумақтық бірліктің аумағында немесе корпоративішілік ауыстыру шеңберінде еңбек қызметін жүзеге асыру үшін жұмыс берушілерге шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Мангистауской области от 24 ноября 2015 года № 360 «Об утверждении регламента государственной услуги «Выдача разрешения на размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения»
    kaz: Маңғыстау облысы әкімдігінің 2015 жылғы 24 қарашадағы № 360 «Облыстық және аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарына бөлінген белдеуде, жарнаманы тұрақты орналастыру объектілерінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

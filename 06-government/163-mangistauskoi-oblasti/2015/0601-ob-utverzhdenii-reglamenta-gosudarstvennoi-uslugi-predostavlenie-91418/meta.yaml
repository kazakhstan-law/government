  title:
    rus: О внесении изменений и дополнений в постановление акимата Мангистауской области от 01 июня 2015 года № 160 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: Маңғыстау облысы әкімдігінің 2015 жылғы 01 маусымдағы № 160 «Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық  сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

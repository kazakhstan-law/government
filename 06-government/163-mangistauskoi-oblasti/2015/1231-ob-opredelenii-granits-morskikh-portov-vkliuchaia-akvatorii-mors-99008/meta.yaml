  title:
    rus: О внесении изменений в постановление акимата Мангистауской области от 31 декабря 2015 года № 413 «Об определении границ морских портов включая акватории международного морского торгового порта Актау и морского порта Баутино»
    kaz: «Ақтау халықаралық теңіз сауда порты мен Баутино теңіз портының акваториясын қоса алғанда теңіз порттарының шекараларын айқындау туралы» Маңғыстау облысы әкімдігінің 2015 жылғы 31 желтоқсандағы № 413 қаулысына өзгерістер енгізу туралы

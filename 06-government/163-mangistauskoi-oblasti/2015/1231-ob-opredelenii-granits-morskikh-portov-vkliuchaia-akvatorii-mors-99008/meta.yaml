requisite: Постановление акимата Мангистауской области от 31 декабря 2015 года № 413. Зарегистрировано Департаментом юстиции Мангистауской области от 11 февраля 2016 года № 2971. Утратило силу постановлением акимата Мангистауской области от 6 апреля 2026 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении границ морских портов включая акватории морских торговых портов Актау и Баутино
  kaz: Ақтау және Баутино теңіз сауда порттарының акваторияларын қоса алғанда теңіз порттарының шекараларын айқындау туралы

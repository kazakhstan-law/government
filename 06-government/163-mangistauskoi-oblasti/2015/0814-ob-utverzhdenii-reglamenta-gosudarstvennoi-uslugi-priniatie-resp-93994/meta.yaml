  title:
    rus: О внесении изменений и дополнения в постановление акимата Мангистауской области от 14 августа 2015 года № 252 «Об утверждении регламента государственной услуги «Принятие  Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения в порядке, определяемом Правительством Республики Казахстан»
    kaz: Маңғыстау облысы әкімдігінің 2015 жылғы 14 тамыздағы № 252 «Қазақстан Республикасының Үкіметі айқындайтын тәртіппен сыйға  тарту шарты бойынша мемлекеттік емес  заңды тұлғалардың және жеке тұлғалардың мүлік құқықтарын Қазақстан Республикасының қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер мен толықтыру енгізу туралы

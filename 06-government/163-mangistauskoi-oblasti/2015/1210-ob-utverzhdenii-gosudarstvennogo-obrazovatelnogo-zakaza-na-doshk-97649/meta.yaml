  title:
    rus: О внесении изменения в постановление акимата Бейнеуского района от 10 декабря 2015 года №251 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размеров подушевого финансирования и ежемесячной родительской платы на 2016 год»
    kaz: Бейнеу ауданының әкімдігінің 2015 жылғы 10 желтоқсандағы №251 «2016 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ай сайынғы ақы төлеу мөлшерлерін бекіту туралы» қаулысына өзгеріс енгізу туралы

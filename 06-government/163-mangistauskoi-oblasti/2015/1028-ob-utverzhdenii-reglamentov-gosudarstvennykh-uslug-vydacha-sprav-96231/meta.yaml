  title:
    rus: О внесении изменений  в постановление акимата Мангистауской области от 28 октября 2015 года № 331 «Об утверждении регламентов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан», «Выдача архитектурно-планировочного задания» и «Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования»
    kaz: Маңғыстау облысы әкімдігінің 2015 жылғы 28 қазандағы № 331 «Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын  айқындау жөнінде анықтама беру», «Сәулет-жоспарлау тапсырмасын беру» және «Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертуге байланысты емес қолданыстағы ғимараттардың үй-жайларын  (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға)шешім беру» мемлекеттік  көрсетілетін қызметтер  регламенттерін бекіту туралы» қаулысына өзгерістер енгізу туралы

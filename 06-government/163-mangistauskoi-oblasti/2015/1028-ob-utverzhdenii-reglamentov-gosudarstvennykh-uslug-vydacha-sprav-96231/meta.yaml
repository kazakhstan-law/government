act_code: '96231'
requisite: Постановление акимата Мангистауской области от 28 октября 2015 года № 331. Зарегистрировано Департаментом юстиции Мангистауской области от 07 декабря 2015 года № 2901. Утратило силу постановлением акимата  Мангистауской области от 16 апреля 2018 года № 68
title:
  rus: Об утверждении регламентов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан», «Выдача архитектурно-планировочного задания» и «Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования»
  kaz: Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау бойынша анықтама беру», «Сәулет-жоспарлау тапсырмасын беру» және  «Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертпей қолданыстағы ғимараттардағы үй-жайларды (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру» мемлекеттік көрсетілетін қызметтер регламентерін бекіту туралы

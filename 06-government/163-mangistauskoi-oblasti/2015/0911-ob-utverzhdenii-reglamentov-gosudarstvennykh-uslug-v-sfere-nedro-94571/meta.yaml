title:
  rus: Об утверждении регламентов государственных услуг в сфере недропользования, общераспространенных полезных ископаемых и строительства и (или) эксплуатации подземных сооружений, не связанных с разведкой или добычей
  kaz: Кең таралған пайдалы қазбаларды барлауға, өндiруге және барлауға немесе өндіруге байланысты емес жерасты құрылыстарын салуға және (немесе) пайдалану саласындағы мемлекеттiк көрсетілетін қызметтер регламенттерін бекiту туралы

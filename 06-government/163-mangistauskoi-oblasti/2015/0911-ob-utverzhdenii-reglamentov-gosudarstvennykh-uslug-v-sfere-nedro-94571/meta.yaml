  title:
    rus: О внесении изменения в постановление акимата Мангистауской области от 11 сентября 2015 года № 282 «Об утверждении регламентов государственных услуг в сфере недропользования, общераспространенных полезных ископаемых и строительства и (или) эксплуатации подземных сооружений, не связанных с разведкой или добычей»
    kaz: Маңғыстау облысы әкімдігінің 2015 жылғы 11 қыркүйектегі № 282 «Кең таралған пайдалы қазбаларды барлауға, өндіруге және барлауға немесе өндіруге байланысты емес жерасты құрылыстарын салуға және (немесе) пайдалану саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» қаулысына өзгеріс енгізу туралы

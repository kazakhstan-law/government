title:
  rus: Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» Аппарата акима Мангистауской области и руководителей областных исполнительных органов, финансируемых из областного бюджета
  kaz: Маңғыстау облысы әкімі аппаратының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің және облыстық бюджеттен қаржыландырылатын,облыстық атқарушы органдары басшыларының қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Мангистауской области от 29 июля 2015 года № 216 "Об утверждении регламента государственной услуги "Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
    kaz: Маңғыстау облысы әкімдігінің 2015 жылғы 29 шілдедегі № 216 "Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына өзгерістер енгізу туралы

title:
  rus: Об установлении норматива отчисления части чистого дохода коммунальных государственных предприятий, за исключением организаций среднего образования в организационно-правовой форме государственных предприятий на праве хозяйственного ведения по Каракиянскому району
  kaz: Қарақия ауданы бойынша шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық-құқықтық нысанындағы орта білім беру ұйымдарын қоспағанда, коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы

title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Жанаозен» и исполнительных органов, финансируемых из местного бюджета
  kaz: «Жаңаөзен қаласы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Мангистауской области», областных исполнительных органов, финансируемых из областного бюджета
  kaz: «Маңғыстау облысы әкімінің аппараты» мемлекеттік мекемесінің, облыстық бюджеттен қаржыландырылатын облыстық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

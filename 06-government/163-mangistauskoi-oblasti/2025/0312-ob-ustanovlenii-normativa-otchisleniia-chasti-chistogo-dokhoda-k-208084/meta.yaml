act_code: '208084'
requisite: Постановление акимата города Жанаозен Мангистауской области от 12 марта 2025 года № 92
title:
  rus: Об установлении норматива отчисления части чистого дохода коммунальных государственных предприятий, за исключением организаций среднего образования в организационно - правовой форме государственных предприятий на праве хозяйственного ведения по городу Жанаозен
  kaz: Жаңаөзен қаласы бойынша шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық - құқықтық нысанындағы орта білім беру ұйымдарын қоспағанда, коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы

  requisite: Постановление акимата города Жанаозен Мангистауской области от 15 июня 2026 года № 346
  title:
    rus: О внесении изменений в постановление акимата города Жанаозен от 2 марта 2025 года № 92 «Об установлении норматива перечисления части чистого дохода коммунальных государственных предприятий, за исключением организаций среднего образования в организационно-правовой форме государственных предприятий на праве хозяйственного ведения, по городу Жанаозен»
    kaz: Жаңаөзен қаласы әкімдігінің 2025 жылғы 2 наурыздағы № 92 «Жаңаөзен қаласы бойынша шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық құқықтық нысанындағы орта білім беру ұйымдарын қоспағанда, коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» қаулысына өзгерістер енгізу туралы

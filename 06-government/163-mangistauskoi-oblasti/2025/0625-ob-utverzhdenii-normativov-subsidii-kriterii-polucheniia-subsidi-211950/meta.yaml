title:
  rus: Об утверждении нормативов субсидий, критерии получения субсидий, сроков подачи заявки и формы заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Мангистауской области на 2025 год
  kaz: 2025 жылға Маңғыстау облысы бойынша ауыл шаруашылығы жануарлары аналық басының азығына жұмсалатын шығындар құнын арзандатуға арналған субсидиялар нормативтерін, субсидиялар алу өлшемшарттарын, өтінім беру мерзімдерін және өтінім нысанын бекіту туралы

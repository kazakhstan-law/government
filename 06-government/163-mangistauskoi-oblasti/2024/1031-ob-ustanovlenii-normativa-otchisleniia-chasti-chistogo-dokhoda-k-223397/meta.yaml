act_code: '223397'
requisite: Постановление акимата Мунайлинского района Мангистауской области от 31 октября 2024 года № 282-қ
title:
  rus: Об установлении норматива отчисления части чистого дохода коммунальных государственных предприятий, за исключением организаций среднего образования в организационно-правовой форме государственных предприятий на праве хозяйственного ведения по Мунайлинскому району
  kaz: Мұнайлы ауданы бойынша шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық-құқықтық нысанындағы орта білім беру ұйымдарын қоспағанда, коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы

  requisite: Постановление акимата Бейнеуского района Мангистауской области от 10 апреля 2023 года № 84
  title:
    rus: О внесении изменения в постановление акимата Бейнеуского района от 26 марта 2018 года № 39 «Об утверждении Методики оценки деятельности государственных административных служащих государственного учреждения «Аппарат акима Бейнеуского района», аппаратов акимов сел и сельских округов Бейнеуского района, органов инсполнительной власти, финансируемых из бюджета Бейнеуского района корпуса «Б»»
    kaz: Бейнеу ауданы әкімдігінің 2018 жылғы 26 наурыздағы № 39 «Бейнеу ауданы әкімінің аппараты» мемлекеттік мекемесінің, Бейнеу ауданының ауылдар, ауылдық округтер әкімдерінің аппараттарының, Бейнеу ауданының бюджетінен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179611/rus

  title:
    rus: О внесении изменений в постановление акимата Бейнеуского района от 26 марта 2018 года № 39 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Бейнеуского района», аппаратов акимов сел, сельских округов Бейнеуского района, исполнительных органов, финансируемых из бюджета Бейнеуского района»
    kaz: Бейнеу ауданы әкімдігінің 2018 жылғы 26 наурыздағы № 39 «Бейнеу ауданы ауданы әкімінің аппараты» мемлекеттік мекемесінің, Бейнеу ауданының ауылдар, ауылдық округтер әкімдерінің аппараттарының, Бейнеу ауданының жергілікті бюджетінен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/166438/rus

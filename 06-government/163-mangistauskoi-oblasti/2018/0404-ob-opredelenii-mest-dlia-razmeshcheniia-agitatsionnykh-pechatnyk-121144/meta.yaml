  title:
    rus: О внесении изменений в постановление акимата города Жанаозен от 4 апреля 2018 года № 191 «О предоставлении помещений кандидатам для проведения встреч с избирателями (выборщиками) на договорной основе и определение мест для размещения агитационных печатных материалов в период выборов»
    kaz: Жаңаөзен қаласы әкімдігінің 2018 жылғы 4 сәуірдегі № 191 «Сайлау кезеңінде сайлаушылармен (таңдаушылармен) кездесу өткізу үшін кандидаттарға шарттық негізінде үй-жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы» қаулысына өзгеріс енгізу туралы

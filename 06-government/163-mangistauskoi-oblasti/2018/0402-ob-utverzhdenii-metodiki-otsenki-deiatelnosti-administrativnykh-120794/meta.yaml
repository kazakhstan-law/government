  title:
    rus: О внесении изменения в постановление акимата города Актау от 2 апреля 2018 года № 645 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Актау», государственного учреждения «Аппарат акима села Умирзак» и городских исполнительных органов, финансируемых из местного бюджета»
    kaz: Ақтау қаласы әкімдігінің 2018 жылғы 2 сәуірдегі № 645 «Ақтау қаласы әкімінің аппараты» мемлекеттік мекемесінің, «Өмірзақ ауылы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыландырылатын қалалық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

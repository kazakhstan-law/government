requisite: Постановление акимата Мангистауской области от 5 марта 2018 года № 38. Зарегистрировано Департаментом юстиции Мангистауской области 27 марта 2018 года № 3545. Утратило силу постановлением акимата Мангистауской области от 18 ноября 2025 года № 245 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Мангистауской области», областных исполнительных органов, финансируемых из областного бюджета
  kaz: «Маңғыстау облысы әкімінің аппараты» мемлекеттік мекемесінің, облыстық бюджеттен қаржыландырылатын облыстық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік  қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

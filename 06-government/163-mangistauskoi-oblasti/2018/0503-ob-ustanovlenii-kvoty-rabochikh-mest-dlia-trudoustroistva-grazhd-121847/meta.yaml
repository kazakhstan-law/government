act_code: '121847'
requisite: Постановление акимата города Актау Мангистауской области от 3 мая 2018 года № 907. Зарегистрировано Департаментом юстиции Мангистауской области 22 мая 2018 года № 3610. Утратило силу постановлением акимата города Актау Мангистауской области от 27 апреля 2022 года № 02-02/664
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лицы  освобожденных из мест лишения свободы и состоящих на учете службы пробации по городу Актау
  kaz: Ақтау қаласы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан  босатылған және пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

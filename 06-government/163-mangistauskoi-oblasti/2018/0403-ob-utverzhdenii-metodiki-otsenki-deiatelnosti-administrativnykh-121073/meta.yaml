  title:
    rus: О внесении измения в постановление акимата Каракиянского района от 3 апреля 2018 года № 91 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Каракиянского района» и исполнительных органов, финансируемых из местного бюджета»
    kaz: Қарақия ауданы әкімдігінің 2018 жылғы 3 сәуірдегі № 91 «Қарақия ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Каракиянского района от 3 апреля 2018 года № 91 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Каракиянского района», районных исполнительных органов, финансируемых из районного бюджета»
    kaz: Қарақия ауданы әкімдігінің 2018 жылғы 3 сәуірдегі № 91 «Қарақия ауданы әкімінің аппараты» мемлекеттік мекемесінің, аудандық бюджеттен қаржыландырылатын аудандық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

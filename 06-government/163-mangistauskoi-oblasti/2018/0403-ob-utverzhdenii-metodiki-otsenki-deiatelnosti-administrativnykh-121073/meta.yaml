title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Каракиянского района», районных исполнительных органов, финансируемых из районного бюджета
  kaz: «Қарақия ауданы әкімінің аппараты» мемлекеттік мекемесінің, аудандық бюджеттен қаржыландырылатын аудандық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

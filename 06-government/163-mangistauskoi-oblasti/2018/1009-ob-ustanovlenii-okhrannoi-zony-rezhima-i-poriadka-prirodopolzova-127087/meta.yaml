  title:
    rus: О внесении изменений в постановление акимата Мангистауской области от 9 октября 2018 года № 240 «Об установлении охранной зоны, режима, порядка природопользования республиканского государственного учреждения «Устюртский государственный природный заповедник» Комитета лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан»
    kaz: Маңғыстау облысы әкімдігінің 2018 жылғы 9 қазандағы № 240 «Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман шаруашылығы және жануарлар дүниесі комитетінің «Үстірт мемлекеттік табиғи қорығы» республикалық мемлекеттік мекемесінің қорғау аймағын, табиғат пайдалану режимін, тәртібін белгілеу туралы» қаулысына өзгерістер енгізу туралы

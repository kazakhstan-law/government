title:
  rus: Об установлении охранной зоны, режима и порядка природопользования на территории охранной зоны республиканского государственного учреждения «Устюртский государственный природный заповедник» Комитета лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан
  kaz: Қазақстан Республикасы Экология және табиғи ресурстар министрлігі Орман шаруашылығы және жануарлар дүниесі комитетінің «Үстірт мемлекеттік табиғи қорығы» республикалық мемлекеттік мекемесінің қорғау аймағын, қорғау аймағының аумағында табиғат пайдалану режимі мен тәртібін белгілеу туралы

    kaz: Мұнайлы ауданы әкімдігінің 2018 жылғы 12 наурыздағы № 77-қ «Мұнайлы ауданының жергілікті бюджетінен қаржыландырылатын аудандық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

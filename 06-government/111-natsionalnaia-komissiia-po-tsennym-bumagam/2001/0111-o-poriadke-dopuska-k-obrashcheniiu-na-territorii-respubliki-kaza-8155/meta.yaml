requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 11 января 2001 года № 93. Зарегистрирован в Министерстве юстиции Республики Казахстан 13.02.2001 г. за N 1401. Утратило силу - постановлением Правления Национального Банка Республики Казахстан от 23 сентября 2002 года № 393
title:
  rus: О порядке допуска к обращению на территории Республики Казахстан облигаций юридических лиц Республики Казахстан, выпущенных в соответствии с законодательством других государств, и облигаций международных финансовых организаций
  kaz: Қазақстан Республикасы заңды тұлғаларының басқа мемлекеттердiң заңдарына сәйкес шығарған облигацияларын және халықаралық қаржы ұйымдарының облигацияларын Қазақстан Республикасының аумағында айналысқа жiберудiң тәртiбi туралы

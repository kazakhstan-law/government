title:
  rus: Положение "О порядке государственной регистрации эмиссий акций, аннулирования эмиссий акций и утверждения отчетов об итогах выпуска и размещения акций в Республике Казахстан"
  kaz: '"Қазақстан Республикасындағы акциялар эмиссиясын тiркеу, жою және акциялар шығарылымдары мен орналастыру қорытындылары жөнiндегi есептi бекiту туралы" Ереженi бекiту туралы'

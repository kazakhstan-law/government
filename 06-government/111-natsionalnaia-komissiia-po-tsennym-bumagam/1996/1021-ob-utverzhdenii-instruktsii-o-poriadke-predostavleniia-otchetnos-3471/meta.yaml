act_code: '3471'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 22 октября 1996 года N 118. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 декабря 1996 г. N 238. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года N 252
title:
  rus: Об утверждении Инструкции "О порядке предоставления отчетности профессиональными участниками рынка ценных бумаг"
  kaz: Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясына арналған ведомстволық статистикалық есеп беру нысандарын бекіту туралы

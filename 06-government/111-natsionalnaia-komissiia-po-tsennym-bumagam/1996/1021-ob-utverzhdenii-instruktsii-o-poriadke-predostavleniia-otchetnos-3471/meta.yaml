caused_by:
  code: '19790'
  requisite: Совместное постановление Правлений Национального Банка Республики Казахстан от 12 апреля 2004 г. № 55 и Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 г. № 116. Зарегистрировано Министерством юстиции Республики Казахстан 13 мая 2004 года № 2854. Утратило силу постановлением Правления Национального банка Республики Казахстан от 27 июля 2012 года № 224
  title:
    rus: Об утверждении Инструкции о перечне, формах и сроках представления финансовой отчетности организациями, осуществляющими брокерско-дилерскую деятельность на рынке ценных бумаг, и внесении изменений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 22 октября 1996 года № 118 "Об утверждении Инструкции о порядке предоставления отчетности профессиональными участниками рынка ценных бумаг", зарегистрированное в Министерстве юстиции Республики Казахстан под № 238, и в постановление Правления Национального Банка Республики Казахстан от 18 декабря 2002 года № 486 "Об утверждении Правил представления отчетов организациями, обладающими лицензиями на осуществление брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под № 2124
    kaz: Бағалы қағаздар рыногында брокерлік-дилерлік қызметті жүзеге асыратын ұйымдардың қаржылық есеп беру тізбесі, нысандары және ұсыну мерзімдері туралы нұсқаулықты бекіту туралы және Қазақстан Республикасының Әділет министрлігінде N 238 тіркелген Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Бағалы қағаздар рыногының кәсіби қатысушыларының есеп беру тәртібі туралы" нұсқаулықты бекіту жөнінде" 1996 жылғы 22 қазандағы N 118 қаулысына және Қазақстан Республикасының Әділет министрлігінде N 2124 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыруға лицензиялары бар ұйымдардың есеп беру ережесін бекіту туралы" 2002 жылғы 18 желтоқсандағы N 486 қаулысына өзгерістер енгізу туралы

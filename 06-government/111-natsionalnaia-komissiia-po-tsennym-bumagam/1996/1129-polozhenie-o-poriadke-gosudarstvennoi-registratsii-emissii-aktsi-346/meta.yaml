    kaz: Қазақстан Республикасында акциялар эмиссияларын тіркеудің, жоюдың және акциялар шығарудың және орналастырудың қорытындылары туралы есепті бекітудің тәртібі туралы ережеге өзгерістер және толықтырулар енгізу туралы

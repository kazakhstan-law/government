  code: '3120'
  requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 20.04.1999 г. N 30. Зарегистрирован в Министерстве юстиции Республики Казахстан 1.06.1999г. N 782. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года N 175
  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Национальной комиссии Республики Казахстан по ценным бумагам по вопросам допуска физических лиц к выполнению работ на рынке ценных бумаг
    kaz: Жеке тұлғаларға бағалы қағаздар рыногында жұмыстарды орындауға рұқсат беру мәселелері бойынша Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының кейбір нормативтік құқықтық актілеріне өзгерістер енгізу туралы

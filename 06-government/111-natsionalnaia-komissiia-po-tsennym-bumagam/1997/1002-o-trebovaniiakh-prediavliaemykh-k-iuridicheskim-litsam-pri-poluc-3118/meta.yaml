title:
  rus: О требованиях, предъявляемых к юридическим лицам, при получении лицензии на осуществление деятельности по инвестиционному управлению пенсионными активами
  kaz: '"Зейнетақы активтерiн инвестициялық басқару жөнiндегi қызметтi жүзеге асыруға лицензия алу кезiнде заңды тұлғаларға қойылатын талаптар туралы"'

requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 12 июня 1998 года № 7. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 июня 1998 года № 528. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года № 373

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 267. Зарегистрировано Министерством юстиции Республики Казахстан от 8 ноября 2004 года N 3200. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года N 373
  title:
    rus: О внесении изменений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 12 июня 1998 года N 7 "Об утверждении Правил лицензирования деятельности по управлению портфелем ценных бумаг, Инструкции о порядке расчета и применения пруденциальных нормативов для организаций, осуществляющих деятельность по управлению портфелем ценных бумаг", зарегистрированное в Министерстве юстиции Республики Казахстан под N 530
    kaz: Қазақстан Республикасының Бағалы қағаздар жөніндегі Ұлттық Комиссиясының Қазақстан Республикасының Әділет Министрлігінде N 530 тіркелген 1998 жылғы 12-маусымдағы N 7 "Бағалы қағаздардың портфелін басқару қызметін лицензиялау Ережелерін, бағалы қағаздар портфелін басқару қызметін жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді есептеу және қолдану тәртібі туралы Нұсқаулықты бекіту туралы" қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/21893/rus

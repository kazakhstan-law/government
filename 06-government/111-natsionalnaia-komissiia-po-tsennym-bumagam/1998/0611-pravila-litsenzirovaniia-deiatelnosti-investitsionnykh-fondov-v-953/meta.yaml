requisite: Утверждены постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 12 июня 1998 года № 7. Зарегистрированы в Министерстве юстиции Республики Казахстан 29 июня 1998 года № 529. Правила утратили силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года № 256
title:

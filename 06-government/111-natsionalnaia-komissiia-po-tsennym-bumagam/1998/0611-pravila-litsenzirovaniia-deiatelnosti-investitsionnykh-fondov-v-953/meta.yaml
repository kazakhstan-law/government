  requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 26 февраля 2000 года N 62. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 марта 2000 года N 1074. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года N 373 (порядок введения в действие см. п.2)

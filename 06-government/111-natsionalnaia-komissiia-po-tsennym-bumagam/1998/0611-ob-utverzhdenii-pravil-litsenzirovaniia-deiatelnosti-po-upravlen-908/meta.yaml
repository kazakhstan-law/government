caused_by:
  code: '21366'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года N 256. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 сентября 2004 года N 3098
  title:
    rus: О внесении изменений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 12 июня 1998 года N 7 "Об утверждении Правил лицензирования деятельности инвестиционных фондов в качестве субъектов инвестиционной деятельности на рынке ценных бумаг, Правил лицензирования деятельности по управлению портфелем ценных бумаг, Инструкции о порядке расчета и применения пруденциальных нормативов для организаций, осуществляющих деятельность по управлению портфелем ценных бумаг", зарегистрированное в Министерстве юстиции Республики Казахстан под N 528, и о признании утратившим силу постановления Национальной комиссии Республики Казахстан по ценным бумагам от 26 июня 1997 года N 90 "Об утверждении требований, предъявляемых к инвестиционным декларациям инвестиционных фондов", зарегистрированного Министерством юстиции Республики Казахстан под N 380
    kaz: Қазақстан Республикасының Әділет министрлігінде N 528 тіркелген, Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Бағалы қағаздар рыногындағы инвестициялық қызметтiң субъектiсi ретiнде инвестициялық қорлардың қызметiн лицензиялау қағидаларын, Бағалы қағаздар портфелiн басқару жөнiндегi қызметтi лицензиялау қағидаларын, Бағалы қағаздар портфелiн басқару жөнiндегi қызметтi жүзеге асыратын ұйымдарға арналған пруденциялық нормативтердi есептеудiң және қолданудың тәртiбi туралы нұсқаулықты бекiту туралы" 1998 жылғы 12 маусымдағы N 7 қаулысына өзгерістер енгізу туралы және Қазақстан Республикасының Әділет министрлігінде N 380 тіркелген, Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Инвестициялық қорлардың инвестициялық декларацияларына қойылатын талаптарды бекiту туралы" 1997 жылғы 26 маусымдағы N 90 қаулысының күші жойылды деп тану туралы

    kaz: Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының 1998 жылғы 13 тамыздағы N 11 қаулысымен бекітілген Мемлекеттік жинақтаушы зейнетақы қорының инвестициялық қызметті жүзеге асыру қағидаларына өзгерістер мен толықтырулар енгізу туралы

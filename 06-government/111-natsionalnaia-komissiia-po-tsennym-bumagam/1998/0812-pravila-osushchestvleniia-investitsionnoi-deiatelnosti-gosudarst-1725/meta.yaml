  requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 30 сентября 2000 года № 81. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 октября 2000 года за № 1264. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 июля 2003 года № 264 (вводится в действие по истечении четырнадцати дней со дня государственной регистрации в Министерстве юстиции Республики Казахстан)
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам "О нормативных правовых актах по вопросам компаний по управлению пенсионными активами" от 13 августа 1998 года № 11
    kaz: '"Зейнетақы активтерiн басқару жөнiндегi компаниялардың мәселелерi бойынша нормативтiк құқықтық актiлер туралы" Қазақстан Республикасы Бағалы қағаздар жөнiндегі ұлттық комиссиясының 1998 жылғы 13 тамыздағы № 11 қаулысына өзгертулер мен толықтырулар енгiзу туралы'

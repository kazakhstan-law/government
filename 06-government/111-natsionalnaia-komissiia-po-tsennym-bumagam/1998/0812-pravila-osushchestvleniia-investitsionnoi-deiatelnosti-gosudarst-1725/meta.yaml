  requisite: Постановление Правления Национального Банка Республики Казахстан от 13 мая 2002 года N 176. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 июня 2002 года N 1891. Утратило силу - постановлением Правления Национального Банка Республики Казахстан от 29 июля 2003 года N 264 (V032484)
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам "О нормативных правовых актах по вопросам организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами" от 13 августа 1998 года N 11 и признании утратившим силу постановления Правления Национального Банка Республики Казахстан "О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам "О нормативных правовых актах по вопросам компаний по управлению пенсионными активами" от 13 августа 1998 года N 11" от 05 апреля 2002 года N 121
    kaz: Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясының "Зейнетақы активтерiн инвестициялық басқару жөнiндегi қызметтi жүзеге асыратын ұйымдардың мәселелерi бойынша нормативтiк құқықтық актiлер туралы" 1998 жылғы 13 тамыздағы N 11 қаулысына өзгерiстер мен толықтырулар енгiзу және Қазақстан Республикасының Ұлттық Банкi Басқармасының "Зейнетақы активтерiн басқару жөнiндегi компаниялардың мәселелерi бойынша нормативтік құқықтық актiлер туралы" Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясының 1998 жылғы 13 тамыздағы N 11 қаулысына өзгерiстер мен толықтырулар енгiзу туралы" 2002 жылғы 5 сәуiрдегi N 121 қаулысының күшi жойылды деп тану туралы

  title:
    rus: О внесении дополнения в Правила осуществления инвестиционной деятельности компаниями по управлению пенсионными активами, утвержденные постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 13 августа 1998 года N 11 "О нормативных правовых актах по вопросам компаний по управлению пенсионными активами"
    kaz: Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясының "Зейнетақы активтерiн басқару жөнiндегi компаниялардың мәселелерi бойынша нормативтiк құқықтық актiлер туралы" 1998 жылғы 13 тамыздағы N 11 қаулысымен бекiтiлген Зейнетақы активтерiн басқару жөнiндегi компаниялардың инвестициялық қызметтi жүзеге асыру ережесiне толықтыру енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/10277/rus

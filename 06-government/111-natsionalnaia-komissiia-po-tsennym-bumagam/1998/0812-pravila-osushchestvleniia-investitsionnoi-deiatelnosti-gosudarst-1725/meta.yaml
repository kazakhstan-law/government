act_code: '1725'
requisite: Утверждены постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 13 августа 1998 года № 11. Зарегистрированы Министерством юстиции Республики Казахстан 12 ноября 1998 года № 641. Утратили силу постановлением Правления Национального Банка Республики Казахстан от 29 июля 2003 года № 264
title:
  rus: Правила осуществления инвестиционной деятельности Государственным накопительным пенсионным фондом
  kaz: Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыратын ұйымдардың мәселелері бойынша нормативтік құқықтық актілер туралы Қағидалары

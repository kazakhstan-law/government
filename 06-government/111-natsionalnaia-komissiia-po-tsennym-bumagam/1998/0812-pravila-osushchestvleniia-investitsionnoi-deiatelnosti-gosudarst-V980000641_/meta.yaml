  title:
    rus: О внесении изменений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 13 августа 1998 года N 11 "О нормативных правовых актах по вопросам организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами"
    kaz: Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыратын ұйымдардың мәселелері бойынша нормативтік құқықтық актілер туралы" 1998 жылғы 13 тамыздағы N 11 қаулысына өзгерістер енгізу туралы

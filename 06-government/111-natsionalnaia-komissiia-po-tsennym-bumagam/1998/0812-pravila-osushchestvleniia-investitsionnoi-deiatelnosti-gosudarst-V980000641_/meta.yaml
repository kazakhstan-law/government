  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам "О нормативных правовых актах по вопросам компаний по управлению пенсионными активами" от 13 августа 1998 года N 11
    kaz: Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Зейнетақы активтерін басқару жөніндегі компаниялардың мәселелері бойынша нормативтік құқықтық актілер туралы" 1998 жылғы 13 тамыздағы N 11 қаулысына өзгерістер мен толықтырулар енгізу туралы

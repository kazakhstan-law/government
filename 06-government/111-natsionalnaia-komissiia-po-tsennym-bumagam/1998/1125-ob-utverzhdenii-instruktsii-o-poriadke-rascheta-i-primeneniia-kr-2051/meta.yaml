  title:
    rus: О внесении изменений и дополнений в Инструкцию о порядке расчета и применения критериев (нормативов) финансовой устойчивости для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, утвержденную постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 25 ноября 1998 года № 17
    kaz: Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының 1998 жылғы 25 қарашадағы N 17 қаулысымен бекітілген Бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдарға арналған қаржы тұрақтылығының өлшемдерін (нормативтерін) есептеудің және қолданудың тәртібі туралы нұсқаулыққа өзгерістер мен толықтырулар енгізу туралы

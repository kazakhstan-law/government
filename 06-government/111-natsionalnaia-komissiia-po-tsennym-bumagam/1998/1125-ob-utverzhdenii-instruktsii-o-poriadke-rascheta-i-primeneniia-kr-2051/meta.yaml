  title:
    rus: О внесении дополнения в Инструкцию о порядке расчета и применения критериев (нормативов) финансовой устойчивости для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, утвержденную постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 25 ноября 1998 года N 17
    kaz: Қазақстан Республикасы Бағалы қағаздар жөнiндегi ұлттық комиссиясының 1998 жылғы 25 қарашадағы N 17 қаулысымен бекiтiлген Бағалы қағаздар рыногында брокерлiк және дилерлiк қызметтi жүзеге асыратын ұйымдарға арналған қаржы тұрақтылығының өлшемдерiн (нормативтерiн) есептеудiң және қолданудың тәртiбi туралы нұсқаулыққа толықтырулар енгiзу туралы

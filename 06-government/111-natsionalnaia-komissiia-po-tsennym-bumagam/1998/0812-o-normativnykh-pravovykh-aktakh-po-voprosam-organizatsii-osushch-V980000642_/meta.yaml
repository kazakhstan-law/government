    kaz: '"Зейнетақы активтерiн басқару жөнiндегi компаниялардың мәселелері бойынша нормативтiк құқықтық актiлер туралы" Қазақстан Республикасы Бағалы қағаздар жөнiндегі ұлттық комиссиясының 1998 жылғы 13 тамыздағы N 11 қаулысына толықтыру енгiзу туралы'

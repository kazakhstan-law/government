  title:
    rus: О внесении изменений и дополнений в Правила осуществления инвестиционной деятельности компаниями по управлению пенсионными активами, утвержденные постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 13 августа 1998 года № 11
    kaz: Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының 1998 жылғы 13 тамыздағы N 11 қаулысымен бекітілген Зейнетақы активтерін басқару жөніндегі компаниялардың инвестициялық қызметті жүзеге асыру қағидаларына өзгерістер мен толықтырулар енгізу туралы

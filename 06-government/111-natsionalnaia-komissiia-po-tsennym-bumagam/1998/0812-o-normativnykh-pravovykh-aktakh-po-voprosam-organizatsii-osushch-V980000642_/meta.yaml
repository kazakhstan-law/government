  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам "О нормативных правовых актах по вопросам компаний по управлению пенсионными активами" от 13 августа 1998 года N 11
    kaz: '"Зейнетақы активтерiн басқару жөнiндегi компаниялардың мәселелерi бойынша нормативтiк құқықтық актiлер туралы" Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясының 1998 жылғы 13 тамыздағы N 11 қаулысына өзгерiстер мен толықтырулар енгізу туралы'

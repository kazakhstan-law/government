caused_by:
  code: '20450'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 мая 2004 года N 142. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 июля 2004 года N 2933. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору фин.рынка и фин.организаций от 27 августа 2005 года N 317 (V053870) (порядок введения в действие см. п.4 пост. N 317)
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 31 декабря 1998 года N 20 "Об утверждении Правил осуществления брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 683 и признании утратившим силу постановления Национальной комиссии Республики Казахстан по ценным бумагам от 30 сентября 2000 года N 80 "О перечне банков (организаций, осуществляющих отдельные виды банковской деятельности), в которых небанковским организациям, осуществляющим брокерскую и дилерскую деятельность на рынке ценных бумаг с правом ведения счетов клиентов в качестве номинального держателя, разрешается открывать счета для учета и хранения денег клиентов", зарегистрированного в Министерстве юстиции Республики Казахстан под N 1263
    kaz: Қазақстан Республикасының Әділет министрлігінде N 683 тіркелген Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Қазақстан Республикасының бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыру ережесін бекіту туралы" 1998 жылғы 31 желтоқсандағы N 20 қаулысына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасының Әділет министрлігінде N 1263 тіркелген Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Клиенттердің шоттарын номиналды ұстаушы ретінде жүргізу құқығы бар бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыратын банктік емес ұйымдарға клиенттердің ақшасын есепке алу және сақтау үшін шоттарын ашуға рұқсат етілген банктер (банк қызметінің жекелеген түрлерін жүзеге асыратын ұйымдар) тізбесі туралы" 2000 жылғы 31 қыркүйектегі N 80 қаулысының күші жойылды деп тану туралы

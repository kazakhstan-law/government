  requisite: Постановление Правления Национального Банка Республики Казахстан от 20 декабря 2001 года N 566. Зарегистрировано Министерством юстиции Республики Казахстан 5 февраля 2002 года N 1746. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору фин.рынка и фин.организаций от 27 августа 2005 года N 317 (V053870) (порядок введения в действие см. п.4 пост. N 317)
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам "Об утверждении Правил осуществления брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан" от 31 декабря 1998 года N 20
    kaz: Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясының "Қазақстан Республикасының бағалы қағаздар рыногында брокерлiк және дилерлiк қызметтi жүзеге асыру ережесiн бекiту туралы" 1998 жылғы 31 желтоқсандағы N 20 қаулысына өзгерiстер мен толықтырулар енгiзу туралы

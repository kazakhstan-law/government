act_code: '2267'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 31 декабря 1998 года № 20. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 февраля 1999 года № 683. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 августа 2005 года № 317
title:
  rus: Об утверждении Правил осуществления брокерско-дилерской деятельности на рынке ценных бумаг Республики Казахстан
  kaz: Қазақстан Республикасының бағалы қағаздар рыногында брокерлiк-дилерлiк қызметтi жүзеге асыру қағидаларын бекiту туралы

    kaz: Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының 1998 жылғы 31 желтоқсандағы N 20 қаулысымен бекітілген Бағалы қағаздар рыногындағы брокерлік және дилерлік қызметті жүзеге асыру қағидаларына өзгерістер мен толықтырулар енгізу туралы

  code: '15166'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 7 марта 2003 года N 76. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 апреля 2003 г. за N 2243. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору фин.рынка и фин.организаций от 27 августа 2005 года N 317 (V053870) (порядок введения в действие см. п.4 пост. N 317)
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 31 декабря 1998 года N 20 "Об утверждении Правил осуществления брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан", зарегистрированное в Реестре государственной регистрации нормативных правовых актов Республики Казахстан под N 683
    kaz: Қазақстан Республикасының нормативтік құқықтық актілерін мемлекеттік тіркеу тізілімінде N 683 тіркелген Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясының "Қазақстан Республикасының бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыру қағидаларын бекіту туралы" 1998 жылғы 31 желтоқсандағы N 20 қаулысына өзгерістер мен толықтырулар енгізу туралы

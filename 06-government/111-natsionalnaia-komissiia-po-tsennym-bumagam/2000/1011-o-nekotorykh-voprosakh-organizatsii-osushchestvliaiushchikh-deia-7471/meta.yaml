requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 12 октября 2000 года № 680. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 ноября 2000 года № 1306. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 июля 2003 года № 264 (вводится в действие по истечении четырнадцати дней со дня государственной регистрации в Министерстве юстиции Республики Казахстан)

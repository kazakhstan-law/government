  title:
    rus: О внесении изменений и дополнений в постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам "О некоторых вопросах организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами" от 12 октября 2000 года N 680
    kaz: Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясы Директоратының "Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыратын ұйымдардың кейбір мәселелері туралы" 2000 жылғы 12 қазандағы N 680 қаулысына өзгерістер мен толықтырулар енгізу туралы

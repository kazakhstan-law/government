  requisite: Постановление Правления Национального Банка Республики Казахстан от 20 декабря 2001 года N 537. Зарегистрировано Министерством юстиции Республики Казахстан 4 февраля 2002 года N 1742. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 26.03.2005г. N 117
  title:
    rus: О внесении дополнения и изменений в постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам "О порядке выдачи разрешения на приобретение за счет пенсионных активов государственных ценных бумаг, выпущенных местными исполнительными органами Республики Казахстан" от 30 июня 2000 года N 634
    kaz: Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясы Директоратының "Қазақстан Республикасының жергiлiктi атқару органдары шығарған мемлекеттiк бағалы қағаздарды зейнетақы активтерi есебiнен сатып алуға рұқсат беру тәртiбi туралы" 2000 жылғы 30 маусымдағы N 634 қаулысына толықтыру мен өзгерiстер енгiзу туралы

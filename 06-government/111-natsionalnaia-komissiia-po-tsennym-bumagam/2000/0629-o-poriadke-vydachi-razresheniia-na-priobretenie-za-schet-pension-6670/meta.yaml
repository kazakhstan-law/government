act_code: '6670'
requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 30 июня 2000 года N 634. Зарегистрировано в Министерстве юстиции РК 4 августа 2000 года N 1213. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 26.03.2005г. N 117
title:
  rus: О порядке выдачи разрешения на приобретение за счет пенсионных активов государственных ценных бумаг, выпущенных местными исполнительными органами Республики Казахстан
  kaz: Зейнетақы активтерiнiң есебiнен Қазақстан Республикасының жергiлiктi атқарушы органдары шығарған мемлекеттiк бағалы қағаздар сатып алуға рұқсат берудiң тәртiбi туралы

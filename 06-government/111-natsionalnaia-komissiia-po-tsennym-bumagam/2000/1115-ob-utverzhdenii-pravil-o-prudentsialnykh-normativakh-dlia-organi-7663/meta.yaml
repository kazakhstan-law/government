    kaz: Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтер туралы ережені бекіту туралы" 2000 жылғы 15 қарашадағы N 87 қаулысына толықтыру мен өзгеріс енгізу туралы

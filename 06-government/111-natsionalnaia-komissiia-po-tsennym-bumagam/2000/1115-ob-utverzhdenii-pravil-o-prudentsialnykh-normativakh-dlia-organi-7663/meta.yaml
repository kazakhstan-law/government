  requisite: Постановление Правления Национального Банка Республики Казахстан от 16 ноября 2001 года N 434. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 ноября 2001 года за N 1690. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 ноября 2005 года N 412 (V053995)
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам "Об утверждении Инструкции "Пруденциальные нормативы для организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами" от 15 ноября 2000 года N 87
    kaz: '"Зейнетақы активтерiн инвестициялық басқару жөнiндегi қызметтi жүзеге асыратын ұйымдарға арналған пруденциялық нормативтер" нұсқаулығын бекiту туралы" Қазақстан Республикасы Бағалы қағаздар жөнiндегi ұлттық комиссиясының 2000 жылғы 15 қарашадағы N 87 қаулысына өзгерiстер мен толықтырулар енгiзу туралы'

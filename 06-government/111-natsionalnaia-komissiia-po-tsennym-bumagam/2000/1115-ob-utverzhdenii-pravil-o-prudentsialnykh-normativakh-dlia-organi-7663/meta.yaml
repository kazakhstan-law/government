  code: '15697'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 21 апреля 2003 года N 134. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 июня 2003 года N 2334. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 ноября 2005 года N 412 (V053995)
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 15 ноября 2000 года N 87 "Об утверждении Инструкции "Пруденциальные нормативы для организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1330
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1330 тіркелген Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Зейнетақы активтерiн инвестициялық басқару жөнiндегi қызметті жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтер" нұсқаулығын бекiту туралы" 2000 жылғы 15 қарашадағы N 87 қаулысына өзгерістер мен толықтырулар енгізу туралы

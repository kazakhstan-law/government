  code: '16851'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 4 августа 2003 года N 284. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 сентября 2003 года N 2472. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 ноября 2005 года N 412 (V053995)
  title:
    rus: О внесении дополнения и изменения в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 15 ноября 2000 года N 87 «Об утверждении Правил о пруденциальных нормативах для организаций, осуществляющих инвестиционное управление пенсионными активами», зарегистрированное в Министерстве юстиции Республики Казахстан под N 1330
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 1330 тiркелген Қазақстан Республикасының Бағалы қағаздар жөнiндегi ұлттық комиссиясының "Зейнетақы активтерiн инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтер туралы ереженi бекiту жөнiнде" 2000 жылғы 15 қарашадағы N 87 қаулысына толықтыру мен өзгерiс енгiзу туралы

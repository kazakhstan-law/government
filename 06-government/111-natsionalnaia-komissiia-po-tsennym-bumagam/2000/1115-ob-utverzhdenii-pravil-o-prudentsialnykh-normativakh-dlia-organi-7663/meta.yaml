act_code: '7663'
requisite: Постановление Национальной Комиссии Республики Казахстан по ценным бумагам от 15 ноября 2000 года № 87. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 декабря 2000 года № 1330. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 ноября 2005 года № 412 (вводится в действие с 1 января 2006 года)
title:
  rus: Об утверждении Правил о пруденциальных нормативах для организаций, осуществляющих инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтер туралы ережені бекіту жөнінде

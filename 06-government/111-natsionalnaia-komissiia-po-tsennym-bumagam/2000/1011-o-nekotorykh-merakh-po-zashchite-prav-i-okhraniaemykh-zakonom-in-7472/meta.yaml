requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 12 октября 2000 года N 679. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 ноября 2000 года N 1309. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года N 305
title:
  rus: О некоторых мерах по защите прав и охраняемых законом интересов инвесторов, являющихся потенциальными приобретателями акций акционерных обществ, осуществляющих самостоятельное ведение реестра держателей акций

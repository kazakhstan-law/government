act_code: '7665'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 15 ноября 2000 года N 90. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 декабря 2000 года N 1339. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года N 373 (порядок введения в действие см. п.2 V043400)
title:
  rus: О порядке выдачи организациям, осуществляющим инвестиционное управление пенсионными активами накопительных пенсионных фондов, и накопительным пенсионным фондам, самостоятельно осуществляющим деятельность по инвестиционному управлению пенсионными активами лицензий на осуществление брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан
  kaz: Жинақтаушы зейнетақы қорларының зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға және зейнетақы активтерін инвестициялық басқару жөніндегі қызметті дербес жүзеге асыратын жинақтаушы зейнетақы қорларын Қазақстан Республикасының бағалы қағаздар рыногында брокерлiк және дилерлiк қызметтi жүзеге асыруға лицензиялар беру туралы

caused_by:
  code: '15535'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 21 апреля 2003 года № 132. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 мая 2003 года № 2311. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года № 373.
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 15 ноября 2000 года № 90 "О порядке выдачи компаниям по управлению пенсионными активами лицензий на осуществление брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1339
    kaz: Қазақстан Республикасының Әділет министрлігінде № 1339 тіркелген Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Зейнетақы активтерiн басқару жөнiндегі компанияларға Қазақстан Республикасының бағалы қағаздар рыногында брокерлiк және дилерлiк қызметтi жүзеге асыруға лицензиялар беру туралы" 2000 жылғы 15 қарашадағы № 90 қаулысына өзгерістер мен толықтырулар енгізу туралы

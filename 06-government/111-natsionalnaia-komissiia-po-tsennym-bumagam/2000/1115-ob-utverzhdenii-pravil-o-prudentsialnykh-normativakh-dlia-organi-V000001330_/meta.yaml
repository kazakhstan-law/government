  requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2003 года N 487. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 декабря 2003 года N 2666. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 ноября 2005 года N 412 (V053995)
  title:
    rus: О внесении дополнения в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 15 ноября 2000 года N 87 "Об утверждении Правил о пруденциальных нормативах для организаций, осуществляющих инвестиционное управление пенсионными активами", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1330
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1330 тіркелген Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтер туралы ережені бекіту жөнінде" 2000 жылғы 15 қарашадағы N 87 қаулысына толықтыру енгізу туралы

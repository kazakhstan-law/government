  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года N 378. Зарегистрировано Министерством юстиции Республики Казахстан 4 февраля 2005 года N 3424. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 ноября 2005 года N 412
  title:
    rus: О внесении изменений и дополнений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 15 ноября 2000 года № 87 "Об утверждении Правил о пруденциальных нормативах для организаций, осуществляющих инвестиционное управление пенсионными активами"
    kaz: Қазақстан Республикасы Ұлттық комиссиясының "Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтер туралы ережені бекіту туралы" 2000 жылғы 15 қарашадағы N 87 қаулысына өзгерістер мен толықтырулар енгізу туралы

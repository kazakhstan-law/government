    kaz: Қазақстан Республикасының кейбiр нормативтiк құқықтық актiлерiне қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы

act_code: '5517'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 26 февраля 2000 года N 65. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 марта 2000 года за N 1076. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года N 175 (вводится в действие по истечении четырнадцати дней со дня государственной регистрации)
title:
  rus: О приостановлении действия части четвертой пункта 32 Правил осуществления деятельности организаторов торгов с ценными бумагами, утвержденных постановлением Национальной комиссии Республики Казахстан по ценным бумагам от 23 декабря 1998 года N 19
  kaz: Қазақстан Республикасы Бағалы қағаздар жөнiндегi ұлттық комиссиясының 1998 жылғы 23 желтоқсандағы N 19 қаулысымен бекiтiлген Бағалы қағаздармен сауда-саттық ұйымдастырушылардың қызметiн жүзеге асыру қағидалары 32-тармағының төртiншi бөлiгiн қолдануды тоқтата тұру туралы

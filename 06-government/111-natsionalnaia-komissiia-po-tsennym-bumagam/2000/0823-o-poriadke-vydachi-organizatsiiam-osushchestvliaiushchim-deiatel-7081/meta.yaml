requisite: Постановление Директората Национальной комиссии Республики Казахстан по ценным бумагам от 24 августа 2000 года N 644. Зарегистрирован в Министерстве юстиции Республики Казахстан 22.09.2000 г. N 1244. Утратило силу - постановлением Правления Национального Банка РК от 20.09.2002г. № 375.
title:
  rus: О порядке выдачи организациям, осуществляющим деятельность по инвестиционному управлению пенсионными активами, согласий на осуществление инвестиций в ценные бумаги нерезидентов Республики Казахстан
  kaz: Зейнетақы активтерін инвестициялық басқару жөнiндегі қызметтi жүзеге асыратын ұйымдарға Қазақстан Республикасы резидент еместерiнiң бағалы қағаздарына инвестициялауды жүзеге асыруға келiсiмдер берудiң тәртiбi туралы

act_code: '7146'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 30 сентября 2000 года № 80. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 октября 2000 года № 1263. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 мая 2004 года № 142 (вводится в действие по истечении четырнадцати дней со дня его государственной регистрации в Министерстве юстиции Республики Казахстан)
title:
  rus: О перечне банков (организаций, осуществляющих отдельные виды банковской деятельности), в которых небанковским организациям, осуществляющим брокерскую и дилерскую деятельность на рынке ценных бумаг с правом ведения счетов клиентов в качестве номинального держателя, разрешается открывать счета для учета и хранения денег клиентов
  kaz: Нақтылы ұстаушы ретiнде клиенттердiң шоттарын жүргізу құқығымен бағалы қағаздар рыногында брокерлiк және дилерлiк қызметтердi жүзеге асыратын банктiк емес ұйымдарға клиенттердiң ақшаларына есеп жүргiзуге және сақтауға арналған шоттар ашуға рұқсат берiлетiн банктердiң (банктiк қызметтiң жекелеген түрлерiн жүзеге асыратын) тiзбесi туралы

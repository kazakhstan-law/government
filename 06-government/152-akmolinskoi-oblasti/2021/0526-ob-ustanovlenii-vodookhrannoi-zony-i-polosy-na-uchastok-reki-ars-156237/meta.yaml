act_code: '156237'
requisite: Постановление акимата Акмолинской области от 26 мая 2021 года № А-5/266. Зарегистрировано Департаментом юстиции Акмолинской области 31 мая 2021 года № 8498. Утратило силу постановлением акимата Акмолинской области от 3 мая 2022 года № А-5/222 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы на участок реки Аршалы протяженностью 3 километра (вблизи села Николаевка), расположенного в Бурабайском районе Акмолинской области и режима их хозяйственного использования
  kaz: Ақмола облысы Бурабай ауданында орналасқан Аршалы өзенінің ұзындығы 3 шақырым учаскесіне (Николаевка ауылына жақын) су қорғау аймағы мен белдеуін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

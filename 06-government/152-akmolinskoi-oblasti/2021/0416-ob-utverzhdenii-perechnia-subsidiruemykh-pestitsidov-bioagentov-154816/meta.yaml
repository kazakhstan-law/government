  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 16 апреля 2021 года № А-4/177 «Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и норм субсидий на 1 литр (килограмм, грамм, штук) пестицидов, биоагентов (энтомофагов), а также объемов бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов)»
    kaz: «Субсидияланатын пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі және пестицидтердің, биоагенттердiң (энтомофагтардың) 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» Ақмола облысы әкімдігінің 2021 жылғы 16 сәуірдегі № А-4/177 қаулысына өзгеріс енгізу туралы

  requisite: Постановление акимата Акмолинской области от 22 декабря 2021 года № А-12/663. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 декабря 2021 года № 25973. Утратило силу постановлением акимата Акмолинской области от 19 апреля 2022 года № А-4/189 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 7 апреля 2021 года № А-4/158 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических)»
    kaz: «Тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялардың нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» Ақмола облысы әкімдігінің 2021 жылғы 7 сәуірдегі № А-4/158 қаулысына өзгеріс енгізу туралы

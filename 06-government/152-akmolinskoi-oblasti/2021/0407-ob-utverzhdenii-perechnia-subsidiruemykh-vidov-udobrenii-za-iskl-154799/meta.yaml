requisite: Постановление акимата Акмолинской области от 7 апреля 2021 года № А-4/158. Зарегистрировано Департаментом юстиции Акмолинской области 16 апреля 2021 года № 8430. Утратило силу постановлением акимата Акмолинской области от 19 апреля 2022 года № А-4/189 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических)
  kaz: Тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы

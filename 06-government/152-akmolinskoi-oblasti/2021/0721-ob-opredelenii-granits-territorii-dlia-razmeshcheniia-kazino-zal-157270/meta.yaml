requisite: Постановление акимата Акмолинской области от 21 июля 2021 года № А-7/356. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 июля 2021 года № 23708. Утратило силу постановлением акимата Бурабайского района Акмолинской области от 27 марта 2025 года № А-3/164 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении границ территорий для размещения казино, залов игровых автоматов, букмекерских контор и тотализаторов (касс букмекерских контор и (или) тотализаторов) в Бурабайском районе Акмолинской области
  kaz: Ақмола облысының Бурабай ауданында казиноны, ойын автоматтары залдарын, букмекерлік кеңселер мен тотализаторларды (букмекерлік кеңселердің және (немесе) тотализаторлардың кассаларын) орналастыруға арналған аумақтардың шекараларын айқындау туралы

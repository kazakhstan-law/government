    kaz: Астрахан ауданы әкімдігінің «Үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін кандидаттарға үй-жай беру туралы» 2021 жылғы 27 сәуірдегі № 96 қаулысына өзгерістер енгізу туралы

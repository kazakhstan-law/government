  title:
    rus: О внесении изменений в постановление акимата Астраханского района от 27 апреля 2021 года № 96 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями»
    kaz: «Үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін кандидаттарға үй-жай беру туралы» Астрахан ауданы әкімдігінің 2021 жылғы 27 сәуірдегі № 96 қаулысына өзгерістер енгізу туралы

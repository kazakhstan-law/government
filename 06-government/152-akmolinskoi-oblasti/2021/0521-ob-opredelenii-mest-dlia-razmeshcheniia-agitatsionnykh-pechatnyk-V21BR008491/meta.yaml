  title:
    rus: О внесении изменений в постановление акимата Шортандинского района Акмолинской области от 21 мая 2021 года № А-4/110 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями в Шортандинском районе»
    kaz: Ақмола облысы Шортанды ауданы әкімдігінің 2021 жылғы 21 мамырдағы № А-4/110 «Шортанды ауданында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Жаркаинского района от 30 апреля 2021 года № А-4/219 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями»
    kaz: Жарқайың ауданы әкімдігінің 2021 жылғы 30 сәуірдегі № А-4/219 «Үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

act_code: '153208'
requisite: Постановление акимата Есильского района Акмолинской области от 26 февраля 2021 года № а-2/37. Зарегистрировано Департаментом юстиции Акмолинской области 2 марта 2021 года № 8372
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ поселка Красногорский, села Аксай, села Орловка, села Знаменка, села Московское, Свободненского сельского округа, Бузулукского сельского округа, Двуреченского сельского округа, Зареченского сельского округа, Каракольского сельского округа, Юбилейного сельского округа, Интернационального сельского округа, Красивинского сельского округа, Жаныспайского сельского округа Есильского района
  kaz: Есіл ауданы Красногорский кентінің, Ақсай ауылының, Орловка ауылының, Знаменка ауылының, Московский ауылының, Свободный ауылдық округінің, Бұзылық ауылдық округінің, Двуречный ауылдық округінің, Заречный ауылдық округінің, Қаракөл ауылдық округінің, Юбилейный ауылдық округінің, Интернациональный ауылдық округінің, Красивинский ауылдық округінің, Жаныспай ауылдық округінің жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы

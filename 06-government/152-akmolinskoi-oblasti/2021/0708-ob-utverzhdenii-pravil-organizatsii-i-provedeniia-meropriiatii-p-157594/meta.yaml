  title:
    rus: О внесении изменений в постановление акимата Ерейментауского района от 8 июля 2021 года № а-7/182 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровель многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Ерейментау»
    kaz: Ерейментау ауданы әкімдігінің 2021 жылғы 8 шілдедегі № а-7/182 «Ерейментау қаласына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

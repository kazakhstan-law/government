requisite: Постановление акимата Ерейментауского района Акмолинской области от 8 июля 2021 года № а-7/182. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 августа 2021 года № 23853. Утратило силу постановлением акимата Ерейментауского района Акмолинской области от 30 декабря 2025 года № а-13/345 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровель многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Ерейментау
  kaz: Ерейментау қаласына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

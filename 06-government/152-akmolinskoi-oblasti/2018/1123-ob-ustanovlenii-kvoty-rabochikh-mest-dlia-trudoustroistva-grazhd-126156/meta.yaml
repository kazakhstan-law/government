act_code: '126156'
requisite: Постановление акимата Бурабайского района Акмолинской области от 23 ноября 2018 года № а-11/463. Зарегистрировано Департаментом юстиции Акмолинской области 28 ноября 2018 года № 6867
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в Бурабайском районе на 2019 год
  kaz: Бурабай ауданында 2019 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

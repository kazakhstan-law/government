  title:
    rus: О признании утратившим силу постановления акимата Жаксынского района от 20 июля 2018 года № а-7/229 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Жаксынском районе»
    kaz: Жақсы ауданы әкімдігінің 2018 жылғы 20 шілдедегі № а-7/229 «Жақсы ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысының күші жойылды деп тану туралы

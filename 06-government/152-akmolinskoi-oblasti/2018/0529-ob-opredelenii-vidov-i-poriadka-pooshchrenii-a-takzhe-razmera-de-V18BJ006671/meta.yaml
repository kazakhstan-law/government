    kaz: Біржан сал ауданы әкімдігінің 2018 жылғы 29 мамырдағы № а-6/196 «Біржан сал ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысының күші жойылды деп тану туралы

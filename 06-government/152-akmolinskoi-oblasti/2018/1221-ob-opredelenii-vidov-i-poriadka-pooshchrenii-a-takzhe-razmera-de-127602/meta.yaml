requisite: Постановление акимата города Кокшетау Акмолинской области от 21 декабря 2018 года № А-12/2967. Зарегистрировано Департаментом юстиции Акмолинской области 26 декабря 2018 года № 6978. Утратило силу постановлением акимата города Кокшетау Акмолинской области от 24 апреля 2019 года № А-4/774 (вводится в действие со дня официального опубликования)
title:

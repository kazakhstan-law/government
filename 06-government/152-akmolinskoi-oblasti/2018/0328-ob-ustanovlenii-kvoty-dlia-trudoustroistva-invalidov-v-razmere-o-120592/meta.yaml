act_code: '120592'
requisite: Постановление акимата района Биржан сал Акмолинской области от 28 марта 2018 года № а-3/124. Зарегистрировано Департаментом юстиции Акмолинской области 11 апреля 2018 года № 6537. Утратило силу постановлением акимата района Биржан сал Акмолинской области от 30 декабря 2021 года № а-12/279 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в районе Биржан сал
  kaz: Біржан сал ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

  title:
    rus: О признании утратившим силу постановление акимата Буландынского района от 25 декабря 2018 года № А-12/390 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Буландынском районе»
    kaz: Бұланды ауданы әкімдігінің 2018 жылғы 25 желтоқсандағы № А-12/390 «Бұланды ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай - ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысының күші жойылды деп тану туралы

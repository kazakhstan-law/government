requisite: Постановление акимата Акмолинской области от 17 мая 2018 года № А-5/217. Зарегистрировано Департаментом юстиции Акмолинской области 13 июня 2018 года № 6667. Утратило силу постановлением акимата Акмолинской области от 3 мая 2022 года № А-5/222 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

  title:
    rus: О внесении изменений в постановление акимата Коргалжынского района от 17 мая 2018 года № А-5/89 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Коргалжынского района»
    kaz: «Қорғалжын ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы» Қорғалжын ауданы әкімдігінің 2018 жылғы 17 мамырдағы № А-5/89 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Бурабайского района от 16 ноября 2018 года № а-11/441 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Бурабайского района»
    kaz: Бурабай ауданы әкімдігінің 2018 жылғы 16 қарашадағы «Бурабай ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен тәртібін бекіту туралы» № а-11/441 қаулысына өзгерістер енгізу туралы

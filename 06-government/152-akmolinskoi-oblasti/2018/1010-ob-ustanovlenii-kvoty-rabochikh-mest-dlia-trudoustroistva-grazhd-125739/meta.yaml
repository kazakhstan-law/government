act_code: '125739'
requisite: Постановление акимата города Кокшетау Акмолинской области от 10 октября 2018 года № А-10/2356. Зарегистрировано Департаментом юстиции Акмолинской области 8 ноября 2018 года № 6828
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в городе Кокшетау на 2019 год
  kaz: 2019 жылға арналған Көкшетау қаласында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

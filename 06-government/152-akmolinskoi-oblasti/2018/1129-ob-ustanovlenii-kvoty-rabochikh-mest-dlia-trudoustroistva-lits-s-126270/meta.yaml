act_code: '126270'
requisite: Постановление акимата Буландынского района Акмолинской области от 29 ноября 2018 года № А-11/361. Зарегистрировано Департаментом юстиции Акмолинской области 30 ноября 2018 года № 6882
title:
  rus: Об установлении квоты рабочих  мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Буландынскому району на 2019 год
  kaz: Бұланды ауданы бойынша 2019 жылға арналған пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарының квоталарын белгілеу туралы

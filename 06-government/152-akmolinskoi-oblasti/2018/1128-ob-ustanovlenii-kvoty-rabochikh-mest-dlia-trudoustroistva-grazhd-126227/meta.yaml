act_code: '126227'
requisite: Постановление акимата Коргалжынского района Акмолинской области от 28 ноября 2018 года № А-11/212. Зарегистрировано Департаментом юстиции Акмолинской области 29 ноября 2018 года № 6870
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в Коргалжынском районе на 2019 год
  kaz: 2019 жылға арналған Қорғалжын ауданында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

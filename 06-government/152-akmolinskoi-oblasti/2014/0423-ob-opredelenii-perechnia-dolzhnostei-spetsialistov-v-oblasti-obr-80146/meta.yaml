    kaz: Астрахан ауданы әкімдігінің 2014 жылғы 23 сәуірдегі № 126 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін білім беру, әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

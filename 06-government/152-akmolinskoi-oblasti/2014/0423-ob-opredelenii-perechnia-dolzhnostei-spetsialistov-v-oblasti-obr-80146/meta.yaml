requisite: Постановление акимата Астраханского района Акмолинской области от 23 апреля 2014 года № 126. Зарегистрировано Департаментом юстиции Акмолинской области 15 мая 2014 года № 4187. Утратило силу постановлением акимата Астраханского района Акмолинской области от 20 января 2016 года № 8
title:
  rus: Об определении перечня должностей специалистов в области образования, социального обеспечения, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

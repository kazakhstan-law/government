act_code: '85587'
requisite: Постановление акимата Буландынского района Акмолинской области от 24 декабря 2014 года № а-12/433. Зарегистрировано Департаментом юстиции Акмолинской области 29 декабря 2014 года № 4540
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Буландынскому району на 2015 год
  kaz: Бұланды ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

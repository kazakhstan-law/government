act_code: '86048'
requisite: Постановление акимата Жаркаинского района Акмолинской области от 23 декабря 2014 года № А-12/469. Зарегистрировано Департаментом юстиции Акмолинской области 13 января 2015 года № 4581. Утратило силу постановлением акимата Жаркаинского района Акмолинской области от 24 февраля 2016 года № А-2/66
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров  оплаты труда участников и источников их финансирования по Жаркаинскому району на 2015 год
  kaz: "Жарқайың ауданы бойынша\t2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы"

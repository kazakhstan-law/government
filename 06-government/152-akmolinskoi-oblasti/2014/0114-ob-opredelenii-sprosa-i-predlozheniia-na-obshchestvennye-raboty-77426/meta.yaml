act_code: '77426'
requisite: Постановление акимата Ерейментауского района Акмолинской области от 14 января 2014 года № а-1/42. Зарегистрировано Департаментом юстиции Акмолинской области 11 февраля 2014 года № 4003
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Ерейментаускому району на 2014 год
  kaz: Ерейментау ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

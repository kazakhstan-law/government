act_code: '84633'
requisite: Постановление акимата Жаксынского района Акмолинской области от 3 ноября 2014 года № а-9/416. Зарегистрировано Департаментом юстиции Акмолинской области 25 ноября 2014 года № 4474. Утратило силу постановлением акимата Жаксынского района Акмолинской области от 14 апреля 2016 года № а-3/85
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Жаксынском районе
  kaz: Жақсы ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

act_code: '79943'
requisite: Постановление акимата Акмолинской области от 3 апреля 2014 года № А-4/124. Зарегистрировано Департаментом юстиции Акмолинской области 12 мая 2014 года № 4174. Утратило силу постановлением акимата Акмолинской области от 4 июня 2015 года № А-6/255
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу жөне кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы"'

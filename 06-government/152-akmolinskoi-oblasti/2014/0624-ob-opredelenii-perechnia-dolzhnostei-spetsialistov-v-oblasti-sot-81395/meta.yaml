requisite: Постановление акимата Енбекшильдерского района Акмолинской области от 24 июня 2014 года № а-5/177. Зарегистрировано Департаментом юстиции Акмолинской области 15 июля 2014 года № 4278. Утратило силу постановлением акимата Енбекшильдерского района Акмолинской области от 1 июля 2015 года № а-7/136
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими работающих в сельской местности Енбекшильдерского района
  kaz: Еңбекшілдер ауданының азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

act_code: '77324'
requisite: Постановление акимата города Кокшетау Акмолинской области от 20 января 2014 года № А-1/53. Зарегистрировано Департаментом юстиции Акмолинской области 6 февраля 2014 года № 3999. Утратило силу постановлением акимата города Кокшетау Акмолинской области от 10 ноября 2015 года № А-11/1923
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по городу Кокшетау на 2014 год
  kaz: Көкшетау қаласы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '85097'
requisite: Постановление акимата Жаксынского района Акмолинской области от 19 ноября 2014 года № а-9/438. Зарегистрировано Департаментом юстиции Акмолинской области 11 декабря 2014 года № 4503
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Жаксынскому району на 2015 год
  kaz: Жақсы ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '77254'
requisite: Постановление акимата Бурабайского района Акмолинской области от 10 января 2014 года № а-1/10. Зарегистрировано Департаментом юстиции Акмолинской области 30 января 2014 года № 3995
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Бурабайскому району на 2014 год
  kaz: Бурабай ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '85569'
requisite: Постановление акимата Атбасарского района Акмолинской области от 8 декабря 2014 года № а-12/556. Зарегистрировано Департаментом юстиции Акмолинской области 29 декабря 2014 года № 4535
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Атбасарскому району на 2015 год
  kaz: Атбасар ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

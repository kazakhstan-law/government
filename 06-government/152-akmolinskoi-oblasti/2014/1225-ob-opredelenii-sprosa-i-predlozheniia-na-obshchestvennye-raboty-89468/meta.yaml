act_code: '89468'
requisite: Постановление акимата Аршалынского района Акмолинской области от 25 декабря 2014 года № А-491. Зарегистрировано Департаментом юстиции Акмолинской области 13 января 2015 года № 4582. Утратило силу постановлением акимата Аршалынского района Акмолинской области от 5 января 2016 года № А-04
title:
  rus: Об определении спроса и предложения на общественные работы, утверждения перечня организаций, видов, объемов и конкретных условий общественных работ, размер оплаты труда участников и источник их финансирования по Аршалынскому району на 2015 год
  kaz: Аршалы ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

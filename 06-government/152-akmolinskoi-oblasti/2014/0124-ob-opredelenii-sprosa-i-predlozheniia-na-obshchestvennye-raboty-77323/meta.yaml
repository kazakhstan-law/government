  title:
    rus: О внесении изменений в постановление акимата Аршалынского района от 24 января 2014 года № А-38 "Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размер оплаты труда участников и источников их финансирования по Аршалынскому району на 2014 год"
    kaz: '"Аршалы ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы" Аршалы ауданы әкімдігінің 2014 жылғы 24 қаңтардағы № А-38 қаулысына өзгерістер енгізу туралы'

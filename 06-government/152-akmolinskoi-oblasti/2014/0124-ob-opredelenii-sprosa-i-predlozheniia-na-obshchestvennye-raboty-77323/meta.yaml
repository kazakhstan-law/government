act_code: '77323'
requisite: Постановление акимата Аршалынского района Акмолинской области от 24 января 2014 года № А-38. Зарегистрировано Департаментом юстиции Акмолинской области 5 февраля 2014 года № 3998
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размер оплаты труда участников и источников их финансирования по Аршалынскому району на 2014 год
  kaz: Аршалы ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

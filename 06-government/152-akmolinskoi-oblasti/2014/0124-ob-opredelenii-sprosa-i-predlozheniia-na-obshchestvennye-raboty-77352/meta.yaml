act_code: '77352'
requisite: Постановление акимата Жаксынского района Акмолинской области от 24 января 2014 года № а-0/18. Зарегистрировано Департаментом юстиции Акмолинской области 11 февраля 2014 года № 4002
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их фининсирования по Жаксынскому району на 2014 год
  kaz: Жақсы ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '77451'
requisite: Постановление акимата Целиноградского района Акмолинской области от 29 января 2014 года № А-1/11. Зарегистрировано Департаментом юстиции Акмолинской области 18 февраля 2014 года № 4010
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Целиноградскому району на 2014 год
  kaz: Целиноград ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы

act_code: '78875'
requisite: Постановление акимата Акмолинской области от 28 февраля 2014 года № А-3/65. Зарегистрировано Департаментом юстиции Акмолинской области 11 апреля 2014 года № 4090. Утратило силу постановлением акимата Акмолинской области от 27 мая 2015 года № А-6/236
title:
  rus: Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
  kaz: '"Ауылдық елдi мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтiк қолдау шараларын ұсыну" мемлекеттiк көрсетілетін қызмет регламентiн бекiту туралы'

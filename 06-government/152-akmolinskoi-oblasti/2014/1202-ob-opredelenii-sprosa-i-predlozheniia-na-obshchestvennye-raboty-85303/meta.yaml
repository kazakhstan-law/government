  title:
    rus: О внесении изменений в постановление акимата Аккольского района от 2 декабря 2014 года № А-12/487 «Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Аккольскому району на 2015 год»
    kaz: Ақкөл ауданы әкімдігінің 2014 жылғы 2 желтоқсандағы № А-12/487 «Ақкөл ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы» қаулысына өзгерістер енгізу туралы

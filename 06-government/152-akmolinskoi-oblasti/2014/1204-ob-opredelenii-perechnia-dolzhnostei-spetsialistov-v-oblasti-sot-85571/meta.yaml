requisite: Постановление акимата Бурабайского района Акмолинской области от 4 декабря 2014 года № а-12/775. Зарегистрировано Департаментом юстиции Акмолинской области 29 декабря 2014 года № 4536. Утратило силу постановлением акимата Бурабайского района Акмолинской области от 30 декабря 2015 года № а-12/567
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта, являющихся гражданскими служащими и работающих в сельской местности Бурабайского района
  kaz: Бурабай ауданының ауылдық жерінде жұмыс істейтін және азаматтық қызметшілер болып табылатын, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандар лауазымдарының тізбесін белгілеу туралы

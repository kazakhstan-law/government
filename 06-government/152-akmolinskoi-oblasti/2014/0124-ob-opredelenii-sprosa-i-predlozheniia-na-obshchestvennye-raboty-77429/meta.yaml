act_code: '77429'
requisite: Постановление акимата Егиндыкольского района Акмолинской области от 24 января 2014 года № а-1/12. Зарегистрировано Департаментом юстиции Акмолинской области 17 февраля 2014 года № 4006
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Егиндыкольскому району на 2014 год
  kaz: Егіндікөл ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұраныс пен ұсыныс айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және оларды қаржыландыру көздерін бекіту туралы

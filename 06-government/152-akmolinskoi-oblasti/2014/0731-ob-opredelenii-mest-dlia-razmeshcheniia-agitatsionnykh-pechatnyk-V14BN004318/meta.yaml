  title:
    rus: О внесении изменений в постановление акимата Зерендинского района Акмолинской области от 31 июля 2014 года № 474 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями в Зерендинском районе»
    kaz: «Зеренді ауданында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесу үшін үй-жайлар ұсыну туралы» Ақмола облысы Зеренді ауданы әкімдігінің 2014 жылғы 31 маусымдағы № 474 қаулысына өзгерістер енгізу туралы

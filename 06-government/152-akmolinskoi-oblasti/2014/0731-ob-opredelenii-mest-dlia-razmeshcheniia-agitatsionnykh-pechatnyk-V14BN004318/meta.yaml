  title:
    rus: О внесении изменения в постановление акимата Зерендинского района от 31 июля 2014 года № 474 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями в Зерендинском районе»
    kaz: «Зеренді ауданында үгіттік баспа материалдарын орналастыру орындарын айқындау және сайлаушылармен кездесулер өткізу үшін үй-жайлар беру туралы» Зеренді ауданы әкімдігінің 2014 жылғы 31 шілдедегі № 474 қаулысына өзгеріс енгізу туралы

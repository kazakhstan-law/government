act_code: '85091'
requisite: Постановление акимата Енбекшильдерского района Акмолинской области от 24 ноября 2014 года № а-8/343. Зарегистрировано Департаментом юстиции Акмолинской области 11 декабря 2014 года № 4501
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Енбекшильдерскому району на 2015 год
  kaz: Еңбекшілдер ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы

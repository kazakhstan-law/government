act_code: '77685'
requisite: Постановление акимата Астраханского района Акмолинской области от 10 февраля 2014 года № 56. Зарегистрировано Департаментом юстиции Акмолинской области 27 февраля 2014 года № 4020
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Астраханскому району на 2014 год
  kaz: Астрахан ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '77253'
requisite: Постановление акимата Аккольского района Акмолинской области от 23 января 2014 года № А-1/18. Зарегистрировано Департаментом юстиции Акмолинской области 30 января 2014 года № 3994
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Аккольскому району на 2014 год
  kaz: Ақкөл ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

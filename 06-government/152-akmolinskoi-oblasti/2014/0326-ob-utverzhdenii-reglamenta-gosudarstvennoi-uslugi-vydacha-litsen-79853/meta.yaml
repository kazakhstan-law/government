  title:
    rus: О внесении дополнений в постановление акимата Акмолинской области от 26 марта 2014 года № А-3/105 «Об утверждении регламента государственной услуги «Выдача  лицензии, переоформление, выдача дубликатов лицензии на оказание услуг по складской  деятельности с выдачей зерновых расписок»
    kaz: «Астық қолхаттарын бере отырып, қойма қызметі бойынша қызметтер көрсетуге лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру»  мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Ақмола облысы әкімдігінің 2014 жылғы 26 наурыздағы № А-3/105 қаулысына толықтырулар енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Шортандинского района от 24 декабря 2014 года № А-12/298 «Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования на 2015 год»
    kaz: Шортанды ауданы әкімдігінің «2015 жылға арналған қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы» 2014 жылғы 24 желтоқсандағы № А-12/298 қаулысына өзгеріс енгізу туралы

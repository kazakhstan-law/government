  kaz: 2015 жылға арналған қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын,  қатысушылардың еңбегіне төленетін ақының мөлшерін  және олардың қаржыландыру көздерін бекіту туралы

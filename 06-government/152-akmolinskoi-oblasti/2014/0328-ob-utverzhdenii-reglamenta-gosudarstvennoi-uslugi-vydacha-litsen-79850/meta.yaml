act_code: '79850'
requisite: Постановление акимата Акмолинской области от 28 марта 2014 года № А-3/110. Зарегистрировано Департаментом юстиции Акмолинской области 6 мая 2014 года № 4158. Утратило силу постановлением акимата Акмолинской области от 9 сентября 2015 года № А-9/421
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов, за исключением деятельности по реализации лома и отходов цветных и черных металлов, образовавшихся у юридических лиц в ходе собственного производства и в результате приобретения имущественного комплекса, в составе которого находились лом и (или) отходы цветных и (или) черных металлов, лицензиатам"
  kaz: '"Заңды тұлғаларда өз өндiрiсi барысында және құрамында түстi және (немесе) қара металл сынықтары және (немесе) қалдықтары болған мүлiктiк кешендi сатып алу нәтижесiнде пайда болған түстi және қара металл сынықтары мен қалдықтарын өткiзу жөнiндегi қызметтi қоспағанда, заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және лицензиаттарға өткiзу жөнiндегi қызметтi жүзеге асыруға лицензия беру, қайта ресiмдеу, лицензияның телнұсқаларын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

requisite: Постановление акимата Ерейментауского района Акмолинской области от 8 деакбря 2014 года № а-12/638. Зарегистрировано Департаментом юстиции Акмолинской области 6 января 2015 года № 4554
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня  организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников  их финансирования по Ерейментаускому району на 2015 год
  kaz: Ерейментау ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

requisite: Постановление акимата Акмолинской области от 19 марта 2014 года № А-3/91. Зарегистрировано Департаментом юстиции Акмолинской области 28 апреля 2014 года № 4133. Утратило силу постановлением акимата Акмолинской области от 16 июня 2015 года № А-6/278
title:
  rus: Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений), определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения)"
  kaz: '"Ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік көрсетілетін қызметтің регламентін бекіту туралы'

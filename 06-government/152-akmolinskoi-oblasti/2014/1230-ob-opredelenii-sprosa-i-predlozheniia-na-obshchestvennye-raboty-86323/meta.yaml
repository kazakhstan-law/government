act_code: '86323'
requisite: Постановление акимата Егиндыкольского района Акмолинской области от 30 декабря 2014 года № а-12/315. Зарегистрировано Департаментом юстиции Акмолинской области 26 января 2015 года № 4616
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров  оплаты труда участников и источников их финансирования по Егиндыкольскому району на 2015 год
  kaz: Егіндікөл ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және оларды қаржыландыру көздерін бекіту туралы

act_code: '86128'
requisite: Постановление акимата Астраханского района Акмолинской области от 23 декабря 2014 года № 439. Зарегистрировано Департаментом юстиции Акмолинской области 8 января 2015 года № 4570
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Астраханскому району на 2015 год
  kaz: Астрахан ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

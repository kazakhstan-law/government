  title:
    rus: О внесении изменений в постановление акимата Сандыктауского района от 20 января 2014 года № А-1/19 "Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Сандыктаускому району на 2014 год"
    kaz: Сандықтау ауданы әкімдігінің 2014 жылғы 20 қаңтардағы № А-1/19 "Сандықтау ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерлерін және олардың қаржыландыру көздерін бекіту туралы" қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Сандыктауского района Акмолинской области от 20 января 2014 года № А-1/19. Зарегистрировано Департаментом юстиции Акмолинской области 5 февраля 2014 года № 3997
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Сандыктаускому району на 2014 год
  kaz: Сандықтау ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

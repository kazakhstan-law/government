requisite: Постановление акимата Коргалжынского района Акмолинской области от 11 июня 2014 года № 114. Зарегистрировано Департаментом юстиции Акмолинской области 1 июля 2014 года № 4251. Утратило силу постановлением акимата Коргалжынского района Акмолинской области от 19 апреля 2016 года № 61/1
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а так же лиц, освобожденных из мест лишения свободы в Коргалжынском районе
  kaz: Қорғалжын ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

act_code: '86010'
requisite: Постановление акимата города Кокшетау Акмолинской области от 24 декабря 2014 года № А-12/2212. Зарегистрировано Департаментом юстиции Акмолинской области 15 января 2015 года № 4588
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по городу Кокшетау на 2015 год
  kaz: Көкшетау қаласы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

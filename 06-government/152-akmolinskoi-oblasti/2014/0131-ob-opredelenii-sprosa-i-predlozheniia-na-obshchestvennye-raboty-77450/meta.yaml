act_code: '77450'
requisite: Постановление акимата Зерендинского района Акмолинской области от 31 января 2014 года № 71. Зарегистрировано Департаментом юстиции Акмолинской области 18 февраля 2014 года № 4009
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Зерендинскому району на 2014 год
  kaz: Зеренді ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұраныс пен ұсыныс айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы

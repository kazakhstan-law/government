act_code: '77498'
requisite: Постановление акимата Коргалжынского района Акмолинской области от 4 февраля 2014 года № 19. Зарегистрировано Департаментом юстиции Акмолинской области 20 февраля 2014 года № 4014. Утратило силу постановлением акимата Коргалжынского района Акмолинской области от 2 марта 2016 года № 39
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Коргалжынскому району на 2014 год
  kaz: Қорғалжын ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұраныс пен ұсыныс айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және оларды қаржыландыру көздерін бекіту туралы

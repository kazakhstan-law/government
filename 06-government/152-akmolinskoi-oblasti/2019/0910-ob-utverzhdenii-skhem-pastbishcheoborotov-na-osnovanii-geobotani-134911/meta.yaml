  requisite: Постановление акимата района Биржан сал Акмолинской области от 23 декабря 2021 года № а-12/275
  title:
    rus: О внесении изменений и дополнений в постановление акимата района Биржан сал от 10 сентября 2019 года № а-9/229 «Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ Аксуского сельского округа, Ангалбатырского сельского округа, Баймырзинского сельского округа, Бирсуатского сельского округа, Донского сельского округа, Енбекшильдерского сельского округа, Заураловского сельского округа, Макинского сельского округа, Валихановского сельского округа, Ульгинского сельского округа, села Кенащи и села Краснофлотское района Биржан сал»
    kaz: «Біржан сал ауданының Ақсу ауылдық округінің, Аңғалбатыр ауылдық округінің, Баймырза ауылдық округінің, Бірсуат ауылдық округінің, Дон ауылдық округінің, Еңбекшілдер ауылдық округінің, Заурал ауылдық округінің, Макин ауылдық округінің, Уәлиханов ауылдық округінің, Үлгі ауылдық округінің, Кенащы ауылының және Краснофлотское ауылының жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы» Біржан сал ауданы әкімдігінің 2019 жылдың 10 қыркүйектегі № а-9/229 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/162449/rus

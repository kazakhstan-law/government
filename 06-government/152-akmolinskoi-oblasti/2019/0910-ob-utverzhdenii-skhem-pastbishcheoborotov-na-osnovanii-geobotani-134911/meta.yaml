title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ Ангалбатырского, Баймырзинского, Бирсуатского, Донского, Енбекшильдерского, Заураловского, Макинского, Валихановского, Ульгинского сельский округов и сел Аксу, Кенащи, Краснофлотское, Мамай района Биржан сал
  kaz: Біржан сал ауданының Аңғал батыр, Баймырза, Бірсуат, Донской, Еңбекшілдер, Заурал, Макинка, Уәлихан, Үлгі ауылдық округтерінің және Ақсу, Кенащы, Краснофлот, Мамай ауылдарының жайылымдарын геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы

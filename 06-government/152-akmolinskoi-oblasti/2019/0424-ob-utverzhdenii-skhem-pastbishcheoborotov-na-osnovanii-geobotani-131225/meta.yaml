requisite: Постановление акимата Жаксынского района Акмолинской области от 24 апреля 2019 года № а-1/74. Зарегистрировано Департаментом юстиции Акмолинской области 2 мая 2019 года № 7159. Утратило силу постановлением акимата Жаксынского района Акмолинской области от 5 августа 2021 года № а-7/144 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ села Белагаш, села Подгорное, села Чапаевское, села Терсакан, села Киевское, села Калининское Калининского сельского округа, Запорожского сельского округа, Ишимского сельского округа, Жанакийминского сельского округа, Беловодского сельского округа, Тарасовского сельского округа, села Новокиенка, Кызылсайского сельского округа Жаксынского района
  kaz: Жақсы ауданы Белағаш ауылының, Подгорное ауылының, Чапай ауылының, Терісаққан ауылының, Киев ауылының, Калинин ауылдық округінің Калинин ауылының, Запорожье ауылдық округінің, Ешім ауылдық округінің, Жаңа Қийма ауылдық округінің, Беловод ауылдық округінің, Тарас ауылдық округінің, Новокиенка ауылының, Қызылсай ауылдық округінің жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы

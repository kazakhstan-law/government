act_code: '136039'
requisite: Постановление акимата Буландынского района Акмолинской области от 15 ноября 2019 года № А-11/323. Зарегистрировано Департаментом юстиции Акмолинской области 18 ноября 2019 года № 7484
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Буландынскому району на 2020 год
  kaz: Бұланды ауданы бойынша 2020 жылға арналған пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

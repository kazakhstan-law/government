requisite: Постановление акимата Жаркаинского района Акмолинской области от 20 августа 2019 года № А-8/321. Зарегистрировано Департаментом юстиции Акмолинской области 23 августа 2019 года № 7331. Утратило силу постановлением акимата Жаркаинского района Акмолинской области от 13 марта 2020 года № А-3/82 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ cела Бирсуат, села Гастелло, села Далабай, села Кумсуат, села Львовское, села Пригородное, села Пятигорское, села Тасоткель, села Тассуат, села Шойындыколь, села Костычево Костычевского сельского округа, села Отрадное Отрадного сельского округа, села Валиханово Валихановского сельского округа, Нахимовского сельского округа, Жанадалинского сельского округа Жаркаинского района
  kaz: Жайылымдарды геоботаникалық зерттеп-қарау негізінде Жарқайың ауданының Бірсуат ауылының, Гастелло ауылының, Далабай ауылының, Құмсуат ауылының, Львов ауылының, Пригород ауылының, Пятигор ауылының, Тасөткел ауылының, Тассуат ауылының, Шойындыкөл ауылының, Костычево ауылдық округінің Костычево ауылының, Отрадный ауылдық округінің Отрадный ауылының, Уәлихан ауылдық округінің Уәлихан ауылының, Нахимов ауылдық округінің, Жаңадала ауылдық округінің жайылым айналымдарының схемаларын бекіту туралы

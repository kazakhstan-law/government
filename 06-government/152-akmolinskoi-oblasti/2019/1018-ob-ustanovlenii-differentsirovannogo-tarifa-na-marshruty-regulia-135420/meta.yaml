requisite: Постановление акимата города Кокшетау Акмолинской области от 18 октября 2019 года № А-10/1886. Зарегистрировано Департаментом юстиции Акмолинской области 21 октября 2019 года № 7427. Утратило силу постановлением акимата города Кокшетау Акмолинской области от 22 мая 2023 года № А-5/870 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

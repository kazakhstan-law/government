  title:
    rus: О внесении изменений в постановление акимата Бурабайского района от 17 мая 2019 года № а-5/194 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями»
    kaz: Бурабай ауданы әкімдігінің 2019 жылғы 17 мамырдағы № а-5/194 «Үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

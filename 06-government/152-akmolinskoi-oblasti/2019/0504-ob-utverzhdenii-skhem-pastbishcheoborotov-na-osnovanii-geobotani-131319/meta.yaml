act_code: '131319'
requisite: Постановление акимата Астраханского района Акмолинской области от 4 мая 2019 года № 116. Зарегистрировано Департаментом юстиции Акмолинской области 6 мая 2019 года № 7171. Утратило силу постановлением акимата Астраханского района Акмолинской области от 8 ноября 2022 года № А-11/214 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ Астраханского сельского округа, Новочеркасского сельского округа, Есильского сельского округа, Кызылжарского сельского округа, Острогорского сельского округа, Первомайского сельского округа, Николаевского сельского округа, Староколутонского сельского округа, Узункольского сельского округа и села Каменка Астраханского района
  kaz: Астрахан ауданы Астрахан ауылдық округінің, Новочеркасск ауылдық округінің, Есіл ауылдық округінің, Қызылжар ауылдық округінің, Острогорск ауылдық округінің, Первомай ауылдық округінің, Николаев ауылдық округінің, Старый Колутон ауылдық округінің, Ұзынкөл ауылдық округінің және Каменка ауылының жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы

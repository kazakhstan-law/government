  requisite: Постановление акимата Астраханского района Акмолинской области от 14 августа 2020 года № 157. Зарегистрировано Департаментом юстиции Акмолинской области 19 августа 2020 года № 7992. Утратило силу постановлением акимата Астраханского района Акмолинской области от 8 ноября 2022 года № А-11/214 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Астраханского района от 4 мая 2019 года № 116 «Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ Астраханского сельского округа, Новочеркасского сельского округа, Бесбидаикского сельского округа, Есильского сельского округа, Жарсуатского сельского округа, Кызылжарского сельского округа, Острогорского сельского округа, Первомайского сельского округа, Николаевского сельского округа, Староколутонского сельского округа, Узункольского сельского округа и села Каменка Астраханского района»
    kaz: Астрахан ауданы әкімдігінің 2019 жылғы 4 мамырдағы № 116 «Астрахан ауданы Астрахан ауылдық округінің, Новочеркасск ауылдық округінің, Бесбидайық ауылдық округінің, Есіл ауылдық округінің, Жарсуат ауылдық округінің, Қызылжар ауылдық округінің, Острогорск ауылдық округінің, Первомай ауылдық округінің, Николаев ауылдық округінің, Старый Колутон ауылдық округінің, Ұзынкөл ауылдық округінің және Каменка ауылының жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

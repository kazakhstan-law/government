requisite: Постановление акимата города Степногорска Акмолинской области от 11 ноября 2019 года № а-11/511. Зарегистрировано Департаментом юстиции Акмолинской области 14 ноября 2019 года № 7475
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в городе Степногорске на 2020 год
  kaz: 2020 жылға арналған Степногорск қаласында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

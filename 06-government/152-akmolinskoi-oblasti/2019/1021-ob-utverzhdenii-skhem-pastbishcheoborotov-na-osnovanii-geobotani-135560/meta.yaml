act_code: '135560'
requisite: Постановление акимата Атбасарского района Акмолинской области от 21 октября 2019 года № а-10/426. Зарегистрировано Департаментом юстиции Акмолинской области 28 октября 2019 года № 7439
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ села Борисовка, села Новосельское, селького округа Акана Курманова, сельского округа Бастау, Полтавского сельского округа, Покровского сельского округа, Макеевского сельского округа, Сергеевского сельского округа, Мариновского сельского округа, Шункыркольского сельского округа Атбасарского района
  kaz: Жайылымдарды геоботаникалық зерттеп-қарау негізінде Атбасар ауданының Борисовка ауылының, Новосельское ауылының, Ақан Құрманов ауылдық округінің, Бастау ауылдық округінің, Полтавка ауылдық округінің, Покровка ауылдық округінің, Макеевка ауылдық округінің, Сергеевка ауылдық округінің, Мариновка ауылдық округінің, Шұңқыркөл ауылдық округінің жайылым айналымдарының схемаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Бурабайского района от 10 апреля 2019 года № а-4/139 «Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ сельских округов и села Наурызбай батыра Бурабайского района»
    kaz: «Бурабай ауданы ауылдық округтерінің және Наурызбай батыр ауылының жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы» Бурабай ауданы әкімдігінің 2019 жылғы 10 сәуірдегі № а-4/139 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Целиноградского района от 30 декабря 2019 года № А-3/619 «Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ Нуресильского сельского округа, сельского округа Кабанбай батыра, Караоткельского сельского округа, Кояндинского сельского округа, Косшынского сельского округа, Жарлыкольского сельского округа, сельского округа Тасты, Арайлынского сельского округа, Жанаесильского сельского округа, Оразакского сельского округа, сельского округа Родина, Приреченского сельского округа, сельского округа Рахымжана Кошкарбаева, Софиевского сельского округа, Талапкерского сельского округа, Шалкарского сельского округа Целиноградского района»
    kaz: «Целиноград ауданы Нұресіл ауылдық округі, Қабанбай батыр ауылдық округі, Қараөткел ауылдық округі, Қоянды ауылдық округі, Қосшы ауылдық округі, Жарлыкөл ауылдық округі, Тасты ауылдық округі, Арайлы ауылдық округі, Жаңаесіл ауылдық округі, Оразақ ауылдық округі, Родина ауылдық округі, Приречный ауылдық округі, Рахымжан Қошқарбаев ауылдық округі, Софиевка ауылдық округі, Талапкер ауылдық округі, Шалқар ауылдық округі бойынша жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы» Целиноград ауданы әкімдігінің 2019 жылғы 30 желтоқсандағы № А-3/619 қаулысына өзгерістер енгізу туралы

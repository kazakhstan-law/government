act_code: '137796'
requisite: Постановление акимата Целиноградского района Акмолинской области от 30 декабря 2019 года № А-3/619. Зарегистрировано Департаментом юстиции Акмолинской области 31 декабря 2019 года № 7607. Утратило силу постановлением акимата Целиноградского района Акмолинской области от 21 июля 2022 года № А-7/212 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ Нуресильского сельского округа, сельского округа Кабанбай батыра, Караоткельского сельского округа, села Коянды, Косшынского сельского округа, Жарлыкольского сельского округа, сельского округа Тасты, Арайлынского сельского округа, Жанаесильского сельского округа, Оразакского сельского округа, сельского округа Родина, Приреченского сельского округа, сельского округа Рахымжана Кошкарбаева, Софиевского сельского округа, Талапкерского сельского округа, Шалкарского сельского округа Целиноградского района
  kaz: Целиноград ауданы Нұресіл ауылдық округі, Қабанбай батыр ауылдық округі, Қараөткел ауылдық округі, Қоянды ауылы, Қосшы ауылдық округі, Жарлыкөл ауылдық округі, Тасты ауылдық округі, Арайлы ауылдық округі, Жаңаесіл ауылдық округі, Оразақ ауылдық округі, Родина ауылдық округі, Приречный ауылдық округі, Рахымжан Қошқарбаев ауылдық округі, Софиевка ауылдық округі, Талапкер ауылдық округі, Шалқар ауылдық округі бойынша жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы

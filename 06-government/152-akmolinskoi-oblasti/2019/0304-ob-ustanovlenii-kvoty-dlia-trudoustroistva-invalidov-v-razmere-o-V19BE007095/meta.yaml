  title:
    rus: О признании утратившим силу постановления акимата Атбасарского района Акмолинской области «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Атбасарском районе» от 4 марта 2019 года № а-3/100
    kaz: Ақмола облысының Атбасар ауданы әкімдігінің 2019 жылдың 4 наурыздағы № а-3/100 «Атбасар ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» қаулысының күші жойылды деп тану туралы

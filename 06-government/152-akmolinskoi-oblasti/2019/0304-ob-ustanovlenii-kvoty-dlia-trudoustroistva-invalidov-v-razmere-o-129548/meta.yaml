act_code: '129548'
requisite: Постановление акимата Атбасарского района Акмолинской области от 4 марта 2019 года № а-3/100. Зарегистрировано Департаментом юстиции Акмолинской области 6 марта 2019 года № 7095. Утратило силу постановлением акимата Атбасарского района Акмолинской области от 10 января 2022 года № а-1/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Атбасарском районе
  kaz: Атбасар ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

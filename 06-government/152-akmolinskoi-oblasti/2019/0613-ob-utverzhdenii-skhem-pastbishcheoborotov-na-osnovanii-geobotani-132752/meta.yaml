act_code: '132752'
requisite: Постановление акимата Аккольского района Акмолинской области от 13 июня 2019 года № А-6/167. Зарегистрировано Департаментом юстиции Акмолинской области 24 июня 2019 года № 7248. Утратило силу постановлением акимата Аккольского района Акмолинской области от 29 июля 2021 года № А-7/210 (вступает в силу со дня подписания)
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ cела Азат, Жалгызкарагайского сельского округа, Кенесского сельского округа, Новорыбинского сельского округа, села Карасай и села Сазды булак Карасайского сельского округа Аккольского района
  kaz: Жайылымдарды геоботаникалық зерттеп-қарау негізінде Ақкөл ауданының Азат ауылының, Жалғызқарағай ауылдық округінің, Кеңес ауылдық округінің, Новорыбинка ауылдық округінің, Қарасай ауылдық округінің Қарасай ауылы және Сазды бұлақ ауылының жайылым айналымдарының схемаларын бекіту туралы

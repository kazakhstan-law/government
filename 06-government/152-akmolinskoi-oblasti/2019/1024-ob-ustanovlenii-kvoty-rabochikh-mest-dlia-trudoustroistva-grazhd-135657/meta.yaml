act_code: '135657'
requisite: Постановление акимата Егиндыкольского района Акмолинской области от 24 октября 2019 года № а-10/181. Зарегистрировано Департаментом юстиции Акмолинской области 31 октября 2019 года № 7454
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в Егиндыкольском районе на 2020 год
  kaz: 2020 жылға арналған Егіндікөл ауданында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

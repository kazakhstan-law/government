title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ поселка Красногорский, села Аксай, села Орловка, села Знаменка, села Курское, села Свободное, Бузулукского сельского округа, Двуреченского сельского округа, Зареченского сельского округа, Каракольского сельского округа, Юбилейного сельского округа, Интернационального сельского округа, Красивинского сельского округа Есильского района
  kaz: Жайылымдарды геоботаникалық зерттеп-қарау негізінде Есіл ауданының Красногорский кентінің, Ақсай ауылының, Орловка ауылының, Знаменка ауылының, Курский ауылының, Свободный ауылының, Бұзылық ауылдық округінің, Двуречный ауылдық округінің, Заречный ауылдық округінің, Қаракөл ауылдық округінің, Юбилейный ауылдық округінің, Интернациональный ауылдық округінің, Красивинский ауылдық округінің жайылым айналымдарының схемаларын бекіту туралы

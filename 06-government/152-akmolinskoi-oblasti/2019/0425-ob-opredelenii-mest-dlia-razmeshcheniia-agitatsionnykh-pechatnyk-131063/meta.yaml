  title:
    rus: О внесении изменений в постановление акимата Атбасарского района от 25 апреля 2019 года № а-4/173 «Об определении мест для размещения агитационных печатных материалов, предоставлении кандидатам помещений для встреч с избирателями»
    kaz: Атбасар ауданы әкімдігінің 2019 жылғы 25 сәуірдегі № а-4/173 «Үгіттік баспа материалдарын орналастыру үшін орындар белгілеу, кандидаттарға сайлаушылармен кездесу үшін үй-жайларды беру туралы» қаулысына өзгерістер енгізу туралы

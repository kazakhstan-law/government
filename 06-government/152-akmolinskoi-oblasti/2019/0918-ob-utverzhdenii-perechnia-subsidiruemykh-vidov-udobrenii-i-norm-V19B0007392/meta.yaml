  kaz: Субсидияланатын тыңайтқыштар түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялардың нормаларын бекіту туралы

requisite: Постановление Акимата Акмолинской области от 31 октября 2002 года № а-10/154. Зарегистрировано Управлением юстиции Акмолинской области 9 декабря 2002 года № 1432. Утратило силу постановлением акимата Акмолинской области от 10 ноября 2009 года № А-12/485
title:
  rus: Об утверждении инструкции по учету белья, постельных принадлежностей, одежды и обуви, норм и сроков носки одежды, обуви и мягкого инвентаря в учреждениях и организациях социальной защиты населения Акмолинской области
  kaz: Ақмола облысының әлеуметтік қорғау ұйымдары мен мекемелеріндегі киім-кешек пен төсек жабдықтарын, киімді, аяқ киімді есепке алу және киім мен аяқ киімді, жұмсақ мүлікті пайдалану нормалары мен мерзімдері жөніндегі нұсқаулықты бекіту туралы

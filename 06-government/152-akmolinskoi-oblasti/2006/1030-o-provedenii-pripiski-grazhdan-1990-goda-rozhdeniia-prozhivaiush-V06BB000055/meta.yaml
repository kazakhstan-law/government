  kaz: Степногорск қаласы, Ақсу, Бестөбе, Заводской кенттерінде және Қарабұлақ ауылдық округінде тұратын 1990 жылы туған азаматтарды Степногорск қаласының қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне тіркеу жүргізу туралы

requisite: Постановление Акимата города Кокшетау Акмолинской области от 26 июня 2006 года № А-6/839. Зарегистрировано Управлением юстиции города Кокшетау 5 июля 2006 года № 1-1-49. Утратило силу - постановлением акимата города Кокшетау Акмолинской области от 23 сентября 2009 года № А-9/1810
title:
  rus: Об утверждении типовых договоров купли-продажи жилья, построенного в рамках реализации Государственной программы развития жилищного строительства в Республике Казахстан на 2005-2007 годы на территории города Кокшетау
  kaz: Көкшетау қаласының аумағында 2005-2007 жылдары Қазақстан Республикасындағы тұрғын үй құрлысын дамыту мемлекеттік бағдарламасын жүзеге асыру шегінде құрылған тұрғын үй сатып алу және сату типтік келісімшартын бекіту туралы

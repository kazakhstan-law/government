title:
  rus: О проведении очередного призыва граждан в возрасте от 18 до 27 лет, не имеющих права на отсрочку или на освобождение от призыва на срочную военную службу в апреле-июне и октябре-декабре 2006 года
  kaz: Әскерге шақырудан кейін қалуға немесе босатылуға құқықтары жоқ, 18 бен 27 жас аралығындағы азаматтарды кезекті рет 2006 жылдың сәуір-маусымында және қазан-желтоқсанында мерзімнен тыс әскери қызметке шақыртуды өткізу туралы

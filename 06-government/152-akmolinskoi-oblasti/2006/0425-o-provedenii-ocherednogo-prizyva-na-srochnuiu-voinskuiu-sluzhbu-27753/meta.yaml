requisite: Постановление акимата Сандыктауского района Акмолинской области от 25 апреля 2006 года № А-4/85. Зарегистрировано Управлением юстиции Сандыктауского района Акмолинской области 4 мая 2006 года № 1-16-37. Утратило силу постановлением акимата Сандыктауского района Акмолинской области от 25 апреля 2007 года № А-3/79
title:
  rus: О проведении очередного призыва на срочную воинскую службу граждан 1988 года рождения, а также граждан 1979-1987 гг. рождения, у которых истекли сроки отсрочки от призыва на срочную военную службу в апреле-июне и октябре-декабре 2006 года
  kaz: 1988 жылы туған азаматтарды, сондай-ақ мерзімді әскери қызметке шакырудан мерзімі өткен 1979-1987 жылдары туған азаматттарды, 2006 жылғы сәуір-маусым және қазан-желтоқсан айларында мерзімді әскери қызметке кезекті шақырудан өткізу туралы

act_code: '199339'
requisite: Постановление акимата Ерейментауского района Акмолинской области от 5 июля 2024 года № а-7/194
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунальных государственных учреждений «Молодежный ресурсный центр» и «Центр изучения языков» отдела внутренней политики, культуры и развития языков Ерейментауского района
  kaz: Ерейментау ауданы ішкі саясат, мәдениет және тілдерді дамыту бөлімінің «Жастар ресурстық орталығы» және «Тілдерді оқыту орталығы» коммуналдық мемлекеттік мекемелері қызметкерлерінің лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы

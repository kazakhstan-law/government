  title:
    rus: О внесения изменения в постановление акимата Ерейментауского района от 05 июля 2024 года № а-7/194 «Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунальных государственных учреждений «Молодежный ресурсный центр» и «Центр изучения языков» отдела внутренней политики, культуры и развития языков Ерейментауского района»
    kaz: «Ерейментау ауданы ішкі саясат, мәдениет және тілдерді дамыту бөлімінің «Жастар ресурстық орталығы» және «Тілдерді оқыту орталығы» коммуналдық мемлекеттік мекемелері қызметкерлерінің лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы» Ерейментау ауданы әкімдігінің 2024 жылғы 05 шілдедегі № а-7/194 қаулысына өзгеріс енгізу туралы

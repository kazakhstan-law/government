act_code: '202189'
requisite: Постановление акимата Шортандинского района Акмолинской области от 15 октября 2024 года № А-4/231. Отменено постановлением акимата Шортандинского района Акмолинской области от 5 ноября 2024 года № А-4/244
title:
  rus: Об определения порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Молодежный ресурсный центр» отдела внутренней политики, культуры, развития языков и спорта Шортандинского района
  kaz: Шортанды ауданының ішкі саясат, мәдениет, тілдерді дамыту және спорт бөлімінің «Жастар ресурстық орталығы» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы

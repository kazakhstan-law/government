  title:
    rus: О внесении изменений в постановление акимата Шортандинского района от 17 ноября 2025 года № А-3/236 «Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунальных государственных учреждений «Молодежный ресурсный центр» и «Центр обучения языкам» отдела внутренней политики, культуры и развития языков Шортандинского района»
    kaz: Шортанды ауданы әкімдігінің 2025 жылғы 17 қарашадағы № А-3/236 «Шортанды ауданының ішкі саясат, мәдениет және тілдерді дамыту бөлімінің «Жастар ресурстық орталығы» және «Тілдерді оқыту орталығы» коммуналдық мемлекеттік мекемелері қызметкерлерінің лауазымдық айлық ақыларына ынталандырушы үстемақылар белгілеу тәртібі мен шарттарын айқындау туралы» қаулысына өзгерістер енгізу туралы

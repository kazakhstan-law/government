title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунальных государственных учреждений «Молодежный ресурсный центр» и «Центр обучения языкам» отдела внутренней политики и развития языков Шортандинского района
  kaz: Шортанды ауданының ішкі саясат және тілдерді дамыту бөліміне қарасты «Жастар ресурстық орталығы» және «Тілдерді оқыту орталығы» коммуналдық мемлекеттік мекемелері қызметкерлерінің лауазымдық айлық ақыларына ынталандырушы үстемақылар белгілеу тәртібі мен шарттарын айқындау туралы

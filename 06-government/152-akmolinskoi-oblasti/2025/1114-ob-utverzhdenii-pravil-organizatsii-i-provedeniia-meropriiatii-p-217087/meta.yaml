requisite: Постановление акимата Шортандинского района Акмолинской области от 14 ноября 2025 года № А-3/233
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Шортандинского района
  kaz: Шортанды ауданының елді мекендеріне бірыңғай сәулеттік көрініс беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

requisite: Постановление акимата Сандыктауского района Акмолинской области от 1 ноября 2017 года № А-11/269. Зарегистрировано Департаментом юстиции Акмолинской области 21 ноября 2017 года № 6174
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Сандыктаускому району на 2018 год
  kaz: 2018 жылға арналған Сандықтау ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

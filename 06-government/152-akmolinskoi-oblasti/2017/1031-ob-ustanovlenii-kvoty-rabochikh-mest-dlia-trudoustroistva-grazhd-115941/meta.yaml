act_code: '115941'
requisite: Постановление акимата Аккольского района Акмолинской области от 31 октября 2017 года № А-10/302. Зарегистрировано Департаментом юстиции Акмолинской области 8 ноября 2017 года № 6157
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации по Аккольскому району на 2018 год
  kaz: Ақкөл ауданы бойынша 2018 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

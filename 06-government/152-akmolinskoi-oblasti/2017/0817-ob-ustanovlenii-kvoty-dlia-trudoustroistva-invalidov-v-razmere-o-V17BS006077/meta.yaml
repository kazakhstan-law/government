  title:
    rus: О признании утратившим силу постановления акимата Бурабайского «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Бурабайском районе» от 17 августа 2017 года № а-7/271
    kaz: Бурабай ауданы әкімдігінің 2017 жылғы 17 тамыздағы № А-7/271 «Бурабай ауданында ауыр жұмыстардағы, зиянды, қауіпті еңбек жағдайлары бар жұмыстардағы жұмыс орындарын есепке алмай, жұмыс орындары санының екіден төрт пайызына дейінгі мөлшерінде мүгедектер үшін жұмыс орындарының квотасынн белгілеу туралы» күші жойылды деп тану туралы

  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 18 сентября 2017 года № А-10/398 «Об утверждении размеров выплат ежемесячного денежного содержания спортсменам Акмолинской области, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд»
    kaz: «Ақмола облысының спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы» Ақмола облысы әкімдігінің 2017 жылғы 18 қыркүйектегі № А-10/398 қаулысына өзгеріс енгізу туралы

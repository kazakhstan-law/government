requisite: Постановление акимата Есильского района Акмолинской области от 9 августа 2017 года № а-8/233. Зарегистрировано Департаментом юстиции Акмолинской области 13 сентября 2017 года № 6072. Утратило силу постановлением акимата Есильского района Акмолинской области от 8 декабря 2021 года № а-12/260 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Есильском районе
  kaz: Есіл ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

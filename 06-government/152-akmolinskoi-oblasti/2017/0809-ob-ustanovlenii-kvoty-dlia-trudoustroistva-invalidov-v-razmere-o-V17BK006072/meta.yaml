  title:
    rus: О признании утратившим силу постановления акимата Есильского района Акмолинской области от 9 августа 2017 года № а-8/233 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Есильском районе»
    kaz: Ақмола облысы Есіл ауданы әкімдігінің «Есіл ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» 2017 жылғы 9 тамыздағы № а-8/233 қаулысының күші жойылды деп тану туралы

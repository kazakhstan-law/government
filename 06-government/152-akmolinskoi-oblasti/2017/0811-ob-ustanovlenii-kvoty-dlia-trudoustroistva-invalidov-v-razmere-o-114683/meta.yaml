act_code: '114683'
requisite: Постановление акимата Енбекшильдерского района Акмолинской области от 11 августа 2017 года № а-8/175. Зарегистрировано Департаментом юстиции Акмолинской области 11 сентября 2017 года № 6071. Утратило силу постановлением акимата района Биржан сал Акмолинской области от 28 марта 2018 года № а-3/124
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Енбекшильдерском районе
  kaz: Еңбекшілдер ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

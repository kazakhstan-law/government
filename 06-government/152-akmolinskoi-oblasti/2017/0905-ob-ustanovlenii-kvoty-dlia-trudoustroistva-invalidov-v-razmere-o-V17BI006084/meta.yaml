requisite: Постановление акимата Ерейментауского района Акмолинской области от 5 сентября 2017 года № а-9/277. Зарегистрировано Департаментом юстиции Акмолинской области 25 сентября 2017 года № 6084. Утратило силу постановлением акимата Ерейментауского района Акмолинской области от 21 декабря 2021 года № а-12/392 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Ерейментауском районе
  kaz: Ерейментау ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квоталар белгілеу туралы

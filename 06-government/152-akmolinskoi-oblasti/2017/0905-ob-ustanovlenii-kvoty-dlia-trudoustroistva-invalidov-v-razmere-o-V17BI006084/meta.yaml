  title:
    rus: О признании утратившим силу постановления акимата Ерейментауского района «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Ерейментауском районе» от 5 сентября 2017 года № а-9/277
    kaz: Ерейментау ауданы әкімдігінің 2017 жылғы 5 қыркүйектегі № а-9/277 «Ерейментау ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квоталар белгілеу туралы» қаулысының күші жойылды деп тану туралы

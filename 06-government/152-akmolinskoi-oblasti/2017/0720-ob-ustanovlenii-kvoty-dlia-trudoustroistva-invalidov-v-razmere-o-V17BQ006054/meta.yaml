requisite: Постановление акимата Целиноградского района Акмолинской области от 20 июля 2017 года № А-2/302. Зарегистрировано Департаментом юстиции Акмолинской области 17 августа 2017 года № 6054. Утратило силу постановлением акимата Целиноградского района Акмолинской области от 25 января 2022 года № А-1/11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Целиноградском районе
  kaz: Целиноград ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде жұмыс орындары санының екіден төрт пайызына дейінгі мөлшерiнде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

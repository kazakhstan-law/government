  title:
    rus: О признании утратившим силу постановление акимата Целиноградского района от 20 июля 2017 года № А-2/302 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Целиноградском районе»
    kaz: Целиноград ауданы әкімдігінің 2017 жылғы 20 шілдедегі № А-2/302 «Целиноград ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде жұмыс орындары санының екіден төрт пайызына дейінгі мөлшерiнде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» қаулысының күші жойылды деп тану туралы

requisite: Постановление акимата Акмолинской области от 20 сентября 2017 года № А-10/412. Зарегистрировано Департаментом юстиции Акмолинской области 16 октября 2017 года № 6120. Утратило силу постановлением акимата Акмолинской области от 21 февраля 2020 года № А-2/81 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача направления детям с ограниченными возможностями в специальные коррекционные и другие организации для получения медицинских, специальных образовательных и специальных социальных услуг»
  kaz: «Кемтар балаларға арнаулы түзеу ұйымдары мен басқа да ұйымдарға медициналық, арнаулы бiлiм және арнаулы әлеуметтiк қызметтердi алуы үшiн жолдама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

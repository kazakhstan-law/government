  title:
    rus: О признании утратившим силу постановления акимата города Степногорска от 28 июня 2017 года № а-6/331 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда по городу Степногорск»
    kaz: Степногорск қаласы әкімдігінің 2017 жылғы 28 маусымдағы № а-6/331 «Степногорск қаласы бойынша ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерiнде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» қаулысының күші жойылды деп тану туралы

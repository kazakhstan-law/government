act_code: '114271'
requisite: Постановление акимата Зерендинского района Акмолинской области от 25 июля 2017 года № А-7/342. Зарегистрировано Департаментом юстиции Акмолинской области 23 августа 2017 года № 6059. Утратило силу постановлением акимата Зерендинского района Акмолинской области от 14 марта 2022 года № А-3/167 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Зерендинском районе
  kaz: Зеренді ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

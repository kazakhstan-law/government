requisite: Постановление акимата Сандыктауского района Акмолинской области от 31 августа 2017 года № А-9/207. Зарегистрировано Департаментом юстиции Акмолинской области 6 октября 2017 года № 6101. Утратило силу постановлением акимата Сандыктауского района Акмолинской области от 8 апреля 2022 года № А-4/108 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда по Сандыктаускому району
  kaz: Сандықтау ауданы бойынша ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

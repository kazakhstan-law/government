  title:
    rus: О признании утратившим силу постановления акимата Сандыктауского района от 31 августа 2017 года № А-9/207 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда по Сандыктаускому району»
    kaz: Сандықтау ауданы әкімдігінің 2017 жылғы 31 тамыздағы № А-9/207 «Сандықтау ауданы бойынша ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» қаулысының күші жойылды деп тану туралы

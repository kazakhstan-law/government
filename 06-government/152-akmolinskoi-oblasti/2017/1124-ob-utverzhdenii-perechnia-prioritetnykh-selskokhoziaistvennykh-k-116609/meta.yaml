act_code: '116609'
requisite: Постановление акимата Акмолинской области от 24 ноября 2017 года № А-12/546. Зарегистрировано Департаментом юстиции Акмолинской области 5 декабря 2017 года № 6203. Утратило силу постановлением акимата Акмолинской области от 29 апреля 2019 года № А-5/196 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении перечня приоритетных сельскохозяйственных культур и норм субсидий на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым ауыл шаруашылығы дақылдарының тiзбесін және басым дақылдар өндіруді субсидиялау жолымен өсімдік шаруашылығы өнімінің өнімділігі мен сапасын арттыруға, жанар-жағармай материалдары мен көктемгi егіс және егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын бекіту туралы

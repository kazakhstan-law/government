requisite: Постановление акимата Акмолинской области от 3 августа 2017 года № А-8/338. Зарегистрировано Департаментом юстиции Акмолинской области 13 сентября 2017 года № 6074. Утратило силу постановлением акимата Акмолинской области от 3 мая 2022 года № А-5/222 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

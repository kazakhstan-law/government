  title:
    rus: О признании утратившим силу постановления акимата Егиндыкольского района Акмолинской области от 15 ноября 2017 года № а-11/188 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Егиндыкольском районе»
    kaz: Ақмола облысы Егіндікөл ауданы әкімдігінің «Егіндікөл ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квоталар белгілеу туралы» 2017 жылғы 15 қарашадағы № а-11/188 қаулысының күші жойылды деп тану туралы

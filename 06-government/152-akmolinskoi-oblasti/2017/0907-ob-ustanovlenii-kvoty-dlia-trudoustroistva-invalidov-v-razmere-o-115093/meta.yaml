act_code: '115093'
requisite: Постановление акимата Астраханского района Акмолинской области от 7 сентября 2017 года № 211. Зарегистрировано Департаментом юстиции Акмолинской области 6 октября 2017 года № 6104. Утратило силу постановлением акимата Астраханского района Акмолинской области от 13 декабря 2021 года № А-12/266 (вступает в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Астраханском районе
  kaz: Астрахан ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

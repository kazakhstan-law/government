act_code: '116220'
requisite: Постановление акимата Бурабайского района Акмолинской области от 20 ноября 2017 года № а-10/399. Зарегистрировано Департаментом юстиции Акмолинской области 24 ноября 2017 года № 6187
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в Бурабайском районе на 2018 год
  kaz: Бурабай ауданында 2018 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квоталарын белгілеу туралы

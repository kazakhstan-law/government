  title:
    rus: О признании утратившим силу постановления акимата Жаксынского района «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Жаксынском районе» от 12 мая 2017 года № а-4/100
    kaz: Жақсы ауданы әкімдігінің 2017 жылғы 12 мамырдағы № а-4/100 «Жақсы ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квоталар белгілеу туралы» қаулысының күші жойылды деп тану туралы

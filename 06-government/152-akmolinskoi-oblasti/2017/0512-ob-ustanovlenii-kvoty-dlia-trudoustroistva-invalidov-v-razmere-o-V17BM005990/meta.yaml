requisite: Постановление акимата Жаксынского района Акмолинской области от 12 мая 2017 года № а-4/100. Зарегистрировано Департаментом юстиции Акмолинской области 9 июня 2017 года № 5990. Утратило силу постановлением акимата Жаксынского района Акмолинской области от 8 декабря 2021 года № а-9/218 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Жаксынском районе
  kaz: Жақсы ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квоталар белгілеу туралы

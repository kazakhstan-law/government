requisite: Постановление акимата города Кокшетау Акмолинской области от 17 мая 2017 года № А-5/1407. Зарегистрировано Департаментом юстиции Акмолинской области 15 июня 2017 года № 5999. Утратило силу постановлением акимата города Кокшетау Акмолинской области от 14 декабря 2021 года № А-12/2421 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в городе Кокшетау
  kaz: Көкшетау қаласында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде жұмыс орындары санының екіден төрт пайызына дейінгі мөлшерiнде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

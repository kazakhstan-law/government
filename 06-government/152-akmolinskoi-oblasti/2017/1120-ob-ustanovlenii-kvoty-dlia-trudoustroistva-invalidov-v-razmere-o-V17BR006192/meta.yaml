  title:
    rus: О признании утратившим силу постановления акимата Шортандинского района от 20 ноября 2017 года № А-11/244 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Шортандинском районе»
    kaz: Шортанды ауданы әкімдігінің 2017 жылғы 20 қарашадағы № А-11/244 «Шортанды ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» қаулысының күші жойылды деп тану туралы

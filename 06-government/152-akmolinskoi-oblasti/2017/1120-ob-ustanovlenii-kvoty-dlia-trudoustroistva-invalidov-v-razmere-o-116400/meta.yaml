requisite: Постановление акимата Шортандинского района Акмолинской области от 20 ноября 2017 года № А-11/244. Зарегистрировано Департаментом юстиции Акмолинской области 27 ноября 2017 года № 6192. Утратило силу постановлением акимата Шортандинского района Акмолинской области от 21 декабря 2021 года № А-12/257 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Шортандинском районе
  kaz: Шортанды ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

requisite: Постановление акимата Буландынского района Акмолинской области от 15 июня 2017 года № а-06/197. Зарегистрировано Департаментом юстиции Акмолинской области 13 июля 2017 года № 6015. Утратило силу постановлением акимата Буландынского района Акмолинской области от 7 декабря 2021 года № А-11/412 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда по Буландынскому району
  kaz: Бұланды ауданы бойынша ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

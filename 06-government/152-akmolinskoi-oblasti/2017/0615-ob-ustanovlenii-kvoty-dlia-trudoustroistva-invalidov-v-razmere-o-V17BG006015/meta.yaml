  title:
    rus: О признании утратившим силу постановление акимата Буландынского района Акмолинской области от 15 июня 2017 года № а-06/197 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда по Буландынскому району»
    kaz: Ақмола облысы Бұланды ауданы әкімдігінің 2017 жылғы 15 маусымдағы № а-06/197 «Бұланды ауданы бойынша ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» қаулысының күші жойылды деп тану туралы

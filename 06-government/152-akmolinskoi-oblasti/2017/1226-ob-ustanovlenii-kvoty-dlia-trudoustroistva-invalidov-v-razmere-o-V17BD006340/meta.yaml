  title:
    rus: О признании утратившим силу постановления акимата Аршалынского района от 26 декабря 2017 года № А-367 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Аршалынском районе»
    kaz: Аршалы ауданы әкімдігінің 2017 жылғы 26 желтоқсандағы № А-367 «Аршалы ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» қаулысының күші жойылды деп тану туралы

requisite: Постановление акимата Аршалынского района Акмолинской области от 26 декабря 2017 года № А-367. Зарегистрировано Департаментом юстиции Акмолинской области 15 января 2018 года № 6340. Утратило силу постановлением акимата Аршалынского района Акмолинской области от 20 апреля 2022 года № А-94 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Аршалынском районе
  kaz: Аршалы ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

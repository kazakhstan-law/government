requisite: Постановление акимата Жаркаинского района Акмолинской области от 29 мая 2017 года № А-5/237. Зарегистрировано Департаментом юстиции Акмолинской области 21 июня 2017 года № 6001. Утратило силу постановлением акимата Жаркаинского района Акмолинской области от 3 декабря 2021 года № А-12/501
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Жаркаинском районе
  kaz: Жарқайың ауданында  ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квоталар белгілеу туралы

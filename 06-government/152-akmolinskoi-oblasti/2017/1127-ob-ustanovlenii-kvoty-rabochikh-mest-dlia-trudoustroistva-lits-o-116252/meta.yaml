    kaz: Еңбекшілдер ауданы әкімдігінің 2017 жылғы 21 қарашадағы № а-11/262 «2018 жылға арналған Еңбекшілдер ауданында бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы» қаулысына өзгерістер енгізу туралы

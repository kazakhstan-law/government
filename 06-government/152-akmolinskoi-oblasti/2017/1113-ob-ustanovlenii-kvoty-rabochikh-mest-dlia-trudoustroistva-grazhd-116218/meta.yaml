requisite: Постановление акимата города Степногорска Акмолинской области от 13 ноября 2017 года № а-11/539. Зарегистрировано Департаментом юстиции Акмолинской области 22 ноября 2017 года № 6179
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в городе Степногорске на 2018 год
  kaz: 2018 жылға арналған Степногорск қаласында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

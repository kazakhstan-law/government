    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Ақмола облысы әкімдігінің 2017 жылғы 27 қаңтардағы № А-2/27 қаулысына өзгерістер мен толықтырулар енгізу туралы

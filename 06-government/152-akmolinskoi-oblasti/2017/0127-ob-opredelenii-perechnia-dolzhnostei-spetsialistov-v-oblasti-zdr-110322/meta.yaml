title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, архивного дела, спорта, ветеринарии, лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, архив ісі, спорт, ветеринария, орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы

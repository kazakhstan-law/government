requisite: Постановление акимата Бурабайского района Акмолинской области от 17 августа 2017 года № а-7/271. Зарегистрировано Департаментом юстиции Акмолинской области 18 сентября 2017 года № 6077. Утратило силу постановлением акимата Бурабайского района Акмолинской области от 4 апреля 2022 года № а-12/496 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Бурабайском районе
  kaz: Бурабай ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызына дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

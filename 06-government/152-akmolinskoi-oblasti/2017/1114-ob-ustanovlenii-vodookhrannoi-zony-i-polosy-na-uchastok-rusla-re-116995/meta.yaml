requisite: Постановление акимата Акмолинской области от 14 ноября 2017 года № А-11/507. Зарегистрировано Департаментом юстиции Акмолинской области 11 декабря 2017 года № 6212. Утратило силу постановлением акимата Акмолинской области от 3 мая 2022 года № А-5/222 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы на участок русла реки без названия (приток реки Колутон) вблизи села Алтайское Шортандинского района Акмолинской области и режима их хозяйственного использования
  kaz: Ақмола облысы Шортанды ауданы Алтай ауылының жанындағы атауы жоқ өзеннің арнасы учаскесінде (Колутон өзенінің ағыны) су қорғау аймағы мен белдеуін және олардың шаруашылық пайдалану режимін белгілеу туралы

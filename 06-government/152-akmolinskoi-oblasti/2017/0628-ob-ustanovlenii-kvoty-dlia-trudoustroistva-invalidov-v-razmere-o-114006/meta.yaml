act_code: '114006'
requisite: Постановление акимата города Степногорска Акмолинской области от 28 июня 2017 года № а-6/331. Зарегистрировано Департаментом юстиции Акмолинской области 28 июля 2017 года № 6035. Утратило силу постановлением акимата города Степногорска Акмолинской области от 31 декабря 2021 года № А-12/670 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда по городу Степногорск
  kaz: Степногорск қаласы бойынша ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

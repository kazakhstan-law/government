act_code: '115687'
requisite: Постановление акимата Буландынского района Акмолинской области от 17 октября 2017 года № А-10/346. Зарегистрировано Департаментом юстиции Акмолинской области 30 октября 2017 года № 6134
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Буландынскому району на 2018 год
  kaz: Бұланды ауданы бойынша 2018 жылға арналған пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

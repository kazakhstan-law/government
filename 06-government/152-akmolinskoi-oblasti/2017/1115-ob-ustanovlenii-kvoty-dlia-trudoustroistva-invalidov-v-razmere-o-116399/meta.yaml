requisite: Постановление акимата Егиндыкольского района Акмолинской области от 15 ноября 2017 года № а-11/188. Зарегистрировано Департаментом юстиции Акмолинской области 22 ноября 2017 года № 6184. Утратило силу постановлением акимата Егиндыкольского района Акмолинской области от 22 декабря 2021 года № а-12/192 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Егиндыкольском районе
  kaz: Егіндікөл ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

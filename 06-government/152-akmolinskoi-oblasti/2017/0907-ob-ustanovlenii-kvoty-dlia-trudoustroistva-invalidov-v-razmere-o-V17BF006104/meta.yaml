  title:
    rus: О признании утратившим силу постановление акимата Астраханского района от 7 сентября 2017 № 211 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными и опасными условиями труда в Астраханском районе»
    kaz: Астрахан ауданы әкімдігінің 2017 жылғы 7 қыркүйектегі № 211 «Астрахан ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» қаулысының күші жойылды деп тану туралы

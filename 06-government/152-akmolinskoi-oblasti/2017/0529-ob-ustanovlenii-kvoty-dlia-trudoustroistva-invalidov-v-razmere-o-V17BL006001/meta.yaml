  title:
    rus: О признании утратившим силу постановления акимата Жаркаинского района Акмолинской области от 29 мая 2017 года № А-5/237 «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Жаркаинском районе»
    kaz: Ақмола облысы Жарқайың ауданы әкімдігінің «Жарқайың ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызға дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы» 2017 жылғы 29 мамырдағы № А-5/237 қаулысының күші жойылды деп тану туралы

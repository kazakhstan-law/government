requisite: Постановление акимата Аккольского района Акмолинской области от 1 ноября 2017 года № А-11/303. Зарегистрировано Департаментом юстиции Акмолинской области 8 ноября 2017 года № 6158. Утратило силу постановлением акимата Аккольского района Акмолинской области от 18 января 2022 года № А-1/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Аккольском районе
  kaz: Ақкөл ауданында ауыр жұмыстарды, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, жұмыс орындары санының екіден төрт пайызына дейінгі мөлшерінде мүгедектерді жұмысқа орналастыру үшін квота белгілеу туралы

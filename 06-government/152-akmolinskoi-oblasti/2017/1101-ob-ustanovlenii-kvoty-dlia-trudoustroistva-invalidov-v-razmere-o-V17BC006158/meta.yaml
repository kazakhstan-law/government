  title:
    rus: О признании утратившим силу постановления акимата Аккольского района «Об установлении квоты для трудоустройства инвалидов в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда в Аккольском районе» от 1 ноября 2017 года № А-11/303
    kaz: Ақкөл ауданы әкімдігінің 2017 жылғы 1 қарашадағы № А-11/303 «Ақкөл ауданында ауыр жұмыстардағы, зиянды, қауіпті еңбек жағдайлары бар жұмыстардағы жұмыс орындарын есепке алмай, жұмыс орындары санының екіден төрт пайызына дейінгі мөлшерінде мүгедектер үшін жұмыс орындарының квотасын белгілеу туралы» күші жойылды деп тану туралы

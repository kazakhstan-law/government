requisite: Постановление акимата Аккольского района Акмолинской области от 3 июля 2012 года № А-7/262. Зарегистрировано Управлением юстиции Аккольского района Акмолинской области 30 июля 2012 года № 1-3-185
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освободившихся из мест лишения свободы и несовершеннолетних выпускников интернатных организаций, в размере одного процента от общей численности рабочих мест на 2012 год
  kaz: 2012 жылға жұмыс орындарының жалпы санының бір проценті мөлшерінде қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарға және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

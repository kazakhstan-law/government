  title:
    rus: О внесении изменений в постановление акимата Целиноградского района от 10 января 2012 года № А-1/8 "Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Целиноградском районе"
    kaz: Целиноград ауданы әкімдігінің 2012 жылдың 10 қаңтардағы № А-1/8 "Целиноград ауданы бойынша бас бостандығынан айыру орындарынан босатылған адамдар үшін және кәмелетке толмаған интернаттық ұйымдарды бітірушілер үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгерістер енгізу туралы

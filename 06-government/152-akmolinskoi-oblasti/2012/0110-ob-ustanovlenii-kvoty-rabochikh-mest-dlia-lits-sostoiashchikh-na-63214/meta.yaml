act_code: '63214'
requisite: Постановление акимата Целиноградского района Акмолинской области от 10 января 2012 года № А-1/8. Зарегистрировано Управлением юстиции Целиноградского района Акмолинской области 3 февраля 2012 года № 1-17-165. Утратило силу постановлением акимата Целиноградского района Акмолинской области от 19 апреля 2016 года № А-2/170
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительской инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Целиноградском районе
  kaz: Целиноград ауданы бойынша қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

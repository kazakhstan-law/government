act_code: '70305'
requisite: Постановление акимата Акмолинской области от 14 декабря 2012 года № А-13/613. Зарегистрировано Департаментом юстиции Акмолинской области 18 января 2013 года № 3623. Утратило силу постановлением акимата Акмолинской области от 3 июня 2013 года № А-5/225
title:
  rus: Об утверждении регламента электронной государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегі" электрондық мемлекеттік қызмет регламентін бекіту туралы'

act_code: '66916'
requisite: Постановление акимата Аршалынского района Акмолинской области от 9 июля 2012 года № А-266. Зарегистрировано Управлением юстиции Аршалынского района Акмолинской области 30 июля 2012 года № 1-4-214. Утратило силу постановлением акимата Аршалынского района Акмолинской области от 19 апреля 2016 года № А-213
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Аршалынском районе
  kaz: Аршалы ауданындағы қылмыстық-атқару инспекциясының пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

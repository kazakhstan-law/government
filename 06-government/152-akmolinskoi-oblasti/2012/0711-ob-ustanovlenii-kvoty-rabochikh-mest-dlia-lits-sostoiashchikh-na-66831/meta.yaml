act_code: '66831'
requisite: Постановление акимата города Кокшетау Акмолинской области от 11 июля 2012 года № А-7/2048. Зарегистрировано Управлением юстиции города Кокшетау Акмолинской области 26 июля 2012 года № 1-1-180. Утратило силу постановлением акимата города Кокшетау Акмолинской области от 21 апреля 2016 года № А-4/878
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы  пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в городе Кокшетау
  kaz: Қылмыстық-атқару инспекциясының пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ Көкшетау қаласындағы бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарының кәмелетке толмаған түлектері үшін бос жұмыс орындарының квотасын анықтау туралы

act_code: '69763'
requisite: Постановление акимата Акмолинской области от 29 ноября 2012 года № А-12/569. Зарегистрировано Департаментом юстиции Акмолинской области 3 января 2013 года № 3579. Утратило силу постановлением акимата Акмолинской области от 3 июня 2013 года № А-5/225
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление вида деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түсті және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуі және өткізу жөніндегі қызмет түрін жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" электрондық мемлекеттік қызмет регламентін бекіту туралы'

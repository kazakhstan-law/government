act_code: '68808'
requisite: Постановление акимата Акмолинской области от 24 октября 2012 года № А-11/510. Зарегистрировано Департаментом юстиции Акмолинской области 26 ноября 2012 года № 3499. Утратило силу постановлением акимата Акмолинской области от 3 июня 2013 года № А-5/225
title:
  rus: Об утверждении регламента государственной услуги "Принятие местными исполнительными органами области решения по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
  kaz: '"Облыстың жергілікті атқарушы органдарының жануарлар дүниесін пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерiн бекiтiп беру мен аңшылық және балық шаруашылықтарының қажеттіліктері үшін сервитуттарды белгілеу жөнінде шешімдер қабылдауы" мемлекеттік қызмет регламентін бекіту туралы'

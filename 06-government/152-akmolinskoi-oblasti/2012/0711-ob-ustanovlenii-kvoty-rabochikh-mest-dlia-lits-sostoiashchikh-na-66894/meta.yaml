  requisite: Постановление акимата Буландынского района Акмолинской области от 10 октября 2013 года № а-10/370. Зарегистрировано Департаментом юстиции Акмолинской области 4 ноября 2013 года № 3870. Утратило силу постановлением акимата Буландынского района Акмолинской области от 14 апреля 2016 года № а-04/111
  title:
    rus: О внесении изменений в постановление акимата Буландынского района от 11 июля 2012 года № А-07/272 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций"
    kaz: Бұланды ауданы әкімдігінің 2012 жылғы 11 шілдедегі № А-07/272 "Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/75162/rus

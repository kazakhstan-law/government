act_code: '66894'
requisite: Постановление акимата Буландынского района Акмолинской области от 11 июля 2012 года № А-07/272. Зарегистрировано Управлением юстиции Буландынского района Акмолинской области 30 июля 2012 года № 1-7-159. Утратило силу постановлением акимата Буландынского района Акмолинской области от 14 апреля 2016 года № а-04/111
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы  пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

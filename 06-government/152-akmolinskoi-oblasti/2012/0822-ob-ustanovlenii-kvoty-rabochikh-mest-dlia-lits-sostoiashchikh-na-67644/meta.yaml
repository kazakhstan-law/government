act_code: '67644'
requisite: Постановление акимата Шортандинского района Акмолинской области от 22 августа 2012 года № А-6/295. Зарегистрировано Департаментом юстиции Акмолинской области 17 сентября 2012 года № 3443. Утратило силу постановлением акимата Шортандинского района Акмолинской области от 26 февраля 2016 года № А-2/41
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Шортандинском районе
  kaz: Шортанды ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыc орындарының квотасын белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Шортандинского района от 22 августа 2012 года № А-6/295 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Шортандинском районе"
    kaz: Шортанды ауданы әкімдігінің 2012 жылғы 22 тамыздағы № А-6/295 "Шортанды ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы" қаулысына өзгеріс енгізу туралы

act_code: '66778'
requisite: Постановление акимата Енбекшильдерского района Акмолинской области от 1 июля 2012 года № А-6/205. Зарегистрировано Управлением юстиции Енбекшильдерского района Акмолинской области 20 июля 2012 года № 1-10-167. Утратило силу постановлением акимата Енбекшильдерского района Акмолинской области от 22 апреля 2016 года № а-4/73
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, в размере одного процента от общей численности рабочих мест
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарының жалпы санынан бір пайыз мөлшерінде жұмыс орындарының квотасын белгілеу туралы

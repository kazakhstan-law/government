requisite: Постановление акимата Егиндыкольского района Акмолинской области от 5 июля 2012 года № А-7/201. Зарегистрировано Управлением юстиции Егиндыкольского района Акмолинской области 2 августа 2012 года № 1-8-132. Утратило силу постановлением акимата Егиндыкольского района Акмолинской области от 6 мая 2016 года № а-5/78
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных  из мест лишения свободы, в размере одного процента от общей численности рабочих мест
  kaz: Қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар үшiн, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшiн жұмыс орындарының жалпы санынан бір пайыз мөлшерінде жұмыс орындарының  квотасын белгiлеу туралы

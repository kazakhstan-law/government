  title:
    rus: О внесении изменения в постановление акимата Егиндыкольского района от 5 июля 2012 года № а-7/201 «Об установлении квоты рабочих мест для лиц, состоящих на учете  службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, в размере одного процента от общей численности рабочих мест»
    kaz: Егіндікөл ауданы әкімдігінің 2012 жылғы 5 шілдедегі № а-7/201 «Қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар үшiн, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшiн жұмыс орындарының жалпы санынан бір пайыз мөлшерінде жұмыс орындарының квотасын белгiлеу туралы» қаулысына  өзгеріс енгізу туралы

act_code: '64080'
requisite: Постановление акимата Жаксынского района Акмолинской области от 20 февраля 2012 года № А-1/70. Зарегистрировано Управлением юстиции Жаксынского района Акмолинской области 11 марта 2012 года № 1-13-149. Утратило силу постановлением акимата Жаксынского района Акмолинской области от 27 марта 2014 года № а-2/82
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки из средств бюджета Жаксынского района
  kaz: Жақсы ауданының бюджет қаражатынын ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет мамандарына тарифтік ставкалар мен лауазымдық жалақыларын жиырма бес пайызға көтеру құқығына ие мамандардың лауазымдарының тізбесін анықтау туралы

requisite: Постановление акимата Сандыктауского района Акмолинской области от 30 июля 2012 года № А-7/278. Зарегистрировано Управлением юстиции Сандыктауского района Акмолинской области 15 августа 2012 года № 1-16-157№ Утратило силу постановлением акимата Сандыктауского района Акмолинской области от 22 апреля 2016 года № А-4/88
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освободившихся из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Сандыктауском районе
  kaz: Сандықтау ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

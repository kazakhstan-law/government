act_code: '70421'
requisite: Постановление акимата Акмолинской области от 28 декабря 2012 года № А-1/668. Зарегистрировано Департаментом юстиции Акмолинской области 25 января 2013 года № 3632. Утратило силу постановлением акимата Акмолинской области от 2 апреля 2020 года № а-4/172 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения и согласовании расположения помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)
  kaz: Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту және ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шаралар өткізуге арналған үй-жайлардың орналастырылуын келісу туралы

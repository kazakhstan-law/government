  title:
    rus: О внесении изменений в постановление акимата Акмолинской области от 28 декабря 2012 года № А-1/668 «Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения и согласовании расположения помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)»
    kaz: «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту және ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шаралар өткізуге арналған үй-жайлардың орналастырылуын келісу туралы» Ақмола облысы әкімдігінің 2012 жылғы 28 желтоқсандағы № А-1/668 қаулысына өзгерістер енгізу туралы

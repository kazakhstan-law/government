requisite: Постановление акимата Акмолинской области от 6 декабря 2012 года № А-13/586. Зарегистрировано Департаментом юстиции Акмолинской области 11 января 2013 года № 3598. Утратило силу постановлением акимата Акмолинской области от 3 июня 2013 года № А-5/225
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешения на размещение наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах"
  kaz: '"Облыстық және аудандық маңызы бар жалпы пайдаланымдағы, сондай-ақ елді мекендердегі автомобиль жолдарының жолақ бөлігінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру" мемлекеттік қызмет көрсету регламентін бекіту туралы'

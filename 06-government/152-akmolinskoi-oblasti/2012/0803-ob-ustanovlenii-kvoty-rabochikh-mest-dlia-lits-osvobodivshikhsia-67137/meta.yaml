requisite: Постановление акимата Жаксынского района Акмолинской области от 3 августа 2012 года № А-7/303. Зарегистрировано Управлением юстиции Жаксынского района Акмолинской области 15 августа 2012 года № 1-13-159. Утратило силу постановлением акимата Жаксынского района Акмолинской области от 3 ноября 2014 года № а-9/416
title:
  rus: Об установлении квоты рабочих мест для лиц, освободившихся из мест лишения свободы, условно осужденных и для несовершеннолетних выпускников интернатных организаций в Жаксынском районе
  kaz: Жақсы ауданында бас бостандығынан айыру орындарынан босатылған адамдар, шартты түрде сотталған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

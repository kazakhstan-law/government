act_code: '66750'
requisite: Постановление акимата Жаркаинского района Акмолинской области от 2 июля 2012 года № А-7/344. Зарегистрировано Управлением юстиции Жаркаинского района Акмолинской области 18 июля 2012 года № 1-12-174. Утратило силу постановлением акимата Жаркаинского района Акмолинской области от 11 апреля 2016 года № А-4/119
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Жаркаинском районе
  kaz: Жарқайың ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

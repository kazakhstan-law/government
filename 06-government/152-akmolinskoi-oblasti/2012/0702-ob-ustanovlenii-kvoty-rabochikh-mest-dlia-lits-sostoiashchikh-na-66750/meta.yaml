  title:
    rus: О внесении изменения в постановление акимата Жаркаинского района от 02 июля 2012 года № А-7/344 «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Жаркаинском районе»
    kaz: Жарқайың ауданы әкімдігінің 2012 жылғы 02 шілдедегі № А-7/344 «Жарқайың ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/87531/rus

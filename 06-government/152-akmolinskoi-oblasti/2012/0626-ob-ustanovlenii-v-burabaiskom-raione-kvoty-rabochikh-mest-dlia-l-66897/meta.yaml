act_code: '66897'
requisite: Постановление акимата Бурабайского района Акмолинской области от 26 июня 2012 года № А-7/344. Зарегистрировано Управлением юстиции Бурабайского района Акмолинской области 25 июля 2012 года № 1-19-235. Утратило силу постановлением акимата Бурабайского района Акмолинской области от 21 ноября 2014 года № а-11/755
title:
  rus: Об установлении в Бурабайском районе квоты рабочих мест для лиц,  состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освободившихся из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Бурабай ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін  жұмыс орындарына квота белгілеу туралы

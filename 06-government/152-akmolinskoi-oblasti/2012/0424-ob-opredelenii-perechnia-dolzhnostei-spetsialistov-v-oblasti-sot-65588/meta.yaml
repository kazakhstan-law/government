    kaz: Целиноград ауданы әкімдігінің 2012 жылғы 24 сәуірдегі № А-3/152 "Целиноград ауданының ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім, мәдениет және спорт мамандары лауазымдарының тізбесін айқындау туралы" қаулысына өзгерістер енгізу туралы

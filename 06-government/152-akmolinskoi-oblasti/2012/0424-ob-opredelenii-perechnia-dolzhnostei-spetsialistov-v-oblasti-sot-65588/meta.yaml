requisite: Постановление акимата Целиноградского района Акмолинской области от 24 апреля 2012 года № А-3/152. Зарегистрировано Управлением юстиции Целиноградского района Акмолинской области 18 мая 2012 года № 1-17-174. Утратило силу постановлением акимата Целиноградского района Акмолинской области от 2 июля 2015 года № А-1/259
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности Целиноградского района
  kaz: Целиноград ауданының азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

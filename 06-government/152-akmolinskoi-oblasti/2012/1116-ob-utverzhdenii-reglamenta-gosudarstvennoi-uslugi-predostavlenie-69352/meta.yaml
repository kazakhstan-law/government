act_code: '69352'
requisite: Постановление акимата Акмолинской области от 16 ноября 2012 года № А-12/543. Зарегистрировано Департаментом юстиции Акмолинской области 14 декабря 2012 года № 3544. Утратило силу постановлением акимата Акмолинской области от 3 июня 2013 года № А-5/225
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елдi мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтiк қолдау шараларын ұсыну" мемлекеттiк қызмет көрсету регламентiн бекiту туралы'

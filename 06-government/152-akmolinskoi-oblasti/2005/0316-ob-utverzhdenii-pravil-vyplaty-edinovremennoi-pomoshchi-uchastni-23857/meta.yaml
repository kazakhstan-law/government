title:
  rus: Об утверждении правил выплаты единовременной помощи участникам и инвалидам Великой Отечественной войны, вдовам и умерших участников и инвалидов войны, труженикам тыла к 60-й годовщине Победы в Великой Отечественной войне 1941-1945 г.г.
  kaz: 1941-1945 ж.ж. Ұлы Отан Соғысындағы Жеңістің 60-жылдығына Ұлы Отан соғысының қатысушылары мен мүгедектеріне соғыста қаза тапқандар мен қайтыс болғандардың жесір әйелдеріне және соғыс мүгедектеріне, тыл еңбеккерлеріне біржолғы көмекті төлеу ережелерін бекіту туралы

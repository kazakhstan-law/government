title:
  rus: Об утверждении Правил оплаты стоимости проезда больных, направляемых по медицинским показаниям на лечение, детей-инвалидов, направляемых на санаторно-курортное лечение и лиц сопровождающих их, в пределах Республики Казахстан
  kaz: Қазақстан Республикасының шеңберінде медициналық көрсеткіштері бойынша жіберілетін науқастар, санаторлық-курорттық емделуге жіберілетін мүгедек балалар, олармен еріп баратын тұлғалардың жолақысын төлеу ережесін бекіту туралы

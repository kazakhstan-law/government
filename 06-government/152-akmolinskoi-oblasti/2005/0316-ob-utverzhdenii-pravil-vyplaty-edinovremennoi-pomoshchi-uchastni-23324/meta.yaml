act_code: '23324'
requisite: Постановление акимата Буландынского района Акмолинской области от 16 марта 2005 года № а-3/67. Зарегистрировано Департаментом юстиции Акмолинской области 19 марта 2005 года № 3088. Утратило силу постановлением акимата Буландынского района Акмолинской области от 14 апреля 2009 года № а-04/79
title:
  rus: Об утверждении правил выплаты единовременной помощи участникам и инвалидам Великой Отечественной войны, труженикам тыла, вдовам, не вступившим в повторный брак, погибших (умерших, пропавших без вести) воинов в Великой Отечественной войне
  kaz: Ұлы Отан соғысының катысушылары мен мүгедектеріне, тыл еңбеккерлеріне, Ұлы Отан соғысында қаза тапқан (қайтыс болған, хабарсыз кеткен) жауынгерлердің қайтадан тұрмысқа шықпаған жесірлеріне бір жолғы көмек төлеудің ережесін бекіту туралы

requisite: Постановление акимата Акмолинской области от 27 апреля 2005 года № А-5/148. Зарегистрировано Департаментом юстиции Акмолинской области 18 мая 2005 года № 3133. Утратило силу постановлением акимата Акмолинской области от 13 апреля 2006 года № А-3/125
title:
  rus: Об утверждении плана мероприятий по исполнению постановления Правительства от 13 апреля 2004 года № 411 «О Программе борьбы с наркоманией и наркобизнесом в Республике Казахстан на 2004-2005 годы» и образования Региональной комиссии по борьбе с наркоманией и наркобизнесом
  kaz: “2004-2005 жылдарға арналған Қазақстан Республикасындағы нашақорлық пен есірткі бизнссіне қарсы күрес мемлекеттік бағдарламасы туралы” Қазақстан Республикасы Үкіметінің 2004 жылғы 13 сәуірдегі №411 Қаулысын жүзеге асыру жөніндегі іс-шаралар жоспарын бекіту және нашақорлық пен есірткі бизнесіне қарсы күрес жөніндегі аймақтық комиссия құру туралы

title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок в нотариальную контуру для разрешения обмена или продажи жилой площади, принадлежащей несовершеннолетним детям"
  kaz: '"Кәмелетке толмаған балаларға тиесілі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

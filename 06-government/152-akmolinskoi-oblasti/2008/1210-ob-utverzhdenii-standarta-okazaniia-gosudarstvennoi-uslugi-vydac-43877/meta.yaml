title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок решения совета опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей являющихся собственниками жилища"
  kaz: '"Тұрғын үйдің меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қозғайтын мәмілелерді жасау үшін қорғаншылар кеңесінің шешіміне анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

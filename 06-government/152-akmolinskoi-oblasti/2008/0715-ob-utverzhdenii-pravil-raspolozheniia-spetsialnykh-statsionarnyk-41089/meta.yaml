    kaz: '"Ақмола облысының аумағында арнайы стационарлық үй-жайларды орналастыру тәртібі және онда эротикалық сипаттағы материалдар жариялайтын мерзімді баспасөз өнімін өткізу ережелерін бекіту туралы" Ақмола облысы әкімдігінің 2008 жылғы 15 шілдедегі № а-5/295 қаулысына өзгерістер енгізу туралы'

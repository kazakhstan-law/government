act_code: '38894'
requisite: Постановление акимата Есильского районного Акмолинской области от 8 апреля 2008 года № а-4/102. Зарегистрировано Управлением юстиции Есильского района Акмолинской области 15 апреля 2008 года № 1-11-83
title:
  rus: Об организации и обеспечение призыва граждан мужского пола в возрасте от восемнадцати до двадцати семи лет, не имеющих права на отсрочку или освобождение от призыва на срочную воинскую службу в апреле-июне, октябре-декабре 2008 года
  kaz: Шақыруды кейінге қалдыруға немесе шақырылудан босатылуға құқығы жоқ он сегізден жиырма жеті жасқа дейінгі ер азаматтарды 2008 жылғы сәуір-маусым, қазан желтоқсан айларындағы мерзімді әскери қызметке шақыруды ұйымдастыру және қамтамасыз ету туралы

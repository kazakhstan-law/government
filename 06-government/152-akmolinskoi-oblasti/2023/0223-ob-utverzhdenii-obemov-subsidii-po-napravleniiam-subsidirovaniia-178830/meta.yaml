    kaz: Ақмола облысы әкімдігінің 2023 жылғы 23 ақпандағы № А-2/63 «Ақмола облысының 2023 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

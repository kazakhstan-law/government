  title:
    rus: О внесении изменений в постановление акимата города Кокшетау от 14 апреля 2023 года № А-4/655 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Кокшетау»
    kaz: Көкшетау қаласы әкімдігінің 2023 жылғы 14 сәуірдегі № А-4/655 «Көкшетау қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

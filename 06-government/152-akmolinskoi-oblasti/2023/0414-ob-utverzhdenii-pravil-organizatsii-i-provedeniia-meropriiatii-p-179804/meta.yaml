act_code: '179804'
requisite: Постановление акимата города Кокшетау Акмолинской области от 14 апреля 2023 года № А-4/655. Зарегистрировано Департаментом юстиции Акмолинской области 14 апреля 2023 года № 8537-03
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Кокшетау
  kaz: Көкшетау қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

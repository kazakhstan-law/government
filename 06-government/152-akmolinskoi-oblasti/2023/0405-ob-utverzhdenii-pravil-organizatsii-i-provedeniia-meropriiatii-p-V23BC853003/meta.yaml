  title:
    rus: О внесении изменений в постановление акимата Аккольского района Акмолинской области от 5 апреля 2023 года № А-3/78 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Аккольского района»
    kaz: «Ақкөл ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Ақмола облысы Ақкөл ауданы әкімдігінің 2023 жылғы 5 сәуірдегі № А-3/78 қаулысына өзгерістер енгізу туралы

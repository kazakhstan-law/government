requisite: Постановление акимата Аккольского района Акмолинской области от 5 апреля 2023 года № А-3/78. Зарегистрировано Департаментом юстиции Акмолинской области 10 апреля 2023 года № 8530-03
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Аккольского района
  kaz: Ақкөл ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

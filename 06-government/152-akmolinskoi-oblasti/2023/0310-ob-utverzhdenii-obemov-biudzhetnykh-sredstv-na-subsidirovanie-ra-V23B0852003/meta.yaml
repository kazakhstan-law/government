    rus: О внесении изменения в постановление акимата Акмолинской области от 10 марта 2023 года № А-3/82 «Об утверждении объемов бюджетных средств на субсидирование развития семеноводства по Акмолинской области на 2023 год»
    kaz: «2023 жылға арналған Ақмола облысы бойынша тұқым шаруашылығын дамытуды субсидиялауға бюджет қаражатының көлемдерін бекіту туралы» Ақмола облысы әкімдігінің 2023 жылғы 10 наурыздағы № А-3/82 қаулысына өзгеріс енгізу туралы

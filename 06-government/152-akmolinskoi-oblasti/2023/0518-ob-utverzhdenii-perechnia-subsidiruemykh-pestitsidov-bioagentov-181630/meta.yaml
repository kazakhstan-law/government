  title:
    rus: О внесении изменений в постановление акимата Акмолинской области от 18 мая 2023 года № А-5/188 «Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и норм субсидий на 1 литр (килограмм, грамм, штук) пестицидов, биоагентов (энтомофагов), а также объемов бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2023 год»
    kaz: «2023 жылға арналған субсидияланатын пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі және пестицидтердің, биоагенттердiң (энтомофагтардың) 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» Ақмола облысы әкімдігінің 2023 жылғы 18 мамырдағы № А-5/188 қаулысына өзгерістер енгізу туралы

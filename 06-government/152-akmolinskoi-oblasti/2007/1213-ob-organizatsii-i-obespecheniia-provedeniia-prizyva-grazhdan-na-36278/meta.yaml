act_code: '36278'
requisite: Постановление акимата Жаксынского района Акмолинской области от 13 декабря 2007 года № А-14/338. Зарегистрировано Управлением юстиции Жаксынского района 19 декабря 2007 года № 1-13-60. Утратило силу постановлением акимата Жаксынского района Акмолинской области от 18 февраля 2008 года № А-2/54
title:
  rus: «Об организации и обеспечения проведения призыва граждан на срочную воинскую службу в октябре-декабре 2007 года мужского пола в возрасте от восемнадцати до двадцати семи лет, не имеющих права на отсрочку или освобождение от призыва, а также граждан, отчисленных из учебных заведений, не достигших двадцати семи лет и не выслуживших установленные сроки воинской службы по призыву»
  kaz: «Мерзімін ұзартуға құқы жоқ, сол сияқты оқу орындарынан шығарылған жиырма жеті жасқа толмаған және мерзімінде шақыру бойынша әскери міндетін өтемеген он сегіз бен жиырма жеті аралығындағы ер жынысты азаматтарды 2007 жылдың қазан-желтоқсан айларында жедел әскери қызметке шақыруды ұйымдастыру және қамтамасыз ету туралы»

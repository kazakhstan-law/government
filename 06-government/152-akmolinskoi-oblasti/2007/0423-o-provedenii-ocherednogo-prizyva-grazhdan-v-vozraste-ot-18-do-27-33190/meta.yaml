requisite: Постановление акимата Зерендинского района Акмолинской области от 23 апреля 2007 года № 169. Зарегистрировано Управлением юстиции Зерендинского района Акмолинской области 11 мая 2007 года № 1-14-61. Утратило силу - постановлением акимата Зерендинского района Акмолинской области от 14 апреля 2008 года № 116
title:
  rus: О проведении очередного призыва граждан в возрасте от 18 до 27 лет, не имеющих права на отсрочку или освобождение от призыва на срочную военную службу в апреле-июне и октябре-декабре 2007 года
  kaz: Әскерге шақырудан кейін қалуға немесе босатылуға құқықтары жоқ, 18 бен 27 жас аралығындағы азаматтарды кезекті рет 2007 жылдың сәуір-маусымында және қазан-желтоқсанында мерзімнен тыс әскери қызметке шақыртуды өткізу туралы

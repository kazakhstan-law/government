requisite: Постановление акимата Акмолинской области от 30 января 2007 года № А-2/32. Зарегистрировано департаментом юстиции Акмолинской области 22 февраля 2007 года № 3215. Утратило силу постановлением акимата Акмолинской области от 15 ноября 2012 года № А-12/541
title:
  rus: Об утверждении Правил присвоения наименований и переименования составных частей населенного пункта, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Акмолинской области
  kaz: Ақмола облысы аумағындағы елді мекеннің құрамдас бөліктеріне атау беру және қайта атау, жер учаскелеріне, ғимараттар мен имараттарға реттік нөмірлер беру талаптарын белгілеу ережелерін бекіту туралы

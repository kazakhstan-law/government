act_code: '92456'
requisite: Постановление от 13.07.2015 №а-7/343, Акимат Ерейментауского района
title:
  rus: Об определении сроков предоставления заявок на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей и оптимальных сроков сева субсидируемых приоритетных сельскохозяйственных культур по Ерейментаускому району на 2015 год
  kaz: 2015 жылға Ерейментау ауданының субсидияланатын басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және қажетті басқа да тауарлық - материалдық құндылықтардың құнына және себудің оңтайлы мерзімдеріне субсидия алуға өтінімдерді тапсыру мерзімдерін анықтау туралы

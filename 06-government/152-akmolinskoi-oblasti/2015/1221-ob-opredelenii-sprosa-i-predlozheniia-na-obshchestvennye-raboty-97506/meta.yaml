act_code: '97506'
requisite: Постановление акимата Астраханского района Акмолинской области от 21 декабря 2015 года № 310. Зарегистрировано Департаментом юстиции Акмолинской области 12 января 2016 года № 5188. Утратило силу постановлением акимата Астраханского района Акмолинской области от 19 апреля 2016 года № 85
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Астраханскому району на 2016 год
  kaz: Астрахан ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

    kaz: Сандықтау ауданы әкімдігінің 2015 жылғы 26 ақпандағы № А-2/42 «Үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жай беру туралы» қаулысына өзгерістер енгізу туралы

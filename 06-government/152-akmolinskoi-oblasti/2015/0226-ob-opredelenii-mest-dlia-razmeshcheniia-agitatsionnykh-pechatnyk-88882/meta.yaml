  title:
    rus: О внесении изменений в постановление акимата Сандыктауского района от 26 февраля 2015 года № А-2/42 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями»
    kaz: Сандықтау ауданы әкімдігінің 2015 жылғы 26 ақпандағы № А-2/42 «Үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жай беру туралы» қаулысына өзгерістер енгізу туралы

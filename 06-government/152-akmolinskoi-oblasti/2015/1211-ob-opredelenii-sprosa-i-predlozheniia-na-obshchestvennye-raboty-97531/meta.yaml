act_code: '97531'
requisite: Постановление акимата Аршалынского района Акмолинской области от 11 декабря 2015 года № А-543. Зарегистрировано Департаментом юстиции Акмолинской области 8 января 2016 года № 5182. Утратило силу постановлением акимата Аршалынского района Акмолинской области от 19 апреля 2016 года № А-213
title:
  rus: Об определении спроса и предложения на общественные работы, утверждения перечня организаций, видов, объемов и конкретных условий общественных работ, размер оплаты труда участников и источник их финансирования по Аршалынскому району на 2016 год
  kaz: Аршалы ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '97371'
requisite: Постановление акимата Жаксынского района Акмолинской области от 11 декабря 2015 года № а-12/318. Зарегистрировано Департаментом юстиции Акмолинской области 6 января 2016 года № 5173. Утратило силу постановлением акимата Жаксынского района Акмолинской области от 14 апреля 2016 года № а-3/85
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Жаксынскому району на 2016 год
  kaz: "Жақсы ауданы бойынша 2016 жылға\tқоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы"

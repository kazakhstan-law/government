requisite: Постановление №52 от 03.04.2015, Акимат Коргалжынского района. Утратило силу постановлением акимата Коргалжынского района Акмолинской области от 2 марта 2016 года № 39
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организации, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Коргалжынскому району на 2015 год
  kaz: Қорғалжын ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсыныс айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушалардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

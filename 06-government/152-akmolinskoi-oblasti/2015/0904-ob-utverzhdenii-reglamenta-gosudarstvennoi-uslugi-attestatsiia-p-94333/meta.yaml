requisite: Постановление акимата Акмолинской области от 4 сентября 2015 года № А-9/416. Зарегистрировано Департаментом юстиции Акмолинской области 7 октября 2015 года № 5003. Утратило силу постановлением акимата Акмолинской области от 1 ноября 2019 года № А-11/527 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Аттестация производителей оригинальных, элитных семян, семян первой, второй и третьей репродукций и реализаторов семян»
  kaz: «Бірегей және элиталық тұқымдар, бiрiншi, екiншi және үшiншi көбейтілген тұқым өндiрушiлердi, тұқым өткізушілерді аттестаттау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

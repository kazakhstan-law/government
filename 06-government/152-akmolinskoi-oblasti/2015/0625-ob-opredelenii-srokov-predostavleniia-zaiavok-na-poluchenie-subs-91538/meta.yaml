act_code: '91538'
requisite: Постановление акимата Сандыктауского района Акмолинской области от 25 июня 2015 года № А-6/150. Зарегистрировано Департаментом юстиции Акмолинской области 3 июля 2015 года № 4853
title:
  rus: Об определении сроков предоставления заявок на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей и оптимальных сроков сева субсидируемых приоритетных сельскохозяйственных культур в 2015 году в Сандыктауском районе
  kaz: Сандықтау ауданында 2015 жылы субсидияланатын басым ауыл шаруашылық дақылдарына, өсiмдiк шаруашылығының шығымдылығына және өнім сапасын арттыруға, жанар-жағармай материалдарының және қажеттi басқа да тауарлық-материалдық құндылықтардың құнына және себудің оңтайлы мерзiмдеріне субсидия алуға өтінімдерді тапсыру мерзімдерін анықтау туралы

act_code: '97620'
requisite: Постановление акимата Жаркаинского района Акмолинской области от 18 декабря 2015 года № А-12/340. Зарегистрировано Департаментом юстиции Акмолинской области 13 января 2016 года № 5200. Утратило силу постановлением акимата Жаркаинского района Акмолинской области от 11 апреля 2016 года № А-4/119
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Жаркаинскому району на 2016 год
  kaz: "Жарқайың ауданы бойынша\t2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы"

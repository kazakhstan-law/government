requisite: Постановление акимата Шортандинского района Акмолинской области от 4 декабря 2015 года № А-11/288. Зарегистрировано Департаментом юстиции Акмолинской области 30 декабря 2015 года № 5159. Утратило силу постановлением акимата Шортандинского района Акмолинской области от 13 апреля 2016 года № А-3/94
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования на 2016 год
  kaz: 2016 жылға арналған қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

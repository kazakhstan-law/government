act_code: '97930'
requisite: Постановление акимата Сандыктауского района Акмолинской области от 22 декабря 2015 года № А-11/256. Зарегистрировано Департаментом юстиции Акмолинской области 19 января 2016 года № 5223. Утратило силу постановлением акимата Сандыктауского района Акмолинской области от 22 апреля 2016 года № А-4/87
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Сандыктаускому району на 2016 год
  kaz: Сандықтау ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '95958'
requisite: Постановление от 16.11.2015 №а-11/377, Акимат Атбасарского района. Зарегистрировано Департаментом юстиции Акмолинской области 4 декабря 2015 года № 5110. Утратило силу постановлением акимата Атбасарского района Акмолинской области от 12 апреля 2016 года № а-4/106
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Атбасарскому району на 2016 год
  kaz: Атбасар ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

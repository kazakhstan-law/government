act_code: '96789'
requisite: Постановление от 03.12.2015 №а-12/192, Акимат Егиндыкольского района. Зарегистрировано Департаментом юстиции Акмолинской области 25 декабря 2015 года № 5141. Утратило силу постановлением акимата Егиндыкольского района Акмолинской области от 21 апреля 2016 года № а-4/64
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Егиндыкольскому району на 2016 год
  kaz: Егіндікөл ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және оларды қаржыландыру көздерін бекіту туралы

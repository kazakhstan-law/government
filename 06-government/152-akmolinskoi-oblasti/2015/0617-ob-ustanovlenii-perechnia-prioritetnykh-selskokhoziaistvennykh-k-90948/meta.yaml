act_code: '90948'
requisite: Постановление акимата Акмолинской области от 17 июня 2015 года № А-6/281. Зарегистрировано Департаментом юстиции Акмолинской области 22 июня 2015 года № 4834. Утратило силу постановлением акимата Акмолинской области от 24 ноября 2017 года № А-12/546
title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и норм субсидий (на 1 гектар) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым ауыл шаруашылығы дақылдарының тізбесін және басым дақылдар өндіруді субсидиялау арқылы өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егіс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялардың нормаларын (1 гектарға) белгілеу туралы

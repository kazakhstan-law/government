act_code: '86264'
requisite: Постановление акимата города Степногорска Акмолинской области от 5 января 2015 года № а-1/1. Зарегистрировано Департаментом юстиции Акмолинской области 27 января 2015 года № 4618
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования в городе Степногорске на 2015 год
  kaz: Степногорск қаласында 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

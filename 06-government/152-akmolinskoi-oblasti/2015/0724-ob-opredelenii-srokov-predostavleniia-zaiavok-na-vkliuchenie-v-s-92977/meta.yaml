act_code: '92977'
requisite: Постановление от 24.07.2015 №а-07/238, Акимат Буландинского района
title:
  rus: Об определении сроков предоставления заявок на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Буландынскому району на 2015 год
  kaz: Бұланды ауданы бойынша 2015 жылы субсидияларды алушылардың тізіміне қосуға құжаттар қабылдау мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша оңтайлы себу мерзімдерін анықтау туралы

act_code: '96416'
requisite: Постановление от 24.11.2015 №А-11/386, Акимат Аккольского района. Зарегистрировано Департаментом юстиции Акмолинской области 21 декабря 2015 года № 5132. Утратило силу постановлением акимата Аккольского района Акмолинской области от 20 апреля 2016 года № А-4/123
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Аккольскому району на 2016 год
  kaz: Ақкөл ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

requisite: Постановление акимата Буландынского района Акмолинской области от 8 декабря 2015 года № а-12/356. Зарегистрировано Департаментом юстиции Акмолинской области 31 декабря 2015 года № 5167. Утратило силу постановлением акимата Буландынского района Акмолинской области от 14 апреля 2016 года № а-04/111
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Буландынскому району на 2016 год
  kaz: Бұланды ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '93694'
requisite: Постановление от 13.08.2015 №А-8/1367, Акимат г. Кокшетау
title:
  rus: Об определении сроков предоставления заявки на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей и оптимальных сроков сева субсидируемых приоритетных сельскохозяйственных культур на 2015 год в городе Кокшетау
  kaz: Көкшетау қаласында 2015 жылға өсімдік шаруашылығының шығымдылығына және өнім сапасын арттыруға, жанар-жағармай материалдарының және қажетті басқа да тауарлық-материалдық құндылықтардың құнына субсидиялар алуға арналған өтінімді ұсыну мерзімдерін және субсидияланатын басым ауыл шаруашылық дақылдарын себудің оңтайлы мерзімдерін айқындау туралы

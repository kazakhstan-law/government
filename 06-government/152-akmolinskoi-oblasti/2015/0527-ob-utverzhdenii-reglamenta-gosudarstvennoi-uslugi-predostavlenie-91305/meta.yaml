act_code: '91305'
requisite: Постановление акимата Акмолинской области от 27 мая 2015 года № А-6/236. Зарегистрировано Департаментом юстиции Акмолинской области 1 июля 2015 года № 4850. Утратило силу постановлением акимата Акмолинской области от 4 марта 2020 года № А-3/108 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
  kaz: «Ауылдық елдi мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын ұсыну» мемлекеттiк көрсетілетін қызмет регламентiн бекiту туралы

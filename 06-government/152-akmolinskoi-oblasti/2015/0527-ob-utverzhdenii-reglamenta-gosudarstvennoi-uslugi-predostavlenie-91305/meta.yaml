  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 27 мая 2015 года № А-6/236 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елдi мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын ұсыну» мемлекеттiк көрсетілетін қызмет регламентiн бекiту туралы» Ақмола облысы әкімдігінің 2015 жылғы 27 мамырдағы № А-6/236 қаулысына өзгеріс енгізу туралы

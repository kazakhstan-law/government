act_code: '91919'
requisite: Постановление от 26.06.2015 №а-6/130, Акимат Енбекшильдерского района
title:
  rus: Об определении сроков предоставления заявок на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Енбекшильдерскому району на 2015 год
  kaz: Еңбекшілдер ауданы бойынша 2015 жылғы субсидияларды алушылардың тізіміне қосуға құжаттар қабылдау мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша оңтайлы себу мерзімдерін анықтау туралы

act_code: '87483'
requisite: Постановление №А-1/25 от 16.01.2015, Акимат Целиноградского района
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Целиноградскому району на 2015 год
  kaz: Целиноград ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тiзбесiн, қоғамдық жұмыстардың түрлерiн, көлемi мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерiн және олардың қаржыландыру көздерiн бекiту туралы

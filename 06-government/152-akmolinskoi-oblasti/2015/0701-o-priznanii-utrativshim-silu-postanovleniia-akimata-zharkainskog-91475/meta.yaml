act_code: '91475'
requisite: Постановление акимата Жаркаинского района Акмолинской области от 1 июля 2015 года № А-7/184
title:
  rus: О признании утратившим силу постановления акимата Жаркаинского района от 01 апреля 2014 года № А-4/73 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
  kaz: «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Жарқайың ауданы әкімдігінің 2014 жылғы 1 сәуірдегі № А-4/73 қаулысының күшін жою туралы

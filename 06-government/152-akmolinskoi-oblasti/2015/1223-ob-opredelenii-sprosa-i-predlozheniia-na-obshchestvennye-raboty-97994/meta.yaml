act_code: '97994'
requisite: Постановление акимата Бурабайского района Акмолинской области от 23 декабря 2015 года № а-12/556. Зарегистрировано Департаментом юстиции Акмолинской области 19 января 2016 года № 5222. Утратило силу постановлением акимата Бурабайского района Акмолинской области от 22 апреля 2016 года № а-4/159
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Бурабайскому району на 2016 год
  kaz: Бурабай ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тiзбесiн, қоғамдық жұмыстардың түрлерiн, көлемi мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерiн бекіту туралы

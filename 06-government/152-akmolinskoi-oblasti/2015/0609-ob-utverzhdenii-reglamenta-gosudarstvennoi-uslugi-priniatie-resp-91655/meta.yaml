  title:
    rus: О внесении изменений в постановление акимата Акмолинской области от 9 июня 2015 года № А-6/264 «Об утверждении регламента государственной услуги «Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения в порядке, определяемом Правительством Республики Казахстан»
    kaz: «Қазақстан Республикасының Үкіметі айқындайтын тәртіппен сыйға тарту шарты бойынша мемлекеттік емес заңды тұлғалардың және жеке тұлғалардың мүлік құқықтарын Қазақстан Республикасының қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Ақмола облысы әкімдігінің 2015 жылғы 9 маусымдағы № А-6/264 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 4 июня 2015 года № А-6/255 «Об утверждении регламентов государственных услуг в сфере жилищно-коммунального хозяйства»
    kaz: «Тұрғын үй-коммуналдық шаруашылық саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» Ақмола облысы әкімдігінің 2015 жылғы 4 маусымдағы № А-6/255 қаулысына өзгеріс енгізу туралы

act_code: '97443'
requisite: Постановление акимата Ерейментауского района Акмолинской области от 11 декабря 2015 года № а-12/601. Зарегистрировано Департаментом юстиции Акмолинской области 5 января 2016 года № 5170. Утратило силу постановлением акимата Ерейментауского района Акмолинской области от 20 апреля 2016 года № а-4/152
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Ерейментаускому району на 2016 год
  kaz: Ерейментау ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайлары, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

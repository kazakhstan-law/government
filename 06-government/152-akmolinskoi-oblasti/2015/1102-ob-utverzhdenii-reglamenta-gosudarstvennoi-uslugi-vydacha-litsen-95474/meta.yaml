    kaz: «Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдiк және фумигациялық тәсiлдермен қолдануға байланысты қызметті жүзеге асыруға лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Ақмола облысы әкімдігінің 2015 жылғы 2 қарашадағы № А-11/502 қаулысына өзгеріс енгізу туралы

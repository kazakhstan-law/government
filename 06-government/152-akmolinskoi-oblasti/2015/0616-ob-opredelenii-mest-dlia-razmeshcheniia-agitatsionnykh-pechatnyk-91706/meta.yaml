  title:
    rus: О внесении изменений в постановление акимата Егиндыкольского района Акмолинской области от 16 июня 2015 года № а-6/115 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями»
    kaz: Ақмола облысы Егіндікөл ауданы әкімдігінің 2015 жылғы 16 маусымдағы № а-6/115 «Үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және кандидаттарға сайлаушылармен кездесуі үшін үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

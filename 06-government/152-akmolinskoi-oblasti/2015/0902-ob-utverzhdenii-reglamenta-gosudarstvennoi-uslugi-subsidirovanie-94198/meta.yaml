act_code: '94198'
requisite: Постановление акимата Акмолинской области от 2 сентября 2015 года № А-9/411. Зарегистрировано Департаментом юстиции Акмолинской области 5 октября 2015 года № 4997. Утратило силу постановлением акимата Акмолинской области от 26 марта 2020 года № А-4/156 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование стоимости гербицидов, биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений»
  kaz: «Өсімдіктерді қорғау мақсатында, ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердің, биоагенттердің (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

    kaz: «Өсімдіктерді қорғау мақсатында, ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердің, биоагенттердің (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Ақмола облысы әкімдігінің 2015 жылғы 2 қыркүйектегі № А-9/411 қаулысына өзгеріс енгізу туралы

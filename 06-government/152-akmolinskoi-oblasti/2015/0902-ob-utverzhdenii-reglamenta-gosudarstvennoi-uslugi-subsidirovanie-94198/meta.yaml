  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 2 сентября 2015 года № А-9/411 «Об утверждении регламента государственной услуги «Субсидирование стоимости гербицидов, биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений»
    kaz: «Өсімдіктерді қорғау мақсатында, ауылшаруашылығы дақылдарын өңдеуге арналған гербицидтердің, биоагенттердің (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Ақмола облысы әкімдігінің 2015 жылғы 2 қыркүйектегі № А-9/411 қаулысына өзгеріс енгізу туралы

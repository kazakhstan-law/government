title:
  rus: Об определении сроков представления заявок на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Астраханскому району на 2015 год
  kaz: Астрахан ауданы бойынша 2015 жылға арналған субсидияларды алушылардың тізіміне қосуға өтінімдерді ұсыну мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша егудің оңтайлы мерзімдерін анықтау туралы

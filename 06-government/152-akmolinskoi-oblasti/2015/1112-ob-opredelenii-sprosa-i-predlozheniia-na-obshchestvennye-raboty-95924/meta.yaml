act_code: '95924'
requisite: Постановление от 12.11.2015 №а-10/219, Акимат Енбекшильдерского района. Зарегистрировано Департаментом юстиции Акмолинской области 30 ноября 2015 года № 5107. Утратило силу постановлением акимата Енбекшильдерского района Акмолинской области от 22 апреля 2016 года № а-4/73
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Енбекшильдерскому району на 2016 год
  kaz: Еңбекшілдер ауданы бойынша 2016 жылға арналған қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, қоғамдық жұмыстар ұйымдарының, түрлері, көлемі және нақты шартарының тізбесін, қатысушылардың еңбегіне төленетін ақының мөлшері мен оларды қаржыландыру көздерін бекіту туралы

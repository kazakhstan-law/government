act_code: '96220'
requisite: Постановление от 17.11.2015 №А-1/528, Акимат Целиноградского района. Зарегистрировано Департаментом юстиции Акмолинской области 10 декабря 2015 года № 5117. Утратило силу постановлением акимата Целиноградского района Акмолинской области от 20 апреля 2016 года № А-2/176
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Целиноградскому району на 2016 год
  kaz: Целиноград ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тiзбесiн, қоғамдық жұмыстардың түрлерiн, көлемi мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерiн және олардың қаржыландыру көздерiн бекiту туралы

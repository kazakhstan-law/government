act_code: '86922'
requisite: Постановление №а-1/50 от 29.01.2015, Акимат Бурабайского района
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Бурабайскому району на 2015 год
  kaz: Бурабай ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тiзбесiн, қоғамдық жұмыстардың түрлерiн, көлемi мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерiн және оларды қаржыландыру көздерiн бекіту туралы

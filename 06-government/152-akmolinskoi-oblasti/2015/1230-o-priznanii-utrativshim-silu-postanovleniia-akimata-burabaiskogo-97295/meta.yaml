act_code: '97295'
requisite: Постановление акимата Бурабайского района Акмолинской области от 30 декабря 2015 года № а-12/567
title:
  rus: О признании утратившим силу постановления акимата Бурабайского района «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта, являющихся гражданскими служащими и работающих в сельской местности Бурабайского района» от 04 декабря 2014 года № а-12/775
  kaz: Бурабай ауданы әкімдігінің 2014 жылғы 04 желтоқсандағы № а-12/775 «Бурабай ауданының ауылдық жерінде жұмыс істейтін және азаматтық қызметшілер болып табылатын, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандар лауазымдарының тізбесін белгілеу туралы» қаулысын күшін жоғалтты деп тану туралы

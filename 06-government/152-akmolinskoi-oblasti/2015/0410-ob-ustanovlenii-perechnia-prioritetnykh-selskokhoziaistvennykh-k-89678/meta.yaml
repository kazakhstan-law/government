requisite: Постановление акимата Акмолинской области от 10 апреля 2015 года № А-4/152. Зарегистрировано Департаментом юстиции Акмолинской области 5 мая 2015 года № 4783. Утратило силу постановлением акимата Акмолинской области от 17 июня 2015 года № А-6/281
title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и норм субсидий (на 1 гектар) на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым ауыл шаруашылығы дақылдарының тізбесін және басым дақылдар өндіруді субсидиялау арқылы жанар-жағармай материалдары мен көктемгi егiс және егiн жинау  жұмыстарын жүргiзуге қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауылшаруашылық дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын (1 гектарға) белгілеу туралы

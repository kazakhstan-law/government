act_code: '92323'
requisite: Постановление от 13.07.2015 №А-7/223, Акимат Аккольского района
title:
  rus: Об определении сроков предоставления заявок на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей и оптимальных сроков сева субсидируемых приоритетных сельскохозяйственных культур в 2015 году в Аккольском районе
  kaz: Ақкөл ауданында 2015 жылы субсидияланатын басым ауыл шаруашылығы дақылдарына, өсiмдiк шаруашылығының шығымдылығына және өнім сапасын арттыруға, жанар-жағармай материалдарының және қажеттi басқа да тауарлық-материалдық құндылықтардың құнына және себудің оңтайлы мерзімдеріне субсидия алуға өтінімдерді тапсыру мерзімдерін анықтау туралы

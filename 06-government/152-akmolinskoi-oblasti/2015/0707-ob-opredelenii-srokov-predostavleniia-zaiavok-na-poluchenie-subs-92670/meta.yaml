act_code: '92670'
requisite: Постановление от 07.07.2015 №а-6/189, Акимат Жаксынского района
title:
  rus: Об определении сроков предоставления заявок на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте для включения в список сельскохозяйственных товаропроизводителей на получение субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Жаксынскому району на 2015 год
  kaz: Жақсы ауданы бойынша 2015 жылға арналған астық өнімділігін жоғарылату үшін субсидия алушыларға сұраным ұсыну мерзімін анықтау және жанар-жағармай материалдарының және көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық – материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп, шығындарының құнын субсидиялау және субсидия алушы ауыл шаруашылық тауар өндірушілер тізіміне қосу үшін және ауыл шаруашылық басым дақылдар субсидиялау егістін әр қолайлы мерзімдерін анықтау туралы

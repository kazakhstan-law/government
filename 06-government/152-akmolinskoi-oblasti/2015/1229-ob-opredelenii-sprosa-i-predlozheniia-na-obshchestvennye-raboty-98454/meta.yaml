act_code: '98454'
requisite: Постановление акимата города Степногорска Акмолинской области от 29 декабря 2015 года № а-12/482. Зарегистрировано Департаментом юстиции Акмолинской области 25 января 2016 года № 5229. Утратило силу постановлением акимата города Степногорска Акмолинской области от 18 апреля 2016 года № а-4/181
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по городу Степногорску на 2016 год
  kaz: Степногорск қаласы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы

act_code: '92335'
requisite: Постановление от 16.07.2015 №а-7/336, Акимат Бурабайского района
title:
  rus: Об определении сроков предоставления заявок на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей и оптимальных сроков сева субсидируемых приоритетных сельскохозяйственных культур по Бурабайскому району на 2015 год
  kaz: Бурабай ауданы бойынша 2015 жылға субсидияланатын басым ауыл шаруашылығы дақылдарының оңтайлы себу мерзімдерін және өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдарының және басқа тауарлық-материалдық құндылықтардың құнына субсидия алуға өтінімдер беру мерзімдерін белгілеу туралы

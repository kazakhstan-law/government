act_code: '19861'
requisite: Постановление акимата Зерендинского района Акмолинской области от 6 апреля 2004 года № 87-1. Зарегистрировано Департаментом юстиции Акмолинской области 17 мая 2004 года № 2520. Утратило силу постановлением акимата Зерендинского района Акмолинской области от 27 января 2005 года № 15
title:
  rus: «О создании штаба при акимате Зерендинского района по координации деятельности районных отделов и комитетов, их подразделений по формированию электронных списков, регистрации и учету избирателей»
  kaz: «Зеренді ауданы әкімдігінің жанынан аудандық бөлімдер мен комитеттердің олардың құрылымдарының сайлаушылар электронды тізімін жасау, оларды тіркеу, есепке алу жөніндегі қызметтерін үйлестіру штабын құру туралы»

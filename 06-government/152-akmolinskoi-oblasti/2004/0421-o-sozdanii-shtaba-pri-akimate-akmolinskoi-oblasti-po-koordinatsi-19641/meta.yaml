requisite: Постановление акимата Акмолинской области от 22 апреля 2004 года № А-4/101. Зарегистрировано Департаментом юстиции Акмолинской области 30 апреля 2004 года № 2492. Утратило силу постановлением акимата Акмолинской области от 2 апреля 2009 года № А-4/164
title:
  rus: О создании штаба при акимате Акмолинской области по координации деятельности областных управлений и ведомств по формированию электронных списков, регистрации и учету избирателей
  kaz: Ақмола облысы әкімдігінің жанындағы басқармалар мен ведомстволардың сайлаушылардың электрондық тізімдерін түзу, оларды тіркеу және есепке алу жөніндегі қызметін үйлестіру жөніндегі штаб құру туралы

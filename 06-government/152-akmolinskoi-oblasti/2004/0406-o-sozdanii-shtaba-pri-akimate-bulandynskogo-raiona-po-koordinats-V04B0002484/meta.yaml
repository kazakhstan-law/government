requisite: Постановление акимата Буландынского района Акмолинской области от 7 апреля 2004 года № а-4/53. Зарегистрировано Департаментом юстиции Акмолинской области 29 апреля 2004 года № 2484. Утратило силу постановлением акимата Буландынского района Акмолинской области от 27 января 2005 года № а-1/24
title:
  rus: О создании штаба при акимате Буландынского района по координации деятельности районных отделов и ведомств по формированию электронных списков, регистрации и учету избирателей
  kaz: Бұланды ауданы әкімдігінің жанында сайлаушылардың электрондық тізімін құрастыру тіркеу және есепке алуға байланысты аудандық бөлімдер мен водомстволардың қызметін үйлестіру жөнінде штаб құру туралы

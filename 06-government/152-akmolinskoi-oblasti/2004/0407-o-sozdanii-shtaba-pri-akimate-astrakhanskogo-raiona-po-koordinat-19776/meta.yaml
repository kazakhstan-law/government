requisite: Постановление акимата Астраханского района Акмолинской области от 8 апреля 2004 года № 85. Зарегистрировано Департаментом юстиции Акмолинской области 27 апреля 2004 года № 2476. Утратило силу постановлением акимата Астраханского района Акмолинской области от 25 января 2005 года № 30
title:

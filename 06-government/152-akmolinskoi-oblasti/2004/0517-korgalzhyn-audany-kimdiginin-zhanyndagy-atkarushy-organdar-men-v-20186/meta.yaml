act_code: '20186'
requisite: Ақмола облысы Қорғалжын ауданы әкімдігінің 2004 жылғы 18 мамырдағы № 41 қаулысы. Ақмола облысының Әділет департаментінде 2004 жылғы 9 маусымда № 2602 тіркелді. Күші жойылды - Ақмола облысы Қорғалжын ауданы әкімдігінің 2005 жылғы 3 ақпандағы № 14 қаулысымен

requisite: Постановление акимата Жаксынского района Акмолинской области от 15 апреля 2004 года № а-4/102. Зарегистрировано Департаментом юстиции Акмолинской области 29 апреля 2004 года № 2481. Утратило силу постановлением акимата Жаксынского района Акмолинской области от 27 июля 2005 года № а-8/26
title:
  rus: О создании штаба при акимате Жаксынского района по координации деятельности районных управлений и отделов по формированию электронных списков, регистрации и учету избирателей
  kaz: Жақсы ауданы әкімдігінің жанынан аудандық басқармалар мен бөлімдердің сайлаушылардың электрондық тізімдерін түзу, оларды тіркеу және есепке алу жөніндегі аудандық штабты құру туралы

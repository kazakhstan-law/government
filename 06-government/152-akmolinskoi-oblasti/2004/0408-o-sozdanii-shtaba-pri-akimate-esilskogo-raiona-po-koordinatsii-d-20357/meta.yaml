requisite: Постановление акимата Есильского района Акмолинской области от 9 апреля 2004 года № а-4/52. Зарегистрировано Департаментом юстиции Акмолинской области 17 мая 2004 года № 2519. Утратило силу постановлением акимата Есильского района Акмолинской области от 5 марта 2005 года № а-3/91
title:
  rus: О создании штаба при акимате Есильского района по координации деятельности районных исполнительных органов, организаций и учреждений по формированию электронных списков, регистрации и учету избирателей
  kaz: Сайлаушылардың есебін, тіркеуді және электрондық тізімді қалпына келтіру үшін аудандық атқарушы органдар, ұйым және мекеме қызметтерін үйлестіру үшін Есіл аудандық әкімдігі жанынан штаб құру туралы

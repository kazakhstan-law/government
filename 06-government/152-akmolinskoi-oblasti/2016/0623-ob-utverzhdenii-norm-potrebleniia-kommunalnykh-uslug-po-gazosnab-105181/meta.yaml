    rus: О внесении изменений в постановление акимата Акмолинской области от 23 июня 2016 года № А-7/316 «Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в Акмолинской области»
    kaz: «Ақмола облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы» Ақмола облысы әкімдігінің 2016 жылғы 23 маусымдағы № А-7/316 қаулысына өзгерістер енгізу туралы

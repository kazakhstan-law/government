title:
  rus: Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в Акмолинской области
  kaz: Ақмола облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы

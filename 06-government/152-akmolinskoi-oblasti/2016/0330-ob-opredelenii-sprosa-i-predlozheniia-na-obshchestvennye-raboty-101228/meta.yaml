act_code: '101228'
requisite: Постановление акимата Есильского района Акмолинской области от 30 марта 2016 года № а-3/114. Зарегистрировано Департаментом юстиции Акмолинской области 11 апреля 2016 года № 5287. Утратило силу постановлением акимата Есильского района Акмолинской области от 29 апреля 2016 года № а-4/146
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источники их финансирования по Есильскому району на 2016 год
  kaz: Есіл ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және оларды қаржыландыру көздерін бекіту туралы

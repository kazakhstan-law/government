act_code: '103667'
requisite: Постановление акимата Есильского района Акмолинской области от 29 апреля 2016 года № а-4/146
title:
  rus: Об утрате силы постановления акимата Есильского района от 30 марта 2016 года № а-3/114 «Об определении спроса и предложения на общественные работы, утверждении перечня организаций,видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источники их финансирования по Есильскому району на 2016 год»
  kaz: «Есіл ауданы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және оларды қаржыландыру көздерін бекіту туралы» Есіл ауданы әкімдігінің 2016 жылғы 30 наурыздағы № а-3/114 қаулысының күшін жою туралы

requisite: Постановление акимата Акмолинской области от 7 июля 2016 года № А-8/342. Зарегистрировано Департаментом юстиции Акмолинской области 5 августа 2016 года № 5490. Утратило силу постановлением акимата Акмолинской области от 3 мая 2022 года № А-5/222 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении водоохранной зоны и полосы участка русла реки без названия (река Сухая балка) вблизи аула Байсуат Караозекского сельского округа Буландынского района Акмолинской области и режима их хозяйственного использования
  kaz: Ақмола облысының Бұланды ауданы Қараөзек ауылдық округі Байсуат ауылына жақын орналасқан атауы жоқ өзеннің (Сухая балка өзені) арнасындағы учаскенің су қорғау аймағы мен белдеулерін белгілеу және оны шаруашылыққа пайдалану тәртібі туралы

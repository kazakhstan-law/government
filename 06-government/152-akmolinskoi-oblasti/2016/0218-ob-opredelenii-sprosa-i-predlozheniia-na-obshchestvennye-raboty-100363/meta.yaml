act_code: '100363'
requisite: Постановление акимата Зерендинского района Акмолинской области от 18 февраля 2016 года № А-1/70. Зарегистрировано Департаментом юстиции Акмолинской области 3 марта 2016 года № 5272. Утратило силу постановлением акимата Зерендинского района Акмолинской области от 15 апреля 2016 года № А-3/164
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Зерендинскому району на 2016 год
  kaz: 2016 жылға Зеренді ауданы бойынша қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

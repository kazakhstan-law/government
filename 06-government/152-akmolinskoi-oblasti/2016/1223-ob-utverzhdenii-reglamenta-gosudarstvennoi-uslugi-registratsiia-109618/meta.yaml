requisite: Постановление акимата Акмолинской области от 23 декабря 2016 года № А-1/606. Зарегистрировано Департаментом юстиции Акмолинской области 2 февраля 2017 года № 5731. Утратило силу постановлением акимата Акмолинской области от 21 января 2020 года № А-1/22 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Регистрация согласия или отзыва согласия на прижизненное добровольное пожертвование тканей (части ткани) и (или) органов (части органов) после смерти в целях трансплантации»
  kaz: «Транспланттау мақсатында азаматтан қайтыс болғаннан кейін оның тіндерін және (немесе) ағзаларын (ағзалардың бөліктерін) алу мүмкіндігі туралы көзі тірісінде еркінкөңіл білдіруіне келісім беру немесе қайтарып алуды тіркеу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

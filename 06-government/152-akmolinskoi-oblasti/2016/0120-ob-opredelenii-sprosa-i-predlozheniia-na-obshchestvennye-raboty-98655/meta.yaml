act_code: '98655'
requisite: Постановление акимата города Кокшетау Акмолинской области от 20 января 2016 года № А-1/101. Зарегистрировано Департаментом юстиции Акмолинской области 5 февраля 2016 года № 5242. Утратило силу постановлением акимата города Кокшетау Акмолинской области от 21 апреля 2016 года № А-4/878
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по городу Кокшетау на 2016 год
  kaz: Көкшетау қаласы бойынша 2016 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

requisite: Постановление акимата Акмолинской области от 19 января 2016 года № А-1/21. Зарегистрировано Департаментом юстиции Акмолинской области 19 февраля 2016 года № 5257. Утратило силу постановлением акимата Акмолинской области от 26 марта 2020 года № А-4/155 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость»
  kaz: «Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегінде бюджетке төленген қосылған құн салығы сомасын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

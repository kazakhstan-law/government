  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 19 ноября 2016 года № А-1/21 «Об утверждении регламента государственной услуги «Субсидирование заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость»
    kaz: «Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегінде бюджетке төленген қосылған құн салығы сомасын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Ақмола облысы әкімдігінің 2016 жылғы 19 қаңтардағы № А-1/21 қаулысына өзгеріс енгізу туралы

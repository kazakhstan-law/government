  kaz: Зеренді ауданы бойынша 2011 жылға арналған субсидияларды алушылардың тізіміне қосуға өтінім ұсыну мерзімі және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша егудің оңтайлы мерзімдерін анықтау туралы

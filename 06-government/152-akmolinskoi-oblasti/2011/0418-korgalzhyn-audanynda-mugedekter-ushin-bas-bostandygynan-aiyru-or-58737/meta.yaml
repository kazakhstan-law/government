requisite: Ақмола облысы Қорғалжын ауданы әкімдігінің 2011 жылғы 18 сәуірдегі № 55 қаулысы. Ақмола облысы Қорғалжын ауданының Әділет басқармасында 2011 жылғы 29 сәуірде № 1-15-162 тіркелді

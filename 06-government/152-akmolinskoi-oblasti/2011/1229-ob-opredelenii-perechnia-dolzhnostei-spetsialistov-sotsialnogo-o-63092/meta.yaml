  code: '69543'
  requisite: Постановление акимата Ерейментауского района Акмолинской области от 5 декабря 2012 года № а-12/625. Зарегистрировано Департаментом юстиции Акмолинской области 24 декабря 2012 года № 3556. Утратило силу постановлением акимата Ерейментауского района Акмолинской области от 30 марта 2016 года № а-3/121
  title:
    rus: О внесении изменений в постановление акимата Ерейментауского района от 29 декабря 2011 года № А-1/9 "Об определении перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки из средств бюджета Ерейментауского района"
    kaz: Ерейментау ауданы әкімдігінің "Ерейментау ауданының бюджеті қаражаттарынан лауазымдық еңбекақылары мен тарифтік ставкаларын жиырма бес пайызға арттыруға құқығы бар ауылдық (селолық) жерлерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет және спорт лауазымдық мамандарының тізбесін анықтау туралы" 2011 жылғы 29 желтоқсандағы № А-1/9 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/69543/rus

act_code: '63092'
requisite: Постановление акимата Ерейментауского района Акмолинской области от 29 декабря 2011 года № А-1/9. Зарегистрировано Управлением юстиции Ерейментауского района Акмолинской области 27 января 2012 года № 1-9-187. Утратило силу постановлением акимата Ерейментауского района Акмолинской области от 20 октября 2014 года № а-10/530
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерде жұмыс істейтін, әлеуметтік қамтамасыз ету, білім беру, мәдениет және спорт лауазымы мамандарының тізбесін анықтау туралы

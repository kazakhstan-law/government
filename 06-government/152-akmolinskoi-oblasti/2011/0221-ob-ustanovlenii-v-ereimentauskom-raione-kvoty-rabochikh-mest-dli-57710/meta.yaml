  title:
    rus: О внесении изменения в постановление акимата Ерейментауского района от 21 февраля 2011 года № а-2/57 "Об установлении в Ерейментауском районе квоты рабочих мест для инвалидов, для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций"
    kaz: Ерейментау ауданы әкімдігінің 2011 жылғы 21 ақпандағы № а-2/57 "Ерейментау ауданында мүгедектер үшін, қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдардың кәмелетке толмаған түлектер үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгеріс енгізу туралы

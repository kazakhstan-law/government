act_code: '57710'
requisite: Постановление акимата Ерейментауского района Акмолинской области от 21 февраля 2011 года № А-2/57. Зарегистрировано Управлением юстиции Ерейментауского района Акмолинской области 10 марта 2011 года № 1-9-168. Утратило силу постановлением акимата Ерейментауского района Акмолинской области от 1 апреля 2016 года № а-4/126
title:
  rus: Об установлении в Ерейментауском районе квоты рабочих мест для инвалидов, для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций
  kaz: Ерейментау ауданында мүгедектер үшін, қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар үшiн, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

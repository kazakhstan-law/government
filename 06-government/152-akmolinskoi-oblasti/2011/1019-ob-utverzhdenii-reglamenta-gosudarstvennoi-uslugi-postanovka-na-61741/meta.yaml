title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местном исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою" мемлекеттік қызметінің регламентін бекіту туралы'

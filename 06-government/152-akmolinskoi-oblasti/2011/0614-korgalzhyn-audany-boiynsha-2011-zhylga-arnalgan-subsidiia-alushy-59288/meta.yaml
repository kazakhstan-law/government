act_code: '59288'
requisite: Ақмола облысы Қорғалжын ауданы әкімдігінің 2011 жылғы 14 маусымдағы № 85 қаулысы. Ақмола облысы Қорғалжын ауданының Әділет басқармасында 2011 жылғы 21 маусымда № 1-15-166 тіркелді
title:
  rus: Қорғалжын ауданы бойынша 2011 жылға арналған субсидия алушылардың тізіміне қосуға өтінімдердің ұсыну мерзімдерін және субсидияланатын ауыл шаруашылығы басым дақылдарының әр түрі бойынша егіс жүргізудің оңтайлы мерзімдерін анықтау туралы

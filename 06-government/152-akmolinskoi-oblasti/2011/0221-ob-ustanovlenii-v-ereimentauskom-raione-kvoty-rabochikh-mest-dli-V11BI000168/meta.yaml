  title:
    rus: О внесении изменений в постановление акимата Ерейментауского района от 21 февраля 2011 года № а-2/57 «Об установлении в Ерейментауском районе квоты рабочих мест для инвалидов, для лиц, состояших на учёте службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций»
    kaz: «Ерейментау ауданында мүгедектер үшін, қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар үшiн, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы» Ерейментау ауданы әкімдігінің 2011 жылғы 21 ақпандағы № А-2/57 қаулысына өзгерiстер енгiзу туралы

requisite: Постановление акимата Ерейментауского района Акмолинской области от 4 марта 2011 года № а-3/73. Зарегистрировано Управлением юстиции Ерейментауского района Акмолинской области 30 марта 2011 года № 1-9-172
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки из средств бюджета района на 2011 год
  kaz: 2011 жылға арналған аудан бюджетінің қаражаттарынан лауазымдық еңбекақылары мен тарифтік ставкаларын жиырма бес пайызға арттыруға құқығы бар ауылдық (селолық) жерлерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет және спорт лауазымдық мамандарының тізбесін анықтау туралы

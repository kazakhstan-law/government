requisite: Постановление акимата города Кокшетау Акмолинской области от 23 мая 2011 года № А-5/951. Зарегистрировано Управлением юстиции города Кокшетау Акмолинкой области 9 июня 2011 года № 1-1-144. Утратило силу - постановлением акимата города Кокшетау Акмолинской области от 11 июля 2012 года № А-7/2048
title:
  rus: Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в городе Кокшетау

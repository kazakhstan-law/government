title:
  rus: Об установлении публичного сервитута товариществу с ограниченной ответственностью «АлтайГео» в административных границах Конысбайского, Кусепского, Кызылсаянского, Симферопольских сельских округов, поселка Алексеевка и сельском округе имени Сакена Сейфуллина
  kaz: «АлтайГео» жауапкершілігі шектеулі серіктестігіне Қонысбай, Күсеп, Қызылсая, Симферополь ауылдық округтері, Сәкен Сейфуллин атындағы ауылдық округі және Алексеевка кентінің әкімшілік шекараларында қауымдық сервитут белгілеу туралы

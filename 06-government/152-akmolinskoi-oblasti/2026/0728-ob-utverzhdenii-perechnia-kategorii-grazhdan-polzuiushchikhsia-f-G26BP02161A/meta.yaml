  rus: Об утверждении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размер льгот на территории Сандыктауского района
  kaz: Сандықтау ауданы аумағында мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру көрсетілетін қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктердің мөлшерін бекіту туралы

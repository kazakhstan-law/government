title:
  rus: Об утверждении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размер льгот на территории Атбасарского района
  kaz: Мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ Атбасар ауданының аумағында жеңілдіктер мөлшерін бекіту туралы

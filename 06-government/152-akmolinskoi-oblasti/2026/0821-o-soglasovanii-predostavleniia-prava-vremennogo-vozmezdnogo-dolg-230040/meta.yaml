act_code: '230040'
requisite: Постановление акимата района Биржан сал Акмолинской области от 21 августа 2026 года № а-8/149
title:
  rus: О согласовании предоставления права временного возмездного долгосрочного землепользования (аренда) на земельный участок товариществу с ограниченной ответственностью «Tazagul Construction» на месторождение «Майлысорское» в административных границах Донского сельского округа
  kaz: Донской ауылдық округінің әкімшілік шекараларындағы «Майлысор» кен орнында «Tazagul Construction» жауапкершілігі шектеулі серіктестігіне жер теліміне уақытша өтеулі ұзақ мерзімді жер пайдалану (жалға алу) құқығын беруді келісу туралы

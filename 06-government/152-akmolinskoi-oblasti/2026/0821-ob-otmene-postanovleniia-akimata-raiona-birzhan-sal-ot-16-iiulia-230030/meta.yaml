title:
  rus: Об отмене постановления акимата района Биржан сал от 16 июля 2026 года № а-7/134 «Об изменении целевого назначения земельного участка товариществу с ограниченной ответственностью «Жер Агро 2050» в административных границах Донского сельского округа»
  kaz: «Донской ауылдық округінің әкімшілік шекараларындағы «Жер Агро 2050» жауапкершілігі шектеулі серіктестігінің жер телімінің нысаналы мақсатын өзгерту туралы» Біржан сал ауданының әкімдігінің 2026 жылғы 16 шілдедегі № а-7/134 қаулысының күшін жою туралы

requisite: Постановление акимата Зерендинского района Акмолинской области от 3 сентября 2026 года № А-9/396
title:
  rus: Об определении порядка и условий установления за счет средств местного бюджета стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Центр поддержки семьи» отдела занятости и социальных программ Зерендинского района, финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын Зеренді ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімінің «Отбасын қолдау орталығы» коммуналдық мемлекеттік мекемесі жұмыскерлерінің лауазымдық айлықақыларына жергілікті бюджет қаражаты есебінен ынталандыру үстемеақыларын белгілеу тәртібі мен шарттарын айқындау туралы

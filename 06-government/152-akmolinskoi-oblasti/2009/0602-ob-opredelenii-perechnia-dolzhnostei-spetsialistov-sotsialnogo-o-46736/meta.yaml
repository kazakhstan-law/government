act_code: '46736'
requisite: Постановление акимата Ерейментауского района Акмолинской области от 2 июня 2009 года № А-6/166. Зарегистрировано Управлением юстиции Ерейментауского района Акмолинской области 3 июля 2009 года № 1-9-123. Утратило силу постановлением акимата Ерейментауского района Акмолинской области от 15 января 2010 года № А-1/36
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками специалистов, занимающихся этими видами деятельности в городских условиях, за счет средств районного бюджета на 2009 год
  kaz: 2009 жылға арналған аудандық бюджет қаражаттары есебіне ауылдық (селолық) жерлерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мамандарының лауазымдық еңбекақылары мен тарифтік ставкалары қала жағдайларындағы осындай қызмет түрлерімен айналысатын мамандардың еңбекақылары мен ставкаларын салыстырғанда кемінде жиырма бес пайызға жоғары арттыруға құқығы бар мамандардың тізбесісін анықтау туралы

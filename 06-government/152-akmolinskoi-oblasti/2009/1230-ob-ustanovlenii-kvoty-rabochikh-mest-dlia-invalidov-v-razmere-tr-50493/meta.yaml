title:
  rus: Об установлении квоты рабочих мест для инвалидов в размере трех процентов от общей численности рабочих мест на 2010 год
  kaz: 2010 жылға мүгедектер үшін жұмыс орындарының жалпы санынан үш пайыздық көлемінде жұмыс орындарының квотасын белгілеу туралы

title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

requisite: Постановление акимата Астраханского района Акмолинской области от 4 августа 2009 года № 188. Зарегистрировано Управлением юстиции Астраханского района Акмолинской области 1 сентября 2009 года № 1-6-103. Утратило силу постановлением акимата Астраханского района Акмолинской области от 17 февраля 2014 года № 62
title:
  rus: Об определении перечня должностей специалистов образования, социального обеспечения и культуры, работающих в аульной (сельской) местности, имеющих право на повышенные двадцать пять процентов должностные оклады и тарифные ставки
  kaz: Аудан бюджеті қаражатынан қызмет ақыны және тарифтік мөлшерлемені жиырма бес пайызға арттыруға құқығы бар ауылдық жерде жұмыс істейтін білім, әлеуметтік қамтамасыз ету және мәдениет бөлімдері мамандары лауазымдарының тізбесін анықтау туралы

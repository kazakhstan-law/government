act_code: '49525'
requisite: Постановление акимата Атбасарского района Акмолинской области от 13 ноября 2009 года № а-11/294. Зарегистрировано Управлением юстиции Атбасарского района Акмолинской области 24 декабря 2009 года № 1-5-127. Утратило силу постановлением акимата Атбасарского района Акмолинской области от 26 декабря 2013 года № а-12/628
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования и культуры, работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки из средств бюджета района
  kaz: Аудандық бюджеттің қаражатынан лауазымдық жалақыларын және тарифтік ставкаларын жиырма бес пайызға арттыруға құқығы бар, ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру және мәдениет мамандары лауазымдарының тізбесін анықтау туралы

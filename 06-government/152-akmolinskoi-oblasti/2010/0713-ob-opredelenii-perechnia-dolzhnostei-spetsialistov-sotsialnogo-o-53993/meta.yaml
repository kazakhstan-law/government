requisite: Постановление акимата города Кокшетау Акмолинской области от 13 июля 2010 года № А-7/1097. Зарегистрировано Управлением юстиции города Кокшетау Акмолинской области 13 августа 2010 года № 1-1-126. Утратило силу - постановлением акимата города Кокшетау Акмолинской области от 16 июня 2011 года № А-6/1250
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры работающих в аульной (сельской) местности, имеющих право на повышенные на двадцать пять процентов должностные оклады и тарифные ставки из средств городского бюджета
  kaz: Қала бюджетінің қаржысынан ауылдық (селолық) елді-мекендерде жұмыс істейтін әлеуметтік қамтамасыздандыру, білім беру, мәдениет мамандарына тарифтік ставкалар мен лауазымдық айлықақыларын жиырма бес пайызға көтеру құқығына ие мамандардың лауазымдарының тізбесін анықтау туралы

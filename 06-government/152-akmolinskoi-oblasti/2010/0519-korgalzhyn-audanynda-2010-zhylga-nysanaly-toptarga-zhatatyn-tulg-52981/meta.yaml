requisite: Ақмола облысы Қорғалжын ауданы әкімдігінің 2010 жылғы 19 мамырдағы № 52 қаулысы. Ақмола облысы Қорғалжын ауданының Әділет басқармасында 2010 жылғы 7 маусымда № 1-15-148 тіркелді. Күші жойылды - Ақмола облысы Қорғалжын ауданы әкімдігінің 2011 жылғы 6 қаңтардағы № 2 қаулысымен

  requisite: Постановление акимата Атбасарского района Акмолинской области от 29 декабря 2010 года № А-13/352. Зарегистрировано Управлением юстиции Атбасарского района Акмолинской области 21 января 2011 года № 1-5-157. Утратило силу постановлением акимата Атбасарского района Акмолинской области от 12 апреля 2016 года № а-4/106
  title:
    rus: О внесении изменений в постановление акимата Атбасарского района от 18 августа 2010 года № А-8/216 "Об установлении квоты рабочих мест для лиц, освободившихся из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Атбасарском районе на 2010 год"
    kaz: Атбасар ауданы әкімдігінің 2010 жылғы 18 тамыздағы № А-8/216 "2010 жылғы Атбасар ауданында бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгерістер енгізу туралы

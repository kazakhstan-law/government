act_code: '54610'
requisite: Постановление акимата Атбасарского района Акмолинской области от 18 августа 2010 года № А-8/216. Зарегистрировано Управлением юстиции Атбасарского района Акмолинской области 20 сентября 2010 года № 1-5-145. Утратило силу постановлением акимата Атбасарского района Акмолинской области от 12 апреля 2016 года № а-4/106
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Атбасарском районе
  kaz: Атбасар ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

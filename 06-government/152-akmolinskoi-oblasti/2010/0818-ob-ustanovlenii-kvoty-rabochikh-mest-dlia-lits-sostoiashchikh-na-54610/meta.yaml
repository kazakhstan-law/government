  title:
    rus: О внесении изменений в постановление акимата Атбасарского района от 18 августа 2010 года № А-8/216 "Об установлении квоты рабочих мест для лиц, освободившихся из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Атбасарском районе"
    kaz: Атбасар ауданы әкімдігінің 2010 жылғы 18 тамыздағы № А-8/216 "Атбасар ауданында бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгертулер енгізу туралы

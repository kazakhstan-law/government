requisite: Постановление акимата Енбекшильдерского района Акмолинской области от 31 декабря 2013 года № а-9/369. Зарегистрировано Департаментом юстиции Акмолинской области 24 января 2014 года № 3991
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования на 2014 год
  kaz: 2014 жылға арналған қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбекақысының мөлшері және оларды қаржыландыру көздерін бекіту туралы

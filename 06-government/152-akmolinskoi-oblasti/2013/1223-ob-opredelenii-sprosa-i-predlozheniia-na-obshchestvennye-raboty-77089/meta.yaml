requisite: Постановление акимата Буландынского района Акмолинской области от 26 декабря 2013 года № а-12/463. Зарегистрировано Департаментом юстиции Акмолинской области 23 января 2014 года № 3985. Утратило силу постановлением акимата Буландынского района Акмолинской области от 10 февраля 2015 года № а-02/49
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Буландынскому району на 2014 год
  kaz: Бұланды ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

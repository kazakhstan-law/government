requisite: Ақмола облысы Қорғалжын ауданы әкімдігінің 2013 жылғы 8 мамырдағы № 91 қаулысы. Ақмола облысының Әділет департаментінде 2013 жылғы 22 мамырда № 3750 болып тіркелді
title:

title:
  rus: Об определении сроков предоставления заявок на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Зерендинскому району на 2013 год
  kaz: Зеренді ауданы бойынша 2013 жылға арналған субсидия алушылардың тізіміне қосуға арналған өтінімдерді ұсыну мерзімі және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша оңтайлы себу мерзімдерін айқындау туралы

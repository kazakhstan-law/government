act_code: '77006'
requisite: Постановление акимата города Степногорска Акмолинской области от 28 декабря 2013 года № а-12/536. Зарегистрировано Департаментом юстиции Акмолинской области 23 января 2014 года № 3982
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования в городе Степногорске на 2014 год
  kaz: 2014 жылға арналған Степногорск қаласында қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбелерін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландыру көздерін бекіту туралы

requisite: Постановление акимата Аккольского района Акмолинской области от 30 января 2013 года № А-1/54. Зарегистрировано Департаментом юстиции Акмолинской области 22 февраля 2013 года № 3658. Утратило силу постановлением акимата Аккольского района Акмолинской области от 20 апреля 2016 года № А-4/123
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций, в размере одного процента от общей численности рабочих мест
  kaz: Жұмыс орындарының жалпы санының бір проценті мөлшерінде қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарға және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Аккольского района от 30 января 2013 года № А-1/54 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций, в размере одного процента от общей численности рабочих мест"
    kaz: Ақкөл ауданы әкімдігінің 2013 жылғы 30 қаңтардағы № А-1/54 "Жұмыс орындарының жалпы санының бір проценті мөлшерінде қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарға және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы" қаулысына өзгеріс енгізу туралы

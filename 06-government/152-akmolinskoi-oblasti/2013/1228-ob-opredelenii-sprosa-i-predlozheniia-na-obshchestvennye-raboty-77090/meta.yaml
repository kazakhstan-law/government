act_code: '77090'
requisite: Постановление акимата Жаркаинского района Акмолинской области от 28 декабря 2013 года № А-13/496. Зарегистрировано Департаментом юстиции Акмолинской области 23 января 2014 года № 3986
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Жаркаинскому району на 2014 год
  kaz: Жарқайың ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысын және ұсынысын айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

act_code: '77011'
requisite: Постановление акимата Атбасарского района Акмолинской области от 24 декабря 2013 года № а-12/618. Зарегистрировано Департаментом юстиции Акмолинской области 21 января 2014 года № 3973
title:
  rus: Об определении спроса и предложения на общественные работы, утверждении перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Атбасарскому району на 2014 год
  kaz: Атбасар ауданы бойынша 2014 жылға қоғамдық жұмыстарға сұранысты және ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

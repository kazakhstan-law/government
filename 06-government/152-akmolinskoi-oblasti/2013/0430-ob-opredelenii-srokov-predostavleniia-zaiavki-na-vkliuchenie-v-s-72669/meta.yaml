requisite: Постановление акимата Шортандинского района Акмолинской области от 30 апреля 2013 года № А-4/108. Зарегистрировано Департаментом юстиции Акмолинской области 15 мая 2013 года № 3734. Утратило силу постановлением акимата Шортандинского района Акмолинской области от 23 октября 2014 года № А-9/241
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Шортандинскому району на 2013 год

    kaz: Ақмола облысы әкімдігінің 2022 жылғы 25 ақпандағы № А-2/90 «Ақмола облысының 2022 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

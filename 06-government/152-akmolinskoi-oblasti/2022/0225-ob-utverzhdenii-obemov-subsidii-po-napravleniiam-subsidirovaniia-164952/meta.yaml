  title:
    rus: О внесении изменения в постановление акимата Акмолинской области от 25 февраля 2022 года № А-2/90 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства Акмолинской области на 2022 год»
    kaz: Ақмола облысы әкімдігінің 2022 жылғы 25 ақпандағы № А-2/90 «Ақмола облысының 2022 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

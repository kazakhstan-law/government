act_code: '175656'
requisite: Постановление акимата города Косшы Акмолинской области от 19 декабря 2022 года № 10-259. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 декабря 2022 года № 31173
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Косшы
  kaz: Қосшы қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

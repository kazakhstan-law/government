  title:
    rus: О внесении изменений в постановление акимата Бурабайского района от 21 декабря 2022 года № а-12/443 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Бурабайскому району»
    kaz: Бурабай ауданы әкімдігінің 2022 жылғы 21 желтоқсандағы № а-12/443 «Бурабай ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

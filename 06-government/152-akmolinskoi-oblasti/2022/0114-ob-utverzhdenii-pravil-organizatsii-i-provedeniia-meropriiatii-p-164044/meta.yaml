act_code: '164044'
requisite: Постановление акимата района Биржан сал Акмолинской области от 14 января 2022 года № а-1/2. Отменено постановлением акимата района Биржан сал Акмолинской области от 14 апреля 2022 года № а-4/65 (вступает в силу и вводится в действие со дня подписания)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровель многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Степняк и селам района Биржан сал
  kaz: Біржан сал ауданының Степняк қаласына және ауылдарына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

title:
  rus: Об утверждении правил организации  и проведения мероприятий по   реконструкции,  текущему ремонту или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Буландынского района Акмолинской области
  kaz: Ақмола облысының Бұланды ауданына біртұтас сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы жөндеу немесе күрделі жөндеу бойынша іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы

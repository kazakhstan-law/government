  title:
    rus: О внесении изменений в постановление акимата Буландынского района от 31 мая 2022 года № А-05/163 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Буландынского района Акмолинской области»
    kaz: Бұланды ауданы әкімдігінің 2022 жылғы 31 мамырдағы № А-05/163 «Ақмола облысы Бұланды ауданына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Шортандинского района от 30 декабря 2022 года № А-11/311 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Шортандинского района»
    kaz: Шортанды ауданы әкімдігінің 2022 жылғы 30 желтоқсандағы № А-11/311 «Шортанды ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

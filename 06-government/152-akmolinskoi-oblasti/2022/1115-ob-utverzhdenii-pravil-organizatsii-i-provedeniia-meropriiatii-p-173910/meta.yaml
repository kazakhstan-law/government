  title:
    rus: О внесении изменения в постановление акимата Сандыктауского района от 15 ноября 2022 года № А-11/287 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Сандыктауского района»
    kaz: Сандықтау ауданы әкімдігінің 2022 жылғы 15 қарашадағы № А-11/287 «Сандықтау ауданының бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларын ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

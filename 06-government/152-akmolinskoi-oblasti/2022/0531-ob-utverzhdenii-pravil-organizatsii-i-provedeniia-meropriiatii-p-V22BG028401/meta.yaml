  title:
    rus: О внесении изменений в постановление акимата Буландынского района от 31 мая 2022 года № А-05/163 «Об утверждении правил организации и проведения мероприятий по текущему ремонту или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Буландынского района Акмолинской области»
    kaz: «Ақмола облысы Бұланды ауданының көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Бұланды ауданы әкімдігінің 2022 жылғы 31 мамырдағы № А-05/163 қаулысына өзгерістер енгізу туралы

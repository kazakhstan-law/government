  title:
    rus: О внесении изменений в постановление акимата Есильского района от 30 мая 2022 года № а-5/108 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Есильскому району»
    kaz: Есіл ауданы әкімдігінің 2022 жылғы 30 мамырдағы № а-5/108 «Есіл ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

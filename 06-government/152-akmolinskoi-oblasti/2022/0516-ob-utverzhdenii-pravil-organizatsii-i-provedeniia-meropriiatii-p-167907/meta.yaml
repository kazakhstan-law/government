  title:
    rus: О внесении изменений в постановление акимата Атбасарского района от 16 мая 2022 года № а-5/115 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Атбасарского района»
    kaz: Атбасар ауданы әкімдігінің 2022 жылғы 16 мамырдағы № а-5/115 «Атбасар ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Астраханского района от 18 ноября 2022 года № А-11/218 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Астраханскому району»
    kaz: Астрахан ауданы әкімдігінің 2022 жылғы 18 қарашадағы № А-11/218 «Астрахан ауданында бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

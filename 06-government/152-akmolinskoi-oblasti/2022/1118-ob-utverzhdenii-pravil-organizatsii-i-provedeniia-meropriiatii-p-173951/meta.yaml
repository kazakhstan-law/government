requisite: Постановление акимата Астраханского района Акмолинской области от 18 ноября 2022 года № А-11/218. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 ноября 2022 года № 30636
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Астраханского района
  kaz: Астрахан ауданының елді мекендеріне біріңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу, жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

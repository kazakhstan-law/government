act_code: '177487'
requisite: Постановление акимата Шортандинского района Акмолинской области от 30 декабря 2022 года № А-11/311. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 января 2023 года № 31583. Утратило силу постановлением акимата Шортандинского района Акмолинской области от 14 ноября 2025 года № А-3/233 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Шортандинского района
  kaz: Шортанды ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

requisite: Постановление акимата Астраханского района Акмолинской области от 26 декабря 2022 года № А-12/248
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ Астраханского сельского округа, Жалтырского сельского округа, Новочеркасского сельского округа, Николаевского сельского округа, Первомайского сельского округа, Есильского сельского округа, Колутонского сельского округа, Староколутонского сельского округа, Кызылжарского сельского округа, Острогорского сельского округа, Узункольского сельского округа и села Каменка Астраханского района
  kaz: Астрахан ауданы Астрахан ауылдық округінің, Жалтыр ауылдық округінің, Новочеркасск ауылдық округінің, Николаев ауылдық округінің, Первомай ауылдық округінің, Есіл ауылдық округінің, Колутон ауылдық округінің, Старый Колутон ауылдық округінің, Қызылжар ауылдық округінің, Острогорск ауылдық округінің, Ұзынкөл ауылдық округінің және Каменка ауылының жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы

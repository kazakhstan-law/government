  title:
    rus: О внесении изменений в постановление акимата Жаркаинского района от 18 мая 2022 года № А-5/215 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жаркаинскому району»
    kaz: «Жарқайың ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғынүйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Жарқайың ауданы әкімдігінің 2022 жылғы 18 мамырдағы № А-5/215 қаулысына өзгерістер енгізу туралы

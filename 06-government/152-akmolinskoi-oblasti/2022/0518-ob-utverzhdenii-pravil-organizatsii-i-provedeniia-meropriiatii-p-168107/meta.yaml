  title:
    rus: О внесении изменений в постановление акимата Жаркаинского района от 18 мая 2022 года № А-5/215 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных домов, направленных на придание единого архитектурного облика Жаркаинскому району»
    kaz: Жарқайың ауданы әкімдігінің 2022 жылғы 18 мамырдағы № А-5/215 «Жарқайың ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

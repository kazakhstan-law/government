title:
  rus: Об утверждении правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Жаркаинского района
  kaz: Жарқайың ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын қайта жаңарту, ағымдағы немесе күрделі жөндеу жөніндегі іс - шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы

requisite: Постановление акимата Бурабайского района Акмолинской области от 21 декабря 2022 года № а-12/443. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 декабря 2022 года № 31317
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Бурабайскому району
  kaz: Бурабай ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата района Биржан сал от 4 мая 2022 года № а-4/73 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Степняк и селам района Биржан сал»
    kaz: Біржан сал ауданы әкімдігінің 2022 жылғы 4 мамырдағы № а-4/73 «Біржан сал ауданының Степняк қаласына және ауылдарына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

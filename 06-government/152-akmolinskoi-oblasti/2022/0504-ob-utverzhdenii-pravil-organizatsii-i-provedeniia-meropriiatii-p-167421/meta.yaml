act_code: '167421'
requisite: Постановление акимата района Биржан сал Акмолинской области от 4 мая 2022 года № а-4/73. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2022 года № 27938
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Степняк и селам района Биржан сал
  kaz: Біржан сал ауданының Степняк қаласына және ауылдарына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

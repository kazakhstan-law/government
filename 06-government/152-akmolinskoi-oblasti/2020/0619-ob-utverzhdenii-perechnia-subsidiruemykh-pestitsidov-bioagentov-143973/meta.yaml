requisite: Постановление акимата Акмолинской области от 19 июня 2020 года № А-6/322. Зарегистрировано Департаментом юстиции Акмолинской области 19 июня 2020 года № 7905. Утратило силу постановлением акимата Акмолинской области от 16 апреля 2021 года № А-4/177 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и норм субсидий на 1 литр (килограмм, грамм, штук) пестицидов, биоагентов (энтомофагов), а также объемов бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов)
  kaz: Субсидияланатын пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі және пестицидтердің, биоагенттердiң (энтомофагтардың) 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттерді (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы

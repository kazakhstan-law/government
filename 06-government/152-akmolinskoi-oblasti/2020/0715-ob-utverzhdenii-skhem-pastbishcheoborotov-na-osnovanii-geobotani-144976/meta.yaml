  title:
    rus: О внесении изменений и дополнений в постановление акимата Ерейментауского района от 15 июля 2020 года № а-7/212 «Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ села Селетинское, села Бозтал, села Новомарковка, сельского округа имени Олжабай батыра, Тургайского сельского округа, Тайбайского сельского округа, Акмырзинского сельского округа, Улентинского сельского округа, Бестогайского сельского округа, Койтасского сельского округа Ерейментауского района»
    kaz: Ерейментау ауданы әкімдігінің 2020 жылғы 15 шілдедегі № а-7/212 «Ерейментау ауданы Сілеті ауылының, Бозтал ауылының, Новомарковка ауылының, Олжабай батыр атындағы ауылдық округінің, Торғай ауылдық округінің, Тайбай ауылдық округінің, Ақмырза ауылдық округінің, Өлеңті ауылдық округінің, Бестоғай ауылдық округінің, Қойтас ауылдық округінің жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

requisite: Постановление акимата Ерейментауского района Акмолинской области от 15 июля 2020 года № а-7/212. Зарегистрировано Департаментом юстиции Акмолинской области 20 июля 2020 года № 7965. Утратило силу постановлением акимата Ерейментауского района Акмолинской области от 6 февраля 2024 года № а-2/34 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ села Селетинское, села Бозтал, села Новомарковка, сельского округа имени Олжабай батыра, Тургайского сельского округа, Тайбайского сельского округа, Акмырзинского сельского округа, Улентинского сельского округа, Бестогайского сельского округа, Койтасского сельского округа Ерейментауского района
  kaz: Ерейментау ауданы Сілеті ауылының, Бозтал ауылының, Новомарковка ауылының, Олжабай батыр атындағы ауылдық округінің, Торғай ауылдық округінің, Тайбай ауылдық округінің, Ақмырза ауылдық округінің, Өлеңті ауылдық округінің, Бестоғай ауылдық округінің, Қойтас ауылдық округінің, Ақсуат ауылының, Күншалган ауылдық округінің, Еркіншілік ауылдық округінің жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы

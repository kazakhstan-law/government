act_code: '147262'
requisite: Постановление акимата Буландынского района Акмолинской области от 9 октября 2020 года № А-10/298. Зарегистрировано Департаментом юстиции Акмолинской области 12 октября 2020 года № 8074
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Буландынскому району на 2021 год
  kaz: Бұланды ауданы бойынша 2021 жылға арналған пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

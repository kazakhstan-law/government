requisite: Постановление акимата Буландынского района Акмолинской области от 30 июня 2020 года № А-06/168. Зарегистрировано Департаментом юстиции Акмолинской области 3 июля 2020 года № 7933. Утратило силу постановлением акимата Буландынского района Акмолинской области от 17 февраля 2021 года № А-02/39 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении схем пастбищеоборотов на основании геоботанического обследования пастбищ Айнакольского сельского округа, Амангельдинского сельского округа, Алтындынского сельского округа, Вознесенского сельского округа, Ергольского сельского округа, Журавлевского сельского округа, Капитоновского сельского округа, Карамышевского сельского округа, Караозекского сельского округа, Никольского сельского округа, Новобратского сельского округа Буландынского района
  kaz: Бұланды ауданы Айнакөл ауылдық округінің, Амангелді ауылдық округінің, Алтынды ауылдық округінің, Вознесенка ауылдық округінің, Ерголка ауылдық округінің, Журавлевка ауылдық округінің, Капитоновка ауылдық округінің, Карамышевка ауылдық округінің, Қараөзек ауылдық округінің, Никольск ауылдық округінің, Новобратск ауылдық округінің жайылымдарды геоботаникалық зерттеп-қарау негізінде жайылым айналымдарының схемаларын бекіту туралы

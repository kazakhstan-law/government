requisite: Постановление акимата Астраханского района Акмолинской области от 30 ноября 2020 года № 241. Зарегистрировано Департаментом юстиции Акмолинской области 10 декабря 2020 года № 8211. Утратило силу постановлением акимата Астраханского района Акмолинской области от 23 сентября 2025 года № А-9/204 (вводится в действие с 1 января 2026 года)

act_code: '148100'
requisite: Постановление акимата Аккольского района Акмолинской области от 29 октября 2020 года № А-10/317. Зарегистрировано Департаментом юстиции Акмолинской области 3 ноября 2020 года № 8128
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации по Аккольскому району на 2021 год
  kaz: Ақкөл ауданы бойынша 2021 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

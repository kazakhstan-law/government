act_code: '149059'
requisite: Постановление акимата Коргалжынского района Акмолинской области от 26 ноября 2020 года № А-11/168. Зарегистрировано Департаментом юстиции Акмолинской области 27 ноября 2020 года № 8179
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в Коргалжынском районе на 2021 год
  kaz: 2021 жылға арналған Қорғалжын ауданында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

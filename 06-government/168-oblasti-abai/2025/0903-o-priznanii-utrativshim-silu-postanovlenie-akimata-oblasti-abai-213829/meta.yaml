title:
  rus: О признании утратившим силу постановление акимата области Абай от 17 июля 2023 года № 126 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов области Абай»
  kaz: «Абай облысының жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Абай облысы әкімдігінің 2023 жылғы 17 шілдедегі № 126 қаулысының күшін жою туралы

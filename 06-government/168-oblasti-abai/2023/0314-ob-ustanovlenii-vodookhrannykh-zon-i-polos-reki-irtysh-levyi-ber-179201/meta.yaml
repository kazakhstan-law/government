title:
  rus: Об установлении водоохранных зон и полос реки Иртыш (левый берег) на рассматриваемом створе участка расположенный в 7,3 км западнее села Бодене Бескарагайского района области Абай и режима их хозяйственного использования
  kaz: Абай облысы Бесқарағай ауданы Бөдене ауылынан батысқа қарай 7,3 км жерде орналасқан учаскенің қаралып отырған тұсында Ертіс өзенінің (сол жағалау) су қорғау аймақтары мен белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

act_code: '188430'
requisite: Постановление акимата Кокпектинского района области Абай от 13 ноября 2023 года № 335. Зарегистрировано Департаментом юстиции области Абай 16 ноября 2023 года № 146-18
title:
  rus: О признании утратившим силу постановления акимата Кокпектинского района от 26 апреля 2017 года № 114 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Кокпектинского района», исполнительных органов, финансируемых из местного бюджета»
  kaz: Көкпекті ауданы әкімдігінің 2017 жылғы 26 сәуірдегі № 114 «Көкпекті ауданы әкімінің аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысының күшін жою туралы

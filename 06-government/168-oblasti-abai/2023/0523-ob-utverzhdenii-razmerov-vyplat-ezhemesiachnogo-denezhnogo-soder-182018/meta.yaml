act_code: '182018'
requisite: Постановление акимата области Абай от 23 мая 2023 года № 99. Зарегистрировано Департаментом юстиции области Абай 25 мая 2023 года № 80-18. Утратило силу постановлением акимата области Абай от 18 ноября 2025 года № 195 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размеров выплат ежемесячного денежного содержания спортсменам области Абай, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам области Абай, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд
  kaz: Спорт түрлері бойынша Қазақстан Республикасы құрама командалардың (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін Абай облысының спортшыларына, олардың жаттықтырушыларына, сондай-ақ спорт түрлері бойынша Қазақстан Республикасы құрама командалардың (ұлттық құрама командалардың) құрамына кіретін Абай облысының спортшыларына, олардың жаттықтырушылары мен клуб командаларының басшыларына ай сайынғы ақшалай қамтылым төлемдерінің мөлшерін бекіту туралы

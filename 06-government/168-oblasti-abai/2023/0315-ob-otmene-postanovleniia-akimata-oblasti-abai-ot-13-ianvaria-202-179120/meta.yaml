title:
  rus: Об отмене постановления акимата области Абай от 13 января 2023 года № 10 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов области Абай»
  kaz: «Абай облысы жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Абай облысы әкімдігінің 2023 жылғы 13 қаңтардағы № 10 қаулысының күшін жою туралы

title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Семей
  kaz: Семей қаласына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу бойынша іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

requisite: Постановление акимата Жарминского района области Абай от 13 ноября 2023 года № 489. Зарегистрировано Департаментом юстиции области Абай 16 ноября 2023 года № 147-18
title:
  rus: О признании утратившим силу постановление акимата Жарминского района от 6 мая 2021 года № 204 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы»
  kaz: Жарма ауданы әкімдігінің 2021 жылғы 6 мамырдағы № 204 «Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» қаулысының күшін жою туралы

    rus: О внесении изменений в постановление акимата города от 23 января 2023 года № 204 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту    фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Курчатов»

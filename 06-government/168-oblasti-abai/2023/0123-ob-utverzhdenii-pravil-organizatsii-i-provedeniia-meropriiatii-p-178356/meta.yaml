requisite: Постановление акимата города Курчатов области Абай от 23 января 2023 года № 204. Зарегистрировано Департаментом юстиции области Абай 26 января 2023 года № 12
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Курчатов
  kaz: Курчатов қаласына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу бойынша іс - шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

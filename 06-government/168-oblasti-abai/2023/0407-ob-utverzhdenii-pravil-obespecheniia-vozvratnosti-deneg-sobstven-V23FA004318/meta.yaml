  title:
    rus: О внесении изменений в постановление акимата города от 7 апреля 2023 года № 262 «Об утверждении Правил компенсации собственниками квартир, нежилых помещений, затрат, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в городе Семей»
    kaz: Қала әкімдігінің 2023 жылғы 7 сәуірдегі  № 262 «Семей қаласында пәтерлер, тұрғын емес үй -жайлары меншік иелерінің лифтілерді жөндеу мен ауыстыруға, көппәтерлі тұрғын үйді күрделі жөндеуге байланысты шығындарды өтеу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

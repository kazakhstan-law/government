act_code: '180184'
requisite: Постановление акимата области Абай от 21 апреля 2023 года № 80. Зарегистрировано Департаментом юстиции области Абай 25 апреля 2023 года № 52-18
title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2023 год
  kaz: 2023 жылға арналған субсидияланатын тыңайтқыштар (органикалық тыңайтқыштарды қоспағанда) түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы

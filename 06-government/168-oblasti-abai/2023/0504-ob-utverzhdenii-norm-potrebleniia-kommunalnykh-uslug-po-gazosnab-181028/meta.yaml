  title:
    rus: О внесении изменения в постановление акимата области Абай от 4 мая 2023 года № 89 «Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в области Абай»
    kaz: Абай облысы әкімдігінің 2023 жылғы 4 мамырдағы № 89 «Абай облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

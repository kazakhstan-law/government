title:
  rus: Об утверждении Правил обеспечения возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в городе Семей
  kaz: Семей қаласында пәтерлер, тұрғын емес үй-жайлар меншік иелерінің, көппәтерлі тұрғын үйде лифтілерді жөндеуге және ауыстыруға, күрделі жөндеуге байланысты ақшаны қайтаруын қамтамасыз ету қағидаларын бекіту туралы

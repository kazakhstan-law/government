  title:
    rus: О внесении изменений в постановление акимата города Семей от 7 апреля 2023 года № 262 «Об утверждении Правил компенсации собственниками квартир, нежилых помещений затрат, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в городе Семей»
    kaz: Семей қаласы әкімдігінің 2023 жылғы 7 сәуірдегі № 262 «Семей қаласындағы пәтерлердің, тұрғын емес үй-жайларыдың меншік иелерінің лифтілерді жөндеуге және ауыстыруға, көппәтерлі тұрғын үйлерді күрделі жөндеуге байланысты шығындарды өтеу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

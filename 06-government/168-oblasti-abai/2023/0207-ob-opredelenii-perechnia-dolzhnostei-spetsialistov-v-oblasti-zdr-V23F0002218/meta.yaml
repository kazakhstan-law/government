  title:
    rus: О внесении изменения в постановление акимата области Абай от 7 февраля 2023 года № 32 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии и лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Абай облысы әкімдігінің 2023 жылғы 7 ақпандағы № 32 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

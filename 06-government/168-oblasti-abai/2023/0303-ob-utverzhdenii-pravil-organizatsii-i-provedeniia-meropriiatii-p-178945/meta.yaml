  title:
    rus: О внесении изменения в постановление акимата города Семей от 3 марта 2023 года № 172 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Семей»
    kaz: Семей қаласы әкімдігінің 2023 жылғы 3 наурыздағы № 172 «Семей қаласына бірыңғай сәулеттік көрініс беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

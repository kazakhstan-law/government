act_code: '193163'
requisite: Постановление акимата Бородулихинского района области Абай от 5 февраля 2024 года № 36
title:
  rus: Об отмене постановления акимата Бородулихинского района от 31 октября 2022 года № 263 «Об утверждении Правил организации и проведения мероприятии по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Бородулихинского района»
  kaz: Бородулиха ауданы әкімдігінің 2022 жылғы 31 қазандағы «Бородулиха ауданының бірыңғай сәулеттік бейнесін беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы» № 263 қаулысының күшін жою туралы

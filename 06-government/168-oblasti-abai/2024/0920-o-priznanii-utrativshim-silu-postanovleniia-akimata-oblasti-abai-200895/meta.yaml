requisite: Постановление акимата области Абай от 20 сентября 2024 года № 186. Зарегистрировано Департаментом юстиции области Абай 23 сентября 2024 года № 338-18
title:
  rus: О признании утратившим силу постановления акимата области Абай от 24 января 2023 года № 15 «Об утверждении методики определения стоимости услуг, закупаемых для проведения государственной информационной политики в средствах массовой информации на территории области Абай»
  kaz: Абай облысы әкімдігінің 2023 жылғы 24 қаңтардағы № 15 «Абай облысының аумағындағы бұқаралық ақпарат құралдарында мемлекеттік ақпараттық саясатты жүргізу үшін сатып алынатын көрсетілетін қызметтердің құнын айқындау әдістемесін бекіту туралы» қаулысының күшін жою туралы

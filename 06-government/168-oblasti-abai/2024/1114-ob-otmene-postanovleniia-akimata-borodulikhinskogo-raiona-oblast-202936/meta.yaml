act_code: '202936'
requisite: Постановление акимата Бородулихинского района области Абай от 14 ноября 2024 года № 326
title:
  rus: Об отмене постановления акимата Бородулихинского района области Абай № 266 от 08 октября 2024 года «Об утверждении регламента личного приема физических лиц и представителей юридичиских лиц должностными лицами аппарата акима Бородулихинского района»
  kaz: «Бородулиха ауданы әкімі аппаратының лауазымды адамдарының жеке тұлғаларды және заңды тұлғалар өкілдерін жеке қабылдау регламентін бекіту туралы» Абай облысы Бородулиха ауданы әкімдігінің 2024 жылғы 08 қазандағы № 266 қаулысының күшін жою туралы

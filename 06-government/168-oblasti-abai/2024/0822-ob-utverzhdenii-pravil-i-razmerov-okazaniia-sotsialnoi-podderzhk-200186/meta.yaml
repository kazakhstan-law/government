act_code: '200186'
requisite: Решение Абайского районного маслихата области Абай от 22 августа 2024 года № 18/3-VIII. Зарегистрировано Департаментом юстиции области Абай 29 августа 2024 года № 317-18
title:
  rus: Об утверждении Правил и размеров оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Абайского района
  kaz: Абай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидалары мен мөлшерін бекіту туралы

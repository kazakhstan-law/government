act_code: '173632'
requisite: Постановление акимата Бородулихинского района области Абай от 31 октября 2022 года № 263. Отменено постановлением акимата Бородулихинского района области Абай от 5 февраля 2024 года № 36
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Бородулихинского района
  kaz: Бородулиха ауданының бірыңғай сәулеттік келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

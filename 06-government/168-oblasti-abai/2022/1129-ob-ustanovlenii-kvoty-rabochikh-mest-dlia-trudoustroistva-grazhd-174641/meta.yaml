requisite: Постановление акимата города Семей области Абай от 29 ноября 2022 года № 1675. Утратило силу постановлением акимата города Семей области Абай от 27 декабря 2023 года № 1090 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

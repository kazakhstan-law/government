act_code: '222606'
requisite: Постановление акимата Кокпектинского района области Абай от 27 февраля 2026 года № 47
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Кокпектинского района
  kaz: Көкпекті ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі  іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

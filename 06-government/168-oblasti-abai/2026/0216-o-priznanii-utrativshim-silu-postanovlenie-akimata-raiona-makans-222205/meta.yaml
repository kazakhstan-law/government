act_code: '222205'
requisite: Постановление акимата района Мақаншы области Абай от 16 февраля 2026 года № 24
title:
  rus: О признании утратившим силу постановление акимата района Мақаншы от 16 октября 2025 года № 117 «Об определении и утверждении мест размещения нестационарных торговых объектов на территории района Мақаншы»
  kaz: «Мақаншы ауданының аумағында стационарлық емес сауда объектілерін орналастыру орындарын айқындау және бекіту туралы» Мақаншы ауданы әкімдігінің 2025 жылғы 16 қазандағы № 117 қаулының күшін жою туралы

title:
  rus: О признании утратившим силу постановления акимата области Абай от 1 июля 2024 года № 119 «Об утверждении Регламента личного приема физических лиц и представителей юридических лиц должностными лицами аппарата акима области Абай»
  kaz: «Абай облысы әкімі аппаратының лауазымды тұлғаларының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдауының регламентін бекіту туралы» Абай облысы әкімдігінің 2024 жылғы 1 шілдедегі № 119 қаулысының күшін жою туралы

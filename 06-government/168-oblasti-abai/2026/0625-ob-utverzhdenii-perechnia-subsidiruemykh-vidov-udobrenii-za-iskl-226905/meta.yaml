  title:
    rus: О внесении дополнений в постановление акимата области Абай от 25 июня 2026 года № 104 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений по области Абай на 2026 год»
    kaz: «Абай облысы бойынша 2026 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын бекіту туралы» Абай облысы әкімдігінің 2026 жылғы 25 маусымдағы № 104 қаулысына толықтырулар енгізу туралы

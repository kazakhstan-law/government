  requisite: Постановление акимата города Шымкент от 9 декабря 2025 года № 6640
  title:
    rus: О внесении изменений в постановление акимата города Шымкент от 19 июня 2025 года № 3448 «О реализации пилотного проекта по размещению единого государственного заказа на дополнительное образование для детей (творческий и спортивный заказы, образовательный заказ на дополнительное образование) с учетом персонифицированного финансирования по получателям услуг в городе Шымкент»
    kaz: «Көрсетілетін қызметті алушылар бойынша дербестендірілген қаржыландыруды ескере отырып, балаларға арналған қосымша білім беруге бірыңғай мемлекеттік тапсырысты (шығармашылық және спорттық тапсырыстар, қосымша білім беруге білім беру тапсырысы) орналастыру жөніндегі пилоттық жобаны Шымкент қаласында іске асыру туралы» Шымкент қаласы әкімдігінің 2025 жылғы 19 маусымдағы № 3448 қаулысына өзгерістер енгізу туралы

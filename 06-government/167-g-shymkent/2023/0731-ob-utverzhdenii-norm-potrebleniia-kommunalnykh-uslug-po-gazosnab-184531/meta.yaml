act_code: '184531'
requisite: Постановление акимата города Шымкент от 31 июля 2023 года № 1895
title:
  rus: Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению и водоотведению для потребителей, не имеющих приборов учета в городе Шымкент
  kaz: Шымкент қаласында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұрумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановление акимата города Шымкент от 19 марта 2021 года № 184 «Об утверждении объемов субсидий на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства на 2021 год»
    kaz: «2021 жылға асыл тұқымды мал шаруашылығын дамытуға, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруға субсидиялар көлемдерін бекіту туралы» Шымкент қаласы әкімдігінің 2021 жылғы 19 наурыздағы № 184 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '153987'
requisite: Постановление акимата города Шымкент от 30 марта 2021 года № 197. Зарегистрировано Департаментом юстиции города Шымкент 31 марта 2021 года № 160
title:
  rus: Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Шымкент
  kaz: Шымкент қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

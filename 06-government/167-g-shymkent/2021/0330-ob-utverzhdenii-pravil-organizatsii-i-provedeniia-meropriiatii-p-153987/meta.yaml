  title:
    rus: О внесении изменений в постановление акимата города Шымкент от 30 марта 2021 года № 197 «Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика по городу Шымкент»
    kaz: «Шымкент қаласы бойынша бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Шымкент қаласы әкімдігінің 2021 жылғы 30 наурыздағы № 197 қаулысына өзгерістер енгізу туралы

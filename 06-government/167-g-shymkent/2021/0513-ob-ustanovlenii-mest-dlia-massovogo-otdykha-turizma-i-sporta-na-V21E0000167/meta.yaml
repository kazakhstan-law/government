  title:
    rus: О внесении изменения в постановление акимата города Шымкент от 13 мая 2021 года № 289 «Об установлении мест для массового отдыха, туризма и спорта на водных объектах и водохозяйственных сооружениях города Шымкент»
    kaz: «Шымкент қаласының су объектілері мен су шаруашылығы құрылыстарындағы көпшіліктің демалуына, туризм мен спортқа арналған жерлерін белгілеу туралы» Шымкент қаласы әкімдігінің 2021 жылғы 13 мамырдағы № 289 қаулысына өзгеріс енгізу туралы

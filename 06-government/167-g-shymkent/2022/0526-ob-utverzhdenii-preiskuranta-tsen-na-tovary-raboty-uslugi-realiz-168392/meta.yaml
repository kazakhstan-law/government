title:
  rus: Об утверждении прейскуранта цен на товары (работы, услуги), реализуемые коммунальным государственным учреждением «Шымкентский городской государственный архив» Управления культуры, развития языков и архивов города Шымкент
  kaz: Шымкент қаласының мәдениет, тілдерді дамыту және архивтер басқармасының «Шымкент қалалық мемлекеттік архиві» коммуналдық мемлекеттік мекемесімен өткізетін тауарлардың (жұмыстардың, көрсетілетін қызметтердің) бағалар прейскурантын бекіту туралы

requisite: Постановление акимата города Шымкент от 14 февраля 2022 года № 262. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 февраля 2022 года № 26812. Утратило силу постановлением акимата города Шымкент от 20 января 2025 года № 238 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении методики определения стоимости услуг, закупаемых для проведения государственной информационной политики в средствах массовой информации на территории города Шымкент
  kaz: Шымкент қаласының аумағындағы бұқаралық ақпарат құралдарында мемлекеттік ақпараттық саясатты жүргізу үшін сатып алынатын, көрсетілетін қызметтердің құнын айқындаудың әдістемесін бекіту туралы

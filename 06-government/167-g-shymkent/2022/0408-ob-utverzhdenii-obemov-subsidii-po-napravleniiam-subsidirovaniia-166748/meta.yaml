  title:
    rus: О внесении изменений в постановление акимата города Шымкент от 8 апреля 2022 года № 564 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных на 2022 год»
    kaz: «2022 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарын және субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы» Шымкент қаласы әкімдігінің 2022 жылғы 8 сәуірдегі № 564 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/176161/rus

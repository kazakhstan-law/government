  code: '197952'
  requisite: Постановление акимата города Шымкент от 19 июня 2024 года № 2932. Зарегистрировано в Департаменте юстиции города Шымкент 20 июня 2024 года № 214-17. Утратило силу постановлением акимата города Шымкент от 12 марта 2026 года № 1043 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата города Шымкент от 12 ноября 2018 года № 248 «Об утверждении размеров выплат ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд»
    kaz: «Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы» Шымкент қаласы әкімдігінің 2018 жылғы 12 қарашадағы № 248 қаулысына өзгеріс енгізу туралы

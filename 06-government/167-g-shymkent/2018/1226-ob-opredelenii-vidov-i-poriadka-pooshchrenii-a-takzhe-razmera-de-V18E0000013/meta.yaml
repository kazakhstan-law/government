  title:
    rus: О внесении изменений в постановление акимата города Шымкент от 26 декабря 2018 года № 368 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в городе Шымкент»
    kaz: Шымкент қаласы әкімдігінің 2018 жылғы 26 желтоқсандағы «Шымкент қаласында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» № 368 қаулысына өзгерістер енгізу туралы

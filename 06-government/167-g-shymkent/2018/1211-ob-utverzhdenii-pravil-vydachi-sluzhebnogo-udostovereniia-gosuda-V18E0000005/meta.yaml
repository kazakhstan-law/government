title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственным служащим государственного учреждения «Аппарат акима города Шымкент», исполнительных органов, финансируемых из бюджета города Шымкент и его описания
  kaz: «Шымкент қаласы әкімінің аппараты» мемлекеттік мекемесінің, Шымкент қаласының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне қызметтік куәлікті беру қағидаларын және оның сипаттамасын бекіту туралы

requisite: Постановление акимата города Шымкент от 26 декабря 2018 года № 368. Зарегистрировано Департаментом юстиции города Шымкент 27 декабря 2018 года № 13. Утратило силу постановлением акимата города Шымкент от 19 августа 2026 № 3909 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

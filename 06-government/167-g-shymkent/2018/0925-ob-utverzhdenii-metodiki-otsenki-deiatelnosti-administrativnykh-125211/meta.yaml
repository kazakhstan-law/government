act_code: '125211'
requisite: Постановление акимата города Шымкент от 25 сентября 2018 года № 181. Зарегистрировано Департаментом юстиции Туркестанской области 9 октября 2018 года № 4758. Утратило силу постановлением акимата города Шымкент от 15 сентября 2022 года № 1851 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих государственного учреждения «Аппарат акима города Шымкент», исполнительных органов, финансируемых из бюджета города Шымкент корпуса «Б»
  kaz: «Б» корпусындағы «Шымкент қаласы әкімінің аппараты» мемлекеттік мекемесінің, Шымкент қаласының бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

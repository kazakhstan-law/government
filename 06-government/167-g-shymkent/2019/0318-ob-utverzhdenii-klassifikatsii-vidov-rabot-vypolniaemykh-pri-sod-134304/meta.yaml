  title:
    rus: О внесении изменений в постановление акимата города Шымкент от 18 марта 2019 года № 222 «Об утверждении классификации видов работ, выполняемых при содержании, текущем, среднем и капитальном ремонтах улиц города Шымкент»
    kaz: «Шымкент қаласының көшелерін күтіп - ұстау, ағымдағы, орташа және күрделі жөндеу кезінде орындалатын жұмыстар түрлерінің сыныптамасын бекіту туралы» Шымкент қаласы әкімдігінің 2019 жылғы 18 наурыздағы № 222 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата города Шымкент от 2 сентября 2019 года № 689 «Об утверждении Правил реализации механизмов стабилизации цен на социально значимые продовольственные товары по городу Шымкент»
    kaz: «Шымкент қаласындағы әлеуметтік маңызы бар азық-түлік тауарларына бағаларды тұрақтандыру тетіктерін іске асыру қағидаларын бекіту туралы» Шымкент қаласы әкімдігінің 2019 жылғы 2 қыркүйектегі № 689 қаулысына өзгеріс енгізу туралы

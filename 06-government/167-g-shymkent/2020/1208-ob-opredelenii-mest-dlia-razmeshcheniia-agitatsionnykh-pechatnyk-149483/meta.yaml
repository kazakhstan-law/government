  title:
    rus: О внесении изменений в постановление акимата города Шымкент от 8 декабря 2020 года № 769 «О предоставлении кандидатам помещений для встреч с избирателями и определении мест для размещения агитационных печатных материалов»
    kaz: «Кандидаттарға сайлаушылармен кездесуі үшін шарттық негізде үй-жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы» Шымкент қаласы әкімдігінің 2020 жылғы 8 желтоқсандағы № 769 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата города Шымкент от 12 августа 2020 года № 473. Зарегистрировано Департаментом юстиции города Шымкент 13 августа 2020 года № 118. Утратило силу постановлением акимата города Шымкент от 5 октября 2023 года № 2466 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения первому заместителю, заместителям акима города Шымкент, руководителю аппарата акима города Шымкент, акимам Абайского, Аль-Фарабийского, Енбекшинского, Каратауского районов города Шымкент и его описания
  kaz: Шымкент қаласы әкімінің бірінші орынбасарына, орынбасарларына, қала әкімінің аппарат басшысына, Шымкент қаласының Абай, Әл-Фараби, Еңбекші және Қаратау аудандары әкімдеріне қызметтік куәлікті беру қағидаларын және оның сипаттамасын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата города Шымкент от 12 августа 2020 года № 473 «Об утверждении Правил выдачи служебного удостоверения первому заместителю, заместителям акима города Шымкент, руководителю аппарата акима города Шымкент, акимам Абайского, Аль-Фарабийского, Енбекшинского, Каратауского районов города Шымкент и его описания»
    kaz: Шымкент қаласы әкімдігінің 2020 жылғы 12 тамыздағы № 473 «Шымкент қаласы әкімінің бірінші орынбасарына, орынбасарларына, қала әкімінің аппарат басшысына, Шымкент қаласының Абай, Әл-Фараби, Еңбекші және Қаратау аудандары әкімдеріне қызметтік куәлікті беру қағидаларын және оның сипаттамасын бекіту туралы» қаулысына өзгерістер енгізу туралы

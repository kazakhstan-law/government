act_code: '199957'
requisite: Постановление акимата города Шымкент от 1 июля 2024 года № 3088
title:
  rus: Об отмене постановления акимата города Шымкент от 22 августа 2023 года № 2056 «О компенсации расходов за питание отдельным категориям воспитанников дошкольных организаций города Шымкент»
  kaz: «Шымкент қаласының мектепке дейінгі ұйымдары тәрбиеленушілерінің жекелеген санаттарына тамақтандыру үшін шығындарды өтеу туралы» Шымкент қаласы әкімдігінің 2023 жылғы 22 тамыздағы № 2056 қаулысының күшін жою туралы

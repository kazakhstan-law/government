requisite: Постановление акимата города Шымкент от 23 апреля 2024 года № 1983. Зарегистрировано в Департаменте юстиции города Шымкент 25 апреля 2024 года № 209-17
title:
  rus: Об утверждении объемов субсидирования повышения продуктивности и качества продукции аквакультуры (рыбоводства), а также развития племенного рыбоводства по городу Шымкент на 2024 год
  kaz: Шымкент қаласы бойынша 2024 жылға арналған акваөсіру (балық өсіру шаруашылығы) өнімділігі мен өнім сапасын арттыруды, сондай-ақ асыл тұқымды балық өсіруді дамытуды субсидиялау көлемдерін бекіту туралы

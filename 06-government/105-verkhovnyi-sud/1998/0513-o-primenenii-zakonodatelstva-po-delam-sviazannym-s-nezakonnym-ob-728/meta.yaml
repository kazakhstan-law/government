  title:
    rus: О внесении изменений в постановление Пленума Верховного Суда Республики Казахстан "О применении законодательства по делам, связанным с незаконным оборотом наркотических средств, психотропных, сильнодействующих и ядовитых веществ" N 3 от 14 мая 1998 года с изменениями, внесенными постановлением Пленума N 2 от 30 апреля 1999 года
    kaz: Қазақстан Республикасы Жоғарғы Соты Пленумының "Есiрткі, психотроптық, күштi әсер ететiн және улы заттарды заңсыз айналымға түсiру жөнiндегі істер бойынша заңдарды қолдану туралы" 1998 жылғы 14 мамырдағы N 3 қаулысына, Пленумның 1999 жылғы 30 сәуірдегі N 2 қаулысымен енгізілген өзгерiстермен бірге, өзгерістер енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Пленума Верховного Суда Республики Казахстан "О применении законодательства по делам, связанным с незаконным оборотом наркотических средств, психотропных и ядовитых веществ" N 3 от 14 мая 1998 года (с изменениями, внесенными постановлением Пленума N 2 от 30 апреля 1999 года и постановлением Пленума N 19 от 22 декабря 2000 года)
    kaz: '"Есірткі, психотроптық және улы заттарды заңсыз айналымға түсіру жөніндегі істер бойынша заңдарды қолдану туралы" Қазақстан Республикасы Жоғарғы Соты Пленумының 1998 жылғы 14 мамырдағы N 3 қаулысына өзгерістер мен толықтырулар енгізу туралы (Пленумның 1999 жылғы 30 сәуірдегі N 2 қаулысымен және 2000 жылғы 22 желтоқсандағы N 19 қаулысымен енгізілген өзгерістерімен бірге)'

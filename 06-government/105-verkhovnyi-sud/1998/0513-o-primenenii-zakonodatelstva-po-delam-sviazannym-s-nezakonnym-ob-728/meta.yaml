    kaz: Қазақстан Республикасы Жоғарғы Соты Пленумының 1998 жылғы 14 мамырдағы "Есiрткi, психотроптық, күштi әсер ететiн және улы заттарды заңсыз айналымға түсiру жөнiндегi iстер бойынша заңдарды қолдану туралы" N 3 қаулысына өзгерiстер енгiзу туралы

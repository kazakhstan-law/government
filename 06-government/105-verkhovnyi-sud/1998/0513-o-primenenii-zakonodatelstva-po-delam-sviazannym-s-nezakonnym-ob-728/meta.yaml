title:
  rus: О применении законодательства по делам, связанным с незаконным оборотом наркотических средств, психотропных веществ, их аналогов и прекурсоров
  kaz: Есірткінің, психотроптық заттардың, сол тектестер мен прекурсорлардың заңсыз айналымына қатысты істер бойынша заңнаманы қолдану туралы

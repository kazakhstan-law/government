act_code: '18129'
requisite: Нормативное постановление Верховного Суда Республики Казахстан от 19 декабря 2003 года № 10. Утратило силу нормативным постановлением Верховного Суда Республики Казахстан от 24 декабря 2010 года № 20 (вводится в действие со дня официального опубликования)
title:
  rus: О применении судами законодательства об оспаривании решений и действий (или бездействия) органов государственной власти, местного самоуправления, общественных объединений, организаций, должностных лиц и государственных служащих
  kaz: Соттардың мемлекеттік өкімет, жергілікті өзін-өзі басқару органдарының, қоғамдық бірлестіктердің, ұйымдардың, лауазымды адамдар мен мемлекеттік қызметшілердің шешімдері мен әрекеттеріне (немесе әрекетсіздігіне) дау айту жөніндегі заңнаманы қолдануы туралы

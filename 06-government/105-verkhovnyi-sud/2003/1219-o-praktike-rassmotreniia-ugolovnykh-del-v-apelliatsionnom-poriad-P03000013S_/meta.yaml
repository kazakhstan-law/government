  title:
    rus: О внесении изменений и дополнений в нормативное постановление Верховного Суда Республики Казахстан «О практике рассмотрения уголовных дел в апелляционном порядке» от 19 декабря 2003 года № 13 и признании утратившими силу некоторых постановлений Пленума Верховного Суда Республики Казахстан и нормативных постановлений Верховного Суда Республики Казахстан»
    kaz: «Қылмыстық істерді апелляциялық тәртіппен қарау тәжірибесі туралы» Қазақстан Республикасы Жоғарғы Сотының 2003 жылғы  19 желтоқсандағы № 13 нормативтік қаулысына өзгерістер мен толықтырулар енгізу туралы және Қазақстан Республикасы Жоғарғы Соты Пленумының кейбір қаулыларының және Қазақстан Республикасы Жоғарғы Сотының кейбір нормативтік қаулыларының  күші жойылды деп тану туралы»

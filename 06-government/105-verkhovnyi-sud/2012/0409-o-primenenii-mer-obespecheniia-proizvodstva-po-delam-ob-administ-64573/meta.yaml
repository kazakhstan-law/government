  requisite: Нормативное постановление Верховного Суда Республики Казахстан от 25 ноября 2016 года № 11
  title:
    rus: О внесении изменений и дополнений в нормативные постановления Верховного Суда Республики Казахстан от 18 июня 2004 года № 4 «О применении судами законодательства об изъятии дохода, полученного при осуществлении предпринимательской или иной деятельности без лицензии» и от 9 апреля 2012 года № 1 «О применении мер обеспечения производства и некоторых других вопросах применения законодательства об административных правонарушениях»
    kaz: «Кәсіпкерлік немесе өзге де қызметті лицензиясыз жүзеге асыру кезінде тапқан табысты алу жөніндегі заңнаманы соттардың қолдануы туралы» Қазақстан Республикасы Жоғарғы Сотының 2004 жылғы 18 маусымдағы № 4 және «Іс жүргізуді қамтамасыз ету шараларын қолдану және әкімшілік құқық бұзушылық туралы заңнаманы қолданудың кейбір басқа да мәселелері туралы» 2012 жылғы 9 сәуірдегі № 1 нормативтік қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/107978/rus

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные постановления Верховного Суда Республики Казахстан по уголовному и уголовно-процессуальному законодательству
    kaz: Қазақстан Республикасы Жоғарғы Сотының кейбір нормативтік қаулыларына қылмыстық және қылмыстық-процестік заңнама бойынша өзгерістер мен толықтырулар енгізу туралы

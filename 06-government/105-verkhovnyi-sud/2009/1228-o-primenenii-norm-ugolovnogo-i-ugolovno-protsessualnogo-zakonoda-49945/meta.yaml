title:
  rus: О применении норм уголовного и уголовно-процессуального законодательства по вопросам соблюдения личной свободы и неприкосновенности достоинства человека, противодействия пыткам, насилию, другим жестоким или унижающим человеческое достоинство видам обращения и наказания
  kaz: Қылмыстық және қылмыстық процестік заңнаманың адамның жеке бас бостандығын сақтау және қадір-қасиетіне қол сұқпау, қинауға, зорлық-зомбылыққа, басқа да қатыгез немесе адамның ар-намысын қорлайтын әрекеттер мен жазалау түрлеріне қарсы мәселелер жөніндегі нормаларын қолдану туралы

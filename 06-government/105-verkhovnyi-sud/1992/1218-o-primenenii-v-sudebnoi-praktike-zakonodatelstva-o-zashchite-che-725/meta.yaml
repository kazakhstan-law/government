  title:
    rus: О внесении изменений в постановление Пленума Верховного Суда Республики Казахстан от 18 декабря 1992 года N 6 "О применении в судебной практике законодательства о защите чести, достоинства и деловой репутации граждан и юридических лиц" (с изменениями, внесенными постановлением Пленума от 15 мая 1998 года N 5)
    kaz: Қазақстан Республикасы Жоғарғы Соты Пленумының "Сот тәжірибесінде азаматтардың және заңды тұлғалардың ар-намысы мен абыройын және іскерлік беделділігін қорғау жөніндегі заңдылықты қолдану туралы" 1992 жылғы 18 желтоқсандағы N 6 қаулысына (Пленумның 1998 жылғы 15 мамырдағы N 5 қаулысымен енгізілген өзгерістерімен бірге) өзгерістер енгізу туралы

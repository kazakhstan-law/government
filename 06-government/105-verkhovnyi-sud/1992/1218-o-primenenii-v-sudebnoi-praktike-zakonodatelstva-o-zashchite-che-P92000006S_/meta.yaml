  title:
    rus: О внесении изменения в нормативное постановление Верховного Суда Республики Казахстан от 18 декабря 1992 года № 6 "О применении в судебной практике законодательства о защите чести, достоинства и деловой репутации физических и юридических лиц"
    kaz: '"Сот тәжiрибесiнде азаматтардың және заңды тұлғалардың ар-намысы мен абыройын және iскерлiк беделдiлiгiн қорғау жөнiндегi заңдылықты қолдану туралы" Қазақстан Республикасы Жоғарғы Сотының 1992 жылғы 18 желтоқсандағы N 6 нормативтік қаулысына өзгеріс енгізу туралы'

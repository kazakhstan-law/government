title:
  rus: О судебной практике условно-досрочного освобождения от отбывания наказания, замены неотбытой части наказания более мягким видом наказания и сокращения срока назначенного наказания
  kaz: Жазаны өтеуден шартты түрде мерзімінен бұрын босатудың, жазаның өтелмеген бөлігін жазаның неғұрлым жеңіл түріне ауыстырудың және тағайындалған жаза мерзімін қысқартудың сот практикасы туралы

  title:
    rus: О внесении изменений и дополнений в нормативное постановление Верховного Суда Республики Казахстан от 25 декабря 2006 года № 9 «О применении судами Республики Казахстан законодательства о судебных расходах по гражданским делам»
    kaz: «Қазақстан Республикасы соттарының азаматтық істер бойынша сот шығындары туралы заңдарды қолдануы туралы» Қазақстан Республикасы Жоғарғы Сотының 2006 жылғы 25 желтоқсандағы № 9 нормативтік қаулысына өзгерістер мен толықтырулар енгізу туралы

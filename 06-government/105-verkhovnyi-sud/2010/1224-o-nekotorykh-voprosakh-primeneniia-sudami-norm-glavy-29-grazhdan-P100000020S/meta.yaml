  title:
    rus: О внесении изменений и дополнений в нормативное постановление Верховного Суда Республики Казахстан от 24 декабря 2010 года № 20 «О некоторых вопросах применения судами норм главы 27 Гражданского процессуального кодекса Республики Казахстан»
    kaz: «Соттардың Қазақстан Республикасының Азаматтық іс жүргізу кодексі 27-тарауының нормаларын қолдануының кейбір мәселелері туралы» Қазақстан Республикасы Жоғарғы Сотының 2010 жылғы 24 желтоқсандағы № 20 нормативтік қаулысына өзгерістер мен толықтырулар енгізу туралы

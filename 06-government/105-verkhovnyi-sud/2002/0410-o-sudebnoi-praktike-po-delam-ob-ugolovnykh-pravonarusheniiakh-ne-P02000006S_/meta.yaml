title:
  rus: О судебной практике по делам об уголовных правонарушениях несовершеннолетних и о вовлечении их в совершение уголовных правонарушений и иных антиобщественных действий
  kaz: Кәмелетке толмаған адамдардың қылмыстық құқық бұзушылықтары және оларды қылмыстық құқық бұзушылықтар мен қоғамға қарсы өзге де іс-әрекеттер жасауға тарту жөніндегі істер бойынша сот практикасы туралы

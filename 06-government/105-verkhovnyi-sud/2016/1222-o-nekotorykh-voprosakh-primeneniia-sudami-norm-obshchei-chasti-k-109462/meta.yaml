  title:
    rus: О внесении изменений и дополнений в нормативное постановление Верховного Суда Республики Казахстан от 22 декабря 2016 года № 12 «О некоторых вопросах применения судами норм Общей части Кодекса Республики Казахстан об административных правонарушениях»
    kaz: «Соттардың Қазақстан Республикасы Әкімшілік құқық бұзушылық туралы кодексінің Жалпы бөлігінің нормаларын қолдануының кейбір мәселелері туралы» Қазақстан Республикасы Жоғарғы Сотының 2016 жылғы 22 желтоқсандағы № 12 нормативтік қаулысына өзгерістер мен толықтырулар енгізу туралы

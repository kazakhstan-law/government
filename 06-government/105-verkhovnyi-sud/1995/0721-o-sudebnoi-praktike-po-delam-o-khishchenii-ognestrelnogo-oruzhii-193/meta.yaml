title:
  rus: О судебной практике по делам о хищении огнестрельного оружия, боевых припасов, вооружения и взрывчатых веществ, незаконном приобретении, ношении, хранении, изготовлении или сбыте их, и небрежном хранении огнестрельного оружия
  kaz: Атыс қаруларын, оқ-дәрілерді, қару-жарақтарды және жарылғыш заттарды жымқыру, оларды заңсыз сатып алу, алып жүру, сақтау, дайындау немесе өткізу және атыс қаруларын ұқыпсыз сақтау туралы істер жөніндегі сот практикасы туралы

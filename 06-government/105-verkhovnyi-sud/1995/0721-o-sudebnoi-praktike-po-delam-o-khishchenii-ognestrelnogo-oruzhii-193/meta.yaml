  title:
    rus: О внесении изменений в постановление Пленума Верховного Суда Республики Казахстан от 21 июля 1995 года № 4 "О судебной практике по делам о хищении огнестрельного оружия, боевых припасов, вооружения и взрывчатых веществ, незаконном приобретении, ношении, хранении, изготовлении или сбыте их, и небрежном хранении огнестрельного оружия"
    kaz: '"Атылғыш қаруларды, оқ-дәріні, қару-жарақты немесе жарылғыш заттарды ұрлау, оларды заңсыз алып жүру, ұстау, жасау немесе өткізу, атылғыш қаруларды ұқыпсыз ұстау туралы істер жөніндегі сот тәжірибесі туралы" Қазақстан Республикасы Жоғарғы Соты Пленумының 1995 жылғы 21 шілдедегі N 4 қаулысына өзгерістер енгізу туралы'

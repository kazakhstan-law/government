  title:
    rus: О внесении изменений и дополнений в нормативное постановление Верховного Суда Республики Казахстан от 18 июня 2004 года № 5 «О судебной практике ликвидации юридических лиц, осуществляющих свою деятельность с грубым нарушением законодательства»
    kaz: «Өздерінің қызметін заңнаманы өрескел бұза отырып жүзеге асыратын заңды тұлғаларды таратудағы сот тәжірибесі туралы» Қазақстан Республикасы Жоғарғы Сотының 2004 жылғы 18 маусымдағы № 5 нормативтік қаулысына өзгерістер мен толықтырулар енгізу туралы

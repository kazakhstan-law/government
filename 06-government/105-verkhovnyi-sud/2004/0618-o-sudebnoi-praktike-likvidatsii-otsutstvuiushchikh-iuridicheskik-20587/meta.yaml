title:
  rus: О судебной практике ликвидации отсутствующих юридических лиц и отсутствующего должника, а также юридических лиц, осуществляющих свою деятельность с грубым нарушением законодательства
  kaz: Жоқ заңды тұлғалар мен жоқ борышкерді, сонымен қатар өздерінің қызметін заңнаманы өрескел бұза отырып жүзеге асыратын заңды тұлғаларды таратудың сот практикасы туралы

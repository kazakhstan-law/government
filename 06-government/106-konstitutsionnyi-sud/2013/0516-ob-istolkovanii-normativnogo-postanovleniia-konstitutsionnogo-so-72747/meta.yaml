act_code: '72747'
requisite: Дополнительное постановление Конституционного совета Республики Казахстан от 16 мая 2013 года № 2.
title:
  rus: Об истолковании Нормативного постановления Конституционного совета Республики Казахстан от 15 октября 2008 года № 8 "Об официальном толковании статьи 54, подпунктов 1) и 3) пункта 3 статьи 61, а также ряда других норм Конституции Республики Казахстан по вопросам организации государственного управления"
  kaz: '"Қазақстан Республикасы Конституциясының 54-бабын, 61-бабы 3-тармағының 1) және 3) тармақшаларын, сондай-ақ мемлекеттік басқаруды ұйымдастыру мәселелері бойынша басқа да бірқатар нормаларын ресми түсіндіру туралы" Қазақстан Республикасы Конституциялық Кеңесінің 2008 жылғы 15 қазандағы № 8 Нормативтік қаулысына түсіндірме беру туралы'

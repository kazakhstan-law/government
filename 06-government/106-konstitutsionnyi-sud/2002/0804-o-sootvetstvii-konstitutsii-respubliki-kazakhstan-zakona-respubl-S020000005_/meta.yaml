title:
  rus: О соответствии Конституции Республики Казахстан Закона Республики Казахстан "О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам прокурорского надзора"
  kaz: '"Қазақстан Республикасының кейбiр заң актiлерiне прокурорлық қадағалау мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы" Қазақстан Республикасы Заңының Қазақстан Республикасының Конституциясына сәйкестігi туралы'

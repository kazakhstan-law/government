  title:
    rus: О ходатайствах Верховного Суда Республики Казахстан и Генерального прокурора Республики Казахстан в отношении постановления Конституционного Совета Республики Казахстан "Об официальном толковании пункта 2 статьи 13 и пункта 1 статьи 75 Конституции Республики Казахстан" от 15 февраля 2002 года
    kaz: Қазақстан Республикасы Жоғарғы Сотының және Қазақстан Республикасы Бас прокурорының, "Қазақстан Республикасы Конституциясының 13-бабы 2-тармағын және 75-бабы 1-тармағын ресми түсiндiру туралы" Қазақстан Республикасы Конституциялық Кеңесiнiң 2002 жылғы 15 ақпандағы қаулысына қатысты өтiніштерi туралы

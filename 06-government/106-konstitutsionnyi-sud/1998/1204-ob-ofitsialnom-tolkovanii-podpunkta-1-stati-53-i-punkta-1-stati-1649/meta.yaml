  kaz: Қазақстан Республикасы Парламенті өзгерістер мен толықтырулар енгізген Конституция нормалары бөлігіне қатысты Қазақстан Республикасы Конституциясы 53-бабының 1) тармақшасына және 91 бабының 1-тармағына ресми түсінік беру туралы

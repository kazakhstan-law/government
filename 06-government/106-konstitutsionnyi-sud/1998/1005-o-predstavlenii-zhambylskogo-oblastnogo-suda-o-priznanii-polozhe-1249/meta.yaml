act_code: '1249'
requisite: Постановление Конституционного Совета Республики Казахстан от 06 октября 1998 года № 7
title:
  rus: О представлении Жамбылского областного суда о признании Положения о порядке возмещения ущерба, причиненного гражданину незаконными действиями органов дознания, предварительного следствия, прокуратуры и суда не соответствующим Конституции Республики Казахстан и недействующим на территории Казахстана
  kaz: Жамбыл облыстық сотының анықтау, алдын ала тергеу, прокуратура және сот органдарының заңсыз әрекеттерiнен азаматтың шеккен залалын өтеу тәртiбi туралы Ереженi Қазақстан Республикасы Конституциясына сәйкес емес және Қазақстан аумағында қолданылмайды деп тану туралы ұсынымы жөнiнде

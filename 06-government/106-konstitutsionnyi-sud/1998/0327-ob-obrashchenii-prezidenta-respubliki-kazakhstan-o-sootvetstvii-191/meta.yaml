title:
  rus: Об обращении Президента Республики Казахстан "О соответствии Конституции Республики представленного на подпись Гражданского кодекса Республики Казахстан (особенная часть), принятого Парламентом Республики Казахстан 4 февраля 1998 года"
  kaz: '"Қазақстан Республикасы Президентiнiң Қазақстан Республикасы Парламентi 1998 жылғы 4 ақпанда қабылдаған, Қазақстан Республикасы Президентiне қол қоюға берiлген Қазақстан Республикасының Азаматтық кодексiнiң (ерекше бөлiм) Республика Конституциясына сәйкестiгi туралы" өтiнiшi туралы'

requisite: Постановление Конституционного Совета Республики Казахстан от 5 июня 1998 г. N 3/2. Отменено нормативным постановлением Конституционного Совета Республики Казахстан от 17 апреля 2017 года № 2
title:
  rus: Об обращении Жамбылского областного суда "О признании части 2 статьи 280 и части 1 статьи 288 Кодекса Казахской ССР об административных правонарушениях не соответствующими Конституции Республики Казахстан"
  kaz: Жамбыл облыстық сотының "Қазақ КСР-нiң Әкiмшiлiк құқық бұзушылық туралы кодексiнiң 280-бабының 2 бөлiгiн және 288-бабының 1 бөлiгiн Қазақстан Республикасының Конституциясына сәйкес емес деп тану туралы" өтiнiшi туралы

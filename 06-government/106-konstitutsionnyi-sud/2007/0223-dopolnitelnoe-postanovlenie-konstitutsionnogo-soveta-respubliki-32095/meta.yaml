act_code: '32095'
requisite: Дополнительное постановление Конституционного Совета Республики Казахстан от 23 февраля 2007 года № 3
title:
  rus: Дополнительное постановление Конституционного Совета Республики Казахстан об истолковании постановления Конституционного Совета Республики Казахстан от 8 мая 1997 года № 10/2 "Об обращении Президента Республики Казахстан о соответствии Конституции Республики Казахстан представленного на подпись Президенту Республики Казахстан Закона Республики Казахстан "О языках в Республике Казахстан", принятого Парламентом Республики Казахстан 12 марта 1997 года"
  kaz: Қазақстан Республикасы Президентiне қол қоюға ұсынылған, 1997 жылғы 12 наурызда Қазақстан Республикасының Парламентi қабылдаған Қазақстан Республикасының "Қазақстан Республикасындағы тiлдер туралы" Заңының Қазақстан Республикасы Конституциясына сәйкестiгi жөнiнде Қазақстан Республикасы Президентiнiң өтiнуi туралы" Қазақстан Республикасы Конституциялық Кеңесiнiң 1997 жылғы 8 мамырдағы № 10/2 қаулысына түсiндiрме беру туралы Қазақстан Республикасы Конституциялық Кеңесiнiң қосымша қаулысы

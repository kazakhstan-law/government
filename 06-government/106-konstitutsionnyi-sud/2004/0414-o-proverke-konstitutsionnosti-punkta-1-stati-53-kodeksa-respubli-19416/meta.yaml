act_code: '19416'
requisite: Постановление Конституционного Совета Республики Казахстан от 15 апреля 2004 года N 2
title:
  rus: О проверке конституционности пункта 1 статьи 53 Кодекса Республики Казахстан "О налогах и других обязательных платежах в бюджет" (Налогового кодекса) и пункта 13 Правил проведения специализированного аукциона по реализации ограниченного в распоряжении имущества налогоплательщика в счет налоговой задолженности, утвержденных постановлением Правительства Республики Казахстан от 25 мая 2002 года N 569, по обращению cпециализированного межрайонного экономического суда Костанайской области
  kaz: Қостанай облысының мамандандырылған ауданаралық экономикалық сотының өтiнiшi бойынша, "Салық және бюджетке төленетiн басқа да мiндеттi төлемдер туралы" Қазақстан Республикасы Кодексiнiң (Салық кодексiнiң) 53-бабы 1-тармағының және Қазақстан Республикасы Yкiметiнiң 2002 жылғы 25 мамырдағы N 569 қаулысымен бекiтiлген, Салық төлеушiнiң билiк етуi шектелген мүлкiн салық берешегi есебiне сату жөнiнде мамандандырылған аукцион өткiзу ережесiнiң 13-тармағының конституциялылығын тексеру туралы

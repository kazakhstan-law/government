act_code: '19497'
requisite: Постановление Конституционного Совета Республики Казахстан от 20 апреля 2004 года № 3
title:
  rus: О соответствии Конституции Республики Казахстан подпункта 5) пункта 1 статьи 23 Республики Казахстан "О пенсионном обеспечении в Республике Казахстан" и подпункта 1) пункта 4 "Правил осуществления пенсионных выплат из пенсионных накоплений, сформированных за счет обязательных пенсионных взносов, добровольных профессиональных пенсионных взносов из накопительных пенсионных фондов", утвержденных постановлением Правительства Республики Казахстан от 4 июля 2003 года, N 661
  kaz: '"Қазақстан Республикасында зейнетақымен қамсыздандыру туралы" Қазақстан Республикасы Заңының 23-бабы 1-тармағы 5) тармақшасының және Қазақстан Республикасы Үкіметінің 2003 жылғы 4 шілдедегі N 661 қаулысымен бекітілген, "Жинақтаушы зейнетақы қорларынан міндетті зейнетақы жарналарының, ерікті кәсіптік зейнетақы жарналарының есебінен қалыптасқан зейнетақы жинақтарынан төленетін зейнетақы төлемдерін жүзеге асыру ережесінің" 4-тармағы 1) тармақшасының Қазақстан Республикасының Конституциясына сәйкестігі туралы'

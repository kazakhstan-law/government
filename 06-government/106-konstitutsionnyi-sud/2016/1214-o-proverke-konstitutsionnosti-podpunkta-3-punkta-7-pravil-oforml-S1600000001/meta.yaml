title:
  rus: О проверке конституционности подпункта 3) пункта 7 Правил оформления документов на выезд за пределы Республики Казахстан на постоянное место жительства, утвержденных Постановлением Правительства Республики Казахстан от 28 марта 2012 года № 361, по представлению Темиртауского городского суда Карагандинской области
  kaz: Қарағанды облысы Теміртау қалалық сотының ұсынысы бойынша, Қазақстан Республикасы Үкіметінің 2012 жылғы 28 наурыздағы № 361 қаулысымен бекітілген Қазақстан Республикасының шегінен тыс тұрақты тұрғылықты жерге кетуге арналған құжаттарды ресімдеу қағидаларының 7-тармағы 3) тармақшасының конституциялығын тексеру туралы

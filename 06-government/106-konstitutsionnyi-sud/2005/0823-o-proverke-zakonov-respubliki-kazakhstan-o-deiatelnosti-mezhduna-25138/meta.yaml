act_code: '25138'
requisite: Постановление Конституционного Совета Республики Казахстан от 23 августа 2005 года N 6
title:
  rus: О проверке законов Республики Казахстан "О деятельности международных и иностранных некоммерческих организаций в Республике Казахстан" и "О внесении изменений и дополнений в некоторые законодательные акты Республики Казахстан по вопросам некоммерческих организаций" на соответствие Конституции Республики Казахстан
  kaz: '"Қазақстан Республикасындағы халықаралық және шетелдiк коммерциялық емес ұйымдардың қызметi туралы" және "Қазақстан Республикасының кейбiр заңнамалық актiлерiне коммерциялық емес ұйымдар мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы" Қазақстан Республикасы заңдарын Қазақстан Республикасының Конституциясына сәйкестiгi тұрғысында тексеру туралы'

act_code: '16098'
requisite: Постановление Конституционного Совета Республики Казахстан от 26 июня 2003 года N 9
title:
  rus: О представлении Верховного Суда Республики Казахстан о признании неконституционными статьи 13, пункта "в" части 3 статьи 175, пункта "в" части 3 статьи 178, пункта "г" части 3 статьи 179 Уголовного кодекса Республики Казахстан и части 3 статьи 19 Уголовно-процессуального кодекса Республики Казахстан
  kaz: Қазақстан Республикасы Жоғарғы Сотының, Қазақстан Республикасы Қылмыстық кодексiнiң 13-бабын, 175-бабы 3-бөлiгiнiң "в" тармағын, 178-бабы 3-бөлiгiнiң "в" тармағын, 179-бабы 3-бөлiгiнiң "г" тармағын және Қазақстан Республикасы Қылмыстық iс жүргiзу кодексiнiң 19-бабы 3-бөлiгiн конституциялық емес деп тану жөнiндегi ұсынысы туралы

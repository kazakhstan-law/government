act_code: '9521'
requisite: Постановление Конституционного Совета Республики Казахстан от 9 июля 2001 года № 11/2
title:
  rus: О представлении Сарыаркинского районного суда города Астаны о признании неконституционными положений нормативных правовых актов о введении повременного учета стоимости услуг местных сетей телекоммуникаций
  kaz: Астана қаласы Сарыарқа аудандық сотының жергілiктi телекоммуникациялар желiлерiнiң қызмет көрсету құнын уақыт бойынша есептеудi енгiзу туралы нормативтiк құқықтық актiлердiң ережелерiн конституциялық емес деп тану жөнiндегi ұсынымы туралы

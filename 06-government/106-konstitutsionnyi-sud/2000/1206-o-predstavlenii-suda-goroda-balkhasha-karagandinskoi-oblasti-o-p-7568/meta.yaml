title:
  rus: О представлении суда города Балхаша Карагандинской области о признании неконституционными статьи 52 Кодекса Казахской ССР об административных правонарушениях и пункта 5 примечаний к статье 175 Уголовного кодекса Республики Казахстан
  kaz: Қарағанды облысы Балқаш қаласы сотының Қазақ КСР-інің Әкімшілік құқық бұзушылық туралы кодексінің 52-бабын және Қазақстан Республикасы Қылмыстық кодексінің 175-бабына ескертулердің 5-тармағын конституциялық емес деп тану жөніндегі ұсынымы туралы

act_code: '1751'
requisite: Постановление Конституционного Совета Республики Казахстан от 8 мая 1997 года № 10/2 ("Вестник Конституционного Совета Республики Казахстан", 1998г., выпуск № 1, стр. 190) Р
title:
  rus: Об обращении Президента Республики Казахстан о соответствии Конституции Республики Казахстан представленнного на подпись Президенту Республики Казахстан Закона Республики Казахстан "О языках в Республике Казахстан", принятого Парламентом Республики Казахстан 12 марта 1997 года
  kaz: Қазақстан Республикасы Конституциялық Кеңесінің Қазақстан Республикасы Президентіне қол қоюға ұсынылған, 1997 жылғы 12 наурызда Қазақстан Республикасының Парламенті қабылдаған Қазақстан Республикасының "Қазақстан Республикасындағы тілдер туралы" Заңының Қазақстан Республикасы Конституциясына сәйкестігі жөнінде Қазақстан Республикасы Президентінің өтінуі туралы

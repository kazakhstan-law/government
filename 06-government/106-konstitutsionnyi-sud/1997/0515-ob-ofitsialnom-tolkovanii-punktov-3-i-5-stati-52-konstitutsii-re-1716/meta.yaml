  title:
    rus: О пересмотре некоторых нормативных постановлений Конституционного Совета Республики Казахстан в связи с принятием Закона Республики Казахстан от 21 мая 2007 года N 254-III "О внесении изменений и дополнений в Конституцию Республики Казахстан"
    kaz: '"Қазақстан Республикасының Конституциясына өзгерістер мен толықтырулар енгізу туралы" 2007 жылғы 21 мамырдағы N 254-ІII Қазақстан Республикасы Заңының қабылдануына байланысты Қазақстан Республикасы Конституциялық Кеңесінің кейбір нормативтік қаулыларын қайта қарау туралы'

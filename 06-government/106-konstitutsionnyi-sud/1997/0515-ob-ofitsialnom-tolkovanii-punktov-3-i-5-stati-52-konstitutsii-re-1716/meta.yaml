title:
  rus: Об официальном толковании пунктов 3 и 5 статьи 52 Конституции Республики Казахстан в части досрочного прекращения полномочий депутатов Сената Парламента
  kaz: Қазақстан Республикасы Конституциялық Кеңесінің "Парламент Сенаты депутаттарының өкілеттігін мерзімінен бұрын тоқтату бөлігіндегі Қазақстан Республикасы Конституциясының 52-бабының 3 және 5-тармақтарын ресми түсіндіру туралы"

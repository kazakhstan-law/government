act_code: '1750'
requisite: Постановление Конституционного Совета Республики Казахстан от 24 апреля 1997 года N 9/2
title:
  rus: Об обращении Акмолинского областного суда о признании неконституционной части 3 статьи 3 "Положения об адвокатуре Казахской ССР", утвержденного Законом Казахской ССР от 13 ноября 1980 года
  kaz: Қазақстан Республикасы Конституциялық Кеңесінің "Ақмола облыстық сотының 1980 жылғы 13 қарашадағы Қазақ КСР Заңы бекіткен, "Қазақ КСР адвокатурасы туралы. Ереженің 3-бабының 3-бөлігін конституциялық емес деп тану жөніндегі өтініші туралы"

act_code: '1752'
requisite: Постановление Конституционного Совета Республики Казахстан от 29 мая 1997г. № 13/2 ("Вестник Конституционного Совета Республики Казахстан", 1998г., выпуск № 1, стр. 199). Отменено нормативным постановлением Конституционного Совета Республики Казахстан от 16 ноября 2022 года № 1
title:
  rus: Об официальном толковании пункта 3 статьи 45 и подпункта 2 статьи 44 Конституции Республики Казахстан в части круга должностных лиц, обязанных скреплять своими подписями акты Парламента перед их подписанием Президентом Республики
  kaz: Қазақстан Республикасы Конституциялық Кеңесінің Республика Президентінің Парламент актілеріне қол қояр алдында оларға өз қолдарын қоюға міндетті лауазымды адамдар тобы бөлігіндегі Қазақстан Республикасы Конституциясының 45-бабының 3-тармағын және 44-бабының 2 тармақшасын ресми түсіндіру туралы"

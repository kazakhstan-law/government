act_code: '37455'
requisite: Нормативное постановление Конституционного Совета Республики Казахстан от 7 февраля 2008 года N 1
title:
  rus: О пересмотре постановления Конституционного Совета Республики Казахстан от 15 февраля 2002 года N 1 "Об официальном толковании пункта 2 статьи 13 и пункта 1 статьи 75 Конституции Республики Казахстан" и дополнительного постановления Конституционного Совета Республики Казахстан от 12 апреля 2002 года N 1/2 "О ходатайствах Верховного Суда Республики Казахстан и Генерального Прокурора Республики Казахстан в отношении постановления Конституционного Совета Республики Казахстан "Об официальном толковании пункта 2 статьи 13 и пункта 1 статьи 75 Конституции Республики Казахстан" от 15 февраля 2002 года"
  kaz: '"Қазақстан Республикасы Конституциясының 13-бабы 2-тармағын және 75-бабы 1-тармағын ресми түсіндіру туралы" Қазақстан Республикасы Конституциялық Кеңесінің 2002 жылғы 15 ақпандағы N 1 қаулысын және "Қазақстан Республикасы Жоғарғы Сотының және Қазақстан Республикасы Бас Прокурорының "Қазақстан Республикасы Конституциясының 13-бабы 2-тармағын және 75-бабы 1-тармағын ресми түсіндіру туралы" Қазақстан Республикасы Конституциялық Кеңесінің 2002 жылғы 15 ақпандағы қаулысына қатысты өтініштері туралы" Қазақстан Республикасы Конституциялық Кеңесінің 2002 жылғы 12 сәуірдегі N 1/2 қосымша қаулысын қайта қарау туралы'

act_code: '2333'
requisite: Постановление Конституционного Совета Республики Казахстан от 18 марта 1999 года № 5/2
title:
  rus: Об официальном толковании пункта 4 статьи 51 Конституции Республики Казахстан в части нормы "постоянно проживающий на территории соответствующей области, города республиканского значения либо столицы Республики не менее трех лет"
  kaz: Қазақстан Республикасы Конституциясының 51-бабы 4-тармағының "тиісті облыстың, республикалық маңызы бар қаланың не республика астанасының аумағында кемінде үш жыл тұрақты тұрған" нормасы бөлігіне ресми түсіндірме беру туралы

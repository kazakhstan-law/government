act_code: '3674'
requisite: Постановление Конституционного Совета Республики Казахстан от 3 августа 1999 года № 17/2
title:
  rus: О соответствии Конституции Республики Казахстан Закона Республики Казахстан "Об обязательном страховании ответственности работодателя за причинение вреда жизни и здоровью работника, пострадавшего в результате несчастного случая или профессионального заболевания при исполнении трудовых (служебных) обязанностей"
  kaz: '"Еңбек (қызмет) міндеттерін атқару кезінде жазатайым оқиғаның немесе кәсіби аурудың нәтижесінде зардап шеккен қызметкердің өмірі мен денсаулығына зиян келтіргені үшін жұмыс берушінің жауапкершілігін міндетті сақтандыру туралы" Қазақстан Республикасы Заңының Қазақстан Республикасының Конституциясына сәйкестігі туралы'

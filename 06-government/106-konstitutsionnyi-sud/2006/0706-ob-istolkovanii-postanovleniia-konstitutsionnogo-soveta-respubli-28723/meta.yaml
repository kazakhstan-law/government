title:
  rus: Об истолковании постановления Конституционного Совета Республики Казахстан от 31 января 2005 года № 1 "О проверке конституционности пункта 3 статьи 15 Закона Республики Казахстан "О нотариате" по обращению суда города Астаны"
  kaz: '"Астана қаласы сотының ұсынысы бойынша "Нотариат туралы" Қазақстан Республикасы Заңының 15-бабы 3-тармағының конституциялылығын тексеру туралы" Қазақстан Республикасы Конституциялық Қеңесінiң 2005 жылғы 31 қаңтардағы № 1 қаулысына түсiндiрме беру туралы'

act_code: '182059'
requisite: Дополнительное постановление Конституционного Суда Республики Казахстан от 22 мая 2023 года № 17-НП
title:
  rus: Об истолковании пунктов 2 и 4 постановляющей части нормативного постановления Конституционного Совета Республики Казахстан от 5 ноября 2009 года № 6 «Об официальном толковании норм статьи 4 Конституции Республики Казахстан применительно к порядку исполнения решений международных организаций и их органов»
  kaz: Қазақстан Республикасы Конституциялық Кеңесінің «Қазақстан Республикасы Конституциясының 4-бабының нормаларын халықаралық ұйымдар мен олардың органдарының шешімдерін орындау тәртібіне қатысты қолданыста ресми түсіндіру туралы» 2009 жылғы 5 қарашадағы № 6 нормативтік қаулысының қарар бөлігіндегі 2 және 4-тармақтарына түсіндірме беру туралы

  title:
    rus: Об отмене карантинного режима на территории Павлодарской области в объемах площадей распространения горчака ползучего и внесении изменений в постановление акимата Павлодарской области от 18 сентября 2020 года № 190/4 «Об установлении карантинной зоны по горчаку ползучему и повилики с введением карантинного режима на территории Павлодарской области»

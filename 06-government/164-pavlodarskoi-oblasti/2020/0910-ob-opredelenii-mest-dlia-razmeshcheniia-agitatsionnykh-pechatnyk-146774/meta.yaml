  title:
    rus: О внесении изменений в постановление акимата Павлодарского района от 10 сентября 2020 года № 293/9 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями на территории Павлодарского района»
    kaz: Павлодар ауданы әкімдігінің 2020 жылғы 10 қыркүйектегі «Павлодар ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесу үшін үй-жайларды беру туралы» № 293/9 қаулысына өзгерістер енгізу туралы

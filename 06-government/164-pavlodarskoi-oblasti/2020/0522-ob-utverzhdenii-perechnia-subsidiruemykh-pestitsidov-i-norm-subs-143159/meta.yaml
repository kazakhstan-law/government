  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 22 мая 2020 года № 108/2 «Об утверждении перечня субсидируемых пестицидов и норм субсидий, а также объемов бюджетных средств на субсидирование пестицидов на 2020 год»
    kaz: Павлодар облысы әкімдігінің 2020 жылғы 22 мамырдағы «2020 жылға арналған субсидияланатын пестицидтердің тізбесін және субсидиялар нормаларын, сондай-ақ пестицидтерді субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» № 108/2 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Успенского района Павлодарской области от 14 января 2020 года № 8/1 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями на территории Успенского района»
    kaz: Павлодар облысы Успен аудандық әкімдігінің 2020 жылғы 14 қаңтардағы № 8/1 «Успен ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесу үшін үй-жайларды беру туралы» қаулысына өзгерістер енгізу туралы

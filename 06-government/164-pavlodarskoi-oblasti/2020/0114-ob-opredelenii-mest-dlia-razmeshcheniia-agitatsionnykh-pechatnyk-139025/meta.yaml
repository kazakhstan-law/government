  title:
    rus: О внесении изменения в постановление акимата Успенского района от 14 января 2020 года № 8/1 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями на территории Успенского района»
    kaz: Успен ауданы әкімдігінің 2020 жылғы 14 қаңтардағы «Успен ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесу үшін үй-жайларды беру туралы» № 8/1 қаулысына өзгеріс енгізу туралы

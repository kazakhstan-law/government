  title:
    rus: О внесении изменений в постановление акимата Щербактинского района от 10 декабря 2020 года № 311/3 «Об утверждении мест размещения нестационарных торговых объектов на территории села Шарбакты Щербактинского района»
    kaz: «Шарбақты ауданы Шарбақты ауылының аумағында стационарлық емес сауда объектілерін орналастыру орындарын бекіту туралы» Шарбақты ауданы әкімдігінің 2020 жылғы 10 желтоқсандағы № 311/3 қаулысына өзгерістер енгізу туралы

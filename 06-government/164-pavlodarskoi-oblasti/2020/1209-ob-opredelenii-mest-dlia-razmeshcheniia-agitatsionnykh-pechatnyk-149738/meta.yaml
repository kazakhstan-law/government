  title:
    rus: О внесении изменений в постановление акимата Майского района от 9 декабря 2020 года № 311/12 "Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями на территории Майского района"
    kaz: Май ауданы әкімдігінің 2020 жылғы 9 желтоқсандағы "Май ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесу үшін үй-жайларды беру туралы" № 311/12 қаулысына өзгеріс енгізу туралы

    kaz: Май ауданы әкімдігінің 2020 жылғы 9 желтоқсандағы «Май ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесу үшін үй-жайларды беру туралы» № 311/12 қаулысына өзгерістер енгізу туралы

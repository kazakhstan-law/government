title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, по Павлодарской области на 2025 год
  kaz: 2025 жылға арналған Павлодар облысы бойынша тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерiнің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограммына) арналған субсидиялар нормаларын бекіту туралы

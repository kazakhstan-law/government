  requisite: Постановление акимата Павлодарской области от 9 октября 2025 года № 267/1
  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 4 августа 2025 года № 213/1 «Об утверждении перечня приоритетных культур и норм субсидий, а также объемы бюджетных средств на повышение урожайности и качества продукции растениеводства по Павлодарской области на 2025 год»
    kaz: «2025 жылға арналған Павлодар облысы бойынша басым дақылдардың тізбесін және субсидиялар нормаларын,сондай-ақ өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджеттік қаражат көлемдерін бекіту туралы» Павлодар облысы әкімдігінің 2025 жылғы 4 тамыздағы № 213/1 қаулысына өзгеріс енгізу туралы

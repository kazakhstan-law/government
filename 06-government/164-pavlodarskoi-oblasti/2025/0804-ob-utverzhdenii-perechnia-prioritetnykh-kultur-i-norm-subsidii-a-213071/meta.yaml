title:
  rus: Об утверждении перечня приоритетных культур и норм субсидий, а также объемы бюджетных средств на повышение урожайности и качества продукции растениеводства по Павлодарской области на 2025 год
  kaz: 2025 жылға Павлодар облысы бойынша басым дақылдардың тізбесін және субсидиялар нормаларын, сондай-ақ өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджеттік қаражат көлемдерін бекіту туралы

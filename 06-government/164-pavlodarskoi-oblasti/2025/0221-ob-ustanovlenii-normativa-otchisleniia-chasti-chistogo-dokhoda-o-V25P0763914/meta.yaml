requisite: Постановление акимата Павлодарской области от 21 февраля 2025 года № 58/1. Зарегистрировано в Департаменте юстиции Павлодарской области 24 февраля 2025 года № 7639-14. Утратило силу постановлением акимата Павлодарской области от 16 февраля 2026 года № 41/1 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об установлении норматива отчисления части чистого дохода областных коммунальных государственных предприятий, за исключением организаций среднего, технического и профессионального, послесреднего образования в организационно-правовой форме государственных предприятий на праве хозяйственного ведения и дошкольных организаций в организационно-правовой форме казенных предприятий, дополнительного образования для детей
  kaz: Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық-құқықтық нысанындағы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарын және қазыналық кәсіпорындардың ұйымдық-құқықтық нысанындағы мектепке дейінгі ұйымдарды, балаларға арналған қосымша білім беруді қоспағанда, облыстық коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы

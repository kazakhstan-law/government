  title:
    rus: О признании утратившим силу постановления акимата Павлодарской области от 21 февраля 2025 года № 58/1 «Об установлении норматива отчисления части чистого дохода областных коммунальных государственных предприятий, за исключением организаций среднего, технического и профессионального, послесреднего образования в организационно-правовой форме государственных предприятий на праве хозяйственного ведения и дошкольных организаций в организационно-правовой форме казенных предприятий, дополнительного образования для детей»
    kaz: «Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық-құқықтық нысанындағы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарын және қазыналық кәсіпорындардың ұйымдық-құқықтық нысанындағы мектепке дейінгі ұйымдарды, балаларға арналған қосымша білім беруді қоспағанда, облыстық коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» Павлодар облысы әкімдігінің 2025 жылғы 21 ақпандағы № 58/1 қаулысының күші жойылды деп тану туралы

title:
  rus: О размещении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием в организациях образования, реализующих образовательные программы технического и профессионального, послесреднего образования на 2025-2026 учебный год
  kaz: 2025-2026 оқу жылына арналған техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарында техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру туралы

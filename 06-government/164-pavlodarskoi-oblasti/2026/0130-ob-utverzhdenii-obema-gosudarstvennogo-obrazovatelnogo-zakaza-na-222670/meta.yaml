  requisite: Постановление акимата Павлодарской области от 12 мая 2026 года № 131/1
  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 30 января 2026 года № 19/1 «Об утверждении объема государственного образовательного заказа на среднее образование в частных организациях Павлодарской области на 2025-2026 учебный год»
    kaz: Павлодар облысы әкімдігінің 2026 жылғы 30 қаңтардағы «Павлодар облысының жеке меншік білім беру ұйымдарында 2025-2026 оқу жылына арналған орта білім беруге мемлекеттік білім беру тапсырысының көлемін бекіту туралы» № 19/1 қаулысына өзгеріс енгізу туралы

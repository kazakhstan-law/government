    rus: О внесении дополнений в постановление акимата Павлодарской области от 28 мая 2026 года № 147/1 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, по Павлодарской области на 2026 год»
    kaz: Павлодар облысы әкімдігінің 2026 жылғы 28 мамырдағы «Павлодар облысы бойынша 2026 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограммына) арналған субсидиялар нормаларын бекіту туралы» № 147/1  қаулысына толықтырулар енгізу туралы

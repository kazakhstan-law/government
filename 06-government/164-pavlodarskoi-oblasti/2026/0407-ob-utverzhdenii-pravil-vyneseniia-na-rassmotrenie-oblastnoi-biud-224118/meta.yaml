act_code: '224118'
requisite: Постановление акимата Павлодарской области от 7 апреля 2026 года № 88/1
title:
  rus: Об утверждении Правил вынесения на рассмотрение областной бюджетной комиссии вопросов уменьшения размера выплат или освобождения от уплаты поступлений в областной бюджет дивидендов или части чистого дохода по перечню государственных предприятий, акционерных обществ, товариществ с ограниченной ответственностью, государственные пакеты акций (доли участия в уставном капитале) которых находятся в областной коммунальной собственности
  kaz: Акцияларының (жарғылық капиталға қатысу үлестерінің) мемлекеттік пакеттері облыстық коммуналдық меншіктегі мемлекеттік кәсіпорындардың, акционерлік қоғамдардың, жауапкершілігі шектеулі серіктестіктердің тізбесі бойынша облыстық бюджетке дивидендтердің немесе таза кіріс бөлігінің түсімдері төлемдерінің мөлшерін азайту немесе оларды төлеуден босату мәселелерін облыстық бюджет комиссиясының қарауына шығару қағидаларын бекіту туралы

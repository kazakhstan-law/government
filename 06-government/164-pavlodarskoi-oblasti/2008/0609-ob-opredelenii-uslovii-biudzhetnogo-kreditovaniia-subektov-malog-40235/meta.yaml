  title:
    rus: О внесении дополнений и изменений в постановление акимата Павлодарской области от 9 июня 2008 года № 140/6 "Об определении условий бюджетного кредитования субъектов малого предпринимательства за счет средств областного бюджета"
    kaz: Павлодар облысы әкімдігінің 2008 жылғы 9 маусымдағы "Шағын және орта кәсіпкерлік субъектілерін облыстық бюджет қаражаты есебінен бюджеттік кредиттеу шарттарын анықтау туралы" № 140/6 қаулысына толықтырулар мен өзгерістер енгізу туралы

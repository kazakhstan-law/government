  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 25 августа 2021 года № 219/8 «Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием на 2021 - 2022 учебный год»
    kaz: Павлодар облысы әкімдігінің 2021 жылғы 25 тамыздағы «2021 - 2022 оқу жылына арналған техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын бекіту туралы» № 219/8 қаулысына өзгеріс енгізу туралы

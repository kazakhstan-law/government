  title:
    rus: О внесении изменений в постановление акимата Павлодарской области от 29 апреля 2021 года № 116/3 «Об утверждении перечня субсидируемых видов удобрений и норм субсидий, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2021 год»
    kaz: Павлодар облысы әкімдігінің 2021 жылғы 29 сәуірдегі № 116/3 «2021 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 15 апреля 2021 года № 102/3 «Об утверждении объемов бюджетных средств на субсидирование развития семеноводства по каждой категории субсидируемых семян на 2021 год»
    kaz: Павлодар облысы әкімдігінің 2021 жылғы 6 тамыздағы "Павлодар облысы әкімдігінің 2021 жылғы 15 сәуірдегі "2021 жылға арналған субсидияланатын тұқымдардың әрбір санаты бойынша тұқым шаруашылығын дамытуды субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы"  № 102/3 қаулысына өзгеріс енгізу туралы" № 202/7 қаулысы

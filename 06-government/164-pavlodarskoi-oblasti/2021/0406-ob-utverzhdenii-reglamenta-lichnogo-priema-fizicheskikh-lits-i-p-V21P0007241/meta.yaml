  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 6 апреля 2021 года № 94/3 «Об утверждении регламента личного приема физических лиц и представителей юридических лиц должностными лицами аппарата акима Павлодарской области»
    kaz: Павлодар облысы әкімдігінің 2021 жылғы 6 сәуірдегі «Павлодар облысы әкімі аппаратының лауазымды адамдарының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдауының регламентін бекіту туралы» № 94/3 қаулысына өзгеріс енгізу туралы

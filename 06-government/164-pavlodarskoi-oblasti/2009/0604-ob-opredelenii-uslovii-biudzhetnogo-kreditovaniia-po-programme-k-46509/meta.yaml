title:
  rus: Об определении условий бюджетного кредитования по программе "Кредитование дочерних организаций АО "НУХ Каз Агро" для финансирования малого и среднего бизнеса и микрокредитования сельского населения"
  kaz: '"Шағын және орта бизнесті қаржыландыру және ауыл тұрғындарына шағын кредит беру үшін "Қаз Агро" АҚ еншілес ұйымдарын кредиттеу" бағдарламасы бойынша бюджеттік кредиттеу шарттарын белгілеу туралы'

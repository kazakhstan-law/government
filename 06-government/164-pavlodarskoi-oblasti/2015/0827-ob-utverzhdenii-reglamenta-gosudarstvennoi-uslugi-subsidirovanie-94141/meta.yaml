  title:
    rus: О внесении изменений в постановление акимата Павлодарской области от 27 августа 2015 года № 251/8 «Об утверждении регламента государственной услуги «Субсидирование стоимости гербицидов, биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений»
    kaz: Павлодар облысы әкімдігінің 2015 жылғы 27 тамыздағы «Өсімдіктерді қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердің, биоагенттердің (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы № 251/8 қаулысына өзгерістер енгізу туралы

act_code: '86636'
requisite: Постановление акимата города Экибастуза Павлодарской области от 30 января 2015 года № 96/2. Зарегистрировано Департаментом юстиции Павлодарской области 10 февраля 2015 года № 4300
title:
  rus: Об установлении квоты  рабочих мест для лиц, состоящих  на учете службы пробации  уголовно-исполнительной инспекции, а также для лиц,  освобожденных из мест лишения  свободы, и несовершеннолетних выпускников интернатных  организаций в городе Экибастузе  на 2015 год
  kaz: Екібастұз қаласында қылмыстық-атқару инспекциясы пробация  қызметінің есебінде тұрған тұлғалар,  сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар мен интернат ұйымдарының кәмелетке толмаған түлектері үшін 2015 жылға жұмыс орындарының  квотасын белгілеу туралы

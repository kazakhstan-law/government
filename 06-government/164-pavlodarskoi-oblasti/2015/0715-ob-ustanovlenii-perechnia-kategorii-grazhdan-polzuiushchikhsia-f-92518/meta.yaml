requisite: Постановление акимата Щербактинского района Павлодарской области от 15 июля 2015 года № 204/7. Зарегистрировано Департаментом юстиции Павлодарской области 04 августа 2015 года № 4640
title:
  rus: Об установлении перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а также размеров льгот в Щербактинском районе
  kaz: Шарбақты ауданында мүгедектерді қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы

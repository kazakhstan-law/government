  title:
    rus: О внесении изменения в постановление акимата города Павлодара от 25 июня 2015 года № 738/12 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах города Павлодара»
    kaz: Павлодар қаласы әкімдігінің 2015 жылғы 25 маусымдағы «Павлодар қаласының шалғайдағы елді  мекендерде тұратын балаларды жалпы білім беру беретін  мектептерге тасымалдау схемалары мен тәртібін бекіту туралы» № 738/12 қаулысына өзгеріс енгізу туралы

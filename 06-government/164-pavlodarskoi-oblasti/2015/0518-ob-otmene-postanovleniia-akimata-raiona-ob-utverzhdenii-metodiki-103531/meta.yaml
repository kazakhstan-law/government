title:
  rus: Об отмене постановления акимата района “Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса “Б” исполнительных органов акимата Майского района” № 45/2 от 05 февраля 2015 года
  kaz: Аудан әкімдігінің 2015 жылғы 05 ақпандағы “Май ауданы әкімідігі атқарушы органдары “Б”корпусы мемлекеттік әкімшілік қызметшілерінің  қызметін жыл сайынғы бағалау әдістемесін бекіту туралы” № 45/2 қаулысының күшін жою туралы

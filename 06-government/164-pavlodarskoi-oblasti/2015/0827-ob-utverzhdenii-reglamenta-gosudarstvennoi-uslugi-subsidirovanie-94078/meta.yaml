  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 27 августа 2015 года № 252/8 «Об утверждении регламента государственной услуги «Субсидирование развития семеноводства» и признании утратившими силу некоторых постановлений акимата Павлодарской области
    kaz: Павлодар облысы әкімдігінің 2015 жылғы 27 тамыздағы «Тұқым шаруашылығын дамытуды субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 252/8 қаулысына өзгеріс енгізу және Павлодар облысы әкімдігінің кейбір қаулыларының күші жойылды деп тану туралы

  requisite: Постановление акимата Павлодарской области от 16 ноября 2017 года № 361/6. Зарегистрировано Департаментом юстиции Павлодарской области 07 декабря 2017 года № 5719. Утратило силу постановлением акимата Павлодарской области от 25 января 2021 года № 30/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Павлодарской области от 2 июня 2015 года № 164/6 "Об утверждении регламентов государственных услуг "Выдача разрешения на использование подземных вод питьевого качества для целей, не связанных с питьевым и хозяйственно–бытовым водоснабжением на территориях, где отсутствуют поверхностные водные объекты, но имеются достаточные запасы подземных вод питьевого качества", "Предоставление водных объектов в обособленное или совместное пользование на конкурсной основе"
    kaz: Павлодар облысы әкімдігінің 2015 жылғы 2 маусымдағы «Жерүсті су объектілері жоқ, бірақ ауызсу сапасындағы жерасты суларының жеткілікті қоры бар аумақтарда ауызсу және шаруашылық-тұрмыстық сумен жабдықтауға байланысы жоқ мақсаттар үшін ауызсу сапасындағы жерасты суларын пайдалануға рұқсат беру», «Су объектілерін конкурстық негізде оқшауланған немесе бірлесіп пайдалануға беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» № 164/6 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/116634/rus

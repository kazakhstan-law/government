act_code: '91526'
requisite: Постановление акимата Павлодарской области от 2 июня 2015 года № 164/6. Зарегистрировано Департаментом юстиции Павлодарской области 07 июля 2015 года № 4577. Утратило силу постановлением акимата Павлодарской области от 25 января 2021 года № 30/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов  государственных услуг  «Выдача разрешения на использование подземных вод питьевого качества для целей, не связанных с питьевым и хозяйственно-бытовым водоснабжением на территориях, где отсутствуют поверхностные водные объекты, но имеются достаточные запасы подземных вод питьевого качества», «Предоставление водных объектов в обособленное или совместное пользование на конкурсной основе»
  kaz: «Жерүсті су объектілері жоқ, бірақ ауызсу сапасындағы жерасты суларының жеткілікті қоры бар аумақтарда ауызсу және шаруашылық-тұрмыстық сумен  жабдықтауға байланысы жоқ мақсаттар үшін ауызсу сапасындағы жерасты суларын пайдалануға рұқсат беру», «Су объектілерін конкурстық негізде оқшауланған  немесе бірлесіп пайдалануға беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы

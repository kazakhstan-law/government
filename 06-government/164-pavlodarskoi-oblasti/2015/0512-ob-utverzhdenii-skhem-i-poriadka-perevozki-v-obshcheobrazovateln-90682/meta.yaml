  title:
    rus: О внесении изменения в постановление акимата города Аксу Павлодарской области от 12 мая 2015 года № 361/5 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах города Аксу»
    kaz: Павлодар облысы Ақсу қаласы әкімдігінің 2015 жылғы 12 мамырдағы «Ақсу қаласының шалғай елді-мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен тәртібін бекіту туралы» № 361/5 қаулысына өзгеріс енгізу туралы

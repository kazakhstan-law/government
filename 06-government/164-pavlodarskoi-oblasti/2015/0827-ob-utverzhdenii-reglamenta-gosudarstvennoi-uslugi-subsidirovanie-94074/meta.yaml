  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 27 августа 2015 года № 254/8 «Об утверждении регламента государственной услуги «Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
    kaz: Павлодар облысы әкімдігінің 2015 жылғы 27 тамыздағы «Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 254/8 қаулысына өзгеріс енгізу туралы

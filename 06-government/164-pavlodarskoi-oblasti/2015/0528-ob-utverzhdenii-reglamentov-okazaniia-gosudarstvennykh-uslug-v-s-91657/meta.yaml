    rus: О внесении изменений в некоторые постановления акимата Павлодарской области в сфере недропользования, охраны окружающей среды, водных ресурсов, лесного хозяйства и животного мира
    kaz: Павлодар облысы әкімдігінің жер қойнауын пайдалану, қоршаған ортаны қорғау, су ресурстары, орман шаруашылығы  және жануарлар әлемі саласындағы кейбір қаулыларына өзгерістер енгізу туралы

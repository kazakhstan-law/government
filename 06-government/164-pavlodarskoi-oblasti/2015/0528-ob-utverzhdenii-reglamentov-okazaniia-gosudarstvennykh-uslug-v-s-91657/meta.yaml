requisite: Постановление акимата Павлодарской области от 28 мая 2015 года № 151/5. Зарегистрировано Департаментом юстиции Павлодарской области 09 июля 2015 года № 4585. Утратило силу постановлением акимата Павлодарской области от 25 января 2021 года № 30/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

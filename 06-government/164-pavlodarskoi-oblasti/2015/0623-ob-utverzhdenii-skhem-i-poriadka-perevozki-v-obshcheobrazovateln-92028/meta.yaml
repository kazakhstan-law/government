  title:
    rus: О внесении изменения в постановление акимата Железинского района от 23 июня 2015 года № 225/7 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Железинского района»
    kaz: Железин ауданы әкімдігінің 2015 жылғы 23 маусымдағы «Железин ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беру  мектептеріне тасымалдау схемалары мен тәртібін бекіту туралы» № 225/7 қаулысына өзгеріс енгізу туралы

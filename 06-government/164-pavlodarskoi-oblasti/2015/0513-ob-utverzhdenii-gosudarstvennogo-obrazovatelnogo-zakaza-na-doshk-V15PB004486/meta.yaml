    kaz: Ақсу қаласы әкімдігінің 2015 жылғы 13 мамырдағы “Ақсу қаласында 2015 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы” № 362/5 қаулысына өзгеріс енгізу туралы

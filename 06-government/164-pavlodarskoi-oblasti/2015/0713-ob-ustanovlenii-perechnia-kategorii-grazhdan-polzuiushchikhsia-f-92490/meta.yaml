  kaz: Успен ауданында мүгедектерді қоспағанда,дене шынықтыру – сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы

  requisite: Постановление акимата Павлодарской области от 31 мая 2016 года № 179/5. Зарегистрировано Департаментом юстиции Павлодарской области 17 июня 2016 года № 5142. Утратило силу постановлением акимата Павлодарской области от 4 февраля 2019 года № 24/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Павлодарской области от 9 июня 2015 года № 169/6 "Об утверждении регламента государственной услуги "Выдача заключения о технической целесообразности строительства дублирующих (шунтирующих) линий электропередачи и подстанций для объектов 110 кВ и ниже, 220 кВ и выше"
    kaz: Павлодар облысы әкімдігінің 2015 жылғы 9 маусымдағы "110 кВ және одан төмен, 220 кВ және одан жоғары объектілер үшін қайталама (шунтталатын) электр беру желілері мен шағын станцияларды салудың техникалық орындылығы туралы қорытынды беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" № 169/6 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/103429/rus

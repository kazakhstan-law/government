act_code: '91700'
requisite: Постановление акимата Павлодарской области от 9 июня 2015 года № 169/6. Зарегистрировано Департаментом юстиции Павлодарской области 14 июля 2015 года № 4595. Утратило силу постановлением акимата Павлодарской области от 4 февраля 2019 года № 24/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача заключения о технической целесообразности строительства дублирующих (шунтирующих) линий  электропередачи и подстанций для объектов 110 кВ и ниже, 220 кВ и выше»
  kaz: «110 кВ және одан төмен, 220 кВ және одан жоғары объектілер үшін қайталама (шунтталатын) электр беру желілері мен шағын станцияларды салудың техникалық орындылығы туралы қорытынды беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата города Павлодара от 10 марта 2015 года № 275/5 «Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями»
    kaz: Павлодар қаласы әкімдігінің 2015 жылғы 10 наурыздағы «Үгіттеу жөніндегі материалдарын орналастыру орындарын және сайлаушылармен кездесу өткізу үшін үй-жайларды анықтау туралы» № 275/5 қаулысына өзгерістер енгізу туралы

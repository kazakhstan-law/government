act_code: '92493'
requisite: Постановление акимата города Экибастуза Павлодарской области от 10 июля 2015 года № 789/7. Зарегистрировано Департаментом юстиции Павлодарской области 5 августа 2015 года № 4643
title:
  rus: Об установлении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размеров льгот на территории города Экибастуза
  kaz: Екібастұз қаласының аумағында мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы

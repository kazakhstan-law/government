    kaz: Павлодар ауданы әкімдігінің 2015 жылғы 29 шілдедегі «Павлодар ауданының шалғайдағы елдi мекендерінде тұратын балаларды жалпы бiлiм беретiн мектептерге тасымалдаудың схемалары мен тәртібін бекіту туралы» № 223/7 қаулысына өзгеріс енгізу туралы

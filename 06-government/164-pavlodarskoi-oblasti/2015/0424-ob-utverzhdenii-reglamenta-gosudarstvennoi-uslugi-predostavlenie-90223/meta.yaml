  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 24 апреля 2015 года № 113/4 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные  пункты»
    kaz: Павлодар облысы әкімдігінің 2015 жылғы 24 сәуірдегі «Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 113/4 қаулысына өзгеріс енгізу туралы

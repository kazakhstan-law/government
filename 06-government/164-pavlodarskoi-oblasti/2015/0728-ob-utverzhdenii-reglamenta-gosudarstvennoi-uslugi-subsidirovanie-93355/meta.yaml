act_code: '93355'
requisite: Постановление акимата Павлодарской области от 28 июля 2015 года № 226/8. Зарегистрировано Департаментом юстиции Павлодарской области 2 сентября 2015 года № 4683. Утратило силу постановлением акимата Павлодарской области от 25 декабря 2020 года № 285/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда»
  kaz: Жемiс-жидек дақылдарының және жүзiмнiң көпжылдық көшеттерін отырғызу және өсiру (оның iшiнде қалпына келтiру) шығындарының құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Успенского района от 26 мая 2015 года № 123/5 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Успенского района»
    kaz: Успен ауданы әкімдігінің 2015 жылғы 26 мамырдағы «Успен ауданының шалғайдағы елдi мекендерінде тұратын балаларды жалпы бiлiм беретiн мектептерге тасымалдау схемалары мен тәртібін бекіту туралы» № 123/5 қаулысына өзгерту енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Лебяжинского района от 25 июня 2015 года № 145/6 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Лебяжинского района»
    kaz: Лебяжі ауданы әкімдігінің 2015 жылғы 25 маусымдағы «Лебяжі ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беру мектептеріне  тасымалдау схемалары мен тәртібін бекіту туралы» № 145/6 қаулысына өзгеріс енгізу туралы

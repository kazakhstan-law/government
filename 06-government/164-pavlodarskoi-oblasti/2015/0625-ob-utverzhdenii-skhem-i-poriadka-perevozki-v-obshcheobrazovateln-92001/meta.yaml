requisite: Постановление акимата Лебяжинского района Павлодарской области от 25 июня 2015 года № 145/6. Зарегистрировано Департаментом юстиции Павлодарской области 20 июля 2015 года № 4615. Утратило силу постановлением акимата района Аққулы Павлодарской области от 16 августа 2019 года № 1-03/192 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

    kaz: Шарбақты ауданы әкімдігінің 2015 жылғы 22 шілдедегі «Шарбақты ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беру мектептеріне тасымалдау схемалары мен тәртібін бекіту туралы» № 205/7 қаулысына өзгерту және толықтыру енгізу туралы

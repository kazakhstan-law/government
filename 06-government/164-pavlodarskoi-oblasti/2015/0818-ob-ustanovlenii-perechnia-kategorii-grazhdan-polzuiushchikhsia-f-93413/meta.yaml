  title:
    rus: О внесении изменений в постановление акимата города Павлодара от 18 августа 2015 года № 1007/15 «Об установлении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением инвалидов, а также размеров льгот в городе Павлодаре»
    kaz: Павлодар қаласы әкімдігінің 2015 жылғы 18 тамыздағы «Павлодар қаласында мүгедектерді қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдік шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы» № 1007/15 қаулысына өзгерістер енгізу туралы

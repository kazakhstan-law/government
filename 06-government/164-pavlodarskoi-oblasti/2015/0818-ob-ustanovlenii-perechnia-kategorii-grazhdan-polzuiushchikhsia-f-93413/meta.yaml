requisite: Постановление акимата города Павлодара Павлодарской области от 18 августа 2015 года № 1007/15. Зарегистрировано Департаментом юстиции Павлодарской области 7 сентября 2015 года № 4689
title:
  rus: Об установлении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размеров льгот в городе Павлодаре
  kaz: Павлодар қаласында мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдік шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін белгілеу туралы

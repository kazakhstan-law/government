act_code: '89846'
requisite: Постановление акимата Павлодарского района Павлодарской области от 29 апреля 2015 года № 142/4. Зарегистрировано Департаментом юстиции Павлодарской области 20 мая 2015 года № 4474. Утратило силу постановлением акимата Павлодарского района Павлодарской области от 13 мая 2016 года № 148/5 (вводится в действие со дня его подписания)
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной системы, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций Павлодарского района
  kaz: Павлодар ауданының қылмыстық-атқару жүйесі пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдар үшін және   интернаттық ұйымдардың кәмелетке толмаған түлектерді үшін жұмыс орындарының квотасын белгілеу туралы

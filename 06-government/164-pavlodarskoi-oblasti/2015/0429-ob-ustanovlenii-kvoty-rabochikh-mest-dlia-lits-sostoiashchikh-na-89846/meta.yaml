  title:
    rus: О внесении изменения в постановление акимата Павлодарского района от 29 апреля 2015 года № 142/4 «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной системы, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций Павлодарского района»
    kaz: Павлодар ауданы әкімдігінің 2015 жылғы 29 сәуірдегі «Павлодар ауданының қылмыстық-атқару жүйесі пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдардың кәмелетке толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы» № 142/4 қаулысына өзгеріс енгізу туралы

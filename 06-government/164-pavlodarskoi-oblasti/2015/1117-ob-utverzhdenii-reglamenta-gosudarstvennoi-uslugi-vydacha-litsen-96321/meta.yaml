act_code: '96321'
requisite: Постановление акимата Павлодарской области от 17 ноября 2015 года № 317/11. Зарегистрировано Департаментом юстиции Павлодарской области 14 декабря 2015 года № 4841. Утратило силу постановлением акимата Павлодарской области от 27 декабря 2018 года № 456/7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов»
  kaz: «Заңды тұлғалардың түстi және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және өткізу бойынша қызметті жүзеге асыруына лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

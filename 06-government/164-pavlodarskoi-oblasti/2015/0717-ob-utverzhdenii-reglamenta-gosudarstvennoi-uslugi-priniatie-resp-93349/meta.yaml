  title:
    rus: О внесении изменений в постановление акимата Павлодарской области от 17 июля 2015 года № 212/7 «Об утверждении регламента государственной услуги «Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения в порядке, определяемом Правительством Республики Казахстан»
    kaz: Павлодар облысы әкімдігінің 2015 жылғы 17 шілдедегі «Қазақстан Республикасының Үкіметі айқындайтын тәртіппен сыйға тарту шарты бойынша мемлекеттік емес заңды тұлғалардың және жеке тұлғалардың мүлік құқықтарын Қазақстан Республикасының қабылдауы» мемлекеттік көрсетілетінқызмет регламентін бекіту туралы» № 212/7 қаулысына өзгерістер енгізу туралы

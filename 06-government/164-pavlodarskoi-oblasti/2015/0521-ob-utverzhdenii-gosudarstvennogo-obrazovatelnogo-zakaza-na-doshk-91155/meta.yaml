  title:
    rus: О внесении изменения в постановление акимата Щербактинского района от 21 мая 2015 года № 151/5 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2015 год в Щербактинском  районе»
    kaz: Шарбақты ауданы әкімдігінің 2015 жылғы 21 мамырдағы «Шарбақты ауданында 2015 жылға мектепке дейінгі тәрбие мен оқытуға арналған мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» № 151/5 қаулысына өзгеріс енгізу туралы

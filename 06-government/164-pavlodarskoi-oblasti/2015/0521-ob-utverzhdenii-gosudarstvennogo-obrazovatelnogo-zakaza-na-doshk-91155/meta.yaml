title:
  rus: «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2015 год в Щербактинском  районе»
  kaz: «Шарбақты ауданында 2015 жылға мектепке дейінгі тәрбие мен оқытуға арналған мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы»

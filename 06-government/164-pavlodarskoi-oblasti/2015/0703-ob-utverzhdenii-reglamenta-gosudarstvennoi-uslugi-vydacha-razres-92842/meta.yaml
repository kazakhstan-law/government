  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 3 июля 2015 года № 192/6 «Об утверждении регламента государственной услуги «Выдача разрешения на размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения»
    kaz: Павлодар облысы әкімдігінің 2015 жылғы 3 шілдедегі «Облыстық және аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарына бөлінген белдеуде, жарнаманы тұрақты орналастыру объектілерінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 192/6 қаулысына өзгеріс енгізу туралы

act_code: '30248'
requisite: Постановление акимата города Аксу от 6 ноября 2006 года № 649/7. Зарегистрировано Управлением юстиции города Аксу 9 ноября 2006 года № 12-2-44
title:
  rus: Об определении усредненного тарифа за проезд по маршрутам регулярных городских и соединяющих населенные пункты автомобильных перевозок пассажиров и багажа в городе Аксу
  kaz: Ақсу қаласында жолаушылар мен теңдеме жүктерді автомобильмен тасымалдаулардың жиі қатынайтын қалалық және ауылдық елді мекендерді қосатын бағыттар бойынша жол жүру бағасына өлшемді орташаландырылған тарифті белгілеу туралы

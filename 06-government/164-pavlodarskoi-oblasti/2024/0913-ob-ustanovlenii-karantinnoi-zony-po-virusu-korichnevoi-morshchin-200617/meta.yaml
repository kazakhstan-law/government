requisite: Постановление акимата города Экибастуза Павлодарской области от 13 сентября 2024 года № 782/9
title:
  rus: Об установлении карантинной зоны по вирусу коричневой морщинистости плодов томата (Tomato brown rugosefruit virus) с введением карантинного режима на территории города Экибастуз в тепличном комплексе ТОО «Greenhouse-Qaztomat»
  kaz: Екібастұз қаласының аумағында «Greenhouse-Qaztomat» ЖШС жылыжай кешенінде карантиндік режим енгізіле отырып, қызанақ жемісінің қоңыр қатпарлы вирусы (Tomato brown rugosefruit virus) бойынша карантиндік аймақты белгілеу туралы

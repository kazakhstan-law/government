title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Селолық жерлерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру және азаматтық қызметшілер болып табылатын мәдениет, спорт және ветеринария мамандары саласындағы лауазымдарының тізбесін анықтау туралы

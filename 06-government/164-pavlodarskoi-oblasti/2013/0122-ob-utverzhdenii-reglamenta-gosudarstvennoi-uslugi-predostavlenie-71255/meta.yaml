requisite: Постановление акимата Баянаульского района Павлодарской области от 22 января 2013 года № 39/01. Зарегистрировано Департаментом юстиции Павлодарской области 26 февраля 2013 года № 3449. Утратило силу постановлением акимата Баянаульского района Павлодарской области от 18 июня 2013 года № 202/06
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызмет регламентін бекіту туралы'

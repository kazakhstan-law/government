requisite: Постановление акимата города Экибастуза Павлодарской области от 11 июня 2013 года № 547/6. Зарегистрировано Департаментом юстиции Павлодарской области 04 июля 2013 года № 3565
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в городе Экибастузе на 2013 год
  kaz: Екібастұз қаласында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар мен интернат ұйымдарының кәмелетке толмаған түлектері үшін 2013 жылға жұмыс орындарының квотасын белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата города Экибастуза от 11 июня 2013 года № 547/6 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в городе Экибастузе на 2013 год"
    kaz: Екібастұз қаласы әкімдігінің 2013 жылғы 11 маусымдағы "Екібастұз қаласында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар мен интернат ұйымдарының кәмелетке толмаған түлектері үшін 2013 жылға жұмыс орындарының квотасын белгілеу туралы" № 547/6 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/75432/rus

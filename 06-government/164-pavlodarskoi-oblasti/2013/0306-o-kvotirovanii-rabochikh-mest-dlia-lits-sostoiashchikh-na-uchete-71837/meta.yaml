act_code: '71837'
requisite: Постановление акимата Щербактинского района Павлодарской области от 06 марта 2013 года № 82/2. Зарегистрировано Департаментом юстиции Павлодарской области 02 апреля 2013 года № 3491. Утратило силу постановлением акимата Щербактинского района Павлодарской области от 11 сентября 2013 года № 319/8
title:
  rus: О квотировании рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций по Щербактинскому району на 2013 год
  kaz: Шарбақты ауданы бойынша 2013 жылы қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін сондай-ақ бас бостандығынан айыру орындарынан босап шыққан тұлғаларға және интернат мекемелерінің кәмелетке толмаған түлектеріне жұмыс орындарын үлестіру туралы

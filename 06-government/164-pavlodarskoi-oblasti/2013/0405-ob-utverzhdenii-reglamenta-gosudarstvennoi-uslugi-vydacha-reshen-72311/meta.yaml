act_code: '72311'
requisite: Постановление акимата Павлодарской области от 05 апреля 2013 года № 100/4. Зарегистрировано Департаментом юстиции Павлодарской области 03 мая 2013 года № 3525. Утратило силу постановлением акимата Павлодарской области от 24 апреля 2014 года № 124/4
title:
  rus: Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений) и определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения) по согласованию с уполномоченным органом в сфере религиозной деятельности"
  kaz: '"Дін қызметі саласындағы уәкілетті органмен келісім бойынша ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік қызмет регламентін бекіту туралы'

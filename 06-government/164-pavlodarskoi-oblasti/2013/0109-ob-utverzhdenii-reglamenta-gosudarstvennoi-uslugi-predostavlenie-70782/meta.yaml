act_code: '70782'
requisite: Постановление акимата Иртышского района Павлодарской области от 09 января 2013 года № 10/1. Зарегистрировано Департаментом юстиции Павлодарской области 05 февраля 2013 года № 3406. Утратило силу постановлением акимата Иртышского района Павлодарской области от 19 июня 2013 года № 295/5
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызмет регламентін бекіту туралы'

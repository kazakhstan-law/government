requisite: Постановление акимата Баянаульского района Павлодарской области от 28 марта 2016 года № 84/03. Зарегистрировано Департаментом юстиции Павлодарской области 15 апреля 2016 года № 5077. Утратило силу постановлением акимата Баянаульского района Павлодарской области от 7 сентября 2018 года № 239/9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

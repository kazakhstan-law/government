act_code: '108251'
requisite: Постановление акимата Успенского района Павлодарской области от 2 декабря 2016 года № 236/12. Зарегистрировано Департаментом юстиции Павлодарской области 14 декабря 2016 года № 5296. Утратило силу постановлением акимата Успенского района Павлодарской области от 17 августа 2017 года № 177/8 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан, из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих  на  учете службы пробации по Успенскому району на 2017 год
  kaz: 2017 жылға Успен ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындары квотасын белгілеу туралы

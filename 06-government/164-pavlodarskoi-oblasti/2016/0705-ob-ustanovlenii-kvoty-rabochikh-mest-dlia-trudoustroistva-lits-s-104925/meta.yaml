act_code: '104925'
requisite: Постановление акимата Успенского района Павлодарской области от 05 июля 2016 года № 122/7. Зарегистрировано Департаментом юстиции Павлодарской области 26 июля 2016 года № 5182.  Утратило силу постановлением акимата Успенского района Павлодарской области от 19 сентября 2016 года № 172/9
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в Успенском районе
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғаларды және Успен ауданының білім беру ұйымдарының түлектері болып табылатын, кәмелетке толғанға дейін ата-анасынан айырылған немесе қамқорлығынсыз қалған жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындары квотасын белгілеу туралы

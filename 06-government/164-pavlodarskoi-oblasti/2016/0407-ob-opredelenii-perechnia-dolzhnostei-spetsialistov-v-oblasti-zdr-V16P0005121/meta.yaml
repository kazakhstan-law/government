  title:
    rus: О внесении дополнений в постановление акимата Павлодарской области от 7 апреля 2016 года № 106/3 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Павлодар облыстық әкімдігінің 2016 жылғы 7 сәуірдегі «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» № 106/3 қаулысына толықтырулар енгізу туралы

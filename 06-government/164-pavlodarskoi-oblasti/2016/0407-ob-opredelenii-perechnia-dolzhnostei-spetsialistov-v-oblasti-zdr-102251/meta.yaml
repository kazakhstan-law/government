  title:
    rus: О внесении изменений и дополнения в постановление акимата Павлодарской области от 7 апреля 2016 года № 106/3 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Павлодар облысы әкімдігінің 2016 жылғы 7 сәуірдегі «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» № 106/3 қаулысына өзгерістер мен толықтыру енгізу туралы

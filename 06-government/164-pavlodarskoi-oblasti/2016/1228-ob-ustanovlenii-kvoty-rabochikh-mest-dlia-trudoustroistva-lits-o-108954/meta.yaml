requisite: Постановление акимата Лебяжинского района Павлодарской области от 28 декабря 2016 года № 307/12. Зарегистрировано Департаментом юстиции Павлодарской области 11 января 2017 года № 5338. Утратило силу постановлением акимата Лебяжинского района Павлодарской области от 1 июня 2017 года № 1-12/139 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, освобожденных из мест лишения свободы и лиц, состоящих на учете службы пробации в организациях Лебяжинского района на 2017 год
  kaz: Бас бостандығынан айыру орындарынан босатылған адамдарды және пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін 2017 жылға Лебяжі ауданының ұйымдарында жұмыс орындарының квотасын белгілеу туралы

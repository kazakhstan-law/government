  title:
    rus: О внесении изменения в постановление акимата Железинского района от 29 февраля 2016 года № 40/3 «Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных  закупок выполняется единым организатором»
    kaz: Железин ауданы әкімдігінің 2016 жылғы 29 ақпандағы «Тапсырыс берушілер үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушысын айқындау және мемлекеттік сатып алуды ұйымдастыру мен өткізуді бірыңғай ұйымдастырушы орындалатын бюджеттік бағдарламаларды және тауарларды, жұмыстарды, қызметтерді айқындау туралы» № 40/3 қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата Железинского района Павлодарской области от 29 февраля 2016 года № 40/3. Зарегистрировано Департаментом юстиции Павлодарской области 15 марта 2016 года № 4997. Утратило силу постановлением акимата Железинского района Павлодарской области от 18 ноября 2019 года № 368/10 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок выполняется единым организатором
  kaz: Тапсырыс берушілер үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушысын айқындау және мемлекеттік сатып алуды ұйымдастыру мен өткізуді бірыңғай ұйымдастырушы орындалатын бюджеттік бағдарламаларды және тауарларды, жұмыстарды, қызметтерді айқындау туралы

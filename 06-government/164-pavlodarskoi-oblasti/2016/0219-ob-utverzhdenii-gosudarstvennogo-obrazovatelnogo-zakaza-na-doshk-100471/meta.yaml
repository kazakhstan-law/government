  title:
    rus: О внесении изменений в постановление акимата города Павлодара от 19 февраля 2016 года № 175/3 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2016 год по городу Павлодар»
    kaz: Павлодар қаласы әкімдігінің 2016 жылғы 19 ақпандағы «Павлодар қаласы бойынша 2016 жылға мектепке дейінгі тәрбие мен оқытуға арналған мемлекеттік білім беру  тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» № 175/3 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Лебяжинского района Павлодарской области от 15 марта 2016 года № 53/3. Зарегистрировано Департаментом юстиции Павлодарской области 25 марта 2016 года № 5012. Утратило силу постановлением акимата района Аққулы Павлодарской области от 26 июня 2019 года № 1-03/160 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок выполняется единым организатором
  kaz: Тапсырыс берушілер үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушысын анықтау және мемлекеттік сатып алуды ұйымдастыру мен өткізуді бірыңғай  ұйымдастырушы орындалатын бюджеттік бағдарламаларды және тауарларды, жұмыстарды, қызметтерді анықтау туралы

  title:
    rus: О внесении изменения в постановление акимата Баянаульского района от 29 января 2016 года № 29/01 «Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок осуществляется единым организатором»

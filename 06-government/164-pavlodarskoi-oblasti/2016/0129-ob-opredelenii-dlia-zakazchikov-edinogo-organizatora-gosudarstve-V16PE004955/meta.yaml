requisite: Постановление акимата Баянаульского района Павлодарской области от 29 января 2016 года № 29/01. Зарегистрировано Департаментом юстиции Павлодарской области 04 марта 2016 года № 4955. Утратило силу постановлением акимата Баянаульского района Павлодарской области от 10 декабря 2019 года № 415/12 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок осуществляется единым организатором

act_code: '108073'
requisite: Постановление акимата Щербактинского района Павлодарской области от 17 ноября 2016 года № 368/9. Зарегистрировано Департаментом юстиции Павлодарской области 6 декабря 2016 года № 5288. Утратило силу постановлением акимата Щербактинского района Павлодарской области от 20 июля 2017 года № 218/6 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации по Щербактинскому району на 2017 год
  kaz: 2017 жылға Шарбақты ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындары  квотасын белгілеу туралы

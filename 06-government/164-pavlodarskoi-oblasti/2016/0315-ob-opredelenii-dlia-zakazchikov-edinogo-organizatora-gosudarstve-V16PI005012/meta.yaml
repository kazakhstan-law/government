  title:
    rus: О внесении изменений в постановление акимата Лебяжинского района от 15 марта 2016 года № 53/3 «Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок выполняется единым организатором»
    kaz: Лебяжі ауданы әкімдігінің 2016 жылғы 15 наурыздағы «Тапсырыс берушілер үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушысын анықтау және мемлекеттік сатып алуды ұйымдастыру мен өткізуді бірыңғай ұйымдастырушы орындалатын бюджеттік бағдарламаларды және тауарларды, жұмыстарды, қызметтерді анықтау туралы» № 53/3 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Майского района Павлодарской области от 14 ноября 2016 года № 223/11. Зарегистрировано Департаментом юстиции Павлодарской области 25 ноября 2016 года № 5279. Утратило силу постановлением акимата Майского района Павлодарской области от 9 июня 2017 года № 112/6 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, освобожденных из мест лишения свободы и лиц, состоящих на учете службы пробации в организациях Майского района на 2017 год
  kaz: Бас бостандығынан айыру орындарынан босатылған адамдарды және пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін 2017 жылға Май ауданының  ұйымдарында жұмыс орындарының квотасын белгілеу туралы

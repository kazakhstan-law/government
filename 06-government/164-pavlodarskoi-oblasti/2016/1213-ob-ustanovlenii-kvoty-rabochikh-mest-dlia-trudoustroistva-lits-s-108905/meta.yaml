act_code: '108905'
requisite: Постановление акимата города Аксу Павлодарской области от 13 декабря 2016 года № 1007/11. Зарегистрировано Департаментом юстиции Павлодарской области 6 января 2017 года № 5326. Утратило силу постановлением акимата города Аксу Павлодарской области от 16 августа 2017 года № 523/18 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в городе Аксу на 2017 год
  kaz: Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін Ақсу қаласында 2017 жылға жұмыс орындарына квота белгілеу туралы

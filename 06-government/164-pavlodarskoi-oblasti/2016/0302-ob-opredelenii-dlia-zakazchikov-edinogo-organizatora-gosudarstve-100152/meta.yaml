  title:
    rus: О внесении изменения в постановление акимата Иртышского района от 2 марта 2016 года № 46/1 «Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок выполняется единым организатором»
    kaz: Ертіс ауданы әкімдігінің 2016 жылғы 2 наурыздағы «Тапсырыс берушілер үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушысын айқындау мен мемлекеттік сатып алуларды ұйымдастыру мен өткізуді бірыңғай ұйымдастырушы орындайтын бюджеттік бағдарламаларды және тауарларды, жұмыстарды, қызметтерді анықтау туралы» № 46/1 қаулысына өзгеріс енгізу туралы

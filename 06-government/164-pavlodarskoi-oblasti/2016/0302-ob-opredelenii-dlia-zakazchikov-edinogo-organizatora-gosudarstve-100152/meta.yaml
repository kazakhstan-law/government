requisite: Постановление акимата Иртышского района Павлодарской области от 2 марта 2016 года № 46/1. Зарегистрировано Департаментом юстиции Павлодарской области 14 марта 2016 года № 4987. Утратило силу постановлением акимата Иртышского района Павлодарской области от 3 декабря 2019 года № 329/6 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым  организация и проведение государственных закупок выполняется единым организатором
  kaz: Тапсырыс берушілер үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушысын айқындау мен мемлекеттік сатып алуларды ұйымдастыру мен өткізуді бірыңғай ұйымдастырушы орындайтын бюджеттік бағдарламаларды және тауарларды, жұмыстарды, қызметтерді анықтау туралы

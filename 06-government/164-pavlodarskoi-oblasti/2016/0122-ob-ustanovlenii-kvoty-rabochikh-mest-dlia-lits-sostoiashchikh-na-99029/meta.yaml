act_code: '99029'
requisite: Постановление акимата Щербактинского района Павлодарской области от 22 января 2016 года № 10/1. Зарегистрировано Департаментом юстиции Павлодарской области 12 февраля 2016 года № 4924. Утратило силу постановлением акимата Щербактинского района Павлодарской области от 16 мая 2016 года № 137/3
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц,  освобождённых  из мест лишения свободы и несовершеннолетних  выпускников интернатных организаций на 2016 год
  kaz: 2016 жылға қылмыстық-атқару инспекциясы пробация қызметінің есебіне алынған, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және жұмысқа орналасуға мұқтаж  интернат мекемелерінің кәмелетке толмаған түлектері үшін  жұмыс орындары үлесін белгілеу туралы

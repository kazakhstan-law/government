  title:
    rus: О внесении изменения в постановление акимата города Павлодара от 19 февраля 2016 года № 176/3 «Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок выполняется единым организатором»
    kaz: Павлодар қаласы әкімдігінің 2016 жылғы 19 ақпандағы «Тапсырыс берушілер үшін мемлекеттік сатып алуды бірыңғай ұйымдастырушысын анықтау және мемлекеттік сатып алуды ұйымдастыру мен өткізуді бірыңғай ұйымдастырушы орындалатын бюджеттік бағдарламаларды және тауарларды, жұмыстарды, қызметтерді айқындау туралы» № 176/3 қаулысына  өзгеріс енгізу туралы

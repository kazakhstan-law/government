requisite: Постановление акимата Качирского района Павлодарской области от 11 марта 2016 года № 62/2. Зарегистрировано Департаментом юстиции Павлодарской области 15 марта 2016 года № 4995. Утратило силу постановлением акимата района Тереңкөл Павлодарской области от 1 июля 2019 года № 198/3 (вводится в действие со дня его первого официального опубликования)
title:

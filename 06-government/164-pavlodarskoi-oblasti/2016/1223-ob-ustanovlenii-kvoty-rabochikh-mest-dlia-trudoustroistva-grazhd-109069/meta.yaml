act_code: '109069'
requisite: Постановление акимата города Экибастуза Павлодарской области от 23 декабря 2016 года № 1490/12. Зарегистрировано Департаментом юстиции Павлодарской области 12 января 2017 года № 5341. Утратило силу постановлением акимата города Экибастуза Павлодарской области от 30 июня 2017 года № 795/7 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся  до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2017 год
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар  қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін 2017 жылға жұмыс орындарының квотасын белгілеу туралы

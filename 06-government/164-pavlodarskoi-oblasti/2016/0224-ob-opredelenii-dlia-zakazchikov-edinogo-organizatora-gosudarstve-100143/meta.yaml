act_code: '100143'
requisite: Постановление акимата Павлодарского района Павлодарской области от 24 февраля 2016 года № 58/2. Зарегистрировано Департаментом юстиции Павлодарской области 14 марта 2016 года № 4984. Утратило силу постановлением акимата Павлодарского района Павлодарской области от 5 июля 2019 года № 209/7 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении для заказчиков единого организатора  государственных закупок и определении  бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок выполняются единым организатором государственных закупок
  kaz: Тапсырыс берушілер үшін мемлекеттік сатып алудың бірыңғай ұйымдастырушысын айқындау және мемлекеттік сатып алуды ұйымдастыруды және өткізуді бірыңғай ұйымдастырушы орындайтын  бюджеттік бағдарламаларды  және тауарларды, жұмыстарды, қызметтерді анықтау туралы

  requisite: Постановление акимата Павлодарского района Павлодарской области от 6 января 2017 года № 5/1. Зарегистрировано Департаментом юстиции Павлодарской области 8 февраля 2017 года № 5372. Утратило силу постановлением акимата Павлодарского района Павлодарской области от 5 июля 2019 года № 209/7 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесении дополнения и изменения  в  постановление акимата Павлодарского района от 24 февраля 2016 года № 58/2 «Об определении для заказчиков единого организатора государственных закупок и определении бюджетных программ и товаров, работ, услуг, по которым организация и проведение государственных закупок выполняются единым организатором государственных закупок»
    kaz: Павлодар ауданы әкімдігінің 2016 жылғы 24 ақпандағы «Тапсырыс берушілер үшін мемлекеттік сатып алудың бірыңғай ұйымдастырушысын айқындау және мемлекеттік сатып алуды ұйымдастыруды және өткізуді бірыңғай  ұйымдастырушы орындайтын бюджеттік бағдарламаларды және тауарларды, жұмыстарды, қызметтерді анықтау туралы»  № 58/2 қаулысына толықтыру мен өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/109716/rus

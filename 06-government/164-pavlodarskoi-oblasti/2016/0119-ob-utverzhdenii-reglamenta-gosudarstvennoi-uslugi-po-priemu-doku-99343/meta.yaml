act_code: '99343'
requisite: Постановление акимата Павлодарской области от 19 января 2016 года № 12/1. Зарегистрировано Департаментом юстиции Павлодарской области 23 февраля 2016 года № 4932. Утратило силу постановлением акимата Павлодарской области от 30 октября 2020 года № 231/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги по приему документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения,  начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования
  kaz: Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық  және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды қабылдау бойынша мемлекеттік  қөрсетілетін қызмет регламентін бекіту туралы

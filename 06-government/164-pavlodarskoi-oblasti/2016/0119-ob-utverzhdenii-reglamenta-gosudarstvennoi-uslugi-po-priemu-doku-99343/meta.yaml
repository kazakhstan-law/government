  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 19 января 2016 года № 12/1 «Об утверждении регламента государственной услуги по приему документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
    kaz: Павлодар облысы әкімдігінің 2016 жылғы 19 қаңтардағы «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 12/1 қаулысына өзгеріс енгізу туралы

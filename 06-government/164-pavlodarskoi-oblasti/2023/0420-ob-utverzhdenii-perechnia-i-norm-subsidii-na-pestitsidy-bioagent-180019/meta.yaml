  title:
    rus: О внесении изменения и дополнений в постановление акимата Павлодарской области от 20 апреля 2023 года № 89/2 «Об утверждении перечня и норм субсидий на пестициды, биоагенты (энтомофаги), а также объемов бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2023 год»
    kaz: Павлодар облысы әкімдігінің 2023 жылғы 20 сәуірдегі «2023 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы № 89/2 қаулысына өзгеріс пен толықтырулар енгізу туралы

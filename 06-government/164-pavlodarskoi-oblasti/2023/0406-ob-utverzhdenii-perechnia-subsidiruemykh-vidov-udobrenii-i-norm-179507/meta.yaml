  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 6 апреля 2023 года № 83/2 «Об утверждении перечня субсидируемых видов удобрений и норм субсидий, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2023 год»
    kaz: Павлодар облысы әкімдігінің 2023 жылғы 6 сәуірдегі «2023 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тынайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» № 83/2 қаулысына өзгеріс енгізу туралы

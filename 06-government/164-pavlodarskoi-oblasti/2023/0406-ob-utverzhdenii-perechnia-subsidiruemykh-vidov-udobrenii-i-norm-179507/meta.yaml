title:
  rus: Об утверждении перечня субсидируемых видов удобрений и норм субсидий, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2023 год
  kaz: 2023 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тынайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы

requisite: Постановление акимата города Экибастуза Павлодарской области от 29 ноября 2023 года № 1005/11. Зарегистрировано в Департаменте юстиции Павлодарской области 30 ноября 2023 года № 7429-14. Утратило силу постановлением акимата города Экибастуза Павлодарской области от 12 марта 2025 года № 263/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил обеспечения возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в городе Экибастуз Павлодарской области
  kaz: Павлодар облысы Екібастұз қаласында пәтерлер, тұрғын емес үй-жайлар меншік иелерінің көппәтерлі тұрғын үйде лифтілерді жөндеуге және ауыстыруға, күрделі жөндеуге байланысты ақшаны қайтаруын қамтамасыз ету қағидаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата района Аққулы от 16 августа 2019 года № 1-03/192 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах района Аққулы»
    kaz: Аққулы ауданы әкімдігінің 2019 жылғы 16 тамыздағы «Аққулы ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен тәртібін бекіту туралы» № 1-03/192 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата района Тереңкөл от 15 апреля 2019 года № 118/2 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями на территории района Тереңкөл»
    kaz: Тереңкөл ауданы әкімдігінің 2019 жылғы 15 сәуірдегі № 118/2 «Тереңкөл ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесулер өткізу үшін үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

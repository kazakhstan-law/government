requisite: Постановление акимата города Экибастуза Павлодарской области от 6 августа 2019 года № 790/8. Зарегистрировано Департаментом юстиции Павлодарской области 8 августа 2019 года № 6499
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в городе Экибастузе на 2019 год
  kaz: Екібастұз қаласында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін 2019 жылға жұмыс орындарының квотасын белгілеу туралы

    kaz: Павлодар облысы Железин ауданы әкімдігінің 2019 жылғы 16 мамырдағы № 158/5 «Үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесу үшін үй-жайларды беру туралы» қаулысына өзгерістер енгізу туралы

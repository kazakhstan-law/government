  title:
    rus: О внесении изменений в постановление акимата района Аққулы от 20 февраля 2019 года № 1-03/32 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» исполнительных органов акимата района Аққулы»
    kaz: Аққулы ауданы әкімдігінің 2019 жылғы 20 ақпандағы «Аққулы ауданы әкімдігі атқарушы органдары «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» № 1-03/32 қаулысына өзгерістер енгізу туралы

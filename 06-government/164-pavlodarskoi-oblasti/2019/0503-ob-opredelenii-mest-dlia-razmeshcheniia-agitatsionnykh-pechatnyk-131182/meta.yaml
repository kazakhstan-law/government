  title:
    rus: О внесении изменений в постановление акимата района Аққулы от 3 мая 2019 года № 1-03/74 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями на территории района Аққулы»
    kaz: Аққулы ауданы әкімдігінің 2019 жылғы 3 мамырдағы «Аққулы ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесулер өткізу үшін үй-жайлар беру туралы» № 1-03/74 қаулысына өзгерістер енгізу туралы

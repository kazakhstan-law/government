title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории района Аққулы
  kaz: Аққулы ауданының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Железинского района Павлодарской области от 14 ноября 2019 года № 1-10/565 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Железинского района»
    kaz: Павлодар облысы Железин ауданы әкімдігінің 2019 жылғы 14 қарашадағы «Железин ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен тәртібін бекіту туралы» № 1-10/565 қаулысына өзгеріс енгізу туралы

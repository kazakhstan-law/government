act_code: '136916'
requisite: Постановление акимата города Аксу Павлодарской области от 29 ноября 2019 года № 1095/9. Зарегистрировано Департаментом юстиции Павлодарской области 11 декабря 2019 года № 6659
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в организациях города Аксу на 2020 год
  kaz: Ақсу қаласының ұйымдарында 2020 жылға арналған ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы

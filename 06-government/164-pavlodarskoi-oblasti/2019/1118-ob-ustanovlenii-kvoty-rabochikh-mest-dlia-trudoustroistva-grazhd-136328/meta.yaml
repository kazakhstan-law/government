act_code: '136328'
requisite: Постановление акимата города Экибастуза Павлодарской области от 18 ноября 2019 года № 1115/11. Зарегистрировано Департаментом юстиции Павлодарской области 26 ноября 2019 года № 6631
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в городе Экибастузе на 2020 год
  kaz: Екібастұз қаласында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін 2020 жылға жұмыс орындарының квотасын белгілеу туралы

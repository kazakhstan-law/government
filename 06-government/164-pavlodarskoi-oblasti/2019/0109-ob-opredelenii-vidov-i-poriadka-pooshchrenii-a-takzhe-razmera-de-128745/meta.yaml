requisite: Постановление акимата района Тереңкөл Павлодарской области от 9 января 2019 года № 3. Зарегистрировано Департаментом юстиции Павлодарской области 21 января 2019 года № 6241. Утратило силу постановлением акимата района Тереңкөл Павлодарской области от 14 августа 2020 года № 201/1 (вводится в действие со дня его первого официального опубликования)
title:

title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории Актогайского района
  kaz: Ақтоғай ауданының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

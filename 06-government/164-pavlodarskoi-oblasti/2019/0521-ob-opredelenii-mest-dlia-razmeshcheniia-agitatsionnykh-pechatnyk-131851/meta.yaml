  title:
    rus: О внесении изменений в постановление акимата Актогайского района от 21 мая 2019 года № 144 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещений для встреч с избирателями на территории Актогайского района»
    kaz: Ақтоғай ауданы әкімдігінің 2019 жылғы 21 мамырдағы «Ақтоғай ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесулер өткізу үшін үй-жайлар беру туралы» № 144 қаулысына өзгерістер енгізу туралы

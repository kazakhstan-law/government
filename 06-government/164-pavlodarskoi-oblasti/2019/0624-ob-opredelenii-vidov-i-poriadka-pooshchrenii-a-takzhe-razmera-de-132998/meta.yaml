requisite: Постановление акимата района Аққулы Павлодарской области от 24 июня 2019 года № 1-03/154. Зарегистрировано Департаментом юстиции Павлодарской области 26 июня 2019 года № 6448. Утратило силу постановлением акимата района Аққулы Павлодарской области от 3 июня 2026 года № 1-01/118 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

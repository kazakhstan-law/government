requisite: Постановление акимата района Аққулы Павлодарской области от 21 января 2019 года № 1-03/16. Зарегистрировано Департаментом юстиции Павлодарской области 28 января 2019 года № 6245. Утратило силу постановлением акимата района Аққулы Павлодарской области от 24 июня 2019 года № 1-03/154 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

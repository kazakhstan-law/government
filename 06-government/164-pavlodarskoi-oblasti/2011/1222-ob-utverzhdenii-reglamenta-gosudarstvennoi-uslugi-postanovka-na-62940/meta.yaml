requisite: Постановление акимата Иртышского района Павлодарской области от 22 декабря 2011 года № 511/8. Зарегистрировано Департаментом юстиции Павлодарской области 20 января 2012 года № 12-7-132. Утратило силу постановлением акимата Иртышского района Павлодарской области от 11 марта 2013 года № 147/2
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде в местном исполнительном органе района (города областного значения), города республиканского значения, столицы"
  kaz: '"Ауданның (облыстық маңызы бар қаланың), республикалық маңызы бар қаланың, астананың жергілікті атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызметінің регламентін бекіту туралы'

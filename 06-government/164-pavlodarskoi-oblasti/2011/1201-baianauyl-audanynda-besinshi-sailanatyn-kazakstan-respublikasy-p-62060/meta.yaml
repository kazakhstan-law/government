act_code: '62060'
requisite: Павлодар облысы Баянауыл аудандық әкімдігінің 2011 жылғы 01 желтоқсандағы № 266/12 қаулысы. Павлодар облысының Әділет департаментінде 2011 жылғы 15 желтоқсанда № 12-5-95 тіркелді. Күші жойылды - Павлодар облысы Баянауыл аудандық әкімдігінің 2019 жылғы 3 мамырдағы № 154/5 (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) қаулысымен
title:
  rus: Баянауыл ауданында бесінші сайланатын Қазақстан Республикасы Парламенті Мәжілісі депутаттығына және Қазақстан Республикасы мәслихаттары депутаттығына кандидаттардың үгіт баспа материалдары ілінетін орындардың және кандидаттардың сайлаушылармен кездесетін орындарының тізбесі туралы

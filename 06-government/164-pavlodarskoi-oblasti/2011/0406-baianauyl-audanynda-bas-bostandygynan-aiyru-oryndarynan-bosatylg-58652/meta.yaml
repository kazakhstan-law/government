requisite: Павлодар облысы Баянауыл аудандық әкімдігінің 2011 жылғы 06 сәуірдегі № 68/4 қаулысы. Павлодар облысының Әділет департаментінде 2011 жылғы 29 сәуірде № 12-5-89 тіркелді. Күші жойылды - Павлодар облысы Баянауыл аудандық әкімдігінің 2012 жылғы 09 тамыздағы № 218/8 қаулысымен

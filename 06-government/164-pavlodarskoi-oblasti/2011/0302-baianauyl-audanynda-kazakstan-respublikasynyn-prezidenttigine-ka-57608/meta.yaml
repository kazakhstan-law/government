requisite: Павлодар облысы Баянауыл аудандық әкімдігінің 2011 жылғы 02 наурыздағы № 43/3 қаулысы. Павлодар облысының Әділет департаментінде 2011 жылғы 03 наурызда № 12-5-85 тіркелді. Күші жойылды - Павлодар облысы Баянауыл аудандық әкімдігінің 2013 жылғы 25 қазандағы № 303/10 қаулысымен

act_code: '62697'
requisite: Павлодар облысы Баянауыл аудандық әкімдігінің 2011 жылғы 01 желтоқсандағы № 265/12 қаулысы. Павлодар облысының Әділет департаментінде 2012 жылғы 09 қаңтарда № 12-5-97 тіркелді. Күші жойылды - Павлодар облысы Баянауыл аудандық әкімдігінің 2012 жылғы 13 сәуірдегі № 101/4 қаулысымен
title:
  rus: '"Ауданның (облыстық маңызы бар қаланың), республикалық маңызы бар қаланың, астананың жергілікті атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызмет регламентін бекіту туралы'
  kaz: '"Ауданның (облыстық маңызы бар қаланың), республикалық маңызы бар қаланың, астананың жергілікті атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызмет регламентін бекіту туралы'

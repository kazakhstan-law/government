act_code: '62871'
requisite: Постановление акимата города Экибастуза Павлодарской области от 07 декабря 2011 года № 1200/11. Зарегистрировано Департаментом юстиции Павлодарской области 18 января 2012 № 12-3-313. Утратило силу постановлением акимата города Экибастуза Павлодарской области от 20 апреля 2012 года № 500/4
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде в местном исполнительном органе города Экибастуза"
  kaz: '"Екібастұз қаласының жергілікті атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызметінің регламентін бекіту туралы'

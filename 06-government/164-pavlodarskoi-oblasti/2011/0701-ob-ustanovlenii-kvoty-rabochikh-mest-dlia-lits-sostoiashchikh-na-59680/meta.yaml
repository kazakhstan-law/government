act_code: '59680'
requisite: Постановление акимата города Экибастуза Павлодарской области от 01 июля 2011 года № 526/6. Зарегистрировано Департаментом юстиции Павлодарской области 21 июля 2011 года № 12-3-299. Утратило силу постановлением акимата города Экибастуза Павлодарской области от 11 июня 2013 года № 547/6
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Бас бостандығынан қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған айыру орындарынан босатылған адамдар мен интернат ұйымдарының көмелетке толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы

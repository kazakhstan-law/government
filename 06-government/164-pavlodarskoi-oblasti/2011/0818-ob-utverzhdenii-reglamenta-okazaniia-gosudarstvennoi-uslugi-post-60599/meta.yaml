act_code: '60599'
requisite: Постановление акимата Железинского района Павлодарской области от 18 августа 2011 года № 281/8. Зарегистрировано Департаментом юстиции Павлодарской области 21 сентября 2011 года № 12-6-119. Утратило силу постановлением акимата Железинского района Павлодарской области от 22 мая 2012 года № 194/5
title:
  rus: Об утверждении регламента оказания государственной услуги "Постановка на учет граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде в местном исполнительном органе района (города областного значения), города республиканского значения, столицы"
  kaz: '"Ауданның (облыстық маңызы бар қаланың), республикалық маңызы бар қаланың, астананың жергілікті атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызмет көрсету регламентін бекіту туралы'

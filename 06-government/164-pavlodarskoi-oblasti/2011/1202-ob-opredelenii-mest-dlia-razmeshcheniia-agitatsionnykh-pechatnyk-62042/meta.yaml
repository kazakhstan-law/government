act_code: '62042'
requisite: Постановление акимата Павлодарского района Павлодарской области от 02 декабря 2011 года № 321/12. Зарегистрировано Департаментом юстиции Павлодарской области 14 декабря 2011 года № 12-11-145. Утратило силу постановлением акимата Павлодарского района Павлодарской области от 12 декабря 2013 года № 529/12
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, Павлодарского областного и Павлодарского районного маслихатов
  kaz: Қазақстан Республикасы Парламенті Мәжілісінің, Павлодар облыстық және Павлодар аудандық мәслихаттарының депутаттығына кандидаттардың сайлаушылармен кездесулер өткізу үшін үй-жайлар және үгіт баспасөз материалдарын орналастыру үшін орындар белгілеу туралы

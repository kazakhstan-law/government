  title:
    rus: О внесении изменений в постановление акимата Павлодарского района от 1 декабря 2011 года № 320/12 "Об утверждении регламента государственной услуги "Постановка на учет граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде в местном исполнительном органе района (города областного значения), города республиканского значения, столицы"
    kaz: Павлодар ауданы әкімдігінің 2011 жылғы 1 желтоқсандағы "Ауданның (облыстық маңызы бар қаланың), республикалық маңызы бар қаланың, астананың жергілікті атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызметінің регламентін бекіту туралы" № 320/12 қаулысына өзгерістер енгізу туралы

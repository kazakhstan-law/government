requisite: Постановление акимата города Аксу Павлодарской области от 04 августа 2011 года № 527/4. Зарегистрировано Департаментом юстиции Павлодарской области 24 августа 2011 года № 12-2-179. Утратило силу постановлением акимата города Аксу Павлодарской области от 23 апреля 2012 года № 278/3
title:
  rus: Об утверждении регламента оказания государственной услуги "Обеспечение бесплатного подвоза обучающихся и воспитанников к общеобразовательной организации образования и обратно домой в сельской зоне города Аксу"
  kaz: '"Білім алушылар мен тәрбиеленушілерді Ақсу қаласы ауыл аймағының білімнің жалпы білім беру ұйымдарына және кері үйге тегін тасымалдауды қамтамасыз ету" мемлекеттік қызмет көрсету регламентін бекіту туралы'

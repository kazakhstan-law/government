act_code: '64977'
requisite: Постановление акимата Успенского района Павлодарской области от 09 апреля 2012 года № 107/4. Зарегистрировано Департаментом юстиции Павлодарской области 19 апреля 2012 года № 12-12-124. Утратило силу постановлением акимата Успенского района Павлодарской области от 24 декабря 2013 года № 331/12
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғаларды және кәмелетке толмаған интернаттық ұйымдар түлектерін жұмысқа орналастыру үшін жұмыс орындар квотасын белгілеу туралы

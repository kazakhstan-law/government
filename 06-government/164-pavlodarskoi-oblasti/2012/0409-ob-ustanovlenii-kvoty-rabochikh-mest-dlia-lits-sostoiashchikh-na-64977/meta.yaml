  title:
    rus: О внесении изменений в постановление акимата Успенского района от 9 апреля 2012 года № 107/4 "Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций"
    kaz: 2012 жылдың 9 сәуіріндегі Успен ауданы әкімдігінің "Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ басбостандығынан айыру орындарынан босатылған тұлғаларды және кәмелетке толмаған интернаттық ұйымдар түлектерін жұмысқа орналастыру үшін жұмыс орындар квотасын белгілеу туралы" № 107/4 қаулысына өзгертулер енгізу туралы

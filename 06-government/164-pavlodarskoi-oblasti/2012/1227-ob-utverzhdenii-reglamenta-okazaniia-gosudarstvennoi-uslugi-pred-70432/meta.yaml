act_code: '70432'
requisite: Постановление акимата Щербактинского района Павлодарской области от 27 декабря 2012 года № 434/10. Зарегистрировано Департаментом юстиции Павлодарской области 23 января 2013 года № 3371. Утратило силу постановлением акимата Щербактинского района Павлодарской области от 20 июня 2013 года № 209/5
title:
  rus: Об утверждении регламента оказания государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: Ауылдық елді мекенді кенттерге жұмыс істеуге және тұрғылықты тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" жөніндегі мемлекеттік қызмет көрсету регламентін бекіту туралы

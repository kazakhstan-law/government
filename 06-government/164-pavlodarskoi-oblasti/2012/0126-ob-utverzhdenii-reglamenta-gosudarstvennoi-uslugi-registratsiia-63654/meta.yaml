title:
  rus: Об утверждении регламента государственной услуги "Регистрация детей дошкольного возраста (до 7 лет) для направления в детские дошкольные организации государственного учреждения "Отдел образования Павлодарского района""
  kaz: '"Павлодар ауданының білім беру бөлімі" мемлекеттік мекемесінің "Мектепке дейінгі балалар ұйымдарына жолдама беру үшін мектеп жасына дейінгі (7 жасқа дейінгі) балаларды тіркеу" мемлекеттік қызмет көрсету регламенті бекіту туралы'

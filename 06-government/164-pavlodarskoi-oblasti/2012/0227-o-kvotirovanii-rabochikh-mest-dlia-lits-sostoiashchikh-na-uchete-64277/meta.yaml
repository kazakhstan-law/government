act_code: '64277'
requisite: Постановление акимата Щербактинского района Павлодарской области от 27 февраля 2012 года № 55/1. Зарегистрировано Департаментом юстиции Павлодарской области 26 марта 2012 года № 12-13-143
title:
  rus: О квотировании рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций по Щербактинскому району на 2012 год
  kaz: Шарбақты ауданы бойынша 2012 жылы қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босап шыққан тұлғаларға және интернат мекемелерінің кәмелет жасқа толмаған түлектеріне жұмыс орындарын квоталау туралы

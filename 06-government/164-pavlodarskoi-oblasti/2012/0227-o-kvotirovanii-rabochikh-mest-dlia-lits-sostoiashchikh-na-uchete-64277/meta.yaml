  title:
    rus: О внесении дополнений в постановление акимата района от 27 февраля 2012 года № 55/1 "О квотировании рабочих мест для лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций по Щербактинскому району на 2012 год"
    kaz: Аудан әкімдігінің 2012 жылғы 27 ақпандағы "Шарбақты ауданы бойынша 2012 жылы бас бостандығынан айыру орындарынан босап шыққан тұлғаларға және интернат мекемелерінің кәмелет жасқа толмаған түлектеріне жұмыс орындарын квоталау туралы" № 55/1 қаулысына толықтыру енгізу туралы

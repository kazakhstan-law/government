act_code: '67371'
requisite: Постановление акимата города Аксу Павлодарской области от 13 августа 2012 года № 536/6. Зарегистрировано Департаментом юстиции Павлодарской области 31 августа 2012 года № 12-2-208. Утратило силу постановлением акимата города Аксу Павлодарской области от 09 сентября 2013 года № 585/4
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясында пробация қызметінде есепте тұрған тұлғалар, сонымен қатар бас бостандығынан айыру орындарынан босатылған тұлғалар және интернат ұйымдарының кәмелетке толмаған түлектері үшін жұмыс орындарының квотасын белгілеу туралы

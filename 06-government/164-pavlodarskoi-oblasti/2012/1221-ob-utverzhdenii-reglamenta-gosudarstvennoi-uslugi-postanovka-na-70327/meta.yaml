act_code: '70327'
requisite: Постановление акимата Лебяжинского района Павлодарской области от 21 декабря 2012 года № 379/44. Зарегистрировано Департаментом юстиции Павлодарской области 18 января 2013 года № 3363. Утратило силу постановлением акимата Лебяжинского района Павлодарской области от 18 июня 2013 года № 190/41
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегі" мемлекеттік қызмет регламентін бекіту туралы'

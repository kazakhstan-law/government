requisite: Постановление акимата Лебяжинского района Павлодарской области от 24 сентября 2012 года № 282/31. Зарегистрировано Департаментом юстиции Павлодарской области 12 октября 2012 года № 3235. Утратило силу постановлением акимата Лебяжинского района Павлодарской области от 16 сентября 2013 года № 295/59
title:
  rus: О квотировании рабочих мест для лиц, освобожденных из мест лишения свободы, состоящих на учете службы пробации уголовно-исполнительной инспекции и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық атқару инспекциясы пробация қызметінде есепте тұрған бас бостандығынан айыру орындарынан босатылған тұлғалар мен интернат ұйымдарының кәмелет жасқа толмаған түлектері үшін жұмыс орындарын квоталау туралы

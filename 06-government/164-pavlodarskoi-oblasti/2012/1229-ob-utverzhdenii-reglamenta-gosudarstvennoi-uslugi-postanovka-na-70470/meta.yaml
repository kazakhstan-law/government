requisite: Постановление акимата города Аксу Павлодарской области от 29 декабря 2012 года № 834/7. Зарегистрировано Департаментом юстиции Павлодарской области 24 января 2013 года № 3384. Утратило силу постановлением акимата города Аксу Павлодарской области от 24 июня 2013 года № 370/3
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Жергілікті атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызметінің регламентін бекіту туралы'

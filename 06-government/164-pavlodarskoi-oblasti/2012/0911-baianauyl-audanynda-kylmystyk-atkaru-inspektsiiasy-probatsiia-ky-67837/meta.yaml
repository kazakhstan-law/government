requisite: Павлодар облысы Баянауыл аудандық әкімдігінің 2012 жылғы 11 қыркүйектегі № 241/9 қаулысы. Павлодар облысының Әділет Департаментінде 2012 жылғы 27 қыркүйекте № 3225 тіркелді. Күші жойылды - Павлодар облысы Баянауыл аудандық әкімдігінің 2013 жылғы 03 қыркүйектегі № 280/09 қаулысымен
title:
  rus: Баянауыл ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғаларды және кәмелетке толмаған интернаттық ұйымдар түлектерін жұмысқа орналастыру үшін жұмыс орындар квотасын белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Иртышского района от 26 апреля 2012 года № 148/1 "О квотировании рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций"
    kaz: Ертіс ауданы әкімдігінің 2012 жылғы 26 сәуірдегі № 148/1 "Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғаларға, бас бостандығынан айыру орындарынан босатылған тұлғаларға және интернат мекемелерінің кәмелетке толмаған түлектеріне жұмыс орындарын квоталау туралы" қаулысына өзгерістер енгізу туралы

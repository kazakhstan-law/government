requisite: Постановление акимата Иртышского района Павлодарской области от 26 апреля 2012 года № 148/1. Зарегистрировано Департаментом юстиции Павлодарской области 18 мая 2012 года № 12-7-139. Утратило силу постановлением акимата Иртышского района Павлодарской области от 03 сентября 2013 года № 410/5
title:
  rus: О квотировании рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғаларға, бас бостандығынан айыру орындарынан босатылған тұлғаларға және интернат мекемелерінің кәмелетке толмаған түлектеріне жұмыс орындарын квоталау туралы

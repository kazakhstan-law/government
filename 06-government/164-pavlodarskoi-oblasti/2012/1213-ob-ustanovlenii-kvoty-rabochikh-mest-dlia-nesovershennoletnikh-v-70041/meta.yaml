requisite: Постановление акимата Майского района Павлодарской области от 13 декабря 2012 года № 358/12. Зарегистрировано Департаментом юстиции Павлодарской области 11 января 2013 года № 3327. Утратило силу постановлением акимата Майского района Павлодарской области от 06 сентября 2013 года № 236/9
title:
  rus: Об установлении квоты рабочих мест для несовершеннолетних выпускников интернатных организаций, лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также освободившихся из мест лишения свободы
  kaz: Интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Павлодарского района Павлодарской области от 18 июля 2012 года № 324/7. Зарегистрировано Департаментом юстиции Павлодарской области 9 августа 2012 года № 12-11-168. Утратило силу постановлением акимата Павлодарского района Павлодарской области от 6 сентября 2013 года № 334/9
title:
  rus: О квотировании рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций Павлодарского района
  kaz: Қылмыстық - атқару инспекциясы пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдар және Павлодар ауданының интернаттық ұйымдарын бітіруші кәмелетке толмағандар үшін жұмыс орындарын квоталау туралы

requisite: Постановление акимата Павлодарской области от 14 декабря 2012 года № 354/12. Зарегистрировано Департаментом юстиции Павлодарской области 14 января 2013 года № 3332. Утратило силу постановлением акимата Павлодарской области от 06 мая 2014 года № 154/5
title:
  rus: Об утверждении регламента оказания государственной услуги "Выдача разрешения на размещение наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах"
  kaz: '"Облыстық және аудандық маңызы бар жалпы пайдаланымдағы, сондай-ақ елді мекендердегі автомобиль жолдарының жолақ бөлігінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру" мемлекеттік қызмет көрсету регламентін бекіту туралы'

act_code: '70439'
requisite: Постановление акимата города Аксу Павлодарской области от 27 декабря 2012 года № 824/7. Зарегистрировано Департаментом юстиции Павлодарской области 23 января 2013 года № 3380. Утратило силу постановлением акимата города Аксу Павлодарской области от 24 июня 2013 года № 370/3
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Аксу"
  kaz: '"Ақсу қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызмет көрсету регламентін бекіту туралы'

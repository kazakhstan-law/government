act_code: '66816'
requisite: Постановление акимата города Павлодара Павлодарской области от 09 июля 2012 года № 1008/21. Зарегистрировано Департаментом юстиции Павлодарской области 25 июля 2012 года № 12-1-190. Утратило силу постановлением акимата города Павлодара Павлодарской области от 1 февраля 2016 года № 85/2
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций в городе Павлодаре
  kaz: Павлодар қаласында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғаларды және кәмелетке толмаған интернаттық ұйымдар түлектері үшін жұмыс орындар квотасын белгілеу туралы

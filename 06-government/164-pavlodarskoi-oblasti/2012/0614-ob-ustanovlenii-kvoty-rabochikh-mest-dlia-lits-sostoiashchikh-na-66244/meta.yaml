requisite: Постановление акимата Качирского района Павлодарской области от 14 июня 2012 года № 224/11. Зарегистрировано Департаментом юстиции Павлодарской области 21 июня 2012 года № 12-8-129. Утратило силу постановлением акимата Качирского района Павлодарской области от 04 сентября 2013 года № 298/8
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясының пробация қызметінде есепте тұрған тұлғаларға, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және кәмелетке толмаған интернаттық ұйымдар түлектері үшін жұмыс орындарына квота белгілеу туралы

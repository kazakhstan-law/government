requisite: Постановление акимата Иртышского района Павлодарской области от 01 августа 2012 года № 295/4. Зарегистрировано Департаментом юстиции Павлодарской области 31 августа 2012 года № 12-7-144. Утратило силу постановлением акимата Иртышского района Павлодарской области от 21 декабря 2012 года № 595/4
title:
  rus: Об утверждении регламента государственной услуги "Регистрация детей дошкольного возраста (до 7 лет) для направления в детские дошкольные организации Республики Казахстан" государственного учреждения "Отдел образования Иртышского района"
  kaz: '"Ертіс ауданының білім бөлімі" мемлекеттік мекемесінің "Қазақстан Республикасының мектепке дейінгі балалар ұйымдарына жолдама беру үшін мектеп жасына дейінгі (7 жасқа дейінгі) балаларды тіркеу" мемлекеттік қызмет регламентін бекіту туралы'

    kaz: Павлодар облысы әкімдігінің 2012 жылғы 24 қыркүйектегі "Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй жайларды орналастыру орындарын бекіту туралы" № 261/9 қаулысына өзгеріс енгізу туралы

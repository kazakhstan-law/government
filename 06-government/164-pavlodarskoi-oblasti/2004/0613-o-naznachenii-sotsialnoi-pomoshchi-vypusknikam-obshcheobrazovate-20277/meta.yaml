  title:
    rus: О внесении изменений в постановление акимата Павлодарской области от 14 июня 2004 года № 169/5 "О назначений социальной помощи выпускникам общеобразовательных школ из малообеспеченных семей и оставшимся без попечения родителей, для оплаты обучения в высших учебных заведениях области"
    kaz: Павлодар облысы әкімдігінің 2004 жылғы 14 маусымдағы "Азқамтамасыз етілген отбасыларындағы және ата-анасының қамқорлығынсыз қалған жалпы білім беретін мектеп түлектеріне облыстың жоғары оқу орындарындағы оқуына ақы төлеу үшін әлеуметтік көмек тағайындау туралы" № 169/5 қаулысына өзгерістер енгізу туралы.

  title:
    rus: О внесении изменений и дополнения в постановление акимата города Павлодара от 30 марта 2017 года № 360/11 «Об утверждении государственного образовательного заказана дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2017 год по городу Павлодар»
    kaz: Павлодар қаласы әкімдігінің 2017 жылғы 30 наурыздағы «Павлодар қаласы бойынша 2017 жылға мектепке дейінгі тәрбие мен оқытуға арналған мемлекеттік білім беру  тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» № 360/11 қаулысына өзгерістер мен толықтыру енгізу туралы

requisite: Постановление акимата города Павлодара Павлодарской области от 30 марта 2017 года № 360/11. Зарегистрировано Департаментом юстиции Павлодарской области 3 мая 2017 года № 5485. Утратило силу постановлением акимата города Павлодара Павлодарской области от 21 ноября 2017 года № 1380/39 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

requisite: Постановление акимата Павлодарской области от 25 декабря 2017 года № 421/6. Зарегистрировано Департаментом юстиции Павлодарской области 10 января 2018 года № 5803. Утратило силу постановлением акимата Павлодарской области от 25 декабря 2020 года № 285/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование затрат ревизионных союзов сельскохозяйственных кооперативов на проведение внутреннего аудита сельскохозяйственных кооперативов»
  kaz: «Ауыл шаруашылығы кооперативтерінің тексеру одақтарының ауыл шаруашылығы кооперативтерінің ішкі аудитін жүргізуге арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

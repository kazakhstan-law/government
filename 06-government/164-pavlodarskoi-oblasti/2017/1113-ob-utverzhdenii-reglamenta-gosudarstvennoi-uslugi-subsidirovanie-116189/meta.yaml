act_code: '116189'
requisite: Постановление акимата Павлодарской области от 13 ноября 2017 года № 351/6. Зарегистрировано Департаментом юстиции Павлодарской области 24 ноября 2017 года № 5704. Утратило силу постановлением акимата Павлодарской области от 25 декабря 2020 года № 285/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства  продуктов ее глубокой переработки»
  kaz: «Қайта өңдеуші кәсіпорындардың ауыл шаруашылығы өнімін тереңдете қайта өңдеп өнім өндіру үшін оны сатып алуға арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

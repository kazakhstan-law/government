  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 13 ноября 2017 года № 351/6 «Об утверждении регламента государственной услуги «Субсидирование затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства  продуктов ее глубокой переработки»
    kaz: Павлодар облысы әкімдігінің 2017 жылғы 13 қарашадағы «Қайта өңдеуші кәсіпорындардың ауыл шаруашылығы өнімін тереңдете қайта өңдеп өнім өндіру үшін оны сатып алуға арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» № 351/6 қаулысына өзгеріс енгізу туралы

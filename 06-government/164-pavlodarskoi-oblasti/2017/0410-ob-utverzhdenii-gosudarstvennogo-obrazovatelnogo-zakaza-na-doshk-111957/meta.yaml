requisite: Постановление акимата Железинского района Павлодарской области от 10 апреля 2017 года № 79/4. Зарегистрировано Департаментом юстиции Павлодарской области 4 мая 2017 года № 5488. Утратило силу постановлением акимата Железинского района Павлодарской области от 3 ноября 2017 года № 342/11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

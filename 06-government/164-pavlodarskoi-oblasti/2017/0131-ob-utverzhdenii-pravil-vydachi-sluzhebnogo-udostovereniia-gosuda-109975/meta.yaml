requisite: Постановление акимата Павлодарской области от 31 января 2017 года № 13/2. Зарегистрировано Департаментом юстиции Павлодарской области 23 февраля 2017 года № 5386. Утратило силу постановлением акимата Павлодарской области от 2 марта 2021 года № 67/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

requisite: Постановление акимата Лебяжинского района Павлодарской области от 7 апреля 2017 года № 1-12/79. Зарегистрировано Департаментом юстиции Павлодарской области 26 апреля 2017 года № 5479.  Утратило силу постановлением акимата Лебяжинского района Павлодарской области от 25 октября 2017 года № 1-12/272 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2017 год в Лебяжинском районе
  kaz: Лебяжі ауданында 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

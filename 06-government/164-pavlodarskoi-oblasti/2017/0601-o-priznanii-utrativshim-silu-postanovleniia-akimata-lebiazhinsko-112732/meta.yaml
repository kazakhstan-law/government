act_code: '112732'
requisite: Постановление акимата Лебяжинского района Павлодарской области от 1 июня 2017 года № 1-12/139. Зарегистрировано Департаментом юстиции Павлодарской области 12 июня 2017 года № 5524
title:
  rus: О признании утратившим силу постановления акимата Лебяжинского района от 28 декабря 2016 года  № 307/12 «Об установлении квоты рабочих мест для трудоустройства лиц, освобожденных из мест лишения свободы и лиц, состоящих на учете службы пробации в организациях Лебяжинского района на 2017 год»
  kaz: Лебяжі ауданы әкімдігінің 2016 жылғы 28 желтоқсандағы «Бас бостандығынан айыру орындарынан босатылған адамдарды және пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін 2017 жылға Лебяжі ауданының ұйымдарында жұмыс орындарының квотасын белгілеу туралы» № 307/12  қаулысының күші жойылды  деп  тану туралы

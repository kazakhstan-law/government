    kaz: Шарбақты ауданы әкімдігінің 2017 жылғы 17 ақпандағы «Шарбақты ауданы бойынша 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» № 43/1 қаулысына өзгеріс енгізу туралы

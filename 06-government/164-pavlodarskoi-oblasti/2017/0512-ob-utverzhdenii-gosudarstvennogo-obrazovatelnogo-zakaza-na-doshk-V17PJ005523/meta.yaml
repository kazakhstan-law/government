  title:
    rus: О внесении изменения в постановление акимата Майского района от 12 мая 2017 года № 93/5 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2017 год в Майском районе»
    kaz: Май ауданы әкімдігінің 2017 жылғы 12 мамырдағы «Май ауданында 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» № 93/5 қаулысына өзгеріс енгізу туралы

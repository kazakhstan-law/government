act_code: '116656'
requisite: Постановление акимата города Экибастуза Павлодарской области от 17 ноября 2017 года № 1383/11. Зарегистрировано Департаментом юстиции Павлодарской области 08 декабря 2017 года № 5723
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по городу Экибастузу на 2018 год
  kaz: Екібастұз қаласы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін 2018 жылға жұмыс орындарының квотасын белгілеу туралы

  title:
    rus: О внесении изменений и дополнений в постановление акимата области от 7 августа 2001 года № 48/5 "Об утверждении правил передачи в имущественный наем имущества, находящегося в хозяйственном ведении или оперативном ведении или оперативном управлении коммунальных государственных предприятий"(НГР 888 от 26 сентября 2001 года).
    kaz: Облыс әкімдігінің 2001 жылғы 7 тамыздағы "Коммуналдық мемлекеттік кәсіпорындардың шаруашылық иелігіндегі немесе жедел басқаруындағы мүліктерді мүліктік жалға беру ережелерін бекіту туралы" № 48/5 қаулысына өзгерістер мен толықтырулар енгізу туралы (2001 жылғы 26 қыркүйектегі МТН 888)

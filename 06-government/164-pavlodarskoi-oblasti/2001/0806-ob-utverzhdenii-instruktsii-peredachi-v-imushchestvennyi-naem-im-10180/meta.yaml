    kaz: Павлодар облысы әкiмдiгiнiң 2001 жылғы 7 тамыздағы "Коммуналдық мемлекеттiк кәсiпорындардың шаруашылық иелiгiндегi немесе жедел басқаруындағы мүлiктердi мүлiктiк жалға беру ережелерiн бекiту туралы" № 48/5 қаулысына өзгерiстер енгiзу туралы

act_code: '34941'
requisite: Постановление Экибастузского городского акимата от 9 июля 2007 года № 371/5. Зарегистрировано Управлением юстиции города Экибастуза Павлодарской области 25 июля 2007 года № 12-3-105
title:
  rus: Об утверждении форм заявлений граждан о постановке на учет для получения жилища из государственного жилищного фонда или жилища, арендованного местным исполнительным органом в частном жилищном фонде
  kaz: Жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған мемлекеттік тұрғын үй қорынан немесе тұрғын үй-жайынан тұрғын үй алу үшін есепке қою туралы азаматтар өтініштерінің нысандарын бекіту туралы

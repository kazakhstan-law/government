  title:
    rus: О внесении изменений в постановление акимата Павлодарской области от 29 июня 2007 года № 179/7 "Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенного пункта, требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Павлдарской области"
    kaz: Павлодар облысы әкімдігінің 2007 жылғы 29 маусымдағы "Павлодар облысының аумағындағы елді мекендердің құрамдас бөліктеріне атаулар беру және қайта атау тәртібін, жер учаскелеріне, ғимараттар мен имараттарға реттік нөмірлер беруге қойылатын талаптарды жүргізу жөніндегі ережені бекіту туралы" № 179/7 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/37102/rus

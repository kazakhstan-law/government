act_code: '34161'
requisite: Постановление акимата Павлодарской области от 29 июня 2007 года № 179/7. Зарегистрировано Департаментом юстиции Павлодарской области 18 июля 2007 года за № 3091. Утратило силу постановлением акимата Павлодарской области от 30 декабря 2014 года № 379/12
title:
  rus: Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенного пункта, требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Павлодарской области
  kaz: Павлодар облысының аумағындағы елді мекендердің құрамдас бөліктеріне атаулар беру және қайта атау тәртібін, жер учаскелеріне, ғимараттар мен имараттарға реттік нөмірлер беруге қойылатын талаптарды жүргізу жөніндегі ережені бекіту туралы

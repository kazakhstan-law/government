requisite: Постановление акимата Успенского района Павлодарской области от 08 сентября 2014 года № 283/9. Зарегистрировано Департаментом юстиции Павлодарской области 16 сентября 2014 года № 4022. Утратило силу постановлением акимата Успенского района Павлодарской области от 29 января 2016 года № 4/1 (вводится в действие со дня подписания)
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в Успенском районе
  kaz: Успен ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғаларды және кәмелетке толмаған интернаттық ұйымдар түлектерін жұмысқа орналастыру үшін жұмыс орындар квотасын белгілеу туралы

requisite: Постановление акимата города Павлодара Павлодарской области от 04 ноября 2014 года № 1433/13. Зарегистрировано Департаментом юстиции Павлодарской области 04 декабря 2014 года № 4205. Утратило силу постановлением акимата города Павлодара Павлодарской области от 30 января 2015 года № 108/2
title:
  rus: Об определении порядка отбора участников Программы "Доступное жилье - 2020" по направлению - жилье по линии жилищного строительного сберегательного банка Казахстана для молодых семей и очередности предоставления им жилья в городе Павлодаре
  kaz: Павлодар қаласында жас отбасылар үшін Қазақстан тұрғын үй құрылыс жинақ банкі желісінің тұрғын үй бағыты бойынша - "Қолжетімді тұрғын үй - 2020" Бағдарламасына қатысушыларды іріктеу және оларға тұрғын үй беру кезектілігінің тәртібін анықтау туралы

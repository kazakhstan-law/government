act_code: '80082'
requisite: Постановление акимата Павлодарской области от 24 апреля 2014 года № 124/4. Зарегистрировано Департаментом юстиции Павлодарской области 22 мая 2014 года № 3819. Утратило силу постановлением акимата Павлодарской области от 19 мая 2015 года № 142/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений), определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения)"
  kaz: '"Ғибадат үйлерін (ғимараттарын) салу, олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік қызмет регламентін бекіту туралы'

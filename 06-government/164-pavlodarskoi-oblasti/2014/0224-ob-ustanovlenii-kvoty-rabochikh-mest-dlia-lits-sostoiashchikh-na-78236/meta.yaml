act_code: '78236'
requisite: Постановление акимата Актогайского района Павлодарской области от 24 февраля 2014 года № 64. Зарегистрировано Департаментом юстиции Павлодарской области 26 марта 2014 года № 3741. Утратило силу постановлением акимата Актогайского района Павлодарской области от 21 января 2016 года № 3 (вводится в действие со дня подписания)
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және кәмелетке толмаған интернаттық ұйымдар түлектері үшін жұмыс орындарының квотасын белгілеу туралы

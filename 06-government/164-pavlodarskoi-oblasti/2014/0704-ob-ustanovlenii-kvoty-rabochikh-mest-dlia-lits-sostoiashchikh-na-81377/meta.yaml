requisite: Постановление акимата Качирского района Павлодарской области от 04 июля 2014 года № 218/7. Зарегистрировано Департаментом юстиции Павлодарской области 18 июля 2014 года № 3875. Утратило силу постановлением акимата Качирского района Павлодарской области от 15 января 2016 года № 3
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдар үшін және кәмелетке толмаған  интернаттық ұйымдарды бітірушілер үшін жұмыс орындарына квота белгілеу туралы

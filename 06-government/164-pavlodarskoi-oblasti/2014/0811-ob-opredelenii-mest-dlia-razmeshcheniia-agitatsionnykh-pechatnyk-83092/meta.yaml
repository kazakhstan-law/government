  title:
    rus: О внесении изменений в постановление акимата Щербактинского района от 11 августа 2014 года № 273/15 «Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями»
    kaz: Шарбақты ауданы әкімдігінің 2014 жылғы 11 тамыздағы «Үгіттеу жөніндегі баспа материалдарын орналастыру орындарын және сайлаушылармен кездесу өткізу үшін үй-жайларды анықтау туралы» № 273/15 қаулысына өзгерістер енгізу туралы

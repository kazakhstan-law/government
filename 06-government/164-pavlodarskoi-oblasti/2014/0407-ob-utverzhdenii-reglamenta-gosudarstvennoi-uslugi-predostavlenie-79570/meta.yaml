    kaz: Павлодар облысы әкімдігінің 2014 жылғы 7 сәуірдегі "Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" № 98/4 қаулысына толықтырулар енгізу туралы

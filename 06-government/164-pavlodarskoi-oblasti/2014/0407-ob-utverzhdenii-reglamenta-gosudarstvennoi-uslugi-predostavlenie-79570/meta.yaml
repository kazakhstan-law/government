act_code: '79570'
requisite: Постановление акимата Павлодарской области от 07 апреля 2014 года № 98/4. Зарегистрировано Департаментом юстиции Павлодарской области 06 мая 2014 года № 3792. Утратило силу постановлением акимата Павлодарской области от 24 апреля 2015 года № 113/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

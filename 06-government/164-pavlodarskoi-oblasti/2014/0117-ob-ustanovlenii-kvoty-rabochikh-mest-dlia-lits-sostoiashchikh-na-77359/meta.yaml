act_code: '77359'
requisite: Постановление акимата города Экибастуза Павлодарской области от 17 января 2014 года № 43/1. Зарегистрировано Департаментом юстиции Павлодарской области 11 февраля 2014 года № 3688
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций в городе Экибастузе на 2014 год
  kaz: Екібастұз қаласында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар мен интернат ұйымдарының кәмелетке толмаған түлектері үшін 2014 жылға жұмыс орындарының квотасын белгілеу туралы

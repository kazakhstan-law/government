act_code: '79259'
requisite: Постановление акимата Павлодарской области от 18 апреля 2014 года № 108/4. Зарегистрировано Департаментом юстиции Павлодарской области 28 апреля 2014 года № 3771. Утратило силу постановлением акимата Павлодарской области от 22 февраля 2016 года N 44/2 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении норматива субсидий на возмещение до ста процентов затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, а также критериев и требований к поставщикам
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды жүз пайызға дейін өтеуге арналған субсидиялар нормативтерін, сондай-ақ жеткізушіге қойылатын өлшемдер мен талаптарды бекіту туралы

  requisite: Постановление акимата Павлодарской области от 10 апреля 2015 года № 101/4. Зарегистрировано Департаментом юстиции Павлодарской области 21 апреля 2015 года № 4432. Утратило силу постановлением акимата Павлодарской области от 22 февраля 2016 года N 44/2 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 18 апреля 2014 года № 108/4 «Об утверждении норматива субсидий на возмещение до ста процентов затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, а также критериев и требований к поставщикам»
    kaz: Павлодар облысы әкімдігінің 2014 жылғы 18 сәуірдегі «Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды жүз пайызға дейін өтеуге арналған субсидиялар нормативтерін, сондай-ақ жеткізушіге қойылатын өлшемдер мен талаптарды бекіту туралы» № 108/4 қаулысына өзгеріс енгізу туралы

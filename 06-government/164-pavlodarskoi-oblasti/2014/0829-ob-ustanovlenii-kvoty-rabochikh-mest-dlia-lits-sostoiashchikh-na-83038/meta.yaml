requisite: Постановление акимата Лебяжинского района Павлодарской области от 29 августа 2014 года № 279/8. Зарегистрировано Департаментом юстиции Павлодарской области 9 сентября 2014 года № 4001. Утратило силу постановлением акимата Лебяжинского района Павлодарской области от 5 января 2016 года № 2/1
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және кәмелетке толмаған интернаттық ұйымдар түлектері үшін жұмыс орындарының квотасын белгілеу туралы

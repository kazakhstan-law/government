act_code: '82491'
requisite: Постановление акимата Павлодарской области от 21 июля 2014 года № 264/8. Зарегистрировано Департаментом юстиции Павлодарской области 22 августа 2014 года № 3952. Утратило силу постановлением акимата Павлодарской области от 28 мая 2015 года № 152/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Принятие местными исполнительными органами области решения по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
  kaz: '"Облыстың жергілікті атқарушы органдарының жануарларын дүниесін пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін бекітіп беру мен аңшылық және балық шаруашылықтарының қажеттіліктері үшін сервитуттарды белгілеу жөнінде шешімдер қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

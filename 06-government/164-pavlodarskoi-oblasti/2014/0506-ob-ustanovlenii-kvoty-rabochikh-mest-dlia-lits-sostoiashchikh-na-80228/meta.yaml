act_code: '80228'
requisite: Постановление акимата Иртышского района Павлодарской области от 6 мая 2014 года № 150/4. Зарегистрировано Департаментом юстиции Павлодарской области 23 мая 2014 года № 3826.  Утратило силу постановлением акимата города Павлодара Павлодарской области от 19 января 2016 года № 7/1
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

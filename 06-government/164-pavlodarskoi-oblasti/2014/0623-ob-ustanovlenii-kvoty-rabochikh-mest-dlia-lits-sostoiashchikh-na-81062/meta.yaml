title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций на 2014 год
  kaz: 2014 жылға қылмыстық-атқару инспекциясы пробация қызметінің есебіне алынған, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және жұмысқа орналасуға мұқтаж интернат мекемелерінің кәмелетке толмаған түлектері үшін жұмыс орындары үлесін белгілеу туралы

act_code: '80386'
requisite: Постановление акимата Павлодарской области от 24 апреля 2014 года № 117/4. Зарегистрировано Департаментом юстиции Павлодарской области 30 мая 2014 года № 3837. Утратило силу постановлением акимата Павлодарской области от 28 мая 2015 года № 160/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг "Выдача лицензии, переоформление, выдача дубликатов лицензии на медицинскую деятельность", "Выдача лицензии, переоформление, выдача дубликатов лицензии на фармацевтическую деятельность", "Выдача лицензии, переоформление, выдача дубликатов лицензии на деятельность, связанную с оборотом наркотических средств, психотропных веществ и прекурсоров в области здравоохранения"
  kaz: '"Медициналық қызметке лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру", "Фармацевтикалық қызметке лицензиялар беру, қайта ресімдеу, лицензияның телнұсқаларын беру", "Денсаулық сақтау саласындағы есірткі құралдарының, психотроптық заттар мен прекурсорлардың айналымына байланысты қызметке лицензиялар беру, қайта ресімдеу, лицензияның телнұсқаларын беру" мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы'

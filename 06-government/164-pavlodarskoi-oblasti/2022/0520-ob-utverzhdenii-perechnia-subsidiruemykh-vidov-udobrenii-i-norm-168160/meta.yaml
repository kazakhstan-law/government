  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 20 мая 2022 года № 135/1 «Об утверждении перечня субсидируемых видов удобрений и норм субсидий, а также объемов бюджетных средств на субсидирование удобрений (за исключением органических) на 2022 год»
    kaz: Павлодар облысы әкімдігінің 2022 жылғы 20 мамырдағы «2022 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» № 135/1 қаулысына өзгеріс енгізу туралы

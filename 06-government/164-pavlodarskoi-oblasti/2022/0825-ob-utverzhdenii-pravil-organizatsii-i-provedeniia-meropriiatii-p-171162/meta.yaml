act_code: '171162'
requisite: Постановление акимата города Аксу Павлодарской области от 25 августа 2022 года № 629/5. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 сентября 2022 года № 29381
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Аксу
  kaz: Ақсу қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата города Павлодара от 18 ноября 2022 года № 1861/3 «Об установлении дифференцированного тарифа на регулярные автомобильные перевозки пассажиров и багажа в городском сообщении на территории города Павлодара»
    kaz: Павлодар қаласы әкімдігінің 2022 жылғы 18 қарашадағы «Павлодар қаласының аумағында қалалық қатынастарда жолаушылар мен багажды тұрақты автомобильді тасымалдауға сараланған тарифті белгілеу туралы» № 1861/3 қаулысына өзгеріс енгізу туралы

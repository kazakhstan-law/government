  title:
    rus: О внесении изменений в постановление акимата города Экибастуза от 03 августа 2022 года № 704/8 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасада, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Экибастуз»
    kaz: Екібастұз қаласы әкімдігінің 2022 жылғы 03 тамыздағы «Екібастұз қаласына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» № 704/8 қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении перечня и нормы субсидий на пестициды, биоагенты (энтомофаги), а также объемы бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2022 год
  kaz: 2022 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 7 июля 2022 года № 193/2 «Об утверждении перечня и нормы субсидий на пестициды, биоагенты (энтомофаги), а также объемы бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2022 год»
    kaz: Павлодар облысы әкімдігінің 2022 жылғы 7 шілдедегі «2022 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» № 193/2 қаулысына өзгеріс енгізу туралы

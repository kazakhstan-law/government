requisite: Постановление акимата Железинского района Павлодарской области от 23 ноября 2022 года № 308/10. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 ноября 2022 года № 30865
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Железинского района
  kaz: Железин ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Павлодарской области от 23 декабря 2022 года № 358/5 «Об утверждении государственного образовательного заказа на дополнительное образование детей в пределах объемов бюджетных средств по Павлодарской области на 2023 год»
    kaz: Павлодар облысы әкімдігінің 2022 жылғы 23 желтоқсандағы «Павлодар облысы бойынша 2023 жылға арналған бюджет қаражатының көлемі шегінде балаларға қосымша білім беруге арналған мемлекеттік білім беру тапсырысын бекіту туралы» № 358/5 қаулысына өзгеріс енгізу туралы

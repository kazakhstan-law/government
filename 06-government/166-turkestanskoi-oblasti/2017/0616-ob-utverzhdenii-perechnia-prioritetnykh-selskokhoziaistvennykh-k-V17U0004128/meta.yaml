requisite: Постановление акимата Южно-Казахстанской области от 16 июня 2017 года № 163. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 21 июня 2017 года № 4128. Утратило силу постановлением акимата Туркестанской области от 5 мая 2020 года № 112 (вводится в действие со дня его первого  официального опубликования)
title:
  rus: Об утверждении перечня приоритетных сельскохозяйственных культур и нормы субсидий на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур в Туркестанской области
  kaz: Түркістан облысындағы басым ауыл шаруашылығы дақылдарының тізбесін және басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егіс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын арзандатуға арналған субсидиялар нормаларын бекіту туралы

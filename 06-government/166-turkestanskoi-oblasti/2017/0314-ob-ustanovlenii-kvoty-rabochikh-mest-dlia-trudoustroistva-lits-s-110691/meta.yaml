act_code: '110691'
requisite: Постановление акимата города Кентау Южно-Казахстанской области от 14 марта 2017 года № 60. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 28 марта 2017 года № 3999. Утратило силу постановлением акимата города Кентау Южно-Казахстанской области от 24 июля 2017 года № 207
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования города Кентау
  kaz: Кентау қаласының пробация қызметінің есебінде тұрған адамдарды, сондай ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

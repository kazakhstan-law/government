title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Шардаринского района корпуса «Б»
  kaz: «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Шардара ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

act_code: '111841'
requisite: Постановление акимата Казыгуртского района Южно-Казахстанской области от 13 марта 2017 года № 84. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 19 апреля 2017 года № 4059. Утратило силу постановлением акимата Казыгуртского района Туркестанской области от 12 января 2021 года № 5 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения аппарата акима района, села, сельских округов и исполнительных органов, финансируемых из Казыгурсткого районного бюджета и его описания
  kaz: Қазығұрт аудандық бюджетінен қаржыландырылатын аудан, ауыл, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың қызметтік куәлікті беру қағидаларын және оның сипаттамасын бекіту туралы

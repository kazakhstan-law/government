act_code: '112005'
requisite: Постановление акимата Сайрамского района Южно-Казахстанской области от 3 апреля 2017 года № 154. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 3 мая 2017 года № 4089. Утратило силу постановлением акимата Сайрамского района Южно-Казахстанской области от 26 апреля 2018 года № 213
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Сайрамского района, исполнительных органов, финансируемых из районного бюджета и аппаратов акимов сельских округов
  kaz: Сайрам ауданы әкімі аппаратының, аудандық бюджеттен қаржыландырылатын атқарушы органдардың және ауылдық округтер әкімдері аппараттарының «Б» корпусындағы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

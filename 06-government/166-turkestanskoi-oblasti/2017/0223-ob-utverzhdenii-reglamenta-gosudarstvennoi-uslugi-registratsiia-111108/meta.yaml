act_code: '111108'
requisite: Постановление акимата Южно-Казахстанской области от 23 февраля 2017 года № 30. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 4 апреля 2017 года № 4010. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Регистрация согласия или отзыва согласия на прижизненное добровольное пожертвование тканей (части ткани) и (или) органов (части органов) после смерти в целях трансплантации"
  kaz: '"Транспланттау мақсатында азаматтан қайтыс болғаннан кейін оның тіндерін және (немесе) ағзаларын (ағзалардың бөліктерін) алу мүмкіндігі туралы көзі тірісінде еркін көңіл білдіруіне келісім беру немесе қайтарып алуды тіркеу" мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы"'

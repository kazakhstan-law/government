requisite: Постановление акимата города Кентау Южно-Казахстанской области от 21 декабря 2017 года № 351. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 10 января 2018 года № 4391. Утратило силу постановлением акимата города Кентау Туркестанской области от 13 сентября 2024 года № 339 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін анықтау туралы

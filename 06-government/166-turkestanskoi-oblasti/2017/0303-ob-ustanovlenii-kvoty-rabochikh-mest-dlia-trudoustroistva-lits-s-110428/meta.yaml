act_code: '110428'
requisite: Постановление акимата Отырарского района Южно-Казахстанской области от 3 марта 2017 года № 32. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 13 марта 2017 года № 3992. Утратило силу постановлением акимата Отырарского района Южно-Казахстанской области от 28 августа 2017 года № 193
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Отрарского района
  kaz: Отырар ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

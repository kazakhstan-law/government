act_code: '115022'
requisite: Постановление акимата Отырарского района Южно-Казахстанской области от 8 сентября 2017 года № 195. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 26 сентября 2017 года № 4217. Утратило силу постановлением акимата Отырарского района Южно-Казахстанской области от 2 марта 2018 года № 40
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Отырарского района
  kaz: Отырар ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

act_code: '114618'
requisite: Постановление акимата Отырарского района Южно-Казахстанской области от 28 августа 2017 года № 193. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 6 сентября 2017 года № 4207
title:
  rus: О признании утратившим силу постановления акимата Отырарского района от 3 марта 2017 года за №32 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения  родителей, являющихся выпускниками организаций образования Отрарского района»
  kaz: Отырар ауданы әкімдігінің 2017 жылғы 3 наурыздағы №32 «Отырар ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған  адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы» қаулысының күшін жою туралы

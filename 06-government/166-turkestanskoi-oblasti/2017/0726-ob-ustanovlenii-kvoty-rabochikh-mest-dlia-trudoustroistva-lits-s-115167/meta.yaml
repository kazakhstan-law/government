act_code: '115167'
requisite: Постановление акимата города Шымкент Южно-Казахстанской области от 26 июля 2017 года № 687. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 8 августа 2017 года № 4180. Утратило силу постановлением акимата города Шымкент Южно-Казахстанской области от 28 февраля 2018 года № 102
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования города Шымкент
  kaz: Шымкент қаласында пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

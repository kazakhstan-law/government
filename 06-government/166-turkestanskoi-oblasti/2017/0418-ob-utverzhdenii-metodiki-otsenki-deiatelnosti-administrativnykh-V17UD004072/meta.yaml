title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из городского бюджета и административных государственных служащих аппарата акима города Туркестан корпуса «Б»
  kaz: «Б» корпусындағы қалалық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Түркістан қаласы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

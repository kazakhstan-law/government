act_code: '110117'
requisite: Постановление акимата Южно-Казахстанской области от 20 февраля 2017 года № 17. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 3 марта 2017 года № 3987
title:
  rus: О признании утратившим силу постановления акимата Южно-Казахстанской области от 24 августа 2007 года №271 «Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенного пункта, требования к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Южно-Казахстанской области»
  kaz: Оңтүстік Қазақстан облысы әкімдігінің 2007 жылғы 24 тамыздағы №271 «Оңтүстік Қазақстан облысының аумағындағы елді мекеннің құрамдас бөліктеріне атаулар беру және қайта атау тәртібін жүргізу жөніндегі ережені, жер учаскелеріне, ғимараттар мен құрылыстарға реттік нөмірлер беруге қойылатын талаптарды бекіту туралы» қаулысының күшін жою туралы

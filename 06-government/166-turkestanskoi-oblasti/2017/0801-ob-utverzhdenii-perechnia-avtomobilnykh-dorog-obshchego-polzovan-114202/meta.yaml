    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2017 жылғы 1 тамыздағы № 207 «Түркістан облысының облыстық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының тізбесін бекіту туралы» қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата Южно-Казахстанской области от 15 декабря 2017 года № 364. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 5 января 2018 года № 4365. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием»
  kaz: «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

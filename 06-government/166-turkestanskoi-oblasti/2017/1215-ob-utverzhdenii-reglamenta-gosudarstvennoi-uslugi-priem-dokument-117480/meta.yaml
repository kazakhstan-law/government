  title:
    rus: О внесении изменения в постановление акимата Южно-Казахстанской области от 15 декабря 2017 года № 364 "Об утверждении регламента государственной услуги "Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием"
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2017 жылғы 15 желтоқсандағы № 364 "Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына өзгеріс енгізу туралы

act_code: '109605'
requisite: Постановление акимата Сайрамского района Южно-Казахстанской области от 5 января 2017 года № 6. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 30 января 2017 года № 3962. Утратило силу постановлением акимата Сайрамского района Южно-Казахстанской области от 14 июля 2017 года № 277
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Сайрамского района
  kaz: Сайрам ауданының пробация қызметінің есебінде тұрған адамдарды, сондай ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

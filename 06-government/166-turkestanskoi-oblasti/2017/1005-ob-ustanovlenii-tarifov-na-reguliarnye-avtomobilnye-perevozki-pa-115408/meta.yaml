requisite: Постановление акимата города Кентау Южно-Казахстанской области от 5 октября 2017 года № 267. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 20 октября 2017 года № 4238. Утратило силу постановлением акимата города Кентау Туркестанской области от 29 мая 2025 года № 200 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

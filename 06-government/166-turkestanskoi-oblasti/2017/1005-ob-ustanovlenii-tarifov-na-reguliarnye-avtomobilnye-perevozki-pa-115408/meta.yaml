    kaz: Кентау қаласы әкімдігінің 2017 жылғы 5 қазандағы № 267 «Кентау қаласының қалалық және қала маңы қатынастарында жолаушылар мен багажды қалалық қатынаста автомобильмен тұрақты тасымалдаудың бірыңғай тарифін белгілеу туралы» қаулысына өзгерістер енгізу туралы

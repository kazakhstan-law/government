title:
  rus: Об утверждении размеров тарифов за услуги, предоставляемым коммунальным государственным учреждением «Сырдарья-Туркестанский государственный региональный природный парк» управления природных ресурсов и регулирования природопользования Туркестанской области
  kaz: Түркістан облысының табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Сырдария-Түркістан мемлекеттік өңірлік табиғи паркі» коммуналдық мемлекеттік мекемесі көрсететін қызметтер үшін тарифтер мөлшерін бекіту туралы

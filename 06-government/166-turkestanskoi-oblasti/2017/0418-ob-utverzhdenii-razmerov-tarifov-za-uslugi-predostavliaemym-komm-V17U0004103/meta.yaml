  title:
    rus: О внесении изменения в постановление акимата Южно-Казахстанской области от 18 апреля 2017 года № 94 «Об утверждении размеров тарифов за услуги, предоставляемым коммунальным государственным учреждением «Сырдарья-Туркестанский государственный региональный природный парк» управления природных ресурсов и регулирования природопользования Туркестанской области
    kaz: «Түркістан облысының табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Сырдария-Түркістан мемлекеттік өңірлік табиғи паркі» коммуналдық мемлекеттік мекемесі көрсететін қызметтер үшін тарифтер мөлшерін бекіту туралы» Оңтүстiк Қазақстан облысы әкiмдiгiнiң 2017 жылғы 18 сәуірдегі № 94 қаулысына өзгеріс енгізу туралы

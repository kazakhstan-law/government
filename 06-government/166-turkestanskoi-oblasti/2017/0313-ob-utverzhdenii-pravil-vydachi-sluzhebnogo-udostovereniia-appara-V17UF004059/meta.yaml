    kaz: Қазығұрт ауданы әкімдігінің 2017 жылғы 13 наурыздағы № 84 «Қазығұрт аудандық бюджетінен қаржыландырылатын аудан, ауыл, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың қызметтік куәлікті беру қағидаларын және оның сипаттамасын бекіту туралы» қаулысының күші жойылды деп тану туралы

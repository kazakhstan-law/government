  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 5 июня 2017 года № 149 «О создании экологического коридора для обеспечения миграции Каратауских архаров на хребтах гор Каратау Южно-Казахстанской области»
    kaz: Оңтүстiк Қазақстан облысы әкiмдiгiнiң «Оңтүстік Қазақстан облысындағы Қаратау тауы жоталарында Қаратау арқарының миграциялық жолдарын қорғаудың экологиялық дәлізін құру туралы» 2017 жылғы 5 маусымдағы № 149 қаулысына өзгерістер енгізу туралы

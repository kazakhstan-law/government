title:
  rus: О признании утратившим силу постановления акимата Отырарского района от 13 сентября 2016 года за №243 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы»
  kaz: Отырар ауданы әкімдігінің 2016 жылғы 13 қыркүйектегі №243 «Мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысының күшін жою туралы

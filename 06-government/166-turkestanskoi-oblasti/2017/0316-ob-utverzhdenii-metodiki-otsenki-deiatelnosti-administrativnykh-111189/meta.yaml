act_code: '111189'
requisite: Постановление акимата Сарыагашского района Южно-Казахстанской области от 16 марта 2017 года № 90. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 11 апреля 2017 года № 4028. Утратило силу постановлением акимата Сарыагашского района Южно-Казахстанской области от 5 апреля 2018 года № 148
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, города районного значения, поселка, села, сельских округов и исполнительных органов финансируемых из Сарыагашского районного бюджета
  kaz: Сарыағаш аудандық бюджеттен қаржыландырылатын аудан, аудандық маңызы бар қала, кент, ауыл, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

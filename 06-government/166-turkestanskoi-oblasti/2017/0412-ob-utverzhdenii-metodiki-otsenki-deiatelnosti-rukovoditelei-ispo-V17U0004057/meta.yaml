title:
  rus: Об утверждении Методики оценки деятельности руководителей исполнительных органов, финансируемых из областного бюджета, и административных государственных служащих аппарата акима Южно-Казахстанской области корпуса «Б»
  kaz: «Б» корпусындағы облыстық бюджеттен қаржыландырылатын атқарушы органдардың басшылары мен Оңтүстік Қазақстан облысы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

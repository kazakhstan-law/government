  title:
    rus: О внесении изменений в постановление акимата Казыгуртского района от 13 ноября 2017 года № 392 «Об утверждении коэффициента зонирования в Казыгуртском районе, учитывающий месторасположение объекта налогообложения в населенном пункте»
    kaz: Қазығұрт ауданы әкімдігінің 2017 жылғы 13 қарашадағы № 392 «Қазығұрт ауданында салық салу объектісінің елдi мекенде орналасуын есепке алынатын аймаққа бөлу коэффициентiн бекіту туралы» қаулысына өзгерістер енгізу туралы

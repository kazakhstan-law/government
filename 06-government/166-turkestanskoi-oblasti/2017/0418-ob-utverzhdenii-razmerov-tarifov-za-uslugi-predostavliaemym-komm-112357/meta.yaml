  title:
    rus: О внесении изменения и дополнения в постановление акимата Южно-Казахстанской области от 18 апреля 2017 года № 94 «Об утверждении размеров тарифов за услуги, предоставляемые особо охраняемыми природными территориями местного значения со статусом юридического лица»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2017 жылғы 12 сәуірдегі № 94 «Заңды тұлға мәртебесі бар жергілікті маңызы бар ерекше қорғалатын табиғи аумақтарда көрсететін қызметтер үшін тарифтер мөлшерін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

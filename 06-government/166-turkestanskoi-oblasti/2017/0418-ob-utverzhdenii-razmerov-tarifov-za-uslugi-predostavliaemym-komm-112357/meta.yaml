  requisite: Постановление акимата Туркестанской области от 29 апреля 2022 года № 82. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 мая 2022 года № 27962
  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 18 апреля 2017 года № 94 «Об утверждении размеров тарифов за услуги, предоставляемые особо охраняемыми природными территориями местного значения со статусом юридического лица»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің «Заңды тұлға мәртебесі бар жергілікті маңызы бар ерекше қорғалатын табиғи аумақтарда көрсететін қызметтер үшін тарифтер мөлшерін бекіту туралы» 2017 жылғы 18 сәуірдегі № 94 қаулысына өзгерістер енгізу туралы

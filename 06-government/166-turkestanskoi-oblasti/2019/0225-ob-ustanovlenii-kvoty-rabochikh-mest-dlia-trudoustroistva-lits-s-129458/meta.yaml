act_code: '129458'
requisite: Постановление акимата Жетысайского района Туркестанской области от 25 февраля 2019 года № 197. Зарегистрировано Департаментом юстиции Туркестанской области 4 марта 2019 года № 4919. Утратило силу постановлением акимата Жетысайского района Туркестанской области от 15 мая 2020 года № 277 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих научете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Жетысайского района
  kaz: Жетісай ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

requisite: Постановление акимата Туркестанской области от 25 декабря 2019 года № 300. Зарегистрировано Департаментом юстиции Туркестанской области 25 декабря 2019 года № 5320. Утратило силу постановлением акимата Туркестанской области от 23 июля 2025 года № 158 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении прейскуранта цен на реализуемые товары (работы, услуги), оказываемые государственными архивами управления цифровизации, оказания государственных услуг и архивов Туркестанской области
  kaz: Түркістан облысының цифрландыру, мемлекеттік қызметтер көрсету және архивтер басқармасының мемлекеттік архивтерімен көрсетіліп, өткізілетін тауарлардың (жұмыстардың, көрсетілетін қызметтердің) баға прейскурантын бекіту туралы

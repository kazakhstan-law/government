    kaz: Түркістан облысы Түркістан қаласы әкімдігінің 2019 жылғы 8 мамырдағы № 532 «Сайлау өткізу кезеңінде кандидаттардың үгіттік баспа материалдарын орналастыратын орындарды және сайлаушылармен кездесу өткізу үшін үй-жайларды белгілеу туралы» қаулысына өзгерістер енгізу туралы

act_code: '135890'
requisite: Постановление акимата города Кентау Туркестанской области от 7 ноября 2019 года № 531. Зарегистрировано Департаментом юстиции Туркестанской области 8 ноября 2019 года № 5239
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования города Кентау
  kaz: Кентау қаласының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

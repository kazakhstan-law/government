act_code: '133810'
requisite: Постановление акимата Отрарского района Туркестанской области от 23 мая 2019 года № 187. Зарегистрировано Департаментом юстиции Туркестанской области 24 мая 2019 года № 5072. Утратило силу постановлением акимата Отрарского района Туркестанской области от 29 мая 2020 года № 137 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Отрарского района
  kaz: Отырар ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу турал

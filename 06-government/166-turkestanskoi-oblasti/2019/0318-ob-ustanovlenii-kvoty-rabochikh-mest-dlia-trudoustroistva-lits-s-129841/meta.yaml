act_code: '129841'
requisite: Постановление акимата Мактааральского района Туркестанской области от 18 марта 2019 года № 183. Зарегистрировано Департаментом юстиции Туркестанской области 19 марта 2019 года № 4938. Утратило силу постановлением акимата Мактааральского района Туркестанской области от 4 мая 2020 года № 186 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Мактааральского района
  kaz: Мақтаарал ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білімберу ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

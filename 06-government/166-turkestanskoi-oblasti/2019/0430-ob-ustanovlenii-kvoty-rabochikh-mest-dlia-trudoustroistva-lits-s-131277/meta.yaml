act_code: '131277'
requisite: Постановление акимата Сайрамского района Туркестанской области от 30 апреля 2019 года № 200. Зарегистрировано Департаментом юстиции Туркестанской области 4 мая 2019 года № 5028. Утратило силу постановлением акимата Сайрамского района Туркестанской области от 7 сентября 2020 года № 363 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Сайрамского района
  kaz: Сайрам ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

    kaz: Мақтаарал ауданы әкімдігінің 2019 жылғы 8 мамырдағы «Сайлау өткізу кезеңінде кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды және сайлаушылармен кездесу үшін үй-жайларды белгілеу туралы» № 331 қаулысын өзгерістер мен толықтырулар енгізу туралы

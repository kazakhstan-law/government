requisite: Постановление акимата Сарыагашского района Туркестанской области от 11 января 2019 года № 14. Зарегистрировано Департаментом юстиции Туркестанской области 14 января 2019 года № 4886. Утратило силу постановлением акимата Сарыагашского района Туркестанской области от 1 июля 2020 года № 162 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из  мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және  ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата анасының қамқорлығынсыз қалған, білім беру ұйымдарының  түлектері болып табылатын жастар қатарындағы азаматтарды,жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

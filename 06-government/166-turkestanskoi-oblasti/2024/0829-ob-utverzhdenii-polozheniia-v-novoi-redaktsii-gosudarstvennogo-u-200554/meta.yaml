  kaz: «Созақ ауданы әкімінің аппараты» мемлекеттік мекемесі, Созақ ауданының ауылдық округтері мен кенттері әкімінің аппараттары және Созақ ауданы әкімдігінің дербес бөлімдері мемлекеттік мекемелерінің ережелерін жаңа редакцияда бекіту туралы

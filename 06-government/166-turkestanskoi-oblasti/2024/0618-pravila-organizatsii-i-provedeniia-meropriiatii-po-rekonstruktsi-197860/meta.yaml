  title:
    rus: О внесении изменений в постановление акимата Казыгуртского района от 18 июня 2024 года № 191 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика в селе Казыгурт, Жанабазар, Рабат, Казыгуртского района Туркестанской области»
    kaz: Қазығұрт ауданы әкімдігінің 2024 жылғы 18 маусымдағы № 191 «Түркістан облысы, Қазығұрт ауданының, Қазығұрт, Жаңабазар, Рабат елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер ензігу туралы

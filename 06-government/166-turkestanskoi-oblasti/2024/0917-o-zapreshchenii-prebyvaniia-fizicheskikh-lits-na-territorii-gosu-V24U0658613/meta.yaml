title:
  rus: О запрещении пребывания физических лиц на территории государственного лесного фонда и ограничении права лесопользования при проведении авиахимических, авиабиологических и аэрозольных мероприятий по борьбе с вредителями и болезнями леса, а также в периоды высокой пожарной опасности в лесу
  kaz: Орман зиянкестерi мен ауруларына қарсы күресте авиахимиялық, авиабиологиялық және аэрозольдық iс-шаралар жүргiзген кезде, сондай-ақ орманда өрт қаупi жоғары болып тұрған кезеңдерде жеке тұлғалардың мемлекеттік орман қоры аумағында болуына тыйым салу және орман пайдалану құқығын шектеу туралы

    rus: О внесении изменений в постановление акимата Созакского района от 29 августа 2024 года № 214 «Об утверждении положения в новой редакции государственного учреждения «Аппарат акима Созакского района», аппаратов сельских округов и поселков Созакского района и государственным учреждениям ссамостоятельных отделов акимата Созакского района»

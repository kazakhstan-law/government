title:
  rus: Об утверждении положения в новой редакции государственного учреждения «Аппарат акима Созакского района», аппаратов сельских округов и поселков Созакского района и государственным учреждениям самостоятельных отделов акимата Созакского района
  kaz: «Созақ ауданы әкімінің аппараты» мемлекеттік мекемесі, Созақ ауданының ауылдық округтері мен кенттері әкімінің аппараттары және Созақ ауданы әкімдігінің дербес бөлімдері мемлекеттік мекемелерінің ережелерін жаңа редакцияда бекіту туралы

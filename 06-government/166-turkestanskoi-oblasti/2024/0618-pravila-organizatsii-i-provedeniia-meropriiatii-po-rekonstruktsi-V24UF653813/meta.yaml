title:
  rus: Правила организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен многоквартирных жилых домов, направленных на придание единого архитектурного облика в селе Казыгурт, Жанабазар, Рабат, Казыгуртского района Туркестанской области, утвержденный указанным постановлением, изложить в новой редакции согласно приложению к настоящему постановлению
  kaz: Түркістан облысы, Қазығұрт ауданының, Қазығұрт, Жаңабазар, Рабат елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидалары бекіту туралы

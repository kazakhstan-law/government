    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2008 жылғы 1 желтоқсандағы № 426 "Ауылдық (селолық) жерлерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандары лауазымдарының тізбесін анықтау туралы" қаулысына өзгерістер енгізу туралы

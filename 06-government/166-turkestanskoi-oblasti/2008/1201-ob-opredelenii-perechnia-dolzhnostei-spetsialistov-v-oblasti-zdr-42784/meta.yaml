requisite: Постановление акимата Южно-Казахстанской области от 1 декабря 2008 года N 426. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 декабря 2008 года за N 2000. Утратило силу постановлением акимата Южно-Казахстанской области от 28 декабря 2015 года № 438
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін анықтау туралы

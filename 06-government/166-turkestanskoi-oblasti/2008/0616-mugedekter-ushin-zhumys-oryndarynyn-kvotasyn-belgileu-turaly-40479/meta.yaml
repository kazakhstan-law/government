requisite: Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2008 жылғы 16 маусымдағы N 245 қаулысы. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2008 жылғы 8 шілдеде N 14-15-61 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2012 жылғы 10 ақпандағы № 70 Қаулысымен

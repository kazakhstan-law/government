requisite: Оңтүстік Қазақстан облысы Отырар ауданы әкімдігінің 2008 жылғы 22 желтоқсандағы N 295 қаулысы. Оңтүстік Қазақстан облысы Отырар ауданының Әділет басқармасында 2009 жылғы 19 қаңтарда N 14-9-71 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Отырар ауданы әкімдігінің 2013 жылғы 29 шілдедегі № 355 қаулысымен

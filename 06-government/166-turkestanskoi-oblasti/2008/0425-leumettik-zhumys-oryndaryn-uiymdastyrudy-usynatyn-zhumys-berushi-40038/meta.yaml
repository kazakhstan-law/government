requisite: Оңтүстік Қазақстан облысы Созақ ауданы әкімдігінің 2008 жылғы 25 сәуірдегі N 176 қаулысы. Оңтүстік Қазақстан облысы Созақ ауданының Әділет басқармасында 2008 жылғы 11 маусымда N 14-12-59 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Созақ ауданы әкімдігінің 2011 жылғы 21 желтоқсандағы N 451 Қаулысымен

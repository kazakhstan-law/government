act_code: '41991'
requisite: Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2008 жылғы 29 қыркүйектегі N 399 қаулы. Оңтүстік Қазақстан облысы Ордабасы ауданының Әділет басқармасында 2008 жылғы 21 қазанда N 14-8-58 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2009 жылғы 11 қыркүйектегі N 417 қаулысымен
title:
  rus: Бөржар, Қарақұм және Жеңіс ауыл округтеріне қарасты Жамбыл, Бірлік, Қайнар, Қалаш, Теспе, Ұялыжар, Ықластемір, Ынтымақ, Қарақұм, Женіс, Дихан елді мекендерінде уақ малдар арасында бруцеллез (сарып) ауыруының тіркелуіне байланысты карантиндік аймақтың ветеринариялық режимін белгілеу туралы

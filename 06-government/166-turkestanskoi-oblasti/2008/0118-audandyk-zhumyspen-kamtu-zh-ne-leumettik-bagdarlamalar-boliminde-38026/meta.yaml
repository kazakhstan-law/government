act_code: '38026'
requisite: Оңтүстік Қазақстан облысы Созақ ауданы әкімдігінің 2008 жылғы 18 қаңтардағы № 10 қаулысы. Оңтүстік Қазақстан облысы Созақ ауданының Әділет басқармасында 2008 жылғы 15 ақпанда № 14-12-49 болып тіркелді

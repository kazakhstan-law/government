requisite: Оңтүстік Қазақстан облысы Түлкібас ауданы әкімдігінің 2008 жылғы 5 ақпандағы N 70 Қаулысы. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2008 жылғы 13 ақпанда N 14-14-47 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түлкібас ауданы әкімдігінің 2009 жылғы 11 наурыздағы N 115 Қаулысымен

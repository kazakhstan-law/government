act_code: '44084'
requisite: Оңтүстік Қазақстан облысы Арыс қаласы әкімдігінің 2008 жылғы 24 желтоқсандағы N 690 қаулысы. Оңтүстік Қазақстан облысы Арыс қаласының Әділет басқармасында 2009 жылғы 3 ақпанда N 14-2-65 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Арыс қаласы әкімінің 2013 жылғы 24 шілдедегі № 356 қаулысымен

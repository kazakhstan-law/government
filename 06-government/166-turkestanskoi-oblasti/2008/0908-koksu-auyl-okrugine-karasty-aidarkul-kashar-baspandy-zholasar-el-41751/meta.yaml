act_code: '41751'
requisite: Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2008 жылғы 8 қыркүйектегі N 354 қаулысы. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2008 жылғы 3 қазанда N 14-15-65 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2009 жылғы 28 қыркүйектегі N 500 Қаулысымен

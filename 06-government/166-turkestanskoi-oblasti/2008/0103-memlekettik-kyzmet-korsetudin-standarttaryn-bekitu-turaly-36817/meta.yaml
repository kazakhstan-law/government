requisite: Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2008 жылғы 3 қаңтардағы N 2 Қаулысы. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2008 жылғы 15 қаңтарда N 14-15-49 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2009 жылғы 4 қыркүйектегі N 478 Қаулысымен

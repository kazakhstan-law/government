requisite: Оңтүстік Қазақстан облысы Бәйдібек ауданы әкімдігінің 2008 жылғы 29 желтоқсандағы N 475 қаулысы. Оңтүстік Қазақстан облысы Бәйдібек ауданының Әділет басқармасында 2009 жылғы 30 қаңтарда N 14-5-67 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Бәйдібек ауданы әкімдігінің 2013 жылғы 25 шілдедегі № 323 қаулысымен

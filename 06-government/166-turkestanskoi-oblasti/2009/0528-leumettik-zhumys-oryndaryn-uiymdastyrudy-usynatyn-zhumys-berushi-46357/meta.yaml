requisite: Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2009 жылғы 28 мамырдағы N 324 қаулысы. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2009 жылғы 4 маусымда N 14-15-75 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2011 жылғы 7 ақпандағы N 66 Қаулысымен

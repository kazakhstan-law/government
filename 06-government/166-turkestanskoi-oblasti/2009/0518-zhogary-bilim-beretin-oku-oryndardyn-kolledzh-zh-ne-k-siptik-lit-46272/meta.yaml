act_code: '46272'
requisite: Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2009 жылғы 18 мамырдағы N 267 қаулысы. Оңтүстік Қазақстан облысы Ордабасы ауданының Әділет басқармасында 2009 жылғы 1 маусымда N 14-8-69 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2011 жылғы 17 ақпандағы N 36 Қаулысымен

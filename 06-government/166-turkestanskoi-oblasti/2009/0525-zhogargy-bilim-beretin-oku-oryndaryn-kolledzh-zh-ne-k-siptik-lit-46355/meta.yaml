requisite: Оңтүстік Қазақстан облысы Кентау қаласы әкімдігінің 2009 жылғы 25 мамырдағы N 169 қаулысы. Оңтүстік Қазақстан облысы Кентау қаласының Әділет басқармасында 2009 жылғы 5 маусымда N 14-3-73 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Кентау қаласы әкімдігінің 2011 жылғы 14 наурыздағы N 81 Қаулысымен

requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2009 жылғы 23 қаңтардағы N 52 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 16 ақпанда N 14-10-107 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2013 жылғы 29 тамыздағы № 1511 қаулысымен

requisite: Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2009 жылғы 8 шілдедегі N 331 қаулысы. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2009 жылғы 27 шілдеде N 14-6-78 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2010 жылғы 23 қарашадағы N 512 Қаулысымен

requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2009 жылғы 19 мамырдағы N 526 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2009 жылғы 27 мамырда N 14-10-118 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2011 жылғы 2 ақпандағы N 124 қаулысымен

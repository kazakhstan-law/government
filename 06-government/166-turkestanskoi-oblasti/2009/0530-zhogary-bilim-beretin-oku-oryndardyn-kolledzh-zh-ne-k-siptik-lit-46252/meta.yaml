act_code: '46252'
requisite: Оңтүстік Қазақстан облысы Отырар ауданы әкімдігінің 2009 жылғы 30 мамырдағы N 128 Қаулысы. Оңтүстік Қазақстан облысы Отырар ауданының Әділет басқармасында 2009 жылғы 3 маусымда N 14-9-88 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Отырар ауданы әкімдігінің 2011 жылғы 22 ақпандағы N 34 Қаулысымен

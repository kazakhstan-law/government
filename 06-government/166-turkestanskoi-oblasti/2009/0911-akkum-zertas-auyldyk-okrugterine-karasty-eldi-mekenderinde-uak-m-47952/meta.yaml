requisite: Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2009 жылғы 11 қыркүйектегі N 385 қаулысы. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2009 жылғы 23 қыркүйекте N 14-13-59 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2010 жылғы 9 қарашадағы N 473 Қаулысымен

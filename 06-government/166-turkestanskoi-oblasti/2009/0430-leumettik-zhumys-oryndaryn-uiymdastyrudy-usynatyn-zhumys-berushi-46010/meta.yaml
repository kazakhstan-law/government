requisite: Оңтүстік Қазақстан облысы Мақтаарал ауданы әкімдігінің 2009 жылғы 30 сәуірдегі N 330 қаулысы. Оңтүстік Қазақстан облысы Мақтаарал ауданының Әділет басқармасында 2009 жылғы 19 мамырда N 14-7-78 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Мақтаарал ауданы әкімдігінің 2011 жылғы 24 қазандағы N 1962 қаулысымен

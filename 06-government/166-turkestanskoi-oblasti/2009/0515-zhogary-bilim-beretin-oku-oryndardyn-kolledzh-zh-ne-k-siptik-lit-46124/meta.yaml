act_code: '46124'
requisite: Оңтүстік Қазақстан облысы Созақ ауданы әкімдігінің 2009 жылғы 15 мамырдағы N 149 каулысы. Оңтүстік Қазақстан облысы Созақ ауданының Әділет басқармасында 2009 жылғы 26 мамырда N 14-12-75 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Созақ ауданы әкімдігінің 2011 жылғы 2 ақпандағы N 52 Қаулысымен

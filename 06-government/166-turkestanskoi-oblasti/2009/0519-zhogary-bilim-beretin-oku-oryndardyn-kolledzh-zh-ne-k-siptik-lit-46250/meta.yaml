act_code: '46250'
requisite: Оңтүстік Қазақстан облысы Түркістан қаласы әкімдігінің 2009 жылғы 19 мамырдағы N 1563 қаулысы. Оңтүстік Қазақстан облысы Түркістан қаласының Әділет басқармасында 2009 жылғы 27 мамырда N 14-4-68 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түркістан қаласы әкімдігінің 2011 жылғы 9 маусымдағы N 431 Қаулысымен

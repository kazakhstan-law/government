requisite: Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2009 жылғы 27 сәуірдегі N 205 қаулысы. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2009 жылғы 1 маусымда N 14-6-76 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2011 жылғы 18 қазандағы N 205 Қаулысымен

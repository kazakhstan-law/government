requisite: Оңтүстік Қазақстан облысы Түркістан қаласы әкімдігінің 2009 жылғы 28 қаңтардағы N 2 қаулысы. Оңтүстік Қазақстан облысы Түркістан қаласының Әділет басқармасында 2009 жылғы 23 ақпанда N 14-4-60 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түркістан қаласы әкімнің аппаратының 2013 жылғы 17 шілдедегі № 1236 қаулысымен

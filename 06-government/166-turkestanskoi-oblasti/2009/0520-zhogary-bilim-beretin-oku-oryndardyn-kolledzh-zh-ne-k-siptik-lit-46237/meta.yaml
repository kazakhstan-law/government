act_code: '46237'
requisite: Оңтүстік Қазақстан облысы Түлкібас ауданды әкімдігінің 2009 жылғы 20 мамырдағы N 256 қаулысы. Оңтүстік Қазақстан облысы Түлкібас ауданының Әділет басқармасында 2009 жылғы 27 мамырда N 14-14-79 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түлкібас ауданы әкімдігінің 2011 жылғы 12 шілдедегі N 414 Қаулысымен

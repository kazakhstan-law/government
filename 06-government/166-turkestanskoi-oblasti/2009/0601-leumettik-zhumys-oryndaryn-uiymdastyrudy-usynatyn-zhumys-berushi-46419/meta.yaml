requisite: Оңтүстік Қазақстан облысы Арыс қаласы әкімдігінің 2009 жылғы 1 маусымдағы N 250 Қаулысы. Оңтүстік Қазақстан облысы Арыс қаласының Әділет басқармасында 2009 жылғы 5 маусымда N 14-2-74 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Арыс қаласы әкімдігінің 2011 жылғы 27 қазандағы N 470 Қаулысымен

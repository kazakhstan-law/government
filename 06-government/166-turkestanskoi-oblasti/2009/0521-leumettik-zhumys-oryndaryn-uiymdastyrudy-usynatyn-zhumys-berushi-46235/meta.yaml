requisite: Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2009 жылғы 21 мамырдағы N 245 қаулысы. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2009 жылғы 2 маусымда N 14-13-56 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2011 жылғы 3 қарашадағы N 463 Қаулысымен

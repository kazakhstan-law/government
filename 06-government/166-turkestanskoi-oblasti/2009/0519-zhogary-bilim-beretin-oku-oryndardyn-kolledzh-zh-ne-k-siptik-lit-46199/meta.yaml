requisite: Оңтүстік Қазақстан облысы Мақтаарал ауданы әкімдігінің 2009 жылғы 19 мамырдағы N 373 қаулысы. Оңтүстік Қазақстан облысы Мақтаарал ауданының Әділет басқармасында 2009 жылғы 28 мамырда N 14-7-79 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Мақтаарал ауданы әкімдігінің 2011 жылғы 14 ақпандағы N 187 Қаулысымен

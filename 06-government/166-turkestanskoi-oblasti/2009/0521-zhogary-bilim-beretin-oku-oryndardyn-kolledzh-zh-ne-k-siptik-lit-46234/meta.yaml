act_code: '46234'
requisite: Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2009 жылғы 21 мамырдағы N 244 қаулысы. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2009 жылғы 2 маусымда N 14-13-55 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2011 жылғы 28 ақпандағы N 123 қаулысымен

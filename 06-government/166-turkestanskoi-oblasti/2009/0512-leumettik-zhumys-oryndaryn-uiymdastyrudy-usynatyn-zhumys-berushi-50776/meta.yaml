requisite: Оңтүстік Қазақстан облысы Бәйдібек ауданы әкімдігінің 2009 жылғы 12 мамырдағы N 224 қаулысы. Оңтүстік Қазақстан облысы Бәйдібек ауданының Әділет басқармасында 2009 жылғы 29 мамырда N 14-5-79 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Бәйдібек ауданы әкімдігінің 2010 жылғы 2 маусымдағы N 208 қаулысымен

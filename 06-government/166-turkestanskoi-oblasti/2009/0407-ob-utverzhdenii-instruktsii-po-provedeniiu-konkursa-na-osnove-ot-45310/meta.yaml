title:
  rus: Об утверждении Инструкции по проведению конкурса на основе открытого тендера по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по социально значимым межрайонным (междугородним) внутриобластным сообщениям, убытки которых подлежат субсидированию из областного бюджета
  kaz: Шығындары облыстық бюджеттен  субсидиялануға жататын әлеуметтік маңызды ауданаралық (қалааралық) облысішілік қатынастар бойынша темір жолмен жолаушылар тасымалдарын жүзеге асыратын тасымалдаушыларды ашық тендер  негізінде анықтау жөніндегі конкурсты өткізу бойынша Нұсқаулықты бекіту туралы

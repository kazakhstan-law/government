  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 7 апреля 2009 года № 90 "Об утверждении Инструкции по проведению конкурса на основе открытого тендера по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по социально значимым межрайонным (междугородним) внутриобластным сообщениям, убытки которых подлежат субсидированию из областного бюджета"
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2009 жылғы 7 сәуірдегі № 90 "Шығындары облыстық бюджеттен субсидиялануға жататын әлеуметтік маңызды ауданаралық (қалааралық) облысішілік қатынастар бойынша темір жолмен жолаушылар тасымалдарын жүзеге асыратын тасымалдаушыларды ашық тендер негізінде анықтау жөніндегі конкурсты өткізу бойынша Нұсқаулықты бекіту туралы" қаулысына өзгерістер енгізу туралы

requisite: Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2009 жылғы 19 ақпандағы N 72 қаулысы. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2009 жылғы 18 наурызда N 14-6-69 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2009 жылғы 30 қыркүйектегі N 451 Қаулысымен

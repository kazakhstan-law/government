title:
  rus: Об утверждении Правил предоставления субъектам малого предпринимательства в имущественный наем (аренду) или доверительное управление с правом последующей безвозмездной передачи в собственность неиспользуемых объектов коммунальной собственности
  kaz: Шағын кәсіпкерлік субъектілеріне коммуналдық меншіктің пайдаланылмайтын объектілерін кейіннен меншікке өтеусіз беру құқығымен мүліктік жалға алуға (жалға беруге) немесе сенімгерлік басқаруға беру ережесін бекіту туралы

title:
  rus: О проведении конкурсов (тендеров) по предоставлению права ведения охотничьего хозяйства, закреплению охотничьих угодий (участков) и распределению между охотпользователями по Южно-Казахстанской области
  kaz: Оңтүстік Қазақстан облысы бойынша аңшылықты пайдаланушылар арасында аңшылық шаруашылығын жүргізу құқығын беру, аңшылық алқаптарын (учаскелерін) бекіту және үлестіру жөнінде конкурс (тендер) өткізу туралы

    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2015 жылғы 22 сәуірдегі № 114 «Түркістан облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Южно-Казахстанской области от 22 апреля 2015 года № 114 «Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в Южно-Казахстанской области»
    kaz: Оңтүстік Қазақстан облыстық әкімдігінің 2015 жылғы 22 сәуірдегі № 114 «Оңтүстік Қазақстан облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

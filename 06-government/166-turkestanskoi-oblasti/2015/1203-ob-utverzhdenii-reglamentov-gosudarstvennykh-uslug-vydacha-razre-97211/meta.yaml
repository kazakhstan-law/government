  requisite: Постановление акимата Туркестанской области от 30 октября 2019 года № 249. Зарегистрировано Департаментом юстиции Туркестанской области 5 ноября 2019 года № 5237. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 3 декабря 2015 года № 367 «Об утверждении регламентов государственных услуг «Выдача разрешения на использование подземных вод питьевого качества для целей, не связанных с питьевым и хозяйственно-бытовым водоснабжением на территориях, где отсутствуют поверхностные водные объекты, но имеются достаточные запасы подземных вод питьевого качества», «Предоставление водных объектов в обособленное или совместное пользование на конкурсной основе»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2015 жылғы 3 желтоқсандағы № 367 «Жерүсті су объектілері жоқ, бірақ ауызсу сапасындағы жерасты суларының жеткілікті қоры бар аумақтарда ауызсумен және шаруашылық-тұрмыстық сумен жабдықтауға байланысты емес мақсаттар үшін ауызсу сапасындағы жерасты суларын пайдалануға рұқсат беру», «Су объектілерін оқшауланған немесе бірлесіп пайдалануға конкурстық негізде беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/135807/rus

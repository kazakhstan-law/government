requisite: Постановление акимата Ордабасынского района Южно-Казахстанской области от 27 июля 2015 года № 329. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 14 августа 2015 года № 3318. Утратило силу постановлением акимата Ордабасынского района Южно-Казахстанской области от 29 апреля 2016 года № 180
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстқы-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

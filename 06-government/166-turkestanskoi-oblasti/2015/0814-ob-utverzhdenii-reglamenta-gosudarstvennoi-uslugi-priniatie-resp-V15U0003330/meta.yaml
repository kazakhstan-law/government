title:
  rus: Об утверждении регламента государственной услуги «Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения в порядке, определяемом Правительством Республики Казахстан»
  kaz: «Мемлекеттік емес заңды тұлғалардың және жеке тұлғалардың мүлікке құқығын сыйға беру шарты бойынша Қазақстан Республикасының Үкіметі белгілеген тәртіппен Қазақстан Республикасының қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

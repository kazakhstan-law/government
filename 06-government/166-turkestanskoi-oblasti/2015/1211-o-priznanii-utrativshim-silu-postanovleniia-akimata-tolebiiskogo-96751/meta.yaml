title:
  rus: О признании утратившим силу постановления акимата Толебийского района №298 от 02 июля 2015 года «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Толебийского района»
  kaz: «Төлеби ауданының шалғайдағы елдi мекендерінде тұратын балаларды жалпы бiлiм беретiн мектептерге тасымалдаудың схемасы мен тәртiбiн бекіту туралы» Төлеби ауданы әкімдігінің 02 шілде 2015 жылғы №298 қаулысының күшін жою туралы

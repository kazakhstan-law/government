title:
  rus: Об установлении охранной зоны, размеров, границ, видов режима и порядка природопользования в охранной зоне коммунального государственного учреждения «Сырдарья-Туркестанский государственный региональный природный парк» управления природных ресурсов и регулирования природопользования Туркестанской области
  kaz: Түркістан облысының табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Сырдария-Түркістан мемлекеттік өңірлік табиғи паркі» коммуналдық мемлекеттік мекемесінің қорғау аймағын белгілеу, қорғау аймағында табиғат пайдаланудың мөлшері, шекарасы, режим түрлері және тәртібі туралы

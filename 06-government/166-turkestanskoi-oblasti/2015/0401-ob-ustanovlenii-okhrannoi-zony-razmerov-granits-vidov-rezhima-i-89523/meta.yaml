  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 1 апреля 2015 года № 82 «Об установлении охранной зоны, размеров, границ, видов режима и порядка природопользования в охранной зоне коммунального государственного учреждения «Сырдарья-Туркестанский государственный региональный природный парк» управления природных ресурсов и регулирования природопользования Южно-Казахстанской области»
    kaz: Оңтүстiк Қазақстан облысы әкiмдiгiнiң 2015 жылғы 1 сәуірдегі № 82 «Оңтүстік Қазақстан облысының табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Сырдария-Түркістан мемлекеттік өңірлік табиғи паркі» коммуналдық мемлекеттік мекемесінің қорғау аймағын белгілеу, қорғау аймағында табиғат пайдаланудың мөлшері, шекарасы, режим түрлері және тәртібі туралы» қаулысына өзгерістер енгізу туралы

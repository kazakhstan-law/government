title:
  rus: Об признании утратившим силу постановлений районного акимата от 11 декабря 2013 года №618 «Об утверждении Правил Служебной этики государственных служащих аппарата акима Ордабасынского района и исполнительных органов, финансируемых из районного бюджета»
  kaz: Аудан әкімдігінің 11.12.2013 жылғы «Ордабасы ауданы әкімі аппаратының, аудан әкімі аппараты және қалалық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілерінің қызмет этикасының қағидаларын бекіту туралы» №618 қаулысын күшін жою туралы

requisite: Постановление акимата Ордабасынского района Южно-Казахстанской области от 15 апреля 2015 года № 182. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 29 апреля 2015 года № 3164. Утратило силу постановлением акимата Ордабасынского района Южно-Казахстанской области от 25 января 2016 года № 24
title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих аппарата акима Ордабасынcкого района и административных государственных служащих исполнительных органов, финансируемых из районного бюджета и аппаратов акима сельских округов корпуса «Б»
  kaz: «Б» корпусындағы Ордабасы ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілері мен аудандық бюджеттен қаржыландырылатын атқарушы органдардың және ауыл округі әкімі аппараттарының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

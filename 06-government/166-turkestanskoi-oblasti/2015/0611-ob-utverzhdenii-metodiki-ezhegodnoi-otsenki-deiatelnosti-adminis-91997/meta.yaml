requisite: Постановление акимата Толебийского района Южно-Казахстанской области от 11 июня 2015 года № 265. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 июля 2015 года № 3242. Утратило силу постановлением акимата Толебийского района Южно-Казахстанской области от 2 февраля 2016 года № 31
title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета, аппаратов акима города, села, сельских округов и административных государственных служащих аппарата акима Толебийского района корпуса «Б»
  kaz: «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың, қала, ауыл, ауылдық округ әкімі аппараттарының мемлекеттік әкімшілік қызметшілерімен Төлеби ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

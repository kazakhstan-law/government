requisite: Постановление акимата города Туркестан Южно-Казахстанской области от 3 июня 2015 года № 704. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 29 июня 2015 года № 3223. Утратило силу постановлением акимата города Туркестан Южно-Казахстанской области от 27 января 2016 года № 30
title:
  rus: Об утверждении методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из городского бюджета, аппаратов акима сельских округов и административных государственных служащих аппарата акима города Туркестан корпуса «Б»
  kaz: «Б» корпусындағы қалалық бюджеттен қаржыландырылатын атқарушы органдардың, ауылдық округ әкімі аппараттарының мемлекеттік әкімшілік қызметшілері мен Түркістан қаласы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

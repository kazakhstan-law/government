  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 22 октября 2015 года № 336 «Об утверждении регламента государственной услуги «Выдача разрешения на размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения»
    kaz: «Облыстық және аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарына бөлінген белдеуде, жарнаманы тұрақты орналастыру объектілерінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы» Оңтүстік Қазақстан облысы әкімдігінің 2015 жылғы 22 қазандағы № 336 қаулысына өзгерістер енгізу туралы

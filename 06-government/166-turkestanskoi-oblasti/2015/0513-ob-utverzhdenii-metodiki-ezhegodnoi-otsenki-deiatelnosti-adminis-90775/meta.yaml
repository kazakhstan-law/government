requisite: Постановление акимата Сайрамского района Южно-Казахстанской области от 13 мая 2015 года № 362. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 17 июня 2015 года № 3213. Утратило силу постановлением акимата Сайрамского района Южно-Казахстанской области от 27 января 2016 года № 77
title:
  rus: 'Об утверждении Методики ежегодной оценки деятельности административных государственных служащих аппарата акима Сайрамcкого района и административных государственных служащих исполнительных органов, финансируемых из районного  бюджета и аппаратов акима сельских округов корпуса «Б» '
  kaz: '«Б» корпусындағы Сайрам ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілері мен аудандық бюджеттен қаржыландырылатын атқарушы органдардың және ауыл округі әкімі аппараттарының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы '

act_code: '95429'
requisite: Постановление акимата Южно-Казахстанской области от 9 октября 2015 года № 322. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 30 октября 2015 года № 3402. Утратило силу постановлением акимата Южно-Казахстанской области от 20 июня 2017 года № 164
title:
  rus: Об утверждении регламента государственной услуги «Аттестация специалистов с медицинским образованием для осуществления реализации лекарственных средств, изделий медицинского назначения в отдаленных от районного центра населенных пунктах через аптечные пункты в организациях здравоохранения, оказывающих первичную медико-санитарную, консультативно-диагностическую помощь, и передвижные аптечные пункты, в случае отсутствия специалиста с фармацевтическим образованием»
  kaz: «Аудандық орталықтан алыс елді мекендердегі бастапқы медициналық-санитариялық, консультациялық диагностикалық көмек көрсететін денсаулық сақтау ұйымдарының дәріхана пункттері арқылы және фармацевтикалық білімі бар маман болмаған жағдайда жылжымалы дәріхана пункттері арқылы дәрілік заттар мен медициналық мақсаттағы бұйымдарды өткізуді жүзеге асыру үшін медициналық білімі бар мамандарды аттестаттау» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы

act_code: '89608'
requisite: Постановление акимата Шардаринского района Южно-Казахстанской области от 20 апреля 2015 года № 161. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 13 мая 2015 года № 3175. Утратило силу постановлением акимата Шардаринского района Южно-Казахстанской области от 19 января 2016 года № 12
title:
  rus: 'Об утверждении Методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета, аппаратов акима сельских округов, города Шардара и административных государственных служащих аппарата акима Шардаринского района корпуса «Б» '
  kaz: '«Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың, Шардара қаласы, ауылдық округтер әкімі аппараттарының мемлекеттік әкімшілік қызметшілері мен Шардара ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы '

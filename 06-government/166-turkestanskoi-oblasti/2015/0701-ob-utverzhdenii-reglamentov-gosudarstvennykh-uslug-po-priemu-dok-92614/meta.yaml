  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 1 июля 2015 года № 200 «Об утверждении регламентов государственных услуг по приему документов для участия в конкурсах на присуждение звания «Лучший педагог» и на замещение руководителей государственных учреждений среднего образования»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2015 жылғы 1 шілдедегі № 200 «Үздік педагог» атағын беру және мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурстарына қатысу үшін құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» қаулысына өзгерістер енгізу туралы

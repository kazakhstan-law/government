act_code: '92614'
requisite: Постановление акимата Южно-Казахстанской области от 1 июля 2015 года № 200. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 31 июля 2015 года № 3298. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг по приему документов для участия в конкурсах на присуждение звания «Лучший педагог» и на замещение руководителей государственных учреждений среднего образования
  kaz: «Үздік педагог» атағын беру және мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурстарына қатысу үшін құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 14 августа 2015 года № 246 «Об утверждении регламента государственной услуги «Выдача и продление разрешения на привлечение иностранной рабочей силы работодателям для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы, либо в рамках внутрикорпоративного перевода»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2015 жылғы 14 тамыздағы № 246 «Жұмыс берушілерге тиісті әкімшілік-аумақтық бірліктің аумағында еңбек қызметін жүзеге асыру үшін не корпоративішілік ауыстыру шеңберінде шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

act_code: '94049'
requisite: Постановление акимата Южно-Казахстанской области от 14 августа 2015 года № 246. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 25 августа 2015 года № 3326. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача и продление разрешения на привлечение иностранной рабочей силы работодателям для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы, либо в рамках внутрикорпоративного перевода»
  kaz: «Тиісті әкімшілік-аумақтық бірліктің аумағында немесе корпоративішілік ауыстыру шеңберінде еңбек қызметін жүзеге асыру үшін жұмыс берушілерге шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы

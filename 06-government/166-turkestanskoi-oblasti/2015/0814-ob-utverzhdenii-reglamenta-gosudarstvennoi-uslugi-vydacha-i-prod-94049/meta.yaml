  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 14 августа 2015 года №246 «Об утверждении регламента государственной услуги «Выдача и продление разрешения иностранному работнику на трудоустройство и работодателям на привлечение иностранной рабочей силы для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2015 жылғы 14 тамыздағы №246 «Шетелдік қызметкерге жұмысқа орналасуға және жұмыс берушілерге тиісті әкімшілік-аумақтық бірлік аумағында еңбек қызметін жүзеге асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

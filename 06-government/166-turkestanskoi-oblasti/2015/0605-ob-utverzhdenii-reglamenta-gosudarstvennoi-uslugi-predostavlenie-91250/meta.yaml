  title:
    rus: О внесении изменений и дополнения в постановление акимата Южно-Казахстанской области от 5 июня 2015 года №165 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2015 жылғы 5 маусымдағы №165 «Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік жолдау шараларын ұсыну» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы» қаулысына өзгерістер мен толықтыру енгізу туралы

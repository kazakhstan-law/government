act_code: '92085'
requisite: Постановление акимата Мактааральского района Южно-Казахстанской области от 9 июля 2015 года № 776. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 23 июля 2015 года № 3279. Утратило силу постановлением акимата Мактааральского района Южно-Казахстанской области от 19 января 2016 года № 29
title:
  rus: 'Об утверждении Методики ежегодной оценки деятельности административных государственных служащих аппарата акима Мактааральского района, аппаратов акимов города Жетысай, поселков, сельских округов и исполнительных органов, финансируемых из районного бюджета корпуса «Б» '
  kaz: '«Б» корпусындағы Мақтарал ауданы әкімі аппараты, Жетісай қаласы, кенттер, ауылдық округтер әкімі аппараттары мен аудандық бюджеттен қаржыландырылатын атқарушы органдары мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы  бағалау әдістемесін бекіту туралы '

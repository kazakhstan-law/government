  title:
    rus: О внесении изменений и дополнений в постановление акимата Шардаринского района от 8 января 2015 года №3 «О переименовании государственных учреждений аппаратов акима города Шардара, сельских округов  Шардаринского района и утверждении их положений»
    kaz: «Шардара ауданының Шардара қаласы, ауылдық округтер әкімі аппараттары мемлекеттік мекемелерін қайта атау және олардың ережелерін бекіту туралы» Шардара ауданы әкімдігінің 8 қаңтар 2015 жылғы №3 қаулысына өзгерістер мен толықтырулар енгізу туралы

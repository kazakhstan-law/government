act_code: '87321'
requisite: Постановление акимата Шардаринского района Южно-Казахстанской области от 26 января 2015 года № 33. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 26 февраля 2015 года № 3058. Утратило силу постановлением акимата Шардаринского района Южно-Казахстанской области от 8 апреля 2015 года № 145
title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих аппарата акима Шардаринского района, аппаратов акима сельских округов, города Шардара и испольнительных органов, финансируемых из районного бюджета корпуса "Б"
  kaz: Шардара ауданы әкімі аппаратының, Шардара қаласы, ауылдық округтер әкімі аппараттарының және аудандық бюджеттен қаржыландырылатын атқарушы органдардың "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата Сарыагашского района Южно-Казахстанской области от 16 апреля 2015 года № 228. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 мая 2015 года № 3183. Утратило силу постановлением акимата Сарыагашского района Южно-Казахстанской области от 21 января 2016 года № 20
title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета, аппаратов акима города, поселка, села, сельских округов и административных государственных служащих аппарата акима Сарыагашского района корпуса «Б»
  kaz: «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың, қала, кент, ауыл, ауылдық округтер әкімі аппараттарының мемлекеттік әкімшілік қызметшілері мен Сарыағаш ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата города Арыс Южно-Казахстанской области от 20 мая 2015 года № 282. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 19 июня 2015 года № 3214. Утратило силу постановлением акимата города Арыс Южно-Казахстанской области от 20 января 2016 года № 22
title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из городского бюджета, аппаратов акима сельских округов и административных государственных служащих аппарата акима города Арыс корпуса «Б»
  kaz: '«Б» корпусындағы қалалық бюджеттен қаржыландырылатын атқарушы органдардың, ауылдық округ әкімі аппараттарының мемлекеттік әкімшілік қызметшілері мен Арыс қаласы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін  жыл сайынғы бағалаудың әдістемесін бекіту туралы '

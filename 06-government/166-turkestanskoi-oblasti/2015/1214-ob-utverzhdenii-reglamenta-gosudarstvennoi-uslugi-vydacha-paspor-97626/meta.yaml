act_code: '97626'
requisite: Постановление акимата Южно-Казахстанской области от 14 декабря 2015 года № 387. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 15 января 2016 года № 3527. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача паспорта готовности энергопроизводящим и энергопередающим организациям с установленной электрической мощностью 5 МВт и менее, свыше 5 МВт или с установленной тепловой мощностью 100 Гкал/час и выше, а также имеющим на своем балансе электрические сети напряжением 35 кВ и ниже, 110 кВ и выше к работе в осенне-зимних условиях»
  kaz: «Белгіленген электр қуаты 5 МВт және одан төмен, 5 МВт-тан жоғары немесе белгіленген жылу қуаты 100 Гкал/сағ және одан жоғары, сондай-ақ өз балансында кернеуі 35 кВ және одан төмен, 110 кВ және одан жоғары электр желілері бар энергия өндіруші және энергия беруші ұйымдарға күзгі-қысқы жағдайларда жұмысқа әзірлік паспортын беру» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы

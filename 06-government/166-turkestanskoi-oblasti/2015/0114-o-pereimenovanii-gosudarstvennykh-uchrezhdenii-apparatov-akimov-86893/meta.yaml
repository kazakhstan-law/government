    kaz: «Сайрам ауданының ауыл округтері әкімдері аппараттары мемлекеттік мекемелерін қайта атау және олардың ережелерін бекіту туралы» Сайрам ауданы әкімдігінің 14 қаңтар 2015 жылғы № 55 қаулысына өзгерістер мен толықтырулар енгізу туралы

requisite: Постановление акимата Казыгуртского района Южно-Казахстанской области от 5 марта 2015 года № 82. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 15 апреля 2015 года № 3128. Утратило силу постановлением акимата Казыгуртского района Южно-Казахстанской области от 26 января 2016 года № 27
title:
  rus: 'Об утверждении Методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета, аппаратов акима села, сельских округов и административных государственных служащих аппарата акима Казыгуртского района корпуса «Б» '
  kaz: '«Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың, ауыл, ауылдық округ әкімі аппараттарының мемлекеттік әкімшілік қызметшілері мен Қазығұрт ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы '

title:
  rus: Об утверждении видов субсидируемых гербицидов и норм субсидий на 1 литр (килограмм) гербицидов, приобретенных у поставщиков гербицидов и видов субсидируемых биоагентов (энтомофагов) и биопрепаратов и норм субсидий на 1 грамм (штук) биоагентов (энтомофагов) и биопрепаратов, приобретенных у поставщиков биоагентов (энтомофагов) и биопрепаратов
  kaz: Субсидияланатын гербицидтердің түрлері және гербицид жеткiзушiлерден сатып алынған гербицидтердiң 1 литрiне (килограмына) арналған субсидиялар нормалары және субсидияланатын биоагенттер (энтомофагтар) мен биопрепараттардың түрлері және биоагенттер (энтомофагтар) мен биопрепараттарды жеткізушілерден сатып алынған биоагенттердің (энтомофагтардың) және биопрепараттардың 1 граммына (данасына) арналған субсидиялар нормаларын бекіту туралы

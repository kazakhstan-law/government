act_code: '93895'
requisite: Постановление от 17.09.2015 № 274, Акимат Южно-Казахстанской области
title:
  rus: О признании утратившим силу постановления акимата Южно-Казахстанской области от 16 сентября 2014 года № 297 «Об установлении объемов субсидий на удешевление сельскохозяйственным товаропроизводителям стоимости гербицидов, биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур»
  kaz: Оңтүстік Қазақстан облысы әкімдігінің 2014 жылғы 16 қыркүйектегі № 297 «Ауыл шаруашылығы тауарларын өндірушілерге ауылшаруашылық дақылдарын өңдеуге арналған гербицидтердің, биоагенттердің (энтомофагтардың) және биопрепараттардың құнын арзандатуға субсидиялар көлемдерін белгілеу туралы» қаулысының күшін жою туралы

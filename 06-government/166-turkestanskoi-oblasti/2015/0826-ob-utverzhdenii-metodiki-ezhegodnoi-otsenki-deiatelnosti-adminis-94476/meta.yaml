requisite: Постановление акимата Байдибекского района Южно-Казахстанской области от 26 августа 2015 года № 425. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 30 сентября 2015 года № 3346. Утратило силу постановлением акимата Байдибекского района Южно-Казахстанской области от 26 января 2016 года № 08
title:
  rus: 'Об утверждении Методики ежегодной оценки деятельности административных государственных служащих аппарата акима Байдибекского района и административных государственных служащих исполнительных органов, финансируемых из районного  бюджета и аппаратов акима сельских округов корпуса «Б» '
  kaz: «Б» корпусындағы Бәйдібек ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілері мен аудандық бюджеттен қаржыландырылатын атқарушы органдардың және ауыл округі әкімі аппараттарының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

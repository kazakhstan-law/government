act_code: '90958'
requisite: Постановление акимата Южно-Казахстанской области от 12 июня 2015 года № 167. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 23 июня 2015 года № 3218
title:
  rus: 'О мерах по реализации приказа исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 27 февраля 2015 года №4-3/177 «Об утверждении Правил субсидирования повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте»  '
  kaz: «Басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2015 жылғы 27 ақпандағы №4-3/177 бұйрығын іске асыру туралы

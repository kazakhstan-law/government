requisite: Постановление акимата Южно-Казахстанской области от 4 декабря 2015 года № 376. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 8 января 2016 года № 3518. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Определение соответствия (несоответствия) потенциального поставщика услуг гарантированного объема бесплатной медицинской помощи предявляемым требованиям»
  kaz: «Тегін медициналық көмектің кепілдік берілген көлемін көрсету жөніндегі қызметтер берушінің қойылатын талаптарға сәйкестігін (сәйкес еместігін) анықтау» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы

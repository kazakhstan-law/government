  title:
    rus: О внесении изменений в постановление акимата Южно-Казахстанской области от 13 февраля 2015 года № 34 «Об утверждении нормативов субсидий, а также критериев и требований по направлениям субсидирования возмещение до 100% затрат по искусственному осеменению маточного поголовья крупного рогатого скота и овец в личных подсобных хозяйствах, ведение селекционной и племенной работы с пчелосемьями»
    kaz: «Жеке қосалқы шаруашылықтарда ірі қара малдың және қойлардың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100%-ға дейін өтеуді, бал ара ұясымен селекциялық және асыл тұқымды жұмыстарды жүргізу субсидиялау бағыттары бойынша субсидиялар нормативтерін, сондай-ақ өлшемдер мен талаптарды бекіту туралы» Оңтүстік Қазақстан облысы әкімдігінің 2015 жылғы 13 ақпандағы №34 қаулысына өзгерістер енгізу туралы

act_code: '86903'
requisite: Постановление акимата Южно-Казахстанской области от 13 февраля 2015 года № 34. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 февраля 2015 года № 3031. Утратило силу постановлением акимата Южно-Казахстанской области от 5 апреля 2016 года № 100
title:
  rus: Об утверждении нормативов субсидий, а также критериев и требований по направлениям субсидирования возмещение до 100% затрат по искусственному осеменению маточного поголовья крупного рогатого скота и овец в крестьянских (фермерских), личных подсобных хозяйствах и производственных кооперативах, ведение селекционной и племенной работы с пчелосемьями
  kaz: Шаруа (фермерлік), жеке қосалқы шаруашылықтарда және өндірістік кооперативтерде ірі қара мал мен қойлардың аналық басын қолдан ұрықтандыру жөніндегі шығындарды 100%-ға дейін өтеуді, бал ара ұяларымен селекциялық және асыл тұқымдық жұмыстар жүргізу субсидиялаудың бағыттары бойынша субсидиялар нормативтерін, сондай-ақ өлшемдер мен талаптарды бекіту туралы

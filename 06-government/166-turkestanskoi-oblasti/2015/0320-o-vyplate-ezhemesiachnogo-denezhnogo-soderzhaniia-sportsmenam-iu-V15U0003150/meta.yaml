title:
  rus: О выплате ежемесячного денежного содержания спортсменам Южно-Казахстанской области, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд  Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам  и руководителям клубных команд
  kaz: Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін Оңтүстік Қазақстан облысының спортшыларына,  олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамында ойнайтын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайын ақшалай үлес төлеу туралы

requisite: Постановление акимата города Шымкент Южно-Казахстанской области от 15 мая 2015 года № 681. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 9 июня 2015 года № 3203. Утратило силу постановлением акимата города Шымкент Южно-Казахстанской области от 26 января 2016 года № 45
title:
  rus: 'Об утверждении Методики ежегодной оценки деятельности административных государственных служащих аппарата акима города Шымкента и административных государственных служащих исполнительных органов, финансируемых из городского бюджета корпуса «Б» '
  kaz: '«Б» корпусындағы Шымкент қаласы әкімі аппаратының мемлекеттік әкімшілік қызметшілері мен қалалық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы '

act_code: '175176'
requisite: Постановление акимата Келесского района Туркестанской области от 5 декабря 2022 года № 352
title:
  rus: О признании утратившим силу постановления акимата Келесского района от 18 ноября 2022 года № 332 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Келесскому району»
  kaz: Келес ауданы әкімдігінің 2022 жылғы 18 қарашадағы № 332 «Келес ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысының күшін жою туралы

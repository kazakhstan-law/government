act_code: '175514'
requisite: Постановление акимата Сарыагашского района Туркестанской области от 7 декабря 2022 года № 377. Утратило силу постановлением акимата Сарыагашского района Туркестанской области от 14 августа 2023 года № 240 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей являющихся выпускниками организаций образования Сарыагашского района Туркестанской области на 2023 год
  kaz: 2023 жылға Түркістан облысы Сарыағаш ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

requisite: Постановление акимата Сайрамского района Туркестанской области от 23 сентября 2022 года № 325. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 октября 2022 года № 30117. Утратило силу постановлением акимата Сайрамского района Туркестанской области от 14 мая 2025 года № 352 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Сайрамского района
  kaz: Сайрам ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі  жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

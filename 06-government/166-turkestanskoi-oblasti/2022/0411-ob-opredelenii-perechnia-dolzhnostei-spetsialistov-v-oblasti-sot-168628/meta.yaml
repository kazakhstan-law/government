requisite: Постановление акимата Толебийского района Туркестанской области от 11 апреля 2022 года № 144. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 мая 2022 года № 28209. Утратило силу постановлением акимата Толебийского района Туркестанской области от 2 декабря 2025 года № 486 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельских населенных пунктах по Толебийскому району
  kaz: Төлеби ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін анықтау туралы

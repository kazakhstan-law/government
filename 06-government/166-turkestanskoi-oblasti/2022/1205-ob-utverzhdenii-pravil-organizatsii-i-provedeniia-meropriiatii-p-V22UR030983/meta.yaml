requisite: Постановление акимата Сауранского района Туркестанской области от 5 декабря 2022 года № 384. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 декабря 2022 года № 30983. Утратило силу постановлением акимата Сауранского района Туркестанской области от 29 апреля 2025 года № 86 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика района Сауран
  kaz: Сауран ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

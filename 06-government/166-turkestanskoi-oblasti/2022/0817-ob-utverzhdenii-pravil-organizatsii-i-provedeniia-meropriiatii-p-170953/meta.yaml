requisite: Постановление акимата Толебийского района Туркестанской области от 17 августа 2022 года № 385. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 августа 2022 года № 29276
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Толебийского района
  kaz: Төлеби ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

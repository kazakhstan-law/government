  title:
    rus: О внесении изменения в постановление акимата Шардаринского района от 9 августа 2022 года № 215 «Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Шардаринского района корпуса «Б»»

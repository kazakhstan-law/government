  title:
    rus: О внесении изменения и дополнения в постановление акимата Шардаринского района от 9 августа 2022 года № 215 «Об утверждении методики оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета и административных государственных служащих аппарата акима Шардаринского района корпуса «Б»
    kaz: Шардара ауданы әкімдігінің 2022 жылғы 9 тамыздағы № 215 «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Шардара ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

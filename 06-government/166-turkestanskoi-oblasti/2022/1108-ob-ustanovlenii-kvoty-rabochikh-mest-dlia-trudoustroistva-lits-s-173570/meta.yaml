requisite: Постановление акимата Отырарского района Туркестанской области от 8 ноября 2022 года № 295. Утратило силу постановлением акимата Отырарского района Туркестанской области от 31 июля 2023 года № 175 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы Отырарского района на 2023 год
  kaz: Отырар ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды жұмысқа орналастыру үшін жұмыс орындарына 2023 жылға квоталар белгілеу туралы

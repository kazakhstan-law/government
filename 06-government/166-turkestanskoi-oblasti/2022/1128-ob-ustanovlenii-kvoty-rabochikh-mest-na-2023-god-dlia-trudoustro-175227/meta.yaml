requisite: Постановление акимата города Арыс Туркестанской области от 28 ноября 2022 года № 701. Утратило силу постановлением акимата города Арыс Туркестанской области от 15 сентября 2023 года № 487 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

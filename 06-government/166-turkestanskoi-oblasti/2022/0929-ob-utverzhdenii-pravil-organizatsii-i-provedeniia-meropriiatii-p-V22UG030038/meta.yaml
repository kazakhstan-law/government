  title:
    rus: О внесении изменений в постановление акимата Мактааральского района Туркестанской области от 29 сентября 2022 года № 586 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Мактааральскому району»
    kaz: «Мақтаарал ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Түркістан облысы Мақтаарал ауданы әкiмдiгiнiң 2022 жылғы 29 қыркүйектегі № 586 қаулысына өзгерістер енгізу туралы

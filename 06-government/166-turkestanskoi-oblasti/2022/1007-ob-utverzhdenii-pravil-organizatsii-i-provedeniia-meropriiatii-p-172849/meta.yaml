act_code: '172849'
requisite: Постановление акимата города Кентау Туркестанской области от 7 октября 2022 года № 498. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 октября 2022 года № 30126. Утратило силу постановлением акимата города Кентау Туркестанской области от 2 мая 2025 года № 159 (вводится в действие по истечении  десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Кентау
  kaz: Кентау қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

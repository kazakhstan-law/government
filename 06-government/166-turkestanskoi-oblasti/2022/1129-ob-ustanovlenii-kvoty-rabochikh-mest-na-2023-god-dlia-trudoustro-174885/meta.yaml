act_code: '174885'
requisite: Постановление акимата Сайрамского района Туркестанской области от 29 ноября 2022 года № 443. Утратило силу постановлением акимата Сайрамского района Туркестанской области от 21 августа 2023 года № 307 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест на 2023 год для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Сайрамского района
  kaz: Сайрам ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан  айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін 2023 жылға жұмыс орындарына квоталар белгілеу туралы

act_code: '175773'
requisite: Постановление акимата Ордабасынского района Туркестанской области от 5 декабря 2022 года № 426. Утратило силу постановлением акимата Ордабасынского района Туркестанской области от 20 сентября 2023 года № 308 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: «Об установлении квоты рабочих мест для трудоустройства лиц, о стоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Ордабасынского района на 2023 год»
  kaz: «2023 жылға Ордабасы ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы»

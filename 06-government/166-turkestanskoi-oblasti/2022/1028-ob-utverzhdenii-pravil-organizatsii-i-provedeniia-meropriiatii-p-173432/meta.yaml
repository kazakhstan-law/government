act_code: '173432'
requisite: Постановление акимата Казыгуртского района Туркестанской области от 28 октября 2022 года № 298. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 ноября 2022 года № 30417. Утратило силу постановлением акимата Казыгуртского района Туркестанской области от 18 июня 2024 года № 191 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика в селе Казыгурт, Жанабазар, Рабат, Казыгуртского района
  kaz: Қазығұрт ауданының, Қазығұрт, Жаңабазар, Рабат елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

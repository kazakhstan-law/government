  title:
    rus: О внесении изменений в постановление акимата Сарыагашского района от 2 ноября 2022 года № 322 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Сарыагашскому району»
    kaz: Сарыағаш ауданы әкімдігінің 2022 жылғы 2 қарашадағы № 322 «Сарыағаш ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

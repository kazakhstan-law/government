  title:
    rus: О внесении изменений в постановление акимата Созакского района от 28 ноября 2022 года № 344 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Созакскому району»
    kaz: Созақ ауданы әкiмдiгiнiң 2022 жылғы 28 қарашадағы «Созақ ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» № 344 қаулысына өзгерістер енгізу туралы

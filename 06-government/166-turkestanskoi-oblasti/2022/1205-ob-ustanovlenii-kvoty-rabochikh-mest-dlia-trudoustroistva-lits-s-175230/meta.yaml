act_code: '175230'
requisite: Постановление акимата Сауранского района Туркестанской области от 5 декабря 2022 года № 385. Утратило силу постановлением акимата Сауранского района Туркестанской области от 29 августа 2023 года № 244 (вводится в действие по истечении десяти календарных дней после дня его опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования района Сауран на 2023 год
  kaz: Сауран ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін 2023 жылға арналған жұмыс орындарына квоталар белгілеу туралы

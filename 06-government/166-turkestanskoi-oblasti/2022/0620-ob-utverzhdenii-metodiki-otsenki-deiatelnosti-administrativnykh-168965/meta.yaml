title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, села, сельских  округов и исполнительных органов финансируемых из Казыгуртского районного бюджета
  kaz: Қазығұрт аудандық бюджеттен қаржыландырылатын аудан, ауыл, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

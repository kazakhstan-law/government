  title:
    rus: О внесении изменения в постановление акимата Казыгуртского района от 20 июня 2022 года № 173 «О внесении изменения в постановление акимата Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, села, сельских  округов и исполнительных органов финансируемых из Казыгуртского районного бюджета»
    kaz: Қазығұрт ауданы әкімдігінің 2022 жылғы 20 маусымдағы № 173 «Қазығұрт аудандық бюджеттен қаржыландырылатын аудан, ауыл, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

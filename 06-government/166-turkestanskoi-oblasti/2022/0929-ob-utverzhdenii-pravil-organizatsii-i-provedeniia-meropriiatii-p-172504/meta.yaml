act_code: '172504'
requisite: Постановление акимата Мактааральского района Туркестанской области от 29 сентября 2022 года № 586. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 октября 2022 года № 30038
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Мактааральскому району
  kaz: Мақтаарал ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

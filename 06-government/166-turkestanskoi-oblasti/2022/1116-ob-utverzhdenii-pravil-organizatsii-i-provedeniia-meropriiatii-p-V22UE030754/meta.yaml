  title:
    rus: О внесении изменение в постановление акимата Байдибекского района от 16 ноября 2022 года № 402 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Байдибекскому району»
    kaz: «Бәйдібек ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Бәйдібек ауданы әкiмдiгiнiң 2022 жылғы 16 қарашадағы № 402 қаулысына өзгерістер енгізу туралы

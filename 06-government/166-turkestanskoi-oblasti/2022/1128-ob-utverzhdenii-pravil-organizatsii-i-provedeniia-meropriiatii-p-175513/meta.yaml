  title:
    rus: О внесении изменения в постановление акимата Ордабасинского района от 28 ноября 2022 года № 413 Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Ордабасынскому району
    kaz: Ордабасы ауданы әкiмдiгiнiң «Ордабасы ауданына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» 2022 жылғы 28 қарашадағы № 413 қаулысына өзгеріс енгізу туралы

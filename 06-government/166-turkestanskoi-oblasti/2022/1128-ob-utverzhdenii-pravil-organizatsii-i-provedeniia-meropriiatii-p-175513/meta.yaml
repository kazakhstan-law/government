act_code: '175513'
requisite: Постановление акимата Ордабасынского района Туркестанской области от 28 ноября 2022 года № 413. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 декабря 2022 года № 31083. Утратило силу постановлением акимата Ордабасынского района Туркестанской области от 16 мая 2025 года № 190 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Ордабасынскому району
  kaz: Ордабасы ауданына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

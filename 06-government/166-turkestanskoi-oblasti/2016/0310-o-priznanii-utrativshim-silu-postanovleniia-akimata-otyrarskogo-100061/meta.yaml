act_code: '100061'
requisite: Постановление акимата Отырарского района Южно-Казахстанской области от 10 марта 2016 года № 143
title:
  rus: О признании утратившим силу постановления акимата Отырарского района от 12 ноября 2015 года за №451 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Отрарского района»
  kaz: «Отырар ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы» Отырар ауданы әкімдігінің 2015 жылғы 12 қарашадағы №451 қаулысының күшін жою туралы

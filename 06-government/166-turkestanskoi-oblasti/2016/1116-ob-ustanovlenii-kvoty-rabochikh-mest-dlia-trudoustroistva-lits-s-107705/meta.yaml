act_code: '107705'
requisite: Постановление акимата Байдибекского района Южно-Казахстанской области от 16 ноября 2016 года № 369. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 22 ноября 2016 года № 3879. Утратило силу постановлением акимата Байдибекского района Южно-Казахстанской области от 24 июля 2017 года № 229
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Байдибекского районаба
  kaz: Бәйдібек ауданының пробация қызметінің есебінде тұрған адамдарды, сондай – ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

act_code: '108575'
requisite: Постановление акимата Ордабасынского района Южно-Казахстанской области от 9 декабря 2016 года № 433. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 26 декабря 2016 года № 3931. Утратило силу постановлением акимата Ордабасынского района Южно-Казахстанской области от 23 мая 2017 года № 193
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Ордабасынского района
  kaz: Ордабасы ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

act_code: '108598'
requisite: Постановление акимата города Арыс Южно-Казахстанской области от 15 декабря 2016 года № 367. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 29 декабря 2016 года № 3946. Утратило силу постановлением акимата города Арыс Южно-Казахстанской области от 15 ноября 2017 года № 397
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования города Арыс
  kaz: Арыс қаласының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

title:
  rus: Об установлении размера дивидендов акционерных обществ и товариществ с ограниченной ответственностью, находящихся в коммунальной собственности города Шымкент
  kaz: Шымкент қаласының коммуналдық меншігіндегі акционерлік қоғамдардың және жауапкершілігі шектеулі серіктестіктердің дивидендтерінің көлемін белгілеу туралы

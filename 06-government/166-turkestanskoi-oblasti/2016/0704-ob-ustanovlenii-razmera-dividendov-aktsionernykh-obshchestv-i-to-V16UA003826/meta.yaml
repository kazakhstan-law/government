  requisite: Постановление акимата города Шымкент от 20 декабря 2019 года № 979. Зарегистрировано Департаментом юстиции города Шымкент 24 декабря 2019 года № 80. Утратило силу постановлением акимата города Шымкент от 7 апреля 2022 года № 551 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об установлении размера дивидендов (дохода) на государственные пакеты акций акционерных обществ, доли участия в уставном капитале товариществ с ограниченной ответственностью находящихся в коммунальной собственности города Шымкент и о признании утратившим силу постановление акимата города Шымкент от 4 июля 2016 года № 1407 «Об установлении размера дивидендов акционерных обществ и товариществ с ограниченной ответственностью, находящихся в коммунальной собственности города Шымкент»
    kaz: Шымкент қаласының коммуналдық меншігіндегі акционерлік қоғамдардың акцияларының мемлекеттiк пакеттерiне, жауапкершілігі шектеулі серіктестіктердің жарғылық капиталдағы қатысу үлестеріне дивидендтерінің (табыстарының) көлемін белгілеу және «Шымкент қаласының коммуналдық меншігіндегі акционерлік қоғамдардың және жауапкершілігі шектеулі серіктестіктердің дивидендтерінің көлемін белгілеу туралы» Шымкент қаласы әкімдігінің 2016 жылғы 4 шілдедегі № 1407 қаулысының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/137349/rus

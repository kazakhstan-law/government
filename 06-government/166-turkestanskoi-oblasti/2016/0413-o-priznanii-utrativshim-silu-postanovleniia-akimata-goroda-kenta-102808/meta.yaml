act_code: '102808'
requisite: Постановление акимата города Кентау Южно-Казахстанской области от 13 апреля 2016 года № 88
title:
  rus: О признании утратившим силу постановления акимата города Кентау от 8 мая 2013 года за №180 «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции и лиц, освобожденных из мест лишения свободы, а также для несовершеннолетних выпускников интернатных организаций
  kaz: «Қылмыстық атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшiн жұмыс орындарына квота белгiлеу туралы» Кентау қаласы әкiмдiгiнiң 2013 жылғы 8 мамырдағы №180 қаулысының күшін жою туралы

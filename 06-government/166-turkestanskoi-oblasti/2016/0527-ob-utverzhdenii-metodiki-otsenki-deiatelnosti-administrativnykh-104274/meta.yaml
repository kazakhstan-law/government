requisite: Постановление акимата Казыгуртского района Южно-Казахстанской области от 27 мая 2016 года № 56. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 5 июля 2016 года № 3772. Утратило силу постановлением акимата Казыгуртского района Южно-Казахстанской области от 13 марта 2017 года № 83
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Казыгуртского района корпуса «Б»
  kaz: «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Қазығұрт ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата Байдибекского района Южно-Казахстанской области от 16 ноября 2016 года № 371. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 7 декабря 2016 года № 3904. Утратило силу постановлением акимата Байдибекского района Туркестанской области от 23 июля 2024 года № 223 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

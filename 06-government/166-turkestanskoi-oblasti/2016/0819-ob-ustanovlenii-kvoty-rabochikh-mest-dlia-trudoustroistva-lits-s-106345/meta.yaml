act_code: '106345'
requisite: Постановление акимата Казыгуртского района Южно-Казахстанской области от 19 августа 2016 года № 142. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 20 сентября 2016 года № 3851. Утратило силу постановлением акимата Казыгуртского района Южно-Казахстанской области от 25 августа 2017 года № 302
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Казыгуртского района
  kaz: Қазығұрт ауданының пробация қызметінің есебінде тұрған адамдарды, сондай – ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

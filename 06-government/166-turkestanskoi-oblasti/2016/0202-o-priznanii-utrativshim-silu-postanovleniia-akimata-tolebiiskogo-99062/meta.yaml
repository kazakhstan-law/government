act_code: '99062'
requisite: Постановление акимата Толебийского района Южно-Казахстанской области от 2 февраля 2016 года № 31
title:
  rus: О признании утратившим силу постановления акимата Толебийского района № 265 от 11 июня 2015 года «Об утверждении методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета, аппаратов акима города, села, сельских округов и административных государственных служащих аппарата акима Толебийского района корпуса «Б»
  kaz: «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың, қала, ауыл, ауылдық округ әкімі аппаратының мемлекеттік әкімшілік қызметшілерімен Төлеби ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы» 11 маусым 2015 жылғы № 265 қаулысының күшін жою туралы

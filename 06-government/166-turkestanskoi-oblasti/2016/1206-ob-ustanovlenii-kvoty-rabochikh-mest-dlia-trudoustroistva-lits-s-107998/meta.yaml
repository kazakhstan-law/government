act_code: '107998'
requisite: Постановление акимата Созакского района Южно-Казахстанской области от 6 декабря 2016 года № 412. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 9 декабря 2016 года № 3913. Утратило силу постановлением акимата Созакского района Южно-Казахстанской области от 20 июня 2017 года № 156
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Созакского района
  kaz: Созақ ауданының пробация қызметінің есебінде тұрған адамдарды, сондай–ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға  дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

requisite: Постановление акимата Байдибекского района Южно-Казахстанской области от 29 марта 2016 года № 65
title:
  rus: Об утрате силы постановления акимата Байдибекского района от 2 ноября 2015 года № 459 «Об утверждении схемы и правила перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Байдибекского района»
  kaz: Бәйдібек ауданы әкімдігінің 2015 жылғы 2 қарашадағы «Бәйдібек ауданының шалғайдағы елді мекендерінде тұратын балалардың жалпы білім беретін мектептерге тасмалдаудың схемасы мен тәртібін бекіту туралы» № 459 қаулысының күшін жою туралы

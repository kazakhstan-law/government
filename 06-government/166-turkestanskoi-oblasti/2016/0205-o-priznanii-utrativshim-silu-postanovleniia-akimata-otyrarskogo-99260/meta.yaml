act_code: '99260'
requisite: Постановление акимата Отырарского района Южно-Казахстанской области от 5 февраля 2016 года № 128
title:
  rus: О признании утратившим силу постановления акимата Отырарского района от 13 июля 2015 года за № 248 «Об утверждении Методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета, аппаратов акима Отырарского района и акимов сельских округов корпуса «Б»
  kaz: «Б» корпусындағы Отырар ауданы әкімі мен ауыл округі әкімі аппараттарының және аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы» ауданы әкімдігінің 2015 жылғы 13 шілдедегі № 248 қаулысының күшін жою туралы

requisite: Постановление акимата Южно-Казахстанской области от 2 июня 2016 года № 151. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 29 июня 2016 года № 3767. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на право занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении»
  kaz: «Жолаушыларды облысаралық қалааралық, ауданаралық (облысішілік, қалааралық) және халықаралық қатынаста автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау қызметімен айналысу үшін лицензия беру» мемлекеттік қызметінің регламентін бекіту туралы

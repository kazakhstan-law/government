requisite: Постановление акимата Шардаринского района Южно-Казахстанской области от 22 февраля 2016 года № 67. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 марта 2016 года № 3648. Утратило силу постановлением акимата Шардаринского района Южно-Казахстанской области от 18 марта 2017 года № 84
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета, аппаратов акима сельских округов, города Шардара и административных государственных служащих аппарата акима Шардаринского района корпуса "Б"
  kaz: «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың, Шардара қаласы, ауылдық округтер әкімі аппараттарының мемлекеттік әкімшілік қызметшілері мен Шардара ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата города Шымкент Южно-Казахстанской области от 15 июня 2016 года № 1266. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 21 июля 2016 года № 3802. Утратило силу постановлением акимата города Шымкент от 25 мая 2023 года № 1230 (вводится в действие по истечений десяти календарных дней после дня его первого официального опубликования)
title:

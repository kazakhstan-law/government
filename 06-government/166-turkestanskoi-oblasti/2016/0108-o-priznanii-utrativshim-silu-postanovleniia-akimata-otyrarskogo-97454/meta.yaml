act_code: '97454'
requisite: Постановление акимата Отырарского района Южно-Казахстанской области от 8 января 2016 года № 2
title:
  rus: О признании утратившим силу постановления акимата Отырарского района от 6 декабря 2013 года за № 515 «Об утверждении Правил служебной этики государственных служащих аппарата акима Отырарского района и исполнительных органов, финансируемых из районного бюджета»
  kaz: «Отырар ауданы әкімі аппаратының және аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілерінің қызмет этикасының қағидаларын бекіту туралы» Отырар ауданы әкімдігінің 2013 жылғы 6 желтоқсандағы № 515 қаулысының күшін жою туралы

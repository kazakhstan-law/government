act_code: '102566'
requisite: Постановление акимата Южно-Казахстанской области от 20 апреля 2016 года № 108. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 13 мая 2016 года № 3743. Утратило силу постановлением акимата Туркестанской области от 30 июня 2020 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим  работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін аттестаттаудан өткізуге құжаттар қабылдау» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы

act_code: '101320'
requisite: Постановление акимата Южно-Казахстанской области от 5 апреля 2016 года № 100. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 15 апреля 2016 года № 3713
title:
  rus: Об утверждении нормативов субсидий, а также критериев и требований по направлениям субсидирования возмещение до 100% затрат по искусственному осеменению маточного поголовья крупного рогатого скота и овец в крестьянских (фермерских), личных подсобных хозяйствах и производственных кооперативах, ведение селекционной и племенной работы с пчелосемьями на 2016 год
  kaz: 2016 жылға шаруа (фермерлік), жеке қосалқы шаруашылықтарда және өндірістік кооперативтерде ірі қара мал мен қойлардың аналық басын қолдан ұрықтандыру жөніндегі шығындарды 100 %-ға дейін өтеуді, бал ара ұясымен селекциялық және асыл тұқымды жұмыстарды жүргізу субсидиялау бағыттары бойынша субсидиялар нормативтерін, сондай-ақ өлшемдер мен талаптарды бекіту туралы

requisite: Постановление акимата Шардаринского района Южно-Казахстанской области от 9 декабря 2016 года № 400. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 22 декабря 2016 года № 3925. Утратило силу постановлением акимата Шардаринского района Южно-Казахстанской области от 28 февраля 2018 года № 89
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Шардаринского района
  kaz: Шардара ауданының пробация қызметінің есебінде тұрған адамдарды, сондай ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

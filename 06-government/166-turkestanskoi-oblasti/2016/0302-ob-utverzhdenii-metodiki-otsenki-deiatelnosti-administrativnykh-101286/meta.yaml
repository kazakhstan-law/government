act_code: '101286'
requisite: Постановление акимата города Шымкент Южно-Казахстанской области от 2 марта 2016 года № 401. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 1 апреля 2016 года № 3684. Утратило силу постановлением акимата города Шымкент Южно-Казахстанской области от 5 апреля 2017 года № 269
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих аппарата акима города Шымкент, аппаратов акимов районов в городе Шымкент и исполнительных органов, финансируемых из местного бюджета корпуса «Б»
  kaz: «Б» корпусы Шымкент қаласы әкімі аппаратының, Шымкент қаласындағы аудан әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын атқарушы органдары мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

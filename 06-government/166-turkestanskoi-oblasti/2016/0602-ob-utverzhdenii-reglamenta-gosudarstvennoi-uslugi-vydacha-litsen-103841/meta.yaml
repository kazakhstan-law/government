  title:
    rus: О внесении изменения в постановление акимата Южно-Казахстанской области от 2 июня 2016 года № 151 «Об утверждении регламента государственной услуги Выдача лицензии на право занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении»
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2016 жылғы 2 маусымдағы № 151 «Жолаушыларды облысаралық қалааралық, ауданаралық (облысішілік, қалааралық) және халықаралық қатынаста автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау қызметімен айналысу үшін лицензия беру» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

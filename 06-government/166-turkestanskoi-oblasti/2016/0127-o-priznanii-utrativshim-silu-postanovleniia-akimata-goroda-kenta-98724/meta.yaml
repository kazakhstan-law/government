act_code: '98724'
requisite: Постановление акимата города Кентау Южно-Казахстанской области от 27 января 2016 года № 20
title:
  rus: О признании утратившим силу постановления акимата города Кентау от 5 мая 2015 года за № 128 «Об утверждении методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из местного бюджета и административных государственных служащих аппарата акима города Кентау корпуса «Б»»
  kaz: «Кентау қаласының әкімі аппараты және жергілікті бюджеттен қаржыландырылатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы» Кентау қаласы әкімдігінің 2015 жылғы 5 мамырдағы № 128 қаулысының күшін жою туралы

requisite: Постановление акимата города Шымкент Южно-Казахстанской области от 4 июля 2016 года № 1407. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 10 августа 2016 года № 3826. Утратило силу постановлением акимата города Шымкент от 20 декабря 2019 года № 979 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

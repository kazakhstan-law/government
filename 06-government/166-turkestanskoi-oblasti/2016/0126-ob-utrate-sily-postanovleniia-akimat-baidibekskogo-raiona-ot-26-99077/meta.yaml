act_code: '99077'
requisite: Постановление акимата Байдибекского района Южно-Казахстанской области от 26 января 2016 года № 08
title:
  rus: Об утрате силы постановления акимат Байдибекского района от 26 август 2015 года № 425 Об утверждении Методики ежегодной оценки деятельности админстративных государственных служащих аппарата акима Байдибекского района и админстративных государственных служащих исполнительных органов, финансируемых из районного бюджета и аппаратов акима сельских округов корпуса «Б»
  kaz: Аудан әкімдігінің 2015 жылғы 26 тамыздағы «Б» корпусындағы мемлекеттік әкімшілік қызметшілері мен аудандық бюджеттен қаржыландырылатын атқарушы органдардың және ауыл округі әкімі аппараттарының мемлекеттік әкімшілік қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы № 425 қаулысының күшін жою туралы

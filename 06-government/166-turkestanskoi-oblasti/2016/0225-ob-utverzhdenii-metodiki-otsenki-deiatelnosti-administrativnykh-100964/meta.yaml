act_code: '100964'
requisite: Постановление акимата Сайрамского района Южно-Казахстанской области от 25 февраля 2016 года № 131. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 1 апреля 2016 года № 3685. Утратило силу постановлением акимата Сайрамского района Южно-Казахстанской области от 3 апреля 2017 года № 154
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Сайрамcкого района, исполнительных органов, финансируемых из районного бюджета и аппаратов акимов сельских округов
  kaz: «Б» корпусындағы Сайрам ауданы әкімі аппаратының, аудандық бюджеттен қаржыландырылатын атқарушы органдардың және ауылдық округтер әкімдері аппараттарының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

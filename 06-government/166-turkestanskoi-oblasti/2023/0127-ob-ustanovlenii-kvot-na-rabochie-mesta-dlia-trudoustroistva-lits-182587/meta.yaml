act_code: '182587'
requisite: Постановление акимата города Туркестан Туркестанской области от 27 января 2023 года № 18. Утратило силу постановлением акимата города Туркестан Туркестанской области от 20 сентября 2023 года № 366 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квот на рабочие места для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы, и граждан из числа молодежи, потерявших или оставшихся без попечения родителей до достижения ими совершеннолетия, являющихся выпускниками организаций образования города Туркестан на 2023 год
  kaz: Түркістан қаласының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін 2023 жылға арналған жұмыс орындарына квоталар белгілеу туралы

    rus: О внесении изменения в постановление акимата Мактааральского района от 25 июля 2023 года № 438 «Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Мактааральского района корпуса «Б»
    kaz: Түркістан облысы Мақтаарал ауданы әкімдігінің 2023 жылғы 25 шілдедегі № 438 «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Мақтаарал ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

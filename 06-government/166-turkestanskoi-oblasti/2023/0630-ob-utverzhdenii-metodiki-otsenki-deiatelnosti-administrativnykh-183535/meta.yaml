requisite: Постановление акимата Жетысайского района Туркестанской области от 30 июня 2023 года № 533
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Жетысайского района и исполнительных органов финансируемых из районного бюджета
  kaz: Жетісай ауданы әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусындағы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

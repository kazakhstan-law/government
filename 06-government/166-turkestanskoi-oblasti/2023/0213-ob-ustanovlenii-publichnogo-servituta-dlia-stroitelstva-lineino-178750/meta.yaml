act_code: '178750'
requisite: Постановление акимата Сауранского района Туркестанской области от 13 февраля 2023 года № 41
title:
  rus: Об установлении публичного сервитута для строительства линейно-кабельных сооружений волоконно-оптической линии связи направления «Аэропорт Туркестан-АО «Казтелерадио-Республиканского государственного предприятия на праве хозяйственного ведения «Казаэронавигация» Комитета гражданской авиации Министерства индустрии и инфраструктурного развития Республики Казахстан
  kaz: «Түркістан әуежайы-«Қазтелерадио» АҚ-Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігі Азаматтық авиация комитетінің «Қазаэронавигация» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорны» бағытында талшықты-оптикалық байланыс желісінің желілік-кәбілдік ғимараттарын салу үшін қауымдық сервитут белгілеу туралы

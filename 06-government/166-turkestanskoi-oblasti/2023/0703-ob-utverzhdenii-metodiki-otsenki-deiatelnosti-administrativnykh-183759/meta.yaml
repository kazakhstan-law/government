    kaz: Түркістан облысы Кентау қаласы әкімдігінің 2023 жылғы 3 шілдедегі № 191 «"Б" корпусындағы қалалық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Кентау қаласы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

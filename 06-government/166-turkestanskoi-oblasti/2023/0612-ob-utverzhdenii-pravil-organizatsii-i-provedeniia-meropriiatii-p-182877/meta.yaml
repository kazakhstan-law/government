  title:
    rus: О внесении изменений в постановление акимата Шардаринского района от 12 июня 2023 года № 175 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Шардаринскому району»
    kaz: Шардара ауданы әкiмдiгiнiң 2023 жылғы 12 маусымдағы № 175 «Шардара ауданында бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

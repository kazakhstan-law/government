requisite: Постановление акимата Шардаринского района Туркестанской области от 12 июня 2023 года № 175. Зарегистрировано Департаментом юстиции Туркестанской области 12 июня 2023 года № 6307-13
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Шардаринскому района
  kaz: Шардара ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Отырарского района от 3 марта 2023 года № 48 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Отырарскому району»
    kaz: «Отырар ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы» Отырар ауданы әкімдігінің 2023 жылғы 3 наурыздағы № 48 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Отырарского района Туркестанской области от 28 ноября 2023 года № 251. Зарегистрировано в Департаменте юстиции Туркестанской области 28 ноября 2023 года № 6411-13. Утратило силу постановлением акимата Отырарского района Туркестанской области от 21 августа 2026 года № 268 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

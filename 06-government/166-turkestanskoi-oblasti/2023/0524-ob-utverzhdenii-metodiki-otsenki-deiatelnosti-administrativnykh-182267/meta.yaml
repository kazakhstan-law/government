  title:
    rus: О внесении изменения и дополнения в постановление акимата Созакского района от 24 мая 2023 года № 124 «Об утверждении методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Созакского района корпуса «Б»
    kaz: Созақ ауданы әкімдігінің 2023 жылғы 24 мамырдағы № 124 «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Созақ ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

requisite: Постановление акимата города Туркестан Туркестанской области от 1 июля 2023 года № 238
title:
  rus: Об утверждении Методики оценки деятельности Административных государственных служащих корпуса "Б" аппарата акима города Туркестан и исполнительных органов финансируемых из городского бюджета
  kaz: Түркістан қаласы әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын қалалық атқарушы органдардың "Б" корпусындағы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

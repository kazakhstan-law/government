act_code: '191972'
requisite: Постановление акимата Туркестанской области от 29 декабря 2023 года № 308. Зарегистрировано в Департаменте юстиции Туркестанской области 3 января 2024 года № 6444-13
title:
  rus: О признании утратившим силу постановления акимата Туркестанской области от 7 февраля 2022 года № 20 «Об утверждении методики определения стоимости услуг, закупаемых для проведения государственной информационной политики в средствах массовой информации на территории Туркестанской области»
  kaz: Түркістан облысы әкімдігінің 2022 жылғы 7 ақпандағы № 20 «Түркістан облысы аумағында бұқаралық ақпарат құралдарында мемлекеттік ақпараттық саясатты  жүргізу үшін сатып алынатын көрсетілетін қызметтердің құнын айқындаудың әдістемесін бекіту туралы» қаулысының күшін жою туралы

act_code: '187210'
requisite: Постановление акимата Мактааральского района Туркестанской области от 16 октября 2023 года № 573
title:
  rus: О признании утратившим силу постановление акимата Мактааральского района от 25 ноября 2022 года № 703 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Мактааральского района на 2023 год»
  kaz: Мақтаарал ауданы әкімдігінің 2022 жылғы 25 қарашадағы «Мақтаарал ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына 2023 жылға квоталар белгілеу туралы № 703 қаулысының күшін жою туралы

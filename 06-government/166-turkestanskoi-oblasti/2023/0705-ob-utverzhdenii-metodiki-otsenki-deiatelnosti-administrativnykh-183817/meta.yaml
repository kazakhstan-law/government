title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, города, поселка и сельских округов и исполнительных органов финансируемых из Сарыагашского районного бюджета
  kaz: Сарыағаш аудандық бюджеттен қаржыландырылатын аудан, қала, кент және ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

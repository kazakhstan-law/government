  title:
    rus: О внесении изменения в постановление акимата Сарыагашского района от 5 июля 2023 года № 195 «О внесении изменения в постановление акимата  Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, городов, поселков и сельских  округов и исполнительных органов финансируемых из Сарыагашского районного бюджета»
    kaz: Сарыағаш ауданы әкімдігінің 2023 жылғы 5 шілдедегі № 195 «Сарыағаш аудандық бюджеттен қаржыландырылатын аудан, қала, кент және ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Ордабасынского района от 13 февраля 2023 года № 37 «Об утверждении методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Ордабасынского района корпуса «Б»
    kaz: Ордабасы ауданы әкімдігінің 2023 жылғы 13 ақпандағы № 37 «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Ордабасы ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

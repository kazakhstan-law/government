  requisite: Постановление акимата Байдибекского района Туркестанской области от 10 мая 2023 года № 211
  title:
    rus: О внесении изменения в постановление акимата Байдибекского района от 04 января 2023 года № 01 «Об утверждении методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Байдибекского района корпуса «Б»
    kaz: Бәйдібек ауданы әкімдігінің 2023 жылғы 04 қаңтардағы № 01 «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Бәйдібек ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/181204/rus

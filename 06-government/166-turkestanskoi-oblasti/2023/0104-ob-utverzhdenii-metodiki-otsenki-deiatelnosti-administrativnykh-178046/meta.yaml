  requisite: Постановление акимата Байдибекского района Туркестанской области от 6 октября 2025 года № 357
  title:
    rus: О внесении изменения в постановление акимата района Байдибек от 4 января 2023 года № 1 «Об утверждении методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима района Байдибек корпуса «Б»»
    kaz: Бәйдібек ауданы әкімдігінің 2023 жылғы 4 қаңтардағы № 1 ««Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Бәйдібек ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215438/rus

act_code: '178046'
requisite: Постановление акимата Байдибекского района Туркестанской области от 4 января 2023 года № 01
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, сельских округов и исполнительных органов финансируемых из Байдибекского районного бюджета
  kaz: Бәйдібек аудандық бюджеттен қаржыландырылатын ауданның ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

  requisite: Постановление акимата Сауранского района Туркестанской области от 22 декабря 2025 года № 298
  title:
    rus: О внесении изменений и дополнений в постановление акимата района Сауран от 11 сентябрь 2023 года № 255 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса "Б" исполнительных органов, финансируемых из районного бюджета и государственных административных служащих аппарата акима района Сауран»
    kaz: Сауран ауданы әкімдігінің 2023 жылғы 11 қыркүйектегі № 255 «"Б" корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Сауран ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/220244/rus

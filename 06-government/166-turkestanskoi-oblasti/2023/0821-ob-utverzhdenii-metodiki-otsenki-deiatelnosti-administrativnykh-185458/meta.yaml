  title:
    rus: О внесении изменения в постановление акимата Келесского района от 21 августа 2023 года № 163 «Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Келесского района корпуса «Б»
    kaz: Түркістан облысы Келес ауданы әкімдігінің 2023 жылғы 21 тамыздағы № 163 «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Келес ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы

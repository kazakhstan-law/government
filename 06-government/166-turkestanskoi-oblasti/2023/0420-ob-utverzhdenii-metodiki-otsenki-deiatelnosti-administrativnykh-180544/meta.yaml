title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Толебийского района и исполнительных органов финансируемых из районного бюджета
  kaz: Төлеби ауданы әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусындағы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

act_code: '187279'
requisite: Постановление акимата Сауранского района Туркестанской области от 12 апреля 2023 года № 109
title:
  rus: «Об ограничении нахождения автотранспортов, отдыхающих на территории Каратауского лесничества на землях леса, рощи, лесного фонда в периоды повышенной пожарной опасности в лесу в 2023 году»
  kaz: «2023 жылы Орманда өрт қаупі жоғары кезеңдерде автокөліктердің, демалушылардың Қаратау орманшылығының аумағында орман, тоғай, орман қоры жерінде болуына шектеу қою туралы»

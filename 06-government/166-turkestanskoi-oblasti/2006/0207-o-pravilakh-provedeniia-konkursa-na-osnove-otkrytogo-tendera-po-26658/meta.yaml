requisite: Постановление акимата Южно-Казахстанской области от 7 февраля 2006 года № 63. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 21 февраля 2006 года № 1927. Утратило силу постановлением акимата Южно-Казахстанской области от 18 июня 2007 года № 210
title:
  rus: О Правилах проведения конкурса на основе открытого тендера по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по социально значимым внутриобластным пригородным сообщениям, убытки которых подлежат субсидированию из бюджета
  kaz: Шығындары бюджеттен субсидиялануға жататын әлеуметтік маңызды облысішілік қала маңы қатынастары бойынша темір жолмен жолаушылар тасымалдарын жүзеге асыратын тасымалдаушыларды ашық тендер негізінде анықтау жөніндегі конкурсты өткізу Ережесі туралы

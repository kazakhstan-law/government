title:
  rus: Об установлении объемов субсидий, на удешевление сельскохозяйственным товаропроизводителям стоимости биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений
  kaz: Ауыл шаруашылығы тауарларын өндірушілерге өсімдіктерді қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған биоагенттердің (энтомофагтардың) және биопрепараттардың құнын арзандатуға субсидия көлемін белгілеу туралы

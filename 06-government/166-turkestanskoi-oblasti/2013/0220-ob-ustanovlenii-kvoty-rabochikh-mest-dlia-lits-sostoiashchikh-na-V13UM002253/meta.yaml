  title:
    rus: О внесении изменений в постановление акимата Толебийского района от 20 февраля 2013 года №158 «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций»
    kaz: «Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы» Төлеби ауданы әкімдігінің 2013 жылғы 20 ақпандағы №158 қаулысына өзгерістер енгізу туралы

requisite: Постановление от 28.11.2013 №2148, Акимат Сайрамского района. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 28 декабря 2013 года № 2467. Утратило силу постановлением акимата Сайрамского района Южно-Казахстанской области от 15 декабря 2015 года № 737
title:
  rus: Об утверждении Правил служебной этики государственных служащих аппарата акима Сайрамского района, аппаратов акимов сельских округов и исполнительных органов, финансируемых из районного бюджета
  kaz: Сайрам ауданы әкімі аппаратының, ауыл округтері әкімдері аппаратының және аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілерінің қызмет этикасының қағидаларын бекіту туралы

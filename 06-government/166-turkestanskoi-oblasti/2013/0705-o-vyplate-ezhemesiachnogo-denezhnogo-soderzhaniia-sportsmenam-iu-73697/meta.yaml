act_code: '73697'
requisite: Постановление акимата Южно-Казахстанской области от 5 июля 2013 года № 168. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 30 июля 2013 года № 2347. Утратило силу постановлением акимата Южно-Казахстанской области от 14 октября 2014 года № 330
title:
  rus: О выплате ежемесячного денежного содержания спортсменам Южно-Казахстанской области, входящим в состав сборных команд Республики Казахстан по различным видам спорта, их тренерам, а также спортсменам, выступающим в составах команд по игровым видам спорта, их тренерам и руководителям клубных команд
  kaz: Әралуан спорт түрлері бойынша Қазақстан Республикасы құрама командаларының құрамына кіретін Оңтүстік Қазақстан облысының спортшыларына, олардың жаттықтырушыларына, сондай-ақ спорттың ойын түрлерi бойынша командалар құрамында өнер көрсететiн спортшыларға, олардың жаттықтырушылары мен клуб командаларының басшыларына ай сайынғы ақшалай қаржы төлеу туралы

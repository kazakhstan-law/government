title:
  rus: Об установлении субсидируемых видов биоагентов (энтомофагов) и биопрепаратов, а также нормативы субсидий, на 1 грамм (штук) биоагентов (энтомофагов) и биопрепаратов, приобретенных у поставщиков и отечественных производителей биоагентов (энтомофагов) и биопрепаратов
  kaz: Биоагенттердің (энтомофагтардың) және биопрепараттардың субсидияланатын түрі, сондай-ақ жеткізушілерден және отандық биоагенттерді (энтомофагтарды) және биопрепараттарды өндірушілерден сатып алынған биоагенттің (энтомофагтардың) және биопрепараттардың 1 граммына (данасына) арналған субсидиялар нормативін белгілеу туралы

act_code: '76314'
requisite: Постановление акимата города Шымкент Южно-Казахстанской области от 26 ноября 2013 года № 1028. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 25 декабря 2013 года № 2461. Утратило силу постановлением акимата города Шымкент Южно-Казахстанской области от 23 декабря 2015 года № 632
title:
  rus: Об утверждении Правил служебной этики государственных служащих аппарата акима города Шымкента, аппаратов акимов районов и исполнительных органов, финансируемых из городского бюджета
  kaz: Шымкент қаласы әкімі аппаратының, аудан әкімі аппараттары және қалалық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілерінің қызмет этикасының қағидаларын бекіту туралы

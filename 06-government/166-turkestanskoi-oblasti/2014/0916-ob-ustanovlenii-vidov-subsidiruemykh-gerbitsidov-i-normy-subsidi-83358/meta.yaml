title:
  rus: Об установлении видов субсидируемых гербицидов и нормы субсидий на 1 литр (килограмм) гербицидов, приобретенных у поставщиков гербицидов и видов субсидируемых биоагентов (энтомофагов) и биопрепаратов и нормы субсидий на 1 грамм (штук) биоагентов (энтомофагов) и биопрепаратов, приобретенных у поставщиков биоагентов (энтомофагов) и биопрепаратов
  kaz: Субсидияланатын гербицидтердің түрлері және гербицид жеткізушілерден сатып алынған гербицидтердің 1 литріне (килограмына) арналған субсидиялар нормалары және субсидияланатын биоагенттер (энтомофагтар) мен биопрепараттардың түрлері және биоагенттер (энтомофагтар) мен биопрепараттарды жеткізушілерден сатып алынған биоагенттердің (энтомофагтардың) және биопрепараттардың 1 грамына (данасына) арналған субсидиялар нормаларын белгілеу туралы

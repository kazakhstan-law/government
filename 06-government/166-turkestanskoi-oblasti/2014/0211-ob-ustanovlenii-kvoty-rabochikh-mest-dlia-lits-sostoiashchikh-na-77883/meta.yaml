requisite: Постановление акимата Сарыагашского района Южно-Казахстанской области от 11 февраля 2014 года № 46. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 5 марта 2014 года № 2557. Утратило силу постановлением акимата Сарыагашского района Южно-Казахстанской области от 29 апреля 2016 года № 234
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Южно-Казахстанской области от 28 марта 2014 года № 72. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 8 апреля 2014 года № 2596. Утратило силу постановлением акимата Южно-Казахстанской области от 1 апреля 2015 года № 85
title:
  rus: Об утверждении норматива субсидий на возмещение до 100 % затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, а также критериев и требований к поставщикам
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100 %-ға дейін өтеуге арналған субсидия нормативін, сондай-ақ жеткізушіге қойылатын өлшемдер мен талаптарды бекіту туралы

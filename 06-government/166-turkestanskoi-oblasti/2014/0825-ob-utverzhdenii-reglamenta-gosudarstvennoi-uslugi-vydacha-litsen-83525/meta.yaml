title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление деятельности по производству (формуляции) пестицидов (ядохимикатов), реализации пестицидов (ядохимикатов), применению пестицидов (ядохимикатов) аэрозольным и фумигационным способами"
  kaz: '"Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдiк және фумигациялық тәсiлдермен қолдану жөніндегі қызметті жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру" мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы'

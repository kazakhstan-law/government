title:
  rus: О мерах по реализации постановления Правительства Республики Казахстан от 4 марта 2011 года № 221 "Об утверждении Правил субсидирования из местных бюджетов на повышение урожайности и качества продукции растениеводства"
  kaz: '"Өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға жергілікті бюджеттерден субсидиялау қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 4 наурыздағы № 221 қаулысын іске асыру жөніндегі шаралар туралы'

requisite: Постановление акимата Созакского района Южно-Казахстанской области от 30 декабря 2014 года № 446. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 5 февраля 2015 года № 3006. Утратило силу постановлением акимата Созакского района Южно-Казахстанской области от 1 апреля 2015 года № 113
title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета и административных государственных служащих аппарата акима Сузакского района корпуса "Б"
  kaz: '"Б" корпусындағы Созақ ауданының бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Созақ ауданы әкімі аппараты мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы'

requisite: Постановление акимата Южно-Казахстанской области от 11 сентября 2014 года № 284. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 30 сентября 2014 года № 2816. Утратило силу постановлением акимата Южно-Казахстанской области от 20 апреля 2015 года № 110
title:
  rus: Об утверждении Методики ежегодной оценки деятельности руководителей исполнительных органов, финансируемых из Южно-Казахстанского областного бюджета, и административных государственных служащих аппарата акима Южно-Казахстанской области корпуса "Б"
  kaz: '"Б" корпусындағы Оңтүстік Қазақстан облыстық бюджеттен қаржыландырылатын атқарушы органдардың басшылары мен Оңтүстік Қазақстан облысы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы'

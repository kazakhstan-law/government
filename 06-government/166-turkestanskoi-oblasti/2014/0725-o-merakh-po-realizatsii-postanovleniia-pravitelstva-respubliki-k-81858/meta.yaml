act_code: '81858'
requisite: Постановление от 25.07.2014 № 252, Акимат Южно-Казахстанской области. Утратило силу постановлением акимата Южно-Казахстанской области от 13 июля 2015 года № 219
title:
  rus: О мерах по реализации постановления Правительства Республики Казахстан от 29 мая 2014 года № 575 "Об утверждении правил субсидирования повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте"
  kaz: '"Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң  шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгі егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауылшаруашылық дақылдарын қорғалған топырақта өңдеп өсіру шығындарын субсидиялау қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2014 жылғы 29 мамырдағы № 575 қаулысын іске асыру туралы'

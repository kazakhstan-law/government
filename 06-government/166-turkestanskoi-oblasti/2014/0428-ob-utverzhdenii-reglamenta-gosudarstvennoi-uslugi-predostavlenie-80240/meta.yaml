  title:
    rus: О внесении изменений и дополнения в постановление акимата Южно-Казахстанской области от 28 апреля  2014 года № 101 "Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты"
    kaz: Оңтүстік Қазақстан облысы әкімдігінің 2014 жылғы 28 сәуірдегі № 101 "Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну" мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы" қаулысына өзгерістер мен толықтыру енгізу туралы

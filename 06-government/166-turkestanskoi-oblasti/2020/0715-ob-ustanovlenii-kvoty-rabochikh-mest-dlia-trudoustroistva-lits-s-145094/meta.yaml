act_code: '145094'
requisite: Постановление акимата Шардаринского района Туркестанской области от 15 июля 2020 года № 172. Зарегистрировано Департаментом юстиции Туркестанской области 23 июля 2020 года № 5730
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Шардаринского района на 2020 год
  kaz: Шардара ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына 2020 жылға квоталар белгілеу туралы

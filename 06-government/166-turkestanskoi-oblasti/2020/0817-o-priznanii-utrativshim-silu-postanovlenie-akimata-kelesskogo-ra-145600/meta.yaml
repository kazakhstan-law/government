requisite: Постановление акимата Келесского района Туркестанской области от 17 августа 2020 года № 174. Зарегистрировано Департаментом юстиции Туркестанской области 18 августа 2020 года № 5756
title:
  rus: О признании утратившим силу постановление акимата Келесского района от 15 марта 2019 года № 83 «Об утверждении Правил выдачи служебного удостоверения государственным служащим государственного учреждения «Аппарат акима Келесского района», исполнительных органов, финансируемых из Келесского районного бюджета, и его описание»
  kaz: «Келес ауданы әкімінің аппараты» мемлекеттiк мекемесiнiң, Келес аудандық бюджетiнен қаржыландырылатын атқарушы органдарының мемлекеттiк қызметшiлерiне қызметтiк куәлiктi беру қағидаларын және оның сипаттамасын бекiту туралы» Келес ауданы әкімдігінің 2019 жылғы 15 наурыздағы № 83 қаулысының күшін жою туралы

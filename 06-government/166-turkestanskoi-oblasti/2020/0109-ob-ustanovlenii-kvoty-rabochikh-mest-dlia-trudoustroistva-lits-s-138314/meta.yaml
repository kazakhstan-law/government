  title:
    rus: О внесении изменения в постановление акимата Созакского района от 9 января 2020 года № 1 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования»
    kaz: «Пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» Созақ ауданы әкімдігінің 2020 жылғы 9 қаңтардағы № 1 қаулысына өзгеріс енгізу туралы

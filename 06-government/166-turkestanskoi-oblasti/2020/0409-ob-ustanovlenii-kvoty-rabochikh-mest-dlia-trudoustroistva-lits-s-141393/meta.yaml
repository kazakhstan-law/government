requisite: Постановление акимата Байдибекского района Туркестанской области от 9 апреля 2020 года № 80. Зарегистрировано Департаментом юстиции Туркестанской области 10 апреля 2020 года № 5557. Утратило силу постановлением акимата Байдибекского района Туркестанской области от 20 декабря 2020 года № 468 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:

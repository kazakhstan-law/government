requisite: Постановление акимата города Туркестан Туркестанской области от 20 февраля 2020 года № 285. Зарегистрировано Департаментом юстиции Туркестанской области 25 февраля 2020 года № 5445. Утратило силу постановлением акимата города Туркестан Туркестанской области от 20 сентября 2023 года № 365 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц освобожденных из мест лишения свободы, граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в городе Туркестан
  kaz: Түркістан қаласының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды, ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

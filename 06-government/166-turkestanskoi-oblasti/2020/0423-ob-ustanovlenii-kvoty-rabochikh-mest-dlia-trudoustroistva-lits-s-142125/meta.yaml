  title:
    rus: О внесении изменения в постановление акимата Толебийского района от 23 апреля 2020 года № 135 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Толебийского района»
    kaz: «Төлеби ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы» Төлеби ауданы әкімдігінің 2020 жылғы 23 сәуірдегі № 135 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/149920/rus

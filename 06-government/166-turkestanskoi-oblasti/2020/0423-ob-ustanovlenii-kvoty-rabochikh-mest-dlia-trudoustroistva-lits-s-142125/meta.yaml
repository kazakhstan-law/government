act_code: '142125'
requisite: Постановление акимата Толебийского района Туркестанской области от 23 апреля 2020 года № 135. Зарегистрировано Департаментом юстиции Туркестанской области 23 апреля 2020 года № 5577. Утратило силу постановлением акимата Толебийского района Туркестанской области от 14 ноября 2024 года № 618 (вводится в действие  по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Толебийского района
  kaz: Төлеби ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

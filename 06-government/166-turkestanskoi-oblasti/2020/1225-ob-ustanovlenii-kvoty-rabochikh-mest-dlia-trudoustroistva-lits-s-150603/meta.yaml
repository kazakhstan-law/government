act_code: '150603'
requisite: Постановление акимата Сарыагашского района Туркестанской области от 25 декабря 2020 года № 347. Зарегистрировано Департаментом юстиции Туркестанской области 25 декабря 2020 года № 5974
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования на 2021 год
  kaz: 2021 жылға Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Туркестанской области от 5 мая 2020 года № 112 «Об утверждении перечня приоритетных культур и нормы субсидий, а также объем бюджетных средств на повышение урожайности и качества продукции растениеводства»
    kaz: Түркістан облысы әкімдігінің «Басым дақылдар тiзбесі және субсидия нормалары, сондай-ақ, өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджет қаражатының көлемін бекіту туралы» 2020 жылғы 5 мамырдағы № 112 қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении перечня приоритетных культур и нормы субсидий, а также объем бюджетных средств на повышение урожайности и качества продукции растениеводства на 2022 год
  kaz: 2022 жылға арналған басым дақылдардың тізбесін және субсидиялар нормаларын, сондай-ақ өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджет қаражатының көлемін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Жетысайского района от 15 мая 2020 года № 277 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования 2020 год»
    kaz: Жетісай ауданы әкімдігінің 2020 жылғы 15 мамырдағы № 277 «Пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына 2020 жылға квоталар белгілеу туралы» қаулысына өзгерістер енгізу туралы

act_code: '145416'
requisite: Постановление акимата Казыгуртского района Туркестанской области от 6 августа 2020 года № 181. Зарегистрировано Департаментом юстиции Туркестанской области 10 августа 2020 года № 5746. Утратило силу постановлением акимата Казыгуртского района Туркестанской области от 5 марта 2021 года № 39 (вводится в действие по истечении десяти календарных дней после его первого дня официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Казыгуртского района 2020 года
  kaz: 2020 жылы Қазығұрт ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

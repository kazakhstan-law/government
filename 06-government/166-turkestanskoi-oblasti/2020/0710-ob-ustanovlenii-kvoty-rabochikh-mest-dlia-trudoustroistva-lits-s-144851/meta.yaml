requisite: Постановление акимата Келесского района Туркестанской области от 10 июля 2020 года № 151. Зарегистрировано Департаментом юстиции Туркестанской области 13 июля 2020 года № 5706. Утратило силу постановлением акимата Келесского района Туркестанской области от 1 апреля 2021 года № 104 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования на 2020 год
  kaz: 2020 жылға пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

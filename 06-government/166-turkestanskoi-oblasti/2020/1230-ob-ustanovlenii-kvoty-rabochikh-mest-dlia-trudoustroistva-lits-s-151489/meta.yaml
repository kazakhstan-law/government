act_code: '151489'
requisite: Постановление акимата Созакского района Туркестанской области от 30 декабря 2020 года № 427. Зарегистрировано Департаментом юстиции Туркестанской области 6 января 2021 года № 6014. Утратило силу постановлением акимата Созакского района Туркестанской области от 27 декабря 2021 года № 358 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Созакского района на 2021 год
  kaz: Созақ ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына 2021 жылға квоталар белгілеу туралы

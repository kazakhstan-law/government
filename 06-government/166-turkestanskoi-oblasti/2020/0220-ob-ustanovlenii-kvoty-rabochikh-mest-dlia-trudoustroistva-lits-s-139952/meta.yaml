  title:
    rus: О внесении изменений в постановление акимата города Туркестан от 20 февраля 2020 года № 285 «Об установлении квоты рабочих мест в городе Туркестан для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования»
    kaz: Түркістан қаласының әкімдігінің 2020 жылғы 20 ақпандағы № 285 «Түркістан қаласының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды, ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс квоталар белгілеу туралы» қаулысына өзгерістер енгізу туралы

act_code: '140354'
requisite: Постановление акимата Туркестанской области от 17 марта 2020 года № 60. Зарегистрировано Департаментом юстиции Туркестанской области 17 марта 2020 года № 5497. Утратило силу постановлением акимата Туркестанской области от 18 июня 2020 года № 139 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических)
  kaz: Субсидияланатын тыңайтқыштар түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялар нормалары, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы

act_code: '146204'
requisite: Постановление акимата Сайрамского района Туркестанской области от 7 сентября 2020 года № 363. Зарегистрировано Департаментом юстиции Туркестанской области 8 сентября 2020 года № 5785. Утратило силу постановлением акимата Сайрамского района Туркестанской области от 25 марта 2021 года № 103 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Сайрамского района
  kaz: Сайрам ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

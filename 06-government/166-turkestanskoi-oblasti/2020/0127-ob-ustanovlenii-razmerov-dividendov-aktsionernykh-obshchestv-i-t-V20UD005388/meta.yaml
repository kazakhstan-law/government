requisite: Постановление акимата города Туркестан Туркестанской области от 27 января 2020 года № 146. Зарегистрировано Департаментом юстиции Туркестанской области 31 января 2020 года № 5388. Утратило силу постановлением акимата города Туркестан Туркестанской области от 31 декабря 2025 года № 887 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

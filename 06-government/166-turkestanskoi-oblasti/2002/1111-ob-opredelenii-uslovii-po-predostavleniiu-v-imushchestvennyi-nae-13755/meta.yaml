title:
  rus: Об определении условии по предоставлению в имущественный наем (аренду) объектов, находящихся на балансе коммунальных государственных учреждений и в хозяйственном ведении или оперативном управлении государственных коммунальных предприятий, в том числе объектов государственной собственности, не подлежащих приватизации
  kaz: Коммуналдық мемлекеттік мекемелер балансындағы және мемлекеттік коммуналдық кәсіпорындардың шаруашылық жүргізуіндегі немесе жедел басқаруындағы объектілерді, оның ішінде жекешелендіруге жатпайтын мемлекеттік меншік объектілерін мүліктік жалға (жалдауға) беру шарттарын белгілеу туралы

requisite: Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2011 жылғы 11 сәуірдегі N 182 Қаулысы. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2011 жылғы 25 сәуірде N 14-6-133 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2011 жылғы 19 қыркүйектегі N 465 қаулысымен

act_code: '58829'
requisite: Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2011 жылғы 18 сәуірдегі N 189 Қаулысы. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2011 жылғы 16 мамырда N 14-6-135 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2015 жылғы 16 ақпандағы № 54 қаулысымен

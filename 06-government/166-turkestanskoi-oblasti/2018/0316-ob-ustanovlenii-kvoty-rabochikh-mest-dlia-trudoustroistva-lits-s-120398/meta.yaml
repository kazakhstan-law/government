act_code: '120398'
requisite: Постановление акимата Созакского района Южно-Казахстанской области от 16 марта 2018 года № 93. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 3 апреля 2018 года № 4495. Утратило силу постановлением акимата Созакского района Туркестанской области от 25 апреля 2019 года № 108
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

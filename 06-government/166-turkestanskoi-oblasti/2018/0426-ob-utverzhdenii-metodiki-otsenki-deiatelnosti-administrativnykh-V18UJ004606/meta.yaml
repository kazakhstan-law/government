  title:
    rus: О признании утравтившим силу постановление акимата Сайрамского района от 26 апреля 2018 года № 213 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Сайрамского района, исполнительных органов, финансируемых из районного бюджета и аппаратов акимов сельских округов»
    kaz: «Сайрам ауданы әкімі аппаратының, аудандық бюджеттен қаржыландырылатын атқарушы органдардың және ауылдық округтер әкімдері аппараттарының «Б» корпусындағы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Сайрам ауданы әкімдігінің 2018 жылғы 26 сәуірдегі № 213 қаулысының күші жойылды деп тану туралы

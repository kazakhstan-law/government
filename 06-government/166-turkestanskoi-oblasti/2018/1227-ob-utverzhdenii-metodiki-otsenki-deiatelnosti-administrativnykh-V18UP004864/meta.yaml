requisite: Постановление акимата Жетысайского района Туркестанской области от 27 декабря 2018 года № 670. Зарегистрировано Департаментом юстиции Туркестанской области 28 декабря 2018 года № 4864. Утратило силу постановлением акимата Жетысайского района Туркестанской области от 30 июня 2023 года № 533 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, города районного значения, поселка, сельских округов и исполнительных органов финансируемых из Жетысайского районного бюджета
  kaz: Жетісай аудандық бюджеттен қаржыландырылатын аудан, аудандық маңызы бар қала, кент, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

act_code: '128366'
requisite: Постановление акимата Казыгуртского района Туркестанской области от 24 декабря 2018 года № 186. Зарегистрировано Департаментом юстиции Туркестанской области 11 января 2019 года № 4882. Утратило силу постановлением акимата Казыгуртского района Туркестанской области от 6 августа 2020 года № 181 (вводится в действие по истечении десяти календарных дней после его первого дня официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Казыгуртского района
  kaz: Қазығұрт ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

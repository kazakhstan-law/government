requisite: Постановление акимата Мактааральского района Южно-Казахстанской области от 18 апреля 2018 года № 534. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 3 мая 2018 года № 4587. Утратило силу постановлением акимата Мактааральского района Туркестанской области от 27 мая 2021 года № 346 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, города районного значения, поселка, сельских округов и исполнительных органов финансируемых из Мактааральского районного бюджета
  kaz: Мақтарал аудандық бюджеттен қаржыландырылатын аудан, аудандық маңызы бар қала, кент, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

    kaz: Мақтарал ауданы әкімдігінің 2018 жылғы 18 сәуірдегі № 534 «Мақтарал аудандық бюджеттен қаржыландырылатын аудан, аудандық маңызы бар қала, кент, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысының күші жойылды деп тану туралы

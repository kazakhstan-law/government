  code: '169841'
  requisite: Постановление акимата Туркестанской области от 13 июля 2022 года № 147. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 июля 2022 года № 28812. Утратило силу постановлением акимата Туркестанской области от 3 августа 2026 года № 133 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
  title:
    rus: О внесении изменения в постановление акимата Туркестанской области от 26 декабря 2018 года № 354 «Об определении видов и порядка поощрения, а также размер денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Туркестанской области»
    kaz: Түркістан облысы әкімдігінің «Түркістан облысындағы қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» 2018 жылғы 26 желтоқсандағы № 354 қаулысына өзгеріс енгізу туралы

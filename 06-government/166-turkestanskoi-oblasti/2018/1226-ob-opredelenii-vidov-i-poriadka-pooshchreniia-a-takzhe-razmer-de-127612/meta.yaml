requisite: Постановление акимата Туркестанской области от 26 декабря 2018 года № 354. Зарегистрировано Департаментом юстиции Туркестанской области 26 декабря 2018 года № 4853. Утратило силу постановлением акимата Туркестанской области от 3 августа 2026 года № 133 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
title:
  rus: Об определении видов и порядка поощрения, а также размер денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Туркестанской области
  kaz: Түркістан облысындағы қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы

  title:
    rus: О внесении изменений в постановление акимата Толебийского района от 27 апреля 2018 года № 201 «Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов, финансируемых из районного бюджета, и административных государственных служащих аппарата акима Толебийского района корпуса "Б"»
    kaz: Төлеби ауданы әкімдігінің 2018 жылғы 27 сәуірдегі № 201 «"Б" корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Төлеби ауданы әкімі аппараты мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

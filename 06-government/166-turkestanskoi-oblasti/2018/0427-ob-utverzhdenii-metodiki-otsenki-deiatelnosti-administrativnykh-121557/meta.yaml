act_code: '121557'
requisite: Постановление акимата Толебийского района Южно-Казахстанской области от 27 апреля 2018 года № 201. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 5 мая 2018 года № 4591. Утратило силу постановлением акимата Толебийского района Туркестанской области от 20 апреля 2023 года № 280 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Толебийского района корпуса «Б»
  kaz: «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Төлеби ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата города Шымкент Южно-Казахстанской области от 6 апреля 2018 года № 167. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 27 апреля 2018 года № 4581. Утратило силу постановлением акимата города Шымкент от 25 сентября 2018 года № 181
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих аппарата акима города Шымкент, аппаратов акимов районов в городе Шымкент и исполнительных органов, финансируемых из местного бюджета корпуса «Б»
  kaz: «Б» корпусындағы Шымкент қаласы әкімі аппаратының, Шымкент қаласындағы аудан әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын атқарушы органдары мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

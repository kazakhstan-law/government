requisite: Постановление акимата города Туркестан Южно-Казахстанской области от 23 апреля 2018 года № 623. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 мая 2018 года № 4605. Утратило силу постановлением акимата города Туркестан Туркестанской области от 1 июля 2023 года № 238 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих исполнительных органов, финансируемых из местного бюджета и административных государственных служащих аппарата акима города Туркестан корпуса «Б»
  kaz: «Б» корпусындағы жергілікті бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Түркістан қаласы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата города Кентау Южно-Казахстанской области от 28 апреля 2018 года № 140. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 16 мая 2018 года № 4599. Утратило силу постановлением акимата города Кентау Туркестанской области от 12 апреля 2022 года № 133 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов, финансируемых из местного бюджета и административных государственных служащих аппарата акима города Кентау корпуса «Б»
  kaz: «Б» корпусындағы жергілікті бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Кентау қаласы әкімі аппараты мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

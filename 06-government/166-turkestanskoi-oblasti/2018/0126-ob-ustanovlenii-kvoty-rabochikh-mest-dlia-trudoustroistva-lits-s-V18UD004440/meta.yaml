requisite: Постановление акимата города Туркестан Южно-Казахстанской области от 26 января 2018 года № 56. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 2 февраля 2018 года № 4440. Утратило силу постановлением акимата города Туркестан Туркестанской области от 20 февраля 2020 года № 285 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования города Туркестан
  kaz: Түркістан қаласының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

act_code: '123126'
requisite: Постановление акимата Шардаринского района Южно-Казахстанской области от 8 июня 2018 года № 301. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 25 июня 2018 года № 4645. Утратило силу постановлением акимата Шардаринского района Туркестанской области от 15 июля 2020 года № 172 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Шардаринского района
  kaz: Шардара ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

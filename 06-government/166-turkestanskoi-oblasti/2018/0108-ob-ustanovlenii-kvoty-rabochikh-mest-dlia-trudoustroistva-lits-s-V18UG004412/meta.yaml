requisite: Постановление акимата Мактааральского района Южно-Казахстанской области от 8 января 2018 года № 1. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 22 января 2018 года № 4412. Утратило силу постановлением акимата Мактааральского района Туркестанской области от 18 марта 2019 года № 183
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Мактааральского района
  kaz: Мақтарал ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

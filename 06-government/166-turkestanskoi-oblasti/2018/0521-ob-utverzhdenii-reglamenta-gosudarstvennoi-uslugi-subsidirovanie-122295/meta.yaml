  title:
    rus: О внесении изменения в постановление акимата Южно-Казахстанской области от 21 мая 2018 года № 140 «Об утверждении регламента государственной услуги Субсидирование затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства продуктов ее глубокой переработки»
    kaz: Оңтүстiк Қазақстан облысы әкiмдiгiнiң 2018 жылғы 21 мамырдағы № 140 «Қайта өңдеуші кәсіпорындардың ауыл шаруашылығы өнімін тереңдете қайта өңдеп өнім өндіру үшін оны сатып алуға арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

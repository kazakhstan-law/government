  title:
    rus: О признании утратившим силу постановления акимата города Кентау от 28 апреля 2018 года № 140 «Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов, финансируемых из местного бюджета и административных государственных служащих аппарата акима города Кентау корпуса «Б»
    kaz: Кентау қаласы әкiмдiгiнiң 2018 жылғы 28 сәуірдегі № 140 «Б» корпусындағы жергілікті бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Кентау қаласы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысының күші жойылды деп тану туралы

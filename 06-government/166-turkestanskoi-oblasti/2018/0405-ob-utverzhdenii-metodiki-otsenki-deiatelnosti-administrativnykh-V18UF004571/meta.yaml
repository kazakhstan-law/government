  title:
    rus: О признании утратившим силу постановления акимата Казыгуртского района Южно-Казахстанской области от 5 апреля 2018 года № 120 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района, села, сельских округов и исполнительных органов финансируемых из Казыгуртского районного бюджета»
    kaz: Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2018 жылғы 5 сәуірдегі № 120 «Қазығұрт аудандық бюджеттен қаржыландырылатын аудан, ауыл, ауылдық округтері әкімдері аппараттары мен атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысының күші жойылды деп тану туралы

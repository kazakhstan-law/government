act_code: '121530'
requisite: Постановление акимата Сайрамского района Южно-Казахстанской области от 11 апреля 2018 года № 178. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 4 мая 2018 года № 4588. Утратило силу постановлением акимата Сайрамского района Туркестанской области от 7 сентября 2020 года № 365 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственным служащим государственного учреждения «Аппарат акима Сайрамского района», исполнительных органов, финансируемых из Сайрамского районного бюджета, и его описание
  kaz: «Сайрам ауданы әкімінің аппараты» мемлекеттiк мекемесiнiң, Сайрам аудандық бюджетiнен қаржыландырылатын атқарушы органдарының мемлекеттiк қызметшiлерiне қызметтiк куәлiктi беру қағидаларын және оның сипаттамасын бекiту туралы

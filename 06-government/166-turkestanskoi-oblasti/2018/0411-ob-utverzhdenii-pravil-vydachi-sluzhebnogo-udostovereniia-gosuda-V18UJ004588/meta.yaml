    kaz: Сайрам ауданы әкімдігінің 11 сәуір 2018 жылғы № 178 «Сайрам ауданы әкімінің аппараты» мемлекеттiк мекемесiнiң, Сайрам аудандық бюджетiнен қаржыландырылатын атқарушы органдарының мемлекеттiк қызметшiлерiне қызметтiк куәлiктi беру қағидаларын және оның сипаттамасын бекiту туралы» қаулысының күші жойылды деп тану туралы

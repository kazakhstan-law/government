    kaz: Түркістан облысы әкiмдiгiнiң 2018 жылғы 3 тамыздағы № 228 «Түркістан облысы әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын облыстық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысының күші жойылды деп тану туралы

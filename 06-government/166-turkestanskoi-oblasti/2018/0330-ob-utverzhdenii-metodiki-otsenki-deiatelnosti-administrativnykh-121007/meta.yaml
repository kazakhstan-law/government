requisite: Постановление акимата Шардаринского района Южно-Казахстанской области от 30 марта 2018 года № 154. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 апреля 2018 года № 4546. Утратило силу постановлением акимата Шардаринского района Туркестанской области от 24 июля 2020 года № 183 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

  title:
    rus: О признании утратившим силу постановления акимата города Арыс от 28 апреля 2018 года № 170 «Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из городского бюджета и административных государственных служащих аппарата акима города Арыс корпуса «Б»»
    kaz: Арыс қаласы әкiмдiгiнiң 2018 жылғы 28 сәуірдегі № 170 ««Б» корпусындағы қалалық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Арыс қаласы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысының күші жойылды деп тану туралы

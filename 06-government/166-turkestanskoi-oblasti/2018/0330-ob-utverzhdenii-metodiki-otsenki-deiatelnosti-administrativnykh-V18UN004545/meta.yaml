requisite: Постановление акимата Тюлькубасского района Южно-Казахстанской области от 30 марта 2018 года № 78. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 18 апреля 2018 года № 4545. Утратило силу постановлением акимата Тюлькубасского района Туркестанской области от 18 мая 2022 года № 125 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Тюлькубасского района корпуса «Б»
  kaz: «Б» корпусындағы аудандық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Түлкібас ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

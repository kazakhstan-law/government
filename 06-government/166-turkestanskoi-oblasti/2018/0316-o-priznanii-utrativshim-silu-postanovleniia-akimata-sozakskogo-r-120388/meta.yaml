title:
  rus: О признании утратившим силу постановления акимата Созакского района от 27 ноября 2017 года за № 312 «Об утверждении коэффициента зонирования в Созакском районе, учитывающий месторасположение объекта налогообложения в населенном пункте»
  kaz: Созақ ауданы әкімдігінің 2017 жылғы 27 қарашадағы № 312 «Созақ ауданында салық салу объектісінің елдi мекенде орналасуын есепке алынатын аймаққа бөлу коэффициентiн бекіту туралы» қаулысының күшін жою туралы

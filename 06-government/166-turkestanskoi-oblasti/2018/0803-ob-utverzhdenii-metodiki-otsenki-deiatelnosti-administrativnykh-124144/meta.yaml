act_code: '124144'
requisite: Постановление акимата Туркестанской области от 3 августа 2018 года № 228. Зарегистрировано Департаментом юстиции Туркестанской области 14 августа 2018 года № 4709. Утратило силу постановлением акимата Туркестанской области от 29 мая 2023 года № 97 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Туркестанской области и исполнительных органов, финансируемых из областного бюджета
  kaz: Түркістан облысы әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын облыстық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

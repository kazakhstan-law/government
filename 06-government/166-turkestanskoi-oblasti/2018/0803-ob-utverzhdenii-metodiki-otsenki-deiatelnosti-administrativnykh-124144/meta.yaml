  title:
    rus: О внесении изменений в постановление акимата Туркестанской области от 3 августа 2018 года № 228 «Об утверждении Методики оценки деятельности руководителей исполнительных органов, финансируемых из областного бюджета, и административных государственных служащих аппарата акима Туркестанской области корпуса «Б»
    kaz: Түркістан облысы әкiмдiгiнiң «Б» корпусындағы облыстық бюджеттен қаржыландырылатын атқарушы органдардың басшылары мен Түркістан облысы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» 2018 жылғы 3 тамыздағы № 228 қаулысына өзгерістер енгізу туралы

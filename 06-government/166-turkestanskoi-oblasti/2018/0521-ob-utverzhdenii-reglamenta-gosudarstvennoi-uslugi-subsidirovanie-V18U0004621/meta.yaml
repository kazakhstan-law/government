  kaz: «Қайта өңдеуші кәсіпорындардың ауыл шаруашылығы өнімін тереңдете қайта өңдеп өнім өндіру үшін оны сатып алуға арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

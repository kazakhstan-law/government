act_code: '153853'
requisite: Постановление акимата города Арыс Туркестанской области от 26 марта 2021 года № 114. Зарегистрировано Департаментом юстиции Туркестанской области 29 марта 2021 года № 6129
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования города Арыс на 2021 год
  kaz: Арыс қаласының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына 2021 жылға квоталар белгілеу туралы

act_code: '154221'
requisite: Постановление акимата Келесского района Туркестанской области от 1 апреля 2021 года № 104. Зарегистрировано Департаментом юстиции Туркестанской области 1 апреля 2021 года № 6135
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Келесского района на 2021 год
  kaz: Келес ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына 2021 жылға квота белгілеу туралы

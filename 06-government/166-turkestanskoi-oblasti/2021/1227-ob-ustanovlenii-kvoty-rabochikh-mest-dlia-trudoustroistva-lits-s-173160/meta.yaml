act_code: '173160'
requisite: Постановление акимата Созакского района Туркестанской области от 27 декабря 2021 года № 358
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Созакского района Туркестанской области на 2022 год
  kaz: 2022 жылға Түркістан облысы Созақ ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының  қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды  жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

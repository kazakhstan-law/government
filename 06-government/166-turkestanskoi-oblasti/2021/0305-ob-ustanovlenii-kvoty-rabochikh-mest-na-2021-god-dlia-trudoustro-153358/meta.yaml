act_code: '153358'
requisite: Постановление акимата Казыгуртского района Туркестанской области от 5 марта 2021 года № 39. Зарегистрировано Департаментом юстиции Туркестанской области 9 марта 2021 года № 6087
title:
  rus: Об установлении квоты рабочих мест на 2021 год для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Казыгуртского района
  kaz: 2021 жылы Қазығұрт ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

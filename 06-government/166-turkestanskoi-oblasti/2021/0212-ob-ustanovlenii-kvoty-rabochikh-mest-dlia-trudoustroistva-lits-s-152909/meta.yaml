act_code: '152909'
requisite: Постановление акимата Шардаринского района Туркестанской области от 12 февраля 2021 года № 51. Зарегистрировано Департаментом юстиции Туркестанской области 15 февраля 2021 года № 6066
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Шардаринского района на 2021 год
  kaz: Шардара ауданының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына 2021 жылға квоталар белгілеу туралы

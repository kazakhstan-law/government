act_code: '154217'
requisite: Постановление акимата Мактааральского района Туркестанской области от 31 марта 2021 года № 190. Зарегистрировано Департаментом юстиции Туркестанской области 1 апреля 2021 года № 6134. Утратило силу постановлением акимата Мактааральского района Туркестанской области от 1 августа 2022 года № 473 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специальностей, востребованных для предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акима поселка, сельского округа, прибывшим для работы и проживания в сельскую местность
  kaz: Ауылдық жерде жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларына ұсынылатын сұранысқа ие мамандардың лауазымдарының тізбесін айқындау туралы

act_code: '152906'
requisite: Постановление акимата Шардаринского района Туркестанской области от 12 февраля 2021 года № 52. Зарегистрировано Департаментом юстиции Туркестанской области 15 февраля 2021 года № 6065. Утратило силу постановлением акимата Шардаринского района Туркестанской области от 21 декабря 2023 года № 331 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

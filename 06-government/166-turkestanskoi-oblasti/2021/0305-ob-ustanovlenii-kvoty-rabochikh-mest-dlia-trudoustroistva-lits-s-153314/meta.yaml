act_code: '153314'
requisite: Постановление акимата Ордабасынского района Туркестанской области от 5 марта 2021 года № 120. Зарегистрировано Департаментом юстиции Туркестанской области 5 марта 2021 года № 6085
title:
  rus: «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Ордабасынского района на 2021 год»
  kaz: «2021 жылға Ордабасы ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы»

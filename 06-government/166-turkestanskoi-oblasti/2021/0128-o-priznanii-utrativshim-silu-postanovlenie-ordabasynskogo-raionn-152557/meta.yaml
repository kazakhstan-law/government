act_code: '152557'
requisite: Постановление акимата Ордабасынского района Туркестанской области от 28 января 2021 года № 8. Зарегистрировано Департаментом юстиции Туркестанской области 29 января 2021 года № 6047
title:
  rus: О признании утратившим силу постановление Ордабасынского районного акимата от 15 мая 2020 года № 216 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Ордабасынского района»
  kaz: Ордабасы ауданы әкімдігінің 2020 жылғы 15 мамырдағы № 216 «Ордабасы ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы» қаулысының күшін жою туралы

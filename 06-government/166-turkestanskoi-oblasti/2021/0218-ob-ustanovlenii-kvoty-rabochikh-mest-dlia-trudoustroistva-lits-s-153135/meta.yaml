act_code: '153135'
requisite: Постановление акимата города Кентау Туркестанской области от 18 февраля 2021 года № 105. Зарегистрировано Департаментом юстиции Туркестанской области 19 февраля 2021 года № 6074
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования города Кентау на 2021 год
  kaz: Кентау қаласының пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған адамдарды және ата анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына 2021 жылға квоталар белгілеу туралы

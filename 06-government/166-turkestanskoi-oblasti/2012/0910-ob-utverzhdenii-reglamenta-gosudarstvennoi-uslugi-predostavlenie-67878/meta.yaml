requisite: Постановление акимата Южно-Казахстанской области от 10 сентября 2012 года № 265. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 3 октября 2012 года № 2107. Утратило силу постановлением акимата Южно-Казахстанской области от 27 июня 2013 года № 157
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызметінің регламентін бекіту туралы'

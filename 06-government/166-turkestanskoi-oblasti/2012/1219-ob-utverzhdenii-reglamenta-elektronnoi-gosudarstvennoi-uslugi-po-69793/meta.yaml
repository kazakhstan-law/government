requisite: Постановление акимата Южно-Казахстанской области от 19 декабря 2012 года № 379. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 29 декабря 2012 года № 2185. Утратило силу постановлением акимата Южно-Казахстанской области от 27 июня 2013 года № 157
title:
  rus: Об утверждении регламента электронной государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою және олардың кезегі" электрондық мемлекеттік қызметінің регламентін бекіту туралы'

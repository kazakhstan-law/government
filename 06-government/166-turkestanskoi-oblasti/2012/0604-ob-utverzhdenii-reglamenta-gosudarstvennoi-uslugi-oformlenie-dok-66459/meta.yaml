title:
  rus: Об утверждении регламента государственной услуги "Оформление документов на социальное обслуживание в государственных и негосударственных медико-социальных учреждениях (организациях), предоставляющих услуги за счет государственных бюджетных средств"
  kaz: '"Мемлекеттік бюджет қаражаты есебінен қызмет көрсететін мемлекеттік және мемлекеттік емес медициналық-әлеуметтік мекемелерде (ұйымдарда) әлеуметтік қызмет көрсетуге арналған құжаттарды ресімдеу" мемлекеттік қызметінің регламентін бекіту туралы'

act_code: '69638'
requisite: Постановление областного акимата Южно-Казахстанской области № 382 от 19 декабря 2012 года. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 29 декабря 2012 года № 2187. Утратило силу постановлением акимата Южно-Казахстанской области от 27 июня 2013 года № 157
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление вида деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуi және өткiзуi жөнiндегi қызмет түрін жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" электрондық мемлекеттік қызметінің регламентін бекіту туралы'

act_code: '11037'
requisite: Постановление акимата Южно-Казахстанской области от 7 ноября 2001 года № 210. Зарегистрировано Управлением юстиции Южно-Казахстанской области 18 января 2002 года № 462. Утратило силу постановлением акимата Южно-Казахстанской области от 18 ноября 2003 года № 558
title:
  rus: О проведении конкурсов (тендеров) по предоставлению права на промысловый лов рыбы, закреплению водоемов (участков) и распределению объемов (лимитов) вылова рыбы между природопользователями по Южно-Казахстанской области
  kaz: Оңтүстік Қазақстан облысы бойынша табиғатты пайдаланушылар арасында кәсіптік балық аулау құқығын беру, су айдындарын (учаскелерін) бекіту және балық аулау мөлшерін (лимитін) үлестіру жөнінде конкурс (тендер) өткізу туралы

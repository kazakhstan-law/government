act_code: '221536'
requisite: Постановление акимата города Туркестан Туркестанской области от 5 января 2026 года № 1
title:
  rus: Об утверждении правил обеспечении возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в городе Туркестан
  kaz: Түркістан қаласындағы пәтерлер, тұрғын емес үй-жайлар меншік иелерінің көппәтерлі тұрғын үйде лифтілерді жөндеуге және ауыстыруға, күрделі жөндеуге байланысты ақшаны қайтаруын қамтамасыз ету қағидаларын бекіту туралы

act_code: '223050'
requisite: Постановление акимата Туркестанской области от 11 марта 2026 года № 68
title:
  rus: Об утверждении перечня приоритетных культур и норм субсидирования, а также перечня субсидируемых видов удобрений (за исключением органических удобрений) и норм субсидирования на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений на 2026 год
  kaz: 2026 жылға арналған басым дақылдардың тiзбесі және субсидиялар нормаларын, сондай-ақ тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын бекіту туралы

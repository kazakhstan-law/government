title:
  rus: Об определении порядка и условий установления стимулирующих надбавок за счет средств местного бюджета к должностным окладам работников организаций, финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын ұйымдар жұмыскерлерінің лауазымдық айлықақыларына жергілікті бюджет қаражаты есебінен ынталандыру үстеме ақыларын белгілеу тәртібі мен шарттарын айқындау туралы

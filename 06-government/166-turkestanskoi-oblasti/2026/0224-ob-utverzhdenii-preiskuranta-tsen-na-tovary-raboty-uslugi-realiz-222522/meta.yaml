act_code: '222522'
requisite: Постановление акимата Туркестанской области от 24 февраля 2026 года № 62
title:
  rus: Об утверждении прейскуранта цен на товары (работы, услуги), реализуемые государственными архивами управления цифровизации, оказания государственных услуг и архивов Туркестанской области
  kaz: Түркістан облысының цифрландыру, мемлекеттік қызметтер көрсету және архивтер басқармасының мемлекеттік архивтерімен өткізілетін тауарларға (жұмыстарға, көрсетілетін қызметтерге) баға прейскурантын бекіту туралы

requisite: Оңтүстік Қазақстан облысы Бәйдібек ауданы әкімдігінің 2010 жылғы 9 қарашадағы N 421 Қаулысы. Оңтүстік Қазақстан облысы Әділет департаментінде 2010 жылғы 23 қарашада N 14-5-101 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Бәйдібек ауданы әкімдігінің 2012 жылғы 6 наурыздағы № 67 Қаулысымен

requisite: Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2010 жылғы 29 сәуірдегі N 180 Қаулысы. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2010 жылғы 5 мамырда N 14-13-71 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2013 жылғы 30 қаңтардағы № 76 қаулысымен

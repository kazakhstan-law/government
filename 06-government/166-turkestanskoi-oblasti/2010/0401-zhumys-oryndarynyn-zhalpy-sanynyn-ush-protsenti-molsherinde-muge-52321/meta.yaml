requisite: Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2010 жылғы 1 сәуірдегі N 161 Қаулысы. Оңтүстік Қазақстан облысы Ордабасы ауданының Әділет басқармасында 2010 жылғы 5 мамырда N 14-8-82 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2013 жылғы 22 маусымдағы № 308 қаулысымен

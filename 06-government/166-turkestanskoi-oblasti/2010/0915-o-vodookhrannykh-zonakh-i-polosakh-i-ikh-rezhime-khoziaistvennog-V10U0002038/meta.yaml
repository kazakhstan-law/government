title:
  rus: О водоохранных зонах и полосах и их режиме хозяйственного использования на реках Бадам, Арысь, Машат, Аксу, Келес, Боралдай, Шаян, Сайрамсу, Буржар, прудов Текесу, Узынбулак, Ащи, Шилтер, Тогыс, Боген, Бадам на озерах Кызылколь, Колкент на территориях Тюлькубасского, Ордабасинского, Байдибекского, Сарыагашского, Казыгуртского, Сузакского, Сайрамского, Толебийского, Отырарского районов и городов Шымкент, Арысь, водохранилища Шардара в Шардаринском, Мактаральском, Сарыагашском районах Южно-Казахстанской области
  kaz: Оңтүстік Қазақстан облысының Шымкент, Арыс қалалары және Сайрам, Төлеби, Сарыағаш, Қазығұрт, Түлкібас, Ордабасы, Бәйдібек, Отырар, Созақ, аудандарындағы Бадам, Арыс, Ақсу, Келес, Машат, Боралдай, Шаян, Сайрамсу, Бөржар өзендерінің, Қызылкөл, Көлкент көлдерінің, Текесу, Шілтер, Ұзынбұлақ, Ащы, Тоғыс, Бөген, Бадам тоғандарының және Шардара, Мақтаарал, Сарыағаш аудандарындағы Шардара су қоймасының су қорғау аймақтары мен белдеулері және олардың шаруашылық пайдалану режимі туралы

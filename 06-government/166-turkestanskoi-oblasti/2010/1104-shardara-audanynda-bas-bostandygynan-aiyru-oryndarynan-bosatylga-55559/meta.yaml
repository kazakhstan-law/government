requisite: Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2010 жылғы 4 қарашадағы N 649 қаулысы. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2010 жылғы 24 қарашада N 14-15-104 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2012 жылғы 10 ақпандағы № 70 Қаулысымен

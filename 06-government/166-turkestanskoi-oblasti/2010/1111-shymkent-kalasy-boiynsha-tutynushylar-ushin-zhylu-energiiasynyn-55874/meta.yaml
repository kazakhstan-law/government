act_code: '55874'
requisite: Оңтүстік Қазақстан облысы Шымкент қаласы әкімдігінің 2010 жылғы 11 қарашадағы № 1818 Қаулысы. Оңтүстік Қазақстан облысы Шымкент қаласының Әділет басқармасында 2010 жылғы 10 желтоқсанда № 14-1-126 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Шымкент қаласы әкімдігінің 2014 жылғы 22 қазандағы № 2205 қаулысымен

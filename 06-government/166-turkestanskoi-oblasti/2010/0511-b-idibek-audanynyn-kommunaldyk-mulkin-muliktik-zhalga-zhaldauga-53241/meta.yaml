requisite: Оңтүстік Қазақстан облысы Бәйдібек ауданы әкімдігінің 2010 жылғы 11 мамырдағы N 193 Қаулысы. Оңтүстік Қазақстан облысы Бәйдібек ауданының Әділет басқармасында 2010 жылғы 16 маусымда N 14-5-95 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Бәйдібек ауданы әкімдігінің 2011 жылғы 26 қазандағы N 522 Қаулысымен

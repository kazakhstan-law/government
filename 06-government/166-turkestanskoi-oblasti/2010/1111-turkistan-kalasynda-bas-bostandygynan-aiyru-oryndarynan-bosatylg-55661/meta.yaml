requisite: Оңтүстік Қазақстан облысы Түркістан қаласы әкімдігінің 2010 жылғы 11 қарашадағы N 1101 Қаулысы. Оңтүстік Қазақстан облысы Түркістан қаласының Әділет басқармасында 2010 жылғы 29 қарашада N 14-4-88 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түркістан қаласы әкімдігінің 2012 жылғы 10 қаңтардағы № 38 Қаулысымен

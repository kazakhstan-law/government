requisite: Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2010 жылғы 17 қыркүйектегі N 421 Қаулысы. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2010 жылғы 22 қазанда N 14-6-117 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2012 жылғы 27 тамыздағы № 399 Қаулысымен

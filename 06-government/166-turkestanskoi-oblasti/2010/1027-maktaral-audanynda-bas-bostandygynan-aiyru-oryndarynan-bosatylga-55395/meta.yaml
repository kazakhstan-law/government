requisite: Оңтүстік Қазақстан облысы Мақтаарал ауданы әкімдігінің 2010 жылғы 27 қазандағы N 889 қаулысы. Оңтүстік Қазақстан облысы Мақтаарал ауданы Әділет басқармасында 2010 жылғы 15 қарашада N 14-7-127 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Мақтаарал ауданы әкімдігінің 2011 жылғы 29 желтоқсандағы № 2347 Қаулысымен

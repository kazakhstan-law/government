act_code: '57023'
requisite: Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2010 жылғы 14 желтоқсандағы N 535 Қаулысы. Оңтүстік Қазақстан облысы Ордабасы ауданының Әділет басқармасында 2011 жылғы 18 қаңтарда N 14-8-98 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Ордабасы ауданы әкімі аппаратының 2013 жылғы 18 наурыздағы № 138 қаулысымен
title:

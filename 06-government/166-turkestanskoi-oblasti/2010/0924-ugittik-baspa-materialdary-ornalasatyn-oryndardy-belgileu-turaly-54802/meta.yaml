requisite: Оңтүстік Қазақстан облысы Шардара ауданы әкімдігінің 2010 жылғы 24 қыркүйектегі N 568 қаулысы. Оңтүстік Қазақстан облысы Шардара ауданының Әділет басқармасында 2010 жылғы 8 қазанда N 14-15-100 тіркелді. Күші жойылды - Шардара ауданы әкімдігінің 2011 жылғы 25 ақпандағы N 111 Қаулысымен

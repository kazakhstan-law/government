act_code: '56002'
requisite: Оңтүстік Қазақстан облысы Созақ ауданы әкімдігінің 2010 жылғы 10 қарашадағы N 491 Қаулысы. Оңтүстік Қазақстан облысы Созақ ауданының Әділет басқармасында 2010 жылғы 14 желтоқсанда N 14-12-104 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Созақ ауданы әкімдігінің 2011 жылғы 21 желтоқсандағы N 452 Қаулысымен

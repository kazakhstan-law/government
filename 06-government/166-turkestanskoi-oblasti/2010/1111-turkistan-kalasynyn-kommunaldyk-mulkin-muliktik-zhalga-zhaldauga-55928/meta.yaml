requisite: Оңтүстік Қазақстан облысы Түркістан қаласы әкімдігінің 2010 жылғы 11 қарашадағы N 1103 қаулысы. Оңтүстік Қазақстан облысы Түркістан қаласының Әділет басқармасында 2010 жылғы 14 желтоқсанда N 14-4-89 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Түркістан қаласы әкімдігінің 2011 жылғы 26 қазандағы N 980 Қаулысымен

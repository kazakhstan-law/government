requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2010 жылғы 15 қыркүйектегі N 802 Қаулысы. Оңтүстік Қазақстан облысының Әділет департаментінде 2010 жылғы 24 қыркүйекте N 14-10-148 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2010 жылғы 29 желтоқсандағы N 1175 Қаулысымен

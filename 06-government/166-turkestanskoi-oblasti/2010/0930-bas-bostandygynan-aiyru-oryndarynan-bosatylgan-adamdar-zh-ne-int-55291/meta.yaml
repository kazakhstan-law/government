requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2010 жылғы 30 қыркүйектегі N 843 Қаулысы. Оңтүстік Қазақстан облысы Әділет департаментінде 2010 жылғы 4 қарашада N 14-10-150 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2012 жылғы 02 ақпандағы № 97 қаулысымен

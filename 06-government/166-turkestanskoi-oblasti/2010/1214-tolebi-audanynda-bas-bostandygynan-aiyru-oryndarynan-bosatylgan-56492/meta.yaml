requisite: Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2010 жылғы 14 желтоқсандағы N 539 Қаулысы. Оңтүстік Қазақстан облысы Әділет департаментінде 2011 жылғы 5 қаңтарда N 14-13-82 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2012 жылғы 13 ақпандағы № 63 Қаулысымен

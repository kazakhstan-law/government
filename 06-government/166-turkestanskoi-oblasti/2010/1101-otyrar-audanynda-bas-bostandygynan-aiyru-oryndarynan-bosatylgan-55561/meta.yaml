requisite: Оңтүстік Қазақстан облысы Отырар ауданы әкімдігінің 2010 жылғы 1 қарашадағы N 510 Қаулысы. Оңтүстік Қазақстан облысы Отырар ауданының Әділет басқармасында 2010 жылғы 25 қарашада N 14-9-137 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Отырар ауданы әкімдігінің 2012 жылғы 13 ақпандағы № 48 Қаулысымен

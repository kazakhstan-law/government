requisite: Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2007 жылғы 12 желтоқсандағы N 503 Қаулысы. Оңтүстік Қазақстан облысы Қазығұрт ауданының Әділет басқармасында 2008 жылғы 11 қаңтарда N 14-6-50 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Қазығұрт ауданы әкімдігінің 2009 жылғы 22 қазандағы N 467 Қаулысымен

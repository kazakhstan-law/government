act_code: '39171'
requisite: Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2007 жылғы 8 қаңтардағы N 7 Қаулысы. Оңтүстік Қазақстан облысы Төлеби ауданының Әділет басқармасында 2007 жылғы 22 қаңтарда N 14-13-24 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Төлеби ауданы әкімдігінің 2013 жылғы 30 қаңтардағы № 76 қаулысымен

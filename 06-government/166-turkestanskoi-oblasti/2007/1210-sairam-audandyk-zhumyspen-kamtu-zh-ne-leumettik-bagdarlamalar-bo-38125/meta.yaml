act_code: '38125'
requisite: Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2007 жылғы 10 желтоқсандағы N 2516 қаулысы. Оңтүстік Қазақстан облысы Сайрам ауданының Әділет басқармасында 2008 жылғы 22 қаңтарда N 14-10-78 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Сайрам ауданы әкімдігінің 2009 жылғы 19 қарашадағы N 1139 қаулысымен

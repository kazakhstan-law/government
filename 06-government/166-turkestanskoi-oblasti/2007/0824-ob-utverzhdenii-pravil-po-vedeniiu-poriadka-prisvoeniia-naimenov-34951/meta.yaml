act_code: '34951'
requisite: Постановление акимата Южно-Казахстанской области от 24 августа 2007 года № 271. Зарегистрировано Департаментом юстиции Южно-Казахстанской области 6 сентября 2007 года № 1965. Утратило силу постановлением акимата Южно-Казахстанской области от 20 февраля 2017 года № 17
title:
  rus: Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенного пункта, требования к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Южно-Казахстанской области
  kaz: Оңтүстік Қазақстан облысының аумағындағы елді мекеннің құрамдас бөліктеріне атаулар беру және қайта атау тәртібін жүргізу жөніндегі ережені, жер учаскелеріне, ғимараттар мен құрылыстарға реттік нөмірлер беруге қойылатын талаптарды бекіту туралы

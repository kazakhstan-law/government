requisite: Оңтүстік Қазақстан облысы Ордабасы ауданы әкімдігінің 2007 жылғы 27 сәуірдегі № 149 қаулысы. Оңтүстік Қазақстан облысы Ордабасы ауданының Әділет басқармасында 2007 жылғы 17 мамырда № 14-8-33 болып тіркелді

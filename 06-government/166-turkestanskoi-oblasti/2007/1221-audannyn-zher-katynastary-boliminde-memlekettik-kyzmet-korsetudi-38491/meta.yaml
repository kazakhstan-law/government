requisite: Оңтүстік Қазақстан облысы Мақтаарал ауданы әкімдігінің 2007 жылғы 21 желтоқсандағы N 714 Қаулысы. Оңтүстік Қазақстан облысы Мақтаарал ауданының Әділет басқармасында 2008 жылғы 1 ақпанда N 14-7-58 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Мақтаарал ауданы әкімдігінің 2009 жылғы 24 қарашадағы N 958 Қаулысымен

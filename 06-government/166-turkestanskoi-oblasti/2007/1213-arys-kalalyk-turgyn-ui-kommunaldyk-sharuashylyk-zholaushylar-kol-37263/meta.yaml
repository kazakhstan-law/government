requisite: Оңтүстік Қазақстан облысы Арыс қалалық әкімдігінің 2007 жылғы 13 желтоқсандағы N 1121 қаулысы. Оңтүстік Қазақстан облысы Арыс қаласының Әділет Басқармасында 2008 жылғы 22 қаңтарда N 14-2-51 тіркелді. Күші жойылды - Оңтүстік Қазақстан облысы Арыс қаласының әкімдігінің 2009 жылғы 15 қазандағы N 444 Қаулысымен

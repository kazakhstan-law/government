requisite: Постановление акимата города Кентау Туркестанской области от 2 мая 2025 года № 159. Зарегистрировано в Департаменте юстиции Туркестанской области 12 мая 2025 года № 6704-13
title:
  rus: Об утверждении правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Кентау
  kaz: Кентау қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

act_code: '214862'
requisite: Постановление акимата Сауранского района Туркестанской области от 29 апреля 2025 года № 86
title:
  rus: Об утверждении правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов,  направленных на придание единого архитектурного облика району Сауран
  kaz: Сауран ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

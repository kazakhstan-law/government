title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» исполнительных органов финансируемых из городского бюджета и административных государственных служащих аппарат акима города и аппаратов акимов сельских округов города Арыс
  kaz: «Б» корпусындағы қалалық бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік әкімшілік қызметшілері мен Арыс қаласы әкімі аппараты және ауылдық округ әкімі аппараттарының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы

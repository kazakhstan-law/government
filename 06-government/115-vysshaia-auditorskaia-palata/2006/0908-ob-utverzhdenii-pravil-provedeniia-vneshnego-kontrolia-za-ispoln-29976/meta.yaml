    kaz: '"Республикалық бюджеттiң атқарылуына сыртқы бақылауды жүргiзу ережесiн бекiту туралы" Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2006 жылғы 8 қыркүйектегі N 57 қаулысына өзгерістер мен толықтырулар енгізу туралы'

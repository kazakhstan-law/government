  title:
    rus: О внесении изменений и дополнений в нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 31 марта 2016 года № 5-НҚ «Об утверждении процедурных стандартов внешнего государственного аудита и финансового контроля»
    kaz: «Сыртқы мемлекеттік аудиттің және қаржылық бақылаудың рәсімдік стандарттарын бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2016 жылғы 31 наурыздағы № 5-НҚ нормативтік қаулысына өзгерістер мен толықтырулар енгізу туралы

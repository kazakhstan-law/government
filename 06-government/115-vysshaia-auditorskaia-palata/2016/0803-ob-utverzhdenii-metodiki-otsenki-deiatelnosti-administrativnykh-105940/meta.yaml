requisite: Нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 3 августа 2016 года № 10-НҚ. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 сентября 2016 года № 14202. Утратило силу нормативным постановлением Председателя Счетного комитета по контролю за исполнением Республиканского бюджета от 7 апреля 2017 года № 2-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

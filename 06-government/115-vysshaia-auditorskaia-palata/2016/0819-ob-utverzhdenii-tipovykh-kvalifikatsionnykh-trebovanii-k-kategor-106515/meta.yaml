  code: '113171'
  requisite: Нормативное постановление Председателя Счетного комитета по контролю за исполнением Республиканского бюджета от 24 мая 2017 года № 4-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2017 года № 15290. Утратил силу нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 26 февраля 2018 года № 6-НҚ (вводится в действие после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 19 августа 2016 года № 11-НҚ «Об утверждении Типовых квалификационных требований к категориям должностей государственных аудиторов уполномоченных органов внешнего государственного аудита и финансового контроля, являющихся административными государственными служащими корпуса «Б»
    kaz: «Б» корпусының мемлекеттік әкімшілік қызметшілері болып табылатын, сыртқы мемлекеттік аудит және қаржылық бақылау уәкілетті органдарының мемлекеттік аудиторлары лауазымдарының санаттарына қойылатын үлгілік біліктілік талаптарын бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2016 жылғы 19 тамыздағы № 11-НҚ нормативтік қаулысына өзгеріс енгізу туралы

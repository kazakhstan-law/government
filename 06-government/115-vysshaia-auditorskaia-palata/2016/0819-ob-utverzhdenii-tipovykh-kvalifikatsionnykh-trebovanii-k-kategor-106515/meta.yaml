requisite: Нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 19 августа 2016 года № 11-НҚ. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 сентября 2016 года № 14267. Утратил силу нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 26 февраля 2018 года № 6-НҚ (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Типовых квалификационных требований к категориям должностей государственных аудиторов уполномоченных органов внешнего государственного аудита и финансового контроля, являющихся административными государственными служащими корпуса "Б"
  kaz: '"Б" корпусының мемлекеттік әкімшілік қызметшілері болып табылатын, сыртқы мемлекеттік аудит және қаржылық бақылау уәкілетті органдарының мемлекеттік аудиторлары лауазымдарының санаттарына қойылатын үлгілік біліктілік талаптарын бекіту туралы'

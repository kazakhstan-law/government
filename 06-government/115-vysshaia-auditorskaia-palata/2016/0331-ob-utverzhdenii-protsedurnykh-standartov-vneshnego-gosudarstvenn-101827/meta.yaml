  title:
    rus: О внесении изменений и дополнений в нормативные постановления Счетного комитета по контролю за исполнением республиканского бюджета от 30 июля 2020 года № 6-НҚ «Об утверждении Правил проведения внешнего государственного аудита и финансового контроля» и от 31 марта 2016 года № 5-НҚ «Об утверждении процедурных стандартов внешнего государственного аудита и финансового контроля
    kaz: Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің «Сыртқы мемлекеттік аудит және қаржылық бақылау жүргізу қағидаларын бекіту туралы» 2020 жылғы 30 шілдедегі № 6-НҚ  және «Сыртқы мемлекеттік аудиттің және қаржылық бақылаудың рәсімдік стандарттарын бекіту туралы» 2016 жылғы 31 наурыздағы № 5-НҚ нормативтік қаулыларына өзгерістер мен толықтырулар енгізу туралы

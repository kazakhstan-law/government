act_code: '84132'
requisite: Нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 2 октября 2014 года № 4-НҚ. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 ноября 2014 года № 9850. Утратило силу нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 3 августа 2016 года № 10-НҚ

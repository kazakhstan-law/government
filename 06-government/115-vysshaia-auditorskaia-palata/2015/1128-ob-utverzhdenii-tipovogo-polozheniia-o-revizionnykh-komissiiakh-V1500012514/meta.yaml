  title:
    rus: О внесении изменений и дополнения в нормативные постановления Счетного комитета по контролю за исполнением республиканского бюджета от 28 ноября 2015 года № 11-НҚ «Об утверждении Типового положения о ревизионных комиссиях областей, городов республиканского значения, столицы» и от 31 марта 2016 года № 5-НҚ «Об утверждении процедурных стандартов внешнего государственного аудита и финансового контроля»
    kaz: Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің «Облыстардың, республикалық маңызы бар қалалардың, астананың тексеру комиссиялары туралы Үлгілік ережені бекіту туралы» 2015 жылғы 28 қарашадағы № 11-НҚ  және «Сыртқы мемлекеттік аудиттің және қаржылық бақылаудың рәсімдік стандарттарын бекіту туралы» 31 наурыздағы № 5-НҚ нормативтік қаулыларына өзгерістер мен толықтыру енгізу туралы

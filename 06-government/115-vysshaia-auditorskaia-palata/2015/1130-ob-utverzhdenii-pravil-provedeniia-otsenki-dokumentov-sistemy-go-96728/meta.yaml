  requisite: Нормативное постановление Высшей аудиторской палаты Республики Казахстан от 10 февраля 2023 года № 3-НҚ. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 февраля 2023 года № 31892
  title:
    rus: О внесении изменений в нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 30 ноября 2015 года № 16-НҚ «Об утверждении Правил проведения оценки документов Системы государственного планирования Республики Казахстан, планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний и планов мероприятий национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство»
    kaz: «Қазақстан Республикасы Мемлекеттік жоспарлау жүйесінің құжаттарына, ұлттық басқарушы холдингтердің, ұлттық холдингтердің және ұлттық компаниялардың даму жоспарларына және мемлекет акционері болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың іс-шаралар жоспарларына бағалау жүргізу қағидаларын бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2015 жылғы 30 қарашадағы № 16-НҚ нормативтік қаулысына өзгерістер енгізу туралы

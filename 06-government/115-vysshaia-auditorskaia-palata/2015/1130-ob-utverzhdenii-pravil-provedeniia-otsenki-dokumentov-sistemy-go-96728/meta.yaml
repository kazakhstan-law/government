  requisite: Нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 8 июня 2022 года № 7-НҚ. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 июня 2022 года № 28436
  title:
    rus: О внесении изменений в нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 30 ноября 2015 года № 16-НҚ «Об утверждении Правил проведения оценки документов Системы государственного планирования Республики Казахстан, стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство»
    kaz: «Қазақстан Республикасы Мемлекеттік жоспарлау жүйесінің құжаттарына, мемлекет акционері болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларына бағалау жүргізу қағидаларын бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2015 жылғы 30 қарашадағы № 16-НҚ нормативтік қаулысына өзгерістер енгізу туралы

requisite: Постановление от 30.11.2015 № 16-НҚ, Счетный комитет по контролю за исполнением республиканского бюджета. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12513
title:
  rus: Об утверждении Правил проведения оценки документов Системы государственного планирования Республики Казахстан, планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний и планов мероприятий национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство
  kaz: Қазақстан Республикасы Мемлекеттік жоспарлау жүйесінің құжаттарына, ұлттық басқарушы холдингтердің, ұлттық холдингтердің және ұлттық компаниялардың даму жоспарларына және мемлекет акционері болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың іс-шаралар жоспарларына бағалау жүргізу қағидаларын бекіту туралы

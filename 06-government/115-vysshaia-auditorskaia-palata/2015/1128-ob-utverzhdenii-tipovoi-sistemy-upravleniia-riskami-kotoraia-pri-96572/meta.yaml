  kaz: Мемлекеттік аудит және қаржылық бақылау объектілерінің тиісті жылға арналған тізбесін қалыптастыру және сыртқы мемлекеттік аудит жүргізу кезінде қолданылатын тәуекелдерді басқарудың үлгілік жүйесін бекіту туралы

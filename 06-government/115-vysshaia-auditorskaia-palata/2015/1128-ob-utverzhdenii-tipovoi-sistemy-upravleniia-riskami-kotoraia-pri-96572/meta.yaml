title:
  rus: Об утверждении Типовой системы управления рисками, которая применяется при формировании перечня объектов государственного аудита и финансового контроля на соответствующий год и проведении внешнего государственного аудита
  kaz: Мемлекеттік аудит және қаржылық бақылау объектілерінің тиісті жылға арналған тізбесін қалыптастыру және сыртқы мемлекеттік аудит жүргізу кезінде қолданылатын тәуекелдерді басқарудың үлгілік жүйесін бекіту туралы

  title:
    rus: О внесении изменений в нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 28 ноября 2015 года № 13-НҚ «Об утверждении Типовой системы управления рисками, которая применяется при формировании перечня объектов государственного аудита и финансового контроля на соответствующий год и проведении внешнего государственного аудита»
    kaz: «Мемлекеттік аудит және қаржылық бақылау объектілерінің тиісті жылға арналған тізбесін қалыптастыру және сыртқы мемлекеттік аудит жүргізу кезінде қолданылатын тәуекелдерді басқарудың үлгілік жүйесін бекіту туралы» Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2015 жылғы 28 қарашадағы № 13-НҚ нормативтік қаулысына өзгерістер енгізу туралы

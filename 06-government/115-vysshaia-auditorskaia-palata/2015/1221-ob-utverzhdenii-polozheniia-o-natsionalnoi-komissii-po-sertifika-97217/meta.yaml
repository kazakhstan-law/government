  title:
    rus: О внесении изменений и дополнения в нормативные постановления Счетного комитета по контролю за исполнением республиканского бюджета от 15 декабря 2015 года № 22-НҚ «Об утверждении Правил сертификации лиц, претендующих на присвоение квалификации государственного аудитора» и от 21 декабря 2015 года № 23-НҚ «Об утверждении Положения о Национальной комиссии по сертификации лиц, претендующих на присвоение квалификации государственного аудитора»
    kaz: Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің «Мемлекеттік аудитор біліктілігін иеленуге үміткер адамдарды сертификаттау қағидаларын бекіту туралы» 2015 жылғы 15 желтоқсандағы № 22-НҚ және «Мемлекеттік аудитор біліктілігін иеленуге үміткер адамдарды сертификаттау жөніндегі ұлттық комиссия туралы ережені бекіту туралы» 2015 жылғы 15 желтоқсандағы № 23-НҚ нормативтік қаулыларына өзгерістер мен толықтыру енгізу туралы

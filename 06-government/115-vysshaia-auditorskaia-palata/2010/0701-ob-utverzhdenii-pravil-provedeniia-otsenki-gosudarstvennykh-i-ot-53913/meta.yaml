caused_by:
  code: '89502'
  requisite: Постановление от 18.03.2015 № 3-НҚ, Счетный комитет по контролю за исполнением республиканского бюджета. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 апреля 2015 года № 10825. Утратило силу нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 30 ноября 2015 года № 16-НҚ
  title:
    rus: О внесении изменений в постановление Счетного комитета по контролю за исполнением республиканского бюджета от 1 июля 2010 года № 17-қ "Об утверждении Правил проведения оценки государственных программ, стратегических планов центральных государственных органов, программ развития территорий и стратегических планов исполнительных органов, финансируемых из местного бюджета"
    kaz: '"Мемлекеттік бағдарламаларға, орталық мемлекеттік органдардың стратегиялық жоспарларына, аумақтарды дамыту бағдарламаларына және жергілікті бюджеттен қаржыландырылатын атқарушы органдардың стратегиялық жоспарларына бағалау жүргізу ережесін бекіту туралы" Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2010 жылғы 1 шілдедегі № 17-қ қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/89502/rus

  requisite: Постановление Счетного комитета по контролю за исполнением республиканского бюджета от 20 февраля 2013 года № 10-П. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 марта 2013 года № 8373. Утратило силу нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 30 ноября 2015 года № 16-НҚ
  title:
    rus: О внесении изменений и дополнений в постановление Счетного комитета по контролю за исполнением республиканского бюджета от 1 июля 2010 года № 17-қ "Об утверждении Правил проведения оценки государственных программ, стратегических планов центральных государственных органов, программ развития территорий и стратегических планов исполнительных органов, финансируемых из местного бюджета"
    kaz: '"Мемлекеттік бағдарламаларға, орталық мемлекеттік органдардың стратегиялық жоспарларына, аумақтарды дамыту бағдарламаларына және жергілікті бюджеттен қаржыландырылатын атқарушы органдардың стратегиялық жоспарларына бағалау жүргізу ережесін бекіту туралы" Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2010 жылғы 1 шілдедегі қаулысына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/71544/rus

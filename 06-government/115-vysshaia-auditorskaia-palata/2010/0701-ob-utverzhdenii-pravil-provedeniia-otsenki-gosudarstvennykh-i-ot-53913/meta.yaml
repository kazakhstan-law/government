act_code: '53913'
requisite: Постановление Счетного комитета по контролю за исполнением республиканского бюджета от 1 июля 2010 года № 17-Қ. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 августа 2010 года № 6371. Утратило силу нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 30 ноября 2015 года № 16-НҚ
title:
  rus: Об утверждении Правил проведения оценки государственных и отраслевых программ, стратегических планов центральных государственных органов и программ развития территорий

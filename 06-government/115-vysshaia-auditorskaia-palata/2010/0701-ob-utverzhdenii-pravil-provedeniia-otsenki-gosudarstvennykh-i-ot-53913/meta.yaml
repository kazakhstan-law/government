  requisite: Постановление Председателя Счетного комитета по контролю за исполнением республиканского бюджета от 31 августа 2011 года № 31-П. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 сентября 2011 года № 7184. Утратило силу нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 30 ноября 2015 года № 16-НҚ
  title:
    rus: О внесении изменений и дополнений в постановление Счетного комитета по контролю за исполнением республиканского бюджета от 1 июля 2010 года № 17-қ "Об утверждении Правил проведения оценки государственных программ, стратегических планов центральных государственных органов, программ развития территорий и стратегических планов исполнительных органов, финансируемых из местного бюджета"
    kaz: '"Мемлекеттiк бағдарламаларға, орталық мемлекеттiк органдардың стратегиялық жоспарларына, аумақтарды дамыту бағдарламаларына және жергiлiктi бюджеттен қаржыландырылатын атқарушы органдардың стратегиялық жоспарларына бағалау жүргiзу ережесiн бекiту туралы" Республикалық бюджеттiң атқарылуын бақылау жөнiндегi есеп комитетiнiң 2010 жылғы 1 шiлдедегi № 17-Қ қаулысына өзгерiстер мен толықтырулар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/60524/rus

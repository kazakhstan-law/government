act_code: '112172'
requisite: Нормативное постановление Председателя Счетного комитета по контролю за исполнением Республиканского бюджета от 7 апреля 2017 года № 2-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 мая 2017 года № 15111. Утратило силу нормативным постановлением Счетного комитета по контролю за исполнением республиканского бюджета от 30 марта 2018 года № 9-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

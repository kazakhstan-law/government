  title:
    rus: О внесении изменений в постановление Центральной избирательной комиссии Республики Казахстан от 18 августа 2004 года N 128/164 "Об утверждении Правил о порядке использования электронной избирательной системы в части не регламентированной Конституционным законом Республики Казахстан "О выборах в Республике Казахстан"
    kaz: '"Электрондық сайлау жүйесін Қазақстан Республикасының "Қазақстан Республикасындағы сайлау туралы" Конституциялық заңымен реттелмейтін бөлігінде пайдаланудың тәртібі жөніндегі Ережелерді бекіту туралы" Қазақстан Республикасы Орталық сайлау комиссиясының 2004 жылғы 18 тамыздағы N 128/164 қаулысына өзгерістер енгізу туралы'

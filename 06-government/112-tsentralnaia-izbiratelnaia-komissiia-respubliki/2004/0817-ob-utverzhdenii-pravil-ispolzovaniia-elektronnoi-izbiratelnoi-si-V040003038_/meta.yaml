title:
  rus: Об утверждении Правил использования электронной избирательной системы в части не регламентированной Конституционным законом Республики Казахстан от 28 сентября 1995 года "О выборах в Республике Казахстан"
  kaz: Электрондық сайлау жүйесін "Қазақстан Республикасындағы сайлау туралы" Қазақстан Республикасының 1995 жылғы 28 қыркүйектегі Конституциялық заңымен реттелмейтін бөлігінде пайдалану ережелерін бекіту туралы

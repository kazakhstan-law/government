    kaz: '"Электрондық сайлау жүйесін Қазақстан Республикасының "Қазақстан Республикасындағы сайлау туралы" Конституциялық заңымен реттелмейтін бөлігінде пайдаланудың тәртібі жөніндегі Ережелерді бекіту туралы" Қазақстан Республикасы Орталық сайлау комиссиясының 2004 жылғы 18 тамыздағы N 128/164 қаулысына өзгерістер енгізу туралы'

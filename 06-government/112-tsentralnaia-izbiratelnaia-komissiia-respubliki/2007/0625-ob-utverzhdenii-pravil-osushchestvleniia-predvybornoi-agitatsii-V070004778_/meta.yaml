title:
  rus: Об утверждении Правил осуществления предвыборной агитации через средства массовой информации, онлайн-платформы и информационного обеспечения выборов Президента, депутатов Курултая, маслихатов, акима города районного значения, села, поселка, сельского округа, а также членов иных органов местного самоуправления
  kaz: Президенттің, Құрылтай, мәслихаттар депутаттарының, аудандық маңызы бар қала, ауыл, кент, ауылдық округ әкімдерінің, сондай-ақ өзге де жергілікті өзін-өзі басқару органдары мүшелерінің сайлауы кезінде бұқаралық ақпарат құралдары, онлайн платформалар арқылы сайлау алдындағы үгітті жүзеге асырудың және оны ақпараттық қамтамасыз етудің қағидаларын бекіту туралы

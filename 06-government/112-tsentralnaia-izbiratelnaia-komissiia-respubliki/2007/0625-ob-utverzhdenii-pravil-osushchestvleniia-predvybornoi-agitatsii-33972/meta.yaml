  title:
    rus: О внесении изменений в постановление Центральной избирательной комиссии Республики Казахстан от 25 июня 2007 года № 90/178 «Об утверждении Правил осуществления предвыборной агитации через средства массовой информации и информационного обеспечения выборов депутатов Мажилиса Парламента Республики Казахстан, избираемых по партийным спискам, и выборов депутатов маслихатов Республики Казахстан»
    kaz: «Партиялық тізімдер бойынша сайланатын Қазақстан Республикасы Парламенті Мәжілісі депутаттарының сайлауы мен Қазақстан Республикасы мәслихаттары депутаттарының сайлауы кезінде бұқаралық ақпарат құралдары арқылы сайлау алдындағы үгітті жүзеге асырудың және оны ақпараттық қамтамасыз етудің ережесін бекіту туралы» Қазақстан Республикасы Орталық сайлау комиссиясының 2007 жылғы 25 маусымдағы № 90/178 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление Центральной избирательной комиссии Республики Казахстан от 3 сентября 2009 года № 166/314 «Об утверждении Правил финансирования политических партий» и о признании утратившим силу постановления Центральной избирательной комиссии Республики Казахстан от 26 мая 2022 года № 40/501 «Об утверждении Правил удостоверения полномочий представителей общественных объединений Республики Казахстан, наблюдателей от иностранных государств и международных организаций при проведении республиканского референдума»
    kaz: «Саяси партияларды қаржыландыру ережесін бекіту туралы» Қазақстан Республикасы Орталық сайлау комиссиясының 2009 жылғы 3 қыркүйектегі № 166/314 қаулысына өзгеріс енгізу туралы» және «Республикалық референдум өткізу кезінде Қазақстан Республикасы қоғамдық бірлестіктері өкілдерінің, шет мемлекеттер мен халықаралық ұйымдардан байқаушылардың өкілеттіктерін куәландыру қағидаларын бекіту туралы» Қазақстан Республикасы Орталық сайлау комиссиясының 2022 жылғы 26 мамырдағы № 40/501 қаулысының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/200778/rus

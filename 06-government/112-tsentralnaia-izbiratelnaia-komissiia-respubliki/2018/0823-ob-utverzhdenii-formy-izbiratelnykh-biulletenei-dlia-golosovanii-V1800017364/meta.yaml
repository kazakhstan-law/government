title:
  rus: Об утверждении формы избирательных бюллетеней для голосования по выборам Президента Республики Казахстан, депутатов Курултая и маслихатов Республики Казахстан, избираемых по партийным спискам, депутатов маслихатов Республики Казахстан, избираемых по одномандатным территориальным избирательным округам, акимов городов районного значения, сел, поселков, сельских округов
  kaz: Қазақстан Республикасының Президентін, партиялық тізімдер бойынша сайланатын Қазақстан Республикасы Құрылтайының және мәслихаттарының депутаттарын, бірмандаттық аумақтық сайлау округтері бойынша сайланатын Қазақстан Республикасы мәслихаттарының депутаттарын, аудандық маңызы бар қалалардың, ауылдардың, кенттердің, ауылдық округтердің әкімдерін сайлау жөніндегі дауыс беруге арналған сайлау бюллетендерінің нысанын бекіту туралы

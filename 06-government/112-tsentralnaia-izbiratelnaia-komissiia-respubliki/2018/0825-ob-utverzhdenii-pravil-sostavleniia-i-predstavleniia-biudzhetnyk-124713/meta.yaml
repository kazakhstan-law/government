  title:
    rus: О внесении изменений и дополнений в постановление Центральной избирательной комиссии Республики Казахстан от 25 августа 2018 года № 12/200 «Об утверждении Правил составления и представления бюджетных заявок территориальными избирательными комиссиями в Центральную избирательную комиссию Республики Казахстан на проведение избирательных кампаний»

act_code: '104755'
requisite: Постановление Центральной избирательной комиссии Республики Казахстан от 22 июня 2016 года № 40/137. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 июля 2016 года № 13954
title:
  rus: Об утверждении Положения по вопросам подготовки к рассмотрению Курултаем Республики Казахстан применения к депутатам мер взыскания, соблюдением ими ограничений, связанных с депутатской деятельностью, правил депутатской этики, прекращением полномочий депутатов, лишением их полномочий и депутатской неприкосновенности, а также вопросам лишения неприкосновенности кандидатов в Президенты Республики Казахстан, депутаты Курултая Республики Казахстан
  kaz: Депутаттарға жазалау шараларын қолдануға, олардың депутаттық қызметпен байланысты шектеулерді, депутаттық әдеп ережелерін сақтауын, депутаттардың өкілеттігін тоқтатуды, оларды өкілеттігінен және депутатқа қолсұғылмаушылықтан айыруды Қазақстан Республикасы Құрылтайының қарауына дайындау мәселелері, сондай-ақ Қазақстан Республикасының Президенттiгіне, Қазақстан Республикасы Құрылтай депутаттығына кандидаттарды қолсұғылмаушылықтан айыру мәселелері жөніндегі ережені бекіту туралы

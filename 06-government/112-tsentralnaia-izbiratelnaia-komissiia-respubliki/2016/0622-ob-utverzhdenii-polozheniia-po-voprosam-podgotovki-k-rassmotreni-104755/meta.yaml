  title:
    rus: О внесении изменений и дополнений в некоторые постановления Центральной избирательной комиссии Республики Казахстан и о признании утратившим силу Постановление Председателя Центральной избирательной комиссии Республики Казахстан от 26 июня 2017 года № 15/165 «Об утверждении перечня открытых данных Центральной избирательной комиссии Республики Казахстан, размещаемых на интернет-портале открытых данных»
    kaz: Қазақстан Республикасы Орталық сайлау комиссиясының кейбір қаулыларына өзгерістер мен толықтырулар енгізу туралы және «Ашық деректердің интернет-порталында орналастырылатын Қазақстан Республикасы Орталық сайлау комиссиясының ашық деректер тізбесін бекіту туралы» Қазақстан Республикасы Орталық сайлау комиссиясы Төрағасының 2017 жылғы 26 маусымдағы № 15/165 қаулысының күші жойылды деп тану туралы

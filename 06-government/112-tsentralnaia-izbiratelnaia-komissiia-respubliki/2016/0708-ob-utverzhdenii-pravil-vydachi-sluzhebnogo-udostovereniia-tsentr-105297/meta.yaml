  requisite: Постановление Председателя Центральной избирательной комиссии Республики Казахстан от 18 марта 2017 года № 7/155. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 апреля 2017 года № 15059. Утратило силу постановлением Центральной избирательной комиссии Республики Казахстан от 24 июня 2026 года № 22/36 (вводится в действие с 1 июля 2026 года)
  title:
    rus: О внесении изменений в постановление Центральной избирательной комиссии Республики Казахстан от 8 июля 2016 года № 42/139 «Об утверждении Правил выдачи служебного удостоверения Центральной избирательной комиссии Республики Казахстан и его описания»
    kaz: «Қазақстан Республикасы Орталық сайлау комиссиясының қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы» Қазақстан Республикасы Орталық сайлау комиссиясының 2016 жылғы 8 шілдедегі № 42/139 қаулысына өзгерістер енгізу туралы

act_code: '105297'
requisite: Постановление Центральной избирательной комиссии Республики Казахстан от 8 июля 2016 года № 42/139. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2016 года № 14073. Утратило силу постановлением Центральной избирательной комиссии Республики Казахстан от 24 июня 2026 года № 22/36 (вводится в действие с 1 июля 2026 года)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения Центральной избирательной комиссии Республики Казахстан и его описания
  kaz: Қазақстан Республикасы Орталық сайлау комиссиясының қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы

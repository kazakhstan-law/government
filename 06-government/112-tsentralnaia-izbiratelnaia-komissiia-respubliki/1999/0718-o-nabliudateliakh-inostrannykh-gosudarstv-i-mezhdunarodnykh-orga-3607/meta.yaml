requisite: Постановление Центральной избирательной комиссии Республики Казахстан от 19 июля 1999 г. N 17/218. Зарегистрирован в Министерстве юстиции Республики Казахстан 26.07.99г. за N 854. Утратило силу - постановлением Центральной избирательной комиссии Республики Казахстан от 27 июня 2007 года N 91/183
title:
  rus: О наблюдателях иностранных государств и международных организаций, общественных объединений, доверенных лицах кандидатов в депутаты, а также представителях средств массовой информации на выборах 1999 года в Парламент и маслихаты Республики Казахстан
  kaz: 1999 жылғы Қазақстан Республикасы Парламентінің және мәслихаттарының сайлауындағы шет мемлекеттер мен халықаралық ұйымдар, қоғамдық бірлестіктер байқаушылары, депутаттыққа кандидаттардың сенім білдірген адамдары, сондай-ақ бұқаралық ақпарат құралдарының өкілдері туралы

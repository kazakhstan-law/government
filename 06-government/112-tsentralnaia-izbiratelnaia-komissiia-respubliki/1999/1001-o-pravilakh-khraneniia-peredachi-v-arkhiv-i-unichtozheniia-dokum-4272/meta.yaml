    kaz: '"Қазақстан Республикасы мәслихаттарының депутаттарын, әкімдерін сайлауға әзірлік және өткізуге байланысты құжаттарды сақтаудың, мұрағатқа тапсырудың және жоюдың Ережесі туралы" Қазақстан Республикасы Орталық сайлау комиссиясының 1999 жылғы 2 қазандағы N 33/251 қаулысына өзгерістер енгізу туралы'

  title:
    rus: О внесении изменений в постановление Центральной избирательной комиссии Республики Казахстан от 2 октября 1999 года N 33/251 "О Правилах хранения, передачи в архив и уничтожения документов, связанных с подготовкой и проведением выборов депутатов маслихатов Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан N 932
    kaz: Қазақстан Республикасының Әділет министрлігінде N 932 тіркелген "Қазақстан Республикасы Мәслихаттарының депутаттарын сайлауды дайындау мен өткізуге байланысты құжаттарды сақтау, мұрағатқа тапсыру және жою ережесі туралы"» Қазақстан Республикасы Орталық сайлау комиссиясының 1999 жылғы 2 қазандағы N 33/251 қаулысына өзгерістер енгізу туралы

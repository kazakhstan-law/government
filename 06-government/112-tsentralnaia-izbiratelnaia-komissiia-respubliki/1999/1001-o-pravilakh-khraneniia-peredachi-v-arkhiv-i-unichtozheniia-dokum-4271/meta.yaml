  title:
    rus: О внесении изменений в постановления Центральной избирательной комиссии Республики Казахстан от 2 октября 1999 года N 33/250 "О Правилах хранения, передачи в архив и уничтожения документов, связанных с подготовкой и проведением выборов депутатов Парламента Республики Казахстан" и N 33/251 "О Правилах хранения, передачи в архив и уничтожения документов, связанных с подготовкой и проведением выборов депутатов маслихатов Республики Казахстан"
    kaz: Қазақстан Республикасы Орталық сайлау комиссиясының 1999 жылғы 2 қазандағы N 33/250 "Қазақстан Республикасы Парламентінің депутаттарын сайлауға әзірлік және өткізуге байланысты құжаттарды сақтаудың, мұрағатқа тапсырудың және жоюдың Ережесі туралы" және 1999 жылғы 2 қазандағы N 33/251 "Қазақстан Республикасы мәслихаттарының депутаттарын сайлауға әзірлік және өткізуге байланысты құжаттарды сақтаудың, мұрағатқа тапсырудың және жоюдың Ережесі туралы" қаулыларына өзгерістер енгізу туралы

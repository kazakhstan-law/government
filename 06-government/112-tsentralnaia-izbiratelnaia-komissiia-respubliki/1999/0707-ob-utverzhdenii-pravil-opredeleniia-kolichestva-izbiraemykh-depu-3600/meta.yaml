  title:
    rus: О внесении изменений в постановление Центральной избирательной комиссии Республики Казахстан от 8 июля 1999 года N 12/200 "Об утверждении Правил определения количества избираемых депутатов маслихатов в административно-территориальных единицах в соответствии с численностью населения", зарегистрированное в Министерстве юстиции Республики Казахстан N 838
    kaz: Қазақстан Республикасы Орталық сайлау комиссиясының "Әкімшілік-аумақтық бірліктердегі халық санына сәйкес сайланатын мәслихаттар депутаттарының санын белгілеу Ережелерін бекіту туралы", Қазақстан Республикасы Әділет министрлігінде N 838 болып тіркелген, 1999 жылғы 8 шілдедегі N 12/200 қаулысына өзгерістер енгізу туралы

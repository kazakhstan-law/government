title:
  rus: Об утверждении Правил удостоверения полномочий представителей общественных объединений Республики Казахстан, наблюдателей от иностранных государств и международных организаций при проведении республиканского референдума
  kaz: Республикалық референдум өткізу кезінде Қазақстан Республикасы қоғамдық бірлестіктері өкілдерінің, шет мемлекеттер мен халықаралық ұйымдардан байқаушылардың өкілеттіктерін куәландыру қағидаларын бекіту туралы

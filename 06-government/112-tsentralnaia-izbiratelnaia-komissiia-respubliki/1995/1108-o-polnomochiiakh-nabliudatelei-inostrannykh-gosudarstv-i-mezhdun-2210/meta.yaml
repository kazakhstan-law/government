  title:
    rus: Об утверждении Порядка образования, расходования, учета и отчетности избирательных фондов кандидатов в депутаты Мажилиса Парламента Республики Казахстан
    kaz: Қазақстан Республикасы Парламентi Мәжiлiсi депутаттығына кандидаттардың сайлау қорларын құру, жұмсау, олардың есебi мен есеп беру тәртiбiн бекiту туралы

act_code: '2210'
requisite: Постановление Центральной избирательной комиссии Республики Казахстан от 8 ноября 1995 г. N 16. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 мая 1997 г. N 301. Утратило силу - постановлением Центральной избирательной комиссии РК от 7 июля 2004 года N 110/134
title:
  rus: О полномочиях наблюдателей иностранных государств и международных организаций, общественных объединений, доверенных лиц кандидатов в депутаты, а также представителей средств массовой информации на выборах депутатов Парламента Республики Казахстан
  kaz: Қазақстан Республикасы Парламентi депутаттарының сайлауындағы шет мемлекеттер мен халықаралық ұйымдар, қоғамдық бiрлестiктер байқаушыларының, депутаттыққа кандидаттардың сенiм бiлдiрген адамдарының, сондай-ақ бұқаралық ақпарат құралдары өкiлдерiнiң өкiлдiктерi туралы

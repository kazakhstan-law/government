requisite: Постановление Центральной избирательной комиссии Республики Казахстан от 10 октября 1998 года N 44/129. Зарегистрировано Министерством юстиции Республики Казахстан 22.10.1998 г. N 625. Утратило силу - постановлением Центральной избирательной комиссии РК от 7 июля 2004 года N 110/134
title:
  rus: О полномочиях наблюдателей иностранных государств и международных организаций, общественных объединений, доверенных лиц кандидатов в Президенты, а также представителей средств массовой информации на выборах Президента Республики Казахстан
  kaz: Қазақстан Республикасы Президентінің сайлауындағы шет мемлекеттер мен халықаралық ұйымдар, қоғамдық бірлестіктер байқаушыларының, Президенттікке кандидаттың сенім білдірген адамдарының, сондай-ақ бұқаралық ақпарат құралдары өкілдерінің өкілеттіктері туралы

title:
  rus: Об утверждении форм избирательных документов по выборам депутатов Сената Парламента Республики Казахстан
  kaz: Қазақстан Республикасы Парламенті Сенатының депутаттарын сайлау жөніндегі Сайлау құжаттарының нысандарын бекіту туралы

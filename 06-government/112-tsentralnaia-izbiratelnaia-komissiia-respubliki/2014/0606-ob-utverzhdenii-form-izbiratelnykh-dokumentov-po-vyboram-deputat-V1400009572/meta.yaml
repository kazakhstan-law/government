  title:
    rus: О внесении изменения в постановление Центральной избирательной комиссии Республики Казахстан от 6 июня 2014 года № 10/233 «Об утверждении форм избирательных документов по выборам депутатов Сената Парламента Республики Казахстан»
    kaz: «Қазақстан Республикасы Парламенті Сенатының депутаттарын сайлау жөніндегі Сайлау құжаттарының нысандарын бекіту туралы» Қазақстан Республикасы Орталық сайлау комиссиясының 2014 жылғы 6 маусымдағы № 10/233 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменения и дополнения в постановление Правления Национального Банка Республики Казахстан от 27 декабря 2010 года № 105 «Об утверждении Инструкции по представлению банками второго уровня, Банком Развития Казахстана и ипотечными организациями в Национальный Банк Республики Казахстан сведений для формирования обзора финансового сектора»
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының «Екінші деңгейдегі банктердің, Қазақстан Даму Банкінің және ипотекалық ұйымдардың Қазақстан Республикасының Ұлттық Банкіне қаржы секторының шолуын қалыптастыру үшін мәліметтерді ұсыну жөніндегі нұсқаулықты бекіту туралы» 2010 жылғы 27 желтоқсандағы № 105 қаулысына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/90294/rus

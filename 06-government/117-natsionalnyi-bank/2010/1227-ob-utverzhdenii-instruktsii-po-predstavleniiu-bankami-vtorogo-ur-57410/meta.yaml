  code: '67946'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 280. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 октября 2012 года № 7961. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 316
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 27 декабря 2010 года № 105 "Об утверждении Инструкции по представлению банками второго уровня, акционерным обществом "Банк Развития Казахстана" и ипотечными организациями в Национальный Банк Республики Казахстан сведений для формирования обзора финансового сектора"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің, "Қазақстан Даму Банкі" акционерлік қоғамының және ипотекалық ұйымдардың Қазақстан Республикасының Ұлттық Банкіне қаржы секторының шолуын қалыптастыру үшін мәліметтерді ұсыну жөніндегі нұсқаулықты бекіту туралы" 2010 жылғы 27 желтоқсандағы № 105 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/67946/rus

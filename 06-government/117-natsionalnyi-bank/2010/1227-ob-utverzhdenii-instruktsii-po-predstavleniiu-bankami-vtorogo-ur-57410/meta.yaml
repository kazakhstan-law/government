act_code: '57410'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 декабря 2010 года № 105. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 февраля 2011 года № 6772. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 316 (вводится в действие по истечении пятнадцати календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по представлению банками второго уровня, Банком Развития Казахстана и ипотечными организациями в Национальный Банк Республики Казахстан сведений для формирования обзора финансового сектора
  kaz: Екінші деңгейдегі банктердің, Қазақстан Даму Банкінің және ипотекалық ұйымдардың Қазақстан Республикасының Ұлттық Банкіне қаржы секторының шолуын қалыптастыру үшін мәліметтерді ұсыну жөніндегі нұсқаулықты бекіту туралы

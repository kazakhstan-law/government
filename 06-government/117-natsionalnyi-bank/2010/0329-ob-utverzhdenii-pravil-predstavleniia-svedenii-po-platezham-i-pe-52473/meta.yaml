  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 29 марта 2010 года № 16 "Об утверждении Правил представления сведений по платежам и переводам денег, осуществленным через электронные терминалы и системы удаленного доступа"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Электрондық терминалдар мен қашықтан кіру жүйелері арқылы жүзеге асырылған ақша төлемдері мен аударымдары бойынша мәліметтерді ұсыну ережесін бекіту жөнінде" 2010 жылғы 29 наурыздағы № 16 қаулысына өзгерістер мен толықтырулар енгізу туралы

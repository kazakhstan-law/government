title:
  rus: Об утверждении Правил представления сведений по платежам и переводам денег, осуществленным через электронные терминалы и системы удаленного доступа, а также с использованием электронных денег
  kaz: Электрондық терминалдар мен қашықтан кіру жүйелері, сондай-ақ электрондық ақшаны пайдалану арқылы жүзеге асырылған ақша төлемдері мен аударымдары бойынша мәліметтерді ұсыну ережесін бекіту туралы

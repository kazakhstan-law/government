  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 1 февраля 2010 года № 4 "Об утверждении Инструкции по ведению бухгалтерского учета управляющими инвестиционным портфелем и организациями, осуществляющими брокерскую деятельность на рынке ценных бумаг"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Инвестициялық портфельді басқарушылардың және бағалы қағаздар нарығында брокерлік қызметті жүзеге асыратын ұйымдардың бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы" 2010 жылғы 1 ақпандағы № 4 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 1 февраля 2010 года № 4 "Об утверждении Инструкции по ведению бухгалтерского учета организациями, осуществляющими управление инвестиционным портфелем или инвестиционное управление пенсионными активами"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Инвестициялық портфельді басқаруды немесе зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы" 2010 жылғы 1 ақпандағы № 4 қаулысына өзгерістер мен толықтырулар енгізу туралы

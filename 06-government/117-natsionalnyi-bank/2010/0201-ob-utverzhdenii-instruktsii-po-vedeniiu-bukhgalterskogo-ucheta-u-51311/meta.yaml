act_code: '51311'
requisite: Постановление Правления Национального Банка Республики Казахстан от 1 февраля 2010 года № 4. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 февраля 2010 года № 6090. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 19 марта 2025 года № 17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по ведению бухгалтерского учета управляющими инвестиционным портфелем, организациями, осуществляющими брокерскую деятельность на рынке ценных бумаг, и страховыми организациями, имеющими лицензию на осуществление деятельности по отрасли «страхование жизни» и заключающими договоры страхования, предусматривающие условия участия страхователя в инвестициях страховщика, и филиалами страховых организаций - нерезидентов Республики Казахстан, имеющими лицензию на осуществление деятельности по отрасли «страхование жизни» и заключающими договоры страхования, предусматривающие условия участия страхователя в инвестициях страховщика
  kaz: Инвестициялық портфельді басқарушылардың, бағалы қағаздар нарығында брокерлік қызметті жүзеге асыратын ұйымдардың және «өмірді сақтандыру» саласы бойынша қызметті жүзеге асыруға лицензиясы бар және сақтандырушының инвестицияларына сақтанушының қатысу талаптары көзделетін сақтандыру шарттарын жасасатын сақтандыру ұйымдарының және «өмірді сақтандыру» саласы бойынша қызметті жүзеге асыруға лицензиясы бар және сақтандырушының инвестицияларына сақтанушының қатысу талаптары көзделетін сақтандыру шарттарын жасасатын Қазақстан Республикасы бейрезидент - сақтандыру (қайта сақтандыру) ұйымдары филиалдарының бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы

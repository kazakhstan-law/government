  requisite: Постановление Правления Национального Банка Республики Казахстан от 20 декабря 2001 года N 567. Зарегистрировано Министерством юстиции Республики Казахстан 8 февраля 2002 года N 1749. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года N 305
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 12 декабря 1996 года N 292 "О принятии новой редакции Правил о порядке перехода банков второго уровня к международным стандартам" и в постановление Правления Национального Банка Республики Казахстан от 14 февраля 2001 года N 32 "По вопросам перехода банков второго уровня к международным стандартам"
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Екiншi деңгейдегi банктердiң халықаралық стандарттарға өту тәртiбi туралы" ереженiң жаңа редакциясын қабылдау туралы" 1996 жылғы 12 желтоқсандағы N 292 қаулысына және Қазақстан Республикасының Ұлттық Банкi Басқармасының "Екiншi деңгейдегi банктердiң халықаралық стандарттарға өтуiнiң мәселелерi жөнiнде" 2001 жылғы 14 ақпандағы N 32 қаулысына өзгерiстер мен толықтырулар енгiзу туралы

  requisite: Постановление Правления Национального Банка Республики Казахстан от 10 октября 2002 года N 407. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 ноября 2002 года N 2054. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года N 305
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 12 декабря 1996 года N 292 "Об утверждении Правил о порядке перехода банков второго уровня к международным стандартам", зарегистрированное в Министерстве юстиции Республики Казахстан под N 440
    kaz: Қазақстан Республикасының Әділет министрлігінде 440-нөмірмен тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің халықаралық стандарттарға көшу тәртібі туралы ережелерді бекіту туралы" 1996 жылғы 12 желтоқсандағы N 292 қаулысына өзгерістер мен толықтыру енгізу туралы

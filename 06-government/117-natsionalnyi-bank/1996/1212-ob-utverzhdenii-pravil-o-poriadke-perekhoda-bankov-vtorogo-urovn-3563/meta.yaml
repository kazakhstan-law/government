    kaz: Қазақстан Республикасының Әділет министрлігінде 440-нөмірмен тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің халықаралық стандарттарға көшу тәртібі туралы ережелерді бекіту туралы" 1996 жылғы 12 желтоқсандағы N 292 қаулысына өзгерістер мен толықтыру енгізу туралы

act_code: '64408'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 83. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 апреля 2012 года № 7506
title:
  rus: Об установлении лимита доли акций (долей участия в уставном капитале) родительской организации страховой группы, страховой (перестраховочной) организации или страхового холдинга, принадлежащих дочерним организациям страховой (перестраховочной) организации либо страхового холдинга, организациям, в которых страховая (перестраховочная) организация либо страховой холдинг имеют значительное участие
  kaz: Сақтандыру (қайта сақтандыру) ұйымының не сақтандыру холдингінің еншілес ұйымдарына, сақтандыру (қайта сақтандыру) ұйымы не сақтандыру холдингі қомақты қатысатын ұйымдарға тиесілі сақтандыру тобының бас ұйымының, сақтандыру (қайта сақтандыру) ұйымының немесе сақтандыру холдингінің акциялары үлесінің (жарғылық капиталға қатысу үлестерінің) лимитін белгілеу туралы

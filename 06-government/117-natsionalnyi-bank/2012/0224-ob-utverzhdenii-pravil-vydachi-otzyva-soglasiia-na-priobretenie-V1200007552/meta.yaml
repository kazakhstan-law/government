  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 67 «Об утверждении Правил выдачи, отзыва согласия на приобретение статуса крупного участника банка, банковского холдинга, крупного участника страховой (перестраховочной) организации, страхового холдинга, крупного участника управляющего инвестиционным портфелем и требования к документам, представляемым для получения указанного согласия»
    kaz: «Банктің, банк холдингінің ірі қатысушысы, сақтандыру (қайта сақтандыру) ұйымының, сақтандыру холдингінің ірі қатысушысы, инвестициялық портфельді басқарушының ірі қатысушысы мәртебесін иеленуге келісім беру, оны кері қайтарып алу қағидаларын және көрсетілген келісімді алу үшін табыс етілетін құжаттарға қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Ұлттық Банкі Басқармасының 2012 жылғы 24 ақпандағы № 67 қаулысына өзгерістер енгізу туралы

act_code: '64783'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 78. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2012 года № 7557. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 октября 2022 года № 75 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил признания организациями, осуществляющими брокерскую и (или) дилерскую деятельность на рынке ценных бумаг, индивидуальных и институциональных инвесторов квалифицированными инвесторами
  kaz: Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдардың дара және институционалдық инвесторларды білікті инвесторлар деп тану қағидаларын бекіту туралы

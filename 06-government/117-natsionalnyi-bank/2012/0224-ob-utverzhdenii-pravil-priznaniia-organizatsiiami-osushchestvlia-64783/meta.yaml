  code: '152510'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 января 2021 года № 2. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 января 2021 года № 22137. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 октября 2022 года № 75 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования финансового рынка, признании утратившими силу некоторых нормативных правовых актов Республики Казахстан и отдельного структурного элемента нормативного правового акта Республики Казахстан
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығын реттеу мәселелері бойынша өзгерістер енгізу, Қазақстан Республикасының кейбір нормативтік құқықтық актілерінің және Қазақстан Республикасы нормативтік құқықтық актісінің жекелеген құрылымдық элементінің күші жойылды деп тану туралы

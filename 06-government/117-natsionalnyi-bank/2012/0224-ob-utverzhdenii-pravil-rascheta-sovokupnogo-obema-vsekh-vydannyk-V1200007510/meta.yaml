  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2021 года № 43. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 февраля 2021 года № 22259
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования деятельности филиалов банков нерезидентов Республики Казахстан, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и филиалов страховых брокеров нерезидентов Республики Казахстан
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне Қазақстан Республикасының бейрезидент-банктері филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының және Қазақстан Республикасының бейрезидент-сақтандыру брокерлері филиалдарының қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

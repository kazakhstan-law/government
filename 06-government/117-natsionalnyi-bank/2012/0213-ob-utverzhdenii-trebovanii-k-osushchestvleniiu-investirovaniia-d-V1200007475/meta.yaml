title:
  rus: Об утверждении требований к осуществлению инвестирования денег, входящих в состав выделенных активов, и перечня финансовых инструментов, разрешенных к приобретению за счет выделенных активов при проектном финансировании и секьюритизации
  kaz: Жобалық қаржыландыру және секьюритилендiру кезде бөлінген активтердің құрамына кіретін ақшаны инвестициялауды жүзеге асыруға қойылатын талаптарды және бөлінген активтер есебінен сатып алуға рұқсат етілген қаржы құралдарының тізбесін бекіту туралы

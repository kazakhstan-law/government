act_code: '70380'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 октября 2012 года № 317. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8167. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 февраля 2016 года № 68
title:
  rus: Об утверждении Правил применения ограниченных мер воздействия в отношении банков второго уровня, организаций, осуществляющих отдельные виды банковских операций, а также крупных участников банка, банковского холдинга, организаций, входящих в состав банковского конгломерата, и принудительных мер к лицам, обладающим признаками крупного участника или банковского холдинга, а также к крупным участникам банка, банковским холдингам или юридическим лицам, входящим в состав банковского конгломерата
  kaz: Екінші деңгейдегі банктерге, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға, сондай-ақ банктің ірі қатысушыларына, банк холдингіне, банк конгломератының құрамына кіретін ұйымдарға қатысты шектеулі ықпал ету шараларын және ірі қатысушының немесе банк холдингінің белгілері бар тұлғаларға, сондай-ақ банктің ірі қатысушыларына, банк холдингтеріне немесе банк конгломератының құрамына кіретін заңды тұлғаларға мәжбүрлеу шараларын қолдану қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам банковской деятельности и признании утратившими силу некоторых нормативных правовых актов Республики Казахстан, а также структурных элементов некоторых нормативных правовых актов Республики Казахстан
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне банк қызметі мәселелері бойынша өзгерістер енгізу және Қазақстан Республикасының кейбір нормативтік құқықтық актілерінің, сондай-ақ Қазақстан Республикасының кейбір нормативтік құқықтық актілері құрылымдық элементтерінің күші жойылды деп тану туралы

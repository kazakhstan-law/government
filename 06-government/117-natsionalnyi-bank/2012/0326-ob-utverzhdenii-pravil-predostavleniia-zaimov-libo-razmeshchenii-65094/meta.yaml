requisite: Постановление Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 136. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 апреля 2012 года № 7603. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 257 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил предоставления займов либо размещения депозитов организацией, осуществляющей обязательное гарантирование депозитов, в банке (банках) - участнике (участниках), принимающем (принимающих) обязательства по гарантируемым депозитам
  kaz: Кепілдік берілген депозиттер бойынша міндеттемелер қабылдайтын қатысушы (қатысушылар) банктегі (банктердегі) депозиттерге міндетті кепілдік беруді жүзеге асыратын ұйымның заемдар беру және депозиттерді орналастыру қағидаларын бекіту туралы

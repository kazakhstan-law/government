requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 90. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 апреля 2012 года № 7527. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 272 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил применения принудительных мер к лицам, обладающим признаками крупного участника или страхового холдинга, к крупным участникам страховой (перестраховочной) организации, страховому холдингу, а также к юридическим лицам, входящим в состав страховой группы
  kaz: Сақтандыру (қайта сақтандыру) ұйымы ірі қатысушысының немесе сақтандыру холдингінің белгілеріне ие тұлғаларға, сақтандыру (қайта сақтандыру) ұйымының ірі қатысушыларына, сақтандыру холдингіне, сондай-ақ сақтандыру тобының құрамына кіретін заңды тұлғаларға мәжбүрлеу шараларын қолдану қағидаларын бекіту туралы

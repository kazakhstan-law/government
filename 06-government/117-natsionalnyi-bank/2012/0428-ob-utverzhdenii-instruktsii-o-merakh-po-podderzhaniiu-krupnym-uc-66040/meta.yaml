title:
  rus: Об утверждении Инструкции о мерах по поддержанию крупным участником накопительного пенсионного фонда и (или) организации, осуществляющей инвестиционное управление пенсионными активами, коэффициентов достаточности собственного капитала накопительного пенсионного фонда и (или) организации, осуществляющей инвестиционное управление пенсионными активами
  kaz: Жинақтаушы зейнетақы қорының және (немесе) зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымның ірі қатысушысының жинақтаушы зейнетақы қорының және (немесе) зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымның меншікті капиталының жеткіліктілігі коэффициенттерін қолдауы жөніндегі шаралар туралы нұсқаулықты бекіту жөнінде

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 42 "Об утверждении Правил осуществления экспортно-импортного валютного контроля в Республике Казахстан и получения резидентами учетных номеров контрактов по экспорту и импорту"
    kaz: '"Қазақстан Республикасында экспорттық-импорттық валюталық бақылауды жүзеге асыру және резиденттердің экспорт және импорт бойынша келісімшарттардың есептік нөмірлерін алу қағидаларын бекіту туралы" Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 24 ақпандағы № 42 қаулысына өзгерістер мен толықтырулар енгізу туралы'

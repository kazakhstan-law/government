title:
  rus: Об утверждении Правил осуществления экспортно-импортного валютного контроля в Республике Казахстан и получения резидентами учетных номеров контрактов по экспорту и импорту
  kaz: Қазақстан Республикасында экспорттық-импорттық валюталық бақылауды жүзеге асыру және резиденттердің экспорт және импорт бойынша келісімшарттардың есептік нөмірлерін алу қағидаларын бекіту туралы

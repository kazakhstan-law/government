title:
  rus: Об утверждении Инструкции по осуществлению мониторинга источников спроса и предложения, а также направлений использования иностранной валюты на внутреннем валютном рынке
  kaz: Ішкі валюта нарығында шетел валютасына сұраныс пен ұсыныс көздерінің, сондай-ақ оны пайдалану бағыттарының мониторингін жүзеге асыру жөніндегі нұсқаулықты бекіту туралы

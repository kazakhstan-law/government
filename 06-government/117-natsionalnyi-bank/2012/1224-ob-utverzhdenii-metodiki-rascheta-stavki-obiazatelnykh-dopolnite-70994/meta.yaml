act_code: '70994'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 387. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 февраля 2013 года № 8329
title:
  rus: «Об утверждении Методики расчета ставки обязательных, дополнительных взносов и условных обязательств, порядка и сроков уплаты обязательных, первоначальных разовых, дополнительных и чрезвычайных взносов, порядка формирования и учета условных обязательств страховыми организациями, филиалами страховых организаций-нерезидентов Республики Казахстан - участниками Фонда гарантирования страховых выплат»;
  kaz: Сақтандыру төлемдеріне кепілдік беру қорының қатысушылары – сақтандыру ұйымдарының, Қазақстан Республикасының бейрезидент-сақтандыру ұйымдары филиалдарының міндетті, қосымша жарналар мен шартты міндеттемелердің мөлшерлемесін есептеу әдістемесін, міндетті, бастапқы біржолғы, қосымша және төтенше жарналарды төлеу тәртібі мен мерзімдерін, шартты міндеттемелерді қалыптастыру мен есепке алу тәртібін бекіту туралы

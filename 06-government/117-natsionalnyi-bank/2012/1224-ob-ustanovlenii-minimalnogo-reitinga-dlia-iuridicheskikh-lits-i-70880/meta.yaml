  code: '146686'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 21 сентября 2020 года № 85. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 сентября 2020 года № 21277. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 14 апреля 2026 года № 64 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 385 «Об установлении минимального рейтинга для юридических лиц и стран, необходимость наличия которого требуется в соответствии с законодательством Республики Казахстан, регулирующим деятельность финансовых организаций, перечня рейтинговых агентств, присваивающих данный рейтинг»
    kaz: «Болу қажеттілігі қаржы ұйымдарының қызметін реттейтін Қазақстан Республикасының заңнамасына сәйкес талап етілетін заңды тұлғалар және елдер үшін ең төменгі рейтингіні, осы рейтингіні беретін рейтингілік агенттіктер тізбесін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 24 желтоқсандағы № 385 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/146686/rus

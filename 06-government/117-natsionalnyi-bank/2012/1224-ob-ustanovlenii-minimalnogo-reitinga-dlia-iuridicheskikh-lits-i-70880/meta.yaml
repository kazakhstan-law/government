act_code: '70880'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 385. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 февраля 2013 года № 8318. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 14 апреля 2026 года № 64 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении минимального рейтинга для юридических лиц и стран, необходимость наличия которого требуется в соответствии с законодательством Республики Казахстан, регулирующим деятельность финансовых организаций, филиалов банков-нерезидентов Республики Казахстан, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, перечня рейтинговых агентств, присваивающих данный рейтинг
  kaz: Болу қажеттілігі қаржы ұйымдарының, Қазақстан Республикасының бейрезиденті-банктері филиалдарының, Қазақстан Республикасының бейрезиденті-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының қызметін реттейтін Қазақстан Республикасының заңнамасына сәйкес талап етілетін заңды тұлғалар және елдер үшін ең төменгі рейтингіні, осы рейтингіні беретін рейтингілік агенттіктер тізбесін белгілеу туралы

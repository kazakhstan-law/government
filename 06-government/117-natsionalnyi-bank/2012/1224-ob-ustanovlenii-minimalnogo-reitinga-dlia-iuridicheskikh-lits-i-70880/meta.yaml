  code: '119253'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 29 января 2018 года № 6. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 февраля 2018 года № 16434. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 14 апреля 2026 года № 64 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 385 «Об установлении минимального рейтинга для юридических лиц, необходимость наличия которого требуется в соответствии с законодательством Республики Казахстан, регулирующим деятельность финансовых организаций, перечня рейтинговых агентств, присваивающих данный рейтинг»
    kaz: «Болу қажеттілігі қаржы ұйымдарының қызметін реттейтін Қазақстан Республикасының заңнамасына сәйкес талап етілетін заңды тұлғалар үшін ең төменгі рейтингіні, осы рейтингіні беретін рейтингілік агенттіктер тізбесін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 24 желтоқсандағы № 385 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/119253/rus

  code: '186746'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 сентября 2023 года № 74. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 октября 2023 года № 33495. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 14 апреля 2026 года № 64 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 385 «Об установлении минимального рейтинга для юридических лиц и стран, необходимость наличия которого требуется в соответствии с законодательством Республики Казахстан, регулирующим деятельность финансовых организаций, филиалов банков-нерезидентов Республики Казахстан, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, перечня рейтинговых агентств, присваивающих данный рейтинг»
    kaz: «Болу қажеттілігі қаржы ұйымдарының, Қазақстан Республикасының бейрезиденті-банктері филиалдарының, Қазақстан Республикасының бейрезиденті-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының қызметін реттейтін Қазақстан Республикасының заңнамасына сәйкес талап етілетін заңды тұлғалар және елдер үшін ең төменгі рейтингіні, осы рейтингіні беретін рейтингілік агенттіктер тізбесін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 24 желтоқсандағы № 385 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/186746/rus

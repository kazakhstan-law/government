act_code: '67911'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 257. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 октября 2012 года № 7956. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231 (вводится в действие с 1 января 2020 года)
title:
  rus: Об утверждении Требований к деятельности по пересчету, сортировке, упаковке, хранению банкнот, монет и ценностей, а также их выдаче банкам и их клиентам по поручению банков, осуществляемой организациями, имеющими лицензию Национального Банка Республики Казахстан на проведение операции по инкассации банкнот, монет и ценностей
  kaz: Банкноттарды, монеталарды және құндылықтарды инкассациялау жөніндегі операцияны жүргізуге арналған Қазақстан Республикасы Ұлттық Банкінің лицензиясы бар ұйымдар жүзеге асыратын банкноттарды, монеталарды және құндылықтарды қайта санау, сұрыптау, орау, сақтау, сондай-ақ оларды банктерге және банктердің тапсырмасы бойынша олардың клиенттеріне беру жөніндегі қызметке қойылатын талаптарды бекіту туралы

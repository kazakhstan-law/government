  requisite: Постановление Правления Национального Банка Республики Казахстан от 26 августа 2019 года № 148. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 августа 2019 года № 19308. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 74 «Об установлении Требований к внутренней политике по оплате труда, начислению денежных вознаграждений, а также других видов материального поощрения руководящих работников банков второго уровня, страховых (перестраховочных) организаций и формы отчетности о доходах, выплаченных всем руководящим работникам банков второго уровня и страховых (перестраховочных) организаций»
    kaz: «Екінші деңгейдегі банктердің, сақтандыру (қайта сақтандыру) ұйымдарының басшы қызметкерлеріне еңбекақы төлеу, ақшалай сыйақылар, сондай-ақ материалдық көтермелеудің басқа да түрлерін есептеу жөніндегі ішкі саясатына қойылатын талаптарды және екінші деңгейдегі банктердің және сақтандыру (қайта сақтандыру) ұйымдарының барлық басшы қызметкерлеріне төленген кірістер туралы есептіліктің нысанын белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 24 ақпандағы № 74 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134075/rus

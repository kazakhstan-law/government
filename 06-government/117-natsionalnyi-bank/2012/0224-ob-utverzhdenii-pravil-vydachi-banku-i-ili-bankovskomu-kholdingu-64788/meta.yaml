act_code: '64788'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 91. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2012 года № 7564. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 января 2017 года № 24 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи банку и (или) банковскому холдингу разрешения на создание или приобретение дочерней организации, на создание или приобретение банком дочерней организации, приобретающей сомнительные и безнадежные активы родительского банка, на значительное участие банка и (или) банковского холдинга в капитале организаций, а также отзыва разрешения на создание, приобретение банком и (или) банковским холдингом дочерней организации, на значительное участие банка и (или) банковского холдинга в капитале организаций
  kaz: Банкке және (немесе) банк холдингіне еншiлес ұйым құруға немесе иемденуге, бас банктің күмәнді және үмітсіз активтерін иемденетін еншілес ұйымды банктің құруына немесе иемденуіне, банктің және (немесе) банк холдингінің ұйымдардың капиталына қомақты қатысуына рұқсат беру, сондай-ақ банктің және (немесе) банк холдингінің еншiлес ұйым құруға, иемденуге, банктің және (немесе) банк холдингінің ұйымдардың капиталына қомақты қатысуына рұқсатын кері қайтарып алу қағидаларын бекіту туралы

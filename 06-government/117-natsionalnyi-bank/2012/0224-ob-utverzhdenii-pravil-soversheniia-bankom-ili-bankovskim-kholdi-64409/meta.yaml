  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты по вопросам деятельности банков второго уровня на рынке ценных бумаг
    kaz: Кейбір нормативтік құқықтық актілерге екінші деңгейдегі банктердің бағалы қағаздар нарығындағы қызметінің мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

act_code: '64409'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 62. Зарегистрировано в Министерстве юстиции 2 апреля 2012 года № 7507. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 72 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил совершения, банком или банковским холдингом сделок с собственными облигациями и облигациями, выпущенными дочерними организациями данного банка или банковского холдинга, обязательства по которым гарантированы банком или банковским холдингом
  kaz: Банктің немесе банк холдингінің меншікті облигациялармен және банк немесе банк холдингі міндеттемелеріне кепілдік берген осы банктің немесе банк холдингінің еншілес ұйымдары шығарған облигациялармен мәмілелер жасау қағидаларын бекіту туралы

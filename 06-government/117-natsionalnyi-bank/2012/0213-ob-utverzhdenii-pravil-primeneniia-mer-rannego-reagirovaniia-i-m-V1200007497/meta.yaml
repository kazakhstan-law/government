  title:
    rus: Об установлении факторов, влияющих на ухудшение финансового положения организаций, осуществляющих брокерскую и (или) дилерскую деятельность на рынке ценных бумаг и (или) деятельность по управлению инвестиционным портфелем, а также утверждении Правил одобрения плана мероприятий, предусматривающего меры раннего реагирования, и Методики определения факторов, влияющих на ухудшение финансового положения организаций, осуществляющих брокерскую и (или) дилерскую деятельность на рынке ценных бумаг и (или) деятельность по управлению инвестиционным портфелем
    kaz: Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті және (немесе) инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдардың қаржылық жағдайының нашарлауына әсер ететін факторларды белгілеу, сондай-ақ Ерте ден қою шараларын көздейтін іс-шаралар жоспарын мақұлдау қағидаларын және Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті және (немесе) инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдардың қаржылық жағдайының нашарлауына әсер ететін факторларды анықтау әдістемесін бекіту туралы

act_code: '64662'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 67. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 апреля 2012 года № 7552. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 30 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи, отзыва согласия на приобретение статуса крупного участника банка, банковского холдинга, крупного участника страховой (перестраховочной) организации, страхового холдинга, крупного участника управляющего инвестиционным портфелем и требования к документам, представляемым для получения указанного согласия
  kaz: Банктің, банк холдингінің ірі қатысушысы, сақтандыру (қайта сақтандыру) ұйымының, сақтандыру холдингінің ірі қатысушысы, инвестициялық портфельді басқарушының ірі қатысушысы мәртебесін иеленуге келісім беру, оны кері қайтарып алу қағидаларын және көрсетілген келісімді алу үшін табыс етілетін құжаттарға қойылатын талаптарды бекіту туралы

    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам финансового рынка и финансовых организаций
    kaz: Қазақстан Республикасының қаржы нарығы және қаржы ұйымдары мәселелері бойынша кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу туралы

act_code: '66127'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 167. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 июня 2012 года № 7736. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 183
title:
  rus: Об утверждении Правил применения ограниченных мер воздействия к субъекту рынка ценных бумаг и (или) лицу, обладающему признаками крупного участника, крупному участнику организации, осуществляющей инвестиционное управление пенсионными активами
  kaz: Бағалы қағаздар нарығының субъектісіне және (немесе) ірі қатысушы белгілерін иеленуші тұлғаға, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымның ірі қатысушысына шектеулі ықпал ету шараларын қолдану қағидаларын бекіту туралы

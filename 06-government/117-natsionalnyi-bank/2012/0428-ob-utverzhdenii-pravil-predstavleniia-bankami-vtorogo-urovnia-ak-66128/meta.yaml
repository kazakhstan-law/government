requisite: Постановление Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 174. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 июня 2012 года № 7739. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 декабря 2018 года № 313 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления банками второго уровня, Акционерным обществом "Банк Развития Казахстана" и организациями, осуществляющими отдельные виды банковских операций, отчетности по займам и условным обязательствам
  kaz: Екінші деңгейдегі банктердің, "Қазақстанның Даму Банкі" акционерлік қоғамының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қарыздар мен шартты міндеттемелер бойынша есептілікті беру қағидаларын бекіту туралы

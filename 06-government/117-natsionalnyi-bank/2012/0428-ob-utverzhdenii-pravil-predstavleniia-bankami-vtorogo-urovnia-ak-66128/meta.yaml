  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 174 «Об утверждении Правил представления банками второго уровня, Акционерным обществом «Банк Развития Казахстана» и организациями, осуществляющими отдельные виды банковских операций, отчетности по займам и условным обязательствам»
    kaz: «Екінші деңгейдегі банктердің, «Қазақстанның Даму Банкі» акционерлік қоғамының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қарыздар мен шартты міндеттемелер бойынша есептілікті беру қағидаларын бекіту туралы» Қазақстан Республикасының Ұлттық Банкі Басқармасының 2012 жылғы 28 сәуірдегі № 174 қаулысына өзгерістер мен толықтыру енгізу туралы

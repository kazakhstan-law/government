    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына қолма-қол ақша айналысы және банкноттарды, монеталарды және құндылықтарды инкассациялау мәселелері бойынша өзгерістер енгізу туралы

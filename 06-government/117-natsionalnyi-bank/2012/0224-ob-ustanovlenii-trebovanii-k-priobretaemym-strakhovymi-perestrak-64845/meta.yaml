act_code: '64845'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 98. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 апреля 2012 года № 7550. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении Требований к приобретаемым страховыми (перестраховочными) организациями, дочерними организациями страховых (перестраховочных) организаций или страховых холдингов акциям (долям участия в уставном капитале) юридических лиц, а также перечня облигаций международных финансовых организаций и финансовых инструментов (за исключением акций и долей участия в уставном капитале), приобретаемых страховыми холдингами и страховыми (перестраховочными) организациями
  kaz: Сақтандыру (қайта сақтандыру) ұйымдары, сақтандыру (қайта сақтандыру) ұйымдарының немесе сақтандыру холдингтерінің еншілес ұйымдары сатып алатын акцияларға (жарғылық капиталға қатысу үлестеріне) қойылатын талаптарды, сондай-ақ сақтандыру холдингтері мен сақтандыру (қайта сақтандыру) ұйымдары сатып алатын халықаралық қаржы ұйымдары облигацияларының және қаржы құралдарының (акцияларды және жарғылық капиталға қатысу үлестерін қоспағанда) тізбесін бекіту туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 137. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 мая 2012 года № 7663. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого опубликования)
title:
  rus: Об утверждении Правил исчисления ставок вознаграждения в достоверном, годовом, эффективном, сопоставимом исчислении (реальной стоимости) по займам и вкладам
  kaz: Қарыздар мен салымдар бойынша шынайы, жылдық, тиімді, салыстырмалы есептеудегі сыйақы мөлшерлемелерін (нақты құнын) есептеу қағидаларын бекіту туралы

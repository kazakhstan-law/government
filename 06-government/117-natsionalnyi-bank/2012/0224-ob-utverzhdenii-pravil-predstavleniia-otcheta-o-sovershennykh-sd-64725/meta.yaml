title:
  rus: Об утверждении Правил представления отчета о совершенных сделках по инвестированию пенсионных активов и собственных активов накопительными пенсионными фондами и организациями, осуществляющими инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерін инвестициялау бойынша жасалған мәмілелер және жинақтаушы зейнетақы қорлары мен зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың меншiктi активтері жөнінде есеп беру қағидаларын бекіту туралы

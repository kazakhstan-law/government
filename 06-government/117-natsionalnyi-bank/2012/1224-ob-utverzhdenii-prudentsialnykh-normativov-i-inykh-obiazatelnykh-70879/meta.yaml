requisite: Постановление Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 382. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 февраля 2013 года № 8317. Утратило силу Постановлением Правления Национального Банка Республики Казахстан от 31 июля 2017 года № 148 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении пруденциальных нормативов и иных обязательных к соблюдению микрофинансовой организацией норм и лимитов и методики их расчетов, а также формы и сроков представления отчетности об их выполнении
  kaz: Пруденциалдық нормативтердi және микроқаржы ұйымының сақтауы мiндеттi басқа да нормалар мен лимиттердi және оларды есептеу әдістемесін, сондай-ақ олардың орындалуы туралы есептілік берудің нысандарын және мерзiмдерiн бекіту туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 237. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 октября 2012 года № 7957. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 января 2016 года № 31
title:
  rus: Об утверждении Правил, устанавливающих требования, предъявляемые к степеням защиты вексельной бумаги, производимой на территории или ввозимой на территорию Республики Казахстан, а также технические требования к вексельной бумаге
  kaz: Қазақстан Республикасының аумағында шығарылатын немесе аумағына әкелінетін вексель қағазының қорғаныш дәрежелеріне қойылатын талаптарды, сондай-ақ вексель қағазына техникалық талаптарды белгілейтін қағидаларды бекіту туралы

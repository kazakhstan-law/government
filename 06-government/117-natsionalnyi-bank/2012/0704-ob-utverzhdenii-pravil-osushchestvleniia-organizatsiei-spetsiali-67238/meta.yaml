act_code: '67238'
requisite: Постановление Правления Национального Банка Республики Казахстан от 04 июля 2012 года № 215. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 августа 2012 года № 7865. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 сентября 2014 года № 179
title:
  rus: Об утверждении Правил осуществления организацией, специализирующейся на улучшении качества кредитных портфелей банков второго уровня, оценки и приобретения сомнительных и безнадежных активов, а также Требований к приобретаемым (приобретенным) ею сомнительным и безнадежным активам
  kaz: Екінші деңгейдегі банктердің кредиттік портфельдерінің сапасын жақсартуға мамандандырылған ұйымның күмәнді және үмітсіз активтерді бағалауды және иемденуді жүзеге асыру қағидаларын, сондай-ақ Иемденетін (иемденген) күмәнді және үмітсіз активтерге қойылатын талаптарды бекіту туралы

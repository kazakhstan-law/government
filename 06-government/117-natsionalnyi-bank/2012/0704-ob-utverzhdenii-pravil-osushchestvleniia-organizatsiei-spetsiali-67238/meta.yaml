  title:
    rus: О внесении изменения в постановление Правления Национального Банка от 4 июля 2012 года № 215 "Об утверждении Правил осуществления организацией, специализирующейся на улучшении качества кредитных портфелей банков второго уровня, оценки и приобретения сомнительных и безнадежных активов, а также Требований к приобретаемым (приобретенным) ею сомнительным и безнадежным активам"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің кредиттік портфельдерінің сапасын жақсартуға мамандандырылған ұйымның күмәнді және үмітсіз активтерді бағалауды және иемденуді жүзеге асыру қағидаларын, сондай-ақ Иемденетін (иемденген) күмәнді және үмітсіз активтерге қойылатын талаптарды бекіту туралы" 2012 жылғы 4 шілдедегі № 215 қаулысына өзгеріс енгізу туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 апреля 2026 года № 89. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 мая 2026 года № 38626
  title:
    rus: Об утверждении Правил публикации финансовой отчетности и основных показателей деятельности акционерных обществ, финансовых организаций, банков, филиалов банков - нерезидентов Республики Казахстан, банковских холдингов, страховых (перестраховочных) организаций, страховых брокеров, страховых холдингов, филиалов страховых (перестраховочных) организаций - нерезидентов Республики Казахстан и филиалов страховых брокеров - нерезидентов Республики Казахстан
    kaz: Акционерлік қоғамдардың және қаржы ұйымдарының, банктердің, Қазақстан Республикасының бейрезидент банктері филиалдарының, банк холдингтерінің, сақтандыру (қайта сақтандыру) ұйымдарының, сақтандыру брокерлерінің, сақтандыру холдингтерінің, Қазақстан Республикасының бейрезидент сақтандыру (қайта сақтандыру) ұйымдары филиалдарының және Қазақстан Республикасының бейрезидент сақтандыру брокерлері филиалдарының қаржылық есептілікті және қызметінің негізгі көрсеткіштерін жариялау қағидаларын бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/224898/rus

requisite: Постановление Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 138. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 мая 2012 года № 7648. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 апреля 2026 года № 89 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

act_code: '64657'
requisite: Постановление Правления Национального Банка Республики Казахстан от 13 февраля 2012 года № 32. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 апреля 2012 года № 7519. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 декабря 2019 года № 261 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления доверительного управления акциями банка, страховой (перестраховочной) организации, управляющего инвестиционным портфелем, принадлежащими крупному участнику банка, страховой (перестраховочной) организации, управляющего инвестиционным портфелем, банковскому холдингу, страховому холдингу либо лицу, обладающему признаками крупного участника банка, страховой (перестраховочной) организации, управляющего инвестиционным портфелем, банковского холдинга, страхового холдинга, а также действий уполномоченного органа либо национального управляющего холдинга в период доверительного управления
  kaz: Банктің, сақтандыру (қайта сақтандыру) ұйымының, инвестициялық портфельді басқарушының ірі қатысушысына, банк холдингіне, сақтандыру холдингіне не банктің, сақтандыру (қайта сақтандыру) ұйымының, инвестициялық портфельді басқарушының ірі қатысушысы, банк холдингі, сақтандыру холдингі белгілері бар тұлғаға тиесілі банктің, сақтандыру (қайта сақтандыру) ұйымының, инвестициялық портфельді басқарушының акцияларын сенімгерлік басқаруды, сондай-ақ сенімгерлік басқару кезеңінде уәкілетті органның не ұлттық басқарушы холдингтің әрекеттерін жүзеге асыру қағидаларын бекіту туралы

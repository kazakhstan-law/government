  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 13 февраля 2012 года № 39 "Об установлении лимита доли акций (долей участия в уставном капитале) родительской организации банковского конгломерата, банка или банковского холдинга, принадлежащих дочерним организациям банка либо банковского холдинга, организациям, в которых банк либо банковский холдинг имеют значительное участие"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Банктің не банк холдингінің еншілес ұйымдарына, банк не банк холдингі қомақты қатысатын ұйымдарға тиесілі банк конгломераты бас ұйымының, банктің немесе банк холдингінің акциялары үлесінің (жарғылық капиталға қатысу үлестерінің) лимитін белгілеу туралы" 2012 жылғы 13 ақпандағы № 39 қаулысына өзгеріс енгізу туралы

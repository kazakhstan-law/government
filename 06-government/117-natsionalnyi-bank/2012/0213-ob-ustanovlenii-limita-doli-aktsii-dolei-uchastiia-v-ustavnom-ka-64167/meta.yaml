title:
  rus: Об установлении лимита доли акций (долей участия в уставном капитале) родительской организации банковского конгломерата, банка или банковского холдинга, принадлежащих дочерним организациям банка либо банковского холдинга, организациям, в которых банк либо банковский холдинг имеют значительное участие
  kaz: Банктің не банк холдингінің еншілес ұйымдарына, банк не банк холдингі қомақты қатысатын ұйымдарға тиесілі банк конгломераты бас ұйымының, банктің немесе банк холдингінің акциялары үлесінің (жарғылық капиталға қатысу үлестерінің) лимитін белгілеу туралы

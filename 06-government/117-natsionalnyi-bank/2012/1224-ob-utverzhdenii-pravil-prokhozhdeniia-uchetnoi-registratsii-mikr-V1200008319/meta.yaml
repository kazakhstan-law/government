  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 386 «Об утверждении Правил прохождения учетной регистрации микрофинансовых организаций и ведения реестра микрофинансовых организаций»
    kaz: «Микроқаржы ұйымдарын есептік тіркеуден өткізу және микроқаржы ұйымдарының тізілімін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 24 желтоқсандағы № 386 қаулысына өзгерістер мен толықтырулар енгізу туралы

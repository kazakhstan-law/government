  title:
    rus: О признании утратившими силу некоторых нормативных правовых актов Республики Казахстан, а также структурных элементов некоторых нормативных правовых актов Республики Казахстан по вопросам регулирования рынка ценных бумаг
    kaz: Бағалы қағаздар нарығын реттеу мәселелері бойынша Қазақстан Республикасының кейбір нормативтік құқықтық актілерінің, сондай-ақ Қазақстан Республикасының кейбір нормативтік құқықтық актілерінің құрылымдық элементтерінің күші жойылды деп тану туралы

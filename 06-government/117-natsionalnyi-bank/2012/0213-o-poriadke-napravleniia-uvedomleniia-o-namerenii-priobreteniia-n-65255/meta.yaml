requisite: Постановление Правления Национального Банка Республики Казахстан от 13 февраля 2012 года № 29. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 марта 2012 года № 7477. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 187 (вводится в действие с 1 января 2019 года)
title:
  rus: О порядке направления уведомления о намерении приобретения на вторичном рынке ценных бумаг тридцати или более процентов голосующих акций общества либо иного количества голосующих акций, в результате приобретения которого лицу самостоятельно или совместно с его аффилиированными лицами будет принадлежать тридцать или более процентов голосующих акций общества
  kaz: Қоғамның дауыс беретін акцияларының отыз немесе одан да көп пайызын не дербес немесе өзiнiң үлестес тұлғаларымен бірлесіп сатып алу нәтижесінде қоғамның дауыс беретін акцияларының отыз немесе одан да көп пайызы тұлғаға тиесілі болатын дауыс беретін акцияларының өзге санын бағалы қағаздардың қайталама нарығында сатып алу ниеті туралы хабарламаны жіберу тәртiбi туралы

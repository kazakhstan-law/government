act_code: '65564'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 96. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 мая 2012 года № 7623. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 февраля 2018 года № 41 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил отнесения активов, предоставленных банками дочерним организациям на приобретение прав требований по кредитам (займам), признанным сомнительными и безнадежными активами, к категории сомнительных и безнадежных, а также формирования провизии (резервов) против активов, представленных родительскими банками дочерним организациям
  kaz: Банктердің еншілес ұйымдарға күмәнді және үмітсіз активтер деп танылған кредиттер (қарыздар) бойынша талап ету құқықтарын иемденуге берген активтерін күмәнділер және үмітсіздер санатына жатқызу, сондай-ақ бас банктердің еншілес ұйымдарға берген активтеріне қарсы провизияларды (резервтерді) қалыптастыру қағидаларын бекіту туралы

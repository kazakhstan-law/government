act_code: '65409'
requisite: Постановление Правления Национального банка Республики Казахстан от 24 февраля 2012 года № 97. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 мая 2012 года № 7607. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 229
title:
  rus: Об утверждении Правил представления отчетности крупными участниками банков, банковскими холдингами, крупными участниками страховой (перестраховочной) организации, страховыми холдингами, крупными участниками накопительного пенсионного фонда, организации, осуществляющей инвестиционное управление пенсионными активами
  kaz: Банктердің ірі қатысушыларының, банк холдингтерінің, сақтандыру (қайта сақтандыру) ұйымы ірі қатысушыларының, сақтандыру холдингтерінің, жинақтаушы зейнетақы қорының ірі қатысушыларының, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымның есеп беру қағидаларын бекіту туралы

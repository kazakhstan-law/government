requisite: Постановление Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 133. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 мая 2012 года № 7662. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 ноября 2022 года № 99 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

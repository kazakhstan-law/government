title:
  rus: Об утверждении Особенностей деятельности ликвидационных комиссий добровольно ликвидируемой страховой (перестраховочной) организации и добровольно прекращающего деятельность филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан
  kaz: Өз еркімен таратылатын сақтандыру (қайта сақтандыру) ұйымының және қызметін ерікті түрде тоқтататын Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының тарату комиссиялары қызметінің ерекшеліктерін бекіту туралы

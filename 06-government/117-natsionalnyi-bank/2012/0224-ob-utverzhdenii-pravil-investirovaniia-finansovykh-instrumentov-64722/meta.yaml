title:
  rus: Об утверждении Правил инвестирования финансовых инструментов и иного имущества, входящего в состав активов инвестиционного фонда, и перечня финансовых инструментов, которые могут входить в состав активов акционерных и паевых инвестиционных фондов
  kaz: Қаржы құралдарын және инвестициялық қор активтерінің құрамына кіретін өзге де мүлікті инвестициялау қағидаларын және акционерлік және инвестициялық пай қорлары активтерінің құрамына кіруі мүмкін қаржы құралдарының тізбесін бекіту туралы

  title:
    rus: Об утверждении формы отчета № 1-ЭТ "О правонарушениях, связанных с экстремизмом и терроризмом и о состоянии прокурорского надзора" и Инструкции по его составлению, формировании банка данных о лицах, привлеченных к ответственности за совершение уголовных правонарушений, связанных с экстремизмом и терроризмом и организациях, признанных судом экстремистскими, террористическими
    kaz: '"Экстремизмге, терроризмге байланысты қылмыстық құқық бұзушылықтар туралы және прокурорлық қадағалау жағдайы туралы" № 1-ЭТ нысанды есепті және оны құрастыру жөніндегі Нұсқаулықты бекіту, экстремизмге және терроризмге байланысты қылмыстық құқық бұзушылық жасағаны үшін жауаптылыққа тартылған адамдар және сот экстремистік, террористік деп таныған ұйымдар туралы деректер қорын қалыптастыру туралы'

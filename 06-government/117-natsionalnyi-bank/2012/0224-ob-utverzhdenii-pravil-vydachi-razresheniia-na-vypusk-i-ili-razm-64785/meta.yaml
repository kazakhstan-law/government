act_code: '64785'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 70. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2012 года № 7560. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 8 апреля 2019 года № 57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на выпуск и (или) размещение эмиссионных ценных бумаг организации-резидента Республики Казахстан на территории иностранного государства, представления уведомления о выпуске депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги организаций-резидентов Республики Казахстан, а также отчета об итогах их размещения
  kaz: Қазақстан Республикасының резидент ұйымына шет мемлекеттің аумағында эмиссиялық бағалы қағаздар шығаруға және (немесе) орналастыруға рұқсат беру, базалық активі Қазақстан Республикасының резидент ұйымдарының эмиссиялық бағалы қағаздары болып табылатын, депозитарлық қолхаттарды немесе өзге де бағалы қағаздарды шығару туралы хабарламаны, сондай-ақ оларды орналастырудың қорытындылары туралы есепті ұсыну қағидаларын бекіту туралы

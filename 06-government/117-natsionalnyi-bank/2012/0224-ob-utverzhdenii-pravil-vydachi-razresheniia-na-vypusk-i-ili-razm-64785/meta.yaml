  requisite: Постановление Правления Национального Банка Республики Казахстан от 21 сентября 2012 года № 297. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 ноября 2012 года № 8060. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 8 апреля 2019 года № 57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 70 "Об утверждении Правил выдачи разрешения на выпуск и (или) размещение эмиссионных ценных бумаг организации-резидента Республики Казахстан на территории иностранного государства, представления уведомления о выпуске депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги организаций-резидентов Республики Казахстан, а также отчета об итогах их размещения"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының резиденті-ұйымның эмиссиялық бағалы қағаздарын шет мемлекеттің аумағында шығаруға және (немесе) орналастыруға рұқсат беру, депозитарлық қолхаттардың немесе Қазақстан Республикасының резиденттері-ұйымдардың эмиссиялық бағалы қағаздары базалық активі болып табылатын өзге бағалы қағаздардың шығарылымы туралы хабарламаны, сондай-ақ оларды орналастыру туралы есепті ұсыну қағидаларын бекіту туралы" 2012 жылғы 24 ақпандағы № 70 қаулысына өзгерістер енгізу туралы

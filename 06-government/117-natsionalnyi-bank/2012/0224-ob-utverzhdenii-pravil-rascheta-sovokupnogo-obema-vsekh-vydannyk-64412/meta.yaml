act_code: '64412'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 80. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 апреля 2012 года № 7510. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 66 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил расчета совокупного объема всех выданных банками второго уровня, филиалами банков-нерезидентов Республики Казахстан банковских займов и банковских гарантий лицам, связанным с ними особыми отношениями, и юридическим лицам-резидентам и нерезидентам Республики Казахстан
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент-банктері филиалдарының олармен ерекше қатынастар арқылы байланысты тұлғаларға және Қазақстан Республикасының резиденттері және бейрезиденттері заңды тұлғаларға барлық берілген банктік қарыздарының және банк кепілдіктерінің жиынтық көлемін есептеу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 27 июля 2012 года № 221 «Об утверждении Инструкции по осуществлению мониторинга источников спроса и предложения, а также направлений использования иностранной валюты на внутреннем валютном рынке»
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының «Ішкі валюта нарығында шетел валютасына сұраныс пен ұсыныс көздерінің, сондай-ақ оны пайдалану бағыттарының мониторингін жүзеге асыру жөніндегі нұсқаулықты бекіту туралы» 2012 жылғы 27 шілдедегі № 221 қаулысына өзгерістер мен толықтыру енгізу туралы

  title:
    rus: Об установлении пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем, утверждении Правил расчета значений пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем и внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам рынка ценных бумаг

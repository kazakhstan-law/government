act_code: '65714'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 176. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 мая 2012 года № 7666. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 июня 2013 года № 141
title:
  rus: Об установлении рейтинговых агентств и минимального требуемого рейтинга для облигаций, с которыми банки могут осуществлять сделки, а также минимального требуемого рейтинга стран, с государственными ценными бумагами которых банки могут совершать сделки при осуществлении брокерской и (или) дилерской деятельности
  kaz: Рейтингілік агенттіктерді және банктер мәмілелерін жүзеге асыра алатын облигацияларға арналған ең төменгі талап етілетін рейтингіні, сондай-ақ банктер брокерлік және (немесе) дилерлік қызметті жүзеге асырған кезде мемлекеттік бағалы қағаздарымен мәмілелер жасай алатын елдердің ең төменгі талап етiлетiн рейтингісін белгілеу туралы

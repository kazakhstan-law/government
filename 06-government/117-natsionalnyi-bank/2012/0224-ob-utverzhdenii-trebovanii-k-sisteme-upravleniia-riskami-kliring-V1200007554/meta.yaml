title:
  rus: Об утверждении Требований к системе управления рисками клиринговой организации, условиям и порядку мониторинга, контроля и управления рисками в клиринговой организации
  kaz: Клиринг ұйымының тәуекелдерді басқару жүйесіне, клиринг ұйымындағы тәуекелдер мониторингінің, оларды бақылау мен басқарудың шарттары мен тәртібіне қойылатын талаптарды бекіту туралы

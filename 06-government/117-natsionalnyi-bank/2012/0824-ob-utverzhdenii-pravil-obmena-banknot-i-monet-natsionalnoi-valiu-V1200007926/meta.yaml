  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 253 «Об утверждении Правил обмена банкнот и монет национальной валюты Республики Казахстан, изымаемых и изъятых из обращения, а также ветхих и поврежденных банкнот и монет национальной валюты Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық валютасының айналыстан алынатын және алынған банкноттары мен монеталарын, сондай-ақ Қазақстан Республикасы ұлттық валютасының тозған және бүлінген банкноттары мен монеталарын айырбастау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 24 тамыздағы № 253 қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении Правил обмена банкнот и монет национальной валюты Республики Казахстан, изымаемых и изъятых из обращения, а также ветхих и поврежденных банкнот и монет национальной валюты Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық валютасының айналыстан алынатын және алынған банкноттары мен монеталарын, сондай-ақ Қазақстан Республикасы ұлттық валютасының тозған және бүлінген банкноттары мен монеталарын айырбастау қағидаларын бекіту туралы

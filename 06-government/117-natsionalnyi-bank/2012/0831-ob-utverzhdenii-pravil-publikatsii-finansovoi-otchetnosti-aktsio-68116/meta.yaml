act_code: '68116'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 августа 2012 года № 282. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 2012 года № 8003. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 апреля 2026 года № 89 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил публикации финансовой отчетности акционерными обществами и финансовыми организациями, отчетности по данным бухгалтерского учета филиалами банков-нерезидентов Республики Казахстан, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалами страховых брокеров-нерезидентов Республики Казахстан
  kaz: Акционерлік қоғамдардың және қаржы ұйымдарының қаржылық есептілікті, Қазақстан Республикасының бейрезидент-банктері филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру брокерлері филиалдарының бухгалтерлік есептің деректері бойынша есептілікті жариялау қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты по вопросам бухгалтерского учета и финансовой отчетности
    kaz: Кейбір нормативтік құқықтық актілерге бухгалтерлік есеп және қаржылық есептілік мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

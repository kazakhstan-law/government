  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 31 августа 2012 года № 282 «Об утверждении Правил публикации финансовой отчетности акционерными обществами и финансовыми организациями»
    kaz: «Акционерлік қоғамдардың және қаржы ұйымдарының қаржылық есептілікті жариялау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 31 тамыздағы № 282 қаулысына өзгерістер енгізу туралы

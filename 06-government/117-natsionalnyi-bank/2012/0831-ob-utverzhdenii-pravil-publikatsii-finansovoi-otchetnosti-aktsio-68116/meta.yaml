  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам ведения бухгалтерского учета, срока составления и представления аудиторского отчета, публикации финансовой отчетности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бухгалтерлік есеп жүргізу, аудиторлық есепті жасау және ұсыну мерзімі, қаржылық есептілікті жариялау мәселелері бойынша өзгерістер енгізу туралы

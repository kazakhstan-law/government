requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 81. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 марта 2012 года № 7470. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 25 февраля 2013 года № 72
title:
  rus: Об утверждении Требований по выдаче банками второго уровня банковских займов и банковских гарантий лицам, связанным с ними особыми отношениями, и юридическим лицам (резидентам и нерезидентам Республики Казахстан)
  kaz: Екінші деңгейдегі банктердің олармен ерекше қатынастар арқылы байланысты тұлғаларға және заңды тұлғаларға (Қазақстан Республикасының резиденттеріне және резиденті еместерге) банктік қарыздарды және банк кепілдіктерін беруі жөніндегі талаптарды бекіту туралы

title:
  rus: О минимальных размерах уставного капитала организаций, осуществляющих отдельные виды банковских операций на основании лицензии уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций
  kaz: Қаржы нарығын және қаржы ұйымдарын реттеу, бақылау мен қадағалау жөніндегі уәкілетті органның лицензиясы негізінде банкоперацияларының жекелеген түрлерін жүзеге асыратын ұйымдардың жарғылық капиталының ең аз мөлшерлері туралы

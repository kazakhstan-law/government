key: V1200007619
akn: /akn/kz/act/2012-03-26/V1200007619
act_code: '65538'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 129. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 мая 2012 года № 7619. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 31 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи страховой (перестраховочной) организации и (или) страховому холдингу разрешения на создание или приобретение дочерней организации, значительное участие в капитале организаций, отзыва разрешения на создание, приобретение дочерней организации, значительное участие в капитале организаций, а также требований к документам, необходимым для получения разрешения на создание или приобретение дочерней организации, Требований к содержанию заявления на получение страховой (перестраховочной) организацией и (или) страховым холдингом разрешения на значительное участие в капитале организаций
  kaz: Сақтандыру (қайта сақтандыру) ұйымына және (немесе) сақтандыру холдингіне еншілес ұйымды құруға немесе иеленуге, ұйымдардың капиталына қомақты қатысуға рұқсат беру, еншілес ұйымды құруға, сатып алуға, ұйымдардың капиталына қомақты қатысуға рұқсатты кері қайтарып алу қағидаларын, сондай-ақ еншілес ұйымды құруға немесе иеленуге рұқсат алу үшін қажетті құжаттарға қойылатын талаптарды, Сақтандыру (қайта сақтандыру) ұйымының және (немесе) сақтандыру холдингінің ұйымдардың капиталына қомақты қатысуына рұқсат алуға өтініштің мазмұнына қойылатын талаптарды бекіту туралы

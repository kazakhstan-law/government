act_code: '64874'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 апреля 2012 года № 7576. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 8 августа 2016 года № 183
title:
  rus: Об утверждении Правил передачи организациями, обладающими лицензиями на осуществление деятельности по ведению системы реестров держателей ценных бумаг, единому регистратору сведений и документов, составляющих системы реестров держателей ценных бумаг эмитентов
  kaz: Бағалы қағаздар ұстаушыларының тізілімдері жүйесін жүргізу жөніндегі қызметті жүзеге асыру лицензияларына ие ұйымдардың бірыңғай тіркеушіге эмитенттердің бағалы қағаздарын ұстаушылар тізілімдері жүйелерін құрайтын мәліметтер мен құжаттарды беру қағидаларын бекіту туралы

act_code: '64453'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 74. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 апреля 2012 года № 7525. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении Требований к внутренней политике по оплате труда, начислению денежных вознаграждений, а также других видов материального поощрения руководящих работников банка, страховой (перестраховочной) организации, страхового брокера, филиала банка-нерезидента Республики Казахстан, филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, филиала страхового брокера-нерезидента Республики Казахстан
  kaz: Банктің, сақтандыру (қайта сақтандыру) ұйымының, сақтандыру брокерінің, Қазақстан Республикасы бейрезидент-банкі филиалының, Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының, Қазақстан Республикасы бейрезидент-сақтандыру брокері филиалының басшы қызметкерлеріне еңбекақы төлеу, ақшалай сыйақылар, сондай-ақ материалдық көтермелеудің басқа да түрлерін есептеу жөніндегі ішкі саясатына қойылатын талаптарды белгілеу туралы

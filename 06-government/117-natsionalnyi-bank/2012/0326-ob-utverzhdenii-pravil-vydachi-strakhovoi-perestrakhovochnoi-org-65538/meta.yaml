  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 129 «Об утверждении Правил выдачи страховой (перестраховочной) организации и (или) страховому холдингу разрешения на создание или приобретение дочерней организации, значительное участие в капитале организаций, а также отзыва разрешения на создание, приобретение дочерней организации, значительное участие в капитале организаций»
    kaz: «Сақтандыру (қайта сақтандыру) ұйымына және (немесе) сақтандыру холдингіне еншілес ұйымды құруға немесе иемденуге, ұйымдардың капиталына қомақты қатысуға рұқсат беру, сондай-ақ еншілес ұйымды құруға, сатып алуға, ұйымның капиталына қомақты қатысуға рұқсатты кері қайтарып алу қағидаларын бекіту туралы» Қазақстан Республикасының Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 26 наурыздағы № 129 қаулысына өзгерістер мен толықтыру енгізу туралы

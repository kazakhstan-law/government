act_code: '64402'
requisite: Постановление Правления Национального Банка Республики Казахстан от 13 февраля 2012 года № 34. Зарегистрировано в Министерстве юстиции 30 марта 2012 года № 7497. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2018 года № 300 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил применения мер раннего реагирования и методики определения факторов, влияющих на ухудшение финансового положения организаций, осуществляющих брокерскую и (или) дилерскую деятельность на рынке ценных бумаг и (или) деятельность по управлению инвестиционным портфелем
  kaz: Ертерек ден қою шараларын және бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті және (немесе) инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдардың қаржылық жағдайының нашарлауына ықпал ететін факторларды айқындау әдістемесін қолдану қағидаларын бекіту туралы

  title:
    rus: Об утверждении Требований по наличию системы управления рисками для организации, осуществляющей деятельность по ведению системы реестров держателей ценных бумаг, и внесении изменений в некоторые нормативные правовые акты Республики Казахстан
    kaz: Бағалы қағаздарды ұстаушылар тiзiлiмдерiнiң жүйесін жүргізу жөніндегі қызметті жүзеге асыратын ұйым үшін тәуекелдерді басқару жүйесінің болуы жөніндегі талаптарды бекіту және Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне өзгерістер енгізу туралы

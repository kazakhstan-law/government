title:
  rus: Об установлении нормативных значений и методик расчетов пруденциальных нормативов и иных обязательных лимитов для банковского конгломерата, а также форм и сроков представления отчетности
  kaz: Банк конгломератына арналған нормативтік мәндерін және пруденциалдық нормативтер мен өзге де міндетті лимиттерді есептеу әдістемелерін, сондай-ақ есептілікті ұсыну нысандары мен мерзімдерін белгілеу туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 261 "Об утверждении Правил назначения на должность и прекращения трудового договора со служащими Национального Банка Республики Казахстан и его ведомств"
    kaz: Қазақстан Республикасының Ұлттық Банк Баскармасының "Қазақстан Республикасы Ұлттық Банкінің және оның ведомстволарының қызметшілерін лауазымға тағайындау және олармен еңбек шартын тоқтату қағидаларын бекіту туралы" 2012 жылғы 24 тамыздағы № 261 қаулысына өзгерістер енгізу туралы

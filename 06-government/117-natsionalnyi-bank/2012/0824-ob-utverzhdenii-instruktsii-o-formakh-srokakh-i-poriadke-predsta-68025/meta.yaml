requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 259. Зарегистрировано в Министерстве юстиции Республики казахстан 8 октября 2012 года № 7989. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 30 июля 2018 года № 163 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции о формах, сроках и порядке представления банками второго уровня отчетности по экспортным операциям с аффинированным золотом и серебром в слитках
  kaz: Екінші деңгейдегі банктердің тазартылған құйма алтынмен және күміспен жүргізілетін экспорттық операциялар жөніндегі есептілікті беру нысандары, мерзімдері және тәртібі туралы нұсқаулықты бекіту туралы

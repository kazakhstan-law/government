  kaz: Банк кепілдігі және кепілдеме туралы кредиттік есепті беру, борышкер-тұлғаның өзі туралы және оның пайдасына банк шығарған кепілдіктер немесе кепілдемелер туралы мәліметтерді банктің кредиттік бюроға беруіне келісімін ресімдеу қағидаларын бекіту туралы

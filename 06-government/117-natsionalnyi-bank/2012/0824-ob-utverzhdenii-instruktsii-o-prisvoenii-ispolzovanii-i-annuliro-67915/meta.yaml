act_code: '67915'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 236. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 октября 2012 года № 7960. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 октября 2020 года № 128 (вводится в действие с 16 декабря 2020 года)
title:
  rus: Об утверждении Инструкции о присвоении, использовании и аннулировании Национальным Банком Республики Казахстан банковских идентификационных кодов, а также присвоении и аннулировании кодов банков и организаций, осуществляющих отдельные виды банковских операций, и кодов филиалов банков и организаций, осуществляющих отдельные виды банковских операций, их структуре, формировании и ведении Справочника банков и организаций, осуществляющих отдельные виды банковских операций
  kaz: Қазақстан Республикасы Ұлттық Банкінің банктік сәйкестендіру кодтарын беруі, пайдалануы және күшін жоюы, сондай-ақ банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың кодтарын және банктер, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар филиалдарының кодтарын беру және күшін жою, олардың құрылымдары, Банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың анықтамалығын қалыптастыру және жүргізу туралы нұсқаулықты бекіту туралы

  title:
    rus: О внесении изменения и дополнения в постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 84 "Об установлении Требований к приобретаемым банками, дочерними организациями банка или банковского холдинга акциям (долям участия в уставном капитале) юридических лиц, а также совокупной стоимости долей участия банка в уставном капитале либо акций юридических лиц"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Заңды тұлғалардың банктер, банктің немесе банк холдингінің еншілес ұйымдары сатып алатын акцияларға (жарғылық капиталға қатысу үлестеріне) қойылатын талаптарды, сондай-ақ банктің жарғылық капиталға қатысу үлестерінің не заңды тұлғалар акцияларының жиынтық құнын белгілеу туралы" 2012 жылғы 24 ақпандағы № 84 қаулысына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/71454/rus

act_code: '65116'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 88. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2012 года № 7568
title:
  rus: Об утверждении Правил исполнения представителем держателей облигаций своих функций и обязанностей, досрочного прекращения его полномочий, требований к содержанию договора о представлении интересов держателей облигаций, заключаемого между эмитентом и представителем держателей облигаций, и сроков предоставления информации в уполномоченный орган по регулированию, контролю и надзору финансового рынка и финансовых организаций, Правил передачи банкротным управляющим выделенных активов в управление (с правом реализации выделенных активов и обращения взыскания на заложенное имущество и иное обеспечение, входящее в состав выделенных активов) представителю держателей облигаций специальной финансовой компании
  kaz: Облигацияларды ұстаушылар өкілінің өз функциялары мен міндеттерін орындау, оның өкілеттіктерін мерзімінен бұрын тоқтату қағидаларын, эмитент пен облигацияларды ұстаушылардың өкілі арасында жасалатын облигацияларды ұстаушылардың мүдделерін білдіру туралы шарттың мазмұнына қойылатын талаптарды және қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органға ақпарат беру мерзімдерін, Банкроттықты басқарушының бөлінген активтерді арнайы қаржы компаниясының облигацияларын ұстаушылардың өкіліне басқаруға беру (бөлінген активтерді сату және кепілге салынған мүлікті және бөлінген активтердің құрамына кіретін өзге де қамтамасыз етуді өндіріп алу құқығымен) қағидаларын бекіту туралы

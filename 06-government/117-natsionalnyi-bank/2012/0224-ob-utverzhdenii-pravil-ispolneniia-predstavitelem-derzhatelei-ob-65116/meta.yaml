  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 октября 2022 года № 85. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 ноября 2022 года № 30446
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 88 «Об утверждении Правил исполнения представителем держателей облигаций своих функций и обязанностей, досрочного прекращения его полномочий, а также требований к содержанию договора о представлении интересов держателей облигаций, заключаемого между эмитентом и представителем держателей облигаций, и сроков предоставления информации в уполномоченный орган по регулированию, контролю и надзору финансового рынка и финансовых организаций»
    kaz: «Облигацияларды ұстаушылар өкілінің өз функциялары мен міндеттерін орындау, оның өкілеттіктерін мерзімінен бұрын тоқтату қағидаларын, сондай-ақ эмитент пен облигацияларды ұстаушылардың өкілі арасында жасалатын облигацияларды ұстаушылардың мүдделерін білдіру туралы шарттың мазмұнына қойылатын талаптарды және қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органға ақпарат беру мерзімдерін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2012 жылғы 24 ақпандағы № 88 қаулысына өзгерістер мен толықтырулар енгізу туралы

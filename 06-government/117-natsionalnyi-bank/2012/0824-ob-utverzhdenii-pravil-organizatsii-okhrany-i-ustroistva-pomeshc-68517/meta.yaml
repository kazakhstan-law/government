  title:
    rus: О внесении изменений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам организации охраны и устройства помещений банков и организаций, осуществляющих отдельные виды банковских операций, учета, хранения, перевозки и инкассации банкнот, монет и ценностей
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың үй-жайларын күзетуді және жайластыруды ұйымдастыру, банкноттарды, монеталарды және құндылықтарды есепке алу, сақтау, тасымалдау және инкассациялау мәселелері бойынша өзгерістер енгізу туралы

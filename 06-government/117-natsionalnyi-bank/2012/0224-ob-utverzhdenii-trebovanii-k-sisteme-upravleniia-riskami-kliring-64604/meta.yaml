  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам клиринговой деятельности с финансовыми инструментами
    kaz: Қаржы құралдарымен клиринг қызметі мәселелері бойынша Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу туралы

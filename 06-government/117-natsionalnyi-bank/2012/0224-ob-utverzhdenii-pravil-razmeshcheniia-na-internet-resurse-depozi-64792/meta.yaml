  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам выпуска и обращения ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар шығарылымы және айналысы мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

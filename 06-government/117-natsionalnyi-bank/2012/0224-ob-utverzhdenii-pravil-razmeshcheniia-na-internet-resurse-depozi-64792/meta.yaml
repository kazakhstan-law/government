act_code: '64792'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 72. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 апреля 2012 года № 7578. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 января 2016 года № 26
title:
  rus: Об утверждении Правил размещения на интернет-ресурсе депозитария финансовой отчетности, фондовой биржи информации о корпоративных событиях, финансовой отчетности и аудиторских отчетов, а также информации о суммарном размере вознаграждения членов исполнительного органа по итогам года
  kaz: Қаржылық есептілік депозитарийінің, қор биржасының интернет-ресурсында корпоративтік оқиғалар туралы ақпаратты, қаржылық есептілікті және аудиторлық есептерді, сондай-ақ жыл қорытындылары бойынша атқарушылық орган мүшелері сыйақысының жиынтық мөлшері туралы ақпаратты орналастыру қағидаларын бекіту туралы

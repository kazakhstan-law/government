  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам кардинального улучшения условий для предпринимательской деятельности в Республике Казахстан
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне Қазақстан Республикасында кәсіпкерлік қызмет үшін жағдайды түбегейлі жақсарту мәселелері бойынша өзгерістер енгізу туралы

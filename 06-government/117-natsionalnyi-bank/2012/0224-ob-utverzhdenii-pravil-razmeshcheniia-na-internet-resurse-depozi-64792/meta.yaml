  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 72 "Об утверждении Правил размещения на интернет-ресурсе депозитария финансовой отчетности, фондовой биржи информации о корпоративных событиях, финансовой отчетности и аудиторских отчетов"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қаржылық есептілік депозитарийінің, қор биржасының интернет-ресурсында корпоративтік оқиғалар туралы ақпаратты, қаржылық есептілікті және аудиторлық есептерді орналастыру қағидаларын бекіту туралы" 2012 жылғы 24 ақпандағы № 72 қаулысына өзгерістер мен толықтыру енгізу туралы

act_code: '65095'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 100. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 апреля 2012 года № 7606. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 марта 2018 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил отнесения подлежащих к получению дочерней организацией банка, приобретающей сомнительные и безнадежные активы родительского банка, доходов к доходам от осуществления видов деятельности, предусмотренных законодательством Республики Казахстан о банках и банковской деятельности
  kaz: Бас банктің күмәнді және үмітсіз активтерін сатып алатын банктің еншілес ұйымының алуы тиіс кірістерін Қазақстан Республикасының банктер және банк қызметі туралы заңнамасында көзделген қызмет түрлерін жүзеге асырудан түскен кірістерге жатқызу қағидаларын бекіту туралы

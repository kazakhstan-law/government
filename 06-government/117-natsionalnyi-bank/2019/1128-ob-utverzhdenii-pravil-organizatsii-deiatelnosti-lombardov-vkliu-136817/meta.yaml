  title:
    rus: О внесении изменения и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования деятельности организаций, осуществляющих микрофинансовую деятельность
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне микроқаржылық қызметті жүзеге асыратын ұйымдардың қызметін реттеу мәселелері бойынша өзгеріс пен толықтырулар енгізу туралы

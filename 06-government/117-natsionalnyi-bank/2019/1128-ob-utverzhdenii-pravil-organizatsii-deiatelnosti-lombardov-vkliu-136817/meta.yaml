act_code: '136817'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 ноября 2019 года № 226. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 декабря 2019 года № 19709
title:
  rus: Об утверждении Правил организации деятельности ломбардов, включая вопросы хранения вещей в ломбарде, установления требований по обеспечению безопасности и технической укрепленности помещений ломбардов, мер по противодействию обороту в ломбардах незаконно добытых вещей
  kaz: Ломбардта заттарды сақтау, ломбардтардың үй-жайларының қауіпсіздігін және техникалық нығайтылуын қамтамасыз ету жөніндегі талаптарды, ломбардтарда заңсыз алынған заттардың айналымына қарсы іс-қимыл жөніндегі шараларды белгілеу мәселелерін қоса алғанда, ломбардтардың қызметін ұйымдастыру қағидаларын бекіту туралы

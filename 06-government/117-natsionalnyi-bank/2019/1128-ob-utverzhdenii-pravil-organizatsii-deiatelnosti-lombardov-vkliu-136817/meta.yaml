  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования организаций, осуществляющих микрофинансовую деятельность
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне микроқаржылық қызметті жүзеге асыратын ұйымдарды реттеу мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

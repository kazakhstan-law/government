  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам осуществления валютных операций в Республике Казахстан и представления отчетности страховыми (перестраховочными) организациями
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына Қазақстан Республикасында валюталық операцияларды жүзеге асыру және сақтандыру (қайта сақтандыру) ұйымдарының есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

title:
  rus: Об утверждении перечня, форм, сроков представления отчетности о выполнении пруденциальных нормативов страховой (перестраховочной) организацией, страховой группой и исламской страховой (перестраховочной) организацией и Правил ее представления
  kaz: Сақтандыру (қайта сақтандыру) ұйымының, сақтандыру тобының және исламдық сақтандыру (қайта сақтандыру) ұйымының пруденциялық нормативтерді орындауы туралы есептіліктің тізбесін, нысандарын, ұсыну мерзімдерін және оны ұсыну қағидаларын бекіту туралы

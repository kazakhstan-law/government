title:
  rus: Об утверждении Правил применения мер надзорного реагирования к юридическим лицам, осуществляющим деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой, и юридическим лицам, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
  kaz: Қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетел валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункттері арқылы жүзеге асыратын заңды тұлғаларға және банкноттарды, монеталарды және құндылықтарды инкассациялау айрықша қызметі болып табылатын заңды тұлғаларға қадағалап ден қою шараларын қолдану қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам наличного денежного обращения и признании утратившими силу некоторых постановлений Правления Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына қолма-қол ақша айналысы мәселелері бойынша өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларының күші жойылды деп тану туралы

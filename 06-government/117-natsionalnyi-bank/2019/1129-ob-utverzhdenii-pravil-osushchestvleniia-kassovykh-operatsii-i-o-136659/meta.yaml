act_code: '136659'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 декабря 2019 года № 19680
title:
  rus: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
  kaz: Екінші деңгейдегі банктерде, Қазақстан Республикасы бейрезидент- банктерінің филиалдарында, Ұлттық пошта операторында және банкноттарды, монеталарды және құндылықтарды инкассациялау айрықша қызметі болып табылатын заңды тұлғаларда кассалық операцияларды және банкноттарды, монеталарды және құндылықтарды инкассациялау жөніндегі операцияларды жүзеге асыру қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам внедрения цифровых документов и признании утратившим силу постановления Правления Национального Банка Республики Казахстан от 31 января 2019 года № 18 «О внесении изменений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам организации охраны и устройства помещений банков и организаций, осуществляющих отдельные виды банковских операций, учета, хранения, перевозки и инкассации банкнот, монет и ценностей»
    kaz: Цифрлық құжаттарды енгізу мәселелері бойынша Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына өзгерістер енгізу және «Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың үй-жайларын күзетуді және жайластыруды ұйымдастыру, банкноттарды, монеталарды және құндылықтарды есепке алу, сақтау, тасымалдау және инкассациялау мәселелері бойынша өзгерістер енгізу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 31 қаңтардағы № 18 қаулысының күші жойылды деп тану туралы

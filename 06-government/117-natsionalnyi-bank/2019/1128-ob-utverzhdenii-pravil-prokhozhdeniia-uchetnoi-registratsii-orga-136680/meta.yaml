act_code: '136680'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 ноября 2019 года № 227. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 декабря 2019 года № 19686. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 марта 2020 года № 21 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил прохождения учетной регистрации организаций, осуществляющих микрофинансовую деятельность, включая перечень документов, представляемых для прохождения учетной регистрации, а также ведения и исключения из реестра организаций, осуществляющих микрофинансовую деятельность
  kaz: Есептік тіркеуден өту үшін ұсынылатын құжаттар тізбесін қоса алғанда, микроқаржылық қызметті жүзеге асыратын ұйымдардың есептік тіркеуден өту, сондай-ақ микроқаржылық қызметті жүзеге асыратын ұйымдардың тізілімін жүргізу және тізілімнен шығару қағидаларын бекіту туралы

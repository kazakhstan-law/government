requisite: Постановление Правления Национального Банка Республики Казахстан от 19 августа 2019 года № 131. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 августа 2019 года № 192607. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 72 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении требований к приобретаемым банками, дочерними организациями банка или банковского холдинга акциям (долям участия в уставном капитале) юридических лиц, а также совокупной стоимости долей участия банка в уставном капитале либо акций юридических лиц
  kaz: Банктер, банктің немесе банк холдингінің еншілес ұйымдары сатып алатын заңды тұлғалардың акцияларына (жарғылық капиталға қатысу үлестеріне) қойылатын талаптарды, сондай-ақ банктің заңды тұлғалардың жарғылық капиталына қатысу үлестерінің не акцияларының жиынтық құнын белгілеу туралы

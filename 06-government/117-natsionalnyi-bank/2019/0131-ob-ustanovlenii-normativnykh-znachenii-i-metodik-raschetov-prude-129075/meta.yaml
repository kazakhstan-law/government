act_code: '129075'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 января 2019 года № 14. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 февраля 2019 года № 18293
title:
  rus: Об установлении нормативных значений и методик расчетов пруденциальных нормативов исламской страховой (перестраховочной) организации и иных обязательных к соблюдению норм и лимитов, требований к приобретаемым исламскими страховыми (перестраховочными) организациями, дочерними организациями исламских страховых (перестраховочных) организаций акциям (долям участия в уставном капитале) юридических лиц, а также перечня финансовых инструментов (за исключением акций и долей участия в уставном капитале), приобретаемых исламскими страховыми (перестраховочными) организациями
  kaz: Исламдық сақтандыру (қайта сақтандыру) ұйымының пруденциялық нормативтерінің және сақталуға міндетті өзге де нормалар мен лимиттердің нормативтік мәндерін және оларды есептеу әдістемелерін, исламдық сақтандыру (қайта сақтандыру) ұйымдары, исламдық сақтандыру (қайта сақтандыру) ұйымдарының еншілес ұйымдары сатып алатын заңды тұлғалардың акцияларына (жарғылық капиталдағы қатысу үлестеріне) қойылатын талаптарды, сондай-ақ исламдық сақтандыру (қайта сақтандыру) ұйымдары сатып алатын қаржы құралдарының (акциялар мен жарғылық капиталына қатысу үлестерін қоспағанда) тізбесін белгілеу туралы

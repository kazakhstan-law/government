  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам инкассации банкнот, монет и ценностей
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының банкноттарды, монеталарды және құндылықтарды инкассациялау мәселелері бойынша кейбір қаулыларына өзгерістер мен толықтырулар енгізу туралы

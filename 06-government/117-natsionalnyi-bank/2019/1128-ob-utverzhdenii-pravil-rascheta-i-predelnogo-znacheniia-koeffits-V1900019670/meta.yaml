  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 июня 2024 года № 27. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 июня 2024 года № 34486
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 13 сентября 2017 года № 170 «Об установлении нормативных значений и методик расчетов пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов, размера капитала банка и Правил расчета и лимитов открытой валютной позиции» и в постановление Правления Национального Банка Республики Казахстан от 28 ноября 2019 года № 215 «Об утверждении Правил расчета и предельного значения коэффициента долговой нагрузки заемщика организации, осуществляющей микрофинансовую деятельность»
    kaz: «Банктің пруденциялық нормативтерінің және сақталуы міндетті өзге де нормалары мен лимиттерінің нормативтік мәндері мен оларды есептеу әдістемелерін, капиталының мөлшерін және Ашық валюталық позицияны есептеу қағидалары мен оның лимиттерін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 13 қыркүйектегі № 170 қаулысына және «Микроқаржылық қызметті жүзеге асыратын ұйым қарыз алушысының борыштық жүктемесінің коэффициентін есептеу қағидаларын және шекті мәнін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 28 қарашадағы № 215 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 23 декабря 2019 года № 248 «Об утверждении Порядка заключения договора банковского займа, в том числе требований к содержанию, оформлению, обязательным условиям договора банковского займа, форм графика погашения займа и памятки для заемщика – физического лица»
    kaz: «Банктік қарыз шартын жасасу тәртібін, оның ішінде банктік қарыз шартының мазмұнына, ресімделуіне, міндетті талаптарына қойылатын талаптарды, қарызды өтеу графигінің нысандарын және қарыз Алушыға – жеке тұлғаға арналған жадынамаларды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 23 желтоқсандағы № 248 қаулысына өзгерістер мен толықтырулар енгізу туралы

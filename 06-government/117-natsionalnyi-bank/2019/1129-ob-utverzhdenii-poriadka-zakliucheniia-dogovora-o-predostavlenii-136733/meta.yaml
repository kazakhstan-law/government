  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования банковской и микрофинансовой деятельности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне банктік және микроқаржылық қызметті реттеу мәселелері бойынша өзгерістер енгізу туралы

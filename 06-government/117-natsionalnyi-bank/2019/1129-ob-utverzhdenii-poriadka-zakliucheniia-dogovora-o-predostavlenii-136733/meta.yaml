  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам банковской и микрофинансовой деятельности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне банк және микроқаржылық қызмет мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

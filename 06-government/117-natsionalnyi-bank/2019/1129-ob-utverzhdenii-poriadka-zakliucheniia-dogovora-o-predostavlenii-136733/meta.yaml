  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 232 «Об утверждении Порядка заключения договора о предоставлении микрокредита, в том числе требований к содержанию, оформлению, обязательным условиям договора о предоставлении микрокредита, формы графика погашения микрокредита»
    kaz: «Микрокредит беру туралы шартты жасасу тәртібін, оның ішінде микрокредит беру туралы шарттың мазмұнына, ресімделуіне, міндетті шарттарына қойылатын талаптарды, микрокредитті өтеу кестесінің нысанын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 29 қарашадағы № 232 қаулысына өзгерістер мен толықтырулар енгізу туралы

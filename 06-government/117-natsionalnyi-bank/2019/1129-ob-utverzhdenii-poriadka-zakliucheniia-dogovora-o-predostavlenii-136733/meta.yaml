  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 232 «Об утверждении Порядка заключения договора о предоставлении микрокредита, в том числе требований к содержанию, оформлению договора и его первой страницы, содержащей информацию о полной стоимости микрокредита (сумме переплаты по микрокредиту, предмете микрокредита), обязательным условиям договора о предоставлении микрокредита, а также формы графика погашения микрокредита»
    kaz: «Микрокредит беру туралы шартты жасасу тәртібін, оның ішінде шарттың мазмұнына, ресімделуіне және микрокредиттің толық құны (микрокредит бойынша артық төленетін сома, микрокредит мәні) туралы ақпаратты қамтитын оның бірінші бетіне, микрокредит беру туралы шарттың міндетті шарттарына қойылатын талаптарды, сондай-ақ микрокредитті өтеу кестесінің нысанын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 29 қарашадағы № 232 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/193020/rus

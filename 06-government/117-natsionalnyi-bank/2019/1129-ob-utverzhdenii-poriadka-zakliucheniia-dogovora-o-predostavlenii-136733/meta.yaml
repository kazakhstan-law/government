  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 сентября 2024 года № 78. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 октября 2024 года № 35210
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 232 «Об утверждении Порядка заключения договора о предоставлении микрокредита, в том числе требований к содержанию, оформлению договора и его первой страницы, содержащей информацию о полной стоимости микрокредита (сумме переплаты по микрокредиту, предмете микрокредита), обязательным условиям договора о предоставлении микрокредита, а также формы графика погашения микрокредита»
    kaz: «Микрокредит беру туралы шартты жасасу тәртібін, оның ішінде шарттың мазмұнына, ресімделуіне және микрокредиттің толық құны (микрокредит бойынша артық төленетін сома, микрокредит мәні) туралы ақпаратты қамтитын оның бірінші бетіне, микрокредит беру туралы шарттың міндетті шарттарына қойылатын талаптарды, сондай-ақ микрокредитті өтеу кестесінің нысанын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 29 қарашадағы № 232 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201367/rus

title:
  rus: Об утверждении перечня, форм, сроков представления отчетности о выполнении пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов организацией, осуществляющей микрофинансовую деятельность, и Правил ее представления
  kaz: Микроқаржылық қызметті жүзеге асыратын ұйымның пруденциялық нормативтердi және сақталуы мiндеттi өзге де нормаларды және лимиттердi орындауы туралы есептіліктің тізбесін, нысандарын, ұсыну мерзiмдерiн және оны ұсыну қағидаларын бекіту туралы

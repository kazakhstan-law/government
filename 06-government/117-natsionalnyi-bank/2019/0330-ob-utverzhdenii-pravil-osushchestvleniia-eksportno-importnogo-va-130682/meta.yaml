  title:
    rus: О внесении изменений и дополнений в постановления Правления Национального Банка Республики Казахстан от 30 марта 2019 года № 40 «Об утверждении Правил осуществления валютных операций в Республике Казахстан» и от 30 марта 2019 года № 42 «Об утверждении Правил осуществления экспортно-импортного валютного контроля в Республике Казахстан»

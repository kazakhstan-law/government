    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына сақтандыру нарығына және бағалы қағаздар нарығына қатысушылардың есептілікті ұсынуы мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

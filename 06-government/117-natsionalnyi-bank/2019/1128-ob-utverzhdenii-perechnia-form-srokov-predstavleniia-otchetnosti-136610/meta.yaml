  title:
    rus: О внесении изменений и дополнения в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам представления отчетности единым накопительным пенсионным фондом и участниками рынка ценных бумаг
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына бірыңғай жинақтаушы зейнетақы қорының және бағалы қағаздар нарығына қатысушылардың есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

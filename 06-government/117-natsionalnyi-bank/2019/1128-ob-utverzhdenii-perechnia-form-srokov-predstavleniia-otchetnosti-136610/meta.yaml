requisite: Постановление Правления Национального Банка Республики Казахстан от 28 ноября 2019 года № 211. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 декабря 2019 года № 19672. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2025 года № 110 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня, форм, сроков представления отчетности лицензиатами, осуществляющими деятельность на рынке ценных бумаг, единым оператором и Правил ее представления
  kaz: Бағалы қағаздар нарығында қызметті жүзеге асыратын лицензиаттар, бірыңғай оператор есептілігінің тізбесін, нысандарын, ұсыну мерзімдерін және оны ұсыну қағидаларын бекіту туралы

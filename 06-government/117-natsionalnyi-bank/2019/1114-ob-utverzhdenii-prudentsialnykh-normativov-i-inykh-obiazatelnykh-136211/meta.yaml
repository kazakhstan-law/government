  code: '223694'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 50. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38331
  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам микрофинансовой деятельности и признании утратившими силу постановления Правления Национального Банка Республики Казахстан и отдельных структурных элементов некоторых постановлений Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне микроқаржылық қызмет мәселелері бойынша өзгерістер мен толықтыру енгізу және Қазақстан Республикасы Ұлттық Банкінің Басқармасы қаулысының, Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігінің Басқармасы кейбір қаулыларының жекелеген құрылымдық элементтерінің күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/223694/rus

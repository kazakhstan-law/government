title:
  rus: Об утверждении пруденциальных нормативов и иных обязательных к соблюдению организацией, осуществляющей микрофинансовую деятельность, норм и лимитов, методики их расчетов
  kaz: Пруденциялық нормативтердi және микроқаржылық қызметті жүзеге асыратын ұйымның сақтауы мiндеттi өзге де нормалар мен лимиттердi, оларды есептеу әдістемесін бекіту туралы

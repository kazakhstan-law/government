  title:
    rus: О внесении изменений и дополнений в постановления Правления Национального Банка Республики Казахстан от 30 марта 2019 года № 40 «Об утверждении Правил осуществления валютных операций в Республике Казахстан» и от 10 апреля 2019 года № 64 «Об утверждении Правил мониторинга валютных операций в Республике Казахстан»
    kaz: «Қазақстан Республикасында валюталық операцияларды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 30 наурыздағы № 40 және «Қазақстан Республикасында валюталық операцияларды мониторингтеу қағидаларын бекіту туралы» 2019 жылғы 10 сәуірдегі № 64 қаулыларына өзгерістер мен толықтырулар енгізу туралы

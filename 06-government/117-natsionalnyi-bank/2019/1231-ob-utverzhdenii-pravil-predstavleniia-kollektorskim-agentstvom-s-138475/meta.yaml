act_code: '138475'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 декабря 2019 года № 273. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 января 2020 года № 19876
title:
  rus: Об утверждении Правил представления коллекторским агентством сведений о лицах, самостоятельно или совместно с другим (другими) лицом (лицами) прямо или косвенно владеющих и (или) пользующихся, и (или) распоряжающихся десятью или более процентами долей участия в уставном капитале коллекторского агентства, или имеющих контроль
  kaz: Коллекторлық агенттіктің жарғылық капиталындағы қатысу үлестерінің он немесе одан да көп пайызын өзі дербес немесе басқа тұлғамен (тұлғалармен) бірлесіп тікелей немесе жанама иеленетін және (немесе) пайдаланатын және (немесе) оларға билік ететін немесе бақылау жасайтын тұлғалар туралы мәліметтерді коллекторлық агенттіктің ұсыну қағидаларын бекіту туралы

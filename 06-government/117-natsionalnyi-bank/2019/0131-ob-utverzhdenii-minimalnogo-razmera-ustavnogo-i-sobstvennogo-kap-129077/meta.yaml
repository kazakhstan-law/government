act_code: '129077'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 января 2019 года № 11. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 февраля 2019 года № 18295. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 июля 2026 года № 111 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении минимального размера уставного и собственного капиталов стабилизационного банка, Правил создания стабилизационного банка, формирования его уставного и собственного капиталов, а также получения стабилизационным банком лицензии на проведение банковских и иных операций
  kaz: Тұрақтандыру банкінің жарғылық және меншікті капиталдарының ең төмен мөлшерін, Тұрақтандыру банкін құру, оның жарғылық және меншікті капиталдарын қалыптастыру, сондай-ақ тұрақтандыру банкінің банк операциялары мен өзге де операцияларды жүргізуге арналған лицензияны алу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам рынка ценных бумаг и пенсионного обеспечения
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығы және зейнетақымен қамсыздандыру мәселелері бойынша өзгерістер енгізу туралы

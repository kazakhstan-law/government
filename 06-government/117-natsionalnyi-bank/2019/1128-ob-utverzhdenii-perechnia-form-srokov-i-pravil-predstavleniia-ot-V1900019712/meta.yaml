  title:
    rus: Об утверждении Правил представления отчетности о выполнении пруденциальных нормативов Национальным оператором почты, ипотечными организациями и организациями, осуществляющими кредитование субъектов агропромышленного комплекса, сто процентов голосующих акций которых прямо или косвенно принадлежат национальному управляющему холдингу
    kaz: Ұлттық пошта операторының, ипотекалық ұйымдардың және агроөнеркәсіптік кешен субъектілеріне кредит беруді жүзеге асыратын, дауыс беретін акцияларының жүз пайызы тікелей немесе жанама түрде ұлттық басқарушы холдингке тиесілі ұйымдардың пруденциялық нормативтерді орындауы туралы есептілікті ұсыну қағидаларын бекіту туралы

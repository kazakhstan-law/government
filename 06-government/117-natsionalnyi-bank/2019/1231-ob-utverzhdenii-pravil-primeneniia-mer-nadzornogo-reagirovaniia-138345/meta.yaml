  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 31 декабря 2019 года № 266 «Об утверждении Правил применения мер надзорного реагирования к юридическим лицам, осуществляющим деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой, и юридическим лицам, исключительной деятельностью которых является инкассация банкнот, монет и ценностей»
    kaz: «Қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетел валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункттері арқылы жүзеге асыратын заңды тұлғаларға және банкноттарды, монеталарды және құндылықтарды инкассациялау айрықша қызметі болып табылатын заңды тұлғаларға қадағалап ден қою шараларын қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 31 желтоқсандағы № 266 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/181909/rus

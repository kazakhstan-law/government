  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 229 «Об утверждении Правил о минимальных резервных требованиях» и в постановление Правления Национального Банка Республики Казахстан от 31 марта 2026 года № 30 «О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам минимальных резервных требований и представления отчетности организациями, осуществляющими отдельные виды банковских операций»
    kaz: «Ең төмен резервтік талаптар туралы қағидаларды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 29 қарашадағы № 229 қаулысына және «Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына ең төмен резервтік талаптар және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2026 жылғы 31 наурыздағы № 30 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227266/rus

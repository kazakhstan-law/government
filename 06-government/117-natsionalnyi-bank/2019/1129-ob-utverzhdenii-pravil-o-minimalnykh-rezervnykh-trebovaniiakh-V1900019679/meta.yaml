    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам минимальных резервных требований и представления отчетности организациями, осуществляющими отдельные виды банковских операций
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына ең төмен резервтік талаптар және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  requisite: Постановление Правления Национального Банка Республики Казахстан от 29 июня 2023 года № 42. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 июля 2023 года № 33060. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2025 года № 110 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам представления отчетности единым накопительным пенсионным фондом и участниками рынка ценных бумаг
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына бірыңғай жинақтаушы зейнетақы қорының және бағалы қағаздар нарығы қатысушыларының есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

title:
  rus: Об утверждении Правил определения размеров и порядка компенсационных выплат при служебных командировках работников государственных учреждений, содержащихся за счет средств бюджета (сметы расходов) Национального Банка Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық Банкінің бюджет қаражаты (шығыстар сметасы) есебінен ұсталатын мемлекеттік мекемелер қызметкерлерінің қызметтік іссапарлары кезіндегі өтемақы төлемдерінің мөлшерлерін және тәртібін айқындау қағидаларын бекіту туралы

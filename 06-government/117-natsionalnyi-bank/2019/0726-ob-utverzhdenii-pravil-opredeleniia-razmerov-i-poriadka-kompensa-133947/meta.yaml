  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 26 июля 2019 года № 123 «Об утверждении Правил определения размеров и порядка компенсационных выплат при служебных командировках работников государственных учреждений, содержащихся за счет средств бюджета (сметы расходов) Национального Банка Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық Банкінің бюджет қаражаты (шығыстар сметасы) есебінен ұсталатын мемлекеттік мекемелер қызметкерлерінің қызметтік іссапарлары кезіндегі өтемақы төлемдерінің мөлшерлерін және тәртібін айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 26 шілдедегі № 123 қаулысына өзгерістер енгізу туралы

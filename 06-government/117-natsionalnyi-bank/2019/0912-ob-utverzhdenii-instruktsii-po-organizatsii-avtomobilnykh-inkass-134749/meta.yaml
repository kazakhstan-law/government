    kaz: «Қазақстан Республикасында автомобильмен инкассаторлық тасымалдауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 12 қыркүйектегі № 159 қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении Перечня документов, необходимых для получения микрокредита, а также Правил ведения кредитного досье по договору о предоставлении микрокредита
  kaz: Микрокредит алу үшін қажетті құжаттардың тізбесін, сондай-ақ Микрокредит беру туралы шарт бойынша кредиттік дерекнама жүргізу қағидаларын бекіту туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 12 ноября 2019 года № 188. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 ноября 2019 года № 19632. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 апреля 2026 года № 86 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

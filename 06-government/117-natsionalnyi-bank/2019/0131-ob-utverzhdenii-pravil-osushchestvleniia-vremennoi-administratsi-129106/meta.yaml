act_code: '129106'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 января 2019 года № 9. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 февраля 2019 года № 18303. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 июля 2026 года № 111 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления временной администрацией по управлению банком (временным управляющим банком) передачи активов и обязательств неплатежеспособного банка банку-приобретателю, а также временной администрацией (временным администратором) банка до вступления в законную силу решения суда о принудительной ликвидации передачи активов и обязательств банка, лишенного лицензии на проведение всех банковских и иных операций, банку-приобретателю
  kaz: Банкті басқару жөніндегі уақытша әкімшіліктің (банкті уақытша басқарушының) төлемге қабілетсіз банктің активтері мен міндеттемелерін сатып алушы-банкке, сондай-ақ соттың мәжбүрлеп тарату туралы шешімі заңды күшіне енгенге дейін банктің уақытша әкімшілігінің (уақытша басқарушының) барлық банк операциялары мен өзге де операциялар жүргізуге арналған лицензиядан айырылған банктің активтері мен міндеттемелерін сатып алушы-банкке беруді жүзеге асыру қағидаларын бекіту туралы

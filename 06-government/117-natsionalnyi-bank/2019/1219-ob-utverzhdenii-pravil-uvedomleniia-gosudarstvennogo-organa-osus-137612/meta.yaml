act_code: '137612'
requisite: Постановление Правления Национального Банка Республики Казахстан от 19 декабря 2019 года № 237. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 декабря 2019 года № 19777. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 февраля 2021 года № 35 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил уведомления государственного органа, осуществляющего государственное регулирование, контроль и надзор финансового рынка и финансовых организаций, об утверждении услуг по предоставлению микрокредитов организацией, осуществляющей микрофинансовую деятельность, а также перечня документов, прилагаемых к уведомлению
  kaz: Микроқаржылық қызметті жүзеге асыратын ұйымның микрокредиттер беру жөніндегі көрсетілетін қызметтерді бекіткені туралы қаржы нарығы мен қаржы ұйымдарын мемлекеттік реттеуді, бақылауды және қадағалауды жүзеге асыратын мемлекеттік органды хабардар ету қағидаларын, сондай-ақ хабарламаға қоса берілетін құжаттардың тізбесін бекіту туралы

  title:
    rus: О внесении изменений в постановления Правления Национального Банка Республики Казахстан от 29 ноября 2018 года № 294 «Об утверждении Правил мониторинга источников спроса и предложения на внутреннем валютном рынке Республики Казахстан» и от 10 апреля 2019 года № 64 «Об утверждении Правил мониторинга валютных операций в Республике Казахстан»
    kaz: «Қазақстан Республикасының ішкі валюта нарығында сұраныс пен ұсыныс көздерін мониторингтеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 29 қарашадағы № 294 және «Қазақстан Республикасында валюталық операцияларды мониторингтеу қағидаларын бекіту туралы» 2019 жылғы 10 сәуірдегі № 64 қаулыларына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49 «Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан»
    kaz: «Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 4 сәуірдегі № 49 қаулысына өзгерістер енгізу туралы

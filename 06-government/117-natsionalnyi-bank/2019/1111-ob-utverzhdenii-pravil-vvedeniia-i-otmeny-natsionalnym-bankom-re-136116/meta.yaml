act_code: '136116'
requisite: Постановление Правления Национального Банка Республики Казахстан от 11 ноября 2019 года № 178. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 ноября 2019 года № 19608
title:
  rus: Об утверждении Правил введения и отмены Национальным Банком Республики Казахстан особого режима регулирования, осуществления деятельности, связанной с цифровыми активами и (или) платежными услугами, в рамках особого режима регулирования, критериев отбора Национальным Банком Республики Казахстан и Правил рассмотрения документов для заключения договора об осуществлении деятельности в рамках особого режима регулирования
  kaz: Қазақстан Республикасы Ұлттық Банкінің ерекше реттеу режимін енгізуі және оның күшін жоюы, ерекше реттеу режимі шеңберінде цифрлық активтермен және (немесе) көрсетілетін төлем қызметтерімен байланысты қызметті жүзеге асыру қағидаларын, Ерекше реттеу режимі шеңберінде қызметті жүзеге асыру туралы шарт жасасу үшін Қазақстан Республикасы Ұлттық Банкінің құжаттарды іріктеуі өлшемшарттарын және оларды қарау қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 28 ноября 2019 года № 224 «Об утверждении перечня, форм, сроков представления отчетности о выполнении пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов организацией, осуществляющей микрофинансовую деятельность, и Правил ее представления»
    kaz: «Микроқаржылық қызметті жүзеге асыратын ұйымның пруденциялық нормативтерді және сақталуы міндетті өзге де нормаларды және лимиттерді орындауы туралы есептіліктің тізбесін, нысандарын, ұсыну мерзімдерін және оны ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 28 қарашадағы № 224 қаулысына өзгерістер мен толықтыру енгізу туралы

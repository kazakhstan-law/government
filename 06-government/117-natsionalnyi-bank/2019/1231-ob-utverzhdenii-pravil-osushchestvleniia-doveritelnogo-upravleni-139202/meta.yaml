act_code: '139202'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 декабря 2019 года № 261. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 января 2020 года № 19945
title:
  rus: Об утверждении Правил осуществления доверительного управления акциями банка, страховой (перестраховочной) организации, управляющего инвестиционным портфелем, принадлежащими крупному участнику банка, страховой (перестраховочной) организации, управляющего инвестиционным портфелем, банковскому холдингу, страховому холдингу либо лицу, обладающему признаками крупного участника банка, страховой (перестраховочной) организации, управляющего инвестиционным портфелем, банковского холдинга, страхового холдинга, а также действий уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций либо национального управляющего холдинга в период доверительного управления
  kaz: Банктің, сақтандыру (қайта сақтандыру) ұйымының, инвестициялық портфельді басқарушының ірі қатысушысына, банк холдингіне, сақтандыру холдингіне не банктің, сақтандыру (қайта сақтандыру) ұйымының, инвестициялық портфельді басқарушының ірі қатысушысы, банк холдингі, сақтандыру холдингі белгілері бар тұлғаға тиесілі банктің, сақтандыру (қайта сақтандыру) ұйымының, инвестициялық портфельді басқарушының акцияларын сенімгерлік басқаруды, сондай-ақ сенімгерлік басқару кезеңінде қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органның не ұлттық басқарушы холдингтің әрекеттерді жүзеге асыру қағидаларын бекіту туралы

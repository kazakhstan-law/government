act_code: '136604'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 ноября 2019 года № 215. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 декабря 2019 года № 19670. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 50 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил расчета и предельного значения коэффициента долговой нагрузки заемщика организации, осуществляющей микрофинансовую деятельность

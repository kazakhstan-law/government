title:
  rus: Об установлении случая наличия возможности одного лица самостоятельно либо совместно с одним или несколькими лицами определять решения юридического лица или организации, не являющейся юридическим лицом, иным образом
  kaz: Бір тұлғаның дербес не бір немесе бірнеше тұлғамен бірлесіп заңды тұлғаның немесе заңды тұлға болып табылмайтын ұйымның шешімдерін басқаша айқындау мүмкіндігінің болу жағдайын белгілеу туралы

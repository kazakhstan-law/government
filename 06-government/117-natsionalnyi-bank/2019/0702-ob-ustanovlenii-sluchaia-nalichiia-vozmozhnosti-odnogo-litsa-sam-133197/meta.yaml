  code: '223758'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 апреля 2026 года № 56. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 апреля 2026 года № 38360
  title:
    rus: Об утверждении Правил установления признаков контроля, признаков крупного участника банка, банковского холдинга, значительного участия в капитале организации и внесении изменений в постановление Правления Национального Банка Республики Казахстан от 2 июля 2019 года № 113 «Об установлении случая наличия возможности одного лица самостоятельно либо совместно с одним или несколькими лицами определять решения юридического лица иным образом»
    kaz: Бақылау белгілерін, банктің ірі қатысушысының, банк холдингінің, ұйымның капиталына қомақты қатысу белгілерін анықтау қағидаларын бекіту және «Бір тұлғаның дербес не бір немесе бірнеше тұлғамен бірлесіп заңды тұлғаның шешімдерін басқаша айқындау мүмкіндігінің болу жағдайын белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 2 шілдедегі № 113 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/223758/rus

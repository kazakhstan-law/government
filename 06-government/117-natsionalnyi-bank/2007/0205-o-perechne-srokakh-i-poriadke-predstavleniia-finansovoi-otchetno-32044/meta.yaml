    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қаржылық есептіліктің тізбесі, ұсыну мерзімдері және тәртібі, сондай-ақ екінші деңгейдегі банктердің және "Қазақстан Даму Банкі" акционерлік қоғамының қаржылық есептілігін жариялау мерзімдері туралы" 2007 жылғы 5 ақпандағы N 11 қаулысына толықтырулар енгізу туралы

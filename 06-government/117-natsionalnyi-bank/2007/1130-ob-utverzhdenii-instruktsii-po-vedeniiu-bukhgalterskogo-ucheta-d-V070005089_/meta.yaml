  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета и признании утратившими силу структурных элементов некоторых постановлений Правления Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына бухгалтерлік есеп жүргізу мәселелері бойынша өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларының құрылымдық элементтерінің күші жойылды деп тану туралы

title:
  rus: Об утверждении Требований по организации охраны и устройству помещений банков второго уровня и организаций, осуществляющих отдельные виды банковских операций
  kaz: Екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың үй-жайларын күзету мен жайластыруды ұйымдастыру жөніндегі талаптарды бекіту туралы

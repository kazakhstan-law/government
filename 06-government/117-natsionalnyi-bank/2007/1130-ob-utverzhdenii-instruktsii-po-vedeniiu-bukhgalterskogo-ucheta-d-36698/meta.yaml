  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 30 ноября 2007 года № 134 "Об утверждении Инструкции по ведению бухгалтерского учета доверительных операций и кастодиальной деятельности банками второго уровня"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің сенімгерлік операцияларды және кастодиандық қызметті бухгалтерлік есепке алуды жүргізуі жөніндегі нұсқаулықты бекіту туралы" 2007 жылғы 30 қарашадағы № 134 қаулысына өзгерістер енгізу туралы

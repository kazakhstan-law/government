title:
  rus: Об утверждении Инструкции по ведению бухгалтерского учета доверительных операций и кастодиальной деятельности банками второго уровня и филиалами банков-нерезидентов Республики Казахстан
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасы бейрезидент-банктері филиалдарының, «Қазақстанның Даму Банкі» акционерлік қоғамының және ипотекалық ұйымдардың бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы

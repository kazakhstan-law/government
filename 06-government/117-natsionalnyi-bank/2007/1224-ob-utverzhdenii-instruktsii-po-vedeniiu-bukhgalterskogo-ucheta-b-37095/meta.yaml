title:
  rus: Об утверждении Инструкции по ведению бухгалтерского учета банками второго уровня и акционерным обществом "Банк Развития Казахстана"
  kaz: Екінші деңгейдегі банктердің және "Қазақстан Даму Банкі" акционерлік қоғамының бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы

title:
  rus: Об утверждении Инструкции по ведению бухгалтерского учета операций с пенсионными активами, целевыми активами и целевыми накоплениями, осуществляемыми единым накопительным пенсионным фондом и добровольными накопительными пенсионными фондами
  kaz: Бірыңғай жинақтаушы зейнетақы қоры және ерікті жинақтаушы зейнетақы қорлары жүзеге асыратын зейнетақы активтерімен, нысаналы активтермен және нысаналы жинақтармен операциялардың бухгалтерлік есебін жүргізу жөніндегі нұсқаулықты бекіту туралы

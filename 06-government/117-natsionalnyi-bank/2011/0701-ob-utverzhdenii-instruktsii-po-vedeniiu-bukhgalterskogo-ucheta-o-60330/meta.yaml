  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам ведения бухгалтерского учета
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бухгалтерлік есепті жүргізу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

title:
  rus: Об утверждении Типового плана счетов бухгалтерского учета в банках второго уровня, ипотечных организациях, акционерном обществе «Банк Развития Казахстана» и филиалах банков - нерезидентов Республики Казахстан
  kaz: Екінші деңгейдегі банктердегі, ипотекалық ұйымдардағы, «Қазақстанның Даму Банкі» акционерлік қоғамындағы және Қазақстан Республикасының бейрезидент - банктердің филиалдарындағы бухгалтерлік есептің үлгі шот жоспарын бекіту туралы

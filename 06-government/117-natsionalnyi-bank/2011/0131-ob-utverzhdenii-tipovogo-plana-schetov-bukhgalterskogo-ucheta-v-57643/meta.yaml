  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета исламскими финансовыми организациями
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына исламдық қаржы ұйымдарының бухгалтерлік есеп жүргізуі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета и представления финансовой отчетности
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына бухгалтерлік есеп жүргізу және қаржылық есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

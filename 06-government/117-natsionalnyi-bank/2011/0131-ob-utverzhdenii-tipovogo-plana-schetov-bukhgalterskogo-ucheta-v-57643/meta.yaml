  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам ведения бухгалтерского учета и финансовой отчетности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бухгалтерлік есепті жүргізу және қаржылық есептілік мәселелері бойынша өзгерістер енгізу туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета банками второго уровня и акционерным обществом "Банк Развития Казахстана"
    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне екінші деңгейдегі банктердің және "Қазақстанның Даму Банкі" акционерлік қоғамының бухгалтерлік есепті жүргізуі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 31 января 2011 года № 3 «Об утверждении Типового плана счетов бухгалтерского учета в банках второго уровня, ипотечных организациях и акционерном обществе «Банк Развития Казахстана
    kaz: Екінші деңгейдегі банктердегі, ипотекалық ұйымдардағы және «Қазақстан Даму Банкі» акционерлік қоғамындағы бухгалтерлік есептің үлгі шот жоспарын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2011 жылғы 31 қаңтардағы № 3 қаулысына өзгерістер мен толықтырулар енгізу туралы

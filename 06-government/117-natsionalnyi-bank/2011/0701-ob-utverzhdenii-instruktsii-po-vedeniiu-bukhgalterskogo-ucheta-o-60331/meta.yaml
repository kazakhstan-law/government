title:
  rus: Об утверждении Инструкции по ведению бухгалтерского учета отдельными субъектами финансового рынка
  kaz: Қаржы нарығының жекелеген субъектілерінің бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы

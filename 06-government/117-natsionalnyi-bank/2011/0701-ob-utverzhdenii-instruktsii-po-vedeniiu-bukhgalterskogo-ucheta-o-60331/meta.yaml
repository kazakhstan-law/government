  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 1 июля 2011 года № 68 «Об утверждении Инструкции по ведению бухгалтерского учета отдельными субъектами финансового рынка» и признании утратившими силу некоторых постановлений Правления Национального Банка Республики Казахстан, а также структурных элементов некоторых постановлений Правления Национального Банка Республики Казахстан
    kaz: «Қаржы нарығының жекелеген субъектілерінің бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2011 жылғы 1 шілдедегі № 68 қаулысына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларының, сондай-ақ Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларының құрылымдық элементтерінің күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/208820/rus

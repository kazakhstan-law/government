  title:
    rus: Об утверждении Типового плана счетов бухгалтерского учета для страховых (перестраховочных) организаций, обществ взаимного страхования и филиалов страховых (перестраховочных) организаций - нерезидентов Республики Казахстан и внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам ведения бухгалтерского учета
    kaz: Сақтандыру (қайта сақтандыру) ұйымдарына, өзара сақтандыру қоғамдарына және Қазақстан Республикасының бейрезидент - сақтандыру (қайта сақтандыру) ұйымдарының филиалдарына арналған бухгалтерлік есептің үлгі шот жоспарын бекіту және Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бухгалтерлік есепті жүргізу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

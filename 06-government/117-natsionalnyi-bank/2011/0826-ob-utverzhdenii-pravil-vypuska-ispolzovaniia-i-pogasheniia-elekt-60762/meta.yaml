  kaz: Қазақстан Республикасының аумағында электрондық ақшаны шығару, пайдалану және өтеу ережесін, сондай-ақ электрондық ақша эмитенттеріне және электрондық ақша жүйелеріне қойылатын талаптарды бекіту туралы

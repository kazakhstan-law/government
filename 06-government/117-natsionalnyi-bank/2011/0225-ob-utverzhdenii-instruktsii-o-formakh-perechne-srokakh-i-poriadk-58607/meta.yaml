  title:
    rus: О внесении изменений и дополнений и признании утратившими силу некоторых нормативных правовых актов Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу және күші жойылды деп тану туралы

act_code: '58607'
requisite: Постановление Правления Национального Банка Республики Казахстан от 25 февраля 2011 года № 11. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 апреля 2011 года № 6890. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 мая 2013 года № 130
title:
  rus: Об утверждении Инструкции о формах, перечне, сроках и порядке представления финансовой отчетности финансовыми организациями, специальными финансовыми компаниями, исламскими специальными финансовыми компаниями, акционерным обществом "Банк Развития Казахстана", инвестиционными фондами и микрофинансовыми организациями
  kaz: Қаржы ұйымдарының, арнайы қаржы компанияларының, исламдық арнайы қаржы компанияларының, "Қазақстан Даму Банкі" акционерлік қоғамының, инвестициялық қорлардың және микроқаржы ұйымдарының қаржылық есептілігінің нысандары, тізбесі, ұсыну мерзімдері мен тәртібі туралы нұсқаулықты бекіту туралы

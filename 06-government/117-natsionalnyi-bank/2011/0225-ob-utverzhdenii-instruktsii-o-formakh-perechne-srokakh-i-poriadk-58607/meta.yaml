    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының "Қаржы ұйымдарының және "Қазақстан Даму Банкі" акционерлік қоғамының қаржылық есептілігінің тізбесі, нысандары және ұсыну мерзімдері туралы нұсқаулықты бекіту туралы" 2011 жылғы 25 ақпандағы № 11 қаулысына өзгерістер енгізу туралы

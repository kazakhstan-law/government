  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 268 «Об утверждении Правил обмена электронными информационными ресурсами между страхователем (застрахованным, выгодоприобретателем) и страховщиком, Правил уведомления о заключении договора страхования и требований к содержанию уведомления, Требований к программно-техническим средствам и интернет-ресурсам страховой (перестраховочной) организации, обеспечивающим заключение договоров страхования, обмен электронными информационными ресурсами между страхователем и страховщиком»
    kaz: «Сақтанушы (сақтандырылушы, пайда алушы) мен сақтандырушы арасында электрондық ақпараттық ресурстармен алмасу қағидаларын, Сақтандыру шартын жасасу туралы хабардар ету қағидаларын және хабарламаның мазмұнына қойылатын талаптарды, Сақтандыру (қайта сақтандыру) ұйымының сақтандыру шарттарын жасасуды, сақтанушы мен сақтандырушы арасында электрондық ақпараттық ресурстармен алмасуды қамтамасыз ететін бағдарламалық-техникалық құралдары мен интернет ресурстарына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 29 қазандағы № 268 қаулысына өзгеріс енгізу туралы»

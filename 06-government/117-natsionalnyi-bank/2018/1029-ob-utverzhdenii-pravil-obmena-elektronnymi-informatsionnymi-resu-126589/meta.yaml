act_code: '126589'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 268. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 ноября 2018 года № 17824. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 апреля 2020 года № 50 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил обмена электронными информационными ресурсами между страхователем (застрахованным, выгодоприобретателем) и страховщиком, Правил уведомления о заключении договора страхования и требований к содержанию уведомления, Требований к программно-техническим средствам и интернет-ресурсам страховой (перестраховочной) организации, обеспечивающим заключение договоров страхования, обмен электронными информационными ресурсами между страхователем и страховщиком
  kaz: Сақтанушы (сақтандырылушы, пайда алушы) мен сақтандырушы арасында электрондық ақпараттық ресурстармен алмасу қағидаларын, Сақтандыру шартын жасасу туралы хабардар ету қағидаларын және хабарламаның мазмұнына қойылатын талаптарды, Сақтандыру (қайта сақтандыру) ұйымының сақтандыру шарттарын жасасуды, сақтанушы мен сақтандырушы арасында электрондық ақпараттық ресурстармен алмасуды қамтамасыз ететін бағдарламалық-техникалық құралдары мен интернет-ресурстарына қойылатын талаптарды бекіту туралы

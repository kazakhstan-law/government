  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам информационной безопасности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне  ақпараттық қауіпсіздік мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

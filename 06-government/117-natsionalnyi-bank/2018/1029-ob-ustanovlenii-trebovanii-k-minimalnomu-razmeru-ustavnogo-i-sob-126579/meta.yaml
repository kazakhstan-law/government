  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 270 «Об установлении требований к минимальному размеру уставного и собственного капитала страхового брокера, порядка формирования активов филиала страхового брокера-нерезидента Республики Казахстан, принимаемых в качестве резерва, и их минимального размера и утверждении Правил осуществления деятельности страхового брокера»
    kaz: «Сақтандыру брокерінің жарғылық және меншікті капиталының ең төменгі мөлшеріне қойылатын талаптарды, Қазақстан Республикасының бейрезидент-сақтандыру брокері филиалының резерв ретінде қабылданатын активтерін қалыптастыру тәртібі мен олардың ең төменгі мөлшерін белгілеу және Сақтандыру брокерінің қызметін жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 29 қазандағы № 270 қаулысына өзгерістер енгізу туралы

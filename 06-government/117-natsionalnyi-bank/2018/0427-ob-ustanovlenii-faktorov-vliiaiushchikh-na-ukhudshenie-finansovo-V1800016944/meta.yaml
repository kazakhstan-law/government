  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 75 «Об установлении факторов, влияющих на ухудшение финансового положения страховой (перестраховочной) организации, страховой группы и филиала страховой (перестраховочной) организации – нерезидента Республики Казахстан, а также утверждении Правил одобрения плана мероприятий, предусматривающего меры раннего реагирования, и Методики определения факторов, влияющих на ухудшение финансового положения страховой (перестраховочной) организации (страховой группы) и филиала страховой (перестраховочной) организации – нерезидента Республики Казахстан»

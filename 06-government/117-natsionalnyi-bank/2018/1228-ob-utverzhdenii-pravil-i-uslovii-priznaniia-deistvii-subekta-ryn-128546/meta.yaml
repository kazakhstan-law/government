  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 октября 2022 года № 83. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 ноября 2022 года № 30468
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 28 декабря 2018 года № 319 «Об утверждении Правил признания сделок с ценными бумагами и иными финансовыми инструментами, заключенных на организованном и неорганизованном рынках ценных бумаг, как совершенных в целях манипулирования, создания и работы экспертного комитета, а также его количественного состава»
    kaz: «Ұйымдастырылған және ұйымдастырылмаған бағалы қағаздар нарығында жасалған бағалы қағаздармен және өзге де қаржы құралдарымен мәмілелерді айла-шарғы жасау мақсатында жасалды деп тану, сараптама комитетін жасақтау және оның жұмыс жасау қағидаларын, сондай-ақ оның сандық құрамын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 28 желтоқсандағы № 319 қаулысына өзгерістер мен толықтыру енгізу туралы

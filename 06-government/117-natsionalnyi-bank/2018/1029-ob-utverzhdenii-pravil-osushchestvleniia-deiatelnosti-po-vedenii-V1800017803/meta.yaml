  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам развития финансового рынка и рынка цифровых финансовых активов
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығын және цифрлық қаржы активтері нарығын дамыту мәселелері жөнінде өзгерістер мен толықтырулар енгізу туралы

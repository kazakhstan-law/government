act_code: '126600'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 259. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 ноября 2018 года № 17825
title:
  rus: Об утверждении Правил размещения информации на интернет-ресурсе страховой организации, страхового брокера, филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, филиала страхового брокера-нерезидента Республики Казахстан, организации, гарантирующей осуществление страховых выплат страхователям (застрахованным, выгодоприобретателям) в случае ликвидации страховых организаций, принудительного прекращения деятельности филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, страхового омбудсмана, организации по формированию и ведению базы данных
  kaz: Сақтандыру ұйымдары таратылған, Қазақстан Республикасының бейрезиденттер-сақтандыру (қайта сақтандыру) ұйымдарының филиалдары, сақтандыру омбудсманы, дерекқор қалыптастыру және жүргізу жөніндегі ұйым қызметі мәжбүрлеп тоқтатылған жағдайда, сақтандыру ұйымының, сақтандыру брокерінің, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының, Қазақстан Республикасының бейрезидент-сақтандыру брокері филиалының, сақтанушыларға (сақтандырылушыларға, пайда алушыларға) сақтандыру төлемдерін жүзеге асыруға кепілдік беретін ұйымның интернет-ресурсында ақпаратты орналастыру қағидаларын бекіту туралы

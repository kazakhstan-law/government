act_code: '124860'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 199. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 сентября 2018 года № 17396
title:
  rus: Об утверждении Правил инвестирования активов и Перечня финансовых инструментов, разрешенных к приобретению за счет собственных активов акционерного общества «Фонд гарантирования страховых выплат», средств резервов гарантирования страховых выплат и средств резерва возмещения вреда, и Правил взимания комиссионного вознаграждения акционерным обществом «Фонд гарантирования страховых выплат
  kaz: Активтерді инвестициялау қағидаларын және «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының меншікті активтері, сақтандыру төлемдеріне кепілдік беру резервтерінің қаражаты және зиянды өтеу резервінің қаражаты есебінен сатып алуға рұқсат етілген қаржы құралдарының тізбесін және «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының комиссиялық сыйақыны алу қағидаларын бекіту туралы

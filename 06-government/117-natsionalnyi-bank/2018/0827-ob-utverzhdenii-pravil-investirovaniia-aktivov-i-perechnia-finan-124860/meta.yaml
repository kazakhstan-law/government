  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам Фонда гарантирования страховых выплат
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне Сақтандыру төлемдеріне кепілдік беру қорының мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

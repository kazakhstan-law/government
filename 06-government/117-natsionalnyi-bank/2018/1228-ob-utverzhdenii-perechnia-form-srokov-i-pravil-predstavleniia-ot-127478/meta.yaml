  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 28 декабря 2018 года № 313 «Об утверждении перечня, форм, сроков и Правил представления отчетности по займам и условным обязательствам банками второго уровня, филиалами банков-нерезидентов Республики Казахстан, акционерным обществом «Банк Развития Казахстана» и организациями, осуществляющими отдельные виды банковских операций»
    kaz: «Екінші деңгейдегі банктердің, Қазақстан Республикасы бейрезидент-банктері филиалдарының, «Қазақстанның Даму Банкі» акционерлік қоғамының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қарыздар мен шартты міндеттемелер жөніндегі есептілігінің тізбесін, нысандарын, табыс ету мерзімдерін және оларды ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 28 желтоқсандағы № 313 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/173296/rus

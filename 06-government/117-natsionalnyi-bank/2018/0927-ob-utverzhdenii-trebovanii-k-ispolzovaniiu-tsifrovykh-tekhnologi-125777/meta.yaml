  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 августа 2024 года № 59. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 августа 2024 года № 34948
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 27 сентября 2018 года № 228 «Об утверждении Требований к использованию информационно-коммуникационных технологий и обеспечению информационной безопасности при организации деятельности кредитных бюро, поставщиков информации и получателей кредитных отчетов, являющихся банками, организациями, осуществляющими отдельные виды банковских операций, микрофинансовыми организациями и коллекторскими агентствами, а также Требований, предъявляемых кредитными бюро к поставщикам информации и получателям кредитных отчетов в соответствии с подпунктом 11) пункта 2 и подпунктом 9) пункта 3 статьи 27 Закона Республики Казахстан от 6 июля 2004 года «О кредитных бюро и формировании кредитных историй в Республике Казахстан»
    kaz: «Кредиттік бюролардың, банктер, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар, микроқаржы ұйымдары және коллекторлық агенттіктер болып табылатын ақпарат берушілердің және кредиттік есептерді алушылардың қызметін ұйымдастыру кезінде ақпараттық-коммуникациялық технологияларды пайдалануға және ақпараттық қауіпсіздікті қамтамасыз етуге қойылатын талаптарды, сондай-ақ «Қазақстан Республикасындағы кредиттік бюролар және кредиттік тарихты қалыптастыру туралы» 2004 жылғы 6 шілдедегі Қазақстан Республикасы Заңының 27-бабы 2-тармағының 11) тармақшасына және 3-тармағының 9) тармақшасына сәйкес кредиттік бюролардың ақпаратты берушілерге және кредиттік есептерді алушыларға қойылатын талаптардын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 27 қыркүйектегі № 228 қаулысына өзгерістер мен толықтырулар енгізу туралы

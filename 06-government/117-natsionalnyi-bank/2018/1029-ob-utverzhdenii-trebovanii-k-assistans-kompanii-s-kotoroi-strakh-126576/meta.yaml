act_code: '126576'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 260. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 ноября 2018 года № 17837
title:
  rus: Об утверждении Требований к ассистанс компании, с которой страховщик заключает договор о предоставлении застрахованному ассистанса, а также Правил взаимодействия страховщика с ассистанс компанией и оплаты стоимости оказанных медицинским и иным учреждением услуг застрахованному по согласованию с ассистанс компанией, Территории страхования по обязательным программам страхования туриста
  kaz: Сақтандырушы сақтандырылушыға ассистанс беру туралы шарт жасасатын ассистанс компанияға қойылатын талаптарды, сондай-ақ Сақтандырушының ассистанс компаниямен өзара іс-қимыл жасау және ассистанс компаниямен келісу бойынша сақтандырылушыға медициналық және өзге де мекеме көрсеткен қызметтер құнын төлеу қағидаларын, Туристі сақтандырудың міндетті бағдарламалары бойынша сақтандыру аумағын бекіту туралы

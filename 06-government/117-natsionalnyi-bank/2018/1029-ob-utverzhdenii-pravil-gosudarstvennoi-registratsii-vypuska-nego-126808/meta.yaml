  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 248 «Об утверждении Правил государственной регистрации выпуска негосударственных облигаций (облигационной программы), регистрации изменений и (или) дополнений в проспект выпуска негосударственных облигаций (проспект облигационной программы), представления и рассмотрения уведомления об итогах погашения негосударственных облигаций, аннулирования выпуска негосударственных облигаций, Требований к документам для государственной регистрации выпуска негосударственных облигаций (облигационной программы), регистрации изменений и (или) дополнений в проспект выпуска негосударственных облигаций (проспект облигационной программы), рассмотрения уведомления об итогах погашения негосударственных облигаций, Перечня документов для аннулирования выпуска негосударственных облигаций и требований к ним, Правил составления и оформления проспекта выпуска негосударственных облигаций (проспекта облигационной программы), изменений и (или) дополнений в проспект выпуска негосударственных облигаций (проспект облигационной программы), уведомления об итогах погашения негосударственных облигаций»
    kaz: «Мемлекеттік емес облигациялар шығарылымын (облигациялық бағдарламаны) мемлекеттік тіркеу, мемлекеттік емес облигациялар шығарылымы проспектісіне (облигациялық бағдарлама проспектісіне) өзгерістерді және (немесе) толықтыруларды тіркеу, мемлекеттік емес облигацияларды өтеу қорытындылары туралы хабарламаны ұсыну және қарау, мемлекеттік емес облигациялар шығарылымының күшін жою қағидаларын, Мемлекеттік емес облигациялар шығарылымын (облигациялық бағдарламаны) мемлекеттiк тiркеу, мемлекеттік емес облигациялар шығарылымы проспектісіне (облигациялық бағдарлама проспектісіне) өзгерістерді және (немесе) толықтыруларды тіркеу, мемлекеттік емес облигацияларды өтеу қорытындылары туралы хабарламаны қарау үшін құжаттарға қойылатын талаптарды, Мемлекеттік емес облигациялар шығарылымының күшін жоюға арналған құжаттардың тізбесін және оларға қойылатын талаптарды, Мемлекеттік емес облигациялар шығарылымының проспектісін (облигациялық бағдарлама проспектісін), мемлекеттік емес облигациялар шығарылымының проспектісіне (облигациялық бағдарлама проспектісіне) өзгерістерді және (немесе) толықтыруларды, мемлекеттік емес облигацияларды өтеу қорытындылары туралы хабарламаны жасау және ресімдеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 29 қазандағы № 248 қаулысына өзгеріс енгізу туралы

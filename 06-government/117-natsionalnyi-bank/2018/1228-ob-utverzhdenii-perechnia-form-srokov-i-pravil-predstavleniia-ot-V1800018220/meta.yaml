requisite: Постановление Правления Национального Банка Республики Казахстан от 28 декабря 2018 года № 313. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 января 2019 года № 18220. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2025 года № 103 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня, форм, сроков и Правил представления отчетности по займам и условным обязательствам банками второго уровня, филиалами банков-нерезидентов Республики Казахстан, акционерным обществом «Банк Развития Казахстана» и организациями, осуществляющими отдельные виды банковских операций
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасы бейрезидент-банктері филиалдарының, «Қазақстанның Даму Банкі» акционерлік қоғамының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қарыздар мен шартты міндеттемелер жөніндегі есептілігінің тізбесін, нысандарын, табыс ету мерзімдерін және оларды ұсыну қағидаларын бекіту туралы

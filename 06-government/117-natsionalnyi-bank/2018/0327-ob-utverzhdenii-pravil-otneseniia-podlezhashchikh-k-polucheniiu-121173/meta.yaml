act_code: '121173'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 марта 2018 года № 60. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 апреля 2018 года № 16803
title:
  rus: Об утверждении Правил отнесения подлежащих к получению дочерней организацией банка, приобретающей сомнительные и безнадежные активы родительского банка, доходов к доходам от осуществления видов деятельности, предусмотренных законодательством Республики Казахстан о банках и банковской деятельности
  kaz: Бас банктің күмәнді және үмітсіз активтерін сатып алатын банктің еншілес ұйымының алынуға жататын кірістерін Қазақстан Республикасының банктер және банк қызметі туралы заңнамасында көзделген қызмет түрлерін жүзеге асырудан түсетін кірістерге жатқызу қағидаларын бекіту туралы

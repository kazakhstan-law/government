act_code: '126804'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 262. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 декабря 2018 года № 17885
title:
  rus: Об утверждении Правил передачи страхового портфеля страховой (перестраховочной) организации, а также особенностей передачи страхового портфеля в случае лишения лицензии страховой (перестраховочной) организации и Правил передачи страхового портфеля филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, а также особенностей передачи страхового портфеля в случае лишения лицензии филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан
  kaz: Сақтандыру (қайта сақтандыру) ұйымының сақтандыру портфелін беру қағидаларын, сондай-ақ сақтандыру (қайта сақтандыру) ұйымын лицензиядан айыру кезінде сақтандыру портфелін берудің ерекшеліктерін және Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының сақтандыру портфелін беру қағидаларын, сондай-ақ Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымының филиалын лицензиядан айыру кезінде сақтандыру портфелін берудің ерекшеліктерін бекіту туралы

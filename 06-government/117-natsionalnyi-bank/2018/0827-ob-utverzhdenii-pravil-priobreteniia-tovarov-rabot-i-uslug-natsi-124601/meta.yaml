  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 192 «Об утверждении Правил приобретения товаров, работ и услуг Национальным Банком Республики Казахстан, его ведомствами, организациями, входящими в его структуру, и юридическими лицами, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых принадлежат Национальному Банку Республики Казахстан или находятся в его доверительном управлении, и аффилированными с ними юридическими лицами»
    kaz: «Қазақстан Республикасы Ұлттық Банкінің, оның ведомстволарының, оның құрылымына кіретін ұйымдардың және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан да көп пайызы Қазақстан Республикасының Ұлттық Банкіне тиесілі немесе оның сенімгерлік басқаруындағы заңды тұлғалардың және олармен үлестес заңды тұлғалардың тауарларды, жұмыстарды және көрсетілетін қызметтерді иеленуі қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 27 тамыздағы № 192 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/198754/rus

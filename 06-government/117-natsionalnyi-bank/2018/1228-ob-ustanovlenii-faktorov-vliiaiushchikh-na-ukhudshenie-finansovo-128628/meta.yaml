act_code: '128628'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 декабря 2018 года № 317. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 января 2019 года № 18186
title:
  rus: Об установлении факторов, влияющих на ухудшение финансового положения банка и банковского конгломерата, филиала банка-нерезидента Республики Казахстан, а также утверждении Правил одобрения плана мероприятий, предусматривающего меры раннего реагирования, и Методики определения факторов, влияющих на ухудшение финансового положения банка (банковского конгломерата), филиала банка-нерезидента Республики Казахстан
  kaz: Банктің және банк конгломератының, Қазақстан Республикасының бейрезидент-банкі филиалының қаржылық жай-күйінің нашарлауына әсер ететін факторларды белгілеу, сондай-ақ Ертерек ден қою шараларын көздейтін іс-шаралар жоспарын мақұлдау қағидаларын және банктің (банк конгломератының), Қазақстан Республикасының бейрезидент-банкі филиалының қаржылық жай-күйінің нашарлауына әсер ететін факторларды анықтау әдістемесін бекіту туралы

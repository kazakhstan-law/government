  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 октября 2020 года № 106. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 октября 2020 года № 21554
  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан и приостановлении действия отдельных норм некоторых нормативных правовых актов Республики Казахстан по вопросам регулирования финансового рынка
    kaz: Қазақстан Республикасының қаржы нарығын реттеу мәселелері бойынша кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтыру енгізу және Қазақстан Республикасының кейбір нормативтік құқықтық актілерінің жекелеген нормаларының қолданылуын тоқтата тұру туралы

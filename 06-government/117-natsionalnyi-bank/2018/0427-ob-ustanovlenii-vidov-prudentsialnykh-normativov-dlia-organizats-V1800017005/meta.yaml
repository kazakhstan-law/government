requisite: Постановление Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 80. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 июня 2018 года № 17005
title:
  rus: Об установлении видов пруденциальных нормативов для организаций, осуществляющих брокерскую и (или) дилерскую деятельность на рынке ценных бумаг, утверждении правил и методики расчета значений пруденциальных нормативов, обязательных к соблюдению организациями, осуществляющими брокерскую и (или) дилерскую деятельность на рынке ценных бумаг
  kaz: Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдар үшін пруденциялық нормативтердің түрлерін белгілеу, бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдар сақтауы міндетті пруденциялық нормативтердің мәндерін есептеу қағидаларын және әдістемесін бекіту туралы

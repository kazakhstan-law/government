act_code: '128547'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2018 года № 298. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 января 2019 года № 18175
title:
  rus: Об утверждении Правил государственной регистрации выпуска исламских ценных бумаг, рассмотрения отчетов об итогах их размещения и погашения, а также их аннулирования, Правил составления и оформления проспекта выпуска исламских ценных бумаг, изменений и (или) дополнений в проспект выпуска исламских ценных бумаг
  kaz: Исламдық бағалы қағаздар шығаруды мемлекеттік тіркеу, оларды орналастыру және өтеу, сондай-ақ жоюдың қорытындылары туралы есептердi қарау қағидаларын, Исламдық бағалы қағаздар шығарылымының проспектісін, исламдық бағалы қағаздар шығарылымының проспектісіне өзгерістерді және (немесе) толықтыруларды жасау және ресімдеу қағидаларын бекіту туралы

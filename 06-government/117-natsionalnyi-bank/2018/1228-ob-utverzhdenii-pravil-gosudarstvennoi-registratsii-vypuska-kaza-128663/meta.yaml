act_code: '128663'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 декабря 2018 года № 322. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 января 2019 года № 18183. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 ноября 2022 года № 99 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил государственной регистрации выпуска казахстанских депозитарных расписок, утверждения отчета об итогах размещения или погашения казахстанских депозитарных расписок, Правил составления и оформления проспекта выпуска казахстанских депозитарных расписок, изменений и (или) дополнений в проспект выпуска казахстанских депозитарных расписок, отчета об итогах размещения или погашения казахстанских депозитарных расписок, а также Требований, подлежащих соблюдению эмитентом казахстанских депозитарных расписок
  kaz: Қазақстандық депозитарийлік қолхаттарды шығаруды мемлекеттік тіркеу, қазақстандық депозитарийлік қолхаттарды орналастыру немесе өтеу қорытындылары туралы есепті бекіту қағидаларын, Қазақстандық депозитарийлік қолхаттар шығарылымының проспектісін, қазақстандық депозитарийлік қолхаттар шығарылымының проспектісіне өзгерістерді және (немесе) толықтыруларды, қазақстандық депозитарийлік қолхаттарды орналастыру немесе өтеу қорытындылары туралы есепті жасау және ресімдеу қағидаларын, сондай-ақ Қазақстандық депозитарийлік қолхаттардың эмитенті сақтауға тиісті талаптарды бекіту туралы

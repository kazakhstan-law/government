  kaz: Сақтандыру (қайта сақтандыру) ұйымымен, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымының филиалымен ерекше қатынастар арқылы байланысты тұлғаларға жеңілдікті жағдайлар беруге тыйым салуды белгілеудің кейбір мәселелері туралы

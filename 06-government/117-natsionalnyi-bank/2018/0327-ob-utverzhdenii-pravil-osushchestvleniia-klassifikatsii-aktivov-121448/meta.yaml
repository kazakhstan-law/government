  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан и приостановлении действия отдельных норм некоторых нормативных правовых актов Республики Казахстан по вопросам регулирования финансового рынка
    kaz: Қаржы нарығын реттеу мәселелері бойынша Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтыру енгізу және Қазақстан Республикасының кейбір нормативтік құқықтық актілерінің жекелеген нормаларының қолданылуын тоқтата тұру туралы

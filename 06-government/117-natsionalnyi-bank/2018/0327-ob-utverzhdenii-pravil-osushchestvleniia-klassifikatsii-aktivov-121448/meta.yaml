act_code: '121448'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 марта 2018 года № 62. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 мая 2018 года № 16858. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 сентября 2025 года № 62 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил осуществления классификации активов и условных обязательств по предоставленным микрокредитам, отнесения активов по предоставленным микрокредитам к сомнительным и безнадежным, а также создания провизий (резервов) против них
  kaz: Берілген микрокредиттер бойынша активтер мен шартты міндеттемелерді сыныптауды жүзеге асыру, берілген микрокредиттер бойынша активтерді күмәнді және үмітсізге жатқызу, сондай-ақ оларға қарсы провизиялар (резервтер) құру қағидаларын бекіту туралы

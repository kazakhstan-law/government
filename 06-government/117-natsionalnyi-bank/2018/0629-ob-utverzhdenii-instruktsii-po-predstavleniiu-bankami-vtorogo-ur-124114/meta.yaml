act_code: '124114'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 июня 2018 года № 139. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 августа 2018 года № 17274. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 2 декабря 2025 года № 88 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по представлению банками второго уровня, Банком Развития Казахстана, филиалами банков-нерезидентов Республики Казахстан, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и ипотечными организациями в Национальный Банк Республики Казахстан сведений для формирования обзора финансового сектора
  kaz: Екінші деңгейдегі банктердің, Қазақстанның Даму Банкінің, Қазақстан Республикасы бейрезидент-банктері филиалдарының, Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының және ипотекалық ұйымдардың Қазақстан Республикасының Ұлттық Банкіне қаржы секторына шолуды қалыптастыруға арналған мәліметтерді ұсынуы жөніндегі нұсқаулықты бекіту туралы

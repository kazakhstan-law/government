  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 июня 2018 года № 139 «Об утверждении Инструкции по представлению банками второго уровня, Банком Развития Казахстана, филиалами банков-нерезидентов Республики Казахстан, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и ипотечными организациями в Национальный Банк Республики Казахстан сведений для формирования обзора финансового сектора»
    kaz: «Екінші деңгейдегі банктердің, Қазақстанның Даму Банкінің, Қазақстан Республикасы бейрезидент-банктері филиалдарының, Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының және ипотекалық ұйымдардың Қазақстан Республикасының Ұлттық Банкіне қаржы секторына шолуды қалыптастыруға арналған мәліметтерді ұсынуы жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 29 маусымдағы № 139 қаулысына өзгерістер енгізу туралы

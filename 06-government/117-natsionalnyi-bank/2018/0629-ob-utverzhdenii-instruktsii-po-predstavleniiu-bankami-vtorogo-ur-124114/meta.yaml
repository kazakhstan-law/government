  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам сбора административных данных и представления отчетности
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына әкімшілік деректер жинау және есептілік ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам представления отчетности и приостановлении действия отдельных норм некоторых постановлений Правления Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларының жекелеген нормаларының қолданылуын тоқтата тұру туралы

act_code: '124651'
requisite: Постановление Правления Национального Банка Республики Казахстан от 30 июля 2018 года № 162. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 сентября 2018 года № 17370. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 ноября 2019 года № 211 (вводится в действие с 1 января 2020 года)
title:
  rus: Об утверждении перечня, форм, сроков отчетности организаций, осуществляющих управление инвестиционным портфелем, брокерскую и (или) дилерскую деятельность на рынке ценных бумаг Республики Казахстан и Правил их представления
  kaz: Қазақстан Республикасының бағалы қағаздар нарығында инвестициялық портфельді басқаруды, брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдар есептілігінің тізбесін, нысандарын, мерзімдерін және оларды табыс ету қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования банковской, страховой деятельности и рынка ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне банк, сақтандыру қызметін және бағалы қағаздар нарығын реттеу мәселелері бойынша өзгерістер енгізу туралы

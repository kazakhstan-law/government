  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2021 года № 44. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 февраля 2021 года № 22274. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 сентября 2025 года № 62 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 марта 2018 года № 62 «Об утверждении Правил осуществления классификации активов и условных обязательств по предоставленным микрокредитам, отнесения активов по предоставленным микрокредитам к сомнительным и безнадежным, а также создания провизий (резервов) против них»
    kaz: «Берілген микрокредиттер бойынша активтер мен шартты міндеттемелерді сыныптауды жүзеге асыру, берілген микрокредиттер бойынша активтерді күмәнді және үмітсізге жатқызу, сондай-ақ оларға қарсы провизиялар (резервтер) құру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 27 наурыздағы № 62 қаулысына өзгерістер енгізу туралы

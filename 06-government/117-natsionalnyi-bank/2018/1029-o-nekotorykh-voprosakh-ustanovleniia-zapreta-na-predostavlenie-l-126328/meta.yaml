  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 августа 2020 года № 76. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 сентября 2020 года № 21168. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 66 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 273 «О некоторых вопросах установления запрета на предоставление льготных условий лицам, связанным с банком особыми отношениями»
    kaz: «Банкпен ерекше қатынастар арқылы байланысты тұлғаларға жеңілдікті жағдайлар беруге тыйым салуды белгілеудің кейбір мәселелері туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 29 қазандағы № 273 қаулысына өзгеріс енгізу туралы

act_code: '126328'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 273. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 ноября 2018 года № 17781. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 66 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О некоторых вопросах установления запрета на предоставление льготных условий лицам, связанным с банком, филиалом банка-нерезидента Республики Казахстан особыми отношениями
  kaz: Банкпен, Қазақстан Республикасының бейрезидент-банкінің филиалымен ерекше қатынастар арқылы байланысты тұлғаларға жеңілдікті жағдайлар беруге тыйым салуды белгілеудің кейбір мәселелері туралы

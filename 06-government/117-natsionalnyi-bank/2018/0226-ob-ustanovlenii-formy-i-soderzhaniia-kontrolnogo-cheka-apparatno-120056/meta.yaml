title:
  rus: Об установлении формы и содержания контрольного чека аппаратно-программных комплексов, применяемых банками, организациями, осуществляющими отдельные виды банковских операций, и филиалами банков - нерезидентов Республики Казахстан
  kaz: Банктер мен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар және Қазақстан Республикасының бейрезидент - банктерінің филиалдар қолданатын аппараттық-бағдарламалық кешендердің бақылау чегінің нысаны мен мазмұнын белгілеу туралы

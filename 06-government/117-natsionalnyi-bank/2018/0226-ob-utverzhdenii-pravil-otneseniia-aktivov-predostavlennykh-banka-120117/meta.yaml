act_code: '120117'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 февраля 2018 года № 41. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16695
title:
  rus: Об утверждении Правил отнесения активов, предоставленных банками дочерним организациям на приобретение сомнительных и безнадежных активов родительского банка, к категории сомнительных и безнадежных, а также формирования провизий (резервов) против активов, предоставленных родительскими банками дочерним организациям
  kaz: Банктер бас банктің күмәндi және үмiтсiз активтерін сатып алу үшін еншiлес ұйымдарға берген активтерді күмәндi және үмiтсiз активтер санатына жатқызу, сондай-ақ бас банктер еншiлес ұйымдарға берген активтерге қарсы провизиялар (резервтер) қалыптастыру қағидаларын бекіту туралы

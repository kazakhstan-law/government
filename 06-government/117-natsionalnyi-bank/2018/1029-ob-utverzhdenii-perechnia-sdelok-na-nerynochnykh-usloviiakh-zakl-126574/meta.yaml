act_code: '126574'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 275. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 ноября 2018 года № 17804
title:
  rus: Об утверждении перечня сделок на нерыночных условиях, заключение которых является основанием для принятия решения об отнесении банка, филиала банка-нерезидента Республики Казахстан, к категории неплатежеспособных банков, филиалов банков-нерезидентов Республики Казахстан
  kaz: Жасалуы банкті, Қазақстан Республикасының бейрезидент-банкінің филиалын төлемге қабілетсіз банктердің, Қазақстан Республикасының бейрезидент-банкінің филиалдарының санатына жатқызу туралы шешім қабылдау үшін негіз болып табылатын нарықтық емес талаптармен мәмілелердің тізбесін бекіту туралы

act_code: '122287'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 79. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 июня 2018 года № 17008
title:
  rus: Об установлении видов пруденциальных нормативов для организаций, осуществляющих деятельность по управлению инвестиционным портфелем, утверждении правил и методики расчета значений пруденциальных нормативов, обязательных к соблюдению организациями, осуществляющими деятельность по управлению инвестиционным портфелем
  kaz: Инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдар үшін пруденциялық нормативтердің түрлерін белгілеу, инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдар сақтауы міндетті пруденциялық нормативтердің мәндерін есептеу қағидаларын және әдістемесін бекіту туралы

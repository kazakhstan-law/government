caused_by:
  code: '140474'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 марта 2020 года № 19. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 марта 2020 года № 20159
  title:
    rus: О приостановлении действия отдельных норм некоторых нормативных правовых актов Республики Казахстан по вопросам регулирования финансового рынка и внесении изменения в постановление Правления Национального Банка Республики Казахстан от 27 марта 2017 года № 53 «Об утверждении условий и минимальных требований к порядку предоставления информации поставщиками информации в кредитные бюро, Правил оформления согласия субъектов кредитных историй на предоставление информации о них в кредитные бюро (за исключением кредитного бюро с государственным участием), оформления согласия на выдачу кредитного отчета из кредитного бюро, а также Правил и условий предоставления кредитного отчета»
    kaz: Қазақстан Республикасының қаржы нарығын реттеу мәселелері бойынша кейбір нормативтік құқықтық актілерінің жекелеген нормаларының қолданылуын тоқтата тұру және «Ақпарат берушiлердiң кредиттiк бюроларға ақпарат беру тәртiбiнiң шарттары мен ең төмен талаптарын, Кредиттiк тарих субъектiлерiнiң өздерi туралы ақпаратты кредиттiк бюроларға (мемлекет қатысатын кредиттік бюроны қоспағанда) беруге келiсiмiн ресiмдеу, кредиттік бюродан кредиттiк есептi беруге келiсiмiн ресімдеу қағидаларын, сондай-ақ Кредиттiк есептi берудiң қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 27 наурыздағы № 53 қаулысына өзгеріс енгізу туралы

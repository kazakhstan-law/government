  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 70 «Об утверждении Правил продажи и выкупа Национальным Банком Республики Казахстан банкнот и монет национальной валюты Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық Банкінің Қазақстан Республикасы ұлттық валютасының банкноттары мен монеталарын сату және сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 27 сәуірдегі № 70 қаулысына өзгерістер енгізу туралы

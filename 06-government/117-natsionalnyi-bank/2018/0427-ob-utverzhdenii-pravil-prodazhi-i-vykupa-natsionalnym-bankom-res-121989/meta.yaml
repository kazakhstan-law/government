caused_by:
  code: '153186'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 22 февраля 2021 года № 18. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 марта 2021 года № 22282
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 70 «Об утверждении Правил продажи и выкупа Национальным Банком Республики Казахстан банкнот и монет национальной валюты Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық Банкiнiң Қазақстан Республикасы ұлттық валютасының банкноттары мен монеталарын сату және сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 27 сәуірдегі № 70 Қаулысына өзгерістер мен толықтырулар енгізу туралы

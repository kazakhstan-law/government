requisite: Постановление Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 70. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 мая 2018 года № 16922
title:
  rus: Об утверждении Правил продажи и выкупа Национальным Банком Республики Казахстан банкнот и монет национальной валюты Республики Казахстан, в том числе в специальной упаковке
  kaz: Қазақстан Республикасы Ұлттық Банкінің Қазақстан Республикасы ұлттық валютасының банкноттары мен монеталарын, оның ішінде арнаулы қаптамалардағы банкноттары мен монеталарын сату және сатып алу қағидаларын бекіту туралы

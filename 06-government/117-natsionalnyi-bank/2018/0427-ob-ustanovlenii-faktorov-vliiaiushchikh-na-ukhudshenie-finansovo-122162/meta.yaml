  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 75 «Об установлении факторов, влияющих на ухудшение финансового положения страховой (перестраховочной) организации и страховой группы, а также утверждении Правил одобрения плана мероприятий, предусматривающего меры раннего реагирования, и Методики определения факторов, влияющих на ухудшение финансового положения страховой (перестраховочной) организации (страховой группы)»
    kaz: «Сақтандыру (қайта сақтандыру) ұйымының және сақтандыру тобының қаржылық жағдайының нашарлауына әсер ететін факторларды белгілеу, сондай-ақ Ерте ден қою шараларын көздейтін іс-шаралар жоспарын мақұлдау қағидаларын және Сақтандыру (қайта сақтандыру) ұйымының (сақтандыру тобының) қаржылық жағдайының нашарлауына әсер ететін факторларды айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 27 сәуірдегі № 75 қаулысына өзгерістер енгізу туралы

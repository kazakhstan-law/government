act_code: '122162'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 75. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 мая 2018 года № 16944
title:
  rus: Об установлении факторов, влияющих на ухудшение финансового положения страховой (перестраховочной) организации, страховой группы и филиала страховой (перестраховочной) организации – нерезидента Республики Казахстан, а также утверждении Правил одобрения плана мероприятий, предусматривающего меры раннего реагирования, и Методики определения факторов, влияющих на ухудшение финансового положения страховой (перестраховочной) организации (страховой группы) и филиала страховой (перестраховочной) организации – нерезидента Республики Казахстан
  kaz: Сақтандыру (қайта сақтандыру) ұйымының, сақтандыру тобының және Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының қаржылық жағдайының нашарлауына әсер ететін факторларды белгілеу, сондай-ақ Ерте ден қою шараларын көздейтін іс-шаралар жоспарын мақұлдау қағидаларын және Сақтандыру (қайта сақтандыру) ұйымының (сақтандыру тобының) және Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының қаржылық жағдайының нашарлауына әсер ететін факторларды айқындау әдістемесін бекіту туралы

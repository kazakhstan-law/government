  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2018 года № 300 «Об установлении факторов, влияющих на ухудшение финансового положения организаций, осуществляющих брокерскую и (или) дилерскую деятельность на рынке ценных бумаг и (или) деятельность по управлению инвестиционным портфелем, а также утверждении Правил одобрения плана мероприятий, предусматривающего меры раннего реагирования, и Методики определения факторов, влияющих на ухудшение финансового положения организаций, осуществляющих брокерскую и (или) дилерскую деятельность на рынке ценных бумаг и (или) деятельность по управлению инвестиционным портфелем»
    kaz: «Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті және (немесе) инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдардың қаржылық жағдайының нашарлауына әсер ететін факторларды белгілеу, сондай-ақ Ерте ден қою шараларын көздейтін іс-шаралар жоспарын мақұлдау қағидаларын және Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті және (немесе) инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдардың қаржылық жағдайының нашарлауына әсер ететін факторларды анықтау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 29 қарашадағы № 300 қаулысына өзгерістер енгізу туралы

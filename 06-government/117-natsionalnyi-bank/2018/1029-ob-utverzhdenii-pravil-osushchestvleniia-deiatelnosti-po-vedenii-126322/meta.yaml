title:
  rus: Об утверждении Правил осуществления деятельности по ведению системы реестров держателей ценных бумаг, а также осуществления деятельности по формированию, ведению и хранению системы реестров держателей цифровых финансовых активов и цифровых финансовых активов
  kaz: Бағалы қағаздарды ұстаушылар тізілімдерінің жүйесін жүргізу жөніндегі қызметті жүзеге асыру, сондай-ақ цифрлық қаржы активтері мен цифрлық қаржы активтерін ұстаушылар тізілімдерінің жүйесін қалыптастыру, жүргізу және сақтау жөніндегі қызметті жүзеге асыру қағидаларын бекіту туралы

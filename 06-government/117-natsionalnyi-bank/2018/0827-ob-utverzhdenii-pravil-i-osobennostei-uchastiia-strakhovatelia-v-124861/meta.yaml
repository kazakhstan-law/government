act_code: '124861'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 190. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 сентября 2018 года № 17399. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 мая 2020 года № 59 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и особенностей участия страхователя в инвестициях или прибыли страховщика, а также Требований к содержанию договора страхования, предусматривающего условие участия страхователя в инвестициях или прибыли страховщика, Условий и Правил передачи страховой организацией активов, сформированных за счет части страховых премий, полученных от страхователей для целей инвестирования, и доходов (убытков), полученных от их инвестирования, в инвестиционное управление управляющему инвестиционным портфелем, не являющемуся страховой организацией
  kaz: Сақтанушының инвестицияларға немесе сақтандырушының пайдасына қатысу қағидалары мен ерекшеліктерін, сондай-ақ Сақтанушының инвестицияларға немесе сақтандырушының пайдасына қатысу талаптары көзделетін сақтандыру шартының мазмұнына қойылатын талаптарды, Сақтандыру ұйымының инвестициялау мақсаттары үшін сақтанушылардан алынған сақтандыру сыйлықақыларының бір бөлігі және оларды инвестициялаудан алынған кірістер (шеккен залалдар) есебінен қалыптастырылған активтерді сақтандыру ұйымы болып табылмайтын инвестициялық портфельді басқарушыға инвестициялық басқаруға беру шарттары мен қағидаларын бекіту туралы

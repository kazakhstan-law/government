title:
  rus: Об утверждении Правил приобретения товаров, работ и услуг Национальным Банком Республики Казахстан, его ведомствами, организациями, входящими в его структуру, и юридическими лицами, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых принадлежат Национальному Банку Республики Казахстан или находятся в его доверительном управлении, уполномоченным органом по регулированию, контролю и надзору финансового рынка и финансовых организаций
  kaz: Қазақстан Республикасы Ұлттық Банкінің, оның ведомстволарының, оның құрылымына кіретін ұйымдардың және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан да көп пайызы Қазақстан Республикасының Ұлттық Банкіне тиесілі немесе оның сенімгерлік басқаруындағы заңды тұлғалардың, қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкiлеттi органның тауарларды, жұмыстарды және көрсетілетін қызметтерді иеленуі қағидаларын бекіту туралы

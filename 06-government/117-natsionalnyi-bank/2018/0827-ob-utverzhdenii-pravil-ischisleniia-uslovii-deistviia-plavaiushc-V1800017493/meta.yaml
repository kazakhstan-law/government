requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 194. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 октября 2018 года № 17493. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 45 (вводится в действие по истечении десяти календарных дней после дня его первого опубликования)
title:
  rus: Об утверждении Правил исчисления, условий действия плавающей ставки вознаграждения по договорам банковского вклада
  kaz: Банктік салым шарттары бойынша құбылмалы сыйақы мөлшерлемесін есептеу қағидаларын, оның қолданылу шарттарын бекіту туралы

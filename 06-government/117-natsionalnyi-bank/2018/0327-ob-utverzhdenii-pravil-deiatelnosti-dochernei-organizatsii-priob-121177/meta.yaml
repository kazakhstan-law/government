  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 марта 2018 года № 61 «Об утверждении Правил деятельности дочерней организации, приобретающей сомнительные и безнадежные активы родительского банка, требований к приобретаемым (приобретенным) ею сомнительным и безнадежным активам»
    kaz: «Бас банктің күмәндi және үмiтсiз активтерін сатып алатын еншiлес ұйым қызметі қағидаларын, ол сатып алатын (сатып алған) күмәнді және үмітсіз активтерге қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 27 наурыздағы № 61 қаулысына өзгерістер енгізу туралы

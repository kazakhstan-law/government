act_code: '121177'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 марта 2018 года № 61. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 апреля 2018 года № 16795. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 14 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил деятельности дочерней организации, приобретающей сомнительные и безнадежные активы родительского банка, требований к приобретаемым (приобретенным) ею сомнительным и безнадежным активам
  kaz: Бас банктің күмәндi және үмiтсiз активтерін сатып алатын еншiлес ұйым қызметі қағидаларын, ол сатып алатын (сатып алған) күмәнді және үмітсіз активтерге қойылатын талаптарды бекіту туралы

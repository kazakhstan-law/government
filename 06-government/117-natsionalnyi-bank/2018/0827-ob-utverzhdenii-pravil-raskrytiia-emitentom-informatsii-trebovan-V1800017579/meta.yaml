  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 189 «Об утверждении Правил раскрытия эмитентом информации, Требований к содержанию информации, подлежащей раскрытию эмитентом, а также сроков раскрытия эмитентом информации на интернет-ресурсе депозитария финансовой отчетности»
    kaz: «Эмитенттің ақпаратты жария ету қағидаларын, Эмитенттің жария етуіне жататын ақпараттың мазмұнына қойылатын талаптарды, сондай-ақ эмитенттің қаржылық есептілік депозитарийінің интернет-ресурсында ақпаратты жария ету мерзімдерін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 27 тамыздағы № 189 қаулысына өзгерістер енгізу туралы

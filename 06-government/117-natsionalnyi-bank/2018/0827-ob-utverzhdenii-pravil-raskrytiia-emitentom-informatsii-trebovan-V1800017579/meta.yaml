  kaz: Эмитенттің ақпаратты жария ету қағидаларын, Эмитенттің жария етуіне жататын ақпараттың мазмұнына қойылатын талаптарды, сондай-ақ эмитенттің қаржылық есептілік депозитарийінің интернет-ресурсында ақпаратты жария ету мерзімдерін бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 189 «Об утверждении Правил раскрытия эмитентом информации, Требований к содержанию информации, подлежащей раскрытию эмитентом, а также сроков раскрытия эмитентом информации на интернет-ресурсе депозитария финансовой отчетности»

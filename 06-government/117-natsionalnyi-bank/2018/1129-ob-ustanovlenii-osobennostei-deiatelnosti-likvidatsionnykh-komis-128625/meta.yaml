act_code: '128625'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2018 года № 297. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 января 2019 года № 18176. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 46 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении особенностей деятельности ликвидационных комиссий добровольно ликвидируемых банков и добровольно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан
  kaz: Ерікті түрде таратылатын банктердің және қызметін ерікті түрде тоқтататын Қазақстан Республикасының бейрезидент-банктері филиалдарының тарату комиссиялары қызметінің ерекшеліктерін белгілеу туралы

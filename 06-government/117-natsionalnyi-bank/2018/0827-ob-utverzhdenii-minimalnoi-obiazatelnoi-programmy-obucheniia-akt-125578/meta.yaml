    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығы мен қаржы ұйымдарын мемлекеттік реттеу, бақылау және қадағалау саласында мемлекеттік қызметтер көрсету мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

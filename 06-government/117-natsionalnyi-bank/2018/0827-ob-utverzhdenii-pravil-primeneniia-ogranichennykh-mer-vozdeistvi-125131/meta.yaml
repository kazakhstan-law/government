act_code: '125131'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 181. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 октября 2018 года № 17474
title:
  rus: Об утверждении Правил применения ограниченных мер воздействия к операторам платежных систем, операционным центрам платежных систем, поставщикам платежных услуг, не являющимся банками, филиалами банков-нерезидентов Республики Казахстан и организациями, осуществляющими отдельные виды банковских операций
  kaz: Банктер, Қазақстан Республикасы бейрезидент банктерінің филиалдары және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар болып табылмайтын төлем жүйелерінің операторларына, төлем жүйелерінің операциялық орталықтарына және көрсетілетін төлем қызметтерін берушілерге қатысты шектеулі ықпал ету шараларын қолдану қағидаларын бекіту туралы

title:
  rus: Об утверждении Правил государственной регистрации выпуска негосударственных облигаций (облигационной программы), регистрации изменений и (или) дополнений в проспект выпуска негосударственных облигаций (проспект облигационной программы), частный меморандум, аннулирования выпуска негосударственных облигаций, Требований к документам для государственной регистрации выпуска негосударственных облигаций (облигационной программы), регистрации изменений и (или) дополнений в проспект выпуска негосударственных облигаций (проспект облигационной программы), частный меморандум, Перечня документов для аннулирования выпуска негосударственных облигаций и требований к ним, Правил составления и оформления проспекта выпуска негосударственных облигаций (проспекта облигационной программы), изменений и (или) дополнений в проспект выпуска негосударственных облигаций (проспект облигационной программы)
  kaz: Мемлекеттік емес облигациялар шығарылымын (облигациялық бағдарламаны) мемлекеттік тіркеу, мемлекеттік емес облигациялар шығарылымы проспектісіне (облигациялық бағдарлама проспектісіне), жеке меморандумға өзгерістерді және (немесе) толықтыруларды тіркеу, мемлекеттік емес облигациялар шығарылымының күшін жою қағидаларын, Мемлекеттік емес облигациялар шығарылымын (облигациялық бағдарламаны) мемлекеттік тіркеу, мемлекеттік емес облигациялар шығарылымы проспектісіне (облигациялық бағдарлама проспектісіне), жеке меморандумға өзгерістерді және (немесе) толықтыруларды тіркеу үшін құжаттарға қойылатын талаптарды, Мемлекеттік емес облигациялар шығарылымының күшін жоюға арналған құжаттардың тізбесін және оларға қойылатын талаптарды, Мемлекеттік емес облигациялар шығарылымының проспектісін (облигациялық бағдарлама проспектісін), мемлекеттік емес облигациялар шығарылымының проспектісіне (облигациялық бағдарлама проспектісіне) өзгерістерді және (немесе) толықтыруларды жасау және ресімдеу қағидаларын бекіту туралы

title:
  rus: Об утверждении Правил и сроков представления плана мероприятий по улучшению финансового положения и его одобрения уполномоченным органом, а также требований к его содержанию
  kaz: Қаржылық жағдайды жақсарту жөніндегі іс-шаралар жоспарын ұсыну және оны уәкілетті органның мақұлдау қағидалары мен мерзімдерін, сондай-ақ оның мазмұнына қойылатын талаптарды бекіту туралы

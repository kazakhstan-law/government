act_code: '126056'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 245. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 ноября 2018 года № 17751. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 34 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении Перечня вопросов, подлежащих проверке в рамках аудита иной информации, Требований к содержанию, срокам представления аудиторской организацией аудиторского заключения по аудиту иной информации, Требований к аудиторам в составе аудиторской организации, привлекаемой к аудиту иной информации
  kaz: Өзге ақпарат аудиті шеңберінде тексеруге жататын мәселелердің тізбесін, Өзге ақпарат аудиті бойынша аудиторлық қорытындының мазмұнына, оны аудиторлық ұйымның ұсыну мерзімдеріне қойылатын талаптар, Өзге ақпарат аудитіне тартылатын аудиторлық ұйымның құрамындағы аудиторларға қойылатын талаптарды белгілеу туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 февраля 2016 года № 61 «Об утверждении Правил реализации приоритетного права государства на приобретение аффинированного золота для пополнения активов в драгоценных металлах» и постановление Правления Национального Банка Республики Казахстан от 30 июля 2018 года № 167 «Об утверждении Правил проведения Национальным Банком Республики Казахстан аукционов в рамках реализации денежно-кредитной политики»
    kaz: «Бағалы металдардағы активтерді толықтыру үшін аффинирленген алтынды сатып алуға мемлекеттің басым құқығын іске асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 29 ақпандағы № 61 қаулысына және «Қазақстан Республикасы Ұлттық Банкінің ақша-кредит саясатын iске асыру шеңберінде аукциондар өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 30 шілдедегі № 167 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/228266/rus

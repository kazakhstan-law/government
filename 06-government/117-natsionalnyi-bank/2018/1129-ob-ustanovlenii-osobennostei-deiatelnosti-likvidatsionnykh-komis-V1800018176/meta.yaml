  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 9 февраля 2021 года № 13. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 февраля 2021 года № 22191. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 46 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2018 года № 297 «Об установлении особенностей деятельности ликвидационных комиссий добровольно ликвидируемых банков»

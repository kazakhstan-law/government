  requisite: Постановление Правления Национального Банка Республики Казахстан от 10 июня 2026 года № 58. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 июня 2026 года № 38937
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 28 февраля 2022 года № 11 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для платежных организаций» и постановление Правления Национального Банка Республики Казахстан от 25 августа 2025 года № 54 «Об утверждении Правил организации деятельности центра обмена данными по платежным транзакциям с признаками мошенничества (антифрод-центр Национального Банка Республики Казахстан)»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында төлем ұйымдары үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2022 жылғы 28 ақпандағы № 11 қаулысына және «Алаяқтық белгілері бар төлем транзакциялары бойынша деректер алмасу орталығының (Қазақстан Республикасы Ұлттық Банкінің антифрод-орталығы) қызметін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2025 жылғы 25 тамыздағы № 54 қаулысына өзгерістер мен толықтыру енгізу туралы

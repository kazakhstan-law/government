title:
  rus: Об утверждении Правил организации деятельности центра обмена данными по платежным транзакциям с признаками мошенничества (антифрод-центр Национального Банка Республики Казахстан)
  kaz: Алаяқтық белгілері бар төлем транзакциялары бойынша деректер алмасу орталығының (Қазақстан Республикасы Ұлттық Банкінің антифрод-орталығы) қызметін ұйымдастыру қағидаларын бекіту туралы

title:
  rus: Об утверждении перечня, форм, сроков и Правил представления отчетности по банковским счетам (вкладам) банками второго уровня, филиалами банков-нерезидентов Республики Казахстан, акционерным обществом «Банк Развития Казахстана» и Национальным оператором почты
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасы бейрезидент-банктері филиалдарының, «Қазақстанның Даму Банкі» акционерлік қоғамының және Ұлттық пошта операторының банктік шоттар (салымдар) бойынша есептілігінің тізбесін, нысандарын, мерзімдерін және оларды ұсыну қағидаларын бекіту туралы

title:
  rus: Об утверждении Правил представления отчетности о выполнении пруденциальных нормативов страховой (перестраховочной) организацией, страховой группой, исламской страховой (перестраховочной) организацией, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и филиалами исламских страховых (перестраховочных) организаций-нерезидентов Республики Казахстан
  kaz: Сақтандыру (қайта сақтандыру) ұйымының, сақтандыру тобының, исламдық сақтандыру (қайта сақтандыру) ұйымының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының және Қазақстан Республикасының бейрезидент-исламдық сақтандыру (қайта сақтандыру) ұйымдары филиалдарының пруденциялық нормативтерді орындауы туралы есептілікті ұсыну қағидаларын бекіту туралы

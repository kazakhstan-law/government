title:
  rus: Об утверждении Правил представления отчетности о выполнении пруденциальных нормативов банками второго уровня, филиалами банков-нерезидентов Республики Казахстан (в том числе филиалов исламских банков-нерезидентов Республики Казахстан), банковскими конгломератами
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент-банктері филиалдарының (оның ішінде Қазақстан Республикасының бейрезидент-ислам банктері филиалдарының), банк конгломераттарының пруденциялық нормативтерді орындауы туралы есептілікті ұсыну қағидаларын бекіту туралы

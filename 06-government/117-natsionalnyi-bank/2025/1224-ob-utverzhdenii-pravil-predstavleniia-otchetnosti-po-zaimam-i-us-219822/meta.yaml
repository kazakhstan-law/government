act_code: '219822'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 декабря 2025 года № 103. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 декабря 2025 года № 37702
title:
  rus: Об утверждении Правил представления отчетности по займам и условным обязательствам банками второго уровня, филиалами банков-нерезидентов Республики Казахстан, акционерным обществом «Банк Развития Казахстана» и организациями, осуществляющими отдельные виды банковских операций
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасы бейрезидент-банктері филиалдарының, «Қазақстанның Даму Банкі» акционерлік қоғамының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қарыздар мен шартты міндеттемелер жөніндегі есептілікті ұсыну қағидаларын бекіту туралы

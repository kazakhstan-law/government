act_code: '218434'
requisite: Постановление Правления Национального Банка Республики Казахстан от 2 декабря 2025 года № 86. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 декабря 2025 года № 37567
title:
  rus: Об утверждении Правил представления отчетности страховой (перестраховочной) организацией, исламской страховой (перестраховочной) организацией, страховым брокером, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалами исламских страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и филиалами страховых брокеров-нерезидентов Республики Казахстан
  kaz: Сақтандыру (қайта сақтандыру) ұйымының, исламдық сақтандыру (қайта сақтандыру) ұйымының, сақтандыру брокерінің, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасының бейрезидент-исламдық сақтандыру (қайта сақтандыру) ұйымдары филиалдарының және Қазақстан Республикасының бейрезидент-сақтандыру брокерлері филиалдарының есептілікті ұсыну қағидаларын бекіту туралы

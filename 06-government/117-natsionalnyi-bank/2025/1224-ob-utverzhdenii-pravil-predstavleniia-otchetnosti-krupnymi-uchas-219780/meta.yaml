title:
  rus: Об утверждении Правил представления отчетности крупными участниками банков второго уровня, банковскими холдингами, банками второго уровня, крупными участниками страховых (перестраховочных) организаций, страховыми холдингами, крупными участниками управляющих инвестиционным портфелем
  kaz: Екінші деңгейдегі банктердің ірі қатысушыларының, банк холдингтерінің, екінші деңгейдегі банктердің, сақтандыру (қайта сақтандыру) ұйымдарының ірі қатысушыларының, сақтандыру холдингтерінің, инвестициялық портфельді басқарушылардың ірі қатысушыларының есептілікті ұсыну қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнения в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам представления отчетности участниками финансового рынка и приостановлении действия структурного элемента постановления Правления Национального Банка Республики Казахстан от 2 декабря 2025 года № 88 «Об утверждении Правил представления отчетности банками второго уровня, филиалами банков-нерезидентов Республики Казахстан и акционерным обществом «Банк Развития Казахстана»
    kaz: «Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына қаржы нарығына қатысушылардың есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтыру енгізу және «Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент-банктері филиалдарының және «Қазақстанның Даму Банкі» акционерлік қоғамының есептілікті ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2025 жылғы 2 желтоқсандағы № 88 қаулысының құрылымдық элементінің қолданысын тоқтата тұру туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының қаулысы
  link: https://zan.gov.kz/client/#!/doc/228451/rus

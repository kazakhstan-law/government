  requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 188. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 октября 2018 года № 17457. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 октября 2022 года № 75 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

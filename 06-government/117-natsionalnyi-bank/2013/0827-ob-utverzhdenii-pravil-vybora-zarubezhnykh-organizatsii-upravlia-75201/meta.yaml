  kaz: Бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін басқарушы шетелдік ұйымдарға бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін басқару үшін қажетті іс-қимылдарды жасауды тапсырған кезде оларға қойылатын талаптарды қоса алғанда, оларды таңдау қағидаларын бекіту туралы

  title:
    rus: Об утверждении Методики расчета страховой премии и страховой выплаты по договорам пенсионного аннуитета, осуществляемого страховой организацией либо независимым экспертом, допустимого уровня расходов страховой организации на ведение дела по заключаемым договорам пенсионного аннуитета, типового договора пенсионного аннуитета
    kaz: Сақтандыру ұйымы не тәуелсіз сарапшы зейнетақы аннуитеті шарттары бойынша жүзеге асыратын сақтандыру сыйлықақысын және сақтандыру төлемін есептеу әдістемесін, жасалатын зейнетақы аннуитеті шарттары бойынша істі жүргізуге жұмсалатын сақтандыру ұйымы шығыстарының жол берілетін деңгейін, зейнетақы аннуитеті үлгі шартын бекіту туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования деятельности участников страхового рынка и субъектов рынка ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру нарығына қатысушылардың және бағалы қағаздар нарығы субъектілерінің  қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

act_code: '74811'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 214. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2013 года № 8796
title:
  rus: Об утверждении Правил формирования системы управления рисками и внутреннего контроля для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, деятельность по управлению инвестиционным портфелем
  kaz: Бағалы қағаздар нарығында брокерлік және дилерлік қызметті, инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдар үшін тәуекелдерді басқару мен ішкі бақылау жүйесін қалыптастыру қағидаларын бекіту туралы (Тақырыбы жаңа редакцияда - Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 22 желтоқсандағы № 257 (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) қаулысымен)

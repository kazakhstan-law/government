  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и развития рынка ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығын реттеу мен дамыту мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

act_code: '74327'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 199. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 августа 2013 года № 8672. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 мая 2023 года № 26 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил публикации единым накопительным пенсионным фондом сведений о структуре инвестиционного портфеля единого накопительного пенсионного фонда за счет пенсионных активов, информации об управляющих инвестиционным портфелем в средствах массовой информации
  kaz: Бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерінің есебінен бірыңғай жинақтаушы зейнетақы қорының инвестициялық портфелінің құрылымы туралы мәліметтерді, инвестициялық портфельді басқарушы туралы ақпаратты бұқаралық ақпарат құралдарында жариялау қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования накопительной пенсионной системы
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне жинақтаушы зейнетақы жүйесін реттеу мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

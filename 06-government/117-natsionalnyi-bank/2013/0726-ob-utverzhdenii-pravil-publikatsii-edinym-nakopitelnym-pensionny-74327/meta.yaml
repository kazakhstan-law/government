  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 мая 2023 года № 26. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 июня 2023 года № 32672
  title:
    rus: Об утверждении Правил и сроков публикации на интернет-ресурсе единого накопительного пенсионного фонда сведений о структуре инвестиционного портфеля единого накопительного пенсионного фонда за счет пенсионных активов, а также Правил и объема раскрытия информации об управляющих инвестиционным портфелем, в том числе перечня управляющих инвестиционным портфелем, с которыми единым накопительным пенсионным фондом заключены договоры о доверительном управлении пенсионными активами
    kaz: Зейнетақы активтері есебінен бірыңғай жинақтаушы зейнетақы қорының инвестициялық портфелінің құрылымы туралы мәліметтерді бірыңғай жинақтаушы зейнетақы қорының интернет-ресурсында жариялау қағидаларын және мерзімдерін, сондай-ақ инвестициялық портфельді басқарушылар туралы ақпаратты, оның ішінде бірыңғай жинақтаушы зейнетақы қоры зейнетақы активтерін сенімгерлік басқару туралы шарттар жасасқан инвестициялық портфельді басқарушылардың тізбесін ашу қағидаларын және көлемін бекіту туралы

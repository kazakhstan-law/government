act_code: '75040'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 203. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 октября 2013 года № 8767. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 мая 2023 года № 33 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об установлении перечня документов, подлежащих хранению, и сроков их хранения в едином накопительном пенсионном фонде и добровольном накопительном пенсионном фонде
  kaz: Бірыңғай жинақтаушы зейнетақы қорында және ерікті жинақтаушы зейнетақы қорында сақталуға жататын құжаттардың тізбесін және оларды сақтау мерзімдерін белгілеу туралы

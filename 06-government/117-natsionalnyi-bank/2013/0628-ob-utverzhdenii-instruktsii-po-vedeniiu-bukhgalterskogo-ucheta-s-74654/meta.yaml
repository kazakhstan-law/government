title:
  rus: Об утверждении Инструкции по ведению бухгалтерского учета страховыми (перестраховочными) организациями, обществами взаимного страхования и филиалами страховых (перестраховочных) организаций - нерезидентов Республики Казахстан
  kaz: Сақтандыру (қайта сақтандыру) ұйымдарының, өзара сақтандыру қоғамдарының және Қазақстан Республикасының бейрезидент - сақтандыру (қайта сақтандыру) ұйымдары филиалдарының бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы

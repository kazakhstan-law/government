    kaz: «Сақтандыру және қайта сақтандыру операцияларының бухгалтерлік есебін жүргізу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2013 жылғы 28 маусымдағы № 149 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 28 июня 2013 года № 149 "Об утверждении Инструкции по ведению бухгалтерского учета операций по страхованию и перестрахованию в отраслях "общее страхование" и "страхование жизни"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Жалпы сақтандыру" және "өмірді сақтандыру" салаларындағы сақтандыру және қайта сақтандыру операцияларының бухгалтерлік есебін жүргізу жөніндегі нұсқаулықты бекіту туралы" 2013 жылғы 28 маусымдағы № 149 қаулысына өзгерістер енгізу туралы

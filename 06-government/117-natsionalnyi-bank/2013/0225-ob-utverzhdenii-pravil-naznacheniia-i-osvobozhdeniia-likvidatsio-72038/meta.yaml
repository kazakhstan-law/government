  kaz: Мәжбүрлеп таратылатын банктің, сақтандыру (қайта сақтандыру) ұйымының тарату комиссиясын тағайындау және босату қағидаларын және тарату комиссиясының төрағасы мен мүшелеріне қойылатын талаптарды бекіту туралы

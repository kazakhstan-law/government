  title:
    rus: Об утверждении Требований к эмитентам и их ценным бумагам, допускаемым к обращению на фондовой бирже, а также к отдельным категориям официального списка фондовой биржи и внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования рынка ценных бумаг
    kaz: Эмитенттерге және олардың қор биржасында айналысқа жіберілетін бағалы қағаздарына, сондай-ақ қор биржасы ресми тізімінің жекелеген санаттарына қойылатын талаптарды бекіту және Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығын реттеу мәселелері бойынша өзгерістер енгізу туралы

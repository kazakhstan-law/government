act_code: '75048'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 237. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2013 года № 8815. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 42 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил осуществления деятельности единого накопительного пенсионного фонда и (или) добровольных накопительных пенсионных фондов

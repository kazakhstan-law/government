  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 184 «Об утверждении Правил осуществления кастодиальной деятельности на рынке ценных бумаг Республики Казахстан» и постановление Правления Национального Банка Республики Казахстан от 3 февраля 2014 года № 10 «Об утверждении Правил осуществления деятельности по управлению инвестиционным портфелем»
    kaz: «Қазақстан Республикасының бағалы қағаздар нарығында кастодиандық қызметті жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2013 жылғы 26 шілдедегі № 184 Қаулысына және «Инвестициялық портфельді басқару жөнiндегi қызметті жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2014 жылғы 3 ақпандағы № 10 Қаулысына өзгерістер мен толықтырулар енгізу туралы

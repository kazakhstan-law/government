title:
  rus: Об утверждении Правил применения ограниченных мер воздействия к субъекту рынка ценных бумаг и (или) лицу, обладающему признаками крупного участника, крупному участнику управляющего инвестиционным портфелем
  kaz: Бағалы қағаздар нарығының субъектісіне және (немесе) ірі қатысушы белгілеріне ие тұлғаға, инвестициялық портфельді басқарушының ірі қатысушысына шектеулі ықпал ету шараларын қолдану қағидаларын бекіту туралы

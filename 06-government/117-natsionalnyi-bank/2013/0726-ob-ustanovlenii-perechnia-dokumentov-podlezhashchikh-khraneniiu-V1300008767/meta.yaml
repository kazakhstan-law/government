  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 203 «Об установлении перечня документов, подлежащих хранению, и сроков их хранения в едином накопительном пенсионном фонде и добровольном накопительном пенсионном фонде»
    kaz: «Бірыңғай жинақтаушы зейнетақы қорында және ерікті жинақтаушы зейнетақы қорында сақталуға жататын құжаттардың тізбесін және оларды сақтау мерзімдерін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2013 жылғы 26 шілдедегі № 203 қаулысына өзгеріс енгізу туралы

title:
  rus: Об утверждении перечня, форм, сроков и Правил представления отчетности организациями, осуществляющими управление инвестиционным портфелем, брокерскую и (или) дилерскую деятельность
  kaz: Инвестициялық портфельді басқаруды, брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдар есептілігінің тізбесін, нысандарын, ұсыну мерзімдері мен қағидаларын бекіту туралы

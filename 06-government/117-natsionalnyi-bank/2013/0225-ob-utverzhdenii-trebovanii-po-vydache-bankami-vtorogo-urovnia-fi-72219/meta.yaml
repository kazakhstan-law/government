act_code: '72219'
requisite: Постановление Правления Национального Банка Республики Казахстан от 25 февраля 2013 года № 72. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 апреля 2013 года № 8409. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 66 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований по выдаче банками второго уровня, филиалами банков-нерезидентов Республики Казахстан банковских займов и банковских гарантий лицам, связанным с ними особыми отношениями, и юридическим лицам (резидентам и нерезидентам Республики Казахстан)
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент-банктері филиалдарының олармен ерекше қатынастар арқылы байланысты тұлғаларға және заңды тұлғаларға (Қазақстан Республикасының резиденттеріне және резиденті еместерге) банктік қарыздар мен банк кепілдіктерін беруі жөніндегі талаптарды бекіту туралы

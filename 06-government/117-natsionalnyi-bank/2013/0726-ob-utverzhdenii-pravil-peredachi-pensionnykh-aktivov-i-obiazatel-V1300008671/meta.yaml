requisite: Постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 187. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2013 года № 8671. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 января 2021 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

act_code: '74674'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 мая 2013 года № 130. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июля 2013 года № 8571. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 января 2016 года № 41
title:
  rus: Об утверждении форм финансовой отчетности финансовых организаций, специальных финансовых компаний, исламских специальных финансовых компаний, микрофинансовых организаций, акционерного общества "Банк Развития Казахстана" и инвестиционных фондов, а также Правил их представления
  kaz: Қаржы ұйымдарының, арнайы қаржы компанияларының, исламдық арнайы қаржы компанияларының, микроқаржы ұйымдарының, "Қазақстанның Даму Банкі" акционерлік қоғамының және инвестициялық қорлардың қаржылық есептілігінің нысандарын, сондай-ақ оларды ұсыну қағидаларын бекіту туралы

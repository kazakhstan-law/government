  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 216 "Об утверждении Правил добровольного возврата лицензии на управление инвестиционным портфелем с правом привлечения добровольных пенсионных взносов, проведения добровольной и принудительной ликвидации добровольных накопительных пенсионных фондов, а также передачи пенсионных активов и обязательств по договорам о пенсионном обеспечении за счет добровольных пенсионных взносов"
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының "Ерікті зейнетақы жарналарын тарту, ерікті жинақтаушы зейнетақы қорларын ерікті және мәжбүрлеп таратуын жүргізу, сондай-ақ ерікті зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы шарттар бойынша зейнетақы активтері мен міндеттемелерді беру құқығымен инвестициялық портфельді басқаруға берілген лицензияны ерікті қайтару қағидаларын бекіту туралы" 2013 жылғы 27 тамыздағы № 216 қаулысына өзгерістер енгізу туралы

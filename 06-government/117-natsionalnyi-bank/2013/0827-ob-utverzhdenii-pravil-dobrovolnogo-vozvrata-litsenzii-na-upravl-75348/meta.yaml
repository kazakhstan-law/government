  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам пенсионного обеспечения и регулирования рынка ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне зейнетақымен қамсыздандыру және бағалы қағаздар нарығын реттеу мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

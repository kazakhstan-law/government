act_code: '75348'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 216. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 октября 2013 года № 8810. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 38 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил добровольного возврата лицензии на управление инвестиционным портфелем с правом привлечения добровольных пенсионных взносов, проведения добровольной и принудительной ликвидации добровольных накопительных пенсионных фондов, а также передачи пенсионных активов и обязательств по договорам о пенсионном обеспечении за счет добровольных пенсионных взносов, и установления перечня документов, подтверждающих отсутствие у добровольного накопительного пенсионного фонда обязательств и действующих договоров по деятельности, осуществляемой на основании лицензии на управление инвестиционным портфелем с правом привлечения добровольных пенсионных взносов и лицензии на осуществление других видов деятельности на рынке ценных бумаг
  kaz: Ерікті зейнетақы жарналарын тарту құқығымен инвестициялық портфельді басқаруға арналған лицензияны ерікті түрде қайтару, ерікті жинақтаушы зейнетақы қорларын ерікті түрде және мәжбүрлеп таратуын жүргізу, сондай-ақ ерікті зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы шарттар бойынша зейнетақы активтері мен міндеттемелерін беру және ерікті жинақтаушы зейнетақы қорында ерікті зейнетақы жарналарын тарту құқығымен инвестициялық портфельді басқаруға арналған лицензияның және бағалы қағаздар нарығында басқа да қызмет түрлерін жүзеге асыруға арналған лицензияның негізінде жүзеге асырылатын қызмет бойынша міндеттемелердің және қолданыстағы шарттардың жоқ екендігін растайтын құжаттар тізбесін белгілеу қағидаларын бекіту туралы

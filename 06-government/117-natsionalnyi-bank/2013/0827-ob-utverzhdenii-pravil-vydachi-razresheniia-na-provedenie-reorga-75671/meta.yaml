requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 217. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2013 года № 8803. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 39 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:

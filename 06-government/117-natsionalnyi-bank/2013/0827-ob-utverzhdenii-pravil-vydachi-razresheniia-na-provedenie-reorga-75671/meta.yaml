  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 217 "Об утверждении Правил выдачи разрешения на проведение реорганизации добровольного накопительного пенсионного фонда и передачи пенсионных активов присоединяемого добровольного накопительного пенсионного фонда в реорганизуемый добровольный накопительный пенсионный фонд"
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының "Ерікті жинақтаушы зейнетақы қорын қайта ұйымдастыруды жүргізуге рұқсат беру және қосылатын ерікті жинақтаушы зейнетақы қорының зейнетақы активтерін қайта ұйымдастыралатын ерікті жинақтаушы зейнетақы қорына беру қағидаларын бекіту туралы" 2013 жылғы 27 тамыздағы № 217 қаулысына өзгерістер енгізу туралы

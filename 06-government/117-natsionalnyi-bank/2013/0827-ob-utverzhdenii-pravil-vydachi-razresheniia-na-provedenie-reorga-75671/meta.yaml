title:
  rus: Об утверждении Правил выдачи разрешения на проведение реорганизации добровольного накопительного пенсионного фонда и передачи пенсионных активов и обязательств присоединяемого добровольного накопительного пенсионного фонда по договорам о пенсионном обеспечении за счет добровольных пенсионных взносов в реорганизуемый добровольный накопительный пенсионный фонд
  kaz: Ерікті жинақтаушы зейнетақы қорын қайта ұйымдастыруды жүргізуге рұқсат беру және қосылатын ерікті жинақтаушы зейнетақы қорының ерікті зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы шарттар бойынша зейнетақы активтері мен міндеттемелері қайта ұйымдастырылатын ерікті жинақтаушы зейнетақы қорына беру қағидаларын бекіту туралы

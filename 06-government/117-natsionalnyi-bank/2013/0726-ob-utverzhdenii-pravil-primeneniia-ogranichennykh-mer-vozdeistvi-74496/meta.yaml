  rus: Об утверждении Правил применения ограниченных мер воздействия к единому накопительному пенсионному фонду, добровольному накопительному пенсионному фонду
  kaz: Бірыңғай жинақтаушы зейнетақы қорына, ерікті жинақтаушы зейнетақы қорына шектеулі ықпал ету шараларын қолдану қағидаларын бекіту туралы

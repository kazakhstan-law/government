act_code: '74496'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 182. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 сентября 2013 года № 8696. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 47 (вводится в действие с 1 июля 2023 года)

requisite: Постановление Правления Национального Банка Республики Казахстан от 25 февраля 2013 года № 68. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 апреля 2013 года № 8435
title:
  rus: Об утверждении Правил определения агрегированного показателя, расчетного показателя и его размера, оснований и порядка прощения безнадежной задолженности по кредиту (займу) и установлении максимального размера соотношения общей суммы прощенной безнадежной задолженности по кредитам (займам) к агрегированному показателю
  kaz: Біріктірілген көрсеткішті, есептік көрсеткіш пен оның мөлшерін, кредит (қарыз) бойынша үмітсіз берешекті кешіру негіздері мен тәртібін айқындау қағидаларын бекіту және кредиттер (қарыздар) бойынша кешірілген үмітсіз берешектің жалпы сомасының біріктірілген көрсеткішке ең жоғары арақатынас мөлшерін белгілеу туралы

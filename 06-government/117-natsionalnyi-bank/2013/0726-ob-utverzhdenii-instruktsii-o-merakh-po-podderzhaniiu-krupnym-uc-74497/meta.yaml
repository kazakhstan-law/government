  kaz: Инвестициялық портфельді басқарушының ірі қатысушысының инвестициялық портфельді басқарушының меншікті капиталының жеткіліктілігі коэффициентін қолдауы жөніндегі шаралар туралы нұсқаулықты бекіту жөнінде

requisite: Постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 200. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 сентября 2013 года № 8697. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 2 ноября 2017 года № 208 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

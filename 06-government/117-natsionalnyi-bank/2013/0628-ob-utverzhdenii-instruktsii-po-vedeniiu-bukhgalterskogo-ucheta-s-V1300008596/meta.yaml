    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета и автоматизации ведения бухгалтерского учета
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына бухгалтерлік есеп жүргізу және бухгалтерлік есеп жүргізуді автоматтандыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

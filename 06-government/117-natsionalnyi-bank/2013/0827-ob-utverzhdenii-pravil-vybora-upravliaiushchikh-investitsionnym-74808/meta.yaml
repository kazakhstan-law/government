  requisite: Постановление Правления Национального Банка Республики Казахстан от 19 ноября 2019 года № 200. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 ноября 2019 года № 19646. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 20 января 2025 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 241 «Об утверждении Правил выбора управляющих инвестиционным портфелем, осуществляющих деятельность на основании лицензии Национального Банка Республики Казахстан, включая требования к ним, при поручении им совершать действия, необходимые для управления пенсионными активами единого накопительного пенсионного фонда»
    kaz: «Қызметін Қазақстан Республикасы Ұлттық Банкінің лицензиясы негізінде жүзеге асыратын инвестициялық портфельді басқарушыларға бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін басқару үшін қажетті іс-қимылдар жасауды тапсырған кезде оларға қойылатын талаптарды қоса алғанда, оларды таңдау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2013 жылғы 27 тамыздағы № 241 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/136309/rus

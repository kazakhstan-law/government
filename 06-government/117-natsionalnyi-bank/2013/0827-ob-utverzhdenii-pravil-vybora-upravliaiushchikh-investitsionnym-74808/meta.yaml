act_code: '74808'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 241. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 октября 2013 года № 8790. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 20 января 2025 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выбора управляющих инвестиционным портфелем, осуществляющих деятельность на основании лицензии уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций, включая требования к ним, при поручении им совершать действия, необходимые для управления пенсионными активами единого накопительного пенсионного фонда
  kaz: Қаржы нарығын және қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органның лицензиясы негізінде қызметін жүзеге асыратын инвестициялық портфельді басқарушыларға қойылатын талаптарды қоса алғанда, бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін басқару үшін қажетті іс-қимылдар жасау өздеріне тапсырылған кезде, оларды таңдау қағидаларын бекіту туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 201. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 августа 2013 года № 8654. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 февраля 2021 года № 27 (вводится в действие по истечении десяти календарных дней после дня его официального опубликования)
title:

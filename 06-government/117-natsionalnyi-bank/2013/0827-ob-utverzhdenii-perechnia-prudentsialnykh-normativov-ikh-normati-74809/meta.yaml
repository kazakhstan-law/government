act_code: '74809'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 236. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 октября 2013 года № 8794. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 41 (вводится в действие с 1 июля 2023)
title:
  rus: Об утверждении Перечня пруденциальных нормативов, их нормативных значений и методики расчетов для добровольных накопительных пенсионных фондов
  kaz: Ерікті жинақтаушы зейнетақы қорлары үшін пруденциялық нормативтердің тізбесін, олардың нормативтік мәндерін және есептеу әдістемесін бекіту туралы

act_code: '13234'
requisite: Постановление Правления Национального Банка Республики Казахстан от 3 августа 2002 года № 304. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 сентября 2002 года № 1979. Утратило силу Постановлением Правления Национального Банка Республики Казахстан от 4 июля 2003 года № 217
title:
  rus: Об утверждении Правил государственной регистрации эмиссии акций, присвоения национального идентификационного номера эмиссиям акций, не подлежащих государственной регистрации, рассмотрения отчета об итогах выпуска и размещения акций и аннулирования эмиссии акций
  kaz: Акциялар эмиссиясын мемлекеттік тіркеу, мемлекеттік тіркелуге жатпайтын акциялардың эмиссияларына ұлттық бірегейлендіру нөмірін беру, акцияларды шығару және орналастыру қорытындылары жөніндегі есепті қарау және акциялар эмиссиясын жою ережесін бекіту туралы

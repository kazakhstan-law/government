  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 30 июля 2002 года N 275 "Об утверждении типового Плана счетов бухгалтерского учета в банках второго уровня Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1973
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1973 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының екінші деңгейдегі банктеріндегі бухгалтерлік есептің үлгі есепшот жоспарын бекіту туралы" 2002 жылғы 30 шілдедегі N 275 қаулысына өзгерістер мен толықтырулар енгізу туралы

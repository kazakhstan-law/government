  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 23 декабря 2002 года N 509 "Об утверждении Инструкции о перечне, формах и сроках представления финансовой отчетности и дополнительных сведений к финансовой отчетности организациями, осуществляющими отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2142
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2142 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қаржылық есеп пен қаржылық есепке қосымша мәліметтер беру тізбесі, нысандары мен мерзімдері туралы нұсқаулықты бекіту туралы" 2002 жылғы 23 желтоқсандағы N 509 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/18041/rus

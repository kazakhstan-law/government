title:
  rus: Об утверждении Инструкции о перечне, формах и сроках представления финансовой отчетности организациями, осуществляющими отдельные виды банковских операций
  kaz: Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қаржылық есеп беру тізбесі, нысандары мен мерзімдері туралы нұсқаулықты бекіту туралы

title:
  rus: Об утверждении Правил представления отчетов организациями, обладающими лицензиями на осуществление брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан
  kaz: Қазақстан Республикасының бағалы қағаздар рыногында брокерлiк және дилерлiк қызметтi жүзеге асыруға лицензиялары бар ұйымдардың есеп беру ережесiн бекiту туралы

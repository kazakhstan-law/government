  title:
    rus: О внесении дополнений в постановление Правления Национального Банка Республики Казахстан от 18 декабря 2002 года № 486 "Об утверждении Правил представления отчетов организациями, обладающими лицензиями на осуществление брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под № 2124
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2124 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыруға лицензиялары бар ұйымдардың есеп беру ережесін бекіту туралы" 2002 жылғы 18 желтоқсандағы N 486 қаулысына толықтырулар енгізу туралы

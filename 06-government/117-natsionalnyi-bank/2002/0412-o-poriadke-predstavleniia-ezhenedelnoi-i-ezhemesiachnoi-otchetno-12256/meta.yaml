act_code: '12256'
requisite: Постановление Правления Национального Банка Республики Казахстан от 13 апреля 2002 года № 130. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 мая 2002 года № 1865. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 173

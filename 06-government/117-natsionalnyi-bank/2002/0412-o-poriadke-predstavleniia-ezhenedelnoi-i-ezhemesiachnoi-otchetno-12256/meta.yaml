  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 13 апреля 2002 года N 130 "О порядке представления еженедельной и ежемесячной отчетности профессиональными участниками рынка ценных бумаг и организаторами торгов с ценными бумагами", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1865
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1865 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Бағалы қағаздар рыногы кәсіби қатысушыларының және бағалы қағаздармен сауда-саттық ұйымдастырушылардың апта және ай сайынғы есепті ұсыну тәртібі туралы" 2002 жылғы 13 сәуірдегі N 130 қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 30 июля 2002 года № 274 "Об утверждении типового Плана счетов бухгалтерского учета с детализацией счетов для составления Главной бухгалтерской книги банков второго уровня и ипотечных организаций"

title:
  rus: Об утверждении типового Плана счетов бухгалтерского учета с детализацией счетов для составления Главной бухгалтерской книги банков второго уровня и ипотечных организаций
  kaz: Екінші деңгейдегі банктердің және ипотекалық ұйымдардың Бас бухгалтерлік кітабын жасауға арналған Есепшоттары толық көрсетілген бухгалтерлік есептің үлгі есепшот жоспарын бекіту туралы

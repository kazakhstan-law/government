  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 30 июля 2002 года N 274 "Об утверждении типового Плана счетов бухгалтерского учета с детализацией счетов для составления Главной бухгалтерской книги банков второго уровня", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1972
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1972 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің Бас бухгалтерлік кітабын жасауға арналған Шоттары толық көрсетілген бухгалтерлік есептің үлгі есепшот жоспарын бекіту туралы" 2002 жылғы 30 шілдедегі N 274 қаулысына өзгерістер мен толықтырулар енгізу туралы

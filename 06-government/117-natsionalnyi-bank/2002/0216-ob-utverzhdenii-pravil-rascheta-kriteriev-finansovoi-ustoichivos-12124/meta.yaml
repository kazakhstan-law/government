  code: '16914'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 19 августа 2003 года N 296. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 сентября 2003 г. N 2487. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 265 (V043189)
  title:
    rus: О внесении дополнения в постановление Правления Национального Банка Республики Казахстан от 16 февраля 2002 года N 52 "Об утверждении Правил расчета критериев финансовой устойчивости для организаций, осуществляющих деятельность по ведению реестра держателей ценных бумаг, и представления отчетности по их соблюдению", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1851
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1851 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Бағалы қағаздар ұстаушылардың тізілімін жүргізу жөніндегі қызметті жүзеге асыратын ұйымдарға арналған қаржы тұрақтылығының өлшемдерін есептеудің және қолданудың және оларды сақтау жөнінде есеп берудің тәртібі туралы ережені бекіту туралы" 2002 жылғы 16 ақпандағы N 52 қаулысына толықтыру енгізу туралы

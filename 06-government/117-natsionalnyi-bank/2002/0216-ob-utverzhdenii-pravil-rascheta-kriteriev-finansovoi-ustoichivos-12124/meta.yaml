act_code: '12124'
requisite: Постановление Правления Национального Банка Республики Казахстан от 16 февраля 2002 года N 52. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 мая 2002 года N 1851. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 265 (V043189)
title:
  rus: Об утверждении Правил расчета критериев финансовой устойчивости для организаций, осуществляющих деятельность по ведению реестра держателей ценных бумаг, и представления отчетности по их соблюдению
  kaz: Бағалы қағаздар ұстаушылардың тізілімін жүргізу жөніндегі қызметті жүзеге асыратын ұйымдарға арналған қаржы тұрақтылығының өлшемдерін есептеудің және қолданудың және оларды сақтау жөнінде есеп берудің тәртібі туралы ережені бекіту туралы

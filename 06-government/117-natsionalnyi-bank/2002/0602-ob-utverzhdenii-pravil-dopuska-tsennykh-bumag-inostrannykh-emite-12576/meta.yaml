  code: '13520'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 23 сентября 2002 года N 393. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 ноября 2002 года N 2032. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 26.03.2005г. N 117
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка от 3 июня 2002 года N 205 "Об утверждении Правил допуска ценных бумаг иностранных эмитентов, выпущенных в соответствии с законодательством других государств, к обращению на территории Республики Казахстан" и признании утратившим силу постановления Национальной комиссии Республики Казахстан по ценным бумагам от 11 января 2001 N 93 "О порядке допуска к обращению на территории Республики Казахстан облигаций юридических лиц Республики Казахстан, выпущенных в соответствии с законодательством других государств, и облигаций международных финансовых организаций"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Шетелдік эмитенттердің басқа мемлекеттердің заңдарына сәйкес шығарылған бағалы қағаздарын Қазақстан Республикасының аумағына айналысқа жіберу ережесін бекіту туралы" 2002 жылғы 3 маусымдағы N 205 қаулысына өзгерістер мен толықтыру енгізу және Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Қазақстан Республикасының заңды тұлғаларының басқа мемлекеттердің заңдарына сәйкес шығарылған облигацияларын және халықаралық қаржы ұйымдарының облигацияларын Қазақстан Республикасының аумағына айналысқа жіберу тәртібі туралы" 2001 жылғы 11 қаңтардағы N 93 қаулысының күші жойылды деп тану туралы

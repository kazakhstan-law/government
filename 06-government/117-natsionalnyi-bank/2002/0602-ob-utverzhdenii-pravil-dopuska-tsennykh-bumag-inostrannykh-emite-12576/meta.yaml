act_code: '12576'
requisite: Постановление Правления Национального Банка Республики Казахстан от 3 июня 2002 года N 205. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 июля 2002 года N 1901. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года N 305
title:
  rus: Об утверждении Правил допуска ценных бумаг иностранных эмитентов, выпущенных в соответствии с законодательством других государств, к обращению на территории Республики Казахстан
  kaz: Шетелдік эмитенттердің басқа мемлекеттердің заңдарына сәйкес шығарылған бағалы қағаздарын Қазақстан Республикасының аумағына айналысқа жіберу ережесін бекіту туралы

  requisite: Постановление Правления Национального Банка Республики Казахстан от 6 декабря 2003 года № 433. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 декабря 2003 года № 2634. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2010 года № 61
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 3 июня 2002 года № 211 "Об утверждении Инструкции о требованиях к методике расчета страховых резервов страховых (перестраховочных) организаций Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1921
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1921 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының сақтандыру (қайта сақтандыру) ұйымдарының сақтандыру резервтерін есептеу әдісіне қойылатын талаптар туралы нұсқаулықты бекіту туралы" 2002 жылғы 3 маусымдағы N 211 қаулысына өзгерістер мен толықтырулар енгізу туралы

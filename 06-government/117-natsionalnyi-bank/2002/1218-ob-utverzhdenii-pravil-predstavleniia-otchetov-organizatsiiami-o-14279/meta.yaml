  code: '19908'
  requisite: Совместное постановление Правлений Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 г. № 111 и Национального Банка Республики Казахстан от 12 апреля 2004 г. № 54. Зарегистрировано Министерством юстиции Республики Казахстан 19 мая 2004 года № 2862. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 января 2009 года № 8.
  title:
    rus: Об утверждении Инструкции о перечне, формах и сроках представления финансовой отчетности организациями, осуществляющими деятельность по ведению системы реестров держателей ценных бумаг и внесении изменений в постановление Правления Национального Банка Республики Казахстан от 18 декабря 2002 года № 485 "Об утверждении Правил представления отчетов организациями, обладающими лицензиями на осуществление деятельности по ведению реестра держателей ценных бумаг", зарегистрированное в Министерстве юстиции Республики Казахстан под № 2133
    kaz: Бағалы қағаздар ұстаушылардың тізілім жүйесін жүргізу жөніндегі қызметті жүзеге асыратын ұйымдардың қаржылық есеп беру тізбесі, нысандары және ұсыну мерзімдері туралы Нұсқаулықты бекіту және Қазақстан Республикасының Әділет министрлігінде № 2133 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Бағалы қағаздар ұстаушылардың тізілімін жүргізу жөніндегі қызметті жүзеге асыруға лицензиялары бар ұйымдардың есеп беру ережесін бекіту туралы" 2002 жылғы 18 желтоқсандағы № 485 қаулысына өзгерістер енгізу туралы

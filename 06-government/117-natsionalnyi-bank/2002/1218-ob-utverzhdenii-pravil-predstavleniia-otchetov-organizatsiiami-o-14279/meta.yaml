requisite: Постановление Правления Национального Банка Республики Казахстан от 18 декабря 2002 года N 485. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 2003 года N 2133. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 января 2009 года N 8.

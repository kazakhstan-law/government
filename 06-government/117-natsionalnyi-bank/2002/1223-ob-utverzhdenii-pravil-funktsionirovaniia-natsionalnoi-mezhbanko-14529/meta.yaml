title:
  rus: Об утверждении Правил функционирования Национальной межбанковской системы платежных карточек на основе микропроцессорных карточек
  kaz: Микропроцессорлық карточкалар негізінде төлем карточкаларының ұлттық банкаралық жүйесінің қызмет ету ережесін бекіту туралы

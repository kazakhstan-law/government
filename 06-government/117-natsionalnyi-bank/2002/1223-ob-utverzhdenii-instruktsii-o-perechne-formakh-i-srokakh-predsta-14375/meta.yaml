  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 23 декабря 2002 года N 507 "Об утверждении Инструкции о перечне, формах и сроках представления регуляторной отчетности банками второго уровня Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2143
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2143 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының екінші деңгейдегі банктерінің реттеуші есебінің тізбесі, нысандары және ұсыну мерзімдері туралы нұсқаулықты бекіту туралы" 2002 жылғы 23 желтоқсандағы N 507 қаулысына өзгерістер мен толықтырулар енгізу туралы

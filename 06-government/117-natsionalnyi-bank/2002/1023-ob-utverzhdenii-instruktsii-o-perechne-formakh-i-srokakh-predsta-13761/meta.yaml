title:
  rus: Об утверждении Инструкции о перечне, формах и сроках представления банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, отчетности об основных видах деятельности
  kaz: Екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қызметінің негізгі түрлері туралы есеп беру тізбесі, нысандары мен мерзімдері жөніндегі нұсқаулықты бекіту туралы

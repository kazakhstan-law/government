act_code: '12062'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 марта 2002 года N 98. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 мая 2002 года N 1844. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 21 сентября 2004 года N 262
title:
  rus: Об утверждении Правил ежедневной электронной отчетности юридических лиц, обладающих лицензией на осуществление деятельности по инвестиционному управлению пенсионными активами
  kaz: Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыруға лицензиясы бар заңды тұлғалардың күнделікті электрондық есеп беру ережесін бекіту туралы

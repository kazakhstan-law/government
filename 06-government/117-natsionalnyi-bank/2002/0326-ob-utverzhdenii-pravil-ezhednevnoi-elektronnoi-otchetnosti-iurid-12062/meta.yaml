  code: '15696'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 29 апреля 2003 года N 147. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 июня 2003 года N 2333. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 21 сентября 2004 года N 262
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 26 марта 2002 года N 98 "Об утверждении Правил ежедневной электронной отчетности организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1844
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 1844 тiркелген Қазақстан Республикасының Ұлттық Банкi Басқармасының "Зейнетақы активтерiн инвестициялық басқару жөнiндегi қызметтi жүзеге асыратын ұйымдардың күнделiктi электрондық есеп беру ережесiн бекiту туралы" 2002 жылғы 26 наурыздағы N 98 қаулысына өзгерiстер мен толықтыру енгiзу туралы

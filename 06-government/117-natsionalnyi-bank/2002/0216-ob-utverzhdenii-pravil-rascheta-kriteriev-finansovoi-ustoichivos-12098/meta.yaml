act_code: '12098'
requisite: Постановление Правления Национального Банка Республики Казахстан от 16 февраля 2002 года N 54. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 мая 2002 года N 1852. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 264 (V043196)
title:
  rus: Об утверждении Правил расчета критериев финансовой устойчивости для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, и представления отчетности по их соблюдению
  kaz: Бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдарға арналған қаржы тұрақтылығының өлшемдерін есептеудің және қолданудың және оларды сақтау жөнінде есеп берудің тәртібі туралы ережені бекіту туралы

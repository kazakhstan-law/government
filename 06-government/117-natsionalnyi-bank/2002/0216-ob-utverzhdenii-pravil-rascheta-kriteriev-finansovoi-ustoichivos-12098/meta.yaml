  code: '16915'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 19 августа 2003 года N 297. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 сентября 2003 г. N 2488. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 264 (V043196)
  title:
    rus: О внесении дополнения в постановление Правления Национального Банка Республики Казахстан от 16 февраля 2002 года N 54 "Об утверждении Правил расчета критериев финансовой устойчивости для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, и представления отчетности по их соблюдению", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1852
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1852 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдарға арналған қаржы тұрақтылығының өлшемдерін есептеудің және қолданудың және оларды сақтау жөнінде есеп берудің тәртібі туралы ережені бекіту туралы" 2002 жылғы 16 ақпандағы N 54 қаулысына толықтыру енгізу туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 3 июня 2002 года № 211. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 июля 2002 года № 1921. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2010 года № 61.
title:
  rus: Об утверждении Инструкции о требованиях к методике расчета страховых резервов страховых (перестраховочных) организаций Республики Казахстан
  kaz: Қазақстан Республикасының сақтандыру (қайта сақтандыру) ұйымдарының сақтандыру резервтерін есептеу әдістемесіне қойылатын талаптар туралы нұсқаулықты бекіту туралы

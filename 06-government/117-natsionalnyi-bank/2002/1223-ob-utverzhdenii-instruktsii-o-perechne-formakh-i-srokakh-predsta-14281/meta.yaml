  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 23 декабря 2002 года № 508 "Об утверждении Инструкции о перечне, формах и сроках представления финансовой отчетности и дополнительных сведений к финансовой отчетности кредитными товариществами и ипотечными компаниями", зарегистрированное в Министерстве юстиции Республики Казахстан под № 2138
    kaz: Қазақстан Республикасының Әділет министрлігінде № 2138 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Кредиттік серіктестіктердің және ипотекалық компаниялардың қаржылық есеп пен қаржылық есепке қосымша мәліметтер беру тізбесі, нысандары мен мерзімдері туралы нұсқаулықты бекіту туралы" 2002 жылғы 23 желтоқсандағы № 508 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/19319/rus

  title:
    rus: О внесении изменения и дополнения в постановление Правления Национального Банка Республики Казахстан от 23 декабря 2002 года № 508 "Об утверждении Инструкции о перечне, формах и сроках представления финансовой отчетности и дополнительных сведений к финансовой отчетности кредитными товариществами и ипотечными компаниями", зарегистрированное в Министерстве юстиции Республики Казахстан под № 2138
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде № 2138 тiркелген, Қазақстан Республикасының Ұлттық Банкi Басқармасының "Кредиттiк серiктестiктердiң және ипотекалық компаниялардың қаржылық есеп пен қаржылық есепке қосымша мәлiметтер беру тiзбесi, нысандары мен мерзiмдерi туралы нұсқаулықты бекiту туралы" 2002 жылғы 23 желтоқсандағы № 508 қаулысына өзгерiс пен толықтыру енгiзу туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 23 декабря 2002 года № 508 "Об утверждении Инструкции о перечне, формах и сроках представления финансовой отчетности и дополнительных сведений к финансовой отчетности кредитными товариществами и ипотечными компаниями"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Кредиттік серіктестіктердің және ипотекалық компаниялардың қаржылық есеп пен қаржылық есепке қосымша мәліметтер беру тізбесі, нысандары мен мерзімдері туралы нұсқаулықты бекіту туралы" 2002 жылғы 23 желтоқсандағы N 508 қаулысына өзгерістер енгізу туралы

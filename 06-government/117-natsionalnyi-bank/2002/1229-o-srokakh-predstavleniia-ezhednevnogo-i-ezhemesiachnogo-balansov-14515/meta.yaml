title:
  rus: О сроках представления ежедневного и ежемесячного балансов банками второго уровня в уполномоченный орган по регулированию и надзору финансового рынка и финансовых организаций
  kaz: Екінші деңгейдегі банктердің Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөніндегі уәкілетті органына күн сайынғы және ай сайынғы баланстарды беру мерзімдері туралы

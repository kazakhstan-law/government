requisite: Постановление Правления Национального Банка Республики Казахстан от 10 октября 2002 года № 401. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 ноября 2002 года № 2062. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 258 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил лицензирования и регулирования деятельности по инкассации банкнот, монет и ценностей юридических лиц, не являющихся банками
  kaz: Банк болып табылмайтын заңды тұлғалардың банкноттарды, металл ақшаны және құндылықтарды инкассациялау жөнiндегi қызметiн лицензиялау және реттеу ережесiн бекiту туралы

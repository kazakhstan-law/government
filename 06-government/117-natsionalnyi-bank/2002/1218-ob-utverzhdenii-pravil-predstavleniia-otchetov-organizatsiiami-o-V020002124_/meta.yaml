  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 ноября 2009 года № 230. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 ноября 2009 года № 5879. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 196
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора финансового рынка и финансовых организаций
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығын және қаржы ұйымын реттеу мен қадағалау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 173. Зарегистрировано в Министерстве юстиции Республики Казахстан от 6 августа 2007 года № 4848. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 февраля 2016 года № 59
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора финансового рынка и финансовых организаций
    kaz: Қазақстан Республикасының кейбір нормативтік құқтық актілеріне қаржы рыногы мен қаржылық ұйымдарды мемлекеттік реттеу мен қадағалау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

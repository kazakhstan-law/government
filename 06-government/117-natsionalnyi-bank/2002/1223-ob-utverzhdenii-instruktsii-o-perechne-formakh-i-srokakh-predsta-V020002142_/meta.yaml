  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 23 декабря 2002 года № 509 "Об утверждении Инструкции о перечне, формах и сроках представления финансовой отчетности и дополнительных сведений к финансовой отчетности организациями, осуществляющими отдельные виды банковских операций"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қаржылық есеп пен қаржылық есепке қосымша мәліметтер беру тізбесі, нысандары мен мерзімдері туралы нұсқаулықты бекіту туралы" 2002 жылғы 23 желтоқсандағы № 509 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/22718/rus

  requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2009 года № 86. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 сентября 2009 года № 5804. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2014 года № 247
  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам совмещения организациями, осуществляющими операции по инкассации банкнот, монет и ценностей, деятельности по пересчету, сортировке, упаковке, хранению банкнот, монет и ценностей, а также их выдаче банкам и их клиентам по поручению банков
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына банкноттарды, монеталарды және құндылықтарды инкассациялау жөніндегі операцияларды жүзеге асыратын ұйымдардың банкноттарды, монеталарды және құндылықтарды қайта санау, сұрыптау, орау, сақтау, сондай-ақ оларды банктерге және банктердің тапсырмасы бойынша олардың клиенттеріне беру жөніндегі қызметті қоса атқаруы мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/48068/rus

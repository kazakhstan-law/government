  requisite: Постановление Правления Национального Банка Республики Казахстан от 20 июля 2007 года № 84. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 сентября 2007 года № 4905. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 1 ноября 2010 № 88
  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по формам финансовой отчетности ипотечных организаций, специальных финансовых компаний и организаций, осуществляющих отдельные виды банковских операций
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына ипотекалық ұйымдардың, арнайы қаржы компанияларының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қаржылық есептілік нысандары бойынша өзгерістер мен толықтырулар енгізу туралы

title:
  rus: Об установлении факторов, влияющих на ухудшение финансового положения банка и банковского конгломерата, а также утверждении Правил применения мер раннего реагирования и методики определения факторов, влияющих на ухудшение финансового положения банка и банковского конгломерата
  kaz: Банктің және банк конгломератының қаржылық жай-күйінің нашарлауына әсер ететін факторларды белгілеу, сондай-ақ Ертерек ден қою шараларын қолдану қағидаларын және банк пен банк конгломератының қаржылық жай-күйінің нашарлауына әсер ететін факторларды анықтау әдістемесін бекіту туралы

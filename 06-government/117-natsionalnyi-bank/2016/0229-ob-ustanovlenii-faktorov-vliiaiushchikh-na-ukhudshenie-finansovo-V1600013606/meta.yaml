  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 февраля 2016 года № 69 «Об установлении факторов, влияющих на ухудшение финансового положения банка и банковского конгломерата, а также утверждении Правил применения мер раннего реагирования и методики определения факторов, влияющих на ухудшение финансового положения банка и банковского конгломерата»
    kaz: «Банктің және банк конгломератының қаржылық жай-күйінің нашарлауына әсер ететін факторларды белгілеу, сондай-ақ Ертерек ден қою шараларын қолдану қағидаларын және банк пен банк конгломератының қаржылық жай-күйінің нашарлауына әсер ететін факторларды анықтау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 29 ақпандағы № 69 қаулысына өзгерістер енгізу туралы

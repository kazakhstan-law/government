act_code: '109844'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 304. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 февраля 2017 года № 14794
title:
  rus: Об установлении нормативных значений и методик расчетов пруденциальных нормативов страховой (перестраховочной) организации и страховой группы и иных обязательных к соблюдению норм и лимитов, требований к приобретаемым страховыми (перестраховочными) организациями, дочерними организациями страховых (перестраховочных) организаций или страховых холдингов акциям (долям участия в уставном капитале) юридических лиц, перечня облигаций международных финансовых организаций, приобретаемых страховыми холдингами, минимального требуемого рейтинга для облигаций, приобретаемых страховыми холдингами, и перечня рейтинговых агентств, а также перечня финансовых инструментов (за исключением акций и долей участия в уставном капитале), приобретаемых страховыми (перестраховочными) организациями
  kaz: Сақтандыру (қайта сақтандыру) ұйымының және сақтандыру тобының пруденциялық нормативтерінің және сақталуға міндетті өзге де нормалар мен лимиттердің нормативтік мәндерін және оларды есептеу әдістемелерін, сақтандыру (қайта сақтандыру) ұйымдары, сақтандыру (қайта сақтандыру) ұйымдарының немесе сақтандыру холдингтерінің еншілес ұйымдары сатып алатын заңды тұлғалардың акцияларына (жарғылық капиталдағы қатысу үлестеріне) қойылатын талаптарды, сақтандыру холдингтері сатып алатын халықаралық қаржы ұйымдары облигацияларының тізбесін, сақтандыру холдингтері сатып алатын облигациялар үшін талап етілетін ең төмен рейтингті және рейтингтік агенттіктердің тізбесін, сондай-ақ сақтандыру (қайта сақтандыру) ұйымдары сатып алатын қаржы құралдарының (акциялар мен жарғылық капиталына қатысу үлестерін қоспағанда) тізбесін белгілеу туралы

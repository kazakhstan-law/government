title:
  rus: Об утверждении размера лимита платежей и переводов денег по корреспондентским счетам банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций
  kaz: Банктердің, Қазақстан Республикасының бейрезидент банктері филиалдарының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың корреспонденттік шоттары бойынша төлемдер мен ақша аударымдары лимитінің мөлшерін бекіту туралы

  requisite: Постановление Правления Национального Банка Республики Казахстан от 24 декабря 2025 года № 104. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 декабря 2025 года № 37700
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 41 «Об утверждении Правил представления финансовой отчетности финансовыми организациями» и признании утратившими силу постановления Правления Национального Банка Республики Казахстан от 21 сентября 2020 года № 107 «Об утверждении Правил представления отчетности по данным бухгалтерского учета филиалами банков-нерезидентов Республики Казахстан, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалами страховых брокеров-нерезидентов Республики Казахстан» и пункта 14 Перечня некоторых постановлений Правления Национального Банка Республики Казахстан, в которые вносятся изменения и дополнения по вопросам ведения бухгалтерского учета и представления финансовой отчетности, утвержденного постановлением Правления Национального Банка Республики Казахстан от 19 декабря 2022 года № 122 «О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета и представления финансовой отчетности»
    kaz: «Қаржы ұйымдарының қаржылық есептілікті ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 28 қаңтардағы № 41 қаулысына өзгерістер енгізу және «Қазақстан Республикасы бейрезидент-банктері филиалдарының, Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасы бейрезидент-сақтандыру брокерлері филиалдарының бухгалтерлік есепке алу деректері бойынша есептiлiкті ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2020 жылғы 21 қыркүйектегі № 107 қаулысының және «Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына бухгалтерлік есеп жүргізу және қаржылық есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2022 жылғы 19 желтоқсандағы № 122 қаулысымен бекітілген Қазақстан Республикасы Ұлттық Банкі Басқармасының бухгалтерлік есеп жүргізу және қаржылық есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізілетін кейбір қаулыларының тізбесі 14-тармағының күші жойылды деп тану туралы

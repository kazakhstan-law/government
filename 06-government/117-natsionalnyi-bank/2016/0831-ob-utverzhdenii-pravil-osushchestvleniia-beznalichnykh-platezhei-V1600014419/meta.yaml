  title:
    rus: О внесении изменений в постановления Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 207 «Об утверждении Правил открытия, ведения и закрытия банковских счетов клиентов» и от 31 августа 2016 года № 208 «Об утверждении Правил осуществления безналичных платежей и (или) переводов денег на территории Республики Казахстан»
    kaz: «Клиенттердің банктік шоттарын ашу, жүргізу және жабу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 31 тамыздағы № 207 және «Қазақстан Республикасының аумағында қолма-қол ақшасыз төлемдерді және (немесе) ақша аударымдарын жүзеге асыру қағидаларын бекіту туралы» 2016 жылғы 31 тамыздағы № 208 қаулыларына өзгерістер енгізу туралы

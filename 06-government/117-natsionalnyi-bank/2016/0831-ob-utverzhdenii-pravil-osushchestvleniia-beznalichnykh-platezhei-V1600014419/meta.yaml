  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам перехода на применение международного стандарта ISO 20022 при осуществлении платежей и переводов денег на территории Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына Қазақстан Республикасының аумағында төлемдер мен ақша аударымдарын жүзеге асыру кезінде ISO 20022 халықаралық стандартын қолдануға көшу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

act_code: '109789'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 309. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 февраля 2017 года № 14790. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 69 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении нормативных значений и методики расчетов пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов, размера капитала банковского конгломерата
  kaz: Банк конгломератының пруденциялық нормативтерінің және сақталуы міндетті өзге де нормалары мен лимиттерінің нормативтік мәндері мен оларды есептеу әдістемесін, капиталының мөлшерін белгілеу туралы

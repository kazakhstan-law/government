requisite: Постановление Правления Национального Банка Республики Казахстан от 29 апреля 2016 года № 115. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 июня 2016 года № 13789. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 248 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил государственной регистрации выпуска негосударственных облигаций (облигационной программы), рассмотрения отчетов об итогах размещения и погашения негосударственных облигаций, а также аннулирования выпуска облигаций, Правил составления и оформления проспекта выпуска негосударственных облигаций (проспекта облигационной программы, проспекта выпуска облигаций в пределах облигационной программы), структуры проспекта выпуска негосударственных облигаций (проспекта облигационной программы, проспекта выпуска облигаций в пределах облигационной программы), Требований к составлению и оформлению отчета об итогах размещения негосударственных облигаций и отчета об итогах погашения негосударственных облигаций
  kaz: Мемлекеттік емес облигациялар шығаруды (облигациялық бағдарламаны) мемлекеттік тіркеу, мемлекеттік емес облигацияларды орналастыру және өтеу қорытындылары туралы есептерді қарау, сондай-ақ  облигациялар шығарылымын жою қағидаларын, Мемлекеттік емес облигациялар шығару проспектісін (облигациялық бағдарламаның проспектісін, облигациялық бағдарлама шегіндегі облигациялар шығару проспектісін) жасау және ресімдеу қағидаларын, мемлекеттік емес облигациялар шығару проспектісінің (облигациялық бағдарлама проспектісінің, облигациялық бағдарлама шегіндегі облигациялар шығару проспектісінің) құрылымын, Мемлекеттік емес облигацияларды орналастыру қорытындылары туралы есепті және мемлекеттік емес облигацияларды өтеу қорытындылары туралы есепті жасауға және ресімдеуге қойылатын талаптарды бекіту туралы

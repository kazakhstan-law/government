  requisite: Постановление Правления Национального Банка Республики Казахстан от 20 декабря 2021 года № 116. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 января 2022 года № 26413
  title:
    rus: О внесении изменений и дополнений в постановления Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 202 «Об утверждении Правил выпуска, использования и погашения электронных денег, а также требований к эмитентам электронных денег и системам электронных денег на территории Республики Казахстан» и от 31 августа 2016 года № 215 «Об утверждении Правил организации деятельности платежных организаций»
    kaz: «Қазақстан Республикасының аумағында электрондық ақша шығару, пайдалану және өтеу қағидаларын, сондай-ақ электрондық ақша эмитенттеріне және электрондық ақша жүйелеріне қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 31 тамыздағы № 202 және «Төлем ұйымдарының қызметін ұйымдастыру қағидаларын бекіту туралы» 2016 жылғы 31 тамыздағы № 215 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/163140/rus

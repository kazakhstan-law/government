title:
  rus: Об утверждении перечня, форм, сроков и Правил представления отчетности крупными участниками банков второго уровня, банковскими холдингами, банками второго уровня, крупными участниками страховых (перестраховочных) организаций, страховых холдингов, крупными участниками управляющих инвестиционным портфелем
  kaz: Банктердің ірі қатысушылары, банк холдингтері, сақтандыру (қайта сақтандыру) ұйымдарының ірі қатысушылары, сақтандыру холдингтері, инвестициялық портфельді басқарушының ірі қатысушылары, екінші деңгейдегі банктер есептілігінің тізбесін, нысандарын, мерзімдерін және оларды ұсыну қағидаларын бекіту туралы

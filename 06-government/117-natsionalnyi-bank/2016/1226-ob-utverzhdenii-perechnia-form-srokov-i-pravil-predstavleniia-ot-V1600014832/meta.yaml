  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 315 «Об утверждении перечня, форм, сроков и Правил представления отчетности крупными участниками банков второго уровня, банковскими холдингами, банками второго уровня, крупными участниками страховых (перестраховочных) организаций, страховых холдингов, крупными участниками управляющих инвестиционным портфелем»

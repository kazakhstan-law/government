act_code: '100920'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 15. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 марта 2016 года № 13526. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 31 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на добровольную реорганизацию банка в форме конвертации в исламский банк и отказа в выдаче разрешения
  kaz: Банкті ислам банкіне айналдыру нысанында ерікті тїрде қайта ұйымдастыруға рұқсат беру және рұқсат беруден бас тарту қағидаларын бекіту туралы

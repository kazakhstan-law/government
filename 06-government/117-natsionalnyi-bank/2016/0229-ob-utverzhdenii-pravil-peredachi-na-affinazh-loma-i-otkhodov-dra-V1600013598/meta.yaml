  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики от 29 февраля 2016 года № 81 «Об утверждении Правил передачи на аффинаж лома и отходов драгоценных металлов, обращенных в собственность государства по отдельным основаниям, в слитки аффинированного золота и получения их после аффинажа»

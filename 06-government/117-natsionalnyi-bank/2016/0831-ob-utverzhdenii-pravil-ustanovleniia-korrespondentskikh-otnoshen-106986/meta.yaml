  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам функционирования платежных систем и регулирования рынка платежных услуг
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына төлем жүйелерінің жұмыс істеуі және төлем қызметтері нарығын реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

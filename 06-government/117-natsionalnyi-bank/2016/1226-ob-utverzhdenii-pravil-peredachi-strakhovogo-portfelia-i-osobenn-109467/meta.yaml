requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 303. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 февраля 2017 года № 14787. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 262 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил передачи страхового портфеля и особенностей передачи страхового портфеля со дня вступления в законную силу решения суда о принудительной ликвидации страховой (перестраховочной) организации, а также при консервации или лишении лицензии страховой (перестраховочной) организации
  kaz: Сақтандыру портфелін беру қағидаларын және сақтандыру (қайта сақтандыру) ұйымын мәжбүрлеп тарату туралы соттың шешімі заңды күшіне енген күнінен бастап, сондай-ақ сақтандыру (қайта сақтандыру) ұйымын консервациялау немесе лицензиядан айыру кезінде сақтандыру портфелін берудің ерекшеліктерін бекіту туралы

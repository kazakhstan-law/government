act_code: '106776'
requisite: Постановление Правления Национального Банка Республики Казахстан от 8 августа 2016 года № 171. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 октября 2016 года № 14309
title:
  rus: Об утверждении Правил хранения документов, подлежащих обязательному хранению профессиональными участниками страхового рынка, страховыми агентами, осуществляющими предпринимательскую деятельность, и Перечней документов, подлежащих обязательному хранению, и сроков их хранения профессиональными участниками страхового рынка, страховыми агентами, осуществляющими предпринимательскую деятельность
  kaz: Кәсіпкерлік қызметті жүзеге асыратын сақтандыру нарығының кәсіби қатысушыларының, сақтандыру агенттерінің міндетті түрде сақталуға жататын құжаттарды сақтау қағидаларын және Кәсіпкерлік қызметті жүзеге асыратын сақтандыру нарығының кәсіби қатысушыларының, сақтандыру агенттерінің міндетті түрде сақталуға жататын құжаттарының тізбелерін және оларды сақтау мерзімін бекіту туралы

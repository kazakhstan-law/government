requisite: Постановление Правления Национального Банка Республики Казахстан от 30 мая 2016 года № 147. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 июля 2016 года № 13919. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 13 сентября 2017 года № 170 (вводится в действие с 25 сентября 2017 года)
title:
  rus: Об установлении нормативных значений и методики расчетов пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов размера капитала банка на определенную дату и Правил расчета и лимитов открытой валютной позиции банка
  kaz: Пруденциялық нормативтердің және сақталуға міндетті өзге де нормалар мен белгілі бір күнге банк капиталының мөлшері лимиттерінің нормативтік мәндерін және есептеу әдістемесін және Банктің ашық валюталқ позициясын есептеу қағидаларын және лимиттерін белгілеу туралы

title:
  rus: Об утверждении требований к оформлению и содержанию справки о наличии и номере банковского счета и выписки об остатке и движении денег по банковскому счету
  kaz: Банктік шоттың бар екендігі және нөмірі туралы анықтаманы және банктік шот бойынша ақша қалдығы мен қозғалысы туралы үзінді-көшірмені ресімдеуге және олардың мазмұнына қойылатын талаптарды бекіту туралы

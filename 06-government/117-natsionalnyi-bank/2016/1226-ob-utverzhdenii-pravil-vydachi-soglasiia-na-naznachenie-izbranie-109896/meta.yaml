  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 305 «Об утверждении Правил выдачи согласия на назначение (избрание) руководящих работников финансовых организаций, банковских, страховых холдингов, акционерного общества «Фонд гарантирования страховых выплат» и перечня документов, необходимых для получения согласия»
    kaz: «Қаржы ұйымдарының, банк, сақтандыру холдингтерінің, «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының басшы қызметкерлерін тағайындауға (сайлауға) келісім беру қағидаларын және келісім алу үшін қажетті құжаттардың тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 26 желтоқсандағы № 305 қаулысына өзгерістер мен толықтыру енгізу туралы

title:
  rus: Об утверждении Правил передачи на аффинаж лома и отходов драгоценных металлов, обращенных в собственность государства по отдельным основаниям, в слитки аффинированного золота и получения их после аффинажа
  kaz: Жекелеген негіздер бойынша мемлекет меншігіне айналдырылған бағалы металдардың сынақтары мен қылдықтардын аффинирленген алтын құймалары етіп аффинаждауға беру және оларды аффинаждалғаннан кейін алу қағидаларын бекіту туралы

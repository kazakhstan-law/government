act_code: '108969'
requisite: Постановление Правления Национального Банка Республики Казахстан от 30 ноября 2016 года № 288. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 января 2017 года № 14659. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 71 (вводится в действие по истечении десяти календарных дней после дня его первого опубликования)
title:
  rus: Об утверждении Правил оказания услуг банку, филиалу банка-нерезидента Республики Казахстан по привлечению клиентов, осуществлению проверки на соответствие требованиям банка, филиала банка-нерезидента Республики Казахстан, передаче документов клиентов банку, филиалу банка-нерезидента Республики Казахстан
  kaz: Банкке, Қазақстан Республикасы бейрезидент-банкінің филиалына клиенттерді тарту, банк, Қазақстан Республикасы бейрезидент-банкінің филиалы талаптарына сәйкес келуін тексеруді жүзеге асыру, клиенттердің құжаттарын банкке, Қазақстан Республикасы бейрезидент-банкінің филиалына беру жөніндегі қызметтерді көрсету қағидаларын бекіту туралы

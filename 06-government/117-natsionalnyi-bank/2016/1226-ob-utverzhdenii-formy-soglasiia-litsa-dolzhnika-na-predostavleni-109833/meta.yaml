act_code: '109833'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 310. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 февраля 2017 года № 14776
title:
  rus: Об утверждении формы согласия лица-должника на предоставление банком, филиалом банка-нерезидента Республики Казахстан сведений о нем и выпущенных банком, филиалом банка-нерезидента Республики Казахстан по заявлению лица-должника гарантиях или поручительствах в кредитное бюро и Правил представления кредитного отчета о банковской гарантии и поручительстве
  kaz: Борышкер тұлғаның өзі туралы және борышкер тұлғаның өтініші бойынша банк, Қазақстан Республикасы бейрезидент-банкінің филиалы шығарған кепілдіктер немесе кепілгерліктер туралы мәліметтерді банктің, Қазақстан Республикасының бейрезидент-банкі филиалының кредиттік бюроға беруіне келісім нысанын және Банк кепілдігі мен кепілгерлігі туралы кредиттік есепті беру қағидаларын бекіту туралы

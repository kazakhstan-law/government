requisite: Постановление Правления Национального Банка Республики Казахстан от 29 февраля 2016 года № 76. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 апреля 2016 года № 13599. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 247 (вводится в действие с 01.01.2019)
title:
  rus: Об утверждении Правил государственной регистрации выпуска объявленных акций, рассмотрения отчетов об итогах размещения акций, а также аннулирования выпуска объявленных акций, Правил составления и оформления проспекта выпуска объявленных акций, структуры проспекта выпуска объявленных акций, Требований к отчету об итогах размещения акций
  kaz: Жарияланған акциялар шығаруды мемлекеттік тіркеу, акцияларды орналастыру қорытындылары туралы есептерді қарау, сондай-ақ жарияланған акциялар шығарылымын жою қағидаларын, Жарияланған акциялар шығару проспектісін жасау және ресімдеу қағидаларын, жарияланған акциялар шығару проспектісінің құрылымын, Акцияларды орналастыру қорытындылары туралы есепке қойылатын талаптарды бекіту туралы

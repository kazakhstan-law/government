title:
  rus: Об утверждении Правил установления корреспондентских отношений между Национальным Банком Республики Казахстан и банками, филиалами банков-нерезидентов Республики Казахстан, а также организациями, осуществляющими отдельные виды банковских операций
  kaz: Қазақстан Республикасының Ұлттық Банкі мен банктер, Қазақстан Республикасы бейрезидент банктерінің филиалдары, сондай-ақ банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар арасында корреспонденттік қатынастар орнату қағидаларын бекіту туралы

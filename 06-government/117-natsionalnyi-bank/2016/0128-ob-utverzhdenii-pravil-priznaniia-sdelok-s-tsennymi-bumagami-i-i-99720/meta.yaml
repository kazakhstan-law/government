requisite: Постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 13. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13333. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 декабря 2018 года № 319 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил признания сделок с ценными бумагами и иными финансовыми инструментами, заключенных на организованном и неорганизованном рынках ценных бумаг, как совершенных в целях манипулирования, формирования и работы экспертного комитета фондовой биржи, а также его количественного состава
  kaz: Ұйымдастырылған және ұйымдастырылмаған бағалы қағаздар нарығында жасалған бағалы қағаздармен және өзге де қаржы құралдарымен мәмiлелердi айла-шарғы жасау мақсатында жасалды деп тану, қор биржасының сараптама комитетін жасақтау және оның жұмыс жасау қағидаларын, сондай-ақ оның сандық құрамын бекіту туралы

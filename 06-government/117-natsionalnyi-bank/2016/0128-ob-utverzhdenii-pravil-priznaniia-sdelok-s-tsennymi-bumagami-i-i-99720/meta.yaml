    rus: Об утверждении Правил и условий признания действий субъекта рынка ценных бумаг и иных лиц как совершенных в целях манипулирования на рынке ценных бумаг, Правил создания и работы экспертного комитета, а также его количественного состава
    kaz: Бағалы қағаздар нарығы субъектісінің және өзге тұлғалардың әрекеттерін бағалы қағаздар нарығында айла-шарғы жасау мақсатында жасалған деп тану қағидалары мен шарттарын, Сараптама комитетін құру және оның жұмыс істеу қағидаларын, сондай-ақ оның сандық құрамын бекіту туралы

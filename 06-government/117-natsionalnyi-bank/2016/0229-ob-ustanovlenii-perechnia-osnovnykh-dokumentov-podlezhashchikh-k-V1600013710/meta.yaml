title:
  rus: Об установлении Перечня основных документов, подлежащих хранению, и сроков их хранения в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан
  kaz: Екінші деңгейдегі банктерде, Қазақстан Республикасы бейрезидент-банктерінің филиалдарында сақталуға тиіс негізгі құжаттар тізбесін және олардың сақталу мерзімдерін белгілеу туралы

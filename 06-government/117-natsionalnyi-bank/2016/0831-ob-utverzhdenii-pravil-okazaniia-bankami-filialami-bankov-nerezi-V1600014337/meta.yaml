  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам открытия и ведения банковских счетов, а также осуществления платежей и (или) переводов денег
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына банктік шоттарды ашу және жүргізу, сондай-ақ төлемдерді және (немесе) ақша аударымдарын жүзеге асыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

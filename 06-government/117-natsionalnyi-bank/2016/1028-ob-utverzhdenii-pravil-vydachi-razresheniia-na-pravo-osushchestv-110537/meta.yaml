act_code: '110537'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 октября 2016 года № 263. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 февраля 2017 года № 14840. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 32 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на право осуществления деятельности кредитного бюро и акта о соответствии кредитного бюро требованиям, предъявляемым к кредитному бюро по защите и обеспечению сохранности базы данных кредитных историй, используемых информационных систем и помещениям
  kaz: Кредиттік бюро қызметін жүзеге асыру құқығына рұқсат және кредиттік тарихтардың деректер базасын, пайдаланылатын ақпараттық жүйелерді қорғау және олардың сақталуын қамтамасыз ету жөніндегі кредиттік бюроға және үй-жайларға қойылатын талаптарға кредиттік бюроның сәйкестігі туралы актіні беру қағидаларын бекіту туралы

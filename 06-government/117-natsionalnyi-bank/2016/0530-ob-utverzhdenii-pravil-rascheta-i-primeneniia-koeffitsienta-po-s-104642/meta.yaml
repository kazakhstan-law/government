title:
  rus: Об утверждении Правил расчета и применения коэффициента по системе «бонус-малус» для расчета страховой премии по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств
  kaz: Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру бойынша сақтандыру сыйлықақысын есептеу үшін «бонус-малус» жүйесі бойынша коэффициентті есептеу және қолдану қағидаларын бекіту туралы

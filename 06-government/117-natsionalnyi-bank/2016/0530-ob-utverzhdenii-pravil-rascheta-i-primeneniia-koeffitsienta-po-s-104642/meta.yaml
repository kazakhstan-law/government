  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования страховой деятельности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

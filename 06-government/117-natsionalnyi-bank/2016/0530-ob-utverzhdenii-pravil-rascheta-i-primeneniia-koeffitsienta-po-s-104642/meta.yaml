    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам совершенствования страховой деятельности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру қызметін жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

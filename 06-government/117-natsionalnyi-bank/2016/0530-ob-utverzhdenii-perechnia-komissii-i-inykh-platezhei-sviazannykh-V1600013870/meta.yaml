title:
  rus: Об утверждении Перечня комиссий и иных платежей, связанных с выдачей и обслуживанием банковского займа и микрокредита, выданных физическому лицу, учитываемых при расчете годовой эффективной ставки вознаграждения
  kaz: Жылдық тиімді сыйақы мөлшерлемесін есептеу кезінде ескерілетін, жеке тұлғаға берілген банктік қарыз және микрокредит беруге және оларға қызмет көрсетуге байланысты комиссиялар мен өзге де төлемдердің тізбесін бекіту туралы

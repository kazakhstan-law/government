requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 316. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 февраля 2017 года № 14804. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 июня 2018 года № 139 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

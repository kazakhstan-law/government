  kaz: Екінші деңгейдегі банктердің, Қазақстанның Даму Банкінің және ипотекалық ұйымдардың Қазақстан Республикасының Ұлттық Банкіне қаржы секторына шолуды қалыптастыруға арналған мәліметтерді ұсынуы жөніндегі нұсқаулықты бекіту туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан и приостановлении действия отдельных норм некоторых нормативных правовых актов Республики Казахстан по вопросам регулирования финансового рынка
    kaz: Қазақстан Республикасының қаржы нарығын реттеу мәселелері бойынша кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу және Қазақстан Республикасының кейбір нормативтік құқықтық актілерінің жекелеген нормаларының қолданылуын тоқтата тұру туралы

  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования деятельности финансовых организаций
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы ұйымдарының қызметін реттеу мәселелері бойынша өзгерістер енгізу туралы

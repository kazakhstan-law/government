title:
  rus: Об установлении пруденциальных нормативов и иных обязательных к соблюдению ипотечными организациями и дочерними организациями национального управляющего холдинга в сфере агропромышленного комплекса норм и лимитов
  kaz: Пруденциялық нормативтерді және ипотекалық ұйымдар және агроөнеркәсіп кешені саласындағы ұлттық басқарушы холдингтің еншілес ұйымдары сақтауға міндетті өзге де нормалар мен лимиттерді белгілеу туралы

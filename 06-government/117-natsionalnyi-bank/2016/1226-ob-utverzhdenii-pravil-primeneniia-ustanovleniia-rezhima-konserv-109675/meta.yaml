act_code: '109675'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 311. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 января 2017 года № 14735. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 января 2019 года № 8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения (установления) режима консервации банков второго уровня, проведения операции по одновременной передаче активов и обязательств банка в части либо в полном размере другому (другим) банку (банкам) временной администрацией по управлению банком (временным управляющим банка) на стадии консервации и согласования уполномоченным органом данной операции, а также видов активов и обязательств, подлежащих передаче при проведении указанной операции
  kaz: Екінші деңгейдегі банктерге консервациялау режимін қолдану (орнату), консервациялау сатысында банкті басқару жөніндегі уақытша әкiмшiлiктің (уақытша банк басқарушысының) банктің активтері мен міндеттемелерінің бір бөлігін не оларды толық мөлшерде басқа банкке (банктерге) бір мезгілде беру жөніндегі операцияны жүргізу және осы операцияны уәкілетті органмен келісу қағидаларын, сондай-ақ көрсетілген операцияны жүргізу кезінде беруге жататын активтер мен міндеттемелердің түрлерін бекіту туралы

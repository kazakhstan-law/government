  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам пруденциального регулирования
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне пруденциялық реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

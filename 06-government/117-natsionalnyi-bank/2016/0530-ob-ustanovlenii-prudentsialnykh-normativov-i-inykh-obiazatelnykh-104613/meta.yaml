  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования банковской деятельности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне банк қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

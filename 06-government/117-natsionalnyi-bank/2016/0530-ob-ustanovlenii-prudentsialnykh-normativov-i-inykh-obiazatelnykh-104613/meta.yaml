act_code: '104613'
requisite: Постановление Правления Национального Банка Республики Казахстан от 30 мая 2016 года № 144. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 июля 2016 года № 13939. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 апреля 2026 года № 85 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов для исламских банков, их нормативных значений и методики расчетов пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов для исламских банков
  kaz: Ислам банктері үшін пруденциалдық нормативтерді және өзге де сақтауға міндетті нормалар мен лимиттерді, олардың нормативтік мәнін және ислам банктері үшін пруденциалдық нормативтерді және өзге де сақтауға міндетті нормалар мен лимиттерді есеп айырысу әдістемесін белгілеу туралы

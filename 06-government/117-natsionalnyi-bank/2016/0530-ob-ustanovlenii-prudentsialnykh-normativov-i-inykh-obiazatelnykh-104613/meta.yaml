  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам пруденциального регулирования
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне пруденциялық реттеу мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

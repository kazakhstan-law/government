  title:
    rus: О внесении изменения в постановления Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 207 «Об утверждении Правил открытия, ведения и закрытия банковских счетов клиентов» и от 31 августа 2016 года № 208 «Об утверждении Правил осуществления безналичных платежей и (или) переводов денег на территории Республики Казахстан»

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 207 «Об утверждении Правил открытия, ведения и закрытия банковских счетов клиентов» и постановление Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 208 «Об утверждении Правил осуществления безналичных платежей и (или) переводов денег на территории Республики Казахстан»
    kaz: «Клиенттердің банктік шоттарын ашу, жүргізу және жабу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 31 тамыздағы № 207 қаулысына және «Қазақстан Республикасының аумағында қолма-қол ақшасыз төлемдерді және (немесе) ақша аударымдарын жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 31 тамыздағы № 208 қаулысына өзгерістер мен толықтырулар енгізу туралы

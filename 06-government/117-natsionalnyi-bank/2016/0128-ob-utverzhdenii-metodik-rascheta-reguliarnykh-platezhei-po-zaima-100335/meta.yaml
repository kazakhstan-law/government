act_code: '100335'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 8. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13305
title:
  rus: Об утверждении Методик расчета регулярных платежей по займам, выдаваемым банками, организациями, осуществляющими отдельные виды банковских операций, и микрокредитам, выдаваемым организациями, осуществляющими микрофинансовую деятельность, физическим лицам и предусматривающим наличие графика погашения, а также временных баз для расчета вознаграждения по таким займам, (микрокредитам)
  kaz: Жеке тұлғаларға банктер, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар және микроқаржылық қызметті жүзеге асыратын ұйымдар беретін және өтеу кестесінің болуы көзделетін қарыздар мен микрокредиттер бойынша тұрақты төлемдерді есептеу әдістемелерін, сондай-ақ осындай қарыздар (микрокредиттер) бойынша сыйақыны есептеу үшін уақытша базаларды бекіту туралы

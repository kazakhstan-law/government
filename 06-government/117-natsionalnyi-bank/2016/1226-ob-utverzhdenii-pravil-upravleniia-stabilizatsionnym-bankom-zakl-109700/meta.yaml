act_code: '109700'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 312. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 февраля 2017 года № 14785. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 июля 2026 года № 111 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления стабилизационным банком, заключения сделок, в отношении совершения которых установлены особые условия, проведения операции по передаче активов и обязательств неплатежеспособного банка стабилизационному банку, передачи стабилизационным банком активов и обязательств другому банку, определяемому уполномоченным органом
  kaz: Тұрақтандыру банкін басқару, жасалуына қатысты ерекше шарттар белгіленген мәмілелерді жасасу, төлемге қабілетсіз банктің активтері мен міндеттемелерін тұрақтандыру банкіне беру жөніндегі операцияны жүргізу, тұрақтандыру банкінің активтер мен міндеттемелерді уәкілетті орган айқындайтын басқа банкке беру қағидаларын бекіту туралы

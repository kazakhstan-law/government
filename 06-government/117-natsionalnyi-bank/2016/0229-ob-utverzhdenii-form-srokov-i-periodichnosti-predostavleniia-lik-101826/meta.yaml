title:
  rus: Об утверждении форм, сроков и периодичности предоставления ликвидационными комиссиями принудительно ликвидируемых страховых (перестраховочных) организаций отчетов и дополнительной информации
  kaz: Мәжбүрлеп таратылатын сақтандыру (қайта сақтандыру) ұйымдары тарату комиссияларының есептер мен қосымша ақпаратты беру нысандарын, мерзімдерін және кезеңділігін бекіту туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 февраля 2016 года № 65 «Об утверждении форм, сроков и периодичности предоставления ликвидационными комиссиями добровольно и принудительно ликвидируемых страховых (перестраховочных) организаций, добровольно и принудительно прекращающих деятельность филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан отчетов и дополнительной информации»
    kaz: «Ерікті түрде және мәжбүрлеп таратылатын сақтандыру (қайта сақтандыру) ұйымдары, қызметі ерікті түрде және мәжбүрлеп тоқтатылатын Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымдарының филиалдары тарату комиссияларының есептер мен қосымша ақпаратты беру нысандарын, мерзімдерін және кезеңділігін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 29 ақпандағы № 65 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/188073/rus

  title:
    rus: О внесении изменений и дополнения в постановления Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 216 «Об утверждении Правил осуществления межбанковских платежей и (или) переводов денег по операциям с использованием платежных карточек в Республике Казахстан» и от 31 августа 2016 года № 217 «Об утверждении Правил функционирования межбанковской системы  платежных карточек»
    kaz: «Қазақстан Республикасында төлем карточкаларын пайдалана отырып жүргізілетін операциялар бойынша банкаралық төлемдерді және (немесе) ақша аударымдарын жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 31 тамыздағы № 216 және «Төлем карточкаларының банкаралық жүйесінің жұмыс iстеу қағидаларын бекіту туралы» 2016 жылғы 31 тамыздағы № 217 қаулыларына өзгерістер мен толықтыру енгізу туралы

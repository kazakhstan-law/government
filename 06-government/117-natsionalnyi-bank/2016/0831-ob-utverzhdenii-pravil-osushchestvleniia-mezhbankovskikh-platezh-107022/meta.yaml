title:
  rus: Об утверждении Правил осуществления межбанковских платежей и (или) переводов денег по операциям с использованием платежных карточек в Республике Казахстан
  kaz: Қазақстан Республикасында төлем карточкаларын пайдалана отырып жүргізілетін операциялар бойынша банкаралық төлемдерді және (немесе) ақша аударымдарын жүзеге асыру қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам представления отчетности и приостановлении действия некоторых структурных элементов постановления Правления Национального Банка Республики Казахстан от 28 августа 2017 года № 167 «Об утверждении перечня, форм, сроков отчетности единого накопительного пенсионного фонда и Правил их представления»
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу және «Бірыңғай жинақтаушы зейнетақы қоры есептілігінің тізбесін, нысандарын, мерзімдерін және оларды табыс ету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 28 тамыздағы № 167 қаулысының кейбір құрылымдық элементтерінің қолданылуын тоқтата тұру туралы
  link: https://zan.gov.kz/client/#!/doc/140593/rus

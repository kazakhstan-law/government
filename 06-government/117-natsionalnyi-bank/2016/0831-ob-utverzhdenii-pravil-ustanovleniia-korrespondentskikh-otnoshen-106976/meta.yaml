  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Национального Банка Республики Казахстан по вопросам платежей и платежных систем
    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне төлемдер және төлем жүйелері мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

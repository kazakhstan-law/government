  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам платежей и платежных систем
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына төлемдер және төлем жүйелері мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам совершенствования регулирования субъектов рынка платежных услуг и безналичных платежей
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына көрсетілетін төлем қызметтері нарығының субъектілерін реттеуді жетілдіру және қолма-қол ақшасыз төлемдер мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

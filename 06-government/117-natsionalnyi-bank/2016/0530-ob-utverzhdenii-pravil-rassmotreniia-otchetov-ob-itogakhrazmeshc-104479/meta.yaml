title:
  rus: Об утверждении Правил рассмотрения отчетов об итогахразмещения паев паевого инвестиционного фонда и  Требований к составлению и оформлению отчетаоб итогах размещения паев паевого инвестиционного фонда
  kaz: Инвестициялық пай қорының пайларын орналастыру қорытындылары туралы есептерді қарау қағидаларын және Инвестициялық пай қорының пайларын орналастыру қорытындылары туралы есепті жасауға және ресімдеуге қойылатын талаптарды бекіту туралы

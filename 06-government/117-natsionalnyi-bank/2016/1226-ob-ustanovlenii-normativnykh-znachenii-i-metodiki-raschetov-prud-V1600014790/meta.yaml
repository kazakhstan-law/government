  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 69. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 апреля 2026 года № 38478
  title:
    rus: Об утверждении пруденциальных нормативов для банковских конгломератов, их предельных значений и методик расчетов, а также дополнительных пруденциальных нормативов и лимитов, обязательных к соблюдению банковскими конгломератами
    kaz: Банк конгломераттарына арналған пруденциялық нормативтерді, олардың шекті мәндері мен есеп айырысу әдістемелерін, сондай-ақ банк конгломераттары сақтауға міндетті қосымша пруденциялық нормативтер мен лимиттерді бекіту туралы

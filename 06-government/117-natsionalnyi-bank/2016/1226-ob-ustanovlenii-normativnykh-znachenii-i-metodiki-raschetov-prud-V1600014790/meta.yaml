  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 декабря 2024 года № 91. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 декабря 2024 года № 35595. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 69 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 309 «Об установлении нормативных значений и методики расчетов пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов, размера капитала банковского конгломерата»
    kaz: «Банк конгломератының пруденциялық нормативтерінің және сақталуы міндетті өзге де нормалары мен лимиттерінің нормативтік мәндері мен оларды есептеу әдістемесін, капиталының мөлшерін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 26 желтоқсандағы № 309 қаулысына өзгерістер енгізу туралы

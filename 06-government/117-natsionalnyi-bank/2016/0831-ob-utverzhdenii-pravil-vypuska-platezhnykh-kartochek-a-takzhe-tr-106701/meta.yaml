title:
  rus: Об утверждении Правил выпуска платежных карточек, а также требований к деятельности по обслуживанию операций с их использованием на территории Республики Казахстан
  kaz: Төлем карточкаларын шығару қағидаларын, сондай-ақ Қазақстан Республикасының аумағында оларды пайдалана отырып жүргізілген операцияларға қызмет көрсету бойынша қызметке қойылатын талаптарды бекіту туралы

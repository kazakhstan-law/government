  code: '187826'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 23 октября 2023 года № 84. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 ноября 2023 года № 33602
  title:
    rus: О внесении изменения и дополнений в постановление Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 205 «Об утверждении Правил выпуска платежных карточек, а также требований к деятельности по обслуживанию операций с их использованием на территории Республики Казахстан» и от 31 августа 2016 года № 212 «Об утверждении Правил оказания банками, филиалами банков-нерезидентов Республики Казахстан и организациями, осуществляющими отдельные виды банковских операций, электронных банковских услуг»
    kaz: «Төлем карточкаларын шығару қағидаларын, сондай-ақ Қазақстан Республикасының аумағында оларды пайдалана отырып жүргізілген операцияларға қызмет көрсету бойынша қызметке қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 31 тамыздағы № 205 және «Банктердің, Қазақстан Республикасы бейрезидент банктері филиалдарының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың электрондық банктік қызметтерді көрсету қағидаларын бекіту туралы» 2016 жылғы 31 тамыздағы № 212 қаулыларына өзгеріс пен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/187826/rus

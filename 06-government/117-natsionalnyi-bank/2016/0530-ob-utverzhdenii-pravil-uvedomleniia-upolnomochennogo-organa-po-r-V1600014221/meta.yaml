requisite: Постановление Правления Национального Банка Республики Казахстан от 30 мая 2016 года № 137. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2016 года № 14221. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 августа 2026 года № 116 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил уведомления уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций об утверждении финансовых продуктов финансовыми организациями, а также перечня документов, прилагаемых к уведомлению, и сведений по утвержденным финансовым продуктам, указываемым в уведомлении
  kaz: Қаржы ұйымдарының қаржы өнімдерін бекітуі туралы қаржы нарығын және қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органды хабардар ету қағидаларын, сондай-ақ хабарламаға қоса берілетін құжаттардың және хабарламада көрсетілген бекітілген қаржы өнімдері жөнінде мәліметтердің тізбесін бекіту туралы

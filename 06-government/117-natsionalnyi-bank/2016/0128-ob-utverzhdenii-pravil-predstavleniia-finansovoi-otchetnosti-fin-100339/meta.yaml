  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 41 «Об утверждении Правил представления финансовой отчетности финансовыми организациями и организациями, осуществляющими микрофинансовую деятельность»
    kaz: «Қаржы ұйымдарының және микроқаржылық қызметті жүзеге асыратын ұйымдардың қаржылық есептiлiктi ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 28 қаңтардағы № 41 қаулысына өзгерістер енгізу туралы

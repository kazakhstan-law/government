act_code: '100339'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 41. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 марта 2016 года № 13504
title:
  rus: Об утверждении Правил представления финансовой отчетности финансовыми организациями и отчетности по данным бухгалтерского учета филиалами банков-нерезидентов Республики Казахстан, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалами страховых брокеров-нерезидентов Республики Казахстан
  kaz: Қаржы ұйымдарының қаржылық есептілікті және Қазақстан Республикасының бейрезидент-банктері филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру брокерлері филиалдарының бухгалтерлік есептің деректері бойынша есептiлiкті ұсыну қағидаларын бекіту туралы

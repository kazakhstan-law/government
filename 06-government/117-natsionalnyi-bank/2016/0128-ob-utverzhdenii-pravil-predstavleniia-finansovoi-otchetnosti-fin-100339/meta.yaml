  title:
    rus: О приостановлении действия отдельных норм постановления Правления Национального Банка Республики Казахстан от 28 января 2016 года № 41 «Об утверждении Правил представления финансовой отчетности финансовыми организациями»
    kaz: «Қаржы ұйымдарының қаржылық есептілікті ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 28 қаңтардағы № 41 қаулысының жекелеген нормаларының қолданысын тоқтата тұру туралы

  title:
    rus: О внесении изменений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета и финансовой отчетности
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына бухгалтерлік есеп жүргізу және қаржылық есептілік мәселелері бойынша өзгерістер енгізу туралы

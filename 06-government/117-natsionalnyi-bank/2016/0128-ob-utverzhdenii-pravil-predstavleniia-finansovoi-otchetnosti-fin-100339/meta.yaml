  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам ведения бухгалтерского учета
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бухгалтерлік есепті жүргізу мәселелері бойынша өзгерістер енгізу туралы

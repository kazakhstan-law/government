  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета, представления финансовой отчетности и автоматизации ведения бухгалтерского учета
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларына бухгалтерлік есепті жүргізу, қаржылық есептілікті ұсыну және бухгалтерлік есепті жүргізуді автоматтандыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

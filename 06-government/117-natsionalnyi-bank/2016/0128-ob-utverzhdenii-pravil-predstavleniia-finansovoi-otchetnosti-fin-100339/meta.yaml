  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 41 «Об утверждении Правил представления финансовой отчетности финансовыми организациями и отчетности по данным бухгалтерского учета филиалами банков - нерезидентов Республики Казахстан, филиалами страховых (перестраховочных) организаций - нерезидентов Республики Казахстан, филиалами страховых брокеров - нерезидентов Республики Казахстан»
    kaz: «Қаржы ұйымдарының қаржылық есептілікті және Қазақстан Республикасының бейрезидент - банктері филиалдарының, Қазақстан Республикасының бейрезидент - сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасының бейрезидент - сақтандыру брокерлері филиалдарының бухгалтерлік есептің деректері бойынша есептілікті ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 28 қаңтардағы № 41 қаулысына өзгерістер мен толықтыру енгізу туралы

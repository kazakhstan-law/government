title:
  rus: Об утверждении Перечня финансовых продуктов, об утверждении которых финансовая организация уведомляет уполномоченный орган по регулированию, контролю и надзору финансового рынка и финансовых организаций
  kaz: Қаржы ұйымы қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органды бекітілуі туралы хабардар ететін қаржы өнімдерінің тізбесін бекіту туралы

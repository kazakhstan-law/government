title:
  rus: Об утверждении Правил установления корреспондентских отношений между банками, банками, филиалами банков-нерезидентов Республики Казахстан и организациями, осуществляющими отдельные виды банковских операций, а также установления банками корреспондентских отношений с банками-участниками Международного финансового центра «Астана
  kaz: Банктер, Қазақстан Республикасы бейрезидент-банктері, банктерінің филиалдары және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар арасында корреспонденттік қатынастар орнату, сондай-ақ банктердің «Астана» халықаралық қаржы орталығына қатысушы банктермен корреспонденттік қатынастар орнату қағидаларын бекіту туралы

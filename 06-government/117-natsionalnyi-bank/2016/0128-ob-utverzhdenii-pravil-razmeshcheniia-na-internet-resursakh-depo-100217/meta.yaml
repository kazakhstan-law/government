  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 26 «Об утверждении Правил размещения на интернет-ресурсах депозитария финансовой отчетности, фондовой биржи информации о корпоративных событиях, финансовой отчетности и аудиторских отчетов, списков аффилиированных лиц акционерных обществ, а также информации о суммарном размере вознаграждения членов исполнительного органа по итогам года»
    kaz: «Қаржылық есептілік депозитарийінің, қор биржасының интернет-ресурстарында корпоративтік оқиғалар туралы ақпаратты, қаржылық есептілікті және аудиторлық есептерді, акционерлік қоғамдардың үлестес тұлғаларының тізімдерін, сондай-ақ жыл қорытындысы бойынша атқарушы органның мүшелеріне берілген сыйақының жиынтық мөлшері туралы ақпаратты орналастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 28 қаңтардағы № 26 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113173/rus

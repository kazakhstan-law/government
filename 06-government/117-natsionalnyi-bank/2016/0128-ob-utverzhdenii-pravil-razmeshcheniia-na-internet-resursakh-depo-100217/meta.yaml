act_code: '100217'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 26. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 марта 2016 года № 13438. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 189 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил размещения на интернет-ресурсах депозитария финансовой отчетности, фондовой биржи информации о корпоративных событиях, финансовой отчетности и аудиторских отчетов, списков аффилиированных лиц акционерных обществ, а также информации о суммарном размере вознаграждения членов исполнительного органа по итогам года
  kaz: Қаржылық есептілік депозитарийінің, қор биржасының интернет-ресурстарында корпоративтік оқиғалар туралы ақпаратты, қаржылық есептілікті және аудиторлық есептерді, акционерлік қоғамдардың үлестес тұлғаларының тізімдерін, сондай-ақ жыл қорытындысы бойынша атқарушы органның мүшелері сыйақысының жиынтық мөлшері туралы ақпаратты орналастыру қағидаларын бекіту туралы

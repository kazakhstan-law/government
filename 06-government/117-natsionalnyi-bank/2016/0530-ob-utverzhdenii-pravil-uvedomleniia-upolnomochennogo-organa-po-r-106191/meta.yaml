  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 февраля 2021 года № 35. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 февраля 2021 года № 22256
  title:
    rus: О внесении изменений в постановления Правления Национального Банка Республики Казахстан от 30 мая 2016 года № 136 «Об утверждении Перечня финансовых продуктов, об утверждении которых финансовая организация уведомляет уполномоченный орган по регулированию, контролю и надзору финансового рынка и финансовых организаций» и от 30 мая 2016 года № 137 «Об утверждении Правил уведомления уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций об утверждении финансовых продуктов финансовыми организациями, а также перечня документов, прилагаемых к уведомлению»
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының «Қаржы ұйымы қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органды бекітілуі туралы хабардар ететін қаржы өнімдерінің тізбесін бекіту туралы» 2016 жылғы 30 мамырдағы № 136 және «Қаржы ұйымдарының қаржы өнімдерін бекітуі туралы қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органды хабардар ету қағидаларын, сондай ақ хабарламаға қоса берілетін құжаттардың тізбесін бекіту туралы» 2016 жылғы 30 мамырдағы № 137 қаулыларына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 30 мая 2016 года № 137 «Об утверждении Правил уведомления уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций об утверждении финансовых продуктов финансовыми организациями, а также перечня документов, прилагаемых к уведомлению»
    kaz: «Қаржы ұйымдарының қаржы өнімдерін бекітуі туралы қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органды хабардар ету қағидаларын, сондай-ақ хабарламаға қоса берілетін құжаттардың тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2016 жылғы 30 мамырдағы № 137 қаулысына өзгерістер енгізу туралы

title:
  rus: О Правилах проведения экспертизы Национальным Банком Республики Казахстан проспектов эмиссий ценных бумаг банков и их отчетов об итогах выпуска и размещения ценных бумаг
  kaz: '"Қазақстан Республикасы Ұлттық Банкiнiң банктердiң бағалы қағаздар эмиссиясының жобаларына және олардың бағалы қағаздарды шығару мен орналастыру қорытындылары туралы есептерiне сараптама жүргiзу тәртiбi туралы" Ереже жөнiнде'

  title:
    rus: О внесении изменений и дополнений в Положение о порядке проведения экспертизы Национальным Банком Республики Казахстан проспектов эмиссий ценных бумаг банков и их отчетов об итогах выпуска и размещения ценных бумаг
    kaz: Қазақстан Республикасы Ұлттық Банкінің банктердің бағалы қағаздар эмиссиясының проспектілеріне және олардың бағалы қағаздар шығару және орналастыру қорытындылары туралы есептеріне сараптама жүргізу тәртібі туралы ережеге өзгерістер мен толықтырулар енгізу туралы

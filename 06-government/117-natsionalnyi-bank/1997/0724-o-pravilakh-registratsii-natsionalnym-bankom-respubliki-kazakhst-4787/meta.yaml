  title:
    rus: Об утверждении Изменений и дополнений в Положение о порядке регистрации Национальным Банком Республики Казахстан договоров гарантий и поручительств, выданных банками второго уровня, утвержденное постановлением Правления Национального Банка Республики Казахстан "Об утверждении Положения о порядке регистрации Национальным Банком Республики Казахстан договоров гарантий и поручительств, выданных банками второго уровня" от 25 июля 1997 г. N 288
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Екiншi деңгейдегi банктер берген кепiлдiктер шарттарын Қазақстан Республикасы Ұлттық Банкінiң тiркеу тәртiбi туралы ереженi бекiту туралы" 1997 жылғы 25 шiлдедегi N 288 қаулысымен бекiтiлген Екiншi деңгейдегi банктер берген кепiлдiктер шарттарын Қазақстан Республикасы Ұлттық Банкiнiң тiркеу тәртiбi туралы ережеге өзгерiстер мен толықтыруларды бекiту туралы

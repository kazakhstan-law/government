act_code: '165246'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 февраля 2022 года № 20. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 марта 2022 года № 27113
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
  kaz: Қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетел валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункттері арқылы жүзеге асыратын заңды тұлғаларға қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 28 ноября 2022 года № 116дсп "Об утверждении Инструкции по организации антитеррористической защиты объектов Национального Банка Республики Казахстан, уязвимых в террористическом отношении

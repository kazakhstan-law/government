act_code: '174756'
requisite: Постановление Правления Национального Банка Республики Казахстан от 21 ноября 2022 года № 100. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 декабря 2022 года № 30934. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 24 ноября 2025 года № 79 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня, форм, сроков и Правил представления отчетности о выполнении пруденциальных нормативов ипотечными организациями и организациями, осуществляющими кредитование субъектов агропромышленного комплекса, сто процентов голосующих акций которых прямо или косвенно принадлежат национальному управляющему холдингу
  kaz: Ипотекалық ұйымдардың және агроөнеркәсіптік кешен субъектілеріне кредит беруді жүзеге асыратын, дауыс беретін акцияларының жүз пайызы тікелей немесе жанама түрде ұлттық басқарушы холдингке тиесілі ұйымдардың пруденциялық нормативтерді орындауы туралы есептіліктің тізбесін, нысандарын, ұсыну мерзімдері мен қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 28 февраля 2022 года № 11 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для платежных организаций»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында төлем ұйымдары үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2022 жылғы 28 ақпандағы № 11 қаулысына өзгерістер енгізу туралы

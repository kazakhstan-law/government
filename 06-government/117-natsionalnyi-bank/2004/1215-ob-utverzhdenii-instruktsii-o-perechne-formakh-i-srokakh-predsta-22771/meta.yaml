    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына қаржы ұйымдарының қаржылық есептілікті электрондық тасымалдауыштарда ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

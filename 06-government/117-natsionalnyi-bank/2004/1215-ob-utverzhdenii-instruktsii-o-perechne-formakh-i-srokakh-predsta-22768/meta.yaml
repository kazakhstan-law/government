  title:
    rus: О внесении дополнений и изменений в некоторые постановления Правления Национального Банка Республики Казахстан по формам представления финансовой отчетности организациями, осуществляющими брокерскую и дилерскую деятельность на рынке ценных бумаг
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына бағалы қағаздар нарығында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдардың қаржылық есептілікті ұсыну нысандары бойынша толықтырулар мен өзгерістер енгізу туралы

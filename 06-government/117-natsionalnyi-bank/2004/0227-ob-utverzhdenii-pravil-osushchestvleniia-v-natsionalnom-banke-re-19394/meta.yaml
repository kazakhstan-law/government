requisite: Постановление Правления Национального Банка Республики Казахстан от 27 февраля 2004 года N 24. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 апреля 2004 года N 2807. Утратило силу - постановлением Правления Национального Банка Республики Казахстан от 25 июня 2007 года N 63 (вводится в действие по истечении четырнадцати дней со дня принятия).
title:
  rus: Об утверждении Правил осуществления в Национальном Банке Республики Казахстан операций с иностранной валютой, обращенной (поступившей) в собственность государства по отдельным основаниям
  kaz: Қазақстан Республикасының Ұлттық Банкінде жекелеген негіздер бойынша мемлекет меншігіне айналдырылған (түскен) шетел валютасымен операцияларды жүзеге асыру ережесін бекіту туралы

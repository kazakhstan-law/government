  title:
    rus: О внесении дополнений и изменений в постановления Правления Национального Банка Республики Казахстан от 15 декабря 2004 года № 174 "О порядке, формах и сроках представления годовой финансовой отчетности накопительными пенсионными фондами" и от 15 декабря 2004 года № 175 "Об утверждении Инструкции о перечне, формах и сроках представления ежемесячной финансовой отчетности накопительными пенсионными фондами"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Жинақтаушы зейнетақы қорларының жылдық қаржылық есеп беру тәртібі, нысандары және ұсыну мерзімдері туралы" 2004 жылғы 15 желтоқсандағы N 174 қаулысына және "Жинақтаушы зейнетақы қорларының ай сайын қаржылық есеп беру тізбесі, нысандары және ұсыну мерзімдері туралы нұсқаулықты бекіту туралы" 2004 жылғы 15 желтоқсандағы N 175 қаулысына толықтырулар мен өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/26848/rus

  kaz: Қазақстан Республикасы Ұлттық Банкінің лицензиясы негізінде жүзеге асырылатын қолма-қол шетел валютасымен айырбастау операцияларын бухгалтерлік есепке алу жөніндегі нұсқаулықты бекіту туралы

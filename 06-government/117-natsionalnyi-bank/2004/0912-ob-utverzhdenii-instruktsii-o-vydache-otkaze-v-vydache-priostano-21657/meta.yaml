  title:
    rus: О внесении дополнений в постановление Правления Национального Банка Республики Казахстан от 13 сентября 2004 года № 122 "Об утверждении Инструкции о выдаче, отказе в выдаче, приостановлении и отзыве лицензии на выпуск платежных карточек организациям, осуществляющим отдельные виды банковских операций"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға төлем карточкаларын шығаруға лицензия беру, беруден бас тарту, тоқтата тұру және қайтарып алу туралы нұсқаулықты бекіту жөнінде" 2004 жылғы 13 қыркүйектегі № 122 қаулысына толықтырулар енгізу туралы

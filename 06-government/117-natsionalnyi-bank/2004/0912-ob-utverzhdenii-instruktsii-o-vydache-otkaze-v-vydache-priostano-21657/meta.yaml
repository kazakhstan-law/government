act_code: '21657'
requisite: Постановление Правления Национального Банка Республики Казахстан от 13 сентября 2004 года N 122. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 октября 2004 года N 3161. Утратило силу - постановлением Правления Национального Банка Республики Казахстан от 28 мая 2007 года N 57
title:
  rus: Об утверждении Инструкции о выдаче, отказе в выдаче, приостановлении и отзыве лицензии на выпуск платежных карточек организациям, осуществляющим отдельные виды банковских операций, а также выдачи Национальным Банком Республики Казахстан заключения для получения банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, лицензии уполномоченного органа на выпуск платежных карточек
  kaz: Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға төлем карточкаларын шығаруға лицензия беру, беруден бас тарту, тоқтата тұру және қайтарып алу, сондай-ақ Қазақстан Республикасы Ұлттық Банкінің екінші деңгейдегі банктер мен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың уәкілетті органның төлем карточкаларын шығаруға арналған лицензиясын алуға арналған қорытынды беруі туралы нұсқаулықты бекіту жөнінде

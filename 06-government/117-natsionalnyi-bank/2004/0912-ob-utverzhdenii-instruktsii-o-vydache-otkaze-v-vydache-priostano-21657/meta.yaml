  title:
    rus: О внесении изменений и дополнений и признании утратившими силу некоторых нормативных правовых актов Национального Банка Республики Казахстан по вопросам лицензирования
    kaz: Қазақстан Республикасы Ұлттық Банкiнiң кейбiр нормативтiк құқықтық актiлерiне лицензиялау мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу және күшi жойылды деп тану туралы

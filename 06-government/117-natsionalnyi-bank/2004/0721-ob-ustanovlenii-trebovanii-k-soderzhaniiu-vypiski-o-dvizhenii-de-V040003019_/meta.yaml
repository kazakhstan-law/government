  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Национального Банка Республики Казахстан по вопросам открытия, ведения и закрытия банковских счетов, осуществления платежей и переводов денег, а также признании утратившими силу некоторых нормативных правовых актов Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне банк шоттарын ашу, жүргізу және жабу, ақша төлемі мен аударымын жүзеге асыру мәселелері бойынша өзгерістер мен толықтырулар енгізу, сондай-ақ Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілерінің күші жойылды деп тану туралы

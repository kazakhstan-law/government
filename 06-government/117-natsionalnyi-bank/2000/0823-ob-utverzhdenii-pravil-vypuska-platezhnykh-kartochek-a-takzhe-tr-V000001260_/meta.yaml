  requisite: Постановление Правления Национального Банка Республики Казахстан от 28 мая 2007 года № 58. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 июля 2007 года № 4788. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 205
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 24 августа 2000 года № 331 "Об утверждении Правил выпуска и использования платежных карточек в Республике Казахстан"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасында төлем карточкаларын шығару және пайдалану ережесін бекіту туралы" 2000 жылғы 24 тамыздағы № 331 қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 24 августа 2000 года № 331 "Об утверждении Инструкции по выпуску и использованию платежных карточек"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Төлем карточкаларын шығару және пайдалану нұсқаулығын бекiту туралы" 2000 жылғы 24 тамыздағы № 331 қаулысына өзгерістер мен толықтырулар енгізу туралы

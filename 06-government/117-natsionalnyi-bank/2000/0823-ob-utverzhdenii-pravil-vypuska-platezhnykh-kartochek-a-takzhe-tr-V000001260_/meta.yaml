requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2000 года № 331. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 октября 2000 года № 1260. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 205 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выпуска платежных карточек, а также требований к деятельности по обслуживанию операций с их использованием на территории Республики Казахстан
  kaz: Төлем карточкаларын шығару қағидаларын, сондай-ақ Қазақстан Республикасының аумағында оларды пайдалана отырып жүргізілетін операцияларға қызмет көрсету бойынша қызметке қойылатын талаптарды бекіту туралы

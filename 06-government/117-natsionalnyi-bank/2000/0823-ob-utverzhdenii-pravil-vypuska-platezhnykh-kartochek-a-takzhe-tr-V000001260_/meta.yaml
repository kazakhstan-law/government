  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Национального Банка Республики Казахстан по вопросам платежей и переводов денег и ведения банковских счетов
    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне төлемдер мен ақша аударымдары және банк шоттарын жүргізу мәселелері бойынша өзгерістер енгізу туралы

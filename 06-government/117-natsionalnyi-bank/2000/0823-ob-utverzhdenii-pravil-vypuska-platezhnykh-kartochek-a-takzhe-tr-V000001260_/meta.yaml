  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 августа 2000 года № 331 "Об утверждении Правил выпуска и использования платежных карточек в Республике Казахстан"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасында төлем карточкаларын шығару және пайдалану ережесін бекіту туралы" 2000 жылғы 24 тамыздағы № 331 қаулысына өзгерістер енгізу туралы

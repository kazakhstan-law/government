act_code: '6020'
requisite: Постановление Правления Национального Банка Республики Казахстан от 21 апреля 2000 года N 142. Зарегистрировано в Министерстве юстиции Республики Казахстан 23.05.2000г. N 1136. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 40
title:
  rus: Об утверждении Правил организации и проведения аукционов и конкурсов коммерческих предложений по продаже имущества ликвидируемых банков и страховых (перестраховочных) организаций в Республике Казахстан
  kaz: Қазақстан Республикасындағы таратылатын банктердiң және сақтандыру (қайта сақтандыру) ұйымдарының мүлкiн сату жөнiнде аукциондар мен коммерциялық ұсыныстар конкурсын ұйымдастыру және өткiзу ережесi

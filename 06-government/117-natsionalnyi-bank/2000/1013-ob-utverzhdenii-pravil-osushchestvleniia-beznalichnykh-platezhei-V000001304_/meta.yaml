  title:
    rus: О внесении дополнений в постановление Правления Национального Банка Республики Казахстан от 13 октября 2000 года N 395 "Об утверждении Правил осуществления безналичных платежей и переводов денег на территории Республики Казахстан без открытия банковского счета"
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасының аумағында банктiк есепшот ашпай ақшаның қолма-қол жасалмайтын төлемдерi мен аударымдарын жүзеге асыру ережесiн бекiту туралы" 2000 жылғы 13 қазандағы N 395 қаулысына толықтырулар енгiзу туралы

  title:
    rus: О внесении дополнения в постановление Правления Национального Банка Республики Казахстан от 25 апреля 2000 года N 179 "Об утверждении Правил использования платежных документов и осуществления безналичных платежей и переводов денег на территории Республики Казахстан"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының аумағында төлем құжаттарын пайдалану және ақшаның қолма-қол жасалмайтын төлемдері мен аударымдарын жүзеге асыру ережесін бекіту туралы" 2000 жылғы 25 сәуірдегі N 179 қаулысына толықтыру енгізу туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 25 ноября 2000 года № 428. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 января 2001 года № 1351. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 210 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил установления корреспондентских отношений между банками, а также между банками и организациями, осуществляющими отдельные виды банковских операций
  kaz: Банктер, сондай-ақ банктер мен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар арасында корреспонденттік қатынастар орнату ережесін бекіту туралы

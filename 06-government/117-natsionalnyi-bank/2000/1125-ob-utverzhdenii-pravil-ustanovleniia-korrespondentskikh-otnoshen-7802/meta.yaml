title:
  rus: Об утверждении Правил установления корреспондентских отношений между банками, а также между банками и организациями, осуществляющими отдельные виды банковских операций
  kaz: Банктер, сондай-ақ банктер мен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар арасында корреспонденттік қатынастар орнату ережесін бекіту туралы

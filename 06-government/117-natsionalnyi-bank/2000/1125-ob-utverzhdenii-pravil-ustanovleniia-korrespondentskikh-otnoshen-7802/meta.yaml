  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 25 ноября 2000 года № 428 "Об утверждении Правил установления корреспондентских отношений между банками второго уровня Республики Казахстан, а также между банками второго уровня Республики Казахстан и организациями, осуществляющими отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1351
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 1351 тіркелген Қазақстан Республикасы Ұлттық Банкiнiң "Қазақстан Республикасының екiншi деңгейдегi банктерiнiң арасында, сондай-ақ Қазақстан Республикасының екiншi деңгейдегi банктерi мен банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдарының арасында корреспонденттiк қатынастар орнату ережесiн бекiту туралы" 2000 жылғы 25 қарашадағы N 428 қаулысына өзгерiстер мен толықтырулар енгiзу туралы

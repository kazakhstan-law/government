  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 2 июня 2000 года № 266 "Об утверждении Правил открытия, ведения и закрытия банковских счетов клиентов в банках Республики Казахстан"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының банктерінде клиенттердің банктік шоттарын ашу, жүргізу және жабу ережесін бекіту туралы" 2000 жылғы 2 маусымдағы № 266 қаулысына өзгерістер мен толықтыру енгізу туралы

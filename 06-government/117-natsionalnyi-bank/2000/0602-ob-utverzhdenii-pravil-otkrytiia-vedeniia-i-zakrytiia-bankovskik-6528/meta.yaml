    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне төлемдерді және ақша аударымдарын жүзеге асыру, банк шоттарын ашу, жүргізу және жабу тәртібі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

title:
  rus: Об утверждении Правил открытия, ведения и закрытия банковских счетов клиентов в банках Республики Казахстан
  kaz: Қазақстан Республикасының банктерінде клиенттердің банктік есепшоттарын ашу, жүргізу және жабу ережесін бекіту туралы

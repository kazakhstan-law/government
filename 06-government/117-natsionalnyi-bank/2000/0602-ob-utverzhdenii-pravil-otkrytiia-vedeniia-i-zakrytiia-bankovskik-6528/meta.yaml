  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 2 июня 2000 года № 266 "Об утверждении Инструкции о порядке открытия, ведения и закрытия банковских счетов клиентов в банках Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1199
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде № 1199 тiркелген Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасының банктерiнде клиенттердiң банктiк есеп шоттарын ашу, жүргiзу және жабу тәртiбi туралы нұсқаулықты бекiту туралы" 2000 жылғы 2 маусымдағы № 266 қаулысына өзгерiстер мен толықтырулар енгiзу туралы

    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының банктерінде клиенттердің банктік есепшоттарын ашу, жүргізу және жабу тәртібі туралы нұсқаулықты бекіту туралы" 2000 жылғы 2 маусымдағы № 266 қаулысына өзгерістер мен толықтырулар енгізу туралы

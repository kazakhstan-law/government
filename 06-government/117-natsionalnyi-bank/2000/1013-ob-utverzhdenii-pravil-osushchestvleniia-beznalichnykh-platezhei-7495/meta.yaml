  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 13 октября 2000 года N 395 "Об утверждении Правил осуществления безналичных платежей и переводов денег на территории Республики Казахстан без открытия банковского счета", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1304
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1304 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының аумағында банктік есепшот ашпай ақшаның қолма-қол жасалмайтын төлемдері мен аударымдарын жүзеге асыру ережесін бекіту туралы" 2000 жылғы 13 қазандағы N 395 қаулысына өзгерістер мен толықтырулар енгізу туралы

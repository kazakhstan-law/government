title:
  rus: Об утверждении Правил осуществления безналичных платежей и переводов денег на территории Республики Казахстан без открытия банковского счета
  kaz: Қазақстан Республикасының аумағында банк шотын ашпай қолма-қол жасалмайтын төлемдер мен ақша аударымдарын жүзеге асыру қағидаларын бекіту туралы

act_code: '7400'
requisite: Постановление Правления Национального Банка Республики Казахстан от 9 октября 2000 года № 378. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 ноября 2000 г. за № 1293. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 25 июня 2010 года № 56 (вводится в действие по истечении четырнадцати дней со дня принятия)
title:
  rus: Об утверждении изменений в Правила начисления вознаграждения (интереса) по кредитам, ссудам и депозитам Национального Банка Республики Казахстан, утвержденные постановлением Правления Национального Банка Республики Казахстан от 20 сентября 1999 года № 293
  kaz: Қазақстан Республикасы Ұлттық Банкi Басқармасының 1999 жылғы 20 қыркүйектегi № 293 қаулысымен бекiтiлген Қазақстан Республикасы Ұлттық Банкiнiң кредиттерi, несиелерi және депозиттерi бойынша сыйақы (мүдде) есептеу ережесiне өзгерiстер

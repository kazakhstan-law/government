  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 2 июня 2000 года № 262 "Об утверждении Инструкции о порядке размещения части средств банков во внутренние активы", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1189
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1189 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Банктер қаражатының бір бөлігін ішкі активтерге орналастыру тәртібі туралы нұсқаулықты бекіту туралы" 2000 жылғы 2 маусымдағы N 262 қаулысына өзгерістер мен толықтырулар енгізу туралы

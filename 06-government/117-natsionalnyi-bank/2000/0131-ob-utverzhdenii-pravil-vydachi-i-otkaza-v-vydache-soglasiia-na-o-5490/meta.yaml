  title:
    rus: О внесении дополнений и изменения в постановление Правления Национального Банка Республики Казахстан от 31 января 2000 года N 15 "Об утверждении Правил выдачи и отказа в выдаче согласия на открытие филиалов и представительств страховых (перестраховочных) организаций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1073
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1073 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымдарының филиалдары мен өкілдіктерін ашуға келісім беру және келісім беруден бас тарту ережесін бекіту туралы" 2000 жылғы 31 қаңтардағы N 15 қаулысына толықтырулар мен өзгеріс енгізу туралы

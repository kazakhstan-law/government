  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 27 октября 2003 года N 371 "О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 24 августа 2000 года N 331 "Об утверждении Правил выпуска и использования платежных карточек в Республике Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1260, а также в постановление Правления Национального Банка Республики Казахстан от 23 декабря 2002 года N 510 "Об утверждении Правил функционирования Национальной межбанковской системы платежных карточек на основе микропроцессорных карточек", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2158", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2581
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1260 тіркелген "Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасында төлем карточкаларын шығару және пайдалану ережесін бекіту туралы" 2000 жылғы 24 тамыздағы 331 қаулысына өзгерістер мен толықтырулар енгізу туралы" Қазақстан Республикасының Ұлттық Банкі Басқармасының 2003 жылғы 27 қазандағы N 371 қаулысына, сондай-ақ Қазақстан Республикасының Әділет министрлігінде N 2581 тіркелген "Қазақстан Республикасының Әділет министрлігінде N 2158 тіркелген "Микропроцессорлық карточкалар негізінде төлем карточкаларының ұлттық банкаралық жүйесінің қызмет ету ережесін бекіту туралы" Қазақстан Республикасының Ұлттық Банкі Басқармасының 2002 жылғы 23 желтоқсандағы N 510 қаулысына өзгеріс енгізу туралы

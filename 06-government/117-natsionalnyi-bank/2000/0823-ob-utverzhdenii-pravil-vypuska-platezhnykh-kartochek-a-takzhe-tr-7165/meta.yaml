  title:
    rus: О внесении изменений и дополнений в Правила выпуска и использования платежных карточек в Республике Казахстан, утвержденные постановлением Правления Национального Банка Республики Казахстан от 24 августа 2000 года N 331
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының 2000 жылғы 24 тамыздағы N 331 қаулысымен бекiтiлген Қазақстан Республикасында төлем карточкаларын шығару және пайдалану ережесiне өзгерiстер мен толықтырулар енгiзу туралы

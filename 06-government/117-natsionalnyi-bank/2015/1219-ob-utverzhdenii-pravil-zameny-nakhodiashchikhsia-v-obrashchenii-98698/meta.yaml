title:
  rus: Об утверждении Правил замены находящихся в обращении денежных знаков национальной валюты Республики Казахстан при изменении их дизайна (формы)
  kaz: Қазақстан Республикасының ұлттық валютасының айналыстағы ақша белгiлерiнiң дизайны (нысаны) өзгерген кезде, оларды ауыстыру қағидаларын бекіту туралы

title:
  rus: Об утверждении Правил расчета коэффициентов, характеризующих убыточность (коэффициент убыточности, коэффициент затрат, комбинированный коэффициент) страховой (перестраховочной) организации, филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан
  kaz: Сақтандыру (қайта сақтандыру) ұйымының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының шығындылықты (шығындылық коэффициенті, шығындар коэффициенті, аралас коэффициент) сипаттайтын коэффициенттерін есептеу қағидаларын бекіту туралы

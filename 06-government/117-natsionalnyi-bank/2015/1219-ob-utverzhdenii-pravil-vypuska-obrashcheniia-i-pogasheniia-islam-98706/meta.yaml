act_code: '98706'
requisite: Постановление Правления Национального Банка Республики Казахстан от 19 декабря 2015 года № 251. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 февраля 2016 года № 13006. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2018 года № 298 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил выпуска, обращения и погашения исламских ценных бумаг и их государственной регистрации, рассмотрения отчетов об итогах размещения и погашения, и аннулирования выпуска исламскихценных бумаг, а также Требований к проспекту выпуска исламских ценных бумаг
  kaz: Исламдық бағалы қағаздарды шығару,айналысқа жіберумен өтеу және оларды мемлекеттік тіркеу, орналастыру және өтеу қорытындылары туралы есептерді қарау және исламдық бағалы қағаздар шығарылымының күшін жою қағидаларын, сондай-ақ Исламдық бағалы қағаздардың шығарылымы проспектісіне қойылатын талаптарды бекіту туралы

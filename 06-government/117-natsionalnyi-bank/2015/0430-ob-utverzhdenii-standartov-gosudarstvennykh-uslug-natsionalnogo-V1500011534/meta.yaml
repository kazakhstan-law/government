  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 30 апреля 2015 года № 71 «Об утверждении стандартов государственных услуг Национального Банка Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық Банкінің мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2015 жылғы 30 сәуірдегі № 71 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '91974'
requisite: Постановление Правления Национального Банка Республики Казахстан от 27 мая 2015 года № 90. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 июля 2015 года № 11661
title:
  rus: Об утверждении Правил получения вознаграждения исламской страховой (перестраховочной) организацией, филиалом исламской страховой (перестраховочной) организации-нерезидента Республики Казахстан за управление исламским страховым фондом в виде части страховой премии при заключении договора исламского страхования (перестрахования) и (или) части доходов, полученных от инвестирования средств исламского страхового фонда
  kaz: Исламдық сақтандыру (қайта сақтандыру) ұйымы, Қазақстан Республикасының бейрезиденті-ислам сақтандыру (қайта сақтандыру) ұйымының филиалы исламдық сақтандыру қорын басқарғаны үшін исламдық сақтандыру (қайта сақтандыру) шартын жасасқан кезде сақтандыру сыйлықақысының бір бөлігі және (немесе) исламдық сақтандыру қорының қаражатын инвестициялаудан алынған кірістердің бір бөлігі түрінде сыйақы алу қағидаларын бекіту туралы

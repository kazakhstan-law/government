  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 19 декабря 2015 года № 249 «Об утверждении Требований к организационной структуре организатора торгов и составу листинговой комиссии фондовой биржи, а также Правил осуществления деятельности структурного подразделения организатора торгов, осуществляющего деятельность по надзору за совершаемыми сделками в торговой системе фондовой биржи»
    kaz: «Сауда-саттықты ұйымдастырушының ұйымдық құрылымына және қор биржасының листинг комиссиясының құрамына қойылатын талаптарды, сондай-ақ Қор биржасының сауда жүйесінде жасалатын мәмілелерді қадағалау жөніндегі қызметті жүзеге асыратын сауда-саттықты ұйымдастырушының құрылымдық бөлімшесінің қызметін жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2015 жылғы 19 желтоқсандағы № 249 қаулысына өзгерістер енгізу туралы

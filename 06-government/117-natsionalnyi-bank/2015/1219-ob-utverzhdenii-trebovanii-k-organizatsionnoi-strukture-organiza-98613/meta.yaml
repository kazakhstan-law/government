requisite: Постановление Правления Национального Банка Республики Казахстан от 19 декабря 2015 года № 249. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 февраля 2016 года № 12998
title:
  rus: Об утверждении Требований к организационной структуре организатора торгов и составу листинговой комиссии фондовой биржи, а также Правил осуществления деятельности структурного подразделения организатора торгов, осуществляющего деятельность по надзору за совершаемыми сделками в торговой системе фондовой биржи
  kaz: Сауда-саттықты ұйымдастырушының ұйымдық құрылымына және қор биржасының листинг комиссиясының құрамына қойылатын талаптарды, сондай-ақ Қор биржасының сауда жүйесінде жасалатын мәмілелерді қадағалау жөніндегі қызметті жүзеге асыратын сауда-саттықты ұйымдастырушының құрылымдық бөлімшесінің қызметін жүзеге асыру қағидаларын бекіту туралы

title:
  rus: Об утверждении Правил проведения операций с переводными и простыми векселями банками второго уровня, филиалами банков-нерезидентов Республики Казахстан и организациями, осуществляющими отдельные виды банковских операций
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент банктері филиалдарының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың аударым және жай вексельдермен операциялар жүргізу қағидаларын бекіту туралы

title:
  rus: Об утверждении перечня, форм, сроков отчетности об остатках на балансовых и внебалансовых счетах банков второго уровня и ипотечных организаций и Правил их представления
  kaz: Екінші деңгейдегі банктердің және ипотекалық ұйымдардың баланстық және баланстан тыс шоттарындағы қалдықтар туралы есептіліктің тізбесін, нысандарын, мерзімдерін және оларды ұсыну қағидаларын бекіту туралы

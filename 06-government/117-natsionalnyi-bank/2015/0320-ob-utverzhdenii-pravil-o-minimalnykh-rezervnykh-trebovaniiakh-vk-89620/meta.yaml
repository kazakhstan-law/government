  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 20 марта 2015 года № 38 «Об утверждении Правил о минимальных резервных требованиях, включая структуру обязательств банков, принимаемых для расчета, условия выполнения минимальных резервных требований, порядок резервирования»
    kaz: «Банктердің есеп айырысу үшін қабылдайтын міндеттемелерінің құрылымын, ең төменгі резервтік талаптарды орындау шарттарын, резервке қою тәртібін қоса алғанда, ең төменгі резервтік талаптар туралы қағидаларды бекіту туралы» Қазақстан Республикасының Ұлттық Банкі Басқармасының 2015 жылғы 20 наурыздағы № 38 қаулысына өзгерістер енгізу туралы

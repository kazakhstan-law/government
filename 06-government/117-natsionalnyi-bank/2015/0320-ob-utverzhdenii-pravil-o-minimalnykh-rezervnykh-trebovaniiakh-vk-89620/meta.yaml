act_code: '89620'
requisite: Постановление Правления Национального Банка Республики Казахстан от 20 марта 2015 года № 38. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 апреля 2015 года № 10776. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 229 (вводится в действие с 28 января 2020 года)
title:
  rus: Об утверждении Правил о минимальных резервных требованиях, включая структуру обязательств банков, принимаемых для расчета, условия выполнения минимальных резервных требований, порядок резервирования
  kaz: Банктердің ең төмен резервтік талаптарды есептеу үшін қабылданатын міндеттемелерінің құрылымын қоса алғанда, ең төмен резервтік талаптар туралы қағидаларды, ең төмен резервтік талаптарды есептеу, ең төмен резервтік талаптардың нормативтерін орындау, ең төмен резервтік талаптарды резервтеу және олардың нормативтерінің орындалуын бақылауды жүзеге асыру тәртібін бекіту туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 20 марта 2015 года № 38 «Об утверждении Правил о минимальных резервных требованиях, включая структуру обязательств банков, принимаемых для расчета минимальных резервных требований, порядок расчета минимальных резервных требований, выполнения нормативов минимальных резервных требований, резервирования и осуществления контроля за выполнением нормативов минимальных резервных требований»
    kaz: «Банктердің ең төмен резервтік талаптарды есептеу үшін қабылданатын міндеттемелерінің құрылымын қоса алғанда, ең төмен резервтік талаптар туралы қағидаларды, ең төмен резервтік талаптарды есептеу, ең төмен резервтік талаптардың нормативтерін орындау, ең төмен резервтік талаптарды резервтеу және олардың нормативтерінің орындалуын бақылауды жүзеге асыру тәртібін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2015 жылғы 20 наурыздағы № 38 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/118356/rus

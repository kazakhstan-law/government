requisite: Постановление Правления Национального Банка Республики Казахстан от 8 мая 2015 года № 77. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 мая 2015 года № 11158. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 апреля 2026 года № 58 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения операции по одновременной передаче активов и обязательств банка в части либо в полном размере другому (другим) банку (банкам), в том числе операции по одновременной передаче активов и обязательств между родительским банком и дочерним банком, и согласования уполномоченным органом данных операций, а также видов активов и обязательств, подлежащих передаче при проведении указанных операций
  kaz: Банк активтері мен міндеттемелерінің бір бөлігін не оларды толық мөлшерде басқа банкке (банктерге) бір мезгілде беру жөніндегі операцияны, оның ішінде бас банк пен еншілес банк арасындағы активтер мен міндеттемелерді бір мезгілде беру жөніндегі операцияны жүргізу және уәкілетті органның осы операцияларды келісу қағидаларын, сондай-ақ көрсетілген операцияларды жүргізу кезінде беруге жататын активтер мен міндеттемелердің түрлерін бекіту туралы

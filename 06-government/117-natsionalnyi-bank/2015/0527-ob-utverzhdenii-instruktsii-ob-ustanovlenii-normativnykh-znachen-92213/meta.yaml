requisite: Постановление Правления Национального Банка Республики Казахстан от 27 мая 2015 года № 95. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 июля 2015 года № 11751. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 января 2019 года № 14 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции об установлении нормативных значений и методики расчетов пруденциальных нормативов исламской страховой (перестраховочной) организации и иных обязательных к соблюдению норм и лимитов
  kaz: Исламдық сақтандыру (қайта сақтандыру) ұйымының нормативтік мәндері мен пруденциялық нормативтерді есептеу әдістемесін және сақталуы міндетті өзге де нормалар мен лимиттерді белгілеу жөніндегі нұсқаулықты бекіту туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 8 мая 2015 года № 75 «Об утверждении перечня, форм, сроков отчетности о выполнении пруденциальных нормативов банками второго уровня и Правил их представления»

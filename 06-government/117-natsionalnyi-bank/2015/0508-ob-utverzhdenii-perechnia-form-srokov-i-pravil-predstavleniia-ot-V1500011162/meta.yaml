  requisite: Постановление Правления Национального Банка Республики Казахстан от 24 декабря 2024 года № 79. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 декабря 2024 года № 35551. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2025 года № 100 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановления Правления Национального Банка Республики Казахстан от 8 мая 2015 года № 75 «Об утверждении перечня, форм, сроков и Правил представления отчетности о выполнении пруденциальных нормативов банками второго уровня» и от 2 марта 2021 года № 23 «Об утверждении перечня, форм, сроков и Правил представления отчетности о выполнении пруденциальных нормативов филиалами банков-нерезидентов Республики Казахстан (в том числе филиалов исламских банков-нерезидентов Республики Казахстан)»
    kaz: «Екінші деңгейдегі банктердің пруденциялық нормативтердің орындалуы туралы есептілігінің тізбесін, нысандарын, ұсыну мерзімдері мен қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2015 жылғы 8 мамырдағы № 75 және «Қазақстан Республикасы бейрезидент-банктері филиалдарының (оның ішінде Қазақстан Республикасы бейрезидент-ислам банктері филиалдарының) пруденциялық нормативтерді орындауы туралы есептіліктің тізбесін, нысандарын, мерзімдерін және оларды ұсыну қағидаларын бекіту туралы»  2021 жылғы 2 наурыздағы № 23 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/205148/rus

requisite: Постановление Правления Национального Банка Республики Казахстан от 27 мая 2015 года № 91. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 июля 2015 года № 11669. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 сентября 2018 года № 228 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к использованию информационно-коммуникационных технологий и обеспечению информационной безопасности при организации деятельности кредитных бюро, поставщиков информации и получателей кредитных отчетов
  kaz: Кредиттік бюролардың, ақпарат берушілердің және кредиттік есептерді алушылардың қызметін ұйымдастыру кезінде ақпараттық-коммуникациялық технологияларды пайдалануға және ақпараттық қауіпсіздікті қамтамасыз етуге қойылатын талаптарды бекіту туралы

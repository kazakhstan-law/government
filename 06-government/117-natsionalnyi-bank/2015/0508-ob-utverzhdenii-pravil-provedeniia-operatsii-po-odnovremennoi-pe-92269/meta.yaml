  code: '112546'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 28 апреля 2017 года № 73. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 июня 2017 года № 15190. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 апреля 2026 года № 58 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 8 мая 2015 года № 77 «Об утверждении Правил проведения операции по одновременной передаче активов и обязательств банка в части либо в полном размере другому (другим) банку (банкам), в том числе операции по одновременной передаче активов и обязательств между родительским банком и дочерним банком, в отношении которого была проведена реструктуризация, и согласования уполномоченным органом данных операций, а также видов активов и обязательств, подлежащих передаче при проведении указанных операций»
    kaz: «Банк активтерінің және міндеттемелерінің бір бөлігін не оларды толық мөлшерде басқа банкке (банктерге) бірмезгілде беру жөніндегі операцияны, оның ішінде бас банк пен оған қатысты қайта құрылымдау жүргізілген еншілес банк арасында активтер мен міндеттемелерді бірмезгілде беру жөніндегі операцияны жүргізу және уәкілетті органның осы операцияларды келісу қағидаларын, сондай-ақ көрсетілген операцияларды жүргізу кезінде беруге жататын активтер мен міндеттемелердің түрлерін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2015 жылғы 8 мамырдағы № 77 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/112546/rus

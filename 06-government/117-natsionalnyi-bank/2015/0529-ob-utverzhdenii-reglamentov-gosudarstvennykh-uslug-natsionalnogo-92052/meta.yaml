  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 29 мая 2015 года № 96 "Об утверждении регламентов государственных услуг Национального Банка Республики Казахстан"
    kaz: '"Қазақстан Республикасы Ұлттық Банкінің мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы" Қазақстан Республикасы Ұлттық Банкі Басқармасының 2015 жылғы 29 мамырдағы № 96 қаулысына өзгерістер мен толықтырулар енгізу туралы'

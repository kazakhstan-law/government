  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 19 декабря 2015 года № 237 «Об утверждении Правил приобретения товаров, работ и услуг Национальным Банком Республики Казахстан, его ведомствами, организациями, входящими в его структуру, и юридическими лицами, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых  принадлежат Национальному Банку Республики Казахстан или находятся в его доверительном управлении, и аффилиированными с ними юридическими лицами»
    kaz: «Қазақстан Республикасы Ұлттық Банкінің, оның ведомстволарының, оның құрылымына кіретін ұйымдардың және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан да көп пайызы Қазақстан Республикасының Ұлттық Банкіне тиесілі немесе оның сенімгерлік басқаруындағы заңды тұлғалардың және олармен үлестес заңды тұлғалардың тауарларды, жұмыстарды және көрсетілетін қызметтерді иеленуі қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2015 жылғы 19 желтоқсандағы № 237 қаулысына өзгерістер енгізу туралы

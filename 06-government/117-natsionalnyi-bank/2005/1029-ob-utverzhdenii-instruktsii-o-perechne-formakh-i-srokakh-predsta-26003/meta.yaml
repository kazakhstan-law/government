title:
  rus: Об утверждении Инструкции о перечне, формах и сроках представления уполномоченными банками отчетности по источникам спроса и предложения на внутреннем валютном рынке
  kaz: Уәкілетті банктердің ішкі валюта нарығында сұраныс пен ұсыныс көздері бойынша есеп беру тізбесі, нысандары және ұсыну мерзімдері туралы нұсқаулықты бекіту жөнінде

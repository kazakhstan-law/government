title:
  rus: Об утверждении Инструкции по ведению бухгалтерского учета операций с приобретенными долговыми ценными бумагами, осуществляемых отдельными субъектами финансового рынка Республики Казахстан
  kaz: Қазақстан Республикасы қаржы нарығының жекелеген субъектілері жүзеге асыратын сатып алынған борыштық бағалы қағаздармен операциялардың бухгалтерлік есебін жүргізу жөніндегі нұсқаулықты бекіту туралы

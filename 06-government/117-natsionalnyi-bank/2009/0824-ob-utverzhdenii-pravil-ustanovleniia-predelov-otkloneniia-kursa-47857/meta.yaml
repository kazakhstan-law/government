  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 августа 2009 года № 78 "Об утверждении Правил установления пределов отклонения курса покупки от курса продажи иностранной валюты за тенге по операциям, проводимым через обменные пункты" и установлении пределов отклонения курса покупки от курса продажи долларов США и евро за тенге по операциям, проводимым через обменные пункты
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Айырбастау пункттері арқылы жүргізілетін операциялар бойынша шетел валютасын теңгеге сатып алу бағамының сату бағамынан ауытқу шектерін белгілеу ережесін бекіту туралы" 2009 жылғы 24 тамыздағы № 78 қаулысына өзгерістер енгізу және айырбастау пункттері арқылы жүргізілетін операциялар бойынша АҚШ долларын және еуроны теңгеге сатып алу бағамының сату бағамынан ауытқу шектерін белгілеу туралы
  link: https://zan.gov.kz/client/#!/doc/86245/rus

requisite: Постановление Правления Национального Банка Республики Казахстан от 29 декабря 2009 года № 122. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 февраля 2010 года № 6043. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 258
title:
  rus: О минимальном размере уставного капитала юридических лиц, осуществляющих на основании лицензии Национального Банка Республики Казахстан операции по инкассации банкнот, монет и ценностей
  kaz: Қазақстан Республикасы Ұлттық Банкінің лицензиясы негізінде банкноттарды, монеталарды және құндылықтарды инкассациялау жөніндегі операцияларды жүзеге асыратын заңды тұлғалардың жарғылық капиталының ең аз мөлшері туралы

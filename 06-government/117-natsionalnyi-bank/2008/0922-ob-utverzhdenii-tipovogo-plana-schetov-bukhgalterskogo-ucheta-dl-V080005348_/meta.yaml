  requisite: Постановление Правления Национального Банка Республики Казахстан от 26 июля 2013 года № 194. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 сентября 2013 года № 8701
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Национального Банка Республики Казахстан по вопросам бухгалтерского учета единого накопительного пенсионного фонда и добровольных накопительных пенсионных фондов
    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне бірыңғай жинақтаушы зейнетақы қорының және ерікті жинақтаушы зейнетақы қорларының бухгалтерлік есебі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  requisite: Постановление Правления Национального Банка Республики Казахстан от 21 сентября 2020 года № 109. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 сентября 2020 года № 21275
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 22 сентября 2008 года № 79 «Об утверждении Типового плана счетов бухгалтерского учета для отдельных субъектов финансового рынка Республики Казахстан» и постановление Правления Национального Банка Республики Казахстан от 1 июля 2011 года № 68 «Об утверждении Инструкции по ведению бухгалтерского учета отдельными субъектами финансового рынка
    kaz: Қазақстан Республикасы қаржы нарығының жекелеген субъектілеріне арналған бухгалтерлік есептің үлгі шот жоспарын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2008 жылғы 22 қыркүйектегі № 79 қаулысына және «Қаржы нарығының жекелеген субъектілерінің бухгалтерлік есепті жүргізуі жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2011 жылғы 1 шілдедегі № 68 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/146690/rus

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Национального Банка Республики Казахстан по вопросам бухгалтерского учета и финансовой отчетности микрофинансовых организаций
    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне микроқаржы ұйымдарының бухгалтерлік есебі және қаржылық есептілігі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты, регулирующие вопросы осуществления бухгалтерского учета и составления финансовой отчетности
    kaz: Бухгалтерлік есепті жүргізу және қаржылық есептілікті жасау мәселелерін реттейтін кейбір нормативтік құқықтық актілерге өзгерістер мен толықтырулар енгізу туралы

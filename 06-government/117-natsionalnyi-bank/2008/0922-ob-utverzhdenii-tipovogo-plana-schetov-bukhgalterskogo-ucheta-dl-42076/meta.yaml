  title:
    rus: О внесении дополнений и изменений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам бухгалтерского учета и составления финансовой отчетности исламскими специальными финансовыми компаниями
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына исламдық арнайы қаржы компанияларының бухгалтерлік есебі және қаржылық есептілікті жасауы мәселелері жөнінде толықтырулар мен өзгерістер енгізу туралы

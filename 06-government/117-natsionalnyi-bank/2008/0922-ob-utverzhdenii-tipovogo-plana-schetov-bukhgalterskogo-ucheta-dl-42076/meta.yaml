title:
  rus: Об утверждении Типового плана счетов бухгалтерского учета для отдельных субъектов финансового рынка Республики Казахстан
  kaz: Қазақстан Республикасы қаржы нарығының жекелеген субъектілеріне арналған бухгалтерлік есептің үлгі шот жоспарын бекіту туралы

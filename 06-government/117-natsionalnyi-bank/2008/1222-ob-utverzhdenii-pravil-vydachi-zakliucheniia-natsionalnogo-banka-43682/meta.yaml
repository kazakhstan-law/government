act_code: '43682'
requisite: Постановление Правления Национального Банка Республики Казахстан от 22 декабря 2008 года № 112. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 января 2009 года № 5504. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 272
title:
  rus: Об утверждении Правил выдачи заключения Национального Банка Республики Казахстан о наличии автоматизированной банковской системы, отвечающей требованиям, предъявляемым к автоматизации бухгалтерского учета и Главной бухгалтерской книги
  kaz: Ұлттық Банктің бухгалтерлік есепті және бас бухгалтерлік кітапты автоматтандыруға қойылатын талаптарға сәйкес келетін автоматтандырылған банк жүйесінің Бас болуы туралы қорытынды беру ережесін бекіту туралы

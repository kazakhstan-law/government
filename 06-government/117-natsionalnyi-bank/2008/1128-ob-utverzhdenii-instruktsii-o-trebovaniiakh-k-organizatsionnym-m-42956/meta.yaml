act_code: '42956'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 ноября 2008 года № 95. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 декабря 2008 года № 5411. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 269
title:
  rus: Об утверждении Инструкции о требованиях к организационным мерам и программно-техническим средствам, обеспечивающим доступ банков и организаций, осуществляющих отдельные виды банковских операций, в платежные системы Республиканского государственного предприятия на праве хозяйственного ведения "Казахстанский центр межбанковских расчетов Национального Банка Республики Казахстан"
  kaz: Банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың "Қазақстан Республикасы Ұлттық Банкінің Қазақстан банкаралық есеп айырысу орталығы" шаруашылық жүргізу құқығы бар республикалық мемлекеттік кәсіпорнының төлем жүйелеріне кіруін қамтамасыз ететін ұйымдастыру шараларына және бағдарламалық-техникалық құралдарға қойылатын талаптар туралы нұсқаулықты бекіту жөнінде

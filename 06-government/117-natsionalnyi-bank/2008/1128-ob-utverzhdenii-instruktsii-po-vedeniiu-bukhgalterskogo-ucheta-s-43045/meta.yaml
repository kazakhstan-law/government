title:
  rus: Об утверждении Инструкции по ведению бухгалтерского учета специальными финансовыми компаниями
  kaz: Арнайы қаржы компанияларының бухгалтерлік есеп жүргізуі жөніндегі нұсқаулықты бекіту туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 16 июля 2024 года № 43. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 июля 2024 года № 34772. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 25 августа 2025 года № 54 (вводится в действие после дня его первого официального опубликования, но не ранее 31 августа 2025 года)
title:
  rus: Об утверждении Требований к порядку осуществления деятельности центра обмена данными по платежным транзакциям с признаками мошенничества и его взаимодействия с лицами, участвующими в его деятельности
  kaz: Алаяқтық белгілері бар төлем транзакциялары бойынша деректер алмасу орталығының қызметін жүзеге асыру және оның қызметіне қатысатын тұлғалармен өзара іс-қимыл тәртібіне қойылатын талаптарды бекіту туралы

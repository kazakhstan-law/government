    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасы Ұлттық қорының активтерін сыртқы басқарушыларды таңдау ережесін бекіту туралы" 2006 жылғы 25 шілдедегі № 66 қаулысына өзгерістер мен толықтыру енгізу туралы

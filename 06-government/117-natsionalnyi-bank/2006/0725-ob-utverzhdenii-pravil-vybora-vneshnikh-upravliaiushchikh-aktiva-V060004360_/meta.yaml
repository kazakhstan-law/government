  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 25 июля 2006 года № 66 "Об утверждении Правил выбора внешних управляющих активами Национального фонда Республики Казахстан"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасы Ұлттық қорының активтерін сыртқы басқарушыларды таңдау ережесін бекіту туралы" 2006 жылғы 25 шілдедегі № 66 қаулысына өзгерістер мен толықтырулар енгізу туралы

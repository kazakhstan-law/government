    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына банк клиентінің банк шоты нөмірінің және банктік сәйкестендіру кодының жаңа құрылымына көшу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

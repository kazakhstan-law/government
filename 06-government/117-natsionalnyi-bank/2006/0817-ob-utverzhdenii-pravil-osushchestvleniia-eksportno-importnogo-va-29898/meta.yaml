title:
  rus: Об утверждении Правил осуществления экспортно-импортного валютного контроля в Республике Казахстан
  kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасында экспорт-импорт валюта бақылауын, ұйымдастыру туралы нұсқаулықты бекiту туралы" 2001 жылғы 5 қыркүйектегi N 343 қаулысына өзгерiс енгiзу және Қазақстан Республикасында экспорт-импорт валюта бақылауын жүзеге асыру ережесiн бекiту туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 25 июля 2006 года № 65 «Об утверждении Правил осуществления инвестиционных операций Национального фонда Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қорының инвестициялық операцияларын жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2006 жылғы 25 шілдедегі № 65 қаулысына өзгерістер мен толықтырулар енгізу туралы

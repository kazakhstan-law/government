  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 25 июля 2006 года № 65 «Об утверждении Правил осуществления инвестиционных операций Национального фонда Республики Казахстан»
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының «Қазақстан Республикасы Ұлттық қорының инвестициялық операцияларын жүзеге асыру ережесін бекіту туралы» 2006 жылғы 25 шілдедегі № 65 қаулысына өзгеріс енгізу туралы

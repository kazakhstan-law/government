  requisite: Постановление Правления Национального Банка Республики Казахстан от 24 июля 2009 года № 65. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 ноября 2009 года № 5843. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231 (вводится в действие с 1 января 2020 года)
  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам применения при проведении кассовых операций автоматизированной кассы и организации охраны, устройства помещений банков второго уровня и организаций, осуществляющих отдельные виды банковских операций
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына кассалық операцияларды жүргізу кезінде автоматтандырылған кассаны қолдану және екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың үй-жайларын күзетуді, жайластыруды ұйымдастыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

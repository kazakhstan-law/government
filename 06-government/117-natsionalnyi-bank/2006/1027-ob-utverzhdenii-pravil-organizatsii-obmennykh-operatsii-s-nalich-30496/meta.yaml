title:
  rus: Об утверждении Правил организации обменных операций с наличной иностранной валютой в Республике Казахстан
  kaz: Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру ережесін бекіту туралы

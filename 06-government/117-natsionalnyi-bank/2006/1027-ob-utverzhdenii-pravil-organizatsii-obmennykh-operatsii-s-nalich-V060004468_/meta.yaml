  requisite: Постановление Правления Национального Банка Республики Казахстан от 30 ноября 2009 года № 108. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 января 2010 года № 6008. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 144 (вводится в действие по истечении двадцати одного календарного дня после дня его официального опубликования, но не ранее 21 ноября 2014 года)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 27 октября 2006 года № 106 "Об утверждении Правил организации обменных операций с наличной иностранной валютой в Республике Казахстан"
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының «Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру ережесін бекіту туралы» 2006 жылғы 27 қазандағы № 106 қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменении и дополнений в постановление Правления Национального Банка Республики Казахстан от 29 мая 2003 года N 179 "Об утверждении Правил представления отчетности юридическими лицами, осуществляющими инвестиционное управление пенсионными активами", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2394
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 2394 тiркелген Қазақстан Республикасының Ұлттық Банкi Басқармасының "Зейнетақы активтерiн инвестициялық басқаруды жүзеге асыратын заңды тұлғалардың есеп беру ережесiн бекiту туралы" 2003 жылғы 29 мамырдағы N 179 қаулысына өзгерiстер мен толықтырулар енгiзу туралы

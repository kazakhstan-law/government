  requisite: Постановление Правления Национального Банка Республики Казахстан от 22 июля 2004 года N 98. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2004 года N 3033. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 206
  title:
    rus: О внесении изменения и дополнений в постановление Правления Национального Банка Республики Казахстан от 25 июля 2003 года N 236 "О размере лимита платежей по корреспондентским счетам банков второго уровня Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2461
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2461 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының екінші деңгейдегі банктерінің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың корреспонденттік шоттары бойынша төлем лимитінің мөлшері туралы" 2003 жылғы 25 шілдедегі N 236 қаулысына өзгеріс пен толықтыруларды енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/21053/rus

act_code: '16803'
requisite: Постановление Правления Национального Банка Республики Казахстан от 25 июля 2003 года N 236. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 августа 2003 года N 2461. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 206
title:
  rus: О размере лимита платежей и переводов денег по корреспондентским счетам банков и организаций, осуществляющих отдельные виды банковских операций
  kaz: Банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың корреспонденттік шоттары бойынша төлем лимитінің және ақша аударымдарының мөлшері туралы

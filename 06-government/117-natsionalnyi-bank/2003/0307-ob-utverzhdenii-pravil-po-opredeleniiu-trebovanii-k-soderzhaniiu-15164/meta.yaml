  code: '20373'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 мая 2004 года N 143. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 июня 2004 года N 2921. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года N 11 (V064076).
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 7 марта 2003 года N 77 "Об утверждении Правил по определению требований к содержанию документов, представляемых для получения лицензии на право осуществления страховой деятельности, а также по переоформлению лицензии", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2240
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2240 тіркелген "Сақтандыру қызметін жүзеге асыру құқығына лицензия алуға, сондай-ақ лицензияларды қайта ресімдеуге ұсынылатын құжаттардың мазмұнына қойылатын талаптарды белгілеу жөніндегі ережені бекіту туралы" Қазақстан Республикасының Ұлттық Банкі Басқармасының 2003 жылғы 7 наурыздағы N 77 қаулысына өзгерістер мен толықтырулар енгізу туралы

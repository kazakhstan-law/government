act_code: '15164'
requisite: Постановление Правления Национального Банка Республики Казахстан от 7 марта 2003 года N 77. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 апреля 2003 года N 2240. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года N 11 (V064076).
title:
  rus: Об утверждении Правил по определению требований к содержанию документов, представляемых для получения лицензии на право осуществления страховой деятельности, а также по переоформлению лицензии
  kaz: Сақтандыру қызметін жүзеге асыру құқығына лицензия алу үшін ұсынылатын құжаттардың мазмұнына қойылатын талаптарды айқындау, сондай-ақ лицензияны қайта ресімдеу жөніндегі ережені бекіту туралы

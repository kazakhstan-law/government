requisite: Постановление Правления Национального Банка Республики Казахстан от 27 октября 2003 года N 384. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 ноября 2003 года N 2579. Утратило силу постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27 мая 2006 года N 117
title:
  rus: Об утверждении Инструкции о требованиях, предъявляемых к заявителю, и перечне документов, прилагаемых к заявлению о выдаче лицензии на проведение аудита банков, страховых (перестраховочных) организаций и накопительных пенсионных фондов
  kaz: Өтініш берушіге қойылатын талаптар және банктердің, сақтандыру (қайта сақтандыру) ұйымдарының және жинақтаушы зейнетақы қорларының аудитін жүргізуге лицензия беру туралы өтінішке қоса берілетін құжаттардың тізбесі туралы нұсқаулықты бекіту туралы

  title:
    rus: О внесении дополнений и изменений в постановление Правления Национального Банка Республики Казахстан от 27 октября 2003 года N 384 "Об утверждении Инструкции о требованиях, предъявляемых к заявителю, и перечне документов, прилагаемых к заявлению о выдаче лицензии на проведение аудита банков, страховых (перестраховочных) организаций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2579
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2579 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Өтініш берушіге қойылатын талаптар және банктердің, сақтандыру (қайта сақтандыру) ұйымдарының аудитін жүргізуге лицензия беру туралы өтінішке қоса берілетін құжаттардың тізбесі туралы нұсқаулықты бекіту туралы" 2003 жылғы 27 қазандағы N 384 қаулысына толықтырулар мен өзгерістер енгізу туралы

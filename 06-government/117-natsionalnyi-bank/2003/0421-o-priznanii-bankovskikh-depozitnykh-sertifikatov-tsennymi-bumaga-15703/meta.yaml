  title:
    rus: Об утверждении Правил выпуска и обращения банковских депозитных сертификатов и внесении изменения в постановление Правления Национального Банка Республики Казахстан от 21 апреля 2003 года N 140 "О признании банковских депозитных сертификатов ценными бумагами и внесении изменения в постановление Правления Национального Банка Республики Казахстан от 2 июня 2000 года N 266 "Об утверждении Инструкции о порядке открытия, ведения и закрытия банковских счетов клиентов в банках Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1199", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2343
    kaz: Банктiк депозиттiк сертификаттарды шығару және айналымға жiберу ережесiн бекiту және Қазақстан Республикасының Әдiлет министрлiгiнде N 343 тiркелген, "Банктiк депозиттiк сертификаттарды бағалы қағаздар деп тану және Қазақстан Республикасының Әдiлет министрлiгiнде N 1199 тiркелген, "Қазақстан Республикасының банктерiнде клиенттердiң банктiк шоттарын ашу, жүргiзу және жабу тәртiбi туралы нұсқаулықты бекiту туралы" Қазақстан Республикасының Ұлттық Банкi Басқармасының 2000 жылғы 2 маусымдағы N 266 қаулысына өзгерiс енгiзу туралы" Қазақстан Республикасының Ұлттық Банкi Басқармасының 2003 жылғы 21 сәуiрдегi N 140 қаулысына өзгерiс енгiзу туралы

act_code: '15703'
requisite: Постановление Правления Национального Банка Республики Казахстан от 21 апреля 2003 года N 140. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 июня 2003 года N 2343. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 декабря 2017 года № 264 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О признании банковских депозитных сертификатов ценными бумагами и внесении изменения в постановление Правления Национального Банка Республики Казахстан от 2 июня 2000 года N 266 "Об утверждении Инструкции о порядке открытия, ведения и закрытия банковских счетов клиентов в банках Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1199
  kaz: Банктiк депозиттiк сертификаттарды бағалы қағаздар деп тану және Қазақстан Республикасының Әдiлет министрлiгiнде N 1199 тiркелген Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасының банктерiнде клиенттердiң банктiк шоттарын ашу, жүргiзу және жабу тәртiбi туралы нұсқаулықты бекiту туралы" 2000 жылғы 2 маусымдағы N 266 қаулысына өзгерiс енгiзу туралы

  code: '34917'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 июля 2007 года № 207. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 августа 2007 года № 4891. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 88
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 12 ноября 2003 года № 397 "Об утверждении Правил исполнения представителем держателей облигаций своих функций и обязанностей, о порядке и случаях досрочного прекращения его полномочий, а также о требованиях к содержанию договора о представлении интересов держателей облигаций, заключаемого между эмитентом и представителем держателей облигаций"
    kaz: Қазақстан Республикасы Ұлттық Банк Басқармасының "Облигациялар ұстаушылар өкілінің өз функциялары мен міндеттерін орындау, оның өкілеттіктерін мерзімінен бұрын тоқтату тәртібі және жағдайлары туралы, сондай-ақ эмитент пен облигациялар ұстанушылардың өкілі арасында жасалатын облигациялар ұстанушылардың мүдделерін білдіру туралы шарттың мазмұнына қойылатын талаптар туралы ережені бекіту жөнінде" 2003 жылғы 12 қарашадағы N 397 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/34917/rus

  title:
    rus: О внесении дополнений и изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам рынка ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығы мәселелері бойынша толықтырулар мен өзгерістер енгізу туралы

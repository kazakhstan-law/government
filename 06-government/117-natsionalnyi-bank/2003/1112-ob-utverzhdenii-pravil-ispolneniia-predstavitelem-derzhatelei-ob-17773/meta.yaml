act_code: '17773'
requisite: Постановление Правления Национального Банка Республики Казахстан от 12 ноября 2003 года № 397. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 декабря 2003 года № 2603. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 88
title:
  rus: Об утверждении Правил исполнения представителем держателей облигаций своих функций и обязанностей, о порядке и случаях досрочного прекращения его полномочий, а также о требованиях к содержанию договора о представлении интересов держателей облигаций, заключаемого между эмитентом и представителем держателей облигаций
  kaz: Облигациялар ұстаушылар өкілінің өз функциялары мен міндеттерін орындау, оның өкілеттіктерін мерзімінен бұрын тоқтату тәртібі және жағдайлары туралы, сондай-ақ эмитент пен облигациялар ұстаушылардың өкілі арасында жасалатын облигациялар ұстаушылардың мүдделерін білдіру туралы шарттың мазмұнына қойылатын талаптар туралы ережені бекіту жөнінде

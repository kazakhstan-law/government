requisite: Постановление Правления Национального Банка Республики Казахстан от 2 декабря 2003 года № 414. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 декабря 2003 года № 2626. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору фин.рынка и фин.организаций от 27 августа 2005 года № 311
title:
  rus: О требованиях по размеру тиража и регионам распространения печатных изданий, которые субъекты рынка ценных бумаг должны использовать для публикации своих извещений и другой информации, подлежащей обязательному опубликованию
  kaz: Бағалы қағаздар рыногының субъектілері өздерінің хабарлары мен міндетті түрде жариялауға жататын басқа ақпаратын жариялау үшін пайдалануы тиіс баспасөз басылымдарының таралым мөлшеріне және тарату аймақтары бойынша қойылатын талаптар туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 27 октября 2003 года N 378. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 декабря 2003 года N 2584. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года N 159 (V042955)
title:

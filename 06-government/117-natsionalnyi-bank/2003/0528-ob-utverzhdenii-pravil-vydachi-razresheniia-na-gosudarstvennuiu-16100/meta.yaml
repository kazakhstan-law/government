  code: '21486'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года N 242. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 октября 2004 года N 3132. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года N 123
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 29 мая 2003 года N 176 "Об утверждении Правил выдачи разрешения на государственную регистрацию накопительных пенсионных фондов в органах юстиции, а также изменений и дополнении в их учредительные документы, зарегистрированное в Министерстве юстиции Республики Казахстан под N 2386
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 2386 тiркелген Қазақстан Республикасы Ұлттық Банкi Басқармасының "Жинақтаушы зейнетақы қорларын, сондай-ақ олардың құрылтай құжаттарына өзгерiстер мен толықтыруларды әдiлет органдарында мемлекеттiк тiркеуге рұқсат беру ережесiн бекiту туралы" 2003 жылғы 29 мамырдағы N 176 қаулысына өзгерiстер мен толықтырулар енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/21486/rus

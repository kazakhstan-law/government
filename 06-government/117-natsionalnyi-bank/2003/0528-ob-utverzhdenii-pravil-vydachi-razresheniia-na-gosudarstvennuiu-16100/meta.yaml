  code: '26536'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года № 10. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 февраля 2006 года № 4072. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 123
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 мая 2003 года № 176 "Об утверждении Правил выдачи разрешения на государственную регистрацию накопительных пенсионных фондов в органах юстиции, изменений и дополнений в их учредительные документы, выдачи согласия на открытие филиалов и представительств накопительных пенсионных фондов"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Жинақтаушы зейнетақы қорларын, олардың құрылтай құжаттарына, жинақтаушы зейнетақы қорларының филиалдары мен өкілдіктерін ашуға келісім беруге өзгерістер мен толықтыруларды әділет органдарында мемлекеттік тіркеуге рұқсат беру ережеcін бекіту жөнінде" 2003 жылы 29 мамырдағы № 176 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/26536/rus

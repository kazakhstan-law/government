act_code: '16100'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 мая 2003 года N 176. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 июля 2003 года N 2386. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года N 123
title:
  rus: Об утверждении Правил выдачи разрешения на государственную регистрацию накопительных пенсионных фондов в органах юстиции, изменений и дополнений в их учредительные документы
  kaz: Жинақтаушы зейнетақы қорларын, олардың құрылтай құжаттарына өзгерiстер мен толықтыруларды әдiлет органдарында мемлекеттiк тiркеуге рұқсат беру ережесiн бекiту жөнiнде

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 марта 2005 года N 103. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 мая 2005 года N 3618. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 55 (V064139)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 4 июля 2003 года N 222 "Об утверждении требований к рейтингу юридических лиц-нерезидентов Республики Казахстан, являющихся учредителями или акционерами банков второго уровня, организаций, осуществляющих инвестиционное управление пенсионными активами, открытых накопительных пенсионных фондов Республики Казахстан и страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, создающих, имеющих дочерние страховые (перестраховочные) организации Республики Казахстан, и перечня рейтинговых агентств, присваивающих данный рейтинг"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының екінші деңгейдегі банктерінің, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарының, ашық жинақтаушы зейнетақы қорларының және сақтандыру (қайта сақтандыру) ұйымдарының - Қазақстан Республикасының еншілес сақтандыру (қайта сақтандыру) ұйымдарын құратын, иеленуші Қазақстан Республикасының резиденті еместердің құрылтайшылары немесе акционерлері болып табылатын Қазақстан Республикасының резиденті емес заңды тұлғалардың рейтингіне қойылатын талаптарды және осы рейтингті беретін Рейтинг агенттіктерінің тізбесін бекіту туралы" 2003 жылғы 4 шілдедегі N 222 қаулысына өзгерістер мен толықтыру енгізу туралы

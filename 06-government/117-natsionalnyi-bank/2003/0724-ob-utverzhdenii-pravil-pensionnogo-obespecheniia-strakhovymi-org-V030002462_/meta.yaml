title:
  rus: Об утверждении Правил пенсионного обеспечения страховыми организациями Республики Казахстан за счет пенсионных накоплений на основе договоров пенсионного аннуитета
  kaz: Зейнетақы аннуитеті шарттары негізінде жинақталған зейнетақы қаражаты есебінен Қазақстан Республикасы сақтандыру ұйымдарының зейнетақымен қамсыздандыру ережесін бекіту туралы

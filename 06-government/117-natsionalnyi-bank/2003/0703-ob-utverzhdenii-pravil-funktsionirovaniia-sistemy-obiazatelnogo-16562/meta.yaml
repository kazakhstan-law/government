act_code: '16562'
requisite: Постановление Правления Национального Банка Республики Казахстан от 4 июля 2003 года N 201. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 августа 2003 года N 2427. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года N 218

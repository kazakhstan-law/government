  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 4 июля 2003 года N 201 "Об утверждении Правил функционирования системы обязательного коллективного гарантирования (страхования) вкладов (депозитов) физических лиц и участия в ней банков второго уровня Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2427

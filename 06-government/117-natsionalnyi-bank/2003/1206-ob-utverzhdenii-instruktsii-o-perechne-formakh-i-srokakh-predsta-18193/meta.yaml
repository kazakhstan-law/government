title:
  rus: Об утверждении Инструкции о перечне, формах и сроках представления отчетности банками второго уровня и ипотечными компаниями в Национальный банк Республики Казахстан для составления денежно-кредитного и финансового обзора
  kaz: Екінші деңгейдегі банктердің және ипотекалық компаниялардың ақша-кредиттік және қаржылық шолуын жасау үшін Қазақстан Республикасының Ұлттық Банкіне беретін есебінің тізбесі, нысандары және ұсыну мерзімдері туралы нұсқаулықты бекіту туралы

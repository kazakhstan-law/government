  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 6 декабря 2003 года № 438 "Об утверждении Инструкции о перечне, формах и сроках представления отчетности банками второго уровня, кредитными товариществами и ипотечными компаниями в Национальный Банк Республики Казахстан для составления денежно-кредитного и финансового обзора"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің, кредиттік серіктестіктердің және ипотекалық компаниялардың ақша-кредиттік және қаржылық шолуын жасау үшін Қазақстан Республикасының Ұлттық Банкіне беретін есебінің тізбесі, нысандары және ұсыну мерзімдері туралы нұсқаулықты бекіту туралы" 2003 жылғы 6 желтоқсандағы N 438 қаулысына өзгерістер мен толықтырулар енгізу туралы

title:
  rus: О порядке приобретения на вторичном рынке ценных бумаг тридцати и более процентов голосующих акций общества
  kaz: Қоғамның дауыс беретін акцияларының отыз және одан да көп процентін бағалы қағаздардың қайталама рыногында сатып алу тәртібі туралы

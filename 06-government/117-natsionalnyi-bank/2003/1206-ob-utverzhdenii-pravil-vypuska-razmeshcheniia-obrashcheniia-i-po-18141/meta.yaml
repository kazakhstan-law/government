  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам идентификационных номеров
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сәйкестендіру нөмірлері бойынша өзгерістер мен толықтырулар енгізу туралы

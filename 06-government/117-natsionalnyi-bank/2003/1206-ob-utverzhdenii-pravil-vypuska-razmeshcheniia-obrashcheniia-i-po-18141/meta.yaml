act_code: '18141'
requisite: Постановление Правления Национального Банка Республики Казахстан от 6 декабря 2003 года № 430. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 декабря 2003 года № 2646. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 декабря 2018 года № 322 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выпуска, размещения, обращения и погашения казахстанских депозитарных расписок, государственной регистрации их выпуска и представления отчетов об итогах размещения или погашения казахстанских депозитарных расписок, а также о требованиях, подлежащих соблюдению эмитентом казахстанских депозитарных расписок
  kaz: Қазақстан депозитарлық қолхаттарын шығару, орналастыру, айналысы және өтеу, олардың шығарылымын мемлекеттiк тiркеу және қазақстан депозитарлық қолхаттарын шығару немесе өтеу қорытындылары туралы есептердi беру, сондай-ақ қазақстан депозитарлық қолхаттарының эмитентi сақтауға жататын талаптар туралы ережені бекiту туралы

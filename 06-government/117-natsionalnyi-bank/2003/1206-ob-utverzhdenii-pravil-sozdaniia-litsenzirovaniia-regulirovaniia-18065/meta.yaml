act_code: '18065'
requisite: Постановление Правления Национального Банка Республики Казахстан от 6 декабря 2003 года N 445. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 декабря 2003 года N 2644. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 34 (V064176)

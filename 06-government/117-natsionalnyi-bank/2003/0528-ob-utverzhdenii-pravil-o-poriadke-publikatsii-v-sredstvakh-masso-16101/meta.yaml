  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 июля 2005 года N 262. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 августа 2005 года за N 3786. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года N 188
  title:
    rus: О внесении дополнений и изменений в постановление Правления Национального Банка Республики Казахстан от 29 мая 2003 года N 178 "Об утверждении Правил о порядке публикации в средствах массовой информации ежеквартальных агрегированных отчетов накопительных пенсионных фондов и организаций, осуществляющих инвестиционное управление пенсионными активами"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Жинақтаушы зейнетақы қорларының және зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың тоқсан сайынғы біріктірілген есептерін бұқаралық ақпарат құралдарында жариялау тәртібі туралы ережені бекіту туралы" 2003 жылғы 29 мамырдағы N 178 қаулысына толықтырулар мен өзгерістер енгізу туралы

act_code: '16101'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 мая 2003 года N 178. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 июля 2003 года N 2387. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года N 188
title:
  rus: Об утверждении Правил о порядке публикации в средствах массовой информации ежеквартальных агрегированных отчетов накопительных пенсионных фондов и организаций, осуществляющих инвестиционное управление пенсионными активами
  kaz: Жинақтаушы зейнетақы қорларының және зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың тоқсан сайынғы біріктірілген есептерін бұқаралық ақпарат құралдарында жариялау тәртібі туралы ережені бекіту туралы

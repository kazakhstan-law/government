  code: '22831'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года № 394. Зарегистрировано Министерством юстиции Республики Казахстан 28 января 2005 года № 3403. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 141
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 сентября 2003 года № 346 "Об утверждении Правил о методике расчета ставки обязательных взносов и условных обязательств, порядке и сроках уплаты обязательных и чрезвычайных взносов, формирования и учета условных обязательств страховыми организациями - участниками Фонда гарантирования страховых выплат"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Сақтандыру ұйымдарының - Сақтандыру төлемдеріне кепілдік беру қоры қатысушыларының міндетті жарналармен шартты міндеттемелердің ставкасын есептеу әдістемесі, міндетті және төтенше жарналар төлеу тәртібімен мерзімдері, шартты міндеттемелерді қалыптастыру және есебін жүргізу туралы ережені бекіту туралы" 2003 жылғы 24 қыркүйектегі № 346 қаулысына өзгерістер енгізу туралы

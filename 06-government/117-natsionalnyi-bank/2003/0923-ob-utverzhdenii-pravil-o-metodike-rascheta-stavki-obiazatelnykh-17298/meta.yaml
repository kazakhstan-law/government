caused_by:
  code: '19383'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года N 75. Зарегистрировано Министерством юстиции Республики Казахстан 14 апреля 2004 года N 2805. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года N 141
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 24 сентября 2003 года N 346 "Об утверждении Правил о методике расчета ставки обязательных взносов и условных обязательств, порядке и сроках уплаты обязательных и чрезвычайных взносов, формирования и учета условных обязательств страховыми организациями - участниками Фонда гарантирования страховых выплат", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2547
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2547 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Сақтандыру ұйымдарының - Сақтандыру төлемдеріне кепілдік беру қоры қатысушыларының міндетті жарналар мен шартты міндеттемелердің ставкасын есептеу әдістемесі, міндетті және төтенше жарналар төлеу тәртібі мен мерзімдері, шартты міндеттемелерді қалыптастыру және есебін жүргізу туралы ережені бекіту туралы" 2003 жылғы 24 қыркүйектегі N 346 қаулысына өзгерістер мен толықтырулар енгізу туралы

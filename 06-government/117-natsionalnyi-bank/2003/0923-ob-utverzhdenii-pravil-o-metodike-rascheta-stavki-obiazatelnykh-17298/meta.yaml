act_code: '17298'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 сентября 2003 года N 346. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 октября 2003 г. N 2547. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года N 141
title:
  rus: Об утверждении Правил о методике расчета ставки обязательных, дополнительных взносов и условных обязательств, порядке и сроках уплаты обязательных, дополнительных и чрезвычайных взносов, формирования и учета условных обязательств страховыми организациями - участниками Фонда гарантирования страховых выплат
  kaz: Сақтандыру ұйымдарының - Сақтандыру төлемдеріне кепілдік беру қоры қатысушыларының міндетті, қосымша жарналар мен шартты міндеттемелердің ставкасын есептеу әдістемесі, міндетті және төтенше жарналар төлеу тәртібі мен мерзімдері, шартты міндеттемелерді қалыптастыру және есебін жүргізу туралы ережені бекіту туралы

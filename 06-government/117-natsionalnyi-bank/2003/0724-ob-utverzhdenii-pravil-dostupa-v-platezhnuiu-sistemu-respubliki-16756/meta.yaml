act_code: '16756'
requisite: Постановление Правления Национального Банка Республики Казахстан от 25 июля 2003 года № 235. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 августа 2003 года № 2458. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 ноября 2008 года № 95
title:
  rus: Об утверждении Правил доступа в платежную систему Республики Казахстан, оператором которой является Республиканское государственное предприятие на праве хозяйственного ведения "Казахстанский центр межбанковских расчетов Национального Банка Республики Казахстан"
  kaz: '"Қазақстан Республикасы Ұлттық Банкінің Қазақстан банкаралық есеп айырысу орталығы" шаруашылық жүргізу құқығы бар республикалық мемлекеттік кәсіпорны операторы болып табылатын Қазақстан Республикасының төлем жүйесіне кіру ережесін бекіту туралы'

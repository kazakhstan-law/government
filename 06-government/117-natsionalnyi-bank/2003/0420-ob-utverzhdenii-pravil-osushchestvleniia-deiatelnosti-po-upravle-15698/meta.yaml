  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 21 апреля 2003 года № 137 "Об утверждении Правил осуществления деятельности по управлению портфелем ценных бумаг", зарегистрированное в Министерстве юстиции Республики Казахстан под № 2335
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2335 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Бағалы қағаздар портфелін басқару жөніндегі қызметті жүзеге асыру ережесін бекіту туралы" 2003 жылғы 21 сәуірдегі N 137 қаулысына өзгерістер мен толықтырулар енгізу туралы

  requisite: Постановление Правления Национального Банка Республики Казахстан от 25 февраля 2013 года № 77. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 апреля 2013 года № 8410. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 196
  title:
    rus: О приостановлении действий некоторых пунктов постановления Правления Национального Банка Республики Казахстан от 25 июля 2003 года № 249 "Об утверждении Правил пенсионного обеспечения страховыми организациями Республики Казахстан за счет пенсионных накоплений на основе договоров пенсионного аннуитета" и постановления Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 декабря 2008 года № 240 "Об утверждении Правил перевода пенсионных накоплений из накопительных пенсионных фондов"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Зейнетақы аннуитеті шарттары негізінде жинақталған зейнетақы қаражаты есебінен Қазақстан Республикасы сақтандыру ұйымдарының зейнетақымен қамсыздандыру ережесін бекіту туралы" 2003 жылғы 25 шілдедегі № 249 қаулысының және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Жинақтаушы зейнетақы қорларынан жинақталған зейнетақы қаражатын аудару ережесін бекіту туралы" 2008 жылғы 29 желтоқсандағы № 240 қаулысының кейбір тармақтарының қолданылуын тоқтата тұру туралы
  link: https://zan.gov.kz/client/#!/doc/72144/rus

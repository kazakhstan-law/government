    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Зейнетақы аннуитеті шарттары негізінде жинақталған зейнетақы қаражаты есебінен Қазақстан Республикасы сақтандыру ұйымдарының зейнетақымен қамсыздандыру ережесін бекіту туралы" 2003 жылғы 25 шілдедегі N 249 қаулысына толықтыру мен өзгерістер енгізу туралы

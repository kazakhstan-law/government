act_code: '16542'
requisite: Постановление Правления Национального Банка Республики Казахстан от 4 июля 2003 года N 200. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 августа 2003 года N 2426. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года N 218
title:
  rus: Об утверждении Правил обязательного коллективного гарантирования (страхования) вкладов (депозитов) физических лиц в банках второго уровня Республики Казахстан
  kaz: Қазақстан Республикасының екінші деңгейдегі банктеріндегі жеке тұлғалардың салымдарына (депозиттеріне) міндетті ұжымдық кепілдік беру (сақтандыру) ережесін бекіту туралы

  code: '21052'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июля 2004 года N 204. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 августа 2004 года N 3032. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года N 218
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 4 июля 2003 года N 200 "Об утверждении Правил обязательного коллективного гарантирования (страхования) вкладов (депозитов) физических лиц в банках второго уровня Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2426
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2426 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының екінші деңгейдегі банктеріндегі жеке тұлғалардың салымдарына (депозиттеріне) міндетті ұжымдық кепілдік беру (сақтандыру) ережесін бекіту туралы" 2003 жылғы 4 шілдедегі N 200 қаулысына өзгерістер мен толықтыру енгізу туралы

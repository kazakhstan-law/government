act_code: '16686'
requisite: Постановление Правления Национального Банка Республики Казахстан от 25 июля 2003 года N 252. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 августа 2003 года N 2453. Утратило силу постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 12 августа 2006 года N 151

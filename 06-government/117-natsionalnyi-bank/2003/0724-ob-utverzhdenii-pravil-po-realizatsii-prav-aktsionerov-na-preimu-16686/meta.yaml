    kaz: Қазақстан Республикасының Әділет министрлігінде N 2453 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Акционерлердің бағалы қағаздарды басымдықпен сатып алу құқықтарын іске асыру жөніндегі нұсқаулықты бекіту туралы" 2003 жылғы 25 шілдедегі N 252 қаулысына өзгерістер енгізу туралы

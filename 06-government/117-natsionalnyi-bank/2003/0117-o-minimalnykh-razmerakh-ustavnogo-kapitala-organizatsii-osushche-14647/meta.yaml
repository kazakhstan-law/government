  title:
    rus: Об утверждении Правил о пруденциальных нормативах для организаторов торгов с ценными бумагами и о внесении изменения в постановление Правления Национального Банка Республики Казахстан от 17 января 2003 года № 1 "О минимальных размерах уставного капитала организаций, осуществляющих отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под № 2186
    kaz: Бағалы қағаздармен сауда-саттық ұйымдастырушыларға арналған пруденциалдық нормативтер туралы ережені Бекіту туралы және Қазақстан Республикасының Әділет министрлігінде N 2186 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың жарғылық капиталының ең аз мөлшері туралы" 2003 жылғы 17 қаңтардағы N 1 қаулысына өзгеріс енгізу туралы

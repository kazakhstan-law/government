act_code: '16543'
requisite: Постановление Национального Банка Республики Казахстан от 4 июля 2003 года N 219. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 августа 2003 года N 2428. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 46 (V064159)
title:
  rus: О минимальном требуемом рейтинге стран, с государственными ценными бумагами которых банки второго уровня вправе совершать сделки при осуществлении брокерской и дилерской деятельности
  kaz: Екінші деңгейдегі банктер брокерлік және дилерлік қызметті жүзеге асырған кезде мемлекеттік бағалы қағаздарымен мәмілелер жасауға құқылы елдердің ең төменгі талап етілетін рейтингі туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 24 декабря 2014 года № 260. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 февраля 2015 года № 10243. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 19 декабря 2015 года № 237
title:
  rus: Об утверждении Правил приобретения товаров, работ и услуг Национальным Банком Республики Казахстан и юридическими лицами, в отношении которых Национальный Банк Республики Казахстан является учредителем (уполномоченным органом) либо акционером
  kaz: Қазақстан Республикасы Ұлттық Банкінің және Қазақстан Республикасының Ұлттық Банкі құрылтайшысы (уәкілетті органы) не акционері болып табылатын заңды тұлғалардың тауарларды, жұмыстарды және көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы

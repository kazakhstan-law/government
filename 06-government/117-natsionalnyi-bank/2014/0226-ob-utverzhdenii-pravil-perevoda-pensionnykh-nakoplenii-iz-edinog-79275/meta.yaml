act_code: '79275'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 февраля 2014 года № 31. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2014 года № 9326. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 51 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил перевода пенсионных накоплений из единого накопительного пенсионного фонда в добровольный накопительный пенсионный фонд, из добровольного накопительного пенсионного фонда в единый накопительный пенсионный фонд, а также из одного добровольного накопительного пенсионного фонда в другой добровольный накопительный пенсионный фонд
  kaz: Зейнетақы жинақтарын бірыңғай жинақтаушы зейнетақы қорынан ерікті жинақтаушы зейнетақы қорына, ерікті жинақтаушы зейнетақы қорынан бірыңғай жинақтаушы зейнетақы қорына, сондай-ақ бір ерікті жинақтаушы зейнетақы қорынан басқа ерікті жинақтаушы зейнетақы қорына ауыстыру қағидаларын бекіту туралы

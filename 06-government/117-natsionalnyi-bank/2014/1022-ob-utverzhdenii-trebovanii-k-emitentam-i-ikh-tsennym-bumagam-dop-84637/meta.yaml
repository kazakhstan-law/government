title:
  rus: Об утверждении Требований к эмитентам и их ценным бумагам, допускаемым (допущенным) к обращению на фондовой бирже, а также к отдельным категориям списка фондовой биржи
  kaz: Эмитенттерге және олардың қор биржасында айналысқа жіберілетін (жіберілген) бағалы қағаздарына, сондай-ақ қор биржасы тізімінің жекелеген санаттарына қойылатын талаптарды бекіту туралы

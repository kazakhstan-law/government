requisite: Постановление Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 190. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 декабря 2014 года № 9945. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 мая 2020 года № 57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

requisite: Постановление Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 134. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 августа 2014 года № 9703. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 30 ноября 2015 года № 211
title:
  rus: Об утверждении Правил выдачи субъектам легализации документа, подтверждающего внесение (перевод) денег на сберегательный счет, а также ведения учета денег, находящихся на сберегательных счетах, и особенности открытия и ведения банками второго уровня Республики Казахстан, Национальным оператором почты сберегательных счетов
  kaz: Заңдастыру субъектілеріне жинақ шотына ақша енгізуді (аударуды) растайтын құжатты беру, сондай-ақ жинақ шоттарындағы ақшаны есепке алуды жүргізу қағидаларын бекіту туралы және Қазақстан Республикасы екінші деңгейдегі банктерінің және ұлттық пошта операторының жинақ шоттарын ашу мен жүргізу ерекшеліктері

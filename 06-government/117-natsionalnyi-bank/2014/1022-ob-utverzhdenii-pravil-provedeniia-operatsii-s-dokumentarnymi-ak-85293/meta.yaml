title:
  rus: Об утверждении Правил проведения операций с документарными аккредитивами банками Республики Казахстан
  kaz: Қазақстан Республикасы банктерінің құжаттамалық аккредитивтерімен операциялар жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 сентября 2014 года № 179 «Об утверждении Правил осуществления организацией, специализирующейся на улучшении качества кредитных портфелей банков второго уровня, видов деятельности, а также Требований к приобретаемым (приобретенным) ею сомнительным и безнадежным активам»
    kaz: «Екінші деңгейдегі банктердің кредиттік портфельдерінің сапасын жақсартуға маманданған ұйымның қызмет түрлерін жүзеге асыру қағидаларын, сондай-ақ Иеленетін (иеленген) күмәнді және үмітсіз активтерге қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2014 жылғы 24 қыркүйектегі № 179 қаулысына өзгерістер енгізу туралы

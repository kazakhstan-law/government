act_code: '84629'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 сентября 2014 года № 179. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 ноября 2014 года № 9866. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 16 апреля 2018 года № 65 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления организацией, специализирующейся на улучшении качества кредитных портфелей банков второго уровня, видов деятельности, а также Требований к приобретаемым (приобретенным) организацией, специализирующейся на улучшении качества кредитных портфелей банков второго уровня, активам и правам требования
  kaz: Екінші деңгейдегі банктердің кредиттік портфельдерінің сапасын жақсартуға маманданатын ұйымның қызмет түрлерін жүзеге асыру қағидаларын, сондай-ақ Екінші деңгейдегі банктердің кредиттік портфельдерінің сапасын жақсартуға маманданатын ұйым сатып алатын (сатып алған) активтер мен талап ету құқықтарына қойылатын талаптарды бекіту туралы

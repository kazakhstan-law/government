title:
  rus: Об утверждении Правил установления корреспондентских отношений между Национальным Банком Республики Казахстан и банками, а также организациями, осуществляющими отдельные виды банковских операций
  kaz: Қазақстан Республикасының Ұлттық Банкі мен банктер, сондай-ақ банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар арасында корреспонденттік қатынастарды орнату қағидаларын бекіту туралы

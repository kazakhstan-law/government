  title:
    rus: Об утверждении Правил функционирования межбанковской системы переводов денег и внесении изменения в постановление Правления Национального Банка Республики Казахстан от 3 февраля 2014 года № 14 "Об утверждении Правил установления корреспондентских отношений между Национальным Банком Республики Казахстан и банками, а также организациями, осуществляющими отдельные виды банковских операций"
    kaz: Банкаралық ақша аударымдары жүйесінің жұмыс істеу қағидаларын бекіту және "Қазақстан Республикасының Ұлттық Банкі мен банктер, сондай-ақ банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар арасында корреспонденттік қатынастарды орнату қағидаларын бекіту туралы" Қазақстан Республикасы Ұлттық Банкі Басқармасының 2014 жылғы 3 ақпандағы № 14 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/99051/rus

  code: '152901'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 15 февраля 2021 года № 29. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 февраля 2021 года № 22218
  title:
    rus: Об утверждении Требований к управляющим инвестиционным портфелем, которым могут быть переданы в доверительное управление пенсионные активы, а также перечня финансовых инструментов, разрешенных к приобретению за счет данных пенсионных активов, и внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 3 февраля 2014 года № 10 «Об утверждении Правил осуществления деятельности по управлению инвестиционным портфелем»
    kaz: Зейнетақы активтері сенімгерлік басқаруға берілуі мүмкін инвестициялық портфельді басқарушыға қойылатын талаптарды, сондай-ақ осы зейнетақы активтерінің есебінен сатып алуға рұқсат етілген қаржы құралдарының тізбесін бекіту және «Инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасының Ұлттық Банкі Басқармасының 2014 жылғы 3 ақпандағы № 10 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/152901/rus

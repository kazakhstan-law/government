  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам представления отчетности профессиональными участниками рынка ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығына кәсіби қатысушылардың есептілікті ұсыну мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

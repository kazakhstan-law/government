requisite: Постановление Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 147. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 сентября 2014 года № 9711. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 48 (вводится в действие с 1 июля 2026 года)
title:
  rus: Об утверждении Правил назначения и полномочий временной администрации (временного администратора) банка, страховой (перестраховочной) организации
  kaz: Банктің, сақтандыру (қайта сақтандыру) ұйымының уақытша әкімшілігін (уақытша әкiмшісін) тағайындау және оның өкілеттіктері қағидаларын бекіту туралы

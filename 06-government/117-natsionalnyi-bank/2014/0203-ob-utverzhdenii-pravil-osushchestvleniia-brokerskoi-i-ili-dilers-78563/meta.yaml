title:
  rus: Об утверждении Правил осуществления брокерской и (или) дилерской деятельности на рынке ценных бумаг, порядка проведения брокером и (или) дилером банковских операций
  kaz: Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыру қағидаларын, брокердің және (немесе) дилердің банк операцияларын жүргізу тәртібін бекіту туралы

act_code: '83440'
requisite: Постановление Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 146. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 сентября 2014 года № 9736. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 80 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении пруденциального норматива для организаций, осуществляющих брокерскую и (или) дилерскую деятельность на рынке ценных бумаг, утверждении Правил расчета значений пруденциального норматива для организаций, осуществляющих брокерскую и (или) дилерскую деятельность на рынке ценных бумаг
  kaz: Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдар үшін пруденциялық нормативті белгілеу, Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдар үшін пруденциялық нормативтің мәндерін есеп айырысу қағидаларын бекіту туралы

act_code: '79274'
requisite: Постановление Правления Национального Банка Республики Казахстан от 26 февраля 2014 года № 32. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2014 года № 9325. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 октября 2022 года № 73 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

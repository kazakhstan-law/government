act_code: '84737'
requisite: Постановление Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 210. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 ноября 2014 года № 9876
title:
  rus: Об утверждении Правил регистрации сделок с эмиссионными ценными бумагами, уступки прав требования по обязательствам эмитентов по эмиссионным ценным бумагам в системе учета номинального держания и системе реестров держателей ценных бумаг, предоставления выписки с лицевого счета зарегистрированного лица в системе учета центрального депозитария и (или) в системе учета номинального держания и предоставления номинальным держателем информации о клиентах, ценные бумаги которых находятся в его номинальном держании, по требованию центрального депозитария и эмитента
  kaz: Эмиссиялық бағалы қағаздармен жасалған мәмілелерді, эмиссиялық бағалы қағаздар жөніндегі эмитенттердің міндеттемелері бойынша талап ету құқықтарын беруді номиналды ұстауды есепке алу жүйесінде және бағалы қағаздарды ұстаушылардың тізілімі жүйесінде тіркеу, орталық депозитарийдің есепке алу жүйесінде және (немесе) номиналды ұстауды есепке алу жүйесінде тіркелген тұлғаның жеке шотынан үзінді- көшірмені беру және номиналды ұстаушының номиналды ұстауындағы бағалы қағаздары бар клиенттер туралы ақпаратты орталық депозитарийдің және эмитенттің талап етуі бойынша табыс ету қағидаларын бекіту туралы

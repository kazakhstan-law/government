  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 210 «Об утверждении Правил регистрации сделок с эмиссионными ценными бумагами, переданными в номинальное держание, заключенных на организованном или неорганизованном рынке, в системе номинального держания (системе учета центрального депозитария), предоставления выписки с лицевого счета держателя ценных бумаг в системе учета номинального держания и (или) в системе учета центрального депозитария и предоставления номинальным держателем информации о клиентах, ценные бумаги которых находятся в его номинальном держании, по требованию регистратора, центрального депозитария и эмитента»
    kaz: «Номиналды ұстауға берілген, ұйымдастырылған немесе ұйымдастырылмаған нарықта эмиссиялық бағалы қағаздармен жасалған мәмілелерді номиналды ұстау жүйесінде (орталық депозитарийдің есепке алу жүйесінде) тіркеу, номиналды ұстаушының есепке алу жүйесінде және (немесе) орталық депозитарийдің есепке алу жүйесінде бағалы қағаздарды ұстаушының жеке шотынан үзінді көшірмені беру және номиналды ұстаушының өзiнiң номиналды ұстауындағы бағалы қағаздары бар клиенттер туралы ақпаратты тіркеушінің, орталық депозитарийдің және эмитенттің талап етуі бойынша табыс ету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2014 жылғы 22 қазандағы № 210 қаулысына өзгерістер енгізу туралы

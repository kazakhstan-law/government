act_code: '83399'
requisite: Постановление Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 151. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 сентября 2014 года № 9718. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 191 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления актуарной деятельности, выдачи лицензии на право осуществления актуарной деятельности, сдачи квалификационного экзамена актуарием, привлечения независимого актуария для проверки деятельности актуария, направления независимым актуарием результатов проверки достоверности расчетов, проведенных актуарием, состоящим в штате страховой (перестраховочной) организации
  kaz: Актуарлық қызметті жүзеге асыру, актуарлық қызметті жүзеге асыру құқығына лицензия беру, актуарийдің біліктілік емтиханын тапсыру, актуарийдің қызметін тексеру үшін тәуелсіз актуарийді тарту, тәуелсіз актуарийдің сақтандыру (қайта сақтандыру) ұйымының штатында тұрған актуарий жүргізген есептеулердің шынайылығын тексеру нәтижелерін жіберу қағидаларын бекіту туралы

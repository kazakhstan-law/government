    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам оптимизации и автоматизации бизнес - процессов государственных услуг, оказываемых Национальным Банком Республики Казахстан
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне Қазақстан Республикасының Ұлттық Банкі көрсететін мемлекеттік қызметтердің бизнес-процестерін оңтайландыру және автоматтандыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

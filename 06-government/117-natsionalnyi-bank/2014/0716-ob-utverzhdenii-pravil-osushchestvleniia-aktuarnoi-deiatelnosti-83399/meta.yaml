  title:
    rus: Об утверждении минимальной обязательной программы обучения актуариев, перечня и требований к международным ассоциациям актуариев, Требований к содержанию и порядку предоставления обязательного актуарного заключения, Требований к подтверждению квалификации актуария, Правил и сроков привлечения независимого актуария для проверки деятельности актуария, состоящего в штате страховой (перестраховочной) организации, направления независимым актуарием результатов проверки достоверности расчетов, проведенных актуарием, состоящим в штате страховой (перестраховочной) организации, Правил выдачи лицензии на право осуществления актуарной деятельности на страховом рынке, Правил проведения тестирования
    kaz: Актуарийлерді оқытудың ең қысқа міндетті бағдарламасын, халықаралық актуарийлер қауымдастықтарының тізбесін және оларға қойылатын талаптарды, Міндетті актуарлық қорытындының мазмұнына және табыс етілу тәртібіне қойылатын талаптарды, Актуарийдің біліктілігін растауға қойылатын талаптарды, Сақтандыру (қайта сақтандыру) ұйымының штатында тұрған актуарийдің қызметін тексеру үшін тәуелсіз актуарийді тарту, тәуелсіз актуарийдің сақтандыру (қайта сақтандыру) ұйымының штатында тұрған актуарий жүргізген есептеулердің шынайылығын тексеру нәтижелерін жіберу қағидаларын және мерзімдерін, Сақтандыру нарығындағы актуарлық қызметтi жүзеге асыру құқығына лицензия беру қағидаларын, Тестілеу өткізу қағидаларын бекіту туралы

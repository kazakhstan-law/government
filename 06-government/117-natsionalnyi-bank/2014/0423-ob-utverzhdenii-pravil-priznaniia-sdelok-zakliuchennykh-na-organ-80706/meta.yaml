title:
  rus: Об утверждении Правил признания сделок, заключенных на организованном и неорганизованном рынках ценных бумаг, как совершенных в целях манипулирования, формирования и работы экспертного комитета фондовой биржи, а также его количественного состава
  kaz: Ұйымдастырылған және ұйымдастырылмаған бағалы қағаздар нарықтарында жасалған мәмiлелердi айла-шарғы жасау мақсатында жасалған деп тану, қор биржасының сараптамалық комитетін құру және оның жұмыс істеу қағидаларын, сондай-ақ оның сандық құрамын бекіту туралы

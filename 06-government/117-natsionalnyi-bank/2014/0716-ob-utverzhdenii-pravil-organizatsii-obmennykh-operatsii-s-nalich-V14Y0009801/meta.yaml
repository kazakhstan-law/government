  requisite: Постановление Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 183. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 ноября 2018 года № 17677. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49 (вводится в действие с 1 июля 2019 года)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 144 «Об утверждении Правил организации обменных операций с наличной иностранной валютой в Республике Казахстан»
    kaz: «Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2014 жылғы 16 шілдедегі № 144 қаулысына өзгерістер мен толықтырулар енгізу туралы

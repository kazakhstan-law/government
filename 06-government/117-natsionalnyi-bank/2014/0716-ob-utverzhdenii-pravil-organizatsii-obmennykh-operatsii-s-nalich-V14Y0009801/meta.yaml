  requisite: Постановление Правления Национального Банка Республики Казахстан от 28 января 2016 года № 55. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 февраля 2016 года № 13219. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49 (вводится в действие с 1 июля 2019 года)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 144 «Об утверждении Правил организации обменных операций с наличной иностранной валютой в Республике Казахстан»
    kaz: «Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басќармасының 2014 жылғы 16 шілдедегі № 144 қаулысына өзгерістер мен толықтыру енгізу туралы

requisite: Постановление Правления Национального Банка Республики Казахстан от 2 марта 2021 года № 24. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 марта 2021 года № 22322. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 2 декабря 2025 года № 86 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня, форм, сроков представления отчетности филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и филиалами страховых брокеров-нерезидентов Республики Казахстан и Правил ее представления
  kaz: Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымдарының филиалдары және Қазақстан Республикасы бейрезидент-сақтандыру брокерлерінің филиалдары есептілігінің тізбесін, нысандарын, мерзімдерін және оны ұсыну қағидаларын бекіту туралы

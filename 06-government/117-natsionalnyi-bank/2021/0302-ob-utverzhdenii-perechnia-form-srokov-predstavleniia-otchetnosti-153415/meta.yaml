act_code: '153415'
requisite: Постановление Правления Национального Банка Республики Казахстан от 2 марта 2021 года № 25. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 марта 2021 года № 22330. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 2 декабря 2025 года № 85 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня, форм, сроков представления отчетности о выполнении пруденциальных нормативов филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и филиалами исламских страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и Правил ее представления
  kaz: Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының және Қазақстан Республикасының бейрезидент-исламдық сақтандыру (қайта сақтандыру) ұйымдары филиалдарының пруденциялық нормативтерді орындауы туралы есептіліктің тізбесін, нысандарын, мерзімдерін және оны ұсыну қағидаларын бекіту туралы

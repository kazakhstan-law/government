title:
  rus: Об утверждении перечня, форм, сроков и Правил представления отчетности о выполнении пруденциальных нормативов филиалами банков-нерезидентов Республики Казахстан (в том числе филиалов исламских банков-нерезидентов Республики Казахстан)
  kaz: Қазақстан Республикасы бейрезидент-банктері филиалдарының (оның ішінде Қазақстан Республикасы бейрезидент-ислам банктері филиалдарының) пруденциялық нормативтерді орындауы туралы есептіліктің тізбесін, нысандарын, мерзімдерін және оларды ұсыну қағидаларын бекіту туралы

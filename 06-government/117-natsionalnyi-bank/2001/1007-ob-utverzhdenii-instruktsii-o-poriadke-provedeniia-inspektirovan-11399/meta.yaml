requisite: Постановление Правления Национального Банка Республики Казахстан от 8 октября 2001 года N 383. Зарегистрировано Министерством юстиции Республики Казахстан 25 февраля 2002 года N 1771. Утратило силу постановлением Правления Национального Банка РК от 6 ноября 2006 года N 116
title:
  rus: Об утверждении Инструкции о порядке проведения инспектирования деятельности клиринговых организаций - организаций, осуществляющих отдельные виды банковских операций
  kaz: Клиринг ұйымдарының - банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қызметін инспекциялауды жүргізу тәртібі туралы нұсқаулықты бекіту жөнінде"

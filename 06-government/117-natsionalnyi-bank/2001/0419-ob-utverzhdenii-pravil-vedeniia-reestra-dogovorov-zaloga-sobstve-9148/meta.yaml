act_code: '9148'
requisite: Постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года № 121. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 июня 2001 года № 1534. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 18 января 2016 года № 5
title:
  rus: Об утверждении Правил ведения реестра договоров залога собственного имущества, гарантии (поручительства) и иных обязательств страховой (перестраховочной) организации, не отраженных в балансе, и регистрации договоров о совместной деятельности, заключенных страховой (перестраховочной) организацией
  kaz: Сақтандыру (қайта сақтандыру) ұйымының баланста көрсетiлмеген меншiктi мүлкінің кепіл, кепілдiк (кепілдеме) шарттарының және басқа міндеттемелерінің) тiзiлiмiн жүргiзу және сақтандыру (қайта сақтандыру) ұжымы жасаған бiрлескен қызмет туралы шарттарды тiркеу ережесiн бекiту туралы

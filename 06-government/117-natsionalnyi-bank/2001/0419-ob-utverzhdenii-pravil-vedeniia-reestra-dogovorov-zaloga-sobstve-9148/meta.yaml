  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года N 121 "Об утверждении Правил ведения реестра договоров залога собственного имущества, гарантии (поручительства) и иных обязательств страховой (перестраховочной) организации, не отраженных в балансе, и регистрации договоров о совместной деятельности, заключенных страховой (перестраховочной) организацией", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1534
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 1534 тiркелген Қазақстан Республикасының Ұлттық Банкi Басқармасының "Сақтандыру (қайта сақтандыру) ұйымының баланста көрсетiлмеген меншiктi мүлкiнiң кепiл, кепiлдiк (кепiлдеме) шарттарының және басқа мiндеттемелерiнiң тiзiлiмiн жүргiзу және сақтандыру (қайта сақтандыру) ұйымы жасаған бiрлескен қызмет туралы шарттарды тiркеу ережесiн бекiту жөнiнде" 2001 жылғы 20 сәуiрдегi N 121 қаулысына өзгерiстер мен толықтырулар енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/20388/rus

  code: '15280'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 7 марта 2003 года № 78. Зарегистрировано Министерством юстиции Республики Казахстан 25 апреля 2003 года № 2246. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года № 159
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 20 декабря 2001 года № 538 "Об утверждении Правил согласования кандидатур на должности руководящих работников организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1750
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде № 1750 тiркелген, Қазақстан Республикасының Ұлттық Банкi Басқармасының "Зейнетақы активтерiн инвестициялық басқару жөнiндегi қызметтi жүзеге асыратын ұйымдардың басшы қызметкерлерi лауазымдарына кандидатураларды келiсу ережесiн бекiту туралы" 2001 жылғы 20 желтоқсандағы № 538 қаулысына өзгерiстер мен толықтырулар енгiзу туралы

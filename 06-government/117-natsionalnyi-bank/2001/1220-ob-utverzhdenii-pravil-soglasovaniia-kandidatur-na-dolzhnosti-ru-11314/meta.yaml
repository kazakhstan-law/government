act_code: '11314'
requisite: Постановление Правления Национального Банка Республики Казахстан от 20 декабря 2001 года N 538. Зарегистрировано Министерством юстиции Республики Казахстан 7 февраля 2002 года N 1750. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года N 159 (V042955)
title:
  rus: Об утверждении Правил согласования кандидатур на должности руководящих работников организаций, осуществляющих инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерiн инвестициялық басқаруды жүзеге асыратын ұйымдардың басшы қызметкерлерi лауазымдарына кандидатураларды келісу ережесiн бекiту туралы

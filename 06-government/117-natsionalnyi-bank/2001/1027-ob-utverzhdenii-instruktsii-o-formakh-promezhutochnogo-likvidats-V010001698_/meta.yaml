  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 октября 2001 года N 419 "Об утверждении Инструкции о формах промежуточного ликвидационного баланса, иных отчетов, ликвидационного баланса ликвидируемых банков в Республике Казахстан, сроках и порядке их представления ликвидационными комиссиями"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасындағы таратылатын банктердің аралықтарату балансының, басқа да есептерінің, тарату балансының нысандары және тарату комиссияларының оларды ұсыну мерзімдері мен тәртібі туралы нұсқаулықты бекіту жөніндегі" 2001 жылы 28 қазандағы N 419 қаулысына өзгерістер мен толықтырулар енгізу туралы

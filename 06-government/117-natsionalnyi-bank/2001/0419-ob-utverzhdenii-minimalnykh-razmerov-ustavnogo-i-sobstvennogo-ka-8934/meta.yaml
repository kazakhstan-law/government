    kaz: Қазақстан Республикасының Әділет министрлігінде N 1513 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Сақтандыру және қайта сақтандыру ұйымының жарғылық және меншікті капиталдарының ең аз мөлшерін бекіту туралы" 2001 жылғы 20 сәуірдегі N 117 қаулысына өзгеріс пен толықтыру енгізу туралы

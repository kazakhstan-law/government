requisite: Постановление Правления Национального Банка Республики Казахстан от 8 октября 2001 года N 382.  Зарегистрировано в Министерстве юстиции Республики Казахстан 13 ноября 2001 г. за N 1675. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 207
title:
  rus: Об утверждении изменений в Инструкцию о порядке открытия, ведения и закрытия банковских счетов клиентов в банках Республики Казахстан, утвержденную постановлением Правления Национального Банка Республики Казахстан от 2 июня 2000 года N 266
  kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының 2000 жылғы 2 маусымдағы N 266 қаулысымен бекiтiлген Қазақстан Республикасының банктерiнде клиенттердiң банктiк есепшоттарын ашу, жүргiзу және жабу тәртiбi туралы нұсқаулыққа өзгерiстердi бекiту туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Национального Банка Республики Казахстан по вопросам идентификационных номеров
    kaz: Қазақстан Республикасы Ұлттық Банкінің сәйкестендіру нөмірлерінің мәселелері жөніндегі кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу туралы

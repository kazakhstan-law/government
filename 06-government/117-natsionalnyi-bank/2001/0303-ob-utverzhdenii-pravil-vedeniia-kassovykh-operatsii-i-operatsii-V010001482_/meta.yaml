title:
  rus: Об утверждении Правил ведения кассовых операций и операций по инкассации банкнот, монет и ценностей в банках и организациях, осуществляющих отдельные виды банковских операций
  kaz: Банктерде және банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдарда кассалық операцияларды және банкноттарды, монеталарды және құндылықтарды инкассациялау бойынша операцияларды жүргізу қағидаларын бекіту туралы

act_code: '9651'
requisite: Постановление Правления Национального Банка Республики Казахстан от 14 июня 2001 года N 224. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 июля 2001 года N 1592. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2010 года № 182
title:
  rus: Об утверждении Инструкции по документированию, управлению документацией и хранению документов профессиональными участниками страхового рынка и страховыми агентами, осуществляющими предпринимательскую деятельность
  kaz: Сақтандыру рыногының кәсіби қатысушыларымен және кәсіби қызметті жүзеге асыратын сақтандыру агенттерімен құжаттарды жасау, құжаттаманы басқару және құжаттарды сақтау жөніндегі нұсқаулықты бекіту туралы

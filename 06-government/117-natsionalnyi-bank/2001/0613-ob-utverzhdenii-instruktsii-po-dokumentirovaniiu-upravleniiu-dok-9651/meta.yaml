    kaz: '"Сақтандыру (қайта сақтандыру) ұйымдарында құжаттарды жасау, құжаттаманы басқару және құжаттарды сақтау жөніндегі нұсқаулығын бекіту туралы" Қазақстан Республикасының Ұлттық Банкі Басқармасының 2001 жылғы 14 маусымдағы N 224 қаулысына өзгерістер мен толықтырулар енгізу туралы'

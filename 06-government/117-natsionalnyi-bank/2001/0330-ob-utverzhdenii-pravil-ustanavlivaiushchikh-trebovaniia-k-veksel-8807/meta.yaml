  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 31 марта 2001 года N 79 "Об утверждении Правил, устанавливающих требования к вексельной бумаге, производимой на территории Республики Казахстан или ввозимой на ее территорию", зарегистрированные в Министерстве юстиции Республики Казахстан под N 1494
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1494 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының аумағында шығарылатын немесе оның аумағына әкелінетін вексель қағазына қойылатын талаптарды белгілейтін ережені бекіту туралы" 2001 жылғы 31 наурыздағы N 79 қаулысына өзгерістер енгізу туралы

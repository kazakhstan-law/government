requisite: Постановление Правления Национального Банка Республики Казахстан от 31 марта 2001 года № 79. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 мая 2001 года за № 1494. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 237 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил, устанавливающих требования к вексельной бумаге, производимой на территории Республики Казахстан или ввозимой на ее территорию

act_code: '8884'
requisite: Постановление Правления Национального Банка Республики Казахстан от 16 апреля 2001 года № 96. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 мая 2001 года за № 1508. Утратило силу - постановлением Правления Национального Банка Республики Казахстан от 4 июля 2003 года № 222
title:
  rus: Об утверждении минимального требуемого рейтинга юридических лиц-нерезидентов Республики Казахстан, включая банки, которые могут приобрести десять и более процентов акций банка-резидента Республики Казахстан, банков-нерезидентов Республики Казахстан, создающих (имеющих) дочерние банки в Республике Казахстан, и перечня рейтинговых агентств, устанавливающих данный рейтинг, а также рейтинг банков-нерезидентов, зарегистрированных в оффшорных зонах или имеющих аффилиированных лиц, зарегистрированных в оффшорных зонах, которые могут прямо или косвенно являться учредителями или акционерами банков-резидентов
  kaz: Қазақстан Республикасының резидент емес заңды тұлғаларының, сонымен бiрге Қазақстан Республикасының резидент банкiнiң, Қазақстан Республикасында еншiлес банкiн ашатын (еншiлес банкi бар) Қазақстан Республикасының резидент емес банктерi акцияларының он процентiн және одан да көп процентiн сатып ала алатын банктердiң ең аз талап қойылатын рейтингiн және осындай рейтингті, сондай-ақ оффшорлық аймақтарда тiркелген немесе резидент банктердiң тiкелей немесе жанама құрылтайшылары немесе акционерлерi болып табылатын оффшорлық аймақтарда тiркелген қосылма тұлғалары бар резидент емес банктердiң рейтингін белгілейтiн рейтинг агенттіктерiнiң тiзбесiн бекiту туралы

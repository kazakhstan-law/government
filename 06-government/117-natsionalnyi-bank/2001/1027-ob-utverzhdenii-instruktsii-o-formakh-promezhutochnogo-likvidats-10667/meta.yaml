  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 октября 2001 года N 419 "Об утверждении Инструкции о формах промежуточного ликвидационного баланса, иных отчетов, ликвидационного баланса ликвидируемых банков в Республике Казахстан, сроках и порядке их представления ликвидационными комиссиями", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1698
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1698 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасындағы таратылатын банктердің аралық тарату балансының, басқа да есептерінің, тарату балансының нысандары және тарату комиссияларының оларды ұсыну мерзімдері мен тәртібі туралы Нұсқаулықты бекіту туралы 2001 жылғы 28 қазандағы N 419 қаулысына өзгерістер мен толықтырулар енгізу туралы

  kaz: Қазақстан Республикасындағы таратылатын банктердiң аралық тарату балансының, басқа да есептерiнiң, тарату балансының нысандары және тарату комиссияларының оларды ұсыну мерзiмдерi мен тәртiбi туралы нұсқаулықты бекiту жөнiнде

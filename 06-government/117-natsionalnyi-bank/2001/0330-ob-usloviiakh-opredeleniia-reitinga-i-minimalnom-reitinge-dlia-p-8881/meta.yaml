  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 ноября 2004 года N 324. Зарегистрировано Министерством юстиции Республики Казахстан от 15 декабря 2004 года N 3284. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2005 года N 384
  title:

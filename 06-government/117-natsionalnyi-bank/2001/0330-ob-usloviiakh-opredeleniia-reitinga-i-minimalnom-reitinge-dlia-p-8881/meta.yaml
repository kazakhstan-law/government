    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасының резидент емес сақтандыру (қайта сақтандыру) ұйымы үшiн рейтинг анықтау шарттары мен ең аз рейтинг туралы және рейтинг агенттiктерiнiң тiзбесiн бекiту туралы" 2001 жылғы 31 наурыздағы N 86 қаулысына өзгерiс пен толықтыруды енгiзу туралы

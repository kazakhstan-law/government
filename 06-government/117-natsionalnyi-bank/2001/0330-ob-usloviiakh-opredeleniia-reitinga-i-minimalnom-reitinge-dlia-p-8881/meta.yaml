act_code: '8881'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 марта 2001 года № 86. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2001 года за № 1503. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2005 года № 384
title:
  rus: Об условиях определения рейтинга и минимальном рейтинге для перестраховочной организации и страхового брокера - нерезидентов Республики Казахстан и утверждении перечня рейтинговых агентств
  kaz: Қазақстан Республикасының резиденті емес қайта сақтандыру ұйымының және сақтандыру брокерінің рейтинг анықтау шарттары мен ең аз рейтинг туралы және рейтинг агенттiктерiнiң тiзбесiн бекiту туралы

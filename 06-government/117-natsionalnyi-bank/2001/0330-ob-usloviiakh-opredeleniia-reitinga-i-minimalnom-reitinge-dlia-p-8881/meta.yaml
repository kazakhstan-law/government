  code: '19544'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 года N 114. Зарегистрировано Министерством юстиции Республики Казахстан от 27 апреля 2004 года N 2824. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2005 года N 384 (V053959)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 31 марта 2001 года N 86 "Об условиях определения рейтинга и минимальном рейтинге для перестраховочной организации и страхового брокера - нерезидентов Республики Казахстан и утверждении перечня рейтинговых агентств", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1503
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1503 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының резиденті емес қайта сақтандыру ұйымының және сақтандыру брокерінің рейтинг анықтау шарттары мен ең аз рейтинг туралы және рейтинг агенттіктерінің тізбесін бекіту туралы" 2001 жылғы 31 наурыздағы N 86 қаулысына өзгерістер мен толықтырулар енгізу туралы

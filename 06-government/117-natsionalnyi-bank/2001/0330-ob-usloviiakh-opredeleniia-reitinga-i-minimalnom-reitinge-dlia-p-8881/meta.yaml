    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының резидент емес сақтандыру (қайта сақтандыру) ұйымы үшін рейтинг анықтау шарттары мен ең аз рейтинг туралы және рейтинг агенттіктерінің тізбесін бекіту туралы " 2001 жылғы 31 наурыздағы N 86 қаулысына толықтырулар енгізу туралы

  code: '16400'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 4 июля 2003 года N 221. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 июля 2003 года за N 2418. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2005 года N 384 (V053959)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 31 марта 2001 года N 86 "Об условиях определения рейтинга и минимальном рейтинге для страховой (перестраховочной) организации-нерезидента Республики Казахстан и утверждении перечня рейтинговых агентств", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1503
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1503 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының резидент емес сақтандыру (қайта сақтандыру) ұйымы үшін рейтинг анықтау шарттары мен ең аз рейтинг туралы және рейтинг агенттіктерінің тізбесін бекіту туралы" 2001 жылғы 31 наурыздағы N 86 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '8880'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 марта 2001 года № 82. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2001 года за № 1502.  Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 40
title:
  rus: Об утверждении изменений и дополнений в Правила организации и проведения аукционов и конкурсов коммерческих предложений по продаже имущества ликвидируемых банков в Республике Казахстан, утвержденные постановлением Правления Национального Банка Республики Казахстан от 21 апреля 2000 года № 142
  kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының 2000 жылғы 21 сәуiрдегi № 142 қаулысымен бекiтiлген Қазақстан Республикасындағы таратылатын банктердiң мүлкiн сату жөнiнде аукциондар мен коммерциялық ұсыныстар конкурсын ұйымдастыру және өткiзу ережесiне өзгерiстер мен толықтыруларды бекiту туралы

  kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының 2000 жылғы 25 қарашадағы N№433 қаулысымен бекітілген Клиент пен оған қызмет көрсететін банктің арасында қолма-қол жасалмайтын төлемдерді жүзеге асыру ережесіне өзгерістер мен толықтыруларды бекіту туралы

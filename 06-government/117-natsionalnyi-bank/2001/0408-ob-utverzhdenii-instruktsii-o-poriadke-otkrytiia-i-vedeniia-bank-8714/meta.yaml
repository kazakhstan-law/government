  title:
    rus: Об утверждении изменений и дополнения в Инструкцию о порядке открытия и ведения банками второго уровня специальных счетов граждан Республики Казахстан, амнистированных в связи с легализацией ими денег, утвержденную постановлением Правления Национального Банка Республики Казахстан от 9 апреля 2001 года N 89 "Об утверждении Инструкции о порядке открытия и ведения банками второго уровня специальных счетов граждан Республики Казахстан, амнистированных в связи с легализацией ими денег"
    kaz: Қазақстан Республикасы Ұлттық Банкi Басқармасының "Ақшаны жария етуiне байланысты Қазақстан Республикасының рақымшылық жасалған азаматтарына екiншi деңгейдегi банктердiң арнайы есепшоттар ашу және жүргiзу тәртiбi туралы нұсқаулықты бекiту туралы" 2001 жылғы 9 сәуiрдегi N 89 қаулысымен бекiтiлген Ақшаны жария етуiне байланысты Қазақстан Республикасының рақымшылық жасалған азаматтарына екiншi деңгейдегi банктердiң арнайы есепшоттар ашу және жүргiзу тәртiбi туралы нұсқаулыққа өзгерiстер мен толықтыруды бекiту туралы

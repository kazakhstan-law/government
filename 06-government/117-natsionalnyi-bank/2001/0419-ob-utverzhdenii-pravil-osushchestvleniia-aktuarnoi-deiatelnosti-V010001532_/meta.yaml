  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 119. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 июня 2007 года № 4733. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 151
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года N 120 "Об утверждении Правил осуществления актуарной деятельности на страховом рынке, выдачи, приостановления действия и отзыва лицензии на осуществление актуарной деятельности, о порядке сдачи квалификационного экзамена актуариями"
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының "Сақтандыру рыногында актуарийлік қызметті жүзеге асыру, актуарлық ийлік қызметті жүзеге асыруға лицензия беру, қолданылуын тоқтату және қайтарып алу, актуарийлердің біліктілік емтиханын тапсыру тәртібі туралы" 2001 жылғы 20 сәуірдегі N 120 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/34021/rus

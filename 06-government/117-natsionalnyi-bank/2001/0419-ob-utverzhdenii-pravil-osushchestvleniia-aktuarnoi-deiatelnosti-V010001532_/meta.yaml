  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 ноября 2007 года N 254. Зарегистрировано в Министерстве юстиции Республики Казахстан 03 января 2008 года N 5076. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 151
  title:
    rus: О внесении дополнений и изменений в постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года N 120 "Об утверждении Правил осуществления актуарной деятельности на страховом рынке, выдачи, приостановления действия и лишения лицензии на осуществление актуарной деятельности, о порядке сдачи квалификационного экзамена актуариями"
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының "Сақтандыру рыногында актуарийлiк қызметтi жүзеге асыру, актуарийлік қызметті жүзеге асыруға лицензия беру, қолданылуын тоқтату және айыру, актуарийлердің біліктілік емтиханын тапсыру тәртібі туралы" 2001 жылғы 20 сәуірдегі N 120 қаулысына толықтырулар мен өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/36609/rus

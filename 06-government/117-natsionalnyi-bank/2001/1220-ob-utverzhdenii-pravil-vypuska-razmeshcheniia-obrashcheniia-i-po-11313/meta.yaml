  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 20 декабря 2001 года N 554 "Об утверждении Правил выпуска, размещения, обращения и погашения краткосрочных нот Национального Банка Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1748
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 1748 тiркелген Қазақстан Республикасы Ұлттық Банкi Басқармасының "Қазақстан Республикасы Ұлттық Банкiнiң қысқа мерзiмдi ноттарын шығару, орналастыру, айналысқа шығару және өтеу ережесiн бекiту туралы" 2001 жылғы 20 желтоқсандағы N 554 қаулысына өзгерiстер мен толықтырулар енгiзу туралы

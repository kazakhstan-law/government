  code: '22485'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 ноября 2004 года № 320. Зарегистрировано Министерством юстиции Республики Казахстан от 27 декабря 2004 года № 3306. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 151 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года № 120 "Об утверждении Правил осуществления актуарной деятельности на страховом рынке, выдачи, приостановления действия и отзыва лицензии актуариев, о порядке сдачи квалификационного экзамена актуариями и о полномочиях квалификационной комиссии уполномоченного государственного органа, осуществляющего регулирование и надзор финансового рынка и финансовых организаций»
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Сақтандыру рыногында актуарийлік қызметті жүзеге асыру, актуарийлерге лицензия беру, қолданылуын тоқтату және қайтарып алу және сақтандыру қызметін реттеу мен қадағалау жөніндегі уәкілетті мемлекеттік органның біліктілік комиссиясының өкілеттіктері туралы ережені бекіту жөнінде" 2001 жылғы 20 сәуірдегі № 120 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/22485/rus

  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года № 120 "Об утверждении Правил осуществления актуарной деятельности на страховом рынке, выдачи, приостановления действия и отзыва лицензии на осуществление актуарной деятельности, о порядке сдачи квалификационного экзамена актуариями"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Сақтандыру рыногында актуарлық қызметті жүзеге асыру, актуарлық қызметті жүзеге асыруға лицензия беру, қолданылуын тоқтату және қайтарып алу, актуарийлердің біліктілік емтиханын тапсыру тәртібі туралы ережені бекіту жөнінде" 2001 жылғы 20 сәуірдегі № 120 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/29612/rus

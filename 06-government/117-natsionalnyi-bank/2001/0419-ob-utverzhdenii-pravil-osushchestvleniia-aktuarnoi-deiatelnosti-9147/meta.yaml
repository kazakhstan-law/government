act_code: '9147'
requisite: Постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года № 120. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 июня 2001 года № 1532. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 151
title:
  rus: Об утверждении Правил осуществления актуарной деятельности, выдачи лицензии на право осуществления актуарной деятельности на страховом рынке, сдачи квалификационного экзамена актуарием, привлечения независимого актуария для проверки деятельности актуария, направления независимым актуарием результатов проверки достоверности расчетов, проведенных актуарием, состоящим в штате страховой (перестраховочной) организации
  kaz: Сақтандыру нарығында актуарийлiк қызметтi жүзеге асыру, актуарийлік қызметті жүзеге асыру құқығына лицензия беру, актуарийдің біліктілік емтиханын тапсыру, актуарийдiң қызметін тексеру үшін тәуелсіз актуарийдi тарту, тәуелсіз актуарийдiң сақтандыру (қайта сақтандыру) ұйымының штатында тұрған актуарий жүргізген есептердің шынайылығын тексеру нәтижелерін жіберу қағидаларын бекіту туралы

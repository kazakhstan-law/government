  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 20 апреля 2001 года № 120 "Об утверждении Правил осуществления актуарной деятельности на страховом рынке, выдачи, приостановления действия и лишения лицензии на осуществление актуарной деятельности, о порядке сдачи квалификационного экзамена актуариями"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Сақтандыру рыногында актуарийлiк қызметтi жүзеге асыру, актуарийлік қызметті жүзеге асыруға лицензия беру, қолданылуын тоқтату және айыру, актуарийлердің біліктілік емтиханын тапсыру тәртібі туралы" 2001 жылғы 20 сәуірдегі № 120 қаулысына өзгерістер мен толықтыруларды енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/55319/rus

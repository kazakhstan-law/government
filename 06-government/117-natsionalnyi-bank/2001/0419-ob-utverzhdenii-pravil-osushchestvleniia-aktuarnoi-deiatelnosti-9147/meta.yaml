  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций и Национального Банка Республики Казахстан по вопросам страхования и актуарной деятельности
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің және Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне сақтандыру және актуарлық қызмет мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

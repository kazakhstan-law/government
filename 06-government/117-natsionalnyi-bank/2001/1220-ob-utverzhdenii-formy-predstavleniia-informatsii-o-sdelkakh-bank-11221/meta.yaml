  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 февраля 2004 года N 37. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 марта 2004 года N 2761. Утратило силу постановлением Правления Агентства РК по регулированию и надзору фин.рынка и фин.организаций от 17 июня 2006 года N 134 (вводится в действие по истечении 14 дней со дня его гос.регистрации в МЮ РК)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 20 декабря 2001 года N 543 "Об утверждении формы представления информации по сделкам банков второго уровня с лицами, связанными особыми отношениями с ними", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1745
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1745 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктердің ерекше қатынастармен байланысты тұлғалармен мәмілелері бойынша ақпарат беру нысанын бекіту туралы" 2001 жылғы 20 желтоқсандағы N 543 қаулысына өзгерістер енгізу туралы

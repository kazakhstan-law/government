act_code: '11221'
requisite: Постановление Правления Национального Банка Республики Казахстан от 20 декабря 2001 года N 543. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 февраля 2002 года N 1745. Утратило силу постановлением Правления Агентства РК по регулированию и надзору фин.рынка и фин.организаций от 17 июня 2006 года N 134 (вводится в действие по истечении 14 дней со дня его гос.регистрации в МЮ РК)
title:

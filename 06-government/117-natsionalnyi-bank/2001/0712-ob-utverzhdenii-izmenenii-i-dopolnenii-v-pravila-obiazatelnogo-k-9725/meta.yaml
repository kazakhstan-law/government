act_code: '9725'
requisite: Постановление Правления Национального Банка Республики Казахстан от 13 июля 2001 года N 274.  Зарегистрировано в Министерстве юстиции Республики Казахстан 11 августа 2001 года N 1624. Утратило силу - постановлением Правления Национального Банка Республики Казахстан от 4 июля 2003 г. N 200
title:
  rus: Об утверждении изменений и дополнений в Правила обязательного коллективного гарантирования (страхования) вкладов (депозитов) физических лиц в банках второго уровня Республики Казахстан, утвержденные постановлением Правления Национального Банка Республики Казахстан от 5 ноября 1999 года N 340 "Об утверждении Правил обязательного коллективного гарантирования (страхования) вкладов (депозитов) физических лиц в банках второго уровня Республики Казахстан"
  kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасының екiншi деңгейдегi банктерiндегi жеке тұлғалардың салымдарына (депозиттерiне) мiндеттi ұжымдық кепiлдiк беру (сақтандыру) ережесiн бекiту туралы" 1999 жылғы 5 қарашадағы N 340 қаулысымен бекiтiлген Қазақстан Республикасының екiншi деңгейдегi банктерiндегi жеке тұлғалардың салымдарына (депозиттерiне) мiндеттi ұжымдық кепiлдiк беру (сақтандыру) ережесiне өзгерiстер мен толықтыруларды бекiту туралы

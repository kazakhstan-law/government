  code: '19127'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 февраля 2004 года N 39. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 марта 2004 года N 2756. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 376 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 октября 2001 года N 418 "Об утверждении Инструкции о формах промежуточного ликвидационного баланса, иных отчетов, ликвидационного баланса ликвидируемых страховых (перестраховочных) организаций в Республике Казахстан, сроках и порядке их представления ликвидационными комиссиями", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1727
    kaz: Қазақстан Республикасының Әділет министрлігінде 2001 жылғы 18-желтоқсанда N 1727 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасындағы таратылатын сақтандыру (қайта сақтандыру) ұйымдарының аралық тарату балансының, басқа да есептерінің, тарату балансының нысандары және тарату комиссияларының оларды ұсыну мерзімдері мен тәртібі туралы Нұсқаулықты бекіту туралы" 2001 жылғы 28-қазандағы N 418 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/19127/rus

  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 октября 2001 года N 418 "Об утверждении Инструкции о формах промежуточного ликвидационного баланса, иных отчетов, ликвидационного баланса ликвидируемых страховых (перестраховочных) организаций в Республике Казахстан, сроках и порядке их представления ликвидационными комиссиями"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқарамасының "Қазақстан Республикасындағы таратылатын сақтандыру (қайта сақтандыру) ұйымдарының аралық тарату балансының, басқа есептерінің, тарту балансының нысандары және тарату комиссияларының оларды ұсыну мерзімдері мен тәртібі туралы нұсқаулықты бекіту жөнінде" 2001 жылғы 28 қазандағы N 418 қаулысына өзгерістер мен толықтырулар енгізу туралы

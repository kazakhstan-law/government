act_code: '11085'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 октября 2001 года N 418. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 января 2002 года N 1727. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 376
title:
  rus: Об утверждении Инструкции о формах промежуточного ликвидационного баланса, иных отчетов, ликвидационного баланса ликвидируемых страховых (перестраховочных) организаций в Республике Казахстан, сроках и порядке их представления ликвидационными комиссиями
  kaz: Қазақстан Республикасындағы таратылатын сақтандыру (қайта сақтандыру) ұйымдарының аралық тарату балансының, басқа да есептерінің, тарату балансының нысандары және тарату комиссияларының оларды ұсыну мерзімдері мен тәртібі туралы нұсқаулықты бекіту жөнінде

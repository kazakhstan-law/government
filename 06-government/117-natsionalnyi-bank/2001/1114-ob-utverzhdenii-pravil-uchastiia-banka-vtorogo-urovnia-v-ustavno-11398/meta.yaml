act_code: '11398'
requisite: Постановление Правления Национального Банка Республики Казахстан от 14 ноября 2001 года N 427. Зарегистрировано Министерством юстиции Республики Казахстан 25 февраля 2002 года N 1770. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января  2006 года N 4 (V064079)
title:
  rus: Об утверждении Правил участия банка второго уровня в уставном капитале других юридических лиц, а также выдачи разрешения на создание или приобретение банком второго уровня дочерней организации
  kaz: Екінші деңгейдегі банктің басқа заңды тұлғалардың жарғылық капиталына қатысуы, сондай-ақ екінші деңгейдегі банктің еншілес ұйым құруына немесе ие болуына рұқсат беру ережесін бекіту жөнінде

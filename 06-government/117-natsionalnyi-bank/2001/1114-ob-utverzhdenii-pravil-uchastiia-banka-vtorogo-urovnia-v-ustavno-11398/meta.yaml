requisite: Постановление Правления Национального Банка Республики Казахстан от 14 ноября 2001 года N 427. Зарегистрировано Министерством юстиции Республики Казахстан 25 февраля 2002 года N 1770. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января  2006 года N 4 (V064079)
title:

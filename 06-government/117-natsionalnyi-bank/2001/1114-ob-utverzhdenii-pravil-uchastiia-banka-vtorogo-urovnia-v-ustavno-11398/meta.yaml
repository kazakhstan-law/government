  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 14 ноября 2001 года N 427 "Об утверждении Правил участия банка второго уровня в уставном капитале других юридических лиц, а также выдачи разрешения на создание или приобретение банком второго уровня дочерней организации"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екінші деңгейдегі банктің басқа заңды тұлғалардың жарғылық капиталына қатысуы, сондай-ақ екінші деңгейдегі банктің еншілес ұйым құруына немесе ие болуына рұқсат беру ережесін бекіту туралы" 2001 жылғы 14 қарашадағы N 427 қаулысына өзгерістер мен толықтыру енгізу туралы

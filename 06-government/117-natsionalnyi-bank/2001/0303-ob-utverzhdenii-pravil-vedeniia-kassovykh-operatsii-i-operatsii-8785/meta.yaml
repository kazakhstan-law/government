  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 3 марта 2001 года № 58 "Об утверждении Правил ведения кассовых операций в банках второго уровня и организациях, осуществляющих отдельные виды банковских операций, Республики Казахстан"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының екінші деңгейдегі банктерінде және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарда касса операцияларын жүргізу ережесін бекіту туралы" 2001 жылғы 3 наурыздағы № 58 қаулысына өзгерістер мен толықтырулар енгізу туралы

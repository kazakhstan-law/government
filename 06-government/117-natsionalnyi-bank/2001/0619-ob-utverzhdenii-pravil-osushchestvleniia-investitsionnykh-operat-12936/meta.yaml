  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 20 июня 2001 года N 237 "Об утверждении Правил осуществления инвестиционных операций Национального фонда Республики Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1568
    kaz: Қазақстан Республикасының Әділет министрлігінде 1568 нөмірімен тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасы Ұлттық қорының инвестициялық операцияларын жүзеге асыру ережесін бекіту туралы" 2001 жылғы 20 маусымдағы N 237 қаулысына өзгерістер енгізу туралы

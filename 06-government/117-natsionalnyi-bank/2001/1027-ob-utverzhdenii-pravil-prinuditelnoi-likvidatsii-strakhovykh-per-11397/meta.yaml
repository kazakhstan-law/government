act_code: '11397'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 октября 2001 года N 420. Зарегистрировано Министерством юстиции Республики Казахстан 25 февраля 2002 года N 1769. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года N 77
title:
  rus: Об утверждении Правил принудительной ликвидации страховых (перестраховочных) организаций в Республике Казахстан
  kaz: Қазақстан Республикасындағы сақтандыру (қайта сақтандыру) ұйымдарын еріксіз тарату туралы ереже

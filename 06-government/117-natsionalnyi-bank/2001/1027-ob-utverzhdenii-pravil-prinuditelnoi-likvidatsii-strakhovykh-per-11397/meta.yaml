  code: '18677'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 19 января 2004 года N 8. Зарегистрировано Министерством юстиции Республики Казахстан 23 февраля 2004 года N 2710. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года N 77
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 октября 2001 года N 420 "Об утверждении Правил о деятельности временной администрации, специального управляющего и принудительной ликвидации страховых (перестраховочных) организаций в Республике Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1769
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1769 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасындағы сақтандыру (қайта сақтандыру) ұйымдарының уақытша әкімшілігінің, арнайы басқарушысының қызметі және еріксіз тарату туралы ережені бекіту туралы" 2001 жылғы 28 қазандағы N 420 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/18677/rus

title:
  rus: Об утверждении изменения в Правила замены находящихся в обращении денежных знаков национальной валюты при изменении их дизайна (формы), утвержденные постановлением Правления Национального Банка Республики Казахстан от 20 июля 2000 года N 301
  kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының 2000 жылғы 20 шiлдедегі N 301 қаулысымен бекiтiлген Айналыстағы ұлттық валютаның ақша белгiлерiнiң дизайны (нысаны) өзгерген кезде оларды ауыстыру ережесiне өзгерiстi бекiту туралы

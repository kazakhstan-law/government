title:
  rus: Об утверждении Требований к организациям по хранению базового актива цифрового финансового актива в отношении цифровых финансовых активов, базовым активом которых выступают деньги и их эквиваленты
  kaz: Базалық активі ақша жəне оның баламалары болып табылатын цифрлық қаржы активтеріне қатысты цифрлық қаржы активінің базалық активін сақтау жөніндегі ұйымдарға қойылатын талаптарды бекіту туралы

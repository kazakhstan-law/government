act_code: '221629'
requisite: Постановление Правления Национального Банка Республики Казахстан от 21 января 2026 года № 3. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 января 2026 года № 37899
title:
  rus: Об утверждении Правил представления отчетности по соблюдению требований законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения, юридическими лицами, осуществляющими деятельность исключительно через обменный пункт на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
  kaz: Қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетел валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункті арқылы жүзеге асыратын заңды тұлғалардың Қазақстан Республикасының қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл туралы заңнамасының талаптарын сақтау жөніндегі есептілікті ұсыну қағидаларын бекіту туралы

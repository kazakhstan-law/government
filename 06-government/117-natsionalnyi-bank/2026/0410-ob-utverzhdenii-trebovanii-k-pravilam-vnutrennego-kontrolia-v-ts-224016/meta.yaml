act_code: '224016'
requisite: Постановление Правления Национального Банка Республики Казахстан от 10 апреля 2026 года № 31. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2026 года № 38410
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для эмитентов цифровых финансовых активов, базовым активом которых выступают деньги (стейблкоин)
  kaz: Базалық активі ақша (стейблкоин) болып табылатын цифрлық қаржы активтерінің эмитенттері үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

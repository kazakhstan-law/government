act_code: '223412'
requisite: Постановление Правления Национального Банка Республики Казахстан от 31 марта 2026 года № 28. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 апреля 2026 года № 38325
title:
  rus: Об установлении порогового значения в отношении суммы покупки безналичной иностранной валюты на внутреннем валютном рынке Республики Казахстан, при достижении которого применяются требования по подтверждению целей покупки безналичной иностранной валюты за национальную валюту на внутреннем валютном рынке Республики Казахстан и порядок ее использования на заявленные цели
  kaz: Қазақстан Республикасының ішкі валюта нарығында қолма-қол ақшасыз шетел валютасын сатып алу сомасына қатысты шекті мəнге жеткен кезде Қазақстан Республикасының ішкі валюта нарығында ұлттық валютаға қолма-қол ақшасыз шетел валютасын сатып алу мақсаттарын растау жөніндегі талаптар жəне оны мәлімделген мақсаттарға пайдалану тәртібі қолданылатын шекті мәнді белгілеу туралы

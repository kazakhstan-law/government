act_code: '224013'
requisite: Постановление Правления Национального Банка Республики Казахстан от 10 апреля 2026 года № 33. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2026 года № 38408
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для операторов обмена необеспеченных цифровых активов, операторов платформы цифровых финансовых активов и операторов торговой платформы цифровых активов
  kaz: Қамтамасыз етілмеген цифрлық активтерді айырбастау операторлары, цифрлық қаржы активтері платформасының операторлары және цифрлық активтердің сауда платформасының операторлары үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

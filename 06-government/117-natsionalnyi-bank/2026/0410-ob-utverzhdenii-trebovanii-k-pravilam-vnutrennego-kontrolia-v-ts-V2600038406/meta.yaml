title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для участников особого режима регулирования Национального Банка Республики Казахстан, осуществляющих деятельность в сфере цифровых активов
  kaz: Цифрлық активтер саласындағы қызметті жүзеге асыратын Қазақстан Республикасы Ұлттық Банкінің ерекше реттеу режимінің қатысушылары үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

act_code: '223997'
requisite: Постановление Правления Национального Банка Республики Казахстан от 10 апреля 2026 года № 32. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2026 года № 38406
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для участников особого режима регулирования Национального Банка Республики Казахстан, осуществляющих деятельность в сфере цифровых активов
  kaz: Цифрлық активтер саласындағы қызметті жүзеге асыратын, Қазақстан Республикасы Ұлттық Банкінің реттеудің ерекше режиміне қатысушылар үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

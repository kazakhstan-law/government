title:
  rus: Об утверждении Правил представления отчетности операторами обмена необеспеченных цифровых активов, операторами платформы цифровых финансовых активов, операторами торговой платформы цифровых активов, эмитентами цифровых финансовых активов в Национальный Банк Республики Казахстан
  kaz: Қамтамасыз етілмеген цифрлық активтерді айырбастау операторларының, цифрлық қаржы активтері платформасы операторларының, цифрлық активтердің сауда платформасы операторларының, цифрлық қаржы активтері эмитенттерінің Қазақстан Республикасының Ұлттық Банкіне есептілікті ұсыну қағидаларын бекіту туралы

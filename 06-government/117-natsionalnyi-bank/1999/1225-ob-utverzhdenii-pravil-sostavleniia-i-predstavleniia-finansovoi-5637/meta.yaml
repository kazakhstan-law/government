  title:
    rus: О внесении изменения и дополнения в Правила составления и представления финансовой и регуляторной отчетности кредитными товариществами, утвержденные постановлением Правления Национального Банка Республики Казахстан от 25 декабря 1999 года N 472 "Об утверждении Правил составления и представления финансовой и регуляторной отчетности кредитными товариществами"
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Кредиттiк серiктестiктердiң қаржылық және реттеушi есебiн жасау және ұсыну ережесiн бекiту туралы" 1999 жылғы 25 желтоқсандағы N 472 қаулысымен бекiтiлген Кредиттiк серiктестiктердiң қаржылық және реттеушi есебiн жасау және ұсыну ережесiне өзгерiс пен толықтыру енгiзу туралы

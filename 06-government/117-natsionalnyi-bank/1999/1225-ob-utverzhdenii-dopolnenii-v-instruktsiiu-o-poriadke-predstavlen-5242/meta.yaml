act_code: '5242'
requisite: Постановление Правления Национального Банка Республики Казахстан от 25 декабря 1999 года № 436. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 февраля 2000 года N 1046. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 23 декабря 2002 года № 508
title:
  rus: Об утверждении дополнений в Инструкцию о порядке представления кредитными товариществами в Национальный Банк Республики Казахстан ежемесячного баланса и дополнительных данных для расчета пруденциальных нормативов и других обязательных к соблюдению норм и лимитов
  kaz: Кредиттік серіктестіктердің Қазақстан Республикасының Ұлттық Банкіне ай сайын баланс пен пруденциалдық нормативтерді және басқа сақталуға міндетті нормалар мен лимиттерді есептеу үшін қосымша мәліметтер беру тәртібі туралы нұсқаулыққа толықтыруларды бекіту туралы

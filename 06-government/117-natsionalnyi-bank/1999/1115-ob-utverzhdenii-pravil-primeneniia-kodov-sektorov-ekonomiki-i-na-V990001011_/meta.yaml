  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 388 "Об утверждении Правил применения кодов секторов экономики и назначения платежей и представления сведений по платежам в соответствии с ними"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Экономика секторларының және төлемдер белгілеу кодтарын қолдану және төлемдер бойынша оларға сәйкес мәліметтер ұсыну қағидаларын бекіту туралы" 1999 жылғы 15 қарашадағы № 388 қаулысына өзгерістер мен толықтырулар енгізу туралы

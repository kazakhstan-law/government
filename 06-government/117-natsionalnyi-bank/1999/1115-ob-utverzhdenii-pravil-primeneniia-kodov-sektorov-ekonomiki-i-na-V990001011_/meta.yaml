  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 388 "Об утверждении Правил применения Государственного классификатора Республики Казахстан - единого классификатора назначения платежей"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының мемлекеттік жіктеушісін - төлем белгілеудің бірыңғай жіктеушісін қолдану ережесін бекіту туралы" 1999 жылғы 15 қарашадағы № 388 қаулысына толықтырулар мен өзгерістер енгізу туралы

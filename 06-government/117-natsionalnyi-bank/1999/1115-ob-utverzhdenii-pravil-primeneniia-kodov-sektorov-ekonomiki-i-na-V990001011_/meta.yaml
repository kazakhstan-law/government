title:
  rus: Об утверждении Правил применения кодов секторов экономики и назначения платежей и представления сведений по платежам в соответствии с ними
  kaz: Экономика секторларының кодтарын қолдану мен төлемдер тағайындау және соларға сәйкес төлемдер бойынша мәліметтер ұсыну қағидаларын бекіту туралы

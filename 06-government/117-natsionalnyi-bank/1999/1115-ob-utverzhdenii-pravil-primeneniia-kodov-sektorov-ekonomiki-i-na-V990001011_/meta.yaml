  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 15 ноября 1999 года N 388 "Об утверждении Правил Применения Государственного классификатора Республики Казахстан - единого классификатора назначения платежей"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының мемлекеттік жіктеушісін - төлем белгілеудің бірыңғай жіктеушісін қолдану ережесін бекіту туралы" 1999 жылғы 15 қарашадағы N 388 қаулысына өзгерістер мен толықтыру енгізу туралы

    kaz: Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне екінші деңгейдегі банктердің аударым және жай коммерциялық вексельдермен операцияларын жүзеге асыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 3 июля 1999 года N 157 "Об утверждении Правил проведения операций в клиринговой системе республиканского государственного предприятия на праве хозяйственного ведения "Казахстанский центр межбанковских расчетов", зарегистрированное в Министерстве юстиции Республики Казахстан под N 905
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 905 тiркелген, Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан банкаралық есеп айырысу орталығы" шаруашылық жүргiзу құқығы бар республикалық мемлекеттiк кәсiпорнының клиринг жүйесiнде операциялар жүргiзу ережесiн бекiту туралы" 1999 жылғы 3 шiлдедегi N 157 қаулысына өзгерiстер енгiзу туралы

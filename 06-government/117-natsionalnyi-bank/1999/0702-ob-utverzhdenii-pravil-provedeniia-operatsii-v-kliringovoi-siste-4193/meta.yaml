title:
  rus: Об утверждении Правил проведения операций в клиринговой системе Республиканского государственного предприятия на праве хозяйственного ведения "Казахстанский центр межбанковских расчетов Национального Банка Республики Казахстан"
  kaz: '"Қазақстан банкаралық есеп айырысу орталығы" шаруашылық жүргізу құқығы бар республикалық мемлекеттік кәсіпорынның клиринг жүйесінде операциялар жүргізу ережесін бекіту туралы'

  title:
    rus: О внесении дополнений в постановление Правления Национального Банка Республики Казахстан от 3 июля 1999 года N 157 "Об утверждении Правил проведения операций в клиринговой системе Республиканского государственного предприятия на праве хозяйственного ведения "Казахстанский центр межбанковских расчетов", зарегистрированное в Министерстве юстиции Республики Казахстан под N 905
    kaz: Қазақстан Республикасының Әділет министрлігінде N 905 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан банкаралық есеп айырысу орталығы" шаруашылық жүргiзу құқығы бар Республикалық мемлекеттiк кәсiпорынның клиринг жүйесiнде операциялар жүргiзу ережесiн бекіту туралы" 1999 жылғы 3 шілдедегі N 157 қаулысына толықтырулар енгізу туралы

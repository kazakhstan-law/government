title:
  rus: Об утверждении Инструкции о порядке проведения курсов по организации банковского аудита, а также прохождения тестирования кандидатами на получение лицензии на проведение аудита банковской деятельности
  kaz: Банктік аудит ұйымдастыру бойынша курстар жүргізу, сондай-ақ банк қызметіне аудит жүргізуге арналған лицензия алуға үміткерлерді сынақтан өткізу тәртібі туралы нұсқаулықты бекіту жөнінде

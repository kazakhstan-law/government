requisite: Постановление Правления Национального Банка Республики Казахстан от 7 октября 1999 года N 325. Зарегистрирован в Министерстве юстиции Республики Казахстан 17.02.2000г. за N 1059. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 ноября 2008 года № 95
title:
  rus: Об утверждении Правил обеспечения безопасности рабочего места пользователя платежной системы Республиканского государственного предприятия на праве хозяйственного ведения "Казахстанский центр межбанковских расчетов Национального Банка Республики Казахстан"
  kaz: '"Қазақстан Республикасы Ұлттық Банкінің Қазақстан банкаралық есеп айрысу орталығы" шаруашылық жүргізу құқығы бар республикалық мемлекеттік кәсіпорнының Төлем жүйесін пайдаланушының жұмыс орнының қауіпсіздігін қамтамасыз ету ережелерін бекіту туралы'

  requisite: Постановление Правления Национального Банка Республики Казахстан от 2 декабря 2003 года № 410. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 декабря 2003 года № 2624. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года № 159
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 7 октября 1999 года № 334 "Об утверждении Инструкции о порядке и условиях согласования руководящих работников банков второго уровня и организаций, осуществляющих отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1028
    kaz: Қазақстан Республикасының Әділет министрлігінде № 1028 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Екiншi деңгейдегi банктердiң және банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың басшы қызметкерлерiне келiсiм беру тәртiбi мен шарттары туралы нұсқаулықты бекіту туралы" 1999 жылғы 7 қазандағы № 334 қаулысына өзгерістер енгізу туралы

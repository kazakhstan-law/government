requisite: Постановление Правления Национального Банка Республики Казахстан от 7 октября 1999 года № 334. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 января 2000 года № 1028. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года № 159
title:
  rus: Об утверждении Инструкции о порядке и условиях согласования руководящих работников банков второго уровня и организаций, осуществляющих отдельные виды банковских операций
  kaz: Екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың басшы қызметкерлеріне келісім беру тәртібі мен шарттары туралы нұсқаулықты бекіту туралы

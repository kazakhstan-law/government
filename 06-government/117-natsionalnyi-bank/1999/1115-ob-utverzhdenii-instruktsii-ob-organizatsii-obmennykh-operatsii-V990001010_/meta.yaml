  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 400 "Об утверждении Инструкции об организации обменных операций с наличной иностранной валютой в Республике Казахстан"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру туралы нұсқаулықты бекіту туралы" 1999 жылғы 15 қарашадағы № 400 қаулысына өзгерістер мен толықтырулар енгізу туралы

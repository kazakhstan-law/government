  requisite: Постановление Правления Национального Банка Республики Казахстан от 25 июля 2003 года № 255. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 сентября 2003 г. № 2470. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 октября 2006 года № 106
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 400 "Об утверждении Инструкции об организации обменных операций с наличной иностранной валютой в Республике Казахстан", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1010
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1010 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру туралы нұсқаулықты бекіту жөнінде" 1999 жылғы 15 қарашадағы N 400 қаулысына өзгерістер мен толықтырулар енгізу туралы

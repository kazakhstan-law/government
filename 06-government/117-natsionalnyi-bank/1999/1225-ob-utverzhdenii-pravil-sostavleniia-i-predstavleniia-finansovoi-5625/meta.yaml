requisite: Постановление Правления Национального Банка Республики Казахстан от 25 декабря 1999 года N 455. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2000 года N 1094. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 23 декабря 2002 года N 509 (вводится в действие по истечении четырнадцати дней со дня государственной регистрации)
title:
  rus: Об утверждении Правил составления и представления финансовой и регуляторной отчетности организациями, осуществляющими отдельные виды банковских операций

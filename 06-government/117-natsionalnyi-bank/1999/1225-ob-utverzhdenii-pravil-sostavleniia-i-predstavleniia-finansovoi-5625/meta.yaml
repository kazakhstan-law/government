  title:
    rus: О внесении изменения в Правила составления и представления финансовой и регуляторной отчетности организациями, осуществляющими отдельные виды банковских операций, утвержденные постановлением Правления Национального Банка Республики Казахстан от 25 декабря 1999 года № 455 "Об утверждении Правил составления и представления финансовой и регуляторной отчетности организациями, осуществляющими отдельные виды банковских операций"
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың қаржылық және реттеушi есебiн жасау және ұсыну ережесiн бекiту туралы" 1999 жылғы 25 желтоқсандағы № 455 қаулысымен бекiтiлген Банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың қаржылық және реттеушi есебiн жасау және ұсыну ережесiне өзгерiс енгiзу туралы

title:
  rus: Об утверждении Правил конвертации тенговых депозитов физических и юридических лиц в банках второго уровня в связи с переходом к режиму свободно плавающего обменного курса тенге
  kaz: Еркін өзгермелі айырбас бағамы режиміне көшуге байланысты жеке және заңды тұлғалардың екінші деңгейдегі банктердегі теңгелік депозиттерін айырбастауды жүзеге асыру ережелерін бекіту туралы

  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения банковских счетов в Национальном Банке Республики Казахстан и исполнения инкассовых распоряжений
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына Қазақстан Республикасының Ұлттық Банкінде банктік шоттарды жүргізу және инкассалық өкімдерді орындау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: Об утверждении изменений в Правила установления корреспондентских отношений между Национальным Банком Республики Казахстан и банками второго уровня, а также организациями, осуществляющими отдельные виды банковских операций, утвержденные постановлением Правления Национального Банка Республики Казахстан от 28 марта 1999 года N 37
    kaz: Қазақстан Республикасы Ұлттық Банкi Басқармасының 1999 жылғы 28 наурыздағы N 37 қаулысымен бекiтiлген Қазақстан Республикасы Ұлттық Банкi мен екiншi деңгейдегi банктердiң, сондай-ақ банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың арасында корреспонденттiк қатынастар орнату жөнiндегi ережелерге өзгерiстердi бекiту туралы

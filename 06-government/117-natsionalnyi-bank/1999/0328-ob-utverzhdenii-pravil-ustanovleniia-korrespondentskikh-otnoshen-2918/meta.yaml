  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам перехода на новую структуру номера банковского счета клиента банка и банковского идентификационного кода
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына банк клиентінің банк шоты нөмірінің және банктік сәйкестендіру кодының жаңа құрылымына көшу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  code: '16902'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 11 августа 2003 года N 293. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 сентября 2003 г. за N 2489. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 3 февраля 2014 года № 14
  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 28 марта 1999 года N 37 "Об утверждении Правил установления корреспондентских отношений между Национальным Банком Республики Казахстан и банками второго уровня, а также организациями, осуществляющими отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 754
    kaz: Қазақстан Республикасының Әділет министрлігінде N 754 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасы Ұлттық Банкi мен екiншi деңгейдегi банктердiң, сондай-ақ банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың арасында корреспонденттiк қатынастар орнату жөнiндегi ережені бекіту туралы" 1999 жылғы 28 наурыздағы N 37 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/16902/rus

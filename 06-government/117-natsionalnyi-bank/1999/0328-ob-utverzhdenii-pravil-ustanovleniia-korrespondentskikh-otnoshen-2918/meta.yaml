  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан "Об утверждении Правил установления корреспондентских отношений между Национальным Банком Республики Казахстан и банками второго уровня, а также организациями, осуществляющими отдельные виды банковских операций" от 28 марта 1999 года N 37

  code: '21675'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 25 сентября 2004 года № 136. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 октября 2004 года № 3173. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 3 февраля 2014 года № 14
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 марта 1999 года N 37 "Об утверждении Правил установления корреспондентских отношений между Национальным Банком Республики Казахстан и банками второго уровня, а также организациями, осуществляющими отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 754, а также в постановление Правления Национального Банка Республики Казахстан от 8 октября 2001 года N 383 "Об утверждении Инструкции о порядке проведения инспектирования деятельности клиринговых организаций-организаций, осуществляющих отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 1771
    kaz: Қазақстан Республикасының Әділет министрлігінде N 754 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасы Ұлттық Банкі мен екінші деңгейдегі банктердің, сондай-ақ банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың арасында корреспонденттік қатынастар орнату жөніндегі ережелерді бекіту туралы" 1999 жылғы 28 наурыздағы N 37 қаулысына, сондай-ақ Қазақстан Республикасының Әділет министрлігінде N 1771 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Клиринг ұйымдарының - банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қызметін инспекциялауды жүргізу тәртібі туралы нұсқаулықты бекіту жөнінде" 2001 жылғы 8 қазандағы N 383 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/21675/rus

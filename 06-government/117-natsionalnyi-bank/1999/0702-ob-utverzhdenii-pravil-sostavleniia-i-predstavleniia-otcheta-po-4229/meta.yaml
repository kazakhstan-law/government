    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының кейбір қаулыларына төлемдер жөнінде мәліметтер беру мәселелері бойынша толықтырулар мен өзгерістер енгізу және Қазақстан Республикасының Ұлттық Банкі Басқармасының қолма-қол жасалмайтын төлемдер мен ақша аударымдары тәсілдері бойынша төлем айналымын бөлу жөнінде есеп жасау және ұсыну мәселелері бойынша кейбір қаулыларының күші жойылды деп тану туралы

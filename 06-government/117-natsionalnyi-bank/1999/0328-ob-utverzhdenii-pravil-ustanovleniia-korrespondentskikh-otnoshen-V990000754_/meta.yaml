  requisite: Постановление Правления Национального Банка Республики Казахстан от 17 ноября 2005 года № 147. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 декабря 2005 года № 3993. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 декабря 2015 года № 262
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Национального Банка Республики Казахстан по вопросам, связанным с разделением функций между подразделениями Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасының Ұлттық Банкі бөлімшелерінің арасында функцияларды бөлуге байланысты мәселелер бойынша Қазақстан Республикасы Ұлттық Банкінің кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу туралы

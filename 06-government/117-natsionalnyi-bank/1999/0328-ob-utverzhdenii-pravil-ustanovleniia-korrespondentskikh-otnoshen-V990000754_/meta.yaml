  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 марта 1999 года N 37 "Об утверждении Правил установления корреспондентских отношений между Национальным Банком Республики Казахстан и банками, а также организациями, осуществляющими отдельные виды банковских операций"

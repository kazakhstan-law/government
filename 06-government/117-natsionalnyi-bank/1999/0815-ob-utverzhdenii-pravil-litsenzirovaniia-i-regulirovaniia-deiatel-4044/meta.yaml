  title:
    rus: О внесении изменений и дополнения в постановление Правления Национального Банка Республики Казахстан от 16 августа 1999 года N 271 "Об утверждении Правил лицензирования и регулирования деятельности организаций, осуществляющих отдельные виды банковских операций", зарегистрированное в Министерстве юстиции Республики Казахстан под N 888
    kaz: Қазақстан Республикасының Әдiлет министрлігінде N 888 тiркелген Қазақстан Республикасының Ұлттық Банкi Басқармасының "Банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың қызметiн лицензиялау және реттеу ережесiн бекiту туралы" 1999 жылғы 16 тамыздағы N 271 қаулысына өзгерiстер мен толықтыру енгiзу туралы

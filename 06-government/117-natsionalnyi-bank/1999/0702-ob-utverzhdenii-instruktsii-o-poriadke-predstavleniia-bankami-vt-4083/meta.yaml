act_code: '4083'
requisite: Постановление Правления Национального Банка Республики Казахстан от 3 июля 1999 года № 156. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 сентября 1999 года № 895. Утратило силу - постановлением Правления Национального Банка Республики Казахстан от 29 декабря 2002 года № 532
title:
  rus: Об утверждении Инструкции о порядке представления банками второго уровня в Национальный Банк Республики Казахстан формы ежедневного баланса и дополнительных данных для расчета пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов
  kaz: Екінші деңгейдегі банктердің Қазақстан Республикасының Ұлттық Банкіне күн сайынғы баланс нысаны мен пруденциалдық нормативтерді және басқа сақталуға міндетті нормалар мен лимиттерді есептеу үшін қосымша мәліметтер беру тәртібі туралы нұсқаулықты бекіту туралы

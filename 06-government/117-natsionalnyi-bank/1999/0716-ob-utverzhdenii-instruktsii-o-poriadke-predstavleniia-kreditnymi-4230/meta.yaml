title:
  rus: Об утверждении Инструкции о порядке представления кредитными товариществами в Национальный Банк Республики Казахстан ежемесячного баланса и дополнительных данных для расчета пруденциальных нормативов и других обязательных к соблюдению норм и лимитов
  kaz: Кредиттік серіктестіктердің Қазақстан Республикасының Ұлттық Банкіне ай сайын баланс пен пруденциалдық нормативтерді және басқа сақталуға міндетті нормалар мен лимиттерді есептеу үшін қосымша мәліметтер беру тәртібі туралы нұсқаулықтар бекіту туралы

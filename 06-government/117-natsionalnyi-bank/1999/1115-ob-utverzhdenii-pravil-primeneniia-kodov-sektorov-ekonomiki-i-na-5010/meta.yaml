  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 388 "Об утверждении Правил применения Государственного классификатора Республики Казахстан - единого классификатора назначения платежей", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1011
    kaz: Қазақстан Республикасының Әділет министрлігінде № 1011 тіркелген, Қазақстан Республикасының Ұлттық Банкі Басқармасының "Қазақстан Республикасының мемлекеттік жіктеушісін - төлем белгілеудің бірыңғай жіктеушісін қолдану ережесін бекіту туралы" 1999 жылғы 15 қарашадағы № 388 қаулысына өзгерістер мен толықтырулар енгізу туралы

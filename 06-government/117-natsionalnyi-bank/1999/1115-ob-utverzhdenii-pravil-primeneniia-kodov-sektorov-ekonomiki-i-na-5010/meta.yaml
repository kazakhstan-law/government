requisite: Постановление Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 388. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 декабря 1999 года № 1011. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 августа 2016 года № 203
title:
  rus: Об утверждении Правил применения кодов секторов экономики и назначения платежей и представления сведений по платежам в соответствии с ними
  kaz: Экономика секторларының кодтарын қолдану мен төлемдер тағайындау және соларға сәйкес төлемдер бойынша мәліметтер ұсыну қағидаларын бекіту туралы

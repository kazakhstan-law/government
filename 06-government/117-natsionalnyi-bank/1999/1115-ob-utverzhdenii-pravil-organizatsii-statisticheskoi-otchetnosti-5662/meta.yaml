title:
  rus: Об утверждении Правил организации статистической отчетности в банках Республики Казахстан и о сроках перехода на новые формы отчетов
  kaz: Қазақстан Республикасының банктерінде статистикалық есеп беруді ұйымдастыру ережесін бекіту туралы және есеп берудің жаңа үлгілеріне көшу мерзімі туралы

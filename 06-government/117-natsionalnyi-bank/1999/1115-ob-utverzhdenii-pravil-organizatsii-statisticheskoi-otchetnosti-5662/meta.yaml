  title:
    rus: Об утверждении изменений в Правила организации статистической отчетности в банках Республики Казахстан, утвержденные постановлением Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 347 "Об утверждении Правил организации статистической отчетности в банках Республики Казахстан и о сроках перехода на новые формы отчетов"
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының "Қазақстан Республикасының банктерiнде статистикалық есеп беруді ұйымдастыру ережесiн бекiту туралы және есеп берудiң жаңа үлгiлерiне көшу мерзiмi туралы" 1999 жылғы 15 қарашадағы N 347 қаулысымен бекiтiлген Қазақстан Республикасының банктерiнде статистикалық есеп берудi ұйымдастыру ережесiне өзгерiстердi бекiту туралы

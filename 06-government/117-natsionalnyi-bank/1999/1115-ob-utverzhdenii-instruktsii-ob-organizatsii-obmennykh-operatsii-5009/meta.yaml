  title:
    rus: Об утверждении изменения и дополнения в Инструкцию об организации обменных операций с наличной иностранной валютой в Республике Казахстан, утвержденную постановлением Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 400
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының 1999 жылғы 15 қарашадағы N 400 қаулысымен бекітілген Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру туралы нұсқаулыққа өзгеріс пен толықтыруды бекіту туралы

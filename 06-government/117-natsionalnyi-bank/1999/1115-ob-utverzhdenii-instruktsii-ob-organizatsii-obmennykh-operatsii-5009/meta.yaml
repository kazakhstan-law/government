title:
  rus: Об утверждении Инструкции об организации обменных операций с наличной иностранной валютой в Республике Казахстан
  kaz: Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру туралы нұсқаулықты бекiту жөнiнде

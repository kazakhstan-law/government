  title:
    rus: Об утверждении дополнений и изменений в Инструкцию об организации обменных операций с наличной иностранной валютой в Республике Казахстан, утвержденную постановлением Правления Национального Банка Республики Казахстан от 15 ноября 1999 года № 400
    kaz: Қазақстан Республикасының Ұлттық Банкi Басқармасының 1999 жылғы 15 қарашадағы N 400 қаулысымен бекiтiлген Қазақстан Республикасында қолма-қол шетел валютасымен айырбастау операцияларын ұйымдастыру туралы нұсқаулыққа өзгерiстер мен толықтыруларды бекiту туралы

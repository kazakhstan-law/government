  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Национального Банка Республики Казахстан по вопросам ведения бухгалтерского учета и признании утратившими силу некоторых постановлений Правления Национального Банка Республики Казахстан, а также структурных элементов некоторых постановлений Правления Национального Банка Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының бухгалтерлік есеп жүргізу мәселелері жөніндегі кейбір қаулыларына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларының, сондай-ақ Қазақстан Республикасы Ұлттық Банкі Басқармасының кейбір қаулыларының құрылымдық элементтерінің күші жойылды деп тану туралы

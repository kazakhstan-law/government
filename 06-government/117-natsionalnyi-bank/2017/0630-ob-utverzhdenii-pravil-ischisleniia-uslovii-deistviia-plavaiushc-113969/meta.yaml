act_code: '113969'
requisite: Постановление Правления Национального Банка Республики Казахстан от 30 июня 2017 года № 119. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 августа 2017 года № 15460. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 45 (вводится в действие по истечении десяти календарных дней после дня его первого опубликования)

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам кредитных бюро и регулирования банковской и микрофинансовой деятельности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне кредиттік бюролар мен банктік және микроқаржылық қызметті реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

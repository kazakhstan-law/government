  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования банковской деятельности
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне банк қызметін реттеу мәселелері бойынша өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам пруденциального регулирования
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне пруденциялық реттеу мәселелері бойынша өзгерістер енгізу туралы

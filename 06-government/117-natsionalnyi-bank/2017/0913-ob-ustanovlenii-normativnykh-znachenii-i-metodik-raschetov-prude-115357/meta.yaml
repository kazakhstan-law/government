  title:
    rus: О внесении изменения и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования финансового рынка
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығын реттеу мәселелері бойынша өзгеріс пен толықтырулар енгізу туралы

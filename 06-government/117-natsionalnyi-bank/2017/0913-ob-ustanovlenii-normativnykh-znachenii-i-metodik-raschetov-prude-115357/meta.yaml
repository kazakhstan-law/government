  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования финансового рынка
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығын реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

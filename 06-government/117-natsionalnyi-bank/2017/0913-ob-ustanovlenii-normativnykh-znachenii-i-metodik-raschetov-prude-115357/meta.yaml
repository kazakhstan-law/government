  code: '129000'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 31 января 2019 года № 19. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 февраля 2019 года № 18284. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 апреля 2026 года № 85 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 13 сентября 2017 года № 170 «Об установлении нормативных значений и методик расчетов пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов размера капитала банка на определенную дату и Правил расчета и лимитов открытой валютной позиции»
    kaz: «Пруденциалдық қалыптардың қалыптық және өзге де орындалуы міндетті нормалар мен лимиттерді маңызы мен есептеу әдістемелерін, белгілі бір күнге шекті банк капиталының мөлшерін және Ашық валюталық позицияларды есептеу қағидалары мен олардың лимиттерін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 13 қыркүйектегі № 170 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/129000/rus

act_code: '115357'
requisite: Постановление Правления Национального Банка Республики Казахстан от 13 сентября 2017 года № 170. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 октября 2017 года № 15886.  Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 апреля 2026 года № 85 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении нормативных значений и методик расчетов пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов, размера капитала банка и Правил расчета и лимитов открытой валютной позиции
  kaz: Банктің пруденциялық нормативтерінің және сақталуы міндетті өзге де нормалары мен лимиттерінің нормативтік мәндері мен оларды есептеу әдістемелерін, капиталының мөлшерін және Ашық валюталық позицияны есептеу қағидалары мен оның лимиттерін белгілеу туралы

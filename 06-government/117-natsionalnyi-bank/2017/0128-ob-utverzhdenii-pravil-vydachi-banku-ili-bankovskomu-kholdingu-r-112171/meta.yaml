act_code: '112171'
requisite: Постановление Правления Национального Банка Республики Казахстан от 28 января 2017 года № 24. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 апреля 2017 года № 15050. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 31 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи банку или банковскому холдингу разрешения на создание или приобретение дочерней организации, на значительное участие в капитале организаций, на создание или приобретение банком дочерней организации, приобретающей сомнительные и безнадежные активы родительского банка, а также отзыва и (или) отмены разрешения на создание, приобретение дочерней организации, значительное участие в капитале организаций
  kaz: Банкке немесе банк холдингіне еншілес ұйымды құруға немесе сатып алуға, ұйымдардың капиталына қомақты қатысуға, бас банктің күмәнді және үмітсіз активтерін сатып алатын еншілес ұйымды банктің құруына немесе сатып алуына, сондай-ақ еншілес ұйымды құруға, сатып алуға, ұйымдардың капиталына қомақты қатысуына рұқсатты қайтарып алу және (немесе) оның күшін жою қағидаларын бекіту туралы

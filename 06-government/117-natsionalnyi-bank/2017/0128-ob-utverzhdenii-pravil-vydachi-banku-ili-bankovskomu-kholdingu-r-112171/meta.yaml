caused_by:
  code: '174364'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 ноября 2022 года № 98. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 ноября 2022 года № 30772. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 31 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 28 января 2017 года № 24 «Об утверждении Правил выдачи банку и (или) банковскому холдингу разрешения на создание или приобретение дочерней организации, на создание или приобретение банком дочерней организации, приобретающей сомнительные и безнадежные активы родительского банка, на значительное участие банка и (или) банковского холдинга в капитале организаций, а также отзыва разрешения на создание, приобретение банком и (или) банковским холдингом дочерней организации, значительное участие банка и (или) банковского холдинга в капитале организаций»
    kaz: «Банкке және (немесе) банк холдингіне еншілес ұйымды құруға немесе сатып алуға, бас банктің күмәнді және үмітсіз активтерін сатып алатын еншілес ұйымды банктің құруына немесе сатып алуына, банктің және (немесе) банк холдингінің ұйымдардың капиталына қомақты қатысуға рұқсатты беру, сондай-ақ банктің және (немесе) банк холдингінің еншілес ұйымды құруға, сатып алуға, банктің және (немесе) банк холдингінің ұйымдардың капиталына қомақты қатысуына рұқсатты қайтарып алу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 28 қаңтардағы № 24 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/174364/rus

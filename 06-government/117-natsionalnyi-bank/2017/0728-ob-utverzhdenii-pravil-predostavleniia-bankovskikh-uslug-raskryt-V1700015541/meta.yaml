  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 декабря 2024 года № 93. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 декабря 2024 года № 35583
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 июля 2017 года № 136 «Об утверждении Правил предоставления банковских услуг и рассмотрения банками, организациями, осуществляющими отдельные виды банковских операций, обращений клиентов, возникающих в процессе предоставления банковских услуг» и постановление Правления Национального Банка Республики Казахстан от 12 ноября 2019 года № 188 «Об утверждении Правил формирования системы управления рисками и внутреннего контроля для банков второго уровня, филиалов банков-нерезидентов Республики Казахстан»
    kaz: «Банктік қызметтерді көрсету және банктердің, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың банктік қызметтерді көрсету үдерісінде туындайтын клиенттердің өтініштерін қарау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 28 шілдедегі № 136 қаулысына және «Екінші деңгейдегі банктерге, Қазақстан Республикасының бейрезидент-банктерінің филиалдарына арналған тәуекелдерді басқару және ішкі бақылау жүйесін қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2019 жылғы 12 қарашадағы № 188 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/205390/rus

  title:
    rus: О внесении изменений в Постановление Правления Национального Банка Республики Казахстан от 28 июля 2017 года № 136 «Об утверждении Правил предоставления банковских услуг и рассмотрения банками, организациями, осуществляющими отдельные виды банковских операций, обращений клиентов, возникающих в процессе предоставления банковских услуг»
    kaz: «Банктік қызметтерді көрсету және банктердің, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың банктік қызметтерді көрсету үдерісінде туындайтын клиенттердің өтініштерін қарау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 28 шілдедегі № 136 қаулысына өзгерістер енгізу туралы

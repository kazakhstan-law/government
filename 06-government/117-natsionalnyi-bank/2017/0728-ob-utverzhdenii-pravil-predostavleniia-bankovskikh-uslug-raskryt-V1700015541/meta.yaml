  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 июня 2024 года № 28. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 июня 2024 года № 34577. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 15 мая 2026 года № 91 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 28 июля 2017 года № 136 «Об утверждении Правил предоставления банковских услуг и рассмотрения банками, организациями, осуществляющими отдельные виды банковских операций, обращений клиентов, возникающих в процессе предоставления банковских услуг»
    kaz: «Банктік қызметтерді көрсету және банктердің, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың банктік қызметтерді көрсету үдерісінде туындайтын клиенттердің өтініштерін қарау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 28 шілдедегі № 136 қаулысына өзгерістер мен толықтырулар енгізу туралы

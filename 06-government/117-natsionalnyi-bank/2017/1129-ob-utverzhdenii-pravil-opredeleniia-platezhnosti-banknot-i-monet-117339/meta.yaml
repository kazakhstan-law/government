    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230 «Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық валютасының банкноттары мен монеталарының төлемділігін айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 29 қарашадағы № 230 қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: Об утверждении Правил государственной регистрации выпуска объявленных акций, регистрации изменений и (или) дополнений в проспект выпуска акций, утверждения отчета об итогах размещения акций акционерного общества, отчета об обмене размещенных акций акционерного общества одного вида на акции данного акционерного общества другого вида, аннулирования выпуска объявленных акций, Требований к документам для государственной регистрации выпуска объявленных акций, регистрации изменений и (или) дополнений в проспект выпуска акций, утверждения отчета об итогах размещения акций акционерного общества, отчета об обмене размещенных акций акционерного общества одного вида на акции данного акционерного общества другого вида, Перечня документов для аннулирования выпуска объявленных акций и требований к ним, Правил составления и оформления проспекта выпуска акций, изменений и (или) дополнений в проспект выпуска акций, отчета об итогах размещения акций акционерного общества, отчета об обмене размещенных акций акционерного общества одного вида на акции данного акционерного общества другого вида
    kaz: Жарияланған акциялар шығарылымын мемлекеттiк тiркеу, акциялар шығарылымы проспектісіне өзгерістерді және (немесе) толықтыруларды тіркеу, акционерлік қоғамның акцияларын орналастыру қорытындылары туралы есепті, акционерлік қоғамның орналастырылған акцияларының бір түрін осы акционерлік қоғам акцияларының басқа түріне айырбастау туралы есепті бекіту, жарияланған акциялар шығарылымының күшін жою қағидаларын, Жарияланған акциялар шығарылымын мемлекеттiк тiркеу, акциялар шығарылымы проспектісіне өзгерістерді және (немесе) толықтыруларды тіркеу, акционерлік қоғамның акцияларын орналастыру қорытындылары туралы есепті, акционерлік қоғамның орналастырылған акцияларының бір түрін осы акционерлік қоғам акцияларының басқа түріне айырбастау туралы есепті бекіту үшін құжаттарға қойылатын талаптарды, Жарияланған акциялар шығарылымының күшін жоюға арналған құжаттардың тізбесін және оларға қойылатын талаптарды, Акциялар шығарылымының проспектісін, акциялар шығарылымының проспектісіне өзгерістерді және (немесе) толықтыруларды, акционерлік қоғамның акцияларын орналастыру қорытындылары туралы есепті, акционерлік қоғамның орналастырылған акцияларының бір түрін осы акционерлік қоғам акцияларының басқа түріне айырбастау туралы есепті жасау және ресімдеу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правления Национального Банка Республики Казахстан от 28 августа 2017 года № 167 «Об утверждении перечня, форм, сроков отчетности единого накопительного пенсионного фонда и Правил их представления» и от 26 ноября 2019 года № 211 «Об утверждении перечня, форм, сроков представления отчетности лицензиатами, осуществляющими деятельность на рынке ценных бумаг, единым оператором и Правил ее представления»
    kaz: «Бірыңғай жинақтаушы зейнетақы қоры есептілігінің тізбесін, нысандарын, мерзімдерін және оларды табыс ету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 28 тамыздағы № 167 және «Бағалы қағаздар нарығында қызметті жүзеге асыратын лицензиаттар, бірыңғай оператор есептілігінің тізбесін, нысандарын, ұсыну мерзімдерін және оны ұсыну қағидаларын бекіту туралы» 2019 жылғы 26 қарашадағы № 211 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/156637/rus

act_code: '117347'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 234. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 декабря 2017 года № 16149. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 72 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении перечня международных финансовых организаций, облигации которых банки и банковские холдинги приобретают в собственность, и требований к облигациям, которые банки и банковские холдинги приобретают в собственность
  kaz: Облигацияларын банктер және банк холдингтері меншікке сатып алатын халықаралық қаржы ұйымдарының тізбесін және банктер мен банк холдингтері меншікке сатып алатын облигацияларға қойылатын талаптарды белгілеу туралы

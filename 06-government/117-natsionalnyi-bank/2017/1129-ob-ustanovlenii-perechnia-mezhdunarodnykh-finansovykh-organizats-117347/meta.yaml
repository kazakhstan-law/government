  requisite: Постановление Правления Национального Банка Республики Казахстан от 28 июня 2019 года № 102. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 июля 2019 года № 18988. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 72 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 234 «Об установлении перечня международных финансовых организаций, облигации которых банки и банковские холдинги приобретают в собственность, и требований к облигациям, которые банки и банковские холдинги приобретают в собственность»
    kaz: «Облигацияларын банктер және банк холдингтері меншікке сатып алатын халықаралық қаржы ұйымдарының тізбесін және банктер мен банк холдингтері меншікке сатып алатын облигацияларға қойылатын талаптарды белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 29 қарашадағы № 234 қаулысына өзгерістер енгізу туралы

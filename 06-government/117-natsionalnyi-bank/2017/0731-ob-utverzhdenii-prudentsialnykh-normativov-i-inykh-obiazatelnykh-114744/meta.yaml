title:
  rus: Об утверждении пруденциальных нормативов и иных обязательных к соблюдению микрофинансовой организацией норм и лимитов, методики их расчетов, а также форм и сроков представления отчетности об их выполнении
  kaz: Пруденциялық нормативтердi және микроқаржы ұйымының сақтауы мiндеттi өзге де нормалар мен лимиттердi және оларды есептеу әдістемесін, сондай-ақ олардың орындалуы туралы есептілікті табыс етудің нысандары мен мерзімдерін бекіту туралы

title:
  rus: Об утверждении Правил предоставления банковских услуг, раскрытия информации и рассмотрения банками, организациями, осуществляющими отдельные виды банковских операций, обращений клиентов, возникающих в процессе предоставления банковских услуг
  kaz: Банктік қызметтерді көрсету, ақпаратты жария ету және банктердің, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың банктік қызметтерді көрсету үдерісінде туындайтын клиенттердің өтініштерін қарау қағидаларын бекіту туралы

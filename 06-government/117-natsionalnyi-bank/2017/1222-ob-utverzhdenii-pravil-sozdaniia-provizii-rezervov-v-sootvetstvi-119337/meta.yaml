act_code: '119337'
requisite: Постановление Правления Национального Банка Республики Казахстан от 22 декабря 2017 года № 269. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 марта 2018 года № 16502. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 сентября 2025 года № 61 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил создания провизий (резервов) в соответствии с международными стандартами финансовой отчетности и требованиями законодательства Республики Казахстан о бухгалтерском учете и финансовой отчетности
  kaz: Халықаралық қаржылық есептілік стандарттарына және Қазақстан Республикасының бухгалтерлік есеп және қаржылық есептілік туралы заңнамасының талаптарына сәйкес провизиялар (резервтер) құру қағидаларын бекіту туралы

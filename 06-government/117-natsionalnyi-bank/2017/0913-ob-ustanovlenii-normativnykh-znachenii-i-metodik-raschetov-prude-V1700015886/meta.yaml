  code: '199836'
  key: V2400034945
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 августа 2024 года № 63. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 августа 2024 года № 34945
  title:
    rus: О внесении изменений и дополнений в постановление Правления Национального Банка Республики Казахстан от 13 сентября 2017 года № 170 «Об установлении нормативных значений и методик расчетов пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов, размера капитала банка и Правил расчета и лимитов открытой валютной позиции» и в постановление Правления Национального Банка Республики Казахстан от 14 ноября 2019 года № 192 «Об утверждении пруденциальных нормативов и иных обязательных к соблюдению организацией, осуществляющей микрофинансовую деятельность, норм и лимитов, методики их расчетов»
    kaz: «Банктің пруденциялық нормативтерінің және сақталуы міндетті өзге де нормалары мен лимиттерінің нормативтік мәндері мен оларды есептеу әдістемелерін, капиталының мөлшерін және Ашық валюталық позицияны есептеу қағидалары мен оның лимиттерін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2017 жылғы 13 қыркүйектегі № 170 қаулысына және «Пруденциялық нормативтердi және микроқаржылық қызметті жүзеге асыратын ұйымның сақтауы мiндеттi өзге де нормалар мен лимиттердi, оларды есептеу әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының  2019 жылғы 14 қарашадағы № 192 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/199836/rus

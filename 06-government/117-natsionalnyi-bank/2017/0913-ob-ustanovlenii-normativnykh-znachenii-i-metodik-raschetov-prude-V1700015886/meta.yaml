  title:
    rus: Об утверждении пруденциальных нормативов и лимитов, обязательных к соблюдению банкам с универсальной банковской лицензией, банкам с базовой банковской лицензией, исламским банкам, их предельных значений и методик расчетов
    kaz: Әмбебап банк лицензиясы бар банкі, базалық банк лицензиясы бар банкі, ислам банкі сақтауға міндетті пруденциялық нормативтер мен лимиттерді, олардың шекті мәндерін және есеп айырысу әдістемелерін бекіту туралы

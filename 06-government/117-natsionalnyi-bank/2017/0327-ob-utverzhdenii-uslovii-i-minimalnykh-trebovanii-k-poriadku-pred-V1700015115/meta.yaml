title:
  rus: Об утверждении условий и минимальных требований к порядку предоставления информации поставщиками информации в кредитные бюро, Правил оформления согласия субъектов кредитных историй на предоставление информации о них в кредитные бюро (за исключением кредитного бюро с государственным участием), оформления согласия на выдачу кредитного отчета о нем другим лицам из кредитного бюро, а также Правил и условий предоставления кредитного отчета
  kaz: Ақпарат берушiлердiң кредиттiк бюроларға ақпарат беру тәртiбiнiң шарттары мен ең төмен талаптарын, Кредиттiк тарих субъектiлерiнiң өздерi туралы ақпаратты кредиттiк бюроларға (мемлекет қатысатын кредиттік бюроны қоспағанда) беруге келiсiмiн ресiмдеу, кредиттік бюродан басқа адамдарға ол туралы кредиттiк есептi беруге келiсiмiн ресімдеу қағидаларын, сондай-ақ Кредиттiк есептi берудiң қағидалары мен шарттарын бекіту туралы

title:
  rus: Об утверждении перечня, форм, сроков отчетности единого накопительного пенсионного фонда и Правил их представления
  kaz: Бірыңғай жинақтаушы зейнетақы қоры есептілігінің тізбесін, нысандарын, мерзімдерін және оларды табыс ету қағидаларын бекіту туралы

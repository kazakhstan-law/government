  title:
    rus: О внесении изменения в постановление Правления Национального Банка Республики Казахстан от 14 июля 2020 года № 86 «Об установлении пределов отклонения курса покупки от курса продажи иностранной валюты за тенге по операциям, проводимым через обменные пункты»

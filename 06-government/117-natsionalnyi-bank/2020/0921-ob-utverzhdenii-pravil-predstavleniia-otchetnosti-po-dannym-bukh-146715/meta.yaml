act_code: '146715'
requisite: Постановление Правления Национального Банка Республики Казахстан от 21 сентября 2020 года № 107. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 сентября 2020 года № 21278. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2025 года № 104 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил представления отчетности по данным бухгалтерского учета филиалами банков-нерезидентов Республики Казахстан, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалами страховых брокеров-нерезидентов Республики Казахстан
  kaz: Қазақстан Республикасы бейрезидент-банктері филиалдарының, Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасы бейрезидент-сақтандыру брокерлері филиалдарының бухгалтерлік есепке алу деректері бойынша есептiлiкті ұсыну қағидаларын бекіту туралы

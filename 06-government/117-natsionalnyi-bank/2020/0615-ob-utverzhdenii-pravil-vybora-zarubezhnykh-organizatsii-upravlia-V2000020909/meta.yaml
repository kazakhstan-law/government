  title:
    rus: Об утверждении Правил выбора внешних управляющих золотовалютными активами Национального Банка Республики Казахстан, активами Национального фонда Республики Казахстан и пенсионными активами единого накопительного пенсионного фонда и передачи активов во внешнее управление
    kaz: Қазақстан Республикасы Ұлттық Банкінің алтын-валюта активтерін, Қазақстан Республикасы Ұлттық қорының активтерін және бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін сыртқы басқарушыларды таңдау және активтерді сыртқы басқаруға беру қағидаларын бекіту туралы

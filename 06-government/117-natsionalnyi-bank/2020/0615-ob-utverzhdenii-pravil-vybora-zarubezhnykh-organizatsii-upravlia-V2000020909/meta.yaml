  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 15 июня 2020 года № 78 «Об утверждении Правил выбора зарубежных организаций, управляющих пенсионными активами единого накопительного пенсионного фонда, включая требования к ним, при поручении им совершать действия, необходимые для управления пенсионными активами единого накопительного пенсионного фонда»
    kaz: «Бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін басқаратын шетелдік ұйымдарға қойылатын талаптарды қоса алғанда, бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін басқару үшін қажетті іс-қимылдар жасау өздеріне тапсырылған кезде, оларды таңдау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2020 жылғы 15 маусымындағы № 78 қаулысына өзгерістер енгізу туралы

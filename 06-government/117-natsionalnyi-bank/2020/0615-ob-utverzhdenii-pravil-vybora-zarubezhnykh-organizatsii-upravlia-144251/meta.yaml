act_code: '144251'
requisite: Постановление Правления Национального Банка Республики Казахстан от 15 июня 2020 года № 78. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 июня 2020 года № 20909. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 30 июня 2026 года № 77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выбора зарубежных организаций, управляющих пенсионными активами единого накопительного пенсионного фонда, включая требования к ним, при поручении им совершать действия, необходимые для управления пенсионными активами единого накопительного пенсионного фонда
  kaz: Бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін басқаратын шетелдік ұйымдарға қойылатын талаптарды қоса алғанда, бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтерін басқару үшін қажетті іс-қимылдар жасау өздеріне тапсырылған кезде, оларды таңдау қағидаларын бекіту туралы

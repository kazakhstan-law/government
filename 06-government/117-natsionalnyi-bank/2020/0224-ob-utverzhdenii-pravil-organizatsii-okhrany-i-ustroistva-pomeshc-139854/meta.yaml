act_code: '139854'
requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 февраля 2020 года № 20075
title:
  rus: Об утверждении Правил организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент банктері филиалдарының, Ұлттық пошта операторының, банкноттарды, монеталарды және құндылықтарды инкассациялау айрықша қызметі болып табылатын заңды тұлғалардың және қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетел валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункттері арқылы жүзеге асыратын заңды тұлғалардың үй-жайларын күзетуді және жайластыруды ұйымдастыру қағидаларын бекіту туралы

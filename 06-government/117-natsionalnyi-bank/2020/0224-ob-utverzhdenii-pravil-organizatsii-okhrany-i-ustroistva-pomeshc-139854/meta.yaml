  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14 «Об утверждении Правил организации охраны и устройства помещений банков второго уровня, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой»
    kaz: «Екінші деңгейдегі банктерінің, Ұлттық пошта операторының, банкноттарды, монеталарды және құндылықтарды инкассациялау айрықша қызметі болып табылатын заңды тұлғалардың және қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетел валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункттері арқылы жүзеге асыратын заңды тұлғалардың үй-жайларын күзетуді және жайластыруды ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2020 жылғы 24 ақпандағы № 14 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/146734/rus

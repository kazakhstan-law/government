act_code: '145098'
requisite: Постановление Правления Национального Банка Республики Казахстан от 20 июля 2020 года № 91. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 июля 2020 года № 21015. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 21 января 2026 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня, форм и сроков представления отчетности о соблюдении требований законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма юридическим лицом, осуществляющим деятельность исключительно через обменный пункт на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой, и Правил ее представления
  kaz: Қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетел валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункті арқылы жүзеге асыратын заңды тұлғаның Қазақстан Республикасының қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы заңнамасының талаптарын сақтауы туралы есептілігінің тізбесін, нысандарын және табыс ету мерзімдерін және оны ұсыну қағидаларын бекіту туралы

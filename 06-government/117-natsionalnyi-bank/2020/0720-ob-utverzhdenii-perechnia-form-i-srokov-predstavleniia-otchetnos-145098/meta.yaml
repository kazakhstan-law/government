  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 20 июля 2020 года № 91 «Об утверждении перечня, форм и сроков представления отчетности о соблюдении требований законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма юридическим лицом, осуществляющим деятельность исключительно через обменный пункт на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой, и Правил ее представления»
    kaz: «Қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетел валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункті арқылы жүзеге асыратын заңды тұлғаның Қазақстан Республикасының қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы заңнамасының талаптарын сақтауы туралы есептілігінің тізбесін, нысандарын және табыс ету мерзімдерін және оны ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2020 жылғы 20 шілдедегі № 91 қаулысына өзгерістер енгізу туралы

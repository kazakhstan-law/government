  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан от 19 марта 2020 года № 33 «Об установлении пределов отклонения курса покупки от курса продажи иностранной валюты за тенге по операциям, проводимым через обменные пункты»
    kaz: «Айырбастау пункттері арқылы жүргізілетін операциялар бойынша теңгеге шетел валютасын сатып алу бағамының сату бағамынан ауытқу шектерін белгілеу туралы» Қазақстан Республикасы Ұлттық Банкі Басқармасының 2020 жылғы 19 наурыздағы № 33 қаулысына өзгерістер енгізу туралы

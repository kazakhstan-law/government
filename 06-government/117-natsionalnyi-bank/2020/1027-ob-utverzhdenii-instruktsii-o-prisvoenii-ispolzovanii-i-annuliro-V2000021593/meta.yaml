requisite: Постановление Правления Национального Банка Республики Казахстан от 27 октября 2020 года № 128. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 ноября 2020 года № 21593
title:
  rus: Об утверждении Инструкции о присвоении, использовании и аннулировании Национальным Банком Республики Казахстан банковских идентификационных кодов, а также присвоении и аннулировании кодов банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций, и кодов филиалов банков и организаций, осуществляющих отдельные виды банковских операций, их структуре, формировании и ведении Справочника банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций
  kaz: Қазақстан Ұлттық Банкінің банктік идентификациялау кодтарын беру, пайдалану және жою, сондай-ақ банктердің, Қазақстан Республикасы бейрезидент банктері филиалдарының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың кодтарын және банктер мен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар филиалдарының кодтарын беру және жою, олардың құрылымы, Банктердің, Қазақстан Республикасы бейрезидент банктері филиалдарының және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың анықтамалығын қалыптастыру және жүргізу туралы нұсқаулықты бекіту туралы

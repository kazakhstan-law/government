title:
  rus: Об утверждении Правил ведения кассовых операций с физическими и юридическими лицами в Национальном Банке Республики Казахстан
  kaz: Қазақстан Республикасының Ұлттық Банкінде жеке және заңды тұлғалармен кассалық операциялар жүргізу қағидаларын бекіту туралы

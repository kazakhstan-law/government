title:
  rus: О положении Совета опеки и попечительства над совершеннолетними лицами ограниченно дееспособными, недееспособными, престарелыми и инвалидами при акимате Тайыншинского района
  kaz: Тайынша ауданы әкімдігі жанындағы қабілеті шектеулі, қабілетсіз жандар, қариялар және мүгедек адамдарға, кәлелеттік жасқа толмаған тұлғаларға қамқорлык көрсету және қамқорлыққа алу Кеңесінің Ережесін бекіту туралы

requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 4 апреля 2005 года № 261. Зарегистрировано Управлением юстиции г. Петропавловска Северо-Казахстанской области 25 апреля 2005 года № 13-1-2. Утратило силу постановлением акимата города Петропавловска Северо-Казахстанской области от 10 февраля 2025 года № 183 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания единовременной социальной помощи  ветеранам войны и труженикам тыла военных лет награжденных юбилейной медалью "1941-1945 ж.ж. Ұлы Отан соғысындағы Жеңiске 60-жыл"
  kaz: '"1941-1945 ж.ж. Ұлы Отан соғысындағы Жеңiске 60-жыл" мерекелiк медалiмен марапатталған соғыс ардагерлерi мен соғыс жылдарындағы тыл еңбеккерлерiне бiржолғы әлеуметтiк көмек көрсету Ережелерiн бекiту туралы'

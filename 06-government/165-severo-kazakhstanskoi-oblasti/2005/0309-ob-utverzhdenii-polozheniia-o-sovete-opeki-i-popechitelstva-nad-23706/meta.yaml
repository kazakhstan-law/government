requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 9 марта 2005 года № 163. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 апреля 2005 года № 1575. Утратило силу постановлением акимата города Петропавловска Северо-Казахстанской области от 8 июня 2007 года № 739
title:
  rus: Об утверждении Положения о Совете опеки и попечительства над совершеннолетними дееспособными, ограниченно дееспособными гражданами, а также лицами, находящимися в Петропавловском психоневрологическом доме-интернате
  kaz: Кәмелеттік жастағы іс-әрекетке кабілетті, іс-әрекетке қабілеттері шектеулі азаматтарға, сондай-ақ Петропавл психоневрологиялық интернат-үйінде тұратын тұлғаларға қамқорлық және қорғаншылық белгілеу Кеңесі туралы Ережені бекіту туралы

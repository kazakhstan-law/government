requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 26 апреля 2005 года № 287. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 29 апреля 2005 года № 13-4-4. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 26 сентября 2024 года № 174 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Положения о комиссии по поощрению граждан, участвующих в обеспечении общественного порядка, способствовавших предупреждению и пресечению преступлений в Акжарском районе

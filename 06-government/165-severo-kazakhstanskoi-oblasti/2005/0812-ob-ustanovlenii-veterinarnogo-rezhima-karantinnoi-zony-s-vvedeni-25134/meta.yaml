requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 12 августа 2005 года № 496. Зарегистрировано Управлением юстиции Мамлютского района Северо-Казахстанской области 12 августа 2005 года № 13-10-13. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 4 апреля 2024 года № 92 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении ветеринарного режима карантинной зоны с введением карантинного режима и ограничительных мероприятий по высокопатогенному гриппу птиц на территории села Дубровное Дубровинского сельского округа Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазакстан облысы Мамлют ауданының Дубровное селолық округінің Дубровное селосы аумағындағы жоғары патогенді құс тұмауы бойынша шектелген іс-шараларды және карантин тәртібін енгізуге байланысты карантин зонасының ветеринарлық тәртібін белгілеу туралы

requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 5 июня 2009 года № 142. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 17 июля 2009 года № 13-3-103. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 6 января 2010 года № 1
title:
  rus: О реализации постановления акимата Северо-Казахстанской области от 18 марта 2009 года № 62 "О реализации Указа Президента  Республики Казахстан от 17 ноября 2008 года № 690 "О квоте иммиграции оралманов  на 2009-2011 годы" и постановления Правительства Республики Казахстан от 22 января 2009 года № 32 "О распределении квоты иммиграции оралманов на 2009 год"
  kaz: Солтүстік Қазақстан облысы әкімдігінің 2009 жылғы 18 наурыздағы "Қазақстан Республикасы Президентінің 2008 жылғы 17 қарашадағы "Оралмандардың  2009-2011 жылдарға арналған көшіп келу квотасы туралы" № 690 Жарлығын жүзеге асыру туралы" № 62 қаулысы және Қазақстан Республикасы Үкіметінің  2009 жылғы 22 қаңтардағы "Оралмандардың 2009 жылға арналған көшіп келу квотасын бөлу туралы" № 32 қаулысын іске асыру туралы

act_code: '45208'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 10 марта 2009 года № 93. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 7 апреля 2009 года № 13-11-145. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 18 июля 2014 года № 392
title:
  rus: Об определении Перечня должностей специалистов здравоохранения,  социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению  с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен айналысатын азаматтық қызметкерлердің жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мамандары лауазымдарының Тізбесін айқындау туралы

act_code: '49152'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2009 жылғы 8 желтоқсандағы № 221 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2009 жылғы 10 желтоқсанда № 13-13-116 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы әкімі аппаратының 2012 жылғы 13 қыркүйектегі № 02.12.06-09/233 хаты)

requisite: Постановление акимата Есильского района Северо-Казахстанской области от 15 января 2009 года № 5. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 20 января 2009 года № 13-6-108. Утратило силу в связи с истечением срока действия (письмо аппарата акима Есильского района Северо-Казахстанской области от 15 июня 2012 года № 02.04.05-11/361)
title:

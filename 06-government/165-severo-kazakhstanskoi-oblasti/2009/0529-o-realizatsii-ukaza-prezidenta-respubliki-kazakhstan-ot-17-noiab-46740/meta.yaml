requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 29 мая 2009 года № 208. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 2 июля 2009 года № 13-11-153. Утратило силу в связи с истечением срока действия (письмо маслихата Тайыншинского района Северо-Казахстанской области от 22 июня 2012 года № 02.10-07-02-542)
title:
  rus: О реализации Указа Президента Республики Казахстан от 17 ноября 2008 года № 690 "О квоте иммиграции оралманов на 2009-2011 годы", постановления Правительства Республики Казахстан от 22 января 2009 года № 32 "О распределении квоты иммиграции оралманов на 2009 год" и постановления акимата Северо-Казахстанской области от 18 марта 2009 года № 62  "О реализации Указа Президента Республики Казахстан от 17 ноября 2008 года № 690 "О квоте иммиграции оралманов на 2009-2011 годы", постановления Правительства Республики Казахстан от 22 января 2009 года № 32 "О распределении квоты иммиграции оралманов на 2009 год"
  kaz: '"Оралмандардың 2009-2011 жылдарға арналған көшіп келу квотасы туралы" Қазақстан Республикасы Президентінің 2008 жылғы 17 қарашадағы № 690 Жарлығын, "Оралмандардың 2009 жылға арналған көшіп келу квотасын бөлу туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 22 қаңтардағы № 32 Қаулысын, "Оралмандардың 2009 жылға арналған көшіп келу квотасын бөлу туралы" Қазақстан Республикасы Ұкіметінің 2009 жылғы 22 қаңтардағы № 32 қаулысы мен "Оралмандардың 2009-2011 жылдарға арналған көшіп келу квотасы туралы" Қазақстан Республикасы Президентінің 2008 жылғы 17 қарашадағы № 690 Жарлығын жүзеге асыру туралы" Солтүстік Қазақстан облысы әкімдігінің 2009 жылғы 18 наурыздағы № 62 қаулысын  жүзеге асыру туралы'

requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2009 жылғы 13 сәуірдегі № 47 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2009 жылғы 20 сәуірде № 13-13-100 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2012 жылғы 26 қаңтардағы № 32 қаулысымен

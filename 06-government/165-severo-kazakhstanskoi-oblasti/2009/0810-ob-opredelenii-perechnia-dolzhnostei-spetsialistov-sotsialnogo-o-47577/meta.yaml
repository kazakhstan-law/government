requisite: Постановление акимата Есильского района Северо-Казахстанской области от 10 августа 2009 года № 186. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 02 сентября 2009 года № 13-6-124. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 21 августа 2014 года № 270
title:
  rus: Об определении Перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен  айналысатын мамандардың жалақыларымен және ставкаларымен салыстырғанда жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім беру, мәдениет және спорт мамандары ауазымдарының тізімін белгілеу туралы

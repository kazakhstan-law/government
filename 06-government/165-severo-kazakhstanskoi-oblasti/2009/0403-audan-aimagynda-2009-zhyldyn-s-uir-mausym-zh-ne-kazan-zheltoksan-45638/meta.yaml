act_code: '45638'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2009 жылғы 3 сәуірдегі № 42 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2009 жылғы 6 мамырда № 13-13-102 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы әкімі аппаратының 2012 жылғы 13 қыркүйектегі № 02.12.06-09/233 хаты)
title:

requisite: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2012 жылғы 26 наурыздағы № 93 қаулысы. Солтүстік Қазақстан облысының Әділет департаментінде 2012 жылғы 3 сәуірде № 13-13-158 тіркелді

  title:
    rus: О внесении изменения в постановление акимата района Магжана Жумабаева от 2 мая 2012 года № 188 "Об определении сроков предоставления заявки на  включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур в районе Магжана Жумабаева на 2012 год"
    kaz: Мағжан Жұмабаев ауданы әкімдігінің 2012 жылғы 2 мамырдағы № 188 "Мағжан Жұмабаев ауданында 2012 жылға арналған субсидия берілетін ауыл шаруашылық дәнді дақылдардың оңтайлы әрбір түрі бойынша егіс жұмыстарының тиімді мерзімдері мен субсидия алушылар тізіміне қосуға өтінімдер ұсыну мерзімін анықтау туралы" қаулысына өзгеріс енгізу туралы

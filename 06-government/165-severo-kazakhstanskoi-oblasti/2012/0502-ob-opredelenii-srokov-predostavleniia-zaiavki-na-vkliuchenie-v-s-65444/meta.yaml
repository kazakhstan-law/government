act_code: '65444'
requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 2 мая 2012 года № 188. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 мая 2012 года № 13-9-157. Утратило силу в связи с истечением срока действия (письмо аппарата акима района имени Магжана Жумабаева Северо-Казахстанской области от 11 января 2013 года № 02-06\05-07/25)
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур в районе Магжана Жумабаева на 2012 год
  kaz: Мағжан Жұмабаев ауданында 2012 жылға арналған субсидия берілетін ауыл шаруашылық дәнді дақылдардың оңтайлы әрбір түрі бойынша егіс жұмыстарының тиімді мерзімдері мен субсидия алушылар тізіміне қосуға өтінімдер ұсыну мерзімін анықтау туралы

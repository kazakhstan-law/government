requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2012 жылғы 21 тамыздағы № 322 қаулысы. Солтүстік Қазақстан облысының Әділет департаментінде 2012 жылғы 20 қыркүйекте № 1883 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2012 жылғы 10 желтоқсандағы № 497 қаулысымен

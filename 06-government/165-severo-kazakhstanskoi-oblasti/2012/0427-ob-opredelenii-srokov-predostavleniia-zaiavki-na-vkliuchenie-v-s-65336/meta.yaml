title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Мамлютскому району в 2012 году
  kaz: Мамлют ауданы бойынша 2012 жылы егістің оңтайлы мерзімдерін субсидияланған басымды ауыл шаруашылық дақылдардың әрбір түрі бойынша субсидиялар алушылар тізіміне енгізуге тапсырыстарды ұсыну мерзімдерін белгілеу туралы

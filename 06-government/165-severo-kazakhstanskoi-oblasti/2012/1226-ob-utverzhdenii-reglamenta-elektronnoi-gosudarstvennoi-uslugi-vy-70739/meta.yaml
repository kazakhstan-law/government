act_code: '70739'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 26 декабря 2012 года № 387. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 февраля 2013 года № 2142. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 21 мая 2013 года № 134
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача справок в пенсионные фонды, банки для распоряжения вкладами несовершеннолетних детей, в территориальные подразделения Комитета дорожной полиции Министерства внутренних дел Республики Казахстан для оформления наследства несовершеннолетним детям"
  kaz: «Зейнетақы қорларына, банктерге кәмелетке толмағандардың салымдарына иелік ету үшін, Қазақстан Республикасы Ішкі істер министрлігі Жол полициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтамалар беру» электрондық мемлекеттiк қызмет көрсету регламентін бекіту туралы

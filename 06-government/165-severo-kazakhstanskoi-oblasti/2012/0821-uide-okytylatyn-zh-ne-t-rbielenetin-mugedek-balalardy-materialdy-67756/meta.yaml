requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2012 жылғы 21 тамыздағы № 323 қаулысы. Солтүстік Қазақстан облысының Әділет департаментінде 2012 жылғы 20 қыркүйекте № 1884 болып тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2013 жылғы 23 мамырдағы № 163 қаулысымен

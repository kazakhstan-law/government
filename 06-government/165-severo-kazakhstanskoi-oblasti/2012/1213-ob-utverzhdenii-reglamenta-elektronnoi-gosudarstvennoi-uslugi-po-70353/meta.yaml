requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 13 декабря 2012 года № 318. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 января 2013 года № 2082. Утратило силу - постановлением акимата Аккайынского района Северо-Казахстанской области от 24 мая 2013 года № 141
title:
  rus: Об утверждении регламента электронной государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного фонда или жилище, арендованном местным исполнительным органом в частном жилище"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" электрондық мемлекеттік қызмет регламентін бекіту туралы'

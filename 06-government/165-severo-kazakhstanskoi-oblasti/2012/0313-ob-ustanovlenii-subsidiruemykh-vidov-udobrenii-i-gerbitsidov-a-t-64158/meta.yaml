act_code: '64158'
requisite: Постановление акимата Северо-Казахстанской области от 13 марта 2012 года № 68. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 марта 2012 года № 1798. Утратило силу в связи с истечением срока действия (письмо аппарата акима Северо-Казахстанской области от 1 июля 2015 года № 1.14-7/1840)
title:
  rus: Об установлении субсидируемых видов удобрений и гербицидов, а также нормативов субсидий на удешевление стоимости удобрений (за исключением органических) и стоимости затрат на обработку сельскохозяйственных культур гебрицидами, произведенными (формулированными) отечественными производителями на 2012 год
  kaz: 2012 жылға арналған тыңайтқыштар мен гербицидтердің субсидияланатын түрлерін, сондай-ақ, тыңайтқыштардың (органикалықтарды қоспағанда) құнын және ауыл шаруашылығы дақылдарын отандық өндірушілер өндірген (формуляциялаған) гербицидтермен өңдеуге жұмсалған шығындардың құнын арзандатуға арналған субсидия нормативтерін белгілеу туралы

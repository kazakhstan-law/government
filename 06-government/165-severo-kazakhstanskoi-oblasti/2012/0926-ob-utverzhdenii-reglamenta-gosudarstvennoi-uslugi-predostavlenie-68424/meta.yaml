act_code: '68424'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 26 сентября 2012 года № 271. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 ноября 2012 года за № 1935. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 21 мая 2013 года № 134
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты" оказываемого отделом сельского хозяйства и ветеринарии Жамбылского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының ауыл шаруашылығы және ветеринария бөлімімен көрсетілетін "Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызмет регламентін бекіту туралы

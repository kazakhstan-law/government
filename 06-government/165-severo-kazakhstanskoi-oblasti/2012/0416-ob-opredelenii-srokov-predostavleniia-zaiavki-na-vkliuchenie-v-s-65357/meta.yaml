requisite: Постановление акимата Есильского района Северо-Казахстанской области от 16 апреля 2012 года № 133. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 мая 2012 года № 13-6-192. Утратило силу в связи с истечением срока действия (письмо заместителя акима Есильского района Северо-Казахстанской области от 10 января 2013 года № 02.04.06-11/29)
title:

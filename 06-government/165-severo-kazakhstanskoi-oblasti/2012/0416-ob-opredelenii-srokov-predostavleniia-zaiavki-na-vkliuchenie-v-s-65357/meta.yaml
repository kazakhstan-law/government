  title:
    rus: О внесении изменения в постановление акимата Есильского района от 16 апреля 2012 года № 133 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Есильскому району в 2012 году"
    kaz: '"2012 жылы Есіл ауданы бойынша субсидия алушылардың тізіміне қосуға құжаттар қабылдау мерзімдерін және субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша егудің оңтайлы мерзімдерін айқындау туралы" Есіл ауданы әкімдігінің 2012 жылғы 16 сәуірдегі № 133 қаулысына өзгеріс енгізу туралы'

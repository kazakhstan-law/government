act_code: '70536'
requisite: Постановление акимата Северо-Казахстанской области от 28 декабря 2012 года № 396. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 января 2013 года № 2119. Утратило силу постановлением акимата Северо-Казахстанской области от 27 мая 2013 года № 168
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление вида деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түсті және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуі және өткізу жөніндегі қызмет түрін жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" электронды мемлекеттік қызмет регламентін бекіту туралы'

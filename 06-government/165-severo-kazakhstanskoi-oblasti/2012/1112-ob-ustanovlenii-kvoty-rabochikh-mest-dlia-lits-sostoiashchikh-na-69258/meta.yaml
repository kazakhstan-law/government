act_code: '69258'
requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 12 ноября 2012 года № 494. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 декабря 2012 года № 1989. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 15 апреля 2013 года № 120
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығын айыру орындарынан босатылған тұлғалар және интернаттық ұйымдардың көмелетке толмаған түлектері үшін жұмыс орындарына квота белгілеу туралы

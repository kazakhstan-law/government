act_code: '68292'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 25 сентября 2012 года № 387. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 октября 2012 года № 1917. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 23 мая 2013 года № 223
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттiк қызмет регламентiн бекiту туралы'

requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 14 сентября 2012 года № 365. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 октября 2012 года № 1901. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 5 августа 2016 года № 280
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инпекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығын айыру орындарынан босатылған тұлғалар және интернаттық ұйымдардың кәмелетке толмаған мектеп бітірушілері үшін жұмыс орындарына квота белгілеу туралы

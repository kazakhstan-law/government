  requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 27 марта 2014 года № 133. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 апреля 2014 года № 2679. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 5 августа 2016 года № 280
  title:
    rus: О внесении изменения в постановление акимата Айыртауского района Северо-Казахстанской области от 14 сентября 2012 года № 365 «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций»
    kaz: Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2012 жылғы 14 қыркүйектегі № 365 «Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бостандығын айыру орындарынан босатылған тұлғалар және интернатқа ұйымдардың кәмелетке толмаған мектеп бітірушілері үшін жұмыс орындарына квота белгілеу туралы» № 365 қаулысына өзгеріс енгізу туралы

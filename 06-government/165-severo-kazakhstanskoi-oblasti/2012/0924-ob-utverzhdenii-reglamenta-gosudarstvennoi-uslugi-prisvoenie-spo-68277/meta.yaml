act_code: '68277'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 24 сентября 2012 года № 690. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 октября 2012 года № 1915. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 24 мая 2013 года № 233
title:
  rus: 'Об утверждении регламента государственной услуги "Присвоение спортивных разрядов и категорий: второй и третий, первый, второй и третий юношеские, тренер высшего и среднего уровня квалификации второй категории, инструктор-спортсмен высшего уровня квалификации второй категории, методист высшего и среднего уровня квалификации второй категории, судья по спорту"'
  kaz: '"Екінші және үшінші, жасөспірімдер арасындағы бірінші, екінші және үшінші, біліктілігі жоғары және орта деңгейдегі екінші санатты жаттықтырушы, біліктілігі жоғары деңгейдегі екінші санатты нұсқаушы-спортшы, біліктілігі жоғары және орта деңгейдегі екінші санатты әдіскер, спорт төрешісі спорттық разрядтары мен санаттарын беру" мемлекеттік қызмет регламентін бекіту туралы'

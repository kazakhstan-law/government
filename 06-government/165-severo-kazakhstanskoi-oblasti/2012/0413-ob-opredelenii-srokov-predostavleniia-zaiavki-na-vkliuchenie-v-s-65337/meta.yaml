  title:
    rus: О внесении изменения в постановление акимата города Петропавловска от 13 апреля 2012 года № 631 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальные сроки сева приоритетных сельскохозяйственных культур в 2012 году в городе Петропавловске"
    kaz: '"Субсидия алушылардың тізіміне қосуға өтінім беру мерзімдерін және Петропавл қаласында 2012 жылы басым ауылшаруашылық дақылдарын егудің оңтайлы мерзімдерін анықтау туралы" Петропавл қаласы әкімдігінің 2012 жылғы 13 сәуірдегі № 631 қаулысына өзгеріс енгізу туралы'

act_code: '70743'
requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 26 декабря 2012 года № 337. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 февраля 2013 года № 2146. Утратило силу - постановлением акимата Аккайынского района Северо-Казахстанской области от 24 мая 2013 года № 141
title:
  rus: '"Об утверждении регламента электронной государственной услуги "Выдача справок органов, осуществляющих функции по опеке или попечительству для оформления сделок с имуществом, принадлежащим на праве собственности несовершеннолетним детям"'
  kaz: «Кәмелетке толмағандарға меншік құқығында тиесілі мүлікпен мәмілелерді ресімдеу үшін қорғаншылық немесе қамқоршылық жөніндегі функцияларды жүзеге асыратын органдардың анықтамаларын беру» электрондық мемлекеттiк қызмет регламентін бекіту туралы

requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 16 апреля 2012 года № 103. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 мая 2012 года № 13-12-150. Утратило силу - постановлением акимата Тимирязевского района Северо-Казахстанской области от 29 декабря 2012 года № 409
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Тимирязевскому району на 2012 год
  kaz: Тимирязев ауданы бойынша 2012 жылға субсидия алушылар тізіміне енгізу үшін өтінімдерді қабылдау мерзімін және егіс жұмыстарын жүргізудің оңтайлы мерзімін субсидияланатын әрбір ауыл шаруашылығы басым дақылдарының түрлері бойынша анықтау туралы

  title:
    rus: О внесении изменения в постановление акимата Тимирязевского района от 16 апреля 2012 года № 103 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Тимирязевскому району на 2012 год"
    kaz: '"Тимирязев ауданы бойынша 2012 жылға субсидия алушылар тізіміне енгізу үшін өтінімдерді қабылдау мерзімін және егіс жұмыстарын жүргізудің оңтайлы мерзімін субсидияланатын әрбір ауыл шаруашылығы басым дақылдарының түрлері бойынша анықтау туралы" Тимирязев ауданы әкімдігінің 2012 жылғы 16 сәуірдегі № 103 қаулысына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/66840/rus

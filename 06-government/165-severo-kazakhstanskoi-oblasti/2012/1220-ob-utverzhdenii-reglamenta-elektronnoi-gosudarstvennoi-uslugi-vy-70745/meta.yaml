act_code: '70745'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 20 декабря 2012 года № 923. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 февраля 2013 года № 2148. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 24 мая 2013 года № 233
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача справок органов, осуществляющих функции по опеке или попечительству для оформления сделок с имуществом, принадлежащим на праве собственности несовершеннолетним детям"
  kaz: '"Кәмелетке толмағандарға меншік құқығында тиесілі мүлікпен мәмілелерді ресімдеу үшін қорғаншылық немесе қамқоршылық жөніндегі функцияларды жүзеге асыратын органдардың анықтамаларын беру" электрондық мемлекеттік қызмет регламентін бекіту туралы'

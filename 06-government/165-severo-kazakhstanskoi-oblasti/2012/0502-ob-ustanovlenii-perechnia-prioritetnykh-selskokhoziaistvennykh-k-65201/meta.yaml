  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 2 мая 2012 года № 129 "Об установлении перечня приоритетных сельскохозяйственных культур и нормативов субсидий на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ на 2012 год"
    kaz: '"2012 жылға арналған басым ауыл шаруашылығы дақылдарының тізбесін және көктемгі егіс және егін жинау жұмыстарын жүргізуге қажетті жанар-жағармай материалдары мен басқа да тауарлық-материалдық құндылықтардың құнын арзандатуға субсидия нормативтерін белгілеу туралы" Солтүстік Қазақстан облысы әкімдігінің 2012 жылғы 2 мамырдағы № 129 қаулысына өзгеріс енгізу туралы'

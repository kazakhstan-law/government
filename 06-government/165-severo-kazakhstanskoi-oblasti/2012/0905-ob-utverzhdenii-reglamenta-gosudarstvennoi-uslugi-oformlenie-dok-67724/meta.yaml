act_code: '67724'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 5 сентября 2012 года № 329. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 сентября 2012 года № 1870. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 23 мая 2013 года № 194
title:
  rus: Об утверждении регламента государственной услуги "Оформление документов на инвалидов для предоставления им услуги индивидуального помощника для инвалидов первой группы, имеющих затруднение в передвижении, и специалиста жестового языка для инвалидов по слуху"
  kaz: '"Қозғалуға қиындығы бар бірінші топтағы мүгедектерге жеке көмекшінің және есту бойынша мүгедектерге қолмен көрсететін тіл маманының қызметтерін ұсыну үшін мүгедектерге құжаттарды ресімдеу" мемлекеттік қызмет регламентін бекіту туралы'

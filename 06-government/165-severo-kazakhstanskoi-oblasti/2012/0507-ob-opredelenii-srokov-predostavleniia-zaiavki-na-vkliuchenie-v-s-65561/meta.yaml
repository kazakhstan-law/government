requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 7 мая 2012 года № 121. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 мая 2012 года № 13-14-153. Утратило силу - постановлением акимата района Шал акына Северо-Казахстанской области от 22 октября 2013 года № 351
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по району Шал акына в 2012 году
  kaz: Шал ақын ауданы бойынша 2012 жылы субсидия алатындардың тізіміне енгізуге өтінім ұсынудың мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша егіс жүргізудің оңтайлы мерзімдерін белгілеу туралы

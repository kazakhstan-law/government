act_code: '67434'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 31 июля 2012 года № 281. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 августа 2012 года № 13-5-154. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 20 мая 2020 года № 134 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента электронной государственной услуги "Регистрация детей дошкольного возраста (до 7 лет) для направления в детские дошкольные учреждения Республики Казахстан"
  kaz: '"Қазақстан Республикасының мектепке дейінгі балалар ұйымдарына жолдама беру үшін мектеп жасына дейінгі (7 жасқа дейінгі) балаларды тіркеу" электрондық мемлекеттік қызмет регламентін бекіту туралы'

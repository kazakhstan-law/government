act_code: '69259'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 9 ноября 2012 года № 316. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 12 декабря 2012 года № 1990. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 21 мая 2013 года № 134
title:
  rus: 'Об утверждении регламента государственной услуги "Присвоение спортивных разрядов и категорий: второй и третий, первый, второй и третий юношеские, тренер высшего и среднего уровня квалификации второй категории, инструктор-спортсмен высшего уровня квалификации второй категории, методист высшего и среднего уровня квалификации второй категории, судья по спорту"'
  kaz: '"Екiншi және үшiншi разрядтар, бірiншi, екiншi және үшiншi жасөспiрiмдік разрядтар, біліктiлiгi жоғары және орта деңгейдегi екiншi санатты жаттықтырушы, біліктiлiгi жоғары деңгейдегi екiншi санатты нұсқаушы-спортшы, біліктiлiгi жоғары және орта деңгейдегi екiншi санатты әдiскер, спорт төрешiсi спорттық разрядтары мен санаттарын беру" мемлекеттiк қызмет регламентiн бекiту туралы'

  title:
    rus: О внесении изменения в постановление Аккайынского акимата от 20 апреля 2012 года N 110 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Аккайынскому району на 2012 год"
    kaz: '"Аққайың ауданы бойынша 2012 жылға арналған субсидия алушылардың тізіміне қосуға өтінімдер ұсыну мерзімдерін және субсидияланатын ауыл шаруашылығы басымдықты дақылдарының әрбір түрі бойынша себудің оңтайлы мерзімдерін анықтау туралы" Аққайың ауданы әкімдігінің 2012 жылғы 20 сәуірдегі N 110 қаулысына өзгеріс енгізу туралы'

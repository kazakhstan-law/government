act_code: '70733'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 21 декабря 2012 года № 523. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 января 2013 года № 2135. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 23 мая 2013 года № 202
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача справок органов, осуществляющих функции по опеке или попечительству для оформления сделок с имуществом, принадлежащим на праве собственности несовершеннолетним детям"
  kaz: '"Кәмелетке толмаған меншік құқығына тиесілі мүлікпен мәмілелерді ресімдеу үшін қорғаншылық немесе қамқоршылық жөніндегі функцияларды жүзеге асыратын органдардың анықтамаларын беру" электрондық мемлекеттік қызмет регламентін бекіту туралы'

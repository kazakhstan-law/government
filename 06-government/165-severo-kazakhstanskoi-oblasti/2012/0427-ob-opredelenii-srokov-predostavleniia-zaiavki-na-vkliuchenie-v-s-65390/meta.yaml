  kaz: 2012 жылға Айыртау ауданында субсидияланған басым ауыл шаруашылық дақылдардың әрбір түрлері бойынша оңтайлы себу мерзімдерін және субсидия алушалыр тізіміне қосу үшін өтінім беру мерзімдерін белгілеу туралы

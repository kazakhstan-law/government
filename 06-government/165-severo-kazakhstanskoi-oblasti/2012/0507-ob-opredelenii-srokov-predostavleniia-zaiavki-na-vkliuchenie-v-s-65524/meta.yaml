  title:
    rus: О внесении изменения в постановление акимата Уалихановского района Северо-Казахстанской области от 07 мая 2012 года № 189 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Уалихановскому району на 2012 год"
    kaz: '"2012 жылға Уәлиханов ауданы бойынша ауыл шаруашылығының әр түрі бойынша субсидияланатын басым дақылдарын себудің оңтайлы мерзімін және субсидия алушылардың тізіміне енгізуге өтінім беру мерзімін анықтау туралы" Уәлиханов ауданы әкімдігінің 2012 жылғы 07 мамырдағы № 189 қаулысына өзгеріс енгізу туралы'

act_code: '68482'
requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 28 сентября 2012 года № 269. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 ноября 2012 года № 1941. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 22 мая 2013 года № 128
title:
  rus: 'Об утверждении регламента государственной услуги "Присвоение спортивных разрядов и категорий: второй и третий, первый, второй и третий юношеские, тренер высшего и среднего уровня квалификации второй категории, инструктор-спортсмен высшего уровня квалификации второй категории, методист высшего и среднего уровня квалификации второй категории, судья по спорту"'
  kaz: '"Екінші және үшінші разрядтар, бірінші, екінші және үшінші жасөспірімдік разрядтар, біліктілігі жоғары және орта деңгейдегі екінші санатты жаттықтырушы, біліктілігі жоғары деңгейдегі екінші санатты нұсқаушы-спортшы, біліктілігі жоғары және орта деңгейдегі екінші санатты әдіскер, спорт төрешісі спорттық разрядтары мен санаттарын беру" мемлекеттік қызмет регламентін бекіту туралы'

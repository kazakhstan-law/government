act_code: '40099'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 29 мая 2008 года № 105. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 11 июня 2008 года № 13-14-60. Утратило силу постановлением акимата района Шал акына от 12 октября 2009 года № 215
title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов на инвалидов для предоставления им протезно-ортопедической помощи" государственным учреждением "Отдел занятости и социальных программ района Шал акына"
  kaz: «Шал ақын ауданының Жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Мүгедектерге протездік-ортопедиялық көмек көрсету үшін құжаттар ресімдеу» мемлекеттік қызмет көрсетудің стандарттарын бекіту тіралы

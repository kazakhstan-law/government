act_code: '40350'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 30 мая 2008 года № 138. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 1 июля 2008 года № 13-3-66. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 16 января 2009 года № 5
title:
  rus: О реализации постановления акимата Северо-Казахстанской области от 27 марта 2008 года № 73 «О реализации Указа Президента Республики Казахстан от 30 декабря 2007 года № 506 «О квоте иммиграции оралманов на 2008 год» и постановления Правительства Республики Казахстан от 15 февраля 2008 года № 137 «О распределении квоты иммиграции оралманов на 2008 год»
  kaz: «Оралмандардың 2008 жылға арналған көшіп келу квотасын бөлу туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 15 ақпандағы № 137 қаулысын және «2008 жылға арналған оралмандардың көшіп келу квотасы туралы» Қазақстан Республикасы Президентінің 2007 жылғы 30 желтоқсандағы №506 Жарлығын жүзеге асыру туралы» Солтүстік Қазақстан облысы әкімдігінің 2008 жылғы 27 наурыздағы №73 қаулысын іске асыру туралы

act_code: '40853'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 12 июня 2008 года № 174. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 23 июля 2008 года № 13-5-79. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 16 апреля 2015 года № 160
title:
  rus: Об определении Перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях, за счет районного бюджета
  kaz: '"Аудандық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен айналысатын азаматтық қызметкерлердің жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мамандары лауазымдарының Тізбесін айқындау туралы'

requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2008 жылғы 17 маусымдағы № 115 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2008 жылғы 17 шілдеде № 13-13-80 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 19 ақпандағы № 20 Қаулысымен

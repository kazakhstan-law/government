requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 14 ноября 2008 года № 318. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 5 декабря 2008 года № 13-5-88. Утратило силу - постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 16 октября 2009 года № 250
title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов для инвалидов на социальное обслуживание на дому, в том числе для детей-инвалидов, нуждающихся в постороннем уходе и помощи"
  kaz: '"Мүгедектерге үйінде, оның ішінде бөгде адамның күтіміне және жәрдеміне мұқтаж мүгедек балаларға әлеуметтік қызмет көрсетуге арналған құжаттарды ресімдеу" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

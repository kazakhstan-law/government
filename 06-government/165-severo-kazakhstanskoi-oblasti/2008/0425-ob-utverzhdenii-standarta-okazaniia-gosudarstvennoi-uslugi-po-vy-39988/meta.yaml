act_code: '39988'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 25 апреля 2008 года № 200. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 5 июня 2008 года № 13-11-118. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по выдаче справок о наличии подсобного хозяйства Государственным учреждением "Аппарат акима Чкаловского сельского округа Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы Чкалов селолық округі әкімінің аппараты" Мемлекеттік мекемесімен қосалқы шаруашылықтың бар екендігі туралы анықтамалар беру бойынша мемлекеттік қызметті көрсету стандартын бекіту туралы'

act_code: '40958'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 25 июня 2008 года № 166. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 31 июля 2008 года № 13-3-70. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 14 августа 2009 года № 197
title:
  rus: Об утверждении стандарта оказания государственной услуги "Регистрация детей дошкольного возраста (до 7 лет) для направления в детские дошкольные учреждения" оказываемой государственным учреждением "Отдел образования Айыртауского района Северо-Казахстанской области" физическим лицам
  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының білім бөлімі" мемлекеттік мекемесімен жеке тұлғаларға көрсетілетін "Мектепке дейінгі балалар мекемелеріне жіберу үшін мектепке дейінгі (7 жасқа дейін) жастағы балаларды тіркеу" мемлекеттік қызмет көрсету стандартын бекіту туралы'

act_code: '41092'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 1 июля 2008 года № 170. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 12 августа 2008 года № 13-3-75. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 14 августа 2009 года № 197
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок в нотариальную контору для разрешения обмена или продажи жилой площади, принадлежащей несовершеннолетним детям" оказываемой государственным учреждением "Отдел образования Айыртауского района Северо-Казахстанской области" физическим лицам
  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының білім бөлімі" мемлекеттік мекемесімен жеке тұлғаларға көрсетілетін "Кәмелетке толмаған балаларға тиесілі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру" мемлекеттік қызмет көрсету стандартын бекіту туралы'

act_code: '39772'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 21 апреля 2008 года № 132. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 27 мая 2008 года № 13-4-72. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением "Отдел образования Акжарского района Северо-Казахстанской области", государственными учреждениями аппараты акимов сельских округов Акжарского района Северо-Казахстанской области по выдаче разрешений в банки для оформления ссуды под залог жилья, принадлежащего несовершеннолетнему
  kaz: '"Солтүстік Қазақстан облысы Ақжар ауданының білім бөлімі" мемлекеттік мекемесімен, Солтүстік Қазақстан облысы Ақжар ауданының селолық округтері әкімдерінің аппараттары мемлекеттік мекемелерімен "кәмелетке толмағандарға тиесілі тұрғын үйді кепілге қойып банктен несие ресімдеу үшін рұқсатын беру жөніндегі" мемлекеттік қызмет көрсету стандартын бекіту туралы'

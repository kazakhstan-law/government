requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 14 мая 2008 года № 104. Зарегистрировано Управлением юстиции Аккайынского района Северо-Казахстанской области 6 июня 2008 года № 13-2-80. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 20 декабря 2009 года № 256
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок решения совета опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей, являющихся собственниками жилья"
  kaz: '"Тұрғын үйдің меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қозғайтын мәмілелерді жасау үшін қорғаншылар мен қамқоршылар кеңесінің шешіміне анықтама беру" мемлекеттік қызмет көрсету стандартын бекіту туралы'

requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 1 июля 2008 года № 173. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 12 августа 2008 года № 13-3-78. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 14 августа 2009 года № 197
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача разрешений в банки для оформления ссуды под залог жилья, принадлежащего несовершеннолетнему" оказываемой государственным учреждением "Отдел образования Айыртауского района Северо-Казахстанской области" физическим лицам
  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының білім бөлімі" мемлекеттік мекемесімен жеке тұлғаларға көрсетілетін "Кәмелетке толмаған тиесілі тұрғын үйді банкке несие тәсімдеу үшін кепілге қоюға рұқсат беру" мемлекеттік қызмет көрсету стандартын бекіту туралы'

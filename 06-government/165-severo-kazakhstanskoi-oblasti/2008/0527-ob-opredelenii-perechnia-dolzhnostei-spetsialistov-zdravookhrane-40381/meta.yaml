act_code: '40381'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 27 мая 2008 года № 199. Зарегистрировано Управлением юстиции Жамбылского района Северо-Казахстанской области 27 июня 2008 года № 13-7-86. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 13 марта 2015 года № 66
title:
  rus: Об определении Перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающхи в аульной (сельской) местности, финансируемые из средств районного бюджета, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками специалистов, занимающихся этими видами деятельности в городских условиях, за счет средств районного бюджета
  kaz: Аудандық бюджет қаржысы есебінен қала жағдайында қызметтің осы түрімен айналысатын мамандардың жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар аудандық бюджеттің қаржысынан қаржыландырылатын ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім, мәдениет және спорт мамандары лауазымдарының Тізбесін айқындау жөнінде

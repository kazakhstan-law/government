  title:
    rus: О внесении дополнения в постановление акимата района от 27 мая 2008 года № 199 "Об определении Перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающхи в аульной (сельской) местности, финансируемые из средств районного бюджета, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками специалистов, занимающихся этими видами деятельности в городских условиях, за счет средств районного бюджета"
    kaz: '"Аудандық бюджет қаржысы есебінен қала жағдайында қызметтің осы түрімен айналысатын мамандардың жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар аудандық бюджеттің қаржысынан қаржыландырылатын ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім, мәдениет және спорт мамандары лауазымдарының Тізбесін айқындау жөнінде" аудан әкімдігінің 2008 жылғы 27 мамырдағы № 199 қаулысына толықтыру енгізу туралы'

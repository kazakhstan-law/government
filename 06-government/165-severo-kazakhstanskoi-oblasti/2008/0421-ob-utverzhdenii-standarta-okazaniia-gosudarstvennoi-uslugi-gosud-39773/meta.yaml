act_code: '39773'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 21 апреля 2008 года № 133. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 27 мая 2008 года № 13-4-73. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением "Отдел образования Акжарского района Северо-Казахстанской области", государственными учреждениями аппараты акимов сельских округов Акжарского района Северо-Казахстанской области по выдаче справок в нотариальную контору для разрешения обмена или продажи жилой площади, принадлежащей несовершеннолетним детям
  kaz: '"Солтүстік Қазақстан облысы Ақжар ауданының білім бөлімі" мемлекеттік мекемесімен, Солтүстік Қазақстан облысы Ақжар ауданының селолық округтері әкімдерінің аппараттары мемлекеттік мекемелерімен "кәмелетке толмаған балаларға тиесілі тұрғын алаңды сатуға немесе айырбастауға рұқсат беру үшін нотариалдық кеңсеге анықтама беру жөніндегі" мемлекеттік қызмет көрсету стандартын бекіту туралы'

requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 марта 2008 года № 78. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 7 мая 2008 года № 13-5-64. Утратило силу - постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 16 октября 2009 года № 250
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок решения совета по опеке и попечительству для сделок, затрагивающих интересы несовершеннолетних детей, являющимися собственниками жилища"
  kaz: '"Тұрғын үйдің меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қозғайтын мәмілелерді жасау үшін қорғаншылар мен қамқоршылар кеңесінің шешіміне анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

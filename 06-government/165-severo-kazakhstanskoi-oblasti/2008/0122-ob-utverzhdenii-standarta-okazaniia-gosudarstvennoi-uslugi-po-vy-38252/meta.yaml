act_code: '38252'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 22 января 2008 года № 17. Зарегистрировано Управлением юстиции Тайыншиского района Северо-Казахстанской области 4 марта 2008 № 13-11-101. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по выдаче справок решения совета опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей, являющихся собственниками жилища Государственным учреждением "Отдел образования Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы білім бөлімі" мемлекеттік мекемесімен кәмелетке толмаған балалардың мүддесін қозғайтын мәміле үшін қамқоршы және қамқорлық жөніндегі кеңесінің шешімінің тұрғын үй иесі болатын анықтамасын беру бойынша мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

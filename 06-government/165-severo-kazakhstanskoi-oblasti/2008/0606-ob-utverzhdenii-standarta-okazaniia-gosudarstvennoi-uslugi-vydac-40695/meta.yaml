requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 6 июня 2008 № 211. Зарегистрировано Управлением юстиции Кызылжарского района Северо-Казахстанской области 16 июля 2008 года № 13-8-82. Утратило силу - постановлением акимата Кызылжарского района Северо-Казахстанской области от 4 декабря 2009 года № 392
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок решения совета опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей, являющихся собственниками жилища"
  kaz: '"Меншігінде тұрғын үйі бар кәмелетке толмаған балалардың мүддесіне қатысты келісімдер үшін қамқоршы және қамқоршылық кеңесі шешімінің анықтамаларын беру" мемлекеттік қызмет көрсету стандартын бекіту туралы'

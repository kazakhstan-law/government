act_code: '38244'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 22 января 2008 года № 14. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 3 марта 2008 года № 13-11-93. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по приему заявки от семьи, желающей взять детей на патронатное воспитание Государственным учреждением "Отдел образования Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы білім бөлімі" мемлекеттік мекемесімен балаларды патронаттық тәрбиеге алғысы келетін отбасылардан өтінімдерді қабылдау бойынша мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

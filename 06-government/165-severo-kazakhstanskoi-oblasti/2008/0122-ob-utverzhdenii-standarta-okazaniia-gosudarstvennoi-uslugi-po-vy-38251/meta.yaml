act_code: '38251'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 22 января 2008 года № 15. Зарегистрировано Управлением юстиции Тайыншиского района Северо-Казахстанской области 4 марта 2008 № 13-11-100. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по выдаче справок в нотариальную контору для разрешения обмена или продажи жилой площади, принадлежащей несовершеннолетним детям Государственным учреждением "Отдел образования Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы білім бөлімі" мемлекеттік мекемесімен кәмелетке толмағандарға тиеслі тұрғын үй алаңын айыбастауға немесе сатуға рұқсат беру үшін нотариалдық кеңсеге анықтамаларды беру бойынша мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

act_code: '38245'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 22 января 2008 года № 18. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 3 марта 2008 года № 13-11-94. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по оформлению документов на социальное обеспечение сирот, детей, оставшихся без попечения родителей Государственным учреждением "Отдел образования Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы білім бөлімі" мемлекеттік мекемесімен ата-аналарының қамқорынсыз қалған жетімдерді, балаларды әлеуметтік қамтамасыз етуге құжаттар ресімдеу бойынша мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

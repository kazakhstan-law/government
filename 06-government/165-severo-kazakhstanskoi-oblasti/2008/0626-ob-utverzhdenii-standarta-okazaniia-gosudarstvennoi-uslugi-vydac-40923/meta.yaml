requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 26 июня 2008 года № 151. Зарегистрировано Управлением юстиции Аккайынского района Северо-Казахстанской области 1 августа 2008 года № 13-2-87. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 20 декабря 2009 года № 256
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок в нотариальную контору для разрешения обмена или продажи жилой площади, принадлежащей, несовершеннолетним детям"
  kaz: '"Кәмелетке толмаған балаларға тиесілі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру" мемлекеттік қызмет көрсету стандартын бекіту туралы'

act_code: '41967'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 3 сентября 2008 года № 385. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 8 октября 2008 года № 13-4-81. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением "Отдел образования Акжарского района Северо-Казахстанской области", государственными учреждениями аппараты акимов сельских округов Акжарского района Северо-Казахстанской области по выдаче справок в пенсионные фонды, территориальные подразделения Комитета дорожной полиции МВД для оформления наследства несовершеннолетним детям
  kaz: '"Солтүстік Қазақстан облысының Ақжар ауданының білім беру бөлімі" мемлекеттік мекемесімен, Солтүстік Қазақстан облысы Ақжар ауданының селолық округтері әкімдерінің апараттары мемлекеттік мекемелерімен "Зейнеткерлік қорларға, Ішкі Істер Министрлігінің Жол полициясы комитетінің аумаұты бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтама беру" жөніңдегі мемлекеттік қызметін көрсету стандартын бекіту туралы'

requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 25 июня 2008 года № 164. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 31 июля 2008 года № 13-3-71. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 14 августа 2009 года № 197
title:
  rus: Об утверждении стандартов оказания государственных услуг государственных учреждением "Отдел занятости и социальных программ Айыртауского района Северо-Казахстанской области" оказываемых физическим лицам
  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен жеке тұлғаларға көрсетілетін мемлекеттік қызмет көрсету стандарттарын бекіту туралы'

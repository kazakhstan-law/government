act_code: '40869'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2008 жылғы 23 маусымдағы № 125 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2008 жылғы 24 шілдеде № 13-13-90 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 19 ақпандағы № 20 Қаулысымен
title:
  rus: '"Тұрғын үйді меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қорғайтын мәмілелерді жасау үшін қорғаншылар мен қамқоршылар кеңесінің шешіміне анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

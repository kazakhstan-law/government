act_code: '38247'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 8 февраля 2008 года № 42. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 7 марта 2008 № 13-11-96. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги назначения социальной помощи специалистам социальной сферы, проживающим в сельской местности, по приобретению топлива Государственным учреждением "Отдел занятости и социальных программ Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен ауылдық жерлерде тұратын әлеуметтік саладағы мамандарға отын сатып алу әлеуметтік көмегін тағайындау бойынша мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

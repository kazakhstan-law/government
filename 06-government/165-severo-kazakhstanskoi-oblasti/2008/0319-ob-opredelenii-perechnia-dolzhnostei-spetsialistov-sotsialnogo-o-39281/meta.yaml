act_code: '39281'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 19 марта 2008 года № 35. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 29 апреля 2008 года № 13-6-89. Утратило силу - постановлением акимата Есильского района Северо-Казахстанской области от 10 августа 2009 года № 186
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками специалистов, занимающихся этими видами деятельности в городских условиях за счет средств районного бюджета на 2008 год
  kaz: 2008 жылға арналған аудандық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен айналысатын мамандардың жалақыларымен және ставкаларымен салыстырғанда жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар аулдық (селолық) жерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім беру, мәдениет және спорт мамандары лауазымдарының тізімін белгілеу туралы

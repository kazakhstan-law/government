  title:
    rus: О внесении изменений и дополнений в постановление акимата от 19 марта 2007 года № 35 "Об определении перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками специалистов, занимающихся этими видами деятельности в городских условиях за счет средств районного бюджета на 2008 год"
    kaz: 2008 жылға арналған аудандық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен айналысатын мамандардың жалақыларымен және ставкаларымен салыстырғанда жиырма бес процентке жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім беру, мәдениет және спорт мамандары лауазымдарының тізімін белгілеу туралы" аудан әкімдігінің 2008 жылдың 19 сәуіріндегі № 35 қаулысына толықтырулар енгізу туралы

requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2008 жылғы 23 маусымдағы № 124 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2008 жылғы 24 шілдеде № 13-13-89 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 19 ақпандағы № 20 Қаулысымен
title:
  rus: '"Кәмелетке толмағандарға тиесілі тұрғын үйді банкке несие ресімдеу үшін кепілге қоюға рұқсат беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

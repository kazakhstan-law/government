requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 29 мая 2008 года № 99. Зарегистрировано управлением юстиции района Шал акына Северо-Казахстанской области 11 июня 2008 года № 13-14-59. Утратило силу постановлением акимата района Шал акына от 12 октября 2009 года № 215
title:
  rus: Об утверждении стандарта оказания государственной услуги "Регистрация и учет безработных граждан" государственным учреждением "Отдел занятости и социальных программ района Шал акына"
  kaz: '"Шал ақын ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Жұмыссыз азаматтарды тіркеу және есепке қою" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

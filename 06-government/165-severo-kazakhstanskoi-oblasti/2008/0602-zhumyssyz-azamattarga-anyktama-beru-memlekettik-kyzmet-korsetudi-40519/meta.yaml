requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2008 жылғы 2 маусымдағы № 102 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2008 жылғы 3 шілдеде № 13-13-74 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 19 ақпандағы № 20 Қаулысымен

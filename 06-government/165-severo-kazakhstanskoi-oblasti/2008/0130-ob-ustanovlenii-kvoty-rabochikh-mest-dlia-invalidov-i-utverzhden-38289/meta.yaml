requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 30 января 2008 года № 29. Зарегистрировано Управлением юстиции района Магжана Жумабаева Северо-Казахстанской области 11 марта 2008 года № 13-9-69. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 22 мая 2009 года № 176
title:
  rus: Об установлении квоты рабочих мест для инвалидов и утверждении перечня предприятий, учреждений, организаций, которым установлена квота по приему на работу инвалидов, нуждающихся в социальной защите
  kaz: Мүгедектерге жұмыс орындарының квотасын белгілеу және әлеуметтік қорғауды қажет ететін мүгедектерді жұмысқа орналастыру бойынша квота белгіленген кәсіпорындардың, мекемелердің, ұйымдардың тізбесін бекіту туралы

act_code: '40102'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 29 мая 2008 года № 101. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 11 июня 2008 года № 13-14-63. Утратило силу постановлением акимата района Шал акына от 12 октября 2009 года № 215
title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов для материального обеспечения детей-инвалидов, обучающихся и воспитывающихся на дому" государственным учреждением "Отдел занятости и социальных программ района Шал акына"
  kaz: '"Шал ақын ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Үйде оқытылып, тәрбиеленген мүгедек балаларды материалдық қамтамасыз ету үшін құжаттар рәсімдеу" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

act_code: '44312'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2008 жылғы 22 желтоқсандағы № 255 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2009 жылғы 20 ақпанда № 13-13-99 тіркелді

act_code: '41965'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 3 сентября 2008 года № 384. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 8 октября 2008 года № 13-4-79. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением "Отдел образования Акжарского района Северо-Казахстанской области", государственными учреждениями аппараты акимов сельских округов Акжарского района Северо-Казахстанской области "Регистрация детей дошкольного возраста (до 7 лет) для направления в детские дошкольные учреждения"
  kaz: '"Солтүстік Қазақстан облысының Ақжар ауданының білім беру бөлімі" мемлекеттік мекемесімен, Солтүстік Қазақстан облысы Ақжар ауданының селолық округтері әкімдерінің апараттары мемлекеттік мекемелерімен "Мектепке дейінгі балалар мекемелеріне жіберу үшін мектепке дейінгі (7 жасқа  дейін) жастағы балаларды тіркеу" жөніңдегі мемлекеттік қызметін көрсету стандартын бекіту туралы'

act_code: '39532'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 4 мая 2008 года № 109. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 8 мая 2008 года № 13-3-63. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 3 октября 2014 года № 479
title:
  rus: Об определении Перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях, за счет средств бюджета района
  kaz: Ауданның бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен айналысатын азаматтық қызметкерлердің жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға кұқығы бар ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет мамандары лауазымдарының Тізбесін айқындау туралы

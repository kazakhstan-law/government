title:
  rus: Об утверждении стандарта государственной услуги "Оформление документов  для инвалидов на социальное обслуживание на дому, в том числе для детей-инвалидов, нуждающихся в постороннем уходе и помощи"
  kaz: '"Мүгедектер үшін, оның ішінде біреудің күтімі мен көмегін қажет ететін мүгедек балалар үшін үйде әлеуметтік қызмет көрсетуге құжаттар ресімдеу" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

act_code: '41428'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 20 августа 2008 года № 236. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 3 сентября 2008 года № 13-3-81. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 14 августа 2009 года № 197
title:
  rus: Об утверждении стандарта оказания государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилье из государственного жилищного фонда" оказываемой государственным учреждением "Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог Айыртауского района Северо-Казахстанской области" физическим лицам
  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының тұрғын үй-коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімі" мемлекеттік мекемесімен жеке тұлғаларға көрсетілетін "Мемлекеттік тұрғын үй қорынан тұрғын үйді қажет ететін азаматтарды кезекке және есепке қою" мемлекеттік қызмет көрсету стандартын бекіту туралы'

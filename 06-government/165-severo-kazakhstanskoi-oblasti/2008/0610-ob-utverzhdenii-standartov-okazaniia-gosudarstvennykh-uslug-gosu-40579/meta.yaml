  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесінің жеке тұлғаларға көрсетілетін мемлекеттік қызмет көрсету стандарттарын бекіту туралы'

requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 26 июня 2008 года № 152. Зарегистрировано Управлением юстиции Аккайынского района Северо-Казахстанской области 1 августа 2008 года № 13-2-85. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 20 декабря 2009 года № 256
title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформления документов для инвалидов на социальное обслуживание на дому, в том числе для детей-инвалидов, нуждающихся в постоянном уходе и помощи"
  kaz: '"Мүгедектер үйінде, оның ішінде бөгде адамның күтіміне және жәрдеміне мұктаж түгедек балаларға әлеуметтік қызмет көрсетуге арналған құжаттарды ресімдеу" мемлекеттік қызмет көрсету стандартын бекіту туралы'

act_code: '39443'
requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 11 апреля 2008 № 80. Зарегистрировано Управлением юстиции Аккайынского района Северо-Казахстанской области 6 мая 2008 года № 13-2-75. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 18 ноября 2013 года № 276
title:
  rus: Об утверждении Перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен айналысатын азаматтық қызметкерлердің жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мамандары лауазымдарының Тізбесін бекіту туралы

act_code: '41091'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 1 июля 2008 года № 169. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 12 августа 2008 года № 13-3-74. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 14 августа 2009 года № 197
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок в пенсионные фонды, территориальные подразделения Комитета дорожной полиции МВД для оформления наследства несовершеннолетним детям" оказываемой государственным учреждением "Отдел образования Айыртауского района Северо-Казахстанской области" физическим лицам
  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының білім бөлімі" мемлекеттік мекемесімен жеке тұлғаларға көрсетілетін "Зейнеткерлік тұлғаларға, ІІМ Жол полициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны рәсімдеу үшін анықтама беру" мемлекеттік қызмет көрсету стандартын бекіту туралы'

act_code: '41966'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 3 сентября 2008 года № 383. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 8 октября 2008 года № 13-4-80. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением "Отдел образования Акжарского района Северо-Казахстанской области", государственными учреждениями аппараты акимов сельских округов Акжарского района Северо-Казахстанской области по выдаче справок решения совета опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей, являющихся собственниками жилья
  kaz: '"Солтүстік Қазақстан облысының Ақжар ауданының білім беру бөлімі" мемлекеттік мекемесімен, Солтүстік Қазақстан облысы Ақжар ауданының селолық округтері әкімдерінің апараттары мемлекеттік мекемелерімен "Тұрғын үйдің меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қозғайтын мәмілелерді жасау үшін қорғаншылар мен қамқоршылар Кеңесінің шешіміне анықтама беру" жөніңдегі мемлекеттік қызметін көрсету стандартын бекіту туралы'

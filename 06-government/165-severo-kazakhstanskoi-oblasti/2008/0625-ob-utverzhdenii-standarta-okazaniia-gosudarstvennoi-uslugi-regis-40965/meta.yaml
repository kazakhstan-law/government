act_code: '40965'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 25 июня 2008 года № 165. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 31 июля 2008 года № 13-3-72. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 14 августа 2009 года № 197
title:
  rus: Об утверждении стандарта оказания государственной услуги "Регистрация и учет граждан, пострадавших вследствие ядерных испытаний на Семипалатинском испытательном ядерном полигоне", оказываемой государственным учреждением "Отдел занятости и социальных программ Айыртауского района Северо-Казахстанской области" физическим лицам
  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Семей ядролық сынақ полигонында ядролық сынақтардың салдарынан зардап шеккен азаматтарды тіркеу және есепке алу" жеке тұлғаларға мемлекеттік қызмет көрсету стандартын бекіту туралы'

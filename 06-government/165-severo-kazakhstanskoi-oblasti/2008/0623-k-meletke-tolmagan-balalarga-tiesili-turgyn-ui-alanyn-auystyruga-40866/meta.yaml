act_code: '40866'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2008 жылғы 23 маусымдағы № 121 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2008 жылғы 24 шілдеде № 13-13-87 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 19 ақпандағы № 20 Қаулысымен
title:
  rus: '"Кәмелетке толмаған балаларға тиесілі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'
  kaz: '"Кәмелетке толмаған балаларға тиесілі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

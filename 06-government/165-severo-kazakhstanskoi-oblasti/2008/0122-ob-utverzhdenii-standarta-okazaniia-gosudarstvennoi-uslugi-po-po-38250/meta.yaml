act_code: '38250'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 22 января 2008 года № 16. Зарегистрировано Управлением юстиции Тайыншиского района Северо-Казахстанской области 4 марта 2008 № 13-11-99. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по постановке на учет и очередность граждан, нуждающихся в жилье из государственного жилищного фонда Государственным учреждением "Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданының тұрмыстық-коммуналдық шаруашылық, жолаушылар көлігі және автомобильдық жолдар бөлімі" мемлекеттік мекемесімен мемлекеттік тұрғын қорынан тұрғын үйді қажет ететін азаматтарды есепке алу және кезекке қою бойынша мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

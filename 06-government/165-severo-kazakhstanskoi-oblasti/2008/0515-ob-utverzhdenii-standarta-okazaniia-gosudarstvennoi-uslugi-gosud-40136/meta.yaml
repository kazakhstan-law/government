act_code: '40136'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 15 мая 2008 года № 182. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 17 июня 2008 года № 13-4-76. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением "Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог Акжарского района Северо-Казахстанской области", постановка на учет и очередность граждан, нуждающихся в жилье из государственного жилищного фонда
  kaz: Мемлекеттік тұрғын үй қорынан тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою "Солтүстік Қазақстан облысы Ақжар ауданы тұрғын-үй шаруашылығы, жолаушылар көлігі және автомобиль жолдары бөлімі" мемлекеттік мекемесімен мемлекеттік қызметтін көрсету стандартын бекіту туралы

act_code: '38248'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 22 января 2008 года № 13. Зарегистрировано Управлением юстиции Тайыншиского района Северо-Казахстанской области 4 марта 2008 № 13-11-97. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по выдаче справок в пенсионные фонды, территориальные подразделения Комитета дорожной полиции МВД для оформления наследства несовершеннолетним детям Государственным учреждением "Отдел образования Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы білім бөлімі" мемлекеттік мекемесімен кәмелетке толмағандарға мұраны ресімдеу үшін зейнетақылық қорлардың, ІІМ жол полициясы комитеті аумақтық бөлімшелерінің анықтамаларын беру бойынша мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

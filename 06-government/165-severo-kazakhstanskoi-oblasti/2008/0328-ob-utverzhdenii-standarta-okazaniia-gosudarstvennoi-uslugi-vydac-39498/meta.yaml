requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 марта 2008 года № 79. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 7 мая 2008 года № 13-5-65. Утратило силу - постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 16 октября 2009 года № 250
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок в нотариальную контору для разрешения обмена или продажи жилой площади принадлежащей несовершеннолетним детям"
  kaz: '"Кәмелетке толмаған балаларға тиесілі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

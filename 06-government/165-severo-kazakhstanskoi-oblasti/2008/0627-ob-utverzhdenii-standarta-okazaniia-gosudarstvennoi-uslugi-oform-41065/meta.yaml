requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 27 июня 2008 года № 299. Зарегистрировано Управлением юстиции района Магжана Жумабаева Северо-Казахстанской области 8 августа 2008 № 13-9-78. Утратило силу - постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 7 декабря 2009 года № 421
title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов для инвалидов на социальное обслуживание на дому, в том числе для детей-инвалидов, нуждающихся в постороннем уходе и помощи"
  kaz: '"Біреудің күтуіне және көмегіне мұқтаж мүгедектерге оның ішінде мүгедек балаларға үйде әлеуметтік қызмет көрсету үшін құжаттар ресімдеу" мемлекеттік қызмет көрсету стандартын бекіту туралы'

title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры и спорта, которым установлено повышение к должностным окладам за работу в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерлерде қызмет атқарғандары үшін лауазымдық жалақыларына үстемақы белгіленген әлеуметтік қамтамасыз ету, білім беру, мәдениет лауазымдық мамандарының тізбесін анықтау туралы

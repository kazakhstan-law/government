act_code: '39907'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 16 апреля 2008 года № 145. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 17 мая 2008 года № 13-11-113. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по выдаче справок о наличии подсобного хозяйства Государственным учреждением "Аппарат акима Кантемировского сельского округа Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы Кантемир селолық округі әкімінің аппараты" Мемлекеттік мекемесімен қосалқы шаруашылықтың бар екендігі туралы анықтамалар беру бойынша мемлекеттік қызметті көрсету стандартын бекіту туралы'

act_code: '40867'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2008 жылғы 23 маусымдағы № 123 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2008 жылғы 24 шілдеде № 13-13-88 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 19 ақпандағы № 20 Қаулысымен
title:
  rus: '"Зейнеткерлік қорларға, ІІМ жол полициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

act_code: '38249'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 22 января 2008 года № 19. Зарегистрировано Управлением юстиции Тайыншиского района Северо-Казахстанской области 4 марта 2008 № 13-11-98. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по выдаче разрешений в банки для оформления ссуды под залог жилья, принадлежащего несовершеннолетнему Государственным учреждением "Отдел образования Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы білім бөлімі" мемлекеттік мекемесімен кәмелетке толмағандарға тиесілі тұрғын үйді кепілге қойып несие ресімдеу үшін банка рұқсат беру бойынша мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

act_code: '41860'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 25 сентября 2008 года № 172. Зарегистрировано Управлением юстиции Мамлютского района Северо-Казахстанской области 14 октября 2008 № 13-10-72. Утратило силу (письмо акима Мамлютского района Северо-Казахстанской области от 14 января 2013 года № 02-08-02-02/37)
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками специалистов, занимающихся этими видами деятельности в городских условиях за счет средств районного бюджета на 2008 год
  kaz: Ауылдық (селолық) жерде жұмыс істейтін білім, мәдениет әлеуметтік қамту, осы қызмет түрімен қалалық жағдайда айналысатын мамандармен салыстырғанда 2008 жылдық бюджет есебінде жиырма бес пайыздан кем емес лауазымдық айлықақыларын және тарифтік ставкаларын жоғарылатуға құқығы бар мамандардың лауазымдар тізбесін белгілеу туралы

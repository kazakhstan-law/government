act_code: '39774'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 21 апреля 2008 года № 134. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 27 мая 2008 года № 13-4-74. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением "Отдел образования Акжарского района Северо-Казахстанской области", государственными учреждениями аппараты акимов сельских округов Акжарского района Северо-Казахстанской области по выдаче справок по опеке и попечительству
  kaz: '"Солтүстік Қазақстан облысы Ақжар ауданының білім бөлімі" мемлекеттік мекемесімен, Солтүстік Қазақстан облысы Ақжар ауданының селолық округтері әкімдерінің аппараттары мемлекеттік мекемелерімен "қорғаншылық пен қамқоршылық жөнінде анықтама беру" мемлекеттік қызмет көрсету стандартын бекіту туралы'

requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 марта 2008 года № 81. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 7 мая 2008 года № 13-5-67. Утратило силу - постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 16 октября 2009 года № 250
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок в пенсионные фонды, территориальные подразделения Комитета дорожной полиции Министерства внутренних дел для оформления наследства несовершеннолетним детям"
  kaz: '"Зейнеткерлік қорларға, ішкі істер министрлік жол полициясы Комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

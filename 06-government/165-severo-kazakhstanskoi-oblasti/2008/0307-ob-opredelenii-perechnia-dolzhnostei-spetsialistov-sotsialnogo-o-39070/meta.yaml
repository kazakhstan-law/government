requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 7 марта 2008 года № 104. Зарегистрировано Управлением юстиции района Магжана Жумабаева Северо-Казахстанской области 18 апреля 2008 № 13-9-72. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 26 февраля 2014 года № 52
title:
  rus: Об определении перечня должностей специалистов социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышение на двадцать пять процентов должностные оклады и тарифные ставки, за счет средств местного бюджета
  kaz: Ауылдық (селолық) жерде жұмыс істейтін жергілікті бюджет есебінен лауазымдық ақылардың және тарифтік ставкаларының жиырма бес пайызға көтерілуіне құқығы бар әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарының лауазымдар тізбесін анықтау туралы

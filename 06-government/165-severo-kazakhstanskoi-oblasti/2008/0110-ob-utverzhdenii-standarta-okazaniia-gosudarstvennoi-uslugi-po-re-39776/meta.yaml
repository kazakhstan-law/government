requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 10 января 2008 года № 1. Зарегистрировано Управлением юстиции Тайыншиского района Северо-Казахстанской области 22 февраля 2008 № 13-11-92. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по регистрации детей дошкольного возраста (до 7 лет) для направления в детские дошкольные учреждения Государственным учреждением "Аппарат акима города Тайынша Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы Тайынша қаласы әкімінің аппараты" Мемлекеттік мекемесінің мектепке дейінгі балалар мекемесіне жіберу үшін мектепке дейінгі (7 жасқа дейінгі) жастағы балаларды тіркеу бойынша мемлекеттік қызметтін көрсету стандартын бекіту туралы'

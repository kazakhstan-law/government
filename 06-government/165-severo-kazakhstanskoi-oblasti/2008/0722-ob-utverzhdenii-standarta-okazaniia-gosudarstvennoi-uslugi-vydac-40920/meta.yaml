requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 22 июля 2008 № 215. Зарегистрировано Управлением юстиции Тимирязевского района Северо-Казахстанской области 30 июля 2008 года № 13-12-74. Утратило силу - постановлением акимата Тимирязевского района Северо-Казахстанской области от 13 ноября 2009 года № 217
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок решения совета, опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей, являющихся собственниками жилища"
  kaz: '"Тұрғын үйдің меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қозғайтын мәмілелерді жасау үшін қорғаншылар мен қамқоршылар кеңесінің шешіміне анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

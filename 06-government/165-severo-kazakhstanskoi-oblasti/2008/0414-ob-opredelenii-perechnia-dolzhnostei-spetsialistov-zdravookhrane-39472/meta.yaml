act_code: '39472'
requisite: Постановление акимата Северо-Казахстанской области от 14 апреля 2008 года № 104. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 апреля 2008 года № 1672. Утратило силу постановлением акимата Северо-Казахстанской области от 9 апреля 2015 года № 120
title:
  rus: Об определении Перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях за счет средств областного бюджета
  kaz: Облыстық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен айналысатын азаматтық қызметкерлердің жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мамандары лауазымдарының Тізбесін айқындау туралы

  title:
    rus: О внесении изменений и дополнений в постановление акимата области от 14 апреля 2008 года N 104 "Об определении Перечня должностей специалистов здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях за счет средств областного бюджета"
    kaz: '"Облыстық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен  айналысатын азаматтық қызметкерлердің жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мамандары лауазымдарының Тізбесін айқындау туралы" облыс әкімдігінің 2008 жылғы 14 сәуірдегі № 104 қаулысына өзгерістер мен толықтыру енгізу туралы'

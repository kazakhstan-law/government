act_code: '40097'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 29 мая 2008 года № 104. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 11 июня 2008 года № 13-14-58. Утратило силу постановлением акимата района Шал акына от 12 октября 2009 года № 215
title:
  rus: Об утверждении стандарта оказания государственной услуги "Регистрация и учет пострадавших вследствие ядерных испытаний на Семипалатинском испытательном ядерном полигоне" государственным учреждением "Отдел занятости и социальных программ района Шал акына"
  kaz: '"Шал ақын ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Семей ядролық сынақ полигонындағы ядролық сынақтардан зардап шеккен азаматтарды тіркеу және есеп жүргізу " мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

act_code: '40101'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 29 мая 2008 года № 100. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 11 июня 2008 года № 13-14-62. Утратило силу постановлением акимата района Шал акына от 12 октября 2009 года № 215
title:
  rus: Об утверждении стандарта оказания государственной услуги "Назначение государственных пособий семьям, имеющих детей до 18 лет" государственным учреждением "Отдел занятости и социальных программ района Шал акына"
  kaz: '"Шал ақын ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "18 жасқа дейінгі балалары бар отбасыларына мемлекеттік жәрдемақыны тағайындау" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

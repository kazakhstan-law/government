requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 18 июля 2008 года № 299. Зарегистрировано Управлением юстиции Кызылжарского района Северо-Казахстанской области 26 августа 2008 года № 13-8-90. Утратило силу постановлением акимата Кызылжарского района Северо-Казахстанской области от 10 апреля 2015 года № 184
title:
  rus: Об определении Перечня должностей специалистов социального обеспечения, образования и культуры, работающих в аульной (сельской) местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях, за счет средств районного бюджета
  kaz: Аудандық бюджет қаражаты есебінен қалалық жағдайда қызметтің осы түрімен айналысатын азаматтық қызметкерлердің  жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды алуға құқығы бар ауылдық (селолық) жерде жұмыс істейтін  әлеуметтік қамтамасыз ету, білім және мәдениет мамандары лауазымдарының Тізбесін айқындау туралы

act_code: '38353'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 18 февраля 2008 года № 35. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 17 марта 2008 года № 13-3-60. Утратило силу - постановлением акимата Айыртауского района Северо-Казахстанской области от 14 августа 2009 года № 197
title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок безработным гражданам", оказываемой государственным учреждением "Отдел занятости и социальных программ Айыртауского района Северо-Казахстанской области" физическим лицам
  kaz: '"Солтүстік Қазақстан облысы Айыртау ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен жеке тұлғаларға көрсетілетін "Жұмыссыз азаматтарға анықтама беру" мемлекеттік қызмет көрсету стандартын бекіту туралы'

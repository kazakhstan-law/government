act_code: '40514'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2008 жылғы 2 маусымдағы № 97 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2008 жылғы 3 шілдеде № 13-13-69 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 19 ақпандағы № 20 Қаулысымен
title:
  rus: '"Мүгедектер үйінде, оның ішінде бөгде адамның күтіміне және жәрдеміне мұқтаж мүгедек балаларға әлеуметтік көмек көрсетуге арналған құжаттарды ресімдеу" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'
  kaz: '"Мүгедектер үйінде, оның ішінде бөгде адамның күтіміне және жәрдеміне мұқтаж мүгедек балаларға әлеуметтік көмек көрсетуге арналған құжаттарды ресімдеу" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

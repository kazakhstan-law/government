title:
  rus: Об утверждении стандарта оказания государственной услуги "Выдача справок в пенсионные фонды, территориальные подразделения Комитета дорожной полиции МВД для оформления наследства несовершеннолетним детям"
  kaz: '"Зейнеткерлік қорларға, ІІМ Жол плициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтама беру" мемлекеттік қызмет көрсетудің стандартын бекіту туралы'

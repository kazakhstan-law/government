act_code: '43661'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2008 жылғы 10 желтоқсандағы № 242 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2009 жылғы 23 қаңтарда № 13-13-98 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы әкімі аппаратының 2012 жылғы 13 қыркүйектегі № 02.12.06-09/233 хаты)
title:

requisite: Постановление акимата Северо-Казахстанской области от 1 апреля 2020 года № 78. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 апреля 2020 года № 6140. Утратило силу постановлением акимата Северо-Казахстанской области от 1 июня 2020 года № 142 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2020 год
  kaz: 2020 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы

    kaz: «2020 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2020 жылғы 15 шілдедегі № 189 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения и дополнения в постановление акимата Северо-Казахстанской области от 1 июня 2020 года № 142 «Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2020 год»
    kaz: «2020 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2020 жылғы 1 маусымдағы № 142 қаулысына өзгеріс және толықтыру енгізу туралы

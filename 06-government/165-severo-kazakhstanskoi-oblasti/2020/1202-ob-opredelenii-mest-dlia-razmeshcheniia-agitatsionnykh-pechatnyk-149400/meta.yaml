caused_by:
  code: '157105'
  requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 16 июля 2021 года № 189. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 июля 2021 года № 23604. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 10 декабря 2025 года № 258 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 2 декабря 2020 года № 309 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и предоставления кандидатам помещений для проведения встреч с избирателями на территории района имени Габита Мусрепова  Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның аумағында барлық кандидаттарға үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесу үшін үй-жайлар беру туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2020 жылғы 2 желтоқсандағы № 309 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157105/rus

act_code: '149400'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 2 декабря 2020 года № 309. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 декабря 2020 года № 6767. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 10 декабря 2025 года № 258 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның аумағында барлық кандидаттарға үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

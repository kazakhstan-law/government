    kaz: «Петропавл қаласында жолаушылар мен багажды автомобильмен қалалық тұрақты тасымалдау маршруттарына сараланған тариф белгілеу туралы» Солтүстік Қазақстан облысы Петропавл қаласы әкімдігінің 2020 жылғы 29 желтоқсандағы № 1447 қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 29 декабря 2020 года № 1447. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 декабря 2020 года № 6869. Утратило силу постановлением акимата города Петропавловска Северо-Казахстанской области от 19 сентября 2023 года № 1189 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об установлении дифференцированного тарифа на маршруты регулярных городских автомобильных перевозок пассажиров и багажа в городе Петропавловске
  kaz: Петропавл қаласында жолаушылар мен багажды автомобильмен қалалық тұрақты тасымалдау маршруттарына сараланған тариф белгілеу туралы

  title:
    rus: Об отмене карантинного режима на территории районов Северо-Казахстанской области и внесении изменений в постановление акимата Северо–Казахстанской области от 29 апреля 2020 года № 100 «Об установлении карантинной зоны на территории районов Айыртауского, Акжарского, Аккайынского, Жамбылского, Магжана Жумабаева, имени Габита Мусрепова, Тайыншинского, Тимирязевского, Уалихановского, Шал акына с введением карантинного режима»
    kaz: Солтүстік Қазақстан облысы аудандарының аумағында карантиндік режимінің күшін жою туралы және «Карантиндік режимді енгізе отырып, Айыртау, Ақжар, Аққайың, Жамбыл, Мағжан Жұмабаев, Ғабит Мүсірепов атындағы, Тайынша, Тимирязев, Уәлиханов, Шал ақын аудандарының аумағында карантинді аймақты белгілеу туралы» Солтүстік Қазақстан облысы әкімдігінің 2020 жылғы 29 сәуірдегі № 100 қаулысына өзгерістер енгізу туралы

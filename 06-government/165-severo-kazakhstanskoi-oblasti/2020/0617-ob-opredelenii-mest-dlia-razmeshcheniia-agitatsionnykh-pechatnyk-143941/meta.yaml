act_code: '143941'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 17 июня 2020 года № 147. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 июня 2020 года № 6368. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 7 июля 2026 года № 220 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов
  kaz: Барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

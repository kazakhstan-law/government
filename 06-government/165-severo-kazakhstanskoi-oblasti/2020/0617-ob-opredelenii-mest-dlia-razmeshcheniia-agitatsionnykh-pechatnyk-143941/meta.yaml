  requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 18 октября 2021 года № 375. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 октября 2021 года № 24878. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 7 июля 2026 года № 220 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Айыртауского района Северо-Казахстанской области от 17 июня 2020 года № 147 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и предоставления кандидатам помещения для проведения встреч с избирателями на территории Айыртауского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Айыртау ауданының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және кандидаттарға сайлаушылармен кездесу өткізу үшін үй-жай беру туралы» Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2020 жылғы 17  маусымдағы № 147 қаулысына өзгерістер енгізу туралы

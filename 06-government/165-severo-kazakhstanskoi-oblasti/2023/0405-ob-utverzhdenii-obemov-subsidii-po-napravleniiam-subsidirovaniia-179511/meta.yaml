  title:
    rus: «О внесении изменения в постановление акимата Северо-Казахстанской области от 5 апреля 2023 года № 41 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышения продуктивности и качества продукции животноводства, а также нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Северо-Казахстанской области на 2023 год»
    kaz: «2023 жылға арналған Солтүстік Қазақстан облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, сондай-ақ ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарды және өтінім беру мерзімдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2023 жылғы 5 сәуірдегі № 41 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/190026/rus

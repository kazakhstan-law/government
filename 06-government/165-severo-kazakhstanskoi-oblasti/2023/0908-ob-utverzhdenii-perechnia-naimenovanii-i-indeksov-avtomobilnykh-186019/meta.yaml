  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 8 сентября 2023 года № 195 «Об утверждении перечня, наименований и индексов автомобильных дорог общего пользования районного значения района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы бойынша жалпыға ортақ пайдаланылатын аудандық маңызы бар автомобиль жолдарының тізбесін, атаулары мен индекстерін бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2023 жылғы 8 қыркүйектегі № 195 қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении перечня, наименований и индексов автомобильных дорог общего пользования районного значения района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы бойынша жалпыға ортақ пайдаланылатын аудандық маңызы бар автомобиль жолдарының тізбесін, атаулары мен индекстерін бекіту туралы

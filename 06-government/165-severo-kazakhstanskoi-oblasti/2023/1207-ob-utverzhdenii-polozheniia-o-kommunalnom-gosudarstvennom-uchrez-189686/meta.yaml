    rus: О внесении изменения и дополнений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 7 декабря 2023 года № 281 «Об утверждении Положения о коммунальном государственном учреждении «Отдел внутренней политики, культуры и развития языков акимата района имени Габита Мусрепова Северо-Казахстанской области»

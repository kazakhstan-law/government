  title:
    rus: О внесении изменения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 12 апреля 2023 года № 77 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» исполнительных органов района имени Габита Мусрепова Северо-Казахстанской области»

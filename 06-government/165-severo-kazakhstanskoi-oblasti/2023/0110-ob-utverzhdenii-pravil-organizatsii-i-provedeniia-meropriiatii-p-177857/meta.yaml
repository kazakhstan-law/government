  title:
    rus: «О внесении изменений в постановление акимата города Петропавловска от 10 января 2023 года № 1546 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Петропавловск»
    kaz: «Петропавл қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Петропавл қаласы әкімдігінің 2023 жылғы 10 қаңтардағы № 1546 қаулысына өзгерістер енгізу туралы

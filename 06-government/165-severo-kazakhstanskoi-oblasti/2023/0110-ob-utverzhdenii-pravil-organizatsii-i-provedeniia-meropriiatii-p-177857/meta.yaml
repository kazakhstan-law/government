requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 10 января 2023 года № 1546. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 января 2023 года № 7433
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Петропавловск
  kaz: Петропавл қаласына бірыңғай сәулеттік келбет беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы

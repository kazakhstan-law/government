  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 3 мая 2023 года № 93 «Об утверждении Положения о коммунальном государственном учреждении «Отдел архитектуры, строительства, жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің сәулет, құрылыс, тұрғын үй-коммуналдық шаруашылығы, жолаушы көлігі және автомобиль жолдары бөлімі» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2023 жылғы 3 мамырдағы № 93 қаулысына өзгерістер енгізу туралы

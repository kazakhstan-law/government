  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 25 мая 2023 года № 77 «Об утверждении перечня и норм субсидий на пестициды, биоагенты (энтомофаги), а также объема бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2023 год»
    kaz: «2023 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2023 жылғы 25 мамырдағы № 77 қаулысына өзгеріс енгізу туралы

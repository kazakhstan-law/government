title:
  rus: Об утверждении перечня и норм субсидий на пестициды, биоагенты (энтомофаги), а также объема бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2023 год
  kaz: 2023 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы

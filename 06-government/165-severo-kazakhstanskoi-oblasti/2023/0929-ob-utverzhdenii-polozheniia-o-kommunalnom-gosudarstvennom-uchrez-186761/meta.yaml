  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 29 сентября 2023 года № 219 «Об утверждении Положения о коммунальном государственном учреждении «Отдел физической культуры и спорта акимата района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің дене шынықтыру және спорт бөлімі» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2023 жылғы 29 қыркүйектегі № 219 қаулысына өзгерістер енгізу туралы

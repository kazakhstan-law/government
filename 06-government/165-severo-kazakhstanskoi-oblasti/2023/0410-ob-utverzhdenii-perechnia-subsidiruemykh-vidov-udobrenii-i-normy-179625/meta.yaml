act_code: '179625'
requisite: Постановление акимата Северо-Казахстанской области от 10 апреля 2023 года № 44. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 апреля 2023 года № 7469-15
title:
  rus: Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2023 год
  kaz: 2023 жылға арналған тыңайтқыштардың субсидияланатын түрлерінің тізбесін және тыңайтқыштарды, сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған cубсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 7 декабря 2023 года № 281 «Об утверждении Положения о коммунальном государственном учреждении «Отдел внутренней политики, культуры и развития языков акимата района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің ішкі саясат, мәдениет және тілдерді дамыту бөлімі» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2023 жылғы 7 желтоқсандағы № 281 қаулысына өзгерістер мен толықтыру енгізу туралы

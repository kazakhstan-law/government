  title:
    rus: О внесении изменения в постановление акимата Кызылжарского района Северо-Казахстанской области от 28 декабря 2023 года № 348 «Об определении и утверждении мест размещения нестационарных торговых объектов на территории Кызылжарского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Қызылжар ауданының аумағында стационарлық емес сауда объектілерін орналастыру орындарын айқындау және бекіту туралы» Солтүстік Қазақстан облысы Қызылжар ауданы әкімдігінің 2023 жылғы 28 желтоқсандағы № 348 қаулысына өзгерістер енгізу туралы

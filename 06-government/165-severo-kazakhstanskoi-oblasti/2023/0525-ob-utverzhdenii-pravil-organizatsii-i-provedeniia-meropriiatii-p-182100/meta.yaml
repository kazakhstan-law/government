act_code: '182100'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 25 мая 2023 года № 101. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 мая 2023 года № 7514-15
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

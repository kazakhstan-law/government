  title:
    rus: О внесении изменений в постановление акимата Есильского района Северо-Казахстанской области от 25 мая 2023 года № 101 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданының елді мекендеріне бірыңғай сәулеттік келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2023 жылғы 25 мамырдағы № 101 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209957/rus

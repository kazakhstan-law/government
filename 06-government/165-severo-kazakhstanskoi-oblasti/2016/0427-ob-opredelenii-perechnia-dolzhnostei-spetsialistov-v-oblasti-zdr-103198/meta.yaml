act_code: '103198'
requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 27 апреля 2016 года № 89. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 мая 2016 года № 3774. Утратило силу постановлением акимата Уалихановского района Северо-Казахстанской области от 7 марта 2019 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Уалихановского района
  kaz: Азаматтық қызметшілір болып табылатын және Уәлиханов ауданың ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру,білім беру, мәдениет, спорт және ветеринария саласындағы мамандары лауазымдарының тізбесін анықтау туралы

act_code: '99075'
requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 8 февраля 2016 года № 239. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 февраля 2016 года № 3627. Утратило силу постановлением акимата города Петропавловска Северо-Казахстанской области от 24 мая 2017 года № 898
title:
  rus: Об определении мест в городе Петропавловске для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, Северо-Казахстанского областного и Петропавловского городского маслихатов
  kaz: Петропавл қаласында Қазақстан Республикасы Парламенті Мәжілісінің, Солтүстік Қазақстан облыстық және Петропавл қалалық мәслихатының депутаттығына кандидаттардың сайлаушылармен кездесуіне үй-жайлар беру және үгіттік баспа материалдарын орналастыруға арналған орындар белгілеу туралы

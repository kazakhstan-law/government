  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 12 мая 2016 года № 152 «Об утверждении регламента государственной услуги «Субсидирование заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость»
    kaz: «Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегінде бюджетке төленген қосылған құн салығы сомасын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2016 жылғы 12 мамырдағы № 152 қаулысына өзгеріс енгізу туралы

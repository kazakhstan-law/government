act_code: '106499'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 3 октября 2016 года № 253
title:
  rus: О признании утратившим силу постановления акимата Мамлютского района Северо-Казахстанской области от 22 августа 2016 года № 222 «Об определении сроков предоставления заявки на включение в список получателей субсидий по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Мамлютскому району Северо-Казахстанской области на 2016 год»
  kaz: «2016 жылы Солтүстік Қазақстан облысы Мамлют ауданы бойынша субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша субсидия алушылардың тізіміне қосуға өтініштерді ұсыну мерзімдерін айқындау туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2016 жылғы 22 тамыздағы № 222 қаулысын күшін жойған деп тану туралы

act_code: '105910'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 4 августа 2016 года № 175. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 августа 2016 года № 3886. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 31 июля 2019 года № 194 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности Жамбылского района
  kaz: Азаматтық қызметшілер болып табылатын және Жамбыл ауданының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру,мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

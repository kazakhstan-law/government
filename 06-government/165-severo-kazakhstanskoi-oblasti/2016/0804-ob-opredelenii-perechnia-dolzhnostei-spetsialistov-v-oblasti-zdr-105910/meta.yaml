  requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 3 августа 2017 года № 183. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 августа 2017 года № 4292. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 31 июля 2019 года № 194 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Жамбылского района Северо-Казахстанской области от 4 августа 2016 года № 175 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности Жамбылского района»
    kaz: «Азаматтық қызметшілер болып табылатын және Жамбыл ауданының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Жамбыл ауданы әкімдігінің 2016 жылғы 4 тамыздағы № 175 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/114165/rus

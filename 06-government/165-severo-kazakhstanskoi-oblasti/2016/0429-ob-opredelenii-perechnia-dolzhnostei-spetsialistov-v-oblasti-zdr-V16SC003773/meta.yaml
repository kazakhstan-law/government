requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 29 апреля 2016 года № 153. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 мая 2016 года № 3773. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 8 апреля 2019 года № 89 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

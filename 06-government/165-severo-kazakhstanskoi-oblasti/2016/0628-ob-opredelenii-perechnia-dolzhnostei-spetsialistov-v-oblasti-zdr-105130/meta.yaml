act_code: '105130'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 июня 2016 года № 187. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 августа 2016 года № 3851. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 9 ноября 2018 года № 336
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының ауылдық жерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

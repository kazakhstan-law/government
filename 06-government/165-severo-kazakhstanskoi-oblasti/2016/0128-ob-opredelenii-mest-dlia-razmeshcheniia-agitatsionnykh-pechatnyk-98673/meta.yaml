requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 28 января 2016 года № 40. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 февраля 2016 года № 3606. Утратило силу постановлением акимата Кызылжарского района Северо-Казахстанской области от 6 мая 2019 года № 127 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений всем кандидатам предвыборной агитации для проведения встреч с избирателями на территории Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесулер өткізу үшін үгіт сайлау алдындағы барлық кандидаттарға үй-жай ұсыну туралы

act_code: '103174'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 11 мая 2016 года № 166
title:
  rus: О признании утратившим силу постановления акимата Айыртауского района Северо-Казахстанской области от 11 декабря 2015 года № 423 «Об определении целевых групп и установлении дополнительного перечня лиц, относящихся к целевым группам, проживающих на территории Айыртауского района Северо-Казахстанской области на 2016 год»
  kaz: Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2015 жылғы 11 желтоқсандағы № 423 «2016 жылға Солтүстік Қазақстан облысы Айыртау ауданының аумағында тұратын мақсатты топтарға жататын тұлғалардың қосымша тізбесін белгілеу және мақсатты топтарды анықтау туралы» қаулысының күші жойылғанын тану туралы

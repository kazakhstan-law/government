act_code: '99074'
requisite: 'Постановление акимата района имени Шал Акына Северо-Казахстанской области от 29 января 2016 года № 21 '
title:
  rus: О признании утратившим силу постановления акимата района Шал акына Северо-Казахстанской области от 28 марта 2014 года № 52 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
  kaz: «Ауылдық жерде жұмыс істейтін және азаматтық қызметшілер болып табылатын денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін анықтау туралы» Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2014 жылғы 28 наурыздағы № 52 қаулысының күшінің жойылғанын тану туралы

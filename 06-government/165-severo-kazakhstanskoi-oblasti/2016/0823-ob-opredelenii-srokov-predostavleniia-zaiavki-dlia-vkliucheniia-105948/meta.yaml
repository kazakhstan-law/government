act_code: '105948'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 23 августа 2016 года № 175. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 августа 2016 года № 3878
title:
  rus: Об определении сроков предоставления заявки для включения в список сельскохозяйственных товаропроизводителей на получение субсидиий на повышение урожайности и качества продукции растениеводства,стоимости горюче-смазочных материалов и других товарно материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, затрат на возделывание сельскохозяйственных культур в защищенном грунте по району Шал акына Северо-Казахстанской области в 2016 году
  kaz: 2016 жылы Солтүстік Қазақстан облысы Шал ақын ауданы бойынша басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын  арттыруға, жанар-жағармай материалдарының және көктемгі егіспен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнына және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнына субсидиялар алуға арналған ауыл шаруашылығы тауарын өндірушілері тізіміне қосу үшін өтінімді ұсыну мерзімдерін айқындау  туралы

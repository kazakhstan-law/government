  requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 9 февраля 2018 года № 24. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 февраля 2018 года № 4574. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 12 апреля 2021 года № 77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Тимирязевского района Северо - Казахстанской области от 29 января 2016 года № 21 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Тимирязевского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданының аумағында Қазақстан Республикасы Парламенті Мәжілісі, облыстық және аудандық мәслихаттар депутаттығына кандидаттардың сайлаушылармен кездесулер өткізу үшін үй-жайлар ұсыну және үгіттік баспа материалдарын орналастыру үшін орындар анықтау туралы» Солтүстік Қазақстан облысы Тимирязев ауданы әкімдігінің 2016 жылғы 29 қаңтардағы № 21 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/119071/rus

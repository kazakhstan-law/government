act_code: '99081'
requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 29 января 2016 года № 21. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 февраля 2016 года № 3609. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 12 апреля 2021 года № 77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының аумағында Қазақстан Республикасы Парламенті Мәжілісі, облыстық және аудандық мәслихаттар депутаттығына кандидаттардың сайлаушылармен кездесулер өткізу үшін үй-жайлар ұсыну және үгіттік баспа материалдарын орналастыру үшін орындар анықтау туралы

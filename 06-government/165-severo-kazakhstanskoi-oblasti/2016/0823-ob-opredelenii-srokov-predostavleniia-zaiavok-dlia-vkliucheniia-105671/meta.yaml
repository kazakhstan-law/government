act_code: '105671'
requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 23 августа 2016 года № 223. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 августа 2016 года № 3875
title:
  rus: Об определении сроков предоставления заявок для включения в список сельскохозяйственных производителей на получение субсидий по повышению урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте по Уалихановскому району на 2016 год.
  kaz: 2016 жылы Уәлиханов ауданы бойынша басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай  материалдарының және көктемгі егіспен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнына және ауыл шаруалығы дақылдарын қорғалған топырақта өндеп өсіру шығындарының құнына субсидиялар алуға арналған ауыл шаруашылығы тауарын өндірушілері тізіміне қосу үшін өтінімді ұсыну мерзімдерін айқындау туралы

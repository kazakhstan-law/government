act_code: '108870'
requisite: Постановление акимата Северо-Казахстанской области от 30 ноября 2016 года № 464. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 января 2017 года № 3993. Утратило силу постановлением акимата Северо-Казахстанской области от 30 июля 2020 года № 206 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Об утверждении регламента государственной услуги «Выдача лицензии на право занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении
  kaz: Жолаушыларды облысаралық қалааралық, ауданаралық (облысішiлiк қалааралық) және халықаралық қатынаста автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау қызметiмен айналысу үшін лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

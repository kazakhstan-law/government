  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 30 ноября 2016 года № 464 «Об утверждении регламента государственной услуги «Выдача лицензии на право занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении»
    kaz: «Жолаушыларды облысаралық қалааралық, ауданаралық (облысішiлiк қалааралық) және халықаралық қатынаста автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау қызметiмен айналысу үшін лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2016 жылғы 30 қарашадағы № 464 қаулысына өзгеріс енгізу туралы

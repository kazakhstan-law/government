act_code: '105922'
requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 25 июля 2016 года № 165. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 августа 2016 года № 3887. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 26 августа 2019 года № 165 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности Тимирязевского района
  kaz: Азаматтық қызметшілер болып табылатын және Тимирязев ауданының ауылдық жерінде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы

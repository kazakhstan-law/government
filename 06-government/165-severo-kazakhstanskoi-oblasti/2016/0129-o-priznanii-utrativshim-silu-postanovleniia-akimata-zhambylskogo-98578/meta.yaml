title:
  rus: О признании утратившим силу постановления акимата Жамбылского района Северо-Казахстанской области от 9 июля 2014 года № 184 «Об определении специально отведенных мест для осуществления выездной торговли по Жамбылскому району Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Жамбыл ауданы бойынша көшпелі сауданы жүзеге асыру үшін арнайы орындарды анықтау жөнінде» Солтүстік Қазақстан облысы Жамбыл ауданы әкімдігінің 2014 жылдың 9 шілдедегі № 184 қауылысының күшін жою туралы

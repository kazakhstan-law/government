requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 02 февраля 2016 года № 27. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 09 февраля 2016 года № 3612. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 14 июля 2021 года № 268 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Тайыншинского района
  kaz: Тайынша ауданының аумағында Қазақстан Республикасы Парламенті Мәжілісінің, облыстық және аудандық мәслихаттарының депутаттығына үміткерлердің сайлаушылармен кездесулерді өткізу үшін үй-жайларды беру және үгіттік баспа материалдарын орналастыру үшін орындарды айқындау туралы

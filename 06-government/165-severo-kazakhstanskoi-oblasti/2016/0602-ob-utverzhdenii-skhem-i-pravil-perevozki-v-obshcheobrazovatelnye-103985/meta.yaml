    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2016 жылғы 2 маусымдағы № 159 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 2 июня 2016 года № 159 «Об утверждении схем и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен тәртібін бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2016 жылғы 2 маусымдағы № 159 қаулысына өзгерістер енгізу туралы

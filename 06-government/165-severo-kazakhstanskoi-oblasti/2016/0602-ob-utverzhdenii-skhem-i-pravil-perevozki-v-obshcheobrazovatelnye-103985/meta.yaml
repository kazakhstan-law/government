  title:
    rus: О внесении изменения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 2 июня 2016 года № 159 «Об утверждении схем и правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2016 жылғы 2 маусымдағы № 159 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

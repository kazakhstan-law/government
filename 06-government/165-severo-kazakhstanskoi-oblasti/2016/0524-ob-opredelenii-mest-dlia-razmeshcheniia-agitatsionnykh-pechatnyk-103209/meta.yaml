requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 24 мая 2016 года № 181. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 мая 2016 года № 3772. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 5 октября 2017 года № 327
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещения для проведения встреч с выборщиками кандидатов в акимы Антоновского и Лобановского сельских округов Айыртауского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Айыртау ауданының Антоновка және Лобаново ауылдық округтердің әкімдеріне кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар анықтау және таңдаушылармен кездесу үшін үй-жай ұсыну туралы

requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 22 августа 2016 года № 222. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 августа 2016 года № 3868. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 3 октября 2016 года № 253
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Мамлютскому району Северо-Казахстанской области на 2016 год
  kaz: 2016 жылы Солтүстік Қазақстан облысы Мамлют ауданы бойынша субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша субсидия алушылардың тізіміне қосуға өтініштерді ұсыну мерзімдерін айқындау туралы

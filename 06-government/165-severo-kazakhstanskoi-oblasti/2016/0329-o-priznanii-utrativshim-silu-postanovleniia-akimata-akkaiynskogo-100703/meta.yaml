act_code: '100703'
requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 29 марта 2016 года № 78
title:
  rus: О признании утратившим силу постановления акимата Аккайынского района Северо-Казахстанской области от 27 января 2016 года № 25 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений кандидатам в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов для проведения встреч с избирателями на территории  Аккайынского района»
  kaz: «Қазақстан Республикасы Парламент Мәжілісі, облыстық және аудандық мәслихаттар депутаттығына кандадаттар үшін Аққайың ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін үй-жайлар ұсыну туралы» Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің 2016 жылғы 27 қаңтардағы № 25 қаулысының күші жойылғандығын тану туралы

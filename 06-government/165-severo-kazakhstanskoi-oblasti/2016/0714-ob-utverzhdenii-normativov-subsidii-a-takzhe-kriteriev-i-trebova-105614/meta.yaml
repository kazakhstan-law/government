requisite: Постановление акимата Северо-Казахстанской области от 14 июля 2016 года № 265. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 августа 2016 года № 3861. Утратило силу постановлением акимата Северо-Казахстанской области от 22 сентября 2017 года № 380
title:
  rus: Об утверждении нормативов субсидий, а также критериев и требований по направлениям субсидирования на возмещение до 100% затрат по искусственному осеменению маточного поголовья крупного рогатого скота и овец в крестьянских (фермерских), личных подсобных хозяйствах и производственных кооперативах, удешевление затрат по заготовке и приобретению грубых, сочных, концентрированных кормов и кормовых добавок
  kaz: Шаруа (фермерлік), жеке қосалқы шаруашылықтарда және өндірістік кооперативтерде ірі қара мал мен қойлардың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды, ірі, шырынды, құрама жемшөп пен жемшөптік қоспаларды дайындау және сатып алу жөніндегі шығындарды 100%-ға дейін өтеуді, арзандатуды субсидиялау бағыттары бойынша субсидиялар нормативтерін, сондай-ақ өлшемдер мен талаптарды бекіту туралы

act_code: '104523'
requisite: Постановление акимата Северо-Казахстанской области от 7 июня 2016 года № 203. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 июля 2016 года № 3808. Утратило силу постановлением акимата Северо-Казахстанской области от 2 марта 2020 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттар қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

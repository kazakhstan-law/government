act_code: '105617'
requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 18 августа 2016 года № 231. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 августа 2016 года № 3873. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 28 ноября 2016 года № 303
title:
  rus: Об определении сроков предоставления заявки для включения в список сельскохозяйственных товаропроизводителей на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, затрат на возделывание сельскохозяйственных культур в защищенном грунте по Аккайынскому району Северо-Казахстанской области в 2016 году
  kaz: 2016 жылы Солтүстік Қазақстан облысы Аққайың ауданы бойынша өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдарының және көктемгi егіс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнына және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнына субсидия алу үшін ауылшаруашылық тауар өндірушілердің тізіміне енгізу үшін өтінім беру мерзімдерін анықтау туралы

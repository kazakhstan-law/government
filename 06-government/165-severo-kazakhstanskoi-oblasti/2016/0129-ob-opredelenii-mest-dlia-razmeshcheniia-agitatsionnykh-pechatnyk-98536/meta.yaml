act_code: '98536'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 29 января 2016 года № 7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 февраля 2016 года № 3599. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 20 марта 2018 года № 85
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан аумағында Қазақстан Республикасы Парламенті Мәжілісінің, облыстық және аудандық мәслихаттар депутаттығына кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесулерге арналған үй-жайларды ұсыну туралы

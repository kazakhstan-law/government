  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 4 мая 2016 года № 116 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по району имени Габита Мусрепова Северо-Казахстанской области на 2016 год»
    kaz: «2016 жылға арналған Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы бойынша мектепке дейiнгi тәрбие мен оқытуға мемлекеттiк бiлiм беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2016 жылғы 4 мамырдағы № 116 қаулысына өзгерістер енгізу туралы

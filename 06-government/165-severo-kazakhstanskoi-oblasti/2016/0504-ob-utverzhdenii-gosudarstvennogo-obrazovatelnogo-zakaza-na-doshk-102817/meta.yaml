title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по району имени Габита Мусрепова Северо-Казахстанской области на 2016 год
  kaz: 2016 жылға арналған Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы бойынша мектепке дейiнгi тәрбие мен оқытуға мемлекеттiк бiлiм беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 18 апреля 2016 года № 100. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 мая 2016 года № 3755. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 27 июля 2016 года № 211
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Аккайынского района
  kaz: Азаматтық қызметшілер болып табылатын және Аққайың ауданының ауылдық жерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдырының тізбесін айқындау туралы

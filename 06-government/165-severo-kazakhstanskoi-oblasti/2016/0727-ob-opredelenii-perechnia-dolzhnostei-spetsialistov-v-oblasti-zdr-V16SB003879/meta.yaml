requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 27 июля 2016 года № 211. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 августа 2016 года № 3879. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 19 марта 2019 года № 64 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Аккайынского района
  kaz: Азаматтық қызметшілер болып табылатын және Аққайың ауданының ауылдық жерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

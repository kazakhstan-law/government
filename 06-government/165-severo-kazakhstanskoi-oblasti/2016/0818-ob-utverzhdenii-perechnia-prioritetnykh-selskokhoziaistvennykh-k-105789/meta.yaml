requisite: Постановление акимата Северо-Казахстанской области от 18 августа 2016 года № 312. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 августа 2016 года № 3866. Утратило силу постановлением акимата Северо-Казахстанской области от 13 июля 2017 года № 274
title:
  rus: Об утверждении перечня приоритетных сельскохозяйственных культур и норм субсидий (на 1 гектар и (или) 1 тонну) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым ауыл шаруашылығы дақылдарының тізбесін және басым дақылдар өндіруді субсидиялау жолымен өсімдік шаруашылығы өнімінің өнімділігі мен сапасын арттыруға, жанар-жағармай материалдары мен көктемгі егіс және егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын (1 гектарға және (немесе) 1 тоннаға) бекіту туралы

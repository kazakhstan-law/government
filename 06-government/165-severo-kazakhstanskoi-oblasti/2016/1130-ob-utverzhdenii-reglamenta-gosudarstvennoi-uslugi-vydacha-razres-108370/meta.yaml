requisite: Постановление акимата Северо-Казахстанской области от 30 ноября 2016 года № 463. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 декабря 2016 года № 3977. Утратило силу постановлением акимата Северо-Казахстанской области от 30 июля 2020 года № 206 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача разрешения на размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения
  kaz: Облыстық және аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарына бөлінген белдеуде, жарнаманы тұрақты орналастыру объектілерінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

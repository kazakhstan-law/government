act_code: '100172'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 01 февраля 2016 года № 22
title:
  rus: О признании утратившим силу постановление акимата Акжарского района Северо-Казахстанской области от 19 мая 2015 года № 127 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности (зарегистрировано в Реестре государственной регистрации нормативных правовых актов за № 3266 от 04 июня 2015 года, опубликовано 22 июня 2015 года в газетах «Акжарские вести» № 28, «Нурлы Ел» № 28)
  kaz: «Ауданның коммуналдық  мүлкін мүліктік  жалдауға (жалға алуға) беру кезіндегі жалдау ақысы мөлшерлемесінің есебінің тәртібін анықтау туралы» Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2015 жылғы 2 ақпандағы № 34 қаулысының (Нормтивтік құқықтық актілерді мемлекеттік тіркеу тізілімінде 2015 жылғы 10 наурыздағы № 3143 тіркелген, 2015 жылғы 16 наурыздағы № 12 «Акжарские вести» және № 12 «Нурлы Ел» газеттерінде жарияланған) күшін жою туралы

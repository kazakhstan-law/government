requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 27 января 2016 года № 25. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 февраля 2016 года № 3604. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 29 марта 2016 года № 78
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений кандидатам в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов для проведения встреч с избирателями на территории Аккайынского района
  kaz: Қазақстан Республикасы Парламент Мәжілісі, облыстық және аудандық мәслихаттар депутаттығына кандидаттар үшін Аққайың ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін үй-жайлар ұсыну туралы

  code: '122005'
  requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 14 мая 2018 года № 118. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 мая 2018 года № 4733. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 19 марта 2019 года № 64 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Аккайынского района Северо-Казахстанской области от 27 июля 2016 года № 211 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Аккайынского района»
    kaz: «Азаматтық қызметшілер болып табылатын және Аққайың ауданының ауылдық жерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің 2016 жылғы 27 шілдедегі №211 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/122005/rus

  title:
    rus: О внесении изменения в постановление акимата Северо–Казахстанской области от 19 апреля 2016 года № 124 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы Солтүстік Қазақстан облысы әкімдігінің 2016 жылғы 19 сәуірдегі № 124 қаулысына өзгеріс енгізу туралы

act_code: '102560'
requisite: Постановление акимата Северо-Казахстанской области от 19 апреля 2016 года № 124. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 мая 2016 года № 3756. Утратило силу постановлением акимата Северо-Казахстанской области от 18 мая 2020 года № 119 (вводится в действие по истечение десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

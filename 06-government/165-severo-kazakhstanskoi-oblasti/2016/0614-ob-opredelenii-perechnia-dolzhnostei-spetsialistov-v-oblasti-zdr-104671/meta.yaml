act_code: '104671'
requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 14 июня 2016 года № 234. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 12 июля 2016 года № 3814. Утратило силу постановлением акимата Кызылжарского района Северо-Казахстанской области от 21 мая 2019 года № 143 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет,спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

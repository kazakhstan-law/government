act_code: '98953'
requisite: Постановление акимата района имени Магжана Жумабаева Северо-Казахстанской области от 25 января 2016 года № 13. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 05 февраля 2016 года № 3601. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 28 июня 2016 года № 169
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесулер өткізу үшін Қазақстан Республикасы Парламенті Мәжілісіне, облыстық және аудандық мәслихаттар депутаттығына кандидаттарға үй-жайлар ұсыну туралы

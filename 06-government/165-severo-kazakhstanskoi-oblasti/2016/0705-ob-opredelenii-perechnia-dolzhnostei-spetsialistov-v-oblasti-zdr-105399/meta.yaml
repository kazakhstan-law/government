act_code: '105399'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 5 июля 2016 года № 179. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 июля 2016 года № 3848. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 12 декабря 2019 года № 255 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования,культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Акжарского района
  kaz: Азаматтық қызметшілер болып табылатын және Ақжар ауданың ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандары лауазымдарының тізбесін анықтау туралы

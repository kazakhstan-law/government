title:
  rus: О признании утратившим силу постановления акимата района Шал акына Северо-Казахстанской области от 17 марта 2015 года № 53 «Об определении порядка расчета ставки арендной платы при передаче районного коммунального имущества в имущественный наем (аренду)»
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2015 жылғы 17 наурыздағы № 53 «Ауданның коммуналдық мүлкін мүліктік жалдауға (жалға алуға) беру кезіндегі жалдау ақысы мөлшерлемесінің есебінің тәртібін анықтау туралы» қаулысының күштерінің жойылғанын тану туралы

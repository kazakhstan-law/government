act_code: '105732'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 22 августа 2016 года № 200. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 августа 2016 года № 3877
title:
  rus: Об определении сроков предоставления заявок для включения в список сельскохозяйственных товаропроизводителей на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, затрат на возделывание сельскохозяйственных культур в защищенном грунте по Акжарскому району Северо-Казахстанской области в 2016 году
  kaz: 2016 жылы Солтүстік Қазақстан облысы Ақжар ауданы бойынша өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдарының және көктемгi егіс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнына және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнына субсидия алу үшін ауылшаруашылық тауар өндірушілердің тізіміне енгізу үшін өтінім беру мерзімдерін анықтау туралы

act_code: '100171'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 1 февраля 2016 года № 21
title:
  rus: О признании утратившим силу постановление акимата Акжарского района Северо-Казахстанской области от 2 февраля 2015 года №34 «Об определении порядка расчета ставки арендной платы за  имущественный наем (аренду) районного коммунального имущества» (зарегистрировано в Реестре государственной регистрации нормативных правовых актов за №3143 от 10 марта 2015 года, опубликовано 16 марта 2015 года в газетах «Акжарские вести» №12, «Нурлы Ел» №12)
  kaz: «Ауданның коммуналдық мүлкін мүліктік жалдауға (жалға алуға) беру кезіндегі жалдау ақысы мөлшерлемесінің есебінің тәртібін анықтау туралы» Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2015 жылғы 2 ақпандағы №34 қаулысының (Нормтивтік құқықтық актілерді мемлекеттік тіркеу тізілімінде 2015 жылғы 10 наурыздағы № 3143 тіркелген, 2015 жылғы 16 наурыздағы № 12 «Акжарские вести» және №12 «Нурлы Ел» газеттерінде жарияланған) күшін жою туралы

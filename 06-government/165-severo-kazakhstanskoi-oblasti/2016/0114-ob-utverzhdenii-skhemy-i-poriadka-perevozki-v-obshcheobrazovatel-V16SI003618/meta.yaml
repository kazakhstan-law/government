  title:
    rus: О внесении изменений в постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 14 января 2016 года № 03 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах района Магжана Жумабаева Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы әкімдігінің 2016 жылғы 14 қаңтардағы № 03 «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдау схемасы мен тәртібін бекіту туралы» қаулысына өзгерістер енгізу туралы

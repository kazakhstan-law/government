title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2016 год в дошкольных организациях района Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданының мектепке дейінгі білім беру ұйымдарында 2016 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата района Шал акына от 25 января 2016 года № 15 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2016 год в дошкольных организациях района Шал акына Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Шал ақын ауданының мектепке дейінгі ұйымдарында 2016 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» Шал ақын ауданы әкімдігінің 2016 жылғы 25 қаңтардағы № 15 қаулысына өзгерту енгізу туралы

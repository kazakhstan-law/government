requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 12 февраля 2016 года № 23. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 февраля 2016 года № 3628. Утратило силу постановлением акимата Уалихановского района Северо-Казахстанской области от 11 июля 2019 года № 153 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещений кандидатам в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов для проведения встреч с избирателями на территории Уалихановского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан  облысы Уәлиханов ауданының аумағында Қазақстан Республикасы Парламент Мәжілісінің, облыстық және аудандық мәслихаттарының депутаттығына кандидаттарының үгіттік баспа материалдарын орналастыру және сайлаушылармен кездесулер өткізу үшін үй-жайларды ұсыну туралы

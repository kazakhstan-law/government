requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 8 января 2016 года № 03. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 12 января 2016 года № 3540. Утратило силу постановлениема акимата Кызылжарского района Северо-Казахстанской области от 18 ноября 2016 года № 456
title:
  rus: О перерегистрации государственного учреждения «Кызылжарский районный отдел жилищно-коммунального хозяйства, пассажирского транспорта, автомобильных дорог, строительства, архитектуры и градостроительства»
  kaz: «Қызылжар аудандық тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі, автомобиль жолдары, құрылыс, сәулет және қала құрылысы бөлімі» мемлекеттік мекемесін қайта тіркеу туралы

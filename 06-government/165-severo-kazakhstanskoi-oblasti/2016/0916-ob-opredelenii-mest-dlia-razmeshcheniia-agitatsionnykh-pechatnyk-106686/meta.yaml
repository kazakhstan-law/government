requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 16 сентября 2016 года № 330. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 октября 2016 года № 3900. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 5 октября 2017 года № 327
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы Володарского сельского округа Айыртауского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Айыртау ауданының Володар ауылдық округі әкіміне кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар анықтау және таңдаушылармен кездесу үшін үй-жай ұсыну туралы

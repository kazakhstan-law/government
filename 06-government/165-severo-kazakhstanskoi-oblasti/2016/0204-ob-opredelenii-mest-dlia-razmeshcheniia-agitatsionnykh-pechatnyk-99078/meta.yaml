act_code: '99078'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 4 февраля 2016 года № 24. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 февраля 2016 года № 3624. Утратил силу постановлением акимата района Шал акына Северо-Казахстанской области от 20 июня 2024 года № 154 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории района Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданының аумағында Қазақстан Республикасы Парламенті Мәжілісінің, облыстық және аудандық мәслихаттарына депутаттыққа кандидаттардың сайлаушылармен кездесулер өткізу үшін үй- жайларды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындарды анықтау туралы

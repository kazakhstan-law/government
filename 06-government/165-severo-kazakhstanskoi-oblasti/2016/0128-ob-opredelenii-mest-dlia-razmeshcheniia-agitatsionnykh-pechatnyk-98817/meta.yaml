act_code: '98817'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 28 января 2016 года № 26. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 февраля 2016 года № 3602. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 8 мая 2019 года № 91 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений кандидатам в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов для проведения встреч с избирателями на территории Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының аумағында үгіттік басылым материалдарын орналастыру орындарын белгілеу және Қазақстан Республикасы Парламенті Мәжілісінің, облыстық және аудандық мәслихаттар  депутаттығына кандидаттарға сайлаушылармен кездесулер өткізу үшін үй-жайларды ұсыну туралы

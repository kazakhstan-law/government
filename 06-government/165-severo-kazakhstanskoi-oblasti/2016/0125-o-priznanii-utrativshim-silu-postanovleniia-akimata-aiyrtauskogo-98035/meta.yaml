act_code: '98035'
requisite: 'Постановление акимата Айыртауского района Северо-Казахстанской области от 25 января 2016 № 24 '
title:
  rus: О признании утратившим силу постановления акимата Айыртауского района Северо-Казахстанской области от 03 октября 2014 года № 479 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
  kaz: 'Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2014 жылғы 03 қазандағы № 479  «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысының күші жойылғанын тану туралы '

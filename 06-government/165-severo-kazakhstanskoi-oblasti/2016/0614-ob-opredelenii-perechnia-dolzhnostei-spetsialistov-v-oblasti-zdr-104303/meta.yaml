act_code: '104303'
requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 14 июня 2016 года № 145. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 июля 2016 года № 3805. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 24 декабря 2019 года № 316 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности района Магжана Жумабаева
  kaz: Азаматтық қызметшілер болып табылатын және Мағжан Жұмабаев ауданының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласында мамандары лауазымдарының тізбесін айқындау туралы

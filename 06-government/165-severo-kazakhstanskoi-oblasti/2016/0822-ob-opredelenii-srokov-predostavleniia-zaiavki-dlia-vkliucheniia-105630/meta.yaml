act_code: '105630'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 22 августа 2016 года № 238. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 августа 2016 года № 3869. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 7 октября 2016 года № 279
title:
  rus: Об определении сроков предоставления заявки для включения в список сельскохозяйственных товаропроизводителей на получение субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, затрат на возделывание сельскохозяйственных культур в защищенном грунте по Есильскому району Северо-Казахстанской области в 2016 году
  kaz: 2016 жылы Солтүстік Қазақстан облысы Есіл ауданы бойынша басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдарының және көктемгі егіспен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнына және ауыл шаруалығы ақылдарын қорғалған топырақта өндеп өсіру шығындарының құнына субсидиялар алуға арналған ауыл шаруашылығы тауарын өндірушілері тізіміне қосу үшін өтінімді ұсыну мерзімдерін айқындау туралы

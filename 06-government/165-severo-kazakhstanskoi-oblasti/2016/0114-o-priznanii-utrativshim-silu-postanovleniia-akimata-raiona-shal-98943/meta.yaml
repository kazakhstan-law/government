act_code: '98943'
requisite: 'Постановление акимата района Шал акына Северо-Казахстанской области от 14 января 2016 года № 5 '
title:
  rus: О признании утратившим силу постановления акимата района Шал акына Северо-Казахстанской области от 6 марта 2015 года N 50 «Об определении мест для агитационных печатных материалов и предоставлении помещений кандидатам в Президенты Республики Казахстан для проведения встреч с избирателями на территории района Шал акына Северо-Казахстанской области"
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2015 жылғы 6 наурыздағы № 50 «Солтүстік Қазақстан облысы Шал ақын ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындар анықтау және сайлаушылармен кездесу жүргізу үшін Қазақстан Республикасының Президенттігіне кандидаттарға үй-жайларды ұсыну туралы» қаулысының күштерінің жойылғанын тану туралы

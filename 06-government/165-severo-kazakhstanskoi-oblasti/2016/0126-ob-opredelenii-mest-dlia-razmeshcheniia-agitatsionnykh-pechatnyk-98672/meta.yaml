act_code: '98672'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 26 января 2016 года № 18. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 февраля 2016 года № 3598. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 24 декабря 2018 года № 287 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещений для проведения встреч с избирателями кандидатам в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Жамбылского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының аумағында Қазақстан Республикасы Парламентінің Мәжілісіне, облыстық және аудандық мәслихаттардың депутаттығына кандидаттардың сайлаушылармен кездесуін өткізу үшін үй-жайларды ұсыну және үгіт-насихаттық баспа материалдарын орналастыру үшін орындарды белгілеу туралы

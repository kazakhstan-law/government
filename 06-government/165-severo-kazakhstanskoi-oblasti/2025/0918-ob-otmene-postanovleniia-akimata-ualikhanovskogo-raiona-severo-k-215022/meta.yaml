act_code: '215022'
requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 18 сентября 2025 года № 160
title:
  rus: Об отмене постановления акимата Уалихановского района Северо – Казахстанской области от 18 ноября 2021 года № 219 «Об утверждении правил расчетов прогнозных объемов доходов и затрат бюджетов городов районного значения, сел, поселков, сельских округов»
  kaz: «Аудандық маңызы бар қалалар, ауылдар, кенттер, ауылдық округтер бюджеттерінің кірістері мен шығындарының болжамды көлемін есептеу қағидасын бекіту туралы» Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2021 жылғы 18 қарашадағы № 219 қаулысының күшін жою туралы

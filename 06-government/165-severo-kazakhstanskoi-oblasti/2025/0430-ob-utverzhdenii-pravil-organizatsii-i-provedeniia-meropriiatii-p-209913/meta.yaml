act_code: '209913'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 30 апреля 2025 года № 163. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 5 мая 2025 года № 7913-15
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Тайынша и селам Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының Тайынша қаласы мен ауылдарына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

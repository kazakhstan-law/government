  kaz: 2025 жылға арналған тыңайтқыштардың субсидияланатын түрлерінің тізбесін және сатушыдан сатып алынған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) 1 тоннасына (килограмына, литріне) арналған субсидиялар нормаларын бекіту туралы

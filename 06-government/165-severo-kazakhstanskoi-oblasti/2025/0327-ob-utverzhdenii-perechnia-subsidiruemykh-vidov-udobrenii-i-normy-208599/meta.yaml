requisite: Постановление акимата Северо-Казахстанской области от 27 марта 2025 года № 84. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 31 марта 2025 года № 7881-15. Утратило силу постановлением акимата Северо-Казахстанской области от 17 ноября 2025 года № 304 (вводится в действие после дня его первого официального опубликования)
title:

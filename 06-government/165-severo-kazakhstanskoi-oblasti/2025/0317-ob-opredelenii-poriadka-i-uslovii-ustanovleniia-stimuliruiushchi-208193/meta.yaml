act_code: '208193'
requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 17 марта 2025 года № 57
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников организаций, финансируемых из местного бюджета Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының жергілікті бюджетінен қаржыландырылатын ұйымдар қызметкерлерінің лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы.

  title:
    rus: О внесении изменения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 25 сентября 2025 года № 203 «Об установлении тарифа на регулярные социально значимые перевозки пассажиров на территории района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан аумағында жолаушыларды тұрақты әлеуметтік маңызы бар тасымалдауға тариф белгілеу туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2025 жылғы 25 қыркүйектегі № 203 қаулысына өзгеріс енгізу туралы

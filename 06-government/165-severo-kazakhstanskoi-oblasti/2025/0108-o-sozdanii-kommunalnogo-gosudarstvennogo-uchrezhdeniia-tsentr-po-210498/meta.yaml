    rus: О внесении изменений в постановление акимата Тайыншинского района Северо-Казахстанской области от 08 января 2025 года № 02 «О создании коммунального государственного учреждения «Центр поддержки семьи» коммунального государственного учреждения «Отдел занятости и социальных программ акимата Тайыншинского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тайынша ауданы әкімдігінің жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» коммуналдық мемлекеттік мекемесінің «Отбасын қолдау орталығы» коммуналдық мемлекеттік мекемесін құру туралы» Солтүстік Қазақстан облысы Тайынша ауданы әкімдігінің 2025 жылғы 08 қаңтардағы № 02 қаулысына өзгерістер енгізу туралы

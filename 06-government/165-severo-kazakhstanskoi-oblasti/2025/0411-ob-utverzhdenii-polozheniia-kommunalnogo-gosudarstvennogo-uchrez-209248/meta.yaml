    kaz: «Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» коммуналдық мемлекеттік мекемесінің ережесін бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2025 жылғы 11 сәуірдегі № 116 қаулысына өзгеріс және толықтырулар енгізу туралы

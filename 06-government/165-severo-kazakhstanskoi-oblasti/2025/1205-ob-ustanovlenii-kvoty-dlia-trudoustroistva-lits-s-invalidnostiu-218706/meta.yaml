title:
  rus: Об установлении квоты для трудоустройства лиц с инвалидностью в размере от двух до четырех процентов от численности рабочих мест без учета рабочих мест на тяжелых работах, работах с вредными, опасными условиями труда на 2026 год
  kaz: 2026 жылға арналған ауыр жұмыстардағы, еңбек жағдайлары зиянды, қауіпті жұмыстардағы жұмыс орындарын есептемегенде, мүгедектігі бар адамдарды жұмысқа орналастыру үшін жұмыс орындары санының екі-төрт пайызы мөлшерінде квота белгілеу туралы

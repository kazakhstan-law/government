  title:
    rus: О внесении изменений и дополнений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2025 года № 82 «Об утверждении Положения о коммунальном государственном учреждении «Отдел сельского хозяйства и ветеринарии акимата района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің ауыл шаруашылығы және ветеринария бөлімі» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2025 жылғы 31 наурызындағы № 82 қаулысына өзгерістер мен толықтырулар енгізу туралы

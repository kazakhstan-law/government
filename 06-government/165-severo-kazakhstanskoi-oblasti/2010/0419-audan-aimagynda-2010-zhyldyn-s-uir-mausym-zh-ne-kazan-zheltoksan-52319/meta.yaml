act_code: '52319'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 19 сәуірдегі № 103 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2010 жылғы 5 мамырда № 13-13-122 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы әкімі аппаратының 2012 жылғы 13 қыркүйектегі № 02.12.06-09/233 хаты)
title:

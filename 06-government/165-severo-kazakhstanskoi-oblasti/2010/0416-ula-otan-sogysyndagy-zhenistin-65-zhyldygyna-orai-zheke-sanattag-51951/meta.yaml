requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2010 жылғы 16 сәуірдегі № 102 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2010 жылғы 23 сәуірде № 13-13-120 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2013 жылғы 13 тамыздағы № 259 қаулысымен

  title:
    rus: О лишении статуса Памятника истории и культуры местного значения, исключении его из Государственного списка памятников истории и культуры местного значения Северо-Казахстанской области и внесении изменения в постановление акимата Северо-Казахстанской области от 20 декабря 2010 года № 358 «Об утверждении Государственного списка памятников истории и культуры местного значения Северо-Казахстанской области»
    kaz: Жергілікті маңызы бар тарих және мәдениет ескерткішін мәртебесінен айыру және оны Солтүстік Қазақстан облысының жергілікті маңызы бар тарих және мәдениет ескерткіштерінің мемлекеттік тізімінен шығарып тастау туралы және Солтүстік Қазақстан облысы әкімдігінің 2010 жылғы 20 желтоқсандағы № 358 «Солтүстік Қазақстан облысының жергілікті маңызы бар тарих және мәдени ескерткіштерінің Мемлекеттік тізімін бекіту туралы» қаулысына өзгеріс енгізу туралы

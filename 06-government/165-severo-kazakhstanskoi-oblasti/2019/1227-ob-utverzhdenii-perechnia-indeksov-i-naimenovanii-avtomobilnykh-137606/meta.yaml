  title:
    rus: О внесении изменений в постановление акимата Тайыншинского района от 27 декабря 2019 года № 467 «Об утверждении перечня, индексов и наименований автомобильных дорог общего пользования районного значения по Тайыншинскому району Северо-Казахстанской области»
    kaz: Тайынша ауданы әкімдігінің 2019 жылғы 27 желтоқсандағы № 467 «Солтүстік Қазақстан облысы Тайынша ауданы бойынша аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының тізбесін, индекстері мен атауларын бекіту туралы» қаулысына өзгерістер енгізу туралы

title:
  rus: Об утверждении перечня, индексов и наименований автомобильных дорог общего пользования районного значения по Тайыншинскому району Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданы бойынша аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының тізбесін, индекстері мен атауларын бекіту туралы

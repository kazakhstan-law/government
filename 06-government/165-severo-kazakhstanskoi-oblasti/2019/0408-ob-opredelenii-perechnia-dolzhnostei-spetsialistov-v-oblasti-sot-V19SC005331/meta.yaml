  title:
    rus: О внесении изменения в постановление акимата Айыртауского района Северо-Казахстанской области № 89 от 8 апреля 2019 года «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Айыртауского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2019 жылғы 8 сәуірдегі № 89 «Солтүстік Қазақстан облысы Айыртау ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

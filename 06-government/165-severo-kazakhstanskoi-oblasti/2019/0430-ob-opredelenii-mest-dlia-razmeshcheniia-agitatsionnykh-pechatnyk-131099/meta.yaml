requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 30 апреля 2019 года № 112. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 мая 2019 года № 5389. Утратило силу постановлением акимата Уалихановского района Северо-Казахстанской области от 11 июля 2019 года № 153 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями для всех кандидатов в Президенты Республики Казахстан на территории Уалихановского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Уәлиханов ауданының аумағында Қазақстан Республикасы Президенттігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі өткізу үшін үй-жайлар ұсыну туралы

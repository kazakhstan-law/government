requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 30 апреля 2019 года № 87. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 мая 2019 года № 5383. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 12 апреля 2021 года № 77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещений для встреч с избирателями для всех кандидатов в Президенты Республики Казахстан на территории Тимирязевского района Северо - Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының аумағында Қазақстан Республикасы Президенттігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесу үшін үй - жайларды ұсыну туралы

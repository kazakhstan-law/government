caused_by:
  code: '191179'
  requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 25 декабря 2023 года № 442. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 26 декабря 2023 года № 7663-15
  title:
    rus: О внесении изменения в постановление акимата Тайыншинского района Северо-Казахстанской области от 3 апреля 2019 года № 117 «Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы әкімдігінің 2019 жылғы 3 сәуірдегі № 117 «Солтүстік Қазақстан облысы Тайынша ауданының азаматтық қызметшілері болып табылатын және ауылдық елді мекендерінде жұмыс істейтін, әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/191179/rus

caused_by:
  code: '162711'
  requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 23 декабря 2021 года № 498. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 декабря 2021 года № 26248
  title:
    rus: О внесении изменений в постановление акимата Тайыншинского района Северо-Казахстанской области от 3 апреля 2019 года № 117 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности Тайыншинского района»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы әкімдігінің 2019 жылғы 3 сәуірдегі № 117 «Тайынша ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/162711/rus

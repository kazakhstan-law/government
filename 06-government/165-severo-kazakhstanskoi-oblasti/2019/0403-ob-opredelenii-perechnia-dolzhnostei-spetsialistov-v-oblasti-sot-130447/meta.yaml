act_code: '130447'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 3 апреля 2019 года № 117. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 апреля 2019 года № 5330
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының азаматтық қызметшілері болып табылатын және ауылдық елді мекендерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

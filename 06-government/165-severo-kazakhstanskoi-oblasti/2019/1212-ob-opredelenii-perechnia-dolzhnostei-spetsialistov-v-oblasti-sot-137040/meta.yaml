  title:
    rus: О внесении изменения в постановление акимата Акжарского района Северо-Казахстанской области от 12 декабря 2019 года № 255 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Акжарского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ақжар ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2019 жылғы 12 желтоқсандағы № 255 қаулысына өзгеріс енгізу туралы

caused_by:
  code: '160393'
  requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 16 ноября 2021 года № 221. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 ноября 2021 года № 25251
  title:
    rus: О внесении изменений в постановление акимата Акжарского района Северо-Казахстанской области от 12 декабря 2019 года № 255 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности Акжарского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2019 жылғы 12 желтоқсандағы № 255 «Солтүстік Қазақстан облысы Ақжар ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160393/rus

    kaz: «2019 жылға арналған Солтүстік Қазақстан облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2019 жылғы 25 сәуірдегі № 111 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата района Шал акына Северо-Казахстанской области от 4 февраля 2019 № 13 «Об утверждении коэффициента зонирования, учитывающий месторасположение объекта налогообложения в населенных пунктах района Шал акына Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2019 жылғы 4 ақпандағы № 13 «Салық салу объектісінің Солтүстік Қазақстан облысы Шал ақын ауданының елді мекендерінде орналасуын ескеретін аймаққа бөлу коэффициенттерін бекіту туралы» қаулысына өзгеріс енгізу туралы

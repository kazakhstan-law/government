act_code: '131104'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 29 апреля 2019 года № 106. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 мая 2019 года № 5393. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 21 февраля 2018 года № 13
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения  встреч с избирателями для всех кандидатов в Президенты Республики Казахстан на территории Акжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданының аумағында Қазақстан Республикасы Президенттігіне барлық кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі үшін үй-жайлар ұсыну туралы

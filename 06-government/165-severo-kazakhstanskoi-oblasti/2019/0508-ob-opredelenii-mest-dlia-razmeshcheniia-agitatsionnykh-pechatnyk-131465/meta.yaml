requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 8 мая 2019 года № 121. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 мая 2019 года № 5403. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 2 декабря 2020 года № 309 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч кандидатов в Президенты Республики Казахстан с избирателями на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының аумағында Қазақстан Республикасы Президенттігіне кандидаттарына үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесу үшін үй - жайлар беру туралы

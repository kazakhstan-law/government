requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 4 мая 2019 года № 110. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 мая 2019 года № 5395. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 6 мая 2021 года № 117 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями для всех кандидатов на территории района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының аумағында барлық кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі үшін үй-жайлар ұсыну туралы

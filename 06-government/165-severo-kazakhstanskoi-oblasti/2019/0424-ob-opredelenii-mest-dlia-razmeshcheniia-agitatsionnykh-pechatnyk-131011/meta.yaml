title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

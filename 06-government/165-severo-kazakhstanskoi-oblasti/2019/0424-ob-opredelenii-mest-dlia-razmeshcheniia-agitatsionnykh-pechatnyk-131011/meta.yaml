  title:
    rus: О внесении изменений в постановление акимата Есильского района Северо-Казахстанской области от 24 апреля 2019 года № 93 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и предоставления кандидатам помещения для проведения встреч с избирателями на территории Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және кандидаттарға сайлаушылармен кездесу өткізу үшін үй-жай беру туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2019 жылғы 24 сәуірдегі № 93 қаулысына өзгерістер енгізу туралы

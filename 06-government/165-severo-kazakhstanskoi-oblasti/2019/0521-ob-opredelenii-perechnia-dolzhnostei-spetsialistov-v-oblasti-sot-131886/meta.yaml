  code: '160174'
  requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 9 ноября 2021 года № 445. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 ноября 2021 года № 25144
  title:
    rus: О внесении изменений в постановление акимата Кызылжарского района Северо-Казахстанской области от 21 мая 2019 года № 143 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности Кызылжарского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Қызылжар ауданы әкімдігінің 2019 жылғы 21 мамырдағы № 143 «Солтүстік Қазақстан облысы Қызылжар ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160174/rus

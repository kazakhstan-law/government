  title:
    rus: О внесении изменения в постановление акимата Кызылжарского района Северо-Казахстанской области от 21 мая 2019 года № 143 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Кызылжарского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Қызылжар ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Қызылжар ауданы әкімдігінің 2019 жылғы 21 мамырдағы № 143 қаулысына өзгеріс енгізу туралы

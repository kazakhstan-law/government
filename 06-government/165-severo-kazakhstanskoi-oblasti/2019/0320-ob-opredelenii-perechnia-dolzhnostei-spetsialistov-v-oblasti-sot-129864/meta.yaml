caused_by:
  code: '160553'
  requisite: Постановление акимата Есильского района Северо-Казахстанской области от 18 ноября 2021 года № 344. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 ноября 2021 года № 25337. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 4 мая 2026 года № 119 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Есильского района Северо-Казахстанской области от 20 марта 2019 года № 65 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности Есильского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2019 жылғы 20 наурыздағы № 65 «Солтүстік Қазақстан облысы Есіл ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160553/rus

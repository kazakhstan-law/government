act_code: '129864'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 марта 2019 года № 65. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 марта 2019 года № 5267. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 4 мая 2026 года № 119 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

  code: '180366'
  requisite: Постановление акимата Есильского района Северо-Казахстанской области от 24 апреля 2023 года № 88. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 апреля 2023 года № 7483-15. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 4 мая 2026 года № 119 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Есильского района Северо-Казахстанской области от 20 марта 2019 года № 65 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2019 жылғы 20 наурыздағы № 65 қаулысына өзгеріс енгізу туралы

act_code: '130451'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 8 апреля 2019 года № 89. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 апреля 2019 года № 5331
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Айыртауского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Айыртау ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

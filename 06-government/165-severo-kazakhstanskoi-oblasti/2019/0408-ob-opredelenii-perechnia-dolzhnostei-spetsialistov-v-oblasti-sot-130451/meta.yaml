caused_by:
  code: '159992'
  requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 1 ноября 2021 года № 390. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 ноября 2021 года № 25036
  title:
    rus: О внесении изменений в постановление акимата Айыртауского района Северо-Казахстанской области  № 89 от 8 апреля 2019 года «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2019 жылғы 8 сәуірдегі № 89 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/159992/rus

caused_by:
  code: '163133'
  requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 10 декабря 2021 года № 242. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 января 2022 года № 26423
  title:
    rus: О внесении изменений в постановление акимата Уалихановского района Северо-Казахстанской области от 7 марта 2019 года № 42 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности Уалихановского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің «Солтүстік Қазақстан облысы Уәлиханов ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» 2019 жылғы 7 наурыздағы № 42 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/163133/rus

  title:
    rus: О внесении изменения в постановление акимата Уалихановского района Северо-Казахстанской области от 7 марта 2019 года № 42 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Уалихановского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2019 жылғы 7 наурыздағы № 42 «Солтүстік Қазақстан облысы Уәлиханов ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

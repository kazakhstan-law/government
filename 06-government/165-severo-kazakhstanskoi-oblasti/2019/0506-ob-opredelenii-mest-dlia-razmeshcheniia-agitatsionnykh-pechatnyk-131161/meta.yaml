act_code: '131161'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 6 мая 2019 года № 165. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 мая 2019 года № 5400. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 14 июля 2021 года № 268 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещений для проведения встреч с избирателями для всех кандидатов в Президенты Республики Казахстан на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының аумағында Қазақстан Республикасы Президенттігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесу өткізу үшін үй-жайларды ұсыну туралы

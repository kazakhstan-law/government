  title:
    rus: О внесении изменений в постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 24 декабря 2019 года № 316 «Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности района Магжана Жумабаева Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы әкімдігінің 2019 жылғы 24 желтоқсандағы № 316 қаулысына өзгерістер енгізу туралы

caused_by:
  code: '161826'
  requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 14 декабря 2021 года № 325. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 декабря 2021 года № 25870
  title:
    rus: О внесении изменений в постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 24 декабря 2019 года № 316 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности района Магжана Жумабаева Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы әкімдігінің 2019 жылғы 24 желтоқсандағы № 316 «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161826/rus

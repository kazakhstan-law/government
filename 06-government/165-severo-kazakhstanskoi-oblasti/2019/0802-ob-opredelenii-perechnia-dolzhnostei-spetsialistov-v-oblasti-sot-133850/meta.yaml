  requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 21 декабря 2023 года № 270. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 22 декабря 2023 года № 7660-15
  title:
    rus: О внесении изменения в постановление акимата района Шал акына Северо-Казахстанской области от 02 августа 2019 года № 145 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности района Шал акына Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Шал ақын ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2019 жылғы 02 тамыздағы № 145 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/190656/rus

caused_by:
  code: '165638'
  requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 16 марта 2022 года № 35. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 марта 2022 года № 27236
  title:
    rus: О внесении изменений в постановление акимата района Шал акына Северо-Казахстанской области от 2 августа 2019 года № 145 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности района Шал акына Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2019 жылғы 2 тамыздағы № 145 «Солтүстік Қазақстан облысы Шал ақын ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/165638/rus

act_code: '133850'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 2 августа 2019 года № 145. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 августа 2019 года № 5527
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности района Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

caused_by:
  code: '131814'
  requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 21 мая 2019 года № 130. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 мая 2019 года № 5411
  title:
    rus: О внесении изменений в постановление акимата Аккайынского района Северо-Казахстанской области  от 19 марта 2019 года № 64 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных територий, являющихся гражданскими служащими и работающих в сельской местности Аккайынского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің 2019 жылғы 19 наурыздағы № 64 «Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Аққайың ауданының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/131814/rus

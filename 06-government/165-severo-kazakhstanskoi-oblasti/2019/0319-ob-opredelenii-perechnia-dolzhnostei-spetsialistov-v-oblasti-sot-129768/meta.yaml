title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности Аккайынского района Северо-Казахстанской области
  kaz: Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Аққайың ауданының ауылдық жерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

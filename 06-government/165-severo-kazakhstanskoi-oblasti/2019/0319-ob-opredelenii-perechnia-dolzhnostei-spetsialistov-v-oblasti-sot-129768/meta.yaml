  title:
    rus: О внесении изменения в постановление акимата Аккайынского района Северо-Казахстанской области от 19 марта 2019 года № 64 «Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности Аккайынского района Северо-Казахстанской области»
    kaz: «Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Аққайың ауданының ауылдық жерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің 2019 жылғы 19 наурыздағы № 64 қаулысына өзгеріс енгізу туралы

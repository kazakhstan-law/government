  title:
    rus: О внесении изменений в постановление акимата Мамлютского района Северо-Казахстанской области от 8 мая 2019 года № 91 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч всем кандидатам с избирателями (выборщиками)»
    kaz: «Барлық кандидаттар үшiн үгіттiк баспа материалдарын орналастыру үшiн орындар белгiлеу және сайлаушылармен (таңдаушылармен) кездесуі үшін үй-жайлар беру туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2019 жылғы 8 мамырдағы № 91 қаулысына өзгерістер енгізу туралы

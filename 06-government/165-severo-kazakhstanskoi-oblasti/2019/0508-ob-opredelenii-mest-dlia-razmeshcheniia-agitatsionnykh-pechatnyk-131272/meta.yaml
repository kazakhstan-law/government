act_code: '131272'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 8 мая 2019 года № 91. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 мая 2019 года № 5399. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 5 декабря 2025 года № 348 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының аумағындағы барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орын белгілеу туралы

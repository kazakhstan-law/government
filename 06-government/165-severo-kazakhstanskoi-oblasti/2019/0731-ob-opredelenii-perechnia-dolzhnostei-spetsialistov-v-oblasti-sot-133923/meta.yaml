  code: '173158'
  requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 5 октября 2022 года № 193. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 октября 2022 года № 30291. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 5 декабря 2025 года № 348 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Мамлютского района Северо-Казахстанской области от 31 июля 2019 года № 145 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Мамлютского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2019 жылғы 31 шілдедегі № 145 қаулысына өзгеріс енгізу туралы

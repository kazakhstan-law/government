act_code: '133923'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 31 июля 2019 года № 145. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 августа 2019 года № 5520. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 5 декабря 2025 года № 348 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

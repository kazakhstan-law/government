requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 6 мая 2019 года № 127. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 мая 2019 года № 5398. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 17 июня 2020 года № 147 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями для всех кандидатов в Президенты Республики Казахстан на территории Айыртауского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Айыртау ауданының аумағында Қазақстан Республикасы Президенттігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі өткізу үшін үй-жайлар ұсыну туралы

requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 26 декабря 2019 года № 320. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 декабря 2019 года № 5754. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 июля 2026 года № 187 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан аумағындағы азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

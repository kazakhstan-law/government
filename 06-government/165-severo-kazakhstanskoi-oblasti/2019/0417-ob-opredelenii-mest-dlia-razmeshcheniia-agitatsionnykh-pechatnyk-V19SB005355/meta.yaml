title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями всех кандидатов на территории Аккайынского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Аққайың ауданының аумағында барлық кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі үшін үй-жайлар ұсыну туралы

  title:
    rus: О внесении изменений в постановление акимата Аккайынского района Северо-Казахстанской области от 17 апреля 2019 года № 94 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями всех кандидатов на территории Аккайынского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Аққайың ауданының аумағында барлық кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі үшін үй-жайлар ұсыну туралы» Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің 2019 жылғы 17 сәуірдегі № 94 қаулысына өзгерістер енгізу туралы

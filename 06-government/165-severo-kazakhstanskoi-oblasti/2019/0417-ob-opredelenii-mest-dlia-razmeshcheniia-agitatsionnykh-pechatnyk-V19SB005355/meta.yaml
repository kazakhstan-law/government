requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 17 апреля 2019 года № 94. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 апреля 2019 года № 5355. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 1 сентября 2026 года № 253 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

  code: '182573'
  requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 5 июня 2023 года № 108. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 июня 2023 года № 7526-15. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 июля 2026 года № 187 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 26 декабря 2019 года № 320 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындығы аудан әкімдігінің 2019 жылғы 26 желтоқсандағы № 320 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан аумағындағы азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/182573/rus

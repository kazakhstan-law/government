caused_by:
  code: '155499'
  requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 29 апреля 2021 года № 119. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 апреля 2021 года № 7388. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 июля 2026 года № 187 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области  от 26 декабря 2019 года № 320 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындығы аудан әкімдігінің 2019 жылғы 26 желтоқсандағы № 320 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан аумағындағы азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/155499/rus

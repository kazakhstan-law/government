  title:
    rus: О внесении изменения в постановление акимата Тимирязевского района от 26 августа 2019 года № 165 «Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности Тимирязевского района Северо-Казахстанской области»
    kaz: «Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Тимирязев ауданының ауылдық жерінде жұмыс iстейтiн әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Тимирязев ауданы әкімдігінің 2019 жылғы 26 тамыздағы № 165 қаулысына өзгеріс енгізу туралы

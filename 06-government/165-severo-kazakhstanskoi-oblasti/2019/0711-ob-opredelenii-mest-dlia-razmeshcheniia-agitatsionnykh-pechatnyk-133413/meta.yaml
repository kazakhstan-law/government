  title:
    rus: О внесении изменений в постановление акимата Уалихановского района Северо-Казахстанской области от 11 июля 2019 года № 153 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями всех кандидатов на территории Уалихановского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2019 жылғы 11 шілдедегі № 153 «Солтүстік Қазақстан облысы Уәлиханов ауданының аумағында барлық кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі үшін үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

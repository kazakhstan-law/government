caused_by:
  code: '160408'
  requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 28 октября 2021 года № 273. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 ноября 2021 года № 25281
  title:
    rus: О внесении изменений в постановление акимата Тимирязевского района от 26 августа 2019 года № 165 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности Тимирязевского района Северо-Казахстанской области
    kaz: «Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Тимирязев ауданының ауылдық жерінде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» Тимирязев ауданы әкімдігінің 2019 жылғы 26 тамыздағы № 165 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160408/rus

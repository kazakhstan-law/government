  title:
    rus: О внесении изменений в постановление акимата Тайыншинского района Северо-Казахстанской области от 14 февраля 2019 года № 50 «Об утверждении коэффициента зонирования учитывающего месторасположение объекта налогообложения в населенных пунктах Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы әкімдігінің 2019 жылғы 14 ақпандағы № 50 «Солтүстік Қазақстан облысы Тайынша ауданының елді мекендерінде салық салу объектісінің орналасқан жерін ескеретін аймаққа бөлу коэффициентін бекіту туралы» қаулысына өзгерістер енгізу туралы

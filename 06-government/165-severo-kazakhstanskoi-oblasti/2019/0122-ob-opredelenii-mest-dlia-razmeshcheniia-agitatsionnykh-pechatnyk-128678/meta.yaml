act_code: '128678'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 22 января 2019 года № 7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 января 2019 года № 5204. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 19 июля 2021 года № 182 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещений для встреч с избирателями для всех кандидатов в Президенты Республики Казахстан на территории Жамбылского района Северо - Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының аумағында Қазақстан Республикасы Президенттігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін үй - жайларды ұсыну туралы

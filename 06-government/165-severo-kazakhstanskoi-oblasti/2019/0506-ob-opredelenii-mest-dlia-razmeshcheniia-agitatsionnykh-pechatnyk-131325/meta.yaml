  title:
    rus: О внесении изменения в постановление акимата Кызылжарского района Северо-Казахстанской области от 6 мая 2019 года № 127 «Об определении мест для размещения агитационных печатных материалов  для всех кандидатов на территории Кызылжарского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Қызылжар ауданының аумағында барлық кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар белгілеу үшін үй-жайлар беру туралы» Солтүстік Қазақстан облысы Қызылжар ауданы әкімдігінің 2019 жылғы 6 мамырдағы № 127 қаулысына өзгеріс енгізу туралы

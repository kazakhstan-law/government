title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Жамбылского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

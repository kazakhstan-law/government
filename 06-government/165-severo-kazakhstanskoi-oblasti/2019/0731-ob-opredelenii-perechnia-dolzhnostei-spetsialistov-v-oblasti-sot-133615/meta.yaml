  title:
    rus: О внесении изменения в постановление акимата Жамбылского района Северо-Казахстанской области от 31 июля 2019 года № 194 «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Жамбылского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Жамбыл ауданы әкімдігінің 2019 жылғы 31 шілдедегі № 194 қаулысына өзгеріс енгізу туралы

  code: '165551'
  requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 11 марта 2022 года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 марта 2022 года № 27202
  title:
    rus: О внесении изменений в постановление акимата Жамбылского района Северо-Казахстанской области от 31 июля 2019 года № 194 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности Жамбылского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Жамбыл ауданы әкімдігінің 2019 жылғы 31 шілдедегі № 194 «Солтүстік Қазақстан облысы Жамбыл ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/165551/rus

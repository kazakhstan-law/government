act_code: '131324'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 6 мая 2019 года № 85. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 мая 2019 года № 5401. Утратило силу постановлением акимата района Шал акына Северо-Казахстанской области от 21 июля 2021 года № 152 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещений для встреч с избирателями для всех кандидатов в Президенты Республики Казахстан на территории района Шал акына Северо - Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданының аумағында Қазақстан Республикасы Президенттігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесу үшін үй - жайларды ұсыну туралы

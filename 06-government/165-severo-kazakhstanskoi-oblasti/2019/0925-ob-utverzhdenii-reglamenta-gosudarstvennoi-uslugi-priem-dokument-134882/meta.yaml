requisite: Постановление акимата Северо-Казахстанской области от 25 сентября 2019 года № 241. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 сентября 2019 года № 5584. Утратило силу постановлением акимата Северо-Казахстанской области от 26 февраля 2020 года № 37 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов в республиканские специализированные школы-интернаты-колледжи олимпийского резерва и областные школы-интернаты для одаренных в спорте детей»
  kaz: «Олимпиадалық резервтің республикалық мамандандырылған мектеп-интернаттары-колледждеріне және спорттағы дарынды балаларға арналған облыстық мектеп-интернаттарына құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

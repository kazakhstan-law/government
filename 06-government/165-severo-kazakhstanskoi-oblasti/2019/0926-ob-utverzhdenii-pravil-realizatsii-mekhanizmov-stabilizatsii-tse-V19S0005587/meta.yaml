  title:
    rus: О внесении изменений и дополнений в постановление акимата Северо-Казахстанской области от 26 сентября 2019 года № 246 «Об утверждении Правил реализации механизмов стабилизации цен на социально значимые продовольственные товары в Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысында әлеуметтік маңызы бар азық-түлік тауарларына бағаларды тұрақтандыру тетіктерін іске асырудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2019 жылғы 26 қыркүйектегі № 246 қаулысына өзгерістер мен толықтырулар енгізу туралы

title:
  rus: О выполнении Закона Республики Казахстан «О воинской обязанности и воинской службе» по проведению очередного призыва граждан 1988 года рождения и старших возрастов, потерявших право на отсрочку от призыва, на срочную воинскую службу и отправке их в Вооруженные силы Республики Казахстан
  kaz: Қазақстан Республикасының «Әскери міндеттілік және әскери қызмет туралы» Заңының орындалуына 1988 жылы туған және кейінге қалдыруға құқығы жоқ ересек азаматтарды мерзімді әскери қызметке кезекті шақыру және Қазақстан Республикасының Қарулы Күштері қатарына оларды аттандыру туралы

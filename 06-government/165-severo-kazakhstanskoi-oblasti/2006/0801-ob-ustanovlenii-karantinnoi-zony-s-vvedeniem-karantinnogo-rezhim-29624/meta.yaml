requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 1 августа 2006 года № 181. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 8 сентября 2006 года № 13-14-35. Утратило силу постановлением акимата района Шал акына Северо-Казахстанской области от 6 ноября 2024 года № 270 (вводится в действие по истечении десяти календарных дней после дня его первого официально опубликования)
title:

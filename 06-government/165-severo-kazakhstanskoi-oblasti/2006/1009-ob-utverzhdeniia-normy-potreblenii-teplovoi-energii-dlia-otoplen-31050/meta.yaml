title:
  rus: Об утверждения нормы потреблении тепловой энергии для отопления жилых зданий города Булаево отапливаемых дочерним предприятием «Петропавловское отделение» Федерального государственного унитарного предприятия «Южно-Уральская железная дорога» Министерства путей сообщения Российской Федерации
  kaz: Ресей Федерациясының Жол қатынастары Министрлігінің Оңтүстік Орал темір жолы федералды мемлекеттік бірінғай кәсіпорынының «Петропавлдық бөлімшссі» еншілес кәсіпорыны жылытатын Булаев қаласының тұрғын үйлерін жылыту үшін жылу энергиясын пайдалану нормасын бекіту туралы

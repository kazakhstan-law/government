title:
  rus: Об утверждении Правил предоставления социальной помощи на зубопротезирование участникам и инвалидам Великой Отечественной войны, а также лицам, приравненным по льготам и гарантиям к участникам и инвалидам Великой Отечественной войны
  kaz: Ұлы Отан соғысының сондай-ақ, жеңілдіктер мен кепілдіктер жағынан Ұлы Отан соғысының қатысушылары мен мүгедектеріне теңестірілген адамдарға қатысушылары мен мүгедектеріне тістерін протездеуге әлеуметтік көмек ұсыну ережесін бекіту туралы

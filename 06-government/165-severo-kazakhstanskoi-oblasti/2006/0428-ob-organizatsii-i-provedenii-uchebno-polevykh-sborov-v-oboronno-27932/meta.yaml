requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 28 апреля 2006 года № 114. Зарегистрировано Управлением юстиции Тимирязевского района Северо-Казахстанской области 15 мая 2006 года № 13-12-22. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 25 сентября 2024 года № 194 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об организации и проведении учебно-полевых сборов в оборонно-спортивном оздоровительном лагере Тимирязевского района с учащимися 10-х классов учебных заведений Тимирязевского района
  kaz: Тимирязев ауданының қорғаныс спорттық сауықтыру лагерінде Тимирязев ауданының оқу орындарындағы 10-шы сыныптарының оқушыларын далада оқытуға жинауды ұйымдастыру және өткізу туралы

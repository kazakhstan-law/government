act_code: '85544'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 17 ноября 2014 года № 394. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 декабря 2014 года № 3039. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 4 июня 2015 года № 158
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размер подушевого финансирования и родительской платы в учреждениях образования Мамлютского района Северо-Казахстанской области"
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының білім беру мекемелеріндегі мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

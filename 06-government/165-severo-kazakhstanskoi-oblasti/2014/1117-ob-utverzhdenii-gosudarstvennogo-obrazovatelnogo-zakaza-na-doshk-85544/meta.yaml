  title:
    rus: О внесении изменений в постановление акимата Мамлютского района Северо-Казахстанской области от 17 ноября 2014 года № 394 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размер подушевого инансирования и родительской платы в учреждениях образования Мамлютского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданының білім беру мекемелеріндегі мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2014 жылғы 17 қарашадағы №394 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/87737/rus

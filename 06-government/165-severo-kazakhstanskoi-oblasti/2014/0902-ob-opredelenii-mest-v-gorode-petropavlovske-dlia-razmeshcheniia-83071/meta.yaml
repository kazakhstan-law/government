requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 2 сентября 2014 года № 1594. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 сентября 2014 года № 2933. Утратило силу в связи с истечением срока действия (письмо аппарата акима города Петропавловска Северо-Казахстанской области от 11 декабря 2014 года № 16-1.-3-19/2830)
title:
  rus: Об определении мест в городе Петропавловске для размещения агитационных печатных материалов и предоставлении помещения для встреч с избирателями кандидатов в депутаты Сената Парламента Республики Казахстан
  kaz: Петропавл қаласында Қазақстан Республикасы Парламенті Сенатының депутаттығына кандидаттардың сайлаушылармен кездесуіне үй-жай беруге және үгіттік баспа материалдарын орналастыруға арналған орындар белгілеу туралы

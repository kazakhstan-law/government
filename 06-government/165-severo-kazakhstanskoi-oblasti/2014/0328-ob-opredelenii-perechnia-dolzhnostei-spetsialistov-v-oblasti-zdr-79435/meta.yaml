act_code: '79435'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 28 марта 2014 года № 52. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 апреля 2014 года № 2697. Утратило силу постановлением акимата района Шал акына Северо-Казахстанской области от 29 января 2016 года № 21
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін және азаматтық қызметшілер болып табылатын денсаулық сақтау саласында, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласында мамандары лауазымдарының тізбесін анықтау туралы

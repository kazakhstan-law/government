requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 3 октября 2014 года № 379. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 ноября 2014 года № 2982. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 25 января 2016 года № 24
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

act_code: '80367'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 29 апреля 2014 года № 81. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 мая 2014 года № 2806. Утратило силу постановлением акимата района Шал акына Северо-Казахстанской области от 2 июля 2014 года № 175
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по району Шал акына Северо-Казахстанской области в 2014 году
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданы бойынша 2014 жылы субсидия алатындардың тізіміне енгізуге өтінім ұсынудың мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша егіс жүргізудің оңтайлы мерзімдерін белгілеу туралы

requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 28 февраля 2014 года № 44. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 марта 2014 года № 2619. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 24 февраля 2016 года № 55
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласында мамандары лауазымдарының тізбесін анықтау туралы

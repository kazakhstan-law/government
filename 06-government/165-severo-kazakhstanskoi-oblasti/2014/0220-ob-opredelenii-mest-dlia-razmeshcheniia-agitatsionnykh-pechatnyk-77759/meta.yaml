act_code: '77759'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 февраля 2014 года № 36. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 февраля 2014 года № 2577. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 19 мая 2014 года № 161
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в депутаты маслихата на территории Ильинского сельского округа Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданы Ильинка селолық округінің аумағында мәслихат депутаттарына кандидаттарының сайлаушыларымен кездесулер өткізу үшін үгіттік баспа материалдарды орналасу үшін орындарды анықтау және үй-жайларды беру туралы

requisite: Постановление акимата Северо-Казахстанской области от 25 июня 2014 года № 216. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 августа 2014 года № 2893. Утратило силу постановлением акимата Северо-Казахстанской области от 9 апреля 2015 года № 120
title:
  rus: Об утверждении норматива субсидий на возмещение до 100 % затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, а также критерий и требований к поставщикам услуг по искусственному осеменению
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100 %-ға дейін өтеуге арналған субсидиялар нормативін, сондай-ақ қолдан ұрықтандыру жөніндегі көрсетілетін қызметтерді  жеткізушілерге қойылатын өлшемдер мен талаптарды бекіту туралы

act_code: '79438'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 28 марта 2014 года № 53. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 апреля 2014 года № 2698. Утратило силу в связи с истечением срока действия (письмо акима района Шал акына Северо-Казахстанской области от 12 июня 2015 года № 15.1.5-11/314)
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2014 год в учреждениях образования района Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданының білім беру мекемелеріндегі 2014 жылға мектепке дейінгі тәрбие мен білім оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

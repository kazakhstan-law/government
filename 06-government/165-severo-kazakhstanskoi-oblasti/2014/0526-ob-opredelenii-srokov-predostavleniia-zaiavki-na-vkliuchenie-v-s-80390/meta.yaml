requisite: Постановление акимата Есильского района Северо-Казахстанской области от 26 мая 2014 года № 168. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 мая 2014 года № 2811. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 3 ноября 2014 года № 365
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Есильскому району Северо-Казахстанской области в 2014 году
  kaz: 2014 жылы Солтүстік Қазақстан облысы Есіл ауданы бойынша субсидия алушылардың тізіміне қосуға құжаттар қабылдау мерзімдерін және субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша егудің оңтайлы мерзімдерін айқындау туралы

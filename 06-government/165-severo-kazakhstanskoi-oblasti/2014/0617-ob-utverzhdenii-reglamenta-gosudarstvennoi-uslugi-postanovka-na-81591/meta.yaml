act_code: '81591'
requisite: Постановление акимата Северо-Казахстанской области от 17 июня 2014 года № 202. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 июля 2014 года № 2878. Утратило силу постановлением акимата Северо-Казахстанской области от 20 августа 2015 года № 309
title:
  rus: Об утверждении регламента государственной услуги "Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған түрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

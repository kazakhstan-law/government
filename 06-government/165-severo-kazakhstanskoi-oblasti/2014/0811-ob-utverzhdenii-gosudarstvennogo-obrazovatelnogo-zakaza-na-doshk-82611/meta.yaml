  title:
    rus: О внесении изменений в постановление акимата Акжарского района Северо-Казахстанской области от 11 августа 2014 года № 279 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в Акжарском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ақжар ауданында мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2014 жылғы 11 тамыздағы № 279 қауылысына өзгерістер енгізу туралы

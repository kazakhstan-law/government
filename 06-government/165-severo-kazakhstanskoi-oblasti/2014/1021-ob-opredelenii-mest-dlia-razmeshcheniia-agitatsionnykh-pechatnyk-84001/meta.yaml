requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 21 октября 2014 года № 524. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 октября 2014 года № 2972. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 24 декабря 2014 года № 656
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов и города Тайынши вместо выбывших на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының аумағында шығып қалған ауылдық округтері және Тайынша қаласы әкімдерінің орнына кандидаттарға таңдаушылармен кездесу өткізу үшін үй-жайларды беру және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

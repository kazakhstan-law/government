  title:
    rus: О внесении изменений в постановление акимата Северо-Казахстанской области от 31 июля 2014 года № 268 «Об утверждении регламента государственной услуги «Выдача лицензии, переоформление, выдача дубликатов лицензии для занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении»
    kaz: «Жолаушыларды облысаралық қалааралық, ауданаралық (облысішiлiк қалааралық) және халықаралық қатынастарда автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау жөніндегі қызметпен айналысу үшін лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2014 жылғы 31 шілдедегі № 268 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/89219/rus

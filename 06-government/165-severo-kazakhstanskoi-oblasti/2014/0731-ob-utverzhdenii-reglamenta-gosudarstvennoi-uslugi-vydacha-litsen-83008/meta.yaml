act_code: '83008'
requisite: Постановление акимата Северо-Казахстанской области от 31 июля 2014 года № 268. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 сентября 2014 года № 2926. Утратило силу постановлением акимата Северо-Казахстанской области от 20 августа 2015 года № 309
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии для занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении"
  kaz: '"Жолаушыларды облысаралық қалааралық, ауданаралық (облысішiлiк қалааралық)  және халықаралық қатынастарда автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау жөніндегі қызметпен айналысу үшін лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

act_code: '80504'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 5 мая 2014 года № 131. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 июня 2014 года № 2814. Утратило силу в связи с истечением срока действия (письмо заместителя акима Есильского района Северо-Казахстанской области от 22 января 2015 года № 7.1.8-15/47)
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в Есильском районе Северо-Казахстанской области на 2014 год
  kaz: Солтүстік Қазақстан облысы Есіл ауданында 2014 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы  қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

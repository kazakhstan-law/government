act_code: '80253'
requisite: Постановление акимата Северо-Казахстанской области от 21 мая 2014 года № 142. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 мая 2014 года № 2802. Утратило силу постановлением акимата Северо-Казахстанской области от 3 сентября 2014 года № 322
title:
  rus: Об установлении видов субсидируемых удобрений и гербицидов и норм субсидий на 1 тонну (литр, килограмм) удобрений, реализованных отечественными производителями, на 1 тонну (литр, килограмм) удобрений, приобретенных у поставщика удобрений и (или) у иностранных производителей удобрений, на 1 килограмм (литр) гербицидов, приобретенных у поставщиков гербицидов на 2014 год
  kaz: 2014 жылға арналған субсидияланатын тыңайтқыштар мен гербицидтердің және отандық өндiрушiлер сатқан тыңайтқыштардың 1 тоннасына (литрiне, килограмына), тыңайтқыш жеткiзушiден және (немесе) шетелдiк тыңайтқыш өндiрушiлерден сатып алынған тыңайтқыштардың 1 тоннасына (литрiне, килограмына), гербицид жеткiзушiлерден сатып алынған гербицидтердiң 1 килограмына (литрiне) арналған субсидиялар нормаларын белгiлеу туралы

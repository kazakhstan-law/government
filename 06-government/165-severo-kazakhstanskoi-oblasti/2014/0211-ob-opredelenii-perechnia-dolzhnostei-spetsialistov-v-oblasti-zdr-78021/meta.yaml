requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 11 февраля 2014 года № 48. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 марта 2014 года № 2611. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 18 января 2016 года № 19
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшi болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандары лауазымдарының тiзбесiн анықтау туралы

requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 16 мая 2014 года № 180. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 июня 2014 года № 2815. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 6 ноября 2014 года № 376
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Мамлютскому  району Северо-Казахстанской области в 2014 году
  kaz: 2014 жылы Солтүстік Қазақстан облысы Мамлют ауданы бойынша субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша егудің оңтайлы мерзімдері және субсидия алушылардың тізіміне қосуға өтініштерді ұсыну мерзімдерін айқындау туралы

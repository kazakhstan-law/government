requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 30 октября 2014 года № 520. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 ноября 2014 года № 2974. Утратило силу постановлением акимата Кызылжарского района Северо-Казахстанской области от 06 марта 2015 года № 113
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданы аумағында ауылдық округтер әкімдеріне кандидаттардың таңдауышыларымен кездесу үшін үй-жай беру және үгіттік баспа материалдарды орналастыру үшін орындарды анықтау туралы

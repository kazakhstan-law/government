requisite: Постановление акимата Северо-Казахстанской области от 3 октября 2014 года № 369. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 ноября 2014 года № 2978. Утратило силу постановлением акимата Северо-Казахстанской области от 20 августа 2015 года № 309
title:
  rus: Об утверждении регламента государственной услуги "Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур"
  kaz: '"Басым дақылдарды өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

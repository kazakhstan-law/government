requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 29 января 2014 года № 13. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 февраля 2014 года № 2579. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 3 апреля 2014 года № 73
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в депутаты Тимирязевского районного маслихата вместо выбывшего
  kaz: Шығып қалғанның орнына Тимирязев аудандық мәслихаты депутаттығына кандидаттар сайлаушылармен кездесу өткізу үшін үгіттік баспа материалдарын орналастыру үшін орындар анықтау және үй-жай ұсыну туралы

requisite: Постановление акимата Есильского района Северо-Казахстанской области от 30 июня 2014 года № 189. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 июля 2014 года № 2843. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 3 октября 2017 года № 234
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданының аумағында селолық округ әкімдеріне кандидаттардың таңдауышыларымен кездесулерін өткізу үшін үй-жайларды және үгіттік баспа материалдарын орналастыруға орындарды белгілеу туралы

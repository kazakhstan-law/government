requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 20 октября 2014 года № 334. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 октября 2014 года № 2971. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 22 декабря 2014 года № 409
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы Докучаевского сельского округа Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының Докучаев ауылдық округі әкіміне кандидаттардың таңдаушылармен кездесулер өткізу үшін үй-жайды және үгіттік баспа материалдарын орналастыру үшін орындар анықтау туралы

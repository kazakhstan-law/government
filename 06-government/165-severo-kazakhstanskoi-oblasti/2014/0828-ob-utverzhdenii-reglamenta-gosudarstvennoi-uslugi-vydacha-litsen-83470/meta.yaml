requisite: Постановление акимата Северо-Казахстанской области от 28 августа 2014 года № 311. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 сентября 2014 года № 2948. Утратило силу постановлением акимата Северо-Казахстанской области от 20 августа 2015 года № 309
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензий, переоформление, выдача дубликатов лицензии на деятельность, связанную с оборотом наркотических средств, психотропных веществ и прекурсоров в области здравоохранения"
  kaz: '"Денсаулық сақтау саласындағы есірткі құралдарының, психотроптық заттар мен прекурсорлардың айналымына байланысты  қызметке лицензиялар беру, қайта ресімдеу, лицензияның телнұсқаларын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

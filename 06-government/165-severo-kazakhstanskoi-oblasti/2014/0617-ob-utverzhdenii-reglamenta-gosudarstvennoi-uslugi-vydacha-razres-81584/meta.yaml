  title:
    rus: О внесении изменений в постановление акимата Северо-Казахстанской области от 17 июня 2014 года № 204 «Об утверждении регламента государственной услуги «Выдача разрешения на размещение объектов наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах»
    kaz: «Облыстық және аудандық маңызы бар, сондай-ақ елді мекендердегі жалпы пайдаланымдағы автомобиль жолдарының бөлінген белдеуінде сыртқы (көрнекі) жарнама объектісін орналастыруға рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2014 жылғы 17 маусымдағы № 204 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/89218/rus

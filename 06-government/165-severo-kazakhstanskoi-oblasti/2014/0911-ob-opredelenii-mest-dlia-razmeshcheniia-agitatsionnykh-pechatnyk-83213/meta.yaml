requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 11 сентября 2014 года № 309. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 сентября 2014 года № 2936. Утратило силу в связи с истечением срока действия (письмо аппарата акима Мамлютского района Северо-Казахстанской области от 13 июля 2015 года № 11.1.2-9/897)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в депутаты районного маслихата на территории избирательного округа № 10 Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының № 10 сайлау округінің аумағында аудандық мәслихаттың депутатына үмiткерлердiң сайлаушылармен кездесулерiн өткiзу үшiн үй-жайларды беру және үгiттiк басылым материалдарын орналастыру орындарын белгiлеу туралы

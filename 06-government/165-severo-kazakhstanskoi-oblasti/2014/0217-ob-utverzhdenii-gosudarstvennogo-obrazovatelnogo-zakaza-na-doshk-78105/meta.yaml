requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 17 февраля 2014 года № 25. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 марта 2014 года № 2612. Утратило силу в связи с истечением срока действия (письмо аппарата акима района Магжана Жумабаева Северо-Казахстанской области от 12 января 2015 года № 10.1.5-7/24)
title:

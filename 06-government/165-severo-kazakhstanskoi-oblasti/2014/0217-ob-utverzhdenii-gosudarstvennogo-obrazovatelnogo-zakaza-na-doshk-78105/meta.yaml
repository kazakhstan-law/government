  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының білім беру мекемелеріндегі 2014 жылға мектепке дейінгі тәрбие мен білім оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

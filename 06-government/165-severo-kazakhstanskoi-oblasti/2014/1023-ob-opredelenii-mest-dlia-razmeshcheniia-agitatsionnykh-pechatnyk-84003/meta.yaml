act_code: '84003'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 23 октября 2014 года № 367. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 октября 2014 года № 2973. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 18 августа 2017 года № 251
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы аумағында ауылдық округтер әкімдеріне кандидаттардың таңдауышыларымен кездесу үшін үй-жай беру және үгіттік баспа материалдарды орналастыру үшін орындарды анықтау туралы

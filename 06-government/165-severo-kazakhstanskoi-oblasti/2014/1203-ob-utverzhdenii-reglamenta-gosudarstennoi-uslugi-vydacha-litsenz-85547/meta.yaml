act_code: '85547'
requisite: Постановление акимата Северо-Казахстанской области от 3 декабря 2014 года № 453. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 декабря 2014 года № 3040. Утратило силу постановлением акимата Северо-Казахстанской области от 20 августа 2015 года № 309
title:
  rus: Об утверждении регламента государстенной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов, за исключением деятельности по реализации лома и отходов цветных и черных металлов, образовавшихся у юридических лиц в ходе собственного производства и в результате приобретения имущественного комплекса, в составе которого находились лом и (или) отходы цветных и (или) черных металлов, лицензиатам"
  kaz: '"Заңды тұлғаларда өз өндiрiсi барысында және құрамында түстi және (немесе) қара металл сынықтары және (немесе) қалдықтары болған мүлiктiк кешендi сатып алу нәтижесiнде пайда болған түстi және қара металл сынықтары мен қалдықтарын өткiзу жөнiндегi қызметтi қоспағанда,заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинау (дайындау),сақтау, өңдеу және лицензиаттарға өткiзу бойынша қызметтi жүзеге асыруға лицензия беру, қайта ресiмдеу, лицензия телнұсқасын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

  title:
    rus: О внесении изменения в постановление акимата Тайыншинского района Северо-Казахстанской области от 31 декабря 2014 года № 702 «Об определении специально отведенных мест для осуществления выездной торговли на территории Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы әкімдігінің 2014 жылғы 31 желтоқсандағы № 702 «Солтүстік Қазақстан облысы Тайынша ауданының аумағында көшпелі сауданы жүзеге асыру үшін арнайы бөлінген орындарды белгілеу туралы» қаулысына өзгеріс енгізу туралы

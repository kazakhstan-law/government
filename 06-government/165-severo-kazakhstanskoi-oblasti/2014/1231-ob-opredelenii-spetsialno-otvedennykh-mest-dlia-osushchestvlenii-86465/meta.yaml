act_code: '86465'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 31 декабря 2014 года № 702. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 февраля 2015 года № 3093. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 30 июня 2023 года № 232 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
title:

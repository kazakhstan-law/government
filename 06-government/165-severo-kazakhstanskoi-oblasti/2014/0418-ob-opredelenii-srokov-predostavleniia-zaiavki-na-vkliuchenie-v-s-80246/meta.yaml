requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 18 апреля 2014 года № 116. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 мая 2014 года № 2798. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 23 июля 2014 года № 271
title:

act_code: '81390'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 9 июля 2014 года № 182. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 июля 2014 года № 2855. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 19 июля 2021 года № 182 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Жамбылского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының аумағында ауылдык округтері әкімдеріне кандидаттардың таңдаушыларымен кездесулерін өткізу үшін  үй-жайды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

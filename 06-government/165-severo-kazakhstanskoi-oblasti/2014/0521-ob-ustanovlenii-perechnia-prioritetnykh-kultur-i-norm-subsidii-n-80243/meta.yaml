act_code: '80243'
requisite: Постановление акимата Северо-Казахстанской области от 21 мая 2014 года № 143. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 мая 2014 года № 2797. Утратило силу в связи с истечением срока действия (письмо аппарата акима Северо-Казахстанской области от 1 июля 2015 года № 1.14-7/1840)
title:
  rus: Об установлении перечня приоритетных культур и норм субсидий на удешевление  стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ на 2014 год
  kaz: «2014 жылға арналған басым дақылдарының тізбесін және көктемгі егіс және егін жинау жұмыстарын жүргізуге қажетті жанар-жағар май материалдары мен басқа да тауарлық-материалдық құндылықтардың құнын арзандатуға субсидиялар нормаларын белгілеу туралы»

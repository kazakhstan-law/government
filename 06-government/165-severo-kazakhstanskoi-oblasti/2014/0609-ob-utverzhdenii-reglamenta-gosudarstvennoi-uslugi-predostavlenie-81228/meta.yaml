title:
  rus: Об утверждении регламента государственной услуги "Предоставление туристской  информации, в том числе о туристском потенциале, объектах туризма и лицах, осуществляющих туристскую деятельность"
  kaz: '"Туристік ақпарат, оның ішінде туристік әлеует, туризм объектілері және туристік қызметті жүзеге асыратын тұлғалар туралы туритстік ақпарат беру" мемлекеттік кәрсетілетін қызмет регламентін бекіту туралы'

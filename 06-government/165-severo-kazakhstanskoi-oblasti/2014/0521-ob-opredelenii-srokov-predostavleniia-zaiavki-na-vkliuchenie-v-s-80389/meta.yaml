requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 21 мая 2014 года № 178. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 мая 2014 года № 2810. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 27 октября 2014 года № 377
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по району имени Габита Мусрепова на 2014 год
  kaz: 2014 жылға арналған Ғабит Мүсірепов атындағы ауданы бойынша субсидия алушылар тізіміне енгізуге өтінім ұсыну мерзімдерін және субсидияланатын басымды ауыл шаруашылық дақылдардың әр түрлері бойынша егудің оңтайлы мерзімдерін анықтау туралы

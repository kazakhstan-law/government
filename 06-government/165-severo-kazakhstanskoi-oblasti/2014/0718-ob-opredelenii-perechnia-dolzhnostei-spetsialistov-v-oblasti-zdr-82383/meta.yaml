requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 18 июля 2014 года № 392. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 августа 2014 года № 2914. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 декабря 2015 № 522
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Тайыншинского района
  kaz: Тайынша ауданы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласында мамандары лауазымдарының тізбесін анықтау туралы

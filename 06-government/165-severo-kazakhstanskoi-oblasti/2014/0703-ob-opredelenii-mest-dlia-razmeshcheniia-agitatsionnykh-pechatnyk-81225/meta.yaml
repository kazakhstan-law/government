act_code: '81225'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 3 июля 2014 года № 251. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 июля 2014 года № 2848. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 27 февраля 2018 года № 51
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы города Мамлютка и сельских округов на территории Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының аумағында үгiттiк баспа материалдарын орналастыру орындарын беру және Мамлютка қаласы мен ауылдық округтердің әкімдеріне үмiткерлердiң таңдаушыларымен кездесулерiн өткiзу үшiн үй-жайды белгiлеу туралы

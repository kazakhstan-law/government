title:
  rus: О реорганизации коммунального государственного учреждения «Отдел сельского хозяйства и ветеринарии акимата Аккайынского района Северо-Казахстанской области» путем присоединения к нему коммунального государственного учреждения «Отдел предпринимательства акимата Аккайынского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің ауыл шаруашылығы және ветеринария бөлімі» коммуналдық мемлекеттік мекемесін оған «Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің кәсіпкерлік бөлімі» коммуналдық мемлекеттік мекемесін қосу арқылы қайта құру туралы

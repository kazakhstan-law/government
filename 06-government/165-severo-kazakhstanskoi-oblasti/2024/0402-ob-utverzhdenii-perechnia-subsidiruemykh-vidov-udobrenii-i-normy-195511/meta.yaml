act_code: '195511'
requisite: Постановление акимата Северо-Казахстанской области от 2 апреля 2024 года № 76. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 5 апреля 2024 года № 7742-15
title:
  rus: Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2024 год
  kaz: 2024 жылға арналған тыңайтқыштардың субсидияланатын түрлерінің тізбесін және тыңайтқыштарды, сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялардың нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға арналған бюджеттік қаржы көлемдерін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Северо-Казахстанской области от 2 апреля 2024 года № 76 «Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2024 год»
    kaz: «2024 жылға арналған тыңайтқыштардың субсидияланатын түрлерінің тізбесін және тыңайтқыштарды, сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2024 жылғы 2 сәуірдегі № 76 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202188/rus

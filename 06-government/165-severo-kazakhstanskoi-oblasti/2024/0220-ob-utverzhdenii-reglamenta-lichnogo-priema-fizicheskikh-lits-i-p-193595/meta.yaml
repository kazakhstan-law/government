act_code: '193595'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 20 февраля 2024 года № 41
title:
  rus: Об утверждении регламента личного приема физических лиц и представителей юридических лиц должностными лицами государственных органов финансируемых из бюджета Мамлютского района Северо-Казахстанской области и из бюджетов города Мамлютка, сельских округов Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының бюджетінен қаржыландырылатын және Солтүстік Қазақстан облысы Мамлют ауданының Мамлютка қаласы, ауылдық округтердің бюджетінен қаржыландырылатын мемлекеттік органдардың лауазымды адамдарының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдауының регламентін бекіту туралы

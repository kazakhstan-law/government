    rus: О внесении изменения в постановление акимата Есильского района Северо-Казахстанской области от 20 июня 2024 года № 182 «Об определении и утверждении мест размещения нестационарных торговых объектов на территории Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданының аумағында стационарлық емес сауда объектілерін орналастыру орындарын айқындау және бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2024 жылғы 20 маусымдағы № 182 қаулысына өзгеріс енгізу туралы

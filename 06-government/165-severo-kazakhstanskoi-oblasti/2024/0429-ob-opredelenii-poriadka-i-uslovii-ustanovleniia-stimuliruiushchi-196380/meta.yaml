  title:
    rus: О внесении изменения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 29 апреля 2024 года № 97 «Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников организаций, финансируемых из местного бюджета района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның жергілікті бюджетінен қаржыландырылатын ұйымдар жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2024 жылғы 29 сәуірдегі № 97 қаулысына өзгерістер енгізу туралы

requisite: Поставление акимата Тимирязевского района Северо-Казахстанской области от 30 июля 2007 года № 250. Зарегистрировано Управлением юстиции Тимирязевского района Северо-Казахстанской области 24 августа 2007 года № 13-12-39
title:
  rus: Об утверждении нормы потребления тепловой энергии для отопления жилых многоквартирных домов, не имеющих приборов коммерческого учета, в селе Тимирязеве, отапливаемых государственным коммунальным предприятием «Алпаш» Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының «Алпаш» мемлекеттік коммуналдық кәсіпорыны Тимирязев селосындағы коммерциялық есептеу құралдары жоқ көп пәтерлік тұрғын үйлерге жылу беру үшін жылу қуатын пайдалану нормасын бекіту туралы

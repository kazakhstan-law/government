requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 ноября 2007 года № 318. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 12 декабря 2007 года № 13-6-58. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Назначение государственных пособий семьям, имеющим детей до 18 лет» государственным учреждением «Отдел занятости и социальных программ Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «18 жасқа дейінгі балалары бар отбасыларға мемлекеттік жәрдемақылар тағайындау» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

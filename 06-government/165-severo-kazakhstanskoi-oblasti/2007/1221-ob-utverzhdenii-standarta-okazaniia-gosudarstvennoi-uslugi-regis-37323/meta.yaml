act_code: '37323'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 21 декабря 2007 года № 403. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 25 января 2008 года № 13-6-70. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Регистрация детей дошкольного возраста (до 7 лет) для направления в детские дошкольные учреждения» государственными учреждениями аппаратами акимов сельских округов Есильского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Есіл ауданының селолық округтер әкімдерінің аппараттары мемлекеттік мекемелермен «Мектепке дейінгі балалар мекемелеріне жіберу үшін мектепке дейінгі (7 жасқа дейін) жастағы балаларды тіркеу» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

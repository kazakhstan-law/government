requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 16 ноября 2007 года № 379. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 12 декабря 2007 года № 13-11-81. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги назначения и выплаты социальной помощи на зубопротезирование участникам и инвалидам Великой Отечественной войны Государственным учреждением «Отдел занятости и социальных программ Тайыншинского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тайынша ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» Мемлекеттік мекемесімен Ұлы Отан соғысының қатысушылары мен мүгедектеріне тіс протездеуге әлеуметтік көмекті тағайындау және төлеу мемлекеттік қызмет көрсетудің стандартын бекіту туралы

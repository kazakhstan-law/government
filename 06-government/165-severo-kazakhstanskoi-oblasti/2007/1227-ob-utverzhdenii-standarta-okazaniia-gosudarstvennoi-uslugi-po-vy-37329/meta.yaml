requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 27 декабря 2007 года № 356. Зарегистрировано Управлением юстиции Жамбылского района Северо-Казахстанской области 4 февраля 2008 года № 13-7-75. Утратило силу - постановлением акимата Жамбылского района Северо-Казахстанской области от 2 ноября 2009 года № 264
title:
  rus: Об утверждении стандарта оказания государственной услуги по выдаче справок в нотариальную контору для размещения обмена или продажи жилой площади, принадлежащей несовершеннолетним детям
  kaz: Кәмелетке толмаған балаларға тиеслі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру бойынша мемлекеттік қызмет көрсетудің үлгі стандартын бекіту жөнінде

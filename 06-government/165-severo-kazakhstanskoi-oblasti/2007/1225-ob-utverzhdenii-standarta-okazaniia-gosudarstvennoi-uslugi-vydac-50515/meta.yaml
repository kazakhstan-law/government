requisite: Постановление акимата Есильского района Северо-Казахстанской области от 25 декабря 2007 года № 420. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 27 января 2008 года № 13-6-84. Утратило силу - постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача справок в пенсионные фонды, территориальные подразделения Комитета дорожной полиции МВД для оформления наследства несовершеннолетним детям» государственным учреждением «Отдел образования Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының білім бөлімі» мемлекеттік мекемесімен «Зейнеткерлік қорларға, ІІМ Жол полициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтама беру» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

act_code: '36207'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 16 ноября 2007 года № 377. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 12 декабря 2007 года № 13-11-83. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги оформления документов для инвалидов на социальное обслуживание на дому, в том числе для детей-инвалидов, нуждающихся в постороннем уходе и помощи Государственным учреждением «Отдел занятости и социальных программ Тайыншинского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тайынша ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» Мемлекеттік мекемесімен мүгедектер үшін, оның ішінде біреудің күтімі мен көмегін қажет ететін мүгедек балалар үшін үйде әлеуметтік қызмет көрсетуге құжаттар ресімдеу мемлекеттік қызмет көрсетудің стандартын бекіту туралы

act_code: '36627'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 24 декабря 2007 года № 403. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 29 декабря 2007 года № 13-4-56. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением «Отдел занятости и социальных программ Акжарского района Северо-Казахстанской области» по назначению государственных пособий семьям, имеющим детей до 18 лет
  kaz: «Солтүстік Қазақстан облысы Ақжар ауданы жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «18 жасқа дейінгі балалары бар отбасыларына мемлекеттік жәрдемақыны тағайындау» мемлекеттік қызметін көрсету стандартын бекіту туралы

act_code: '37320'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 21 декабря 2007 года № 407. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 25 января 2008 года № 13-6-67. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача справок в нотариальную контору для разрешения обмена или продажи жилой площади, принадлежащей несовершеннолетним детям» государственными учреждениями аппаратами акимов сельских округов Есильского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Есіл ауданының селолық округтер әкімдерінің аппараттары мемлекеттік мекемелермен «Кәмелетке толмаған балаларга тиесілі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

act_code: '37404'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 25 декабря 2007 года № 417. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 27 января 2008 года № 13-6-80. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача справок в нотариальную контору для разрешения обмена или продажи жилой площади, принадлежащей несовершеннолетним детям» государственным учреждением «Отдел образования Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының білім бөлімі» мемлекеттік мекемесімен «Кәмелетке толмаған балаларға тиесілі тұрғын үй алаңын ауыстыруға немесе сатуға рұқсат беру үшін нотариалды кеңсеге анықтама беру» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

act_code: '50513'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 25 декабря 2007 года № 418. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 27 января 2008 года № 13-6-82. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Прием заявки от семьи, желающей взять детей на патронатное воспитание» государственным учреждением «Отдел образования Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының білім бөлімі» мемлекеттік мекемесімен «Патронаттық тәрбиелеуге балаларды алуға тілек білдірген отбасылардан өтініштер қабылдау» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 ноября 2007 года № 319. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 12 декабря 2007 года № 13-6-57. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Назначение и выплата социальной помощи отдельным категориям нуждающихся граждан по решениям местных представительных органов» государственным учреждением «Отдел занятости и социальных программ Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Жергілікті өкілетті органдардың шешімдері бойынша мұқтаж азаматтардың жекелеген санаттарына әлеуметтік көмек тағайындау және төлеу» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

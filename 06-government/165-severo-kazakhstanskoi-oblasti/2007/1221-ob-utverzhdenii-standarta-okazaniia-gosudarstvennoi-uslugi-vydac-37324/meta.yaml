requisite: Постановление акимата Есильского района Северо-Казахстанской области от 21 декабря 2007 года № 405. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 25 января 2008 года № 13-6-71. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача справок о наличии подсобного хозяйства» государственными учреждениями аппаратами акимов сельских округов Есильского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Есіл ауданының селолық округтер әкімдерінің аппараттары мемлекеттік мекемелермен «Қосалқы шаруашылығының бар екендігі туралы анықтама беру» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

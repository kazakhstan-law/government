requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 29 декабря 2007 года № 441. Зарегистрировано Управлением юстиции Тайыншиского района Северо-Казахстанской области 10 февраля 2008 № 13-11-91. Утратило силу - постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги по выдаче справок о наличии подсобного хозяйства Государственным учреждением "Аппарат акима Абайского сельского округа Тайыншинского района Северо-Казахстанской области"
  kaz: '"Солтүстік Қазақстан облысы Тайынша ауданы Абай селолық округі әкімінің аппараты" Мемлекеттік мекемесімен қосалқы шаруашылықтың бар екендігі туралы анықтамалар беру бойынша мемлекеттік қызметін көрсету стандартын бекіту туралы'

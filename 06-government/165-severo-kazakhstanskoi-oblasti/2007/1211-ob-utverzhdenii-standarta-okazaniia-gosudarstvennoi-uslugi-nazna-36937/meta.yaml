act_code: '36937'
requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 11 декабря 2007 года № 1973. Зарегистрировано Управлением юстиции города Петропавловска Северо-Казахстанской области 11 января 2008 года № 13-1-98. Утратило силу - постановлением акимата города Петропавловска Северо-Казахстанской области от 17 июля 2009 года № 824
title:
  rus: Об утверждении стандарта оказания государственной услуги "Назначение государственного пособия семьям, имеющих детей до 18 лет" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "18 жасқа дейінгі балалары бар отбасыларға мемлекеттік жәрдемақы тағайындау" мемлекеттік қызметін көрсету стандартын бекіту туралы'

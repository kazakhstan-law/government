title:
  rus: Об утверждении стандарта оказания государственной услуги назначения жилищной помощи Государственным учреждением «Отдел занятости и социальных программ Тайыншинского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тайынша ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» Мемлекеттік мекемесімен тұрғын үй көмегін тағайындау мемлекеттік қызмет көрсетудің стандартын бекіту туралы

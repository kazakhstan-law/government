requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 11 декабря 2007 года № 1971. Зарегистрировано Управлением юстиции города Петропавловска Северо-Казахстанской области 11 января 2008 года № 13-1-94. Утратило силу - постановлением акимата города Петропавловска Северо-Казахстанской области от 17 июля 2009 года № 824
title:
  rus: Об утверждении стандарта оказания государственной услуги "Назначение и выплата социальной помощи студентам из малообеспеченных семей" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Аз қамтамасыз етілген отбасыларынан шыққан студенттерге әлеуметтік көмек тағайындау және төлеу" мемлекеттік қызметін көрсету стандартын бекіту туралы" мемлекеттік қызметін көрсету стандартын бекіту туралы'

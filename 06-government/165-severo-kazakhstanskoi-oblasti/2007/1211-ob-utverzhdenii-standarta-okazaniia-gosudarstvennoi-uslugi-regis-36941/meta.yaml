requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 11 декабря 2007 года № 1970. Зарегистрировано Управлением юстиции города Петропавловска Северо-Казахстанской области 11 января 2008 года № 13-1-102. Утратило силу - постановлением акимата города Петропавловска Северо-Казахстанской области от 17 июля 2009 года № 824
title:
  rus: Об утверждении стандарта оказания государственной услуги "Регистрация и учет пострадавших вследствие ядерных испытаний на Семипалатинском испытательном ядерном полигоне" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Семей сынақ полигонындағы ядролық сынақтардың салдарынан зардап шеккен азаматтарды тіркеу және есепке алу" мемлекеттік қызметін көрсету стандартын бекіту туралы" мемлекеттік қызметін көрсету стандартын бекіту туралы'

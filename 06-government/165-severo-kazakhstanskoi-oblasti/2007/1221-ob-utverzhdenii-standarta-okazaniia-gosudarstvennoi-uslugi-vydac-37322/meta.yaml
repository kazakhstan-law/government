act_code: '37322'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 21 декабря 2007 года № 401. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 25 января 2008 года № 13-6-69. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача справок решения совета опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей, являющихся собственниками жилища» государственными учреждениями аппаратами акимов сельских округов Есильского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Есіл ауданының селолық округтер әкімдерінің аппараттары мемлекеттік мекемелермен «Тұрғын үйдің меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қозғайтын мәмілелерді жасау үшін қорғаншылар мен қамқоршылар кеңесінің шешіміне анықтама беру» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 16 ноября 2007 года № 371. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 12 декабря 2007 года № 13-11-84. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги регистрации и учета граждан, пострадавших вследствие ядерных испытаний на Семипалатинском испытательном ядерном полигоне Государственным учреждением «Отдел занятости и социальных программ Тайыншинского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тайынша ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» Мемлекеттік мекемесімен Семей ядролық сынақ полигонында ядролық сынақтардан зардап шеккен азаматтарды тіркеу және есеп жүргізу мемлекеттік қызмет көрсетудің стандартын бекіту туралы

requisite: Постановление акимата Есильского района Северо-Казахстанской области от 25 декабря 2007 года № 416. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 27 января 2008 года № 13-6-79. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача разрешений в банки для оформления ссуды под залог жилья, принадлежащего несовершеннолетнему» государственным учреждением «Отдел образования Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының білім бөлімі» мемлекеттік мекемесімен «Кәмелетке толмағандарға тиесілі тұрғын үйді банкке несие ресімдеу үшін кепілге қоюға рұқсат беру» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

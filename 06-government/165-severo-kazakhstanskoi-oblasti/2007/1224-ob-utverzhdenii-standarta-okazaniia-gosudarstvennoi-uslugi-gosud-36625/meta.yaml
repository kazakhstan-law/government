act_code: '36625'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 24 декабря 2007 года № 404. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 29 декабря 2007 года № 13-4-54. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением «Отдел занятости и социальных программ Акжарского района Северо-Казахстанской области» по оформлению документов для инвалидов на социальное обслуживание на дому, в том числе для детей инвалидов, нуждающихся в постороннем уходе и помощи
  kaz: «Солтүстік Қазақстан облысы Ақжар ауданы жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Мүгедектер үшін, оның ішінде біреудің күтімі мен көмегін қажет ететін мүгедек балалар үшін үйде әлеуметтік қызмет көрсетуге құжаттар ресімдеу» мемлекеттік қызметін көрсету стандартын бекіту туралы

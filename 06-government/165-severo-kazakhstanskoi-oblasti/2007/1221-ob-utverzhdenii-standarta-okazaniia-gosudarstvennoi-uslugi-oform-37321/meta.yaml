act_code: '37321'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 21 декабря 2007 года № 398. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 25 января 2008 года № 13-6-68. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Оформление документов на социальное обеспечение сирот, детей, оставшихся без попечения родителей» государственными учреждениями аппаратами акимов сельских округов Есильского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Есіл ауданының селолық округтер әкімдерінің аппараттары мемлекеттік мекемелермен «Жетімдерді, ата-анасының қамқорлығынсыз калған балаларды әлеуметтік қамсыздандыруға құжаттар ресімдеу» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

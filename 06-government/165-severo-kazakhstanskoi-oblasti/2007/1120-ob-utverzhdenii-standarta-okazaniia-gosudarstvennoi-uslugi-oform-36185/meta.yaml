requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 ноября 2007 года № 316. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 12 декабря 2007 года № 13-6-53. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Оформление документов на социальное обслуживание в государственных и негосударственных медико-социальных учреждениях» государственным учреждением «Отдел занятости и социальных программ Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Мемлекеттік және мемлекеттік емес медициналық- әлеуметтік мекемелерде әлеуметтік қызмет көрсетуге арналған құжаттарды ресімдеу» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

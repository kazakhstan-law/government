act_code: '50514'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 25 декабря 2007 года № 421. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 27 января 2008 года № 13-6-83. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача справок решения совета опеки и попечительства для сделок, затрагивающих интересы несовершеннолетних детей, являющихся собственниками жилища» государственным учреждением «Отдел образования Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының білім бөлімі» мемлекеттік мекемесімен «Тұрғын үйдің меншік иелері болып табылатын кәмелетке толмаған балалардың мүдделерін қозғайтын мәмілелерді жасау үшін қорғаншылар мен қамқоршылар кеңесінің шешіміне анықтама беру» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

title:
  rus: Об утверждении стандарта оказания государственной услуги "Назначение и выплата социальной помощи на санаторно-курортное лечение отдельным категориям граждан" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Азаматтардың жекелеген санаттарына санаторлық-курорттық емделуге әлеуметтік көмек тағайындау және төлеу" мемлекеттік қызметін көрсету стандартын бекіту туралы'

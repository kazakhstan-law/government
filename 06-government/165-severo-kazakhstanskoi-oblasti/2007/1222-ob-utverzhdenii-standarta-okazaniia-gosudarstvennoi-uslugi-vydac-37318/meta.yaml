act_code: '37318'
requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 22 декабря 2007 года № 488. Зарегистрировано Управлением юстиции Кызылжарского района Северо-Казахстанской области 29 января 2008 года № 13-8-51. Утратило силу постановлением акимата Кызылжарского района Северо-Казахстанской области от 4 декабря 2009 года № 392
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача справок в нотариальную контору для разрешения обмена или продажи жилой площади, принадлежащей несовершеннолетним детям» государственным учреждением «Кызылжарский районный отдел образования»
  kaz: «Қызылжар аудандық білім бөлімі» мемлекеттік мекемесінің «Нотариалды кеңсеге кәмелетке толмаған балалардың меншігіндегі тұрғын алаңының сатуға және айырбастауға рұқсат анықтамасын беру» мемлекеттік қызметін көрсету стандартын бекіту туралы

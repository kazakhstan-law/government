requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 16 ноября 2007 года № 374. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 12 декабря 2007 года № 13-11-78. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги назначения государственного пособия семьям, имеющим детей до 18 лет Государственным учреждением «Отдел занятости и социальных программ Тайыншинского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тайынша ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» Мемлекеттік мекемесімен 18 жасқа дейінгі балалары бар отбасыларына мемлекеттік жәрдемақыны тағайындау мемлекеттік қызмет көрсетудің стандартын бекіту туралы

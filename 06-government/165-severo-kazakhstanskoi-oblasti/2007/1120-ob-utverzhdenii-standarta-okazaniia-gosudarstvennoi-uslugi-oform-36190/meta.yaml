requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 ноября 2007 года № 325. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 12 декабря 2007 года № 13-6-56. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Оформление документов на инвалидов для обеспечения их сурдо-, тифлосредствами и обязательными средствами» государственным учреждением «Отдел занятости и социальных программ Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Мүгедектерді сурдо-тифлоқұралдармен және міндетті гигиеналық құралдармен қамсыздандыру үшін оларға құжаттар ресімдеу» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

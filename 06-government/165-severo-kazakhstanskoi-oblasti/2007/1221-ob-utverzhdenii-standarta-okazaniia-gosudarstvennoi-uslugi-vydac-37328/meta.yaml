requisite: Постановление акимата Есильского района Северо-Казахстанской области от 21 декабря 2007 года № 402. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 25 января 2008 года № 13-6-75. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Выдача разрешений в банки для оформления ссуды под залог жилья, принадлежащего несовершеннолетнему» государственными учреждениями аппаратами акимов сельских округов Есильского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Есіл ауданының селолық округтер әкімдерінің аппараттары мемлекеттік мекемелермен «Кәмелетке толмағандарға тиесілі тұрғын үйді банкке несие ресімдеу үшін кепілге қоюға рұқсат беру» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

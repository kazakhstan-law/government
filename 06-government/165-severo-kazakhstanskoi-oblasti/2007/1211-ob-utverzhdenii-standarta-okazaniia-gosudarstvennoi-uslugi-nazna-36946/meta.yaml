requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 11 декабря 2007 года № 1979. Зарегистрировано Управлением юстиции города Петропавловска Северо-Казахстанской области 11 января 2008 года № 13-1-107. Утратило силу - постановлением акимата города Петропавловска Северо-Казахстанской области от 17 июля 2009 года № 824
title:
  rus: Об утверждении стандарта оказания государственной услуги "Назначение и выплата социальной помощи на зубопротезирование участникам и инвалидам Великой Отечественной войны" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Ұлы Отан соғысының қатысушылары мен мүгедектеріне тістерін протездеуге әлеуметтік көмек тағайындау және төлеу" мемлекеттік қызметін көрсету стандартын бекіту туралы'

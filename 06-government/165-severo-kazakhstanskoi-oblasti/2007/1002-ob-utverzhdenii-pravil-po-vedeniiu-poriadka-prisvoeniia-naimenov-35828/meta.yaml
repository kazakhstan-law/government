title:
  rus: Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенного пункта, требования к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы аумағындағы елді мекеннің құрамдас бөліктеріне атау беру және атауын қайта өзгерту тәртібін жүргізу жөніндегі ережелерді, жер учаскелеріне, ғимараттарға реттік нөмерлерін беру талаптарын бекіту туралы

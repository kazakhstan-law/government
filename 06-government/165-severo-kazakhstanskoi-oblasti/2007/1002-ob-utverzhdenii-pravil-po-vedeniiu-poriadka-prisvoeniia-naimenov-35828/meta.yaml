  title:
    rus: О внесении дополнения в постановление акимата Северо-Казахстанской области от 2 октября 2007 года № 227 "Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенного пункта, требования к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Северо-Казахстанской области"
    kaz: '"Солтүстік Қазақстан облысы аумағындағы елді мекеннің құрамдас бөліктеріне атау беру және атауын қайта өзгерту тәртібін жүргізу жөніндегі ережелерді, жер учаскелеріне, ғимараттарға және имараттарға реттік нөмірлерін беру талаптарын бекіту туралы" Солтүстік Қазақстан облысы әкімдігінің 2007 жылғы 2 қазандағы № 227 қаулысына толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/48347/rus

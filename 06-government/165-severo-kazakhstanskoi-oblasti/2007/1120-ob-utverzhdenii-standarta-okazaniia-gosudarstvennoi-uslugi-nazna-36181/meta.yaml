requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 ноября 2007 года № 323. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 12 декабря 2007 года № 13-6-50. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Назначение социальной помощи специалистам социальной сферы, проживающим в сельской местности по приобретению топлива» государственным учреждением «Отдел занятости и социальных программ Есильского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Есіл ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Отын сатып алу бойынша ауылдық жерде тұратын әлеуметтік сала мамандарына әлеуметтік көмек тағайындау» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

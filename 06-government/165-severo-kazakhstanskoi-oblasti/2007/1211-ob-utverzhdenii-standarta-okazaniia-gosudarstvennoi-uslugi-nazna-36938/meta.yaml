    kaz: Петропавл қаласы әкімдігінің "Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесінің "Саяжай маусымы кезеңінде 1 мамырдан бастап 30 қыркүйек аралығында қалалық көлікте жүру үшін зейнеткерлерге әлеуметтік көмек тағайындау және төлеу" мемлекеттік қызмет көрсету стандартын бекіту туралы" 2007 жылғы 11 желтоқсандағы № 1965 қаулысына өзгерістер енгізу туралы

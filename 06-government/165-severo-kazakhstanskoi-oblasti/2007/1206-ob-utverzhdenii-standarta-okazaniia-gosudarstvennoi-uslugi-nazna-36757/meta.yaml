requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 6 декабря 2007 года № 248. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 8 января 2008 года № 13-5-48. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 16 октября 2009 года № 250
title:
  rus: Об утверждении стандарта оказания государственной услуги «Назначение государственной адресной социальной помощи» государственным учреждением «Отдел занятости и социальных программ района имени Габита Мусрепова Северо-Казахстанской области»
  kaz: «Солтүстік Қазакстан облысы Ғабит Мүсірепов атындағы ауданның жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Мемлекеттік атаулы әлеуметтік көмек тағайындау» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

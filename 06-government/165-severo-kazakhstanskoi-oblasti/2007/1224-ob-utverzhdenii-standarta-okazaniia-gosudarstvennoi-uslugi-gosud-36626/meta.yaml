act_code: '36626'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 24 декабря 2007 года № 406. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 29 декабря 2007 года № 13-4-55. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением «Отдел занятости и социальных программ Акжарского района Северо-Казахстанской области» по оформлению документов для материального обеспечения детей-инвалидов, обучающихся и воспитывающихся на дому
  kaz: «Солтүстік Қазақстан облысы Ақжар ауданы жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Үйде оқытылып, тәрбиеленген мүгедек балаларды материалдық қамтамасыз ету үшін құжаттар ресімдеу» мемлекеттік қызметін көрсету стандартын бекіту туралы

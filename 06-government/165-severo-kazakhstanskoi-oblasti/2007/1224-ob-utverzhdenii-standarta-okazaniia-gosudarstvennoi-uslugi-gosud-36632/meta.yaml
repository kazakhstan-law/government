act_code: '36632'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 24 декабря 2007 года № 414. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 29 декабря 2007 года № 13-4-61. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением «Отдел занятости и социальных программ Акжарского района Северо-Казахстанской области» по назначению и выплате материальной помощи по программе «Социальные выплаты отдельным категориям граждан по решению местных представительных органов»
  kaz: «Солтүстік Қазақстан облысы Ақжар ауданы жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Жергілікті өкілдер органының шешімі бойынша жеке санаттағы азаматтарға әлеуметтік төлемдер» бағдарламасы бойынша материалдық көмекті тағайындау және төлеу» мемлекеттік қызметін көрсету стандартын бекіту туралы

title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов на социальное обслуживание в психоневрологических медико-социальных учреждениях" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Психоневрологиялық дәрігерлік-әлеуметтік мекемелерде әлеуметтік қызмет көрсетуге құжаттар ресімдеу" мемлекеттік қызметін көрсету стандартын бекіту туралы'

requisite: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2007 жылғы 18 шілдедегі № 113 қаулысы. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2007 жылғы 19 шілдеде № 13-13-53 болып тіркелді

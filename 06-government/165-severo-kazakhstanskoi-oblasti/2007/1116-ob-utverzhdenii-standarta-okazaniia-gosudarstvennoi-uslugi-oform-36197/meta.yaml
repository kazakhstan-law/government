requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 16 ноября 2007 года № 373. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 12 декабря 2007 года № 13-11-73. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 21 сентября 2009 года № 342
title:
  rus: Об утверждении стандарта оказания государственной услуги оформления документов на инвалидов для обеспечения их сурдо-тифлосредствами и обязательными гигиеническими средствами Государственным учреждением «Отдел занятости и социальных программ Тайыншинского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тайынша ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» Мемлекеттік мекемесімен мүгедектерді сурдо-тифлотехникалық құралдармен және міндетті гигиеналық құралдармен қамтамасыз ету үшін құжаттар ресімдеу мемлекеттік қызмет көрсетудің стандартын бекіту туралы

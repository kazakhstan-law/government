act_code: '36624'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 24 декабря 2007 года № 405. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 29 декабря 2007 года № 13-4-53. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 18 февраля 2010 года № 35
title:
  rus: Об утверждении стандарта оказания государственной услуги Государственным учреждением «Отдел занятости и социальных программ Акжарского района Северо-Казахстанской области» по оформлению документов на социальное обслуживание в государственных и негосударственных медико-социальных учреждениях
  kaz: «Солтүстік Қазақстан облысы Ақжар ауданы жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Медициналық-әлеуметтік мемлекеттік және мемлекеттік емес мекемелеріндегі әлеуметтік қызмет көрсету құжаттарын ресімдеу» мемлекеттік қызметін көрсету стандартын бекіту туралы

act_code: '37401'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 25 декабря 2007 года № 414. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 27 января 2008 года № 13-6-77. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 22 октября 2009 года № 253
title:
  rus: Об утверждении стандарта оказания государственной услуги «Постановка на учет и очередность граждан, нуждающихся в жилье из государственного жилищного фонда» государственным учреждением «Отдел жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының тұрғын үй коммуналдық шаруашылығы, жолаушылар көлігі және автомобиль жолдары бөлімі» мемлекеттік мекемесімен «Мемлекеттік тұрғын үй қорынан тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

title:
  rus: Об утверждении стандарта оказания государственной услуги "Назначение и выплата отдельных видов социальных льгот участникам и инвалидам Великой Отечественной войны" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Ұлы Отан соғысының қатысушылары мен мүгедектеріне әлеуметтік жеңілдіктердің жекеленген түрлерін тағайындау және төлеу" мемлекеттік қызметін көрсету стандартын бекіту туралы'

act_code: '36180'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 ноября 2007 года № 315. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 12 декабря 2007 года № 13-6-49
title:
  rus: Об утверждении стандарта оказания государственной услуги «Оформление документов для инвалидов на социальное обслуживание на дому, в том числе для детей-инвалидов, нуждающихся в постороннем уходе и помощи» государственным учреждением «Отдел занятости и социальных программ Есильского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Есіл ауданының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесімен «Мүгедектер үйінде, оныц ішінде бөгде адамның күтіміне және жәрдеміне мұқтаж мүгедек балаларға әлеуметтік қызмет көрсетуге арналған құжаттарды ресімдеу» мемлекеттік қызмет көрсетудің стандартын бекіту туралы

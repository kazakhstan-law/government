requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 11 декабря 2007 года № 1969. Зарегистрировано Управлением юстиции города Петропавловска Северо-Казахстанской области 11 января 2008 года № 13-1-92. Утратило силу - постановлением акимата города Петропавловска Северо-Казахстанской области от 17 июля 2009 года № 824
title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов на инвалидов для обеспечения их сурдо-тифлосредствами и обязательными гигиеническими средствами" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Сурдо-, тифлотехникалық құралдармен және міндетті гигиеналық құралдармен қамтамасыз ету үшін мүгедектерге құжаттар ресімдеу" мемлекеттік қызметін көрсету стандартын бекіту туралы" мемлекеттік қызметін көрсету стандартын бекіту туралы'

requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 11 декабря 2007 года № 1974. Зарегистрировано Управлением юстиции города Петропавловска Северо-Казахстанской области 11 января 2008 года № 13-1-105. Утратило силу - постановлением акимата города Петропавловска Северо-Казахстанской области от 17 июля 2009 года № 824
title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов для материального обеспечения детей-инвалидов, обучающихся и воспитывающихся на дому" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Үйде тәрбиеленетін және оқытылатын мүгедек балаларды материалдық қамтамасыз ету үшін құжаттар ресімдеу" мемлекеттік қызметін көрсету стандартын бекіту туралы'

    kaz: Петропавл қаласы әкімдігінің "Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесінің "Қарттар мен мүгедектерге арналған жалпы үлгідегі мемлекеттік дәрігерлік-әлеуметтік   мекемелерде әлеуметтік қызмет көрсетуге құжаттар ресімдеу" мемлекеттік қызмет көрсету стандартын бекіту туралы" 2007 жылғы 11 желтоқсандағы № 1966 қаулысына өзгерістер енгізу туралы

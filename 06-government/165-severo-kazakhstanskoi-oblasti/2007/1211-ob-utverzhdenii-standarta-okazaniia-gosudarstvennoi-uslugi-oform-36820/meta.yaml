act_code: '36820'
requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 11 декабря 2007 года № 1966. Зарегистрировано Управлением юстиции города Петропавловска Северо-Казахстанской области 11 января 2008 года № 13-1-90. Утратило силу - постановлением акимата города Петропавловска Северо-Казахстанской области от 17 июля 2009 года № 824
title:
  rus: Об утверждении стандарта оказания государственной услуги "Оформление документов на социальное обслуживание в государственных медико-социальных учреждениях для престарелых и инвалидов общего типа" государственным учреждением "Отдел занятости и социальных программ города Петропавловска"
  kaz: '"Петропавл қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі" мемлекеттік мекемесімен "Қарттар мен мүгедектерге арналған жалпы үлгідегі мемлекеттік қызмет көрсетуге құжаттар ресімдеу" мемлекеттік қызметін  көрсету стандартын бекіту туралы'

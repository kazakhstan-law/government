  title:
    rus: О внесении изменений в постановление акимата Кызылжарского района Северо-Казахстанской области от 10 апреля 2015 года № 184 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет,спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы Қызылжар ауданы әкімдігінің 2015 жылғы 10 сәуірдегі № 184 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Северо-Казахстанской области от 30 июня 2015 года № 227. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 августа 2015 года № 3342. Утратило силу постановлением акимата Северо-Казахстанской области от 2 марта 2020 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг по приему документов для участия в конкурсах на присуждение звания «Лучший педагог» и на замещение руководителей государственных учреждений среднего образования, оказываемых местными исполнительными органами
  kaz: Жергілікті атқарушы органдар көрсететін «Үздік педагог» атағын беру және мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурстарына қатысу үшін құжаттарды қабылдау бойынша мемлекеттік қызметтер регламенттерін бекіту туралы

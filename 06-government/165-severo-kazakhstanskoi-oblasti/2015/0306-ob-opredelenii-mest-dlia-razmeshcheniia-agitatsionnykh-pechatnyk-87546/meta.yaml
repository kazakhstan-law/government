requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 6 марта 2015 года № 112. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 марта 2015 года № 3151. Утратило силу постановлением акимата Кызылжарского района Северо-Казахстанской области от 3 июня 2015 года № 264
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений кандидатам в Президенты Республики Казахстан для проведения встреч с избирателями на территории Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесулер өткізу үшін Қазақстан Республикасының Президенттігіне кандидаттарға үй-жай ұсыну туралы

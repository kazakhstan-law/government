requisite: Постановление акимата Северо-Казахстанской области от 29 июня 2015 года № 222. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 июля 2015 года № 3302. Утратило силу постановлением акимата Северо-Казахстанской области от 14 июля 2016 года № 265
title:
  rus: Об утверждении нормативов субсидий, а также критериев и требований по направлениям субсидирования возмещение до 100% затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, удешевление затрат по заготовке и приобретению грубых, сочных, концентрированных кормов и кормовых добавок
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100%-ға дейін өтеуді, ірі, шырынды, құрама жемшөп пен жемшөп қоспаларын дайындау және сатып алу бойынша шығындарды арзандатуды субсидиялау бағыттары бойынша субсидиялар нормативтерін, сондай-ақ өлшемдер мен талаптарды бекіту туралы

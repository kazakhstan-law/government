  kaz: «Қызылжар аудандық тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі, автомобиль жолдары, құрылыс, сәулет және қала құрылысы бөлімі» мемлекеттік мекемесін құру туралы

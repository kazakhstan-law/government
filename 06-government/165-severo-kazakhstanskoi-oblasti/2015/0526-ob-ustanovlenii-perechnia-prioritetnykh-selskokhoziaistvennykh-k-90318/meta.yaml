title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и норм субсидий (на 1 гектар) на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым ауыл шаруашылығы дақылдарының тiзбесін және басым дақылдар өндіруді субсидиялау арқылы жанар-жағармай материалдары мен көктемгi егiс және егiн жинау жұмыстарын жүргiзуге қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауылшаруашылық дақылдарын қорғалған топырақта өңдеп өсіру  шығындарының құнын арзандатуға арналған субсидиялар нормаларын (1 гектарға) белгілеу туралы

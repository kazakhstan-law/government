act_code: '97639'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 21 декабря 2015 года № 522. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 января 2015 года № 3555. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 3 апреля 2019 года № 117 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Тайыншинского района
  kaz: Азаматтық қызметшілер болып табылатын және Тайынша ауданының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласында мамандары лауазымдарының тізбесін айқындау туралы

requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 3 августа 2015 года № 324. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 августа 2015 года № 3337. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 18 августа 2017 года № 251
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы аумағында ауылдық округтер әкімдеріне кандидаттардың таңдаушыларымен кездесу өткізу үшін үй-жай беру және үгіттік баспа материалдарды орналастыру үшін орындарды анықтау туралы

requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 6 марта 2015 года № 113. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 марта 2015 года № 3150. Утратило силу постановлением акимата Кызылжарского района Северо-Казахстанской области от 3 июня 2015 года № 264
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және таңдаушылармен кездесулер  өткізу үшін ауылдық округ әкімдігіне кандидаттарға үй-жай  ұсыну туралы

requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 2 ноября 2015 года № 460. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 ноября 2015 года № 3447. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 4 августа 2017 года № 277
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов и города Тайынша вместо выбывших на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының аумағында шығып қалған ауылдық округтері және Тайынша қаласы әкімдерінің орнына үміткерлерге таңдаушылармен кездесу өткізу үшін үй-жайды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

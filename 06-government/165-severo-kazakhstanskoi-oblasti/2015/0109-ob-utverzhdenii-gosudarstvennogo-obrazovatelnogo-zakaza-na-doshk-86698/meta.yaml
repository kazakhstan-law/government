  title:
    rus: О внесении изменений в постановление акимата Айыртауского района Северо-Казахстанской области от 09 января 2015 года № 10 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в Айыртауском районе Северо–Казахстанской области на 2015 год»
    kaz: Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2015 жылғы 09 қаңтардағы № 10 «2015 жылға Солтүстік Қазақстан облысы Айыртау ауданында мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

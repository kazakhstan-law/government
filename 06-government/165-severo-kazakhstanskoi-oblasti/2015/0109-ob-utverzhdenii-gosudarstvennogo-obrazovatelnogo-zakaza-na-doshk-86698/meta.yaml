title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в Айыртауском районе Северо-Казахстанской области на 2015 год
  kaz: '2015 жылға Солтүстік Қазақстан облысы Айыртау ауданында мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы '

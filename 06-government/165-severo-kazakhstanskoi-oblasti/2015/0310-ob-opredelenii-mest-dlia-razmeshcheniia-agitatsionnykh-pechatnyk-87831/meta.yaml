title:
  rus: 'Об определении мест для размещения агитационных печатных материалов и предоставлении помещений кандидатам в Президенты Республики Казахстан для проведения встреч с избирателями на территории Есильского района Северо-Казахстанской области '
  kaz: 'Солтүстік Қазақстан облысы Есіл ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесулер өткізу үшін Қазақстан Республикасының Президенттігіне кандидаттарға үй-жай ұсыну туралы '

title:
  rus: 'О признании утратившим силу постановления акимата Айыртауского района Северо-Казахстанской области  от 2 марта 2015 года № 58 «Об определении мест для размещения агитационных  печатных материалов и предоставления помещений для проведения встреч избирателями кандидатов в Президенты Республики Казахстан на территории Айыртауского района» '
  kaz: Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2015 жылғы 02 наурыздағы № 58 «Айыртау ауданының аумағында Қазақстан Республикасының Президенттігіне кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды анықтау және сайлаушылармен кездесу өткізу үшін үй-жайларды ұсыну туралы»қаулысының күші жойылғанын тану туралы

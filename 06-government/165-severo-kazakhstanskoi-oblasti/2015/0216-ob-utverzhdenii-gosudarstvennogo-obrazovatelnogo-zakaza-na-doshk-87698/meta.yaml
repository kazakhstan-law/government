title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размер подушевого финансирования и родительской платы на 2015 год в учреждениях образования района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының білім беру мекемелеріндегі 2015 жылға мектепке дейінгі тәрбие мен білім оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

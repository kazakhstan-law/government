  title:
    rus: О внесении изменений в постановление акимата района Шал акына Северо-Казахстанской области от 21 декабря 2015 года № 323 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах района Шал акына Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Шал ақын ауданының шалғайдағы елдi мекендерде тұратын балаларды жалпы бiлiм беретiн мектептерге тасымалдау схемасы мен тәртібін бекiту туралы» Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2015 жылғы 21 желтоқсандағы № 323 қаулысына өзгерістер енгізу туралы

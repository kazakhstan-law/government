act_code: '92550'
requisite: Постановление от 27.07.2015 №222, Акимат Мамлютского района
title:
  rus: О признании утратившим силу постановления акимата Мамлютского района Северо-Казахстанской области от 20 марта 2015 года № 75 «Об утверждении Правил расчета ставки арендной платы при передаче районного коммунального имущества в имущественный наем (аренду)»
  kaz: «Ауданның коммуналдық мүлкін мүліктік жалдауға (жалға алуға) беру кезінде жалдау ақысының мөлшерлемесін есептеу Қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2015 жылғы 20 наурыздағы № 75 қаулысын күшін жойған деп тану туралы

  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 14 августа 2015 года № 301 «Об утверждении регламента государственной услуги «Выдача заключения о технической целесообразности строительства дублирующих (шунтирующих) линий электропередачи и подстанций для объектов 110 кВ и ниже, 220 кВ и выше»
    kaz: «110 кВ және одан төмен, 220 кВ және одан жоғары объектілер үшін қайталанатын (шунтталатын) электр беру желілері мен қосалқы станцияларды салудың техникалық орындылығы туралы қорытынды беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2015 жылғы 14 тамыздағы № 301 қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 3 марта 2015 года № 79. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 марта 2015 года № 3137. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 18 августа 2017 года № 251
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч кандидатов в Президенты Республики Казахстан на внеочередных выборах Президента Республики Казахстан с избирателями на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан аумағында Қазақстан Республикасы Президентін кезектен тыс сайлауда Қазақстан Республикасының Президентіне кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды анықтау және сайлаушылармен кездесуіне арналған үй-жайларды ұсыну туралы

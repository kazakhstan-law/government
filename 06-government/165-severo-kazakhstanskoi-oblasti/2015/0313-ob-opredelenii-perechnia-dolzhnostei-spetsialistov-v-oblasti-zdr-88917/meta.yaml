requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 13 марта 2015 года № 66. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 апреля 2015 года № 3214. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 10 февраля 2016 года № 33
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих  в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін және азаматтық қызметшілер болып табылатын денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария салаларындағы мамандары лауазымдарының тізбесін айқындау туралы

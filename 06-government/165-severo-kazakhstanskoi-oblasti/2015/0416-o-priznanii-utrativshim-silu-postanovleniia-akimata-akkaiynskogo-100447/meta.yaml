act_code: '100447'
requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 16 апреля 2015 года № 120
title:
  rus: О признании утратившим силу постановления акимата Аккайынского района Северо-Казахстанской области от 23 января 2015 года № 28 «Об определении мест для размещения агитационных печатных материалов и предоставлении кандидатам помещения для встреч с избирателями по выборам депутата Аккайынского районного маслихата»
  kaz: «Аққайың аудандық мәслихат депутатын сайлау бойынша үгiттiк баспа материалдарын орналастыру орындарын анықтау және кандидаттарға сайлаушылармен кездесуi үшiн үй-жай ұсыну туралы» Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің 2015 жылғы 23 қантардағы № 28 қаулысының күші жойылғандығын тану туралы

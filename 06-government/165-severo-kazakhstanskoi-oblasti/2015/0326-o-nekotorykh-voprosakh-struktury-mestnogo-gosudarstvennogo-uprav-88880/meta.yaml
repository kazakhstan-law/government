  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 26 марта 2015 года № 131 «О некоторых вопросах структуры местного государственного управления района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның жергілікті мемлекеттік басқару құрылымының кейбір мәселелері туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2015 жылғы 26 наурыздағы № 131 қаулысына өзгерістер енгізу туралы

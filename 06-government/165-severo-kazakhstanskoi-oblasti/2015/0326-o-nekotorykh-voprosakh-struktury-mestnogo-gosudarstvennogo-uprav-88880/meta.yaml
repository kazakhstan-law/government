requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 26 марта 2015 года № 131. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 апреля 2015 года № 3204. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 17 февраля 2021 года № 34 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

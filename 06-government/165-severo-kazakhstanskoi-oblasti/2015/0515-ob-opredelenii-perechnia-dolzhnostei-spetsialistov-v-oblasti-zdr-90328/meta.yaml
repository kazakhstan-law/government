act_code: '90328'
requisite: Постановление акимата Северо-Казахстанской области от 15 мая 2015 года № 162. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 июня 2015 года № 3264. Утратило силу постановлением акимата Северо-Казахстанской области от 28 января 2016 года № 33
title:
  rus: Об определении Перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности, имеющих право на повышенные не менее чем на двадцать пять процентов должностные оклады и тарифные ставки  по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария с саласындағы қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға  жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларға құқығы бар мамандар лауазымдарының тізбесін айқындау туралы

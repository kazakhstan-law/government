act_code: '95182'
requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 2 ноября 2015 года № 225. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 ноября 2015 года № 3441. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 3 мая 2019 года № 90 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы Есильского сельского округа Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының Есіл ауылдық округі әкіміне кандидаттардың таңдаушылармен кездесулер өткізу үшін үй-жайды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындар анықтау туралы

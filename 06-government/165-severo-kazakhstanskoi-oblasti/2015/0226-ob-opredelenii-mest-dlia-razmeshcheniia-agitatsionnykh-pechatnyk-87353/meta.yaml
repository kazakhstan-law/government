act_code: '87353'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 26 февраля 2015 года № 50. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 марта 2015 года № 3131. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 15 июня 2015 года № 196
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в Президенты Республики Казахстан на территории Жамбылского района Северо-Казахстанской области
  kaz: Cолтүстік Қазақстан облысы Жамбыл ауданының аумағында Қазақстан Республикасының Президенттігіне кандидаттардың сайлаушылармен кездесуін өткізу үшін үй-жайларын ұсыну және үгіт-насихаттық баспа материалдарын орналастыру үшін орындарды белгілеу туралы

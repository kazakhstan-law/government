requisite: Постановление акимата Кызылжарского района Северо-Казахстанской области от 16 сентября 2015 года № 428. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 октября 2015 года № 3415. Утратило силу постановлением акимата Кызылжарского района Северо-Казахстанской области от 27 декабря 2023 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении схемы и порядок перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Кызылжарского района Северо-Казахстанской области

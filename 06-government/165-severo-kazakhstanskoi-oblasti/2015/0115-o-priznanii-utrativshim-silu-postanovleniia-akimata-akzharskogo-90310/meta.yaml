act_code: '90310'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 15 января 2015 года № 17
title:
  rus: О признании утратившим силу постановления акимата Акжарского района Северо-Казахстанской области от 15 сентября 2014 года №319 «Об определении порядка  расчета ставки арендной платы за  имущественный наем (аренду) районного коммунального имущества» (зарегистрировано в Реестре государственной регистрации нормативных правовых актов за №2960 от 17октября 2014 года, опубликовано 24 октября 2014 года в газетах «Акжар хабар» №42, «Дала дидары» №42)
  kaz: «Ауданның  коммуналдық  мүлкін мүліктік  жалдауға (жалға алуға) беру кезіндегі жалдау ақысы мөлшерлемесінің есебінің тәртібін анықтау туралы» Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2014 жылғы 15 қыркүйектегі № 319қаулысының (Нормтивтік құқықтық актілерді мемлекеттік тіркеу тізілімінде 2014 жылғы 17 қазандағы № 2960 тіркелген, 2014 жылғы 24 қазандағы № 42 «Акжар хабар» және №42 «Дала дидары» газеттерінде жарияланған) күшін жою туралы

act_code: '87378'
requisite: Постановление №43 от 02.03.2015, Акимат Тимирязевского района
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями кандидатов в Президенты Республики Казахстан на территории Тимирязевского района
  kaz: Тимирязев ауданының аумағында Қазақстан Республикасы Президенттігіне кандидаттардың сайлаушылармен кездесулер өткізу үшін үй-жайларды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындар анықтау туралы

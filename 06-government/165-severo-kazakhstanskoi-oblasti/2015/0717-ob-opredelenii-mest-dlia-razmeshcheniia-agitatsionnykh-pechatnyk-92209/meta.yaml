requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 17 июля 2015 года № 220. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 июля 2015 года № 3319. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 16 июня 2017 года № 159
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов и города Булаево района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының ауылдық округтері және Булаев қаласының әкімдеріне кандидаттардың таңдаушылармен кездесулер өткізу үшін үй-жайды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындар анықтау туралы

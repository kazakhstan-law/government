requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 15 апреля 2015 года № 81. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 мая 2015 года № 3246. Утратило силу постановлением акимата Тимирязеввского района Северо-Казахстанской области от 29 апреля 2016 № 120
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Пробация қызметінің есебінде тұрған адамдар, сондай-ақ қылмыстық-атқару жүйесінің мекемелерінен босатылған адамдар үшін, және интернаттық ұйымдардың кәмелетке толмаған түлектері үшін жұмыс орындарына квота белгілеу туралы

  rus: 'Об утверждении  государственного образовательного заказа  на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2015 год в учреждениях образования района Шал акына Северо-Казахстанской области '
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданының білім беру  мекемелеріндегі 2015 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

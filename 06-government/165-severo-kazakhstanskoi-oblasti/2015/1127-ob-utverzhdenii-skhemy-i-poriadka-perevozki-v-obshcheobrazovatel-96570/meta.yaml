requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 27 ноября 2015 года № 493. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 декабря 2015 года № 3515. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 22 февраля 2024 года № 61 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

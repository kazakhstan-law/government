    kaz: «Солтүстік Қазақстан облысы Мамлют ауданының шалғай елді мекендерінде тұратын оқушыларды жалпы білім беретін мектептерге тасымалдау схемалары мен тәртібін бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2015 жылғы 7 қыркүйектегі № 275 қаулысына өзгерістер енгізу туралы

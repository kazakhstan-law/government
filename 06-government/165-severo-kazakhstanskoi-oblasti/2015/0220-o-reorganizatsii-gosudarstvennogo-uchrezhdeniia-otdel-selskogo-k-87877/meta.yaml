act_code: '87877'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 20 февраля 2015 года № 35. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 марта 2015 года № 3148. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 27 мая 2020 года № 153 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О реорганизации государственного учреждения «Отдел сельского хозяйства и ветеринарии Есильского района Северо-Казахстанской области» путем выделения из него государственного  учреждения «Отдел ветеринарии Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының ауыл шаруашылығы және ветеринария бөлімі» мемлекеттік мекемесінен бөліп шығару жолымен «Солтүстік Қазақстан облысы Есіл ауданы ветеринария бөлімі» мемлекеттік мекемесін қайта ұйымдастыру туралы

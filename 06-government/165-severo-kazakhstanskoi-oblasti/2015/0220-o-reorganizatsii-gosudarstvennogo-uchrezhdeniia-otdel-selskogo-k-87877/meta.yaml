  title:
    rus: О признании утратившим силу пункта 3 постановления акимата Есильского района Северо-Казахстанской области от 20 февраля 2015 года № 35 «О реорганизации государственного учреждения «Отдел сельского хозяйства и ветеринарии Есильского района Северо-Казахстанской области»
    kaz: '"Солтүстік Қазақстан облысы Есіл ауданының ауыл шаруашылығы және ветеринария бөлімі" мемлекеттік мекемесін қайта ұйымдастыру туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2015 жылғы 20 ақпандағы № 35 қаулысының 3 тармағының күші жойылды деп тану туралы'

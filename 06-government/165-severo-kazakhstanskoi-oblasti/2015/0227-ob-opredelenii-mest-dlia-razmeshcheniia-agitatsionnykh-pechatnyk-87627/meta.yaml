title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов вместо выбывших на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының аумағында шығып қалған ауылдық округтері әкімдерінің орнына үміткерлерге таңдаушылармен кездесу өткізу үшін үй-жайды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

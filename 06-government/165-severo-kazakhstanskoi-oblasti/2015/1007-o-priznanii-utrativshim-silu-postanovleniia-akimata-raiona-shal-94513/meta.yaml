title:
  rus: О признании утратившим силу постановления акимата района Шал акына от 29 июля 2015 года № 205 «Об утверждении схемы и порядок перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах района Шал акына Северо-Казахстанской области
  kaz: Шал ақын ауданы әкімдігінің 2015 жылғы 29 шілдедегі № 205 «Солтүстік Қазақстан облысы Шал ақын ауданының шалғайдағы елдi мекендерде тұратын балаларды жалпы бiлiм беретiн мектептерге тасымалдаудың схемасы мен тәртібін бекiту туралы» қаулысы күшінің жойылғанын тану туралы

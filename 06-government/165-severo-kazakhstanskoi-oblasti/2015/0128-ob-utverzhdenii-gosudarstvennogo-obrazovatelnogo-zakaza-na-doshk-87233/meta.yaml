  title:
    rus: О внесении изменения в постановление акимата Есильского района Северо-Казахстанской области от 28 января 2015 года № 23 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в Есильском районе Северо-Казахстанской области на 2015 год»
    kaz: «Солтүстік Қазақстан облысының Есіл ауданында 2015 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата – ананың ақы төлеу мөлшерін бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2015 жылғы 28 қаңтардағы № 23 қаулысына өзгеріс  енгізу туралы

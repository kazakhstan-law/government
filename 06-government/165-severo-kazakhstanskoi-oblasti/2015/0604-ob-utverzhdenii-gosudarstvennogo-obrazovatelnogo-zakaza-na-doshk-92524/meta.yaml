  title:
    rus: О внесении изменения в постановление акимата Мамлютского района Северо-Казахстанской области от 4 июня 2015 года № 159 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в Мамлютском районе Северо-Казахстанской области на 2015 год»
    kaz: «Солтүстік Қазақстан облысының Мамлют ауданында 2015 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2015 жылғы 4 маусымдағы № 159 қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 22 января 2015 года № 21. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 января 2015 года № 3079. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 15 июня 2015 года № 196
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставления помещения для проведения встреч с избирателями кандидатов в депутаты районного маслихата на территории Жамбылского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының аумағында аудандық мәслихаттың депутаттығына кандидаттардың сайлаушылармен кездесуін өткізу үшін үй-жайларды ұсыну және үгіт-насихаттық баспа материалдарын орналастыру үшін орынды белгілеу туралы

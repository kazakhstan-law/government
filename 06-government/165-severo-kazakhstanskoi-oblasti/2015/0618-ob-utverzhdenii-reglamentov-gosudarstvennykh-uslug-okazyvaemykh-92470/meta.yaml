title:
  rus: Об утверждении регламентов государственных услуг, оказываемых местными исполнительными органами в сфере предоставления дополнительного образования для детей и проведения конкурса на присуждение гранта «Лучшая организация среднего образования»
  kaz: Балаларға қосымша білім беру және «Орта білім беретін үздік ұйым» грантын тағайындау конкурсын өткізу саласындағы жергілікті атқарушы органдар көрсететін мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы

act_code: '87973'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 6 марта 2015 года № 50. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 марта 2015 года № 3154. Утратило силу постановлением акимата района Шал акына Северо-Казахстанской области от 14 января 2016 года № 5
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении  помещений кандидатам в Президенты Республики Казахстан для проведения встреч с избирателями на территории района Шал акына Северо-Казахстанской области
  kaz: 'Солтүстік Қазақстан облысы Шал ақын ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орындар анықтау және сайлаушылармен кездесу жүргізу үшін Қазақстан Республикасының Президенттігіне кандидаттарға үй-жайларды ұсыну туралы '

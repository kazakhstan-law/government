act_code: '90297'
requisite: Постановление №139 от 05.05.2015, Акимат Аккайынского района
title:
  rus: О признании утратившим силу постановления акимата Аккайынского района Северо-Казахстанской области от 2 марта 2015 года № 80 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями на территории Аккайынского района»
  kaz: «Аққайың ауданының аумағында үгіттік баспа материалдарын орналастыру орындарын анықтау және сайлаушылармен кездесу үшін үй-жайларды ұсыну туралы» Солтүстік Қазақстан облысы Аққайың ауданы әкімдігінің 2015 жылғы 2 наурыздағы № 80 қаулысының күші жойылғандығын тану туралы

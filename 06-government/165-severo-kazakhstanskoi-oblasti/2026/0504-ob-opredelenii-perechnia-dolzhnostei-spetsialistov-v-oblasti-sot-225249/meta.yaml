act_code: '225249'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 4 мая 2026 года № 119
title:
  rus: «Об определении перечня должностей специалистов в области социального обеспечения, культуры, являющихся гражданскими служащими и работающих в сельской местности Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданының ауылдық жерлерінде жұмыс істейтін және азаматтық қызметшілер болып табылатын әлеуметтік қамсыздандыру және мәдениет саласы мамандарының лауазымдарының тізбесін айқындау туралы»

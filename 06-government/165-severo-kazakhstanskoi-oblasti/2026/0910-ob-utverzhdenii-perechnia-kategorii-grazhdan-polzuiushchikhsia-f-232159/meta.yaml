act_code: '232159'
requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 10 сентября 2026 года № 160
title:
  rus: Об утверждении Перечня категорий граждан, пользующихся физкультурно - оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц инвалидностью, а также размер льгот на территории Уалихановского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы аумағында мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру көрсетілетін қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктердің мөлшерін бекіту туралы

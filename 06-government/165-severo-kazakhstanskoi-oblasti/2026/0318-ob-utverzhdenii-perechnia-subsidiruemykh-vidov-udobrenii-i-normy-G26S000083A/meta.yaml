  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 18 марта 2026 года № 83 «Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений (за исключением органических) на 2026 год»
    kaz: «2026 жылға арналған тыңайтқыштардың субсидияланатын түрлерінің тізбесін және сатушыдан сатып алынған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) 1 тоннасына (килограмына, литріне) арналған субсидиялар нормаларын бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2026 жылғы 18 наурыздағы № 83 қаулысына өзгеріс енгізу туралы

act_code: '228104'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 21 июля 2026 года № 177
title:
  rus: Об отмене постановления акимата Есильского района Северо-Казахстанской области от 21 апреля 2023 года № 85 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат акима акимата Есильского района Северо-Казахстанской области», аппаратов акимов сельских округов, исполнительных органов Есильского района  Северо-Казахстанской области, содержащихся за счет средств районного бюджета»
  kaz: Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің «Аудандық бюджет қаражаты есебінен қамтылатын «Солтүстік Қазақстан облысы Есіл ауданы әкімдігі әкімінің аппараты» коммуналдық мемлекеттік мекемесінің, Солтүстік Қазақстан облысы Есіл ауданы ауылдық округтері әкімдерінің аппараттарының, атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» 2023 жылғы 21 сәуірдегі № 85 қаулысының күшін жою туралы

  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының жергілікті бюджетінен қаржыландырылатын ұйымдар қызметкерлерінің лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы

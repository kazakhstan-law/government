requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 2 февраля 2026 года № 32
title:
  rus: О предоставлении товариществу с ограниченной ответственностью «SMART MINING» права ограниченного целевого пользования (публичный сервитут) сроком на 6 лет на земельный участок для целей разведки полезных ископаемых в Антоновском сельском округе
  kaz: «SMART MINING» жауапкершілігі шектеулі серіктестігіне, Антоновка, ауылдық округтерінде пайдалы қазбаларды барлау мақсаттары үшін жер учаскесіне 6 жыл мерзімге шектеулі нысаналы пайдалану құқығын (жария сервитут) беру туралы

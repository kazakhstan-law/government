title:
  rus: Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений (за исключением органических) на 2026 год
  kaz: 2026 жылға арналған тыңайтқыштардың субсидияланатын түрлерінің тізбесін және сатушыдан сатып алынған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) 1 тоннасына (килограмына, литріне) арналған субсидиялар нормаларын бекіту туралы

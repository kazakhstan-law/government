act_code: '231992'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 22 октября 2026 года № 240
title:
  rus: Об установлении перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размеров льгот на территории района Шал акына
  kaz: Шал ақын ауданының аумағында мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікті шарттармен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін бекіту туралы

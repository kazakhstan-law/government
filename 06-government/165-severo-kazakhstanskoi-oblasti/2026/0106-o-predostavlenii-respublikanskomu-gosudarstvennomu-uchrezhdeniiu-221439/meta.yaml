act_code: '221439'
requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 6 января 2026 года № 2
title:
  rus: О предоставлении республиканскому государственному учреждению «Комитет водного хозяйства Министерства водных ресурсов и ирригации Республики Казахстан» права ограниченного целевого пользования (публичный сервитут) сроком на 49 лет на земельные участки для строительства и обслуживания Кокшетауского группового водопровода в Каратальском, Елецком, Володарском сельских округах
  kaz: «Қазақстан Республикасы Су ресурстары және ирригация министрлігінің Су шаруашылығы комитеті» республикалық мемлекеттік мекемесіне Қаратал, Елецкий, Володар, ауылдық округтерінде Көкшетау топтық су құбырын салу және оған қызмет көрсету үшін 49 жыл мерзімге жер учаскелеріне шектеулі нысаналы пайдалану (жария сервитут) құқығын беру туралы

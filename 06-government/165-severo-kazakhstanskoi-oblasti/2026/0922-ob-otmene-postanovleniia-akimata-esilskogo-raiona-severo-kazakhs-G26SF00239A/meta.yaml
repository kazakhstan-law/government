title:
  rus: Об отмене постановления акимата Есильского района Северо-Казахстанской области от 5 июня 2026 года № 140 «О некоторых вопросах поощрения граждан участвующих в профилактике правонарушений на территории Есильского района»
  kaz: «Есіл ауданының аумағында құқық бұзушылықтардың профилактикасына қатысатын азаматтарды көтермелеудің кейбір мәселелері туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2026 жылғы 5 маусымдағы № 140 қаулысының күшін жою туралы

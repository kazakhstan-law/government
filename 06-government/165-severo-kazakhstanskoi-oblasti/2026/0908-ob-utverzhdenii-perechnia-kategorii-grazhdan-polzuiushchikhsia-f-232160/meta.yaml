requisite: Постановление акимата Есильского района Северо-Казахстанской области от 8 сентября 2026 года № 224
title:
  rus: Об утверждении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размеров льгот, на территории Есильского района
  kaz: Есіл ауданының аумағында мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікпен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін бекіту туралы

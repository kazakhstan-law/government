requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 22 апреля 2026 года № 96. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 апреля 2026 года № 38544
title:
  rus: Об утверждении Правил обеспечения возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в районе имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданда пәтерлердің, тұрғын емес үй-жайлардың меншік иелерінің көппәтерлі тұрғын үйде лифтілерді жөндеуге және ауыстыруға, күрделі жөндеуге байланысты қаражатты қайтаруын қамтамасыз ету қағидаларын бекіту туралы

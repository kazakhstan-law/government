title:
  rus: Об утверждении Перечня категорий граждан, пользующихся физкультурно-оздоровительными услугами бесплатно или на льготных условиях, за исключением лиц с инвалидностью, а также размеров льгот на территории Аккайынского района
  kaz: Аққайың ауданының аумағында мүгедектігі бар адамдарды қоспағанда, дене шынықтыру-сауықтыру қызметтерін тегін немесе жеңілдікпен пайдаланатын азаматтар санаттарының тізбесін, сондай-ақ жеңілдіктер мөлшерін бекіту туралы

requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 30 марта 2017 года № 75. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 апреля 2017 года № 4166. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 5 декабря 2025 года № 348 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 6 июня 2017 года № 123. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 июня 2017 года № 4220. Утратил силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 11 ноября 2021 года № 282 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Аккайынского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Аққайың ауданының аумағында ауылдық округ әкімдігіне кандидаттарға үгіттік баспа материалдарын орналастыру үшін орын белгілеу және таңдаушылармен кездесулер өткізу үшін үй-жай ұсыну туралы

requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 февраля 2017 года № 60. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 марта 2017 года № 4124. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 25 октября 2017 года № 334
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по району имени Габита Мусрепова Северо-Казахстанской области на 2017 год
  kaz: 2017 жылға арналған Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы бойынша мектепке дейiнгi тәрбие мен оқытуға мемлекеттiк бiлiм беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

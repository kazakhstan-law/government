act_code: '114534'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 4 августа 2017 года № 277. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 сентября 2017 года № 4302. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 4 декабря 2017 года № 401
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками всех кандидатов в акимы сельских округов и города Тайынша на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының аумағында ауылдық округтері және Тайынша қаласы әкімдерінің орнына барлық үміткерлерге таңдаушылармен кездесу өткізу үшін үй-жайды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

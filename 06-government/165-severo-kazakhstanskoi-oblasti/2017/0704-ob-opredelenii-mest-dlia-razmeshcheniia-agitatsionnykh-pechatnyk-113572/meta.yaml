requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 4 июля 2017 года № 202. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 июля 2017 года № 4263. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 23 февраля 2018 года № 59
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның аумағында ауылдық округтер әкімдеріне кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды анықтау және таңдаушыларымен кездесу өткізу үшін үй-жайларды ұсыну туралы

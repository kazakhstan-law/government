act_code: '113499'
requisite: Постановление акимата Северо-Казахстанской области от 13 июля 2017 года № 277. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 июля 2017 года № 4259. Утратило силу постановлением акимата Северо-Казахстанской области от 21 ноября 2017 года № 459
title:
  rus: Об установлении объемов субсидий на повышение урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте по районам  Северо-Казахстанской области на 2017 год
  kaz: 2017 жылға арналған Солтүстік Қазақстан облысының аудандары бойынша басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдарының және көктемгi егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнына және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнына арналған субсидиялар көлемдерін белгілеу туралы

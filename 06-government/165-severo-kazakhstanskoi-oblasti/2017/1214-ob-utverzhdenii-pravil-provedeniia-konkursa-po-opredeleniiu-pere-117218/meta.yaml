title:
  rus: Об утверждении Правил проведения конкурса по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по участку железной дороги Российской Федерации, расположенному на территории Северо-Казахстанской области, расходы которых подлежат субсидированию за счет областного бюджета
  kaz: Шығыстары облыстық бюджет есебінен субсидиялауға жататын Солтүстік Қазақстан облысының аумағында орналасқан Ресей Федерациясының теміржол учаскесі бойынша теміржол жолаушылар тасымалын жүзеге асыратын тасымалдаушыларды айқындау бойынша конкурс өткізу қағидаларын бекіту туралы

act_code: '114907'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 29 августа 2017 года № 160. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 сентября 2017 года № 4313. Утратило силу постановлением акимата района Шал акына Северо-Казахстанской области от 2 августа 2019 года № 145 (вводится в действие с 1 января 2019 года)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности района Шал акына Северо Казахстанской области
  kaz: Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Шал ақын ауданының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласында мамандары лауазымдарының тізбесін айқындау туралы

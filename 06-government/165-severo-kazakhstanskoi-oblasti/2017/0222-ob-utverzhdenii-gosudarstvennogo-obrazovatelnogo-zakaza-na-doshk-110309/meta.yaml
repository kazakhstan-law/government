act_code: '110309'
requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 22 февраля 2017 года № 56. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 марта 2017 года № 4085. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 9 октября 2017 года № 252
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размер подушевого финансирования и родительской платы на 2017 год в учреждениях образования района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының білім беру мекемелеріндегі 2017 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын,жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 26 мая 2017 года № 182. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 июня 2017 года № 4199. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 14 июля 2021 года № 268 (вводится в действие со дня его первого официального опубликования)
title:

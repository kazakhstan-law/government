requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 19 августа 2017 года № 216. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 сентября 2017 года № 4306
title:
  rus: О признании утратившим силу акимата Мамлютского района Северо-Казахстанской области от 29 мая 2017 года № 131 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для встреч с выборщиками кандидатов в депутаты Сената Парламента Республики Казахстан»
  kaz: «Үгіттік басылым материалдарын орналастыру орындарын белгілеу және Қазақстан Республикасы Парламенті Сенатының депутаттығына кандидаттарға таңдаушылармен кездесуі үшін үй-жайды беру туралы» Мамлют ауданы әкімдігінің 2017 жылғы 29 мамырдағы № 131 қаулысы күшін жойған

requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 29 мая 2017 года № 140. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 июня 2017 года № 4215. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 31 октября 2017 года № 278
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения кандидатам в депутаты Сената Парламента Республики Казахстан для проведения встреч с выборщиками на территории района Магжана Жумабаева
  kaz: Қазақстан Республикасы Парламенті Сенатының депутаттығына кандидаттар үшін Мағжан Жұмабаев ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орын белгілеу және таңдаушылармен кездесу үшін үй-жай ұсыну туралы

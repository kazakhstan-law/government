act_code: '112624'
requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 30 мая 2017 года № 175. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 июня 2017 года № 4213. Утратило силу постановлением акимата Уалихановского района Северо-Казахстанской области от 11 июля 2019 года № 153 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в депутаты Сената Парламента Республики Казахстан
  kaz: Қазақстан Республикасы Парламенті Сенатының депутаттығына кандидаттардың үгіттік баспа материалдарын орналастыру үшін орын анықтау және таңдаушылармен кездесулер өткізу үшін үй-жай ұсыну туралы

  title:
    rus: О внесении изменений в постановление акимата Уалихановского района Северо-Казахстанской области от 30 мая 2017 года № 175 «Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в депутаты Сената Парламента Республики Казахстан»
    kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2017 жылғы 30 мамырдағы №175 «Қазақстан Республикасы Парламенті Сенатының депутаттығына кандидаттардың үгіттік баспа материалдарын орналастыру үшін орын анықтау және таңдаушылармен кездесулер өткізу үшін үй-жай ұсыну туралы» қаулысына өзгерістер енгізу туралы

    rus: О внесении изменения в постановление акимата Жамбылского района Северо - Казахстанской области от 12 декабря 2017 года № 294 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка»
    kaz: Солтүстік Қазақстан облысы Жамбыл ауданы әкімдігінің 2017 жылғы 12 желтоқсандағы № 294 «Қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай - ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

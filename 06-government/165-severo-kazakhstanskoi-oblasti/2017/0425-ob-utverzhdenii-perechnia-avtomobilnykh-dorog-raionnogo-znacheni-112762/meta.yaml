  title:
    rus: О внесении изменения в постановление акимата Айыртауского района Северо-Казахстанской области от 25 апреля 2017 года № 131 «Об утверждении перечня автомобильных дорог общего пользования районного значения Айыртауского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Айыртау ауданы әкімдігінің 2017 жылғы 25 сәуірдегі № 131 «Солтүстік Қазақстан облысы Айыртау ауданының аудандық маңызы бар жалпы пайдаланудағы автомобиль жолдарының тізбесін бекіту туралы» қаулысына өзгеріс енгізу туралы

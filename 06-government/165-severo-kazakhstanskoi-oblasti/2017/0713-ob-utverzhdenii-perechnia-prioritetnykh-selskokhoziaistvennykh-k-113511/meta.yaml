act_code: '113511'
requisite: Постановление акимата Северо-Казахстанской области от 13 июля 2017 года № 274. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 июля 2017 года № 4256
title:
  rus: Об утверждении перечня приоритетных сельскохозяйственных культур и норм субсидий (на 1 гектар и (или) 1 тонну) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2017 год
  kaz: 2017 жылға арналған басым ауыл шаруашылығы дақылдарының тiзбесін және басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдары мен көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын (1 гектарға және (немесе) 1 тоннаға) белгілеу туралы

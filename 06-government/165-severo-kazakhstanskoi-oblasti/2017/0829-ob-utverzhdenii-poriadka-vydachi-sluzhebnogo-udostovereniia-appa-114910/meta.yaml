act_code: '114910'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 29 августа 2017 года № 159. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 сентября 2017 года № 4314. Утратило силу постановлением акимата района Шал акына Северо-Казахстанской области от 29 июня 2020 года № 151 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка выдачи служебного удостоверения аппарата акима района, аппаратов акимов сельских округов, аппарата акима города Сергеевка и исполнительных органов района Шал акына Северо-Казахстанской области, содержащихся за счет средств районного бюджета, и его описания
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданы аудандық бюджетінің қаражаты есебінен қамтылған аудан әкімі аппаратының, ауылдық округ әкімдері аппаратының, Сергеевка қаласы әкімі аппаратының және ауданның атқарушы органдарының қызметтік куәлігін беру тәртібін және оның сипаттамасын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата города Петропавловска Северо–Казахстанской области от 24 мая 2017 года № 898 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями всех кандидатов на территории города Петропавловска Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Петропавл қаласы әкімдігінің 2017 жылғы 24 мамырдағы № 898 «Солтүстік Қазақстан облысы Петропавл қаласының аумағында барлық кандидаттардың сайлаушылармен кездесуіне үй жайлар беруге және үгіттік баспа материалдарын орналастыруға арналған орындар белгілеу туралы» қаулысына өзгерістер енгізу туралы

act_code: '109875'
requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 30 января 2017 года № 26. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 февраля 2017 года № 4065. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 22 января 2021 года № 8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка выдачи служебного удостоверения аппарата акима района, аппаратов акимов сельских округов и исполнительных органов Аккайынского района Северо-Казахстанской области, содержащихся за счет средств районного бюджета, и его описания
  kaz: Аудан әкімі аппараты, ауылдық округ әкімдері аппараттарының және аудандық бюджет қаражаты есебінен ұсталатын Солтүстік Қазақстан облысы Аққайың ауданы атқарушы органдарының қызметтік куәлігін беру тәртібін және оның сипаттамасын бекіту туралы

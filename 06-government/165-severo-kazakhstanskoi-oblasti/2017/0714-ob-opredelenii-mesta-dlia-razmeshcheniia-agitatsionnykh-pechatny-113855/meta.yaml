requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 14 июля 2017 года № 244. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 июля 2017 года № 4277. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 16 ноября 2017 года № 373
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов Айыртауского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Айыртау ауданының ауылдық округтері әкімдеріне кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар анықтау және таңдаушылармен кездесулер өткізуі үшін үй-жай ұсыну туралы

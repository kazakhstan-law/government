  title:
    rus: О внесении изменения в постановление акимата Есильского района Северо-Казахстанской области от 25 сентября 2017 года № 228 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Есильского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2017 жылғы 25 қыркүйектегі № 228 «Солтүстік Қазақстан облысы Есіл ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

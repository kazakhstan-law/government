act_code: '115153'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 25 сентября 2017 года № 228. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 октября 2017 года № 4334. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 20 марта 2019 года № 65 (вводится в действие с 1 января 2019 года)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданы аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 16 июня 2017 года № 159. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 июня 2017 года № 4234. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 31 октября 2017 года № 278
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов и города Булаево на территории района Магжана Жумабаева Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының аумағында ауылдық округтері және Булаев қаласы әкімдеріне кандидаттарға үгіттік баспа материалдарын орналастыру үшін орын белгілеу және таңдаушылармен кездесулер өткізу үшін үй- жай ұсыну туралы

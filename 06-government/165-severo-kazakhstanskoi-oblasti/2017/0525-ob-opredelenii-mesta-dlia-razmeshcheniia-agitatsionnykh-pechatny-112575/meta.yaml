requisite: Постановление акимата Аккайынского района Северо-Казахстанской области от 25 мая 2017 года № 139. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 июня 2017 года № 4214. Утратило силу постановлением акимата Аккайынского района Северо-Казахстанской области от 27 октября 2017 года № 263
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения кандидатам в депутаты Сената Парламента Республики Казахстан, для проведения встреч с выборщиками на территории Аккайынского района Северо-Казахстанской области
  kaz: Қазақстан Республикасы Парламенті Сенатының депутаттығына кандидаттар үшін Солтүстік Қазақстан облысы Аққайың ауданының аумағында үгіттік баспа материалдарын орналастыру үшін орын белгілеу және таңдаушыларымен кездесу өткізу үшін үй-жай ұсыну туралы

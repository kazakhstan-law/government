title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории города Петропавловска Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Петропавл қаласының аумағында барлық кандидаттардың үгіттік баспа материалдарын орналастыруға арналған орындар белгілеу туралы

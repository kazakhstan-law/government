act_code: '113686'
requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 14 июля 2017 года № 147. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 июля 2017 года № 4271. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 12 апреля 2021 года № 77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками для всех кандидатов в акимы сельских округов на территории Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының аумағында ауылдық округ әкімдігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орынды белгілеу және таңдаушылармен кездесулер өткізу үшін үй-жай ұсыну туралы

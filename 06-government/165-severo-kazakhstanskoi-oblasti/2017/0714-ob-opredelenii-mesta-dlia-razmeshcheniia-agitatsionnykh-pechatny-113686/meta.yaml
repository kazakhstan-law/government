  requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 1 марта 2018 года № 36. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 марта 2018 года № 4595. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 12 апреля 2021 года № 77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Тимирязевского района Северо-Казахстанской области от 14 июля 2017 года № 147 «Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками для всех кандидатов в акимы сельских округов на территории Тимирязевского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданының аумағында ауылдык округ әкімдігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орынды белгілеу және таңдаушылармен кездесулер өткізу үшін үй-жай ұсыну туралы» Солтүстік Қазақстан облысы Тимирязев ауданы әкімдігінің 2017 жылғы 14 шілдедегі № 147 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/119529/rus

requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 27 марта 2017 года № 71. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 апреля 2017 года № 4165. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 29 сентября 2017 года № 248
title:
  rus: Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размер подушевого финансирования и родительской платы в Мамлютском районе Северо-Казахстанской области на 2017 год
  kaz: Солтүстік Қазақстан облысы Мамлют ауданында 2017 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы

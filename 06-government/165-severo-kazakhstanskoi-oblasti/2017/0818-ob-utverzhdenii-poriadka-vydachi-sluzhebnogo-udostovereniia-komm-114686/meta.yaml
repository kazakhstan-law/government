act_code: '114686'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 18 августа 2017 года № 192. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 сентября 2017 года № 4310. Утратило силу постановлением акимата Есильского района Северо-Казахстанской области от 5 июня 2020 года № 158 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка выдачи служебного удостоверения коммунального государственного учреждения «Аппарат акима акимата Есильского района Северо-Казахстанской области», аппаратов акимов сельских округов, исполнительных органов Есильского района Северо-Казахстанской области, содержащихся за счет средств районного бюджета, и его описания
  kaz: Аудандық бюджет қаражаты есебінен қамтылатын «Солтүстік Қазақстан облысы Есіл ауданы әкімдігі әкімінің аппараты» коммуналдық мемлекеттік мекемесінің, Солтүстік Қазақстан облысы Есіл ауылдық округтері әкімдерінің аппараттарының, атқарушы органдарының қызметтік куәлігін беру тәртібін және оның сипаттамасын бекіту туралы

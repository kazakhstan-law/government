requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 18 января 2017 года № 17. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 февраля 2017 года № 4053. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 9 июня 2020 года № 156 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственным служащим исполнительных органов района имени Габита Мусрепова Северо-Казахстанской области и его описание
  kaz: Солтүстiк Қазақстан облысы Ғабит Мүсірепов атындағы ауданның атқарушы органдарының мемлекеттік қызметшілеріне қызметтік куәлік беру қағидаларын және оның сипаттамасын бекіту туралы

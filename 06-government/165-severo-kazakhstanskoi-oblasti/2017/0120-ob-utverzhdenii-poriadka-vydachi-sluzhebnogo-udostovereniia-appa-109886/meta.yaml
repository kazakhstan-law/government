act_code: '109886'
requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 20 января 2017 года № 11. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 февраля 2017 года № 4058. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 5 июня 2020 года № 117 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка выдачи служебного удостоверения аппарата акима района, аппаратов акимов сельских округов, аппарата акима города Булаево и исполнительных органов района Магжана Жумабаева Северо-Казахстанской области, содержащихся за счет средств районного бюджета, и его описания
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы аудандық бюджетінің қаражаты есебінен қамтылған аудан әкімінің аппаратының, ауылдық округ әкімдері аппараттарының, Булаев қаласы әкімінің аппаратының және ауданның атқарушы органдарының қызметтік куәлігін беру тәртібін және оның сипаттамасын бекіту туралы

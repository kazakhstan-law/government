  title:
    rus: О признании утратившим силу постановление акимата Есильского района Северо-Казахстанской области от 30 ноября 2021 года № 363 «Об утверждении правил расчетов прогнозных объемов доходов и затрат бюджетов городов районного значения, сел, поселков, сельских округов»
    kaz: «Аудандық маңызы бар қалалардың, ауылдардың, кенттердің, ауылдық округтердің бюджеттерінің болжамды кірістері мен шығыстарын есептеу қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2021 жылғы 30 қарашадағы № 363 қаулысының күші жойылды деп тану туралы

  title:
    rus: О внесении изменения в постановление акимата Тайыншинского района Северо-Казахстанской области от 21 декабря 2021 года № 491 «Об утверждении Правил предоставления коммунальных услуг в Тайыншинском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тайынша ауданында коммуналдық қызметтер көрсету Қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Тайынша ауданы әкімдігінің 2021 жылғы 21 желтоқсандағы № 491 қаулысына өзгерістер енгізу туралы

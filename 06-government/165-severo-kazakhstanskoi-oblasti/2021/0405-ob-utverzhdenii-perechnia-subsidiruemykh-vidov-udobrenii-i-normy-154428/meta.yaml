title:
  rus: Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2021 год
  kaz: 2021 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Северо-Казахстанской области от 5 апреля 2021 года № 68 «Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2021 год»
    kaz: «2021 жылға арналған субсидияланатын тыңайтқыштар түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаржы көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2021 жылғы 5 сәуірдегі № 68 қаулысына өзгерістер енгізу туралы

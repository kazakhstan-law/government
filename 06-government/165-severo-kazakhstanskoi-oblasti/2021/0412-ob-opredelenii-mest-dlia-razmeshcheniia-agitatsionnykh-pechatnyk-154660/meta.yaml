title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының аумағында барлық кандидаттарға үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

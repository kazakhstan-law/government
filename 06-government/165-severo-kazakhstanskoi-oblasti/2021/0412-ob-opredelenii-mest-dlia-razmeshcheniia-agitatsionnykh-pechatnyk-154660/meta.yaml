  code: '158607'
  requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 8 сентября 2021 года № 232. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 сентября 2021 года № 24356
  title:
    rus: О внесении изменений в постановление акимата Тимирязевского района Северо-Казахстанской области от 12 апреля 2021 года № 77 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и предоставления кандидатам помещений для проведения встреч с избирателями на территории Тимирязевского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданының аумағында барлық кандидаттарға үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және кандидаттарға сайлаушылармен кездесу үшін үй-жайлар беру туралы» Солтүстік Қазақстан облысы Тимирязев ауданы әкімдігінің 2021 жылғы 12 сәуірдегі № 77 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/158607/rus

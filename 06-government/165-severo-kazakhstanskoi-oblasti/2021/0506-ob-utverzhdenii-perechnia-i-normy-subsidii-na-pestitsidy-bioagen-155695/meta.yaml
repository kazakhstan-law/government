  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 6 мая 2021 года № 92 «Об утверждении перечня и нормы субсидий на пестициды, биоагенты (энтомофаги), а также объемы бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2021 год»
    kaz: «2021 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2021 жылғы 6 мамырдағы № 92 қаулысына өзгеріс енгізу туралы

act_code: '154663'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 14 апреля 2021 года № 66. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 апреля 2021 года № 7291
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам в Мамлютском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданында елді мекендерге бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Мамлютского района Северо-Казахстанской области от 14 апреля 2021 года № 66 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Мамлютка»
    kaz: «Мамлютка қаласына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің 2021 жылғы 14 сәуірдегі № 66 қаулысына өзгерістер енгізу туралы

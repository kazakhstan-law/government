  title:
    rus: О внесении изменения в постановление акимата Тимирязевского района Северо-Казахстанской области от 12 апреля 2021 года № 77 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории Тимирязевского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданының аумағында барлық кандидаттарға үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы» Солтүстік Қазақстан облысы Тимирязев ауданы әкімдігінің 2021 жылғы 12 сәуірдегі № 77 қаулысына өзгеріс енгізу туралы

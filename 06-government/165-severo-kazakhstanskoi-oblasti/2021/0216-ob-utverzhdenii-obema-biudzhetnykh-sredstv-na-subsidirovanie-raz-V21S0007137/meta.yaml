    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 16 февраля 2021 года № 30 «Об утверждении объема бюджетных средств на субсидирование развития семеноводства по Северо-Казахстанской области на 2021 год»
    kaz: «2021 жылға арналған Солтүстік Қазақстан облысы бойынша тұқым шаруашылығын дамытуды субсидиялауға арналған бюджет қаражатының көлемін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2021 жылғы 16 ақпандағы № 30 қаулысына өзгеріс енгізу туралы

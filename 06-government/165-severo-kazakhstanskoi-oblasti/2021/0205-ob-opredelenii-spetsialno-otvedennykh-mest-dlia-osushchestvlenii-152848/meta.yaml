  title:
    rus: О внесении изменения в постановление акимата Кызылжарского района Северо-Казахстанской области от 5 февраля 2021 года № 47 «Об определении специально отведенных мест для осуществления выездной торговли на территории Кызылжарского района Северо-Казахстанской области»

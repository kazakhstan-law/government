  title:
    rus: О внесении изменений в постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 6 мая 2021 года № 117 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с избирателями для всех кандидатов на территории района Магжана Жумабаева Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының аумағында барлық кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі үшін үй-жайлар ұсыну туралы» Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы әкімдігінің 2021 жылғы 6 мамырдағы № 117 қаулысына өзгерістер енгізу туралы

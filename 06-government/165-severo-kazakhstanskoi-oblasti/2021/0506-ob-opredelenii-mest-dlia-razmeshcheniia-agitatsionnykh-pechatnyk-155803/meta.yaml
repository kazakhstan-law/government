title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

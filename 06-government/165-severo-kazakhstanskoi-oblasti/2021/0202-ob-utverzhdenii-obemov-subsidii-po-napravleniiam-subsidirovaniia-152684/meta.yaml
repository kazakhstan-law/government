  title:
    rus: О внесении изменений и дополнений в постановление акимата Северо-Казахстанской области от 2 февраля 2021 года № 15 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства по Северо-Казахстанской области на 2021 год»
    kaz: «2021 жылға арналған Солтүстік Қазақстан облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2021 жылғы 2 ақпандағы № 15 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '152684'
requisite: Постановление акимата Северо-Казахстанской области от 2 февраля 2021 года № 15. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 февраля 2021 года № 7113
title:
  rus: Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Северо-Казахстанской области на 2021 год
  kaz: 2021 жылға арналған Солтүстік Қазақстан облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, ауыл шаруашылығы жануарларының аналық басына арналған жемшөп шығындарының құнын арзандатуға субсидиялар нормативтерін, субсидия алушыларға қойылатын өлшемшарттарын және субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы

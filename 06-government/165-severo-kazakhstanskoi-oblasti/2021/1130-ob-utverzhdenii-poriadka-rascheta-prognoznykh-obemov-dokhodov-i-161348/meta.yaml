title:
  rus: Об утверждении порядка расчета прогнозных объемов доходов и затрат бюджетов сельских округов акимата Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің ауылдық округтер бюджеттерінің кірістері мен шығындарының болжамды көлемін есептеу тәртібін бекіту туралы

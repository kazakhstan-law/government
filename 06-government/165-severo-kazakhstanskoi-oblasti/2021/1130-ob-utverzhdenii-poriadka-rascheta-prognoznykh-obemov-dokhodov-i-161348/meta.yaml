  title:
    rus: О внесении изменений в постановление акимата Есильского района Северо-Казахстанской области от 30 ноября 2021 года № 363 «Об утверждении правил расчетов прогнозных объемов доходов и затрат бюджетов городов районного значения, сел, поселков, сельских округов»
    kaz: «Аудандық маңызы бар қалалар, ауылдар, кенттер, ауылдық округтер бюджеттерінің кірістері мен шығындарының болжамды көлемін есептеу қағидасын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2021 жылғы 30 қарашадағы № 363 қаулысына өзгерістер енгізу туралы

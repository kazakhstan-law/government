act_code: '73438'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 9 июля 2013 года № 206. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 июля 2013 года № 2310. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 8 августа 2013 года № 267
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещения для проведения встреч с выборщиками кандидатов в акимы города Мамлютка и сельских округов на территории Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының аумағында үгiттiк баспа материалдарын орналастыру орындарын және Мамлютка қаласы және селолық округтердің әкімдеріне үмiткерлердiң таңдаушылармен кездесулерiн өткiзу үшiн үй-жайларды белгiлеу туралы

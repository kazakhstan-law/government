requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 19 сентября 2013 года № 315. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 сентября 2013 года № 2372. Утратило силу (письмо акимата района имени Габита Мусрепова Северо-Казахстанской области от 5 июня 2014 года № 6.1.2-3/817)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в депутаты Северо-Казахстанского областного маслихата вместо выбывших на территории района имени Габита Мусрепова
  kaz: Ғабит Мүсірепов атындағы аудан аумағында шығып қалғандардың орнына Солтүстік Қазақстан облыстық мәслихаттың депутаттығына кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды және сайлаушылармен кездесуіне арналған үй-жайларды анықтау туралы

requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 20 сентября 2013 года № 474. Зарегистрировано Департаментом юситиции Северо-Казахстанской области 30 сентября 2013 года № 2373. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 20 октября 2014 года № 521.
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещения для проведения встреч с избирателями кандидатов в депутаты вместо выбывшего на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданы аумағында үгіт-насихат баспа материалдарын орналастыруға арналған орындар және шығып қалған депутаттардың орнына кандидаттардың сайлаушыларымен кездесулер өткізуге рналған үй-жайды анықтау туралы

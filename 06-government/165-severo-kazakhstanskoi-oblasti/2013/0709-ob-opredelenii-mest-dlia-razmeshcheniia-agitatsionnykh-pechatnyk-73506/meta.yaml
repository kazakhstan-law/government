requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 9 июля 2013 года № 167. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 июля 2013 года № 2323. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 6 сентября 2013 года № 244
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданы аумағындағы ауылдық округтер әкімдеріне кандидаттардың таңдаушылармен кездесулер өткізу үшін үгіттік баспа материалдарын орналастыру және үй-жай орындарды анықтау туралы

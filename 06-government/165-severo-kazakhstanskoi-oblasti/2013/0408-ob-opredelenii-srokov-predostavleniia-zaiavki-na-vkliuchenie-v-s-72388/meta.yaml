title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Жамбылскому району Северо-Казахстанской области в 2013 году
  kaz: 2013 жылы Солтүстік Қазақстан облысы Жамбыл ауданы бойынша субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша егудің оңтайлы мерзімдері және субсидия алушылардың тізіміне қосуға өтініштерді ұсыну мерзімдерін анықтау туралы

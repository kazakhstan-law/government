act_code: '75030'
requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 22 октября 2013 года № 297. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 октября 2013 года № 2390. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 26 декабря 2013 года № 387
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставления помещения для проведения встреч с выборщиками кандидатов в акимы Ленинского сельского округа Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданының Ленинский ауылдық округі әкіміне кандидаттардың таңдаушылармен кездесулер өткізу үшін үй-жайды және үгіттік баспа материалдарын орналастыру үшін орындар анықтау туралы

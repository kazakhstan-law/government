act_code: '71328'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 4 февраля 2013 года № 69. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 марта 2013 года № 2197. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 23 мая 2013 года № 194
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача справок в пенсионные фонды, банки для распоряжения вкладами несовершеннолетних детей, в территориальные подразделения Комитета дорожной полиции Министверства внутренних дел Республики Казахстан для оформления наследства несовершеннолетним детям"
  kaz: «Зейнетақы қорларына, банктерге кәмелетке толмағандардың салымдарына иелік ету үшін, Қазақстан Республикасы Ішкі істер министрлігі Жол полициясы комитетінің аумақтық бөлімшелеріне кәмелетке толмаған балаларға мұраны ресімдеу үшін анықтамалар беру» электрондық мемлекеттiк қызмет көрсету регламентін бекіту туралы

act_code: '71329'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 4 февраля 2013 года № 67. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 марта 2013 года № 2198. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 23 мая 2013 года № 194
title:
  rus: Об утверждении регламента электронной государственной услуги "Постановка на учет и очередность граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" электрондық мемлекеттік қызмет регламентін бекіту туралы'

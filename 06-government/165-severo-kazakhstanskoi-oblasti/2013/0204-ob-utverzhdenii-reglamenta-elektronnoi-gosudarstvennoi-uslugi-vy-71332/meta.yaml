act_code: '71332'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 4 февраля 2013 года № 71. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 марта 2013 года № 2201. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 23 мая 2013 года № 194
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача справок органов, осуществляющих функции по опеке и попечительству для оформления сделок с имуществом, принадлежащим на праве собственности несовершеннолетним детям"
  kaz: '"Кәмелетке толмағандарға меншік құқығында тиесілі мүлікпен мәмілелерді ресімдеу үшін қорғаншылық немесе қамқоршылық жөніндегі функцияларды жүзеге асыратын органдардың анықтамаларын беру" электрондық мемлекеттік қызмет регламентін бекіту туралы'

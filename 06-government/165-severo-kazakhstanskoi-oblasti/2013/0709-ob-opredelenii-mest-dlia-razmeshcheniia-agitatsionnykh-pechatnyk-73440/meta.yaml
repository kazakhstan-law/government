requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 9 июля 2013 года № 232. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 12 июля 2013 года № 2317. Утратило силу (письмо акимата района имени Габита Мусрепова Северо-Казахстанской области от 5 июня 2014 года № 6.1.2-3/817)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы аумағында ауылдық округтер әкімдеріне кандидаттардың сайлаушылармен кездесу үшін үй-жай беру және үгіттік баспа материалдарды орналастыру үшін орындарды анықтау туралы

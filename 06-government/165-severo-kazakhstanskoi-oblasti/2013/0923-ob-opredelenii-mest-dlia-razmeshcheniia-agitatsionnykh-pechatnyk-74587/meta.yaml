requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 23 сентября 2013 года № 302. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 октября 2013 года № 2374. Утратило силу постановлением акимата Уалихановского района Северо-Казахстанской области от 11 июля 2019 года № 153 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

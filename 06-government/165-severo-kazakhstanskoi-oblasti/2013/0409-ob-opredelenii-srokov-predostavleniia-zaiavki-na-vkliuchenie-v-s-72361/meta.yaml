requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 9 апреля 2013 года № 144. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 мая 2013 года № 2262. Утратило силу (письмо акимата района имени Габита Мусрепова Северо-Казахстанской области от 5 июня 2014 года № 6.1.2-3/817)
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальные сроки сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по району имени Габита Мусрепова на 2013 год
  kaz: 2013 жылға арналған Ғабит Мүсірепов атындағы аудан бойынша субсидия алушылар тізіміне енгізуге өтінім ұсыну мерзімдерін және субсидияланатын басымды ауыл шаруашылық дақылдардың әр түрлері бойынша егудің оңтайлы мерзімдерін анықтау туралы

title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов и города Сергеевка района Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданының Сергеевка қаласы және ауылдық округі әкімдеріне кандидаттардың таңдаушылармен кездесулер өткізу үшін үгіттік баспа материалдарын орналастыру және үй-жай орындарды анықтау туралы

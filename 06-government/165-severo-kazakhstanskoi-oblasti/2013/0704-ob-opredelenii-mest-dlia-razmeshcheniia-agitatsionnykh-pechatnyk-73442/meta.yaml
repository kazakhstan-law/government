requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 4 июля 2013 года № 308. Зарегистрировано Департаментом юситиции Северо-Казахстанской области 12 июля 2013 года № 2319. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 20 октября 2014 года № 521.
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов и города Тайынши на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының аумағында Тайынша қаласы мен селолық округ әкімдеріне үміткерлердің таңдаушылармен кездесулерді өткізу үшін үй-жайларды және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының аумағында селолық округтер әкімдеріне кандидаттардың үгіттік баспа материалдарын орналастыру орындарын және таңдаушыларымен кездесулерін өткізу үшін үй-жайларды белгілеу туралы

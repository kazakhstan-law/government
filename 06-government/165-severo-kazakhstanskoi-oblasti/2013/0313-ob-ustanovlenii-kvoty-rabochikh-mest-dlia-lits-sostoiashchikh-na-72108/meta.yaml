requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 13 марта 2013 года № 111. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 апреля 2013 года № 2243. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 28 января 2015 года № 35
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығын айыру орындарынан босатылған тұлғалар және интернаттық ұйымдардың кәмелетке толмаған мектеп бітірушілері үшін жұмыс орындарына квота белгілеу туралы

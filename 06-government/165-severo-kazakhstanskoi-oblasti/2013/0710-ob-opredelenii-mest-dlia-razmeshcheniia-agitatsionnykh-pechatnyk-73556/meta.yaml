title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Айыртауского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Айыртау ауданының аумағында ауылдық округтердің әкімдеріне кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар анықтау және таңдаушылармен кездесуі үшін үй-жай ұсыну туралы

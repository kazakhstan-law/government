requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 5 июля 2013 года № 221. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 12 июля 2013 года № 2320. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 16 сентября 2013 года № 324
title:

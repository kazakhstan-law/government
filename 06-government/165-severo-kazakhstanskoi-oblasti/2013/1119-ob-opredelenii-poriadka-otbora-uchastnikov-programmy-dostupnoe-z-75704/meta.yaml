requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 19 ноября 2013 года № 2198. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 декабря 2013 года № 2416. Утратило силу постановлением акимата города Петропавловска Северо-Казахстанской области от 27 февраля 2015 года № 432
title:
  rus: Об определении порядка отбора участников Программы "Доступное жилье - 2020" по линии жилищного строительного сберегательного банка Казахстана для молодых семей и предоставления им жилья
  kaz: Жас отбасылар үшін Қазақстанның тұрғын үй құрылыс жинақ банкі жүйесі арқылы тұрғын үй бағыты бойынша "Қолжетімді тұрғын үй - 2020" бағдарламасына қатысушыларды іріктеу тәртібін және оларға тұрғын үй беру кезектілігін анықтау туралы

  title:
    rus: О внесении изменении в постановление акимата города Петропавловска от 19 ноября 2013года № 2198 "Об определении порядка отбора участников Программы "Доступное жилье - 2020" по направлению - жилье по линии жилищного строительного сберегательного банка Казахстана для молодых семей и очередности предоставления им жилья"
    kaz: '"Жас отбасылар үшін Қазақстанның тұрғын үй құрылыс жинақ банкі жүйесі арқылы тұрғын үй бағыты бойынша «Қолжетімді тұрғын үй - 2020" бағдарламасына қатысушыларды іріктеу тәртібін және оларға тұрғын үй беру кезектілігін анықтау туралы» Петропавл қаласы әкімдігінің 2013 жылғы 19 қарашадағы № 2198 қаулысына өзгеріс енгізу туралы'

requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 25 января 2013 года № 114. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 февраля 2013 года № 2194. Утратило силу постановлением акимата города Петропавловска от 3 апреля 2013 года № 595
title:
  rus: Об определении мест в городе Петропавловске для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями кандидатов в депутаты Северо-Казахстанского областного маслихата и Петропавловского городского маслихата
  kaz: Петропавл қаласында Солтүстік Қазақстан облыстық мәслихаты және Петропавл қалалық мәслихатының депутаттығына кандидаттардың сайлаушылармен кездесуіне үй-жайлар беруге және үгіттік баспа материалдарын орналастыруға арналған орындар белгілеу туралы

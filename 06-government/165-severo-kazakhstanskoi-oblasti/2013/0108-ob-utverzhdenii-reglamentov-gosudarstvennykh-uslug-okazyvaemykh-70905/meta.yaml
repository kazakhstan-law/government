requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 8 января 2013 года № 31. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 февраля 2013 года № 2166. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 23 мая 2013 года № 194
title:
  rus: Об утверждении регламентов государственных услуг, оказываемых государственным учреждением "Отдел образования района имени Габита Мусрепова", аппаратами акимов аульных (сельских) округов в сфере образования
  kaz: Білім беру саласында "Ғабит Мүсірепов атындағы ауданның білім бөлімі" мемлекеттік мекемесімен, ауылдық (селолық) округтер аппараттарымен көрсетілетін мемлекеттік қызметтер регламенттерін бекіту туралы

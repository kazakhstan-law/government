requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 17 июля 2013 года № 210. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 июля 2013 года № 2328. Утратило силу постановлением акимата Акжарского района Северо-Казахстанской области от 21 февраля 2018 года № 13
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещение для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Акжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданы аумағында үгіт-насихат баспа материалдарын орналастыруға арналған орындар мен ауылдық округтердің әкімі қызметіне кандидаттарды таңдаушылармен кездесулер өткізуге арналған үй-жай анықтау туралы

requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 23 октября 2013 года № 530. Зарегистрировано Департаментом юситиции Северо-Казахстанской области 1 ноября 2013 года № 2393. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 20 октября 2014 года № 521
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельского округа вместо выбывшего на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының аумағында шығып қалған селолық округ әкімінің орнына үміткерлердің таңдаушылармен кездесулерді өткізу үшін үй-жайларды және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

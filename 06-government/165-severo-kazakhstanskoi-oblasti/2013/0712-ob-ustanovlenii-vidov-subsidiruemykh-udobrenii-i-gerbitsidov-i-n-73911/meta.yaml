act_code: '73911'
requisite: Постановление акимата Северо-Казахстанской области от 12 июля 2013 года № 241. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 августа 2013 года № 2344. Утратило силу в связи с истечением срока действия (письмо аппарата акима Северо-Казахстанской области от 1 июля 2015 года № 1.14-7/1840)
title:
  rus: Об установлении видов субсидируемых удобрений и гербицидов и норм субсидий на 1 тонну (литр, килограмм) удобрений, реализованных производителями, на 1 тонну (литр, килограмм) удобрений, приобретенных у поставщика удобрений и (или) у иностранных производителей удобрений, на 1 килограмм (литр) гербицидов, приобретенных у поставщиков гербицидов на 2013 год
  kaz: 2013 жылға арналған субсидияланатын тыңайтқыш пен гербицид түрлерiн және өндiрушiлер сатқан тыңайтқыштардың 1 тоннасына (литрiне, килограмына), тыңайтқыш жеткiзушiден және (немесе) шетелдiк тыңайтқыш өндiрушiлерден  сатып алынған тыңайтқыштардың 1 тоннасына (литрiне, килограмына), гербицид жеткiзушiлерден сатып алынған гербицидтердiң 1 килограмына (литрiне) арналған субсидиялар нормаларын белгiлеу туралы

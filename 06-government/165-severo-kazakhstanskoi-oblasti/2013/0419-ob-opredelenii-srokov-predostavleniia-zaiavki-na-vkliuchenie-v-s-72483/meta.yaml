  kaz: 2013 жылы Солтүстік Қазақстан облысы Шал ақын ауданы бойынша 2013 жылы субсидия алатындардың тізіміне енгізуге өтінім ұсынудың мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша егіс жүргізудің оңтайлы мерзімдерін белгілеу туралы

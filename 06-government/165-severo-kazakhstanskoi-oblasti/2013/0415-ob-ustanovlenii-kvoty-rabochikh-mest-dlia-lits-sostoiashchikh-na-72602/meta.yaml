requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 15 апреля 2013 года № 108. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 мая 2013 года № 2286. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 23 января 2015 года № 10
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған тұлғалар, сондай-ақ бас бостандығынан айыру орындарынан босатылған тұлғалар және интернаттық ұйымдардың кәмелетке толмаған түлектері үшін жұмыс орындарына квота белгілеу туралы

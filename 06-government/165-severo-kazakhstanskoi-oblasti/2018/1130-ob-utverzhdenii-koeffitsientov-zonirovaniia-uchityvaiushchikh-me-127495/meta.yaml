act_code: '127495'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 30 ноября 2018 года № 365. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 декабря 2018 года № 5086. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 26 января 2026 года № 8 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении коэффициентов зонирования, учитывающих месторасположение объектов налогообложения в населенных пунктах района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Салық салу объектілерінің Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның елді мекендерінде орналасуын ескеретін аймаққа бөлу коэффициенттерін бекіту туралы

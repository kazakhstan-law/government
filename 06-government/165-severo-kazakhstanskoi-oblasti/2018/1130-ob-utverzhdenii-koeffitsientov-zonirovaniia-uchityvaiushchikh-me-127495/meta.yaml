  requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 11 декабря 2019 года № 306. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 декабря 2019 года № 5727. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 26 января 2026 года № 8 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 30 ноября 2018 года № 365 «Об утверждении коэффициентов зонирования, учитывающих месторасположение объектов налогообложения в населенных пунктах района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындығы аудан әкімдігінің 2018 жылғы 30 қарашадағы  № 365 «Салық салу объектілерінің Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның елді мекендерінде орналасуын ескеретін аймаққа бөлу коэффициенттерін бекіту туралы» қаулысына өзгеріс енгізу туралы

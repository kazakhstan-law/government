act_code: '123966'
requisite: Постановление акимата Северо-Казахстанской области от 12 июля 2018 года № 192. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 августа 2018 года № 4872. Утратило силу постановлением акимата Северо-Казахстанской области от 9 декабря 2019 года № 316 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача справки о наличии (отсутствии) в постоянном пользовании жилища из коммунального жилищного фонда или жилища, арендованного местным исполнительным органом в частном жилищном фонде, гражданам, нуждающимся в жилище из жилищного фонда государственного предприятия либо государственного учреждения»
  kaz: «Мемлекеттік кәсіпорынның не мемлекеттік мекеменің тұрғын үй қорынан тұрғын үйге мұқтаж азаматтарға тұрақты пайдалануында коммуналдық тұрғын үй қорынан берілген тұрғын үйдің немесе жергілікті атқарушы орган жеке тұрғын үй қорынан жалдаған тұрғын үйдің болуы (болмауы) туралы анықтама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

    kaz: «Петропавл қаласының аумағында көшпелі сауданы жүзеге асыру үшін арнайы бөлінген орындарды белгілеу туралы» Солтүстік Қазақстан облысы Петропавл қаласы әкімдігінің 2018 жылғы 29 желтоқсандағы № 1967 қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата Северо-Казахстанской области от 11 апреля 2018 года № 98. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 апреля 2018 года № 4681. Утратило силу постановлением акимата Северо-Казахстанской области от 19 ноября 2019 года № 300 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Аттестация производителей оригинальных, элитных семян, семян первой, второй и третьей репродукций и реализаторов семян»
  kaz: «Бірегей және элиталық тұқымдар, бірінші, екінші және үшінші көбейтілген тұқым өндірушілерді, тұқым өткізушілерді аттестаттау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

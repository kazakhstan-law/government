act_code: '125328'
requisite: Постановление акимата Северо-Казахстанской области от 1 октября 2018 года № 275. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 октября 2018 года № 4944
title:
  rus: О признании утратившим силу постановления акимата Северо-Казахстанской области от 19 июня 2017 года № 246 «Об установлении форм и сроков предоставления страхователем, страховщиком, агентом и обществом взаимного страхования в растениеводстве информации и документов, необходимых для осуществления им контрольных функций»
  kaz: «Өздерінің бақылау функцияларын жүзеге асыру үшін қажетті ақпарат пен құжаттарды сақтанушының, сақтандырушының, агенттің және өсімдік шаруашылығындағы өзара сақтандыру қоғамының ұсыну нысандары мен мерзімдерін белгілеу туралы» Солтүстік Қазақстан облысы әкімдігінің 2017 жылғы 19 маусымдағы № 246 қаулысының күші жойылғанын тану туралы

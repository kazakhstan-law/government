  title:
    rus: О внесении дополнений в постановление акимата Северо-Казахстанской области от 27 декабря 2018 года № 375 «Об определении Перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы әкімдігінің 2018 жылғы 27 желтоқсандағы № 375 қаулысына толықтырулар енгізу туралы

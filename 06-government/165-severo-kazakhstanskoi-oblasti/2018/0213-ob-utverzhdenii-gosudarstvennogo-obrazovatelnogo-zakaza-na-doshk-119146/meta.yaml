    kaz: «2018 жылға арналған Солтүстік Қазақстан облысының Есіл ауданында мектепке дейiнгi тәрбие мен оқытуға мемлекеттiк бiлiм беру тапсырысын, ата-ана төлемақысының мөлшерін бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2018 жылғы 13 ақпандағы № 32 қаулысына өзгеріс енгізу туралы

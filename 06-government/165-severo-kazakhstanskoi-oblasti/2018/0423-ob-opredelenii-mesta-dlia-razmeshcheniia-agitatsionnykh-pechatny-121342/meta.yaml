requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 23 апреля 2018 года № 95. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 апреля 2018 года № 4685. Утратило силу постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 9 июля 2021 года № 168 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов и города Булаево на территории района Магжана Жумабаева Северо-Казахстанской области
  kaz: Cолтүстік Қазақстан облысы Мағжан Жұмабаев ауданының аумағында ауылдық округтері және Булаев қаласы әкімдеріне кандидаттарға үгіттік баспа материалдарын орналастыру үшін орын белгілеу және таңдаушылармен кездесулер өткізу үшін үй-жай ұсыну туралы кездесулер өткізу үшін үй-жай ұсыну туралы

title:
  rus: Об определении Перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы

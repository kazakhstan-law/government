  title:
    rus: О внесении изменений в постановление акимата Северо-Казахстанской области от 27 декабря 2018 года № 375 «Об определении Перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар салаларындағы мамандар лауазымдарының тізбесін айқындау туралы» Солтүстік Қазақстан облысы әкімдігінің 2018 жылғы 27 желтоқсандағы № 375 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164976/rus

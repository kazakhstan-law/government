act_code: '125998'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 9 ноября 2018 года № 336. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 ноября 2018 года № 4989. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 26 декабря 2019 года № 320 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан аумағындағы азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

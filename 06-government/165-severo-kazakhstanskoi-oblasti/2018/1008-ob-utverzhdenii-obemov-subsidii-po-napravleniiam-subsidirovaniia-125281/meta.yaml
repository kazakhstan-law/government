    kaz: «2018 жылға арналған Солтүстік Қазақстан облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2018 жылғы 8 қазандағы № 282 қаулысына өзгеріс енгізу туралы

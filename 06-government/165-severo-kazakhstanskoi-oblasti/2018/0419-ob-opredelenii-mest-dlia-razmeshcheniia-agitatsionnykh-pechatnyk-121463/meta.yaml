requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 19 апреля 2018 года № 128. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 мая 2018 года № 4705. Утратило силу постановлением акимата района имени Габита Мусрепова Северо-Казахстанской области от 2 декабря 2020 года № 309 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының аумағында ауылдық округтер әкімдеріне кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындарды анықтау және таңдаушыларымен кездесу өткізу үшін үй-жайларды ұсыну туралы

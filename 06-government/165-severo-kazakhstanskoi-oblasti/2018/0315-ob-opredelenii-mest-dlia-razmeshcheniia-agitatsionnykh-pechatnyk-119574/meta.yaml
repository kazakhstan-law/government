requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 15 марта 2018 года № 75. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 марта 2018 года № 4607. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 14 июля 2021 года № 268 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками всех кандидатов в акимы сельских округов и города Тайынша на территории Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданы аумағының ауылдық округтері мен Тайынша қаласы әкімдерінің орнына барлық үміткерлерге таңдаушылармен кездесу өткізу үшін үй-жайды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу туралы

act_code: '119653'
requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 3 марта 2018 года № 38. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 марта 2018 года № 4608. Утратило силу постановлением акимата Тимирязевского района Северо-Казахстанской области от 12 июня 2020 года № 114 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

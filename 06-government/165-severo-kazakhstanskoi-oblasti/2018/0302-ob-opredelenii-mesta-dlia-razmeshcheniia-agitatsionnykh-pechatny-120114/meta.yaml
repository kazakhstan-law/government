act_code: '120114'
requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 2 марта 2018 года № 46. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 марта 2018 года № 4615. Утратило силу постановлением акимата Уалихановского района Северо-Казахстанской области от 11 июля 2019 года № 153 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками для всех кандидатов в акимы сельских округов на территории Уалихановского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Уәлиханов ауданының аумағында ауылдық округ әкімдігіне барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орынды белгілеу және таңдаушылармен кездесулер өткізу үшін үй-жай ұсыну туралы

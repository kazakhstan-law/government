act_code: '127490'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 24 декабря 2018 года № 287. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 декабря 2018 года № 5097. Утратило силу постановлением акимата Жамбылского района Северо-Казахстанской области от 19 июля 2021 года № 182 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещений для встреч с избирателями для всех кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Жамбылского района Северо - Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының аумағында Қазақстан Республикасы Парламентінің Мәжілісіне, облыстық және аудандық мәслихаттардың депутаттығына барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін үй - жайларды ұсыну туралы

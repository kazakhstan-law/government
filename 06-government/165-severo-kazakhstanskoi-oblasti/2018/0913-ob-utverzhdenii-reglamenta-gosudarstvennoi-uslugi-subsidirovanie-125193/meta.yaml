requisite: Постановление акимата Северо-Казахстанской области от 13 сентября 2018 года № 264. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 12 октября 2018 года № 4925. Утратило силу постановлением акимата Северо-Казахстанской области от 11 апреля 2019 года № 85 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства продуктов ее глубокой переработки»

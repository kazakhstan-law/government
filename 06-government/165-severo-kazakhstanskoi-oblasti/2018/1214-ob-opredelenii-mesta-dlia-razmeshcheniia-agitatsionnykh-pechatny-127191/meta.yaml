act_code: '127191'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 14 декабря 2018 года № 340. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 декабря 2018 года № 5092. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 8 мая 2019 года № 91 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об определении места для размещения агитационных печатных материалов для всех кандидатов и предоставлении помещения для встреч с выборщиками в акимы сельских округов и города Мамлютка на территории Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының аумағында ауылдық округтер мен Мамлютка қаласы әкімдеріне барлық кандидаттар үшін үгiттiк баспа материалдарын орналастыру үшін орын белгiлеу және таңдаушылармен кездесуі үшiн үй-жай беру туралы

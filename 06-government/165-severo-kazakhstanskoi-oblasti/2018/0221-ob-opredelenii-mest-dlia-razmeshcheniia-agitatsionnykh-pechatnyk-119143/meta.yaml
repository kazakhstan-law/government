act_code: '119143'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 21 февраля 2018 года № 13. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 февраля 2018 года № 4585
title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории Акжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орын белгілеу туралы

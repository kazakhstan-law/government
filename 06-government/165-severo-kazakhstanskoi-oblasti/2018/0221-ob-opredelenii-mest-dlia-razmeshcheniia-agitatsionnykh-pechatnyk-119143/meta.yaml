  title:
    rus: О внесении изменении и дополнения в постановление акимата Акжарского района Северо-Казахстанской области от 21 февраля 2018 года № 13 «Об определении места для размещения агитационных печатных материалов и предоставлении помещения для проведения встреч с выборщиками кандидатов в акимы сельских округов на территории Акжарского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2018 жылғы 21 ақпандағы № 13 «Солтүстік Қазақстан облысы Ақжар ауданы аумағында үгіттік баспа материалдарын орналастыруға арналған орын мен ауылдық округтердің әкімі қызметіне кандидаттарды таңдаушылармен кездесулер өткізуге арналғанүй-жай анықтау туралы» қаулысына өзгерістер мен толықтыру енгізу туралы

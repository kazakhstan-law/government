requisite: Постановление акимата Северо-Казахстанской области от 2 мая 2018 года № 118. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 мая 2018 года № 4708. Утратило силу постановлением акимата Северо-Казахстанской области от 4 декабря 2018 года № 334
title:
  rus: Об утверждении перечня приоритетных сельскохозяйственных культур и норм субсидий на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2018 год
  kaz: 2018 жылға арналған басым ауыл шаруашылығы дақылдарының тiзбесін және басым дақылдар өндіруді субсидиялау жолымен өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдары мен көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Айыртауского района Северо-Казахстанской области от 5 мая 2022 года № 159 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Айыртаускому району»
    kaz: Солтүстік Қазақстан облысы Айыртау аудан әкімдігінің 2022 жылғы 5 мамырдағы № 159 «Айыртау ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

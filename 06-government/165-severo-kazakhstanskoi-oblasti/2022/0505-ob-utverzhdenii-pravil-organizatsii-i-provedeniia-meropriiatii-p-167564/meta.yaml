requisite: Постановление акимата Айыртауского района Северо-Казахстанской области от 5 мая 2022 года № 159. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2022 года № 27935. Утратило силу постановлением акимата Айыртауского района Северо-Казахстанской области от 19 марта 2025 года № 94 (вводится в действие по истечении десяти календарных дней после первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Айыртаускому району
  kaz: Айыртау ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы

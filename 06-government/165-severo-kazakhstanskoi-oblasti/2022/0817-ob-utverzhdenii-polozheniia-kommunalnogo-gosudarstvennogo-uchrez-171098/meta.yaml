title:
  rus: Об утверждении Положения коммунального государственного учреждения «Отдел архитектуры, строительства, жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің сәулет, құрылыс, тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі және автомобиль жолдары бөлімі» коммуналдық мемлекеттік мекемесінің Ережесін бекіту туралы

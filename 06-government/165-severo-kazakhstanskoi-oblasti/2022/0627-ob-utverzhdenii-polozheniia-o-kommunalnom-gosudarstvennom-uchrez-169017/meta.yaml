  kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы

    rus: О внесении изменения и дополнения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 27 июня 2022 года № 154 «Об утверждении Положения о коммунальном государственном учреждении «Отдел занятости и социальных программ акимата района имени Габита Мусрепова Северо-Казахстанской области»

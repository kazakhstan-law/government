    rus: О внесении изменения в постановление акимата Есильского района Северо-Казахстанской области от 29 апреля 2022 года № 99 «Об утверждении Правил предоставления коммунальных услуг в Есильском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданында коммуналдық көрсетілетін қызметтерді ұсыну қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2022 жылғы 29 сәуірдегі № 99 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 27 июня 2022 года № 154 «Об утверждении Правил организации и проведения мероприятий Об утверждении Положения о коммунальном государственном учреждении «Отдел занятости и социальных программ акимата района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2022 жылғы 27 маусымдағы № 154 қаулысына өзгеріс енгізу туралы

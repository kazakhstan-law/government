    rus: О внесении изменения и дополнения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 27 июня 2022 года № 154 «Об утверждении Положения о коммунальном государственном учреждении «Отдел занятости и социальных программ акимата района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2022 жылғы 27 маусымдағы № 154 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы» қаулысына өзгеріс пен толықтыру енгізу туралы

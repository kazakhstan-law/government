act_code: '165175'
requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 3 марта 2022 года № 33. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 марта 2022 года № 27087
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Булаево
  kaz: Булаев қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

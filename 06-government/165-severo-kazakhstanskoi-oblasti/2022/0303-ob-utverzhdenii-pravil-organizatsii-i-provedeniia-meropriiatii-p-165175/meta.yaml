  title:
    rus: О внесении изменений в постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 03 марта 2022 года № 33 «Об утверждении Правил организации и проведения мероприятий по текущему ремонту или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Булаево»
    kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы әкімдігінің 2022 жылғы 03 наурыздағы № 33 «Булаев қаласына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/230595/rus

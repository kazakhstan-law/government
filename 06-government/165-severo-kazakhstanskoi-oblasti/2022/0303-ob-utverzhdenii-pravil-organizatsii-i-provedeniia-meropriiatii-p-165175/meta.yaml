  title:
    rus: О внесении изменений в постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 3 марта 2022 года № 33 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Булаево»
    kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы әкімдігінің 2022 жылғы 3 наурыздағы № 33 «Булаев қаласына бірыңғай сәулеттік көрініс беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

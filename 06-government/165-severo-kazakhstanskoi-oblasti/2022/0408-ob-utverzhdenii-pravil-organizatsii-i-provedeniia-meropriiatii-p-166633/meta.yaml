  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 8 апреля 2022 года № 85 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам района имени Габита Мусрепова»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2022 жылғы 8 сәуірдегі № 85 «Ғабит Мүсірепов атындағы ауданның елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

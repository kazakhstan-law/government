  title:
    rus: О внесении изменений в постановление акимата Акжарского района Северо-Казахстанской области № 84 от 06 апреля 2022 года «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Акжарского района Северо-Казахстанcкой области»
    kaz: «Солтүстік Қазақстан облысы Ақжар ауданының елді мекендеріне бірыңғай сәулеттік келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2022 жылғы 06 сәуірдегі № 84 қаулысына өзгерістер енгізу туралы

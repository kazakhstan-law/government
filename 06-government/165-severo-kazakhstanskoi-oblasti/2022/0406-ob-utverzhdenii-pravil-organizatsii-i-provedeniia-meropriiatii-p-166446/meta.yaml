act_code: '166446'
requisite: Постановление акимата Акжарского района Северо-Казахстанской области от 6 апреля 2022 года № 84. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 апреля 2022 года № 27567
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Акжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданында елді мекендеріне бірыңғай сәулеттік келбетін беруге бағытталған көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

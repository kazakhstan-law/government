  title:
    rus: О внесении изменений в постановление акимата Акжарского района Северо-Казахстанской области от 6 апреля 2022 года № 84 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Акжарского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ақжар ауданы әкімдігінің 2022 жылғы 6 сәуірдегі № 84 «Солтүстік Қазақстан облысы Ақжар ауданының елді мекендеріне бірыңғай сәулеттік келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

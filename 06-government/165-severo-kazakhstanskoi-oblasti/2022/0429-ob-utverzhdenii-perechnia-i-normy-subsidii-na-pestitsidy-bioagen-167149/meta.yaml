  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 29 апреля 2022 года № 96 «Об утверждении перечня и нормы субсидий на пестициды, биоагенты (энтомофаги), а также объемы бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2022 год»
    kaz: «2022 жылға арналған пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі мен субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2022 жылғы 29 сәуірдегі № 96 қаулысына өзгеріс енгізу туралы

    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің экономика және қаржы бөлімі» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2022 жылғы 13 мамырдағы № 114 қаулысына өзгерістер енгізу туралы

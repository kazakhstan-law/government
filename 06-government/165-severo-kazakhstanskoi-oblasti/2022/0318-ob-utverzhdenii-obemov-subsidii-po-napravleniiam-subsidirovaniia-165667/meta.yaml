  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 18 марта 2022 года № 61 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, а также нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Северо-Казахстанской области на 2022 год»
    kaz: «2022 жылға арналған Солтүстік Қазақстан облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, сондай-ақ ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарды және өтінім беру мерзімдерін бекіту туралы» Солтүстік Қазақстан облысы әкімдігінің 2022 жылғы 18 наурыздағы № 61 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Уалихановского района Северо-Казахстанской области № 72 от 19 апреля 2022 года «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Уалихановскому району»
    kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2022 жылғы 19 сәуірдегі № 72 «Уәлиханов ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

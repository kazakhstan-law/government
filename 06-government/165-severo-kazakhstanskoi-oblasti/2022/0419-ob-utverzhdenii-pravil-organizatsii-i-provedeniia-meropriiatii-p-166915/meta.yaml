act_code: '166915'
requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 19 апреля 2022 года № 72. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 апреля 2022 года № 27732
title:
  rus: Об утверждении правил организации и проведения мероприятий по реконструкции, текущему и капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Уалихановского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Уәлиханов ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

act_code: '176697'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 28 декабря 2022 года № 245. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 декабря 2022 года № 31519
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Сергеевка и селам района Шал акына Северо – Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданы Сергеевка қаласына және ауылдарына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

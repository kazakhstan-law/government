  code: '208689'
  requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 28 марта 2025 года № 69. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 31 марта 2025 года № 7880-15
  title:
    rus: О внесении изменений в постановление акимата района Шал акына Северо – Казахстанской области от 28 декабря 2022 года № 245 «Об утверждении Правила организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Сергеевка и селам района Шал акына Северо – Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2022 жылғы 28 желтоқсандағы № 245 «Солтүстік Қазақстан облысы Шал ақын ауданының Сергеевка қаласына және ауылдарына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/208689/rus

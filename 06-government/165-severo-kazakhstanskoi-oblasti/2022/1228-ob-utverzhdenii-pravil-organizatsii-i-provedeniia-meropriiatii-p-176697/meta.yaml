  requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 31 октября 2023 года № 199. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 1 ноября 2023 года № 7608-15
  title:
    rus: О внесении изменений в постановление акимата района Шал акына Северо-Казахстанской области от 28 декабря 2022 года № 245 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Сергеевка и селам района Шал акына Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Шал ақын ауданының Сергеевка қаласына және ауылдарына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Шал ақын ауданы әкімдігінің 2022 жылғы 28 желтоқсандағы № 245 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/187774/rus

  title:
    rus: О внесении изменений в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 3 мая 2022 года № 105 «Об утверждении Положения о коммунальном государственном учреждении «Аппарат акима района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімінің аппараты» коммуналдық мемлекеттік мекемесі туралы ережені бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2022 жылғы 3 мамырдағы № 105 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Тимирязевского района Северо-Казахстанской области от 21 января 2022 года № 11 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Тимирязевского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тимирязев ауданы әкімдігінің 2022 жылғы 21 қаңтардағы № 11 «Солтүстік Қазақстан облысы Тимирязев ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/186639/rus

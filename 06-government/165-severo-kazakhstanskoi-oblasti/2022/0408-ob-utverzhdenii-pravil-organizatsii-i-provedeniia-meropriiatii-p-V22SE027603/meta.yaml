  requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 11 февраля 2026 года № 28. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 февраля 2026 года № 37983
  title:
    rus: О внесении изменения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 8 апреля 2022 года № 85 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2022 жылғы 8 сәуірдегі № 85 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/222112/rus

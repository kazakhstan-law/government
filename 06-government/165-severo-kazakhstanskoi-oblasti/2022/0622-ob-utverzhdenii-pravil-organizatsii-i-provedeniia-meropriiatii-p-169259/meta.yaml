act_code: '169259'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 22 июня 2022 года № 167. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 июня 2022 года № 28593
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жамбылскому району
  kaz: Жамбыл ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы

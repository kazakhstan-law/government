  title:
    rus: О внесении изменения в постановление акимата Жамбылского района Северо-Казахстанской области от 22 июня 2022 года № 167 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жамбылскому району»
    kaz: «Жамбыл ауданына бірыңғай сәулеттік көрініс беруге бағытталған көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және өткізу Қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы әкімдігінің 2022 жылғы 22 маусымдағы № 167 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/186923/rus

  title:
    rus: О внесении изменений в постановление акимата Есильского района Северо-Казахстанской области от 10 июня 2022 года № 138 «Об утверждении Положения коммунального государственного учреждения «Отдел занятости и социальных программ акимата Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» коммуналдық мемлекеттік мекемесінің Ережесін бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2022 жылғы 10 маусымдағы № 138 қаулысына өзгерістер енгізу туралы

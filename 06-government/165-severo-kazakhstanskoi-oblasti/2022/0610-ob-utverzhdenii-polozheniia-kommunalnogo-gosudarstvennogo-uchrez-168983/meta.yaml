    kaz: «Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» коммуналдық мемлекеттік мекемесінің Ережесін бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы әкімдігінің 2022 жылғы 10 маусымдағы № 138 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 28 февраля 2022 года № 51 «Об утверждении Правил предоставления коммунальных услуг по району имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан бойынша коммуналдық көрсетілетін қызметтер ұсыну қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімдігінің 2022 жылғы 28 ақпандағы № 51 қаулысына өзгеріс енгізу туралы

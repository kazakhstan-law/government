    kaz: «Солтүстік Қазақстан облысы бойынша тексеру комиссиясы» ММ-нің «Б» корпусы мемлекеттік әкімшілік қызметшілердің қызметін бағалау әдістемесін бекіту туралы» Солтүстік Қазақстан облысы бойынша тексеру комиссиясының 2022 жылғы 12 желтоқсандағы №16 қаулысына өзгерісті енгізу туралы

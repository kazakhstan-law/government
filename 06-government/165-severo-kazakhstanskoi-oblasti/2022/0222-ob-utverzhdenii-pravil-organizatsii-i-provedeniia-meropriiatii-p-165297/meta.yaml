act_code: '165297'
requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 22 февраля 2022 года № 47. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 марта 2022 года № 26995. Утратило силу постановлением акимата Тайыншинского района Северо-Казахстанской области от 30 апреля 2025 года № 163 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Тайынша и селам Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданының Тайынша қаласына және ауылдарына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

caused_by:
  code: '187102'
  requisite: Постановление акимата Тайыншинского района Северо-Казахстанской области от 10 октября 2023 года № 338. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 11 октября 2023 года № 7595-15
  title:
    rus: О внесении изменений в постановление акимата Тайыншинского района Северо-Казахстанской области от 22 февраля 2022 года № 47 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Тайынша и селам Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы әкімдігінің 2022 жылғы 22 ақпандағы № 47 «Солтүстік Қазақстан облысы Тайынша ауданының Тайынша қаласына және ауылдарына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/187102/rus

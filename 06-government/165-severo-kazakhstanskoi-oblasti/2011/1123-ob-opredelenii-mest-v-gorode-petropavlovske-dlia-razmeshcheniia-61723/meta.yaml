requisite: Постановление акимата города Петропавловска Северо-Казахстанской области от 23 ноября 2011 года № 1721. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 декабря 2011 года № 13-1-206. Утратило силу - постановлением акимата города Петропавловска Северо-Казахстанской области от 8 июня 2012 года № 1037
title:
  rus: Об определении мест в городе Петропавловске для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, Северо-Казахстанского областного и Петропавловского городского маслихатов
  kaz: Петропавл қаласында Қазақстан Республикасының Парламент Мәжілісіне, Солтүстік Қазақстан облыстық және Петропавл қалалық мәслихаттарының депутаттығына кандидаттардың сайлаушылармен кездесуіне үй-жайлар беруге және үгіттік баспа материалдарын орналастыруға арналған орындар белгілеу туралы

title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставления помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса, областного и районного маслихатов на территории Тайыншинского района
  kaz: Мәжіліс, облыстық және аудандық мәслихаттар депутаттығына үміткерлермен  кездесуге арналған Тайынша ауданы аумағында үй-жайларды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

act_code: '58703'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 22 апреля 2011 года № 92. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 4 мая 2011 года № 13-14-127. Утратило силу в связи с истечением срока действия (письмо акима района Шал акына Северо-Казахстанской области от 12 июня 2015 года № 15.1.5-11/314)
title:
  rus: Об определении оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по району Шал акына в 2011 году

    kaz: Шал ақын ауданы әкімдігінің 2011 жылғы 22 сәуірінен № 92 "Шал ақын ауданы бойынша 2011 жылы субсидияланатын басымды ауыл шаруашылығы дақылдарының әр түрі бойынша егіс жүргізудің тиімді мерзімдерін анықтау туралы" қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 27 апреля 2011 года № 107. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 мая 2011 года № 13-12-125. Утратило силу - постановлением акимата Тимирязевского района Северо-Казахстанской области от 11 января 2012 года № 4
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Тимирязевскому району на 2011 год
  kaz: Тимирязев ауданы бойынша 2011 жылға субсидия алушылар тізіміне енгізу үшін өтінімдерді қабылдау мерзімін және егіс жұмыстарын жүргізудің оңтайлы мерзімін субсидияланатын әрбір ауыл шаруашылығы мәдени басым дақылдарының түрлері бойынша анықтау туралы

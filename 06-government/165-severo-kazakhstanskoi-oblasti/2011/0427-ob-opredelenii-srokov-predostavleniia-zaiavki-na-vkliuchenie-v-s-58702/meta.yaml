  title:
    rus: О внесении изменений в постановление акимата района от 27 апреля 2011 года № 107 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Тимирязевскому району на 2011 год"
    kaz: '"Тимирязев ауданы бойынша 2011 жылға субсидия алушылар тізіміне енгізу үшін өтінімдерді қабылдау мерзімін және егіс жұмыстарын жүргізудің оңтайлы мерзімін субсидияланатын әрбір ауыл шаруашылығы мәдени басым дақылдарының түрлері бойынша анықтау туралы" аудан әкімдігінің 2011 жылғы 27 сәуірдегі № 107 қаулысына өзгерістер енгізу туралы'

requisite: Постановление акимата Есильского района Северо-Казахстанской области от 3 мая 2011 года № 99. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 4 мая 2011 года № 13-6-166. Утратило силу в связи с истечением срока действия (письмо аппарата акима Есильского района Северо-Казахстанской области от 15 июня 2012 года № 02.04.05-11/361)
title:

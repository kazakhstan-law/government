  title:
    rus: О внесении изменений в постановление акимата Есильского района от 3 мая 2011 года № 99 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Есильскому району в 2011 году"
    kaz: '"2011 жылы Есіл ауданы бойынша субсидия алушылардың тізіміне қосуға құжаттар қабылдау мерзімдерін және субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша егудің оңтайлы мерзімдерін айқындау туралы" Есіл ауданы әкімдігінің 2011 жылғы 3 мамырдағы № 99 қаулысына өзгерістер енгізу туралы'

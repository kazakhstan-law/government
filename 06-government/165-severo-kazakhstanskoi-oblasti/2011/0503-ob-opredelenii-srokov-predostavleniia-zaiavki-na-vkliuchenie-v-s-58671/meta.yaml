act_code: '58671'
requisite: Постановление акимата Есильского района Северо-Казахстанской области от 3 мая 2011 года № 99. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 4 мая 2011 года № 13-6-166. Утратило силу в связи с истечением срока действия (письмо аппарата акима Есильского района Северо-Казахстанской области от 15 июня 2012 года № 02.04.05-11/361)
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Есильскому району в 2011 году
  kaz: 2011 жылы Есіл ауданы бойынша субсидия алушылардың тізіміне қосуға құжаттар қабылдау мерзімдерін және субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша егудің оңтайлы мерзімдерін айқындау туралы

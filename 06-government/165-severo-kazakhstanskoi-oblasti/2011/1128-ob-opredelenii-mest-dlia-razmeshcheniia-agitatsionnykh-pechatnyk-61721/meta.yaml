requisite: Постановление акимата Есильского района Северо-Казахстанской области от 28 ноября 2011 года № 300. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 декабря 2011 года № 13-6-179. Утратило силу - постановлением акимата Есильского района Северо-Казахстанской области от 2 июля 2012 года № 236
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Есильского района
  kaz: Есіл ауданының аумағында Қазақстан Республикасы Парламенті Мәжілісі, облыстық және аудандық мәслихаттар депутаттығына кандидаттардың сайлаушылармен кездесулерін өткізу үшін үй-жайларды және үгіттік баспа материалдарын орналастыруға орындарды белгілеу туралы

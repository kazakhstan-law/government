act_code: '61798'
requisite: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімдігінің 2011 жылғы 2 желтоқсандағы № 378 қаулысы. Солтүстік Қазақстан облысының Әділет департаментінде 2011 жылғы 8 желтоқсанда № 13-13-150 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы әкімі аппаратының 2012 жылғы 29 желтоқсандағы № 02.12-06-09/362 хаты)
title:
  rus: Уәлиханов ауданының аумағында Қазақстан Республикасы Парламент Мәжілісінің, облыстық және аудандық мәслихаттарының депутаттығына кандидаттарының үгіттік баспа материалдарын орналастыру және сайлаушылармен кездесулері үшін үй-жай белгілеу туралы
  kaz: Уәлиханов ауданының аумағында Қазақстан Республикасы Парламент Мәжілісінің, облыстық және аудандық мәслихаттарының депутаттығына кандидаттарының үгіттік баспа материалдарын орналастыру және сайлаушылармен кездесулері үшін үй-жай белгілеу туралы

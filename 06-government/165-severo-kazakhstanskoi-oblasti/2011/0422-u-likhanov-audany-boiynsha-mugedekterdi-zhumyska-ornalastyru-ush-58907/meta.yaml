requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2011 жылғы 22 сәуірдегі № 134 қаулысы. Солтүстік Қазақстан облысының Әділет департаментінде 2011 жылғы 23 мамырда № 13-13-141 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2013 жылғы 27 мамырдағы № 166 қаулысымен

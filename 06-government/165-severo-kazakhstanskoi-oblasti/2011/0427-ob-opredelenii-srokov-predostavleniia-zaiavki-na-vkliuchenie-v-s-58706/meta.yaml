    kaz: '"2011 жылы Жамбыл ауданы бойынша субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша егудің оңтайлы мерзімдері және субсидия алушылардың тізіміне қосуға өтініштерді ұсыну мерзімдерін анықтау жөнінде" Жамбыл аудан әкімдігінің 2011 жылдың 27 сәуіріндегі № 112 қаулысына өзгерістер енгізу туралы'

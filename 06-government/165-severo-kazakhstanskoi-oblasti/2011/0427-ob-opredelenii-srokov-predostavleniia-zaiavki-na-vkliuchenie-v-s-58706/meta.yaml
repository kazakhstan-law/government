act_code: '58706'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 27 апреля 2011 года № 112. Зарегистрировано Управлением юстиции Жамбылского района Северо-Казахстанской области 5 мая 2011 года № 13-7-148. Утратило силу в связи с истечением срока действия (письмо аппарата акима Жамбылского района Северо-Казахстанской области от 22 мая 2012 года № 02-05-1.4-2/328)
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Жамбылскому району в 2011 году
  kaz: 2011 жылы Жамбыл ауданы бойынша субсидияланатын ауыл шаруашылығы басым дақылдарының әрбір түрлері бойынша егудің оңтайлы мерзімдері және субсидия алушылардың тізіміне қосуға өтініштерді ұсыну мерзімдерін анықтау туралы

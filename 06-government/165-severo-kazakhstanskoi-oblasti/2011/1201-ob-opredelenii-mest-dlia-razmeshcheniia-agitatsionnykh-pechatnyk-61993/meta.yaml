act_code: '61993'
requisite: Постановление акимата района имени Габита Мусрепова Северо-Казахстанской области от 1 декабря 2011 года № 374. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 декабря 2011 года № 13-5-137. Утратило силу (письмо акимата района имени Габита Мусрепова Северо-Казахстанской области от 5 июня 2014 года № 6.1.2-3/817)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории района имени Габита Мусрепова
  kaz: Ғабит Мүсірепов атындағы аудан аумағында үгіттік басылым материалдарын орналастыру үшін орындарды анықтау және Қазақстан Республикасы Парламент Мәжілісі, облыстық және аудандық мәслихаттар депутаттығына кандидаттардың сайлаушылармен кездесуге арналған үй-жайларды ұсыну туралы

act_code: '58063'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2011 жылғы 24 наурыздағы № 80 қаулысы. Солтүстік Қазақстан облысының Әділет департаментінде 2011 жылғы 5 сәуірде № 13-13-137 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы әкімі аппаратының 2012 жылғы 13 қыркүйектегі № 02.12.06-09/233 хаты)
title:
  rus: Аудан аймағында 2011 жылдың сәуір-маусым және қазан-желтоқсан айларында Қазақстан Республикасының азаматтарын кезекті мерзімді әскери қызметке шақыруды ұйымдастыру және өткізуді қамтамасыз ету туралы

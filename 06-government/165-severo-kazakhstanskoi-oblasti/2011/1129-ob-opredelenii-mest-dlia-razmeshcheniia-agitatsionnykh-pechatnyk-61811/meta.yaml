act_code: '61811'
requisite: Постановление акимата Жамбылского района Северо-Казахстанской области от 29 ноября 2011 года № 311. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 декабря 2011 года № 13-7-164. Утратило силу в связи с истечением срока действия (письмо аппарата акима Жамбылского района Северо-Казахстанской области от 22 мая 2012 года № 02-05-1.4-2/328)
title:
  rus: Об определении мест для размещения агитационных печатных материалов и предоставлений помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Жамбылского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының аумағында Қазақстан Республикасы Парламентінің Мәжілісіне, облыстық және аудандық мәслихаттардың депутаттығына кандидаттардың сайлаушылармен кездесуін өткізу үшін үй-жайларды ұсыну және үгіт-насихаттық баспа материалдарын орналастыру үшін орындарды белгілеу туралы

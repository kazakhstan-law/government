    kaz: '"2011 жылы Ақжар ауданы бойынша ауыл шаруашылығының әр түрі бойынша субсидияланатын басым дақылдарын себудің оңтайлы мерзімін жүргізу және субсидия алушылардың тізіміне енгізуге өтінім беру мерзімін анықтау туралы" аудан әкімдігінің 2011 жылғы 26 сәуірдегі № 106 қалусына өзгертулер енгізу туралы'

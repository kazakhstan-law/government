  title:
    rus: О внесении изменений в постановление акимата Аккайынского района от 27 апреля 2011 года № 110 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Аккайынскому району в 2011 году"
    kaz: '"Субсидия алушылардың тізіміне қосуға өтінімдерді қабылдау мерзімдерін және 2011 жылы Аққайың ауданы бойынша субсидияланатын ауыл шаруашылығы басымдықты дақылдарының әр түрі бойынша егудің оңтайлы мерзімдерін айқындау туралы" Аққайың аудан әкімдігінің 2011 жылғы 27 сәуірдегі № 110 қаулысына өзгерістер енгізу туралы'

title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур по Аккайынскому району в 2011 году
  kaz: Субсидия алушылардың тізіміне қосуға өтінімдерді қабылдау мерзімдерін және 2011 жылы Аққайың ауданы бойынша субсидияланатын ауыл шаруашылығы басымдықты дақылдарының әр түрі бойынша егудің оңтайлы мерзімдерін айқындау туралы

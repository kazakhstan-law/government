act_code: '61789'
requisite: Постановление акимата района Шал акына Северо-Казахстанской области от 2 декабря 2011 года № 313. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 декабря 2011 года № 13-14-138. Утратило силу - постановлением акимата района Шал акына Северо-Казахстанской области от 27 ноября 2012 года № 356
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента, областного и районного маслихатов на территории района Шал акына
  kaz: Шал ақын ауданының аумағында Қазақстан Парламенті Мәжілісінің, облыстық және аудандық мәслихаттарына депутаттыққа кандидаттардың сайлаушылармен кездесу өткізу үшін үй-жайларды ұсыну және үгіттік баспа материалдарын орналастыру үшін орындарды анықтау туралы

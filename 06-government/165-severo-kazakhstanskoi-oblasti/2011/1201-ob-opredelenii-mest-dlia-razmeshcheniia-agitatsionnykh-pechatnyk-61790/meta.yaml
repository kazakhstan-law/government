act_code: '61790'
requisite: Постановление акимата Мамлютского района Северо-Казахстанской области от 1 декабря 2011 года № 472. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 декабря 2011 года № 13-10-145. Утратило силу постановлением акимата Мамлютского района Северо-Казахстанской области от 8 октября 2013 года № 336
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Мамлютского района
  kaz: Мамлют ауданының аумағында үгіттік басылым материалдарын орналастыру орындарын және Қазақстан Республикасы Парламенті Мәжілісіне, облыстық және аудандық мәслихаттарға депутаттыққа үміткерлердің сайлаушылармен кездесулерін өткізу үшін үй-жайларды белгілеу туралы

  kaz: 2011 жылға арналған басым ауыл шаруашылығы дақылдарының тізбесін және көктемгі егіс және егін жинау жұмыстарын жүргізуге кажетті жанар-жағармай материалдары мен басқа да тауарлық-материалдық құндылықтардың құнын арзандатуға субсидия нормативтерін белгілеу туралы

act_code: '58826'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық әкімдігінің 2011 жылғы 29 сәуірдегі № 151 қаулысы. Солтүстік Қазақстан облысының Әділет департаментінде 2011 жылғы 12 мамырда № 13-13-139 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы әкімі аппаратының 2012 жылғы 29 желтоқсандағы № 02.12-06-09/362 хаты)
title:
  rus: 2011 жылға Уәлиханов ауданы бойынша өтінімдердің беру мерзімдерін және субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрі бойынша егіс жүргізуге оңтайлы мерзімдерін белгілеу туралы

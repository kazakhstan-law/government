  title:
    rus: О внесении изменений в постановление акимата района Магжана Жумабаева от 26 апреля 2011 года № 115 "Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур в районе Магжана Жумабаева на 2011 год"
    kaz: Мағжан Жұмабаев ауданы әкімдігінің 2011 жылғы 26 сәуірдегі № 115 "Мағжан Жұмабаев ауданында 2011 жылға арналған субсидия берілетін ауыл шаруашылық дәнді-дақылдардың оңтайлы әрбір түрі бойынша егіс жұмыстарының тиімді мерзімдері мен субсидия алушылар тізіміне қосуға өтінімдер ұсыну мерзімін анықтау туралы" қаулысына өзгерістер енгізу туралы

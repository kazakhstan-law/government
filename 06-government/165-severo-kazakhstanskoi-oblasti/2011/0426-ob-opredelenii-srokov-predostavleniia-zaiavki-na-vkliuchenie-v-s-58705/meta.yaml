requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 26 апреля 2011 года № 115. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 мая 2011 года № 13-9-133. Утратило силу - постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 25 января 2012 года № 50
title:
  rus: Об определении сроков предоставления заявки на включение в список получателей субсидий и оптимальных сроков проведения сева по каждому виду субсидируемых приоритетных сельскохозяйственных культур в районе Магжана Жумабаева на 2011 год
  kaz: Мағжан Жұмабаев ауданында 2011 жылға арналған субсидия берілетін ауыл шаруашылық дәнді дақылдардың оңтайлы әрбір түрі бойынша егіс жұмыстарының тиімді мерзімдері мен субсидия алушылар тізіміне қосуға өтінімдер ұсыну мерзімін анықтау туралы

requisite: Постановление акимата района Магжана Жумабаева Северо-Казахстанской области от 28 ноября 2011 года № 380. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 декабря 2011 года № 13-9-144. Утратило силу - постановлением акимата района Магжана Жумабаева Северо-Казахстанской области от 25 января 2012 года № 50
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории района Магжана Жумабаева
  kaz: Қазақстан Республикасы Парламенті Мәжілісіне, облыстық және аудандық мәслихаттар депутаттығына кандидаттар үшін Мағжан Жұмабаев ауданы аумағында үгіттік баспа материалдарын орналастыруға орындар және сайлаушылармен кездесулер өткізу үшін үй-жай белгілеу туралы

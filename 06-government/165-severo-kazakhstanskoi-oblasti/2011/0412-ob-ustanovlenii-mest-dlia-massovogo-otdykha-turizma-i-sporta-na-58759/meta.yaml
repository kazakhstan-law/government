  title:
    rus: О внесении изменения в постановление акимата Северо-Казахстанской области от 12 апреля 2011 года № 99 «Об установлении мест массового отдыха, туризма и спорта на водных объектах и водохозяйственных сооружениях Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысының су объектілерінде және су шаруашылығы үймереттерінде көпшіліктің демалуына, туризмге және спортқа арналған орындарды белгілеу туралы» Солтүстік Қазақстан облысы әкімдігінің 2011 жылғы 12 сәуірдегі № 99 қаулысына өзгеріс енгізу туралы

  title:
    rus: Об отмене карантинного режима на территории города Нур-Султан в объемах зараженных площадей карантинным сорняком повиликой и внесении изменения в постановление акимата города Нур-Султана от 4 августа 2021 года № 505-2632 «Об установлении карантинных зон с введением карантинного режима на территории города Нур-Султан»
    kaz: Нұр-Сұлтан қаласы аумағында карантиндік арамшөп арам сояулармен зақымданған алқаптар көлемінде карантин режимінің күшін жою және «Нұр-Сұлтан қаласының аумағында карантиндік режимді енгізе отырып, карантинді аймақтарды белгілеу туралы» Нұр-Сұлтан қаласы әкімдігінің 2021 жылғы 4 тамыздағы № 505-2632 қаулысына өзгеріс енгізу туралы

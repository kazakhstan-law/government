act_code: '163822'
requisite: Постановление акимата города Нур-Султана от 13 декабря 2021 года № 107-4464. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 января 2022 года № 26533. Утратило силу постановлением акимата города Астаны от 17 мая 2023 года № 107-940 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении объема и размера финансирования государственного образовательного заказа на дошкольные организации города Нур-Султан на период действия ограничительных мер, в том числе карантина, чрезвычайных ситуаций социального, природного и техногенного характера
  kaz: Шектеу шараларының, оның ішінде карантиннің, әлеуметтік, табиғи және техногендік сипаттағы төтенше жағдайлардың қолданылу кезеңіне Нұр-Сұлтан қаласының мектепке дейінгі ұйымдарына мемлекеттік білім беру тапсырысын қаржыландырудың көлемі мен мөлшерін айқындау туралы

  requisite: Постановление акимата города Астаны от 13 апреля 2023 года № 107-680
  title:
    rus: Об отмене постановления акимата города Астаны от 7 февраля 2023 года № 107-194 «О внесении изменений в постановление акимата города Нур-Султан от 13 декабря 2021 года № 107-4464 «Об определении объема и размера финансирования государственного образовательного заказа на дошкольные организации города Нур-Султан на период действия ограничительных мер, в том числе карантина, чрезвычайных ситуаций социального, природного и техногенного характера»
    kaz: «Шектеу шараларының, оның ішінде карантиннің, әлеуметтік, табиғи және техногендік сипаттағы төтенше жағдайлардың қолданылу кезеңіне Нұр-Сұлтан қаласының мектепке дейінгі ұйымдарына мемлекеттік білім беру тапсырысын қаржыландырудың көлемі мен мөлшерін айқындау туралы» Нұр-Сұлтан қаласы әкімдігінің 2021 жылғы 13 желтоқсандағы № 107-4464 қаулысына өзгерістер енгізу туралы» Астана қаласы әкімдігінің 2023 жылғы 7 ақпандағы № 107-194 қаулысының күшін жою туралы
  link: https://zan.gov.kz/client/#!/doc/179789/rus

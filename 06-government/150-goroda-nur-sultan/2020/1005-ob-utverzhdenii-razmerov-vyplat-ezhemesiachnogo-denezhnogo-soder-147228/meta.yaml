act_code: '147228'
requisite: Постановление акимата города Нур-Султана от 5 октября 2020 года № 112-2072. Зарегистрировано Департаментом юстиции города Нур-Султана 9 октября 2020 года № 1294. Сноска. Утратил силу постановлением акимата города Астаны от 18 марта 2025 года № 112-754 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размеров выплат ежемесячного денежного содержания спортсменам города Нур-Султана, входящим в состав сборных команд Республики Казахстан, по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам города Нур-Султана, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд
  kaz: Нұр-Сұлтан қаласының спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ Нұр-Сұлтан қаласында спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы

requisite: Постановление акимата города Нур-Султана от 11 марта 2022 года № 182-748. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 марта 2022 года № 27204. Утратило силу постановлением акимата города Астаны от 12 августа 2026 года № 158-2811 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Астане
  kaz: Астана қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

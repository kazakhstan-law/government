  title:
    rus: О внесении изменений в постановление акимата города Нур-Султан от 11 марта 2022 года № 182-748 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Астане»
    kaz: «Астана қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы және күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Нұр-Сұлтан қаласы әкімдігінің 2022 жылғы 11 наурыздағы № 182-748 қаулысына өзгерістер енгізу туралы

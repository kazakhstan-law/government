  title:
    rus: О внесении изменений в постановление акимата Жылыойского района от 11 января 2019 года № 2 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Жылыойском районе»
    kaz: «Жылыой ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» Жылыой ауданы әкімдігінің 2019 жылғы 11 қаңтардағы № 2 қаулысына өзгерістер енгізу туралы

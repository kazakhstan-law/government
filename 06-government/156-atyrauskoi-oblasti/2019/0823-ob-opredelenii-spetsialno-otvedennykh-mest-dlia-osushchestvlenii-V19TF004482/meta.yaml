title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам торговой деятельности на территории Индерского района
  kaz: Индер ауданының аумағында сауда қызметі субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін бөлінген арнайы орындарын белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Курмангазинского района от 26 февраля 2019 года № 40 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Курмангазинском районе»

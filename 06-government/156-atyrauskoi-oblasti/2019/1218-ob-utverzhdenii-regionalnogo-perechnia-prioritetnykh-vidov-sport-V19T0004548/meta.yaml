  title:
    rus: О признании утратившими силу постановлений акимата Атырауской области от 18 декабря 2019 года № 299 «Об утверждении регионального перечня приоритетных видов спорта Атырауской области» и от 28 марта 2024 года № 69 «О внесении изменения в постановление акимата Атырауской области от 18 декабря 2019 года № 299 «Об утверждении регионального перечня приоритетных видов спорта Атырауской области»
    kaz: Атырау облысы әкімдігінің «Атырау облысының спорттың басым түрлерінің өңірлік тізбесін бекіту туралы» 2019 жылғы 18 желтоқсандағы № 299 және «Атырау облысы әкімдігінің 2019 жылғы 18 желтоқсандағы № 299 «Атырау облысының спорттың басым түрлерінің өңірлік тізбесін бекіту туралы» қаулысына өзгеріс енгізу туралы» 2024 жылғы 28 наурыздағы № 69 қаулыларының күші жойылды деп тану туралы

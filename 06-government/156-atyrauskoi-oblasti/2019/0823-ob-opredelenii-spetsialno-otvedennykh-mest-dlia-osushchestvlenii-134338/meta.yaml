requisite: Постановление акимата Индерского района Атырауской области от 23 августа 2019 года № 247. Зарегистрировано Департаментом юстиции Атырауской области 28 августа 2019 года № 4482. Утратило силу постановлением акимата Индерского района Атырауской области от 5 апреля 2021 года № 54 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам торговой деятельности на территории Индерского района
  kaz: Индер ауданының аумағында сауда қызметі субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін бөлінген арнайы орындарын белгілеу туралы

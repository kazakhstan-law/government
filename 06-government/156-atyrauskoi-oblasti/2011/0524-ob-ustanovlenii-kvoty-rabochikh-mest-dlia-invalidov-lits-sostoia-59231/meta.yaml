    kaz: Аудан әкімдігінің 2011 жылғы 24 мамырдағы № 84 "Ауданда мүгедектерді, бас бостандығынан айыру орындарынан босатылған адамдарды және интернаттық ұйымдарды бітіруші кәмелетке толмағандарды жұмыспен қамтуды ұйымдастыру үшін жұмыс орындарының квоталарын белгілеу туралы" қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление районного акимата от 24 мая 2011 года №84 «Об установлении квоты рабочих мест для инвалидов, лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций района»
    kaz: «Ауданда мүгедектерді, қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және интернаттық ұйымдарды бітіруші кәмелетке толмағандарды жұмыспен қамтуды ұйымдастыру үшін жұмыс орындарының квоталарын белгілеу туралы» аудан әкімдігінің 2011 жылғы 24 мамырдағы №84 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/97271/rus

act_code: '59141'
requisite: Постановление акимата Махамбетского района Атырауской области № 158 от 25 мая 2011 года. Зарегистрировано Департаментом юстиции Атырауской области 8 июня 2011 года № 4-3-158. Утратило силу постановлением Махамбетского районного акимата Атырауской области от 20 апреля 2016 года № 128
title:
  rus: Об установлении квоты рабочих мест для инвалидов, лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций района
  kaz: Ауданда мүгедектерді, қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және интернаттық ұйымдарды бітіруші кәмелетке толмағандарды жұмыспен қамтуды ұйымдастыру үшін жұмыс орындарының квоталарын белгілеу туралы

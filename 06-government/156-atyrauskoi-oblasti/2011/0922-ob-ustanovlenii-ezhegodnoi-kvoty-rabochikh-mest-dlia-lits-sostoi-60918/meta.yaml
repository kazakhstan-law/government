requisite: Постановление акимата Жылыойского района Атырауской области № 256 от 22 сентября 2011 года. Зарегистрировано Департаментом юстиции Атырауской области 21 октября 2011 года № 4-2-159. Утратило силу постановлением Жылыойского районного акимата Атырауской области от 20.04.2016 № 163
title:
  rus: Об установлении ежегодной квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в Жылыойском районе
  kaz: Жылыой ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар мен интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына жыл сайынғы квота белгілеу туралы

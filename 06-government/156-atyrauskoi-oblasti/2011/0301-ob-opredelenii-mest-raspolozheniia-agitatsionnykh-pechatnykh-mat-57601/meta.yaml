requisite: Постановление Махамбетского районного акимата Атырауской области от 1 марта 2011 года № 66. Зарегистрировано Департаментом юстиции Атырауской области 2 марта 2011 года № 4-3-154. Утратило силу постановлением акимата Махамбетского района Атырауской области от 19 декабря 2014 года № 674
title:
  rus: Об определении мест расположения агитационных печатных материалов по Махамбетскому району для кандидатов в Президенты Республики Казахстан и в депутаты Махамбетского районного Маслихата по избирательным округам № 3 и № 10
  kaz: Қазақстан Республикасы Президенттігіне және № 3 және № 10 сайлау округтері бойынша Махамбет аудандық Мәслихат депутаттығына кандидаттар үшін Махамбет ауданы бойынша үгіттік баспа материалдарын орналастыру орындарын белгілеу туралы

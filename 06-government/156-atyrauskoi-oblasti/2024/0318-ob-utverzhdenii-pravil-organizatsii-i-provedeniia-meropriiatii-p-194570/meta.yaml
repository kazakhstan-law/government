  title:
    rus: О внесении изменении в постановление акимата Кызылкогинского района от 18 марта 2024 года № 45 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Кызылкогинского района»
    kaz: «Қызылқоға ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Қызылқоға ауданы әкімдігінің 2024 жылғы 18 наурыздағы № 45 қаулысына өзгерістер енгізу туралы

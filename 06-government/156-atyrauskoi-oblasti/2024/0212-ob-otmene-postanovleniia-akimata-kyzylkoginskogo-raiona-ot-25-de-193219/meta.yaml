act_code: '193219'
requisite: Постановление акимата Кызылкогинского района Атырауской области от 12 февраля 2024 года № 24
title:
  rus: Об отмене постановления акимата Кызылкогинского района от 25 декабря 2023 года № 242 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, крыш многоквартирных жилых домов, направленных на придание единого архитектурного облика Кызылкогинского района»
  kaz: Қызылқоға ауданы әкімдігінің 2023 жылғы 25 желтоқсандағы № 242 «Қызылқоға ауданының бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысын жою туралы

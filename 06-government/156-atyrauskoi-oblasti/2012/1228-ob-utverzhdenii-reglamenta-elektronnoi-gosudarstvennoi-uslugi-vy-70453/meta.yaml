act_code: '70453'
requisite: Постановление областного акимата Атырауской области от 28 декабря 2012 года № 426. Зарегистрировано Департаментом юстиции Атырауской области 25 января 2013 года 2682. Утратило силу - постановлением Атырауского областного акимата от 21 июня 2013 года № 238
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление вида деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түсті және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуi және өткізуі жөніндегі қызмет түрін жүзеге асыруға лицензия беру, қайта рәсімдеу, лицензияның телнұсқаларын беру" электрондық мемлекеттік қызмет көрсету регламентін бекіту туралы'

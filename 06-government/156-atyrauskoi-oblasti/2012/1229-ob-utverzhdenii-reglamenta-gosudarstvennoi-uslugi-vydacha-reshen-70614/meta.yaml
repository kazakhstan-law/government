act_code: '70614'
requisite: Постановление Атырауского областного акимата от 29 декабря 2012 года № 433. Зарегистрировано Департаментом юстиции Атырауской области 25 января 2013 года № 2678. Утратило силу постановлением Атырауского областного акимата от 21 июня 2013 года № 238
title:
  rus: Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений) и определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения) по согласованию с уполномоченным органом в сфере религиозной деятельности"
  kaz: '"Дін қызметі саласындағы уәкілетті органмен келісім бойынша ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік қызмет көрсету регламентiн бекіту туралы'

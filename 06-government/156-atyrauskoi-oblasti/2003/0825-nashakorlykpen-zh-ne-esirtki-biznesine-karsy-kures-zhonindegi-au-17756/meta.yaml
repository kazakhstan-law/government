requisite: Атырау облысы Исатай аудандық әкімиятының 2003 жылғы 26 тамыздағы № 62 қаулысы. Атырау облыстық Әділет басқармасының 2003 жылғы 1 қазанда № 1648 тіркелді. Күші жойылды - Атырау облысы Исатай аудандық әкімиятының 2007 жылғы 26 сәуірдегі № 71 қаулысымен

requisite: Постановление акимата Атырауской области от 25 декабря 2015 года № 377. Зарегистрировано Департаментом юстиции Атырауской области 19 января 2016 года № 3448. Утратило силу постановлением акимата Атырауской области от 25 декабря 2019 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на осуществление деятельности по производству (формуляции) пестицидов (ядохимикатов), реализации пестицидов (ядохимикатов),  применению пестицидов (ядохимикатов) аэрозольным и  фумигационным способами»
  kaz: «Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi(улы химикаттарды)өткiзу, пестицидтердi(улыхимикаттарды) аэрозольдiк және фумигациялық  тәсiлдермен қолдануға байланысты қызметті жүзеге асыруға лицензия беру»  мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

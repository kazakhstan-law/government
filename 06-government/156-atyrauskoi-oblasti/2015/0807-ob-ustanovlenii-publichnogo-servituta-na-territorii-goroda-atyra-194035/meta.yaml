  title:
    rus: О внесений дополнения в постановление акимата Атырауской области от 07 августа 2015 года № 247 «Об установлении публичного сервитута на территории города Атырау, Жылыойского, Макатского и Махамбетского районов Атырауской области для акционерного общества «Каспийский трубопроводный консорциум-К» для размещения и эксплуатации линейной части участка 130,3-217,2 (116-204) км магистрального нефтепровода «Тенгиз-Новороссийск»
    kaz: Атырау облысы әкімдігінің 2015 жылғы 7 тамыздағы № 247 «Каспий Құбыр Консорциумы-К» акционерлік қоғамына Атырау облысы Атырау қаласы Жылыой, Мақат және Махамбет аудандары аумағында «Теңіз-Новороссийск» магистральдық мұнай құбырының 130,3-217,2 (116-204) км учаскесіндегі желілік бөлігінің орналастыру және пайдалану үшін жариялы сервитут белгілеу туралы» қаулысына толықтыру енгізу туралы

title:
  rus: Об установлении публичного сервитута на территории города Атырау, Жылыойского, Макатского и Махамбетского районов Атырауской области для акционерного общества «Каспийский трубопроводный консорциум-К» для размещения и эксплуатации линейной части участка 130,3-217,2(116-204) км магистрального нефтепровода «Тенгиз-Новороссийск»
  kaz: «Каспий Құбыр Консорциумы-Қ» акционерлік қоғамына Атырау облысы Атырау қаласы Жылыой, Мақат және Махамбет аудандары аумағында «Теңіз-Новороссийск» магистральдық мұнай құбырының 130,3-217,2(116-204) км учаскесіндегі желілік бөлігін орналастыру және пайдалану үшін қауымдық сервитут белгілеу туралы

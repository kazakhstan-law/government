requisite: Постановление акимата Атырауской области от 2 октября 2015 года № 310. Зарегистрировано Департаментом юстиции Атырауской области 3 ноября 2015 года № 3334. Утратило силу постановлением акимата Атырауской области от 25 декабря 2019 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача и продление разрешения на привлечение иностранной рабочей силы работодателям для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы, либо в рамках внутрикорпоративного перевода»
  kaz: «Жұмыс берушілерге тиісті әкімшілік-аумақтық бірлік аумағында еңбек қызметін жүзеге асыру үшін не корпоративішілік ауыстыру шеңберінде шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

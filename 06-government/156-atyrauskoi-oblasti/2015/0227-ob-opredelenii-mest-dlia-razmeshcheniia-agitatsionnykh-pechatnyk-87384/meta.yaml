title:
  rus: Об определении мест для размещения агитационных печатных материалов по Индерскому району для всех кандидатов в Президенты, депутаты Сената и Мажилиса Парламента, маслихатов и членов иных органов местного самоуправления Республики Казахстан
  kaz: Қазақстан Республикасы Президентiне, Парламентiнiң Сенаты мен Мәжiлiсi, мәслихаттары депутаттарына және өзге де жергілікті өзін-өзі басқару органдары мүшелеріне барлық кандидаттар үшін Индер ауданы бойынша үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

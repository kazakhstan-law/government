requisite: Постановление акимата Макатского района Атырауской области от 25 февраля 2015 года № 47. Зарегистрировано Департаментом юстиции Атырауской области 17 марта 2015 года № 3127. Утратило силу постановлением акимата Макатского района Атырауской области от 21 мая 2019 года № 95 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

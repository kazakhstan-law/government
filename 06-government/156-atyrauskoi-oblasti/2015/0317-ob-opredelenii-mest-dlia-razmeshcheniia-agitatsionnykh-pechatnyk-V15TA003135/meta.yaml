requisite: Постановление Атырауского городского акимата Атырауской области от 17 марта 2015 года № 337. Зарегистрировано Департаментом юстиции Атырауской области 18 марта 2015 года № 3135. Утратило силу постановлением акимата города Атырау Атырауской области от 11 июня 2020 года № 1119 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов по городу Атырау для всех кандидатов в Президенты, депутаты Сената и Мажилиса Парламента, маслихатов Республики Казахстан
  kaz: Қазақстан Республикасы Президентіне,Парламент Сенаты мен Мәжілісі, мәслихаттар депутаттығына барлық кандидаттар үшін Атырау қаласы бойынша үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

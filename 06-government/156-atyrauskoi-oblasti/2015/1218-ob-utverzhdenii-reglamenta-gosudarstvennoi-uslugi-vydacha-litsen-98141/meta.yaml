requisite: Постановление акимата Атырауской области от 18 декабря 2015 года № 374. Зарегистрировано Департаментом юстиции Атырауской области 21 января 2016 года № 3450. Утратило силу постановлением акимата Атырауской области от 28 июня 2017 года № 166
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии на осуществление деятельности по сбору заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түсті және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және өткізу бойынша қызметті жүзеге асыруына лицензия беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

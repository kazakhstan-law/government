act_code: '87854'
requisite: Постановление акимата Жылыойского района Атырауской области от 16 марта 2015 года № 137. Зарегистрировано Департаментом юстиции Атырауской области 18 марта 2015 года № 3134. Утратило силу постановлением акимата Жылыойского района Атырауской области от 19 октября 2022 года № 265 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов по Жылыойскому району для всех кандидатов в Президенты, депутаты Сената и Мажилиса Парламента, маслихатов и членов иных органов местного самоуправления Республики Казахстан
  kaz: Қазақстан Республикасы Президентiне, Парламентiнiң Сенаты мен Мәжiлiсi, мәслихаттары депутаттарына және өзге де жергілікті өзін-өзі басқару органдары мүшелеріне барлық кандидаттар үшін Жылыой ауданы бойынша үгіттік баспа  материалдарын орналастыру үшін орындар белгілеу туралы

act_code: '91459'
requisite: Постановление акимата Атырауской области от 7 июля 2015 года № 204. Зарегистрировано Департаментом юстиции Атырауской области 9 июля 2015 года № 3246
title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и нормы субсидий (на 1 гектар) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче–смазочных материалов и других товарно–материальных ценностей, необходимых для проведения весенне–полевых и уборочных работ, путем субсидирования производства  приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2015 год
  kaz: 2015 жылға басым ауыл шаруашылығы дақылдарының тізбесін және басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар–жағармай материалдары мен көктемгі егіс пен егін жинау жұмыстарын  жүргізу үшін қажетті басқа да тауарлық–материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын  қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын (1 гектарға) белгілеу туралы

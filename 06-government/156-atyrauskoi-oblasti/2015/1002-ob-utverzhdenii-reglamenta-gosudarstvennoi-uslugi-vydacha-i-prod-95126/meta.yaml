  title:
    rus: О внесении изменений в постановление акимата Атырауской области от 2 октября 2015 года № 310 «Об утверждении регламента государственной услуги «Выдача и продление разрешения иностранному работнику на трудоустройство и работодателям на привлечение иностранной рабочей силы для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы»
    kaz: Атырау облысы әкімдігінің 2015 жылғы 2 қазандағы № 310 «Шетелдік қызметкерге жұмысқа орналасуға және жұмыс берушілерге тиісті әкімшілік-аумақтық бірлік аумағында еңбек қызметін жүзеге асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

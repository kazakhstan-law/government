  title:
    rus: О внесении изменения в постановление акимата Атырауской области от 14 августа 2015 года № 253 «Об утверждении регламента государственной услуги «Выдача разрешения на размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения»
    kaz: Атырау облысы әкімдігінің 2015 жылғы 14 тамыздағы № 253 «Облыстық және аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарына бөлінген белдеуде, жарнаманы тұрақты орналастыру объектілерінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

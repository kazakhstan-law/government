requisite: Постановление акимата Атырауской области от 30 декабря 2015 года № 390. Зарегистрировано Департаментом юстиции Атырауской области 29 января 2016 года № 3453. Утратило силу постановлением акимата Атырауской области от 25 декабря 2019 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда"
  kaz: '"Жеміс-жидек дақылдарының және жүзімнің көпжылдық көшеттерін отырғызу және өсіру (оның ішінде қалпына келтіру) шығындарының құнын субсидиялау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

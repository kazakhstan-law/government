  title:
    rus: О внесении изменения в постановление акимата Атырауской области от 30 декабря 2015 года № 390 «Об утверждении регламента государственной услуги «Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда»
    kaz: Атырау облысы әкімдігінің 2015 жылғы 30 желтоқсандағы № 390 «Жеміс-жидек дақылдарының және жүзімнің көпжылдық көшеттерін отырғызу және өсіру (оның ішінде қалпына келтіру) шығындарының құнын субсидиялау» мемлекеттiк көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении дополнения в постановление Кызылкогинского районного акимата № 251 от 21 декабря 2016 года «Об установлении квоты для трудоустройства граждан Кызылкогинского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования»
    kaz: Қызылқоға ауданы әкімдігінің 2016 жылғы 21 желтоқсандағы № 251 «Қызылқоға ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-аналарының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды жұмысқа орналастыру үшін квота белгілеу туралы» қаулысына толықтыру енгізу туралы

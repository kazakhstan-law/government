act_code: '109215'
requisite: Постановление Кызылкогинского районного акимата Атырауской области от 21 декабря 2016 года № 251. Зарегистрировано Департаментом юстиции Атырауской области 17 января 2017 года № 3765. Утратило силу постановлением акимата Кызылкогинского района Атырауской области от 20 марта 2024 года № 62 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства граждан Кызылкогинского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Қызылқоға ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-аналарының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды жұмысқа орналастыру үшін квота белгілеу туралы

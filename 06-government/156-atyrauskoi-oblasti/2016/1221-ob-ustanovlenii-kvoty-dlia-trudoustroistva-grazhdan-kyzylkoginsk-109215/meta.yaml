  title:
    rus: О внесении изменении в постановление Кызылкогинского районного акимата от 21 декабря 2016 года № 251 «Об установлении квоты для трудоустройства граждан Кызылкогинского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации»
    kaz: Қызылқоға аудан әкімдігінің 2016 жылғы 21 желтоқсандағы № 251 «Қызылқоға ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-аналарының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін квота  белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113709/rus

requisite: Постановление акимата Макатского района Атырауской области от 8 ноября 2016 года № 185. Зарегистрировано Департаментом юстиции Атырауской области 14 декабря 2016 года № 3708. Утратило силу постановлением акимата Макатского района Атырауской области от 8 апреля 2021 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток субъектам торговой деятельности на территории Макатского района
  kaz: Мақат ауданы аумағында сауда қызметі субъектілеріне автодүкендерде және (немесе) шатырларда көшпелі сауданы жүзеге асыру үшін бөлінген арнайы орындарды белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Исатайского района от 30 мая 2016 года № 108 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Исатай ауданы әкімдігінің 2016 жылғы 30 мамырдағы № 108 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

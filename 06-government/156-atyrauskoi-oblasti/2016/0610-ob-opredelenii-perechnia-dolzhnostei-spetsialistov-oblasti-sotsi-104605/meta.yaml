act_code: '104605'
requisite: Постановление акимата Индерского района Атырауской области от 10 июня 2016 года № 129. Зарегистрировано Департаментом юстиции Атырауской области 13 июля 2016 года № 3554. Утратило силу постановлением акимата Индерского района Атырауской области от 22 января 2025 года № 13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар  лауазымдарының тізбесін айқындау туралы

act_code: '105507'
requisite: Постановление акимата Атырауской области от 3 августа 2016 года № 172. Зарегистрировано Департаментом юстиции Атырауской области 16 августа 2016 года № 3591. Утратило силу постановлением акимата Атырауской области от 25 декабря 2019 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения,  начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейінгі тәрбие мен оқыту,бастауыш, негізгі орта, жалпы орта,техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды  қабылдау» мемлекеттік көрсетілетін  қызмет регламентін бекіту туралы

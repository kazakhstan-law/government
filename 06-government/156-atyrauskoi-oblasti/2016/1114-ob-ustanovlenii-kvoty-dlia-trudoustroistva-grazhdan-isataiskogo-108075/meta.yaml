act_code: '108075'
requisite: Постановление акимата Исатайского района Атырауской области от 14 ноября 2016 года № 241. Зарегистрировано Департаментом юстиции Атырауской области 7 декабря 2016 года № 3702. Утратило силу постановлением акимата Исатайского района Атырауской области от 20 марта 2024 года № 45 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты для трудоустройства граждан Исатайского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Исатай ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-аналарының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды жұмысқа орналастыру үшін квота белгілеу туралы

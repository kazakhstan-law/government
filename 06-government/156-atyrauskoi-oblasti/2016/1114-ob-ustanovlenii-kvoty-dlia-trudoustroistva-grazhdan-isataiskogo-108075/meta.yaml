  title:
    rus: О внесении изменений в постановление акимата Исатайского района Атырауской области от 14 ноября 2016 года № 241 «Об установлении квоты для трудоустройства граждан Исатайского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации»
    kaz: Атырау облысы Исатай ауданы әкімдігінің 2016 жылғы 14 қарашадағы № 241«Исатай ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-аналарының қамқорлығынсыз қалған жастар қатарындағы  білім беру ұйымдарының түлектері болып табылатын азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін квота белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113710/rus

act_code: '106232'
requisite: Постановление акимата Атырауской области от 26 августа 2016 года № 206. Зарегистрировано Департаментом юстиции Атырауской области 14 сентября 2016 года № 3601
title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и норм субсидий (на 1 гектар) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения  весенне-полевых и  уборочных работ, путем субсидирования производства приоритетных культур и  стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2016 год
  kaz: 2016  жылға  басым ауыл шаруашылығы дақылдарының тізбесі  және  басым дақылдар өндіруді субсидиялау  жолымен өсімдік  шаруашылығы өнімінің өнімділігі мен сапасын арттыруға, жанар-жағармай  материалдары мен  көктемгі  егіс   және  егін жинау жұмыстарын  жүргізу үшін  қажетті басқа да тауарлық-материалдық құндылықтардың құнын және  ауыл шаруашылығы дақылдарын  қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын  (1 гектарға) белгілеу туралы

requisite: Постановление акимата Курмангазинского района Атырауской области от 29 июля 2016 года № 332. Зарегистрировано Департаментом юстиции Атырауской области 19 августа 2016 года № 3594. Утратило силу постановлением акимата Курмангазинского района Атырауской области от 5 марта 2024 года № 41 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской  местности

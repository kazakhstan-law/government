requisite: Постановление акимата Макатского района Атырауской области от 17 июня 2016 года № 113. Зарегистрировано Департаментом юстиции Атырауской области 13 июля 2016 года № 3553. Утратило силу постановлением акимата Макатского района Атырауской области от 8 апреля 2021 года № 62 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар  лауазымдарының тізбесін айқындау туралы

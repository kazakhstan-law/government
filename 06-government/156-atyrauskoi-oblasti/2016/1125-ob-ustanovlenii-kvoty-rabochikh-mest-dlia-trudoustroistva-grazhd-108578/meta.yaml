act_code: '108578'
requisite: Постановление Атырауского городского акимата Атырауской области от 25 ноября 2016 года № 1578. Зарегистрировано Департаментом юстиции Атырауской области 28 декабря 2016 года № 3730. Утратило силу постановлением акима города Атырау Атырауской области от 28 марта 2024 года № 563 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан в городе Атырау из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Атырау қаласында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарынан квота белгілеу туралы

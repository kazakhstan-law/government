  requisite: Постановление Атырауского городского акимата Атырауской области от 9 августа 2017 года № 1591. Зарегистрировано Департаментом юстиции Атырауской области 12 сентября 2017 года № 3943. Утратило силу постановлением акима города Атырау Атырауской области от 28 марта 2024 года № 563 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменении в постановление акимата города Атырау от 25 ноября 2016 года № 1578 «Об установлении квоты в городе Атырау для трудоустройства лиц, состоящих на учете службы пробации, лиц, освобожденных из мест лишения свободы, граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования»
    kaz: Атырау қалалық әкімдігінің 2016 жылғы 25 қарашадағы № 1578 «Атырау қаласында пробация қызметінің есебінде тұрған адамдарды, бас бостандығынан айыру орындарынан босатылған  адамдарды, кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-анасының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды жұмысқа орналастыру үшін квота белгілеу туралы» қаулысына өзгерістер енгізу туралы

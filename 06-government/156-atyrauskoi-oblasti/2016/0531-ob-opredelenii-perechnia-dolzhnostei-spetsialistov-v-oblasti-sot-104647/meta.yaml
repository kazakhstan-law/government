act_code: '104647'
requisite: Постановление акимата Кызылкогинского района Атырауской области от 31 мая 2016 года № 106. Зарегистрировано Департаментом юстиции Атырауской области 29 июня 2016 года № 3550. Утратило силу постановлением акимата Кызылкогинского района Атырауской области от 30 мая 2024 года № 107 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

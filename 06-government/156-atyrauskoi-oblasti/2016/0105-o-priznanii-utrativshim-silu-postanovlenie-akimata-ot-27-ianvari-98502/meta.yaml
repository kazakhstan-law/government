title:
  rus: 'О признании утратившим силу постановление акимата от 27 января 2015 года №29 «Об определении перечня должностей специалистов в области социального обеспечения, образования и культуры являющихся гражданскими служащими и работающих в сельской местности» '
  kaz: 'Аудан әкімдігінің 2015 жылғы 27 қаңтардағы №29 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысының күшін жою туралы  '

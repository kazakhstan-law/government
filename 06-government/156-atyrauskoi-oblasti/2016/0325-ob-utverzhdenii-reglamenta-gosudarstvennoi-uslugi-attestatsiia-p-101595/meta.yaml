requisite: Постановление акимата Атырауской области от 25 марта 2016 года № 57. Зарегистрировано Департаментом юстиции Атырауской области 21 апреля 2016 года № 3486. Утратило силу постановлением акимата Атырауской области от 25 декабря 2019 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Аттестация производителей оригинальных, элитных семян, семян первой, второй и третьей репродукций и реализаторов семян»
  kaz: «Бірегей және элиталық тұқымдар, бірінші, екінші және үшінші көбейтілген тұқым өндірушілерді, тұқым өткізушілерді аттестаттау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

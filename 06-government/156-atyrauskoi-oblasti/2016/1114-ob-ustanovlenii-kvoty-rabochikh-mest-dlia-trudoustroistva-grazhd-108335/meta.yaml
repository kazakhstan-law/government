  code: '113643'
  requisite: Постановление акимата Индерского района Атырауской области от 20 июня 2017 года № 110. Зарегистрировано Департаментом юстиции Атырауской области 17 июля 2017 года № 3911. Утратило силу постановлением акимата Индерского района Атырауской области от 20 марта 2024 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата Индерсвого района Атырауской области от 14 ноября 2016 года № 245 «Об установлении квоты для трудоустройства граждан Индерского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации»
    kaz: Атырау облысы Индер ауданы әкімдігінің 2016 жылғы 14 қарашадағы № 245 «Индер ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-анасының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін квота белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113643/rus

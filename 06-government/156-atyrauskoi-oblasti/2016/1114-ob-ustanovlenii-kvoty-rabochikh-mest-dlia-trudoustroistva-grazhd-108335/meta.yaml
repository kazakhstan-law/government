act_code: '108335'
requisite: Постановление акимата Индерского района Атырауской области от 14 ноября 2016 года № 245. Зарегистрировано Департаментом юстиции Атырауской области 14 декабря 2016 года № 3710. Утратило силу постановлением акимата Индерского района Атырауской области от 20 марта 2024 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан в Индерском районе из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Индер аудандық ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтардың жұмысқа орналастыру үшін жұмыс орындарынан квота белгілеу туралы

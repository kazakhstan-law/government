act_code: '102246'
requisite: Постановление акимата Атырауской области от 11 мая 2016 года № 98. Зарегистрировано Департаментом юстиции Атырауской области 13 мая 2016 года № 3516. Утратило силу постановлением акимата Атырауской области от 29 февраля 2024 года № 47 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения,социального обеспечения, образования и культуры, являющихся гражданскими служащими и работающих в сельской местности, финансируемых из областного бюджета
  kaz: Облыстық бюджеттен қаржыландырылатын, азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

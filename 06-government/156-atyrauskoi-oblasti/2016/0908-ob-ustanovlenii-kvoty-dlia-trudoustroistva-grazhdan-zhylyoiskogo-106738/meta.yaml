act_code: '106738'
requisite: Постановление акимата Жылыойского района Атырауской области от 8 сентября 2016 года № 322. Зарегистрировано Департаментом юстиции Атырауской области 6 октября 2016 года № 3629. Утратило силу постановлением Жылыойского районного акимата Атырауской области от 8 июня 2017 года № 207
title:
  rus: Об установлении квоты для трудоустройства граждан Жылыойского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации
  kaz: Жылыой ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-аналарының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін квота  белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Жылыойского района от 18 мая 2016 года № 195 «Об определении перечня должностей специалистов в области социального обеспечения, образования и культуры, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру және мәдениет саласындағы мамандарға лауазымдарының тізбесін айқындау туралы» Жылыой ауданы әкімдігінің 2016 жылғы 18 мамырдағы № 195 қаулысына өзгерістер енгізу туралы

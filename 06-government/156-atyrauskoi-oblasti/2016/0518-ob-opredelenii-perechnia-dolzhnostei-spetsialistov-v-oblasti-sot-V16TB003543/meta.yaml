requisite: Постановление акимата Жылыойского района Атырауской области от 18 мая 2016 года № 195. Зарегистрировано Департаментом юстиции Атырауской области 17 июня 2016 года № 3543. Утратило силу постановлением акимата Жылыойского района Атырауской области от 14 августа 2026 года № 241 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения и культуры являющихся гражданскими служащими и работающих в сельской местности

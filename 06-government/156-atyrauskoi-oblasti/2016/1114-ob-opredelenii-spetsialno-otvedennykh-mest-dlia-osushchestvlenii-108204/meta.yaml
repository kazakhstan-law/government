requisite: Постановление акимата Исатайского района Атырауской области от 14 ноября 2016 года № 244. Зарегистрировано Департаментом юстиции Атырауской области 14 декабря 2016 года № 3711. Утратило силу постановлением акимата Исатайского района Атырауской области от 3 марта 2022 года № 26 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам торговой деятельности на территории Исатайского района
  kaz: Исатай ауданы аумағында сауда қызметі субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін бөлінген арнайы орындарды белгілеу туралы

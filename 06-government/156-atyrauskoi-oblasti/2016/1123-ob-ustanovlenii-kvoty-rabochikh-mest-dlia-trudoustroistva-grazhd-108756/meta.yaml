  requisite: Постановление Махамбетского районного акимата Атырауской области от 6 сентября 2017 года № 295. Зарегистрировано Департаментом юстиции Атырауской области 22 сентября 2017 года № 3952. Утратило силу постановлением акимата Махамбетского района Атырауской области от 20 марта 2024 года № 98 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменении в постановление акимата Махамбетского района от 23 ноября 2016 года № 352 «Об установлении квоты рабочих мест для трудоустройства граждан Махамбетского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации»
    kaz: Махамбет аудандық әкімдігінің 2016 жылғы 23 қарашадағы № 352 «Махамбет ауданында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/114890/rus

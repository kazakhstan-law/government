act_code: '108756'
requisite: Постановление акимата Махамбетского района Атырауской области от 23 ноября 2016 года № 352. Зарегистрировано Департаментом юстиции Атырауской области 27 декабря 2016 года № 3728. Утратило силу постановлением акимата Махамбетского района Атырауской области от 20 марта 2024 года № 98 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан Махамбетского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Махамбет ауданында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарынан квота белгілеу туралы

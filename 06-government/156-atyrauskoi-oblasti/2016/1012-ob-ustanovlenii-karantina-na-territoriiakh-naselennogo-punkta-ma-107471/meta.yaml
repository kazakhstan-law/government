act_code: '107471'
requisite: Постановление акимата Махамбетского района Атырауской области от 12 октября 2016 года № 312. Зарегистрировано Департаментом юстиции Атырауской области 31 октября 2016 года № 3658. Утратило силу постановлением Махамбетского районного акимата Атырауской области от 8 декабря 2016 года № 365
title:
  rus: Об установлении карантина на территориях населенного пункта Мартыши Баксайского сельского округа, населенного пункта Аккайын Бейбарыского сельского округа, Алмалинского, Алгинского и Жалгансайского сельских округов Махамбетского района Атырауской области
  kaz: Атырау облысы Махамбет ауданының Бақсай ауылдық округінің Мартыши елді мекенінің, Бейбарыс ауылдық округінің Аққайын елді мекенінің, Алмалы, Алға және Жалғансай ауылдық округтерінің аумақтарында карантин белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Атырауской области от 12 марта 2014 года №56 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры,спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: Атырау облысы әкімдігінің 2014 жылғы 12 наурыздағы №56 «Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

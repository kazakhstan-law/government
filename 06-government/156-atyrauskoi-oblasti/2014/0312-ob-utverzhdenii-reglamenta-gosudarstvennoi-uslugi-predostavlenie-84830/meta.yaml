  title:
    rus: О внесении изменений и дополнений в постановление акимата Атырауской области от 12 марта 2014 года № 56 "Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты"
    kaz: Атырау облысы әкімдігінің 2014 жылғы 12 наурыздағы № 56 "Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '84830'
requisite: Постановление акимата Атырауской области от 12 марта 2014 года № 56. Зарегистрировано Департаментом юстиции Атырауской области 11 апреля 2014 года № 2887. Утратило силу постановлением акимата Атырауской области от 24 апреля 2015 года № 120
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

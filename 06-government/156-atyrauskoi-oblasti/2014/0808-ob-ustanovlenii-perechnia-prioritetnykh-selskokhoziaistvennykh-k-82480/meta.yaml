title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и нормы субсидий (на 1 гектар) на удешевление стоимости горюче–смазочных материалов и других товарно–материальных ценностей, необходимых для проведения весенне–полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельско-хозяйственных культур в защищенном грунте на 2014 год
  kaz: 2014 жылға басым дақылдар тізбесін және басым дақылдар өндіруді субсидиялау арқылы жанар-жағармай материалдары мен көктемгі егіс және егін жинау жұмыстарын жүргізуге қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауылшаруашылық дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялау нормаларын (1 гектарға) белгілеу туралы

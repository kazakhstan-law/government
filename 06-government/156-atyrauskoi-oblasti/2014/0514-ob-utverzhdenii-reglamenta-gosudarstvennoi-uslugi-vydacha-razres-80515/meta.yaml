  title:
    rus: О внесении изменения и дополнений в постановление акимата Атырауской области от 14 мая 2014 года № 138 "Об утверждении регламента государственной услуги "Выдача разрешения на размещение объектов наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах"
    kaz: Атырау облысы әкімдігінің 2014 жылғы 14 мамырдағы № 138 "Облыстық және аудандық маңызы бар, сондай-ақ елді мекендердегі жалпы пайдаланымдағы автомобиль жолдарының бөлінген белдеуінде сыртқы (көрнекі) жарнама объектілерін орналастыруға рұқсат беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына өзгеріс пен толықтырулар енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/83373/rus

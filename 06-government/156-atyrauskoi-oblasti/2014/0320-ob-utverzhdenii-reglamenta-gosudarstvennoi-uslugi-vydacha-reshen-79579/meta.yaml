  title:
    rus: О внесении дополнений  в постановление акимата Атырауской области  от 20 марта 2014 года № 82 "Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений) и определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения)"
    kaz: Атырау облысы әкімдігінің 2014 жылғы 20 наурыздағы № 82 "Ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына толықтырулар енгiзу туралы

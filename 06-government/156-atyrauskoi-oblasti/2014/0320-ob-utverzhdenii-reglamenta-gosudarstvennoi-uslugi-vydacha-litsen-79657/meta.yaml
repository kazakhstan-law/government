requisite: Постановление областного акимата Атырауской области от 20 марта 2014 года № 78. Зарегистрировано Департаментом юстиции Атырауской области 30 апреля 2014 года № 2903. Утратило силу постановлением акимата Атырауской области от 25 декабря 2015 года № 377
title:
  rus: Об утверждении регламента государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление деятельности по производству (формуляции) пестицидов (ядохимикатов), реализации пестицидов (ядохимикатов), применению пестицидов (ядохимикатов) аэрозольным и фумигационным способами"
  kaz: '"Пестицидтерді (улы химикаттарды) өндіру (формуляциялау), пестицидтерді (улы химикаттарды) өткізу, пестицидтерді (улы химикаттарды) аэрозольдік және фумигациялық тәсілдермен қолдану жөніндегі қызметті жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

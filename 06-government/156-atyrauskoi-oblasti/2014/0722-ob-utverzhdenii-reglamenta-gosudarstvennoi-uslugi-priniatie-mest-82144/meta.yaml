act_code: '82144'
requisite: Постановление от 22.07.2014 №210, Акимат Атырауской области.  Утратило силу постановлением акимата Атырауской области от 26 июня 2015 года № 194
title:
  rus: Об утверждении регламента государственной услуги "Принятие местными исполнительными органами области решения по закреплению охотничьих  угодий и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
  kaz: '"Облыстық жергілікті аттарушы органдарының жануарлар дүниесін пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін бекітіп беру мен аңшылық және балық шаруашылықтарының қажеттіліктері үшін сервитуттарды белгілеу жөнінде шешімдер қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

  title:
    rus: О внесении изменения в постановление акимата Атырауской области от 27 августа 2014 года №250 «Об утверждении регламента государственной услуги «Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным  исполнительным органом в частном жилищном фонде»
    kaz: Атырау облысы әкімдігінің 2014 жылғы 27 тамыздағы №250 «Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке  тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы»  мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/89872/rus

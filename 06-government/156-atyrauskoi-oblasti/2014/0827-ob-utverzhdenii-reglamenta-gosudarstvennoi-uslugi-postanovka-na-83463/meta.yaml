act_code: '83463'
requisite: Постановление акимата Атырауской области от 27 августа 2014 года № 250. Зарегистрировано Департаментом юстиции Атырауской области 01 октября 2014 года № 3012. Утратило силу постановлением акимата Атырауской области от 31 июля 2015 года № 236
title:
  rus: Об утверждении регламентa государственной услуги "Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

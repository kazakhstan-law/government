    kaz: Атырау облысы әкімдігінің 2014 жылғы 20 наурыздағы № 83 "Ауыл шаруашылығы тауарын өндірушілерге су беру қызметтерінің құнын субсидиялау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына өзгерістер мен толықтырулар енгiзу туралы

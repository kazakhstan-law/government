requisite: Исатай ауданы әкімінің 2009 жылғы 26 мамырдағы № 86 қаулысы. Исатай аудандық Әділет басқармасында 2009 жылғы 11 маусымда № 4-4-138 тіркелді. Күші жойылды - Исатай ауданы әкімдігінің 2010 жылғы 22 ақпандағы № 27 қаулысымен

act_code: '47950'
requisite: Атырау облысы Құрманғазы ауданы әкімдігінің 2009 жылғы 18 қыркүйектегі № 346 қаулысы. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 25 қыркүйекте № 4-8-154 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы әкімдігінің 2010 жылғы 5 қаңтардағы № 1 қаулысымен
title:

requisite: Атырау облысы Қызылқоға аудандық әкімиятының 2009 жылғы 15 қыркүйектегі № 252 қаулысы. Әділет департаменті Қызылқоға ауданының Әділет басқармасында 2009 жылғы 30 қыркүйекте № 4-5-114 тіркелді. Күші жойылды - Қызылқоға аудандық әкімдігінің 2012 жылғы 21 мамырдағы № 88 қаулысымен

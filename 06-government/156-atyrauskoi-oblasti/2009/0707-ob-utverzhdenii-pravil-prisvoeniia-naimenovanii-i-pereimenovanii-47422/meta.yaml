  title:
    rus: О внесении дополнений и изменений в постановление акимата области от 7 июля 2009 года № 162 "Об утверждении Правил присвоения наименований и переименования составных частей населенных пунктов, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Атырауской области"
    kaz: Облыс әкімиятының 2009 жылғы 7 шілдедегі № 162 "Атырау облысының елді мекендерінің құрамдас бөліктеріне атау беру және қайта атауын, жер  учаскелеріне, ғимараттар мен құрылыстарға реттік нөмірлер беру талаптарын белгілеу қағидасын бекіту туралы" қаулысына өзгерістер және толықтырулар енгізу туралы

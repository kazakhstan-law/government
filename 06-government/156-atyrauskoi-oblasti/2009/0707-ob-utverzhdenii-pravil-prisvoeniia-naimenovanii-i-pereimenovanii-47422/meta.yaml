  title:
    rus: О внесении изменений в постановление акимата Атырауской области от 7 июля 2009 года № 162 "Об утверждении Правил по ведению порядка присвоения наименований и переименования составных частей населенных пунктов, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Атырауской области"
    kaz: Атырау облыстық әкiмиятының 2009 жылғы 7 шiлдедегi № 162 "Атырау облысының елдi мекендерiнiң құрамдас бөлiктерiне атау беру және атауын қайта өзгерту тәртiбiн жүргiзу жөнiндегi қағидасын, жер учаскелерiне, ғимараттар мен құрылыстарға реттiк нөмiрлер беру талаптарын бекіту туралы" қаулысына өзгерістер енгізу туралы

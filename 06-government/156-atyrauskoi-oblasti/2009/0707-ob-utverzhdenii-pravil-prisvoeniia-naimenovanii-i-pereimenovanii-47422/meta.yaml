title:
  rus: Об утверждении Правил присвоения наименований и переименования составных частей населенных пунктов, установления требований к присвоению порядковых номеров земельным участкам, зданиям и сооружениям на территории Атырауской области
  kaz: Атырау облысының елді мекендерінің құрамдас бөліктеріне атау беру және атауын қайта өзгерту тәртібін жүргізу жөніндегі қағидасын, жер учаскелеріне, ғимараттар мен құрылыстарға реттік нөмірлер беру талаптарын белгілеу туралы

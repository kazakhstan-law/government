requisite: Махамбет ауданы әкімінің 2009 жылғы 14 қаңтардағы № 19 қаулысы. Атырау облысы Әділет департаменті Махамбет ауданының Әділет басқармасында 2009 жылғы 6 ақпанда 4-3-113 тіркелді. Күші жойылды - Махамбет ауданы әкімдігінің 2013 жылғы 6 ақпандағы № 78 қаулысымен

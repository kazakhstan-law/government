requisite: Атырау облысы Құрманғазы ауданы әкімдігінің 2009 жылғы 30 сәуірдегі № 171 қаулысы. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 5 маусымда № 4-8-149 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы әкімдігінің 2011 жылғы 22 маусымдағы № 226 қаулысымен

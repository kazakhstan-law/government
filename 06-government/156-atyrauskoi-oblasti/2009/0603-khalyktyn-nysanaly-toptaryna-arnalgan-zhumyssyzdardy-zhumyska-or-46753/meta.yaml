requisite: Атырау облысы Индер аудандық әкімиятының 2009 жылғы 3 маусымдағы № 153 қаулысы. Атырау облысының Әділет департаменті Индер ауданының Әділет басқармасында 2009 жылғы 7 шілдеде № 4-6-84 тіркелді. Күші жойылды - Индер ауданы әкімдігінің 2012 жылғы 16 қазандағы № 285 қаулысымен

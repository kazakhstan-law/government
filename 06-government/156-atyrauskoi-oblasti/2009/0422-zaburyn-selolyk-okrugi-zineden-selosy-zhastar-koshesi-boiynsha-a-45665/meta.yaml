requisite: Исатай ауданы әкімінің 2009 жылғы 22 сәуірдегі № 48 қаулысы. Исатай аудандық Әділет басқармасында 2009 жылғы 8 мамырда № 4-4-133 тіркелді. Күші жойылды - Атырау облысы Исатай аудандық әкімиятының 2011 жылғы 24 мамырдағы № 77 қаулысымен

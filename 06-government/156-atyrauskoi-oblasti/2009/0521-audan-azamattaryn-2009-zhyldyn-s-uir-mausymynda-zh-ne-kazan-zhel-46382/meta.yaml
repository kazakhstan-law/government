requisite: Атырау облысы Мақат аудандық әкімиятының 2009 жылғы 21 мамырдағы № 95 қаулысы. Атырау облысының Әділет департаменті Мақат ауданының Әділет басқармасында 2009 жылғы 10 маусымда № 4-7-101 тіркелді. Күші жойылды - Мақат аудандық әкімиятының 2010 жылғы 28 сәуірдегі № 65 қаулысымен

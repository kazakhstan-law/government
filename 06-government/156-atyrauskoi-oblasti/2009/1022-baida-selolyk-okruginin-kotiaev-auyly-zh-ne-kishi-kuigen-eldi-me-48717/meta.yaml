requisite: Атырау облысы Құрманғазы аудандық әкімдігінің 2009 жылғы 22 қазандағы № 383 қаулысы. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 16 қарашада № 4-8-171 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы аудандық әкімдігінің 2009 жылғы 7 желтоқсандағы № 452 қаулысымен
title:

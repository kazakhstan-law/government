requisite: Атырау облысы Жылыой аудандық әкімиятының 2009 жылғы 9 қарашадағы № 365 қаулысы. Жылыой аудандық Әділет басқармасында 2009 жылғы 16 қарашада № 4-2-134 тіркелді. Күші жойылды - Жылыой аудандық әкімдігінің 2012 жылғы 8 қарашадағы № 375 қаулысымен

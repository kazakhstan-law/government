requisite: Атырау облысы Атырау қалалық әкімиятының 2009 жылғы 18 маусымдағы № 638 қаулысы. Атырау қалалық Әділет басқармасында 2009 жылғы 15 шілдеде № 4-1-103 тіркелді. Күші жойылды - Атырау облысы Атырау қалалық әкімдігінің 2014 жылғы 4 желтоқсандағы № 1683 қаулысымен

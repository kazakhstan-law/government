act_code: '37868'
requisite: Атырау облысы Исатай аудандық әкімиятының 2008 жылғы 28 қаңтардағы № 19 қаулысы. Атырау облысының Әділет департаменті Исатай ауданының Әділет басқармасында 2008 жылғы 25 ақпанда № 4-4-96 тіркелді. Күші жойылды - Исатай аудандық әкімиятының 2011 жылғы 24 қазандағы № 173 қаулысымен
title:

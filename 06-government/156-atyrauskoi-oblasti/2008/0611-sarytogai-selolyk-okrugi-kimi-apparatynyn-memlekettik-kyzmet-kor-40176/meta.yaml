requisite: Махамбет аудандық әкімиятының 2008 жылғы 11 маусымдағы № 282 қаулысы. Атырау облысы Әділет департаменті Махамбет ауданының Әділет басқармасында 2008 жылғы 24 маусымда 4-3-100 тіркелді. Күші жойылды - Махамбет аудандық әкімдігінің 2010 жылғы 5 сәуірдегі № 80 қаулысымен

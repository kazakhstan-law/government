requisite: Атырау облысы Индер аудандық әкімиятының 2008 жылғы 29 желтоқсандағы № 259 қаулысы. Атырау облысының Әділет департаменті Индер ауданының Әділет басқармасында 2009 жылғы 6 ақпанда № 4-6-76 тіркелді. Күші жойылды - Индер ауданы әкімдігінің 2010 жылғы 26 ақпандағы № 38 қаулысымен

requisite: Атырау облысы Мақат ауданы әкімиятының 2008 жылғы 8 қаңтардағы № 2 қаулысы. Атырау облысының Әділет департаменті Мақат ауданының Әділет басқармасында 2008 жылғы 29 қаңтарда № 4-7-78 тіркелді. Күші жойылды - Атырау облысы Мақат ауданы әкімдігінің 2013 жылғы 18 қыркүйектегі № 257 қаулысымен

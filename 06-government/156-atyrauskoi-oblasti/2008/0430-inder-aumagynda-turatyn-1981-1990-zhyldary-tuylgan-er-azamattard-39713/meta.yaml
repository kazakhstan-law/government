requisite: Атырау облысы Индер ауданы әкімиятының 2008 жылғы 30 сәуірдегі № 98 қаулысы. Атырау облысы Әділет департаменті Индер ауданының Әділет басқармасында 2008 жылғы 23 мамырда № 4-6-70 болып тіркелді

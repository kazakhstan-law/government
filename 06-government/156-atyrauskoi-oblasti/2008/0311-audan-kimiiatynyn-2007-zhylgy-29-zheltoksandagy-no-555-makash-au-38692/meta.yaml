requisite: Атырау облысы Құрманғазы ауданы әкімиятының 2008 жылғы 11 наурыздағы № 100 қаулысы. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2008 жылғы 28 наурызда № 4-8-124 болып тіркелді

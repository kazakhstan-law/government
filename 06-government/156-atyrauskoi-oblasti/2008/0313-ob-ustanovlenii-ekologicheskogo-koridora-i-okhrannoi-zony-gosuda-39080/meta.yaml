act_code: '39080'
requisite: Постановление Атырауского областного акимата от 13 марта 2008 года № 62. Зарегистрировано Департаментом юстиции Атырауской области 21 апреля 2008 года за № 2526. Утратило силу постановлением акимата Атырауской области от 27 марта 2018 года № 64
title:
  rus: Об установлении экологического коридора и охранной зоны государственной заповедной зоны северной части Каспийского моря с регулируемым режимом эксплуатации водного транспорта в границах по всей акватории рек Урал и Кигач (в пределах Атырауской области), за исключением заповедного участка
  kaz: Қорықтық учаскені қоспағанда, Жайық және Қиғаш өзендерінің барлық акваториясы шекараларында (Aтырау облысы шегінде) Каспий теңізі солтүстік бөлігінің мемлекеттік қорық аймағының су көлігін пайдаланудың реттелмелі режимімен қоса қорғау аймағы мен экологиялық дәлізін белгілеу туралы

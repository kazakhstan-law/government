  title:
    rus: О внесении изменений и дополнения в постановление акимата области от 13 марта 2008 года № 62 "Об установлении экологического коридора и охранной зоны государственной заповедной зоны северной части Каспийского моря с регулируемым режимом эксплуатации водного транспорта в границах по всей акватории рек Урал и Кигач (в пределах Атырауской области), за исключением заповедного участка"
    kaz: Облыс әкімиятының 2008 жылғы 13 наурыздағы N 62 "Қорықтық учаскені қоспағанда, Жайық және Қиғаш өзендерінің барлық акваториясы шекараларында (Атырау облысы шегінде) Каспий теңізі солтүстік бөлігінің мемлекеттік қорық аймағының су көлігін пайдаланудың реттелмелі режимімен қоса қорғау аймағы мен экологиялық дәлізін белгілеу туралы" қаулысына өзгерістер мен толықтыру енгізу туралы

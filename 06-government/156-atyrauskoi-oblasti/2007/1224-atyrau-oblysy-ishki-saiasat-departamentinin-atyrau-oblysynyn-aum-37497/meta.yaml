requisite: Атырау облыстық әкімиятының 2007 жылғы 24 желтоқсандағы № 301 қаулысы. Атырау облыстық Әділет департаментінде 2008 жылғы 23 қаңтарда № 2515 тіркелді. Күші жойылды - Атырау облыстық әкімиятының 2010 жылғы 18 ақпандағы № 37 қаулысымен

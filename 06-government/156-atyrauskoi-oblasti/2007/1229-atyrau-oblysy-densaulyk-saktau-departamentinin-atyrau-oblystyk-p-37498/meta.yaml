requisite: Атырау облыстық әкімиятының 2007 жылғы 29 желтоқсандағы № 335 қаулысы. Атырау облыстық Әділет департаментінде 2008 жылғы 30 қаңтарда № 2516 тіркелді. Күші жойылды - Атырау облыстық әкімиятының 2012 жылғы 9 шілдедегі № 212 қаулысымен

act_code: '35458'
requisite: Атырау облысы Құрманғазы ауданы әкімиятының 2007 жылғы 11 қазандағы № 359 қаулысы. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2007 жылғы 24 қазанда № 4-8-88 болып тіркелді
title:
  rus: Аудан әкімиятының 2007 жылғы 15 мамырдағы № 71 «Мақаш ауылдық Округіндегі «Мақаш базасы» аумағында құтыру ауруына шектеу іс шараларын жариялау туралы» (нормативтік құқықтық акті 2007 жылғы 28 мамырында мемлекеттік тіркеудің тізіліміне № 4-8-81 енгізілген,аудандық «Серпер» үнжариясының № 23. 09.06.2007 жылғы баспасөз бетінде ресми жарияланған) қаулысымен бекітілген шектеу іс-шараларын тоқтату туралы

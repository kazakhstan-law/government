requisite: Атырау облыстық әкімиятының 2007 жылғы 14 желтоқсандағы № 287 қаулысы. Атырау облыстық Әділет департаментінде 2008 жылғы 22 қаңтарда № 2510 тіркелді. Күші жойылды - Атырау облыстық әкімиятының 2012 жылғы 9 шілдедегі № 212 қаулысымен

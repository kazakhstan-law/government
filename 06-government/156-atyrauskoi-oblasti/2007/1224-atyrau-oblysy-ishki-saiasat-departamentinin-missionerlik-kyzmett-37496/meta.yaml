requisite: Атырау облыстық әкімиятының 2007 жылғы 24 желтоқсандағы № 297 қаулысы. Атырау облыстық Әділет департаментінде 2008 жылғы 23 қаңтарда № 2514 тіркелді. Күші жойылды - Атырау облысы әкімдігінің 2011 жылғы 3 маусымдағы № 162 қаулысымен

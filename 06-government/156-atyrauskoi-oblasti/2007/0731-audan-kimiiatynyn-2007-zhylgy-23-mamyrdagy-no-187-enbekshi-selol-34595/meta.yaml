act_code: '34595'
requisite: Атырау облысы Құрманғазы ауданы әкімиятының 2007 жылғы 31 шілдедегі № 294 қаулысы. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2007 жылғы 9 тамызда № 4-8-86 болып тіркелді
title:
  rus: Аудан әкімиятының 2007 жылғы 23 мамырдағы № 187 «Еңбекші селолық округіндегі «Қаламқас» ауылының аумағында құтыру ауруына шектеу іс-шараларын жариялау туралы» (нормативтік құықтық акті 2007 жылғы 29 мамырында мемлекеттік тіркеуден тізіліміне № 4-8-82 енгізілген, аудандық «Серпер» үнжариясының № 23 09.06.2007 жылғы баспасөз бетінде ресми жарияланған қаулысымен бекітілген шектеу іс-шараларын тоқтатуға арналған

requisite: Атырау қалалық әкімдігінің 2010 жылғы 14 сәуірдегі № 322 қаулысы. Атырау қалалық Әділет басқармасында 2010 жылғы 28 сәуірде № 4-1-117 тіркелді. Күші жойылды - Атырау қалалық әкімдігінің 2011 жылғы 1 маусымдағы № 881 қаулысымен

requisite: Атырау облысы Қызылқоға аудандық әкімдігінің 2010 жылғы 2 тамыздағы № 150 қаулысы. Әділет департаменті Қызылқоға ауданының Әділет басқармасында 2010 жылғы 11 тамызда № 4-5-130 тіркелді. Күші жойылды - Атырау облысы Қызылқоға аудандық әкімдігінің 2012 жылғы 7 маусымдағы № 106 қаулысымен
title:

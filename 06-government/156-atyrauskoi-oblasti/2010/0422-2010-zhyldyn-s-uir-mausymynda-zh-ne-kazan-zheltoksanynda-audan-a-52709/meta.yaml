act_code: '52709'
requisite: Атырау облысы Құрманғазы ауданы әкімдігінің 2010 жылғы 22 сәуірдегі № 160 қаулысы. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2010 жылғы 25 мамырда № 4-8-188 тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы әкімінің 2011 жылғы 12 қаңтардағы № 48 қаулысымен

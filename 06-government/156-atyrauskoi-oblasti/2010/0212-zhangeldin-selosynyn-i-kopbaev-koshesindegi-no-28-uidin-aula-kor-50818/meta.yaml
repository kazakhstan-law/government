requisite: Атырау облысы Қызылқоға аудандық әкімдігінің 2010 жылғы 12 ақпандағы № 23 қаулысы. Әділет департаменті Қызылқоға ауданының Әділет басқармасында 2010 жылғы 23 ақпанында № 4-5-122 тіркелді. Күші жойылды - Қызылқоға аудандық әкімиятының 2010 жылғы 15 сәуірдегі № 69 қаулысымен

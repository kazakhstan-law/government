requisite: Атырау облысы Қызылқоға аудандық әкімдігінің 2010 жылғы 15 шілдедегі № 134 қаулысы. Әділет департаменті Қызылқоға ауданының Әділет басқармасында 2010 жылғы 27 шілдеде № 4-5-128 тіркелді. Күші жойылды - Атырау облысы Қызылқоға аудандық әкімдігінің 2010 жылғы 20 қыркүйектегі № 175 қаулысымен

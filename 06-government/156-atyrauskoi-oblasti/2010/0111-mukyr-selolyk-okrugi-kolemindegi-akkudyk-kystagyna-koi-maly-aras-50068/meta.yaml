requisite: Атырау облысы Қызылқоға аудандық әкімдігінің 2010 жылғы 11 қаңтардағы № 1 қаулысы. Әділет департаменті Қызылқоға аудандық әділет басқармасында 2010 жылғы 18 қаңтарында № 4-5-117 тіркелді. Күші жойылды - Қызылқоға аудандық әкімиятының 2010 жылғы 26 наурыздағы № 52 қаулысымен

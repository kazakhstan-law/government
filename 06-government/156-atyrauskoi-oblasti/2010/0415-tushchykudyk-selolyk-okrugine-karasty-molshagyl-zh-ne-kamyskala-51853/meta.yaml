requisite: Атырау облысы Исатай ауданы әкімдігінің 2010 жылғы 15 сәуірдегі № 68 қаулысы. Исатай аудандық Әділет басқармасында 2010 жылғы 22 сәуірде № 4-4-158 тіркелді. Күші жойылды - Атырау облысы Исатай ауданы әкімдігінің 2010 жылғы 15 маусымдағы № 103 қаулысымен

requisite: Атырау облысы Исатай ауданы әкімдігінің 2010 жылғы 20 сәуірдегі № 70 қаулысы. Исатай аудандық Әділет басқармасында 2010 жылғы 20 мамырда № 4-4-163 тіркелді. Күші жойылды - Исатай ауданы әкімдігінің 2013 жылғы 11 ақпандағы № 26 қаулысымен

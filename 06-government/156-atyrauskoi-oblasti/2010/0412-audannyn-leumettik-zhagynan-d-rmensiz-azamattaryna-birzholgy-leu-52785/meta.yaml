requisite: Атырау облысы Исатай ауданы әкімдігінің 2010 жылғы 12 сәуірдегі № 64 қаулысы. Исатай аудандық Әділет басқармасында 2010 жылғы 20 мамырда № 4-4-161 тіркелді. Күші жойылды - Исатай аудандық әкімдігінің 2013 жылғы 11 ақпандағы № 35 қаулысымен

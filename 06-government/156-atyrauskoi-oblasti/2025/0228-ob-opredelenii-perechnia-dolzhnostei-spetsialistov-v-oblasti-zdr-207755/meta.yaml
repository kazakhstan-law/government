title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности, финансируемых из областного бюджета
  kaz: Облыстық бюджеттен қаржыландырылатын, азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы

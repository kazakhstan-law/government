act_code: '214005'
requisite: Постановление акимата Индерского района Атырауской области от 3 сентября 2025 года № 171
title:
  rus: О создании коммунального государственного предприятия на праве хозяйственного ведения «Индер Сервис» государственного учреждения «Отдел жилищно-коммунального хозяйства, пассажирского транспорта, автомобильных дорог и жилищной инспекции Индерского района Атырауской области»
  kaz: «Атырау облысы Индер аудандық тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі, автомобиль жолдары және тұрғын үй инспекциясы бөлімі» мемлекеттік мекемесінің «Индер Сервис» шаруашылық жүргізу құқығындағы коммуналдық мемлекеттік кәсіпорнын құру туралы

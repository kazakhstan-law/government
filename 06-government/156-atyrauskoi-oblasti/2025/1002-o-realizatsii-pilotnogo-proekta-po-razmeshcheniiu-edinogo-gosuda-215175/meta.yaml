title:
  rus: О реализации пилотного проекта по размещению единого государственного заказа на дополнительное образование для детей (творческий и спортивный заказы, образовательный заказ на дополнительное образование) с учетом персонифицированного финансирования по получателям услуг в Атырауской области
  kaz: Атырау облысында қызмет алушылар бойынша дербестендірілген қаржыландыруды ескере отырып, балаларға арналған қосымша білімге бірыңғай мемлекеттік тапсырысты (шығармашылық және спорттық тапсырыстар, қосымша білімге білім беру тапсырысы) орналастыру жөніндегі пилоттық жобаны іске асыру туралы

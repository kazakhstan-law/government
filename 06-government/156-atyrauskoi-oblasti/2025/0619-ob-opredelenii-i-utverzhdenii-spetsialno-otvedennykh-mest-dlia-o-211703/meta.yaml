act_code: '211703'
requisite: Постановление акимата города Атырау Атырауской области от 19 июня 2025 года № 1467
title:
  rus: Об определении и утверждении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам внутренней торговли за исключением киосков на территории города Атырау
  kaz: Атырау қаласы аумағында ішкі сауда субъектілеріне дүңгіршіктерді қоспағанда, автодүкендерде және (немесе) шатырларда павильондарда) көшпелі сауданы жүзеге асыру үшін арнайы бөлінген орындарды белгілеу және бекіту туралы

requisite: Постановление Кызылкогинского районного акимата Атырауской области от 9 июня 2017 года № 125. Зарегистрировано Департаментом юстиции Атырауской области 20 июля 2017 года № 3919. Утратило силу постановлением Кызылкогинского районного акимата Атырауской области от 27 октября 2020 года № 184 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специально отведенных мест для  осуществления выездной торговли с автолавок и (или) палаток субъектам торговой деятельности на территории Кызылкогинского района
  kaz: Қызылқоға ауданының аумағында сауда қызметі субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда)көшпелі сауданы жүзеге асыру үшін бөлінген арнайы орындарын белгілеу туралы

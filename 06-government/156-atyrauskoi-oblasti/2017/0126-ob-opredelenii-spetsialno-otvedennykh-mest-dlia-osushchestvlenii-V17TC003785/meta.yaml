    kaz: Махамбет ауданы аумағында ішкі сауда субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін 2020 жылға арнайы бөлінген орындарды айқындау туралы

  title:
    rus: О признании утратившими силу постановлений акимата Махамбетского района от 15 февраля 2017 года № 50 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» акимата Махамбетского района» и от 9 июня 2017 года № 174 «О внесении изменения в постановление акимата Махамбетского района № 50 от 15 февраля 2017 года «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» акимата Махамбетского района»
    kaz: Махамбет ауданы әкімдігінің 2017 жылғы 15 ақпандағы № 50 «Махамбет аудандық әкімдігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» және 2017 жылғы 9 маусымдағы № 174  «Махамбет аудандық әкімдігінің 2017 жылғы 15 ақпандағы № 50 «Махамбет аудандық әкімдігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы» қаулыларының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/120449/rus

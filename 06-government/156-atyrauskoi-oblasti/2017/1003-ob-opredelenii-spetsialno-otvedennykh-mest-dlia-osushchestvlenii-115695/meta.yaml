requisite: Постановление акима Жылыойского района Атырауской области от 3 октября 2017 года № 372. Зарегистрировано Департаментом юстиции Атырауской области 20 октября 2017 года № 3970. Утратило силу постановлением акимата Жылыойского района Атырауской области от 21 апреля 2021 года № 133 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам торговой деятельности на территории города Кульсары
  kaz: Құлсары қаласы аумағында сауда қызметі субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін бөлінген арнайы орындарды белгілеу туралы

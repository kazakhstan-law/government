  requisite: Постановление акимата Атырауской области от 26 мая 2025 года № 100. Зарегистрировано в Департаменте юстиции Атырауской области 28 мая 2025 года № 5279-06. Утратило силу постановлением акимата Атырауской области от 20 января 2026 года № 8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Атырауской области от 31 октября 2017 года № 274 «Об утверждении размеров выплат ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам Атырауской области»
    kaz: «Атырау облысының спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларына, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларына, олардың жаттықтырушыларына ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы» Атырау облысы әкімдігінің 2017 жылғы 31 қазандағы № 274 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/210797/rus

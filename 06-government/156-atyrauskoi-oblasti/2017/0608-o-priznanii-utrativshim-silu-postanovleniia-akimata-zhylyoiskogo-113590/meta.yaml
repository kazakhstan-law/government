act_code: '113590'
requisite: Постановление акимата Жылыойского района Атырауской области от 8 июня 2017 года № 207. Зарегистрировано Департаментом юстиции Атырауской области 4 июля 2017 года № 3908
title:
  rus: О признании утратившим силу постановления акимата Жылыойского района от 8 сентября 2016 года № 322 «Об установлении квоты для трудоустройства граждан Жылыойского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации»
  kaz: Жылыой ауданы әкімдігінің 2016 жылғы 8 қыркүйектегі № 322 «Жылыой ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін квоталар белгілеу туралы» қаулысының күшін жою туралы

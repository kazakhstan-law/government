act_code: '113037'
requisite: Постановление акимата Атырауской области от 20 июня 2017 года № 154. Зарегистрировано Департаментом юстиции Атырауской области 26 июня 2017 года № 3901
title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и нормы субсидий (на 1 гектар) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2017 год
  kaz: 2017 жылға басым ауыл шаруашылығы дақылдарының тізбесін және басым дақылдар өндіруді субсидиялау жолымен өсімдік шаруашылығы өнімінің өнімділігі мен сапасын арттыруға, жанар-жағармай материалдары мен көктемгі егіс және егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын (1 гектарға) белгілеу туралы

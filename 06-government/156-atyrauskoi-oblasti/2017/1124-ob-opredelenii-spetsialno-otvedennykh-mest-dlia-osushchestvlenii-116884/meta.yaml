  title:
    rus: О внесении изменений в постановление районного акимата от 24 ноября 2017 года № 516 «Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам торговой деятельности на территории Курмангазинского района
    kaz: Аудан әкімдігінің 2017 жылғы 24 қарашадағы № 516 «Құрманғазы ауданының аумағында сауда қызметі субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі  сауданы жүзеге асыру үшін бөлінген арнайы орындарын белгілеу туралы» қаулысына өзгерістер енгізу туралы

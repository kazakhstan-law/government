act_code: '116884'
requisite: Постановление акимата Курмангазинского района Атырауской области от 24 ноября 2017 года № 516. Зарегистрировано Департаментом юстиции Атырауской области 15 декабря 2017 года № 4008. Утратило силу постановлением акимата Курмангазинского района Атырауской области от 9 декабря 2020 года № 354 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам торговой деятельности на территории Курмангазинского района
  kaz: Құрманғазы ауданының аумағында сауда қызметі субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін бөлінген арнайы орындарын белгілеу туралы

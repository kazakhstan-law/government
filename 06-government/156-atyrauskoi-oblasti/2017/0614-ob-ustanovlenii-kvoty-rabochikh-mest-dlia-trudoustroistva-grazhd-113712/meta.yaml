  title:
    rus: О внесении изменений в постановление Жылыойского районного акимата № 212 от 14 июня 2017 года «Об установлении квоты для трудоустройства граждан Жылыойского района из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования»
    kaz: Жылыой ауданы әкімдігінің 2017 жылғы 14 маусымдағы № 212 «Жылыой ауданында кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-анасының қамқорлығынсыз  қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтарды жұмысқа орналастыру үшін квота белгілеу туралы» қаулысына өзгерістер енгізу туралы

act_code: '113712'
requisite: Постановление акимата Жылыойского района Атырауской области от 14 июня 2017 года № 212. Зарегистрировано Департаментом юстиции Атырауской области 20 июля 2017 года № 3918. Утратило силу решением Жылыойского районного маслихата Атырауской области от 26 марта 2024 года № 92 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан в Жылыойском районе из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Жылыой ауданында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарынан квота белгілеу туралы

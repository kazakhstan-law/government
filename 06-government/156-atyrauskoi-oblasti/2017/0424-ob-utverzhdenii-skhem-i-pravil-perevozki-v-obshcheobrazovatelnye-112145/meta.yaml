  title:
    rus: О внесении изменений в постановление акимата Курмангазинского района от 24 апреля 2017 года № 176 «Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Курмангазинского района»
    kaz: Құрманғазы ауданы әкімдігінің 2017 жылғы 24 сәуірдегі № 176 «Құрманғазы ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидасын бекіту туралы» қаулысына өзгерістер енгізу туралы

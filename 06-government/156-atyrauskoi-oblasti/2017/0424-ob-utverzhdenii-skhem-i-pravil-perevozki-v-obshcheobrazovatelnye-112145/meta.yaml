    kaz: Аудан әкімдігінің 2017 жылғы 24 сәуірдегі № 176 «Құрманғазы ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидасын бекіту туралы» қаулысына толықтырулар енгізу туралы

  title:
    rus: О признании утратившими силу постановлений акимата Атырауской области от 14 ноября 2017 года № 304 «О субсидировании развития племенного животноводства, повышения продуктивности и качества продукции животноводства» и от 23 февраля 2018 года № 16 «О внесении изменений в постановление акимата Атырауской области от 14 ноября 2017 года № 304 «О субсидировании развития племенного животноводства, повышения продуктивности и качества  продукции животноводства»
    kaz: Атырау облысы әкімдігінің 2017 жылғы 14 қарашадағы № 304 «Асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау туралы» және 2018 жылғы 23 ақпандағы № 16 «Атырау облысы әкімдігінің 2017 жылғы 14 қарашадағы № 304 «Асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау туралы» қаулысына өзгерістер енгізу туралы» қаулыларының күші жойылды деп тану туралы

  title:
    rus: О внесении изменения в постановление акимата Курмангазинского района от 23 января 2023 года № 8 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Курмангазинского района»
    kaz: Құрманғазы ауданы әкімдігінің 2023 жылғы 23 қаңтардағы № 8 «Құрманғазы ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата Макатского района Атырауской области от 17 августа 2023 года № 125. Утратило силу постановлением акимата Макатского района Атырауской области от 29 апреля 2024 года № 80 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О переименовании коммунального государственного учреждения «Территориальный центр социального обслуживание пенсионеров и инвалидов Макатского района Атырауской области» государственного учреждения «Макатский районный отдел занятости, социальных программ и регистрации актов гражданского состояния» в коммунальное государственное учреждение «Территориальный центр социального обслуживание пенсионеров и инвалидов Макатского района Атырауской области» государственного учреждения «Макатский районный отдел занятости и социальных программ»
  kaz: «Мақат аудандық жұмыспен қамту, әлеуметтік бағдарламалар және азаматтық хал актілерін тіркеу бөлімі» мемлекеттік мекемесінің «Атырау облысы Мақат ауданының зейнеткерлер мен мүгедектерге әлеуметтік қызмет көрсету аумақтық орталығы» коммуналдық мемлекеттік мекемесінің атауын «Мақат аудандық жұмыспен қамтужәне әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесінің «Атырау облысы Мақат ауданының зейнеткерлер мен мүгедектерге әлеуметтік қызмет көрсету аумақтық орталығы» коммуналдық мемлекеттік мекемесі етіп қайта атау туралы

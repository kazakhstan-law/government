  title:
    rus: О внесении изменения в постановление акимата Кызылкогинского района от 4 августа 2023 года № 121 «О переименовании государственного учреждение «Отдел занятости, социальных программ и регистрации актов гражданского состояния Кызылкогинского района» на государственое учреждение «Отдел занятости и социальных программ Кызылкогинского района»
    kaz: «Қызылқоға ауданы әкімдігінің 2023 жылғы 4 тамыздағы № 121 «Қызылқоға аудандық жұмыспен қамту, әлеуметтік бағдарламалар және азаматтық хал актілерін тіркеу бөлімі» мемлекеттік мекемесін «Қызылқоға аудандық жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесіне қайта атау туралы» қаулысына өзгеріс енгізу туралы»

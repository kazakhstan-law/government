title:
  rus: О переименовании государственного учреждение «Отдел занятости, социальных программ и регистрации актов гражданского состояния Кызылкогинского района» на государственное учреждение «Отдел занятости и социальных программ Кызылкогинского района»
  kaz: «Қызылқоға аудандық жұмыспен қамту, әлеуметтік бағдарламалар және азаматтық хал актілерін тіркеу бөлімі» мемлекеттік мекемесін «Қызылқоға аудандық жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесіне қайта атау туралы

title:
  rus: О переименовании государственного учреждение «Отдел занятости, социальных программ и регистрации актов гражданского состояния Макатского района» на государственное учреждение «Отдел занятости и социальных программ Макатского района»
  kaz: «Мақат аудандық жұмыспен қамту, әлеуметтік бағдарламалар және азаматтық хал актілерін тіркеу бөлімі» мемлекеттік мекемесін «Мақат аудандық жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесі етіп қайта атау туралы

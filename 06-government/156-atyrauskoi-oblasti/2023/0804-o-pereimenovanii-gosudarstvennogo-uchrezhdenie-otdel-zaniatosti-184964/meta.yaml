  title:
    rus: О внесении изменения в постановление акимата Макатского района от 4 августа 2023 года № 115 «О переименовании государственного учреждение «Отдел занятости, социальных программ и регистрации актов гражданского состояния Макатского района» на государственое учреждение «Отдел занятости и социальных программ Макатского района»
    kaz: «Мақат ауданы әкімдігінің 2023 жылғы 04 тамыздағы № 115 «Мақат аудандық жұмыспен қамту, әлеуметтік бағдарламалар және азаматтық хал актілерін тіркеу бөлімі» мемлекеттік мекемесін «Мақат аудандық жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесі етіп қайта атау туралы» қаулысына өзгеріс енгізу туралы»

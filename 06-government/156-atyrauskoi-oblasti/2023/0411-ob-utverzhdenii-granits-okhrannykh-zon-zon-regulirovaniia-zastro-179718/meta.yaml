  title:
    rus: О внесении дополнений в постановление акимата Атырауской области от 11 апреля 2023 года № 53  «Об утверждении границ охранных зон, зон регулирования застройки и зон охраняемого природного ландшафта памятников истории и культуры по Атырауской области»
    kaz: «Атырау облысы бойынша тарих және мәдениет ескерткіштерінің қорғау аймақтарының, құрылыс салуды реттеу аймақтарының және қорғалатын табиғи ландшафт аймақтарының шекараларын бекіту туралы» Атырау облысы әкімдігінің 2023 жылғы 11 сәуірдегі № 53 қаулысына толықтырулар енгізу туралы

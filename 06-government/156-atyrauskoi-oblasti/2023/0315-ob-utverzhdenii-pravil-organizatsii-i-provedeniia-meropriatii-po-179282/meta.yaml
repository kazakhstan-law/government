  title:
    rus: О внесении изменении в постановление акимата Исатайского района от 15 марта 2023 года № 42 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Исатайскому района»
    kaz: «Исатай ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Исатай ауданы әкімдігінің 2023 жылғы 15 наурыздағы № 42 қаулысына өзгерістер енгізу туралы

title:
  rus: О признании утратившим силу постановление акимата Кызылкогинского района от 13 июня 2016 года № 108 «Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Кызылкогинского района»
  kaz: Қызылқоға ауданы әкімдігінің 2016 жылғы 13 маусымдағы № 108 «Қызылқоға ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидасын бекіту туралы» қаулысының күшін жою туралы

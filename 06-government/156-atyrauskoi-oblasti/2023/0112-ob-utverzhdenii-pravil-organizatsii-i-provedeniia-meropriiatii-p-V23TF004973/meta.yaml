  title:
    rus: О внесении изменении в постановление акимата Индерского района от 12 января 2023 года № 7 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Индерского района»
    kaz: «Индер ауданының елді мекендерінде бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Индер ауданы әкімдігінің 2023 жылғы 12 қаңтардағы № 7 қаулысына өзгерістер енгізу туралы

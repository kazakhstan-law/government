requisite: Постановление акимата города Атырау Атырауской области от 25 мая 2023 года № 1030. Зарегистрировано в Департаменте юстиции Атырауской области 29 мая 2023 года № 5028-06. Утратило силу постановлением акимата города Атырау Атырауской области от 19 июня 2025 года № 1467 (вводится в действие по истечении десяти календарных дней после дня его официального опубликования)
title:
  rus: Об определении и утверждении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам внутренней торговли на территории Города Атырау
  kaz: Атырау қаласы аумағында ішкі сауда субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін арнайы бөлінген орындарды белгілеу және бекіту туралы

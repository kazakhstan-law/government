  title:
    rus: О внесении изменений в постановление акимата Макатского района от 7 августа 2023 года № 116 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Макатского района»
    kaz: «Мақат ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Мақат ауданы әкімдігінің 2023 жылғы 7 тамыздағы № 116 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Индерского района от 12 января 2023 года № 7 «Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Индерского района»
    kaz: «Индер ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Индер ауданы әкімдігінің 2023 жылғы 12 қаңтарындағы № 7 қаулысына өзгеріс енгізу туралы

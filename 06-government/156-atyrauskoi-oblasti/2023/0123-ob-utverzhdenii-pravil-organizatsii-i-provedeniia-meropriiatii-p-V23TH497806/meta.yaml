  title:
    rus: О внесении изменений в постановление акимата Курмангазинского района от 23 января 2023 года № 8 «Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Курмангазинского района»
    kaz: «Құрманғазы ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Құрманғазы ауданы әкімдігінің 2023 жылғы 23 қаңтардағы № 8 қаулысына өзгерістер енгізу туралы

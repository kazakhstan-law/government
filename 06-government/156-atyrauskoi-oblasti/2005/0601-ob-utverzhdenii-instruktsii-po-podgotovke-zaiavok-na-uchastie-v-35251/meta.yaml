act_code: '35251'
requisite: Постановление Атырауского областного акимата от 1 июня 2005 года № 182. Зарегистрировано Департаментом юстиции Атырауской области 24 июня 2005 года за № 2435. Утратило силу постановлением Атырауского областного акимата от 4 марта 2011 года № 63
title:
  rus: Об утверждении инструкции по подготовке заявок на участие в конкурсе и конкурсных предложений на получение права недропользования на разведку, добычу и совмещенную разведку и добычу общераспространенных полезных ископаемых в Атырауской области
  kaz: Aтырау облысында кең таралған пайдалы қазбаларды барлауды, өндіруді немесе бірлескен барлауды және өндіруді жүргізуге жер қойнауын пайдалану құқығын алуға арналған конкурсқа қатысу және конкурстық ұсыныстарды әзірлеу жөніндегі нұсқаулықты бекіту туралы

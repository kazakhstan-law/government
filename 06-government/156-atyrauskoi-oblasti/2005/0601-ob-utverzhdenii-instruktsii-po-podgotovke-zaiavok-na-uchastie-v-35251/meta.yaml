  title:
    rus: О внесении изменений и дополнений в постановление акимата области от 1 июня 2005 года № 182 "Об утверждении инструкции по подготовке заявок на участие в конкурсе и конкурсных предложений на получение права недропользования на разведку, добычу и совмещенную разведку и добычу общераспространенных полезных ископаемых в Атырауской области"
    kaz: Облыс әкімиятының 2005 жылғы 1 маусымдағы № 182 "Aтырау облысында кең таралған пайдалы қазбаларды барлауды, өндіруді немесе бірлескен барлауды және өндіруді жүргізуге жер қойнауын пайдалану құқығын алуға арналған конкурсқа қатысу және конкурстық ұсыныстарды әзірлеу жөніндегі нұсқаулықты бекіту туралы" қаулысына өзгерістер мен толықтырулар енгізу туралы

requisite: Постановление акимата Махамбетского района Атырауской области от 23 июня 2020 года № 138. Зарегистрировано Департаментом юстиции Атырауской области 29 июня 2020 года № 4683. Утратило силу постановлением акимата Махамбетского района Атырауской области от 20 февраля 2024 года № 50 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

  title:
    rus: О внесении изменений в постановление акимата Махамбетского района от 23 июня 2020 года № 138 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта являющихся гражданскими служащими и работающих в сельской местности»
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Махамбет аудандық әкімдігінің 2020 жылғы 23 маусымдағы № 138 қаулысына өзгерістер енгізу туралы

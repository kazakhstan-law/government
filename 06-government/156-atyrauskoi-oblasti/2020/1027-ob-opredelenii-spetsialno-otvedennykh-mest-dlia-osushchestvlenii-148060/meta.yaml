title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам внутренней торговли на территории Кызылкогинского района
  kaz: Қызылқоға ауданы аумағында ішкі сауда субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін арнайы бөлінген орындарды айқындау туралы

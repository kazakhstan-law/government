requisite: Постановление акимата Курмангазинского района Атырауской области от 9 декабря 2020 года № 354. Зарегистрировано Департаментом юстиции Атырауской области 14 декабря 2020 года № 4815. Утратило силу постановлением акимата Курмангазинского района Атырауской области от 20 июля 2023 года № 190 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования и культуры, являющихся гражданскими служащими и работающих в сельской местности, финансируемых из районного бюджета
  kaz: Аудандық бюджеттен қаржыландырылатын, азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

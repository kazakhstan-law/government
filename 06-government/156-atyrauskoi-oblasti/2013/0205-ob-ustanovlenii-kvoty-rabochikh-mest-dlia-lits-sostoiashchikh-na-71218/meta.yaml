act_code: '71218'
requisite: Постановление акимата Индерского района Атырауской области от 05 февраля 2013 года № 44. Зарегистрировано Департаментом юстиции Атырауской области 27 февраля 2013 года № 2697.  Утратило силу постановлением Индерского районного акимата Атырауской области от 25 апреля 2016 года № 108
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной испекции, а также лиц, освобожденных  из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Индерском районе
  kaz: Индер ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан  босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

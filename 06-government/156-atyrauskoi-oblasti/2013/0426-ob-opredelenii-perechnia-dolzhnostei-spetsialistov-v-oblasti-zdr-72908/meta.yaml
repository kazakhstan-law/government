    kaz: Атырау облысы әкімдігінің 2013 жылғы 26 сәуірдегі № 158 "Ауылдық (селолық)  жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандары лауазымдарының тізбесін айқындау туралы" қаулысына өзгерістер енгізу туралы

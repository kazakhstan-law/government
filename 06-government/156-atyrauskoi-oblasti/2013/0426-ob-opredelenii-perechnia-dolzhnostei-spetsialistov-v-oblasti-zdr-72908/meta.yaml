act_code: '72908'
requisite: Постановление областного акимата Атырауской области от 26 апреля 2013 года № 158. Зарегистрировано Департаментом юстиции Атырауской области 04 июня 2013 года № 2734. Утратило силу постановлением акимата Атырауской области от 08 января 2016 года № 2.
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности, финансируемых из областного бюджета
  kaz: Облыстық бюджеттен қаржыландырылатын, азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

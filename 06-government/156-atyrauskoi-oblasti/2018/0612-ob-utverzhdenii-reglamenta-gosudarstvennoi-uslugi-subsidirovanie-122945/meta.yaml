requisite: Постановление акимата Атырауской области от 12 июня 2018 года № 132. Зарегистрировано Департаментом юстиции Атырауской области 27 июня 2018 года № 4182. Утратило силу постановлением акимата Атырауской области от 25 декабря 2019 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование по возмещению части расходов, понесенных субъектом агропромышленного комплекса при инвестиционных вложениях»

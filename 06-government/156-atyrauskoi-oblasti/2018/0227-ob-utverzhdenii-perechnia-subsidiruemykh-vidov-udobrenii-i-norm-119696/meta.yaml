  title:
    rus: О внесении дополнений в постановление акимата Атырауской области от 27 февраля 2018 года № 37 «Об утверждении перечня субсидируемых видов удобрений и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений
    kaz: Атырау облысы әкімдігінің 2018 жылғы 27 ақпандағы № 37 «Cубсидияланатын тыңайтқыштар түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (килограмына, литріне) арналған субсидиялардың нормаларын бекіту туралы» қаулысына толықтырулар енгізу туралы

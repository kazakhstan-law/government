requisite: Постановление акимата Атырауской области от 17 апреля 2018 года № 81. Зарегистрировано Департаментом юстиции Атырауской области 5 мая 2018 года № 4146. Утратило силу постановлением акимата Атырауской области от 25 декабря 2019 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов и выдача направлений на предоставление отдыха в загородных и пришкольных лагерях отдельным категориям обучающихся и воспитанников государственных учреждений образования»
  kaz: «Мемлекеттік білім беру мекемелеріндегі білім алушылар мен тәрбиеленушілердің жекелеген санаттарына қала сыртындағы және мектеп жанындағы лагерьлерде демалуы үшін құжаттар қабылдау және жолдама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

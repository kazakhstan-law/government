title:
  rus: Об утверждении нормативов субсидий, критерий к получателям субсидий, и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Атырауской области на 2021 год
  kaz: 2021 жылға арналған Атырау облысы бойынша ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтері, субсидиялар алушыларға қойылатын өлшемшарттар, субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы

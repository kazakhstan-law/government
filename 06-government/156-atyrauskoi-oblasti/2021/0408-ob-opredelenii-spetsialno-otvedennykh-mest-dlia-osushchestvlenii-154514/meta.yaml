requisite: Постановление акимата Макатского района Атырауской области от 8 апреля 2021 года № 63. Зарегистрировано Департаментом юстиции Атырауской области 9 апреля 2021 года № 4920. Утратило силу постановлением акимата Макатского района Атырауской области от 18 сентября 2023 года № 139 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам внутренней торговли на территории Макатского района
  kaz: Мақат ауданы аумағында ішкі сауда субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін арнайы бөлінген орындарды айқындау туралы

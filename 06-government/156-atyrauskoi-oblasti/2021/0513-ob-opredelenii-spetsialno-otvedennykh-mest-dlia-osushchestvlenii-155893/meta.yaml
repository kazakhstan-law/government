requisite: Постановление акимата города Атырау Атырауской области от 13 мая 2021 года № 1308. Зарегистрировано Департаментом юстиции Атырауской области 14 мая 2021 года № 4958. Утратило силу постановлением акимата города Атырау Атырауской области от 25 мая 2023 года № 1030 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специально отведенных мест для осуществления выездной торговли с автолавок и (или) палаток (павильонов) субъектам внутренней торговли на территории города Атырау
  kaz: Атырау қаласы аумағында ішкі сауда субъектілеріне автодүкендерде және (немесе) шатырларда (павильондарда) көшпелі сауданы жүзеге асыру үшін арнайы бөлінген орындарды белгілеу туралы

  title:
    rus: О внесении изменения и дополнений в постановление акимата Атырауской области от 10 декабря 2021 года № 280 «Об утверждении перечня особо важных локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Атырауской области»
    kaz: Атырау облысы әкімдігінің 2021 жылғы 10 желтоқсандағы № 280 «Атырау облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды оқшау жүйелерінің тізбесін бекіту туралы» қаулысына өзгеріс пен толықтырулар енгізу туралы

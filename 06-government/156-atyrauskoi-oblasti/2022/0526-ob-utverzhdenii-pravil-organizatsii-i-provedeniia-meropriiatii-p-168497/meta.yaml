  title:
    rus: О внесении изменении в постановление акимата города Атырау от 26 мая 2022 года № 1179 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Атырау»
    kaz: «Атырау қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Атырау қаласы әкімдігінің 2022 жылғы 26 мамырдағы № 1179 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Курмангазинского района Атырауской области от 4 июля 2022 года № 239. Отменен постановлением акимата Курмангазинского района Атырауской области от 24 июля 2023 № 209 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О переименовании государственного учреждения «Курмангазинский районный отдел занятости, социальных программ и регистрации актов гражданского состояния Атырауской области» в государственное учреждение «Отдел занятости, социальных программ и регистрации актов гражданского состояния Курмангазинского района Атырауской области»
  kaz: «Атырау облысы Құрманғазы аудандық жұмыспен қамту, әлеуметтік бағдарламалар және азаматтық хал актілерін тіркеу бөлімі» мемлекеттік мекемесінің атауын «Атырау облысы Құрманғазы ауданының жұмыспен қамту, әлеуметтік бағдарламалар және азаматтық хал актілерін тіркеу бөлімі» мемлекеттік мекемесіне өзгерту туралы

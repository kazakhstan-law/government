  title:
    rus: О внесении изменений в постановление акимата Жылыойского района от 22 декабря 2022 года № 333 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жылыойскому району»
    kaz: «Жылыой ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Жылыой ауданы әкімдігінің 2022 жылғы 22 желтоқсандағы № 333 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 марта 2005 года N 98 "Об утверждении Инструкции о требованиях к представлению временной администрацией (временным администратором) банка, страховой (перестраховочной) организации и накопительного пенсионного фонда отчетности и иной информации"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банктің, сақтандыру (қайта сақтандыру) ұйымының және жинақтаушы зейнетақы қорының уақытша әкімшілігінің (уақытша басқарушының) есеп пен өзге ақпаратты беруіне қойылатын талаптар туралы нұсқаулықты бекіту жөнінде" 2005 жылғы 26 наурыздағы N 98 қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 марта 2005 года N 109 "Об утверждении Правил оценки финансовых инструментов, находящихся в инвестиционных портфелях накопительных пенсионных фондов"
    kaz: '"Жинақтаушы зейнетақы қорларының инвестициялық портфельдеріндегі қаржы құралдарын бағалау ережесін бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2005 жылғы 26 наурыздағы N 109 қаулысына өзгерістер енгізу туралы'

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам деятельности организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами, и оценки финансовых инструментов, находящихся в инвестиционных портфелях накопительных пенсионных фондов
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың қызметі және жинақтаушы зейнетақы қорларының инвестициялық портфельдеріндегі қаржы құралдарын бағалау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Жинақтаушы зейнетақы қорларының инвестициялық портфельдеріндегі қаржы құралдарын бағалау ережесін бекіту туралы" 2005 жылғы 26 наурыздағы № 109 қаулысына өзгеріс пен толықтырулар енгізу туралы

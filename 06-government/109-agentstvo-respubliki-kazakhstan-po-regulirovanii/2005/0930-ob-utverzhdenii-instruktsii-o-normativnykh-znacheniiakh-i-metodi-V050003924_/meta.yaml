  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года № 126. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 октября 2010 года № 6543. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 30 мая 2016 года № 147
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 сентября 2005 года № 358 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов для банков второго уровня"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екiншi деңгейдегi банктер үшiн пруденциалдық нормативтер есеп айырысуларының нормативтiк мәнi мен әдiстемесi туралы нұсқаулықты бекiту туралы" 2005 жылғы 30 қыркүйектегі № 358 қаулысына өзгерістер мен толықтырулар енгізу туралы

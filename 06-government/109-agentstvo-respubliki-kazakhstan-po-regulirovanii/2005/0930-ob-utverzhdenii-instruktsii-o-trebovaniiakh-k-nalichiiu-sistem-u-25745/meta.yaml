  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 сентября 2005 года № 359 "Об утверждении Инструкции о требованиях к наличию систем управления рисками и внутреннего контроля в банках второго уровня и внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 марта 2005 года № 116 "О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора финансового рынка и финансовых организаций"
    kaz: '"Екiншi деңгейдегi банктерде тәуекелдердi басқару және iшкi бақылау жүйелерiнiң болуына қойылатын талаптар жөнiндегi Нұсқаулықты бекiту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттiгi Басқармасының "Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау мәселелері бойынша Қазақстан Республикасының кейбір нормативтік құқықтық актiлерiне өзгерiстер енгiзу туралы" 2005 жылғы 26 наурыздағы № 116 қаулысына өзгерістер енгізу туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттiгi Басқармасының 2005 жылғы 30-қыркүйектегi № 359 қаулысына өзгерiстер мен толықтырулар енгiзу туралы"'
  link: https://zan.gov.kz/client/#!/doc/30604/rus

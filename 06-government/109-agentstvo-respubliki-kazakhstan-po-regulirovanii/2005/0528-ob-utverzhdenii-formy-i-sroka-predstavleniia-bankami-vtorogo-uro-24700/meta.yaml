requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 мая 2005 года N 162. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 июля 2005 года N 3722. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года N 131

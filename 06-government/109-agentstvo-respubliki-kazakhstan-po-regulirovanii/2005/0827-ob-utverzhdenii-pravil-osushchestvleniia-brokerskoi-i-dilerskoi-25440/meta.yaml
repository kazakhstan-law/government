  title:
    rus: Об утверждении Правил расчета пруденциальных нормативов для организаций, осуществляющих брокерскую и дилерскую деятельность с правом ведения счетов клиента в качестве номинального держателя и отдельные виды банковских операций и внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций
    kaz: Номиналды ұстаушы ретінде клиенттің шоттарын жүргізу құқығымен брокерлік және дилерлік қызметті және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар үшін пруденциалдық нормативтерді есептеу ережесін бекіту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу туралы

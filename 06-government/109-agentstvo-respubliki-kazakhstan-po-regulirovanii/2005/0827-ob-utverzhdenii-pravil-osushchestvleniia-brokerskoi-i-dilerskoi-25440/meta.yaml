    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қазақстан Республикасының бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыру ережесін бекіту туралы" 2005 жылғы 27 тамыздағы № 317 қаулысына өзгеріс енгізу туралы

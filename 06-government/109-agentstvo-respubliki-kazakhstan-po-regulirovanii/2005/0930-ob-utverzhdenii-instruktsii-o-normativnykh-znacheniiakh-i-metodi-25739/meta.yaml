  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 сентября 2005 года № 358 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов для банков второго уровня" и внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 146 "О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 сентября 2005 года № 358 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов для банков второго уровня"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының «Екiншi деңгейдегi банктер үшiн пруденциалдық нормативтер есеп айырысуларының нормативтiк мәнi мен әдiстемесi туралы нұсқаулықты бекiту туралы» 2005 жылғы 30 қыркүйектегі № 358 қаулысына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының «Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының «Екiншi деңгейдегi банктер үшiн пруденциалдық нормативтер есеп айырысуларының нормативтiк мәнi мен әдiстемесi туралы нұсқаулықты бекiту туралы» 2005 жылғы 30 қыркүйектегі № 358 қаулысына өзгерістер мен толықтырулар енгізу туралы» 2008 жылғы 2 қазандағы № 146 қаулысына өзгерістер енгізу туралы

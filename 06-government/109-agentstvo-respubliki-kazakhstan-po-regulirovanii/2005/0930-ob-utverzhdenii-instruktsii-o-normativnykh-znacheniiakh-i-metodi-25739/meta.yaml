title:
  rus: Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов для банков второго уровня
  kaz: Екiншi деңгейдегi банктер үшiн пруденциалдық нормативтер есеп айырысуларының нормативтiк мәнi мен әдiстемесi туралы нұсқаулықты бекiту туралы

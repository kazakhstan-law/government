  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 сентября 2005 года № 358 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов для банков второго уровня"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктер үшін пруденциалдық нормативтер есеп айырысуларының нормативтік мәні мен әдістемесі туралы нұсқаулықты бекіту туралы" 2005 жылғы 30 қыркүйектегі № 358 қаулысына өзгерістер мен толықтырулар енгізу туралы

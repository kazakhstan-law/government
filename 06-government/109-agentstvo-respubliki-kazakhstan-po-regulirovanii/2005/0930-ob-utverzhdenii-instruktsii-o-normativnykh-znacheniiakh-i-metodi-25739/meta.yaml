  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 сентября 2005 года № 358 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов для банков второго уровня"
    kaz: Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктер үшін пруденциалдық нормативтер бойынша есеп айырысудың нормативтік мәні мен әдістемесі туралы нұсқаулықты бекіту туралы" 2005 жылғы 30 қыркүйектегі № 358 қаулысына толықтырулар мен өзгерістер енгізу туралы

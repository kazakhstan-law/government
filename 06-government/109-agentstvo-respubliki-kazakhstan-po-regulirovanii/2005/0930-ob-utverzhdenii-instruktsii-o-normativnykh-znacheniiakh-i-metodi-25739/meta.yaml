    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының кейбір қаулыларына екінші деңгейдегі банктердің қызметін пруденциялдық реттеу мәселелері бойынша өзгерістер енгізу туралы

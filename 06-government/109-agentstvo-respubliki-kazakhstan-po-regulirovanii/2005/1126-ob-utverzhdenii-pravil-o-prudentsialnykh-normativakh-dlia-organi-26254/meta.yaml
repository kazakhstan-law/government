  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 ноября 2005 года № 412 "Об утверждении Правил о пруденциальных нормативах для организаций, осуществляющих инвестиционное управление пенсионными активами"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтер туралы ережені бекіту жөнінде" 2005 жылғы 26 қарашадағы № 412 қаулысына толықтырулар мен өзгерістер енгізу туралы

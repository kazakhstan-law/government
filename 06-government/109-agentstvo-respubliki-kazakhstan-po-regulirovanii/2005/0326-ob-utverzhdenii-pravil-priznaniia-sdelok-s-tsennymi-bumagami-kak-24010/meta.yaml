    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалы қағаздармен жасалған мәмілелерді бағаны манипуляциялау мақсатында жасалған деп тану ережесін бекіту туралы" 2005 жылғы 26 наурыздағы N 110 қаулысына өзгеріс енгізу туралы

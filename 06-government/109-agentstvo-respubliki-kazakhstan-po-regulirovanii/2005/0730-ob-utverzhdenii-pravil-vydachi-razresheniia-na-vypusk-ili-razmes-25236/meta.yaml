title:
  rus: Об утверждении Правил выдачи разрешения на выпуск или размещение эмиссионных ценных бумаг организации-резидента Республики Казахстан на территории иностранного государства
  kaz: Қазақстан Республикасы резиденті-ұйымының эмиссиялық бағалы қағаздарын шет мемлекеттің аумағында шығаруға немесе орналастыруға рұқсат беру ережесін бекіту туралы

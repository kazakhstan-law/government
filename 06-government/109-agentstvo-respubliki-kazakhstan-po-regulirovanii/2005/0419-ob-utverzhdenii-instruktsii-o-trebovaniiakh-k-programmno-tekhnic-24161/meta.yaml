  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 19 апреля 2005 года № 132 "Об утверждении Инструкции о требованиях к программно-техническим средствам, необходимым для осуществления деятельности на рынке ценных бумаг"

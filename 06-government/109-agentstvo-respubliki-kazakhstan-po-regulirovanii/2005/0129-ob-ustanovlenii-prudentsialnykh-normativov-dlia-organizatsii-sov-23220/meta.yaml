  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 января 2005 года № 17 "Об установлении пруденциальных нормативов для организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг, утверждении Правил расчета пруденциальных нормативов для организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг"»
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалы қағаздар рыногында кәсіби қызмет түрлерін қоса атқаратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, Бағалы қағаздар рыногында кәсіби қызмет түрлерін қоса атқаратын ұйымдарға арналған пруденциалдық нормативтерді есептеу ережесін бекіту жөнінде" 2005 жылғы 29 қаңтардағы № 17 қаулысына толықтырулар мен өзгерістер енгізу туралы

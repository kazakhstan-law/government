  title:
    rus: О внесении дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 января 2005 года N 17 "Об установлении пруденциальных нормативов для организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг, утверждении Правил расчета пруденциальных нормативов для организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг, и представления отчетов об их выполнении"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалы қағаздар рыногында кәсіби қызмет түрлерін қоса атқаратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, Бағалы қағаздар рыногында кәсіби қызмет түрлерін қоса атқаратын ұйымдарға арналған пруденциалдық нормативтерді есептеу және олардың орындалуы туралы есептерді ұсыну ережесін бекіту жөніндегі" 2005 жылғы 29 қаңтардағы N 17 қаулысына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/24866/rus

act_code: '23220'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 января 2005 года N 17. Зарегистрировано в Министерстве юстиции Республики Казахстан от 10 марта 2005 года N 3484. Утратило силу - от 17 июня 2006 года N 132 (вводится в действие по истечении 14 дней со дня гос.регистрации в МЮ РК и его действие распространяется на отношения, возникшие с 1 июля 2006 года)
title:
  rus: Об установлении пруденциальных нормативов для организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг, утверждении Правил расчета пруденциальных нормативов для организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг
  kaz: Бағалы қағаздар рыногында кәсіби қызмет түрлерін қоса атқаратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, Бағалы қағаздар рыногында кәсіби қызмет түрлерін қоса атқаратын ұйымдарға арналған пруденциалдық нормативтерді есептеу ережесін бекіту туралы

caused_by:
  code: '29000'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 17 июня 2006 года № 130. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 июля 2006 года № 4309. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года № 214
  title:
    rus: О внесении дополнения и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 июля 2005 года N 271 "Об утверждении Правил уведомления о выпуске депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги эмитентов-резидентов Республики Казахстан, представления отчета об итогах их размещения, а также выдачи разрешения на выпуск или размещение производных ценных бумаг на территории иностранного государства"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Депозитарлық қолхаттарды немесе базалық активі Қазақстан Республикасы резиденттерінің-эмитенттерінің эмиссиялық бағалы қағаздары болып табылатын өзге де бағалы қағаздарды шығару жөнінде хабардар ету, оларды орналастыру қорытындылары жөніндегі есепті беру, сондай-ақ шет мемлекеттің аумағында туынды бағалы қағаздарды шығаруға немесе орналастыруға рұқсат беру ережесін бекіту туралы" 2005 жылғы 30 шілдедегі N 271 қаулысына толықтыру мен өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/29000/rus

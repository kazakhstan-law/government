act_code: '25251'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 июля 2005 года N 271. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 сентября 2005 года N 3833. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года N 214
title:
  rus: Об утверждении Правил уведомления о выпуске депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги эмитентов-резидентов Республики Казахстан, представления отчета об итогах их размещения, а также выдачи разрешения на выпуск или размещение производных ценных бумаг на территории иностранного государства
  kaz: Депозитарлық қолхаттарды немесе базалық активі Қазақстан Республикасы резиденттерінің-эмитенттерінің эмиссиялық бағалы қағаздары болып табылатын өзге де бағалы қағаздарды шығару жөнінде хабардар ету, оларды орналастыру қорытындылары жөніндегі есепті беру, сондай-ақ шет мемлекеттің аумағында туынды бағалы қағаздарды шығаруға немесе орналастыруға рұқсат беру ережесін бекіту туралы

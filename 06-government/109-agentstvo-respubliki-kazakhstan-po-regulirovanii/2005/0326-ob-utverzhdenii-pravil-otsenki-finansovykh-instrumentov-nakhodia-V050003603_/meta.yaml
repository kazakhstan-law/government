  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам оценки финансовых инструментов
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне қаржы құралдарын бағалау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

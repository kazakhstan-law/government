  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 130. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 сентября 2008 года № 5319. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 3 февраля 2014 года № 9
  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 августа 2005 года № 317 "Об утверждении Правил осуществления брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан и внесении изменения в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 20 апреля 1999 года № 30 "О внесении изменений в некоторые нормативные правовые акты Национальной комиссии Республики Казахстан по ценным бумагам по вопросам допуска физических лиц к выполнению работ на рынке ценных бумаг"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қазақстан Республикасының бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыру ережесін бекіту және Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссиясының "Жеке тұлғаларға бағалы қағаздар рыногында жұмыстарды орындауға рұқсат беру мәселелері бойынша Қазақстан Республикасы Бағалы қағаздар жөніндегі ұлттық комиссиясының кейбір нормативтік құқықтық актілеріне өзгерістер енгізу туралы" 1999 жылғы 20 сәуірдегі № 30 қаулысына өзгеріс енгізу туралы" 2005 жылғы 27 тамыздағы № 317 қаулысына өзгерістер мен толықтыру енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 августа 2005 года № 317 "Об утверждении Правил осуществления брокерской и дилерской деятельности на рынке ценных бумаг Республики Казахстан"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қазақстан Республикасының бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыру ережесін бекіту туралы" 2005 жылғы 27 тамыздағы № 317 қаулысына өзгерістер мен толықтырулар енгізу туралы

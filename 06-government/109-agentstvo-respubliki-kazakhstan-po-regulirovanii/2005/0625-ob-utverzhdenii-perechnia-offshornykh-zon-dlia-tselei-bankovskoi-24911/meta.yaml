  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 февраля 2007 года N 39. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 марта 2007 года N 4591. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 145
  title:
    rus: О внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2005 года N 230 "Об утверждении Перечня оффшорных зон для целей банковской и страховой деятельности, деятельности профессиональных участников рынка ценных бумаг и иных лицензируемых видов деятельности на рынке ценных бумаг, деятельности накопительных пенсионных фондов и акционерных инвестиционных фондов"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банктік және сақтандыру қызметінің, бағалы қағаздар рыногына кәсіби қатысушылардың және бағалы қағаздар рыногында лицензияланатын басқа да қызмет түрлерінің, жинақтаушы зейнетақы қорлары мен акционерлік инвестициялық қорлар қызметінің мақсаттары үшін оффшорлық аймақтардың тізбесін бекіту туралы" 2005 жылғы 25 маусымдағы N 230 қаулысына өзгеріс енгізу туралы

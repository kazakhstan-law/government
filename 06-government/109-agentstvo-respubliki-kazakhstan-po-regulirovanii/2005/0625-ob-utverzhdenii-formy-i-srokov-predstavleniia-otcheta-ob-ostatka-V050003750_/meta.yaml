  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2005 года № 224 "Об утверждении формы отчета об остатках на балансовых и внебалансовых счетах банков второго уровня"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктердің баланстық және баланстан тыс шоттарындағы қалдықтар жөніндегі есеп нысандарын бекіту туралы" 2005 жылғы 25 маусымдағы N 224 қаулысына өзгерістер мен толықтырулар енгізу туралы

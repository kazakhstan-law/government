  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 февраля 2011 года № 18 "Об утверждении перечня обязательных условий договора банковского займа и внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 февраля 2007 года № 49 "Об утверждении Правил ведения документации по кредитованию"
    kaz: '"Банктік заем шартының міндетті талаптарының тізбесін бекіту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Кредиттеу жөніндегі құжаттамасын жүргізу ережесін бекіту туралы" 2007 жылғы 23 ақпандағы № 49 қаулысына толықтырулар мен өзгерістер енгізу туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2011 жылғы 28 ақпандағы № 18 қаулысына өзгерістер мен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/100468/rus

  requisite: Постановление Правления Национального Банка Республики Казахстан от 23 декабря 2019 года № 248. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 декабря 2019 года № 19774. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 15 мая 2026 года № 91 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении Порядка заключения договора банковского займа, в том числе требований к содержанию, оформлению, обязательным условиям договора банковского займа, форм графика погашения займа и памятки для заемщика - физического лица
    kaz: Банктік қарыз шартын жасасу тәртібін, оның ішінде банктік қарыз шартының мазмұнына, ресімделуіне, міндетті талаптарына қойылатын талаптарды, қарызды өтеу кестесінің және қарыз алушы – жеке тұлғаға арналған жадынаманың нысандарын бекіту туралы

    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам проведения операции по одновременной передаче активов и обязательств между банками
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне банктер арасындағы активтер мен міндеттемелерді бірмезгілде беру жөніндегі операцияны жүргізу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

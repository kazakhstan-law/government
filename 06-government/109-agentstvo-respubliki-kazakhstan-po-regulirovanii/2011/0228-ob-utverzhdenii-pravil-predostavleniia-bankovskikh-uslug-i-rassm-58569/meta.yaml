requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 февраля 2011 года № 19. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 апреля 2011 года № 6884. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 июля 2017 года № 136 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил предоставления банковских услуг и рассмотрения банками обращений клиентов, возникающих в процессе предоставления банковских услуг

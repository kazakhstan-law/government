act_code: '52088'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 26. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2010 года № 6167
title:
  rus: Об утверждении нормативных правовых актов, регулирующих деятельность Акционерного общества "Фонд гарантирования страховых выплат"
  kaz: '"Сақтандыру төлемдеріне кепілдік беру қоры" акционерлік қоғамының қызметін реттейтін нормативтік құқықтық актілерді бекіту туралы'

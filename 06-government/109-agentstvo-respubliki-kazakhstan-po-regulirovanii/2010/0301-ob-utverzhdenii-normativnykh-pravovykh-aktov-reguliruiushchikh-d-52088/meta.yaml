caused_by:
  code: '109896'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 305. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 февраля 2017 года № 14784. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении Правил выдачи согласия на назначение (избрание) руководящих работников финансовых организаций, банковских, страховых холдингов, акционерного общества «Фонд гарантирования страховых выплат», включая критерии отсутствия безупречной деловой репутации, и перечня документов, необходимых для получения согласия
    kaz: Мінсіз іскерлік беделінің болмауы өлшемшартын қоса алғанда, қаржы ұйымдарының, банктің, сақтандыру холдингтерінің, «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының басшы қызметкерлерін тағайындауға (сайлауға) келісім беру қағидаларын және келісім алу үшін қажетті құжаттар тізбесін бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/109896/rus

  code: '65000'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 68. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2012 года № 7556. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 196
  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам представления отчетности накопительными пенсионными фондами, организациями, осуществляющими инвестиционное управление пенсионными активами и банками-кастодианами накопительных пенсионных фондов в части мультипортфельной системы инвестирования
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне жинақтаушы зейнетақы қорларының, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың және жинақтаушы зейнетақы қорларының кастодиан-банктерінің инвестициялаудың мультипортфельді жүйесі бөлігінде есептілікті ұсыну мәселелері бойынша өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/65000/rus

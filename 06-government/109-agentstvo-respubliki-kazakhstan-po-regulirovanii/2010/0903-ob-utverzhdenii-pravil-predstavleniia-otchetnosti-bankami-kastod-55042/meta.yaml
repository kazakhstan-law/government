act_code: '55042'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года № 127. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 октября 2010 года № 6557. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 196
title:
  rus: Об утверждении Правил представления отчетности банками-кастодианами накопительных пенсионных фондов
  kaz: Жинақтаушы зейнетақы қорлары кастодиан банктерiнің есептілікті беру ережесін бекіту туралы

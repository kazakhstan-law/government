  title:
    rus: О внесении дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 25 «Об утверждении Требований к осуществлению страховой организацией, филиалом страховой организации-нерезидента Республики Казахстан страховой деятельности, в том числе во взаимоотношениях с участниками страхового рынка, к договору поручения, заключаемому между страховой организацией и страховым агентом, и полномочиям страхового агента на осуществление посреднической деятельности на страховом рынке, а также минимальной программы обучения страховых агентов и требований к порядку проведения обучения»
    kaz: «Сақтандыру ұйымының, Қазақстан Республикасы бейрезидент сақтандыру ұйымы филиалының сақтандыру, оның ішінде сақтандыру нарығының қатысушыларымен өзара қарым-қатынастағы қызметін жүзеге асыруға, сақтандыру ұйымы мен сақтандыру агентінің  арасында жасалатын тапсырма шартына қойылатын және сақтандыру агентінің сақтандыру нарығында делдалдық қызметті жүзеге асыруға өкілеттіктеріне қойылатын талаптарды, сондай-ақ сақтандыру агенттерін оқытудың ең қысқа бағдарламасын және оқытуды жүргізудің тәртібіне қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2010 жылғы 1 наурыздағы № 25 қаулысына толықтырулар енгізу туралы

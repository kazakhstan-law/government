title:
  rus: Об утверждении нормативных правовых актов, регулирующих организацию и осуществление деятельности по обязательному страхованию работника от несчастных случаев при исполнении им трудовых (служебных) обязанностей
  kaz: Қызметкер еңбек (қызмет) міндеттерін атқарған кезде жазатайым жағдайлардан оны мiндеттi сақтандыру жөніндегі қызметті жүзеге асыруды және ұйымдастыруды реттейтін нормативтік құқықтық актілерді бекіту туралы

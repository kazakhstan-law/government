    kaz: Қазақстан Республикасының қаржы нарығын және қаржы ұйымдарын реттеу, бақылау және қадағалау мәселелері жөніндегі кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу туралы

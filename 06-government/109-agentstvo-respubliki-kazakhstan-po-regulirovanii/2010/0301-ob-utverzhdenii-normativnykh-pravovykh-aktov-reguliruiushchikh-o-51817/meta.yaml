  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 28 "Об утверждении нормативных правовых актов, регулирующих организацию и осуществление деятельности по обязательному страхованию работника от несчастных случаев при исполнении им трудовых (служебных) обязанностей"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қызметкер еңбек (қызмет) міндеттерін атқарған кезде жазатайым жағдайлардан оны міндетті сақтандыру жөніндегі қызметті жүзеге асыруды және ұйымдастыруды реттейтін нормативтік құқықтық актілерді бекіту туралы" 2010 жылғы 1 наурыздағы № 28 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '55033'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года № 135. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 октября 2010 года № 6546.
title:
  rus: Об утверждении Инструкции о мерах по поддержанию страховым холдингом, а также крупным участником страховой (перестраховочной) организации - физическим лицом, владеющим прямо или косвенно более двадцатью пятью процентами голосующих (за вычетом привилегированных) акций страховой (перестраховочной) организации, пруденциальных нормативов
  kaz: Сақтандыру холдингінің, сондай-ақ сақтандыру (қайта сақтандыру) ұйымының ірі қатысушысы - сақтандыру (қайта сақтандыру) ұйымының дауыс беретін акцияларының (артықшылықты акцияларды шегере отырып) жиырма бес пайыздан астамын тікелей немесе жанама иеленетін жеке тұлғаның пруденциялық нормативтерді ұстап тұру бойынша шаралар туралы нұсқаулықты бекіту туралы

  kaz: Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру жөнiндегi қызметті ұйымдастыруды және жүзеге асыруды реттейтін нормативтік құқықтық актілерді бекіту туралы

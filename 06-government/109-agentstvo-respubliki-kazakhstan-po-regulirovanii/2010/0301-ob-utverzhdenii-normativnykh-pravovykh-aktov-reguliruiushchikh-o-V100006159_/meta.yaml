requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 27. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2010 года № 6159. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 30 мая 2016 года № 140
title:
  rus: Об утверждении нормативных правовых актов, регулирующих организацию и осуществление деятельности по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств
  kaz: Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру жөнiндегi қызметті ұйымдастыруды және жүзеге асыруды реттейтін нормативтік құқықтық актілерді бекіту туралы

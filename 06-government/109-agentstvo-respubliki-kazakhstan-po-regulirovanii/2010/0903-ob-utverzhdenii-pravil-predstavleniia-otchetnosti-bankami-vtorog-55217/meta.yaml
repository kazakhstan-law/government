    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қазақстан Республикасының екінші деңгейдегі банктерінің есептілікті ұсыну ережесін бекіту туралы" 2010 жылғы 3 қыркүйектегі № 130 қаулысына өзгерістер мен толықтыру енгізу туралы

act_code: '54932'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года № 134. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 октября 2010 года № 6540. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2018 года № 190 (вводится в действие с 1 октября 2018 года)
title:
  rus: Об утверждении Правил участия страхователя в инвестициях или прибыли страховой организации
  kaz: Сақтанушының сақтандыру ұйымының инвестицияларына немесе кірістеріне қатысу ережесін бекіту туралы

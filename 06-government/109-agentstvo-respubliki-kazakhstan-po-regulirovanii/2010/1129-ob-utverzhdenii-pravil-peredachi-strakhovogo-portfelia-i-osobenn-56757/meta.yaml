act_code: '56757'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 ноября 2010 года № 171. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 января 2011 года № 6722. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 303.
title:
  rus: Об утверждении Правил передачи страхового портфеля и особенностей передачи страхового портфеля со дня вступления в законную силу решения суда о принудительной ликвидации страховой (перестраховочной) организации, а также при консервации или лишении лицензии страховой (перестраховочной) организации
  kaz: Сақтандыру портфелін беру қағидаларын және сақтандыру (қайта сақтандыру) ұйымын мәжбүрлеп тарату туралы сот шешімі заңды күшіне енген күннен бастап, сондай-ақ сақтандыру (қайта сақтандыру) ұйымын консервациялау немесе лицензиясынан айыру кезінде сақтандыру портфелін берудің ерекшеліктерін бекіту туралы

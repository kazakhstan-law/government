requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 3 сентября 2010 года № 139. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 октября 2010 года № 6548. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 ноября 2022 года № 99 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

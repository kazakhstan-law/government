title:
  rus: Об утверждении Правил и методик расчета значений пруденциальных нормативов для организатора торгов
  kaz: Сауда-саттықты ұйымдастырушы үшін пруденциалдық нормативтердің мәндерін есептеу қағидалары мен әдістемелерін бекіту туралы

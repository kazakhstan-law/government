  requisite: Постановление Правления Национального Банка Республики Казахстан от 26 августа 2011 года № 95. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 октября 2011 года № 7240. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 269 (вводится в действие с 1 января 2019 года)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 24 "Об утверждении Инструкции по содержанию и изготовлению бланков страховых полисов, по оформлению страхового полиса по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств, а также по содержанию заявлений страхователя для заключения договоров обязательного страхования по отдельным видам обязательного страхования"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру полистері бланктерінің мазмұны және оларды жасау, көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру полисін рәсімдеу, сондай-ақ міндетті сақтандырудың жекелеген түрлері бойынша міндетті сақтандыру шарттарын жасау үшін сақтанушы өтініштерінің мазмұны жөніндегі нұсқаулықты бекіту туралы" 2010 жылғы 1 наурыздағы № 24 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/60780/rus

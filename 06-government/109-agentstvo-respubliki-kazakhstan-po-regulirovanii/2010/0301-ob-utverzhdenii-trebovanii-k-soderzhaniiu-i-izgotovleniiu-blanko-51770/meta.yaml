act_code: '51770'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 24. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2010 года № 6171. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 269 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Требований к содержанию и изготовлению бланков страховых полисов, оформлению и выдаче страховых полисов по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств, обязательному страхованию гражданско-правовой ответственности туроператора или турагента, а также к содержанию заявлений страхователя для заключения договоров обязательного страхования по отдельным видам обязательного страхования
  kaz: Сақтандыру полистері бланкілерінің мазмұнына және оларды әзірлеуге, көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру, туроператордың немесе турагенттiң азаматтық-құқықтық жауапкершілiгiн мiндеттi сақтандыру жөніндегі сақтандыру полистерін рәсімдеуге және беруге, сондай-ақ міндетті сақтандырудың жекелеген түрлері бойынша міндетті сақтандыру шарттарын жасау үшін сақтанушы өтініштерінің мазмұнына қойылатын талаптарды бекіту туралы

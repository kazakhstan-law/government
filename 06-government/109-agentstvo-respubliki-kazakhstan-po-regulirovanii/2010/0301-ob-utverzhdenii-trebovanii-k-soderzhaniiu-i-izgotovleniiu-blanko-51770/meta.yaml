  requisite: Постановление Правления Национального Банка Республики Казахстан от 30 мая 2016 года № 141. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 июля 2016 года № 13929. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 269 (вводится в действие с 1 января 2019 года)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 24 "Об утверждении Требований к содержанию и изготовлению бланков страховых полисов, оформлению и выдаче страховых полисов по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств, обязательному страхованию гражданско-правовой ответственности туроператора или турагента, а также к содержанию заявлений страхователя для заключения договоров обязательного страхования по отдельным видам обязательного страхования"
    kaz: '"Сақтандыру полистері бланктерінің мазмұнына және оларды жасауға, көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру, туроператордың немесе турагенттiң азаматтық-құқықтық жауапкершілiгiн мiндеттi сақтандыру бойынша сақтандыру полистерін рәсімдеуге және беруге, сондай-ақ міндетті сақтандырудың жекелеген түрлері бойынша міндетті сақтандыру шарттарын жасау үшін сақтанушы өтініштерінің мазмұнына қойылатын талаптарды бекіту туралы" Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөніндегі агенттігі Басқармасының 2010 жылғы 1 наурыздағы № 24 қаулысына өзгерістер енгізу туралы'

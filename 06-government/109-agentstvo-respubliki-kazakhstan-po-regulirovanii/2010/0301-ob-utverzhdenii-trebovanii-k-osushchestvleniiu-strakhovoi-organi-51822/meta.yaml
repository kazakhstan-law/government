  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 25 "Об утверждении требований к осуществлению страховой организацией страховой деятельности, в том числе по взаимоотношениям с участниками страхового рынка, и полномочий страхового агента на осуществление посреднической деятельности"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру ұйымының сақтандыру қызметiн жүзеге асыруына қойылатын талаптарды, оның iшiнде сақтандыру нарығының қатысушыларымен өзара қарым-қатынастары жөнiндегi талаптарды және сақтандыру агентiнiң делдалдық қызметтi жүзеге асыруына өкiлеттiктерiн бекiту туралы" 2010 жылғы 1 наурыздағы № 25 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/54933/rus

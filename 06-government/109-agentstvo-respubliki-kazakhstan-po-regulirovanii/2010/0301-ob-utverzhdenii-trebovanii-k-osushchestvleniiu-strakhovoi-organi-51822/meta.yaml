  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и развития страхового рынка
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру нарығын реттеу және дамыту мәселелері бойынша өзгерістер және толықтырулар енгізу туралы

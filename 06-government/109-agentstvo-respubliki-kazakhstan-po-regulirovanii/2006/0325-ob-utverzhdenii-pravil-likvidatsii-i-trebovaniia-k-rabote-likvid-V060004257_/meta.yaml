    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымдарын мәжбүрлеп тарату ережесін бекіту туралы" 2006 жылғы 25 наурыздағы № 77 қаулысына өзгерістер мен толықтыру енгізу туралы

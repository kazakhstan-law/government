  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 ноября 2022 года № 96. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 декабря 2022 года № 30882
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам добровольно и принудительно ликвидируемых банков, страховых (перестраховочных) организаций, добровольно и принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне ерікті және мәжбүрлеп таратылатын банктердің, сақтандыру (қайта сақтандыру) ұйымдарының, қызметін ерікті және мәжбүрлеп тоқтататын Қазақстан Республикасының бейрезидент-банктері филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/174635/rus

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 сентября 2022 года № 64. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 сентября 2022 года № 29610
  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам ликвидации страховых (перестраховочных) организаций, прекращения деятельности филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру (қайта сақтандыру) ұйымдарын тарату, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының қызметін тоқтату мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

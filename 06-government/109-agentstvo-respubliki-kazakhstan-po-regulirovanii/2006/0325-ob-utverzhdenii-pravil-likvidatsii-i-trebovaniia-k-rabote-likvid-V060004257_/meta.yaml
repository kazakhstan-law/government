  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года № 77 «Об утверждении Правил принудительной ликвидации страховых (перестраховочных) организаций»
    kaz: «Сақтандыру (қайта сақтандыру) ұйымдарын мәжбүрлеп тарату ережесін бекіту туралы» Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2006 жылғы 25 наурыздағы № 77 қаулысына өзгерістер енгізу туралы

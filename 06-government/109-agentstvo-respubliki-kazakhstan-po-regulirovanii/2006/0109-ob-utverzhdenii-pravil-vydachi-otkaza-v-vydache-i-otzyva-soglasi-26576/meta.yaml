    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банктің және банк холдингінің ірі қатысушысы мәртебесін иеленуге келісімді беру, қайтарып алу Ережесін бекіту туралы" 2006 жылғы 9 қаңтардағы № 3 қаулысына өзгерістер мен толықтырулар енгізу туралы

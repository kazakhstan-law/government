  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года № 210 "Об утверждении Правил предоставления займов и размещения депозитов организацией, осуществляющей обязательное гарантирование депозитов, в банке(ах)-участнике (ах), принимающем(их) обязательства по гарантируемым депозитам"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Кепілдік берілген депозиттер бойынша міндеттемелер қабылдайтын қатысушы банктегі (банктердегі) депозиттерге міндетті кепілдік беруді жүзеге асыратын ұйымның заемдар беру және депозиттерді орналастыру жөніндегі ережесін бекіту туралы" 2006 жылғы 23 қыркүйектегі N 210 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '30182'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года № 210. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 ноября 2006 года № 4442. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 136
title:
  rus: Об утверждении Правил предоставления займов и размещения депозитов организацией, осуществляющей обязательное гарантирование депозитов, в банке (ах)-участнике(ах), принимающем(их) обязательства по гарантируемым депозитам
  kaz: Кепілдік берілген депозиттер бойынша міндеттемелер қабылдайтын қатысушы банктегі (банктердегі) депозиттерге міндетті кепілдік беруді жүзеге асыратын ұйымның заемдар беру және депозиттерді орналастыру жөніндегі ережесін бекіту туралы

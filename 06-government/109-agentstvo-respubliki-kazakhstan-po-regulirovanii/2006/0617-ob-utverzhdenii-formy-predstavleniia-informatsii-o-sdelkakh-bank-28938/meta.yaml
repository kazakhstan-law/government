    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктердің олармен айрықша қатынаста болатын тұлғалармен жасаған мәмілелері туралы ақпаратты ұсыну нысандарын бекіту туралы" 2006 жылғы 17 маусымдағы № 134 қаулысына өзгерістер мен толықтыру енгізу туралы

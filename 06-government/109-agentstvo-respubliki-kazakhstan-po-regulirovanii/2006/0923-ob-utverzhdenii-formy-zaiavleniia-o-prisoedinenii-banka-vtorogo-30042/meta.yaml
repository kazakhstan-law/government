caused_by:
  code: '152996'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 17 февраля 2021 года № 34. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 февраля 2021 года № 22239
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования деятельности филиалов банков-нерезидентов Республики Казахстан, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалов страховых брокеров-нерезидентов Республики Казахстан и организаций, осуществляющих микрофинансовую деятельность
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне Қазақстан Республикасының бейрезидент-банктері филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру брокерлері филиалдарының және микроқаржылық қызметті жүзеге асыратын ұйымдардың қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/152996/rus

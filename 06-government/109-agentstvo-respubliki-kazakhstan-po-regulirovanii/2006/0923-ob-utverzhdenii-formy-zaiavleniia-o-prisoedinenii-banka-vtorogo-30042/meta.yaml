act_code: '30042'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года № 216. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 октября 2006 года № 4430
title:
  rus: Об утверждении формы заявления о присоединении банка второго уровня, филиала банка-нерезидента Республики Казахстан к договору присоединения для вступления в систему обязательного гарантирования депозитов
  kaz: Депозиттерге міндетті кепілдік беру жүйесіне кіруге қосылу шартына екінші деңгейдегі банктің, Қазақстан Республикасының бейрезидент-банкі филиалының қосылуы туралы өтініш нысанын бекіту туралы

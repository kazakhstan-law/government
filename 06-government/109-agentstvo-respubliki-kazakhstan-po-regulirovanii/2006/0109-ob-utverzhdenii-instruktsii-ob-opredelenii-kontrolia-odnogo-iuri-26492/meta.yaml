    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бір заңды тұлғаның басқа заңды тұлғаға бақылау жасауын анықтау туралы Нұсқаулықты бекіту туралы" 2006 жылғы 9 қаңтардағы № 18 қаулысына өзгеріс енгізу туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 118. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 июня 2007 года № 4709. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 декабря 2008 года № 232
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 августа 2006 года № 146 "Об утверждении Правил выдачи лицензий на осуществление брокерской и (или) дилерской деятельности юридическим лицам, зарегистрированным уполномоченным государственным органом по регулированию деятельности регионального финансового центра города Алматы, и согласования их руководящих работников"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының»"Алматы қаласының өңірлік қаржы орталығының қызметін реттеу жөнінде уәкілетті мемлекеттік орган тіркеген заңды тұлғаларға брокерлік және (немесе) дилерлік қызметті жүзеге асыру жөнінде лицензияларды беру және олардың басшы қызметкерлерін келісу ережесін бекіту туралы" 2006 жылғы 12 тамыздағы № 146 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/33595/rus

act_code: '29921'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 августа 2006 года N 146. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 октября 2006 года N 4419. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 декабря 2008 года N 232
title:
  rus: Об утверждении Правил выдачи лицензий на осуществление брокерской и (или) дилерской деятельности юридическим лицам, зарегистрированным уполномоченным государственным органом по регулированию деятельности регионального финансового центра города Алматы, и согласования их руководящих работников
  kaz: Алматы қаласының өңірлік қаржы орталығының қызметін реттеу жөнінде уәкілетті мемлекеттік орган тіркеген заңды тұлғаларға брокерлік және (немесе) дилерлік қызметті жүзеге асыру жөнінде лицензияларды беру және олардың басшы қызметкерлерін келісу ережесін бекіту туралы

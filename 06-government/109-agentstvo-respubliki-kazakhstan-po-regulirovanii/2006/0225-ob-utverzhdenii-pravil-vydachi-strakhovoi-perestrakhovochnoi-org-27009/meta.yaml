title:
  rus: Об утверждении Правил выдачи страховой (перестраховочной) организации разрешения на создание или приобретение дочерней организации, значительное участие в уставном капитале юридических лиц, а также отзыва разрешения на создание или приобретение дочерней организации, значительное участие в уставном капитале юридических лиц
  kaz: Сақтандыру (қайта сақтандыру) ұйымына еншiлес ұйымды құруға немесе иеленуге, заңды тұлғалардың жарғылық капиталына қомақты қатысуға рұқсат беру, сондай-ақ, еншілес ұйымды құруға немесе иеленуге, заңды тұлғалардың жарғылық капиталына қомақты қатысуға берілген рұқсатты кері қайтарып алу ережесiн бекiту туралы

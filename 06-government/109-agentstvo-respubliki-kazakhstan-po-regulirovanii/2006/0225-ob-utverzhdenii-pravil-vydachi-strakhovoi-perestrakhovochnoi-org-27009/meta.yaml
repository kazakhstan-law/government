  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 50 "Об утверждении Правил выдачи страховой (перестраховочной) организации разрешения на создание или приобретение дочерней организации, а также разрешения на значительное участие в уставном капитале юридических лиц"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау Агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымына еншiлес ұйымды құруға немесе иеленуге рұқсат беру, сондай-ақ заңды тұлғалардың жарғылық капиталына қомақты қатысуға аяң рұқсат беру ережесiн бекiту туралы" 2006 жылғы 25 ақпандағы N 50 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/43208/rus

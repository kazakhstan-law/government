  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 31. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2020 года № 20241. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 49 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении Правил выдачи разрешения на добровольную реорганизацию банка (банковского холдинга) либо отказа в выдаче разрешения, выдачи разрешения на конвертацию банка в исламский банк и отказа в выдаче разрешения, выдачи разрешения на добровольную ликвидацию банков, выдачи разрешения на добровольное прекращение деятельности филиала банка-нерезидента Республики Казахстан, а также возврата депозитов физических лиц, их перевода в другой банк или филиал банка-нерезидента Республики Казахстан, являющиеся участниками системы обязательного гарантирования депозитов
    kaz: Банкті (банк холдингін) ерікті түрде қайта ұйымдастыруға рұқсат беру не рұқсат беруден бас тарту, банкті ислам банкіне айналдыруға рұқсат беру және рұқсат беруден бас тарту, банктерді ерікті түрде таратуға рұқсат беру, Қазақстан Республикасының бейрезидент-банкі филиалының қызметін ерікті түрде тоқтатуға рұқсат беру, сондай-ақ жеке тұлғалардың депозиттерін қайтару, оларды депозиттерге міндетті кепілдік беру жүйесінің қатысушылары болып табылатын басқа банкке немесе Қазақстан Республикасы бейрезидент-банкінің филиалына аудару қағидаларын бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/140991/rus

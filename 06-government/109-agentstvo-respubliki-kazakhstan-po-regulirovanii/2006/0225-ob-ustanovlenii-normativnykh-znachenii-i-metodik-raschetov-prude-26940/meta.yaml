  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 августа 2006 года № 157. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 сентября 2006 года № 4403
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 44 "Об установлении нормативных значений и методик расчетов пруденциальных нормативов для банковских конгломератов, а также форм и сроков представления отчетности об их выполнении"
    kaz: '"Банк конгломераттарына арналған пруденциалдық нормативтерді есептеу әдістемелері мен нормативтік мәнін, сондай-ақ олардың орындалуы туралы есеп берудің нысандары мен мерзімін белгілеу туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2006 жылғы 25 ақпандағы № 44 қаулысына толықтырулар мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/29708/rus

act_code: '26940'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 44. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 марта 2006 года № 4148. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 92
title:
  rus: Об установлении нормативных значений и методик расчетов пруденциальных нормативов для банковских конгломератов, а также форм и сроков представления отчетности об их выполнении
  kaz: Банк конгломераттарына арналған пруденциалдық нормативтерді есептеу әдістемелері мен нормативтік мәнін, сондай-ақ олардың орындалуы туралы есеп берудің нысандары мен мерзімін белгілеу туралы

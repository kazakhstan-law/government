  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 44 "Об установлении нормативных значений и методик расчетов пруденциальных нормативов для банковских конгломератов, а также форм и сроков представления отчетности об их выполнении"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банк конгломераттарына арналған пруденциалдық нормативтерді есептеу әдістемелері мен нормативтік мәнін, сондай-ақ олардың орындалуы туралы есеп берудің нысандары мен мерзімін белгілеу туралы" 2006 жылғы 25 ақпандағы № 44 қаулысына өзгерістер енгізу туралы

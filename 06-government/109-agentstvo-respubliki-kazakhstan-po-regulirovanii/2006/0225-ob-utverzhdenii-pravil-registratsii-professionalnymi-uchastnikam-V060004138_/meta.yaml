  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 ноября 2009 года № 242. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 января 2010 года № 5985. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 210
  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 61 "Об утверждении Правил регистрации профессиональными участниками рынка ценных бумаг, оказывающими услуги номинального держания, сделок с ценными бумагами, оформления и выдачи ими выписки с лицевого счета держателя ценных бумаг и раскрытия информации номинальным держателем"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының «Номиналды ұстау қызметін көрсететін бағалы қағаздар рыногы кәсіби қатысушыларының бағалы қағаздармен мәмілелерді тіркеу, бағалы қағаздар ұстаушысының жеке шотынан үзінді көшірмені ресімдеу мен беру және номиналды ұстаушының ақпаратты ашу ережесін бекіту туралы» 2006 жылғы 25 ақпандағы № 61 қаулысына толықтырулар мен өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/49732/rus

  title:
    rus: Об утверждении Правил определения агрегированного показателя и максимального размера соотношения общей суммы прощенной безнадежной задолженности по кредитам к агрегированному показателю, порядка определения расчетного показателя и его размера, оснований и порядка прощения безнадежной задолженности и внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 декабря 2006 года № 296 "Об утверждении Правил классификации активов, условных обязательств и создания провизий (резервов) против них"
    kaz: Бiрiктiрiлген көрсеткiш пен кредиттер бойынша кешiрiлген үмiтсiз берешектiң жалпы сомасының бiрiктiрiлген көрсеткiшке ең жоғары арақатынас мөлшерiн, есептік көрсеткіш пен оның мөлшерін айқындау тәртібін, үмiтсiз берешектi кешiру негіздері мен тәртібін айқындау ережесін бекіту туралы және Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Активтерді, шартты міндеттемелерді жіктеу және оларға қарсы провизиялар (резервтер) құру ережесін бекіту туралы" 2006 жылғы 25 желтоқсандағы N 296 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/62704/rus

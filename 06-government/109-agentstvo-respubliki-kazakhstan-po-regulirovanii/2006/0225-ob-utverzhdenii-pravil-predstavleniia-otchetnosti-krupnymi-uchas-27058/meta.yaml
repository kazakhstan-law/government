  title:
    rus: О внесении дополнений и изменений в некоторые нормативные правовые акты по вопросам представления документов в Агентство Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінде құжаттарды ұсыну мәселелері бойынша кейбір нормативтік құқықтық кесімдерге толықтырулар мен өзгерістер енгізу туралы

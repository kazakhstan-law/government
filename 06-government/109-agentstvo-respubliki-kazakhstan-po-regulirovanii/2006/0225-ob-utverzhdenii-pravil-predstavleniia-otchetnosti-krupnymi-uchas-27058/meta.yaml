act_code: '27058'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 41. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 апреля 2006 года N 4180. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 декабря 2007 года N 275 (вводится в действие с 1 марта 2008 года)
title:
  rus: Об утверждении Правил представления отчетности крупными участниками банков и банковскими холдингами и внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года N 304 "О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора финансового рынка и финансовых организаций"
  kaz: Банктердiң iрi қатысушыларының және банктiк холдингтердiң есеп беру ережесiн бекiту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттiгi Басқармасының "Қаржы рыногын және қаржы ұйымдарын реттеу және қадағалау мәселелерi бойынша Қазақстан Республикасының кейбiр нормативтiк құқықтық актiлерiне өзгерiстер мен толықтырулар енгiзу туралы" 2004 жылғы 25 қазандағы N 304 қаулысына өзгерiс енгiзу туралы

    kaz: '"Бағалы қағаздарды ұстаушылар тізілімдерінің жүйесін жүргізу ережесін бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2006 жылғы 25 ақпандағы N 62 қаулысына толықтырулар мен өзгерістер енгізу туралы'

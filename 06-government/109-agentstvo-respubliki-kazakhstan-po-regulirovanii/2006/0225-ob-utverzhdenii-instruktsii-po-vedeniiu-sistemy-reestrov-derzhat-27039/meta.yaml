    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалы қағаздарды ұстаушылар тізілімдерінің жүйесін жүргізу ережесін бекіту туралы" 2006 жылғы 25 ақпандағы N 62 қаулысына өзгерістер мен толықтырулар енгізу туралы

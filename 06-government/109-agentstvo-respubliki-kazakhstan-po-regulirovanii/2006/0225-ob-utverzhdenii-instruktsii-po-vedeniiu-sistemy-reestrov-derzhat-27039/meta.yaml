    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттiгi Басқармасының "Бағалы қағаздарды ұстаушылар тiзiлiмдерiнiң жүйесін жүргізу ережесін бекiту туралы" 2006 жылғы 25 ақпандағы № 62 қаулысына өзгерістер мен толықтырулар енгізу туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 194. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 декабря 2008 года № 5449. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 93
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 64 "Об утверждении Правил выдачи накопительному пенсионному фонду разрешения на создание или приобретение дочерней организации, а также разрешения на значительное участие в уставном капитале юридических лиц"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Жинақтаушы зейнетақы қорына еншілес ұйым құруға немесе сатып алуға, сондай-ақ заңды тұлғалардың жарғы капиталына қомақты түрде қатысуға рұқсат беру туралы Ережені бекіту туралы" 2006 жылғы 25 ақпандағы № 64 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/43151/rus

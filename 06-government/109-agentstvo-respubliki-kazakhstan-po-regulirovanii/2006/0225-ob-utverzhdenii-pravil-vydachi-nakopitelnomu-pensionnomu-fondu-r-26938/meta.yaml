act_code: '26938'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 64. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 марта 2006 года № 4145. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 93
title:
  rus: Об утверждении Правил выдачи накопительному пенсионному фонду разрешения на создание или приобретение дочерней организации, значительное участие в уставном капитале юридических лиц, а также отзыва разрешения на создание или приобретение дочерней организации, значительное участие в уставном капитале юридических лиц
  kaz: Жинақтаушы зейнетақы қорына еншілес ұйым құруға немесе сатып алуға, заңды тұлғалардың жарғылық капиталына қомақты қатысуға рұқсат беру, сондай-ақ еншілес ұйымды құруға немесе сатып алуға, заңды тұлғалардың жарғылық капиталына қомақты қатысуға берілген рұқсатты кері қайтарып алу туралы ережені бекіту туралы

    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Жинақтаушы зейнетақы қорларындағы жинақталған зейнетақы қаражаттарын аударым жасау туралы ережені бекіту туралы" 2006 жылғы 23 қыркүйектегі № 217 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора финансового рынка и финансовых организаций
    kaz: Қазақстан Республикасының кейбiр нормативтiк құқықтық актiлерiне қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау бойынша өзгерiстер мен толықтырулар енгiзу туралы

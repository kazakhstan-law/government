  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 17 июня 2006 года N 142 "Об утверждении Правил представления отчетности о выполнении пруденциальных нормативов организациями, осуществляющими брокерскую и дилерскую деятельность с правом ведения счетов клиента в качестве номинального держателя и отдельные виды банковских операций"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Номиналды ұстаушы ретінде клиенттің шоттарын жүргізу құқығымен брокерлік және дилерлік қызмет пен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың пруденциалдық нормативтерді орындауы жөніндегі есеп беру ережесін бекіту туралы" 2006 жылғы 17 маусымдағы N 142 қаулысына толықтырулар мен өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/40129/rus

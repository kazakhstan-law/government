act_code: '28939'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 17 июня 2006 года № 142. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 июля 2006 года № 4300. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 121
title:
  rus: Об утверждении Правил представления отчетности о выполнении пруденциальных нормативов организациями, осуществляющими брокерскую и дилерскую деятельность с правом ведения счетов клиента в качестве номинального держателя и отдельные виды банковских операций
  kaz: Номиналды ұстаушы ретінде клиенттің шоттарын жүргізу құқығымен брокерлік және дилерлік қызмет пен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың пруденциалдық нормативтерді орындауы жөніндегі есеп беру ережесін бекіту туралы

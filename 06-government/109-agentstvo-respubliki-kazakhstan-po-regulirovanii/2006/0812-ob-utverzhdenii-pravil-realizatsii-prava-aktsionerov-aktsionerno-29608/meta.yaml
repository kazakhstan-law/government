  title:
    rus: О внесении изменения и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 августа 2006 года № 151 "Об утверждении Правил реализации права акционеров акционерного общества на преимущественную покупку ценных бумаг"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Акционерлік қоғам акционерлерінiң бағалы қағаздарды басымдықпен сатып алу құқықтарын iске асыру ережесін бекіту туралы" 2006 жылғы 12 тамыздағы № 151 қаулысына өзгеріс пен толықтыру енгізу туралы

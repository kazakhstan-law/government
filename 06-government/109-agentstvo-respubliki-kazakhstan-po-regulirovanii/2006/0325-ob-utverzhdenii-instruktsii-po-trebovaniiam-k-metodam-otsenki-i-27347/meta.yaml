title:
  rus: Об утверждении Инструкции по требованиям к методам оценки и принципам расчета страховых тарифов по классам (видам) страхования страховых (перестраховочных) организаций, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан
  kaz: Сақтандыру (қайта сақтандыру) ұйымдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының сақтандыру сыныптары (түрлері) бойынша сақтандыру тарифтерін бағалау әдістері мен есептеу қағидаттарына қойылатын талаптар туралы нұсқаулықты бекіту туралы

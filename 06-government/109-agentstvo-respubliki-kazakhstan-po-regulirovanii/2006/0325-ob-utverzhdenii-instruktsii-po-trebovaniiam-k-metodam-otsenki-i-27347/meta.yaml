  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года № 85 "Об утверждении Инструкции по требованиям к методам оценки и принципам расчета страховых тарифов по классам (видам) страхования страховых (перестраховочных) организаций"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымдарының сақтандыру сыныптары (түрлері) бойынша сақтандыру тарифтерін бағалау әдістері мен есептеу қағидаттарына қойылатын талаптар туралы нұсқаулықты бекіту туралы" 2006 жылғы 25 наурыздағы N 85 қаулысына өзгерістер мен толықтырулар енгізу туралы

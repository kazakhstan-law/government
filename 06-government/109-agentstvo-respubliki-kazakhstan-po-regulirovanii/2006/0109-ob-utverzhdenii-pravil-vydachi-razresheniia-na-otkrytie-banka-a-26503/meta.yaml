act_code: '26503'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года № 9. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 января 2006 года № 4038. Утратило силу постановлением Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 121
title:
  rus: Об утверждении Правил выдачи разрешения на открытие банка, а также выдачи, приостановления и отзыва лицензии на проведение банковских и иных операций, осуществляемых банками
  kaz: Банкті ашуға рұқсат беру, cондай-ақ банктер жүзеге асыратын банктік және өзге де операцияларды жүргізуге лицензияны беру, тоқтата тұру және қайтарып алу ережесін бекіту туралы

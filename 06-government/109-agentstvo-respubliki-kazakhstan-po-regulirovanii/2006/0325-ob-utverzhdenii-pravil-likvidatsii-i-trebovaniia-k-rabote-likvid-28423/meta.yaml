act_code: '28423'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года № 77. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 июня 2006 года № 4257
title:
  rus: Об утверждении Правил ликвидации и требования к работе ликвидационной комиссии принудительно ликвидируемой страховой (перестраховочной) организации
  kaz: Мәжбүрлеп таратылатын сақтандыру (қайта сақтандыру) ұйымын тарату қағидаларын және оның тарату комиссиясының жұмысына қойылатын талаптарды бекіту туралы

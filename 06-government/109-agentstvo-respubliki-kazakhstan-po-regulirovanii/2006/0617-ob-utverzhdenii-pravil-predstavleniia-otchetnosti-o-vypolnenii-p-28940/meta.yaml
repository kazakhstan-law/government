  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 17 июня 2006 года № 136 "Об утверждении Правил представления отчетности о выполнении пруденциальных нормативов банками второго уровня"
    kaz: Қазақстан Республикасы Қаржы нарығын және Қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктердің пруденциалдық нормативтерді орындауы жөніндегі есеп беру ережесін бекіту туралы" 2006 жылғы 17 маусымдағы N 136 қаулысына толықтырулар мен өзгерістер енгізу туралы

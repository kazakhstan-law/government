  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 17 июня 2006 года N 136 "Об утверждении Правил представления отчетности о выполнении пруденциальных нормативов банками второго уровня"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктердің пруденциалдық нормативтерді орындауы жөніндегі есеп беру ережесін бекіту туралы" 2006 жылғы 17 маусымдағы N 136 қаулысына өзгерістер мен толықтырулар енгізу туралы

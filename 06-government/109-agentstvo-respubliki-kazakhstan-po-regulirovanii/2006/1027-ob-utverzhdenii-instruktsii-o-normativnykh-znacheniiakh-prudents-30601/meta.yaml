act_code: '30601'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 октября 2006 года N 222. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 декабря 2006 года N 4479. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года N 117
title:
  rus: Об утверждении Инструкции о нормативных значениях пруденциальных нормативов, методике их расчетов для накопительных пенсионных фондов и внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 августа 2005 года N 310 "О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора финансового рынка и финансовых организаций"
  kaz: Жинақтаушы зейнетақы қорларына арналған пруденциалдық нормативтердiң нормативтiк маңызы, олардың есебiнiң әдiстемесi туралы нұсқаулықты бекiту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттiгi Басқармасының "Қазақстан Республикасының кейбiр нормативтiк құқықтық актiлерiне қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау мәселелерi бойынша өзгерiстер мен толықтырулар енгiзу туралы" 2005 жылғы 27 тамыздағы N 310 қаулысына өзгерiс енгiзу туралы

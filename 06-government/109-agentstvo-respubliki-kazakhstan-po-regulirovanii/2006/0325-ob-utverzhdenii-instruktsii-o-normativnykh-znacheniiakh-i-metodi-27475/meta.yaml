  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года N 212. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 ноября 2006 года N 4447. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года N 131
  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года N 87 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов страховой (перестраховочной) организации, формах и сроках представления отчетов о выполнении пруденциальных нормативов
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымының пруденциалдық нормативтер есебінің нормативтік мәні мен әдістемесі, пруденциалдық нормативтердің орындалғандығы жөніндегі есепті беру нысандары мен мерзімі туралы Нұсқаулықты бекіту туралы" 2006 жылғы 25-наурыздағы N 87 қаулысына толықтырулар мен өзгерістер енгізу туралы

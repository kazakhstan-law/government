act_code: '26943'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 42. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2006 года № 4154. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2012 года № 317
title:
  rus: Об утверждении Правил применения ограниченных мер воздействия в отношении банков второго уровня, организаций, осуществляющих отдельные виды банковских операций, а также крупных участников банка, банковского холдинга и их аффилиированных лиц, юридических лиц, входящих в состав банковского конгломерата, и принудительных мер к лицам, обладающим признаками крупного участника или банковского холдинга, а также к крупным участникам банка, банковским холдингам или юридическим лицам, входящим в состав банковского конгломерата
  kaz: Екінші деңгейдегі банктерге, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға, сондай-ақ банктің ірі қатысушыларына, банк холдингіне және олардың аффилиирленген тұлғаларына, банк конгломераттың құрамына кіретін заңды тұлғаларға қатысты шектеулі ықпал ету шараларын және ірі қатысушы немесе банк холдингі белгілері бар тұлғаларға, сондай-ақ банктің ірі қатысушыларына, банк холдингтеріне немесе банк конгломератының құрамына кіретін заңды тұлғаларға мәжбүрлеу шараларын қолдану ережесін бекіту туралы

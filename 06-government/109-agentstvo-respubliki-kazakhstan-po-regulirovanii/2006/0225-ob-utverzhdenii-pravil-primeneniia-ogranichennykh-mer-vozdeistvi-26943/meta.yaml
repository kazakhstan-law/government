  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 201. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 декабря 2008 года № 5450. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2012 года № 317
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 42 "Об утверждении Правил применения ограниченных мер воздействия в отношении банков второго уровня, организаций, осуществляющих отдельные виды банковских операций, а также крупных участников банка, банковского холдинга и их аффилиированных лиц, организаций, входящих в состав банковского конгломерата, и принудительных мер к крупным участникам банка, банковским холдингам и организациям, входящим в состав банковского конгломерата"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктерге, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға, сондай-ақ банктің ірі қатысушыларына, банктік холдингке және олардың аффилиирленген тұлғаларына, банктік конгломераттың құрамына кіретін ұйымдарға қатысты шектеулі ықпал ету шараларын және банктің, банктік холдингтің ірі қатысушыларына және банктік конгломераттың құрамына кіретін ұйымдарға мәжбүрлеу шараларын қолдану ережесін бекіту туралы" 2006 жылғы 25 ақпандағы N 42 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/43152/rus

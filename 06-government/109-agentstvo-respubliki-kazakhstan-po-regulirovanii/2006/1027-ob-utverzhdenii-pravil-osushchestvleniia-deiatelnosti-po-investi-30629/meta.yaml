    kaz: '"Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыру ережесін бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2006 жылғы 27 қазандағы N 225 қаулысына өзгеріс енгізу туралы'

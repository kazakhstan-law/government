act_code: '26562'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года № 15. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 января 2006 года № 4041. Утратило силу постановлением Правления Национального банка Республики Казахстан от 26 марта 2012 года № 128
title:
  rus: Об утверждении Инструкции о мерах по поддержанию банковским холдингом, а также крупным участником банка - физическим лицом, владеющим прямо или косвенно более двадцатью пятью процентами голосующих и(или) размещенных (за вычетом привилегированных и выкупленных банком) акций банка, коэффициентов достаточности собственного капитала банка и банковского конгломерата
  kaz: Банк холдингінің, сондай-ақ банктің дауыс беретін және (немесе) орналастырылған (банк сатып алған немесе артықшылық берілгендерін алып тастағандағы) акцияларының жиырма бес процентінен астамына тікелей немесе жанама ие банктің ірі қатысушысының - жеке тұлғаның банктің және банк конгломератының меншікті капиталы жеткіліктілігінің коэффициенттерін қолдау жөніндегі шаралары туралы нұсқаулықты бекіту туралы

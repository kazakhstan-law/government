  title:
    rus: О внесении изменений и дополнений в Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 58 "Об утверждении Правил выдачи, отзыва согласия на приобретение статуса крупного участника открытого накопительного пенсионного фонда "
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Ашық жинақтаушы зейнетақы қорының ірі қатысушысы мәртебесін иеленуге келісімді беру, қайтарып алу Ережесін бекіту туралы" 2006 жылғы 25 ақпандағы № 58 қаулысына өзгерістер мен толықтырулар енгізу туралы

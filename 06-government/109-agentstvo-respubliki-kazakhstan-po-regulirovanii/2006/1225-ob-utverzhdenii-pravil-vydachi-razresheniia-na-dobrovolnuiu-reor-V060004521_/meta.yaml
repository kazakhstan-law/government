requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 декабря 2006 года № 295. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 января 2007 года № 4521. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 31 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на добровольную реорганизацию банка (банковского холдинга) либо отказа в выдаче разрешения, выдачи разрешения на добровольную ликвидацию банков, а также возврата депозитов физических лиц, их перевода в другой банк
  kaz: Банкті (банк холдингін) ерікті түрде қайта ұйымдастыруға рұқсат беру не рұқсат беруден бас тарту, банктерді ерікті түрде таратуға рұқсат беру, сондай-ақ жеке тұлғалардың депозиттерін қайтару, оларды басқа банкке аудару қағидаларын бекіту туралы

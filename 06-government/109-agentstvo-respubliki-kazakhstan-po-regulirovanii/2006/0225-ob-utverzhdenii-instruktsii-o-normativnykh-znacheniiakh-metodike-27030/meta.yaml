  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования деятельности ипотечных организаций
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне ипотекалық ұйымдардың қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

act_code: '27030'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 48. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2006 года № 4158. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 308
title:
  rus: Об утверждении Инструкции о нормативных значениях, методике расчетов пруденциальных нормативов для ипотечных организаций, дочерних организаций национального управляющего холдинга в сфере агропромышленного комплекса, а также форм и сроков представления отчетности об их выполнении
  kaz: Агроөнеркәсіп кешені саласындағы ұлттық басқарушы холдингтің еншілес ұйымдарына, Ипотекалық ұйымдарға арналған пруденциалдық нормативтердi есептеу әдiстемесi мен олардың нормативтiк мәнi және олардың орындалуы туралы есеп беру нысандары мен мерзiмдерi туралы нұсқаулықты бекiту туралы

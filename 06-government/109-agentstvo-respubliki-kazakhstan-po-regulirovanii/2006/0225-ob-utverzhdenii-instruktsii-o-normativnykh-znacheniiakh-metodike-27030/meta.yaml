  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты по вопросам регулирования банковской деятельности
    kaz: Кейбір нормативтік құқықтық актілеріне банк қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

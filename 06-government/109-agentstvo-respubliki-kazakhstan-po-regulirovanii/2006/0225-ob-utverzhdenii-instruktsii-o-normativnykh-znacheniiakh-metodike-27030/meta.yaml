  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 48 "Об утверждении Инструкции о нормативных значениях, методике расчетов пруденциальных нормативов для ипотечных организаций, а также форм и сроков представления отчетности об их выполнении"
    kaz: '"Ипотекалық ұйымдарға арналған пруденциалдық нормативтерді есептеу әдістемесі мен олардың нормативтік мәні және олардың орындалуы туралы есеп беру нысандары мен мерзімдері туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2006 жылғы 25 ақпандағы № 48 қаулысына толықтырулар мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/29611/rus

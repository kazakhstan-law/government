  title:
    rus: О внесении изменений и дополнений в постановления Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам расчетов пруденциальных нормативов для ипотечных организаций, дочерних организаций национального управляющего холдинга в сфере агропромышленного комплекса и ведения документации по кредитованию
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының агроөнеркәсiп кешенi саласындағы ұлттық басқарушы холдингтiң еншiлес ұйымдарына, ипотекалық ұйымдарға арналған пруденциалдық нормативтердi есептеу мәселелері бойынша және кредиттеу жөніндегі құжаттамасын жүргізу қаулысына өзгерістер мен толықтырулар енгізу туралы

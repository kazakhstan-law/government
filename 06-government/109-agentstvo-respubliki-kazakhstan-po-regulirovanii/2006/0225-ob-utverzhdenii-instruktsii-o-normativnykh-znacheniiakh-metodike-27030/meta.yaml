  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 апреля 2009 года № 92. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 июня 2009 года № 5695. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 308 (вводится в действие с 01.03.2017)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 48 "Об утверждении Инструкции о нормативных значениях, методике расчетов пруденциальных нормативов для ипотечных организаций, организаций, осуществляющих отдельные виды банковских операций, контрольный пакет акций которых принадлежит государству или национальному холдингу либо национальной управляющей компании, а также форм и сроков представления отчетности об их выполнении"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Акцияларының бақылау пакеті мемлекеттің немесе ұлттық холдингтің не ұлттық басқарушы компанияның иелігіндегі банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға, ипотекалық ұйымдарға арналған пруденциалдық нормативтерді есептеу әдістемесі мен олардың нормативтік мәні және олардың орындалуы туралы есеп беру нысандары мен мерзімдері туралы нұсқаулықты бекіту туралы" 2006 жылғы 25 ақпандағы N 48 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/46368/rus

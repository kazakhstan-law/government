act_code: '26945'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 46. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2006 года N 4159. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 февраля 2008 года N 19
title:
  rus: Об установлении минимального требуемого рейтинга стран, с государственными ценными бумагами которых банки второго уровня могут совершать сделки при осуществлении брокерской и/или дилерской деятельности
  kaz: Екiншi деңгейдегi банктер брокерлiк және/немесе дилерлiк қызметтi жүзеге асырған кезде мемлекеттiк бағалы қағаздарымен мәмiлелер жасай алатын елдердiң ең төменгi талап етiлетiн рейтингiн белгiлеу туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регистрации операций с финансовыми инструментами
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы құралдарымен операцияларды тіркеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

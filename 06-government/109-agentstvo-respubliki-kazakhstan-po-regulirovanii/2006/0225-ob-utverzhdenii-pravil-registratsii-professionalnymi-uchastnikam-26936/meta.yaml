  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 61 "Об утверждении Правил регистрации профессиональными участниками рынка ценных бумаг, оказывающими услуги номинального держания, сделок с ценными бумагами, оформления и выдачи ими выписки с лицевого счета держателя ценных бумаг и раскрытия информации номинальным держателем"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының»"Номиналды ұстау қызметін көрсететін бағалы қағаздар рыногы кәсіби қатысушыларының бағалы қағаздармен мәмілелерді тіркеу, бағалы қағаздар ұстаушысының жеке шотынан үзінді көшірмені ресімдеу мен беру және номиналды ұстаушының ақпаратты ашу ережесін бекіту туралы" 2006 жылғы 25 ақпандағы N 61 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/34545/rus

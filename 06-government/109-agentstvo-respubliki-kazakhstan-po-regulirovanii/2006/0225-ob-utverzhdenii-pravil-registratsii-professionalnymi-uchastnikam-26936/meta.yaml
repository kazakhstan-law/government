act_code: '26936'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 61. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 марта 2006 года № 4138. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 210
title:
  rus: Об утверждении Правил регистрации профессиональными участниками рынка ценных бумаг, оказывающими услуги номинального держания, сделок с ценными бумагами, предоставления ими выписки с лицевого счета держателя ценных бумаг и раскрытия информации номинальным держателем
  kaz: Номиналды ұстау қызметін көрсететін бағалы қағаздар рыногы кәсіби қатысушыларының бағалы қағаздармен мәмілелерді тіркеу, олардың бағалы қағаздар ұстаушысының жеке шотынан үзінді көшірмені беру және номиналды ұстаушының ақпаратты ашу ережесін бекіту туралы

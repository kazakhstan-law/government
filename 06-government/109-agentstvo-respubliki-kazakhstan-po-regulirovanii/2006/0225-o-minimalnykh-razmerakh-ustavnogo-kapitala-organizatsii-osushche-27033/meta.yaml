  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам пруденциального регулирования деятельности ипотечных организаций, организаций, осуществляющих отдельные виды банковских операций
    kaz: Қазақстан Республикасының кейбір нормативтiк құқықтық актілеріне ипотекалық ұйымдардың, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың қызметін пруденциалдық реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

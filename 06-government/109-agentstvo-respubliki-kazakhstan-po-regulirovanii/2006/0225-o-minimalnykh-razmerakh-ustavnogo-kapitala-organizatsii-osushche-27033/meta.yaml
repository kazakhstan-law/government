act_code: '27033'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 54. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2006 года № 4164. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 марта 2012 года № 127
title:
  rus: О минимальных размерах уставного капитала организаций, осуществляющих отдельные виды банковских операций на основании лицензии уполномоченного государственного органа Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций
  kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөнiндегi уәкiлеттi мемлекеттiк органының лицензиясы негiзiнде банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың жарғылық капиталының ең төменгi мөлшерлерi туралы

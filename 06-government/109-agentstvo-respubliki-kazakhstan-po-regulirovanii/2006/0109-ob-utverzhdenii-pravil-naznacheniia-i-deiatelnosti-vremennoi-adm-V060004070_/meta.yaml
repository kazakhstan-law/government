  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года № 6 "Об утверждении Правил назначения и деятельности временной администрации (временного администратора) банка, страховой (перестраховочной) организации и накопительного пенсионного фонда"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банктің, сақтандыру (қайта сақтандыру) ұйымының және жинақтаушы зейнетақы қорының уақытша әкімшілігін (уақытша басқарушысын) тағайындау және қызметінің ережесін бекіту туралы" 2006 жылғы 9 қаңтардағы № 6 қаулысына өзгерістер мен толықтырулар енгізу туралы

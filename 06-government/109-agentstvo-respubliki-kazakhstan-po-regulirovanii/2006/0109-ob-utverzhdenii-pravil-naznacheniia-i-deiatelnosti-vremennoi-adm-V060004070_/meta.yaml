    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года N 6 "Об утверждении Правил назначения и деятельности временной администрации (временного администратора) банка, страховой (перестраховочной) организации и накопительного пенсионного фонда"

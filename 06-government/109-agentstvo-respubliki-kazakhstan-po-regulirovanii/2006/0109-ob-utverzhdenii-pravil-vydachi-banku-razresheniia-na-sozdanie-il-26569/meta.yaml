act_code: '26569'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года № 4. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 февраля 2006 года № 4079. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 91
title:
  rus: Об утверждении Правил выдачи банку разрешения на создание или приобретение дочерней организации, а также выдачи банку разрешения на значительное участие в уставном капитале организаций, отзыва разрешения на создание или приобретение банком дочерней организации, а также значительное участие банка в уставном капитале организаций и внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 октября 2004 года № 304 "О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора финансового рынка и финансовых организаций"
  kaz: Банкке еншiлес ұйым құруға немесе ие болуға рұқсат беру, сондай-ақ ұйымдардың жарғылық капиталына қомақты қатысуға рұқсат беру, банктің еншілес ұйымды құруға немесе иеленуге, сондай-ақ бпнктің ұйымдардың жарғылық капиталына қомақты қатысуға беоілген рұқсатты кері қайтарып алу ережесiн бекiту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттiгi Басқармасының "Қаржы рыногын және қаржы ұйымдарын реттеу және қадағалау мәселелерi бойынша Қазақстан Республикасының кейбiр нормативтiк құқықтық актiлерiне өзгерiстер енгiзу туралы" 2004 жылғы 25 қазандағы № 304 қаулысына өзгерiс енгiзу туралы

requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 40. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 апреля 2006 года № 4181. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 ноября 2020 года № 114 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления ликвидации и требований к работе ликвидационных комиссий принудительно ликвидируемых банков
  kaz: Мәжбүрлеп таратылатын банктерді таратуды жүзеге асыру қағидаларын және олардың тарату комиссияларының жұмысына қойылатын талаптарды бекіту туралы

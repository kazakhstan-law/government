  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 40 "Об утверждении Правил принудительной ликвидации банков в Республике Казахстан"
    kaz: '"Қазақстан Республикасында банктерді мәжбүрлеп тарату ережесін бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2006 жылғы 25 ақпандағы N 40 қаулысына толықтырулар мен өзгерістер енгізу туралы'

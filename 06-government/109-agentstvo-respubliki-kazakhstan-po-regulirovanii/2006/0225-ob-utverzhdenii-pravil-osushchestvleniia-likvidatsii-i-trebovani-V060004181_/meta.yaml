  requisite: Постановление Правления Национального Банка Республики Казахстан от 19 ноября 2019 года № 205. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 ноября 2019 года № 19640. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 ноября 2020 года № 114 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 40 «Об утверждении Правил принудительной ликвидации банков в Республике Казахстан»
    kaz: «Қазақстан Республикасында банктерді мәжбүрлеп тарату қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2006 жылғы 25 ақпандағы № 40 қаулысына өзгерістер енгізу туралы

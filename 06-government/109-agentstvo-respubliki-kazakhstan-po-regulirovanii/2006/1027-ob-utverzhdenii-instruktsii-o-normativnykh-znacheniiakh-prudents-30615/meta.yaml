  title:
    rus: О внесении дополнений и изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам пруденциального регулирования деятельности накопительных пенсионных фондов и профессиональных участников рынка ценных бумаг
    kaz: Жинақтаушы зейнетақы қорларының және бағалы қағаздар рыногының кәсіби қатысушыларының қызметтерін пруденциалдық реттеу мәселелері бойынша Қазақстан Республикасының кейбір нормативтік құқықтық кесімдеріне толықтырулар мен өзгерістер енгізу туралы

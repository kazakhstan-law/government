act_code: '30615'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 октября 2006 года N 223. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 декабря 2006 года N 4480. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года N 118
title:
  rus: Об утверждении Инструкции о нормативных значениях пруденциальных нормативов, методике их расчетов для организаций, осуществляющих инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтердің нормативтік мәндері, оларды есептеу әдістемесі туралы нұсқаулықты бекіту туралы

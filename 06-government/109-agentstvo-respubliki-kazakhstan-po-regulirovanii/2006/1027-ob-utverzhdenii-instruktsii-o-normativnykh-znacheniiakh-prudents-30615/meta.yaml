  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 января 2008 года N 4. Зарегистрировано в Министерстве юстиции Республики Казахстан 06 марта 2008 года N 5161. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года N 118
  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 октября 2006 года N 223 "Об утверждении Инструкции о нормативных значениях пруденциальных нормативов, методике их расчетов для организаций, осуществляющих инвестиционное управление пенсионными активами"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтердің нормативтік мәндері, оларды есептеу әдістемесі туралы нұсқаулықты бекіту туралы" 2006 жылғы 27 қазандағы N 223 қаулысына өзгерістер мен толықтырулар енгізу туралы

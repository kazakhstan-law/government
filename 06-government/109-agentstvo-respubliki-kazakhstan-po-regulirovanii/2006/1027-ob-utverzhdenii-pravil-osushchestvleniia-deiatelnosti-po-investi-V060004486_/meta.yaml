    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыру ережесін бекіту туралы" 2006 жылғы 27 қазандағы N 225 қаулысына толықтырулар енгізу туралы

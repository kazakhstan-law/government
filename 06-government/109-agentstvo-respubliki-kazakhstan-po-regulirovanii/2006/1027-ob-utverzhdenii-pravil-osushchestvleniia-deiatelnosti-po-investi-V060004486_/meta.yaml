  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 116. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 сентября 2008 года № 5328. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 189
  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 октября 2006 года № 225 "Об утверждении Правил осуществления деятельности по инвестиционному управлению пенсионными активами"
    kaz: '"Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыру ережесін бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2006 жылғы 27 қазандағы № 225 қаулысына толықтырулар мен өзгерістер енгізу туралы'

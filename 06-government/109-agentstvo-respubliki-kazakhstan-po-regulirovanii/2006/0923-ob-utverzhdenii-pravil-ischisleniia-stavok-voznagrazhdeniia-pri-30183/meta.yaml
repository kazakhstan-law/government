  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года № 215 "Об утверждении Правил исчисления банками второго уровня ставок вознаграждения при распространении информации о величинах вознаграждения по финансовым услугам"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктердің қаржылық қызмет бойынша сыйақы шегі туралы ақпаратты тарату кезіндегі сыйақы мөлшерлемесінің деңгейін есептеу Ережесін бекіту туралы" 2006 жылғы 23 қыркүйектегі N 215 қаулысына өзгерістер мен толықтырулар енгізу туралы

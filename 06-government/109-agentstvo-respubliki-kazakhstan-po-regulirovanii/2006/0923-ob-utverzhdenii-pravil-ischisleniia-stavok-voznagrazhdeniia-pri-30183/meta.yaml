title:
  rus: Об утверждении Правил исчисления ставок вознаграждения при распространении информации о величинах вознаграждения по финансовым услугам
  kaz: Қаржылық қызмет бойынша сыйақы шегі туралы ақпаратты тарату кезіндегі сыйақы мөлшерлемесінің деңгейін есептеу Ережесін бекіту туралы

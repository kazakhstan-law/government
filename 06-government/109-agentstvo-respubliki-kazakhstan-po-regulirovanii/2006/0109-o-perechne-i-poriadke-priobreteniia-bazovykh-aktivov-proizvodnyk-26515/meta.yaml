act_code: '26515'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций Республики Казахстан от 9 января 2006 года № 19. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 января 2006 года № 4066. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций РК от 16 июля 2007 года № 210

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 февраля 2011 года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 апреля 2011 года № 6880
  title:
    rus: О внесении изменения и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 44 "Об установлении нормативных значений и методик расчетов пруденциальных нормативов для банковских конгломератов, а также форм и сроков представления отчетности об их выполнении"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының «Банк конгломераттарына арналған пруденциалдық нормативтерді есептеу әдістемелері мен нормативтік мәнін, сондай-ақ олардың орындалуы туралы есеп берудің нысандары мен мерзімін белгілеу туралы» 2006 жылғы 25 ақпандағы № 44 қаулысына өзгеріс пен толықтыру енгізу туралы

act_code: '30241'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 23 сентября 2006 года № 214. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 ноября 2006 года № 4449. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года № 75 (вводится в действие по истечении 14 дней со дня его гос. регистрации)
title:
  rus: Об утверждении Правил уведомления о выпуске депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги эмитентов-резидентов Республики Казахстан, представления отчета об итогах их размещения, а также выдачи разрешения на выпуск или размещение производных ценных бумаг на территории иностранного государства
  kaz: Депозитарлық қолхаттарды немесе базалық активі Қазақстан Республикасы резидент эмитенттерінің эмиссиялық бағалы қағаздары болып табылатын өзге де бағалы қағаздарды шығару жөнінде хабардар ету, оларды орналастыру қорытындылары жөніндегі есепті беру, сондай-ақ шет мемлекеттің аумағында туынды бағалы қағаздарды шығаруға немесе орналастыруға рұқсат беру ережесін бекіту туралы

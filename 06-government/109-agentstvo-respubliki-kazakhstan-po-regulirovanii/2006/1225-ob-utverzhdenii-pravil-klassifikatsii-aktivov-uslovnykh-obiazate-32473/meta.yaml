  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 декабря 2006 года № 296 "Об утверждении Правил классификации активов, условных обязательств и создания провизий (резервов) против них и внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 марта 2005 года № 116 "О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора финансового рынка и финансовых организаций"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Активтерді, шартты міндеттемелерді жіктеу және оларға қарсы провизиялар (резервтер) құру ережесін бекіту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қаржы нарығын және қаржы ұйымдарын реттеу және қадағалау мәселелері бойынша Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне өзгерістер енгізу туралы" 2005 жылғы 26 наурыздағы N 116 қаулысына өзгеріс енгізу туралы" 2006 жылғы 25 желтоқсандағы N 296 қаулысына толықтырулар мен өзгерістер енгізу туралы

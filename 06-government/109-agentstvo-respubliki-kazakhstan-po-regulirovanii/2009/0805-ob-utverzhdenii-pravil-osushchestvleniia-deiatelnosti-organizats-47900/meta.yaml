act_code: '47900'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 189. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 сентября 2009 года № 5794. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 196
title:
  rus: Об утверждении Правил осуществления деятельности организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами, и накопительных пенсионных фондов
  kaz: Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыратын ұйымдардың және жинақтаушы зейнетақы қорларының қызметін жүзеге асыру ережесін бекіту туралы

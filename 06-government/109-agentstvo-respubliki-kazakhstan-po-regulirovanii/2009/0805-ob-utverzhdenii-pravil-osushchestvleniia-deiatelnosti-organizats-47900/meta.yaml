  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам деятельности накопительных пенсионных фондов и организаций, осуществляющих инвестиционное управление пенсионными активами
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне жинақтаушы зейнетақы қорларының және зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдар қызметінің мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменения и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 марта 2009 года № 66 "Об утверждении Инструкции о пруденциальных нормативах для исламских банков, их нормативных значениях и методике расчетов"
    kaz: '"Ислам банктеріне арналған пруденциалдық нормативтер, олардың нормативтік мәндері және есептеу әдістемесі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2009 жылғы 27 наурыздағы № 66 қаулысына өзгеріс пен толықтыру енгізу туралы'

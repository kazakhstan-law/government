act_code: '45675'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 марта 2009 года № 51. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 мая 2009 года № 5664. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 68 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выбора исламского банка, филиала исламского банка-нерезидента Республики Казахстан и передачи им имущества, приобретенного за счет денег, привлеченных по договору об инвестиционном депозите, и обязательств по инвестиционным депозитам ликвидируемого исламского банка, принудительно прекращающего деятельность филиала исламского банка-нерезидента Республики Казахстан
  kaz: Ислам банкін, Қазақстан Республикасы бейрезидент-ислам банкінің филиалын таңдау және оған инвестициялық депозит туралы шарт бойынша тартылған ақша және таратылатын ислам банкінің, қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасы бейрезидент-ислам банкі филиалының инвестициялық депозиттері бойынша міндеттемелер есебінен сатып алынған мүлікті беру қағидаларын бекіту туралы

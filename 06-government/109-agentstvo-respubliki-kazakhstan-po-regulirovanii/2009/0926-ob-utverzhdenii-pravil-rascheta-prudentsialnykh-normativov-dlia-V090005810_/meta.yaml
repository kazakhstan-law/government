requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 сентября 2009 года № 215. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 октября 2009 года № 5810. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 146
title:

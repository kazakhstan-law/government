title:
  rus: Об утверждении Правил расчета пруденциальных нормативов для организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг
  kaz: Бағалы қағаздар нарығында кәсіби қызмет түрлерін қоса атқаратын ұйымдарға арналған пруденциалдық нормативтерді есептеу ережесін бекіту туралы

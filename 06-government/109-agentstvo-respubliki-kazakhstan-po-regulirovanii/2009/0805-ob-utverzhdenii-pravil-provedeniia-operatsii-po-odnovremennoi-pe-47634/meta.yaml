requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 176. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 сентября 2009 года № 5770. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 января 2019 года № 9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

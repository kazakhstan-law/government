act_code: '47761'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 177. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 августа 2009 года № 5767. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 311
title:
  rus: Об утверждении Правил о консервации банков второго уровня и осуществлении временной администрацией по управлению банком (временным управляющим банка) операции по одновременной передаче активов и обязательств банка в части либо в полном размере перед физическими и (или) юридическими лицами другому (другим) банку (банкам)
  kaz: Екінші деңгейдегі банктерді консервациялау және банкті басқару (банктің уақытша басқарушысы) жөніндегі уақытша әкімшіліктің банктің жеке және (немесе) заңды тұлғалардың алдындағы активтері мен міндеттемелерінің бөлігін не толық мөлшерін басқа банкке (банктерге) бір мезгілде беру бойынша операцияны жүзеге асыруы туралы ережені бекіту туралы

requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 марта 2009 года № 68. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 мая 2009 года № 5660. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 8 мая 2015 года № 77
title:
  rus: Об утверждении Правил осуществления операций по одновременной передаче активов и обязательств банка в части либо полном размере перед физическими и (или) юридическими лицами другому (другим) банку (банкам)

  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 марта 2009 года № 68 "Об утверждении Правил осуществления операций по одновременной передаче активов и обязательств банка в части либо полном размере по депозитам физических и юридических лиц другому (другим) банку (банкам)"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Жеке және заңды тұлғалардың депозиттері бойынша банктің активтері мен міндеттемелерінің бөлігін не толық мөлшерде басқа банкке (банктерге) бір мезгілде беру жөніндегі операцияларды жүзеге асыру ережесін бекіту туралы" 2009 жылғы 27 наурыздағы N 68 қаулысына өзгерістер мен толықтырулар енгізу туралы

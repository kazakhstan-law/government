act_code: '45442'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 марта 2009 года № 56. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 апреля 2009 года N 5649
title:
  rus: О требованиях к содержанию договора о представлении интересов держателей исламских ценных бумаг, заключаемого между эмитентом и представителем держателей исламских ценных бумаг, и об утверждении Правил об установлении порядка исполнения функций и обязанностей представителем держателей исламских ценных бумаг, а также порядка и случаев досрочного прекращения его полномочий
  kaz: Эмитент пен ислам бағалы қағаздар ұстаушыларының өкілі арасында жасалатын ислам бағалы қағаздар ұстаушыларының мүдделерін білдіру жөніндегі шарттың мазмұнына қойылатын талаптар туралы және ислам бағалы қағаздар ұстаушылары өкілінің функцияларын және міндеттерін орындау тәртібін, сондай-ақ оның өкілеттіктерін мерзімнен бұрын тоқтату тәртібі мен жағдайларын белгілеу ережесін бекіту туралы

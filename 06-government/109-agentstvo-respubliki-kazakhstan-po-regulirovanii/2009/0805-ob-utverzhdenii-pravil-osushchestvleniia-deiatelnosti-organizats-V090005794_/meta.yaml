  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам пруденциального регулирования деятельности накопительных пенсионных фондов, организаций, осуществляющих инвестиционное управление пенсионными активами, и организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне жинақтаушы зейнетақы қорларының, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың және бағалы қағаздар нарығында кәсіби қызмет түрлерін қоса атқаратын ұйымдардың қызметін пруденциалдық реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  requisite: Постановление Правления Национального банка Республики Казахстан от 27 июля 2012 года № 227. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 августа 2012 года № 7871. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 17 июля 2015 года № 128
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам пруденциального регулирования деятельности накопительных пенсионных фондов, организаций, осуществляющих инвестиционное управление пенсионными активами, и организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне жинақтаушы зейнетақы қорларының, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың және бағалы қағаздар нарығында кәсіби қызмет түрлерін қоса атқаратын ұйымдардың қызметін пруденциялық реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

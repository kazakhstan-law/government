  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 189 "Об утверяедении Правил осуществления деятельности организаций, осуществляющих деятельность по инвестиционному управлению пенсионными активами, и накопительных пенсионных фондов"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыратын ұйымдардың және жинақтаушы зейнетақы қорларының қызметін жүзеге асыру ережесін бекіту туралы" 2009 жылғы 5 тамыздағы N 189 қаулысына өзгерістер мен толықтырулар енгізу туралы

title:
  rus: Об утверждении Инструкции о требованиях по наличию системы управления рисками для накопительных пенсионных фондов и организаций, осуществляющих инвестиционное управление пенсионными активами
  kaz: Жинақтаушы зейнетақы қорлары және зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдар үшін тәуекелдерді басқару жүйелерінің болуына қойылатын талаптар жөніндегі нұсқаулықты бекіту туралы

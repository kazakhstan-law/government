act_code: '47899'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 181. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 сентября 2009 года № 5793. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 196
title:
  rus: Об утверждении Инструкции о нормативных значениях пруденциальных нормативов, методике их расчетов для организаций, осуществляющих инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтердің нормативтік мәндері, оларды есептеу әдістемесі туралы нұсқаулықты бекіту туралы

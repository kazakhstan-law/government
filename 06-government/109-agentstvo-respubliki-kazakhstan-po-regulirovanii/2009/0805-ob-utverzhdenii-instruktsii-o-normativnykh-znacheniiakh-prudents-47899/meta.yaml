title:
  rus: Об утверждении Инструкции о нормативных значениях пруденциальных нормативов, методике их расчетов для организаций, осуществляющих инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтердің нормативтік мәндері, оларды есептеу әдістемесі туралы нұсқаулықты бекіту туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 декабря 2009 года № 266. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 февраля 2010 года № 6041
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам пруденциального регулирования деятельности накопительных пенсионных фондов, организаций, осуществляющих инвестиционное управление пенсионными активами, и организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне жинақтаушы зейнетақы қорларының, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың және бағалы қағаздар нарығында кәсіби қызметтің түрлерін қоса атқаратын ұйымдардың қызметін пруденциалдық реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 апреля 2026 года № 68. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 апреля 2026 года № 38455
  title:
    rus: Об утверждении Правил выбора банка с универсальной банковской лицензией, осуществляющего исламские банковские операции, исламского банка и передачи ему имущества, приобретенного за счет денег, привлеченных по договору об инвестиционном депозите, и обязательств по инвестиционным депозитам ликвидируемого банка с универсальной банковской лицензией, осуществляющего исламские банковские операции, исламского банка, а также выбора банка, филиала банка – нерезидента Республики Казахстан, осуществляющих исламские банковские операции, филиала банка-нерезидента Республики Казахстан с универсальной банковской лицензией, осуществляющего исламские банковские операции, и передачи им имущества, приобретенного за счет денег, привлеченных по договору об инвестиционном депозите, и обязательств по инвестиционным депозитам принудительно прекращающего деятельность филиала исламского банка-нерезидента Республики Казахстан, филиала банка-нерезидента Республики Казахстан с универсальной банковской лицензией, осуществляющего исламские банковские операции
    kaz: Исламдық банк операцияларын жүзеге асыратын әмбебап банк лицензиясы бар банкті, ислам банкін таңдау және оған инвестициялық депозит туралы шарт бойынша тартылған ақша есебінен сатып алынған мүлікті және исламдық банк операцияларын жүзеге асыратын әмбебап банк лицензиясы бар таратылатын банктің, ислам банкінің инвестициялық депозиттер бойынша міндеттемелерін беру, сондай-ақ банкті, исламдық банк операцияларын жүзеге асыратын әмбебап банк лицензиясы бар банкті, Қазақстан Республикасы бейрезидент банкінің филиалын, исламдық банк операцияларын жүзеге асыратын әмбебап банк лицензиясы бар Қазақстан Республикасы бейрезидент банкінің филиалын таңдау және оларға инвестициялық депозит туралы шарт бойынша тартылған ақша есебінен сатып алынған мүлікті және қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент ислам банкі филиалының, исламдық банк операцияларын жүзеге асыратын әмбебап банк лицензиясы бар Қазақстан Республикасының бейрезидент банкі филиалының инвестициялық депозиттер бойынша міндеттемелерін беру қағидаларын бекіту туралы

  requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 278. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 2012 года № 8007. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 214
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 сентября 2009 года № 209 "Об утверждении Инструкции о требованиях по наличию системы управления рисками для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, деятельность по управлению инвестиционным портфелем"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалы қағаздар нарығында брокерлік және дилерлік қызметті, инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдар үшін тәуекелдерді басқару жүйелерінің болуына қойылатын талаптар туралы нұсқаулықты бекіту туралы" 2009 жылғы 26 қыркүйектегі № 209 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/68167/rus

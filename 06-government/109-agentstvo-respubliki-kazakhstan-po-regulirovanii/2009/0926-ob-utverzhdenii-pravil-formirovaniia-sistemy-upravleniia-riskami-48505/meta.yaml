act_code: '48505'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 сентября 2009 года № 209. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 ноября 2009 года № 5844. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 214
title:
  rus: Об утверждении Правил формирования системы управления рисками и внутреннего контроля для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, деятельность по управлению инвестиционным портфелем
  kaz: Бағалы қағаздар нарығында брокерлік және дилерлік қызметті, инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымдар үшін тәуекелдерді басқару және ішкі бақылау жүйелерін қалыптастыру қағидаларын бекіту туралы

act_code: '47785'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 179. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 сентября 2009 года № 5782. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 31 января 2019 года № 11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

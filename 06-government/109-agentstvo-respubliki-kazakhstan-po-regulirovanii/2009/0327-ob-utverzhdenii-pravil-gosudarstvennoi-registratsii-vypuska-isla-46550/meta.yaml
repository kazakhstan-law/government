  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регистрации выпуска, а также размещения, обращения и аннулирования эмиссионных ценных бумаг
    kaz: Эмиссиялық бағалы қағаздар шығарылымын тіркеу, сондай-ақ орналастыру, айналысқа жіберу және жою мәселелері бойынша Қазақстан Республикасының нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу туралы

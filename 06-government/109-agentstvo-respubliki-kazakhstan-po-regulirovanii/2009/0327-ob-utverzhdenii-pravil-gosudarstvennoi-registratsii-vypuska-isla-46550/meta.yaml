act_code: '46550'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 марта 2009 года № 57. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2009 года № 5669. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 19 декабря 2015 года № 251
title:
  rus: Об утверждении Правил государственной регистрации выпуска исламских ценных бумаг, рассмотрения отчетов об итогах размещения и погашения исламских ценных бумаг, а также присвоения национального идентификационного номера исламским ценным бумагам
  kaz: Ислам бағалы қағаздары шығарылымын мемлекеттік тіркеу, ислам бағалы қағаздарын орналастыру және өтеу қорытындылары туралы есептерді қарау, сондай-ақ ислам бағалы қағаздарына ұлттық сәйкестендіру нөмірлерін беру жөніндегі ережені бекіту туралы

act_code: '47855'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 180. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 сентября 2009 года № 5789. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 196
title:
  rus: Об утверждении Инструкции о нормативных значениях пруденциальных нормативов, методике их расчетов для накопительных пенсионных фондов
  kaz: Жинақтаушы зейнетақы қорларына арналған пруденциалдық нормативтердiң нормативтiк мәндері, оларды есептеу әдістемесі туралы нұсқаулықты бекіту туралы

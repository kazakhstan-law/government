act_code: '21811'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 265. Зарегистрировано Министерством юстиции Республики Казахстан 8 ноября 2004 года N 3189. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года N 121
title:
  rus: Об установлении пруденциального норматива для организаций, осуществляющих деятельность по ведению системы реестров держателей ценных бумаг, утверждении Правил расчета пруденциального норматива для организаций, осуществляющих деятельность по ведению системы реестров держателей ценных бумаг
  kaz: Бағалы қағаздарды ұстаушылардың Тізілімдерінің жүйесін жүргізу қызметін жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, бағалы қағаздарды ұстаушылардың тізілімдерінің жүйесін жүргізу қызметін жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді есептеуу Ережелерін бекіту туралы

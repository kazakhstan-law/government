  code: '28609'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 мая 2006 года № 126. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 июня 2006 года № 4271. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 121
  title:
    rus: О внесении дополнений и изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года № 265 "Об установлении пруденциального норматива для организаций, осуществляющих деятельность по ведению системы реестров держателей ценных бумаг, утверждении Правил расчета пруденциального норматива для организаций, осуществляющих деятельность по ведению системы реестров держателей ценных бумаг"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалы қағаздарды ұстаушылардың Тізілімдерінің жүйесін жүргізу қызметін жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, бағалы қағаздарды ұстаушылардың тізілімдерінің жүйесін жүргізу қызметін жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді есептеу Ережелерін бекіту туралы" 2004 жылғы 25 қыркүйектегі № 265 қаулысына толықтырулар мен өзгеріс енгізу туралы

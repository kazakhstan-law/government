act_code: '21425'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года N 250. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 сентября 2004 года N 3113. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 марта 2017 года № 53 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил об условиях и минимальных требованиях к порядку предоставления информации поставщиками информации, о порядке оформления согласия субъектов кредитных историй на предоставление информации о них в кредитные бюро, оформления согласия на выдачу кредитного отчета и об условиях и порядке предоставления кредитного отчета
  kaz: Ақпарат жеткiзушiлердiң ақпаратты беру тәртiбiне қойылатын шарттар мен ең төменгi талаптар туралы, кредиттiк тарих субъектiлерiнiң олар туралы ақпаратты кредиттiк бюроларға беруге келiсiмiн ресiмдеу, кредиттiк есептi беруге келiсiмдi ресiмдеу тәртiбi туралы және кредиттiк есеп беру шарттары мен тәртiбi туралы ереженi бекiту жөнiнде

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 марта 2005 года № 102. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 мая 2005 года № 3616. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 марта 2017 года № 53 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года N 250 "Об утверждении Правил об условиях и минимальных требованиях к порядку предоставления информации поставщиками информации, о порядке оформления согласия субъектов кредитных историй на предоставление информации о них в кредитные бюро, оформления согласия на выдачу кредитного отчета и об условиях и порядке предоставления кредитного отчета"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Ақпарат жеткізушілердің ақпаратты беру тәртібіне қойылатын шарттар мен ең төменгі талаптар туралы, кредиттік тарих субъектілерінің олар туралы ақпаратты кредиттік бюроларға беруге келісімін ресімдеу, кредиттік есепті беруге келісімді ресімдеу тәртібі туралы және кредиттік есеп беру шарттары мен тәртібі туралы ережені бекіту жөнінде" 2004 жылғы 21 тамыздағы N 250 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/24011/rus

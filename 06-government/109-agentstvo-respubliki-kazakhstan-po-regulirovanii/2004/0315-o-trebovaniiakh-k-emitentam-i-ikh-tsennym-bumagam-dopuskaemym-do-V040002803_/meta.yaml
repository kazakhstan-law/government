  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 63. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 марта 2006 года № 4142. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года N 73 (вводится в действие по истечении 14 дней со дня гос. регистрации)
  title:
    rus: О внесении изменения и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года № 63 "О требованиях к эмитентам и их ценным бумагам, допускаемым (допущенным) к обращению на фондовой бирже, а также к отдельным категориям списка фондовой биржи"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қор биржасында айналысқа жіберілетін (жіберілген) эмитенттерге және олардың бағалы қағаздарына, сондай-ақ қор биржасының тізіміндегі жеке санаттарға қойылатын талаптар туралы" 2004 жылғы 15 наурыздағы № 63 қаулысына өзгеріс пен толықтыру енгізу туралы

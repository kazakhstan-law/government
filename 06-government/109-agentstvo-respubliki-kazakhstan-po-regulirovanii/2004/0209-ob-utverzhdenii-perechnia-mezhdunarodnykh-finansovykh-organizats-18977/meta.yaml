act_code: '18977'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 февраля 2004 г. N 25. Зарегистрировано Министерством юстиции Республики Казахстан 17 марта 2004 года N 2740. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года N 128
title:
  rus: Об утверждении перечня международных финансовых организаций и минимального рейтинга для иностранных эмитентов, с облигациями которых банки второго уровня вправе совершать сделки
  kaz: Облигациялармен екінші деңгейдегі банктер мәмілелерді жүзеге асыра алатын халықаралық қаржы ұйымдарының және шетел эмитенттеріне арналған ең төменгі рейтингтің тізбесін белгілеу туралы

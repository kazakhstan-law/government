  title:
    rus: О внесении дополнений и изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 февраля 2004 года № 25 "Об утверждении перечня международных финансовых организаций, с облигациями которых банки второго уровня вправе совершать сделки"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Облигациялармен екінші деңгейдегі банктер мәмілелерді жүзеге асыра алатын халықаралық қаржы ұйымдарының тізбесін белгілеу туралы" 2004 жылғы 9 ақпандағы № 25 қаулысына толықтырулар мен өзгерістер енгізу туралы

act_code: '19760'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 апреля 2004 года N 110. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 мая 2004 года N 2845. Утратило силу постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27 мая 2006 года N 114

  kaz: Бағалы қағаздар рыногындағы жұмыс үшін жеке тұлғаларды аттестациядан өткізу, біліктілік куәліктерін беру, сонымен қатар біліктілік куәліктерінің қолданысын тоқтата тұру немесе қайтарып алу ережесін бекіту туралы

act_code: '20650'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года N 158. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 июля 2004 года N 2954. Утратило силу - постановлением Правления Агентство Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года N 124
title:
  rus: Об утверждении Правил проведения аттестации физических лиц для работы на рынке ценных бумаг, выдачи квалификационных свидетельств, а также приостановления действия или отзыва квалификационных свидетельств
  kaz: Бағалы қағаздар рыногындағы жұмыс үшін жеке тұлғаларды аттестациядан өткізу, біліктілік куәліктерін беру, сонымен қатар біліктілік куәліктерінің қолданысын тоқтата тұру немесе қайтарып алу ережесін бекіту туралы

act_code: '22791'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года № 375. Зарегистрировано Министерством юстиции Республики Казахстан 24 января 2005 года № 3376. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 85
title:
  rus: Об утверждении Правил представления отчета о совершенных сделках по инвестированию пенсионных активов и собственных активов накопительными пенсионными фондами и организациями, осуществляющими инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерін инвестициялау бойынша жасалған мәмілелер және жинақтаушы зейнетақы қорлары мен зейнетақы активтерін инвестициялық басқаруды жүзеге асырушы ұйымдардың меншікті активтері жөнінде есеп беру ережесін бекіту туралы

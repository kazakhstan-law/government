requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июля 2004 года № 200. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 августа 2004 года № 2988. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 307 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении пруденциальных нормативов для Национального оператора почты, а также форм и сроков представления отчетов об их выполнении
  kaz: Ұлттық почта операторына арналған пруденциалдық нормативтерді, сондай-ақ олардың орындалуы жөніндегі есептердің нысандарын және ұсыну мерзімін белгілеу туралы

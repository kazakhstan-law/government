  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 июля 2007 года N 211. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 августа 2007 года N 4900. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года N 118
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования и надзора профессиональных участников рынка ценных бумаг и накопительных пенсионных фондов
    kaz: Қазақстан Республикасының кейбір номативтік құқықтық актілеріне бағалы қағаздар рыногының кәсіби қатысушыларын және жинақтаушы зейнетақы қорларын реттеу және қадағалау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың есеп беру ережесін бекіту туралы" 2004 жылғы 27 қарашадағы № 334 қаулысына өзгерістер енгізу туралы

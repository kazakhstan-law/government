requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года N 152. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 сентября 2004 года N 3045. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 195
title:
  rus: О требованиях к организационной структуре организатора торгов и об утверждении Правил осуществления деятельности структурного подразделения организатора торгов, осуществляющего деятельность по надзору за совершаемыми сделками в торговой системе организатора торгов
  kaz: Сауда-саттықты ұйымдастырушының ұйымдық құрылымына қойылатын талаптар туралы және Сауда-саттықты ұйымдастырушының сауда жүйесінде жасалатын мәмілелерге қадағалау жөніндегі қызметті жүзеге асыратын сауда-саттықты ұйымдастырушының ұйымдық құрылымының қызметін жүзеге асыру ережесін бекіту жөнінде

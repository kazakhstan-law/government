  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года № 77 "Об утверждении Правил представления отчетов организаторами торгов и внесении изменений в постановление Национальной комиссии Республики Казахстан по ценным бумагам от 22 октября 1996 года № 118 "Об утверждении Инструкции "О порядке предоставления отчетности профессиональными участниками рынка ценных бумаг", зарегистрированное в Министерстве юстиции Республики Казахстан под № 238, в постановление Правления Национального Банка Республики Казахстан от 13 апреля 2002 года № 130 "О порядке представления еженедельной и ежемесячной отчетности профессиональными участниками рынка ценных бумаг и организаторами торгов с ценными бумагами", зарегистрированное в Министерстве юстиции Республики Казахстан под № 1865
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сауда-саттық ұйымдастырушылардың есеп беру ережесін және Қазақстан Республикасының Әділет министрлігінде № 238 тіркелген Қазақстан Республикасының Бағалы қағаздар жөніндегі ұлттық комиссияның "Бағалы қағаздар рыногының кәсіби қатысушыларының есеп беру тәртібі туралы" Нұсқаулықты бекіту жөнінде" 1996 жылғы 22 қазандағы N 118 қаулысына, Қазақстан Республикасының Әділет министрлігінде N 1865 тіркелген Қазақстан Республикасының Ұлттық Банкі Басқармасының "Бағалы қағаздар рыногы кәсіби қатысушыларының және бағалы қағаздармен сауда-саттық ұйымдастырушылардың апта және ай сайынғы есепті ұсыну тәртібі туралы" 2002 жылғы 13 сәуірдегі N 130 қаулысына өзгерістер енгізу туралы" 2004 жылғы 15 наурыздағы N 77 қаулысына өзгерістер енгізу туралы

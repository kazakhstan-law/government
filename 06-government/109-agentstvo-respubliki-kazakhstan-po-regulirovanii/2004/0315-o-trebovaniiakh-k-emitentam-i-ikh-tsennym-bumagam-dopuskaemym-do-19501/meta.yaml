act_code: '19501'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года N 63. Зарегистрировано Министерством юстиции Республики Казахстан от 14 апреля 2004 года N 2803. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года N 73

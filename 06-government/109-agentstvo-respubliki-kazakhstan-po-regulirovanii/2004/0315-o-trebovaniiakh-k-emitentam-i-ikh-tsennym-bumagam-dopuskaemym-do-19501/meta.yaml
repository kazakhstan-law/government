  code: '21482'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 21 августа 2004 года N 246. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 октября 2004 года N 3122. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года N 73
  title:
    rus: О внесении изменения в постановление Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года N 63 "О требованиях к эмитентам и их ценным бумагам, допускаемым (допущенным) к обращению на фондовой бирже, а также к отдельным категориям списка фондовой биржи", зарегистрированное в Министерстве юстиции Республики Казахстан под N 2803
    kaz: Қазақстан Республикасының Әділет министрлігінде N 2803 тіркелген, Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын мемлекеттік реттеу мен қадағалау жөніндегі агенттігі Басқармасының "Қор биржасында айналысқа жіберілетін (жіберілген) эмитенттерге және олардың бағалы қағаздарына, сондай-ақ қор биржасының тізіміндегі жеке санаттарға қойылатын талаптар туралы" 2004 жылғы 15 наурыздағы N 63 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года № 63 "О требованиях к эмитентам и их ценным бумагам, допускаемым (допущенным) к обращению на фондовой бирже, а также к отдельным категориям списка фондовой биржи"
    kaz: Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөнiндегi агенттiгi Басқармасының "Қор биржасында айналысқа жiберiлетiн (жiберiлген) эмитенттерге және олардың бағалы қағаздарына, сондай-ақ қор биржасының тiзiмiндегi жеке санаттарға қойылатын талаптар туралы" 2004 жылғы 15 наурыздағы № 63 қаулысына толықтырулар мен өзгерiстер енгiзу туралы

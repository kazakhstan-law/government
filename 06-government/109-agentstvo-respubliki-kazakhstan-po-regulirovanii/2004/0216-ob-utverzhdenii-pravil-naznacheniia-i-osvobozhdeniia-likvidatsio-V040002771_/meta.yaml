title:
  rus: Об утверждении Правил назначения и освобождения ликвидационной комиссии принудительно ликвидируемых банка, страховой (перестраховочной) организации и накопительного пенсионного фонда и требования, предъявляемые к председателю и членам ликвидационной комиссии
  kaz: Еріксіз таратылатын банктің, сақтандыру (қайта сақтандыру) ұйымының және жинақтаушы зейнетақы қорының тарату комиссиясын тағайындау және босату ережесін және тарату комиссиясының төрағасы мен мүшелеріне қойылатын талаптарды бекіту туралы

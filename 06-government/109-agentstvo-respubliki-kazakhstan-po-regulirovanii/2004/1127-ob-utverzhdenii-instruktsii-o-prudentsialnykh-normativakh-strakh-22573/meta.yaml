  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 ноября 2004 года N 335 "Об утверждении Инструкции о пруденциальных нормативах страховой (перестраховочной) организации, методике их расчетов и представлении отчетов о выполнении пруденциальных нормативов, а также требованиях к степени диверсификации активов страховой (перестраховочной) организации"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымдарына арналған пруденциалдық нормативтер, оларды есептеу әдістемесі және пруденциалдық нормативтердің орындалуы жөнінде есеп беру, сондай-ақ сақтандыру (қайта сақтандыру) ұйымының активтерін диверсификациялау дәрежесіне қойылатын талаптар туралы нұсқаулықты бекіту жөнінде" 2004 жылғы 27 қарашадағы N 335 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '22573'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 ноября 2004 года № 335. Зарегистрировано Министерством юстиции Республики Казахстан 12 января 2005 года № 3351. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года № 87
title:
  rus: Об утверждении Инструкции о пруденциальных нормативах страховой (перестраховочной) организации, методике их расчетов и представлении отчетов о выполнении пруденциальных нормативов, а также требованиях к степени диверсификации активов страховой (перестраховочной) организации
  kaz: Сақтандыру (қайта сақтандыру) ұйымдарына арналған пруденциалдық нормативтер, оларды есептеу әдістемесі және пруденциалдық нормативтердің орындалуы жөнінде есеп беру, сондай-ақ сақтандыру (қайта сақтандыру) ұйымының активтерін диверсификациялау дәрежесіне қойылатын талаптар туралы нұсқаулықты бекіту жөнінде

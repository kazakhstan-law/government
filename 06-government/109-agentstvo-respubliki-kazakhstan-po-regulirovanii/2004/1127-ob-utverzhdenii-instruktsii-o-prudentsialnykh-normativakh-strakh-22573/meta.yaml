  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 19 февраля 2005 года N 36. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 марта 2005 года N 3514. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года N 87
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 ноября 2004 года № 335 "Об утверждении Инструкции о пруденциальных нормативах страховой (перестраховочной) организации, методике их расчетов и представлении отчетов о выполнении пруденциальных нормативов, а также требованиях к степени диверсификации активов страховой (перестраховочной) организации"
    kaz: Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөніндегі агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымдарына арналған пруденциалдық нормативтер, оларды есептеу әдістемесі және пруденциалдық нормативтердiң орындалуы жөнiнде есеп беру, сондай-ақ сақтандыру (қайта сақтандыру) ұйымының активтерін диверсификациялау дәрежесіне қойылатын талаптар туралы нұсқаулықты бекiту жөнiнде" 2004 жылғы 27 қарашадағы N 335 қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 ноября 2004 года № 330 "Об утверждении Правил представления отчетности юридическими лицами, осуществляющими деятельность по инвестиционному управлению пенсионными активами"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзеге асыратын заңды тұлғалардың есеп беру ережесін бекіту туралы" 2004 жылғы 27 қарашадағы № 330 қаулысына өзгерістер мен толықтырулар енгізу туралы

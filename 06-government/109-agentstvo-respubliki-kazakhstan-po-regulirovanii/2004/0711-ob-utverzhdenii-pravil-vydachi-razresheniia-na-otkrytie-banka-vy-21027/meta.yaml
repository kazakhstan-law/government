act_code: '21027'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июля 2004 года № 197. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 августа 2004 года № 3034. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года № 9
title:
  rus: Об утверждении Правил выдачи разрешения на открытие банка, выдачи согласия на открытие филиалов банка и открытия, закрытия расчетно-кассовых отделов банка и Правил выдачи, приостановления и отзыва лицензии на проведение банковских и иных операций, осуществляемых банками
  kaz: Банкті ашуға рұқсат беру, банк филиалдарын ашуға келісім беру және банктің есеп айырысу-касса бөлімдерін ашу, жабу ережесін және банктік әрі банктер жүзеге асыратын өзге операцияларды жүргізуге лицензияны беру, тоқтата тұру және қайтарып алу ережесін бекіту туралы

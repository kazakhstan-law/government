  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июля 2004 года № 197 "Об утверждении Правил выдачи разрешения на открытие банка, выдачи согласия на открытие филиалов банка и открытия, закрытия расчетно-кассовых отделов банка и Правил выдачи, приостановления и отзыва лицензии на проведение банковских и иных операций, осуществляемых банками"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банкті ашуға рұқсат беру, банк филиалдарын ашуға келісім беру және банктің есеп айырысу-касса бөлімдерін ашу, жабу ережесін және банктік әрі банктер жүзеге асыратын өзге операцияларды жүргізуге лицензияны беру, тоқтата тұру және қайтарып алу ережесін бекіту туралы" 2004 жылғы 12 шілдедегі № 197 қаулысына толықтырулар мен өзгерістер енгізу туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2005 года N 220. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 июля 2005 года N 3740. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 9 января 2006 года N 9 (V064038)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июля 2004 года N 197 "Об утверждении Правил выдачи разрешения на открытие банка, выдачи согласия на открытие филиалов банка и открытия, закрытия расчетно-кассовых отделов банка и Правил выдачи, приостановления и отзыва лицензии на проведение банковских и иных операций, осуществляемых банками"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттiгi Басқармасының "Банктi ашуға рұқсат беру, банк филиалдарын ашуға келiсiм беру және банктiң есеп айырысу-касса бөлiмдерiн ашу, жабу ережесiн және банктiк әрi банктер жүзеге асыратын өзге операцияларды жүргiзуге лицензияны беру, тоқтата тұру және қайтарып алу ережесiн бекiту туралы" 2004 жылғы 12 шiлдедегi N 197 қаулысына өзгерiстер енгiзу туралы

  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года N 73 "О реализации статьи 22 Закона Республики Казахстан "О банках и банковской деятельности в Республике Казахстан", статьи 35 Закона Республики Казахстан "О страховой деятельности", статей 36 и 52 Закона Республики Казахстан "О пенсионном обеспечении в Республике Казахстан"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының""Қазақстан Республикасының""Қазақстан Республикасындағы банктер және банк қызметі туралы" Заңының 22-бабын, Қазақстан Республикасының "Сақтандыру қызметі туралы" Заңының 35-бабын, Қазақстан Республикасының "Қазақстан Республикасындағы зейнетақымен қамсыздандыру туралы" Заңының 36 және 52-баптарын іске асыру туралы" 2004 жылғы 15 наурыздағы N 73 қаулысына өзгерістер енгізу туралы

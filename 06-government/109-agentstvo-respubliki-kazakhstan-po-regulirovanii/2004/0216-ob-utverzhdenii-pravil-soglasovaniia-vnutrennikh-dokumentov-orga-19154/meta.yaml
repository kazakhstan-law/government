requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 февраля 2004 года N 33. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 марта 2004 года N 2770. Утратило силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27.08.2005г. N 283

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по регулированию продуктов накопительного страхования
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне жинақтау сақтандыру өнімдерін реттеу бойынша өзгерістер мен толықтырулар енгізу туралы

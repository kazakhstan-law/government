  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года № 274 "Об утверждении Правил предоставления страховыми организациями, осуществляющими деятельность по накопительному страхованию, займов своим страхователям"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Жинақтаушы сақтандыру жөніндегі қызметті жүзеге асыратын сақтандыру ұйымдарының өз сақтанушыларына заемдар беру ережесін бекіту туралы" 2004 жылғы 25 қыркүйектегі № 274 қаулысына толықтырулар мен өзгерістерді енгізу туралы

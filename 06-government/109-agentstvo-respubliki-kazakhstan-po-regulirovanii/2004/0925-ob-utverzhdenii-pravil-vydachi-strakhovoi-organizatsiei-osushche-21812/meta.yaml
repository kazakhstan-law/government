  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 июня 2022 года № 43. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 июня 2022 года № 28661
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года № 274 «Об утверждении Правил выдачи страховой организацией, осуществляющей деятельность по накопительному страхованию, займов своим страхователям и расчета выкупной суммы, а также порядка и условий предоставления услуг филиалом страховой (перестраховочной) организации-нерезидента Республики Казахстан, осуществляющим деятельность по накопительному страхованию, по выдаче страховой организацией-нерезидентом Республики Казахстан займов своим страхователям»
    kaz: «Жинақтаушы сақтандыру жөніндегі қызметті жүзеге асыратын сақтандыру ұйымының өз сақтанушыларына қарыздар беру және сатып алу сомасын есептеу қағидаларын, сондай-ақ жинақтаушы сақтандыру жөніндегі қызметті жүзеге асыратын Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының Қазақстан Республикасы бейрезидент-сақтандыру ұйымының өз сақтанушыларына қарыздар беруі бойынша көрсетілетін қызметтерді ұсыну тәртібі мен шарттарын бекіту туралы» Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөніндегі агенттігі Басқармасының 2004 жылғы 25 қыркүйектегі № 274 қаулысына өзгерістер енгізу туралы

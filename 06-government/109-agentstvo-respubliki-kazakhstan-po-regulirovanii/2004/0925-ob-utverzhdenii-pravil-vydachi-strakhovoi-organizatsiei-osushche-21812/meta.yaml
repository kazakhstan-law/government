act_code: '21812'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 274. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 ноября 2004 года N 3190.
title:
  rus: Об утверждении Правил выдачи страховой организацией, осуществляющей деятельность по накопительному страхованию, займов своим страхователям и расчета выкупной суммы, а также порядка и условий предоставления услуг филиалом страховой (перестраховочной) организации-нерезидента Республики Казахстан, осуществляющим деятельность по накопительному страхованию, по выдаче страховой организацией-нерезидентом Республики Казахстан займов своим страхователям
  kaz: Жинақтаушы сақтандыру жөніндегі қызметті жүзеге асыратын сақтандыру ұйымының өз сақтанушыларына қарыздар беру және сатып алу сомасын есептеу қағидаларын, сондай-ақ жинақтаушы сақтандыру жөніндегі қызметті жүзеге асыратын Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының Қазақстан Республикасы бейрезидент-сақтандыру ұйымының өз сақтанушыларына қарыздар беруі бойынша көрсетілетін қызметтерді ұсыну тәртібі мен шарттарын бекіту туралы

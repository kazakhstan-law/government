  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года № 157 "Об утверждении Правил выдачи согласия на назначение (избрание) руководящих работников финансовых организаций"
    kaz: Қазақстан Республикасының Қаржы рыногын және қаржылық ұйымдарды реттеу мен қадағалау жөніндегі агенттігі Басқармасының "Қаржы ұйымдарының басшы қызметкерлерін тағайындауға (сайлауға) келісім беру ережесін бекіту туралы" 2004 жылғы 12 маусымдағы № 157 қаулысына өзгерістер мен толықтырулар енгізу туралы

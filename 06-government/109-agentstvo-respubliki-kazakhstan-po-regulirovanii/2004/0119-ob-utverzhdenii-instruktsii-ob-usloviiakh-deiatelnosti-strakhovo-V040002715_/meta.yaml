requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 19 января 2004 года N 6. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 февраля 2004 года N 2715. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 270 (вводится в действие с 1 января 2019 года)

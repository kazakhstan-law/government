  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 апреля 2009 года № 90. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 июня 2009 года № 5693. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2010 года № 61
  title:
    rus: О внесении изменений и дополнений в некоторые постановления Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам регулирования деятельности страховых (перестраховочных) организаций и страховых брокеров
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір қаулыларына сақтандыру (қайта сақтандыру) ұйымдарының және сақтандыру брокерлерінің қызметін реттеу бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении дополнений в постановление Правления Национального Банка Республики Казахстан от 4 июля 2003 года N 217 "Об утверждении Правил государственной регистрации выпуска объявленных акций, утверждения отчета об итогах размещения акций и аннулирования выпуска акций" и постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 февраля 2004 года N 32 "Об утверждении Правил ведения системы реестров держателей ценных бумаг"
    kaz: Қазақстан Республикасының Ұлттық Банкі Басқармасының "Жарияланған акциялар шығарылымын мемлекеттік тіркеу, акцияларды орналастыру қорытындылары туралы есепті бекіту және акциялар шығарылымын жою ережесін бекіту туралы" 2003 жылғы 4 шілдедегі N 217 қаулысына және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалы қағаздарды ұстаушылар тізілімдерінің жүйесін жүргізу ережесін бекіту туралы" 2004 жылғы 16 ақпандағы N 32 қаулысына толықтырулар

act_code: '19504'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года N 69. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 апреля 2004 года N 2815. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 марта 2006 года N 79
title:
  rus: Об утверждении Правил принудительной ликвидации накопительных пенсионных фондов, а также осуществления передачи пенсионных активов добровольно ликвидируемого накопительного пенсионного фонда в другой накопительный пенсионный фонд и об особенностях формирования и деятельности комитета кредиторов принудительно или добровольно ликвидируемого накопительного пенсионного фонда
  kaz: Жинақтаушы зейнетақы қорларын еріксіз тарату, сондай-ақ таратылатын жинақтаушы зейнетақы қорының ерікті зейнетақы активтерін басқа жинақтаушы зейнетақы қорына беруді жүзеге асыру және ерікті немесе еріксіз таратылатын жинақтаушы зейнетақы қорының кредиторлар комитетін қалыптастыру және қызметінің ерекшеліктері туралы ережені бекіту жөнінде

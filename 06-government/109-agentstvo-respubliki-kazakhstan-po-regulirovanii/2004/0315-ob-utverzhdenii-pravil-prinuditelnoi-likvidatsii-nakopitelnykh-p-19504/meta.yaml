  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года № 69 "Об утверждении Правил принудительной ликвидации накопительных пенсионных фондов, а также осуществления передачи пенсионных активов ликвидируемого накопительного пенсионного фонда в другой накопительный пенсионный фонд и об особенностях формирования и деятельности комитета кредиторов принудительно или добровольно ликвидируемого накопительного пенсионного фонда"
    kaz: '"Жинақтаушы зейнетақы қорларын еріксіз тарату, сондай-ақ таратылатын жинақтаушы зейнетақы қорының зейнетақы активтерін басқа жинақтаушы зейнетақы қорына беруді жүзеге асыру және ерікті немесе еріксіз таратылатын жинақтаушы зейнетақы қорының кредиторлар комитетін қалыптастыру және қызметінің ерекшеліктері туралы ережені бекіту туралы" 2004 жылғы 15 наурыздағы № 69 қаулысына өзгерістер мен толықтырулар енгізу туралы'

  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 ноября 2004 года № 333 "Об утверждении Правил представления банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, отчетности для формирования кредитного регистра"

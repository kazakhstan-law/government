act_code: '22572'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 ноября 2004 года № 333. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 января 2005 года № 3350. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 174
title:
  rus: Об утверждении Правил представления банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, отчетности для формирования кредитного регистра
  kaz: Екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың кредиттік тізілімді қалыптастыру үшін есеп беру ережесін бекіту туралы

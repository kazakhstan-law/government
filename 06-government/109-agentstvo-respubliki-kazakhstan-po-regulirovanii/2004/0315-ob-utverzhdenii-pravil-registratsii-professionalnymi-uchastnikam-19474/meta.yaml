  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 августа 2005 года № 313. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 октября 2005 года № 3867. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 61
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года № 62 "Об утверждении Правил регистрации профессиональными участниками рынка ценных бумаг, оказывающими услуги номинального держания, сделок с ценными бумагами, а также оформления и выдачи ими выписки с лицевого счета держателя ценных бумаг"»
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Номиналды ұстаушы, бағалы қағаздармен мәмілелер жасау қызметін көрсететін, сондай-ақ бағалы қағаздар ұстаушысының жеке шотының үзінді көшірмесін ресімдейтін және беретін бағалы қағаздар рыногының кәсіби қатысушыларын тіркеу ережесін бекіту туралы" 2004 жылғы 15 наурыздағы № 62 қаулысына өзгерістер мен толықтырулар енгізу туралы

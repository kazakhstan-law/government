act_code: '19474'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года N 62. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 апреля 2004 года N 2819. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 61 (V064138)
title:
  rus: Об утверждении Правил регистрации профессиональными участниками рынка ценных бумаг, оказывающими услуги номинального держания, сделок с финансовыми инструментами, оформления и выдачи ими выписки с лицевого счета держателя финансовых инструментов и раскрытия информации номинальным держателем
  kaz: Номиналды ұстау қызметін көрсететін бағалы қағаздар рыногы кәсіби қатысушыларының қаржы құралдарымен жасалатын мәмілелерді тіркеу, олардың қаржы құралдарын ұстаушының жеке шотынан үзінді жазбаны ресімдеу мен беру және номиналды ұстаушының ақпаратты ашу ережесін бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 февраля 2004 года № 41 "Об утверждении Правил назначения и освобождения ликвидационной комиссии принудительно ликвидируемых банка, страховой (перестраховочной) организации и накопительного пенсионного фонда и требования, предъявляемые к председателю и членам ликвидационной комиссии"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Еріксіз таратылатын банктің, сақтандыру (қайта сақтандыру) ұйымының және жинақтаушы зейнетақы қорының тарату комиссиясын тағайындау және босату ережесін және тарату комиссиясының төрағасы мен мүшелеріне қойылатын талаптарды бекіту туралы" 2004 жылғы 16 ақпандағы № 41 қаулысына өзгерістер мен толықтыру енгізу туралы

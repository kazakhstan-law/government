  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 февраля 2004 года № 41 "Об утверждении Правил назначения ликвидационной комиссии принудительно ликвидируемых банка, страховой (перестраховочной) организации и накопительного пенсионного фонда и требования, предъявляемые к председателю и членам ликвидационной комиссии"

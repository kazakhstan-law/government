  kaz: Еріксіз таратылатын банктің, сақтандыру (қайта сақтандыру) ұйымының және жинақтаушы зейнетақы қорының тарату комиссиясын тағайындау және босату ережесін және тарату комиссиясының төрағасы мен мүшелеріне қойылатын талаптарды бекіту туралы

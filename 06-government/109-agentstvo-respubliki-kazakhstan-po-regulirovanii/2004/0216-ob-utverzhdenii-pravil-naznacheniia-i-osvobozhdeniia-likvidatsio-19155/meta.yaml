act_code: '19155'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 февраля 2004 года № 41. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 марта 2004 года № 2771. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 25 февраля 2013 года № 71
title:

act_code: '21891'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 264. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 ноября 2004 года N 3196. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года N 120.
title:
  rus: Об установлении пруденциального норматива для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, утверждении Правил расчета пруденциального норматива для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг
  kaz: Бағалы қағаздар рыногында брокерлiк және дилерлiк қызметті жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, бағалы қағаздардың нарығында брокерлік-дилерлік қызметті жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді есептеу Ережелерін бекіту туралы

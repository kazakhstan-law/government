  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2005 года № 386. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 декабря 2005 года № 3955. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 120
  title:
    rus: О внесении дополнений и изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года № 264 "Об установлении пруденциального норматива для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, утверждении Правил расчета пруденциального норматива для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, бағалы қағаздардың нарығында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді есептеу Ережелерін бекіту туралы" 2004 жылғы 25 қыркүйектегі № 264 қаулысына толықтырулар мен өзгеріс енгізу туралы

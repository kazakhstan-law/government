requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года N 266. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 ноября 2004 года N 3194. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года N 122
title:
  rus: Об установлении пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем, утверждении Правил расчета пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем
  kaz: Инвестициялық портфельді басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, инвестициялық портфельді басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді есептеу Ережелерін бекіту туралы

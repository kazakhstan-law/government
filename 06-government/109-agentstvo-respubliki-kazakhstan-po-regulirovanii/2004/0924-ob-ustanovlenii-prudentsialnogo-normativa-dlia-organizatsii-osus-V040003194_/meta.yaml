  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2005 года № 388. Зарегистрировано в Министерстве юстиции Республики Казахстан от 24 ноября 2005 года № 3944. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 122
  title:
    rus: О внесении дополнений и изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 сентября 2004 года № 266 "Об установлении пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем, утверждении Правил расчета пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Инвестициялық портфельді басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, инвестициялық портфельді басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді есептеу Ережелерін бекіту туралы" 2004 жылғы 25 қыркүйектегі № 266 қаулысына толықтырулар мен өзгеріс енгізу туралы

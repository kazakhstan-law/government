  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года N 71 "Об утверждении Инструкции о формах, сроках и периодичности представления отчетов и дополнительной информации ликвидационными комиссиями накопительных пенсионных фондов"
    kaz: '"Жинақтаушы зейнетақы қорларының тарату комиссияларының есеп пен қосымша ақпаратты ұсыну нысандары, мерзімі және кезеңділігі туралы Нұсқаулықты бекіту жөнінде" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2004 жылғы 15 наурыздағы N 71 қаулысына өзгерістер мен толықтырулар енгізу туралы'

  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организации от 15 марта 2004 года 71 "Об утверждении Инструкции о формах, сроках и периодичности представления отчетов и дополнительной информации ликвидационными комиссиями накопительных пенсионных фондов"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Жинақтаушы зейнетақы қорларының тарату комиссияларының есеп пен қосымша ақпаратты ұсыну нысандары, мерзімі және кезеңділігі туралы нұсқаулықты бекіту жөнінде" 2004 жылы 15 наурыздағы N 71 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/35864/rus

act_code: '19500'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 15 марта 2004 года N 71. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 апреля 2004 года N 2802. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 212 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

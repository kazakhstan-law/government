  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 12 июня 2004 года N 153 "Об утверждении Правил по ведению учета пенсионных накоплений на индивидуальных пенсионных счетах вкладчиков (получателей) в накопительных пенсионных фондах"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Жинақтаушы зейнетақы қорларындағы салымшылардың (алушылардың) жеке зейнетақы шоттарында жинақталған зейнетақы қаражатының есебін жүргізу ережесін бекіту туралы" 2004 жылғы 12 маусымдағы N 153 қаулысына өзгерістер мен толықтырулар енгізу туралы"

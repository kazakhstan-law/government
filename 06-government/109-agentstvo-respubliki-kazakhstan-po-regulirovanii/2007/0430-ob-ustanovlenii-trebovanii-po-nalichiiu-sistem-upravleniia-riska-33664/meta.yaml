act_code: '33664'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 129. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 июня 2007 года № 4730. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 сентября 2009 года № 209
title:
  rus: Об установлении требований по наличию систем управления рисками для профессиональных участников рынка ценных бумаг
  kaz: Бағалы қағаздар рыногының кәсіби қатысушылары үшін тәуекелдерді басқару жүйелерінің болуына қойылатын талаптарды белгілеу туралы

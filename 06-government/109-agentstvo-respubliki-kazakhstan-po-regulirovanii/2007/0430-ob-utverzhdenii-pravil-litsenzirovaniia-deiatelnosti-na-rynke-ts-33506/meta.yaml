  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам лицензирования деятельности на рынке ценных бумаг и согласования руководящих работников
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығындағы қызметті лицензиялау және басшы қызметкерлерді келісу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

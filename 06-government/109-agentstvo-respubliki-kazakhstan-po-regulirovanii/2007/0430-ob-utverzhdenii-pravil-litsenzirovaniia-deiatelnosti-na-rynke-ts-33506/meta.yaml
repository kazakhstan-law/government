  title:
    rus: О внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 117 "Об утверждении Правил лицензирования деятельности на рынке ценных бумаг Республики Казахстан"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қазақстан Республикасы бағалы қағаздар рыногындағы қызметті лицензиялау ережесін бекіту туралы" 2007 жылғы 30 сәуірдегі N 117 қаулысына өзгеріс енгізу туралы

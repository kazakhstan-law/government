  title:
    rus: Об утверждении Правил выдачи разрешения на государственную регистрацию накопительных пенсионных фондов в органах юстиции и о внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 123 "Об утверждении Правил выдачи разрешения на государственную регистрацию накопительных пенсионных фондов в органах юстиции, изменений и дополнений в их учредительные документы, а также лицензирования деятельности накопительных пенсионных фондов по привлечению пенсионных взносов и осуществлению пенсионных выплат и осуществлению деятельности на рынке ценных бумаг"
    kaz: «Жинақтаушы зейнетақы қорларын әділет органдарында мемлекеттік тіркеуге рұқсат беру қағидаларын бекіту туралы және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының «Жинақтаушы зейнетақы қорларын, олардың құрылтай құжаттарына өзгерістер мен толықтыруларды әділет органдарында мемлекеттік тіркеуге рұқсат беру, сондай-ақ жинақтаушы зейнетақы қорларының зейнетақы жарналарын тарту және зейнетақы төлемдерін жүзеге асыру мен бағалы қағаздар рыногындағы қызметті жүзеге асыру жөніндегі қызметін лицензиялау ережесін бекіту туралы» 2007 жылғы 30 сәуірдегі № 123 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/65766/rus

act_code: '33683'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 123. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 июня 2007 года № 4736. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 августа 2013 года № 212
title:
  rus: Об утверждении Правил лицензирования деятельности накопительных пенсионных фондов по привлечению пенсионных взносов и осуществлению пенсионных выплат и осуществлению деятельности на рынке ценных бумаг
  kaz: Жинақтаушы зейнетақы қорларының зейнетақы жарналарын тарту және зейнетақы төлемдерін жүзеге асыру мен бағалы қағаздар нарығындағы қызметті жүзеге асыру жөніндегі қызметін лицензиялау қағидаларын бекіту туралы

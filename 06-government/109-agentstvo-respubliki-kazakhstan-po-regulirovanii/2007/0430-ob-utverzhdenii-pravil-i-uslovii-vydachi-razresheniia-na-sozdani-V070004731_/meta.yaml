  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 47. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2020 года № 20233. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 февраля 2021 года № 24 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 122 «Об утверждении Правил выдачи разрешения на создание страховой (перестраховочной) организации, а также выдачи лицензии на право осуществления страховой (перестраховочной) деятельности и деятельности страхового брокера»
    kaz: «Сақтандыру (қайта сақтандыру) ұйымын құруға рұқсат беру, сондай-ақ сақтандыру (қайта сақтандыру) қызметін және сақтандыру брокерінің қызметін жүзеге асыру құқығына лицензия беру қағидаларын бекiту туралы» Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2007 жылғы 30 сәуірдегі № 122 қаулысына өзгерістер мен толықтыру енгізу туралы

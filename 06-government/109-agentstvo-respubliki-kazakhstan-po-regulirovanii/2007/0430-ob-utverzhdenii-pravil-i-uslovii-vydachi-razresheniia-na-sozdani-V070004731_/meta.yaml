requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 122. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 июня 2007 года № 4731. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 февраля 2021 года № 24 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и условий выдачи разрешения на создание страховой (перестраховочной) организации, а также требований к содержанию документов, представляемых для получения разрешения на создание страховой (перестраховочной) организации, Правил лицензирования страховой (перестраховочной) деятельности и деятельности страхового брокера, а также требований к содержанию документов, представляемых для получения лицензии
  kaz: Сақтандыру (қайта сақтандыру) ұйымын құруға рұқсат беру қағидаларын және шарттарын, сондай-ақ сақтандыру (қайта сақтандыру) ұйымын құруға рұқсат алу үшін ұсынылатын құжаттардың мазмұнына қойылатын талаптарды, Сақтандыру (қайта сақтандыру) қызметін және сақтандыру брокерінің қызметін лицензиялау қағидаларын, сондай-ақ лицензия алу үшін ұсынылатын құжаттардың мазмұнына қойылатын талаптарды бекіту туралы

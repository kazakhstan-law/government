  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 34. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2020 года № 20225. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 29 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 168 «Об утверждении Правил лицензирования банковских операций, осуществляемых организациями, осуществляющими отдельные виды банковских операций»
    kaz: «Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар жүзеге асыратын банк операцияларын лицензиялау қағидаларын бекіту туралы» Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2007 жылғы 25 маусымдағы № 168 қаулысына өзгерістер мен толықтыру енгізу туралы

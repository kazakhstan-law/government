  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 ноября 2009 года № 228. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 ноября 2009 года № 5889. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 17 апреля 2026 года № 70 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 июля 2007 года № 210 "О перечне и порядке приобретения базовых активов производных ценных бумаг, с которыми банки второго уровня могут осуществлять брокерскую и/или дилерскую деятельность на рынке ценных бумаг"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Екінші деңгейдегі банктердің бағалы қағаздар рыногында брокерлік және/немесе дилерлік қызметті жүзеге асыра алатын туынды бағалы қағаздардың базалық активтерін сатып алу тізбесі және тәртібі туралы" 2007 жылғы 16 шілдедегі № 210 қаулысына толықтырулар мен өзгерістер енгізу туралы

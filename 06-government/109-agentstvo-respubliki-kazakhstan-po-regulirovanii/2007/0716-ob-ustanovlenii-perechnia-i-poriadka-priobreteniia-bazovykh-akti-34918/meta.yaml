act_code: '34918'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 июля 2007 года № 210. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 августа 2007 года № 4892. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 17 апреля 2026 года № 70 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении перечня и порядка приобретения базовых активов производных ценных бумаг и производных финансовых инструментов, с которыми банки второго уровня, филиалы банков-нерезидентов Республики Казахстан могут осуществлять брокерскую и (или) дилерскую деятельность на рынке ценных бумаг, случаев заключения сделок с государственными ценными бумагами и негосударственными ценными бумагами на вторичном рынке, производными финансовыми инструментами на неорганизованном рынке ценных бумаг, а также критериев, в соответствии с которыми банки второго уровня могут осуществлять брокерскую деятельность
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент- банктері филиалдарының бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыра алатын туынды бағалы қағаздар мен туынды қаржы құралдары базалық активтерінің тізбесін және оларды сатып алу тәртібін, қайталама нарықта мемлекеттік бағалы қағаздармен және мемлекеттік емес бағалы қағаздармен, ұйымдаспаған бағалы қағаздар нарығында туынды қаржы құралдарымен мәмілелер жасау жағдайларын, сондай-ақ екінші деңгейдегі банктер брокерлік қызметті жүзеге асыра алатын өлшемшарттарды белгілеу туралы

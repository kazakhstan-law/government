  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 16 июля 2007 года № 210 «Об установлении перечня и порядка приобретения базовых активов производных ценных бумаг и производных финансовых инструментов, с которыми банки второго уровня могут осуществлять брокерскую и (или) дилерскую деятельность на рынке ценных бумаг, а также случаев заключения сделок с государственными ценными бумагами и негосударственными ценными бумагами на вторичном рынке, производными финансовыми инструментами на неорганизованном рынке ценных бумаг
    kaz: Екінші деңгейдегі банктердің бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыра алатын туынды бағалы қағаздар мен туынды қаржы құралдары базалық активтерінің тізбесін және оларды сатып алу тәртібін, сондай-ақ қайталама нарықта мемлекеттік бағалы қағаздармен және мемлекеттік емес бағалы қағаздармен, ұйымдаспаған бағалы қағаздар нарығында туынды қаржы құралдарымен мәмілелер жасау жағдайларын белгілеу туралы» Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2007 жылғы 16 шілдедегі № 210 қаулысына өзгерістер мен толықтыру енгізу туралы

  kaz: Мүлікті (зияткерлік меншік объектілерін, материалдық емес активтердің құнын қоспағанда) бағалау жөніндегі қызметті жүзеге асыруға лицензиясы бар жеке немесе заңды тұлғаны аккредиттеу ережесін бекіту туралы

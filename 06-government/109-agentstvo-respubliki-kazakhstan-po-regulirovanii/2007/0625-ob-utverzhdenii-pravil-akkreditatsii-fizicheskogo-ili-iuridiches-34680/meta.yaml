  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 176 "Об утверждении Правил аккредитации физического или юридического лица, имеющего лицензию на осуществление оценочной деятельности"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Бағалау қызметін жүзеге асыруға лицензиясы бар жеке немесе заңды тұлғаны аккредиттеу ережесін бекіту туралы" 2007 жылғы 25 маусымдағы N 176 қаулысына өзгерістер мен толықтырулар енгізу туралы

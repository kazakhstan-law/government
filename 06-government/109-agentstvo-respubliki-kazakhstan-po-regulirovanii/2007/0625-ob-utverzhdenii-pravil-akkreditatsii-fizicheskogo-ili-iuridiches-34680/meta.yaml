act_code: '34680'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 176. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 августа 2007 года № 4861. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 27
title:
  rus: Об утверждении Правил аккредитации физического или юридического лица, имеющего лицензию на осуществление деятельности по оценке имущества (за исключением объектов интеллектуальной собственности, стоимости нематериальных активов)
  kaz: Мүлікті (зияткерлік меншік объектілерін, материалдық емес активтердің құнын қоспағанда) бағалау жөніндегі қызметті жүзеге асыруға лицензиясы бар жеке немесе заңды тұлғаны аккредиттеу ережесін бекіту туралы

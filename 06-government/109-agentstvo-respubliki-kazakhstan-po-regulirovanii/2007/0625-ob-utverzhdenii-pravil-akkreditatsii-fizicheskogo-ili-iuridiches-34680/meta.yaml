act_code: '34680'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 176. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 августа 2007 года № 4861. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 27
title:

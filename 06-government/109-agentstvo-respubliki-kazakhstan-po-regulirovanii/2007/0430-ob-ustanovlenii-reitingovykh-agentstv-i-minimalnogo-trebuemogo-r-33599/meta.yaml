  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2010 года № 185. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 февраля 2011 года № 6769. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 176
  title:
    rus: О внесении изменения и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 128 "Об установлении рейтинговых агентств и минимального требуемого рейтинга для облигаций, с которыми банки могут осуществлять сделки, а также минимального требуемого рейтинга стран, с государственными ценными бумагами которых банки могут совершать сделки при осуществлении брокерской и (или) дилерской деятельности"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Рейтинг агенттіктері мен банктер мәмілелерін жүзеге асыра алатын облигацияларға арналған ең төменгі талап етілетін рейтингін, сондай-ақ екінші деңгейдегі банктер брокерлік және (немесе) дилерлік қызметті жүзеге асырған кезде мемлекеттік бағалы қағаздарымен мәмілелер жасай алатын елдердің ең төменгі талап етілетін рейтингін белгілеу туралы" 2007 жылғы 30 сәуірдегі № 128 қаулысына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/57294/rus

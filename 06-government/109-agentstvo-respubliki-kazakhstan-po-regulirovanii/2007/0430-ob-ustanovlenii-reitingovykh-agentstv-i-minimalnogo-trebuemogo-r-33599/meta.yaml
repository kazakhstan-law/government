  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 128 "Об установлении рейтинговых агентств и минимального рейтинга для облигаций, с которыми банки могут осуществлять сделки"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Рейтинг агенттіктері мен банктер мәмілелерін жүзеге асыра алатын облигацияларға арналған барынша төмен рейтингті белгілеу туралы" 2007 жылғы 30 сәуірдегі № 128 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '33599'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 128. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 июня 2007 года № 4717. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 176
title:
  rus: Об установлении рейтинговых агентств и минимального требуемого рейтинга для облигаций, с которыми банки могут осуществлять сделки, а также минимального требуемого рейтинга стран, с государственными ценными бумагами которых банки могут совершать сделки при осуществлении брокерской и (или) дилерской деятельности
  kaz: Рейтинг агенттіктері мен банктер мәмілелерін жүзеге асыра алатын облигацияларға арналған ең төменгі талап етілетін рейтингін, сондай-ақ екiншi деңгейдегі банктер брокерлік және/немесе дилерлік қызметті жүзеге асырған кезде мемлекеттік бағалы қағаздарымен мәмілелер жасай алатын елдердің ең төменгі талап етiлетiн рейтингін белгілеу туралы

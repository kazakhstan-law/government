act_code: '34747'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 168. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 августа 2007 года № 4873. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 29 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил лицензирования банковских операций, осуществляемых организациями, осуществляющими отдельные виды банковских операций, Квалификационных требований по проведению банковских операций организациями, осуществляющими отдельные виды банковских операций, и перечня документов, подтверждающих соответствие им
  kaz: Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар жүзеге асыратын банк операцияларын лицензиялау қағидаларын, Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың банк операцияларын жүргізу бойынша біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы

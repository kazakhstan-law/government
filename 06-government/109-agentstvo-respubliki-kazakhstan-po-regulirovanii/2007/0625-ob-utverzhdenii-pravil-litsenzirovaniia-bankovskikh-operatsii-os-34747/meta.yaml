  title:
    rus: О внесении изменений в постановление Правления АгентстваРеспублики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 168 "Об утверждении Правил лицензирования организаций, осуществляющих отдельные виды банковских операций и внесении дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 54 "О минимальных размерах уставного капитала организаций, осуществляющих отдельные виды банковских операций на основании лицензии уполномоченного государственного органа Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банктік операциялардың жекелеген түрлерін жүзеге асыратын ұйымдарды лицензиялау ережесін бекіту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау жөніндегі уәкілетті мемлекеттік органының лицензиясы негізінде банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың жарғылық капиталының ең төменгі мөлшерлері туралы" 2006 жылғы 25 ақпандағы № 54 қаулысына толықтырулар енгізу туралы" 2007 жылғы 25 маусымдағы № 168 қаулысына өзгерістер енгізу туралы

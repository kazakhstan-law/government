  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 168 «Об утверждении Правил лицензирования банковских операций, осуществляемых организациями, осуществляющими отдельные виды банковских операций, Квалификационных требований по проведению банковских операций организациями, осуществляющими отдельные виды банковских операций, и перечня документов, подтверждающих соответствие им»
    kaz: «Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар жүзеге асыратын банк операцияларын лицензиялау қағидаларын, Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың банк операцияларын жүргізу бойынша біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы» Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2007 жылғы 25 маусымдағы № 168 қаулысына өзгерістер енгізу туралы

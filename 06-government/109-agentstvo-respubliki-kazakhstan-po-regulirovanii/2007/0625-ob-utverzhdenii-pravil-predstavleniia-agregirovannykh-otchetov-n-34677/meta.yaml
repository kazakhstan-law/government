  title:
    rus: О внесении изменения и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года N 188 "Об утверждении Правил представления агрегированных отчетов накопительных пенсионных фондов и организаций, осуществляющих инвестиционное управление пенсионными активами, а также их публикации в средствах массовой информации"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының»"Жинақтаушы зейнетақы қорларының және зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың біріктірілген есептерін беру, сондай-ақ оларды бұқаралық ақпарат құралдарында жариялау ережесін бекіту туралы"»2007 жылғы 25 маусымдағы N 188 қаулысына өзгеріс пен толықтыру енгізу туралы

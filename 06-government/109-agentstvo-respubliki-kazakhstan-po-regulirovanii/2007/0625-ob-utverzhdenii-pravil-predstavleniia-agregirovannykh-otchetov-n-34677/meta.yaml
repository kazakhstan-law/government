act_code: '34677'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года N 188. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 августа 2007 года N 4858. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 13 февраля 2012 года № 28
title:
  rus: Об утверждении Правил представления агрегированных отчетов накопительных пенсионных фондов и организаций, осуществляющих инвестиционное управление пенсионными активами, а также их публикации в средствах массовой информации
  kaz: Жинақтаушы зейнетақы қорларының және зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың біріктірілген есептерін беру, сондай-ақ оларды бұқаралық ақпарат құралдарында жариялау ережесін бекіту туралы

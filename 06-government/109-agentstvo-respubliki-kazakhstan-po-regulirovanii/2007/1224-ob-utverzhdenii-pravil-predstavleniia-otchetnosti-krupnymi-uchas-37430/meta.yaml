  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 декабря 2007 года № 275 "Об утверждении Правил представления отчетности крупными участниками банков, банковскими холдингами, крупными участниками страховой (перестраховочной) организации, крупными участниками открытого накопительного пенсионного фонда"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының «Банктердің ірі қатысушыларының, банк холдингтерінің, сақтандыру (қайта сақтандыру) ұйымының ірі қатысушыларының, ашық жинақтаушы зейнетақы қорының ірі қатысушыларының есеп беру ережесін бекіту туралы» 2007 жылғы 24 желтоқсандағы № 275 қаулысына толықтырулар мен өзгерістер енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 декабря 2007 года № 275 "Об утверждении Правил представления отчетности крупными участниками банков, банковскими холдингами, крупными участниками страховой (перестраховочной) организации, крупными участниками открытого накопительного пенсионного фонда

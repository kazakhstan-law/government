act_code: '37430'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 24 декабря 2007 года № 275. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 января 2008 года № 5114. Утратило силу постановлением Правления Национального банка Республики Казахстан от 24 февраля 2012 года № 97
title:
  rus: Об утверждении Правил представления отчетности крупными участниками банков, банковскими холдингами, крупными участниками страховой (перестраховочной) организации, страховыми холдингами, крупными участниками открытого накопительного пенсионного фонда
  kaz: Банктердің ірі қатысушыларының, банк холдингтерінің, сақтандыру (қайта сақтандыру) ұйымының ірі қатысушыларының, сақтандыру холдингтерінің, ашық жинақтаушы зейнетақы қорының ірі қатысушыларының есеп беру ережесін бекіту туралы

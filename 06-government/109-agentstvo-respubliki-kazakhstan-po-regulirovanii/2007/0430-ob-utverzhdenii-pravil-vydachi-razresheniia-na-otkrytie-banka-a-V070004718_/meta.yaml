  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования, контроля и надзора финансового рынка и финансовых организаций
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығын және қаржы ұйымдарын реттеу, бақылау мен қадағалау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 сентября 2009 года № 217. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 октября 2009 года № 5830. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 1 марта 2010 года № 24 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 июня 2007 года № 178 "Об установлении требований к содержанию заявления страхователя для заключения договора обязательного страхования гражданско-правовой ответственности владельцев транспортных средств"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру шартын жасауға арналған сақтанушы өтінішінің мазмұнына қойылатын талаптарды белгілеу туралы" 2007 жылғы 25 маусымдағы № 178 қаулысына өзгеріс енгізу туралы

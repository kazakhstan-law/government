  title:
    rus: О внесении изменения и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года N 121 "Об утверждении Правил выдачи разрешения на открытие банка, а также лицензирования банковских и иных операций, и деятельности на рынке ценных бумаг, осуществляемых банками"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банкті ашуға рұқсат беру, сондай-ақ банктер бағалы қағаздар рыногында жүзеге асыратын қызметті, банктік және өзге операцияларды лицензиялау ережесін бекіту туралы" 2007 жылғы 30 сәуірдегі N 121 қаулысына өзгеріс пен толықтыру енгізу туралы

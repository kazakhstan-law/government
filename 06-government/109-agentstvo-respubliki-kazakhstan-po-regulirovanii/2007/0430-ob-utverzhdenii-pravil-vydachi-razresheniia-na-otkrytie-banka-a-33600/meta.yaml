act_code: '33600'
requisite: Постановление Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 121. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 июня 2007 года № 4718. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 36 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на открытие банка, а также лицензирования банковских и иных операций, деятельности на рынке ценных бумаг, осуществляемых банками
  kaz: Банкті ашуға рұқсат беру, сондай-ақ банктер бағалы қағаздар рыногында жүзеге асыратын қызметті, банктік және өзге операцияларды лицензиялау ережесін бекіту туралы

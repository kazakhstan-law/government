  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 апреля 2007 года № 121 "Об утверждении Правил выдачи разрешения на открытие банка, а также лицензирования банковских и иных операций, деятельности на рынке ценных бумаг, осуществляемых банками"
    kaz: '"Банкті ашуға рұқсат беру, сондай-ақ банктер бағалы қағаздар рыногында жүзеге асыратын қызметті, банктік және өзге операцияларды лицензиялау ережесін бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2007 жылғы 30 сәуірдегі № 121 қаулысына өзгерістер енгізу туралы'

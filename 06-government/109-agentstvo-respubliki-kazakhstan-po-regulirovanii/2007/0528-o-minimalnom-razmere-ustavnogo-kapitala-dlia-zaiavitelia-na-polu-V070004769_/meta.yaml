requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 мая 2007 года N 152. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 июня 2007 года N 4769. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года N 197
title:
  rus: О минимальном размере уставного капитала для заявителя на получение лицензии на осуществление деятельности по инвестиционному управлению пенсионными активами и для организации, осуществляющей инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерін инвестициялық басқару жөніндегі қызметті жүзге асыруға лицензия алуға өтініш беруші үшін және зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдар үшін жарғылық капиталдың барынша төмен мөлшері туралы

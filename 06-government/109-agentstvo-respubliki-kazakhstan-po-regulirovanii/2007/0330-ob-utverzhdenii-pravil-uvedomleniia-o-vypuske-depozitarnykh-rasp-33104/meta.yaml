  title:
    rus: О внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года № 75 "Об утверждении Правил уведомления о выпуске депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги организаций-резидентов Республики Казахстан, представления отчета об итогах размещения производных ценных бумаг, выдачи разрешения на выпуск производных ценных бумаг в соответствии с законодательством иностранного государства или размещение производных ценных бумаг на территории иностранного государства"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Депозитарлық қолхаттарды немесе базалық активі Қазақстан Республикасы резидент ұйымдарының эмиссиялық бағалы қағаздары болып табылатын өзге де бағалы қағаздарды шығару жөнінде хабардар ету, туынды бағалы қағаздарды орналастыру қортындылары жөніндегі есепті беру, шет мемлекеттің заңнамасына сәйкес туынды бағалы қағаздарды шығаруға немесе мемлекет аумағында туынды бағалы қағаздарды орналастыруға рұқсат беру ережесін бекіту туралы" 2007 жылғы 30 наурыздағы N 75 қаулысына өзгеріс енгізу туралы

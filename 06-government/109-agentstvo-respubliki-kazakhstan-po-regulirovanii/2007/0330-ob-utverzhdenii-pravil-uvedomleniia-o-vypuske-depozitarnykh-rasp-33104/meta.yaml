act_code: '33104'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года № 75. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 мая 2007 года № 4659. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 70
title:
  rus: Об утверждении Правил уведомления о выпуске депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги организаций-резидентов Республики Казахстан, представления отчета об итогах размещения производных ценных бумаг, выдачи разрешения на выпуск производных ценных бумаг в соответствии с законодательством иностранного государства или размещение производных ценных бумаг на территории иностранного государства
  kaz: Депозитарлық қолхаттарды немесе базалық активі Қазақстан Республикасы резидент ұйымдарының эмиссиялық бағалы қағаздары болып табылатын өзге де бағалы қағаздарды шығару жөнінде хабардар ету, туынды бағалы қағаздарды орналастыру қорытындылары жөніндегі есепті беру, шет мемлекеттің заңнамасына сәйкес туынды бағалы қағаздарды шығаруға немесе шет мемлекет аумағында туынды бағалы қағаздарды орналастыруға рұқсат беру ережесін бекіту туралы

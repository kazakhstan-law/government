  title:
    rus: О внесении дополнений и изменений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам рынка ценных бумаг
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығының мәселелері бойынша толықтырулар мен өзгерістер енгізу туралы

act_code: '42399'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 141. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 ноября 2008 года № 5362. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 387
title:
  rus: Об утверждении Правил о методике расчета ставки обязательных, дополнительных взносов и условных обязательств, порядке и сроках уплаты обязательных, дополнительных и чрезвычайных взносов, формирования и учета условных обязательств страховыми организациями - участниками Фонда гарантирования страховых выплат
  kaz: Сақтандыру ұйымдарының – Сақтандыру төлемдеріне кепілдік беру қоры қатысушыларының міндетті, қосымша жарналар мен шартты міндеттемелердің ставкасын есептеу әдістемесі, міндетті, қосымша және төтенше жарналар төлеу тәртібі мен мерзімдері, шартты міндеттемелерді қалыптастыру және есебін жүргізу туралы ережені бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 141 "Об утверждении Правил о методике расчета ставки обязательных, дополнительных взносов и условных обязательств, порядке и сроках уплаты обязательных, дополнительных и чрезвычайных взносов, формирования и учета условных обязательств страховыми организациями - участниками Фонда гарантирования страховых выплат"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру ұйымдарының Сақтандыру төлемдеріне кепілдік беру қоры қатысушыларының міндетті, қосымша жарналар мен шартты міндеттемелердің ставкасын есептеу әдістемесі, міндетті, қосымша және төтенше жарналар төлеу тәртібі мен мерзімдері, шартты міндеттемелерді қалыптастыру және есебін жүргізу туралы ережені бекіту туралы" 2008 жылғы 2 қазандағы N 141 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/47228/rus

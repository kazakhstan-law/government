requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 141. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 ноября 2008 года № 5362. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 387
title:

title:
  rus: Об установлении пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем, утверждении Правил расчета пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем
  kaz: Инвестициялық портфельді басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді белгілеу, Инвестициялық портфельді басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтерді есептеу ережесін бекіту туралы

  title:
    rus: О внесении дополнений и изменений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам пруденциального регулирования деятельности организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, организаций, осуществляющих деятельность по ведению системы держателей ценных бумаг, организаций, осуществляющих управление инвестиционным портфелем
    kaz: Бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдардың, бағалы қағаздарды ұстаушылар жүйесін жүргізу жөніндегі қызметті жүзеге асыратын ұйымдардың, инвестициялық портфельді басқаруды жүзеге асыратын ұйымдардың қызметтерін пруденциалдық реттеу мәселелері бойынша Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне толықтырулар мен өзгерістер енгізу туралы

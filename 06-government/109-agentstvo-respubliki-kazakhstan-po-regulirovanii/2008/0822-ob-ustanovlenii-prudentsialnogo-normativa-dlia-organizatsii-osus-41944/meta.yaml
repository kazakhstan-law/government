  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам пруденциального регулирования деятельности организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, организаций, осуществляющих деятельность по ведению системы реестров держателей ценных бумаг, организаций, осуществляющих управление инвестиционным портфелем
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдардың, бағалы қағаздарды ұстаушыларының тізілім жүйесін жүргізу жөніндегі қызметті жүзеге асыратын ұйымдардың, инвестициялық портфельді басқаруды жүзеге асыратын ұйымдардың қызметтерін пруденциалдық реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

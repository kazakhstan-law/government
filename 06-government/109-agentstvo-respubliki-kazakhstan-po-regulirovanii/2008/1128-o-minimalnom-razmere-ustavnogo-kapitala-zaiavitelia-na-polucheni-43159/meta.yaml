act_code: '43159'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 197. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 декабря 2008 года № 5461. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 168
title:
  rus: О минимальном размере уставного капитала заявителя на получение лицензии для осуществления деятельности на рынке ценных бумаг и юридического лица, осуществляющего деятельность на рынке ценных бумаг на основании лицензии
  kaz: Бағалы қағаздар рыногындағы қызметті жүзеге асыру үшін лицензия алуға өтініш берушінің және лицензия негізінде бағалы қағаздар рыногындағы қызметті жүзеге асыратын заңды тұлғаның жарғылық капиталының барынша төмен мөлшері туралы

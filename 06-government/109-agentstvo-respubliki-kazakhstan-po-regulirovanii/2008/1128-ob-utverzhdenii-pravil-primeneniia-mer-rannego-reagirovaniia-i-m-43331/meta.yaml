  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 200 "Об утверждении Правил применения мер раннего реагирования и методики определения факторов, влияющих на ухудшение финансового положения банка второго уровня, накопительного пенсионного фонда и (или) организации, осуществляющей инвестиционное управление пенсионными активами, страховой (перестраховочной) организации"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Ертерек ден қою шараларын және екінші деңгейдегі банктің, жинақтаушы зейнетақы қорының және (немесе) зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымның, сақтандыру (қайта сақтандыру) ұйымының қаржылық жай-күйінің нашарлауына ықпал ететін факторларды анықтау әдістемесін қолдану ережесін бекіту туралы" 2008 жылғы 28 қарашадағы N 200 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/47733/rus

act_code: '43331'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 200. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 декабря 2008 года № 5464. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 66
title:
  rus: Об утверждении Правил применения мер раннего реагирования и методики определения факторов, влияющих на ухудшение финансового положения накопительного пенсионного фонда и (или) организации, осуществляющей инвестиционное управление пенсионными активами, страховой (перестраховочной) организации
  kaz: Ертерек ден қою шараларын және жинақтаушы зейнетақы қорының және (немесе) зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымның, сақтандыру (қайта сақтандыру) ұйымының қаржылық жай-күйінің нашарлауына ықпал ететін факторларды анықтау әдістемесін қолдану ережесін бекіту туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 февраля 2011 года № 23. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2011 года № 6886. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 декабря 2012 года № 380
  title:
    rus: Об утверждении Правил применения мер раннего реагирования и методики определения факторов, влияющих на ухудшение финансового положения банка второго уровня, и внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 200 "Об утверждении Правил применения мер раннего реагирования и методики определения факторов, влияющих на ухудшение финансового положения банка второго уровня, накопительного пенсионного фонда и (или) организации, осуществляющей инвестиционное управление пенсионными активами, страховой (перестраховочной) организации"
    kaz: Ертерек ден қою шараларын және екінші деңгейдегі банктің қаржылық жай-күйінің нашарлауына ықпал ететін факторларды анықтау әдістемесін қолдану ережесін бекіту және Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының «Ертерек ден қою шараларын және екінші деңгейдегі банктің, жинақтаушы зейнетақы қорының және (немесе) зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымның, сақтандыру (қайта сақтандыру) ұйымының қаржылық жай-күйінің нашарлауына ықпал ететін факторларды анықтау әдістемесін қолдану ережесін бекіту туралы» 2008 жылғы 28 қарашадағы № 200 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/58570/rus

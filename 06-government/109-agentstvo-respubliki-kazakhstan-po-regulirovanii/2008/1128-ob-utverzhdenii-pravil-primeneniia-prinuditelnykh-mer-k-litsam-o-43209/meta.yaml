requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 185. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 января 2009 года № 5469. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 90
title:

act_code: '41910'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 131. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 сентября 2008 года № 5331. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции об установлении пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов для страховой (перестраховочной) организации и страховой группы, включая минимальные размеры уставного капитала, гарантийного фонда, маржи платежеспособности и сроках представления отчетов о выполнении пруденциальных нормативов
  kaz: Жарғылық капиталдың, кепілдік беру қорының, төлем қабілеттілігі маржасының ең аз мөлшерiн қоса алғанда, сақтандыру (қайта сақтандыру) ұйымы және сақтандыру тобы үшiн пруденциалдық нормативтердi және өзге де сақталуға мiндеттi нормалар мен лимиттердi белгiлеу және пруденциалдық нормативтерді орындау туралы есептерді ұсыну мерзімдері жөніндегі нұсқаулықты бекіту туралы

  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам деятельности обществ взаимного страхования
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне өзара сақтандыру қоғамдары қызметінің мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 131 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов страховой (перестраховочной) организации, формах и сроках представления отчетов о выполнении пруденциальных нормативов"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымының пруденциалдық нормативтер есебінің нормативтік мәні мен әдістемесі, пруденциалдық нормативтердің орындалғандығы жөніндегі есепті беру нысандары мен мерзімі туралы Нұсқаулықты бекіту туралы" 2008 жылғы 22 тамыздағы N 131 қаулысына толықтырулар мен өзгерістер енгізу туралы

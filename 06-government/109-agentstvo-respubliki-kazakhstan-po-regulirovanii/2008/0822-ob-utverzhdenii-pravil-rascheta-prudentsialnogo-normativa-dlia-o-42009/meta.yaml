title:
  rus: Об утверждении Правил расчета пруденциального норматива для организаций, осуществляющих деятельность по ведению системы реестров держателей ценных бумаг
  kaz: Бағалы қағаздарды ұстаушылардың тізілімдерінің жүйесін жүргізу жөніндегі қызметті жүзеге асыратын ұйымдарға арналған пруденциалдық нормативті есептеу ережесін бекіту туралы

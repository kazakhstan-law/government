  title:
    rus: О внесении дополнений и изменений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам пруденциального регулирования деятельности организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, организаций, осуществляющих деятельность по ведению системы реестров держателей ценных бумаг, и организаций, осуществляющих управление инвестиционным портфелем
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдардың, бағалы қағаздарды ұстаушылардың тізілім жүйесін жүргізу жөніндегі қызметті жүзеге асыратын ұйымдардың және инвестициялық портфельді басқаруды жүзеге асыратын ұйымдардың қызметін пруденциалдық реттеу мәселелері бойынша толықтырулар мен өзгерістер енгізу туралы

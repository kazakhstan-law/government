  code: '43902'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 декабря 2008 года № 247. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 января 2009 года № 5514
  title:
    rus: О внесении дополнений и изменений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам пруденциального регулирования деятельности накопительных пенсионных фондов, организаций, осуществляющих инвестиционное управление пенсионными активами, и организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне жинақтаушы зейнетақы қорларының, зейнетақы активтерін инвестициялық басқаруды жүзеге асырушы ұйымдардың, және бағалы қағаздар рыногындағы кәсіби қызмет түрлерін қосып атқарушы ұйымдардың қызметін пруденциалдық реттеу мәселелері бойынша толықтырулар мен өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/43902/rus

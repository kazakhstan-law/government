  code: '42753'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2008 года № 164. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 декабря 2008 года № 5405
  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций по вопросам пруденциального регулирования деятельности накопительных пенсионных фондов, организаций, осуществляющих инвестиционное управление пенсионными активами, и организаций, совмещающих виды профессиональной деятельности на рынке ценных бумаг
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне жинақтаушы зейнетақы қорларының, зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдардың және бағалы қағаздар рыногындағы кәсіби қызметтің түрлерін қоса атқаратын ұйымдардың қызметін пруденциалдық реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

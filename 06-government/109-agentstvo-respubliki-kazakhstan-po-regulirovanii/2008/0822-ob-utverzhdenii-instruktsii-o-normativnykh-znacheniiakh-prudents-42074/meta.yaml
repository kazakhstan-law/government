act_code: '42074'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 118. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 сентября 2008 года № 5322. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 5 августа 2009 года № 181
title:
  rus: Об утверждении Инструкции о нормативных значениях пруденциальных нормативов, методике их расчетов для организаций, осуществляющих инвестиционное управление пенсионными активами
  kaz: Зейнетақы активтерін инвестициялық басқаруды жүзеге асыратын ұйымдарға арналған пруденциалдық нормативтердің нормативтік мәндері, оларды есептеу әдістемесі туралы нұсқаулықты бекіту туралы

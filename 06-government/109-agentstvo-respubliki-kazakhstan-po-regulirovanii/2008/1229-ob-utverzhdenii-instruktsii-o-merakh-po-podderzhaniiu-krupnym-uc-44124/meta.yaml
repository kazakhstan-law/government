act_code: '44124'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 декабря 2008 года № 246. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 февраля 2009 года № 5542. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 28 апреля 2012 года № 170
title:
  rus: Об утверждении Инструкции о мерах по поддержанию крупным участником открытого накопительного пенсионного фонда, владеющим прямо или косвенно более двадцатью пятью процентами голосующих акций накопительного пенсионного фонда, коэффициентов достаточности собственного капитала открытого накопительного пенсионного фонда
  kaz: Ашық жинақтаушы зейнетақы қорының меншікті капиталы жеткіліктілігі коэффициенттерін, жинақтаушы зейнетақы қорының дауыс беруші акцияларының жиырма бес пайыздан астамын тура немесе жанама иеленетін, ашық жинақтау зейнетақы қорының ірі қатысушыларын қолдау жөніндегі шаралар туралы нұсқаулықты бекіту туралы

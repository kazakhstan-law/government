act_code: '43673'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 196. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 января 2009 года № 5476. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 23 апреля 2014 года № 70
title:
  rus: Об утверждении Правил признания сделок, заключенных на организованном рынке ценных бумаг как совершенных в целях манипулирования, формирования и работы комитета совета директоров фондовой биржи по вопросу признания сделок с ценными бумагами, совершенных в целях манипулирования, а также его количественного состава
  kaz: Ұйымдастырылған бағалы қағаздар рыногында жасалған мәмiлелердi бағаны манипуляциялау мақсатында жасалған деп тану, қор биржасы директорлар кеңесінің бағалы қағаздармен жасалған мәмілелерді манипуляциялау мақсатында жасалған деп тану мәселесі жөніндегі комитетін құру және оның жұмыс істеу ережесiн, сондай-ақ оның сандық құрамын бекiту туралы

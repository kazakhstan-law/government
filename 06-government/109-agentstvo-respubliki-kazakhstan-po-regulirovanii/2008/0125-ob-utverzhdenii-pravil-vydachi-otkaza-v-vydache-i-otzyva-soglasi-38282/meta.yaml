  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 января 2008 года № 7 "Об утверждении Правил выдачи, отказа в выдаче и отзыва согласия на приобретение статуса крупного участника банка, банковского холдинга, крупного участника страховой (перестраховочной) организации, крупного участника открытого накопительного пенсионного фонда"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Банктің, банк холдингінің ірі қатысушысы, сақтандыру (қайта сақтандыру) ұйымының ірі қатысушысы, ашық жинақтаушы зейнетақы қорының ірі қатысушысы мәртебесін иеленуге келісімді беру, беруден бас тарту, қайтарып алу ережесін бекіту туралы" 2008 жылғы 25 қаңтардағы № 7 қаулысына толықтырулар мен өзгерістер енгізу туралы

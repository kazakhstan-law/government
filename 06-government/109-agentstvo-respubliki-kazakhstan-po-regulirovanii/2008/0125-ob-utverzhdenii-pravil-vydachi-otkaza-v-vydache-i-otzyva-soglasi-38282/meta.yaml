act_code: '38282'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 января 2008 года № 7. Зарегистрировано в Министерстве юстиции Республики Казахстан 07 марта 2008 года № 5165. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 67
title:
  rus: Об утверждении Правил выдачи, отказа в выдаче и отзыва согласия на приобретение статуса крупного участника банка, банковского холдинга, крупного участника страховой (перестраховочной) организации, страхового холдинга, крупного участника открытого накопительного пенсионного фонда
  kaz: Банктің, банк холдингінің ірі қатысушысы, сақтандыру (қайта сақтандыру) ұйымының, сақтандыру холдингінің ірі қатысушысы, ашық жинақтаушы зейнетақы қорының ірі қатысушысы мәртебесін иеленуге келісімді беру, беруден бас тарту, қайтарып алу ережесін бекіту туралы

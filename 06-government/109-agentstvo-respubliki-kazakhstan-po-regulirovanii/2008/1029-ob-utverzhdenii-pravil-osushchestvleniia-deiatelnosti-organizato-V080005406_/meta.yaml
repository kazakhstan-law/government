  requisite: Постановление Правления Национального Банка Республики Казахстан от 3 февраля 2014 года № 7. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 мая 2014 года № 9410. Утратило силу  постановлением Правления Национального Банка Республики Казахстан от 27 апреля 2018 года № 79, за исключением подпункта 2) пункта 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об установлении пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем, утверждении Правил расчета значений пруденциального норматива для организаций, осуществляющих управление инвестиционным портфелем и внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам рынка ценных бумаг
    kaz: Инвестициялық портфельді басқаруды жүзеге асыратын ұйымдар үшін пруденциялық нормативті белгілеу, Инвестициялық портфельді басқаруды жүзеге асыратын ұйымдар үшін пруденциялық нормативтің мәндерін есеп айырысу қағидаларын бекіту және Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығы мәселелері бойынша өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/80002/rus

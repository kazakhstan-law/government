requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 148. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 ноября 2008 года № 5365. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 ноября 2022 года № 99 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігінің кейбір нормативтік құқықтық актілеріне қаржы құралдарының листингі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

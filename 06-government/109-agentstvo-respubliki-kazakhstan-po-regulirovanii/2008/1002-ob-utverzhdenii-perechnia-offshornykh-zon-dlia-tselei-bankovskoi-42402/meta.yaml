act_code: '42402'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 145. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 ноября  2008 года № 5371. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2020 года № 8 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня оффшорных зон для целей банковской и страховой деятельности, деятельности профессиональных участников рынка ценных бумаг и иных лицензируемых видов деятельности на рынке ценных бумаг, деятельности накопительных пенсионных фондов и акционерных инвестиционных фондов
  kaz: Банктік және сақтандыру қызметінің, бағалы қағаздар рыногының кәсіби қатысушылары қызметінің және бағалы қағаздар рыногында лицензияланатын басқа да қызмет түрлерінің, жинақтаушы зейнетақы қорлары мен акционерлік инвестициялық қорлар қызметінің мақсаттары үшін оффшорлық аймақтардың тізбесін бекіту туралы

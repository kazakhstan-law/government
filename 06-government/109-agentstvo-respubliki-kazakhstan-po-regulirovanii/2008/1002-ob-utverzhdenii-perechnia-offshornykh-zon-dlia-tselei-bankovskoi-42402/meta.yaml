  title:
    rus: О внесении дополнения в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 2 октября 2008 года № 145 "Об утверждении Перечня оффшорных зон для целей банковской и страховой деятельности, деятельности профессиональных участников рынка ценных бумаг и иных лицензируемых видов деятельности на рынке ценных бумаг, деятельности накопительных пенсионных фондов и акционерных инвестиционных фондов"
    kaz: '"Банктік және сақтандыру қызметінің, бағалы қағаздар рыногының кәсіби қатысушылары қызметінің және бағалы қағаздар рыногында лицензияланатын басқа да қызмет түрлерінің, жинақтаушы зейнетақы қорлары мен акционерлік инвестициялық қорлар қызметінің мақсаттары үшін оффшорлық аймақтардың тізбесін бекіту туралы" Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау Агенттігі Басқармасының 2008 жылғы 2 қазандағы N 145 қаулысына толықтыру енгізу туралы'

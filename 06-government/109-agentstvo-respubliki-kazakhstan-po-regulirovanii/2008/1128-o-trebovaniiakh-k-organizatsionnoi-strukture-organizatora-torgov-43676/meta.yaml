act_code: '43676'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 195. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 января 2009 года № 5495. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 19 декабря 2015 года № 249
title:
  rus: О требованиях к организационной структуре организатора торгов и к составу листинговой комиссии фондовой биржи, и об утверждении Правил осуществления деятельности структурного подразделения организатора торгов, осуществляющего деятельность по надзору за совершаемыми сделками в торговой системе организатора торгов
  kaz: Сауда-саттықты ұйымдастырушының ұйымдық құрылымына және қор биржасының листингтік комиссиясының құрамына қойылатын талаптар туралы және Сауда-саттықты ұйымдастырушының сауда жүйесінде жасалатын мәмілелерге қадағалау жөніндегі қызметті жүзеге асыратын сауда-саттықты ұйымдастырушының ұйымдық құрылымының қызметін жүзеге асыру ережесін бекіту жөнінде

  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года № 195 «О требованиях к организационной структуре организатора торгов и к составу листинговой комиссии фондовой биржи, и об утверждении Правил осуществления деятельности структурного подразделения организатора торгов, осуществляющего деятельность по надзору за совершаемыми сделками в торговой системе организатора торгов»
    kaz: «Сауда-саттықты ұйымдастырушының ұйымдық құрылымына және қор биржасының листингтік комиссиясының құрамына қойылатын талаптар туралы және Сауда-саттықты ұйымдастырушының сауда жүйесінде жасалатын мәмілелерге қадағалау жөніндегі қызметті жүзеге асыратын сауда-саттықты ұйымдастырушының ұйымдық құрылымының қызметін жүзеге асыру ережесін бекіту жөнінде» Қазақстан Республикасының Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының 2008 жылғы 28 қарашадағы № 195 қаулысына өзгерістер енгізу туралы

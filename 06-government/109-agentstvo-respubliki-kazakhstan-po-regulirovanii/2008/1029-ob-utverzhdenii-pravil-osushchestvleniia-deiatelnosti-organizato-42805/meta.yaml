act_code: '42805'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2008 года № 170. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 декабря 2008 года № 5406
title:
  rus: Об утверждении Правил осуществления деятельности организаторов торгов с ценными бумагами и иными финансовыми инструментами
  kaz: Бағалы қағаздармен және өзге де қаржы құралдарымен сауда ұйымдастыру қызметін жүзеге асыру қағидаларын бекіту туралы

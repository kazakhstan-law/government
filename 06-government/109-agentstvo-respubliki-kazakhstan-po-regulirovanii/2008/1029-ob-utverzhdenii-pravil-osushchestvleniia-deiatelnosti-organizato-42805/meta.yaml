  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 29 октября 2008 года № 170 "Об утверждении Правил осуществления деятельности организаторов торгов с ценными бумагами и иными финансовыми инструментами"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттiгi Басқармасының "Бағалы қағаздармен және өзге қаржы құралдарымен сауда-саттық ұйымдастырушылардың қызметiн жүзеге асыру ережесiн бекiту туралы" 2008 жылғы 29 қазандағы № 170 қаулысына өзгерістер мен толықтырулар енгізу туралы

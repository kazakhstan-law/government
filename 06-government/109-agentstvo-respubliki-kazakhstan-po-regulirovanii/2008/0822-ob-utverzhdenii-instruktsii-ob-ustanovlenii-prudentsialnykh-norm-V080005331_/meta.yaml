  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 ноября 2009 года № 238. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 января 2010 года № 5990. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 131 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов страховой (перестраховочной) организации, формах и сроках представления отчетов о выполнении пруденциальных нормативов"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымының пруденциалдық нормативтер есебінің нормативтік мәні мен әдістемесі, пруденциалдық нормативтердің орындалғандығы жөніндегі есепті беру нысандары мен мерзімі туралы Нұсқаулықты бекіту туралы" 2008 жылғы 22 тамыздағы № 131 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/50079/rus

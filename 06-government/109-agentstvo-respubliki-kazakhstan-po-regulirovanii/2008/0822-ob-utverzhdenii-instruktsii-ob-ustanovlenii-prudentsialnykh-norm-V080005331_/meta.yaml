  requisite: Постановление Правления Национального Банка Республики Казахстан от 6 мая 2014 года № 77. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 июля 2014 года № 9607. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 131 "Об утверждении Инструкции о нормативных значениях и методике расчетов пруденциальных нормативов страховой (перестраховочной) организации, норматива достаточности маржи платежеспособности страховой группы, формах и сроках представления отчетов о выполнении пруденциальных нормативов"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Сақтандыру (қайта сақтандыру) ұйымының пруденциалдық нормативтер есебінің нормативтік мәні мен әдістемесі, сақтандыру тобының төлем қабілеттілігі маржасының жеткіліктілігі нормативі, пруденциалдық нормативтердің орындалғандығы жөніндегі есепті беру нысандары мен мерзімі туралы нұсқаулықты бекіту туралы" 2008 жылғы 22 тамыздағы № 131 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/81543/rus

act_code: '41767'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 22 августа 2008 года № 120. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 сентября 2008 года № 5324. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 16 июля 2014 года № 146
title:
  rus: Об установлении пруденциального норматива для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг, утверждении Правил расчета пруденциального норматива для организаций, осуществляющих брокерскую и дилерскую деятельность на рынке ценных бумаг
  kaz: Бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдар үшін пруденциалдық нормативті белгілеу туралы, Бағалы қағаздар рыногында брокерлік және дилерлік қызметті жүзеге асыратын ұйымдар үшін пруденциалдық нормативті есептеу ережесін бекіту туралы

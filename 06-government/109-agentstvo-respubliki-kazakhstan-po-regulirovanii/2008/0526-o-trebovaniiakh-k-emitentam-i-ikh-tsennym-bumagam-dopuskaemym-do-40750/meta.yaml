  title:
    rus: О внесении дополнений и изменений в постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 26 мая 2008 года № 77 "О требованиях к эмитентам и их ценным бумагам, допускаемым (допущенным) к обращению на фондовой бирже, а также к отдельным категориям списка фондовой биржи"
    kaz: Қазақстан Республикасы Қаржы нарығын және қаржы ұйымдарын реттеу мен қадағалау агенттігі Басқармасының "Қор биржасында айналымына жіберілетін (жіберілген) эмитенттерге және олардың бағалы қағаздарына талаптары, және де қор биржасы тізімінің бөлек санаттары туралы" 2008 жылғы 26 мамырдағы № 77 қаулысына толықтырулар мен өзгерістер енгізу туралы

caused_by:
  code: '207490'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 февраля 2025 года № 9. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 февраля 2025 года № 35756. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 12 (вводится в действие с 19 марта 2026 года)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 августа 2024 года № 68 «Об утверждении Правил проведения торгов на электронной торговой площадке по продаже банковских и микрофинансовых активов, включая раскрытие участниками торгов информации в отношении имущества, выставленного на торги»
    kaz: «Сауда-саттыққа қатысушылардың сауда-саттыққа шығарылған мүлікке қатысты ақпаратты жария етуін қоса алғанда, банктік және микроқаржы активтерін сататын электрондық сауда алаңында сауда-саттықты өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2024 жылғы 28 тамыздағы № 68 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/207490/rus

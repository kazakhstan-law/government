act_code: '200170'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 августа 2024 года № 68. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 августа 2024 года № 34995. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 12 (вводится в действие с 19 марта 2026 года)
title:
  rus: Об утверждении Правил проведения торгов на электронной торговой площадке по продаже банковских и микрофинансовых активов, включая раскрытие участниками торгов информации в отношении имущества, выставленного на торги
  kaz: Сауда-саттыққа қатысушылардың сауда-саттыққа шығарылған мүлікке қатысты ақпаратты жария етуін қоса алғанда, банктік және микроқаржы активтерін сататын электрондық сауда алаңында сауда-саттықты өткізу қағидаларын бекіту туралы

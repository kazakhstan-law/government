act_code: '199402'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 июля 2024 года № 46. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 июля 2024 года № 34862
title:
  rus: Об утверждении Правил продления сроков исполнения письменного предписания, примененного к оператору электронной торговой площадки по продаже банковских и микрофинансовых активов либо плана мероприятий по устранению выявленных нарушений и (или) причин, а также условий, способствовавших их совершению, в случае отсутствия возможности устранения нарушения в сроки, установленные в плане мероприятий либо письменном предписании, по причинам, не зависящим от оператора электронной торговой площадки по продаже банковских и микрофинансовых активов
  kaz: Банктік және микроқаржы активтерін сататын электрондық сауда алаңының операторына байланысты емес себептер бойынша іс-шаралар жоспарында не жазбаша ұйғарымда белгіленген мерзімдерде бұзушылықтарды жою мүмкіндігі болмаған жағдайда, банктік және микроқаржы активтерін сататын электрондық сауда алаңының операторына қолданылған жазбаша ұйғарымды не анықталған бұзушылықтарды және (немесе) себептерді, сондай-ақ олардың жасалуына ықпал еткен жағдайларды жою бойынша іс-шаралар жоспарын орындау мерзімдерін ұзарту қағидаларын бекіту туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 40. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 апреля 2026 года № 38315
  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 июля 2024 года № 47 «Об утверждении Условий и Правил выдачи разрешения на право осуществления деятельности оператора электронной торговой площадки по продаже банковских и микрофинансовых активов»
    kaz: «Банктік және микроқаржы активтерін сататын электрондық сауда алаңы операторының қызметін жүзеге асыру құқығына рұқсат беру шарттары мен қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2024 жылғы 31 шілдедегі № 47 қаулысына өзгерістер мен толықтыру енгізу туралы

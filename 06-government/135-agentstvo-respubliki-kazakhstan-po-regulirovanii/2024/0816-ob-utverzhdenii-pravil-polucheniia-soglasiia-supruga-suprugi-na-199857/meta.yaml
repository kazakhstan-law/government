act_code: '199857'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 августа 2024 года № 55. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 августа 2024 года № 34946
title:
  rus: Об утверждении Правил получения согласия супруга (супруги) на предоставление потребительского банковского займа или микрокредита, не обеспеченного залогом имущества, подлежащим регистрации, физическому лицу, минимального размера потребительского банковского займа или микрокредита, по которому необходимо согласие супруга (супруги) на предоставление потребительского банковского займа или микрокредита физическому лицу
  kaz: Жеке тұлғаға тіркелуге жататын мүлік кепілімен қамтамасыз етілмеген тұтынушылық банктік қарыз немесе микрокредит беруге жұбайының (зайыбының) келісімін алу қағидаларын, жеке тұлғаға тұтынушылық банктік қарыз немесе микрокредит беруге жұбайының (зайыбының) келісімі қажет болатын тұтынушылық банктік қарыздың немесе микрокредиттің ең төмен мөлшерін бекіту туралы

  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 августа 2024 года № 55 «Об утверждении Правил получения согласия супруга (супруги) на предоставление банковского займа или микрокредита физическому лицу, минимального размера банковского займа или микрокредита, по которому необходимо согласие супруга (супруги) на предоставление банковского займа или микрокредита физическому лицу»
    kaz: «Жеке тұлғаға банктік қарыз немесе микрокредит беруге жұбайының (зайыбының) келісімін алу қағидаларын, жеке тұлғаға банктік қарыз немесе микрокредит беруге жұбайының (зайыбының) келісімі қажет болатын банктік қарыздың немесе микрокредиттің ең төменгі мөлшерін бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2024 жылғы 16 тамыздағы № 55 қаулысына өзгерістер енгізу туралы

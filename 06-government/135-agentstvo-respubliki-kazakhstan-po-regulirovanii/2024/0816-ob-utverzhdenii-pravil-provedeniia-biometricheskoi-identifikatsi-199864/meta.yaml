act_code: '199864'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 августа 2024 года № 56. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 августа 2024 года № 34950. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 54 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

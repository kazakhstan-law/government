act_code: '200437'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 августа 2024 года № 71
title:
  rus: Об утверждении размеров таргетируемой убыточности и фактора достоверности, используемых для расчета страховой премии по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств в соответствии с Законом Республики Казахстан «Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств», на 2025 год
  kaz: «Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру туралы» Қазақстан Республикасының Заңына сәйкес көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру жөніндегі сақтандыру сыйлықақысын есептеу үшін пайдаланылатын таргеттелетін шығындылықтың және анықтық факторының 2025 жылға арналған мөлшерлерін бекіту туралы

act_code: '199569'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 6 августа 2024 года № 50. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 августа 2024 года № 34908. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил обмена сведениями о призванных на срочную воинскую службу военнослужащих, а также их увольнении, наличии либо отсутствии банковского займа, микрокредита, предоставлении отсрочки платежа по договору банковского займа, договору о предоставлении микрокредита
  kaz: Мерзімді әскери қызметке шақырылған әскери қызметшілер, сондай-ақ оларды қызметтен шығару, оларда банктік қарыздың, микрокредиттің болуы не болмауы, банктік қарыз шарты, микрокредит беру туралы шарт бойынша төлемді кейінге қалдырудың ұсынылуы туралы мәліметтерді алмасу қағидаларын бекіту туралы

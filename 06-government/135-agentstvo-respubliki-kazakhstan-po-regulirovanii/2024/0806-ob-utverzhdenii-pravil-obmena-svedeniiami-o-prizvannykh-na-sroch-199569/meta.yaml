  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 августа 2025 года № 34. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 августа 2025 года № 36705. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 6 августа 2024 года № 50 «Об утверждении Правил обмена сведениями о призванных на срочную воинскую службу военнослужащих, а также их увольнении, наличии либо отсутствии банковского займа, микрокредита, предоставлении отсрочки платежа по договору банковского займа, договору о предоставлении микрокредита»
    kaz: «Мерзімді әскери қызметке шақырылған әскери қызметшілер, сондай-ақ оларды қызметтен шығару, оларда банктік қарыздың, микрокредиттің болуы не болмауы, банктік қарыз шарты, микрокредит беру туралы шарт бойынша төлемді кейінге қалдырудың ұсынылуы туралы мәліметтерді алмасу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2024 жылғы 6 тамыздағы № 50 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/213669/rus

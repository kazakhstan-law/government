caused_by:
  code: '174356'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 ноября 2022 года № 107. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 ноября 2022 года № 30765. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 41 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 36 «Об утверждении Правил выдачи разрешения на открытие банка, филиала банка-нерезидента Республики Казахстан и оснований отказа в выдаче разрешения на открытие банка, Правил лицензирования банков, филиалов банков-нерезидентов Республики Казахстан на проведение банковских и иных операций, предусмотренных банковским законодательством Республики Казахстан, лицензирования на проведение банковских и иных операций, осуществляемых исламскими банками, филиалами исламских банков-нерезидентов Республики Казахстан»
    kaz: «Банкті, Қазақстан Республикасы бейрезидент-банкінің филиалын ашуға рұқсат беру қағидалары мен банкті ашуға рұқсат беруден бас тарту негіздерін, Банктерді, Қазақстан Республикасы бейрезидент-банктерінің филиалдарын банк операцияларын және Қазақстан Республикасының банк заңнамасында көзделген өзге де операцияларды жүргізуге лицензиялау, ислам банктері, Қазақстан Республикасы бейрезидент-ислам банктерінің филиалдары жүзеге асыратын банк операцияларын және өзге де операцияларды жүргізуді лицензиялау қағидаларын бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 30 наурыздағы № 36 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/174356/rus

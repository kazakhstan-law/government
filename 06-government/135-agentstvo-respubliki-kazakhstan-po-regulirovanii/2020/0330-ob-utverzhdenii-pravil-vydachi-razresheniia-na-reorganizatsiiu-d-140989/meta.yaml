requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 39. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2020 года № 20238. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 мая 2023 года № 31 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на реорганизацию добровольного накопительного пенсионного фонда и передачи пенсионных активов и обязательств присоединяемого добровольного накопительного пенсионного фонда по договорам о пенсионном обеспечении за счет добровольных пенсионных взносов в реорганизованный добровольный накопительный пенсионный фонд
  kaz: Ерікті жинақтаушы зейнетақы қорын қайта ұйымдастыруға рұқсат беру және қосылатын ерікті жинақтаушы зейнетақы қорының ерікті зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы шарттар бойынша зейнетақы активтері мен міндеттемелерін қайта ұйымдастырылған ерікті жинақтаушы зейнетақы қорына беру қағидаларын бекіту туралы

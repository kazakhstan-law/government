act_code: '143229'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 мая 2020 года № 59. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 мая 2020 года № 20736
title:
  rus: Об утверждении Правил и особенностей участия страхователя в инвестициях или прибыли страховщика, Требований к содержанию договора страхования, предусматривающего условие участия страхователя в инвестициях или прибыли страховщика, Условий и Правил передачи страховой организацией активов, сформированных за счет части страховых премий (страховых взносов), полученных от страхователей для целей инвестирования, и доходов (расходов), полученных (понесенных) от их инвестирования, по договорам страхования, предусматривающим условие участия страхователя в инвестициях, в инвестиционное управление управляющему инвестиционным портфелем, не являющемуся страховой организацией, Правил и особенностей заключения филиалом страховой организации-нерезидента Республики Казахстан договора страхования, предусматривающего условие участия страхователя в инвестициях или прибыли страховщика, условий и правил передачи филиалом страховой организации-нерезидента Республики Казахстан активов, сформированных за счет части страховых премий (страховых взносов), полученных от страхователей для целей инвестирования, и доходов (расходов), полученных (понесенных) от их инвестирования, в инвестиционное управление страховой организации-нерезиденту Республики Казахстан, имеющей лицензию на осуществление деятельности по управлению инвестиционным портфелем на рынке ценных бумаг государства, резидентом которого является страховая организация-нерезидент Республики Казахстан, Особенностей распределения активов, сформированных за счет части страховых премий (страховых взносов), полученных от страхователей для целей инвестирования, и доходов (расходов), полученных (понесенных) от их инвестирования, по договорам страхования, предусматривающим условие участия страхователя в инвестициях, между страхователями, включая случаи добровольной, принудительной ликвидации или добровольной реорганизации страховой организации в юридическое лицо, не осуществляющее страховую деятельность, а также Правил, условий и методики определения стоимости активов, сформированных за счет части страховых премий (страховых взносов), полученных от страхователей для целей инвестирования, и доходов (расходов), полученных (понесенных) от их инвестирования, по договорам страхования, предусматривающим условие участия страхователя в инвестициях
  kaz: Сақтанушының инвестицияларға немесе сақтандырушының пайдасына қатысу қағидалары мен ерекшеліктерін, Сақтанушының инвестицияларға немесе сақтандырушының пайдасына қатысу талабы көзделетін сақтандыру шартының мазмұнына қойылатын талаптарды, Сақтандыру ұйымының инвестициялау мақсаттары үшін сақтанушылардан алынған сақтандыру сыйлықақыларының (сақтандыру жарналарының) бір бөлігі және оларды инвестициялаудан алынған (жұмсалған) кірістер (шығыстар) есебінен қалыптастырылған активтерді сақтанушының инвестицияларға қатысу талабын көздейтін сақтандыру шарттары бойынша сақтандыру ұйымы болып табылмайтын инвестициялық портфельді басқарушыға инвестициялық басқаруға беру шарттары мен қағидаларын, Қазақстан Республикасының бейрезидент-сақтандыру ұйымы филиалының сақтанушының инвестицияларға немесе сақтандырушының пайдасына қатысу талабы көзделетін сақтандыру шартын жасау қағидалары мен ерекшеліктерін, Қазақстан Республикасының бейрезидент-сақтандыру ұйымы филиалының инвестициялау мақсаттары үшін сақтанушылардан алынған сақтандыру сыйлықақыларының (сақтандыру жарналарының) бір бөлігі және оларды инвестициялаудан алынған (жұмсалған) кірістер (шығыстар) есебінен қалыптастырылған активтерді Қазақстан Республикасының бейрезидент-сақтандыру ұйымы резиденті болып табылатын мемлекеттің бағалы қағаздар нарығында инвестициялық портфельді басқару қызметін жүзеге асыруға лицензиясы бар Қазақстан Республикасының бейрезидент-сақтандыру ұйымына инвестициялық басқаруға беру шарттары мен қағидаларын, сондай-ақ Сақтандыру ұйымын ерікті, мәжбүрлеп тарату немесе ерікті түрде сақтандыру қызметін жүзеге асырмайтын заңды тұлғаға қайта ұйымдастыру жағдайларын қоса алғанда, сақтанушылардан инвестициялау мақсаттары үшін алынған сақтандыру сыйлықақыларының (сақтандыру жарналарының) және оларды инвестициялаудан алынған (жұмсалған) кірістердің (шығыстардың) бір бөлігі есебінен қалыптастырылған активтерді сақтанушының инвестицияларға қатысу талабын көздейтін сақтандыру шарттары бойынша сақтанушылар арасында бөлу ерекшеліктерін, Сақтанушылардан инвестициялау мақсаттары үшін алынған сақтандыру сыйлықақыларының (сақтандыру жарналарының) және оларды инвестициялаудан алынған (жұмсалған) кірістердің (шығыстардың) бір бөлігі есебінен қалыптастырылған активтердің құнын сақтанушының инвестицияларға қатысу талабын көздейтін сақтандыру шарттары бойынша айқындау қағидаларын, талаптары мен әдістемесін бекіту туралы

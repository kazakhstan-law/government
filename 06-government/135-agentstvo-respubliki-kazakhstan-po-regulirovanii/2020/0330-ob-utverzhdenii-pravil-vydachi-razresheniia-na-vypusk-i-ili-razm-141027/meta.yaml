act_code: '141027'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 37. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 апреля 2020 года № 20252. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 августа 2022 года № 58 (вводится в действие по истечении десяти календарных дней после дня его официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на выпуск и (или) размещение эмиссионных ценных бумаг организации-резидента Республики Казахстан на территории иностранного государства, уведомления о выпуске депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги организаций-резидентов Республики Казахстан, а также представления отчета об итогах их размещения
  kaz: Қазақстан Республикасының резидент ұйымына шет мемлекеттің аумағында эмиссиялық бағалы қағаздар шығаруға және (немесе) орналастыруға рұқсат беру, базалық активі Қазақстан Республикасының резидент ұйымдарының эмиссиялық бағалы қағаздары болып табылатын, депозитарлық қолхаттарды немесе өзге де бағалы қағаздарды шығару туралы хабардар ету, сондай-ақ оларды орналастырудың қорытындылары туралы есепті ұсыну қағидаларын бекіту туралы

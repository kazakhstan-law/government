title:
  rus: Об утверждении форм и сроков представления временной администрацией (временным администратором) банка, страховой (перестраховочной) организации отчетности и иной информации, а также Правил их представления
  kaz: Банктің, сақтандыру (қайта сақтандыру) ұйымының уақытша әкімшілігінің (уақытша әкімшісінің) есептілікті және өзге ақпаратты ұсыну нысандары мен мерзімдерін, сондай-ақ Оларды ұсыну қағидаларын бекіту туралы

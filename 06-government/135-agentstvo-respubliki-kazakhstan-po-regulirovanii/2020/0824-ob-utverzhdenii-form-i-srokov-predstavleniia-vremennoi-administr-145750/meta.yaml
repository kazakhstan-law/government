  title:
    rus: Об утверждении Правил назначения и деятельности временной администрации по управлению банком, а также назначаемой после лишения банка банковской лицензии на осуществление всех видов операций, назначения и полномочий временной администрации (временного администратора) страховой (перестраховочной) организации, Правил представления временной администрацией по управлению банком, а также назначаемой после лишения банка банковской лицензии на осуществление всех видов операций, временной администрацией (временным администратором) страховой (перестраховочной) организации отчетности и иной информации, перечня, форм и сроков представления временной администрацией по управлению банком, а также назначаемой после лишения банка банковской лицензии на осуществление всех видов операций, временной администрацией (временным администратором) страховой (перестраховочной) организации отчетности и иной информации
    kaz: Банкті басқару жөніндегі, сондай-ақ банк операциялардың барлық түрін жүзеге асыруға арналған банк лицензиясынан айырылғаннан кейін тағайындалатын уақытша әкімшілікті тағайындау және оның қызметі, сақтандыру (қайта сақтандыру) ұйымының уақытша әкімшілігін (уақытша әкімшісін) тағайындау және өкілеттіктері қағидаларын, Банкті басқару жөніндегі, сондай-ақ банк операциялардың барлық түрін жүзеге асыруға арналған банк лицензиясынан айырылғаннан кейін тағайындалатын уақытша әкімшіліктің, сақтандыру (қайта сақтандыру) ұйымының уақытша әкімшілігінің (уақытша әкімшісінің) есептілік және өзге де ақпарат, банкті басқару жөніндегі, сондай-ақ банк операциялардың барлық түрін жүзеге асыруға арналған банк лицензиясынан айырылғаннан кейін тағайындалатын уақытша әкімшіліктің, сақтандыру (қайта сақтандыру) ұйымының уақытша әкімшілігінің (уақытша әкімшісінің) есептілік және өзге де ақпарат ұсыну тізбесі, нысандары мен мерзімдерін ұсыну қағидаларын бекіту туралы

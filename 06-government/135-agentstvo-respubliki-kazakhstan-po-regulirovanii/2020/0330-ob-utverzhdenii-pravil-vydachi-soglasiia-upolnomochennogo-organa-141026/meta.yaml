act_code: '141026'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 43. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 апреля 2020 года № 20248. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи согласия уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций на назначение (избрание) руководящего работника страховой (перестраховочной) организации, филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, страхового холдинга, страхового брокера, филиала страхового брокера-нерезидента Республики Казахстан и акционерного общества «Фонд гарантирования страховых выплат», включая критерии отсутствия безупречной деловой репутации, документов, необходимых для получения согласия
  kaz: Мінсіз іскерлік беделдің болмау өлшемшарттарын, келісім алу үшін қажетті құжаттарды қоса алғанда, сақтандыру (қайта сақтандыру) ұйымының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының, сақтандыру холдингінің, сақтандыру брокерінің, Қазақстан Республикасының бейрезидент-сақтандыру брокері филиалының және «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының басшы қызметкерін тағайындауға (сайлауға) қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органның келісім беру қағидаларын бекіту туралы

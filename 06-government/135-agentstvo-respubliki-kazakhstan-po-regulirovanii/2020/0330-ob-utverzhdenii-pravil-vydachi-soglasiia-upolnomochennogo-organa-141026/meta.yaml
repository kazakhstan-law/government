  code: '168646'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 мая 2022 года № 41. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 июня 2022 года № 28407
  title:
    rus: О внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 43 «Об утверждении Правил выдачи согласия на назначение (избрание) руководящих работников финансовых организаций, филиалов банков-нерезидентов Республики Казахстан, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалов страховых брокеров-нерезидентов Республики Казахстан, банковских, страховых холдингов, акционерного общества «Фонд гарантирования страховых выплат», включая требования, предъявляемые к руководящим работникам филиалов банков-нерезидентов Республики Казахстан, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалов страховых брокеров-нерезидентов Республики Казахстан, критерии отсутствия безупречной деловой репутации и перечень документов, необходимых для получения согласия»
    kaz: «Қазақстан Республикасының бейрезидент-банктері филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру брокерлері филиалдарының басшы қызметкерлеріне қойылатын талаптарды, мінсіз іскерлік беделінің болмауы өлшемшарттарын қоса алғанда, қаржы ұйымдарының, Қазақстан Республикасының бейрезидент-банктері филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру брокерлері филиалдарының, банк, сақтандыру холдингтерінің, «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының басшы қызметкерлерін тағайындауға (сайлауға) келісім беру қағидаларын және келісім алу үшін қажетті құжаттар тізбесін бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 30 наурыздағы № 43 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/168646/rus

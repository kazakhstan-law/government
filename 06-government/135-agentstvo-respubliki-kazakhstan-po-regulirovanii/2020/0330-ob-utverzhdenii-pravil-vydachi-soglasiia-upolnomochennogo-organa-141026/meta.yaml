  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 17 сентября 2020 года № 79. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 сентября 2020 года № 21228
  title:
    rus: О внесении дополнения в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 43 «Об утверждении Правил выдачи согласия на назначение (избрание) руководящих работников финансовых организаций, банковских, страховых холдингов, акционерного общества «Фонд гарантирования страховых выплат», включая критерии отсутствия безупречной деловой репутации, и перечня документов, необходимых для получения согласия»
    kaz: «Мінсіз іскерлік беделінің болмауы өлшемшарттарын қоса алғанда, қаржы ұйымдарының, банк, сақтандыру холдингтерінің, «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының басшы қызметкерлерін тағайындауға (сайлауға) келісім беру қағидаларын және келісім алу үшін қажетті құжаттар тізбесін бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 30 наурыздағы № 43 қаулысына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/146463/rus

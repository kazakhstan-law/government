  code: '165170'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2022 года № 15. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 февраля 2022 года № 26966
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 октября 2020 года № 97 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для страховых (перестраховочных) организаций, страховых брокеров, обществ взаимного страхования, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и филиалов страховых брокеров-нерезидентов Республики Казахстан»
    kaz: «Қылмыстық жолмен алынған кiрiстердi заңдастыруға (жылыстатуға) және терроризмдi қаржыландыруға қарсы iс-қимыл жасау мақсатында сақтандыру (қайта сақтандыру) ұйымдары, сақтандыру брокерлері, өзара сақтандыру қоғамдары, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдарының филиалдары және Қазақстан Республикасының бейрезидент-сақтандыру брокерлерінің филиалдары үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 12 қазандағы № 97 қаулысына өзгерістер мен толықтырулар енгізу туралы

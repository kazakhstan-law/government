  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования финансового рынка и противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения на финансовом рынке
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығын реттеу және қаржы нарығында қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл мәселелері бойынша өзгерістер енгізу туралы

act_code: '147373'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 октября 2020 года № 97. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 октября 2020 года № 21425
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для страховых (перестраховочных) организаций, страховых брокеров, обществ взаимного страхования, Экспортно-кредитного агентства Казахстана, филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан и филиалов страховых брокеров-нерезидентов Республики Казахстан
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл мақсатында сақтандыру (қайта сақтандыру) ұйымдары, сақтандыру брокерлері, өзара сақтандыру қоғамдары, Қазақстанның экспорттық-кредиттік агенттігі, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдарының филиалдары және Қазақстан Республикасының бейрезидент-сақтандыру брокерлерінің филиалдары үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

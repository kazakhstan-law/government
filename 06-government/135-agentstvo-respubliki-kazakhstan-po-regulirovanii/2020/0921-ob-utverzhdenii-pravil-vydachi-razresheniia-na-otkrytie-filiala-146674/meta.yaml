requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 21 сентября 2020 года № 87. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 сентября 2020 года № 21270. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 февраля 2021 года № 24 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на открытие филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, а также Правил и условий осуществления деятельности филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан
  kaz: Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымының филиалын ашуға рұқсат беру қағидаларын, сондай-ақ Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының қызметті жүзеге асыру қағидаларын және шарттарын бекіту туралы

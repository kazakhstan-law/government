  code: '165166'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2022 года № 18. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 февраля 2022 года № 26965
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 октября 2020 года № 96 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для профессиональных участников рынка ценных бумаг и центрального депозитария»
    kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына бағалы қағаздар нарығының кәсіби қатысушылары және орталық депозитарий үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 12 қазандағы № 96 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/165166/rus

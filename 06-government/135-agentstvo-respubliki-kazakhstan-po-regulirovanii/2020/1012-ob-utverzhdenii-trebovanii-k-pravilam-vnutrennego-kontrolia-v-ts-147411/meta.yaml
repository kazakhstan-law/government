act_code: '147411'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 октября 2020 года № 96. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 октября 2020 года № 21433
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для профессиональных участников рынка ценных бумаг и центрального депозитария
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына бағалы қағаздар нарығының кәсіби қатысушылары және орталық депозитарий үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

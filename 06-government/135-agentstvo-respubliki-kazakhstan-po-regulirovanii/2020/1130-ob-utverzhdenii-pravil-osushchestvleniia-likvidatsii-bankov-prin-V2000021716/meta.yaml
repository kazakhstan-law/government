  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 июня 2025 года № 23. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 июня 2025 года № 36352. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 10 апреля 2026 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 ноября 2020 года № 114 «Об утверждении Правил осуществления ликвидации банков, принудительного прекращения деятельности филиалов банков-нерезидентов Республики Казахстан и требований к работе ликвидационных комиссий принудительно ликвидируемых банков, принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан»
    kaz: «Банктерді таратуды жүзеге асыру, Қазақстан Республикасының бейрезидент-банктері филиалдарының қызметін мәжбүрлеп тоқтату қағидаларын және қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент-банктері филиалдарының, мәжбүрлеп таратылатын банктердің тарату комиссияларының жұмысына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 30 қарашадағы № 114 қаулысына өзгерістер енгізу туралы

requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 октября 2020 года № 95. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 октября 2020 года № 21434
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для единого накопительного пенсионного фонда и добровольных накопительных пенсионных фондов
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және бірыңғай жинақтаушы зейнетақы қоры және ерікті жинақтаушы зейнетақы қорлары үшін жаппай қырып-жою қаруының таралуын қаржыландыруға қарсы іс-қимыл мақсатында ішкі бақылау қағидаларына қойылатын талаптар

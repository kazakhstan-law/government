requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 19 октября 2020 года № 99. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 октября 2020 года № 21519. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 21 февраля 2022 года № 4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

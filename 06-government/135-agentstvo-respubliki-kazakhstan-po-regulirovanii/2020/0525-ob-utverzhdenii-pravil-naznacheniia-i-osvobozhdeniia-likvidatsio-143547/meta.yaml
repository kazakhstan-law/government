  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 мая 2020 года № 57 «Об утверждении Правил назначения и освобождения ликвидационных комиссий принудительно ликвидируемых банков, страховых (перестраховочных) организаций и Требований, предъявляемых к председателю и членам ликвидационной комиссии принудительно ликвидируемых банка, страховой (перестраховочной) организации»
    kaz: «Мәжбүрлеп таратылатын банктердiң, сақтандыру (қайта сақтандыру) ұйымдарының тарату комиссияларын тағайындау және босату қағидаларын және Мәжбүрлеп таратылатын банктiң, сақтандыру (қайта сақтандыру) ұйымының тарату комиссиясының төрағасына және мүшелерiне қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 20 мамырдағы № 57 қаулысына өзгерістер енгізу туралы

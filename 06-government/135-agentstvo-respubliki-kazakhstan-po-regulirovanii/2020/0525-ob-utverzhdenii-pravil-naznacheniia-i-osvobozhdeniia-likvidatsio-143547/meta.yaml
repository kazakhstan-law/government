  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 мая 2020 года № 57 «Об утверждении Правил назначения и освобождения ликвидационных комиссий принудительно ликвидируемых банков, страховых (перестраховочных) организаций, принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан и Требований, предъявляемых к председателю и членам ликвидационной комиссии принудительно ликвидируемых банка, страховой (перестраховочной) организации, принудительно прекращающего деятельность филиала банка-нерезидента Республики Казахстан»
    kaz: «Мәжбүрлеп таратылатын банктердiң, сақтандыру (қайта сақтандыру) ұйымдарының, қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент-банктері филиалдарының тарату комиссияларын тағайындау және босату қағидаларын және Мәжбүрлеп таратылатын банктiң, сақтандыру (қайта сақтандыру) ұйымының, қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент-банкі филиалының тарату комиссиясының төрағасына және мүшелерiне қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 25 мамырдағы № 57 қаулысына өзгерістер енгізу туралы

act_code: '148130'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 октября 2020 года № 105. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 ноября 2020 года № 21577
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для организаций, осуществляющих отдельные виды банковских операций, за исключением оператора или операционного центра межбанковской системы переводов денег, а также юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и организаций, осуществляющих микрофинансовую деятельность
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына банкаралық ақша аудару жүйесінің операторын немесе операциялық орталығын қоспағанда, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар, сондай-ақ банкноттарды, монеталарды және құндылықтарды инкассациялау айрықша қызметі болып табылатын заңды тұлғалар және микроқаржылық қызметті жүзеге асыратын ұйымдар үшін қойылатын талаптарды бекіту туралы

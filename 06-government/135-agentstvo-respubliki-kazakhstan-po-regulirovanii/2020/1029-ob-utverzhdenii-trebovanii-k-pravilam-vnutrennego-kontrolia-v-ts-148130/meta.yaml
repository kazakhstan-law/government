  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2022 года № 16. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 февраля 2022 года № 26969
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 октября 2020 года № 105 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для организаций, осуществляющих отдельные виды банковских операций, за исключением оператора или операционного центра межбанковской системы переводов денег, и организаций, осуществляющих микрофинансовую деятельность»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына банкаралық ақша аудару жүйесінің операторын немесе операциялық орталығын қоспағанда, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар және микроқаржылық қызметі жүзеге асыратын ұйымдар үшін қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 29 қазандағы № 105 қаулысына өзгерістер мен толықтырулар енгізу туралы

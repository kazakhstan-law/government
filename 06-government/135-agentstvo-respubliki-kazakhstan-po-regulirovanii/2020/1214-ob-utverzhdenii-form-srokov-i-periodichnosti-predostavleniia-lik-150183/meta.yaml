  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 февраля 2025 года № 7. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 февраля 2025 года № 35759. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 1 апреля 2026 года № 47 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 14 декабря 2020 года № 116 «Об утверждении формы, сроков и периодичности предоставления ликвидационными комиссиями отчетов и дополнительной информации добровольно и принудительно ликвидируемых банков, добровольно и принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан»
    kaz: «Ерікті түрде және мәжбүрлеп таратылатын банктердің, қызметі ерікті түрде және мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент-банктері филиалдарының тарату комиссияларының есеп және қосымша ақпарат беру нысанын, мерзімдері мен кезеңділігін бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 14 желтоқсандағы № 116 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам добровольно и принудительно ликвидируемых банков, добровольно и принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне ерікті және мәжбүрлеп таратылатын банктердің, Қазақстан Республикасы бейрезидент-банктерінің қызметін ерікті және мәжбүрлеп тарататын филиалдарының мәселелері бойынша өзгерістер енгізу туралы

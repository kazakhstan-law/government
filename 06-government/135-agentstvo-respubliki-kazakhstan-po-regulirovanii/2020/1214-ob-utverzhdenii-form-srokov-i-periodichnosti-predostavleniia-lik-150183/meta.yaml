  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 14 декабря 2020 года № 116 «Об утверждении формы, сроков и периодичности предоставления ликвидационными комиссиями отчетов и дополнительной информации добровольно и принудительно ликвидируемых банков»
    kaz: «Ерікті және мәжбүрлеп таратылатын банктердің тарату комиссияларының есеп және қосымша ақпарат беру нысанын, мерзімдері мен кезеңділігін бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 14 желтоқсандағы № 116 қаулысына өзгерістер мен толықтырулар енгізу туралы

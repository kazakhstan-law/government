act_code: '150183'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 14 декабря 2020 года № 116. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 декабря 2020 года № 21834. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 1 апреля 2026 года № 47 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм, сроков и периодичности предоставления ликвидационными комиссиями добровольно и принудительно ликвидируемых банков, добровольно и принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан отчетов и дополнительной информации
  kaz: Ерікті түрде және мәжбүрлеп таратылатын банктердің, қызметі ерікті түрде және мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент-банктері филиалдарының тарату комиссияларының есептер және қосымша ақпарат беру нысандарын, мерзімдері мен кезеңділігін бекіту туралы

  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма на финансовом рынке
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығындағы қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

title:
  rus: Об утверждении Правил лицензирования микрофинансовой деятельности, Квалификационных требований на осуществление микрофинансовой деятельности и перечня документов, подтверждающих соответствие им
  kaz: Микроқаржылық қызметті лицензиялау қағидаларын, микроқаржылық қызметті жүзеге асыруға арналған біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы

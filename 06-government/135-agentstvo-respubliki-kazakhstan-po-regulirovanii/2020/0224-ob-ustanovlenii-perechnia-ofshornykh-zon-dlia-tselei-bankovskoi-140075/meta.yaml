caused_by:
  code: '195103'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 марта 2024 года № 18. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2024 года № 34208
  title:
    rus: О внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2020 года № 8 «Об установлении Перечня офшорных зон для целей банковской и страховой деятельности, деятельности профессиональных участников рынка ценных бумаг и иных лицензируемых видов деятельности на рынке ценных бумаг, деятельности акционерных инвестиционных фондов и деятельности организаций, осуществляющих микрофинансовую деятельность»
    kaz: «Банктік және сақтандыру қызметінің, бағалы қағаздар рыногының кәсіби қатысушылары қызметінің және бағалы қағаздар рыногында лицензияланатын басқа да қызмет түрлерінің, акционерлік инвестициялық қорлар және микроқаржылық қызметті жүзеге асыратын ұйымдар қызметінің мақсаттары үшін офшорлық аймақтардың тізбесін белгілеу туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 24 ақпандағы № 8 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/195103/rus

act_code: '146597'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 21 сентября 2020 года № 88. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 сентября 2020 года № 21245. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 февраля 2021 года № 24 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на открытие филиала страхового брокера-нерезидента Республики Казахстан и Правил осуществления деятельности филиала страхового брокера-нерезидента Республики Казахстан
  kaz: Қазақстан Республикасы бейрезидент-сақтандыру брокерінің филиалын ашуға рұқсат беру қағидаларын және Қазақстан Республикасының бейрезидент-сақтандыру брокері филиалының қызметін жүзеге асыру қағидаларын бекіту туралы

requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 36. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2020 года № 20228. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 41 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на открытие банка, филиала банка-нерезидента Республики Казахстан, Правил лицензирования банков, филиалов банков-нерезидентов Республики Казахстан на проведение банковских и иных операций, предусмотренных банковским законодательством Республики Казахстан, лицензирования на проведение банковских и иных операций, осуществляемых исламскими банками, филиалами исламских банков-нерезидентов Республики Казахстан
  kaz: Банкті, Қазақстан Республикасы бейрезидент-банкінің филиалын ашуға рұқсат беру қағидаларын, Банктерді, Қазақстан Республикасы бейрезидент-банктерінің филиалдарын банк операцияларын және Қазақстан Республикасының банк заңнамасында көзделген өзге де операцияларды жүргізуге лицензиялау, ислам банктері, Қазақстан Республикасы бейрезидент-ислам банктерінің филиалдары жүзеге асыратын банк операцияларын және өзге де операцияларды жүргізуді лицензиялау қағидаларын бекіту туралы

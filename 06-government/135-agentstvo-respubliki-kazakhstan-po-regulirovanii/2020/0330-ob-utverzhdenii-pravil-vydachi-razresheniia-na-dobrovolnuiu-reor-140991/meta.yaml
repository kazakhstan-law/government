  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 июля 2021 года № 80. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 июля 2021 года № 23634. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 49 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 31 «Об утверждении Правил выдачи разрешения на добровольную реорганизацию банка (банковского холдинга) либо отказа в выдаче разрешения, выдачи разрешения на конвертацию банка в исламский банк и отказа в выдаче разрешения, выдачи разрешения на добровольную ликвидацию банков, а также возврата депозитов физических лиц, их перевода в другой банк»
    kaz: «Банкті (банк холдингін) ерікті түрде қайта ұйымдастыруға рұқсат беру не рұқсат беруден бас тарту, банкті ислам банкіне айналдыруға рұқсат беру және рұқсат беруден бас тарту, банктерді ерікті түрде таратуға рұқсат беру, сондай-ақ жеке тұлғалардың депозиттерін қайтару, оларды басқа банкке аудару қағидаларын бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 30 наурыздағы № 31 қаулысына өзгерістер енгізу туралы

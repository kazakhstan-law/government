act_code: '149244'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 ноября 2020 года № 114. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 декабря 2020 года № 21716. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 10 апреля 2026 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления ликвидации банков, принудительного прекращения деятельности филиалов банков-нерезидентов Республики Казахстан и требований к работе ликвидационных комиссий принудительно ликвидируемых банков, принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан
  kaz: Банктерді таратуды жүзеге асыру, Қазақстан Республикасының бейрезидент-банктері филиалдарының қызметін мәжбүрлеп тоқтату қағидаларын және қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент-банктері филиалдарының, мәжбүрлеп таратылатын банктердің тарату комиссияларының жұмысына қойылатын талаптарды бекіту туралы

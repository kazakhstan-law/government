  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2021 года № 39. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 февраля 2021 года № 22269. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 10 апреля 2026 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 ноября 2020 года № 114 «Об утверждении Правил осуществления ликвидации и требований к работе ликвидационных комиссий принудительно ликвидируемых банков»
    kaz: «Мәжбүрлеп таратылатын банктерді таратуды жүзеге асыру қағидаларын және олардың тарату комиссияларының жұмысына қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 30 қарашадағы № 114 қаулысына өзгерістер мен толықтыру енгізу туралы

  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам оказания государственных услуг в сфере государственного регулирования, контроля и надзора финансового рынка и финансовых организаций
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы нарығын және қаржы ұйымдарын мемлекеттік реттеу, бақылау және қадағалау саласында мемлекеттік қызметтер көрсету мәселелері бойынша өзгерістер енгізу туралы

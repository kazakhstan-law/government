act_code: '140990'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 32. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 марта 2020 года № 20239
title:
  rus: Об утверждении Правил выдачи разрешения на право осуществления деятельности кредитного бюро и акта о соответствии кредитного бюро требованиям, предъявляемым к кредитному бюро по защите и обеспечению сохранности базы данных кредитных историй, используемых информационных систем и помещений
  kaz: Кредиттік бюро қызметін жүзеге асыру құқығына рұқсат және кредиттік тарихтардың деректер базасын, пайдаланылатын ақпараттық жүйелерді қорғау және олардың сақталуын қамтамасыз ету жөніндегі кредиттік бюроға және үй-жайларға қойылатын талаптарға кредиттік бюроның сәйкестігі туралы актіні беру қағидаларын бекіту туралы

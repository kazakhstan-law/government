    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне мемлекеттік қызметтер көрсету саласындағы қаржы ұйымдарының қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу және кейбір нормативтік құқықтық актілердің күші жойылды деп тану туралы

act_code: '147371'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 октября 2020 года № 98. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 октября 2020 года № 21424
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для фондовой биржи и организаций, осуществляющих клиринговую деятельность по сделкам с финансовыми инструментами
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қор биржасы және қаржы құралдармен мәмілелер бойынша клирингтік қызметті жүзеге асыратын ұйымдар үшін қойылатын талаптарды бекіту туралы

repealed_by:
  code: '152506'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 января 2021 года № 4. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 января 2021 года № 22133. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 41 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 36 «Об утверждении Правил выдачи и оснований отказа в выдаче разрешения на открытие банка, Правил лицензирования банковских операций, а также иных операций и деятельности на рынке ценных бумаг, осуществляемых банками»
    kaz: «Банк ашуға рұқсат беру қағидалары мен оған рұқсат беруден бас тарту негіздерін, Банк операцияларын, сондай-ақ банктердің жүзеге асыратын өзге де операцияларын және бағалы қағаздар нарығындағы қызметті лицензиялау қағидаларын бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 30 наурыздағы № 36 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/152506/rus

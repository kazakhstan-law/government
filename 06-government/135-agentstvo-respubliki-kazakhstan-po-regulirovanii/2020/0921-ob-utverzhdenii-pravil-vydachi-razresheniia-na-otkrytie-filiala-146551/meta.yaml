act_code: '146551'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 21 сентября 2020 года № 86. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 сентября 2020 года № 21243. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 января 2021 года № 490 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на открытие филиала банка-нерезидента Республики Казахстан, а также Правил и условий осуществления деятельности филиалом банка-нерезидента Республики Казахстан
  kaz: Қазақстан Республикасы бейрезидент-банкінің филиалын ашуға рұқсат беру қағидаларын, сондай-ақ Қазақстан Республикасы бейрезидент-банкі филиалының қызметті жүзеге асыру қағидаларын және шарттарын бекіту туралы

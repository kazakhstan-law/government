caused_by:
  code: '165164'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2022 года № 13. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 февраля 2022 года № 26962
  title:
    rus: О внесении изменений и дополнений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 марта 2020 года № 18 «Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для банков второго уровня, филиалов банков-нерезидентов Республики Казахстан и Национального оператора почты»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында екінші деңгейдегі банктер, Қазақстан Республикасы бейрезидент-банктерінің филиалдары мен Ұлттық пошта операторы үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 22 наурыздағы № 18 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/165164/rus

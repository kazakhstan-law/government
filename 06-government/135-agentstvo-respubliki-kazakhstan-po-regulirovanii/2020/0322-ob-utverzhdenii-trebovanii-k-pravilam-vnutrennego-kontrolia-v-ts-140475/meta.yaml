  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования деятельности субъектов финансового мониторинга
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы мониторингі субъектілерінің қызметін реттеу мәселелері бойынша өзгерістер енгізу туралы

act_code: '140475'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 марта 2020 года № 18. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 марта 2020 года № 20160
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для банков второго уровня, филиалов банков-нерезидентов Республики Казахстан и Национального оператора почты
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында екінші деңгейдегі банктер, Қазақстан Республикасы бейрезидент-банктерінің филиалдары мен Ұлттық пошта операторы үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 сентября 2026 года № 126. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 сентября 2026 года № 39846
  title:
    rus: О внесении изменений в некоторые постановления Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка по вопросам регулирования финансового рынка и противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения на финансовом рынке
    kaz: Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігінің кейбір қаулыларына қаржы нарығын реттеу және қаржы нарығында қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл мәселелері бойынша өзгерістер енгізу туралы

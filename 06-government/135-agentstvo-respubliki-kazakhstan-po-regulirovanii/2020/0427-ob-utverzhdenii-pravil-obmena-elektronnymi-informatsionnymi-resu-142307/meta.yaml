  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 апреля 2020 года № 50 «Об утверждении Правил обмена электронными информационными ресурсами между страхователем (застрахованным, выгодоприобретателем) и страховщиком, Правил уведомления о заключении договора страхования и требований к содержанию уведомления, Требований к программно-техническим средствам и интернет-ресурсам страховой (перестраховочной) организации, филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, обеспечивающим заключение договоров страхования, обмен электронными информационными ресурсами между страхователем и страховщиком»
    kaz: «Сақтанушы (сақтандырылушы, пайда алушы) мен сақтандырушы арасында электрондық ақпараттық ресурстармен алмасу қағидаларын, Сақтандыру шартын жасасу туралы хабардар ету қағидаларын және хабарламаның мазмұнына қойылатын талаптарды, Сақтандыру (қайта сақтандыру) ұйымының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының сақтандыру шарттарын жасасуды, сақтанушы мен сақтандырушы арасында электрондық ақпараттық ресурстармен алмасуды қамтамасыз ететін бағдарламалық-техникалық құралдары мен интернет-ресурстарына қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 27 сәуірдегі № 50 қаулысына өзгерістер енгізу туралы

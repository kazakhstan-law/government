act_code: '142307'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 апреля 2020 года № 50. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 апреля 2020 года № 20514
title:
  rus: Об утверждении Правил обмена электронными информационными ресурсами между организацией по формированию и ведению базы данных и страховщиком, страховщиком и страхователем (застрахованным, выгодоприобретателем), Правил направления организацией по формированию и ведению базы данных уведомления о заключении договора страхования и урегулировании страховых случаев, Требований к программно-техническим средствам и интернет-ресурсам страховой (перестраховочной) организации, филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, обеспечивающим заключение договоров страхования, обмен электронными информационными ресурсами между страхователем и страховщиком
  kaz: Дерекқорды қалыптастыру және жүргізу жөніндегі ұйым мен сақтандырушы, сақтандырушы мен сақтанушы (сақтандырылушы, пайда алушы) арасында электрондық ақпараттық ресурстармен алмасу қағидаларын, Дерекқорды қалыптастыру және жүргізу жөніндегі ұйымның сақтандыру шартын жасасу және сақтандыру жағдайларын реттеу туралы хабардар ету қағидаларын, Сақтандыру (қайта сақтандыру) ұйымының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының сақтандыру шарттарын жасасуды, сақтанушы мен сақтандырушы арасында электрондық ақпараттық ресурстармен алмасуды қамтамасыз ететін бағдарламалық-техникалық құралдары мен интернет-ресурстарына қойылатын талаптарды бекіту туралы

  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 4 августа 2021 года № 87. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 августа 2021 года № 23881
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 44 «Об утверждении Правил выдачи разрешения на добровольную ликвидацию страховых (перестраховочных) организаций либо отказа в выдаче указанного разрешения»
    kaz: «Сақтандыру (қайта сақтандыру) ұйымдарының өз еркiмен таратылуына рұқсат беру не аталған рұқсатты беруден бас тарту қағидаларын бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 30 наурыздағы № 44 қаулысына өзгерістер енгізу туралы

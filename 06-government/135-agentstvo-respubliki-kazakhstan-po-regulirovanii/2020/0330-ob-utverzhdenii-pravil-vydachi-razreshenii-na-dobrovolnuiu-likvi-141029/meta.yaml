  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам оказания государственных услуг на страховом рынке
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру нарығында мемлекеттік қызметтер көрсету мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

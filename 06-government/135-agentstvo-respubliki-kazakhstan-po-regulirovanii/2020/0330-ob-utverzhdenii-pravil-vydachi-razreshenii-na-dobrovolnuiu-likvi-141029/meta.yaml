act_code: '141029'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 44. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 апреля 2020 года № 20254
title:
  rus: Об утверждении Правил выдачи разрешений на добровольную ликвидацию страховых (перестраховочных) организаций, добровольное прекращение деятельности филиалов страховых (перестраховочных) организаций-нерезидентов Республики Казахстан либо отказа в выдаче указанных разрешений
  kaz: Сақтандыру (қайта сақтандыру) ұйымдарының өз еркiмен таратылуына, Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының қызметін ерікті түрде тоқтатуға рұқсат беру не аталған рұқсатты беруден бас тарту қағидаларын бекіту туралы

    kaz: «Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігінің қызметшілерін лауазымға тағайындау және олармен еңбек шартын тоқтату қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2020 жылғы 3 ақпандағы №3 қаулысына өзгерістер мен толықтырулар енгізу туралы

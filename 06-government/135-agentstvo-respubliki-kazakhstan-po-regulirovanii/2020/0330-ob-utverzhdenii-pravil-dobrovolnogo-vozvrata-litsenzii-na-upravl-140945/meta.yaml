    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам оказания государственных услуг в сфере государственного регулирования деятельности на рынке ценных бумаг и деятельности добровольных накопительных пенсионных фондов
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне бағалы қағаздар нарығындағы қызметті және ерікті жинақтаушы зейнетақы қорларының қызметін мемлекеттік реттеу саласында мемлекеттік қызметтер көрсету мәселелері бойынша өзгерістер енгізу туралы

requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 марта 2020 года № 29. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 апреля 2020 года № 20281. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 августа 2025 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

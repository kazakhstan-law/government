act_code: '228592'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 августа 2026 года № 116. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 августа 2026 года № 39524
title:
  rus: Об утверждении Требований к управлению финансовыми продуктами, перечня финансовых продуктов (с указанием ставок и тарифов), об утверждении, изменении и прекращении предоставления которых субъект поведенческого надзора уведомляет уполномоченный орган по регулированию, контролю и надзору финансового рынка и финансовых организаций, правил такого уведомления, а также перечня документов и сведений, прилагаемых к уведомлению
  kaz: Қаржы өнімдерін басқаруға қойылатын талаптарды, іс-қимылды қадағалау субъектісі қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органды қаржы өнімдерін бекіту, өзгерту және ұсынуды тоқтату туралы хабардар ететін қаржы өнімдерінің тізбесін (мөлшерлемелері мен тарифтері көрсетіле отырып), осындай хабарлау қағидаларын, сондай-ақ хабарламаға қоса берілетін құжаттар мен мәліметтердің тізбесін бекіту туралы

act_code: '223615'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 16. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 марта 2026 года № 38208
title:
  rus: Об утверждении Правил продления сроков исполнения письменного предписания, примененного к кредитному бюро, коллекторскому агентству либо плана мероприятий по устранению выявленных нарушений и (или) причин, а также условий, способствовавших их совершению, в случае отсутствия возможности устранения нарушения в сроки, установленные в плане мероприятий либо письменном предписании, по причинам, не зависящим от кредитного бюро, коллекторского агентства
  kaz: Кредиттік бюроға, коллекторлық агенттікке байланысты емес себептер бойынша іс-шаралар жоспарында не жазбаша ұйғарымда белгіленген мерзімдерде бұзушылықтарды жою мүмкіндігі болмаған жағдайда, кредиттік бюроға, коллекторлық агенттікке қолданылған жазбаша ұйғарымды не анықталған бұзушылықтарды және (немесе) себептерді, сондай-ақ олардың жасалуына ықпал еткен жағдайларды жою бойынша іс-шаралар жоспарын орындау мерзімдерін ұзарту қағидаларын бекіту туралы

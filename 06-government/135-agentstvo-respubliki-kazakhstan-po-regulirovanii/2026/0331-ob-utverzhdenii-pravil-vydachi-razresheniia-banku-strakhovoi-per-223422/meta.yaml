act_code: '223422'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 31. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 апреля 2026 года № 38321
title:
  rus: Об утверждении Правил выдачи разрешения банку, страховой (перестраховочной) организации на создание или приобретение дочерней организации, на значительное участие в капитале организации, на создание или приобретение банком дочерней организации по управлению стрессовыми активами, отзыва и (или) отмены разрешения на создание, приобретение дочерней организации, значительное участие в капитале организаций
  kaz: Банкке, сақтандыру (қайта сақтандыру) ұйымына еншiлес ұйымды құруға немесе иеленуге, ұйымның капиталына елеулі қатысуына, банктің стрестік активтерді басқару жөніндегі еншілес ұйымды құруға немесе иеленуге рұқсат беру, еншілес ұйымды құруға, иеленуге, ұйымның капиталына елеулі қатысуға берілген рұқсатты кері қайтарып алу және (немесе) күшін жою қағидаларын бекіту туралы

    kaz: Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының кейбір қаулыларына банктердің және Қазақстан Республикасының бейрезидент банктері филиалдарының уақытша әкімшіліктерінің және тарату комиссияларының қызметі мәселелері бойынша өзгерістер енгізу туралы

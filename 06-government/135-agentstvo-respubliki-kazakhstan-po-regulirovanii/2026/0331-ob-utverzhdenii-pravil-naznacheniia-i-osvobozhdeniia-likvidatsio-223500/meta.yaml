act_code: '223500'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 32. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 апреля 2026 года № 38309
title:
  rus: Об утверждении Правил назначения и освобождения ликвидационных комиссий принудительно ликвидируемых банков, страховых (перестраховочных) организаций, принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан и Требований, предъявляемых к председателю и членам ликвидационной комиссии принудительно ликвидируемых банка, страховой (перестраховочной) организации, принудительно прекращающего деятельность филиала банка-нерезидента Республики Казахстан
  kaz: Мәжбүрлеп таратылатын банктердің, сақтандыру (қайта сақтандыру) ұйымдарының, қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент банктері филиалдарының тарату комиссияларын тағайындау және босату қағидаларын және Мәжбүрлеп таратылатын банктің, сақтандыру (қайта сақтандыру) ұйымының, қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент банкі филиалының тарату комиссиясының төрағасына және мүшелеріне қойылатын талаптарды бекіту туралы

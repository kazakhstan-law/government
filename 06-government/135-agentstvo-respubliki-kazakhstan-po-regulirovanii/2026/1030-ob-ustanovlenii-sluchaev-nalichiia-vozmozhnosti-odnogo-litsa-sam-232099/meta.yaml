act_code: '232099'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 октября 2026 года № 146. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 ноября 2026 года № 40299
title:
  rus: Об установлении случаев наличия возможности одного лица самостоятельно либо совместно с одним или несколькими лицами определять решения кредитного рейтингового агентства в силу договора (подтверждающих документов) или иным образом
  kaz: Бір тұлғаның өз бетінше не бір немесе бірнеше тұлғамен бірлесіп шарттың (растайтын құжаттардың) күшіне орай немесе өзгеше түрде кредиттік рейтингтік агенттіктің шешімдерін айқындау мүмкіндігінің болуы жағдайларын белгілеу туралы

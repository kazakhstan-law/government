act_code: '228294'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 июля 2026 года № 106. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 июля 2026 года № 39439
title:
  rus: Об утверждении Правил осуществления деятельности финансовых омбудсманов и службы финансового омбудсмана, в том числе предоставления в уполномоченный орган по регулированию, контролю и надзору финансового рынка и финансовых организаций информации о поступивших и рассмотренных обращениях потребителей финансовых услуг, а также избрания и досрочного прекращения деятельности финансового омбудсмана
  kaz: Қаржы омбудсмандарының және қаржы омбудсманы қызметінің жұмысын жүзеге асыру, оның ішінде қаржылық көрсетілетін қызметтерді тұтынушылардың келіп түскен және қаралған жолданымдары туралы қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органға ақпарат беру, сондай-ақ қаржы омбудсманын сайлау және оның қызметін мерзімінен бұрын тоқтату қағидаларын бекіту туралы

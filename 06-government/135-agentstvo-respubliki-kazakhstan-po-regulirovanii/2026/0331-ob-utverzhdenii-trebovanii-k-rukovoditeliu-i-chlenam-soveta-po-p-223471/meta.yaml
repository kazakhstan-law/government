title:
  rus: Об утверждении Требований к руководителю и членам совета по принципам исламского финансирования в банке с универсальной банковской лицензией, осуществляющем исламские банковские операции, исламском банке
  kaz: Исламдық банк операцияларын жүзеге асыратын әмбебап банк лицензиясы бар банктегі, ислам банкіндегі исламдық қаржыландыру қағидаттары жөніндегі кеңестің басшысы мен мүшелеріне қойылатын талаптарды бекіту туралы

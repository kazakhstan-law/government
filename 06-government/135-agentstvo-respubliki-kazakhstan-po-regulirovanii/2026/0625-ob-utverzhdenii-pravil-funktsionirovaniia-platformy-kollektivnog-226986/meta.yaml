requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 25 июня 2026 года № 97. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 июня 2026 года № 39103
title:
  rus: Об утверждении Правил функционирования платформы коллективного урегулирования задолженности заемщиков – физических лиц по договорам потребительского банковского займа и договорам о предоставлении потребительского микрокредита, не обеспеченным залогом имущества, включая условия подключения участников, уровни доступа, обмен и защиту персональных данных
  kaz: Қатысушыларды қосу талаптарын, қол жеткізу деңгейлерін, дербес деректерді алмасу мен қорғауды қоса алғанда, мүлік кепілімен қамтамасыз етілмеген тұтынушылық банктік қарыз шарттары мен тұтынушылық микрокредит беру туралы шарттар бойынша қарыз алушы жеке тұлғалардың берешегін ұжымдық реттеу платформасының жұмыс істеу қағидаларын бекіту туралы

act_code: '223690'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 43. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38330
title:
  rus: Об установлении Требований к внутренней политике по оплате труда, начислению денежных вознаграждений, а также других видов материального поощрения руководящих работников банка, страховой (перестраховочной) организации, страхового брокера, филиала банка-нерезидента Республики Казахстан, филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, филиала страхового брокера-нерезидента Республики Казахстан
  kaz: Банктің, сақтандыру (қайта сақтандыру) ұйымының, сақтандыру брокерінің, Қазақстан Республикасының бейрезидент банкі филиалының, Қазақстан Республикасының бейрезидент сақтандыру (қайта сақтандыру) ұйымы филиалының, Қазақстан Республикасының бейрезидент сақтандыру брокері филиалының басшы қызметкерлеріне еңбекақы төлеу, ақшалай сыйақыны, сондай-ақ материалдық көтермелеудің басқа да түрлерін есепке жазу бойынша ішкі саясатына қойылатын талаптарды белгілеу туралы

  title:
    rus: О внесении изменения в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 18 «Об утверждении условий распределения прибыли, начисления дивидендов по простым и (или) привилегированным акциям, проведения обратного выкупа собственных акций банком, для обеспечения (восстановления) финансовой устойчивости и (или) оздоровления которого используются средства государственного бюджета, Национального фонда Республики Казахстан, Национального Банка Республики Казахстан и (или) его дочерних организаций, а также уменьшения крупным участником банка, банковским холдингом доли их прямого и (или) косвенного владения и (или) пользования и (или) распоряжения акциями банка»
    kaz: «Қаржылық орнықтылықты қамтамасыз ету (қалпына келтіру) және (немесе) сауықтыру үшін мемлекеттік бюджеттің, Қазақстан Республикасы Ұлттық қорының, Қазақстан Республикасы Ұлттық Банкінің және (немесе) оның еншілес ұйымдарының қаражаты пайдаланылатын банктің пайданы бөлу, жай және (немесе) артықшылықты акциялар бойынша дивидендтерді есепке жазу, өз акцияларын кері сатып алуды жүргізу, сондай-ақ банктің ірі қатысушысының, банк холдингінің банктің акцияларын олардың тікелей және (немесе) жанама иелену және (немесе) пайдалану және (немесе) оларға билік ету үлесін азайту шарттарын бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2026 жылғы 20 наурыздағы № 18 қаулысына өзгеріс енгізу туралы

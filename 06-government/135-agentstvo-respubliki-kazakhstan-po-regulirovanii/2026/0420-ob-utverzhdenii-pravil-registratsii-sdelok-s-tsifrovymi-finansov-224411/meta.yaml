act_code: '224411'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 78. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 апреля 2026 года № 38512
title:
  rus: Об утверждении Правил регистрации сделок с цифровыми финансовыми активами в системе учета держателей цифровых финансовых активов и отражения данных сделок в системе реестров держателей ценных бумаг и цифровых финансовых активов центрального депозитария, особенностей учета прав по цифровым финансовым активам, условий и правил подтверждения прав по цифровым финансовым активам, а также правил и особенностей регистрации залога прав по цифровым финансовым активам
  kaz: Цифрлық қаржы активтерін ұстаушыларды есепке алу жүйесінде цифрлық қаржы активтерімен жасалатын мәмілелерді тіркеу және осы мәмілелерді орталық депозитарийдің бағалы қағаздар мен цифрлық қаржы активтерін ұстаушылардың тізілімдері жүйесінде көрсету қағидаларын, цифрлық қаржы активтері бойынша құқықтарды есепке алу ерекшеліктерін, цифрлық қаржы активтері бойынша құқықтарды растау шарттары мен қағидаларын, сондай-ақ цифрлық қаржы активтері бойынша құқықтар кепілін тіркеу қағидалары мен ерекшеліктерін  бекіту туралы

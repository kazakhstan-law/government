act_code: '223976'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 10 апреля 2026 года № 63. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2026 года № 38399
title:
  rus: Об утверждении Правил осуществления ликвидации банков, принудительного прекращения деятельности филиалов банков-нерезидентов Республики Казахстан и требований к работе ликвидационных комиссий принудительно ликвидируемых банков, принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан
  kaz: Банктерді таратуды жүзеге асыру, Қазақстан Республикасының бейрезидент банктері филиалдарының қызметін мәжбүрлеп тоқтату қағидаларын және мәжбүрлеп таратылатын банктердің тарату комиссияларының, қызметі мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент банктері филиалдарының жұмысына қойылатын талаптарды бекіту туралы

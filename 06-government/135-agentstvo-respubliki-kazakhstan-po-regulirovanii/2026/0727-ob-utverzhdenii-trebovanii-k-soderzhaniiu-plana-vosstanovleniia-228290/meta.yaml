requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 июля 2026 года № 108. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 июля 2026 года № 39435
title:
  rus: Об утверждении Требований к содержанию плана восстановления финансовой устойчивости банка, филиала банка-нерезидента Республики Казахстан, а также правил и сроков его представления в уполномоченный орган
  kaz: Банктің, Қазақстан Республикасы бейрезидент банкі филиалының қаржылық орнықтылығын қалпына келтіру жоспарының мазмұнына қойылатын талаптарды, сондай-ақ оны уәкілетті органға ұсыну қағидалары мен мерзімдерін бекіту туралы

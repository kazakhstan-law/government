act_code: '224517'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 80. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 апреля 2026 года № 38525
title:
  rus: Об утверждении перечня, форм, сроков и Правил представления банками, филиалами банков – нерезидентов Республики Казахстан, организациями, осуществляющими отдельные виды банковских операций, страховыми организациями, филиалами страховых организаций – нерезидентов Республики Казахстан, организациями, осуществляющими брокерскую деятельность на рынке ценных бумаг, микрофинансовыми организациями отчетности по поступившим обращениям физических и юридических лиц
  kaz: Банктердің, Қазақстан Республикасы бейрезидент банктері филиалдарының, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың, сақтандыру ұйымдарының, Қазақстан Республикасының бейрезидент сақтандыру ұйымдары филиалдарының, бағалы қағаздар нарығында брокерлік қызметті жүзеге асыратын ұйымдардың, микроқаржы ұйымдарының жеке және заңды тұлғалардың келіп түскен жолданымдары бойынша есептілікті ұсыну тізбесін, нысандарын, мерзімдері мен қағидаларын бекіту туралы

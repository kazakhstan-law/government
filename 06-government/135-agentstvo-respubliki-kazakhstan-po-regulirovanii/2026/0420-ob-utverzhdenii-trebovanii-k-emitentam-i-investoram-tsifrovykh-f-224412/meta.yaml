act_code: '224412'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 76. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 апреля 2026 года № 38514
title:
  rus: Об утверждении Требований к эмитентам и инвесторам цифровых финансовых активов и к решению о выпуске цифровых финансовых активов, правилам и условиям признания физических лиц квалифицированными инвесторами в целях осуществления сделок с цифровыми финансовыми активами, а также Перечня цифровых финансовых активов, разрешенных к приобретению только за счет средств квалифицированных инвесторов
  kaz: Цифрлық қаржы активтердің эмитенттері мен инвесторларына және цифрлық қаржы активтердің шығарылымы туралы шешіміне, жеке тұлғаларды цифрлық қаржы активтермен мәмілелерді жүзеге асыру мақсатында білікті инвесторлар деп танудың қағидалары мен шарттарына талаптарды, сондай-ақ Білікті инвесторлардың қаражаты есебінен ғана сатып алуға рұқсат етілген цифрлық қаржы активтердің тізбесін бекіту туралы

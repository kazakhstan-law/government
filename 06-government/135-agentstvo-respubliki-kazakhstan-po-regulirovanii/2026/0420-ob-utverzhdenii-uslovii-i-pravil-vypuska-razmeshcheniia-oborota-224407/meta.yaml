act_code: '224407'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 75. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 апреля 2026 года № 38509
title:
  rus: Об утверждении условий и правил выпуска, размещения, оборота (обращения) и погашения цифровых финансовых активов, базовым активом которых выступают финансовые инструменты (в том числе ценные бумаги, включая производные ценные бумаги, производные финансовые инструменты, другой цифровой финансовый актив), финансовый актив, имущественные права (требования), товары и (или) иное имущество, за исключением денег, а также в виде финансовых инструментов, выпускаемых в электронно-цифровой форме на цифровой платформе оператора платформы цифровых финансовых активов
  kaz: Ақшаны қоспағанда, базалық активі қаржы құралдары (оның ішінде туынды бағалы қағаздарды қоса алғанда, бағалы қағаздар, туынды қаржы құралдары, басқа да цифрлық қаржы активі), қаржы активі, мүліктік құқықтар (талаптар), тауарлар және (немесе) өзге де мүлік болып табылатын цифрлық қаржы активтері, сондай-ақ цифрлық қаржы активтері платформасы операторының цифрлық платформасында электрондық-цифрлық нысанда шығарылатын қаржы құралдары түріндегі цифрлық қаржы активтерін шығару, орналастыру, айналымға (айналысқа) жіберу және өтеу шарттары мен қағидаларын бекіту туралы

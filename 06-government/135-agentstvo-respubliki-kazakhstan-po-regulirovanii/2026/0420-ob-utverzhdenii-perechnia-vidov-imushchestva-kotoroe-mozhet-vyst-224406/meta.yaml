act_code: '224406'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 77. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 апреля 2026 года № 38508
title:
  rus: Об утверждении Перечня (видов) имущества, которое может выступать базовым активом цифровых финансовых активов, Требований к организациям, которые вправе выступать в качестве организации по хранению базового актива цифрового финансового актива в отношении цифровых финансовых активов, а также правил учета и хранения базового актива по таким цифровым финансовым активам
  kaz: Цифрлық қаржы активтерінің базалық активі бола алатын мүліктің тізбесін (түрлерін), Цифрлық қаржы активтеріне қатысты цифрлық қаржы активінің базалық активін сақтау жөніндегі ұйым ретінде әрекет етуге құқылы ұйымдарға қойылатын талаптарды, сондай-ақ осындай цифрлық қаржы активтері бойынша базалық активті есепке алу және сақтау қағидаларын бекіту туралы

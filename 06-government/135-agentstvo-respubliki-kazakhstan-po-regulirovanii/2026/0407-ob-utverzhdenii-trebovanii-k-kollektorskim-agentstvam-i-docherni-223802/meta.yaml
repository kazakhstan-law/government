act_code: '223802'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 апреля 2026 года № 57. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 апреля 2026 года № 38368
title:
  rus: Об утверждении Требований к коллекторским агентствам и дочерним организациям по управлению стрессовыми активами, выступающим в качестве сервисных компаний, которым могут быть переданы в доверительное управление права (требования) по договорам банковского займа и (или) договорам о предоставлении микрокредита
  kaz: Банктік қарыз шарттары және (немесе) микрокредит беру туралы шарттар бойынша құқықтар (талаптар) сенімгерлік басқаруға берілуі мүмкін сервистік компаниялар ретінде әрекет ететін коллекторлық агенттіктерге және стрестік активтерді басқару жөніндегі еншілес ұйымдарға қойылатын талаптарды бекіту туралы

act_code: '224325'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 17 апреля 2026 года № 70. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 апреля 2026 года № 38481
title:
  rus: Об утверждении Правил приобретения и перечня финансовых инструментов, с которыми банки с универсальной банковской лицензией, банки с базовой банковской лицензией, исламские банки, филиалы банков-нерезидентов Республики Казахстан, филиалы исламских банков-нерезидентов Республики Казахстан осуществляют дилерскую деятельность и брокерскую деятельность на рынке ценных бумаг
  kaz: Әмбебап банк лицензиясы бар банктер, базалық банк лицензиясы бар банктер, ислам банктері, Қазақстан Республикасы бейрезидент-банктерінің филиалдары, Қазақстан Республикасы бейрезидент-ислам банктерінің филиалдары бағалы қағаздар нарығында дилерлік қызметті және брокерлік қызметті жүзеге асыратын қаржы құралдарын сатып алу қағидаларын және тізбесін бекіту туралы

act_code: '223635'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 49. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 апреля 2026 года № 38342
title:
  rus: Об утверждении Правил выдачи разрешения на добровольную реорганизацию банка (банковского холдинга) либо отказа в выдаче разрешения, в том числе условий добровольного преобразования банка в организацию, осуществляющую отдельные виды банковских операций, выдачи разрешения на конвертацию банка в исламский банк и отказа в выдаче разрешения, выдачи разрешения на добровольную ликвидацию банка, выдачи разрешения на добровольное прекращение деятельности филиала банка-нерезидента Республики Казахстан, а также порядка возврата депозитов физических лиц, их перевода в другой банк или филиал банка-нерезидента Республики Казахстан
  kaz: Банкті (банк холдингін) ерікті түрде қайта ұйымдастыруға рұқсат беру не рұқсат беруден бас тарту, оның ішінде банкті банк операцияларының жекелеген түрлерін жүзеге асыратын ұйым ретінде ерікті түрде қайта құру шарттары не банкті ислам банкіне айналдыруға рұқсат беру және рұқсат беруден бас тарту, банкті ерікті түрде таратуға рұқсат беру, Қазақстан Республикасының бейрезидент-банкі филиалының қызметін ерікті түрде тоқтатуға рұқсат беру қағидалары, сондай-ақ жеке тұлғалардың депозиттерін қайтару, оларды басқа банкке немесе Қазақстан Республикасы бейрезидент-банкінің филиалына аудару тәртібін бекіту туралы

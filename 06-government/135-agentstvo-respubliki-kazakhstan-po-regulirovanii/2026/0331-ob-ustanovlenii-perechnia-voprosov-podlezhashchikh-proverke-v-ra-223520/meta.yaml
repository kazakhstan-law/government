act_code: '223520'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 34. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 апреля 2026 года № 38310
title:
  rus: Об установлении Перечня вопросов, подлежащих проверке в рамках аудита иной информации, Требований к содержанию, срокам представления аудиторской организацией аудиторского заключения по аудиту иной информации, Требований к аудиторам в составе аудиторской организации, привлекаемой к аудиту иной информации
  kaz: Өзге ақпарат аудиті шеңберінде тексеруге жататын мәселелердің тізбесін, Өзге ақпарат аудиті бойынша аудиторлық қорытындының мазмұнына, аудиторлық ұйымның оны ұсыну мерзімдеріне қойылатын талаптарды, Өзге ақпарат аудитіне тартылатын аудиторлық ұйымның құрамындағы аудиторларға қойылатын талаптарды белгілеу туралы

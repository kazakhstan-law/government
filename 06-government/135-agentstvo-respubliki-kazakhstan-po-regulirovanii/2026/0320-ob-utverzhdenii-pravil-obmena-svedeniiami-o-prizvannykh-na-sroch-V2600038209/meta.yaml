requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 13. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 марта 2026 года № 38209
title:
  rus: Об утверждении Правил обмена сведениями о призванных на срочную воинскую службу военнослужащих, а также их увольнении, наличии либо отсутствии банковского займа, микрокредита, предоставлении отсрочки платежа по договору банковского займа, договору о предоставлении микрокредита
  kaz: Мерзімді әскери қызметке шақырылған әскери қызметшілер, сондай-ақ оларды қызметтен шығару, оларда банктік қарыздың, микрокредиттің болуы не болмауы, банктік қарыз шарты, микрокредит беру туралы шарт бойынша төлемді кейінге қалдырудың ұсынылуы туралы мәліметтер алмасу қағидаларын бекіту туралы

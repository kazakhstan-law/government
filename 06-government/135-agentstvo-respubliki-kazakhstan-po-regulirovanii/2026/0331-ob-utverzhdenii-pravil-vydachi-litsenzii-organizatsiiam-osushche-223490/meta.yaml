act_code: '223490'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 29. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 апреля 2026 года № 38308
title:
  rus: Об утверждении Правил выдачи лицензии организациям, осуществляющим отдельные виды банковских операций, Квалификационных требований для проведения банковских операций организациями, осуществляющими отдельные виды банковских операций, а также перечня документов, подтверждающих соответствие указанным квалификационным требованиям
  kaz: Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға лицензия беру қағидаларын, Банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың банк операцияларын жүргізу үшін біліктілік талаптарын, сондай-ақ көрсетілген біліктілік талаптарына сәйкестігін растайтын құжаттар тізбесін бекіту туралы

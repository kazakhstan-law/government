act_code: '224400'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 73. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 апреля 2026 года № 38502
title:
  rus: Об установлении пруденциальных нормативов и лимитов для филиалов банков-нерезидентов Республики Казахстан, их предельных значений и методик расчетов, включая порядок формирования активов филиалов банков-нерезидентов Республики Казахстан, принимаемых в качестве резерва, и их минимальный размер
  kaz: Қазақстан Республикасының бейрезидент банктері филиалдарының резерв ретінде қабылданатын активтерін қалыптастыру тәртібін және олардың ең төмен мөлшерін қоса алғанда, Қазақстан Республикасының бейрезидент банктерінің филиалдары үшін пруденциялық нормативтер мен лимиттерді, олардың шекті мәндерін және есептеу әдістемелерін белгілеу туралы

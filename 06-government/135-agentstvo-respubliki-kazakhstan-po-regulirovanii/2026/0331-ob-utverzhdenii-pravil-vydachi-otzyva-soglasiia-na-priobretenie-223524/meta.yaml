act_code: '223524'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 31 марта 2026 года № 30. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 апреля 2026 года № 38324
title:
  rus: Об утверждении Правил выдачи, отзыва согласия на приобретение статуса крупного участника банка, банковского холдинга, крупного участника страховой (перестраховочной) организации, страхового холдинга, крупного участника управляющего инвестиционным портфелем и требования к документам, представляемым для получения указанного согласия
  kaz: Банктің ірі қатысушысы, банк холдингінің, сақтандыру (қайта сақтандыру) ұйымының ірі қатысушысы, сақтандыру холдингінің, инвестициялық портфельді басқарушының ірі қатысушысы мәртебесін иеленуге келісім беру, келісімді қайтарып алу қағидаларын және көрсетілген келісімді алу үшін ұсынылатын құжаттарға қойылатын талаптарды бекіту туралы

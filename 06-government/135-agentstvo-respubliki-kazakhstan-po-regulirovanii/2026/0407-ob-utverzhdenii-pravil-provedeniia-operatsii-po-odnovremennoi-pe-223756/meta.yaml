act_code: '223756'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 апреля 2026 года № 58. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 апреля 2026 года № 38357
title:
  rus: Об утверждении Правил проведения операции по одновременной передаче активов и обязательств банка другому банку (банкам), а также видов активов и обязательств, подлежащих передаче при проведении указанной операции, а также согласования уполномоченным органом такой операции
  kaz: Банктің активтері мен міндеттемелерін бір мезгілде басқа банкке (банктерге)  беру жөніндегі операцияны, сондай-ақ көрсетілген операцияны жүргізу кезінде берілуге жататын активтер мен міндеттемелердің түрлерін бір мезгілде беру жөніндегі операцияны жүргізу, сондай-ақ осы операцияны уәкілетті органның келісу қағидаларын бекіту туралы

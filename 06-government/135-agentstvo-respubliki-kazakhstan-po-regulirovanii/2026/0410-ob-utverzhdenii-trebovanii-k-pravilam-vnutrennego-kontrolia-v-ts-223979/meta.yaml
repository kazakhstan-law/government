act_code: '223979'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 10 апреля 2026 года № 62. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 апреля 2026 года № 38402
title:
  rus: Об утверждении Требований к Правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для эмитентов цифровых финансовых активов, базовым активом которых выступают финансовые инструменты (в том числе ценные бумаги, включая производные ценные бумаги, производные финансовые инструменты, другой цифровой финансовый актив), финансовый актив, имущественные права (требования), товары и (или) иное имущество, за исключением денег, и эмитентов финансовых инструментов, выпускаемых в электронно-цифровой форме на цифровой платформе оператора платформы цифровых финансовых активов
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл мақсатында базалық активі қаржы құралдары (оның ішінде туынды бағалы қағаздарды, туынды қаржы құралдарын, басқа да цифрлық қаржы активін қоса алғанда, бағалы қағаздар), қаржы активі, мүліктік құқықтар (талаптар), тауарлар және (немесе) ақшаны қоспағанда, өзге де мүлік болып табылатын цифрлық қаржы активтерінің эмитенттері және цифрлық қаржы активтері платформасы операторының цифрлық платформасында электрондық-цифрлық нысанда шығарылатын қаржы құралдарының эмитенттері үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы

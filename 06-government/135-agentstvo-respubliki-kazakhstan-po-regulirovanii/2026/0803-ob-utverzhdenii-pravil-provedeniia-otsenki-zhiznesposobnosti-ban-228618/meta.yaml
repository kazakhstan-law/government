act_code: '228618'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 августа 2026 года № 118. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 августа 2026 года № 39531
title:
  rus: Об утверждении Правил проведения оценки жизнеспособности банка, критериев наличия системных рисков и рисков существенного негативного воздействия на банковскую систему, критериев наличия критически важных банковских и иных операций, требующих обеспечения непрерывности их осуществления, а также перечня сделок (операций) на нерыночных условиях, в результате совершения которых банк несет убытки
  kaz: Банктің қызмет қабілетін бағалауды жүргізу қағидаларын, жүйелі тәуекелдердің және банк жүйесіне едәуір теріс әсер ету тәуекелдерінің болу өлшемшарттарын, жүзеге асырылудың үздіксіздігін қамтамасыз етуді талап ететін аса маңызды банк операцияларының және өзге де операциялардың болу өлшемшарттарын, сондай-ақ банкті залалға ұшырататын нарықтық емес шарттарда жасалатын мәмілелердің (операциялардың) тізбесін бекіту туралы

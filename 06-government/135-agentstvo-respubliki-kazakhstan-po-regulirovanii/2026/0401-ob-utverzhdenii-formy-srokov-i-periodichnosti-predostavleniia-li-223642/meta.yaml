title:
  rus: Об утверждении формы, сроков и периодичности предоставления ликвидационными комиссиями отчетов и дополнительной информации добровольно и принудительно ликвидируемых банков, добровольно и принудительно прекращающих деятельность филиалов банков-нерезидентов Республики Казахстан
  kaz: Ерiктi түрде және мәжбүрлеп таратылатын банктер, қызметі ерікті түрде және мәжбүрлеп тоқтатылатын Қазақстан Республикасының бейрезидент банктерінің филиалдары тарату комиссияларының есептерді және қосымша ақпаратты беру нысанын, мерзiмдерi мен кезеңдiлiгiн бекіту туралы

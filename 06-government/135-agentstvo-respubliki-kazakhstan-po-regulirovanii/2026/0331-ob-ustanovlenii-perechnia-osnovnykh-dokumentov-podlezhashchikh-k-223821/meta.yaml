  kaz: Банктерде, Қазақстан Республикасының бейрезидент банктерінің филиалдарында және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарда сақталуға тиіс негізгі құжаттар тізбесін және оларды сақтау мерзімдерін белгілеу туралы

requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 52. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 июня 2023 года № 32815
title:
  rus: Об утверждении Правил учета и формирования условных пенсионных обязательств, включая формирование и использование резервных фондов, методики расчета и структуры резервных фондов
  kaz: Резервтік қорларды қалыптастыруды және пайдалануды қоса алғанда, шартты зейнетақы міндеттемелерін есепке алу және қалыптастыру қағидаларын, резервтік қорларды есептеу әдістемесі мен құрылымын бекіту туралы

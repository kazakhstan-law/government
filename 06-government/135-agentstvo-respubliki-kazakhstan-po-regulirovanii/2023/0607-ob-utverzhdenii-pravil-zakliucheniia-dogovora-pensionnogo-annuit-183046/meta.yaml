    rus: О внесении изменений и дополнения в постановления Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка по вопросам страховой деятельности
    kaz: Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының қаулыларына сақтандыру қызметі мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

act_code: '183046'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 44. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 июня 2023 года № 32835
title:
  rus: Об утверждении Правил заключения договора пенсионного аннуитета со страховой организацией и перевода пенсионных накоплений (выкупной суммы) в страховую организацию, единый накопительный пенсионный фонд по договору пенсионного аннуитета, а также порядка и сроков обмена данными по договорам пенсионного аннуитета с организацией по формированию и ведению базы данных по страхованию
  kaz: Сақтандыру ұйымымен зейнетақы аннуитеті шартын жасасу және зейнетақы жинақтарын (сатып алу сомасын) сақтандыру ұйымына, зейнетақы аннуитеті шарты бойынша бірыңғай жинақтаушы зейнетақы қорына аудару қағидалары, сондай-ақ сақтандыру бойынша дерекқорды қалыптастыру және жүргізу жөніндегі ұйыммен зейнетақы аннуитеті шарттары бойынша деректер алмасу тәртібі және мерзімдерін бекіту туралы

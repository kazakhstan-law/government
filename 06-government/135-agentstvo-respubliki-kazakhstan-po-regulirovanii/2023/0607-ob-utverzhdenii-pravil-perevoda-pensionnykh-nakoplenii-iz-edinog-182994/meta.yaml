act_code: '182994'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 51. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 июня 2023 года № 32811
title:
  rus: Об утверждении Правил перевода пенсионных накоплений из единого накопительного пенсионного фонда в добровольный накопительный пенсионный фонд, из добровольного накопительного пенсионного фонда в единый накопительный пенсионный фонд, а также из одного добровольного накопительного пенсионного фонда в другой добровольный накопительный пенсионный фонд
  kaz: Зейнетақы жинақтарын бірыңғай жинақтаушы зейнетақы қорынан ерікті жинақтаушы зейнетақы қорына, ерікті жинақтаушы зейнетақы қорынан бірыңғай жинақтаушы зейнетақы қорына, сондай-ақ бір ерікті жинақтаушы зейнетақы қорынан басқа ерікті жинақтаушы зейнетақы қорына аудару қағидаларын бекіту туралы

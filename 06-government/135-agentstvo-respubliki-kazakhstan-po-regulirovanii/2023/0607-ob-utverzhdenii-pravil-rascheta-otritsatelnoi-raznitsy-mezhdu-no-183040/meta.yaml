act_code: '183040'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 43. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 июня 2023 года № 32830
title:
  rus: Об утверждении Правил расчета отрицательной разницы между номинальной доходностью пенсионных активов, полученной управляющим инвестиционным портфелем, и минимальным значением доходности пенсионных активов, а также Правил и сроков возмещения отрицательной разницы управляющим инвестиционным портфелем за счет собственного капитала
  kaz: Инвестициялық портфельді басқарушы алған зейнетақы активтерінің номиналды кірістілігі мен зейнетақы активтері кірістілігінің ең төмен мәні арасындағы теріс айырманы есептеу қағидаларын, сондай-ақ инвестициялық портфельді басқарушының теріс айырманы өз капиталы есебінен өтеу қағидалары мен мерзімдерін бекіту туралы

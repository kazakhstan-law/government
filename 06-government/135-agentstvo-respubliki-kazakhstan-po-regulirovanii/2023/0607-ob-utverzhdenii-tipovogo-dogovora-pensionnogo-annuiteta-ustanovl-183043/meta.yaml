  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Республики Казахстан по вопросам совершенствования страхового рынка
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру нарығын жетілдіру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

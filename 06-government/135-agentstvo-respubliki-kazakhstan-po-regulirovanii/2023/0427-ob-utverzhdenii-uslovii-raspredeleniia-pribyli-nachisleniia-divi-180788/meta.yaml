act_code: '180788'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 апреля 2023 года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 мая 2023 года № 32430. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 18 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении условий распределения прибыли, начисления дивидендов по простым и (или) привилегированным акциям и (или) бессрочным финансовым инструментам, а также проведения обратного выкупа собственных акций банком второго уровня, для обеспечения финансовой устойчивости и (или) оздоровления которого используются средства государственного бюджета, Национального фонда Республики Казахстан, Национального Банка Республики Казахстан и (или) его дочерних организаций
  kaz: Қаржылық орнықтылығын қамтамасыз ету және (немесе) оны қалпына келтіру үшін мемлекет бюджетінің, Қазақстан Республикасы Ұлттық қорының, Қазақстан Республикасы Ұлттық Банкінің және (немесе) оның еншілес ұйымдарының қаражаты пайдаланылатын екінші деңгейдегі банктің жай және (немесе) артықшылықты акциялар және (немесе) мерзімсіз қаржы құралдары бойынша пайданы бөлу, дивидендтер есептеу, сондай-ақ меншікті акцияларды кері сатып алуды жүргізу талаптарын бекіту туралы

act_code: '183045'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 48. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 июня 2023 года № 32834
title:
  rus: Об утверждении Правил добровольного возврата лицензии на управление инвестиционным портфелем с правом привлечения добровольных пенсионных взносов, проведения добровольной или принудительной ликвидации добровольных накопительных пенсионных фондов, а также передачи пенсионных активов и обязательств по договорам о пенсионном обеспечении за счет добровольных пенсионных взносов
  kaz: Ерікті зейнетақы жарналарын тарту құқығымен инвестициялық портфельді басқаруға арналған лицензияны ерікті түрде қайтару, ерікті жинақтаушы зейнетақы қорларын ерікті түрде немесе мәжбүрлеп таратуды жүргізу, сондай-ақ ерікті зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы шарттар бойынша зейнетақы активтері мен міндеттемелерін беру қағидаларын бекіту туралы

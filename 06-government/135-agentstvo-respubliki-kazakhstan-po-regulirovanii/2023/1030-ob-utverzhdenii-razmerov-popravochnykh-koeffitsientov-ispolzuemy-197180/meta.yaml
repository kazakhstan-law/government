act_code: '197180'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 октября 2023 года № 79
title:
  rus: Об утверждении размеров поправочных коэффициентов, используемых для расчета страховой премии по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств в соответствии с Законом Республики Казахстан «Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств», на 2024 год
  kaz: «Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру туралы» Қазақстан Республикасының Заңына сәйкес көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру бойынша сақтандыру сыйлықақысын есептеу үшін қолданылатын түзету коэффициенттерінің 2024 жылға арналған мөлшерлерін бекіту туралы

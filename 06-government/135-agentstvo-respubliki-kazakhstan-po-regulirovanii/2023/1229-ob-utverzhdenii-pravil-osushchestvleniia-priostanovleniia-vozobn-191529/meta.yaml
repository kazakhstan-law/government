act_code: '191529'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 29 декабря 2023 года № 98. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 января 2024 года № 33876
title:
  rus: Об утверждении Правил осуществления, приостановления, возобновления и прекращения страховых выплат по договору предпенсионного аннуитетного страхования, Требований к договору предпенсионного аннуитетного страхования и допустимого уровня расходов страховой организации на ведение дела по заключаемым договорам предпенсионного аннуитетного страхования, Правил расчета страховой премии по договору предпенсионного аннуитетного страхования
  kaz: Зейнетақы алдындағы аннуитеттік сақтандыру шарты бойынша сақтандыру төлемдерін жүзеге асыру, тоқтата тұру, қайта бастау және тоқтату қағидаларын, Зейнетақы алдындағы аннуитеттік сақтандыру шартына қойылатын талаптарды және сақтандыру ұйымының жасалатын зейнетақы алдындағы аннуитеттік сақтандыру шарттары бойынша істі жүргізуге арналған шығыстарының жол берілетін деңгейін, Зейнетақы алдындағы аннуитеттік сақтандыру шарты бойынша сақтандыру сыйлықақысы есебінің қағидаларын бекіту туралы

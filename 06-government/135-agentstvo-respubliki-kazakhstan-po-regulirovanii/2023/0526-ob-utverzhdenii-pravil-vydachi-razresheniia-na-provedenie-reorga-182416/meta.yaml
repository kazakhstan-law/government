requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 мая 2023 года № 31. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 июня 2023 года № 32668
title:
  rus: Об утверждении Правил выдачи разрешения на проведение реорганизации добровольного накопительного пенсионного фонда и передачи пенсионных активов и обязательств присоединяемого добровольного накопительного пенсионного фонда по договорам о пенсионном обеспечении за счет добровольных пенсионных взносов в реорганизованный добровольный накопительный пенсионный фонд
  kaz: Ерікті жинақтаушы зейнетақы қорын қайта ұйымдастыруды жүргізуге рұқсат беру және ерікті зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы шарттар бойынша қосылатын ерікті жинақтаушы зейнетақы қорының зейнетақы активтері мен міндеттемелерін қайта ұйымдастырылған ерікті жинақтаушы зейнетақы қорына беру қағидаларын бекіту туралы

act_code: '182977'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 49. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 июня 2023 года № 32801
title:
  rus: Об утверждении Правил ведения учета пенсионных накоплений за счет обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов и добровольных пенсионных взносов на индивидуальных пенсионных счетах вкладчиков обязательных пенсионных взносов, физических лиц, за которых перечислены обязательные профессиональные пенсионные взносы, добровольные пенсионные взносы (получателей пенсионных выплат)
  kaz: Міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары және ерікті зейнетақы жарналары есебінен зейнетақы жинақтарын міндетті зейнетақы жарналары салымшыларының, өздері үшін міндетті кәсіптік зейнетақы жарналары, ерікті зейнетақы жарналары аударылған жеке тұлғалардың (зейнетақы төлемдерін алушылардың) жеке зейнетақы шоттарындағы зейнетақы жинақтарын есепке алу қағидаларын бекіту туралы

    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам пенсионного обеспечения
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне зейнетақымен қамсыздандыру мәселелері бойынша өзгерістер мен толықтыру енгізу туралы

act_code: '182433'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 мая 2023 года № 30. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 июня 2023 года № 32671
title:
  rus: Об утверждении типовой формы договора о доверительном управлении пенсионными активами, типовой формы кастодиального договора, заключенного между единым накопительным пенсионным фондом, управляющим инвестиционным портфелем и банком-кастодианом
  kaz: Зейнетақы активтерін сенімгерлік басқару туралы шарттың үлгілік нысанын, бірыңғай жинақтаушы зейнетақы қоры, инвестициялық портфельді басқарушы және кастодиан-банк арасында жасалған кастодиандық шарттың үлгілік нысанын бекіту туралы

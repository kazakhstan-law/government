requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 46. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 июня 2023 года № 32827
title:
  rus: Об утверждении Правил расчета поправочных коэффициентов к коэффициентам по территории регистрации транспортного средства для расчета страховой премии по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств
  kaz: Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру бойынша сақтандыру сыйлықақысын есептеу үшін көлік құралы тіркелген аумақ бойынша коэффициенттерге түзету коэффициенттерін есептеу қағидаларын бекіту туралы

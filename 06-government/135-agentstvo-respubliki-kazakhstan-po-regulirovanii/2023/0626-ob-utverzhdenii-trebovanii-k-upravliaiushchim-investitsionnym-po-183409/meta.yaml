act_code: '183409'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 июня 2023 года № 62. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 июня 2023 года № 32933
title:
  rus: Об утверждении Требований к управляющим инвестиционным портфелем, которым могут быть переданы в доверительное управление пенсионные активы, а также Перечня финансовых инструментов, разрешенных к приобретению за счет пенсионных активов, находящихся в доверительном управлении у управляющего инвестиционным портфелем
  kaz: Зейнетақы активтері сенімгерлік басқаруға берілуі мүмкін инвестициялық портфельді басқарушыға қойылатын талаптарды, сондай-ақ Инвестициялық портфельді басқарушының сенімгерлік басқаруындағы зейнетақы активтері есебінен сатып алуға рұқсат етілген қаржы құралдарының тізбесін бекіту туралы

act_code: '188492'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 15 ноября 2023 года № 83. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 ноября 2023 года № 33652
title:
  rus: Об утверждении Правил, условий и сроков упрощенного порядка урегулирования страховых случаев, предельного размера страховой суммы по каждому отдельному страховому случаю, а также формы декларации об упрощенном порядке урегулирования страхового случая и требований к оформлению документов и сведений, прилагаемых к ней, Правил, условий, сроков осмотра страховщиком транспортных средств при упрощенном порядке урегулирования страхового случая, Правил и сроков осуществления страховщиком страховой выплаты при упрощенном порядке урегулирования страхового случая
  kaz: Сақтандыру жағдайларын реттеу қағидаларын, реттеудің оңайлатылған тәртібінің шарттары мен мерзімдерін, әрбір жекелеген сақтандыру жағдайы бойынша сақтандыру сомасының шекті мөлшерін, сондай-ақ сақтандыру жағдайын реттеудің оңайлатылған тәртібі туралы декларация нысанын және құжаттарды ресімдеуге қойылатын талаптар мен оған қоса берілетін мәліметтерді, Сақтандыру жағдайын реттеудің оңайлатылған тәртібі кезінде көлік құралдарын сақтандырушының қарап-тексеру қағидаларын, шарттарын және мерзімдерін, Сақтандыру жағдайын реттеудің оңайлатылған тәртібі кезінде сақтандыру төлемін жүзеге асыру қағидаларын және мерзімдерін бекіту туралы

requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 октября 2022 года № 81. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 ноября 2022 года № 30377. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи согласия на назначение (избрание) руководящего работника банка, банковского холдинга, филиала банка-нерезидента Республики Казахстан, включая критерии отсутствия безупречной деловой репутации, документы, необходимые для получения согласия, Особенностей по наличию трудового стажа для кандидатов, обладающих профессиональной квалификацией, подтвержденной международными сертификатами, и перечня таких сертификатов
  kaz: Мінсіз іскерлік беделінің болмауы өлшемшарттарын, келісім алу үшін қажетті құжаттарды қоса алғанда, банктің, банк холдингінің, Қазақстан Республикасының бейрезидент-банкі филиалының басшы қызметкерін тағайындауға (сайлауға) келісім беру қағидаларын, Халықаралық сертификаттармен расталған кәсіби біліктілікке ие кандидаттар үшін еңбек өтілінің болуы жөніндегі ерекшеліктерді және осындай сертификаттардың тізбесін бекіту туралы

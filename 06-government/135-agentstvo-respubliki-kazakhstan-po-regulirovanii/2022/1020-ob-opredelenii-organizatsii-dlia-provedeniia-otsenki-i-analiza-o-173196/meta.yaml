act_code: '173196'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 октября 2022 года № 76. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 октября 2022 года № 30322
title:
  rus: Об определении организаций для проведения оценки и анализа относительно использования и распределения поступающих доходов и средств от размещения «зеленых», социальных облигаций, облигаций устойчивого развития и облигаций, связанных с устойчивым развитием, и их соответствия целям, заявленным рамочной программой по выпуску облигаций и (или) условиями выпуска облигаций (верификация)
  kaz: «Жасыл», әлеуметтік облигацияларды, орнықты даму облигацияларын және орнықты дамумен байланысты облигацияларды орналастырудан түсетін кірістер мен қаражатты пайдалану мен бөлуге және олардың облигацияларды шығару жөніндегі негіздемелік бағдарламада және (немесе) облигацияларды шығару шарттарында мәлімделген мақсаттарға сәйкестігіне қатысты бағалау мен талдау жүргізу (верификация) үшін ұйымдарды айқындау туралы

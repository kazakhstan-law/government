act_code: '171886'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 сентября 2022 года № 61. Зарегистрировано в Министерстве юстиции Республики Казахстан 21 сентября 2022 года № 29734. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 апреля 2026 года № 57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к дочерним организациям банка, приобретающим сомнительные и безнадежные активы родительского банка, и коллекторским агентствам, выступающим в качестве сервисных компаний, которым могут быть переданы в доверительное управление права (требования) по договорам банковского займа и (или) договорам о предоставлении микрокредита
  kaz: Бас банктің күмәнді және үмітсіз активтеріне ие болатын банктің еншілес ұйымдарына және банктік қарыз шарттары және (немесе) микрокредит беру туралы шарттар бойынша құқықтар (талаптар) сенімгерлік басқаруға берілуі мүмкін сервистік компаниялар ретінде әрекет ететін коллекторлық агенттіктерге қойылатын талаптарды бекіту туралы

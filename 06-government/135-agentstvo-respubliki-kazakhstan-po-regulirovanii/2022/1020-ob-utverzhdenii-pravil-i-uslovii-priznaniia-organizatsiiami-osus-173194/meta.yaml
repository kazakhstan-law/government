act_code: '173194'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 октября 2022 года № 75. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 октября 2022 года № 30321
title:
  rus: Об утверждении Правил и условий признания организациями, осуществляющими брокерскую и (или) дилерскую деятельность на рынке ценных бумаг, физических лиц квалифицированными инвесторами, а также особенностей оказания организациями, осуществляющими брокерскую и (или) дилерскую деятельность на рынке ценных бумаг, услуг физическим лицам, не являющимся квалифицированными инвесторами
  kaz: Бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдардың жеке тұлғаларды білікті инвесторлар деп тану қағидалары мен шарттарын, сондай-ақ бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті жүзеге асыратын ұйымдардың білікті инвесторлар болып табылмайтын жеке тұлғаларға қызметтер көрсету ерекшеліктерін бекіту туралы

act_code: '174751'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 ноября 2022 года № 105. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 декабря 2022 года № 30930
title:
  rus: Об утверждении Правил предоставления инвестиционной рекомендации индивидуальному инвестору, квалификационных требований к работнику организации, осуществляющей брокерскую и (или) дилерскую деятельность на рынке ценных бумаг и (или) деятельность по управлению инвестиционным портфелем
  kaz: Дара инвесторға инвестициялық ұсыным беру қағидаларын, бағалы қағаздар нарығында брокерлік және (немесе) дилерлік қызметті және (немесе) инвестициялық портфельді басқару жөніндегі қызметті жүзеге асыратын ұйымның қызметкеріне қойылатын біліктілік талаптарын бекіту туралы

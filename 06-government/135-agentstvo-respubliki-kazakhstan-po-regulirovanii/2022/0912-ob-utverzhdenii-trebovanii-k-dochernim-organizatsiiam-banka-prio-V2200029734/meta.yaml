    kaz: Банктік қарыз шарттары және (немесе) микрокредит беру туралы шарттар бойынша құқықтар (талаптар) сенімгерлік басқаруға берілуі мүмкін сервистік компаниялар ретінде әрекет ететін коллекторлық агенттіктерге және стрестік активтерді басқару жөніндегі еншілес ұйымдарға қойылатын талаптарды бекіту туралы

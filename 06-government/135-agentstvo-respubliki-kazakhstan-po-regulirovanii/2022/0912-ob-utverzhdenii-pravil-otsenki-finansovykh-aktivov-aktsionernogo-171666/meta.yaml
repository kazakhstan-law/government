act_code: '171666'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 сентября 2022 года № 62. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 сентября 2022 года № 29627
title:
  rus: Об утверждении Правил оценки финансовых активов акционерного общества «Фонд гарантирования страховых выплат», сформированных за счет собственных активов акционерного общества «Фонд гарантирования страховых выплат», средств резервов гарантирования страховых выплат по отраслям «общее страхование» и «страхование жизни», средств резерва возмещения вреда
  kaz: «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының меншікті активтері, «жалпы сақтандыру» және «өмірді сақтандыру» салалары бойынша сақтандыру төлемдеріне кепілдік беру резервтерінің қаражаты, зиянды өтеу резервінің қаражаты есебінен қалыптастырылған «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының қаржы активтерін бағалау қағидаларын бекіту туралы

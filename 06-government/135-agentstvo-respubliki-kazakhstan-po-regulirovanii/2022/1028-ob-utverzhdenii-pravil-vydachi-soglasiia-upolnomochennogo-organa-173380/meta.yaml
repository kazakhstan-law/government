act_code: '173380'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 октября 2022 года № 79. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 ноября 2022 года № 30383. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи согласия уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций на назначение (избрание) руководящего работника заявителя (лицензиата), единого накопительного пенсионного фонда, добровольного накопительного пенсионного фонда, включая критерии отсутствия безупречной деловой репутации и документы, необходимые для получения согласия
  kaz: Мінсіз іскерлік беделінің болмау өлшемшарттарын қоса алғанда, өтініш берушінің (лицензиаттың), бірыңғай жинақтаушы зейнетақы қорының, ерікті жинақтаушы зейнетақы қорының басшы қызметкерін тағайындауға (сайлауға) қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органның келісім беру қағидаларын және келісім алу үшін қажетті құжаттарды бекіту туралы

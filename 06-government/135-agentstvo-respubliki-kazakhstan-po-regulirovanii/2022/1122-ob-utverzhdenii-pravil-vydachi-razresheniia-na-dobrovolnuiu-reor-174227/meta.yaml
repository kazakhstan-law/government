  code: '191138'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 декабря 2023 года № 94. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 декабря 2023 года № 33823
  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 ноября 2022 года № 93 «Об утверждении Правил выдачи разрешения на добровольную реорганизацию микрофинансовой организации в форме конвертации в банк, а также перечня документов, необходимых для выдачи разрешения уполномоченного органа на добровольную реорганизацию микрофинансовой организации в форме конвертации в банк, форм заявления для получения разрешения, разрешения уполномоченного органа на конвертацию микрофинансовой организации в банк и форм сведений»
    kaz: «Микроқаржы ұйымын банкке айналдыру нысанында ерікті түрде қайта ұйымдастыруға рұқсат беру қағидаларын, сондай-ақ микроқаржы ұйымын банкке айналдыру нысанында ерікті түрде қайта ұйымдастыруға уәкілетті органның рұқсатын беру үшін қажетті құжаттар тізбесін, микроқаржы ұйымын банкке айналдыруға уәкілетті органның рұқсатын алуға арналған өтініштің, рұқсаттың нысандарын және мәліметтердің нысандарын бекіту туралы» Қазақстан Республикасы Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2022 жылғы 22 қарашадағы № 93 қаулысына өзгерістер енгізу туралы

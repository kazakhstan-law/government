act_code: '173208'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 октября 2022 года № 73. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 октября 2022 года № 30325. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 44 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил заключения договора пенсионного аннуитета со страховой организацией и перевода пенсионных накоплений (выкупной суммы) в страховую организацию, единый накопительный пенсионный фонд по договору пенсионного аннуитета
  kaz: Сақтандыру ұйымымен зейнетақы аннуитеті шартын жасасу және зейнетақы жинақтарын (сатып алу сомасын) зейнетақы аннуитеті шарты бойынша сақтандыру ұйымына, бірыңғай жинақтаушы зейнетақы қорына аудару қағидаларын бекіту туралы

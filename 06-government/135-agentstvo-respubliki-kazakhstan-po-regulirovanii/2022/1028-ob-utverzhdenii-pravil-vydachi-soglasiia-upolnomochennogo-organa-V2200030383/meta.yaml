  title:
    rus: Об утверждении Правил выдачи согласия на назначение (избрание) на должность руководящего работника банка, банковского холдинга, филиала банка – нерезидента Республики Казахстан, страховой (перестраховочной) организации, страхового холдинга, филиала страховой (перестраховочной) организации – нерезидента Республики Казахстан, страхового брокера, филиала страхового брокера – нерезидента Республики Казахстан, единого накопительного пенсионного фонда, добровольного накопительного пенсионного фонда, акционерного общества «Фонд гарантирования страховых выплат», профессионального участника рынка ценных бумаг, включая критерии отсутствия безупречной деловой репутации, документы, необходимые для получения согласия, особенностей по наличию трудового стажа для кандидатов, обладающих профессиональной квалификацией, подтвержденной международными сертификатами, и перечня таких сертификатов
    kaz: Мінсіз іскерлік беделі болмауының өлшемшарттарын, келісім алу үшін қажетті құжаттарды қоса алғанда, банктің, банк холдингінің, Қазақстан Республикасының бейрезидент банкі филиалының, сақтандыру (қайта сақтандыру) ұйымының, сақтандыру холдингінің, Қазақстан Республикасының бейрезидент сақтандыру (қайта сақтандыру) ұйымы филиалының, сақтандыру брокерінің, Қазақстан Республикасының бейрезидент сақтандыру брокері филиалының, бірыңғай жинақтаушы зейнетақы қорының, ерікті жинақтаушы зейнетақы қорының, «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының, бағалы қағаздар нарығына кәсіби қатысушының басшы қызметкері лауазымына тағайындауға (сайлауға) келісім беру қағидаларын,  халықаралық сертификаттармен расталған кәсіби біліктілігі бар кандидаттар үшін еңбек өтілінің болуы бойынша ерекшеліктерді және осындай сертификаттардың тізбесін бекіту туралы

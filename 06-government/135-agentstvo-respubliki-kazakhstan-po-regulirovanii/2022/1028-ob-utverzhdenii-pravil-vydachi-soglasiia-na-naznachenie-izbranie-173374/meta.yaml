  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам регулирования банковской деятельности в сфере оказания государственных услуг
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне мемлекеттік қызметтер көрсету саласында банк қызметін реттеу мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

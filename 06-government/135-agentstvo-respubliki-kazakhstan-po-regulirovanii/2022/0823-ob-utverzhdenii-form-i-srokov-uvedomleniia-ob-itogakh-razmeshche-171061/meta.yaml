act_code: '171061'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 23 августа 2022 года № 58. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 августа 2022 года № 29311
title:
  rus: Об утверждении форм и сроков уведомления об итогах размещения эмиссионных ценных бумаг и (или) производных ценных бумаг, базовым активом которых являются данные ценные бумаги, на территории иностранного государства, а также уведомления об итогах размещения депозитарных расписок или иных ценных бумаг, базовым активом которых являются эмиссионные ценные бумаги организаций-резидентов Республики Казахстан
  kaz: Базалық активі осы бағалы қағаздар болып табылатын эмиссиялық бағалы қағаздарды және (немесе) туынды бағалы қағаздарды шет мемлекеттің аумағында орналастыру қорытындылары туралы хабардар ету, сондай-ақ депозитарлық қолхаттарды немесе базалық активі Қазақстан Республикасының резидент ұйымдарының эмиссиялық бағалы қағаздары болып табылатын өзге де бағалы қағаздарды орналастыру қорытындылары туралы хабардар ету нысандары мен мерзімдерін бекіту туралы

  title:
    rus: О внесении изменений в постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 22 ноября 2022 года № 94 «Об утверждении Правил расчета расчетной суммы по договору образовательного накопительного страхования, расчета и порядка осуществления страховых выплат»
    kaz: «Білім беру жинақтау сақтандыруы шарты бойынша есептеу сомасын есептеу қағидаларын, сақтандыру төлемдерін жүзеге асырудың есептемесі мен тәртібін бекіту туралы» Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының 2022 жылғы 22 қарашадағы № 94 қаулысына өзгерістер енгізу туралы

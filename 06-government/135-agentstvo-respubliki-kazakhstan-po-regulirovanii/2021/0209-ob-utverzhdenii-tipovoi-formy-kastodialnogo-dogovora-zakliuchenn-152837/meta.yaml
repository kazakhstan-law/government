requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 9 февраля 2021 года № 17. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 февраля 2021 года № 22202. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 мая 2023 года № 30 (вводится в действие с 1 июля 2023 года)

act_code: '152832'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 11 февраля 2021 года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 февраля 2021 года № 22200. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 мая 2023 года № 28 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил и сроков передачи пенсионных активов в доверительное управление управляющему инвестиционным портфелем и передачи пенсионных активов от одного управляющего инвестиционным портфелем к другому управляющему инвестиционным портфелем или Национальному Банку Республики Казахстан
  kaz: Зейнетақы активтерін инвестициялық портфельді басқарушыға сенімгерлік басқаруға беру және зейнетақы активтерін бір инвестициялық портфельді басқарушыдан басқа инвестициялық портфельді басқарушыға немесе Қазақстан Республикасының Ұлттық Банкіне беру қағидалары мен мерзімдерін бекіту туралы

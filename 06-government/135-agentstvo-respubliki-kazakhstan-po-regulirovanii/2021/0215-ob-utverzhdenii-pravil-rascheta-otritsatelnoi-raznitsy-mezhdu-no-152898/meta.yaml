act_code: '152898'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 15 февраля 2021 года № 30. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 февраля 2021 года № 22216. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 43 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил расчета отрицательной разницы между номинальной доходностью пенсионных активов, полученной управляющим инвестиционным портфелем, и минимальным значением доходности пенсионных активов, а также Правил и сроков возмещения отрицательной разницы управляющим инвестиционным портфелем за счет собственного капитала
  kaz: Инвестициялық портфельді басқарушы алған зейнетақы активтерінің номиналдық кірістілігі мен зейнетақы активтері кірістілігінің ең аз мәні арасындағы теріс айырманы есептеу қағидаларын, сондай-ақ Инвестициялық портфельді басқарушының теріс айырманы меншікті капиталы есебінен өтеу қағидалары мен мерзімдерін бекіту туралы

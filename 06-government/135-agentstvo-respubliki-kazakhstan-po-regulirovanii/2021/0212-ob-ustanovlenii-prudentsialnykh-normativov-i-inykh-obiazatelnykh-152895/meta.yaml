act_code: '152895'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 февраля 2021 года № 23. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 февраля 2021 года № 22213. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 апреля 2026 года № 73 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении пруденциальных нормативов и иных обязательных к соблюдению норм и лимитов для филиалов банков-нерезидентов Республики Казахстан (в том числе филиалов исламских банков-нерезидентов Республики Казахстан), их нормативных значений и методики расчетов, включая порядок формирования активов филиалов банков-нерезидентов Республики Казахстан (в том числе филиалов исламских банков-нерезидентов Республики Казахстан), принимаемых в качестве резерва, их минимальный размер, а также перечня финансовых инструментов, разрешенных к приобретению за счет активов филиала банка-нерезидента Республики Казахстан, принимаемых в качестве резерва, и порядка их приобретения (реализации)
  kaz: Қазақстан Республикасы бейрезидент-банктері филиалдарының (оның ішінде Қазақстан Республикасы бейрезидент-ислам банктері филиалдарының) резерв ретінде қабылданатын активтерін қалыптастыру тәртібін, олардың ең төмен мөлшерін қоса алғанда, Қазақстан Республикасы бейрезидент-банктерінің филиалдары (оның ішінде Қазақстан Республикасы бейрезидент-ислам банктерінің филиалдары) үшін пруденциялық нормативтерді және сақталуы міндетті өзге де нормалар мен лимиттерді, олардың нормативтік мәндерін және есептеу әдістемесін, сондай-ақ Қазақстан Республикасының бейрезидент-банкі филиалының резерв ретінде қабылданатын активтерінің есебінен сатып алуға рұқсат етілген қаржы құралдарының тізбесін және оларды сатып алу (өткізу) тәртібін белгілеу туралы

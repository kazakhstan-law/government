act_code: '152900'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 февраля 2021 года № 24. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 февраля 2021 года № 22217
title:
  rus: Об утверждении Правил и условий выдачи разрешения на создание страховой (перестраховочной) организации, а также требований к содержанию документов, Правил выдачи разрешения на открытие филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, филиала страхового брокера-нерезидента Республики Казахстан, а также требований к содержанию бизнес-плана, Правил лицензирования страховой (перестраховочной) деятельности и деятельности страхового брокера, а также требований к содержанию  документов, Правил добровольного возврата лицензии на право осуществления страховой (перестраховочной) деятельности
  kaz: Сақтандыру (қайта сақтандыру) ұйымын құруға рұқсат беру қағидаларын және шарттарын, сондай-ақ құжаттардың мазмұнына қойылатын талаптарды, Қазақстан Республикасының бейрезидент сақтандыру (қайта сақтандыру) ұйымының филиалын, Қазақстан Республикасының бейрезидент-сақтандыру брокерінің филиалын ашуға рұқсат беру қағидаларын, сондай-ақ бизнес-жоспардың мазмұнына қойылатын талаптарды, Сақтандыру (қайта сақтандыру) қызметін және сақтандыру брокерінің қызметін лицензиялау қағидаларын, сондай-ақ құжаттардың мазмұнына қойылатын талаптарды, Сақтандыру (қайта сақтандыру) қызметін жүзеге асыру құқығына лицензияны ерікті түрде қайтару қағидаларын бекіту туралы

    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам оказания государственных услуг на страховом рынке и согласования руководящих работников на финансовом рынке
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне сақтандыру нарығында мемлекеттік қызметтер көрсету және қаржы нарығындағы басшы қызметкерлерді келісу мәселелері бойынша өзгерістер енгізу туралы

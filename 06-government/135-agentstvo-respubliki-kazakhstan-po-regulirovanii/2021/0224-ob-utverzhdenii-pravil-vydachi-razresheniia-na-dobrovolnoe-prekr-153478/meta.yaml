act_code: '153478'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 24 февраля 2021 года № 41. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 марта 2021 года № 22283. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 июля 2021 года № 80 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на добровольное прекращение деятельности филиала банка-нерезидента Республики Казахстан, а также возврата депозитов физических лиц, их перевода в банк или филиал банка-нерезидента Республики Казахстан, являющиеся участниками системы обязательного гарантирования депозитов
  kaz: Қазақстан Республикасы бейрезидент-банкі филиалының қызметін ерікті түрде тоқтатуға рұқсат беру, сондай-ақ жеке тұлғалардың депозиттерін қайтару, оларды депозиттерге міндетті кепілдік беру жүйесіне қатысушы болып табылатын банкке немесе Қазақстан Республикасы бейрезидент-банкінің филиалына аудару қағидаларын бекіту туралы

act_code: '152955'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 17 февраля 2021 года № 32. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 февраля 2021 года № 22231
title:
  rus: Об установлении нормативных значений и методик расчетов пруденциальных нормативов филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан, филиала исламской страховой (перестраховочной) организации-нерезидента Республики Казахстан и иных обязательных к соблюдению норм и лимитов, в том числе порядка формирования активов филиала страховой (перестраховочной) организации нерезидента Республики Казахстан, филиала исламской страховой (перестраховочной) организации-нерезидента Республики Казахстан, принимаемых в качестве резерва, и их минимального размера
  kaz: Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының, Қазақстан Республикасы бейрезидент-исламдық сақтандыру (қайта сақтандыру) ұйымы филиалының пруденциялық нормативтерінің және сақталуы міндетті өзге де нормалар мен лимиттердің нормативтік мәндерін және оларды есептеу әдістемелерін, оның ішінде Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының, Қазақстан Республикасы бейрезидент-исламдық сақтандыру (қайта сақтандыру) ұйымы филиалының резерв ретінде қабылданатын активтерін қалыптастыру тәртібін және олардың ең төмен мөлшерін белгілеу туралы

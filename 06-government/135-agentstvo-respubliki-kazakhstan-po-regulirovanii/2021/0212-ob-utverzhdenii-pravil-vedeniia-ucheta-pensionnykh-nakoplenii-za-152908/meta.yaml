act_code: '152908'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 12 февраля 2021 года № 27. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 февраля 2021 года № 22220. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 7 июня 2023 года № 49 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил ведения учета пенсионных накоплений за счет обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов и добровольных пенсионных взносов на индивидуальных пенсионных счетах вкладчиков (получателей)
  kaz: Салымшылардың (алушылардың) жеке зейнетақы шоттарындағы міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары және ерікті зейнетақы жарналары есебінен зейнетақы жинақтарын есепке алуды жүргізу қағидаларын бекіту туралы

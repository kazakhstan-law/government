act_code: '153221'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 1 марта 2021 года № 45. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 марта 2021 года № 22290. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 4 августа 2021 года № 87 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи разрешения на добровольное прекращение деятельности филиала страховой (перестраховочной) организации-нерезидента Республики Казахстан либо отказа в выдаче указанного разрешения
  kaz: Қазақстан Республикасы бейрезидент-сақтандыру (қайта сақтандыру) ұйымы филиалының қызметін ерікті түрде тоқтатуға рұқсат беру не аталған рұқсатты беруден бас тарту қағидаларын бекіту туралы

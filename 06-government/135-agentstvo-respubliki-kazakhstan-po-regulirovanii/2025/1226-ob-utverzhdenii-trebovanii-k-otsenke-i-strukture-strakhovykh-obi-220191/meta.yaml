requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 26 декабря 2025 года № 84. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 декабря 2025 года № 37733
title:
  rus: Об утверждении требований к оценке и структуре страховых обязательств в соответствии с международными стандартами финансовой отчетности, автоматизации их оценки, методике оценки страховых обязательств, порядка и сроков ее согласования
  kaz: Халықаралық қаржылық есептілік стандарттарына сәйкес сақтандыру міндеттемелерін бағалауға және олардың құрылымына, оларды бағалауды автоматтандыруға, сақтандыру міндеттемелерін  бағалау әдістемесіне, оны келісу тәртібі мен мерзімдеріне қойылатын талаптарды бекіту туралы

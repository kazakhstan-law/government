act_code: '217127'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 13 ноября 2025 года № 72
title:
  rus: Об утверждении размеров поправочных коэффициентов, используемых для расчета страховой премии по обязательному страхованию гражданско-правовой ответственности владельцев транспортных средств в соответствии с Законом Республики Казахстан «Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств», на 2026 год
  kaz: «Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру туралы» Қазақстан Республикасының Заңына сәйкес көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру бойынша сақтандыру сыйлықақысын есептеу үшін пайдаланылатын түзету коэффициенттерінің 2026 жылға арналған мөлшерлерін бекіту туралы

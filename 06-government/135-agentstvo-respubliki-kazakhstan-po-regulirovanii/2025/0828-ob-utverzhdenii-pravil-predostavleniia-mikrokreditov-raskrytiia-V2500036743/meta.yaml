requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 августа 2025 года № 51. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 августа 2025 года № 36743. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 15 мая 2026 года № 92 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил предоставления микрокредитов, раскрытия информации и рассмотрения организациями, осуществляющими микрофинансовую деятельность, обращений клиентов, возникающих в процессе предоставления микрокредитов
  kaz: Микроқаржылық қызметті жүзеге асыратын ұйымдардың микрокредиттер беру, ақпаратты жария ету және клиенттердің микрокредиттер беру процесінде туындайтын жолданымдарын қарау қағидаларын бекіту туралы

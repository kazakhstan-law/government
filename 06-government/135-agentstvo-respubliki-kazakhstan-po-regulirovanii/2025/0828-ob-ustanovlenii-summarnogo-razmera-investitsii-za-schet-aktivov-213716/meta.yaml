act_code: '213716'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 28 августа 2025 года № 44. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 августа 2025 года № 36725
title:
  rus: Об установлении суммарного размера инвестиций за счет активов эндаумент-фонда (целевого капитала) в финансовые инструменты (за исключением денег), выпущенные (предоставленные) одним лицом и аффилированными лицами фонда целевого капитала и утверждении Перечня финансовых инструментов, которые могут входить в состав активов эндаумент-фонда (целевого капитала), Правил управления управляющими компаниями (фидуциариями) финансовыми инструментами, которые могут входить в состав активов эндаумент-фонда (целевого капитала), а также Правил расчета и определения стоимости чистых активов и активов эндаумент-фонда (целевого капитала)
  kaz: Эндаумент-қор (нысаналы капитал) активтерінің есебінен нысаналы капитал қорының бір тұлғасы және үлестес тұлғалары шығарған (ұсынған) қаржы құралдарына (ақшаны қоспағанда) инвестициялардың жиынтық мөлшерін белгілеу және Эндаумент-қор (нысаналы капитал) активтерінің құрамына кіруі мүмкін қаржы құралдарының тізбесін, Эндаумент-қор (нысаналы капитал) активтерінің құрамына кіруі мүмкін қаржы құралдарын басқарушы компаниялардың (фидуциарийлердің) басқаруы қағидаларын, сондай-ақ Эндаумент-қордың (нысаналы капиталдың) таза активтері мен активтерінің құнын есептеу және айқындау қағидаларын бекіту туралы

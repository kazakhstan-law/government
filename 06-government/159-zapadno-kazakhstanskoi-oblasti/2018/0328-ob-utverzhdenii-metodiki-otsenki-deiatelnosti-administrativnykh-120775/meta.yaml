  title:
    rus: О внесении изменений в постановление акимата Каратобинского района от 28 марта 2018 года № 36 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Каратобинского района» и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: Қаратөбе ауданы әкімдігінің 2018 жылғы 28 наурыздағы № 36 «Қаратөбе ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

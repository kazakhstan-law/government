act_code: '120775'
requisite: Постановление акимата Каратобинского района Западно-Казахстанской области от 28 марта 2018 года № 36. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 10 апреля 2018 года № 5133. Утратило силу постановлением акимата Каратобинского района Западно-Казахстанской области от 13 июня 2024 года № 104 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Каратобинского района» и районных исполнительных органов финансируемых из местного бюджета
  kaz: «Қаратөбе ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Бокейординского района от 3 апреля 2018 года № 51 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Бокейординского района» и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: Бөкей ордасы ауданы әкімдігінің 2018 жылғы 3 сәуірдегі № 51 «Бөкей ордасы ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

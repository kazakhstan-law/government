    kaz: Орал қаласы әкімдігінің 2018 жылғы 16 наурыздағы № 614 «Орал қаласы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын қалалық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

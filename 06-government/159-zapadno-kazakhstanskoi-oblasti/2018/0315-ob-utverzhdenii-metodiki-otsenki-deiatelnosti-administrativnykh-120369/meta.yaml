  title:
    rus: О внесении изменений в постановление акимата Казталовского района от 15 марта 2018 года №87 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Казталовского района» и районных исполнительных органов финансируемых из местного бюджета»
    kaz: Казталов ауданы әкімдігінің 2018 жылғы 15 наурыздағы №87 «Казталов ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 15 марта 2018 года №57 «Об утверждении регламента государственной услуги «Субсидирование процентной ставки по кредитным и лизинговым обязательствам в рамках направления по финансовому оздоровлению субъектов агропромышленного комплекса»
    kaz: Батыс Қазақстан облысы әкімдігінің 2018 жылғы 15 наурыздағы №57 «Агроөнеркәсіптік кешен субъектілерін қаржылық сауықтыру жөніндегі бағыт шеңберінде кредиттік және лизингтік міндеттемелер бойынша пайыздық мөлшерлемені субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

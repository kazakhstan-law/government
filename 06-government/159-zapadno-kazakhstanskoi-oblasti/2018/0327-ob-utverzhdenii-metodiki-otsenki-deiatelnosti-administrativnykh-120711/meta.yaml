  title:
    rus: О внесении изменений в постановление акимата Жанглинского района от 27 марта 2018 года №68 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Жангалинского района» и районных исполнительных органов финансируемых из местного бюджета»
    kaz: Жаңақала ауданы әкімдігінің 2018 жылғы 27 наурыздағы №68 «Жаңақала ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

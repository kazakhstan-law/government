  title:
    rus: О внесении изменений в постановление акимата Сырымского района от 29 марта 2018 года № 95 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Сырымского района» и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: Сырым ауданы әкімдігінің 2018 жылғы 29 наурыздағы № 95 «Сырым ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

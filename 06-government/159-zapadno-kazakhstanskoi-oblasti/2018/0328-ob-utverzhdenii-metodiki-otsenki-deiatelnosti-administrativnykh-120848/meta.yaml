  title:
    rus: О внесении изменений в постановление акимата Жанибекского района от 28 марта 2018 года № 54 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Жанибекского района» и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: Жәнібек ауданы әкімдігінің 2018 жылғы 28 наурыздағы № 54 «Жәнібек ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

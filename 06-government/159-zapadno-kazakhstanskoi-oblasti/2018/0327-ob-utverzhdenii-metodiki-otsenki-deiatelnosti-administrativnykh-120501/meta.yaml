  title:
    rus: О внесении изменений в постановление акимата Теректинского района от 27 марта 2018 года № 90 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Теректинского района» и районных исполнительных органов, финансируемых из местного бюджета
    kaz: Теректі ауданы әкімдігінің 2018 жылғы 27 наурыздағы № 90 «Теректі ауданы әкімі аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

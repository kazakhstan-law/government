act_code: '120501'
requisite: Постановление акимата Теректинского района Западно-Казахстанской области от 27 марта 2018 года № 90. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 6 апреля 2018 года № 5130. Утратило силу постановлением акимата Теректинского района Западно-Казахстанской области от 17 мая 2023 года № 96 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Теректинского района» и районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Теректі ауданы әкімі аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

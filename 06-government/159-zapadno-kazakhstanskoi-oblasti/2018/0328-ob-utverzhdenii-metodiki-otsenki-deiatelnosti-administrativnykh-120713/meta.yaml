    kaz: «Ақжайық ауданы әкімі аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Ақжайық ауданы әкімдігінің 2018 жылғы        28 наурыздағы №76 қаулысына өзгерістер енгізу туралы

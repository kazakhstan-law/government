  title:
    rus: О внесении изменений в постановление акимата Акжаикского района от 28 марта 2018 года № 76 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Акжаикского района» и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: Ақжайық ауданы әкімдігінің 2018 жылғы 28 наурыздағы № 76 «Ақжайық ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

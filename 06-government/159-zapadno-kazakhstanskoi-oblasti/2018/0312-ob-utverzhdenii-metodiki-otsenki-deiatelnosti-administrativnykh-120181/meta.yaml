  title:
    rus: О внесении изменений постановление акимата Бурлинского района Западно-Казахстанской области от 12 марта 2018 года № 6 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» исполнительных органов Бурлинского района, финансируемых из районного бюджета»
    kaz: Бөрлі ауданы әкімдігінің 2018 жылғы 12 наурыздағы № 6 «Аудандық бюджеттен қаржыландырылатын Бөрлі ауданының атқарушы органдарының "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

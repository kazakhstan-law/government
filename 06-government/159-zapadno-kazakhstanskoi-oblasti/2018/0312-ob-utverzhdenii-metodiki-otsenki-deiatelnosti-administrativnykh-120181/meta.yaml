requisite: Постановление акимата Бурлинского района Западно-Казахстанской области от 12 марта 2018 года № 6. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 30 марта 2018 года № 5104. Утратило силу постановлением акимата Бурлинского района Западно-Казахстанской области от 2 октября 2023 года № 301 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

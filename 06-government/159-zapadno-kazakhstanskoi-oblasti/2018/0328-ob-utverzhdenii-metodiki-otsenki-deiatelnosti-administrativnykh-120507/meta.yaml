  requisite: Постановление акимата района Бәйтерек Западно-Казахстанской области от 29 апреля 2022 года № 167. Утратило силу постановлением акимата района Бәйтерек Западно-Казахстанской области от 20 сентября 2024 года № 414 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Зеленовского района Западно-Казахстанской области от 28 марта 2018 года №210 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Зеленовского района» и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2018 жылғы 28 наурыздағы №210 «Зеленов ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/167163/rus

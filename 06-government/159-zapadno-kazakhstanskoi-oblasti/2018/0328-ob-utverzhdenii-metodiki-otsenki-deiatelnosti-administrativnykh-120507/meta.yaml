act_code: '120507'
requisite: Постановление акимата Зеленовского района Западно-Казахстанской области от 28 марта 2018 года № 210. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 6 апреля 2018 года № 5126. Утратило силу постановлением акимата района Бәйтерек Западно-Казахстанской области от 20 сентября 2024 года № 414 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима района Бәйтерек» и районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Бәйтерек ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 15 марта 2018 года №56 «Об утверждении регламента государственной услуги «Субсидирование ставок вознаграждения при кредитовании, а также лизинге на приобретение сельскохозяйственных животных, техники и технологического оборудования»
    kaz: Батыс Қазақстан облысы әкімдігінің 2018 жылғы 15 наурыздағы №56 «Ауыл шаруашылығы малын, техниканы және технологиялық жабдықты сатып алуға кредит беру, сондай-ақ лизинг кезінде сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

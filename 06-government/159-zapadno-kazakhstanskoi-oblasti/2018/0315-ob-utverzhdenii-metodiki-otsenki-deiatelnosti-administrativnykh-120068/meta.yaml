title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Западно-Казахстанской области» и областных исполнительных органов финансируемых из местного бюджета
  kaz: «Батыс Қазақстан облысы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын облыстық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

act_code: '120426'
requisite: Постановление акимата Чингирлауского района Западно-Казахстанской области от 15 марта 2018 года № 67. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 3 апреля 2018 года № 5115. Утратило силу постановлением акимата Чингирлауского района Западно-Казахстанской области от 17 июня 2024 года № 67 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Чингирлауского района» и районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Шыңғырлау ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Чингирлауского района от 15 марта 2018 года № 67 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Чингирлауского района» и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: Шыңғырлау ауданы әкімдігінің 2018 жылғы 15 наурыздағы № 67 «Шыңғырлау ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменении в постановление акимата Таскалинского района от 27 марта 2018 года № 79 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Таскалинского района» и районных исполнительных органов финансируемых из местного бюджета»
    kaz: Тасқала ауданы әкімдігінің 2018 жылғы 27 наурыздағы № 79 «Тасқала ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

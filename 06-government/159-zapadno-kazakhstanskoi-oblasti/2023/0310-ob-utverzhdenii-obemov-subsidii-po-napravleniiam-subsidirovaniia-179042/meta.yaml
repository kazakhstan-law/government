  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 10 марта 2023 года № 57 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства по Западно-Казахстанской области  на 2023 год»
    kaz: Батыс Қазақстан облысы әкімдігінің 2023 жылғы 10 наурыздағы № 57 «2023 жылға Батыс Қазақстан облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» қаулысына өзгеріс енгізу туралы

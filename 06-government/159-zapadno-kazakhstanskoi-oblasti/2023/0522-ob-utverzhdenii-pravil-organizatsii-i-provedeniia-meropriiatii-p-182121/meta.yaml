act_code: '182121'
requisite: Постановление акимата Бокейординского района Западно-Казахстанской области от 22 мая 2023 года № 63. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 26 мая 2023 года № 7171-07. Утратило силу постановлением акимата Бокейординского района Западно-Казахстанской области от 25 июля 2024 года № 123 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Бокейординского района
  kaz: Бөкей ордасы ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

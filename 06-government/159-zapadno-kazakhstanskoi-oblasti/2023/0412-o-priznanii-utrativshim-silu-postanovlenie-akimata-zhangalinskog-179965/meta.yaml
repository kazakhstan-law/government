act_code: '179965'
requisite: Постановление акимата Жангалинского района Западно-Казахстанской области от 12 апреля 2023 года № 121. Зарегистрировано в Департаменте юстиции Западно-Казахстанской области 19 апреля 2023 года № 7141-07
title:
  rus: О признании утратившим силу постановление акимата Жангалинского района от 27 марта 2018 года № 68 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Жангалинского района» и районных исполнительных органов финансируемых из местного бюджета»
  kaz: Жаңақала ауданы әкімдігінің 2018 жылғы 27 наурыздағы № 68 «Жаңақала ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысының күшін жою деп тану туралы

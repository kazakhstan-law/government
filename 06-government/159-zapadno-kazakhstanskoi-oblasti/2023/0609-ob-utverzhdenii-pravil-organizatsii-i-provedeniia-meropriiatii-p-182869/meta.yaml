act_code: '182869'
requisite: Постановление акимата района Бәйтерек Западно-Казахстанской области от 9 июня 2023 года № 310. Зарегистрирован в Департаменте юстиции Западно-Казахстанской области 13 июня 2023 года № 7209-07. Утратило силу постановлением акимата района Бәйтерек Западно-Казахстанской области от 20 сентября 2024 года № 414 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам района Бәйтерек
  kaz: Бәйтерек ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

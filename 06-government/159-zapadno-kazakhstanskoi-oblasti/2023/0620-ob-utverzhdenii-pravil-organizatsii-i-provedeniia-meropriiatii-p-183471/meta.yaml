act_code: '183471'
requisite: Постановление акимата Сырымского района Западно-Казахстанской области от 20 июня 2023 года № 74. Зарегистрирован в Департаменте юстиции Западно-Казахстанской области 1 июля 2023 года № 7221-07. Утратило силу постановлением акимата Сырымского района Западно-Казахстанской области от 11 октября 2023 года № 148 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Сырымского района
  kaz: Сырым ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объема субсидий на удобрения на 2023 год
  kaz: 2023 жылға тыңайтқыштардың (органикалық тыңайтқыштарды коспағанда) субсидияланатын тыңайтқыштар түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарға арналған субсидиялар көлемін бекіту туралы

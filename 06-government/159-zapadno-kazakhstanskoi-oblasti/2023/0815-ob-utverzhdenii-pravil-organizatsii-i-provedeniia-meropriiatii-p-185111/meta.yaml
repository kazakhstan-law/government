act_code: '185111'
requisite: Постановление акимата Каратобинского района Западно-Казахстанской области от 15 августа 2023 года № 129. Зарегистрирован в Департаменте юстиции Западно-Казахстанской области 17 августа 2023 года № 7230-07
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Каратобинского района
  kaz: Қаратөбе ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Каратобинского района от 15 августа 2023 года № 129 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Каратобинского района»
    kaz: Қаратөбе ауданы әкімдігінің «Қаратөбе ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» 2023 жылғы 15 тамыздағы № 129 қаулысына өзгеріс енгізу туралы

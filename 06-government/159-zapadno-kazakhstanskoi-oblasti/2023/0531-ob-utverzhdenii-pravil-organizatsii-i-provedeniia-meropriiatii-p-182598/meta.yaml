  title:
    rus: О внесении изменений в постановление акимата Теректинского района от 31 мая 2023 года № 107 «Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Теректинского района»
    kaz: «Теректі ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Теректі ауданы әкімдігінің 2023 жылғы 31 мамырдағы № 107 қаулысына өзгерістер енгізу туралы

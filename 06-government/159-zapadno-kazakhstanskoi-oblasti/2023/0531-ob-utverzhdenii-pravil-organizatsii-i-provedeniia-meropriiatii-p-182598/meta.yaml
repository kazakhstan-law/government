act_code: '182598'
requisite: Постановление акимата Теректинского района Западно-Казахстанской области от 31 мая 2023 года № 107. Зарегистрирован в Департаменте юстиции Западно-Казахстанской области 7 июня 2023 года № 7184-07
title:
  rus: Об утверждении правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Теректинского района
  kaz: Теректі ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

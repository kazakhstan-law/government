  title:
    rus: О внесении изменений и дополнений в постановление акимата района Бәйтерек Западно-Казахстанской области от 8 декабря 2023 года № 719 «Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах района Бәйтерек»
    kaz: Батыс Қазақстан облысы Бәйтерек ауданы әкімдігінің «Бәйтерек ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» 2023 жылғы 8 желтоқсандағы № 719 қаулысына өзгерістер мен толықтырулар енгізу туралы

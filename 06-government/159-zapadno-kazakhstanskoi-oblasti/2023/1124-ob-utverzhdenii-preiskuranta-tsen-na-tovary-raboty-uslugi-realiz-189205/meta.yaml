title:
  rus: Об утверждении прейскуранта цен на товары (работы, услуги), реализуемые коммунальным государственным учреждением «Государственный архив Западно-Казахстанской области» управления культуры, развития языков и архивного дела Западно-Казахстанской области
  kaz: Батыс Қазақстан облысының мәдениет, тілдерді дамыту және архив ісі басқармасының «Батыс Қазақстан облысының мемлекеттік архиві» коммуналдық мемлекеттік мекемесімен өткізілетін тауарлардың (жұмыстардың, көрсетілетін қызметтердің) бағалар прейскурантын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Жангалинского района от 1 июня 2023 года № 137 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Жангалинского района»
    kaz: Жаңақала ауданы әкімдігінің «Жаңақала ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» 2023 жылғы 1 маусымдағы № 137 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Таскалинского района от 3 апреля 2023 года № 48 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Таскалинскому району»
    kaz: Тасқала ауданы әкімдігінің «Тасқала ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» 2023 жылғы 3 сәуірдегі № 48 қаулысына өзгерістер енгізу туралы

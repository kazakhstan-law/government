act_code: '183895'
requisite: Постановление акимата Жанибекского района Западно-Казахстанской области от 11 июля 2023 года № 86. Зарегистрирован в Департаменте юстиции Западно-Казахстанской области 13 июля 2023 года № 7223-07. Утратило силу постановлением акимата Жанибекского района Западно-Казахстанской области от 13 сентября 2024 года № 126 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Жанибекского района
  kaz: Жәнібек ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

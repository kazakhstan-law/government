requisite: Постановление акимата Теректинского района Западно-Казахстанской области от 29 марта 2023 года № 73
title:
  rus: Об отмене постановления акимата Теректинского района от 29 марта 2023 года № 64 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Теректинского района» и районных исполнительных органов, финансируемых из местного бюджета»
  kaz: Теректі ауданы әкімдігінің 2023 жылғы 29 наурыздағы № 64 «Теректі ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысы жойылсын

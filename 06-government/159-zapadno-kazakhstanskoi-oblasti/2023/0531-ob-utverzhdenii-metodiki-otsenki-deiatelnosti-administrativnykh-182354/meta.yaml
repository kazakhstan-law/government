requisite: Постановление акимата Теректинского района Западно-Казахстанской области от 31 мая 2023 года № 108
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Теректинского района» и районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Теректі ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

  kaz: Тасқала ауданы әкімдігінің 2023 жылғы 6 маусымдағы № 93 «Тасқала ауданының коммуналдық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін белгілеу туралы» қаулысының күшін жою туралы

requisite: Постановление акимата Чингирлауского района Западно-Казахстанской области от 22 апреля 2026 года № 60
title:
  rus: Об утверждении устава (общего положения) о коммунальном государственном учреждений «Районная централизованная библиотечная система отдела культуры, развития языков, физической культуры и спорта района Шынгырлау Западно-Казахстанской области»
  kaz: «Батыс Қазақстан облысы Шыңғырлау ауданының мәдениет, тілдерді дамыту, дене шынықтыру және спорт бөлімінің аудандық орталықтандырылған кітапхана жүйесі» коммуналдық мемлекеттік мекемесінің жарғысын (жалпы ережесін) бекіту туралы

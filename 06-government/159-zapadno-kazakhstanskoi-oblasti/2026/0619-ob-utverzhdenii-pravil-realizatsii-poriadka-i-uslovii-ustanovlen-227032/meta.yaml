act_code: '227032'
requisite: Постановление акимата Западно-Казахстанской области от 19 июня 2026 года № 147
title:
  rus: Об утверждении Правил реализации порядка и условий установления стимулирующих надбавок к должностным окладам работников государственного коммунального казенного предприятия «Западно-Казахстанская областная академическая филармония имени Г. Курмангалиева Управления культуры, развития языков и архивного дела акимата Западно-Казахстанской области»
  kaz: Батыс Қазақстан облысы әкімдігінің мәдениет, тілдерді дамыту және архив ісі басқармасының «Ғ. Құрманғалиев атындағы Батыс Қазақстан облыстық академиялық филармониясы» мемлекеттік коммуналдық қазыналық кәсіпорны қызметкерлерінің лауазымдық жалақыларына ынталандырушы үстемақылар белгілеу тәртібі мен шарттарын іске асыру қағидаларын бекіту туралы

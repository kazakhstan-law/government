  title:
    rus: О признании утратившим силу постановления акимата Казталовского района от 8 сентября 2026 года № 330 «Об утверждении Правил обеспечения возвратности денег собственниками квартир, нежилых помещений, связанных с ремонтом и заменой лифтов, капитальным ремонтом многоквартирного жилого дома в Казталовском районе»
    kaz: Казталов ауданы әкімдігінің 2026 жылғы 8 қыркүйектегі № 330 «Казталов ауданындағы пәтерлер, тұрғын емес үй-жайлар меншік иелерінің көппәтерлі тұрғын үйде лифтілерді жөндеуге және ауыстыруға, күрделі жөндеуге байланысты ақшаны қайтаруын қамтамасыз ету қағидаларын бекіту туралы» қаулысының күшін жою туралы

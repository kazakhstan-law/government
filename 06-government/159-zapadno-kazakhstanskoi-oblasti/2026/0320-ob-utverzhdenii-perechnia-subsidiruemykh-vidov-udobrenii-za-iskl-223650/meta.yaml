title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений по Западно-Казахстанской области на 2026 год
  kaz: 2026 жылға арналған Батыс Қазақстан облысы бойынша тыңайтқыштардың (органикалық тыңайтқыштарды коспағанда) субсидияланатын түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялардың нормаларын бекіту туралы

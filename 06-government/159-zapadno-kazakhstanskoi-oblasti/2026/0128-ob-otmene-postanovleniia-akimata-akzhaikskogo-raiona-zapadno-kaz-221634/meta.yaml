act_code: '221634'
requisite: Постановление акимата Акжаикского района Западно-Казахстанской области от 28 января 2026 года № 18
title:
  rus: Об отмене постановления акимата Акжаикского района Западно-Казахстанской области от 6 июня 2024 года № 144 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Акжаикского района» и районных исполнительных органов, финансируемых из местного бюджета»
  kaz: Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2024 жылғы 6 маусымдағы «Ақжайық ауданы әкімінің аппараты мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» № 144 қаулысының күшін жою туралы

requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 10 қаңтардағы № 3 қаулысы. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2010 жылғы 15 қаңтарда № 7-1-161 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 23 желтоқсандағы № 3055 қаулысымен

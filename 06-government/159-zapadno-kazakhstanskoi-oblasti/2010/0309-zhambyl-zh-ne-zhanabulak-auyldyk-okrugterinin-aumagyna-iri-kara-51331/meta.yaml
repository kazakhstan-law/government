requisite: Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2010 жылғы 9 наурыздағы № 75 қаулысы. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 12 наурызда № 7-2-89 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2010 жылғы 22 қарашадағы № 340 қаулысымен

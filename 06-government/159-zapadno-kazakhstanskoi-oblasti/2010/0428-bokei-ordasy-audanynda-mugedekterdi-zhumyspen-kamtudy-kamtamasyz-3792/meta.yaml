act_code: '3792'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2010 жылғы 28 сәуірдегі № 92 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 14 маусымда № 7-4-109 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2012 жылғы 30 наурыздағы № 55 қаулысымен

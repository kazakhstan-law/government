requisite: Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 1 қазандағы № 407 қаулысы. Батыс Қазақстан облысы Әділет департаментінде 2010 жылғы 14 қазандағы № 7-7-116 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 28 қазандағы № 439 қаулысымен

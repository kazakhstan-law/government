requisite: Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2010 жылғы 22 қарашадағы № 250 қаулысы. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2010 жылғы 2 желтоқсанда № 7-8-118 тіркелді. Күші жойылды - Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2010 жылғы 13 желтоқсандағы № 265 қаулысымен

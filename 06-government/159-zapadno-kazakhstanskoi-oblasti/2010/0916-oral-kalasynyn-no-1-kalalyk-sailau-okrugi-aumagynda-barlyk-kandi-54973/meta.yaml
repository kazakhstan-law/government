requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 16 қыркүйектегі № 2197 қаулысы. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2010 жылғы 21 қазанда № 7-1-195 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2011 жылғы 17 ақпандағы № 320 қаулысымен

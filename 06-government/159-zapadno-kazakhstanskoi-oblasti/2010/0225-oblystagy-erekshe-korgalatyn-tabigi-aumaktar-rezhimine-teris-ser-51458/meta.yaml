requisite: Батыс Қазақстан облысы әкімдігінің 2010 жылғы 25 ақпандағы № 31 қаулысы. Батыс Қазақстан облысының Әділет департаментінде 2010 жылғы 25 наурызда № 3039 тіркелді. Утратило силу постановлением акимата Западно-Казахстанской области от 7 марта 2025 года № 54 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

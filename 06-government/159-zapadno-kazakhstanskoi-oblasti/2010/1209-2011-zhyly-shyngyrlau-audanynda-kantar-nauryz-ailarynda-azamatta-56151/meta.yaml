act_code: '56151'
requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2010 жылғы 9 желтоқсандағы № 19 қаулысы. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2010 жылғы 23 желтоқсандағы № 7-13-136 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2011 жылғы 1 сәуірдегі № 1 шешімімен

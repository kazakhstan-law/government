act_code: '50820'
requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2010 жылғы 20 қаңтардағы № 12 қаулысы. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2010 жылғы 22 ақпанда № 7-9-92 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2011 жылғы 2 ақпандағы № 33 қаулысымен

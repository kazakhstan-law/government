requisite: Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 19 қазандағы № 421 қаулысы. Батыс Қазақстан облысы Әділет департаментінде 2010 жылғы 27 қазанда № 7-7-118 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 29 қарашадағы № 471 қаулысымен

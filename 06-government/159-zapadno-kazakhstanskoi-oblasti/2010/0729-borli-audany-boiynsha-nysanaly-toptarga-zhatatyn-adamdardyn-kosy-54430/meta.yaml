act_code: '54430'
requisite: Батыс Қазақстан облысы Бөрлі ауданы әкімдігінің 2010 жылғы 29 шілдедегі № 578 қаулысы. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2010 жылғы 3 қыркүйекте № 7-3-101 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі ауданы әкімдігінің 2013 жылғы 20 мамырдағы № 376 қаулысымен

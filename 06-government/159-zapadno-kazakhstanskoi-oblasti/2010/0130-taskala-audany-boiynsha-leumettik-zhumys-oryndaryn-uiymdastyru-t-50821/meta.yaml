act_code: '50821'
requisite: Батыс Қазақстан облысы Тасқала ауданы әкімдігінің 2010 жылғы 30 қаңтардағы № 5 қаулысы. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2010 жылғы 19 ақпанда № 7-11-113 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала ауданы әкімдігінің 2012 жылғы 29 ақпандағы № 49 қаулысымен

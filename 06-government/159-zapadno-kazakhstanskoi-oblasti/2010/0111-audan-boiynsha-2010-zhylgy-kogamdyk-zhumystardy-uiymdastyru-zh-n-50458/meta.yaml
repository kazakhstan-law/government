act_code: '50458'
requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2010 жылғы 11 қаңтардағы № 3 қаулысы. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2010 жылғы 1 ақпанда № 7-9-90 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2011 жылғы 6 қаңтардағы № 23 қаулысымен

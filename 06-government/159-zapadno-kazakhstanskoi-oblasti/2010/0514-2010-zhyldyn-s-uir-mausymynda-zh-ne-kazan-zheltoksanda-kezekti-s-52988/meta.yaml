requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімінің 2010 жылғы 14 мамырдағы № 76 қаулысы. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2010 жылғы 8 маусымда № 7-9-96 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2014 жылғы 9 қазандағы № 149 қаулысымен

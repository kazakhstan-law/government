act_code: '50486'
requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2010 жылғы 28 қаңтардағы N 3 қаулысы. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2010 жылғы 4 ақпанда N 7-13-121 тіркелді. Күші жойылды Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2011 жылғы 5 қаңтардағы N 1 қаулысымен

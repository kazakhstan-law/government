requisite: Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2010 жылғы 19 сәуірдегі № 92 қаулысы. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2010 жылғы 27 мамырда № 7-8-108 тіркелді. Күші жойылды - Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2012 жылғы 6 сәуірдегі № 92 қаулысымен

requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2010 жылғы 4 наурыздағы № 23 қаулысы. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2010 жылғы 8 сәуірде № 7-13-126 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2011 жылғы 5 қаңтардағы № 1 қаулысымен

requisite: Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 27 тамыздағы № 362 қаулысы. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2010 жылғы 3 қыркүйекте № 7-7-115 тіркелді. Күші жойылды Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 15 қыркүйектегі № 395 қаулысымен

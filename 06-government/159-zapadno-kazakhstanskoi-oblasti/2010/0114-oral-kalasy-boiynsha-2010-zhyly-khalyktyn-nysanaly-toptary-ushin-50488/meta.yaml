requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 14 қаңтардағы № 50 қаулысы. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2010 жылғы 3 ақпанда № 7-1-176 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 23 желтоқсандағы № 3055 қаулысымен

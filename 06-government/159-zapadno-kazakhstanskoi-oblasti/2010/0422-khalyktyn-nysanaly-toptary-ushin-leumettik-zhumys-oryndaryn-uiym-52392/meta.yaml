requisite: Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2010 жылғы 22 сәуірдегі № 127 қаулысы. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 14 мамырда № 7-2-91 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2011 жылғы 7 ақпандағы № 42 қаулысымен

requisite: Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 26 мамырдағы № 207 қаулысы. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2010 жылғы 26 мамырда № 7-7-110 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 30 шілдедегі № 301 қаулысымен

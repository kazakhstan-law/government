requisite: Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2010 жылғы 19 наурыздағы № 62 қаулысы. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2010 жылғы 15 сәуірде № 7-5-112 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2010 жылғы 26 мамырдағы № 101 қаулысымен

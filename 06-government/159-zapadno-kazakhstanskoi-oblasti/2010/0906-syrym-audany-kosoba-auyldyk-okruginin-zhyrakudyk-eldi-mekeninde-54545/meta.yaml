requisite: Батыс Қазақстан облысы Сырым ауданы әкімдігінің 2010 жылғы 6 қыркүйектегі № 267 қаулысы. Батыс Қазақстан облысы Сырым ауданы әділет басқармасында 2010 жылғы 17 қыркүйекте № 7-10-90 тіркелді. Күші жойылды - Батыс Қазақстан облысы Сырым ауданы әкімдігінің 2010 жылғы 1 қарашадағы № 328 қаулысымен

act_code: '52556'
requisite: Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2010 жылғы 8 сәуірдегі № 65 қаулысы. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2010 жылғы 11 мамырда № 7-5-116 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2015 жылғы 22 маусымдағы № 147 қаулысымен

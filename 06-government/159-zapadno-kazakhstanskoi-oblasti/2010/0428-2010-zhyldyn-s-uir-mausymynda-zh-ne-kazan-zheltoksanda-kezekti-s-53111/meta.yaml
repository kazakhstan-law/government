act_code: '53111'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2010 жылғы 28 сәуірдегі № 91 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 14 маусымда № 7-4-108 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2011 жылғы 8 ақпандағы № 28 қаулысымен

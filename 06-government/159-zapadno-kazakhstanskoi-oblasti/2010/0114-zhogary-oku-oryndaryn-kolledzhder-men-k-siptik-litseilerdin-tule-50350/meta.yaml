act_code: '50350'
requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 14 қаңтардағы № 95 қаулысы. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2010 жылғы 29 қаңтарда № 7-1-174 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 23 желтоқсандағы № 3055 қаулысымен

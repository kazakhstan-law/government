requisite: Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2010 жылғы 25 ақпандағы № 71 қаулысы. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 12 наурызда № 7-2-88 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2012 жылғы 25 қаңтардағы № 31 қаулысымен

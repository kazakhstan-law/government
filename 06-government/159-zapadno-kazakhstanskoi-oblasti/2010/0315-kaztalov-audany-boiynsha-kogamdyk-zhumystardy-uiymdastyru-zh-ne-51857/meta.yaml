act_code: '51857'
requisite: Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2010 жылғы 15 наурыздағы № 57 қаулысы. Батыс Қазақстан облысы Казталов ауданы Әділет басқармасында 2010 жылғы 19 сәуірде № 7-8-104 тіркелді. Күші жойылды - Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2016 жылғы 22 желтоқсандағы № 380 қаулысымен

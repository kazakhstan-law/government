requisite: Батыс Қазақстан облысы Жәнібек ауданы әкімдігінің 2010 жылғы 24 мамырдағы № 112 қаулысы. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2010 жылғы 27 мамырда № 7-6-105 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек ауданы әкімдігінің 2010 жылғы 8 шілдедегі № 156 қаулысымен

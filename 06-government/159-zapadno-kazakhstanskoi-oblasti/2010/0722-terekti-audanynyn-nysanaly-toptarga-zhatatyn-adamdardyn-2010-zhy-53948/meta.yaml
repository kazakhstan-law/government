act_code: '53948'
requisite: Батыс Қазақстан облысы Теректі ауданы әкімдігінің 2010 жылғы 22 шілдедегі № 208 қаулысы. Батыс Қазақстан облысы Теректі ауданы әділет басқармасында 2010 жылғы 10 тамызда № 7-12-94 тіркелді. Күші жойылды - Батыс Қазақстан облысы Теректі ауданы әкімдігінің 2011 жылғы 11 ақпандағы № 50 қаулысымен

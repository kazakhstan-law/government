act_code: '51335'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2010 жылғы 19 ақпандағы № 24 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 25 наурызда № 7-4-104 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2013 жылғы 8 мамырдағы № 73 қаулысымен

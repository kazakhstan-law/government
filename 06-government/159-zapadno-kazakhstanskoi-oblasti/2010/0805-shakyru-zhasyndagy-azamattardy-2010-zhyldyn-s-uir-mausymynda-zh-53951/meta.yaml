requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 5 тамыздағы № 1785 қаулысы. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2010 жылғы 12 тамызда № 7-1-192 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2011 жылғы 17 наурыздағы № 556 қаулысымен

act_code: '52723'
requisite: Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 26 мамырдағы № 206 қаулысы. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2010 жылғы 26 мамырда № 7-7-109 тіркелді. Күші жойылды Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2014 жылғы 10 қазандағы № 816 қаулысымен

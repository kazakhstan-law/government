act_code: '53984'
requisite: Батыс Қазақстан облысы әкімдігінің 2010 жылғы 28 шілдедегі № 165 қаулысы. Батыс Қазақстан облысының Әділет департаментінде 2010 жылғы 16 тамызда № 3048 тіркелді. Күші жойылды - Батыс Қазақстан облысы әкімдігінің 2020 жылғы 21 желтоқсандағы № 301 (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) қаулысымен
title:

requisite: Постановление акимата Западно-Казахстанской области от 1 февраля 2002 года № 12. Зарегистрировано Управлением юстиции Западно-Казахстанской области 25 февраля 2002 года № 1314. Утратило силу постановлением акимата Западно-Казахстанской области от 28 апреля 2004 года № 124
title:
  rus: Об утверждении Плана мероприятий по реализации задач, поставленных Президентом Республики Казахстан Назарбаевым Н.А. в торжественной речи 16 декабря 2001 года, посвященной празднованию 10-й годовщины независимости Республики Казахстан
  kaz: Қазақстан Республикасының Президенті Н.Ә. Назарбаевтың 2001 жылғы 16 желтоқсанда Қазақстан Республикасы тәуелсіздігінің 10 жылдық мерекесіне арналған салтанатты жиналыста сөйлеген сөзінде алға қойылған міндеттерді іске асыру жөніндегі іс-шаралар Жоспарын бекіту туралы

title:
  rus: Об утверждении Правил реализации порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Батысирригация» Управления природных ресурсов и регулирования природопользования акимата Западно-Казахстанской области
  kaz: Батыс Қазақстан облысы әкімдігі табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Батысирригация» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық жалақыларына ынталандыру үстемақыларын белгілеу тәртібі мен шарттарын іске асыру қағидаларын бекіту туралы

act_code: '215288'
requisite: Постановление акимата Таскалинского района Западно-Казахстанской области от 6 октября 2025 года № 216
title:
  rus: Об отмене постановления акимата Таскалинского района от 17 июля 2023 года № 122 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Таскалинского района» и районных исполнительных органов, финансируемых из местного бюджета»
  kaz: Тасқала ауданы әкімдігінің 2023 жылғы 17 шілдедегі № 122 «Тасқала ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысын жою туралы

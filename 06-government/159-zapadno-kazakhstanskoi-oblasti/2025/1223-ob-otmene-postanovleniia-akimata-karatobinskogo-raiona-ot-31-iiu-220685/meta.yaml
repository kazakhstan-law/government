act_code: '220685'
requisite: Постановление акимата Каратобинского района Западно-Казахстанской области от 23 декабря 2025 года № 209
title:
  rus: Об отмене постановления акимата Каратобинского района от 31 июля 2024 года № 140 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Каратобинского района» и районных исполнительных органов, финансируемых из местного бюджета"
  kaz: Қаратөбе ауданы әкімдігінің 2024 жылғы 31 шілдедегі № 140 «Қаратөбе ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысын жою туралы

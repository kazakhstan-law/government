requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2007 жылғы 15 наурыздағы № 563 қаулысы. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2007 жылғы 3 сәуірде № 7-1-66 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2008 жылғы 10 сәуірдегі № 969 қаулысымен

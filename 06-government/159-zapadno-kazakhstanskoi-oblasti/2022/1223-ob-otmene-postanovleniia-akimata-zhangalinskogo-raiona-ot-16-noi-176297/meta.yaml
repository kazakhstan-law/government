act_code: '176297'
requisite: Постановление акимата Жангалинского района Западно-Казахстанской области от 23 декабря 2022 года № 251
title:
  rus: Об отмене постановления акимата Жангалинского района от 16 ноября 2022 года № 213 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жангалинского района Западно-Казахстанской области»
  kaz: Жаңақала ауданы әкімдігінің 2022 жылғы 16 қарашадағы № 213 «Батыс Қазақстан облысы Жаңақала ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысын жою туралы

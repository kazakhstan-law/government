act_code: '174595'
requisite: Постановление акимата Бокейординского района Западно-Казахстанской области от 21 ноября 2022 года № 150. Отменен постановлением акимата Бокейординского района Западно-Казахстанской области от 28 декабря 2022 года № 165 (вводится в действие со дня подписания)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Бокейординского района Западно-Казахстанской области
  kaz: Батыс Қазақстан облысы Бөкей ордасы ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

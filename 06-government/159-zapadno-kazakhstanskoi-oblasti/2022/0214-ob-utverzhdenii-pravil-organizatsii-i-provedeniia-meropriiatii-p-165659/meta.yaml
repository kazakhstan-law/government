act_code: '165659'
requisite: Постановление акимата Акжаикского района Западно-Казахстанской области от 14 февраля 2022 года № 22. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 марта 2022 года № 27234
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Акжаикскому району
  kaz: Ақжайық ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

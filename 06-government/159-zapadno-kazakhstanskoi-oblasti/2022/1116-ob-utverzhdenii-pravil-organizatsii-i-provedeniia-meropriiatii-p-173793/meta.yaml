act_code: '173793'
requisite: Постановление акимата Жангалинского района Западно-Казахстанской области от 16 ноября 2022 года № 213. Отменен постановлением акимата Жангалинского района Западно-Казахстанской области от 23 декабря 2022 года № 251 (вводится в действие со дня подписания)
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Жангалинского района Западно-Казахстанской области
  kaz: Батыс Қазақстан облысы Жаңақала ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

act_code: '176248'
requisite: Постановление акимата Бокейординского района Западно-Казахстанской области от 28 декабря 2022 года № 165
title:
  rus: Об отмене постановление акимата Бокейординского района от 21 ноября 2022 года № 150 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Бокейординского района Западно-Казахстанской области»
  kaz: Бөкей ордасы ауданы әкімдігінің 2022 жылғы 21 қарашадағы №150 «Батыс Қазақстан облысы Бөкей ордасы ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысын жою туралы

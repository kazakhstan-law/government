act_code: '171524'
requisite: Постановление акимата города Уральска Западно-Казахстанской области от 9 сентября 2022 года № 1645. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 сентября 2022 года № 29555
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Уральск
  kaz: Орал қаласына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

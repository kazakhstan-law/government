  title:
    rus: О внесении изменения в постановление акимата города Уральска от 9 сентября 2022 года № 1645 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Уральск»
    kaz: Орал қаласы әкімдігінің «Орал қаласына бірыңғай сәулеттік келбетті беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» 2022 жылғы 9 қыркүйектегі № 1645 қаулысына өзгеріс енгізу туралы

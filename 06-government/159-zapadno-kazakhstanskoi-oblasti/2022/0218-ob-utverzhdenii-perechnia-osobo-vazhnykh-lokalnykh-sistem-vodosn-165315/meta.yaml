  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 18 февраля 2022 года № 21 «Об утверждении перечня особо важных локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения Западно-Казахстанской области»
    kaz: Батыс Қазақстан облысы әкімдігінің 2022 жылғы 18 ақпандағы № 21 «Батыс Қазақстан облысының ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды оқшау жүйелерінің тізбесін бекіту туралы» қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Жангалинского района от 28 января 2022 года № 8 «Об утверждении наименований и индексов автомобильных дорог общего пользования районного значения по Жангалинскому району»
    kaz: Жаңақала ауданы әкімдігінің «Жаңақала ауданы бойынша жалпыға ортақ пайдаланылатын аудандық маңызы бар автомобиль жолдарының атаулары мен индекстерін бекіту туралы» 2022 жылғы 28 қаңтардағы № 8 қаулысына өзгерістер енгізу туралы

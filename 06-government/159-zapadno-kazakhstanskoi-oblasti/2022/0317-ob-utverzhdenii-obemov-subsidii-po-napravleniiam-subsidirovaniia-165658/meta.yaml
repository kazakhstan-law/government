  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 17 марта 2022 года № 38 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства по Западно-Казахстанской области на 2022 год»
    kaz: Батыс Қазақстан облысы әкімдігінің 2022 жылғы 17 наурыздағы № 38 «2022 жылға Батыс Қазақстан облысы бойынша асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялау туралы» қаулысына өзгеріс енгізу туралы

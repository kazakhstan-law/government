  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 23 мая 2022 года № 91 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера родительской платы по Западно-Казахстанской области»

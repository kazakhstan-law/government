    kaz: Батыс Қазақстан облысы әкімдігінің 2022 жылғы 23 мамырдағы № 91 «Батыс Қазақстан облысы бойынша мектепке дейiнгi тәрбие мен оқытуға мемлекеттiк бiлiм беру тапсырысын, ата-ана төлемақысының мөлшерін бекiту туралы» қаулысына өзгерістер енгізу туралы

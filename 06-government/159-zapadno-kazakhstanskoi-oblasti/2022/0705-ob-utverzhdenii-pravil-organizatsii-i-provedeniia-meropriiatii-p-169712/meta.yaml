  title:
    rus: О внесении изменений в постановление акимата Бурлинского района от 5 июля 2022 года № 237 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровель многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Аксай Бурлинского района»
    kaz: Бөрлі ауданы әкімдігінің «Бөрлі ауданының Ақсай қаласына бірыңғай сәулет келбетін беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидалары бекіту туралы» 2022 жылғы 5 шілдедегі № 237 қаулысына өзгерістер енгізу туралы

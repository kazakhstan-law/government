requisite: Постановление акимата Таскалинского района Западно-Казахстанской области от 31 мая 2012 года № 121. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 20 июня 2012 года № 7-11-168. Утратило силу - постановлением акимата Таскалинского района Западно-Казахстанской области от 7 марта 2013 года № 67
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сандай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшiн және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшiн жұмыс орындарына квота белгiлеу туралы

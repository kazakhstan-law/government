    kaz: Батыс Қазақстан облысы әкімдігінің «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту туралы» 2012 жылғы 11 қыркүйектегі № 166 қаулысына өзгеріс енгізу туралы

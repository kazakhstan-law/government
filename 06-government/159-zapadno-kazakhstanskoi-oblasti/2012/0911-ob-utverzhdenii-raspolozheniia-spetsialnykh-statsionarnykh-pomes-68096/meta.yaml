  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 11 сентября 2012 года № 166 «Об утверждении расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения»
    kaz: Батыс Қазақстан облысы әкімдігінің 2012 жылғы 11 қыркүйектегі № 166 «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың орналастырылуын бекіту туралы» қаулысына өзгеріс енгізу туралы

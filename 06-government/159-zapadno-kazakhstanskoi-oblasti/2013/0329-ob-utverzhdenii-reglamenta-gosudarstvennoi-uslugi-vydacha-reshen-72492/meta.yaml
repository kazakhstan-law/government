requisite: Постановление акимата Западно-Казахстанской области от 29 марта 2013 года № 45. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 8 мая 2013 года № 3289. Утратило силу постановлением акимата Западно-Казахстанской области от 15 января 2014 года № 1
title:
  rus: Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений) и определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения) по согласованию с уполномоченным органом в сфере религиозной деятельности"
  kaz: '"Дін қызметі саласындағы уәкілетті органмен келісім бойынша ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік қызмет регламентiн бекіту туралы'

requisite: Постановление акимата Бокейординского района Западно-Казахстанской области от 6 марта 2013 года № 49. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 18 апреля 2013 года № 3258. Утратило силу постановлением акимата Бокейординского района Западно-Казахстанской области от 3 июня 2013 года № 102
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешения на размещение наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования районного значения, а также в населенных пунктах"
  kaz: '"Аудандық маңызы бар жалпы пайдаланымдағы, сондай-ақ елді мекендердегі автомобиль жолдарының жолақ бөлігінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру" мемлекеттік қызмет регламентін бекіту туралы'

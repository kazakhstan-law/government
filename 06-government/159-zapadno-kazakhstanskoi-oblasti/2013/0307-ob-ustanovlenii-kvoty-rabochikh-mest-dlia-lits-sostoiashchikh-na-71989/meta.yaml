requisite: Постановление акимата Таскалинского района Западно-Казахстанской области от 7 марта 2013 года № 67. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 12 апреля 2013 года № 3247. Утратило силу постановлением акимата Таскалинского района Западно-Казахстанской области от 29 января 2014 года № 27
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшiн және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшiн жұмыс орындарына квота белгiлеу туралы

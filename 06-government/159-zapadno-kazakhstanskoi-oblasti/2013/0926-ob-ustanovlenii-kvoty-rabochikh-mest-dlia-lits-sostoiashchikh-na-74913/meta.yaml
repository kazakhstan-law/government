requisite: Постановление акимата Бурлинского района Западно-Казахстанской области от 26 сентября 2013 года № 974. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 23 октября 2013 года № 3350. Утратило силу постановлением акимата Бурлинского района Западно-Казахстанской области от 8 августа 2016 года № 486
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а так же лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

act_code: '71803'
requisite: Постановление акимата Теректинского района Западно-Казахстанской области от 1 марта 2013 года № 64. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2013 года № 3228. Утратило силу постановлением акимата Теректинского района Западно-Казахстанской области от 11 декабря 2013 года № 391
title:
  rus: Об утверждении регламента оказания государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтiк қолдау шараларын ұсыну" мемлекеттiк қызмет көрсету регламентiн бекiту туралы'

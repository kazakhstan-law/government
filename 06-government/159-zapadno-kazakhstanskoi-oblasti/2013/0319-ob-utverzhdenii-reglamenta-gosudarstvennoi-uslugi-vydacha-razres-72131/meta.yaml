act_code: '72131'
requisite: Постановление акимата Таскалинского района Западно-Казахстанской области от 19 марта 2013 года № 72. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 22 апреля 2013 года № 3265. Утратило силу постановлением акимата Таскалинского района Западно-Казахстанской области от 20 мая 2013 года № 145
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешения на размещение наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах"
  kaz: '"Облыстық және аудандық маңызы бар жалпы пайдаланымдағы, сондай-ақ елді-мекендердегі автомобиль жолдарының жолақ бөлігінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру" мемлекеттік қызмет регламентін бекіту туралы'

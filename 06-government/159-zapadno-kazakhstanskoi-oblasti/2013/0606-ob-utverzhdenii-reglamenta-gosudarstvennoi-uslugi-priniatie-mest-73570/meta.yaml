act_code: '73570'
requisite: Постановление акимата Западно-Казахстанской области от 6 июня 2013 года № 103. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 18 июля 2013 года № 3313. Утратило силу постановлением акимата Западно-Казахстанской области от 15 января 2014 года № 1
title:
  rus: Об утверждении регламента государственной услуги "Принятие местным исполнительным органом области решения по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
  kaz: '"Облыстық жергілікті атқарушы органының жануарлар дүниесін пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін бекітіп беру мен аңшылық және балық шаруашылықтарының қажеттіліктері үшін сервитуттарды белгілеу жөнінде шешімдер қабылдауы" мемлекеттік қызмет регламентін бекіту туралы'

title:
  rus: Об утверждении регламента государственной услуги "Прием документов для предоставления бесплатного подвоза к общеобразовательным организациям и обратно домой детям, проживающим в отдаленных сельских пунктах"
  kaz: '"Шалғайдағы ауылдық елді мекендерде тұратын балаларды жалпы білім беру ұйымдарына және үйлеріне кері тегін тасымалдауды ұсыну үшін құжаттар қабылдау" мемлекеттік қызмет регламентін бекіту туралы'

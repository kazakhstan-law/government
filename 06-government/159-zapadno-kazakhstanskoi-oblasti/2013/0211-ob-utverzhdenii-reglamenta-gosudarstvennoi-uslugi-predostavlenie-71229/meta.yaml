act_code: '71229'
requisite: Постановление акимата Казталовского района Западно-Казахстанской области от 11 февраля 2013 года № 44. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 1 марта 2013 года № 3193. Утратило силу постановлением акимата Казталовского района Западно-Казахстанской области от 3 июня 2013 года № 158
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтiк қолдау шараларын ұсыну" мемлекеттiк қызмет регламентiн бекiту туралы'

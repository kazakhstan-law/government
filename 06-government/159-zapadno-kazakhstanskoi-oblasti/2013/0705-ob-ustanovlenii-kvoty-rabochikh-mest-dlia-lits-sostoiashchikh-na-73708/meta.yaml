act_code: '73708'
requisite: Постановление акимата Жанибекского района Западно-Казахстанской области от 5 июля 2013 года № 119. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 26 июля 2013 года № 3330. Утратило силу постановлением акимата Жанибекского района Западно-Казахстанской области от 27 июля 2016 года № 183
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар үшiн, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшiн және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшiн жұмыс орындарына квота белгiлеу туралы

requisite: Постановление акимата Западно-Казахстанской области от 6 июня 2013 года № 101. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 15 июля 2013 года № 3309. Утратило силу постановлением акимата Западно-Казахстанской области от 15 января 2014 года № 1
title:
  rus: 'Об утверждении регламента государственной услуги "Присвоение спортивных разрядов и категорий: второй и третий, первый, второй и третий юношеские, тренер высшего и среднего уровня квалификации второй категории, инструктор-спортсмен высшего уровня квалификации второй категории, методист высшего и среднего уровня квалификации второй категории, судья по спорту"'
  kaz: '"Екiншi және үшiншi, жасөспiрiмдер арасындағы бiрiншi, екiншi және үшiншi, біліктiлiгi жоғары және орта деңгейдегi екiншi санатты жаттықтырушы, біліктiлiгi жоғары деңгейдегi екiншi санатты нұсқаушы-спортшы, біліктiлiгi жоғары және орта деңгейдегi екiншi санатты әдiскер, спорт төрешiсi спорттық разрядтары мен санаттарын беру" мемлекеттік қызмет регламентін бекіту туралы'

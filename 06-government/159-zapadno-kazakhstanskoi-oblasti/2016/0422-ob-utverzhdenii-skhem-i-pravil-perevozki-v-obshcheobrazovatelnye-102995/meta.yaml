  title:
    rus: О внесении изменения в постановление акимата Жанибекского района от 22 апреля 2016 года № 82 «Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Жанибекского района»
    kaz: Жәнібек ауданы әкімдігінің 2016 жылғы 22 сәуірдегі № 82 «Жәнібек ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

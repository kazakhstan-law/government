act_code: '105837'
requisite: Постановление акимата Бурлинского района Западно-Казахстанской области от 8 августа 2016 года № 486. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 29 августа 2016 года № 4533. Утратило силу постановлением акимата Бурлинского района Западно-Казахстанской области от 14 декабря 2018 года № 30
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы и для граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Бурлинскому району
  kaz: Бөрлі ауданы бойынша пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

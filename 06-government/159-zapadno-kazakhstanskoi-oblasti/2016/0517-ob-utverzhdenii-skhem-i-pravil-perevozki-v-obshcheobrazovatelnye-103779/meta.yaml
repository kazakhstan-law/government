  title:
    rus: О внесении изменений в постановление акимата Таскалинского района от 17 мая 2016 года №112 «Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Таскалинского района»
    kaz: Тасқала ауданы әкімдігінің 2016 жылғы 17 мамырдағы №112 «Тасқала ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

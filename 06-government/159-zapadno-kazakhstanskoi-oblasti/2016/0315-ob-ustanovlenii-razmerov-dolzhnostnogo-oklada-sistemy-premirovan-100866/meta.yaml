requisite: Постановление акимата Западно-Казахстанской области от 15 марта 2016 года № 65. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 29 марта 2016 года № 4308. Утратило силу постановлением акимата Западно-Казахстанской области от 24 ноября 2023 года № 285 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении размеров должностного оклада, системы премирования и иного вознаграждения руководителя, его заместителей и главного бухгалтера медицинских организаций Западно-Казахстанской области, имеющих статус государственных коммунальных предприятий на праве хозяйственного ведения
  kaz: Батыс Қазақстан облысының шаруашылық жүргізу құқығындағы мемлекеттік коммуналдық кәсіпорындар мәртебесі бар медициналық ұйымдары басшысының, оның орынбасарларының және бас бухгалтерiнiң лауазымдық жалақысының мөлшерлерiн, оларға сыйлықақы және өзге де сыйақы беру жүйесiн белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 15 марта 2016 года № 65 «Об установлении размеров должностного оклада, системы премирования и иного вознаграждения руководителя, его заместителей и главного бухгалтера медицинских организаций Западно-Казахстанской области, имеющих статус государственных коммунальных предприятий на праве хозяйственного ведения»
    kaz: Батыс Қазақстан облысы әкімдігінің 2016 жылғы 15 наурыздағы № 65 «Батыс Қазақстан облысының шаруашылық жүргізу құқығындағы мемлекеттік коммуналдық кәсіпорындар мәртебесі бар медициналық ұйымдары басшысының, оның орынбасарларының және бас бухгалтерiнiң лауазымдық жалақысының мөлшерлерiн, оларға сыйлықақы және өзге де сыйақы беру жүйесiн белгілеу туралы» қаулысына өзгеріс енгізу туралы

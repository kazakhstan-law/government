act_code: '101157'
requisite: Постановление акимата Зеленовского района Западно-Казахстанской области от 26 февраля 2016 года № 175. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 29 марта 2016 года № 4311. Утратило силу постановлением акимата Зеленовского района Западно-Казахстанской области от 10 марта 2017 года № 117
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса "Б" государственного учреждения "Аппарат акима Зеленовского района" и районных исполнительных органов, финансируемых из местного бюджета
  kaz: '"Зеленов ауданы әкімінің аппараты" мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы'

requisite: Постановление акимата Таскалинского района Западно-Казахстанской области от 14 июня 2016 года № 165. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 7 июля 2016 года № 4463. Утратило силу постановлением акимата Таскалинского района Западно-Казахстанской области от 29 декабря 2018 года № 387
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершенолетия без попечения родителей,являющихся выпускниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтар үшін жұмыс орындарына квота белгілеу туралы

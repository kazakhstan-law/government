  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 26 января 2016 года №18 «Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования по Западно-Казахстанской области»
    kaz: Батыс Қазақстан облысы әкімдігінің 2016 жылғы 26 қаңтардағы №18 «Батыс Қазақстан облысы бойынша мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/122914/rus

act_code: '99891'
requisite: Постановление акимата Западно-Казахстанской области от 26 января 2016 года № 18. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 29 февраля 2016 года № 4274. Утратило силу постановлением акимата Западно-Казахстанской области от 1 июня 2020 года № 120 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение)  квалификационных категорий педагогическим  работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального,  послесреднего образования по Западно-Казахстанской области»
  kaz: «Батыс Қазақстан облысы бойынша мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта,  жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын  іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

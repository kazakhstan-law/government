requisite: Постановление акимата Жангалинского района Западно-Казахстанской области от 10 марта 2016 года № 58. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 апреля 2016 года № 4335. Утратило силу постановлением акимата Жангалинского района Западно-Казахстанской области от 19 мая 2017 года № 117
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Акима Жангалинского района» и районных исполнительных органов финансируемых из местного бюджета
  kaz: «Жаңақала ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

requisite: Постановление акимата Бокейординского района Западно-Казахстанской области от 5 марта 2016 года № 48. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 апреля 2016 года № 4336. Утратило силу постановлением акимата Бокейординского района Западно-Казахстанской области от 26 апреля 2017 года № 59
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Бокейординского района» и районных исполнительных органов финансируемых из местного бюджета
  kaz: «Бөкей ордасы ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

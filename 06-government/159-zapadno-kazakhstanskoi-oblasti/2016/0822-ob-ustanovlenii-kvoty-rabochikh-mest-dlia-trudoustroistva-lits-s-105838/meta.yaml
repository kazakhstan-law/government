act_code: '105838'
requisite: Постановление акимата Каратобинского района Западно-Казахстанской области от 22 августа 2016 года № 140. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 5 сентября 2016 года № 4546. Утратило силу постановлением акимата Каратобинского района Западно-Казахстанской области от 23 августа 2019 года № 96
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы и для граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Каратобинскому району
  kaz: Қаратөбе ауданы бойынша пробация қызметінің есебінде тұрған адамдарды, сондай – ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата – анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

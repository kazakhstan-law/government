requisite: Постановление акимата Казталовского района Западно-Казахстанской области от 22 апреля 2016 года № 131. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 23 мая 2016 года № 4426. Утратило силу постановлением акимата Казталовского района Западно-Казахстанской области от 7 марта 2017 года № 64
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Казталовского района», районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Казталов ауданы әкімі аппараты» мемлекеттік мекемесінің, жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

    kaz: Бөрлі ауданы әкімдігінің 2016 жылғы 25 ақпандағы №146 «Бөрлі ауданы әкімі аппаратының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Жанибекского района Западно-Казахстанской области от 26 февраля 2016 года № 43. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 1 апреля 2016 года № 4316. Утратило силу постановлением акимата Жанибекского района Западно-Казахстанской области от 10 марта 2017 года № 35
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Жанибекского района» и районных исполнительных органов финансируемых из местного бюджета
  kaz: «Жәнібек ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

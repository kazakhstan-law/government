requisite: Постановление акимата Бокейординского района Западно-Казахстанской области от 21 июня 2016 года № 107. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 19 июля 2016 года № 4481. Утратило силу постановлением акимата Бокейординского района Западно-Казахстанской области от 26 апреля 2017 года № 58
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы и для граждан из числа молодежи, потерявших или оставшихся до наступления совершенолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата- анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

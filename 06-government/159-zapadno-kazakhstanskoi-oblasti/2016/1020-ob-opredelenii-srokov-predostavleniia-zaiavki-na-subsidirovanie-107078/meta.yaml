act_code: '107078'
requisite: Постановление акимата Чингирлауского района Западно-Казахстанской области от 20 октября 2016 года № 148. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 21 октября 2016 года № 4588. Утратило силу постановлением акимата Чингирлауского района Западно-Казахстанской области от 23 февраля 2017 года № 32
title:
  rus: Об определении сроков предоставления заявки на субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2016 год по Чингирлаускому району
  kaz: Шыңғырлау ауданы бойынша 2016 жылға басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өндеп өсіру шығындарының құнын субсидиялауға арналған өтінімді ұсыну мерзімдерін айқындау туралы

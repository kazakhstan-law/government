requisite: Постановление акимата Зеленовского района Западно-Казахстанской области от 19 июля 2016 года № 545. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 22 июля 2016 года № 4490. Утратило силу постановлением акимата района Бәйтерек Западно-Казахстанской области от 17 апреля 2019 года № 290
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы и для граждан  из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ  бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

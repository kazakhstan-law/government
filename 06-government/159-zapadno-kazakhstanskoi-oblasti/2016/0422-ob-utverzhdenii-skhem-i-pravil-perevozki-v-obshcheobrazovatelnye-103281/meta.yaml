  title:
    rus: О внесении изменения в постановление акимата Казталовского района Западно-Казахстанской области от 22 апреля 2016 года №132 «Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Казталовского района»
    kaz: Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2016 жылғы 22 сәуірдегі №132 «Казталов ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменении в постановление акимата Зеленовского района от 3 июня 2016 года № 425 «Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Зеленовского района»
    kaz: Зеленов ауданы әкімдігінің 2016 жылғы 3 маусымдағы № 425 «Зеленов ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

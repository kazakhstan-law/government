requisite: Постановление акимата города Уральска Западно-Казахстанской области от 25 февраля 2016 года № 470. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 29 марта 2016 года № 4307. Утратило силу постановлением акимата города Уральска Западно-Казахстанской области от 24 марта 2017 года № 874
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Уральска» и городских исполнительных органов финансируемых из местного бюджета
  kaz: «Орал қаласы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын қалалық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

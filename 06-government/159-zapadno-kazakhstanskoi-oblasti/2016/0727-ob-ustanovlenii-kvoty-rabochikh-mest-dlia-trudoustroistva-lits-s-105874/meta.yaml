requisite: Постановление акимата Жанибекского района Западно-Казахстанской области от 27 июля 2016 года № 183. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 17 августа 2016 года № 4519. Утратило силу постановлением акимата Жанибекского района Западно-Казахстанской области от 3 июня 2019 года № 108
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы и для граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпусниками организаций образования
  kaz: Пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

act_code: '106887'
requisite: Постановление акимата Зеленовского района Западно-Казахстанской области от 27 сентября 2016 года № 677. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 10 октября 2016 года № 4567. Утратило силу постановлением акимата Зеленовского района Западно-Казахстанской области от 23 июня 2017 года № 349
title:
  rus: Об определении сроков предоставления заявки на субсидирования повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2016 год по Зеленовскому району
  kaz: Зеленов ауданы бойынша 2016 жылға басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын субсидиялауға арналған өтінімді ұсыну мерзімдерін айқындау туралы

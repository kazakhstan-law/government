act_code: '99961'
requisite: Постановление акимата Казталовского района Западно-Казахстанской области от 15 января 2016 года № 19
title:
  rus: Об утрате силы постановления акимата района от 19 марта 2015 года № 90 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2015 год»
  kaz: Аудан әкімдігінің 2015 жылғы 19 наурыздағы «2015 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» № 90 қаулысының күшін жою туралы

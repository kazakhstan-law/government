act_code: '107382'
requisite: Постановление акимата Сырымского района Западно-Казахстанской области от 28 октября 2016 года № 410. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 8 ноября 2016 года № 4596. Утратило силу постановлением акимата Сырымского района Западно-Казахстанской области от 23 января 2019 года № 31
title:
  rus: Об определении сроков предоставления заявки на субсидирования повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2016 год по Сырымскому району
  kaz: Сырым ауданы бойынша 2016 жылға басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын субсидиялауға арналған өтінімді ұсыну мерзімдерін айқындау туралы

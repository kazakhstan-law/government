requisite: Постановление акимата Теректинского района Западно-Казахстанской области от 16 мая 2016 года № 142. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 июня 2016 года № 4445. Утратило силу постановлением акимата Теректинского района Западно-Казахстанской области от 28 февраля 2017 года № 46
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса "Б" государственного учреждения "Аппарат акима Теректинского района" и районных исполнительных органов финансируемых из местного бюджета
  kaz: '"Теректі ауданы әкімінің аппараты" мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы'

requisite: Постановление акимата Сырымского района Западно-Казахстанской области от 12 апреля 2016 года № 128. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 5 мая 2016 года № 4385. Утратило силу постановлением акимата Сырымского района Западно-Казахстанской области от 13 марта 2017 года № 83 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Сырымского района» и районных исполнительных органов финансируемых из местного бюджета
  kaz: «Сырым ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы  мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

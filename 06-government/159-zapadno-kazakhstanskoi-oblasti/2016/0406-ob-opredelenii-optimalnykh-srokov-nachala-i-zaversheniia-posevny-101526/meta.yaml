title:
  rus: Об определении оптимальных сроков начала и завершения посевных работ по видам продукции растениеводства, подлежащих обязательному страхованию в растениеводстве на 2016 год по Зеленовскому району
  kaz: Зеленов ауданы бойынша 2016 жылға өсімдік шаруашылығындағы міндетті сақтандыруға жататын өсімдік шаруашылығы өнімінің түрлері бойынша егіс жұмыстарының басталуы мен аяқталуының оңтайлы мерзімдерін белгілеу туралы

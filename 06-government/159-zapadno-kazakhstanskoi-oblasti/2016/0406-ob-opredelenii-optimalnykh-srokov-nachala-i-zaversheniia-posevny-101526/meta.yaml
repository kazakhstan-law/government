  title:
    rus: О внесении изменения в постановление акимата Зеленовского района от 6 апреля 2016 года № 244 «Об определении оптимальных сроков начала и завершения посевных работ по видам продукции растениеводства, подлежащие обязательному страхованию в растениеводстве на 2016 год по Зеленовскому району»
    kaz: Зеленов ауданы әкімдігінің 2016 жылғы 6 сәуірдегі № 244 «Зеленов ауданы бойынша 2016 жылға өсiмдiк шаруашылығындағы мiндеттi сақтандыруға жататын өсiмдiк шаруашылығы өнiмiнiң түрлері бойынша егiс жұмыстарының басталуы мен аяқталуының оңтайлы мерзiмдерiн белгілеу туралы» қаулысына өзгеріс енгізу туралы

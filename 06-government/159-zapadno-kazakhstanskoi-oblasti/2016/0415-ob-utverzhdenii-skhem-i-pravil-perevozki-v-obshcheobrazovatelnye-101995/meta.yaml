  title:
    rus: О внесении изменения в постановление акимата Каратобинского района от 15 апреля 2016 года № 63 «Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Каратобинского района»
    kaz: Қаратөбе ауданы әкімдігінің 2016 жылғы 15 сәуірдегі № 63 «Қаратөбе ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

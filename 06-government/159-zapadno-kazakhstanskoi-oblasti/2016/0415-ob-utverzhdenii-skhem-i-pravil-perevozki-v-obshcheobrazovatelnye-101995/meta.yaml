title:
  rus: Об утверждении схем и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Каратобинского района
  kaz: Қаратөбе ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы

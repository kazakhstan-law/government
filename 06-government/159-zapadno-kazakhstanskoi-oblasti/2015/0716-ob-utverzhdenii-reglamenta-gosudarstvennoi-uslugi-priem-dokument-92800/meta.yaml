title:
  rus: Об утверждении регламента государственной услуги «Прием документов для участия в конкурсе на замещение руководителей государственных учреждений среднего образования»
  kaz: «Мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурсына қатысу үшін құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

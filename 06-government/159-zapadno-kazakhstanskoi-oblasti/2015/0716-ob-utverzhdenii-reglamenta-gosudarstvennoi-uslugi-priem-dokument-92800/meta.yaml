  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 16 июля 2015 года №172 «Об утверждении регламентов государственных услуг по приему документов для участия в конкурсах на присуждение звания «Лучший педагог» и на замещение руководителей государственных учреждений среднего образования по Западно-Казахстанской области»
    kaz: Батыс Қазақстан облысы әкімдігінің 2015 жылғы 16 шілдедегі №172 «Батыс Қазақстан облысы бойынша «Үздік педагог» атағын беру және мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурстарына қатысу үшін құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/122918/rus

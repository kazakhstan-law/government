  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 7 июля 2015 года № 168 «Об утверждении регламентов государственных услуг, оказываемых местными исполнительными органами в сфере предоставления дополнительного образования для детей и проведения конкурса на присуждения гранта «Лучшая организация среднего образования» по Западно-Казахстанской области
    kaz: Батыс Қазақстан облысы әкімдігінің 2015 жылғы 7 шілдедегі № 168 «Батыс Қазақстан облысы бойынша балаларға қосымша білім беру және «Орта білім беретін үздік ұйым» грантын тағайындау конкурсын өткізу саласында жергілікті атқарушы органдармен көрсетілетін мемлекеттік қызметтер регламенттерін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/132644/rus

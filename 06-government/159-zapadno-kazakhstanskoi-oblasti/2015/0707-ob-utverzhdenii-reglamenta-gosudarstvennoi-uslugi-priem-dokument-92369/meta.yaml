title:
  rus: Об утверждении регламента государственной услуги «Прием документов и зачисление в организации дополнительного образования для детей по предоставлению им дополнительного образования»
  kaz: «Балаларға қосымша білім беру бойынша қосымша білім беру ұйымдарына құжаттар қабылдау және оқуға қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

title:
  rus: О признании утратившим силу постановление акимата района от 14 июля 2015 года №237 «Об утверждении схемы и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Сырымского района»
  kaz: Аудан әкімдігінің 2015 жылғы 14 шілдедегі №237 «Сырым ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен қағидаларын бекіту туралы» қаулысының күшін жою туралы

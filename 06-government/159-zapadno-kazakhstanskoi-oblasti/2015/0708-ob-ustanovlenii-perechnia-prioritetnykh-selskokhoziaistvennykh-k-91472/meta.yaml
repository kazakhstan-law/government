act_code: '91472'
requisite: Постановление акимата Западно-Казахстанской области от 8 июля 2015 года № 170. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 июля 2015 года № 3947. Утратило силу постановлением акимата Западно-Казахстанской области от 8 декабря 2015 года № 349
title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и нормы субсидий (на 1 гектар) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым ауыл шаруашылығы дақылдардың тізбесін және басым дақылдар өндіруді субсидиялау арқылы өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруға, жанар-жағармай материалдары мен көктемгi егіс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын (1 гектарға) белгілеу туралы

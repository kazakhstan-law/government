act_code: '92705'
requisite: Постановление акимата Западно-Казахстанской области от 7 июля 2015 года № 165. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 августа 2015 года № 3984. Утратило силу постановлением акимата Западно-Казахстанской области от 28 августа 2020 года № 201 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде»
  kaz: «Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

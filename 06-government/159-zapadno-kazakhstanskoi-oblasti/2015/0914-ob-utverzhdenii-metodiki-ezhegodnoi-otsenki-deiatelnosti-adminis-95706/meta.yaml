requisite: Постановление акимата Западно-Казахстанской области от 14 сентября 2015 года № 257. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 октября 2015 года № 4090. Утратило силу постановлением акимата Западно-Казахстанской области от 9 февраля 2016 года № 24
title:
  rus: Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Западно-Казахстанской области» и областных исполнительных органов финансируемых из местного бюджета
  kaz: «Батыс Қазақстан облысы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын облыстық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалау әдістемесін бекіту туралы

title:
  rus: О признании утратившим силу постановления акимата района от 16 июля 2015 года №338 «Об утверждении схемы и правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Акжаикского района»
  kaz: Аудан әкімдігінің 2015 жылғы 16 шілдедегі «Ақжайық ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен қағидаларын бекіту туралы» №338 қаулысының күшін жою туралы

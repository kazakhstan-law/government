title:
  rus: Об утверждении регламента государственной услуги «Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда»
  kaz: «Жемiс-жидек дақылдарының және жүзiмнiң көпжылдық көшеттерiн отырғызу және өсiру (оның iшiнде қалпына келтiру) шығындарының құнын субсидиялау» мемлекеттiк көрсетілетін қызмет регламентін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 28 июля 2015 года № 192 "Об утверждении регламента государственной услуги "Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда"
    kaz: Батыс Қазақстан облысы әкімдігінің 2015 жылғы 28 шілдедегі № 192 "Жеміс-жидек дақылдарының және жүзімнің көпжылдық көшеттерін отырғызу және өсіру (оның ішінде қалпына келтіру) шығындарының құнын субсидиялау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына өзгеріс енгізу туралы

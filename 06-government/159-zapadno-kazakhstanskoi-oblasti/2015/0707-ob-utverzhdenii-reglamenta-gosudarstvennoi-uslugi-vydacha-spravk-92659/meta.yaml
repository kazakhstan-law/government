  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 7 июля 2015 года № 164 «Об утверждении регламентa государственной услуги «Выдача справки о наличии (отсутствии) в постоянном пользовании жилища из коммунального жилищного фонда или жилища, арендованного местным исполнительным органом в частном жилищном фонде, гражданам, нуждающимся в жилище из жилищного фонда государственного предприятия либо государственного учреждения»
    kaz: Батыс Қазақстан облысы әкімдігінің 2015 жылғы 7 шілдедегі № 164 «Мемлекеттік кәсіпорынның немесе мемлекеттік мекеменің тұрғын үй қорынан тұрғын үйге мұқтаж азаматтарға тұрақты пайдалануында коммуналдық тұрғын үй қорынан берілген тұрғын үйдің немесе жергілікті атқарушы орган жеке тұрғын үй қорынан жалдаған тұрғын үйдің болуы (болмауы) туралы анықтама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

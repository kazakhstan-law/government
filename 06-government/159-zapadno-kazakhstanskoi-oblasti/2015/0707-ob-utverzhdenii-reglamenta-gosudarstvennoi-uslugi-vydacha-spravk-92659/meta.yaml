requisite: Постановление акимата Западно-Казахстанской области от 7 июля 2015 года № 164. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 августа 2015 года № 3981. Утратило силу постановлением акимата Западно-Казахстанской области от 28 августа 2020 года № 201 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача справки о наличии (отсутствии) в постоянном пользовании жилища из коммунального жилищного фонда или жилища, арендованного местным исполнительным органом в частном жилищном фонде, гражданам, нуждающимся в жилище из жилищного фонда государственного предприятия либо государственного учреждения»
  kaz: «Мемлекеттік кәсіпорынның немесе мемлекеттік мекеменің тұрғын үй қорынан тұрғын үйге мұқтаж азаматтарға тұрақты пайдалануында коммуналдық тұрғын үй қорынан берілген тұрғын үйдің немесе жергілікті атқарушы орган жеке тұрғын үй қорынан жалдаған тұрғын үйдің болуы (болмауы) туралы анықтама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

  kaz: Зеленов ауданы әкімдігінің 2015 жылғы 18 тамыздағы №672 «Зеленов ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен қағидаларын бекіту туралы» қаулысының күшін жою туралы

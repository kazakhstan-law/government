act_code: '96229'
requisite: Постановление акимата Западно-Казахстанской области от 8 сентября 2015 года № 256. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 октября 2015 года № 4091. Утратило силу постановлением акимата Западно-Казахстанской области от 24 февраля 2017 года № 57
title:
  rus: Об утверждении регламента государственной услуги "Аттестация специалистов с медицинским образованием для осуществления реализации лекарственных средств и изделий медицинского назначения в отдаленных от районного центра населенных пунктах через аптечные пункты в организациях здравоохранения, оказывающих первичную медико-санитарную, консультативно-диагностическую помощь, и передвижные аптечные пункты, в случае отсутствия специалиста с фармацевтическим образованием"
  kaz: '"Аудандық орталықтан алыс елді мекендердегі бастапқы медициналық-санитариялық консультациялық диагностикалық көмек көрсететiн денсаулық сақтау ұйымдарының дәріхана пункттері арқылы және фармацевтикалық бiлiмi бар маман болмаған жағдайда жылжымалы дәрiхана пункттері арқылы дәрілік заттар мен медициналық мақсаттағы бұйымдарды өткізуді жүзеге асыру үшін медициналық бiлiмi бар мамандарды аттестаттау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

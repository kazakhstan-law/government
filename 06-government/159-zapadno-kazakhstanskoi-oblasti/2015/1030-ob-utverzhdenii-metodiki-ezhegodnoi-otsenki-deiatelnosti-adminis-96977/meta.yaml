requisite: Постановление акимата города Уральска Западно-Казахстанской области от 30 октября 2015 года № 3443. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 7 декабря 2015 года № 4159. Утратило силу постановлением акимата города Уральска Западно-Казахстанской области от 25 февраля 2016 года № 470
title:
  rus: Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Уральска» и городских исполнительных органов финансируемых из местного бюджета
  kaz: «Орал қаласы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын қалалық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалау әдістемесін бекіту туралы

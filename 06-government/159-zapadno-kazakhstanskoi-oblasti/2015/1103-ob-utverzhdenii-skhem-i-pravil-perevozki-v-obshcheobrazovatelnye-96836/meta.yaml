  title:
    rus: О внесении изменений в постановление акимата Бурлинского района от 3 ноября 2015 года № 822 «Об утверждении схемы и Правил перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Бурлинского района»
    kaz: Бөрлі ауданы әкімдігінің 2015 жылғы 3 қарашадағы № 822 «Бөрлі ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

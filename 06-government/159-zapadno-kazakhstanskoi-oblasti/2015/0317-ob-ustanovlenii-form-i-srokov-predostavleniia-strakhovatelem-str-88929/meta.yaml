  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 17 марта 2015 года №69 «Об установлении форм и сроков предоставления страхователем, страховщиком, агентом и обществом информации документов, необходимых для осуществления местным исполнительным органом контрольных функций»
    kaz: Батыс Қазақстан облысы әкімдігінің 2015 жылғы 17 наурыздағы №69 «Жергілікті атқарушы органның бақылау функцияларын жүзеге асыруы үшін қажетті ақпарат пен құжаттарды сақтанушының, сақтандырушының, агенттің және қоғамның ұсыну нысаны мен мерзімдерін белгілеу туралы» қаулысына өзгерістер енгізу туралы

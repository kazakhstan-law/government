title:
  rus: Об установлении форм и сроков предоставления страхователем, страховщиком, агентом и обществом информации и документов, необходимых для осуществления местным исполнительным органом контрольных функций
  kaz: Жергілікті атқарушы органның бақылау функцияларын жүзеге асыруы үшін қажетті ақпарат пен құжаттарды сақтанушының, сақтандырушының, агенттің және қоғамның ұсыну нысаны мен мерзiмдерiн белгілеу туралы

title:
  rus: Об утверждении регламента государственной услуги «Определение соответствия (несоответствия) потенциального поставщика услуг гарантированного объема бесплатной медицинской помощи предъявляемым требованиям»
  kaz: «Тегін медициналық көмектің кепілдік берілген көлемін көрсету жөніндегі әлеуетті қызметтер берушінің қойылатын талаптарға сәйкестігін (сәйкес еместігін) анықтау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

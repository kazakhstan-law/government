requisite: Постановление акимата Таскалинского района Западно-Казахстанской области от 24 ноября 2015 года № 301. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 18 декабря 2015 года № 4178.  Утратило силу постановлением акимата Таскалинского района Западно-Казахстанской области от 14 июня 2016 года № 165
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций на 2016 год
  kaz: 2016 жылға қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

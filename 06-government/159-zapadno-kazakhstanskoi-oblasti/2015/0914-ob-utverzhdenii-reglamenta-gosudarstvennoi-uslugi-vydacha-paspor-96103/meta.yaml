act_code: '96103'
requisite: Постановление акимата Западно-Казахстанской области от 14 сентября 2015 года № 260. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 октября 2015 года № 4101. Утратило силу постановлением акимата Западно-Казахстанской области от 28 августа 2020 года № 201 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об утверждении регламентa государственной услуги «Выдача паспорта готовности энергопроизводящим и энергопередающим организациям с установленной электрической мощностью 5 МВт и менее, свыше 5 МВт или с установленной тепловой мощностью 100 Гкал/час и выше, а также имеющим на своем балансе электрические сети напряжением 35 кВ и ниже, 110 кВ и выше к работе в осенне-зимних условиях»
  kaz: «Күзгі-қысқы жағдайлардағы жұмысқа белгіленген электр қуаты 5 МВт және одан төмен, 5 МВт астам немесе белгіленген жылу қуаты сағатына 100 Гкал/сағ және одан жоғары, сондай – ақ өз теңгерімінде 35 кВ және одан төмен, 110 кВ және одан жоғары кернеудегі электр желілері бар энергия өндіруші және энергия беруші ұйымдарға әзірлік паспортын беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 18 августа 2015 года №222 «Об утверждении регламента государственной услуги «Выдача и продление разрешения на привлечение иностранной рабочей силы работодателям для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы, либо в рамках внутрикорпоративного перевода»
    kaz: Батыс Қазақстан облысы әкімдігінің 2015 жылғы 18 тамыздағы № 222 «Жұмыс берушілерге тиісті әкімшілік-аумақтық бірліктің аумағында еңбек қызметін жүзеге асыру үшін не корпоративішілік ауыстыру шеңберінде шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы

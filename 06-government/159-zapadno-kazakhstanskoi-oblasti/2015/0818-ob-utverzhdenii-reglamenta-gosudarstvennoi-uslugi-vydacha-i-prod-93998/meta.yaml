  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 18 августа 2015 года № 222 «Об утверждении регламента государственной услуги «Выдача и продление разрешения иностранному работнику на трудоустройство и работодателям на привлечение иностранной рабочей силы для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы»
    kaz: Батыс Қазақстан облысы әкімдігінің 2015 жылғы 18 тамыздағы № 222 «Шетелдік қызметкерге жұмысқа орналасуға және жұмыс берушілерге тиісті әкімшілік-аумақтық бірлік аумағында еңбек қызметін жүзеге асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік қөрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113225/rus

act_code: '95840'
requisite: Постановление от 14.09.2015 №266, Акимат Западно-Казахстанской области. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 15 октября 2015 года № 4103. Утратило силу постановлением акимата Западно-Казахстанской области от 20 мая 2020 года № 109 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
  kaz: «Басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

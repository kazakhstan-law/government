  kaz: Ауыл шаруашылығы дәнді дақылдарының тұқым шаруашылығына, ауыл шаруашылығы малдарының асыл тұқымды аналық мал басын ұстауға және ауру малдарды дайындау, тасымалдау және өңдеу кезіндегі өңдеуші кәсіпорындардың шығынын өтеуге субсидия беру туралы

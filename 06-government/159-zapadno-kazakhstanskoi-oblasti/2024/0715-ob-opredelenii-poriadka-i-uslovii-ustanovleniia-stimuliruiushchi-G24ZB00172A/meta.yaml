title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Ресурсный центр по работе с молодежью» отдела внутренней политики акимата Акжаикского района
  kaz: Ақжайық ауданы әкімдігі аудандық ішкі саясат бөлімінің «Жастармен жұмыс жөніндегі ресурстық орталығы» коммуналдық мемлекеттік мекемесінің қызметкерлерінің лауазымдық айлықақыларына жергілікті бюджеттен ынталандыру үстемеақысын белгілеудің тәртібі мен шарттарын айқындау туралы

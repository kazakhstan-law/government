  kaz: Батыс Қазақстан облысы әкімдігінің 2024 жылғы 22 сәуірдегі № 6 қбп «2024 жылдың 2 тоқсанына әлеуметтік маңызы бар азық-түлік тауарларына бөлшек сауда бағаларының шекті мәндерін бекіту туралы» қаулысы

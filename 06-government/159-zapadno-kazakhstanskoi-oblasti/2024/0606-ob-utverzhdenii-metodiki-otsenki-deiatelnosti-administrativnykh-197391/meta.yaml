act_code: '197391'
requisite: Постановление акимата Акжаикского района Западно-Казахстанской области от 6 июня 2024 года № 144. Отменено постановлением акимата Акжаикского района Западно-Казахстанской области от 28 января 2026 года № 18 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Акжаикского района» и районных исполнительных органов, финансируемых из местного бюджета»
  kaz: «Ақжайық ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы»

requisite: Постановление акимата Казталовского района Западно-Казахстанской области от 18 сентября 2024 года № 218
title:
  rus: «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Казталовского района» и районных исполнительных органов, финансируемых из местного бюджета»
  kaz: «Казталов ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы»

act_code: '196105'
requisite: Постановление акимата Западно-Казахстанской области от 19 апреля 2024 года № 81
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам гражданских служащих, работникам организаций, содержащихся за счет средств государственного бюджета, работникам казенных предприятий в сфере культуры и архивного дела Западно-Казахстанской области
  kaz: Батыс Қазақстан облысының мәдениет және архив ісі саласындағы азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлерінің лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы

act_code: '201285'
requisite: Постановление акимата района Бәйтерек Западно-Казахстанской области от 2 октября 2024 года № 420
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса "Б" Государственного учреждения "Аппарат акима района Бәйтерек" и районных исполнительных органов, финансируемых из местного бюджета
  kaz: '"Бәйтерек ауданы әкімінің аппараты" мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың "Б" корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы'

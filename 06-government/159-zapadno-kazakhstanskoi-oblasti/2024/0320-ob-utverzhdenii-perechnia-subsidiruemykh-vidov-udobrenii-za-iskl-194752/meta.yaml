  title:
    rus: О внесении дополнений в постановление акимата Западно-Казахстанской области от 20 марта 2024 года № 65 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы субсидий по Западно-Казахстанской области на 2024 год»
    kaz: Батыс Қазақстан облысы әкімдігінің «2024 жылға арналған Батыс Қазақстан облысы бойынша тыңайтқыштардың (органиқалық тыңайтқыштарды коспағанда) субсидияланатын тыңайтқыштар түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялардың нормаларын, сондай-ақ субсидиялар көлемін бекіту туралы» 2024 жылғы 20 наурыздағы № 65 қаулысына толықтырулар енгізу туралы

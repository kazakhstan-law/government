title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы субсидий по Западно-Казахстанской области на 2024 год
  kaz: 2024 жылға арналған Батыс Қазақстан облысы бойынша тыңайтқыштардың (органиқалық тыңайтқыштарды коспағанда) субсидияланатын тыңайтқыштар түрлерінің тізбесі және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялардың нормаларын, сондай-ақ субсидиялар көлемін бекіту туралы

requisite: Постановление акимата Бокейординского района Западно-Казахстанской области от 26 июня 2024 года № 107
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Ресурсный центр по работе с молодёжью» отдела внутренней политики акимата Бокейординского района
  kaz: Бөкей ордасы ауданы әкімдігі аудандық ішкі саясат бөлімінің «Жастармен жұмыс жөніндегі ресурстық орталығы» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеудің тәртібі мен шарттарын айқындау туралы

  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 5 декабря 2017 года №311 «Об утверждении регламента государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего и высшего образования»
    kaz: Батыс Қазақстан облысы әкімдігінің 2017 жылғы 5 желтоқсандағы №311 «Техникалық және кәсіптік, орта білімнен кейінгі және жоғары білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

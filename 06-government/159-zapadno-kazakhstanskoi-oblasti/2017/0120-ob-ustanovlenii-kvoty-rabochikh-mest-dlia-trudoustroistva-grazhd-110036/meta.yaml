act_code: '110036'
requisite: Постановление акимата города Уральска Западно-Казахстанской области от 20 января 2017 года № 138. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 22 февраля 2017 года № 4691. Утратило силу постановлением акимата города Уральска Западно-Казахстанской области от 3 марта 2018 года № 504
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования и лиц, освобожденных из мест лишения свободы, а также лиц, состоящих на учете службы пробации на 2017 год по городу Уральск
  kaz: Орал қаласы бойынша 2017 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды және бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

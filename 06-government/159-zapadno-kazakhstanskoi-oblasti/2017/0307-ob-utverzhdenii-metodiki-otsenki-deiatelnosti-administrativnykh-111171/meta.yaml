requisite: Постановление акимата Каратобинского района Западно-Казахстанской области от 7 марта 2017 года № 25. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 4 апреля 2017 года № 4754. Утратило силу постановлением акимата Каратобинского района Западно-Казахстанской области от 28 марта 2018 года № 36
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Каратобинского района» и районных исполнительных органов финансируемых из местного бюджета
  kaz: «Қаратөбе ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

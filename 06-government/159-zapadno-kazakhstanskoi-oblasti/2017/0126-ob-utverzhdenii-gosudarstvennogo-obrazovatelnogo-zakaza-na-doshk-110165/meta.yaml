  title:
    rus: О внесении изменения в постановление акимата Бурлинского района от 26 января 2017 года № 41 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по Бурлинскому району на 2017 год»
    kaz: Бөрлі ауданы әкімдігінің 2017 жылғы 26 қаңтардағы №41 «Бөрлі ауданы бойынша 2017 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгеріс енгізу туралы

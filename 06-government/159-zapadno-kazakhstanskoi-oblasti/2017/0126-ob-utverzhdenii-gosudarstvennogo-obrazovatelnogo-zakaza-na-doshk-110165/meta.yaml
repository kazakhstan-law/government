  kaz: Бөрлі ауданы бойынша 2017 жылға мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы  төлеу мөлшерін бекіту туралы

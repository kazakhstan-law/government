requisite: Постановление акимата Казталовского района Западно-Казахстанской области от 9 февраля 2017 года № 22. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 6 марта 2017 года № 4704. Утратило силу постановлением акимата Казталовского района Западно-Казахстанской области от 20 декабря 2018 года № 395
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также для лиц, освобожденных из мест лишения свободы и для граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования на 2017 год
  kaz: 2017 жылға пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

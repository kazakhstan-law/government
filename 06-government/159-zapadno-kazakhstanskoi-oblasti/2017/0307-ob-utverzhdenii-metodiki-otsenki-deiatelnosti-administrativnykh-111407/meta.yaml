requisite: Постановление акимата Казталовского района Западно-Казахстанской области от 7 марта 2017 года № 64. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 11 апреля 2017 года № 4769. Утратило силу постановлением акимата Казталовского района Западно-Казахстанской области от 15 марта 2018 года № 87
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Казталовского района» и районных исполнительных органов финансируемых из местного бюджета
  kaz: «Казталов ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

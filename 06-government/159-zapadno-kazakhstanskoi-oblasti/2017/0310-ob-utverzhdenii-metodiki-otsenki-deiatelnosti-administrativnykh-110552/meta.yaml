act_code: '110552'
requisite: Постановление акимата Зеленовского района Западно-Казахстанской области от 10 марта 2017 года № 117. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 15 марта 2017 года № 4716. Утратило силу постановлением акимата Зеленовского района Западно-Казахстанской области от 28 марта 2018 года № 210
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Зеленовского района» и районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Зеленов ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата Теректинского района Западно-Казахстанской области от 28 марта 2017 года № 89. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 20 апреля 2017 года № 4782. Утратило силу постановлением акимата Теректинского района Западно-Казахстанской области от 27 марта 2018 года № 90
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Теректинского района» и районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Теректі ауданы әкімі аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 5 декабря 2017 года №310 «Об утверждении регламента государственной услуги «Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием»
    kaz: Батыс Қазақстан облысы әкімдігінің 2017 жылғы 5 желтоқсандағы №310 «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

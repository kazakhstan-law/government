  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 5 декабря 2017 года № 307 «Об утверждении регламента государственной услуги «Субсидирование затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства продуктов ее глубокой переработки»
    kaz: Батыс Қазақстан облысы әкімдігінің 2017 жылғы 5 желтоқсандағы № 307 «Қайта өңдеуші кәсіпорындардың ауыл шаруашылығы өнімін тереңдете қайта өңдеп өнім өндіру үшін оны сатып алуға арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/136283/rus

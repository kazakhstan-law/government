requisite: Постановление акимата Акжаикского района Западно-Казахстанской области от 14 февраля 2017 года № 50. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 марта 2017 года № 4705. Утратило силу постановлением акимата Акжаикского района Западно-Казахстанской области от 28 марта 2018 года № 76
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима Акжаикского района» и районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Ақжайық ауданы әкімі аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы

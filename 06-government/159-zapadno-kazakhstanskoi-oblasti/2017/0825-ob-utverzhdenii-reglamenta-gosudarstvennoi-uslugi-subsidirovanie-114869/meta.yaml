  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 25 августа 2017 года №221 «Об утверждении регламента государственной услуги «Субсидирование затрат ревизионных союзов сельскохозяйственных кооперативов на проведение внутреннего аудита сельскохозяйственных кооперативов»
    kaz: Батыс Қазақстан облысы әкімдігінің 2017 жылғы 25 тамыздағы №221 «Ауыл шаруашылығы кооперативтерінің тексеру одақтарының ауыл шаруашылығы кооперативтерінің ішкі аудитін жүргізуге арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

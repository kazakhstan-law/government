  requisite: Постановление акимата Западно-Казахстанской области от 29 января 2018 года № 13. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 20 февраля 2018 года № 5065. Утратило силу постановлением акимата Западно-Казахстанской области от 5 июня 2026 года № 134 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 7 августа 2017 года №211 «Об утверждении размера выплаты ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд»
    kaz: Батыс Қазақстан облысы әкімдігінің 2017 жылғы 7 тамыздағы №211 «Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамында қатысатын спортшыларға олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы» қаулысына өзгеріс енгізу туралы

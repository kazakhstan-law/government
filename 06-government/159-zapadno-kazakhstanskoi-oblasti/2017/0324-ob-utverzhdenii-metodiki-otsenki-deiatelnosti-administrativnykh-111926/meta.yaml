requisite: Постановление акимата города Уральска Западно-Казахстанской области от 24 марта 2017 года № 874. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 24 апреля 2017 года № 4784. Утратило силу постановлением акимата города Уральска Западно-Казахстанской области от 16 марта 2018 года № 614
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима города Уральска» и городских исполнительных органов, финансируемых из местного бюджета
  kaz: «Орал қаласы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын қалалық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата Чингирлауского района Западно-Казахстанской области от 9 марта 2017 года № 39. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 10 апреля 2017 года № 4766. Утратило силу постановлением акимата Чингирлауского района Западно-Казахстанской области от 15 марта 2018 года № 67
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат акима Чингирлауского района» и районных исполнительных органов, финансируемых из местного бюджета
  kaz: «Шыңғырлау ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы

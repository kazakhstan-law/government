act_code: '26028'
requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2005 жылғы 10 қарашадағы № 1986 қаулысы. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2005 жылғы 28 қарашада № 7-1-22 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2009 жылғы 9 cәуірдегі № 959 қаулысымен
title:

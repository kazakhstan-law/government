requisite: Постановление акимата района Бәйтерек Западно-Казахстанской области от 26 ноября 2020 года № 605. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 27 ноября 2020 года № 6497. Утратило силу постановлением акимата района Бәйтерек Западно-Казахстанской области от 26 ноября 2025 года № 620 (вводится в действие с 01.01.2026)
title:
  rus: Об утверждении коэффициентов зонирования, учитывающих месторасположение объекта налогообложения в населенных пунктах

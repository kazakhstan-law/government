  title:
    rus: О внесении изменения в постановление акимата района Бәйтерек Западно-Казахстанской области от 26 ноября 2020 года №605 «Об утверждении коэффициентов зонирования, учитывающих месторасположение объекта налогообложения в населенных пунктах»
    kaz: Батыс Қазақстан облысы Бәйтерек ауданы әкімдігінің 2020 жылғы 26 қарашадағы №605 «Елді мекендерінде салық салу объектісінің орналасқан жерін ескеретін аймаққа бөлу коэффициенттерін бекіту туралы» қаулысына өзгеріс енгізу туралы

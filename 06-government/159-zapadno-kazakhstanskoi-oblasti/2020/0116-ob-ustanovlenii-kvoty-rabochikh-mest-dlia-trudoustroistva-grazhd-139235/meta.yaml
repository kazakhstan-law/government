act_code: '139235'
requisite: Постановление акимата города Уральска Западно-Казахстанской области от 16 января 2020 года № 65. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 31 января 2020 года № 6010. Утратило силу постановлением акимата города Уральска Западно-Казахстанской области от 8 декабря 2020 года № 2385 (вводится в действие с 01.01.2021)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации по городу Уральск на 2020 год
  kaz: Орал қаласы бойынша 2020 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

act_code: '129333'
requisite: Постановление акимата города Уральска Западно-Казахстанской области от 21 февраля 2019 года № 470. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 25 февраля 2019 года № 5547. Утратило силу постановлением акимата города Уральска Западно-Казахстанской области от 16 января 2020 года № 65 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей,являющихся выпускниками организаций образования и лиц, освобожденных из мест лишения свободы, а также лиц, состоящих на учете службы пробации по городу Уральск на 2019 год
  kaz: Орал қаласы бойынша 2019 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды және бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

    kaz: Батыс Қазақстан облысы әкімдігінің 2019 жылғы 12 сәуірдегі №91 «Асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялаудың кейбір мәселелері туралы» қаулысына өзгеріс енгізу туралы

act_code: '136011'
requisite: Постановление акимата Бурлинского района Западно-Казахстанской области от 8 ноября 2019 года № 21. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 15 ноября 2019 года № 5860. Утратило силу постановлением акимата Бурлинского района Западно-Казахстанской области от 18 февраля 2020 года № 63 (вводится в действие по истечении десяти календарных дней после дня  первого официального опубликования)
title:
  rus: Об утверждении Правил возмещения расходов на служебные командировки, в том числе в иностранные государства сотрудников местных исполнительных органов Бурлинского района

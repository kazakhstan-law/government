title:
  rus: Об утверждении регламента государственной услуги «Прием и рассмотрение документов на возможность направления граждан Республики Казахстан на лечение за рубеж за счет бюджетных средств»
  kaz: «Қазақстан Республикасының азаматтарын бюджет қаражаты есебінен шетелге емделуге жіберу мүмкіндігіне құжаттарды қабылдау және қарау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

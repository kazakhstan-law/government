  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 2 августа 2019 года № 190 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Батыс Қазақстан облысы әкімдігінің «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» 2019 жылғы 2 тамыздағы № 190 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/192872/rus

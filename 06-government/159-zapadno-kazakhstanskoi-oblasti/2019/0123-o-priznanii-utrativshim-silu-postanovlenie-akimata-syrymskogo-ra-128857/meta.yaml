act_code: '128857'
requisite: Постановление акимата Сырымского района Западно-Казахстанской области от 23 января 2019 года № 31. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 28 января 2019 года № 5527
title:
  rus: О признании утратившим силу постановление акимата Сырымского района от 28 октября 2016 года № 410 «Об определении сроков предоставления заявки на субсидирования повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных култур и стоимости затрат на возделывание сельскохозяйсвенных культур в защищенном грунте на 2016 год по Сырымскому району»
  kaz: Сырым ауданы әкімдігінің 2016 жылғы 28 қазандағы № 410 «Сырым ауданы бойынша 2016 жылға арналған басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгі егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын субсидиялауға арналған өтінімді ұсыну мерзімдерін белгілеу туралы» қаулысының күшін жою туралы

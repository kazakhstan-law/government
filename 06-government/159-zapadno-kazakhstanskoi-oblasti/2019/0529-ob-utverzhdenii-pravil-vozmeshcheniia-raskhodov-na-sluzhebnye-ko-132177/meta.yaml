act_code: '132177'
requisite: Постановление акимата района Бәйтерек Западно-Казахстанской области от 29 мая 2019 года № 400. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 30 мая 2019 года № 5693. Утратило силу постановлением акимата района Бәйтерек Западно-Казахстанской области от 4 февраля 2022 года № 28 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил возмещения расходов на служебные командировки за счет средств районного бюджета, в том числе в иностранные государства сотрудников местных исполнительных органов района Бәйтерек
  kaz: Аудандық бюджет есебінен Бәйтерек ауданының жергілікті атқарушы органдарының қызметкерлерін қызметтік, оның ішінде шет мемлекеттерге іссапарларға арналған шығыстарды өтеудің қағидаларын бекіту туралы

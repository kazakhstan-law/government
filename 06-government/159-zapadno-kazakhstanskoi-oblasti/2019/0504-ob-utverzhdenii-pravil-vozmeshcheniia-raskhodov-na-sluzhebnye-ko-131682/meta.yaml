  title:
    rus: О внесении изменения в постановление акимата Казталовского района от 4 мая 2019 года №142 «Об утверждении Правил возмещения расходов на служебные командировки, в том числе в иностранные государства сотрудников местных исполнительных органов Казталовского района»
    kaz: Казталов ауданы әкімдігінің 2019 жылғы 4 мамырдағы № 142 «Казталов ауданының жергілікті атқарушы органдарының қызметкерлерін қызметтік, оның ішінде шет мемлекеттерге іссапарларға арналған шығыстарды өтеудің қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

title:
  rus: Об утверждении Правил возмещения расходов на служебные командировки, в том числе в иностранные государства сотрудников местных исполнительных органов Казталовского района
  kaz: Казталов ауданының жергілікті атқарушы органдарының қызметкерлерін қызметтік, оның ішінде шет мемлекеттерге іссапарларға арналған шығыстарды өтеудің қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Западно–Казахстанской области от 19 ноября 2019 года №300 «Об утверждении Правил реализации механизмов стабилизации цен на социально значимые продовольственные товары по Западно-Казахстанской области»
    kaz: Батыс Қазақстан облысы әкімдігінің 2019 жылғы 19 қарашадағы № 300 «Батыс Қазақстан облысы бойынша әлеуметтік маңызы бар азық-түлік тауарларына бағаны тұрақтандыру тетіктерін іске асыру қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

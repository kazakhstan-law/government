requisite: Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2009 жылғы 7 желтоқсандағы № 412 қаулысы. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2009 жылғы 9 желтоқсанда № 7-2-82 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2010 жылғы 8 ақпандағы № 21 қаулысымен

requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2009 жылғы 9 қаңтардағы № 38 қаулысы. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 11 ақпанда № 7-9-74 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2014 жылғы 9 қазандағы № 149 қаулысымен

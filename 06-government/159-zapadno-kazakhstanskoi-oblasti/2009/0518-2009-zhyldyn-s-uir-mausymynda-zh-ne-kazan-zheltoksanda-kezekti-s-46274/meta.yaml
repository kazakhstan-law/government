requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2009 жылғы 18 мамырдағы № 122 қаулысы. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 30 мамырда № 7-9-83 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2010 жылғы 11 қаңтардағы № 4 қаулысымен

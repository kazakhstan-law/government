requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2009 жылғы 26 қазандағы № 244 қаулысы. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2009 жылғы 16 қарашада № 7-13-115 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2009 жылғы 11 желтоқсандағы № 292 қаулысымен

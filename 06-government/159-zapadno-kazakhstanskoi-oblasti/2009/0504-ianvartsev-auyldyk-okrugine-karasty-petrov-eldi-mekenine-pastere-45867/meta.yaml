requisite: Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2009 жылғы 4 мамырдағы № 204 қаулысы. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2009 жылғы 13 мамырда № 7-7-89 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2014 жылғы 16 қазандағы № 816 қаулысымен

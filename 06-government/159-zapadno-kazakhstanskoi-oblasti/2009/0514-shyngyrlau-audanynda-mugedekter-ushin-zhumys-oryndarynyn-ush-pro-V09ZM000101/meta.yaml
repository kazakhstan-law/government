requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2009 жылғы 14 мамырдағы № 86 қаулысы. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2009 жылғы 11 маусымда № 7-13-101 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2010 жылғы 28 қаңтардағы № 4 қаулысымен

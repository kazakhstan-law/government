requisite: Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2009 жылғы 27 мамырдағы № 126 қаулысы. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2009 жылғы 3 маусымда № 7-8-89 тіркелді. Күші жойылды - Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2010 жылғы 20 сәуірдегі № 104 қаулысымен

requisite: Батыс Қазастан облысы Қаратөбе ауданы әкімдігінің 2009 жылғы 16 наурыздағы № 72 қаулысы. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 19 наурызда № 7-9-81 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2009 жылғы 5 мамырдағы № 96 қаулысымен

requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 27 қазандағы № 208 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2009 жылғы 11 қарашада № 7-4-96 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 25 қарашадағы № 252 қаулысымен

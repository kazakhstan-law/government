requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 29 қыркүйектегі № 196 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2009 жылғы 26 қазанда № 7-4-94 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 2 қарашадағы № 234 қаулысымен

requisite: Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2009 жылғы 30 наурыздағы № 100 қаулысы. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2009 жылғы 29 сәуірде № 7-5-85 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2013 жылғы 21 ақпандағы № 60 қаулысымен

requisite: Батыс Қазақстан облысы әкімдігінің 2009 жылғы 26 мамырдағы № 147 қаулысы. Батыс Қазақстан облысының Әділет департаментінде 2009 жылғы 4 маусымда № 3025 тіркелді. Күші жойылды - Батыс Қазақстан облысы әкімдігінің 2014 жылғы 11 қарашадағы № 298 қаулысымен

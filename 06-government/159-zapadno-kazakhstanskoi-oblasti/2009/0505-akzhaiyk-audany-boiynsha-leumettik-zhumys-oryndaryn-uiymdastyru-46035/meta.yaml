requisite: Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2009 жылғы 5 мамырдағы № 147 қаулысы. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2009 жылғы 19 мамырда № 7-2-75 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы әкімдігінің 2009 жылғы 25 қыркүйектегі № 311 қаулысымен

requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2009 жылғы 9 қаңтардағы № 37 қаулысы. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 11 ақпанда № 7-9-73 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2009 жылғы 31 желтоқсандағы № 307 қаулысымен

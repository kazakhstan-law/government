act_code: '46084'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 23 cәуірдегі № 84 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2009 жылғы 18 мамырда № 7-4-87 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2010 жылғы 9 ақпандағы № 18 қаулысымен

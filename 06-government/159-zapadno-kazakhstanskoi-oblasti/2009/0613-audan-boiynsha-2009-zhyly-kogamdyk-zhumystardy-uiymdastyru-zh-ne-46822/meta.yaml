requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2009 жылғы 13 маусымдағы № 96 қаулысы. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2009 жылғы 23 маусымда № 7-13-103 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2010 жылғы 28 қаңтардағы № 4 қаулысымен

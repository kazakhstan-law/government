requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 1 қазандағы № 198 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2009 жылғы 26 қазанда № 7-4-95 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 2 қарашадағы № 235 қаулысымен

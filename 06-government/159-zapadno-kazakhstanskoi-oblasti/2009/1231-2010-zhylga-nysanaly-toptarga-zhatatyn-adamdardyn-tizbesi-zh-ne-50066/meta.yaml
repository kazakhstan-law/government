requisite: Батыс Қазақстан облысы Тасқала ауданы әкімдігінің 2009 жылғы 31 желтоқсандағы № 491 қаулысы. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2010 жылғы 19 қаңтарда № 7-11-110 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала ауданы әкімдігінің 2011 жылғы 20 қаңтардағы № 6 қаулысымен

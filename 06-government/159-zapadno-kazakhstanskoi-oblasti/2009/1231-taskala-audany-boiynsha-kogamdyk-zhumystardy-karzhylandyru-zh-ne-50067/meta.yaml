act_code: '50067'
requisite: Батыс Қазақстан облысы Тасқала ауданы әкімдігінің 2009 жылғы 31 желтоқсандағы № 493 қаулысы. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2010 жылғы 19 қаңтарда № 7-11-111 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала ауданы әкімдігінің 2012 жылға 29 ақпандағы № 46 қаулысымен

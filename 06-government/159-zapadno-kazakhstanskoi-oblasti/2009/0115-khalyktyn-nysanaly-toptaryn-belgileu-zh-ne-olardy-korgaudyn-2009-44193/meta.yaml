requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2009 жылғы 15 қаңтардағы № 142 қаулысы. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2009 жылғы 12 ақпанда № 7-1-129 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 14 қаңтардағы № 51 қаулысымен

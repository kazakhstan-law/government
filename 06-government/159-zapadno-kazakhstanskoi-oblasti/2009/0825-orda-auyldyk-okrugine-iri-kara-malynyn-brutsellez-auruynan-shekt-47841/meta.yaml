requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 25 тамыздағы № 157 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2009 жылғы 21 қыркүйекте № 7-4-91 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2011 жылғы 6 желтоқсандағы № 192 қаулысымен

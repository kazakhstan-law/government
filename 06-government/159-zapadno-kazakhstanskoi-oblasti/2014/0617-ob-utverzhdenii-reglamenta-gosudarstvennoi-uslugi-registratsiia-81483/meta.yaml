requisite: Постановление акимата Западно-Казахстанской области от 17 июня 2014 года № 159. Зарегистрировано Департаментом юстиции Западно-Казахстанской области от 23 июля 2014 года № 3592. Утратило силу постановлением акимата Западно-Казахстанской области от 18 августа 2015 года № 216
title:
  rus: Об утверждении регламента государственной услуги "Регистрация сервитутов на участки недр, предоставленных для проведения разведки и добычи общераспространенных полезных ископаемых, строительства и (или) подземных сооружений, не связанных с разведкой или добычей, в случаях, предусмотренных Законом Республики Казахстан "О недрах и недропользовании"
  kaz: '"Жер қойнауы және жер қойнауын пайдалану туралы" Қазақстан Республикасының Заңында көзделген жағдайларда, кең таралған пайдалы қазбаларды барлауды және өндіруді жүргізу, барлауға немесе өндіруге байланысты емес құрылыс және (немесе) жерасты ғимараттары үшін берілген жер қойнауының учаскелеріне арналған сервитуттарды тіркеу" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

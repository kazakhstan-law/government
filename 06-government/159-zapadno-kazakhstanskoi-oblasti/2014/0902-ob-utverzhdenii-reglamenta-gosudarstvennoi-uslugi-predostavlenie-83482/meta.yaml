requisite: Постановление акимата Западно-Казахстанской области от 2 сентября 2014 года № 226. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 6 октября 2014 года № 3644. Утратило силу постановлением акимата Западно-Казахстанской области от 19 мая 2015 года № 126
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру,әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтiк қолдау шараларын ұсыну" мемлекеттiк көрсетілетін қызмет регламентiн бекiту туралы'

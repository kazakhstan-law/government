requisite: Постановление акимата Таскалинского района Западно-Казахстанской области от 10 декабря 2014 года № 438. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 31 декабря 2014 года № 3748. Утратило силу постановлением акимата Таскалинского района Западно-Казахстанской области от 24 ноября 2015 года № 301
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций на 2015 год
  kaz: 2015 жылға қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар үшiн, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшiн және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшiн жұмыс орындарына квота белгiлеу туралы

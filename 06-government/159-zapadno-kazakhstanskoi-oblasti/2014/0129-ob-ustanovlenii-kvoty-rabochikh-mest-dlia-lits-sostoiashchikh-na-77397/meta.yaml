requisite: Постановление акимата Таскалинского района Западно-Казахстанской области от 29 января 2014 года № 27. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 13 февраля 2014 года № 3423. Утратило силу постановлением акимата Таскалинского района Западно-Казахстанской области от 10 декабря 2014 года № 438
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций на 2014 год
  kaz: 2014 жылға қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшiн және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшiн жұмыс орындарына квота белгiлеу туралы

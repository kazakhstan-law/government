requisite: Постановление акимата Западно-Казахстанской области от 13 мая 2014 года № 111. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 20 июня 2014 года № 3568. Утратило силу постановлением акимата Западно-Казахстанской области от 7 июля 2015 года № 165
title:
  rus: Об утверждении регламентa государственной услуги "Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
  kaz: '"Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй  беру туралы шешім қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

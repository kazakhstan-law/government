  title:
    rus: О внесении дополнений в постановление акимата Западно-Казахстанской области от 13 мая 2014 года № 111 "Об утверждении регламента государственной услуги "Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде"
    kaz: Батыс Қазақстан облысы әкімдігінің 2014 жылғы 13 мамырдағы № 111 "Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына толықтырулар енгізу туралы

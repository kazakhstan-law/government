requisite: Постановление акимата Западно-Казахстанской области от 1 июля 2014 года № 176. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 4 августа 2014 года № 3601. Утратило силу постановлением акимата Западно-Казахстанской области от 18 августа 2015 года № 222
title:
  rus: Об утверждении регламента государственной услуги "Выдача, переоформление и продление разрешения иностранному работнику на трудоустройство и работодателям на привлечение иностранной рабочей силы для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы"
  kaz: '"Шетелдік қызметкерге жұмысқа орналасуға және жұмыс берушілерге тиісті әкімшілік-аумақтық бірлік аумағында еңбек қызметін жүзеге асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру, қайта ресімдеу және ұзарту" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

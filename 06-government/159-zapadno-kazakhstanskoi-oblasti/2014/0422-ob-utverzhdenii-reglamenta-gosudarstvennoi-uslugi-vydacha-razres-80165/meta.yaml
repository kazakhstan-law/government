  title:
    rus: О внесении дополнений в постановление акимата Западно-Казахстанской области от 22 апреля 2014 года № 77 "Об утверждении регламента государственной услуги "Выдача разрешения на размещение объектов наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах"
    kaz: Батыс Қазақстан облысы әкімдігінің 2014 жылғы 22 сәуірдегі № 77 "Облыстық және аудандық маңызы бар, сондай-ақ елді мекендердегі жалпы пайдаланымдағы автомобиль жолдарының бөлінген белдеуінде сыртқы (көрнекі) жарнама объектісін орналастыруға рұқсат беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" қаулысына толықтырулар енгізу туралы

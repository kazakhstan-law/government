requisite: Постановление акимата Западно-Казахстанской области от 3 июня 2014 года № 139. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 20 июня 2014 года № 3567. Утратило силу постановлением акимата Западно-Казахстанской области от 16 июля 2015 года № 176
title:
  rus: Об утверждении регламента государственной услуги "Выдача решения о строительстве культовых зданий (сооружений), определении их месторасположения, а также перепрофилировании (изменении функционального назначения) зданий (сооружений) в культовые здания (сооружения)"
  kaz: '"Ғибадат үйлерін (ғимараттарын) салу және олардың орналасатын жерін айқындау, сондай-ақ үйлерді (ғимараттарды) ғибадат үйлері (ғимараттары) етіп қайта бейіндеу (функционалдық мақсатын өзгерту) туралы шешім беру" мемлекеттік көрсетілетін қызмет регламентiн бекіту туралы'

act_code: '26834'
requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2006 жылғы 9 ақпандағы № 214 қаулысы. Орал қаласының әділет басқармасында 2006 жылғы 17 наурызда № 7-1-35 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2009 жылғы 9 cәуірдегі № 959 қаулысымен
title:

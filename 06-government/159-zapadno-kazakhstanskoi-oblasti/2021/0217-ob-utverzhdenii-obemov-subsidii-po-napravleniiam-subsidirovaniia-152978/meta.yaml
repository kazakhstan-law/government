  title:
    rus: О внесении изменений в постановление акимата Западно-Казахстанской области от 17 февраля 2021 года № 18 «О некоторых вопросах субсидирования по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства»
    kaz: Батыс Қазақстан облысы әкімдігінің 2021 жылғы 17 ақпандағы №18 «Асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялаудың кейбір мәселелері туралы» қаулысына өзгерістер енгізу туралы

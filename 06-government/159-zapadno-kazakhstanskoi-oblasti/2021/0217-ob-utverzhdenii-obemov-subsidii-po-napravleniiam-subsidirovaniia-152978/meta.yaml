  title:
    rus: О внесении изменения в постановление акимата Западно-Казахстанской области от 17 февраля 2021 года № 18 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства по Западно-Казахстанской области на 2021 год»
    kaz: Батыс Қазақстан облысы әкімдігінің 2021 жылғы 17 ақпандағы №18 «Батыс Қазақстан облысы бойынша 2021 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнiмдiлiгiн және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялау туралы» қаулысына өзгеріс енгізу туралы

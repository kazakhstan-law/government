requisite: Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2008 жылғы 19 мамырдағы № 189 қаулысы. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2008 жылғы 30 маусымда № 7-7-67 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2010 жылғы 1 қазандағы № 410 қаулысымен

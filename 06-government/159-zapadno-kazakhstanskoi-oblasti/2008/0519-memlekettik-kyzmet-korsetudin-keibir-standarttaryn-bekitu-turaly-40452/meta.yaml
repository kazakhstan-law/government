act_code: '40452'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2008 жылғы 19 мамырдағы № 129 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2008 жылғы 1 шілдеде № 7-4-66 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2010 жылғы 17 қыркүйектегі № 159 қаулысымен

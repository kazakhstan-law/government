requisite: Батыс Қазақстан облыстық әкімдігінің 2008 жылғы 28 тамыздағы № 219 қаулысы. Батыс Қазақстан облысының Әділет департаментінде 2008 жылғы 15 қыркүйекте № 3014 тіркелді. Күші жойылды - Батыс Қазақстан облысы әкімдігінің 2012 жылғы 10 шілдедегі № 133 қаулысымен

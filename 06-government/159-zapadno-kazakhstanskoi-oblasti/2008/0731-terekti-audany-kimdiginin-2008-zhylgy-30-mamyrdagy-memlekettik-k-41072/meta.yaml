act_code: '41072'
requisite: Батыс Қазақстан облысы Теректі ауданы әкімдігінің 2008 жылғы 31 шілдедегі № 195 қаулысы. Батыс Қазақстан облысы Теректі ауданы әділет басқармасында 2008 жылғы 8 тамызда № 7-12-63 тіркелді. Күші жойылды - Батыс Қазақстан облысы Теректі ауданы әкімдігінің 2010 жылғы 24 қыркүйектегі № 382 қаулысымен

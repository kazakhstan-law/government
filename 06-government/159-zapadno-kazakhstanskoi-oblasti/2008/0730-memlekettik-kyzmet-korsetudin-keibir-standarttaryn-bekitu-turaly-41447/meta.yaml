requisite: Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2008 жылғы 30 шілдедегі № 278 қаулысы. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2008 жылғы 29 тамызда № 7-8-71 тіркелді. Күші жойылды - Батыс Қазақстан облысы Казталов ауданы әкімдігінің 2010 жылғы 16 қыркүйектегі № 180 қаулысымен

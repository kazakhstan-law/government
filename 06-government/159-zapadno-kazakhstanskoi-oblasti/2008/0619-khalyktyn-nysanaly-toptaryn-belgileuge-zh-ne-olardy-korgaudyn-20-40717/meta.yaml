requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2008 жылғы 19 маусымдағы № 1612 қаулысы. Батыс Қазақстан облысы Орал қаласының Әділет басқармасында 2008 жылғы 15 шілдеде № 7-1-100 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2009 жылғы 15 қаңтардағы № 142 қаулысымен

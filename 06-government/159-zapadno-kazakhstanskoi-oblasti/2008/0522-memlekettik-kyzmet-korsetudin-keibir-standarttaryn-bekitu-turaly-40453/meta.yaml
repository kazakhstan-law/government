act_code: '40453'
requisite: Батыс Қазақстан облысы Жәнібек ауданы әкімдігінің 2008 жылғы 22 мамырдағы № 134 қаулысы. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2008 жылғы 26 маусымда № 7-6-68 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек ауданы әкімдігінің 2010 жылғы 14 қазандағы № 250 қаулысымен

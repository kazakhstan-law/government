requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2008 жылғы 27 мамырдағы № 100 қаулысы. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2008 жылғы 20 маусымда № 7-13-74 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы әкімдігінің 2010 жылғы 6 қазандағы № 198 қаулысымен

requisite: Батыс Қазақстан облысы Теректі ауданы әкімдігінің 2008 жылғы 30 мамырдағы № 146 қаулысы. Батыс Қазақстан облысы Теректі ауданы әділет басқармасында 2008 жылғы 25 маусымда № 7-12-60 тіркелді. Күші жойылды - Батыс Қазақстан облысы Теректі ауданы әкімдігінің 2010 жылғы 24 қыркүйектегі № 382 қаулысымен

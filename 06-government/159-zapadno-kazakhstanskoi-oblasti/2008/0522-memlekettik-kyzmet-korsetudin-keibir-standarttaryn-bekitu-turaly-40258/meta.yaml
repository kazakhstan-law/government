act_code: '40258'
requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2008 жылғы 22 мамырдағы № 87 қаулысы. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2008 жылғы 20 маусымда № 7-9-63 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімдігінің 2010 жылғы 30 қыркүйектегі № 155 қаулысымен

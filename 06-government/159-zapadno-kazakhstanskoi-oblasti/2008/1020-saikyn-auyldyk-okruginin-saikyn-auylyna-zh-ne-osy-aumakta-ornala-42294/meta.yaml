act_code: '42294'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2008 жылғы 20 қазандағы № 244 қаулысы. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2008 жылғы 17 қарашада № 7-4-75 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімдігінің 2009 жылғы 17 қарашадағы № 246 қаулысымен
title:

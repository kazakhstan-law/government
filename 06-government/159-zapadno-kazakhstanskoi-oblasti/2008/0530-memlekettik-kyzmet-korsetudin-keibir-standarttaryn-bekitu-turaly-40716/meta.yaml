act_code: '40716'
requisite: Батыс Қазақстан облысы Тасқала ауданы әкімдігінің 2008 жылғы 30 мамырдағы № 138 қаулысы. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2008 жылғы 10 шілдеде № 7-11-70 тіркелген. Күші жойылды - Батыс Қазақстан облысы Тасқала ауданы әкімдігінің 2010 жылғы 30 қыркүйектегі № 273 қаулысымен

requisite: Батыс Қазақстан облысы Бөрлі ауданы әкімдігінің 2008 жылғы 26 маусымдағы № 322 қаулысы. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2008 жылғы 10 шілдеде № 7-3-58 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі ауданы әкімдігінің 2010 жылғы 30 қыркүйектегі № 716 қаулысымен

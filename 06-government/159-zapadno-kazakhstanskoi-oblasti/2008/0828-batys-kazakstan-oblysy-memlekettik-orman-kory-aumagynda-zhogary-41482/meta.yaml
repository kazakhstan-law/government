requisite: Батыс Қазақстан облысы әкімдігінің 2008 жылғы 28 тамыздағы № 222 қаулысы. Батыс Қазақстан облысының Әділет департаментінде 2008 жылғы 9 қыркүйекте № 3013 болып тіркелді. Күші жойылды - Батыс Қазақстан облысы әкімдігінің 2019 жылғы 28 маусымдағы № 155 қаулысымен

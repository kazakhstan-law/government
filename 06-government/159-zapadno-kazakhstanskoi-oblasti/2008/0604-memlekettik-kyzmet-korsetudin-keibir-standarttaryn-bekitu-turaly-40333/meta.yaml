act_code: '40333'
requisite: Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2008 жылғы 4 маусымдағы № 109 қаулысы. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2008 жылғы 2 шілдеде № 7-5-66 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2010 жылғы 5 қазандағы № 183 қаулысымен

requisite: Батыс Қазақстан облыс әкімдігінің 2008 жылғы 31 наурыздағы № 99 қаулысы. Батыс Қазақстан облысының Әділет департаментінде 2008 жылғы 7 сәуірде № 3003 тіркелді. Күші жойылды - Батыс Қазақстан облыс әкімдігінің 2011 жылғы 26 қаңтардағы № 9 қаулысымен
title:

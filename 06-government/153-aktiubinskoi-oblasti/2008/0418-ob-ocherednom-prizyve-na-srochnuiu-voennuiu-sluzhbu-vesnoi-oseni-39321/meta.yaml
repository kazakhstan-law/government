requisite: Постановление акимата города Актобе Актюбинской области от 18 апреля 2008 года № 1041. Зарегистрировано Управлением юстиции города Актобе Актюбинской области 4 мая 2008 года № 3-1-90. В связи с истечением срока исполнения утратило силу - (письмо Управления юстиции города Актобе Актюбинской области 17 июля 2009 года № 01-4-13/9372)
title:
  rus: Об очередном призыве на срочную военную службу весной-осенью 2008 года граждан 1981-1990 годов рождения и трудоустройстве уволенных в запас из Вооруженных Сил Республики Казахстан военнослужащих срочной службы
  kaz: 2008 жылдың көктем мен күзiнде 1981-1990 жылдары туған азаматтарды мерзімді әскери қызметке кезекті шақыру және Қазақстан Республикасы Қарулы Күштерiнен запасқа шыққан мерзiмдi әскери қызметшiлердi жұмысқа орналастыру туралы

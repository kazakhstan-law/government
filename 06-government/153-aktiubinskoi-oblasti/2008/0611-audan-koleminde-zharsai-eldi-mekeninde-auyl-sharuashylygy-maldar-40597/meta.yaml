requisite: Ақтөбе облысы Қобда аудандың әкімиятының 2008 жылғы 11 маусымдаы N 120 қаулысы. Ақтөбе облысының Қобда аудандық әділет басқармасында 2008 жылғы 11 шілдеде N 3-7-51 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық әкімдігінің 2010 жылғы 26 сәуірдегі № 101 қаулысымен

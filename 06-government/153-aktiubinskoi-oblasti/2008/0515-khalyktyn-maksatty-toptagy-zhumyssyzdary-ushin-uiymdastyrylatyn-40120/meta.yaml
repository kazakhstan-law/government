requisite: Ақтөбе облысы Мұғалжар аудандық әкімиятының 2008 жылғы 15 мамырдағы N 212 қаулысы. Ақтөбе облысының Мұғалжар аудандық Әділет басқармасында 2008 жылдың 10 маусымда N 3-9-64 тіркелді. Күші жойылды - Ақтөбе облысы Мұғалжар ауданының әкімдігінің 2009 жылғы 8 шілдедегі N 261 қаулысымен

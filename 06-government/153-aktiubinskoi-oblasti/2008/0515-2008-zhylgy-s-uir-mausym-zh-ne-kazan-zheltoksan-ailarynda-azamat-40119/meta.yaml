requisite: Ақтөбе облысы Мұғалжар аудандық әкімиятының 2008 жылғы 15 мамырдағы N 213 қаулысы. Ақтөбе облысының Мұғалжар аудандық әділет басқармасында 2008 жылдың 10 маусымда N 3-9-63 тіркелді. Күші жойылды - Ақтебе облысы Мұғалжар ауданының әкімдігінің 2009 жылғы 8 маусымдағы N 261 қаулысымен

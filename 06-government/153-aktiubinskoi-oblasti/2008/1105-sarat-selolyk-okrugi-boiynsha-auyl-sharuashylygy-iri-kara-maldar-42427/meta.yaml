requisite: Ақтөбе облысы Әйтеке би аудандық әкімиятының 2008 жылғы 5 қарашадағы N 440 қаулы. Ақтөбе облысы Әйтеке би ауданының әділет басқармасында 2008 жылғы 13 карашада N 3-2-63 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық әкімдігінің 2010 жылғы 1 наурыздағы № 46 қаулысымен

requisite: Ақтөбе облысы Қобда аудандық әкімиятының 2008 жылғы 25 сәуірдегі N 102 қаулысы. Ақтөбе облысының Қобда аудандық әділет басқармасында 2008 жылдың 30 сәуірде N 3-7-46 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық әкімдігінің 2008 жылғы 3 желтоқсандағы № 7 қаулысымен

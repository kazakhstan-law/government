act_code: '36959'
requisite: Ақтөбе облысы Мұғалжар аудандық әкімиятының 2007 жылғы 21 желтоқсандағы N 438 шешімі. Ақтөбе облысы Мұғалжар аудандық әділет басқармасында 2008 жылғы 17 қаңтарда N 3-9-60 тіркелді. Күші жойылды - Ақтөбе облысы Мұғалжар ауданының әкімдігінің 2009 жылғы 8 маусымдағы N 261 қаулысымен

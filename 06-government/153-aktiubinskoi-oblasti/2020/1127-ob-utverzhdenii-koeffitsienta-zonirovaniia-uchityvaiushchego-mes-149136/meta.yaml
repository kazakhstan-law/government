  title:
    rus: О внесении изменения в постановление акимата Каргалинского района от 27 ноября 2020 года № 248 «Об утверждении коэффициента зонирования, учитывающего месторасположение объекта налогообложения по Каргалинскому району»
    kaz: Қарғалы ауданы әкімдігінің 2020 жылғы 27 қарашадағы № 248 «Қарғалы ауданы бойынша салық салу объектісінің орналасқан жерін ескеретін аймаққа бөлу коэффициенттерін бекіту туралы» қаулысына өзгеріс енгізу туралы»

  title:
    rus: О внесении изменений в постановление акимата Мартукского района от 5 февраля 2020 года № 22 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Мартукскому району на 2020 год»
    kaz: Мәртөк ауданы әкімдігінің 2020 жылғы 5 ақпандағы № 22 «2020 жылға Мәртөк ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/148364/rus

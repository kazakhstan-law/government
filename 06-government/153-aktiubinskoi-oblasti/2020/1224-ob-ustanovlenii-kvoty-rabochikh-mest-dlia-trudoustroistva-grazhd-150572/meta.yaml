act_code: '150572'
requisite: Постановление акимата Мугалжарского района Актюбинской области от 24 декабря 2020 года № 394. Зарегистрировано Департаментом юстиции Актюбинской области 25 декабря 2020 года № 7834
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организации образования по Мугалжарскому району на 2021 год
  kaz: 2021 жылға арналған Мұғалжар ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

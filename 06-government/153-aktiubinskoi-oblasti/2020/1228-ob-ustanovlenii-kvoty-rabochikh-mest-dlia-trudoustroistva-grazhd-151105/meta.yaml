requisite: Постановление акимата Каргалинского района Актюбинской области от 28 декабря 2020 года № 289. Зарегистрировано Департаментом юстиции Актюбинской области 29 декабря 2020 года № 7869
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Каргалинскому району на 2021 год
  kaz: 2021 жылға Қарғалы ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

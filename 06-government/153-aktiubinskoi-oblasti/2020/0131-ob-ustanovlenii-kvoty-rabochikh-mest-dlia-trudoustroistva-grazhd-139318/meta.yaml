requisite: Постановление акимата города Актобе Актюбинской области от 31 января 2020 года № 574. Зарегистрировано Департаментом юстиции Актюбинской области 4 февраля 2020 года № 6798
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по городу Актобе на 2020 год
  kaz: 2020 жылға Ақтөбе қаласы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Кобдинского района от 8 января 2020 года № 4 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Кобдинскому району на 2020 год»
    kaz: Қобда ауданы әкімдігінің 2020 жылғы 8 қаңтардағы № 4 «2020 жылға Қобда ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/147174/rus

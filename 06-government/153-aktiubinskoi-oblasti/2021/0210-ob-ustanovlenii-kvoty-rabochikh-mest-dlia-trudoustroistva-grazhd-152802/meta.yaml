requisite: Постановление акимата города Актобе Актюбинской области от 10 февраля 2021 года № 525. Зарегистрировано Департаментом юстиции Актюбинской области 11 февраля 2021 года № 8050
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, по городу Актобе на 2021 год
  kaz: 2021 жылға Ақтөбе қаласы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

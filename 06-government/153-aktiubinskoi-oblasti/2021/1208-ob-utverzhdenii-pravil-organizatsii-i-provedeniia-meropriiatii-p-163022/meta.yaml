act_code: '163022'
requisite: Постановление акимата Темирского района Актюбинской области от 8 декабря 2021 года № 246. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 декабря 2021 года № 26300
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Темирскому району
  kaz: Темір ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление акимата Темирского района от 8 декабря 2021 года № 246 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Темирскому району»
    kaz: Темір ауданы әкімдігінің 2021 жылғы 8 желтоқсандағы № 246 «Темір ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

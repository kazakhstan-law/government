  title:
    rus: О внесении изменения в постановление акимата Шалкарского района от 26 февраля 2021 года № 37 «Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности по Шалкарскому району»
    kaz: Шалқар ауданы әкімдігінің 2021 жылғы 26 ақпандағы № 37 «Шалқар ауданы бойынша азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

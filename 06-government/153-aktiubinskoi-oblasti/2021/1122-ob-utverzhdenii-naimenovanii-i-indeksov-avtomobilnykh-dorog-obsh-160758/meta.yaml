  title:
    rus: О внесении изменения в постановления акимата Мугалжарского района от 22 ноября 2021 года № 364 «Об утверждении наименований и индексов автомобильных дорог общего пользования районного значения по Мугалжарскому району»
    kaz: «Мұғалжар ауданы бойынша аудандық маңызы бар жалпыға ортақ пайдаланымдағы автомобиль жолдарының атаулары мен индекстерін бекiту туралы» Мұғалжар ауданы әкімдігінің 2021 жылғы 22 қарашадағы № 364 қаулысына өзгеріс енгізу туралы

  kaz: Ақтөбе облысы Шалқар және Мұғалжар аудандарының аумағында қолданыстағы «Бұхара-Орал» магистральдық газ құбырына бөлінген жер учаскелерінің аумақтарын кесіп өтетін өзендердің бір бөлігі үшін су қорғау аймақтары мен белдеулерін белгілеу туралы

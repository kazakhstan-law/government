requisite: Постановление акимата Байганинского района Актюбинской области от 1 марта 2011 года № 71. Зарегистрировано Департаментом юстиции Актюбинской области 9 марта 2011 года № 3-4-109. Утратило силу в связи с истечением срока действия письмом акима Байганинского района Актюбинской области от 27 декабря 2011 года № 02-1710
title:
  rus: Об определении мест для размещения в Байганинском районе Актюбинской области агитационных печатных материалов кандидатов на внеочередных выборах Президента Республики Казахстан
  kaz: Қазақстан Республикасы Президентінің кезектен тыс сайлауының кандидаттарына үгіттік баспа материалдарын орналастыру үшін Ақтөбе облысы, Байғанин ауданы бойынша орындар белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Мугалжарского района от 18 октября 2011 года № 405 "Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций"
    kaz: Мұғалжар ауданы әкімдігінің 2011 жылғы 18 қазандағы № 405 "Бас бостандығынан айыру орындарынан босатылған тұлғалар мен интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квоталарын белгілеу туралы" қаулысына өзгерістер енгізу туралы

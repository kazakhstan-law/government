act_code: '61201'
requisite: Постановление акимата Мугалжарского района Актюбинской области от 18 октября 2011 года № 405. Зарегистрировано Департаментом юстиции Актюбинской области 10 ноября 2011 года № 3-9-154. Утратило силу постановлением акимата Мугалжарского района Актюбинской области от 30 июня 2016 года № 236
title:
  rus: Об установлении квоты рабочих мест для лиц состоящих, на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық - атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар мен интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

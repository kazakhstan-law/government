act_code: '59015'
requisite: Постановление акимата Шалкарского района Актюбинской области от 3 мая 2011 года № 99. Зарегистрировано Управлением юстиции Шалкарского района Актюбинской области 23 мая 2011 года № 3-13-152. Утратило силу постановлением акимата Шалкарского района Актюбинской области от 22 июля 2016 года № 136
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекций, а также лиц, освобожденных из мест лишения свободы, и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық – атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

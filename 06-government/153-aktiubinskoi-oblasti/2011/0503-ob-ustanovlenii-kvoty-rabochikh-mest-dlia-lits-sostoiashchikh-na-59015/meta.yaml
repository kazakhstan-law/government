  title:
    rus: О внесении изменений в постановление акимата Шалкарского района от 3 мая 2011 года № 99 "Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организации по Шалкарскому району"
    kaz: Шалқар ауданы әкімдігінің 2011 жылғы 3 мамырдағы № 99 "Шалқар ауданында бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгерістер енгізу туралы

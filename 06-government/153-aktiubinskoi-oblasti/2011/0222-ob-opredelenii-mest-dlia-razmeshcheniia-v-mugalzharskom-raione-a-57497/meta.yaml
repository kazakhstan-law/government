requisite: Постановление акимата Мугалжарского района Актюбинской области от 22 февраля 2011 года № 86. Зарегистрировано Департаментом юстиции Актюбинской области 3 марта 2011 года № 3-9-139. Утратило силу постановлением акимата Мугалжарского района Актюбинской области от 26 марта 2012 года № 121
title:
  rus: Об определении мест для размещения в Мугалжарском районе Актюбинской области агитационных печатных материалов кандидатов на внеочередных выборах Президента Республики Казахстан
  kaz: Қазақстан Республикасы Президентінің кезектен тыс сайлауының кандидаттарына үгіттік баспа материалдарын орналастыру үшін Ақтөбе облысы, Мұғалжар ауданы бойынша орындар белгілеу туралы

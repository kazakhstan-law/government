  title:
    rus: О внесении изменения и дополнений в постановление акимата Темирского района от 7 апреля 2011 года № 63 "Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций"
    kaz: Темір ауданы әкімдігінің 2011 жылғы 7 сәуірдегі № 63 "Бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы" қаулысына өзгеріс пен толықтырулар енгізу туралы

act_code: '197852'
requisite: Постановление акимата Актюбинской области от 13 июня 2024 года № 155
title:
  rus: Об отмене постановления акимата Актюбинской области от 11 апреля 2024 года № 86 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и норм субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений на 2024 год»
  kaz: «2024 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын бекіту туралы» Ақтөбе облысы әкімдігінің 2024 жылғы 11 сәуірдегі № 86 қаулысының күшін жою туралы

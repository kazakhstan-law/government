act_code: '196438'
requisite: Постановление акимата Актюбинской области от 26 апреля 2024 года № 113
title:
  rus: Об утверждении норматива отчисления части чистого дохода коммунальных государственных предприятий Актюбинской области, за исключением организаций среднего, технического и профессионального, послесреднего образования в организационно-правовой форме государственных предприятий на праве хозяйственного ведения и дошкольных организаций в организационно-правовой форме казенных предприятий, дополнительного образования для детей
  kaz: Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың ұйымдық-құқықтық нысанындағы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарын және қазыналық кәсіпорындардың ұйымдық-құқықтық нысанындағы мектепке дейінгі ұйымдарды, балаларға арналған қосымша білім беру ұйымдарын қоспағанда, Ақтөбе облысының коммуналдық мемлекеттік кәсіпорындарының таза табысының бір бөлігін аудару нормативін бекіту туралы

  title:
    rus: О внесении дополнений в постановление акимата Актюбинской области от 19 марта 2024 года № 66 «Об утверждении границ охранных зон, зон регулирования застройки и зон охраняемого природного ландшафта памятников истории и культуры Актюбинской области»
    kaz: «Ақтөбе облысының тарих және мәдениет ескерткіштерінің қорғау аймақтарының, құрылыс салуды реттеу аймақтарының және қорғалатын табиғи ландшафт аймақтарының шекараларын бекіту туралы» Ақтөбе облысы әкімдігінің 2024 жылғы 19 наурыздағы № 66 қаулысына толықтырулар енгізу туралы

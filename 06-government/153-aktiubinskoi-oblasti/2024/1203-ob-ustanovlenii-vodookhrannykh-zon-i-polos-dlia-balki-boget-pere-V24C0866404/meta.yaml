title:
  rus: Об установлении водоохранных зон и полос для балки «Бөгет», пересекающей автомобильную дорогу районного значения «Светлый-Кумкудук-Жабасак-Байжанкол» на территории Айтекебийского района Актюбинской области и режима их хозяйственного использования
  kaz: Ақтөбе облысының Әйтеке би ауданының аумағында аудандық маңызы бар «Светлый-Құмкұдық-Жабасақ-Байжанкөл» автомобиль жолын кесіп өтетін «Бөгет» сайы үшін су қорғау аймақтары мен белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 15 июля 2024 года № 191 «Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием на 2024-2025 учебный год по Актюбинской области»
    kaz: «Ақтөбе облысы бойынша техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға 2024-2025 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы» Ақтөбе облысы әкімдігінің 2024 жылғы 15 шілдедегі № 191 қаулысына өзгеріс енгізу туралы

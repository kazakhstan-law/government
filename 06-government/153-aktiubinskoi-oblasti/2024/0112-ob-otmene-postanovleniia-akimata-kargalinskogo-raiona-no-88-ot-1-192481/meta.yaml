act_code: '192481'
requisite: Постановление акимата Каргалинского района Актюбинской области от 12 января 2024 года № 3
title:
  rus: Об отмене постановления акимата Каргалинского района № 88 от 17 августа 2023 года «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Каргалинскому району»
  kaz: Қарғалы ауданы әкімдігінің 2023 жылғы 17 тамыздағы № 88 «Қарғалы ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысының күшін жою туралы

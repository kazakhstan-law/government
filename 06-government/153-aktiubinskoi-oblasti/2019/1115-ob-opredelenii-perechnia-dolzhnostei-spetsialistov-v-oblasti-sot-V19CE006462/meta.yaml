  title:
    rus: О внесении изменения в постановление акимата Иргизского района Актюбинской области от 15 ноября 2019 года № 196 «Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности по Иргизскому району»
    kaz: Ақтөбе облысы Ырғыз ауданы әкімдігінің 2019 жылғы 15 қарашадағы № 196 «Ырғыз ауданы бойынша азаматтық қызметші болып табылатын және ауылдық жерлерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

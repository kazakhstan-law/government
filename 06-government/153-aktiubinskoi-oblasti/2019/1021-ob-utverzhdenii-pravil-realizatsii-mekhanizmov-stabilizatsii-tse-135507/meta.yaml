  title:
    rus: Об отмене постановления акимата Актюбинской области от 30 ноября 2021 года № 391 «О внесении изменения в постановление акимата Актюбинской области от 21 октября 2019 года № 440 «Об утверждении правил реализации механизмов стабилизации цен на социально значимые продовольственные товары»
    kaz: «Ақтөбе облысы әкімдігінің 2019 жылғы 21 қазандағы № 440 «Әлеуметтік маңызы бар азық-түлік тауарларына бағаларды тұрақтандыру тетіктерін іске асыру қағидаларын бекіту туралы» қаулысына өзгеріс енгізу туралы» Ақтөбе облысы әкімдігінің 2021 жылғы 30 қарашадағы № 391 қаулысының күшін жою туралы

requisite: Постановление акимата Мугалжарского района Актюбинской области от 23 декабря 2019 года № 493. Зарегистрировано Департаментом юстиции Актюбинской области 24 декабря 2019 года № 6595
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организации образования по Мугалжарскому району на 2020 год
  kaz: 2020 жылға арналған Мұғалжар ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

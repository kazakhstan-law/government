requisite: Постановление акимата Кобдинского района Актюбинской области от 23 декабря 2019 года № 289. Зарегистрировано Департаментом юстиции Актюбинской области 24 декабря 2019 года № 6592. Утратило силу постановлением акимата Кобдинского района Актюбинской области от 4 декабря 2020 года № 359
title:
  rus: Об определении перечня должностей специалистов в области образования, социального обеспечения, культуры и спорта являющихся гражданскими служащими и работающих в сельской местности по Кобдинскому району
  kaz: Қобда ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы

  title:
    rus: О внесении изменения в постановление акимата Кобдинского района от 23 декабря 2019 года № 289 «Об определении перечня должностей специалистов в области образования, социального обеспечения, культуры и спорта являющихся гражданскими служащими и работающих в сельской местности по Кобдинскому району»
    kaz: Қобда ауданы әкімдігінің 2019 жылғы 23 желтоқсандағы № 289 «Қобда ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

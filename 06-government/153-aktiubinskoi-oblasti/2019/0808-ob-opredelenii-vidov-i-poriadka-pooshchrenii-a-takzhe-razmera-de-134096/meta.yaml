    kaz: Қобда ауданы әкімдігінің 2019 жылғы 8 тамыздағы № 223 «Қобда ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

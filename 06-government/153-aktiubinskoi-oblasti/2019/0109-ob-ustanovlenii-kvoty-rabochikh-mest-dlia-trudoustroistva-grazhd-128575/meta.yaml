requisite: Постановление акимата Шалкарского района Актюбинской области от 9 января 2019 года № 9. Зарегистрировано Управлением юстиции Шалкарского района Департамента юстиции Актюбинской области 15 января 2019 года № 3-13-231
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Шалкарскому району на 2019 год
  kaz: 2019 жылға Шалқар ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

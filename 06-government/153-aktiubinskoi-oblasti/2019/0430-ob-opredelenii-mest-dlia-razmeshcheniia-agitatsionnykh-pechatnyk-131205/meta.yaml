  title:
    rus: О внесении изменений в постановление акимата Каргалинского района Актюбинской области от 30 апреля 2019 года № 90 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и предоставлении кандидатам на договорной основе помещений для встреч с избирателями»
    kaz: Ақтөбе облысы Қарғалы ауданы әкімдігінің 2019 жылғы 30 сәуірдегі № 90 «Барлық кандитаттарға үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесу үшін кандидаттарға шарттық негізде үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

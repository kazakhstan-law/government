  kaz: Аудан, ауылдық округтерінің әкімі аппараттарының және Қобда ауданының жергілікті бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне қызметтік куәлік беру Қағидаларын және оның сипаттамасын бекіту туралы

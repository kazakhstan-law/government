  title:
    rus: О внесении изменений в постановление акимата Кобдинского района от 9 января 2019 года № 6 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Кобдинскому району на 2019 год»
    kaz: Қобда ауданы әкімдігінің 2019 жылғы 9 қаңтардағы № 6 «2019 жылға Қобда ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134094/rus

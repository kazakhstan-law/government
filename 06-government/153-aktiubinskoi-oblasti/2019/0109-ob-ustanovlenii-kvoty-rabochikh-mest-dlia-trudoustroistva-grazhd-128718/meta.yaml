act_code: '128718'
requisite: Постановление акимата Кобдинского района Актюбинской области от 9 января 2019 года № 6. Зарегистрировано Управлением юстиции Кобдинского района Департамента юстиции Актюбинской области 15 января 2019 года № 3-7-191
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Кобдинскому району на 2019 год
  kaz: 2019 жылға Қобда ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

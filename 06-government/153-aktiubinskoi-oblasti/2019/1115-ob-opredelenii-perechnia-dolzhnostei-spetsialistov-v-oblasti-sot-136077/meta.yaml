  title:
    rus: О внесении изменений в постановление акимата Иргизского района от 15 ноября 2019 года № 196 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ырғыз ауданы әкімдігінің 2019 жылғы 15 қарашадағы № 196 «Азаматтық қызметші болып табылатын және ауылдық жерлерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

act_code: '136077'
requisite: Постановление акимата Иргизского района Актюбинской области от 15 ноября 2019 года № 196. Зарегистрировано Департаментом юстиции Актюбинской области 18 ноября 2019 года № 6462
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности по Иргизскому району
  kaz: Ырғыз ауданы бойынша азаматтық қызметші болып табылатын және ауылдық жерлерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

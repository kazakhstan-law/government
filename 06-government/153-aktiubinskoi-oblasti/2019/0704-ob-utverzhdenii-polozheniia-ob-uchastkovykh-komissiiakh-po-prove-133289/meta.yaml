title:
  rus: Об утверждении Положения об участковых комиссиях по проведению обследования материального положения лиц (семей), обратившихся за государственной адресной социальной помощью, а также критериев определения нуждаемости в государственной адресной социальной помощи по результатам обследования материального положения заявителя
  kaz: Мемлекеттік атаулы әлеуметтік көмек алуға өтініш берген адамдардың (отбасылардың) материалдық жағдайына тексеру жүргізу жөніндегі учаскелiк комиссиялар туралы ережені, сонымен қатар өтініш берушінің материалдық жағдайын тексеру қорытындысы бойынша мемлекеттік атулы әлеуметтік көмекке мұқтаждығын айқындау өлшемшарттарын бекіту туралы

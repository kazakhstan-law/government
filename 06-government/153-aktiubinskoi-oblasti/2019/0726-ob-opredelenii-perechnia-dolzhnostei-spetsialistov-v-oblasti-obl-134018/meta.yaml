  title:
    rus: О внесении изменений в постановление акимата Айтекебийского района Актюбинской области от 26 июля 2019 года № 151 «Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ақтөбе облысы Әйтеке би ауданы әкімдігінің 2019 жылғы 26 шілдедегі № 151 «Азаматтық қызметші болып табылатын және ауылдық жерлерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

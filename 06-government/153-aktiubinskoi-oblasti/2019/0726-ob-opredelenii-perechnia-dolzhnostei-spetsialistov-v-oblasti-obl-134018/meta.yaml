title:
  rus: Об определении перечня должностей специалистов в области области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерлерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

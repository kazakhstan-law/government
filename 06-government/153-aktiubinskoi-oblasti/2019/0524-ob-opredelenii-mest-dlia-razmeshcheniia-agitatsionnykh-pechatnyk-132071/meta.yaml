  title:
    rus: О внесении изменений в постановление акимата Алгинского района от 24 мая 2019 года № 203 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и предоставлении помещений кандидатам для встреч с избирателями на договорной основе»
    kaz: Алға аудандық әкімдігінің 2019 жылғы 24 мамырдағы № 203 «Барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін кандидаттарға шарттық негізде үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Каргалинского района Актюбинской области от 31 декабря 2019 года № 236. Зарегистрировано Департаментом юстиции Актюбинской области 5 января 2020 года № 6646
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Каргалинскому району на 2020 год
  kaz: 2020 жылға Қарғалы ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

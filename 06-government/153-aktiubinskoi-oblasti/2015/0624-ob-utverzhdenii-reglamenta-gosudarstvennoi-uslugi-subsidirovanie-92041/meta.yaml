title:
  rus: Об утверждении регламента государственной услуги "Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда"
  kaz: '"Жеміс-жидек дақылдары мен жүзімнің көпжылдық көшеттерін отырғызу және өсіру (оның ішінде қалпына келтіру) шығындарының құнын субсидиялау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

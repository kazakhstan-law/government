  title:
    rus: О внесении изменений в постановление акимата Шалкарского района от 17 ноября 2015 года № 259 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по Шалкарскому району»
    kaz: «Шалқар ауданы бойынша мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыруды және ата-ананың ақы төлеу мөлшерін бекіту туралы» Шалқар ауданы әкімдігінің 2015 жылғы 17 қарашадағы № 259 қаулысына өзгерістер енгізу туралы

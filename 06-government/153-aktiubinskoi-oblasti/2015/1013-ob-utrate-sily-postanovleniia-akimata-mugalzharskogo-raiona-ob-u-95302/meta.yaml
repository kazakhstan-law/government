act_code: '95302'
requisite: Постановление от 13.10.2015 №376, Акимат Мугалжарского района
title:
  rus: Об утрате силы постановления акимата Мугалжарского района об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Мугалжарского района
  kaz: Мұғалжар ауданының шалғайдағы елді мекендерінде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемасы мен тәртібін бекіту туралы қаулысының күшін жою туралы

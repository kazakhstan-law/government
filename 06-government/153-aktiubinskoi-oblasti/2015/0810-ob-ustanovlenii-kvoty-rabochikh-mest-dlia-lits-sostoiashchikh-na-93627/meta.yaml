requisite: Постановление акимата Алгинского района Актюбинской области от 10 августа 2015 года № 336. Зарегистрировано Департаментом юстиции Актюбинской области 7 сентября 2015 года № 4503. Утратило силу постановлением акимата Алгинского района Актюбинской области от 18 мая 2016 года № 212
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц,  освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшiн жұмыс орындарының квотасын белгiлеу туралы

requisite: Постановление акимата Байганинского района Актюбинской области от 13 мая 2015 года № 111. Зарегистрировано Департаментом юстиции Актюбинской области 9 июня 2015 года № 4346. Утратило силу постановлением акимата Байганинского района Актюбинской области от 20 апреля 2016 года № 73.
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметiнiң есебiнде тұрған адамдар, бас бостандығынан айыру орындарынан босатылған және интернаттық ұйымдарды бiтiрушi кәмелетке толмағандар үшiн жұмыс орындарының квотасын белгiлеу туралы

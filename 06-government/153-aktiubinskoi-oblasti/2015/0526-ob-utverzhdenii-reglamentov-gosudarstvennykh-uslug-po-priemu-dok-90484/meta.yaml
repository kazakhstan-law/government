  title:
    rus: О внесении изменений в постановление акимата Актюбинской области от 26 мая 2015 года № 171 «Об утверждении регламентов государственных услуг по приему документов для участия в конкурсах на присуждение звания «Лучший педагог» и на замещение руководителей государственных учреждений среднего образования»
    kaz: Ақтөбе облысы әкімдігінің 2015 жылғы 26 мамырдағы № 171 «Үздік педагог» атағын беру және мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурстарына қатысу үшін құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» қаулысына өзгерістер енгізу туралы

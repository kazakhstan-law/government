  title:
    rus: О внесении изменений и дополнений в постановление акимата области от 24 апреля 2015 года № 135 «Об утверждении регламента государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»»
    kaz: ««Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» облыс әкімдігінің 2015 жылғы 24 сәуірдегі № 135 қаулысына өзгерістер мен толықтырулар енгізу туралы

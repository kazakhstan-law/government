act_code: '97355'
requisite: Постановление акимата города Актобе Актюбинской области от 18 декабря 2015 года № 4899. Зарегистрировано Департаментом юстиции Актюбинской области 12 января 2016 года № 4673. Утратило силу постановлением акимата города Актобе Актюбинской области от 22 августа 2016 года № 3260
title:
  rus: Об утверждении перечня организаций, в которых будут проводиться общественные работы, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по городу Актобе на 2016 год
  kaz: 2016 жылға Ақтөбе қаласы бойынша қоғамдық жұмыстар жүргізілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

requisite: Постановление акимата Хромтауского района Актюбинской области от 27 января 2015 года № 31. Зарегистрировано Департаментом юстиции Актюбинской области 17 февраля 2015 года № 4202. Утратило силу постановлением акимата Хромтауского района Актюбинской области от 11 мая 2016 года № 173
title:
  rus: Об утверждении перечня организаций, в которых будут проводиться общественные работы, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Хромтаускому району
  kaz: Хромтау ауданы бойынша қоғамдық жұмыстар жүргізілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

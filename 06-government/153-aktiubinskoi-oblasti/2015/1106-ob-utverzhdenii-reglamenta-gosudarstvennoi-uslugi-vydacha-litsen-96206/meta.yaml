title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на осуществление деятельности на производство (формуляции) пестицидов (ядохимикатов), реализацию пестицидов (ядохимикатов), применение пестицидов (ядохимикатов) аэрозольным и фумигационным способами»
  kaz: «Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдiк және фумигациялық тәсiлдермен қолдануға байланысты қызметті жүзеге асыруға лицензия беру» мемлекеттiк көрсетілетін қызмет регламентін бекіту туралы

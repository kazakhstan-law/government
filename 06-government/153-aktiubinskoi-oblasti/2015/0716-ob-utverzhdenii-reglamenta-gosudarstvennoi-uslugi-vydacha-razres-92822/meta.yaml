  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 16 июля 2015 года № 265 «Об утверждении регламента государственной услуги «Выдача разрешения на размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения»
    kaz: Ақтөбе облысы әкімдігінің 2015 жылғы 16 шілдедегі № 265 «Облыстық және аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарына бөлінген белдеуде, жарнаманы тұрақты орналастыру объектілерінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/111391/rus

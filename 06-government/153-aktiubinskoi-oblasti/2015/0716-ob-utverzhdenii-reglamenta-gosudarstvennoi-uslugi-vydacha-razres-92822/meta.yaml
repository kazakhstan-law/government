  title:
    rus: О внесении изменений в постановление акимата Актюбинской области от 16 июля 2015 года № 265 "Об утверждении регламента государственной услуги "Выдача разрешения на размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения"
    kaz: '"Облыстық және аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарына бөлінген белдеуде, жарнаманы тұрақты орналастыру объектілерінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" Ақтөбе облысы әкімдігінің 2015 жылғы 16 шілдедегі № 265 қаулысына өзгерістер енгізу туралы'

requisite: Постановление акимата Актюбинской области от 16 июля 2015 года № 265. Зарегистрировано Департаментом юстиции Актюбинской области 13 августа 2015 года № 4465. Утратило силу постановлением акимата Актюбинской области от 6 марта 2020 года № 95
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешения на размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения"
  kaz: '"Облыстық және аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарына бөлінген белдеуде, жарнаманы тұрақты орналастыру объектілерлерінде сыртқы (көрнекі) жарнама орналастыруға рұқсат беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

act_code: '98822'
requisite: Постановление акимата Мугалжарского района Актюбинской области от 31 декабря 2015 года № 492. Зарегистрировано Департаментом юстиции Актюбинской области 2 февраля 2016 года № 4731. Утратило силу постановлением акимата Мугалжарского района Актюбинской области от 30 июня 2016 года № 236
title:
  rus: Об утверждении перечня организаций, в которых будут проводиться общественные работы, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Мугалжарскому району на 2016 год
  kaz: 2016 жылға Мұғалжар ауданы бойынша қоғамдық жұмыстар жүргізілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

  title:
    rus: О внесении изменений в постановление акимата Актюбинской области от 8 июня 2015 года № 201 "Об утверждении регламента государственной услуги "Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур"
    kaz: '"Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" Ақтөбе облысы әкімдігінің 2015 жылғы 8 маусымдағы № 201 қаулысына өзгерістер енгізу туралы'

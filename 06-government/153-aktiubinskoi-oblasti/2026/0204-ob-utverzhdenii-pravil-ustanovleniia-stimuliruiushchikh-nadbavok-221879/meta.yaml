act_code: '221879'
requisite: Постановление акимата Мугалжарского района Актюбинской области от 4 февраля 2026 года № 37
title:
  rus: Об утверждении Правил установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Центр по вопросам религии среди молодежи и связи с общественностью» государственного учреждения «Отдел внутренней политики Мугалжарского района», финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Мұғалжар аудандық ішкі саясат бөлімі» мемлекеттік мекемесінің «Жастар арасында дін мәселелері және қоғаммен байланыс» коммуналдық мемлекеттік мекемесінің қызметкерлерінің лауазымдық еңбекақыларына ынталандыру үстемеақыларын белгілеу қағидаларын бекіту туралы

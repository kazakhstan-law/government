act_code: '221699'
requisite: Постановление акимата Айтекебийcкого района Актюбинской области от 21 января 2026 года № 19
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам водителей организаций, финансируемых за счёт средств местного бюджета Айтекебийского района
  kaz: Әйтеке би ауданының жергілікті бюджеттен қаржыландырылатын ұйымдар жүргізушілерінің лауазымдық айлықақыларына жергілікті бюджет қаражаты есебінен ынталандыру үстемеақыларын белгілеу тәртібі мен шарттарын айқындау туралы

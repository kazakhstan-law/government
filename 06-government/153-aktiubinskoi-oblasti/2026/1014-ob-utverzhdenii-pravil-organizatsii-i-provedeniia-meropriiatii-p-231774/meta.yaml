act_code: '231774'
requisite: Постановление акимата Айтекебийского района Актюбинской области от 14 октября 2026 года № 311. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 2026 года № 40175
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Айтекебийского района Актюбинской области
  kaz: Ақтөбе облысы Әйтеке би ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

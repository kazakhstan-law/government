act_code: '70110'
requisite: Постановление акимата Актюбинской области от 26 декабря 2012 года № 471. Зарегистрировано Департаментом юстиции Актюбинской области 15 января 2013 года № 3494. Утратило силу постановлением акимата Актюбинской области от 28 декабря 2013 года № 429
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление вида деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуi және өткiзуі жөніндегі қызмет түрін жүзеге асыруға лицензия беру, қайта рәсімдеу, лицензияның телнұсқаларын беру" электрондық мемлекеттік қызмет регламентін бекіту туралы'

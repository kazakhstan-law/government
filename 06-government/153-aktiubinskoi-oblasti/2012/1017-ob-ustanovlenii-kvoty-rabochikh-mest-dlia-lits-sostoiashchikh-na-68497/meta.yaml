requisite: Постановление акимата Иргизского района Актюбинской области от 17 октября 2012 года № 211. Зарегистрировано Департаментом юстиции Актюбинской области 8 ноября 2012 года № 3428. Утратило силу постановлением акимата Иргизского района Актюбинской области от 25 апреля 2016 года № 79
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы

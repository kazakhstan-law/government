act_code: '64736'
requisite: Постановление акимата Айтекебийского района Актюбинской области от 30 марта 2012 года № 55. Зарегистрировано Департаментом юстиции Актюбинской области 18 апреля 2012 года № 3-2-132. Утратило силу постановлением акимата Айтекебийского района Актюбинской области от 7 июля 2016 года № 125
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций по Айтекебийскому району
  kaz: Әйтеке би ауданы бойынша қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

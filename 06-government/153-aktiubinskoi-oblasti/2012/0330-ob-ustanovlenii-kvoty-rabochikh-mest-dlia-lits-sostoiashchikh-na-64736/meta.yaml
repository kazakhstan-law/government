  title:
    rus: О внесении изменений в постановление акимата Айтекебийского района от 30 марта 2012 года № 55 "Об установлении квоты рабочих мест для лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций"
    kaz: Әйтеке би ауданы әкімдігінің 2012 жылғы 30 наурыздағы "Бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарының квотасын белгілеу туралы" № 55 қаулысына өзгерістер енгізу туралы

act_code: '66106'
requisite: Постановление акимата Актюбинской области от 28 мая 2012 года № 192. Зарегистрировано Департаментом юстиции Актюбинской области 13 июня 2012 года № 3397. Утратило силу постановлением акимата Актюбинской области от 30 ноября 2012 года № 431
title:
  rus: Об утверждении регламенты государственной услуги "Постановка на учет граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде, в местных исполнительных органах Актюбинской области"
  kaz: '"Ақтөбе облысының жергілікті атқарушы органдарында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызмет регламентін бекіту туралы'

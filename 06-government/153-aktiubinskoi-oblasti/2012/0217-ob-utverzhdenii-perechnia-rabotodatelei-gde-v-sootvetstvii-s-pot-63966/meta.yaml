requisite: Постановление акимата Каргалинского района Актюбинской области от 17 февраля 2012 года № 31. Зарегистрировано Департаментом юстициии Актюбинской области 5 марта 2012 года № 3-6-136. Утратило силу постановлением акимата Каргалинского района Актюбинской области от 11 июня 2012 года № 123

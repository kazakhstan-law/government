act_code: '69356'
requisite: Постановление акимата Актюбинской области от 23 ноября 2012 года № 419. Зарегистрировано Департаментом юстиции Актюбинской области 25 декабря 2012 года № 3474. Утратило силу постановлением акимата Актюбинской области от 28 декабря 2013 года № 429
title:
  rus: Об утверждении регламента государственной услуги "Принятие местными исполнительными органами области решения по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков за пользователями животным миром и установлению сервитутов для нужд охотничьего и рыбного хозяйства"
  kaz: '"Облыстың жергілікті атқарушы органдарының жануарлар дүниесін пайдаланушыларға аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін бекітіп беру мен аңшылық және балық шаруашылықтарының қажеттіліктері үшін сервитуттарды белгілеу жөнінде шешімдер қабылдауы" мемлекеттік қызмет регламентін бекіту туралы'

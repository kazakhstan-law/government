title:
  rus: Об утверждении Правил предоставления по выбору субъектов малого предпринимательства в аренду или в доверительное управление с правом последующей передачи в собственность неиспользуемых производственных помещений и объектов, офисных помещений на государственных коммунальных предприятиях и организациях с государственным коммунальным участием, на основании представленной ими информации
  kaz: Шағын кәсіпкерлік субъектілері тапсырған ақпараттар негізінде олардың қалауымен мемлекеттік коммуналдық кәсіпорындар мен мемлекеттік коммуналдық меншікке қатысты ұйымдардың пайдаланылмай тұрған жайлары мен объектілерін, кеңселік жайларын кейін меншікке беру құқымен жалға немесе сенімгерлік баскаруға беру туралы Ережені бекіту туралы

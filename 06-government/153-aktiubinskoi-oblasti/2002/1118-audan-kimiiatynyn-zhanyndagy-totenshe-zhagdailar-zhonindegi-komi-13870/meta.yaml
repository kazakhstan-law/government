act_code: '13870'
requisite: Ақтөбе облысы Хромтау ауданы әкiмиятының 2002 жылғы 18 қарашадағы N 483 қаулысы. Ақтөбе облыстық Әділет басқармасында 2002 жылғы 9 желтоқсанда N 1877 тіркелді. Мемлекеттік тіркеуге жатпайды - Ақтөбе облысы Әділет департаментінің 2005 жылғы 19 сәуірдегі қорытындысымен

  title:
    rus: О внесении изменений в постановление акимата области № 106 от 11 июля 2002 года «О создании рабочей группы по обеспечению полноты поступления налогов и сборов в бюджет области» (Зарегистрировано в Департаменте юстиции области 2 августа 2002 года № 1746, 21 июля 2003 года № 2269 и 27 апреля 2004 года № 2685, опубликовано в изданиях «Актобе» и «Актюбинский вестник» 31 июля 2003 года и 13 мая 2004 года.)
    kaz: «Облыс бюджетіне түсетін салықтар мен алымдар түсімдерінің толықтығын қамтамасыз ету жөніндегі жұмыс тобын құру туралы» облыс әкімиятының 2002 жылғы 11 шілдедегі № 106 қаулысына өзгерістер енгізу туралы(Облыс әділет Департаментінде 2002 жылы 2 тамызда № 1746, 2003 жылы 21 шілдеде № 2269 және 2004 жылы 27 сәуірде № 2685 тіркелген,«Ақтөбе», «Актюбинский вестник» баспасөздерінде 2003 жылы 31 шілде айында және 2004 жылы 13 мамыр айында жарияланды.)

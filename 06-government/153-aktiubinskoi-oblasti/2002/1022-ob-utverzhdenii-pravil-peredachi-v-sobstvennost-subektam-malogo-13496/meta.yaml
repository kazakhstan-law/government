act_code: '13496'
requisite: Постановление акимата Актюбинской области от 23 октября 2002 года № 169. Зарегистрировано Управлением юстиции Актюбинской области 7 ноября 2002 года № 1858
title:
  rus: Об утверждении Правил Передачи в собственность субъектам малого предпринимательства неиспользуемых производственных помещений и объектов, офисных помещений государственных коммунальных предприятий и организаций с государственным коммунальным участием, переданных в аренду или доверительное управление на условиях организации производственной деятельности или развития сферы услуг населению, за исключением торгово-закупочной (посреднической) деятельности
  kaz: Шағын кәсіпкерлік субъектілері меншігіне өндірістік қызметтерді ұйымдастыру немесе халыққа сауда-саттық (делдалдық) қызметінен басқа, қызмет көрсету саласын дамыту шартымен жалға немесе сенімгерлік басқаруға берілген мемлекеттік коммуналдық кәсіпорындар мен мемлекеттік коммуналдық меншікке қатысты ұйымдардың пайдаланылмайтын өндірістік үй-жайлары мен объектілерін, кеңсе жайларын беру жөніндегі Ережені бекіту туралы

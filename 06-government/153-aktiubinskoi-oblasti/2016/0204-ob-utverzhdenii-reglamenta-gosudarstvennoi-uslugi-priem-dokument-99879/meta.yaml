act_code: '99879'
requisite: Постановление акимата Актюбинской области от 4 февраля 2016 года № 34. Зарегистрировано Департаментом юстиции Актюбинской области 9 марта 2016 года № 4768. Утратило силу постановлением акимата Актюбинской области от 18 февраля 2020 года № 55
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравнненым к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

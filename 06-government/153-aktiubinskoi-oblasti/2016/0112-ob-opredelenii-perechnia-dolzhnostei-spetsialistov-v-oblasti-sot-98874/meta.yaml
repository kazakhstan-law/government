caused_by:
  code: '161980'
  requisite: Постановление акимата Мартукского района Актюбинской области от 10 декабря 2021 года № 300. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 декабря 2021 года № 25864
  title:
    rus: О внесении изменений в постановление акимата Мартукского района Актюбинской области от 12 января 2016 года № 8 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ақтөбе облысы Мәртөк ауданы әкімдігінің 2016 жылғы 12 қаңтардағы № 8 «Азаматтық қызметшілер болып табылатын және ауылдық жерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161980/rus

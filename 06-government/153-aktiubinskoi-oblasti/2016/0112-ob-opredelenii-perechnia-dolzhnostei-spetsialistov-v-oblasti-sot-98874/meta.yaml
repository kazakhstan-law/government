  title:
    rus: О внесении изменения в постановление акимата Мартукского района Актюбинской области от 12 января 2016 года № 8 «Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности Мартукского района Актюбинской области»
    kaz: Ақтөбе облысы Мәртөк ауданы әкімдігінің 2016 жылғы 12 қаңтардағы № 8 «Азаматтық қызметшілер болып табылатын және Ақтөбе облысы Мәртөк ауданының ауылдық жерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

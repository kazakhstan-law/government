act_code: '98874'
requisite: Постановление акимата Мартукского района Актюбинской области от 12 января 2016 года № 8. Зарегистрировано Департаментом юстиции Актюбинской области 03 февраля 2016 года № 4736
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности Мартукского района Актюбинской области
  kaz: Азаматтық қызметшілер болып табылатын және Ақтөбе облысы Мәртөк ауданының ауылдық жерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

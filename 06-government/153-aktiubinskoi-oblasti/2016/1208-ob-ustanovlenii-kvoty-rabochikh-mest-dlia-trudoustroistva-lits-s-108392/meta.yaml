act_code: '108392'
requisite: Постановление акимата Хромтауского района Актюбинской области от 08 декабря 2016 года № 424. Зарегистрировано Департаментом юстиции Актюбинской области 21 декабря 2016 года № 5166. Утратило силу постановлением акимата Хромтауского района Актюбинской области от 26 февраля 2018 года № 43
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Хромтауского района
  kaz: Хромтау ауданының пробация қызметінің есебінде тұрған адамдарды, сондай–ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

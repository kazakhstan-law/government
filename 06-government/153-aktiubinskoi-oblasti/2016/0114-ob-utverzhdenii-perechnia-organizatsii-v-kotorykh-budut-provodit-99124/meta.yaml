requisite: Постановление акимата Хобдинского района Актюбинской области от 14 января 2016 года № 11. Зарегистрировано Департаментом юстиции Актюбинской области 2 февраля 2016 года № 4730. Утратило силу постановлением акимата Хобдинского района Актюбинской области от 4 мая 2016 года № 145
title:
  rus: Об утверждении перечня организации, в которых будут проводиться общественные работы, видов, обьемов и конкретных условий общественных работ, размеров оплаты труда участников и  источников их финансирования по Хобдинскому району на 2016 год
  kaz: 2016 жылға Қобда ауданы бойынша қоғамдық жұмыстар жүргізілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановление акимата Актюбинской области от 12 декабря 2016 года № 513 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры и спорта, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ақтөбе облысы әкімдігінің 2016 жылғы 12 желтоқсандағы № 513 "азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандар лауазымдарының тізбесін айқындау туралы" қаулысына өзгерістер және толықтырулар енгізу туралы

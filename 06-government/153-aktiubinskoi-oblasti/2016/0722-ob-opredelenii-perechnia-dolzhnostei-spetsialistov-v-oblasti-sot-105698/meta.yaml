act_code: '105698'
requisite: Постановление акимата Темирского района Актюбинской области от 22 июля 2016 года № 182. Зарегистрировано Департаментом юстиции Актюбинской области 25 августа 2016 года № 5036
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности по Темирскому району
  kaz: Темір ауданы бойынша азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

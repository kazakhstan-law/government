  requisite: Постановление акимата Темирского района Актюбинской области от 5 мая 2021 года № 71. Зарегистрировано Департаментом юстиции Актюбинской области 6 мая 2021 года № 8291
  title:
    rus: О внесении изменений в постановление акимата Темирского района от 22 июля 2016 года № 182 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Темір ауданы әкімдігінің 2016 жылғы 22 шілдедегі № 182 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

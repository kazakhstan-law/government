  title:
    rus: О внесении изменений в постановление акимата Хромтауского района Актюбинской области от 14 июня 2016 года № 218 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ақтөбе облысы Хромтау аудандық әкімдігінің 2016 жылғы 14 маусымдағы № 218 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Шалкарского района Актюбинской области от 11 февраля 2016 года № 24. Зарегистрировано Департаментом юстиции Актюбинской области 23 февраля 2016 года № 4754. Утратило силу постановлением акимата Шалкарского района Актюбинской области от 17 мая 2016 года № 87
title:
  rus: Об утверждении перечня организаций, в которых будут проводиться общественные работы, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по Шалкарскому району
  kaz: Шалқар ауданы бойынша қоғамдық жұмыстар жүргізілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

requisite: Постановление акимата Актюбинской области от 1 июня 2016 года № 227. Зарегистрировано Департаментом юстиции Актюбинской области 1 июля 2016 года № 4975. Утратило силу постановлением акимата Актюбинской области от 3 октября 2025 года № 211 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

  title:
    rus: О внесении изменений в постановление акимата Байганинского района Актюбинской области «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности» от 18 апреля 2016 года № 67
    kaz: Ақтөбе облысы Байғанин аудандық әкімдігінің «Азаматтық қызметшiлер болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» 2016 жылғы 18 сәуірдегі № 67 қаулысына өзгерістер енгізу туралы

title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности Каргалинского района Актюбинской области
  kaz: Азаматтық қызметшілер болып табылатын және Ақтөбе облысы Қарғалы ауданының ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

  title:
    rus: О внесении изменения в постановление акимата Каргалинского района Актюбинской области от 20 сентября 2016 года № 330 «Об определении перечня должностей специалистов в области социального обеспечения, культуры являющихся гражданскими служащими и работающих в сельской местности Каргалинского района Актюбинской области»
    kaz: Ақтөбе облысы Қарғалы ауданы әкімдігінің 2016 жылғы 20 қыркүйектегі № 330 «Азаматтық қызметшілер болып табылатын және Ақтөбе облысы Қарғалы ауданының ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

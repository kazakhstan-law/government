  title:
    rus: О внесении изменений в постановление акимата Хромтауского района от 10 февраля 2016 года № 31 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по Хромтаускому району»
    kaz: Хромтау ауданы әкімдігінің 2016 жылғы 10 ақпандағы № 31 «Хромтау ауданы бойынша мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

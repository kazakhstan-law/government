  title:
    rus: О внесении изменений в постановление акимата Хромтауского района № 31 от 10 февраля 2016 года "Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по Хромтаускому району"
    kaz: '"Хромтау ауданы бойынша мектепке дейінгі тәрбие және оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы" Хромтау ауданы әкімдігінің 2016 жылғы 10 ақпандағы № 31 қаулысына өзгерістер енгізу туралы'

  title:
    rus: О внесении изменений в постановление акимата Уилского района Актюбинской области от 05 апреля 2016 года № 77 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ақтөбе облысы Ойыл ауданы әкімдігінің 2016 жылғы 05 сәуірдегі № 77 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

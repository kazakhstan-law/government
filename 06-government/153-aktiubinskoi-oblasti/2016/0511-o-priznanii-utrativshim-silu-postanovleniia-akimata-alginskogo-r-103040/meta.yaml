act_code: '103040'
requisite: Постановление акимата Алгинского района Актюбинской области от 11 мая 2016 года № 196
title:
  rus: О признании утратившим силу постановления Акимата Алгинского района от 31.03.2015 года № 129 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в дошкольных организациях образования по Алгинскому району на 2015 год»
  kaz: Алға ауданы әкімдігінің 31.03.2015 жылғы № 129 «Алға ауданы бойынша 2015 жылға мектепке дейінгі білім беру ұйымдарында мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысының күшін жою туралы

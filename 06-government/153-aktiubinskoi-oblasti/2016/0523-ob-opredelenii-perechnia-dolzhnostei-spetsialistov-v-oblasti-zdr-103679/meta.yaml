requisite: Постановление акимата Иргизского района Актюбинской области от 23 мая 2016 года № 96. Зарегистрировано Департаментом юстиции Актюбинской области 22 июня 2016 года № 4959. Утратило силу постановлением акимата Иргизского района Актюбинской области от 15 ноября 2019 года № 196
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерлерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

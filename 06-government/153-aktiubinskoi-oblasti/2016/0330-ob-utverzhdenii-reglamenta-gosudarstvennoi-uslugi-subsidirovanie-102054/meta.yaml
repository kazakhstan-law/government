requisite: Постановление акимата Актюбинской области от 30 марта 2016 года № 125. Зарегистрировано Департаментом юстиции Актюбинской области 5 мая 2016 года № 4892. Утратило силу постановлением акимата Актюбинской области от 3 марта 2020 года № 81
title:
  rus: Об утверждении регламента государственной услуги "Субсидирование заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость"
  kaz: '"Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегіне бюджетке төленген қосылған құн салығы сомасын субсидиялау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 30 марта 2016 года № 125 «Об утверждении регламента государственной услуги «Субсидирование заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость»
    kaz: Ақтөбе облысы әкімдігінің 2016 жылғы 30 наурыздағы № 125 «Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегіне бюджетке төленген қосылған құн салығы сомасын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» қаулысына өзгеріс енгізу туралы

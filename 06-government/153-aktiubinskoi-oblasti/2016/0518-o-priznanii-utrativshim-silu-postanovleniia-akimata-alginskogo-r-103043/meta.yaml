act_code: '103043'
requisite: Постановление акимата Алгинского района Актюбинской области от 18 мая 2016 года № 212
title:
  rus: О признании утратившим силу постановления акимата Алгинского района от 10 августа 2015 года № 336 «Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации в уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций»
  kaz: Алға ауданы әкімдігінің 2015 жылғы 10 тамыздағы № 336 «Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай–ақ босатылған адамдар бас бостандығынан айыру орындарынан және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы» қаулысының күшін жою туралы

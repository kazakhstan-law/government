  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 12 декабря 2016 года № 513 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии и лесного хозяйства, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария және орман шаруашылығы саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Ақтөбе облысы әкімдігінің 2016 жылғы 12 желтоқсандағы № 513 қаулысына өзгеріс енгізу туралы

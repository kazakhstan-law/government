  title:
    rus: О внесении изменения в постановление акимата Темирского района Актюбинской области от 22 июля 2016 года № 182 «Об определении перечня должностей специалистов в области социального обеспечения и культуры, являющихся гражданскими служащими и работающих в сельской местности по Темирскому району»
    kaz: Ақтөбе облысы Темір аудандық әкімдігінің 2016 жылғы 22 шілдедегі № 182 «Темір ауданы бойынша азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгеріс енгізу туралы

requisite: Постановление акимата Мартукского района Актюбинской области от 29 декабря 2016 года № 554. Зарегистрировано Департаментом юстиции Актюбинской области 3 февраля 2017 года № 5260. Утратило силу постановлением акимата Мартукского района Актюбинской области от 10 апреля 2018 года № 132
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в Мартукском районе
  kaz: Мәртөк ауданында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

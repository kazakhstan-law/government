  title:
    rus: О внесении изменений в постановление акимата Каргалинского района Актюбинской области от 20 сентября 2016 года № 330 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ақтөбе облысы Қарғалы ауданы әкімдігінің 2016 жылғы 20 қыркүйектегі № 330 «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

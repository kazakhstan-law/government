title:
  rus: Об установлении водоохранных зон и полос на реках Орь, Уил, Хобда, их притоков и малых водохранилищ (Ащибекское, Магаджановское, Кызылсу, Аулие, Айталы) Актюбинской области и режима их хозяйственного использования
  kaz: Ақтөбе облысының өзендері Ор, Ойыл, Қобда мен оның салаларына және шағын су қоймаларының (Ащыбек, Мағаджан, Қызылсу, Әулие, Айталы) су қорғау аймақтары мен белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы

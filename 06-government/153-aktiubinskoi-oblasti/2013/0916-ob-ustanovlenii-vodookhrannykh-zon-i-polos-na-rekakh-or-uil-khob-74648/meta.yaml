    kaz: «Ақтөбе облысының өзендері Ор, Ойыл, Қобда мен оның салаларына және шағын су қоймаларының (Ащыбек, Мағаджан, Қызылсу, Әулие, Айталы) су қорғау аймақтары мен белдеулерін және оларды шаруашылықта пайдалану режимін белгілеу туралы» Ақтөбе облысы әкімдігінің 2013 жылғы 16 қыркүйектегі № 299 қаулысына өзгеріс енгізу туралы

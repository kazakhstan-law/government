title:
  rus: Об утверждении Положения об участковых комиссиях по проведению обследования  материального положения лиц (семей), обратившихся за государственной адресной социальной помощью, государственным пособием на детей до восемнадцати лет и оказанием социальной помощи
  kaz: Мемлекеттiк атаулы әлеуметтiк көмек, он сегiз жасқа дейiнгi балаларға арналған мемлекеттiк жәрдемақы алуға және әлеуметтік көмек көрсетуге өтiнiш білдірген адамның (отбасының) материалдық жағдайына тексеру жүргiзу жөнiндегi учаскелiк комиссиялар туралы Ережені бекіту туралы

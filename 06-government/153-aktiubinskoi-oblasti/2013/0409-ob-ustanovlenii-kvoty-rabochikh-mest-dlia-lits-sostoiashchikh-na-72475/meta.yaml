act_code: '72475'
requisite: Постановление акимата Мартукского района Актюбинской области от 9 апреля 2013 года № 109. Зарегистрировано Департаментом юстиции Актюбинской области 6 мая 2013 года № 3574. Утратило силу постановлением акимата Мартукского района Актюбинской области от 24 июня 2016 года № 252
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в предприятиях и учреждениях Мартукского района
  kaz: Мәртөк ауданының кәсіпорындары мен ұйымдарында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған және интернаттық ұйымдарды бітіруші кәмелетке толмаған тұлғалар үшін жұмыс орындарына квота белгілеу туралы

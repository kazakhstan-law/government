requisite: Ақтөбе облысы Шалқар ауданы әкімдігінің 2010 жылғы 16 сәуірдегі № 138 қаулысы. Ақтөбе облысы Шалқар ауданының Әділет басқармасында 2010 жылдың 18 мамырда № 3-13-131 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар ауданы әкімдігінің 2010 жылғы 22 маусымдағы № 181 қаулысымен

requisite: Ақтөбе облысы Алға ауданының әкімдігінің 2010 жылғы 26 сәуірдегі № 123 қаулысы. Ақтөбе облысы Алға ауданының Әділет басқармасында 2010 жылғы 12 мамырда № 3-3-109 тіркелді. Қабылдау мерзімі аяқталуына байланысты қолдану тоқтатылды - Ақтөбе облысы Алға ауданы әкімінің 2011 жылғы 6 қаңтардағы № 02-1/08 хатымен

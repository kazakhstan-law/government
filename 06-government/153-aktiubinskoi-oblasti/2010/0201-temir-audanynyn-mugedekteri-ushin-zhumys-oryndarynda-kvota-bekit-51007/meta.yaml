act_code: '51007'
requisite: Ақтөбе облысы Темір аудандық әкімдігінің 2010 жылғы 1 ақпандағы № 12 қаулысы. Ақтөбе облысының Темір аудандық Әділет басқармасында 2010 жылдың 4 наурызда № 3-10-124 тіркелді. Күші жойылды - Ақтөбе облысы Темір ауданының әкімдігінің 2016 жылғы 14 сәуірдегі № 96 қаулысымен

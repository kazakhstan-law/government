requisite: Ақтөбе облысы Байғанин аудандық әкімдігінің 2010 жылғы 29 сәуірдегі № 68 қаулысы. Ақтөбе облысының Байғанин аудандық Әділет басқармасында 2010 жылдың 6 мамырда № 3-4-98 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин аудандық әкімдігінің 2016 жылғы 20 сәуірдегі № 73 қаулысымен

act_code: '51045'
requisite: Ақтөбе облысы Шалқар ауданы әкімдігінің 2010 жылғы 28 қаңтардағы N 53 қаулысы. Ақтөбе облысы Шалқар ауданының Әділет басқармасында 2010 жылдың 26 ақпанда N 3-13-122 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар ауданы әкімдігінің 2010 жылғы 2 сәуірдегі N 105 қаулысымен

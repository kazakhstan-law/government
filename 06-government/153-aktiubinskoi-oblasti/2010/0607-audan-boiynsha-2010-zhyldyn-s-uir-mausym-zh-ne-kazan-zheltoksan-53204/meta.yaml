requisite: Ақтөбе облысы Ойыл аудандық әкімиятының 2010 жылғы 7 маусымдағы № 92 қаулысы. Ақтөбе облысы Ойыл ауданының Әділет басқармасында 2010 жылғы 17 маусымда № 3-11-78 тіркелді. Күші жойылды - Ақтөбе облысы Ойыл аудандық әкімдігінің 2011 жылғы 5 қаңтардағы № 4 қаулысымен

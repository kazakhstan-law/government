requisite: Ақтөбе облысы Қобда ауданының әкімдігінің 2010 жылғы 9 наурыздағы N 60 қаулысы. Ақтөбе облысының Қобда аудандық әділет басқармасында 2010 жылдың 30 наурызда N 3-7-89 тіркелді. Күші жойылды - (Ақтөбе облысы Қобда ауданының әкімінің аппаратының 2013 жылғы 30 қыркүйектегі № 1226 хаты)

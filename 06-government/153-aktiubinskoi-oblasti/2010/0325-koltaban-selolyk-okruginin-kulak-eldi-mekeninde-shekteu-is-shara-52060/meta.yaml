requisite: Ақтөбе облысы Байғанин аудандық әкімдігінің 2010 жылғы 25 наурыздағы N 48 қаулысы. Ақтөбе облысының Байғанин аудандық Әділет басқармасында 2010 жылдың 26 сәуірде N 3-4-97 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин аудандық әкімдігінің 2010 жылғы 21 маусымдағы № 98 қаулысымен

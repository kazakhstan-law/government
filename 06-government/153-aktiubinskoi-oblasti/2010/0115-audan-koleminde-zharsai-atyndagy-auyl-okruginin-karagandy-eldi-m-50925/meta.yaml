requisite: Ақтөбе облысы Қобда ауданының әкімдігінің 2010 жылғы 15 қаңтардағы N 19 қаулысы. Ақтөбе облысының Қобда аудандық әділет басқармасында 2010 жылдың 25 ақпанда N 3-7-84 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық әкімдігінің 2010 жылғы 25 наурыздағы № 70 қаулысымен

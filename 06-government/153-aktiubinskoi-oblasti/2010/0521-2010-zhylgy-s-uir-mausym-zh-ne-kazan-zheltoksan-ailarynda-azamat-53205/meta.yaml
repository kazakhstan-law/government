act_code: '53205'
requisite: Ақтөбе облысы Мұғалжар аудандық әкімдігінің 2010 жылғы 21 мамырдағы № 320 қаулысы. Ақтөбе облысы Мұғалжар аудандық Әділет басқармасында 2010 жылғы 18 маусымда № 3-9-129 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Ақтөбе облысы Мұғалжар аудандық әкім аппаратының 2013 жылғы 18 ақпандағы № 423 хатымен)

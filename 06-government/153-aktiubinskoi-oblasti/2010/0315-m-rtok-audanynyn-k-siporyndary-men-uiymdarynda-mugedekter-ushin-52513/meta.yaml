requisite: Ақтөбе облысы Мәртөк аудандық әкімдігінің 2010 жылғы 15 наурыздағы № 94 қаулысы. Ақтөбе облысы Мәртөк ауданының Әділет басқармасында 2010 жылғы 12 сәуірде № 3-8-110 тіркелді. Күші жойылды - Ақтөбе облысы Мәртөк ауданы әкімдігінің 2016 жылғы 24 маусымдағы № 252 қаулысымен

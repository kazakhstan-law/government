act_code: '50377'
requisite: Ақтөбе облысы Байғанин аудандық әкімдігінің 2010 жылғы 5 қаңтардағы N 3 қаулысы. Ақтөбе облысының Байғанин аудандық әділет басқармасында 2010 жылдың 27 қаңтарда N 3-4-92 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин аудандық әкімдігінің 2011 жылғы 13 сәуірдегі № 95 қаулысымен

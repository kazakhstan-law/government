requisite: Ақтөбе облысы Шалқар ауданы әкімдігінің 2010 жылғы 24 ақпандағы N 79 қаулысы. Ақтөбе облысы Шалқар ауданының Әділет басқармасында 2010 жылдың 26 наурызда N 3-13-128 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар ауданы әкімдігінің 2010 жылғы 4 мамырдағы N 149 қаулысымен

requisite: Ақтөбе облысы Әйтеке би аудандық әкімиятының 2010 жылғы 8 маусымдағы № 117 қаулысы. Ақтөбе облысы Әйтеке би ауданының Әділет басқармасында 2010 жылғы 22 маусымда № 3-2-95 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық әкімиятының 2011 жылғы 11 қаңтардағы № 5 қаулысымен

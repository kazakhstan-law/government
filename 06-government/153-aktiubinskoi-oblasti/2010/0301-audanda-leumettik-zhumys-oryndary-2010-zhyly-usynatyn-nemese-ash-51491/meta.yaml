requisite: Ақтөбе облысы Қобда ауданы әкімдігінің 2010 жылғы 1 наурыздағы N 55 қаулысы. Ақтөбе облысы Қобда ауданының Әділет басқармасында 2010 жылғы 26 наурызда N 3-7-88 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық әкімдігінің 2011 жылғы 17 ақпандағы № 59 қаулысымен

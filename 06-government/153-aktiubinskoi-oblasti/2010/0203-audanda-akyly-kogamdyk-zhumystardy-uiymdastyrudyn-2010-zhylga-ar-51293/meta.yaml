requisite: Ақтөбе облысы Ойыл аудандық әкімиятының 2010 жылғы 3 ақпандағы N 11 қаулысы. Ақтөбе облысы Ойыл ауданының Әділет басқармасында 2010 жылдың 23 ақпанда № 3-11-73 тіркелді. Күші жойылды - Ақтөбе облысы Ойыл аудандық әкімдігінің 2011 жылғы 5 қаңтардағы № 4 қаулысымен

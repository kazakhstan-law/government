act_code: '53407'
requisite: Ақтөбе облысы Байғанин аудандық әкімдігінің 2010 жылғы 17 мамырдағы № 86 қаулысы. Ақтөбе облысының Байғанин аудандық Әділет басқармасында 2010 жылғы 25 маусымда № 3-4-100 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Ақтөбе облысы Байғанин ауданының әкімінің 2013 жылғы 11 қарашадағы № 02-2491 хаты)
title:

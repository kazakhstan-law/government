requisite: Постановление акимата Каргалинского района Актюбинской области от 28 мая 2018 года № 182. Зарегистрировано Управлением юстиции Каргалинского района Департамента юстиции Актюбинской области 14 июня 2018 года № 3-6-160. Утратило силу постановлением акимата Каргалинского района Актюбинской области от 31 декабря 2019 года № 236
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Каргалинскому району
  kaz: Қарғалы ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы

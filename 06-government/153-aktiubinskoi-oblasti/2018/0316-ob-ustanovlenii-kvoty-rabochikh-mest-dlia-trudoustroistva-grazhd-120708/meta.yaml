act_code: '120708'
requisite: Постановление акимата Алгинского района Актюбинской области от 16 марта 2018 года № 119. Зарегистрировано Управлением юстиции Алгинского района Департамента юстиции Актюбинской области 9 апреля 2018 года № 3-3-159
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Алгинскому району на 2018 год
  kaz: 2018 жылға арналған Алға ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата города Актобе Актюбинской области от 13 декабря 2018 года № 7296. Зарегистрировано Управлением юстиции района "Астана" города Актобе Департамента юстиции Актюбинской области 21 декабря 2018 года № 3-1-224
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, по городу Актобе на 2019 год
  kaz: 2019 жылға арналған Ақтөбе қаласы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

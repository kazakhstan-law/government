requisite: Постановление акимата Мартукского района Актюбинской области от 10 апреля 2018 года № 132. Зарегистрировано Управлением юстиции Мартукского района Департамента юстиции Актюбинской области 3 мая 2018 года № 3-8-172
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Мартукскому району на 2018 год
  kaz: 2018 жылға Мәртөк ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

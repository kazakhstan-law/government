  title:
    rus: О внесении изменений в постановление акимата Байганинского района от 19 февраля 2018 года № 37 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Байганинском районе»
    kaz: Байғанин аудандық әкімдігінің 2018 жылғы 19 ақпандағы № 37 «Байғанин ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгерістер енгізу туралы

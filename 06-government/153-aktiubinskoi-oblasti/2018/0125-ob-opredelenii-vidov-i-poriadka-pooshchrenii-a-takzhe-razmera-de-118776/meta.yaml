  title:
    rus: О внесении изменения в постановление акимата Алгинского района от 25 января 2018 года № 48 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Алгинском районе»
    kaz: Алға ауданы әкімдігінің 2018 жылғы 25 қаңтардағы № 48 «Алға ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

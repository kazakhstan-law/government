    kaz: Мәртөк ауданы әкімдігінің 2018 жылғы 8 қаңтардағы № 12 «Мәртөк ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

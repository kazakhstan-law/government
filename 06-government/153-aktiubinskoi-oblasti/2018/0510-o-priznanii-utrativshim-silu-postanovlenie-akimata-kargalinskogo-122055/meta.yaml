act_code: '122055'
requisite: Постановление акимата Каргалинского района Актюбинской области от 10 мая 2018 года № 166. Зарегистрировано Управлением юстиции Каргалинского района Департамента юстиции Актюбинской области 29 мая 2018 года № 3-6-156
title:
  rus: О признании утратившим силу постановление акимата Каргалинского района от 13 июня 2017 года № 178 «Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Каргалинскому району»
  kaz: Қарғалы ауданы әкімдігінің 2017 жылғы 13 маусымдағы № 178 «Қарғалы ауданы бойынша пробация қызметінің есебінде тұрған адамдарды, сондай-ақ, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квоталар белгілеу туралы» қаулысының күшін жою туралы

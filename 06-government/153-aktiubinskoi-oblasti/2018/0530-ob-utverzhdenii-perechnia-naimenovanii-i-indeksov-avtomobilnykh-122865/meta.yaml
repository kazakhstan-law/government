    rus: О внесении изменения в постановление акимата Алгинского района от 30 мая 2018 года № 232 «Об утверждении перечня, наименований и индексов автомобильных дорог общего пользования районного значения по Алгинскому району Актюбинской области»
    kaz: Алға ауданы әкімдігінің 2018 жылғы 30 мамырдағы № 232 «Ақтөбе облысының Алға ауданы бойынша аудандық маңызы бар жалпы пайдаланымдағы автомобиль жолдарының тізбесін, атаулары мен индекстерін бекіту туралы» қаулысына өзгеріс енгізу туралы

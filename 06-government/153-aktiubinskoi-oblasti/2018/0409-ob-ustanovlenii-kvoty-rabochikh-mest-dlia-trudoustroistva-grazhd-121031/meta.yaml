requisite: Постановление акимата Хромтауского района Актюбинской области от 9 апреля 2018 года № 80. Зарегистрировано Управлением юстиции Хромтауского района Департамента юстиции Актюбинской области 23 апреля 2018 года № 3-12-173
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Хромтаускому району на 2018 год
  kaz: 2018 жылға Хромтау ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

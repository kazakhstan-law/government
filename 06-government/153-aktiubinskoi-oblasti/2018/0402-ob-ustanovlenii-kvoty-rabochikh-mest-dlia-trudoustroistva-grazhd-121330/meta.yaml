requisite: Постановление акимата Айтекебийского района Актюбинской области от 2 апреля 2018 года № 62. Зарегистрировано Управлением юстиции Айтекебийского района Департамента юстиции Актюбинской области 24 апреля 2018 года № 3-2-148
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, по Айтекебийскому району на 2018 год
  kaz: 2018 жылға Әйтеке би ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

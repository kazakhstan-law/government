act_code: '123913'
requisite: Постановление акимата Алгинского района Актюбинской области от 28 июня 2018 года № 274. Зарегистрировано Управлением юстиции Алгинского района Департамента юстиции Актюбинской области 19 июля 2018 года № 3-3-174
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения и культуры являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерлерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандар лауазымдарының тізбесін айқындау туралы

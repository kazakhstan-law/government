  requisite: Постановление акимата Алгинского района Актюбинской области от 7 октября 2021 года № 478. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 октября 2021 года № 24690
  title:
    rus: О внесении изменений в постановление акимата Алгинского района Актюбинской области от 28 июня 2018 года № 274 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: Ақтөбе облысы Алға аудандық әкімдігінің 2018 жылғы 28 маусымдағы № 274 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» қаулысына өзгерістер енгізу туралы

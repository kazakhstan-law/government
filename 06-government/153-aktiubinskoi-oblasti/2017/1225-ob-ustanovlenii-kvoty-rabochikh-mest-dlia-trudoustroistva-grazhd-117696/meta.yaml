act_code: '117696'
requisite: Постановление акимата города Актобе Актюбинской области от 25 декабря 2017 года № 6790. Зарегистрировано Департаментом юстиции Актюбинской области 9 января 2018 года № 5830
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, по городу Актобе на 2018 год
  kaz: 2018 жылға арналған Ақтөбе қаласы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

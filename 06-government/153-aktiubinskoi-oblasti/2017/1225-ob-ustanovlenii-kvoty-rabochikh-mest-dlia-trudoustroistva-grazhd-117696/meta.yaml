  title:
    rus: О внесении изменения в постановление акимата города Актобе от 25 декабря 2017 года № 6790 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, по городу Актобе на 2018 год»
    kaz: Ақтөбе қаласы әкімдігінің 2017 жылғы 25 желтоқсандағы № 6790 «2018 жылға арналған Ақтөбе қаласы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы» қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/123687/rus

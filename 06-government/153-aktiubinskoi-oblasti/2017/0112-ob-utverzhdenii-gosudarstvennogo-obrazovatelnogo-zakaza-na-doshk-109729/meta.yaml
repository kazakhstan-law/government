    kaz: Қобда ауданы әкімдігінің 2017 жылғы 12 қаңтардағы № 5 «Қобда ауданы бойынша 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

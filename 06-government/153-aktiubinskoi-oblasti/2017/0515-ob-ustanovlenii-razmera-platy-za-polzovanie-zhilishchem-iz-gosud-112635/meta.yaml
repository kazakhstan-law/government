  title:
    rus: О внесении изменений в постановление акимата Шалкарского района от 15 мая 2017 года № 98 «Об  установлении размера платы за пользование жилищем из государственного жилищного фонда Шалкарского района и признании утратившими силу некоторых постановлений акимата района»
    kaz: Шалқар ауданы әкімдігінің 2017 жылғы 15 мамырдағы № 98 «Шалқар ауданының мемлекеттік тұрғын үй қорындағы тұрғын үйді пайдаланғаны үшін төлемақы мөлшерін белгілеу және аудан әкімдігінің кейбір қаулыларының күші жойылды деп тану туралы» қаулысына өзгерістер енгізу туралы

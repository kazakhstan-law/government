requisite: Постановление акимата города Актобе Актюбинской области от 20 декабря 2017 года № 6648. Зарегистрировано Департаментом юстиции Актюбинской области 10 января 2018 года № 5836. Утратило силу постановлением акимата города Актобе Актюбинской области от 4 августа 2026 года № 581 (вводится в действие после дня первого официального опубликования)
title:
  rus: Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в городе Актобе
  kaz: Ақтөбе қаласында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы

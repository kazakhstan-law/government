act_code: '111546'
requisite: Постановление акимата Мугалжарского района Актюбинской области от 15 марта 2017 года № 99. Зарегистрировано Департаментом юстиции Актюбинской области 13 апреля 2017 года № 5440
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Мугалжарскому району на 2017 год
  kaz: 2017 жылға Мұғалжар ауданы бойынша пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

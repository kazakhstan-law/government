    kaz: Ақтөбе облысы әкімдігінің 2017 жылғы 11 қыркүйектегі № 314 «Ақтөбе облысында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

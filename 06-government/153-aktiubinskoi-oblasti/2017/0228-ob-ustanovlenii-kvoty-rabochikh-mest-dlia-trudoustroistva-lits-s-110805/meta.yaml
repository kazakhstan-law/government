act_code: '110805'
requisite: Постановление акимата Байганинского района Актюбинской области от 28 февраля 2017 года № 52. Зарегистрировано Департаментом юстиции Актюбинской области 14 марта 2017 года № 5323. Утратило силу постановлением Байганинского районного акимата Актюбинской области от 29 марта 2018 года № 73
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Байганинского района
  kaz: Байғанин ауданының пробация қызметінің есебінде тұрған адамдарды, сондай-ақ, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Мугалжарского района от 12 апреля 2017 года № 133 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по Мугалжарскому району на 2017 год»
    kaz: Мұғалжар ауданы әкімдігінің 2017 жылғы 12 сәуірдегі № 133 «Мұғалжар ауданы бойынша 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Байганинского района от 6 февраля 2017 года № 26 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по Байганинскому району на 2017 год»
    kaz: Байғанин аудандық әкімдігінің 2017 жылғы 6 ақпандағы № 26 «Байғанин ауданы бойынша 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

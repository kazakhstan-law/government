  title:
    rus: О внесении изменения в постановление акимата Иргизского района от 22 декабря 2017 года № 172 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Иргизском районе»
    kaz: Ырғыз ауданы әкімдігінің 2017 жылғы 22 желтоқсандағы № 172 «Ырғыз ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

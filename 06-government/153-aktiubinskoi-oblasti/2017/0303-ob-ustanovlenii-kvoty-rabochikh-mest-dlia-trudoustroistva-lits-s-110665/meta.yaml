act_code: '110665'
requisite: Постановление акимата города Актобе Актюбинской области от 3 марта 2017 года № 867. Зарегистрировано Департаментом юстиции Актюбинской области 24 марта 2017 года № 5350
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, по городу Актобе на 2017 год
  kaz: Ақтөбе қаласы бойынша, 2017 жылға пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

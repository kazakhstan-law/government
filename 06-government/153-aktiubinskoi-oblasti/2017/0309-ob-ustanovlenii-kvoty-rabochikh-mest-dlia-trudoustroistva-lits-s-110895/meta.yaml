act_code: '110895'
requisite: Постановление акимата Темирского района Актюбинской области от 9 марта 2017 года № 46. Зарегистрировано Департаментом юстиции Актюбинской области 30 марта 2017 года № 5377. Утратило силу постановлением акимата Темирского района Актюбинской области от 20 марта 2018 года № 69
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Темирского района
  kaz: Темір ауданының пробация қызметінің есебінде тұрған адамдарды, сондай–ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

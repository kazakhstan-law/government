act_code: '110151'
requisite: Постановление акимата Иргизского района Актюбинской области от 15 февраля 2017 года № 22. Зарегистрировано Департаментом юстиции Актюбинской области 2 марта 2017 года № 5278. Утратило силу постановлением акимата Иргизского района Актюбинской области от 30 марта 2018 года № 32
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Иргизского района
  kaz: Ырғыз ауданының пробация қызметінің есебінде тұрған адамдарды, сондай–ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

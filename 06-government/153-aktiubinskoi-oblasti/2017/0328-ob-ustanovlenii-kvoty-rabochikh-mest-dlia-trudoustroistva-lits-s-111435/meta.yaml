act_code: '111435'
requisite: Постановление акимата Шалкарского района Актюбинской области от 28 марта 2017 года № 69. Зарегистрировано Департаментом юстиции Актюбинской области 10 апреля 2017 года № 5422
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Шалкарскому району на 2017 год
  kaz: 2017 жылға Шалқар ауданы бойынша пробация қызметінің есебінде тұрған адамдарды, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 1 февраля 2017 года № 16 «Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в Актюбинской области»
    kaz: Ақтөбе облысы әкімдігінің 2017 жылғы 1 ақпандағы № 16 «Ақтөбе облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау жөніндегі коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы» қаулысына өзгеріс енгізу туралы

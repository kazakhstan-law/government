act_code: '117613'
requisite: Постановление акимата Мугалжарского района Актюбинской области от 11 декабря 2017 года № 474. Зарегистрировано Департаментом юстиции Актюбинской области 27 декабря 2017 года № 5773. Утратило силу постановлением акимата Мугалжарского района Актюбинской области от 13 октября 2026 года № 373 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Мугалжарском районе
  kaz: Мұғалжар ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы

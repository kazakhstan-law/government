  title:
    rus: О внесений изменения в постановление акимата города Актобе Актюбинской области от 20 декабря 2017 года № 6648 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в городе Актобе»
    kaz: Ақтөбе облысы Ақтөбе қаласының әкімдігінің 2017 жылғы 20 желтоқсандағы № 6648 «Ақтөбе қаласында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

title:
  rus: О признании утратившим силу постановления акимата Айтекебийского района от 27 июня 2016 года № 114 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов Айтекебийского района»
  kaz: Әйтеке би ауданы әкімдігінің 2016 жылғы 27 маусымдағы № 114 «Әйтеке би ауданының жергілікті атқарушы органдары «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» қаулысының күшін жою туралы

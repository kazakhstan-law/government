requisite: Постановление акимата Шалкарского района Актюбинской области от 22 ноября 2017 года № 235. Зарегистрировано Департаментом юстиции Актюбинской области 8 декабря 2017 года № 5731. Утратило силу постановлением акимата Шалкарского района Актюбинской области от 15 сентября 2026 года № 229 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

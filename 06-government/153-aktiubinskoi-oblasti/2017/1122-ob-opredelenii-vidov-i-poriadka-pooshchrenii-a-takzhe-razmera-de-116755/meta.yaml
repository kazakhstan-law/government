  title:
    rus: О внесении изменения в постановление акимата Шалкарского района от 22 ноября 2017 года № 235 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Шалкарском районе»
    kaz: Шалқар ауданы әкімдігінің 2017 жылғы 22 қарашадағы № 235 «Шалқар ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

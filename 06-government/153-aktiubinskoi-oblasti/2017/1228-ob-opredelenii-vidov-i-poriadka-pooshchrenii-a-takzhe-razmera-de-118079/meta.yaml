  title:
    rus: О внесении изменений в постановление акимата Хромтауского района от 28 декабря 2017 года № 313 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Хромтауском районе»
    kaz: Хромтау ауданы әкімдігінің 2017 жылғы 28 желтоқсандағы № 313 «Хромтау ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгерістер енгізу туралы

act_code: '111902'
requisite: Постановление акимата Айтекебийского района Актюбинской области от 14 апреля 2017 года № 73. Зарегистрировано Департаментом юстиции Актюбинской области 26 апреля 2017 года № 5467. Утратило силу постановлением акимата Айтекебийского района Актюбинской области от 20 февраля 2018 года № 43
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Айтекебийского района
  kaz: Әйтеке би ауданының пробация қызметінің есебінде тұрған адамдарды, сондай–ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

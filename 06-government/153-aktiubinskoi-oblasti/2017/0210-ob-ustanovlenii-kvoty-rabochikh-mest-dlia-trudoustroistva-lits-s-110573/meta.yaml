act_code: '110573'
requisite: Постановление акимата Уилского района Актюбинской области от 10 февраля 2017 года № 24. Зарегистрировано Департаментом юстиции Актюбинской области 9 марта 2017 года № 5306. Утратило силу постановлением акимата Уилского района Актюбинской области от 26 марта 2018 года № 45
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, также лиц освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования Уилского района
  kaz: Ойыл ауданының пробация қызметінің есебінде тұрған адамдарды, сондай–ақ бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

  title:
    rus: О внесении изменений в постановление акимата Темирского района от 31 марта 2017 года № 62 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы по Темирскому району на 2017 год»
    kaz: Темір аудандық әкімдігінің 2017 жылғы 31 наурыздағы № 62 «Темір ауданы бойынша 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений в постановление акимата Айтекебийского района от 25 мая 2017 года № 98 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы на 2017 год по Айтекебийскому району»
    kaz: Әйтеке би ауданы әкімдігінің 2017 жылғы 25 мамырдағы № 98 «Әйтеке би ауданы бойынша 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» қаулысына өзгерістер енгізу туралы

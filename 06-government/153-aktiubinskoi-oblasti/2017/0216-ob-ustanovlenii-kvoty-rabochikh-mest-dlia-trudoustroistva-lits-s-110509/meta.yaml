act_code: '110509'
requisite: Постановление акимата Кобдинского района Актюбинской области от 16 февраля 2017 года № 29. Зарегистрировано Департаментом юстиции Актюбинской области 6 марта 2017 года № 5289. Утратило силу постановлением акимата Кобдинского района Актюбинской области от 18 апреля 2018 года № 68
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, а также лиц, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Кобдинскому району
  kaz: Қобда ауданы бойынша пробация қызметінің есебінде тұрған адамдарды, сондай-ақ, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

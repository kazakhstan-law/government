  title:
    rus: О внесении изменения в постановление акимата Мугалжарского района от 11 декабря 2017 года № 474 «Об определении видов и порядка поощрений, а также размера денежного вознаграждения граждан, участвующих в обеспечении общественного порядка в Мугалжарском районе»
    kaz: Мұғалжар ауданы әкімдігінің 2017 жылғы 11 желтоқсандағы № 474 «Мұғалжар ауданында қоғамдық тәртіпті қамтамасыз етуге қатысатын азаматтарды көтермелеудің түрлері мен тәртібін, сондай-ақ оларға ақшалай сыйақының мөлшерін айқындау туралы» қаулысына өзгеріс енгізу туралы

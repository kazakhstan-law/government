requisite: Постановление акимата Иргизского района Актюбинской области от 28 мая 2014 года № 107. Зарегистрировано Департаментом юстиции Актюбинской области 16 июня 2014 года № 3948. Утратило силу постановлением акимата Иргизского района Актюбинской области от 13 января 2016 года № 12
title:
  rus: Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

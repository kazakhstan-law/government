requisite: Постановление акимата Актюбинской области от 2 июня 2014 года № 176. Зарегистрировано Департаментом юстиции Актюбинской области 27 июня 2014 года № 3959. Утратило силу постановлением акимата Актюбинской области от 16 июля 2015 года № 265
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешения на размещение объектов наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования областного и районного значения, а также в населенных пунктах"
  kaz: '"Облыстық және аудандық маңызы бар, сондай-ақ елді мекендердегі жалпы пайдаланымдағы автомобиль жолдарының бөлінген белдеуінде сыртқы (көрнекі) жарнама объектісін орналастыруға рұқсат беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

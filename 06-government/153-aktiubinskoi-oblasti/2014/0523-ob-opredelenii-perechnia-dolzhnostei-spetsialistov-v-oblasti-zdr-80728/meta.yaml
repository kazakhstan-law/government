    kaz: «Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тiзбесiн айқындау туралы» Шалқар ауданы әкімдігінің 2014 жылғы 23 мамырдағы № 119 қаулысына өзгерістер енгізу туралы

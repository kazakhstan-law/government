  title:
    rus: О внесении изменений и дополнений в постановление акимата города Актобе от 15 декабря 2014 года № 3823 «Об определении перечня должностей  специалистов в области социального обеспечения, образования, культуры и ветеринарии, являющихся гражданскими служащими и работающих в сельских населенных пунктах города Актобе»
    kaz: «Азаматтық қызметші болып табылатын және Ақтөбе қаласының ауылдық елді мекендерінде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы»  Ақтөбе қаласы әкімдігінің 2014 жылғы 15 желтоқсандағы № 3823 қаулысына өзгерістер мен толықтырулар енгізу туралы

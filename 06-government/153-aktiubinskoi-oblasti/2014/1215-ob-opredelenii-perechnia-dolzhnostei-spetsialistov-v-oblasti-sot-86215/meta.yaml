act_code: '86215'
requisite: Постановление акимата города Актобе Актюбинской области от 15 декабря 2014 года № 3823. Зарегистрировано Департаментом юстиции Актюбинской области 29 января 2015 года № 4185. Утратило силу постановлением акимата города Актобе Актюбинской области от 5 ноября 2018 года № 6643
title:
  rus: Об определении перечня должностей специалистов в области социального обеспечения, образования, культуры и ветеринарии, являющихся гражданскими служащими и работающих в сельских населенных пунктах города Актобе
  kaz: Азаматтық қызметші болып табылатын және Ақтөбе қаласының ауылдық елді мекендерінде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы

title:
  rus: Об утверждении перечня организаций, в которых будут проводиться общественные работы, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по городу Актобе на 2015 год
  kaz: 2015 жылға Ақтөбе қаласы бойынша қоғамдық жұмыстар жүргізілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы

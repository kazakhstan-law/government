  title:
    rus: О внесении изменений в постановление акимата города Актобе от 22 декабря 2014 года № 3846 "Об утверждении перечня организаций, в которых будут проводиться общественные работы, видов, объемов и конкретных условий общественных работ, размеров оплаты труда участников и источников их финансирования по городу Актобе на 2015 год"
    kaz: Ақтөбе қаласы әкімдігінің "2015 жылға Ақтөбе қаласы бойынша қоғамдық жұмыстар жүргізілетін ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшері және оларды қаржыландырудың көздерін бекіту туралы" 2014 жылғы 22 желтоқсандағы № 3846 қаулысына өзгерістер енгізу туралы

requisite: Ақтөбе облыстық әкімиятының 2006 жылғы 25 желтоқсандағы N 426 қаулысы. Ақтөбе облысының Әділет департаментінде 2007 жылғы 12 қаңтарда N 3197 тіркелді. Орындалу мерзімі аяқталуына байланысты күші жойылды - "Нормативтік құқықтық актілер туралы" Қазақстан Республикасының 1998 жылғы 24 наурыздағы N 213 Заңына сәйкес

  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 29 ноября 2022 года № 384 «Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием на 2022-2023 учебный год
    kaz: Ақтөбе облысы бойынша техникалық және кәсіптік, орта білімнен кейінгі «2022-2023 оқу жылына арналған техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға мемлекеттік білім беру тапсырысын бекіту туралы» Ақтөбе облысы әкімдігінің 2022 жылғы 29 қарашадағы № 384 қаулысына өзгеріс енгізу туралы

act_code: '167773'
requisite: Постановление акимата Шалкарского района Актюбинской области от 11 мая 2022 года № 178. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 мая 2022 года № 28080
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика населенным пунктам Шалкарского района
  kaz: Шалқар ауданының елді мекендеріне бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

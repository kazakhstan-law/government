  title:
    rus: О внесении изменении в постановление акимата Шалкарского района от 11 мая 2022 года № 178 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика по Шалкарскому району»
    kaz: «Шалқар ауданы бойынша бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Шалқар ауданы әкімдігінің 2022 жылғы 11 мамырдағы № 178 қаулысына өзгерістер енгізу туралы

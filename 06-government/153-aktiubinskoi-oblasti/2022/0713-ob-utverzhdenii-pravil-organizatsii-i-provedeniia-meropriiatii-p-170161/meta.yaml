  title:
    rus: О внесении изменения в постановление акимата Хромтауского района от 13 июля 2022 года № 160 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Хромтаускому району»
    kaz: «Хромтау ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Хромтау ауданы әкімдігінің 2022 жылғы 13 шілдедегі № 160 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202277/rus

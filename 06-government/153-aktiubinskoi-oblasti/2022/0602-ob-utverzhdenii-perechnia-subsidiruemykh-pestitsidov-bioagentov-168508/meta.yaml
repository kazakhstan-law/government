  title:
    rus: О внесении изменений в постановление акимата Актюбинской области от 2 июня 2022 года № 164 «Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и нормы субсидий на 1 литр (килограмм, грамм, штук) пестицидов, биоагентов (энтомофагов), а также объемы бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2022 год
    kaz: «2022 жылға арналған субсидияланатын пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі және пестицидтердің, биоагенттердiң (энтомофагтардың) 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» Ақтөбе облысы әкімдігінің 2022 жылғы 2 маусымдағы № 164 қаулысына өзгерістер енгізу туралы

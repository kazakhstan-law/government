requisite: Постановление акимата Каргалинского района Актюбинской области от 28 апреля 2022 года № 88. Утратило силу постановлением акимата Каргалинского района Актюбинской области от 15 августа 2023 года № 116
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Каргалинскому району
  kaz: Қарғалы ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

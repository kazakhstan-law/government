  requisite: Постановление акимата Мартукского района Актюбинской области от 31 мая 2023 года № 108. Утратило силу постановлением акимата Мартукского района Актюбинской области от 4 декабря 2023 года № 225
  title:
    rus: О внесении изменений в постановление акимата Мартукского района от 9 ноября 2022 года № 271 «Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации в Мартукском районе на 2023 год»
    kaz: Мәртөк ауданы әкімдігінің 2022 жылғы 9 қарашадағы № 271 «2023 жылға арналған Мәртөк ауданында ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарының квотасын белгілеу туралы» қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/182768/rus

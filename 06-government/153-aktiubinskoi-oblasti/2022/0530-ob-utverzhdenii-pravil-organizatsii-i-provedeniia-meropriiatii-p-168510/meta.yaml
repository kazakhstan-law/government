  title:
    rus: О внесении изменений в постановление акимата Алгинского района от 30 мая 2022 года № 132 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Алгинскому району»
    kaz: Алға ауданы әкімдігінің 2022 жылғы 30 мамырдағы № 132 «Алға ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы

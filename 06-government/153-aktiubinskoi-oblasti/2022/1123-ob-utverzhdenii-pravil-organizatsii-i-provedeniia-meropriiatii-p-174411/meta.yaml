act_code: '174411'
requisite: Постановление акимата Мугалжарского района Актюбинской области от 23 ноября 2022 года № 400. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 ноября 2022 года № 30730
title:
  rus: Об утверждении Правил организации и проведения мероприятий по реконструкции, текущему или капитальному ремонту наружных стен, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Мугалжарскому району
  kaz: Мұғалжар ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің сыртқы қабырғаларын, шатырларын реконструкциялау, ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы

  title:
    rus: О внесении изменении в постановление акимата Мугалжарского района от 23 ноября 2022 года № 400 «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Мугалжарскому району»
    kaz: «Мұғалжар ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» Мұғалжар ауданы әкімдігінің 2022 жылғы 23 қарашадағы № 400 қаулысына өзгерістер енгізу туралы

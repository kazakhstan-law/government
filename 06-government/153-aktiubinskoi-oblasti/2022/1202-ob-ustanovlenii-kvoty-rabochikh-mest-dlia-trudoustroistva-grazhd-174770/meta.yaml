act_code: '174770'
requisite: Постановление акимата Каргалинского района Актюбинской области от 2 декабря 2022 года № 237
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Каргалинскому району на 2023 год
  kaz: 2023 жылға Қарғалы ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы  азаматтарды жұмысқа  орналастыру үшін жұмыс орындарына квота белгілеу туралы

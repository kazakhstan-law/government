  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 18 марта 2022 года № 70 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства, нормативов субсидий, критериев к получателям субсидий и сроков подачи заявки на получение субсидий на удешевление стоимости затрат на корма маточному поголовью сельскохозяйственных животных по Актюбинской области на 2022 год»
    kaz: «Ақтөбе облысы бойынша 2022 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін, ауыл шаруашылығы жануарларының аналық басының азығына жұмсалған шығындар құнын арзандатуға субсидиялар нормативтерін, субсидиялар алушыларға қойылатын өлшемшарттарын және субсидиялар алуға арналған өтінім беру мерзімдерін бекіту туралы» Ақтөбе облысы әкімдігінің 2022 жылғы 18 наурыздағы № 70 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/175427/rus

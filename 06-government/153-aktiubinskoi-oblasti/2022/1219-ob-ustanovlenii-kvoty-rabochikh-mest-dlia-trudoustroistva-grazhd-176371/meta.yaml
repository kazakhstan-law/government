act_code: '176371'
requisite: Постановление акимата Кобдинского района Актюбинской области от 19 декабря 2022 года № 399
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся без попечения родителей до достижения совершеннолетия, являющихся выпускниками организаций образования по Кобдинскому району на 2023 год
  kaz: 2023 жылға Қобда ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

  title:
    rus: О внесении изменения в постановление акимата Кобдинского района от 14 июня 2022 года № 190 «О внесении изменений в постановление акимата Кобдинского района Актюбинской области от 20 мая 2022 года № 161 «Об утверждении правил предоставления коммунальных услуг в Кобдинском районе»»
    kaz: Қобда ауданы әкімдігінің 2022 жылғы 14 маусымдағы № 190 «Ақтөбе облысы Қобда ауданы әкімдігінің 2022 жылғы 20 мамырдағы № 161 «Қобда ауданында коммуналдық көрсетілетін қызметтерді ұсынудың қағидаларын бекіту туралы» қаулысына өзгерістер енгізу туралы» қаулысына өзгеріс енгізу туралы

act_code: '175143'
requisite: Постановление акимата Айтекебийского района Актюбинской области от 1 декабря 2022 года № 250. Утратило силу постановлением акимата Айтекебийского района Актюбинской области от 6 декабря 2023 года № 348
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования по Айтекебийскому району на 2023 год
  kaz: 2023 жылға Әйтеке би ауданы бойынша ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

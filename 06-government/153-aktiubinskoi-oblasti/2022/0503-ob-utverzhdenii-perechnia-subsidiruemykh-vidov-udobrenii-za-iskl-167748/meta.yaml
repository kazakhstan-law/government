requisite: Постановление акимата Актюбинской области от 3 мая 2022 года № 139. Зарегистрировано в Министерстве юстиции Республики Казахстан 7 мая 2022 года № 27953
title:
  rus: Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (литр, килограмм) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2022 год
  kaz: 2022 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы

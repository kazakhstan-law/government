requisite: Ақтөбе облысы әкімиятының 2005 жылғы 8 ақпандағы N 20 қаулысы. Ақтөбе облысының Әділет Департаментінде 2005 жылғы 14 наурызда N 3089 тіркелді. Орындалу мерзімі аяқталуына байланысты күші жойылды - "Нормативтік құқықтық актілер туралы" Қазақстан Республикасының 1998 жылғы 24 наурыздағы N 213 Заңына сәйкес

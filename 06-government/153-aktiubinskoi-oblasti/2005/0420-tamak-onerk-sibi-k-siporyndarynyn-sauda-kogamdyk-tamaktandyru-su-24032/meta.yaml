act_code: '24032'
requisite: Ақтөбе облысы Ойыл ауданы әкімдігінің 2005 жылғы 20 сәуірдегі № 104 қаулысы. Ақтөбе облысы Әділет департаментінің Ойыл аудандық Әділет басқармасында 2005 жылғы 25 сәуірде № 3-11-3 болып тіркелді

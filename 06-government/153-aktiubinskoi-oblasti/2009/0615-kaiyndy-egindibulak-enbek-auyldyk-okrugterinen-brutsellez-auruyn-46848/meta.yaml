act_code: '46848'
requisite: Ақтөбе облысы Мұғалжар аудандық әкімдігінің 2009 жылғы 15 маусымдағы № 236 қаулысы. Ақтөбе облысының Мұғалжар аудандық әділет басқармасында 2009 жылдың 14 шілдеде № 3-9-102 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Ақтөбе облысы Мұғалжар аудандық әкім аппаратының 2013 жылғы 20 ақпандағы № 444 хатымен)

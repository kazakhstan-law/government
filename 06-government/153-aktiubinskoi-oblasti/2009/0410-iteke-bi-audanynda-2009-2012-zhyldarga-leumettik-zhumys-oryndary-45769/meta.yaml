act_code: '45769'
requisite: Ақтөбе облысы Әйтеке би аудандық әкімиятының 2009 жылғы 10 сәуірдегі N 167 қаулысы. Ақтөбе облысының Әйтеке би аудандық әділет басқармасында 2009 жылдың 7 мамырда N 3-2-78 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық әкімдігінің 2012 жылғы 6 маусымдағы № 125 қаулысымен

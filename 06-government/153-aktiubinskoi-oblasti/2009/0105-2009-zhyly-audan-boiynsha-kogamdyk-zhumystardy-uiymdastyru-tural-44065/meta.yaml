requisite: Ақтөбе облысы Темір аудандық әкімдігінің 2009 жылғы 5 қаңтардағы N 1 қаулысы. Ақтөбе облысының Темір аудандық әділет басқармасында 2009 жылдың 5 ақпанда N 3-10-96 тіркелді. Күші жойылды - Ақтөбе облысы Темір аудандық әкімдігінің 2010 жылғы 16 наурыздағы N 38 қаулысымен

requisite: Ақтөбе облысы Темір аудандық әкімдігінің 2009 жылғы 28 қазандағы № 217 қаулысы. Ақтөбе облысының Темір аудандық әділет басқармасында 2009 жылдың 20 қарашада № 3-10-114 тіркелді. Күші жойылды - Ақтөбе облысы Темір аудандық әкімдігінің 2009 жылғы 30 қарашадағы N 227 қаулысымен

requisite: Ақтөбе облысы Темір аудандық әкімдігінің 2009 жылғы 29 сәуірдегі N 84 шешімі. Ақтөбе облысының Темір аудандық Әділет басқармасында 2009 жылдың 21 мамырда N 3-10-106 тіркелді. Күші жойылды - Ақтөбе облысы Темір аудандық әкімдігінің 2010 жылғы 16 наурыздағы N 38 қаулысымен

requisite: Ақтөбе облысы Ойыл аудандық әкімдігінің 2009 жылғы 19 қаңтардағы N 26 қаулысы. Ақтөбе облысының Ойыл аудандық әділет басқармасында 2009 жылдың 4 ақпанда N 3-11-55 тіркелді. Күші жойылды - Ақтөбе облысы Ойыл аудандық әкімдігінің 2010 жылғы 5 қаңтардағы № 1 қаулысымен

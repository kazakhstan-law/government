requisite: Ақтөбе облысы Темір аудандық әкімдігінің 2009 жылғы 13 ақпандағы N 23 қаулысы. Ақтөбе облысының Темір аудандық Әділет басқармасында 2009 жылдың 2 наурызда N 3-10-99 тіркелді. Күші жойылды - Ақтөбе облысы Темір аудандық әкімдігінің 2009 жылғы 29 сәуірдегі N 80 қаулысымен

requisite: Ақтөбе облысы Мәртөк аудандық әкімиятының 2009 жылғы 23 маусымдағы N 187 қаулысы. Ақтөбе облысының Мәртөк аудандық Әділет басқармасында 2009 жылдың 29 маусымда N 3-8-92 тіркелді. Күші жойылды - Ақтөбе облысы Мәртөк аудандық әкімдігінің 2011 жылғы 19 қазандағы № 364 қаулысымен

requisite: Ақтөбе облысы Алға аудандық әкімиятының 2009 жылғы 5 қаңтардағы N 29 қаулысы. Ақтөбе облысының Алға аудандық әділет басқармасында 2009 жылдың 8 қаңтарда N 3-3-67 тіркелді. Күші жойылды - Ақтөбе облысы Алға аудандық әкімиятының 2010 жылғы 6 қаңтардағы N 7 қаулысымен

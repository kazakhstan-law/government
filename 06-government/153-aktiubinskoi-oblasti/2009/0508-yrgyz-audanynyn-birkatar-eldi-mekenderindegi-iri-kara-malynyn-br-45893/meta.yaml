requisite: Ақтөбе облысы Ырғыз аудандық әкімдігінің 2009 жылғы 8 мамырдағы N 98 қаулысы. Ақтөбе облысының Ырғыз аудандық Әділет басқармасында 2009 жылдың 14 мамырда N 3-5-96 тіркелді. Күші жойылды - Ақтөбе облысы Ырғыз аудандық әкімдігінің 2009 жылғы 25 желтоқсандағы N 245 қаулысымен

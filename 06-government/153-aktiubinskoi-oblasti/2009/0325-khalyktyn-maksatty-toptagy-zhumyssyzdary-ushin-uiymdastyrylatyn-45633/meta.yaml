requisite: Ақтөбе облысы Мұғалжар аудандық әкімдігінің 2009 жылғы 25 наурыздағы N 110 қаулысы. Ақтөбе облысы Мұғалжар ауданының Әділет басқармасында 2009 жылдың 6 мамырда N 3-9-97 тіркелді. Күші жойылды - Ақтөбе облысы Мұғалжар аудандық әкімдігінің 2010 жылғы 7 сәуірдегі N 246 қаулысымен

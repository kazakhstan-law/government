requisite: Ақтөбе облысы Байғанин аудандық әкімиятының 2009 жылғы 4 мамырдағы N 88 қаулысы. Ақтөбе облысының Байғанин аудандық әділет басқармасында 2009 жылдың 20 мамырда N 3-4-70 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин аудандық әкімдігінің 2010 жылғы 5 қаңтардағы № 1 қаулысымен

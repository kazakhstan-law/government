requisite: Ақтөбе облысы Қобда ауданының әкімдігінің 2009 жылғы 3 желтоқсандағы N 254 қаулысы. Ақтөбе облысының Қобда аудандық әділет басқармасында 2009 жылдың 29 желтоқсанда N 3-7-80 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық әкімдігінің 2010 жылғы 26 сәуірдегі № 101 қаулысымен

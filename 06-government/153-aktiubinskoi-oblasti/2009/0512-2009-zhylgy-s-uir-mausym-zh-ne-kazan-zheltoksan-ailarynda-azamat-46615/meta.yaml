requisite: Ақтөбе облысы Қобда ауданы әкімдігінің 2009 жылғы 12 мамырдағы N 91 қаулысы. Ақтөбе облысының Қобда аудандық әділет басқармасында 2009 жылдың 19 маусымда N 3-7-70 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық әкімдігінің 2010 жылғы 22 сәуірдегі N 99 қаулысымен

act_code: '46134'
requisite: Ақтөбе облысы Әйтеке би аудандық әкімиятының 2009 жылғы 18 мамырдағы N 242 қаулысы. Ақтөбе облысының Әйтеке би аудандық әділет басқармасында 2009 жылдың 26 мамырда N 3-2-81 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық әкімиятының 2010 жылғы 15 ақпандағы № 25 қаулысымен

requisite: Ақтөбе облысы Әйтеке би аудандық әкімиятының 2009 жылғы 19 қаңтардағы N 65 қаулысы. Ақтөбе облысының Әйтеке би аудандық әділет басқармасында 2009 жылдың 5 ақпанда N 3-2-68 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық әкімдігінің 2010 жылғы 1 наурыздағы N 49 қаулысымен

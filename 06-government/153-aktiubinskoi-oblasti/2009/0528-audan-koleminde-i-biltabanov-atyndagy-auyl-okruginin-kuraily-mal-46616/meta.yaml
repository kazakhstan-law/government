requisite: Ақтөбе облысы Қобда ауданы әкімдігінің 2009 жылғы 28 мамырдағы N 99 қаулысы. Ақтөбе облысының Қобда аудандық әділет басқармасында 2009 жылдың 19 маусымда N 3-7-71 тіркелді. Күші жойылды - Ақтөбе облысы Қобда ауданының әкімдігінің 2009 жылғы 29 шілдедегі N 178 қаулысымен
title:

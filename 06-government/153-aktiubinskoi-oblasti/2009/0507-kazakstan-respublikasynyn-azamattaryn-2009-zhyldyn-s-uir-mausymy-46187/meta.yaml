requisite: Ақтөбе облысы Шалқар аудандық әкімиятының 2009 жылғы 7 мамырындағы N 176 қаулысы. Ақтөбе облысы Шалқар ауданының Әділет басқармасында 2009 жылдың 27 мамырда N 3-13-109 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар аудандық әкімдігінің 2010 жылғы 6 қаңтардағы N 2 қаулысымен

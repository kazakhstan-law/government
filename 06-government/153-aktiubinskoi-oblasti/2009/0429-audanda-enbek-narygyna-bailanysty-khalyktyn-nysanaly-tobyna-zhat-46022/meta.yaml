requisite: Ақтөбе облысы Алға ауданының әкімдігінің 2009 жылғы 29 сәуірдегі N 166 қаулысы. Ақтөбе облысының Алға аудандық әділет басқармасында 2009 жылдың 21 мамырдағы N 3-3-82 тіркелді. Қолданылу мерзімі аяқталуына байланысты күші жойылды - Ақтөбе облысы Алға ауданының әкімі аппаратының 2013 жылғы 22 ақпандағы № 05-1/419 хатымен

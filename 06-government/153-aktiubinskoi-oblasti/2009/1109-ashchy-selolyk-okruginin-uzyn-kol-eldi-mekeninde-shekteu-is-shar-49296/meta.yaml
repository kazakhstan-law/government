requisite: Ақтөбе облысы Байғанин аудандық әкімдігінің 2009 жылғы 9 қарашадағы № 176 қаулысы. Ақтөбе облысының Байғанин аудандық әділет басқармасында 2009 жылдың 10 желтоқсанда N 3-4-86 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин аудандық әкімдігінің 2010 жылғы 29 наурыздағы № 50 қаулысымен

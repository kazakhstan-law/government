act_code: '48519'
requisite: Ақтөбе облысы Мұғалжар аудандық әкімдігінің 2009 жылғы 23 қыркүйектегі N 324 қаулысы. Ақтөбе облысының Мұғалжар аудандық әділет басқармасында 2009 жылдың 4 қарашада N 3-9-108 тіркелді. Күші жойылды - Ақтөбе облысы Мұғалжар ауданының әкімдігінің 2017 жылғы 6 наурыздағы № 81 қаулысымен

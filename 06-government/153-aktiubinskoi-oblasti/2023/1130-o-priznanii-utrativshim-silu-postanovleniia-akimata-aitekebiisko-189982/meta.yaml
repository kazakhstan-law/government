act_code: '189982'
requisite: Постановление акимата Айтекебийского района Актюбинской области от 30 ноября 2023 года № 337
title:
  rus: О признании утратившим силу постановления акимата Айтекебийского района от 01 декабря 2022 года № 251 «Об установлении квоты рабочих мест для трудоустройства лиц с инвалидностью в Айтекебийском районе на 2023 год»
  kaz: Әйтеке би ауданының әкімдігінің 2022 жылғы 01 желтоқсандағы № 251 «2023 жылға арналған Әйтеке би ауданында мүгедектігі бар адамдар үшін жұмыс орындарына квота белгілеу туралы» қаулысының күшін жою туралы

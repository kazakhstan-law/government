act_code: '189725'
requisite: Постановление акимата Актюбинской области от 4 декабря 2023 года № 328
title:
  rus: Об установлении квоты для трудоустройства граждан Актюбинской области из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2023 год
  kaz: 2023 жылға арналған Ақтөбе облысының ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастарқатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған азаматтарын жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

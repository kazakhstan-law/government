  title:
    rus: О внесении изменений в постановление акимата Кобдинского района от 27 марта 2023 года № 72 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и предоставлении помещений кандидатам для встреч с избирателями на договорной основе»
    kaz: Қобда ауданы әкімдігінің 2023 жылғы 27 наурыздағы № 72 «Барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін кандидаттарға шарттық негізде үй-жайлар беру туралы» қаулысына өзгерістер енгізу туралы

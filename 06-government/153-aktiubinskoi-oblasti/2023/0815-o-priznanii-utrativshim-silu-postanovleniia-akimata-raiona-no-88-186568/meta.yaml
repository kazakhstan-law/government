act_code: '186568'
requisite: Постановление акимата Каргалинского района Актюбинской области от 15 августа 2023 года № 116
title:
  rus: О признании утратившим силу постановления акимата района № 88 от 28 апреля 2022 года «Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Каргалинскому району»
  kaz: Аудан әкімдігінің 2022 жылғы 28 сәуірдегі № 88 «Қарғалы ауданына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу қағидаларын бекіту туралы» қаулысының күшін жою туралы

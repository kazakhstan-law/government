  title:
    rus: О внесении изменений в постановление акимата Актюбинской области от 2 мая 2023 года № 111 «Об утверждении перечня субсидируемых пестицидов, биоагентов (энтомофагов) и нормы субсидий на 1 литр (килограмм, грамм, штук) пестицидов, биоагентов (энтомофагов), а также объемы бюджетных средств на субсидирование пестицидов, биоагентов (энтомофагов) на 2023 год»
    kaz: «2023 жылға арналған субсидияланатын пестицидтердің, биоагенттердiң (энтомофагтардың) тізбесі және пестицидтердің, биоагенттердiң (энтомофагтардың) 1 литріне (килограмына, грамына, данасына) арналған субсидиялар нормаларын, сондай-ақ пестицидтерді, биоагенттердi (энтомофагтарды) субсидиялауға арналған бюджет қаражатының көлемдерін бекіту туралы» Ақтөбе облысы әкімдігінің 2023 жылғы 2 мамырдағы № 111 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/189967/rus

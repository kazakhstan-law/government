  title:
    rus: О внесении изменений и дополнений в постановление акимата Актюбинской области от 16 марта 2023 года № 68 «Об утверждении объемов субсидий по направлениям субсидирования на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства по Актюбинской области на 2023 год»
    kaz: «Ақтөбе облысы бойынша 2023 жылға арналған асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» Ақтөбе облысы әкімдігінің 2023 жылғы 16 наурыздағы № 68 қаулысына өзгерістер мен толықтырулар енгізу туралы

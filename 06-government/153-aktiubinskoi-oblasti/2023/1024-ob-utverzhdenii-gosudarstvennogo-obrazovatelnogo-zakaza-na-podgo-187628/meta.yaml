  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 24 октября 2023 года № 286 «Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием на 2023-2024 учебный год по Актюбинской области»
    kaz: «Ақтөбе облысы бойынша техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға 2023-2024 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы» Ақтөбе облысы әкімдігінің 2023 жылғы 24 қазандағы № 286 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 16 марта 2023 года № 67 «Об утверждении Правил применения поощрений государственных служащих местных исполнительных органов и исполнительных органов, финансируемых из местного бюджета Актюбинской области»
    kaz: «Ақтөбе облысының жергілікті атқарушы органдарының және жергілікті бюджеттен қаржыландырылатын атқарушы органдарының мемлекеттік қызметшілеріне көтермелеулерді қолдану қағидаларын бекіту туралы» Ақтөбе облысы әкімдігінің 2023 жылғы 16 наурыздағы № 67 қаулысына өзгеріс енгізу туралы

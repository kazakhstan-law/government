  requisite: Постановление акимата Хромтауского района Актюбинской области от 31 августа 2023 года № 218. Утратило силу постановлением акимата Хромтауского района Актюбинской области от 20 октября 2025 года № 267 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесений изменения в постановление акимата Хромтауского района от 10 апреля 2023 года № 90 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» местных исполнительных органов Хромтауского района»
    kaz: «Хромтау ауданының жергілікті атқарушы органдарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Хромтау ауданы әкімдігінің 2023 жылғы 10 сәуірдегі № 90 қаулысына өзгеріс енгізу туралы

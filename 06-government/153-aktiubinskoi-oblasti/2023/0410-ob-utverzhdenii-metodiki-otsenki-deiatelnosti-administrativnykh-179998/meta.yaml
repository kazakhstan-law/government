act_code: '179998'
requisite: Постановление акимата Хромтауского района Актюбинской области от 10 апреля 2023 года № 90
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих исполнительных органов финансируемых из районного бюджета и административных государственных служащих аппарата акима Хромтауского района корпуса "Б"
  kaz: Аудандық бюджеттен қаржыландырылатын атқарушы органдардың "Б" корпусындағы мемлекеттік әкімшілік қызметшілері мен Хромтау ауданы әкімі аппаратының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

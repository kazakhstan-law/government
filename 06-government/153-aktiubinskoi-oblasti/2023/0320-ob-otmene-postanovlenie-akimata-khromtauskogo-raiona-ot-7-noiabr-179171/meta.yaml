title:
  rus: Об отмене постановление акимата Хромтауского района от 7 ноября 2022 года № 249 «Об определении мест для размещения агитационных печатных материалов для всех кандидатов и предоставлении помещений кандидатам для встреч с избирателями на договорной основе»
  kaz: Хромтау ауданы әкімдігінің 2022 жылғы 7 қарашадағы № 249 "Барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарды белгілеу және сайлаушылармен кездесуі үшін кандидаттарға шарттық негізде үй-жайлар беру туралы" қаулысының күшін жою туралы

  title:
    rus: О внесении изменений в постановление акимата Актюбинской области от 13 февраля 2023 года № 30 «Об утверждении государственного образовательного заказа на дополнительное образование детей в пределах объемов бюджетных средств по Актюбинской области на 2023 год»
    kaz: «Ақтөбе облысы бойынша 2023 жылға арналған бюджет қаражатының көлемдері шегінде балаларға қосымша білім беруге мемлекеттік білім беру тапсырысын бекіту туралы» Ақтөбе облысы әкімдігінің 2023 жылғы 13 ақпандағы № 30 қаулысына өзгерістер енгізу туралы

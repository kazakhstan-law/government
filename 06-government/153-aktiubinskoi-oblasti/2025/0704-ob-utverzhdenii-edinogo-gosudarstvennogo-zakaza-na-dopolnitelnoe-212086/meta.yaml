title:
  rus: Об утверждении единого государственного заказа на дополнительное образование (творческий и спортивный заказы, образовательный заказ на дополнительное образование) с учетом персонифицированного финансирования по получателям услуг
  kaz: Көрсетілетін қызметті алушылар бойынша дербестендірілген қаржыландыруды ескере отырып, қосымша білім беруге бірыңғай мемлекеттік тапсырысты (қосымша білім беруге шығармашылық және спорттық, білім беру тапсырыстары) бекіту туралы

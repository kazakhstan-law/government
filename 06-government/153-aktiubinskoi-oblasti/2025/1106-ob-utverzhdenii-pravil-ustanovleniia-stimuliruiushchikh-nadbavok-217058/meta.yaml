  kaz: Жергілікті бюджеттен қаржыландырылатын «Ақтөбе қаласының жер қатынастары, сәулет және қала құрылысы бөлімі» мемлекеттік мекемесінің «Ақтөбе жер мониторингі» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық еңбекақыларына ынталандыру үстемеақыларын белгілеу қағидаларын бекіту туралы

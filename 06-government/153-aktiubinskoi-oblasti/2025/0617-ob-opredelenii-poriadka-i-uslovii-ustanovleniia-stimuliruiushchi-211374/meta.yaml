act_code: '211374'
requisite: Постановление акимата Уилского района Актюбинской области от 17 июня 2025 года № 89
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам сотрудников коммунального государственного учреждения «Уилский районный молодежный ресурсный центр» государственного учреждения «Отдел внутренней политики, культуры, развития языков и спорта Уилского района» финансируемого из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Ойыл аудандық ішкі саясат, мәдениет, тілдерді дамыту және спорт бөлімі» мемлекеттік мекемесінің «Ойыл аудандық жастар ресурстық орталығы» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемақыларын белгілеудің тәртібі мен шарттарын айқындау туралы

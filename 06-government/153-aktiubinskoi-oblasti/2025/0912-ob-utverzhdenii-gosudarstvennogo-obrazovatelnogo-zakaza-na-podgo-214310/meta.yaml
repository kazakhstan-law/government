  title:
    rus: О внесении изменения в постановление акимата Актюбинской области от 12 сентября 2025 года № 181 «Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием на 2025-2026 учебный год по Актюбинской области
    kaz: «Ақтөбе облысы бойынша техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға 2025-2026 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы» Ақтөбе облысы әкімдігінің 2025 жылғы 12 қыркүйектегі № 181 қаулысына өзгеріс енгізу туралы

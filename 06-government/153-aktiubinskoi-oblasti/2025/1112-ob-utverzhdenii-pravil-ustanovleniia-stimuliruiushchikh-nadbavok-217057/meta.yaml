requisite: Постановление акимата города Актобе Актюбинской области от 12 ноября 2025 года № 2342
title:
  rus: Об утверждении Правил установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Центр поддержки семьи города Актобе» государственного учреждения «Отдел занятости и социальных программ города Актобе», финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Ақтөбе қаласының жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесінің «Ақтөбе қаласының отбасын қолдау орталығы» коммуналдық мемлекеттік мекемесінің қызметкерлерінің лауазымдық еңбекақыларына ынталандыру үстемеақыларын белгілеу қағидаларын бекіту туралы

act_code: '217060'
requisite: Постановление акимата города Актобе Актюбинской области от 6 ноября 2025 года № 2325
title:
  rus: Об утверждении Правил установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Центр оказания содействия по обеспечению и мониторингу жилищного фонда» государственного учреждения «Отдел жилищных отношений города Актобе», финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Ақтөбе қаласының тұрғын үй қатынастары бөлімі» мемлекеттік мекемесінің «Тұрғын үй қорын қамтамасыз ету және мониторинг жүргізу бойынша орталық» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық еңбекақыларына ынталандыру үстемеақыларын белгілеу қағидаларын бекіту туралы

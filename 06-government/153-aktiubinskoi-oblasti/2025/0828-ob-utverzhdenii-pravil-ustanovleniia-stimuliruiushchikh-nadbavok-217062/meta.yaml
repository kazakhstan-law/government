act_code: '217062'
requisite: Постановление акимата города Актобе Актюбинской области от 28 августа 2025 года № 2116
title:
  rus: Об утверждении Правил установления стимулирующих надбавок к должностным окладам работников коммунальных государственных учреждении «Молодежный ресурсный центр города Актобе» и «Центр по вопросам религий и связям с общественностью» государственного учреждения «Отдел внутренней политики города Актобе», финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Ақтөбе қаласының ішкі саясат бөлімі» мемлекеттік мекемесінің «Ақтөбе қаласының жастар ресурстық орталығы» және «Дін мәселелері және қоғаммен байланыс жөніндегі орталығы» коммуналдық мемлекеттік мекемелері қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу қағидаларын бекіту туралы

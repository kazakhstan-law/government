act_code: '145929'
requisite: Постановление акимата Таласского района Жамбылской области от 28 августа 2020 года № 293. Зарегистрировано Департаментом юстиции Жамбылской области 1 сентября 2020 года № 4713
title:
  rus: О признании утратившим силу постановление акимата Таласского района Жамбылской области от 30 октября 2017 года № 294 «Об утверждении Правил выдачи служебного удостоверения государственных служащих аппаратов акима района, города, сельских округов и исполнительных органов Таласского района, финансируемых из местного бюджета и его описания»
  kaz: «Аудан, қала, ауылдық округтерінің әкімі аппараттарының және Талас ауданының жергілікті бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне қызметтік куәлік беру Қағидаларын және оның сипаттамасын бекіту туралы» Жамбыл облысы Талас ауданы әкімдігінің 2017 жылғы 30 қазандағы № 294 қаулысының күшін жою туралы

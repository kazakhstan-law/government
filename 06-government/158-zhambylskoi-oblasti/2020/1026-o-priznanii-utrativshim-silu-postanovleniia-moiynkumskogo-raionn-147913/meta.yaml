act_code: '147913'
requisite: Постановление акимата Мойынкумского района Жамбылской области от 26 октября 2020 года № 288. Зарегистрировано Департаментом юстиции Жамбылской области 29 октября 2020 года № 4773
title:
  rus: О признании утратившим силу постановления Мойынкумского районного акимата от 21 февраля 2019 года №37 «Об утверждении Правил выдачи служебного удостоверения государственных служащих аппаратов акима района, села, сельских округов и исполнительных органов, финансируемых из местного бюджета и его описания»
  kaz: Мойынқұм аудан әкімдігінің 2019 жылғы 21 ақпандағы «Аудан, ауыл, ауылдық округтерінің әкімі аппараттарының және жергілікті бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне қызметтік куәлік беру Қағидаларын және оның сипаттамасын бекіту туралы» №37 қаулысының күшін жою туралы

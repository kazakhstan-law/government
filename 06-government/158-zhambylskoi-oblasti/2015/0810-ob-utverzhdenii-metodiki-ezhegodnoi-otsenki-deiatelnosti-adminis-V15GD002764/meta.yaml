title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Жуалынского района, аппаратов акима сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: 'Жуалы ауданы әкімі аппараты, ауылдық округ әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы '

act_code: '93613'
requisite: Постановление акимата Жамбылской области от 10 августа 2015 года № 195. Зарегистрировано Департаментом юстиции Жамбылской области 10 сентября 2015 года № 2757. Утратило силу постановлением акимата Жамбылской области от 24 ноября 2022 года № 249 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации  юридическими лицами лома и отходов цветных и черных металлов»
  kaz: «Заңды тұлғалардың түстi және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және өткізу бойынша қызметтi жүзеге асыруына лицензия  беру» мемлекеттік көрсетілетін қызмет регламентін  бекіту туралы

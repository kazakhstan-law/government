requisite: Постановление акимата Жамбылской области от 27 августа 2015 года № 218. Зарегистрировано Департаментом юстиции Жамбылской области 2 октября 2015 года № 2788. Утратило силу постановлением акимата Жамбылской области от 12 октября 2020 года № 226 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на осуществление деятельности по производству (формуляции) пестицидов (ядохимикатов), реализации пестицидов (ядохимикатов), применению пестицидов (ядохимикатов) аэрозольным и фумигационным способами»
  kaz: «Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдiк және фумигациялық тәсiлдермен қолдану жөніндегі қызметті жүзеге асыруға лицензия беру»мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

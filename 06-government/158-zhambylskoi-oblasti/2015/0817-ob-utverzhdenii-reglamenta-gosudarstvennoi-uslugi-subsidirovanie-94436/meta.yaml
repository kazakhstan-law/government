  title:
    rus: О внесении изменений в постановление акимата Жамбылской области № 203 от 17 августа 2015 года  «Об утверждении регламента государственных услуг Субсидирование стоимости гербицидов, биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений»
    kaz: «Өсімдіктерді қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердің, биоагенттердің (энтомофагтардың) және биопрепараттардың құнын субсидиялау мемлекеттік көрсетілетін қызмет регламентін бекіту туралы»  Жамбыл облысы әкімдігінің 2015 жылғы 17 тамыздағы № 203 қаулысына өзгерістер енгізу туралы

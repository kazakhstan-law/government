    kaz: «Тараз қаласында 2015 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін  бекіту туралы» Тараз қаласы әкімдігінің 2015 жылғы 23 ақпандағы №183 қаулысына өзгерістер енгізу туралы

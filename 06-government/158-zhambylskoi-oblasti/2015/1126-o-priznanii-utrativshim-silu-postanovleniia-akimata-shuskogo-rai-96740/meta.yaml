title:
  rus: 'О признании утратившим силу постановления акимата Шуского района от 2 сентября 2015 года № 317 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Шуского района»  '
  kaz: 'Шу ауданы әкімдігінің 2015 жылғы 2 қыркүйектегі «Шу ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен тәртібін бекіту туралы»  № 317 қаулысының күшін жою туралы '

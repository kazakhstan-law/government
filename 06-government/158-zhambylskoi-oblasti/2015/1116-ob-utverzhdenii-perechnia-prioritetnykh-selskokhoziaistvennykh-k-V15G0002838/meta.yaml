requisite: Постановление акимата Жамбылской области от 30 ноября 2015 года № 274. Зарегистрировано Департаментом юстиции Жамбылской области 30 ноября 2015 года № 2838. Утратило силу постановлением акимата Жамбылской области от 26 октября 2020 года № 244 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня приоритетных сельскохозяйственных культур и норм субсидий (на 1 гектар и (или) 1 тонну) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым ауыл шаруашылығы дақылдарының тiзбесін және басым дақылдар өндіруді субсидиялау жолымен өсiмдiк шаруашылығы  өнімінің өнімділігі мен сапасын арттыруға, жанар-жағармай материалдары мен көктемгi егіс және егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын  (1 гектарға және (немесе)  1 тоннаға) бекіту туралы

requisite: Постановление акимата Жамбылской области от 29 апреля 2015 года № 72. Зарегистрировано Департаментом юстиции Жамбылской области 4 июня 2015 года № 2657. Утратило силу постановлением акимата Жамбылской области от 16.11.2015 года № 274
title:
  rus: Об установлении перечня приоритетных сельскохозяйственных культур и нормы субсидий (на 1 гектар) на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте на 2015 год
  kaz: 2015 жылға басым ауыл шаруашылығы дақылдардың тiзбесі және басым дақылдар өндіруді субсидиялау арқылы жанар-жағармай материалдары мен көктемгi егiс және егiн жинау жұмыстарын жүргiзуге қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауылшаруашылық дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын  (1 гектарға) белгілеу туралы

  title:
    rus: О внесении дополнений в постановление акимата Жамбылской области от 16 ноября 2015 года № 274 «Об утверждении перечня приоритетных сельскохозяйственных культур и норм субсидий (на 1 гектар и (или) 1 тонну) на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте»
    kaz: «Басым ауыл шаруашылығы дақылдарының тiзбесін және басым дақылдар өндіруді субсидиялау жолымен өсiмдiк шаруашылығы өнімінің өнімділігі мен сапасын арттыруға, жанар-жағармай материалдары мен көктемгi егіс және егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын арзандатуға арналған субсидиялар нормаларын (1 гектарға және (немесе)  1 тоннаға) бекіту туралы» Жамбыл облысы әкімдігінің 2015 жылғы 16 қарашадағы  № 274 қаулысына толықтырулар енгізу туралы

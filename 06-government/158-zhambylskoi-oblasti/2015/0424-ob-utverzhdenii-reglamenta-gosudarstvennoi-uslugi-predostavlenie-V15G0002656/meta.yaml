title:
  rus: Об утверждении регламента государственной услуги «Предоставление  мер социальной поддержки специалистам  в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в сельские населенные пункты»
  kaz: «Ауылдық елді мекендерге жұмыс істеу  және тұру үшін келген денсаулық сақтау,  білім беру, әлеуметтік қамсыздандыру,  мәдениет, спорт және агроөнеркәсіптік  кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление акимата Жамбылской области от 27 августа 2015 года № 216 «Об утверждении регламента государственной услуги «Выдача паспорта готовности энергопроизводящим и энергопередающим организациям к работе в осенне-зимний период»
    kaz: «Энергия өндіруші және энергия беруші ұйымдарға күзгі-қысқы кезеңдегі жұмысқа әзірлік паспортын беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Жамбыл облысы әкімдігінің 2015 жылғы 27 тамыздағы № 216 қаулысына  өзгерістер мен толықтыру енгізу туралы

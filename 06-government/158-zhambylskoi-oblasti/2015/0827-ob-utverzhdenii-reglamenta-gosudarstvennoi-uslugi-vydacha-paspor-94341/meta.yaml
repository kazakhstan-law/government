act_code: '94341'
requisite: Постановление акимата Жамбылской области от 27 августа 2015 года № 216. Зарегистрировано Департаментом юстиции Жамбылской области 2 октября 2015 года № 2785. Утратило силу постановлением акимата Жамбылской области от 24 ноября 2022 года № 249 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача паспорта готовности энергопроизводящим и энергопередающим организациям с установленной электрической мощностью 5 МВт и менее, свыше 5 МВт или с установленной тепловой мощностью 100 Гкал/час и выше, а также имеющим на своем балансе электрические сети напряжением  35 кВ и ниже, 110 кВ и выше к работе в осенне-зимних условиях»
  kaz: «Белгіленген электр қуаты 5 МВт және одан төмен, 5 МВт-тан жоғары немесе белгіленген жылу қуаты 100 Гкал/сағ және одан жоғары, сондай-ақ өз балансында кернеуі 35 кВ және одан төмен, 110 кВ және одан жоғары электр желілері бар энергия өндіруші және энергия беруші ұйымдарға күзгі-қысқы жағдайларда жұмысқа әзірлік паспортын беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

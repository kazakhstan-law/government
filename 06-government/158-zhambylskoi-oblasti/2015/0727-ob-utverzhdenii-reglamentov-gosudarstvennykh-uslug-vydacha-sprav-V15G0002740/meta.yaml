title:
  rus: Об утверждении регламентов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории  Республики Казахстан», «Выдача архитектурно-планировочного задания» и «Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций,  инженерных систем и оборудования»
  kaz: «Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын анықтау бойынша анықтама беру», «Сәулет-жоспарлау тапсырмасын беру» және «Тіреу және қоршау конструкцияларын,инженерлік жүйелер мен жабдықтарды өзгертуге байланысты емес қолданыстағы ғимараттардың үй-жайларын (жекелеген бөліктерін)реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы

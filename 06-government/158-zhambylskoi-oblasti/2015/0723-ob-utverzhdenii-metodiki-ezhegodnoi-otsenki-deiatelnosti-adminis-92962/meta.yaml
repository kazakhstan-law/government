title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» аппарата акима района и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың  «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы  бағалаудың әдістемесін бекіту туралы

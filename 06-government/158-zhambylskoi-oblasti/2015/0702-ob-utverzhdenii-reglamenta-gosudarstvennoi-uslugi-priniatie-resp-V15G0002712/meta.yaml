  title:
    rus: О признании утратившим силу постановления акимата Жамбылской области от 2 июля 2015 года № 144 «Об утверждении регламента государственной услуги «Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения в порядке, определяемом Правительством Республики Казахстан»

  title:
    rus: О внесении изменения в постановление акимата Сарысуского района от 2 сентября 2015 года № 219 «Об утверждении схемы и порядка перевозки в общеобразовательные школы детей, проживающих в отдаленных населенных пунктах Сарысуского района»
    kaz: «Сарысу ауданының шалғайдағы елді мекендерде тұратын балаларды жалпы білім беретін мектептерге тасымалдаудың схемалары мен тәртібін бекіту туралы» Сарысу ауданы әкімдігінің 2015 жылғы 2 қыркүйектегі № 219 қаулысына өзгеріс енгізу туралы

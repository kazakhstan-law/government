title:
  rus: Об установлении видов субсидируемых удобрений и нормы субсидий на 1 тонну (литр, килограмм) удобрений, реализованных отечественными производителями, на 1 тонну (литр, килограмм) удобрений, приобретенных у поставщика удобрений и (или) иностранных производителей удобрений на 2015 год
  kaz: '2015 жылға субсидияланатын тыңайтқыштардың түрлері және отандық өндiрушiлер өткізген тыңайтқыштардың 1 тоннасына (литрiне, килограмына), тыңайтқыштар берушіден және (немесе) шетелдiк тыңайтқыш өндiрушiлерден сатып алынған тыңайтқыштардың 1 тоннасына (литрiне, килограмына) арналған субсидиялардың нормаларын белгілеу туралы '

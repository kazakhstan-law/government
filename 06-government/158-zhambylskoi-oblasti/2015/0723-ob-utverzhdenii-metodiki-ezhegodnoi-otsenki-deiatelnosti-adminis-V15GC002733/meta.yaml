  title:
    rus: О признании утратившим силу постановление акимата Жамбылского района от 23 июля 2015 года № 471 «Об утверждении Методики ежегодной  оценки деятельности административных  государственных служащих корпуса "Б" аппарата акима района и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: «Аудан әкімі аппараты мен жергілікті  бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік  қызметшілерінің қызметін жыл сайынғы  бағалаудың әдістемесін бекіту туралы» Жамбыл ауданы әкімдігінің 2015 жылғы  23 шілдедегі № 471 қаулысының күші жойылды деп тану туралы

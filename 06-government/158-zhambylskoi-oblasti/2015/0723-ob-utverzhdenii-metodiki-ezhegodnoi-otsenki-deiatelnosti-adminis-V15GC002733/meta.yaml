  kaz: Аудан әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың  «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы  бағалаудың әдістемесін бекіту туралы

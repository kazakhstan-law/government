requisite: Постановление от 28.09.2015 №428, Акимат Таласского района. Зарегистрировано Департаментом юстиции Жамбылской области 6 ноября 2015 года № 2816.  Утратило силу постановлением акимата Таласского района Жамбылской области от 28.01.2016 № 21
title:
  rus: Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б»аппаратов акимов района, города, сельских округов и районных  исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, қала, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың   «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

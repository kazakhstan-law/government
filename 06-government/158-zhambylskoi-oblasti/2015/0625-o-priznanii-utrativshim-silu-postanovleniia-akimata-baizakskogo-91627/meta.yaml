title:
  rus: О признании утратившим силу постановления акимата Байзакского района от 28 ноября 2014 года №658 Об определении порядка расчета ставок арендной платы при передаче  в имущественный наем (аренду) коммунального имущества
  kaz: «Коммуналдық мүлікті жалға алуға (жалдауға) беру кезінде жалдау ақысының мөлшерлемесін есептеу тәртібін айқындау туралы» Байзақ ауданы әкімдігінің 2014 жылғы 28 қарашадағы №658 қаулысының күші қойылды деп тану туралы

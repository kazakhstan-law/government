act_code: '70409'
requisite: Постановление акимата города Тараз Жамбылской области от 14 января 2013 года № 42. Зарегистрировано Департаментом юстиции Жамбылской области 24 января 2013 года № 1881. Утратило силу постановлением акимата города Тараз Жамбылской области от 15 января 2020 года № 89 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін жұмыс орындарына квота белгілеу туралы

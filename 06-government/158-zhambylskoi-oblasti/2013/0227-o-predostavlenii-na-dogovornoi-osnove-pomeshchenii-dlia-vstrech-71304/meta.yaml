act_code: '71304'
requisite: Постановление акимата Байзакского района Жамбылской области от 27 февраля 2013 года № 158. Зарегистрировано Департаментом юстиции Жамбылской области 6 марта 2013 года № 1895. Утратило силу постановлением акимата Байзакского района Жамбылской области от 24 июня 2013 года № 401
title:
  rus: О предоставлении на договорной основе помещений для встреч с избирателями и определение мест для размещения агитационных печатных материалов для кандидатов в депутаты районного маслихата вместо выбывшего депутата по Жалгызтобинскому избирательному округу № 3 Байзакского района
  kaz: Байзақ ауданы № 3 Жалғызтөбе сайлау округі бойынша шығып қалған мәслихат депутатының орнына кандидаттарға сайлаушылармен кездесу үшін шарттық негізінде үй - жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

requisite: Постановление акимата Таласского района Жамбылской области от 29 октября 2013 года № 523. Зарегистрировано Департаментом юстиции Жамбылской области 20 ноября 2013 года № 2051. Утратило силу постановлением акимата Таласского района Жамбылской области от 30.01.2017 № 10
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы  пробации уголовно-исполнительной инспекции, а также для лиц, освобожденных  из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций
  kaz: Қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Байзакского района Жамбылской области от 4 января 2013 года №4. Зарегистрировано Департаментом юстиции Жамбылской области 4 февраля 2013 года № 1885. Утратило силу постановлением акимата Байзакского района Жамбылской области от 27.05.2016 № 245
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно - исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций в Байзакском районе
  kaz: Байзақ ауданында қылмыстық - атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

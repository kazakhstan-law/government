  title:
    rus: О признании утратившим силу постановления акимата Байзакского района от 4 января 2013 года №4 «Об установлении квоты рабочих мест для лиц, состоящих  на учете службы  пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения  свободы несовершеннолетних выпускников интернатных организаций в Байзакском районе»
    kaz: Байзақ ауданы әкімдігінің 2013 жылғы 4 қаңтардағы «Байзақ  ауданында қылмыстық – атқару инспекциясы пробация қызметінің есебінде тұрған адамдар, сондай-ақ бас  бостандығынан айыру орындарынан босатылған адамдар және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы»  №4 қаулысының күші жойылды деп тану туралы

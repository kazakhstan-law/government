act_code: '74649'
requisite: Постановление акимата района Т.Рыскулова Жамбылской области от 16 сентября 2013 года № 393. Зарегистрировано Департаментом юстиции Жамбылской области 8 октября 2013 года № 2022
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций района Т.Рыскулова
  kaz: Т.Рысқұлов ауданында қылмыстық-атқару инспекциясы пробация қызметінің  есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

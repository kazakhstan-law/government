requisite: Жамбыл облысы Қордай аудандық әкімдігінің 2010 жылғы 27 сәуіріндегі № 102 қаулысы. Жамбыл облысы Қордай ауданының Әділет басқармасында 2010 жылғы 2 маусымда 6-5-91 нөмірімен тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Жамбыл облысы Қордай ауданы әкімі аппаратының 15.11.2013 № 05-1357 хаты)

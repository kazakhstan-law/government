requisite: Жамбыл облысы Тараз қаласының әкімдігінің 2010 жылғы 30 қыркүйектегі № 838 қаулысы. Жамбыл облысы Тараз қалалық Әділет басқармасында 2010 жылғы 11 қарашада 6-1-115 нөмірімен болып тіркелді. Күші жойылды - Жамбыл облысы Тараз қаласының әкімдігінің 2020 жылғы 15 қаңтардағы № 89 (алғашқы ресми жарияланған күнінен күнтізбелік он күн өткен соң қолданыска енгізіледі) қаулысымен

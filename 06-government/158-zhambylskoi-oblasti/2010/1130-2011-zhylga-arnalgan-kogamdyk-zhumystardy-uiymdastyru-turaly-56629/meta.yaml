act_code: '56629'
requisite: Жамбыл облысы Жамбыл ауданы әкімдігінің 2010 жылғы 30 қарашадағы № 504 қаулысы. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2011 жылғы 11 қаңтарда 6-3-125 нөмірімен тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты күші жойылды (Жамбыл ауданы әкімі аппаратының 2012 жылғы 8 маусымдағы № 3/904 хаты)

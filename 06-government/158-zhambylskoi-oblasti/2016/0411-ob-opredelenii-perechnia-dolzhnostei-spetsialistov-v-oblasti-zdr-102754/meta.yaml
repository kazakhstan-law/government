  title:
    rus: О внесении изменений в постановление акимата Жамбылской области от 11 апреля 2016 года № 123 «Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности»
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Жамбыл облысы әкімдігінің 2016 жылғы 11 сәуірдегі № 123 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Жамбылской области от 18 января 2016 года № 10. Зарегистрировано Департаментом юстиции Жамбылской области 18 февраля 2016 года № 2942. Утратило силу постановлением акимата Жамбылской области от 20 августа 2020 года № 189 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін аттестаттаудан өткізуге құжаттар қабылдау» мемлекеттік көрсетілетін қызметрегламентін бекіту туралы

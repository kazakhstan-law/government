act_code: '102762'
requisite: Постановление акимата Жамбылской области от 18 апреля 2016 года №124. Зарегистрировано Департаментом юстиции Жамбылской области 20 мая 2016 года № 3075. Утратило силу постановлением акимата Жамбылской области от 12 октября 2020 года № 226 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
  kaz: «Басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгі-егіспен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

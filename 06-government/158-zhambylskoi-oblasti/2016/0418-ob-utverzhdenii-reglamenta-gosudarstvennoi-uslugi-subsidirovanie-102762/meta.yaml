  title:
    rus: О внесении изменений в постановление акимата Жамбылской области от 18 апреля 2016 года № 124 «Об утверждении регламента государственной услуги «Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
    kaz: «Басым дақылдар өндіруді субсидиялау арқылы өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгі-егіс пен егін жинау жұмыстарын жүргізу үшін қажетті басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Жамбыл облысы әкімдігінің 2016 жылғы 18 сәуірдегі № 124 қаулысына өзгерістер енгізу туралы

  title:
    rus: О внесении изменения в постановление акимата Жамбылской области от 8 февраля 2016 года № 37 «Об утверждении регламента государственной услуги «Субсидирование заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость»
    kaz: «Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегінде бюджетке төленген қосылған құн салығы сомасын субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Жамбыл облысы әкімдігінің 2016 жылғы 8 ақпандағы № 37 қаулысына өзгеріс енгізу туралы

title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, города, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан,  қала,  ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік  қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

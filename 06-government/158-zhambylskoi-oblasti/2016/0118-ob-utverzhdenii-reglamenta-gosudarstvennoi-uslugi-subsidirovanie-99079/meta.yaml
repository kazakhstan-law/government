requisite: Постановление акимата Жамбылской области от 18 января 2016 года № 8. Зарегистрировано Департаментом юстиции Жамбылской области 16 февраля 2016 года № 2937. Утратило силу постановлением акимата Жамбылской области от 12 октября 2020 года № 226 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

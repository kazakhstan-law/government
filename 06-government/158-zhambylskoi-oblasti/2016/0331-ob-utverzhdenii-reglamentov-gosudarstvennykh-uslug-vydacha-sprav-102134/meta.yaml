  title:
    rus: «О внесении изменений в постановление акимата Жамбылской области от 31 марта 2016 года № 105 «Об утверждении регламентов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан», «Выдача архитектурно-планировочного задания» и «Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования»
    kaz: «Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау бойынша анықтама беру», «Сәулет-жоспарлау тапсырмасын беру» және «Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертпей қолданыстағы ғимараттардағы үй-жайларды (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы Жамбыл облысы әкімдігінің 2016 жылғы 31 наурыздағы № 105 қаулысына өзгерістер енгізу туралы

act_code: '102134'
requisite: Постановление акимата Жамбылской области от 31 марта 2016 года №105. Зарегистрировано Департаментом юстиции Жамбылской области 6 мая 2016 года № 3059. Утратило силу постановлением акимата Жамбылской области от 07.03.2018 № 31
title:
  rus: Об утверждении регламентов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан», «Выдача архитектурно-планировочного задания» и «Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования»
  kaz: «Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау бойынша анықтама беру», «Сәулет-жоспарлау тапсырмасын беру» және «Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертпей қолданыстағы ғимараттардағы үй-жайларды (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы

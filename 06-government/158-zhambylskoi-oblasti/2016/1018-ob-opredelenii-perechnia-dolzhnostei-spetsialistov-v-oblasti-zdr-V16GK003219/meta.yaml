  title:
    rus: О внесении изменений в постановление акимата Шуского района от 18 октября 2016 года № 391 "Об определении перечня должностей специалистов в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющихся гражданскими служащими и работающих в сельской местности"
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандар лауазымдарының тізбесін айқындау туралы» Жамбыл облысы Шу ауданы әкімдігінің 2016 жылдың 18 қазандағы №391 қаулысына өзгерістер енгізу туралы

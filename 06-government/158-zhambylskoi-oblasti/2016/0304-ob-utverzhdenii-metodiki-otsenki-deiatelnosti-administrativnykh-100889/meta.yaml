requisite: Постановление акимата Жуалынского района Жамбылской области от 4 марта 2016 года № 61. Зарегистрировано Департаментом юстиции Жамбылской области 31 марта 2016 года № 3010. Утратило силу постановлением акимата Жуалынского района Жамбылской области от 27.02.2017 № 58
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акима района, аульных округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, ауылдық округ әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың  «Б» корпусы мемлекеттік әкімшілік қызметшілерінің жұмысын бағалаудың әдістемесін бекіту туралы

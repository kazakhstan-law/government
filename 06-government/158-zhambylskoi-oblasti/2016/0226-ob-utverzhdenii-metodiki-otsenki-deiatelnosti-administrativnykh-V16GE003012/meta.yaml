title:
  rus: Об утверждении Методики оценки деятельности административных  государственных служащих корпуса «Б» аппаратов акима района, аульных округов и районных исполнительных органов,  финансируемых из местного бюджета
  kaz: Аудан, ауылдық округ әкімі аппараттарымен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің жұмысын бағалаудың әдістемесін бекіту туралы

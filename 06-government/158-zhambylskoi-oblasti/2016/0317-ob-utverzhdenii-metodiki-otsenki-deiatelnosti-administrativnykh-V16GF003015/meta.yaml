title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акима района, аульных округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, ауылдық округ әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің жұмысын бағалауды әдістемесін бекіту туралы

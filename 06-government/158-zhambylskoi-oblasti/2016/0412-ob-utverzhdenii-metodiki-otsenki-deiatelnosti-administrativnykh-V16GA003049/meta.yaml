requisite: Постановление акимата города Тараз Жамбылской области от 12 апреля 2016 года № 224. Зарегистрировано Департаментом юстиции Жамбылской области 3 мая 2016 года № 3049. Утратило силу постановлением акимата города Тараз Жамбылской области от 07.03.2017 № 163
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима города и городских исполнительных органов, финансируемых из местного бюджета
  kaz: Қала әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын қалалық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы

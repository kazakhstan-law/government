requisite: Постановление акимата Жамбылской области от 28 апреля 2016 года № 145. Зарегистрировано Департаментом юстиции Жамбылской области 27 мая 2016 года № 3096. Утратило силу постановлением акимата Жамбылской области от 5 февраля 2021 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Регистрация согласия или отзыва согласия на прижизненное добровольное пожертвование тканей (части ткани) и (или) органов (части органов) после смерти в целях трансплантации»
  kaz: «Транспланттау мақсатында азаматтан қайтыс болғаннан кейін оның тіндерін және (немесе) ағзаларын (ағзалардың бөліктерін) алу мүмкіндігі туралы көзі тірісінде еркін көңіл білдіруіне келісім беру немесе қайтарып алуды тіркеу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

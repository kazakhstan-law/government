act_code: '16229'
requisite: Постановление акимата Жамбылской области от 13 июня 2003 года № 76. Зарегистрировано Управлением юстиции Жамбылской области 9 июля 2003 года за № 1013. Утратило силу постановлением акимата Жамбылской области от 26 января 2011 года № 15
title:
  rus: Об утверждении Правил предоставления льгот по санаторно-курортному лечению и проезду в санаторно-курортные учреждения Республики Казахстан или стран СНГ для спинальных больных Жамбылской области.
  kaz: Жамбыл облысындағы омыртқа жұлыны ауыратын науқастардың Қазақстан Республикасының немесе ТМД елдерінің шипажайлық-курорттық мекемелерінде емделуi және жол ақысына жеңiлдiк берудiң Ережесiн бекiту туралы

  title:
    rus: О внесении изменений и дополнений в постановление акимата Жамбылской области N 76 от 13 июня 2003 года "Об утверждении Правил предоставления льгот по санаторно-курортному лечению и проезду на курорт Саки в санаторий имени Н.Н. Бурденко для спинальных больных Жамбылской области", зарегистрированное за N 1013
    kaz: Жамбыл облысы әкімиятының N 1013 тіркелген 2003 жылғы 13 маусымдағы "Жамбыл облысындағы омыртқа жұлыны ауыратын науқастардың Саки курортындағы Н.Н. Бурденко атындағы шипажайда емделуі және жол ақысына жеңілдік берудің Ережесін бекіту туралы»N 76 қаулысына өзгерістер мен толықтырулар енгізу туралы

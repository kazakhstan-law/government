  title:
    rus: О внесении изменений и дополнений в постановление акимата Жамбылской области от 13 июня 2003 года N 76 "Об утверждении Правил предоставления льгот по санаторно-курортному лечению и проезду в санаторно-курортные учреждения Республики Казахстан или стран СНГ для спинальных больных Жамбылской области"
    kaz: Жамбыл облысы әкімиятының 2003 жылғы 13 маусымдағы "Жамбыл облысындағы омыртқа жұлыны ауыратын науқастардың Қазақстан Республикасының немесе ТМД елдерінің шипажайлық-курорттық мекемелерінде емделуi және жол ақысына жеңiлдiк берудiң Ережесiн бекiту туралы" N 76 қаулысына өзгерістер мен толықтырулар енгізу туралы

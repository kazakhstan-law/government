requisite: Жамбыл облысы Талас аудандық әкімиятының 2003 жылдың 8 мамырдағы № 37 қаулысы. Жамбыл облыстық Әділет басқармасында 2003 жылғы 6 маусымда № 980 тіркелді. Күші жойылды - Жамбыл облысы Талас ауданы әкімдігінің 26.02.2019 № 59 қаулысымен

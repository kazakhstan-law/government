act_code: '15480'
requisite: Жамбыл облысының әкімиятының 2003 жылғы 24 сәуірдегі № 63 қаулысы. Жамбыл облыстық Әділет басқармасында 2003 жылғы 20 мамырда № 966 тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен
title:
  rus: Жамбыл облысынан медициналық көрсеткiштер бойынша емделуге және консультация алуға жiберiлген науқастардың Қазақстан Республикасы iшiндегi жол кiресiн төлеу және аз қамтылған көмекке зәру азаматтарға бір жолғы материалдық көмек көрсетудің 2002-2005 жылдарға арналған Ережелерін бекiту туралы

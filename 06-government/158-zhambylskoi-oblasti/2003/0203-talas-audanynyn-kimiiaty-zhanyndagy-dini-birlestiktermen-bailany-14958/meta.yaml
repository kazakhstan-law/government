requisite: Жамбыл облысы Талас аудандық әкімиятының 2003 жылғы 3 ақпандағы № 11 қаулысы. Жамбыл облыстық Әділет басқармасында 2003 жылғы 17 наурызда № 869 тіркелді. Күші жойылды - Жамбыл облысы Талас ауданы әкімдігінің 26.02.2019 № 59 қаулысымен

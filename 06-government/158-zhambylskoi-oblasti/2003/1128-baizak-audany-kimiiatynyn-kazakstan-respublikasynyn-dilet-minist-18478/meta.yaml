requisite: Жамбыл облысы Байзақ аудандық әкімиятының 2003 жылғы 28 қарашадағы № 230 қаулысы. Жамбыл облыстық Әділет департаментінде 2004 жылғы 4 ақпанда № 1194 тіркелді. Күші жойылды - Жамбыл облысы Байзақ ауданы әкімдігінің 2013 жылғы 12 тамыздағы № 480 қаулысымен
title:

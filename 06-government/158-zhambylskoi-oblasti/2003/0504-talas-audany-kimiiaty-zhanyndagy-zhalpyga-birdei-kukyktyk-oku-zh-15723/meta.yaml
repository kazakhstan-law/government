requisite: Жамбыл облысы Талас аудандық әкімиятының 2003 жылдың 5 мамырдағы № 33 қаулысы. Жамбыл облыстық әділет басқармасында 2003 жылғы 6 маусымда № 981 тіркелді. Күші жойылды - Жамбыл облысы Талас ауданы әкімдігінің 26.02.2019 № 59 қаулысымен

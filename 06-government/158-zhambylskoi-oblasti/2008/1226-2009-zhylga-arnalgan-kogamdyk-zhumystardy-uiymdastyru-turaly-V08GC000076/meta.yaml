requisite: Жамбыл облысы Жамбыл ауданы әкімиятының 2008 жылғы 26 желтоқсандағы № 761 қаулысы. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 27 қаңтарда 6-3-76 нөмірімен тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты күші жойылды (Жамбыл ауданы әкімі аппаратының 2012 жылғы 8 маусымдағы № 3/904 хаты)

requisite: Жамбыл облысы Талас ауданы әкімиятының 2008 жылғы 12 наурыздағы № 88 қаулысы. Жамбыл облысы Талас ауданының Әділет басқармасында 2008 жылғы 17 сәуірде № 6-10-58 тіркелді. Күші жойылды - Жамбыл облысы Талас ауданы әкімдігінің 26.02.2019 № 59 қаулысымен

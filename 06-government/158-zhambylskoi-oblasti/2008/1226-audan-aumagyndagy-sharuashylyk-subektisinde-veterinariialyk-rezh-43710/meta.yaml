requisite: Жамбыл облысы Т. Рысқұлов ауданы әкімиятының 2008 жылғы 26 желтоқсандағы № 523 қаулысы. Жамбыл облысы Т. Рысқұлов ауданының Әділет басқармасында 2009 жылғы 23 қаңтарда 6-8-74 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Т.Рысқұлов ауданы әкімдігінің 2013 жылғы 29 шілдедегі № 347 қаулысымен

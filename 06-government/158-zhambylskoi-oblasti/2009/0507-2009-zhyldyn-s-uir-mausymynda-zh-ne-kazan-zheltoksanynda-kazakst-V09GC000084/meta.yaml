requisite: Жамбыл облысы Жамбыл ауданы әкімдігінің 2009 жылғы 7 мамырдағы № 251 қаулысы. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 22 мамырда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-3-84 болып енгізілді. Қаулысының қабылдау мерзімінің өтуіне байланысты күші жойылды (Жамбыл ауданы әкімі аппаратының 2012 жылғы 8 маусымдағы № 3/904 хаты)
title:
  rus: 2009 жылдың сәуір - маусымында және қазан - желтоқсанында Қазақстан Республикасының Қарулы Күштеріне мерзімді әскери қызметке шақыру туралы

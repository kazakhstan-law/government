requisite: Жамбыл облысы Мойынқұм ауданы әкімиятының 2009 жылғы 15 шілдедегі № 205 қаулысы. Жамбыл облысы Мойынқұм ауданының Әділет басқармасында 2009 жылғы 20 тамызда 6-7-47 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Мойынқұм аудандық әкімдігінің 2015 жылғы 19 қарашада № 359 қаулысымен

requisite: Жамбыл облысы Т. Рысқұлов ауданы әкімиятының 2009 жылғы 8 мамырдағы № 225 қаулысы. Жамбыл облысы Т. Рысқұлов ауданының Әділет басқармасында 2009 жылғы 8 маусымда Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-8-82 болып енгізілді. Күші жойылды - Жамбыл облысы Т.Рысқұлов ауданы әкімдігінің 2012 жылғы 12 қаңтардағы № 3 қаулысымен

requisite: Жамбыл облысы Мойынқұм ауданы әкімдігінің 2009 жылғы 3 ақпандағы № 31 қаулысы. Жамбыл облысы Мойынқұм ауданының Әділет басқармасында 2009 жылғы 13 наурызда № 6-7-45 тіркелді. Күші жойылды - Жамбыл облысы Мойынқұм аудандық әкімдігінің 2015 жылғы 19 қарашадағы № 359 қаулысымен

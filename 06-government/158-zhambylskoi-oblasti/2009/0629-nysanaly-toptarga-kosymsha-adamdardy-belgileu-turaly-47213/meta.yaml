requisite: Жамбыл облысы Жуалы ауданы әкімдігінің 2009 жылғы 29 маусымдағы № 257 қаулысы. Жамбыл облысы Жуалы ауданының Әділет басқармасында 2009 жылғы 7 тамызда Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-4-75 болып енгізілді. Күші жойылды - Жамбыл облысы Жуалы ауданы әкімдігінің 26.02.2019 № 73 қаулысымен

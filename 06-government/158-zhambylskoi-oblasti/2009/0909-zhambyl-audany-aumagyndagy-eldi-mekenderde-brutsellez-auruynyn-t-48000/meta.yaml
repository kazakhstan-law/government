requisite: Жамбыл облысы Жамбыл ауданы әкімдігінің 2009 жылғы 9 қыркүйектегі № 435 қаулысы. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 1 қазанда 6-3-94 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Жамбыл ауданы әкімдігінің 2010 жылғы 11 қазандағы № 443 қаулысымен

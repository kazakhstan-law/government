requisite: Жамбыл облысы Шу ауданы әкімдігінің 2009 жылғы 3 тамыздағы № 242 қаулысы. Жамбыл облысы Шу ауданының Әділет басқармасында 2009 жылғы 10 қыркүйекте нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-11-75 болып енгізілді. Күші жойылды - Жамбыл облысы Шу аудандық әкімдігінің 2 қыркүйекте 2015 жылғы № 315 қаулысымен

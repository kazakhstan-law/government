act_code: '50190'
requisite: Жамбыл облысы Жамбыл ауданы әкімдігінің 2009 жылғы 29 желтоқсандағы № 535 қаулысы. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2010 жылғы 22 қаңтарда 6-3-106 нөмірімен тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты күші жойылды (Жамбыл ауданы әкімі аппаратының 2012 жылғы 8 маусымдағы № 3/904 хаты)

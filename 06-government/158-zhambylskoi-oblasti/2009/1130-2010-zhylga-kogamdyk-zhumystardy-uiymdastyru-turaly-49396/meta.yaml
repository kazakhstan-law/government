requisite: Жамбыл облысы Меркі ауданы әкімдігінің 2009 жылғы 30 қарашадағы № 405 қаулысы. Жамбыл облысы Меркі ауданының Әділет басқармасында 2009 жылғы 22 желтоқсанда 6-6-72 нөмірімен тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Меркі аудандық Әділет басқармасының 2010 жылғы 27 мамырдағы № 4-1151 хатымен

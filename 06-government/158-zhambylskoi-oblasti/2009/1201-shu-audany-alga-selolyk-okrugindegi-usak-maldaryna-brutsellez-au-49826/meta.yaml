requisite: Жамбыл облысы Шу ауданы әкімдігінің 2009 жылғы 1 желтоқсандағы № 355 қаулысы. Жамбыл облысы Шу ауданының Әділет басқармасында 2010 жылғы 6 қаңтарда Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-11-81 болып енгізілді. Күші жойылды - Жамбыл облысы Шу ауданы әкімдігінің 2012 жылғы 30 мамырдағы № 174 қаулысымен

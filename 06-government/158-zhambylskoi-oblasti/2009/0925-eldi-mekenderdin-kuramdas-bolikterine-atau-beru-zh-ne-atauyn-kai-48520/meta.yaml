requisite: Жамбыл облысы әкімдігінің 2009 жылғы 25 қыркүйектегі № 304 қаулысы. Жамбыл облысы Әділет департаментінде 2009 жылғы 6 қарашада Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізілімінде № 1730 болып енгізілді. Күші жойылды - Жамбыл облысы әкімдігінің 2014 жылғы 30 қаңтардағы № 2 қаулысымен

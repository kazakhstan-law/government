act_code: '46525'
requisite: Жамбыл облысы Меркі ауданы әкімиятының 2009 жылғы 13 мамырдағы № 200 қаулысы. Жамбыл облысы Меркі ауданының Әділет басқармасында 2009 жылғы 16 маусымда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-6-68 болып енгізілді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Меркі аудандық Әділет басқармасының 2010 жылғы 27 мамырдағы № 4-1151 хатымен
title:

requisite: Жамбыл облысы әкімиятының 2009 жылғы 27 мамырдағы № 207 қаулысы. Жамбыл облыстық Әділет департаментінде 2009 жылғы 8 шілдеде Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 1725 болып енгізілді. Күші жойылды - Жамбыл облысы әкімдігінің 2010 жылғы 26 наурыздағы № 68 қаулысымен

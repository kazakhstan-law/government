requisite: Жамбыл облысы әкімиятының 2009 жылғы 29 сәуірдегі № 158 қаулысы. Жамбыл облыстық Әділет департаментінде 2009 жылғы 1 маусымда Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 1724 болып енгізілді. Күші жойылды - Жамбыл облысы әкімдігінің 2010 жылғы 29 сәуірдегі № 142 Қаулысымен

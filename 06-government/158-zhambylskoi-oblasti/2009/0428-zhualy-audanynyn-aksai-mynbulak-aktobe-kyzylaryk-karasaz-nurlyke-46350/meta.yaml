act_code: '46350'
requisite: Жамбыл облысы Жуалы аудандық әкімдігінің 2009 жылғы 28 сәуірдегі № 161 қаулысы. Жамбыл облысы Жуалы ауданының Әділет басқармасында 2009 жылғы 5 маусымда 6-4-74 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Жуалы ауданы әкімдігінің 2011 жылғы 4 сәуірдегі № 100 қаулысымен

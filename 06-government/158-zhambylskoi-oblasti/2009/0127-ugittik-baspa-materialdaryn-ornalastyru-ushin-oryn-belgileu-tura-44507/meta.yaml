requisite: Жамбыл облысы Жамбыл ауданы әкімиятының 2009 жылғы 27 қаңтардағы № 19 қаулысы. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 2 ақпанда 6-3-77 нөмірімен тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты күші жойылды (Жамбыл ауданы әкімі аппаратының 2012 жылғы 8 маусымдағы № 3/904 хаты)

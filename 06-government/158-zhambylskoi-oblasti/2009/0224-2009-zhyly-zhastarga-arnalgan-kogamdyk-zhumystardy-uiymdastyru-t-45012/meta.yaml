requisite: Жамбыл облысы Жамбыл ауданы әкімиятының 2009 жылғы 24 ақпандағы № 71 қаулысы. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 24 наурызда 6-3-79 нөмірімен тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты күші жойылды (Жамбыл ауданы әкімі аппаратының 2012 жылғы 8 маусымдағы № 3/904 хаты)

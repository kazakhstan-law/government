title:
  rus: О предоставлении на договорной основе помещений для встреч с избирателями и определении мест для размещения агитационных печатных материалов для кандидатов в депутаты Мажилиса Парламента Республики Казахстан и маслихатов
  kaz: Қазақстан Республикасының Парламент Мәжілісінің және мәслихат депутаттарының кандидаттарына сайлаушылармен кездесу үшін шарттық негізінде үй-жайлар беру және үгіттік баспа материалдарын орналастыру үшін орындар белгілеу туралы

    kaz: «2023 жылға арналған акваөсіру (балық өсіру шаруашылығы) өнімінің  өнімділігі мен сапасын арттыруға, сондай-ақ асыл тұқымды балық өсіруді дамытуға субсидиялар көлемін бекіту туралы» Жамбыл облысы әкімдігінің 2023 жылғы 2 маусымдағы № 105 қаулысына өзгеріс енгізу туралы

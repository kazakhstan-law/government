requisite: Постановление акимата Кордайского района Жамбылской области от 23 ноября 2023 года № 498. Утратило силу постановлением акимата Кордайского района Жамбылской области от 4 ноября 2025 года № 377 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов районов, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, ауылдық округтер әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

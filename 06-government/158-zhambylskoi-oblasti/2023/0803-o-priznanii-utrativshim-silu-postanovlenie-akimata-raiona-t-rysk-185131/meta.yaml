act_code: '185131'
requisite: Постановление акимата района Т. Рыскулова Жамбылской области от 3 августа 2023 года № 190. Зарегистрировано Департаментом юстиции Жамбылской области от 14 августа 2023 года № 5072
title:
  rus: О признании утратившим силу постановление акимата района Т.Рыскулова от 29 марта 2018 года  №144 «Об утверждении  методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, сельских округов и районных исполнительных органов, финансируемых из местного бюджета»
  kaz: Т.Рысқұлов ауданы әкімдігінің 2018 жылғы 29 наурыздағы «Аудан, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың  «Б» корпусы мемлекеттік әкімшілік қызметшілерінің  қызметін бағалаудың әдістемесін бекіту туралы»  №144 қаулысының күшін жою туралы

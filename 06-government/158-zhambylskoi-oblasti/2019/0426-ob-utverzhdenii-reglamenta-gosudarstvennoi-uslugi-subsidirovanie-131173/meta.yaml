requisite: Постановление акимата Жамбылской области от 26 апреля 2019 года № 92. Зарегистрировано Департаментом юстиции Жамбылской области 30 апреля 2019 года № 4210. Утратило силу постановлением акимата Жамбылской области от 12 октября 2020 года № 226 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

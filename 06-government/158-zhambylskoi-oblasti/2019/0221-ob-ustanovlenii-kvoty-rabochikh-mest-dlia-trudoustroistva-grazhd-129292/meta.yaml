requisite: Постановление акимата города Тараз Жамбылской области от 21 февраля 2019 года № 525. Зарегистрировано Департаментом юстиции Жамбылской области 21 февраля 2019 года № 4115
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования и для лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2019 год
  kaz: 2019 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтар үшін және бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

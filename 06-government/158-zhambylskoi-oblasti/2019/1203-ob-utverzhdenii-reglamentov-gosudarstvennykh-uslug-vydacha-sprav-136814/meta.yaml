act_code: '136814'
requisite: Постановление акимата Жамбылской области от 3 декабря 2019 года № 275. Зарегистрировано Департаментом юстиции Жамбылской области 6 декабря 2019 года № 4441. Утратило силу постановлением акимата Жамбылской области от 19 марта 2021 года № 73 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан», «Предоставление исходных материалов при разработке проектов строительства и реконструкции (перепланировки и переоборудования)» и «Согласование эскиза (эскизного проекта)»
  kaz: «Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау бойынша анықтама беру», «Құрылыс және реконструкция (қайта жоспарлау, қайта жабдықтау) жобаларын әзірлеу кезінде бастапқы материалдарды ұсыну» және «Эскизді (эскиздік жобаны) келісуден өткізу» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы»

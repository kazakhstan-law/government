act_code: '130279'
requisite: Постановление акимата Шуского района Жамбылской области от 5 марта 2019 года № 60. Зарегистрировано Департаментом юстиции Жамбылской области 5 марта 2019 года № 4136
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в Шуском районе на 2019 год
  kaz: 2019 жылға Шу ауданында пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

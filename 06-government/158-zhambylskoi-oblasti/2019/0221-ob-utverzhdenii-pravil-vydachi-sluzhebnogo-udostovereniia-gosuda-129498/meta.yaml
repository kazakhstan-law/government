requisite: Постановление акимата Мойынкумского района Жамбылской области от 21 февраля 2019 года № 37. Зарегистрировано Департаментом юстиции Жамбылской области 25 февраля 2019 года № 4120. Утратило силу постановлением акимата Мойынкумского района Жамбылской области от 26 октября 2020 года № 288 (вводится в действие по истечении десяти календарных дней после первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственных служащих аппаратов акима района, села, сельских округов и исполнительных органов, финансируемых из местного бюджета и его описания
  kaz: Аудан, ауыл, ауылдық округтерінің әкімі аппараттарының және жергілікті бюджеттен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне қызметтік куәлік беру Қағидаларын және оның сипаттамасын бекіту туралы

act_code: '132266'
requisite: Постановление акимата Кордайского района Жамбылской области от 16 мая 2019 года № 209. Зарегистрировано Департаментом юстиции Жамбылской области 17 мая 2019 года № 4240
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в Кордайском районе на 2019 год
  kaz: 2019 жылға Қордай ауданында пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

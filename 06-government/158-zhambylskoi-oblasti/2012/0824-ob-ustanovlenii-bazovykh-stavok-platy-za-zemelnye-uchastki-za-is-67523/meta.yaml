act_code: '67523'
requisite: Постановление акимата Жамбылской области от 24 августа 2012 года № 230 и решение маслихата Жамбылской области от 24 августа № 7-27. Зарегистрировано Департаментом юстиции Жамбылской области от 7 сентября 2012 года № 1822. Утратило силу постановлением акимата Жамбылской области от 29 апреля 2015 года № 79 и решением Жамбылского областного маслихата от 25 июня 2015 года № 38-10
title:
  rus: Об установлений базовых ставок платы за земельные участки, за исключением земель сельскохозяйственного назначения, при их предоставлении в частную собственность по Жамбылской области

requisite: Жамбыл облысы Тараз қалалық әкімиятының 2006 жылғы 20 наурыздағы № 233 қаулысы. Жамбыл облысы Тараз қалалық әділет басқармасында 2006 жылғы 19 сәуірде 6-1-28 нөмірімен тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

requisite: Жамбыл облыстық әкімиятының 2006 жылғы 27 шілдедегі № 194 қаулысы. Жамбыл облыстық әділет Департаментінде 2006 жылғы 11 тамызда 1645 нөмірімен тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

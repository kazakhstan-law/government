act_code: '79555'
requisite: Постановление акимата Жамбылской области от 27 марта 2014 года № 70. Зарегистрировано Департаментом юстиции Жамбылской области 5 мая 2014 года № 2212. Утратило силу постановлением акимата Жамбылской области от 24 апреля 2015 года № 67
title:
  rus: Об утверждении регламента государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

requisite: Постановление акимата Жамбылской области от 19 марта 2014 года № 56. Зарегистрировано Департаментом юстиции Жамбылской области 8 апреля 2014 года № 2149. Утратило силу постановлением акимата Жамбылской области от 29 января 2015 года № 11
title:
  rus: Об утверждении нормативов субсидий на возмещение до 100% затрат по искусственному осеменению маточного поголовья крупного рогатого скота в личных подсобных хозяйствах, а также критерии и требования к поставщикам
  kaz: Жеке қосалқы шаруашылықтарда ірі қара малдың аналық мал басын қолдан ұрықтандыру жөніндегі шығындарды 100%-ға дейін өтеуге арналған субсидиялар нормативтері, сондай-ақ жеткізушіге қойылатын өлшемдер мен талаптарды бекіту туралы

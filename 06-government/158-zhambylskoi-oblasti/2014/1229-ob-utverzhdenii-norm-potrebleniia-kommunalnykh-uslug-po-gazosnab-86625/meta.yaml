    kaz: «Жамбыл облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау бойынша  коммуналдық қызметтерді тұтыну нормаларын бекіту туралы» Жамбыл облысы әкімдігінің 2014 жылғы 29 желтоқсандағы № 378 қаулысына өзгеріс енгізу туралы

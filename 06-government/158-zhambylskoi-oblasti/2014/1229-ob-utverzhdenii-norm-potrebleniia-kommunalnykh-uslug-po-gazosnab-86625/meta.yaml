  title:
    rus: О внесении дополнения в постановление акимата Жамбылской области от 29 декабря 2014 года № 378 «Об утверждении норм потребления коммунальных услуг по газоснабжению, электроснабжению, водоснабжению, водоотведению и теплоснабжению для потребителей, не имеющих приборов учета в Жамбылской области»
    kaz: «Жамбыл облысында есептеу аспаптары жоқ тұтынушылар үшін газбен жабдықтау, электрмен жабдықтау, сумен жабдықтау, су бұру және жылумен жабдықтау бойынша коммуналдық қызметтерді тұтыну нормаларын бекіту туралы» Жамбыл облысы әкімдігінің 2014 жылғы 29 желтоқсандағы № 378 қаулысына толықтыру енгізу туралы

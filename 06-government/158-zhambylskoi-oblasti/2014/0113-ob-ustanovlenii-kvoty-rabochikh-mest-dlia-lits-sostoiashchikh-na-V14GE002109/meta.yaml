requisite: Постановление акимата Кордайского района Жамбылской области от 13 января 2014 года № 3. Зарегистрировано Департаментом юстиции Жамбылской области 4 февраля 2014 года № 2109. Утратило силу постановлением акимата Кордайского района Жамбылской области от 27.03.2018 № 70
title:
  rus: Об установлении квоты рабочих мест для лиц, состоящих на учете службы пробации уголовно-исполнительной инспекции, а также лиц, освобожденных из мест лишения свободы и несовершеннолетних выпускников интернатных организаций Кордайского района
  kaz: Қордай ауданында қылмыстық-атқару инспекциясы пробация қызметінің есебінде тұрған адамдар үшін, сондай-ақ бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы

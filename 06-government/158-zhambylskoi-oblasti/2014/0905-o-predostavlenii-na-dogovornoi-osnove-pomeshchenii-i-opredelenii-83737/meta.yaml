requisite: Постановление Мойынкумского районного акимата Жамбылской области от 5 сентября 2014 года № 265. Зарегистрировано Департаментом юстиции Жамбылской области 16 октября 2014 года № 2349. Утратило силу постановлением акимата Мойынкумского района Жамбылской области от 3 ноября 2023 года № 310 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

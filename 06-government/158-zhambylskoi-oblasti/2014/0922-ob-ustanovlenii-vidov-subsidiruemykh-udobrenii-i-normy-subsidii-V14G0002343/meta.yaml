title:
  rus: Об установлении видов субсидируемых удобрений и нормы субсидий на 1 тонну (литр, килограмм) удобрений, реализованных отечественными производителями, на 1 тонну (литр, килограмм) удобрений, приобретенных у поставщика удобрений и (или) иностранных производителей удобрений на 2014 год

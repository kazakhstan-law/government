act_code: '227838'
requisite: Постановление акимата Кордайского района Жамбылской области от 15 июля 2026 года № 301
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика Кордайского района
  kaz: «Қордай ауданының бірыңғай сәулеттік келбетін қалыптастыруға бағытталған көппәтерлі тұрғын үйлердің қасбеттері мен шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс – шараларды  ұйымдастыру және өткізу қағидаларын бекіту туралы»

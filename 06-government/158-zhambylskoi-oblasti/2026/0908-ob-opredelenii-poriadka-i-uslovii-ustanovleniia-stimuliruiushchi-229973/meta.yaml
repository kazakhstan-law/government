act_code: '229973'
requisite: Постановление акимата Жамбылской области от 8 сентября 2026 года № 175
title:
  rus: Об определении порядка и условий установления стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Жамбылский областной социальный центр семейного развития «Анаға тағзым» управления координации занятости и социальных программ акимата Жамбылской области»
  kaz: «Жамбыл облысы әкімдігінің жұмыспен қамтуды үйлестіру және әлеуметтік бағдарламалар басқармасының «Анаға тағзым» Жамбыл облыстық отбасылық даму әлеуметтік орталығы» коммуналдық мемлекеттік мекемесі жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу тәртібі мен шарттарын айқындау  туралы

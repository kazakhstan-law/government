act_code: '155091'
requisite: Постановление акимата Кордайского района Жамбылской области от 19 апреля 2021 года № 148. Зарегистрировано Департаментом юстиции Жамбылской области 23 апреля 2021 года № 4948
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в Кордайском районе на 2021 год
  kaz: 2021 жылға Қордай ауданында пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

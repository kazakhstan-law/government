  title:
    rus: О внесении изменения в постановление акимата Жамбылской области от 5 февраля 2021 года № 40 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства на 2021 год»
    kaz: «2021 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» Жамбыл облысы әкімдігінің 2021 жылғы 5 ақпандағы № 40 қаулысына өзгеріс енгізу туралы

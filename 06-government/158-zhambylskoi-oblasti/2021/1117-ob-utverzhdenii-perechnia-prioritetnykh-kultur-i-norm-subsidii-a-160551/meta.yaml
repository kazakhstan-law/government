  title:
    rus: О внесении изменений в постановление акимата Жамбылской области от 17 ноября 2021 года №254 «Об утверждении перечня приоритетных культур и норм субсидий, а также объемов бюджетных средств на повышение урожайности и качества продукции растениеводства»
    kaz: «Басым дақылдар тiзбесі және субсидия нормаларын, сондай-ақ, өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджет қаражатының көлемін бекіту туралы» Жамбыл облысы әкімдігінің 2021 жылғы 17 қарашадағы №254 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата Жамбылской области от 17 ноября 2021 года № 254. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 ноября 2021 года № 25340. Утратило силу постановлением акимата Жамбылской области от 10 октября 2023 года № 192 (вводится в действие по истечении десяти календарных дней после дня его первого официального публикования)
title:
  rus: Об утверждении перечня приоритетных культур и норм субсидий, а также объемов бюджетных средств на повышение урожайности и качества продукции растениеводства
  kaz: Басым дақылдар тiзбесі және субсидия нормаларын, сондай-ақ, өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға арналған бюджет қаражатының көлемін бекіту туралы

requisite: Постановление акимата города Тараз Жамбылской области от 8 февраля 2021 года № 512. Зарегистрировано Департаментом юстиции Жамбылской области 9 февраля 2021 года № 4895
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования и для лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2021 год
  kaz: 2021 жылға кәмелеттік жасқа толғанға дейін ата-анасынан айырылған немесе ата-аналарының қамқорлығынсыз қалған жастар қатарындағы білім беру ұйымдарының түлектері болып табылатын азаматтар үшін және бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

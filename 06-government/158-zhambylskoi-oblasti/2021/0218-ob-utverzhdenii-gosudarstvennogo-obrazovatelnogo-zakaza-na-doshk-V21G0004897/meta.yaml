  title:
    rus: О внесении изменений и дополнений в постановление акимата Жамбылской области от 18 февраля 2021 года № 45 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера родительской платы в Жамбылской области на 2021 год»
    kaz: «Жамбыл облысында 2021 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, ата-ана төлемақысының мөлшерін бекіту туралы» Жамбыл облысы әкімдігінің 2021 жылғы 18 ақпандағы № 45 қаулысына өзгерістер мен толықтырулар енгізу туралы

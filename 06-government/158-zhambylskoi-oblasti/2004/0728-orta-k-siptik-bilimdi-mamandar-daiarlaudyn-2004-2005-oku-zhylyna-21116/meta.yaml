requisite: Жамбыл облысы әкімиятының 2004 жылғы 29 шілдеде № 187 қаулысы. Жамбыл облыстық әділет департаментінде 2004 жылғы 3 қыркүйекте № 1436 тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

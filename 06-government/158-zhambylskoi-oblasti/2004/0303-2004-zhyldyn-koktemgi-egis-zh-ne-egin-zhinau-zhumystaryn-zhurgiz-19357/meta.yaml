requisite: Жамбыл облысы Мойынқұм аудандық әкімиятының 2004 жылғы 3 наурыздағы № 27 қаулысы. Жамбыл облыстық Әділет департаментінде 2004 жылғы 2 сәуірде № 1298 тіркелді. Күші жойылды - Жамбыл облысы Мойынқұм аудандық әкімдігінің 2015 жылғы 19 қарашадағы № 359 қаулысымен

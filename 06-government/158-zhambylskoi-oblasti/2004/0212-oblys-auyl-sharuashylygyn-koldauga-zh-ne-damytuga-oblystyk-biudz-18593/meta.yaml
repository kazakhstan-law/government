requisite: Жамбыл облысы әкімиятының 2004 жылғы 12 ақпандағы № 23 қаулысы. Жамбыл облыстық әділет департаментінде 2004 жылғы 12 ақпанда 1198 нөмерімен тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

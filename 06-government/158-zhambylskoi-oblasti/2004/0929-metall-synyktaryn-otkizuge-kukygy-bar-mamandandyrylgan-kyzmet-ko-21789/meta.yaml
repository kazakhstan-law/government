requisite: Жамбыл облысы әкімиятының 2004 жылғы 30 қыркүйектегі № 251 қаулысы. Жамбыл облыстық әділет департаментінде 2004 жылғы 5 қарашада 1490 нөмірімен тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

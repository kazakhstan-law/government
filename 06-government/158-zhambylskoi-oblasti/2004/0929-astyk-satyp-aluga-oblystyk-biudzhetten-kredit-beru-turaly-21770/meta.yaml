requisite: Жамбыл облыстық әкімиятының 2004 жылғы 30 қыркүйектегі № 253 қаулысы. Жамбыл облыстық әділет Департаментінде 2004 жылғы 2 қарашада 1484 нөмірімен тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

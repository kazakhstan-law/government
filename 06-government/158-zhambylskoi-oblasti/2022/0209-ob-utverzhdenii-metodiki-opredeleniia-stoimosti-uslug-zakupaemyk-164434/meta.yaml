act_code: '164434'
requisite: Постановление акимата Жамбылской области от 9 февраля 2022 года № 24. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 февраля 2022 года № 26784. Утратило силу постановлением акимата Жамбылской области от 27 февраля 2025 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики определения стоимости услуг, закупаемых для проведения государственной информационной политики в средствах массовой информации на территории Жамбылской области
  kaz: Жамбыл облысының аумағындағы бұқаралық ақпарат құралдарында мемлекеттік ақпараттық саясатты жүргізу үшін сатып алынатын көрсетілетін қызметтердің құнын айқындау әдістемесін бекіту туралы

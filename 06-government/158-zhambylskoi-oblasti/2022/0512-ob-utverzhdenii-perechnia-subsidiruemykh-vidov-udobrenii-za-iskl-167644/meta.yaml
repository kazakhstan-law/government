  title:
    rus: О внесении изменения в постановление акимата Жамбылской области от 12 мая 2022 года № 103 «Об утверждении перечня субсидируемых видов удобрений (за исключением органических) и нормы субсидий на 1 тонну (килограмм, литр) удобрений, приобретенных у продавца удобрений, а также объемы бюджетных средств на субсидирование удобрений (за исключением органических) на 2022 год»
    kaz: «2022 жылға арналған тыңайтқыштардың (органикалық тыңайтқыштарды қоспағанда) субсидияланатын түрлерінің тізбесін және тыңайтқыштарды сатушыдан сатып алынған тыңайтқыштардың 1 тоннасына (литріне, килограмына) арналған субсидиялар нормаларын, сондай-ақ тыңайтқыштарды (органикалық тыңайтқыштарды қоспағанда) субсидиялауға бюджеттік қаражат көлемдерін бекіту туралы» Жамбыл облысы әкімдігінің 2022 жылғы 12 мамырдағы № 103 қаулысына өзгеріс енгізу туралы

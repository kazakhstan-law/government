requisite: Постановление акимата Кордайского района Жамбылской области от 30 декабря 2022 года № 541. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 января 2023 года № 31555
title:
  rus: О признании утратившим силу постановления акимата Кордайского района от 21 сентября 2016 года № 324 «Об определении сроков представления заявок на получение субсидий по каждому виду субсидируемых приоритетных сельскохозяйственных культур»
  kaz: «Субсидияланатын басым ауыл шаруашылығы дақылдарының әрбір түрi бойынша субсидия алуға өтінімді ұсыну мерзімдерін айқындау туралы» Қордай ауданды әкімдігінің 2016 жылғы 21 қыркүйектегі № 324 қаулысының күшін жою деп тану туралы

    rus: О внесении изменения в постановление акимата Жамбылской области от 28 февраля 2022 года № 39 «Об утверждении объемов субсидий по направлениям субсидирования развития племенного животноводства, повышения продуктивности и качества продукции животноводства Жамбылской области на 2022 год»
    kaz: «Жамбыл облысының 2022 жылға асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығының өнімділігін және өнім сапасын арттыруды субсидиялау бағыттары бойынша субсидиялар көлемдерін бекіту туралы» Жамбыл облысы әкімдігінің 2022 жылғы 28 ақпандағы № 39 қаулысына өзгеріс енгізу туралы

title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима Кордайского района Жамбылской области и исполнительных органов финансируемых из районного бюджета
  kaz: «Жамбыл облысы Қордай ауданы әкімінің аппараты» мемлекеттік мекемесінің және жергілікті бюджеттен қаржыланатын аудандық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы

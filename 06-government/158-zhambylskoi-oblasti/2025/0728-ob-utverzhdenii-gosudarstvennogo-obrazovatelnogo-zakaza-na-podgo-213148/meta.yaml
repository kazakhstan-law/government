  title:
    rus: О внесении изменений в постановление акимата Жамбылской области от 28 июля 2025 года № 153 «Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием на 2025-2026 учебный год»
    kaz: «2025-2026 оқу жылына арналған техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға мемлекеттік білім беру тапсырысын бекіту туралы» Жамбыл облысы әкімдігінің 2025 жылғы 28 шілдедегі № 153 қаулысына өзгерістер енгізу туралы

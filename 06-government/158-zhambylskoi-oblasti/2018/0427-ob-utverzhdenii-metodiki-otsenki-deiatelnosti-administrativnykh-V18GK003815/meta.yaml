  title:
    rus: О признании утратившим силу постановления акимата Шуского района Жамбылской области от 27 апреля 2018 года №120 «Об утверждении методики оценки деятельности административных государственных служащих корпуса "Б" аппаратов акимов района, города районного значения, сел, сельских округов и районных исполнительных органов, финансируемых из местного бюджета»

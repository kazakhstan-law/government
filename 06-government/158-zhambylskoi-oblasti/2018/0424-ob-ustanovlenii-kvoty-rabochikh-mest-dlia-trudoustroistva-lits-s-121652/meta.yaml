act_code: '121652'
requisite: Постановление акимата Жамбылского района Жамбылской области от 24 апреля 2018 года № 229. Зарегистрировано Департаментом юстиции Жамбылской области 10 мая 2018 года № 3811
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования на 2018 год
  kaz: 2018 жылға пробация қызметінің есебінде тұрған, бас бостандығынан  айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

  title:
    rus: О признании утратившим силу постановления акимата Кордайского района Жамбылской области от 27 марта 2018 года №65 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, сельских округов и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: Жамбыл облысы Қордай ауданы әкімдігінің 2018 жылғы 27 наурыздағы «Аудан, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» №65 қаулысының күшін жою туралы

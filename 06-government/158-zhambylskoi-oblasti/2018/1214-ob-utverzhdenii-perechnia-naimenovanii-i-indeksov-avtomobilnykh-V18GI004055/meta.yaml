  title:
    rus: О внесении изменений и дополнений в постановление акимата Сарысуского района Жамбылской области от 14 декабря 2018 года № 235 «Об утверждении перечня, наименований и индексов автомобильных дорог общего пользования районного значения Сарысуского района»
    kaz: Жамбыл облысы Сарысу ауданы әкімдігінің 2018 жылғы 14 желтоқсандағы № 235 «Сарысу ауданының аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының тізбесін, атауларымен индекстерін бекіту туралы» қаулысына өзгерістер мен толықтырулар енгізу туралы

requisite: Постановление акимата Шуского района Жамбылской области от 27 апреля 2018 года № 120. Зарегистрировано Департаментом юстиции Жамбылской области 16 мая 2018 года № 3815. Утратило силу постановлением акимата Шуского района Жамбылской области от 8 ноября 2023 года № 495 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, города районного значения, сел, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, аудандық маңызы бар қала, ауыл, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

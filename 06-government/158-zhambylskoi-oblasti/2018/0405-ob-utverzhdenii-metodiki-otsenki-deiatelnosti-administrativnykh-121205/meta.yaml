act_code: '121205'
requisite: Постановление акимата Меркенского района Жамбылской области от 5 апреля 2018 года № 128. Зарегистрировано Департаментом юстиции Жамбылской области 17 апреля 2018 года № 3792. Утратило силу постановлением акимата Меркенского района Жамбылской области от 18 сентября 2023 года № 345 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

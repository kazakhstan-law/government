requisite: Постановление акимата Жамбылской области от 28 марта 2018 года № 51. Зарегистрировано Департаментом юстиции Жамбылской области 9 апреля 2018 года № 3781. Утратило силу постановлением акимата Жамбылской области от 18 мая 2023 года № 87 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима области и областных  исполнительных органов, финансируемых из местного бюджета
  kaz: Облыс әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын облыстық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

  title:
    rus: «О внесении изменений в постановление акимата Жамбылской области от 7 марта 2018 года № 31 «Об утверждении регламентов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан», «Предоставление исходных материалов при разработке проектов строительства и реконструкции (перепланировки и переоборудования)» и «Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования»
    kaz: «Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау бойынша анықтама беру», «Құрылыс және реконструкция (қайта жоспарлау, қайта жабдықтау) жобаларын әзірлеу кезінде бастапқы материалдарды ұсыну» және «Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертпей қолданыстағы ғимараттардағы үй-жайларды (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» Жамбыл облысы әкімдігінің 2018 жылғы 7 наурыздағы № 31 қаулысына өзгерістер енгізу туралы

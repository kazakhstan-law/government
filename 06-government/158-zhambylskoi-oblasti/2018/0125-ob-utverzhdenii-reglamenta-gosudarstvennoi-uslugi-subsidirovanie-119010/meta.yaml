  title:
    rus: О внесении изменения в постановление акимата Жамбылской области от 25 января 2018 года № 13 «Об утверждении регламента государственной услуги «Субсидирование процентной ставки по кредитным и лизинговым обязательствам в рамках направления по финансовому оздоровлению субъектов агропромышленного комплекса»
    kaz: «Агроөнеркәсіптік кешен субъектілерін қаржылық сауықтыру жөніндегі бағыт шеңберінде кредиттік және лизингтік міндеттемелер бойынша пайыздық мөлшерлемені субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту  туралы» Жамбыл облысы әкімдігінің 2018 жылғы 25 қаңтардағы № 13 қаулысына өзгеріс енгізу туралы

  title:
    rus: О признании утратившим силу постановления акимата Байзакского района Жамбылской области от 20 марта 2018 года №82 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б»  аппаратов акимов района, сел и сельских округов и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: «Аудан, ауылдар және ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Жамбыл облысы Байзақ аудандық әкімдігінің 2018 жылғы 20 наурыздағы №82 қаулысының күші жойылды деп тану туралы

requisite: Постановление акимата Байзакского района Жамбылской области от 20 марта 2018 года № 82. Зарегистрировано Департаментом юстиции Жамбылской области 2 апреля 2018 года № 3772. Утратило силу постановлением акимата Байзакского района Жамбылской области от 3 апреля 2023 года № 94
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, сел и сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, ауылдар және ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

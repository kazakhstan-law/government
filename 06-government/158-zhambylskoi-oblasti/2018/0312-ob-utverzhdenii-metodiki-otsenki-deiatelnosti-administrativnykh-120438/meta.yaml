requisite: Постановление акимата Жамбылского района Жамбылской области от 12 марта 2018 года № 114. Зарегистрировано Департаментом юстиции Жамбылской области 28 марта 2018 года № 3761. Утратило силу постановлением акимата Жамбылского района Жамбылской области от 20 апреля 2023 года № 194
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акима района, аульных округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, ауылдық округ әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

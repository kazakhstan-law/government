  title:
    rus: О внесении изменений в постановление акимата Жамбылской области от 24 декабря 2018 года №267 «Об определении размера обеспечения исполнения обязательств недропользователя по ликвидации последствий старательства за один гектар по Жамбылской области»
    kaz: «Жамбыл облысы бойынша бір гектар үшін кен іздеушіліктің салдарын жою бойынша жер қойнауын пайдаланушы міндеттемелерінің орындалуын қамтамасыз етудің мөлшерін айқындау туралы» Жамбыл облысы әкімдігінің 2018 жылғы 24 желтоқсандағы №267 қаулысына өзгерістер енгізу туралы

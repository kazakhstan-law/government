title:
  rus: Об определении размера обеспечения исполнения обязательств недропользователя по ликвидации последствий старательства за один гектар по Жамбылской области
  kaz: Жамбыл облысы бойынша бір гектар үшін кен іздеушіліктің салдарын жою бойынша жер қойнауын пайдаланушы міндеттемелерінің орындалуын қамтамасыз етудің мөлшерін айқындау туралы

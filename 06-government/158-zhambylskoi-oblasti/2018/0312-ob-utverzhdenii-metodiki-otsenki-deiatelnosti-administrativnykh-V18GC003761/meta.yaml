  title:
    rus: О признании утратившим силу постановления акимата Жамбылского района Жамбылской области от 12 марта 2018 года №114 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акима района, аульных округов и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: «Аудан, ауылдық округ әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Жамбыл облысы Жамбыл ауданы әкімдігінің 2018 жылғы 12 наурыздағы №114 қаулысының күші жойылды деп тану туралы

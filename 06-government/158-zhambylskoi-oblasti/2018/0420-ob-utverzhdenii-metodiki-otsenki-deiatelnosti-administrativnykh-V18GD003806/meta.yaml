requisite: Постановление акимата Жуалынского района Жамбылской области от 20 апреля 2018 года № 128. Зарегистрировано Департаментом юстиции Жамбылской области 28 апреля 2018 года № 3806. Утратило силу постановлением акимата Жуалынского района Жамбылской области от 9 июня 2023 года № 142 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, села, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, ауыл, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

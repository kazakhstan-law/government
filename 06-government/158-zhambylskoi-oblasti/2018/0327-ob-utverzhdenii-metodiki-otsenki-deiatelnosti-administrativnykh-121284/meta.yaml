act_code: '121284'
requisite: Постановление акимата Сарысуского района Жамбылской области от 27 марта 2018 года № 53. Зарегистрировано Департаментом юстиции Жамбылской области 17 апреля 2018 года № 3791. Утратило силу постановлением акимата Сарысуского района Жамбылской области от 23 мая 2023 года № 73 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, города районного значения, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, аудандық маңызы бар қала, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесі бекіту туралы

act_code: '119016'
requisite: Постановление акимата Жуалынского района Жамбылской области от 8 февраля 2018 года № 18. Зарегистрировано Департаментом юстиции Жамбылской области 21 февраля 2018 года № 3716. Утратило силу постановлением акимата Жуалынского района Жамбылской области от 2 сентября 2020 года № 392 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственных служащих аппаратов акима района, села, сельских округов и исполнительных органов, финансируемых из местного бюджета и его описания
  kaz: Аудан, ауыл, ауылдық округтерінің әкімі аппараттарының және жергілікті бюджетінен қаржыландырылатын атқарушы органдардың мемлекеттік қызметшілеріне қызметтік куәлік беру Қағидаларын және оның сипаттамасын бекіту туралы

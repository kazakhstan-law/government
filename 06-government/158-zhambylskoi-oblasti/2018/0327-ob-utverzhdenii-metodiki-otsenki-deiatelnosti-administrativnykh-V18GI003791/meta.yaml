  title:
    rus: О признании утратившим силу постановление акимата Сарысуского района Жамбылской области от 27 марта 2018 года №53 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, города районного значения, сельских округов и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: «Аудан, аудандық маңызы бар қала, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесі бекіту туралы» Жамбыл облысы Сарысу ауданы әкімдігінің 2018 жылғы 27 наурыздағы №53 қаулысының күшін жойылды деп тану туралы

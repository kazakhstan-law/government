requisite: Постановление акимата Таласского района Жамбылской области от 30 марта 2018 года № 74. Зарегистрировано Департаментом юстиции Жамбылской области 19 апреля 2018 года № 3799. Утратило силу постановлением акимата Таласского района Жамбылской области от 8 сентября 2023 года № 220 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, города районного значения, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, аудандық маңызы бар қала, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілердің қызметін бағалаудың әдістемесін бекіту туралы

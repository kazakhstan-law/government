  title:
    rus: О признании утратившим силу постановление акимата Таласского района Жамбылской области от 30 марта 2018 года №74 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, города районного значения, сельских округов и районных исполнительных органов, финансируемых из местного бюджета»
    kaz: «Аудан, аудандық маңызы бар қала, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілердің қызметін бағалаудың әдістемесін бекіту туралы» Жамбыл облысы Талас ауданы әкімдігінің 2018 жылғы 30 наурыздағы №74 қаулысының күші жойылды деп тану туралы

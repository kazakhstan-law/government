requisite: Жамбыл облыстық әкімиятының 2005 жылғы 26 мамырдағы № 172 қаулысы. Жамбыл облыстық әділет Департаментінде 2005 жылғы 1 шілдеде 1622 нөмірімен тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

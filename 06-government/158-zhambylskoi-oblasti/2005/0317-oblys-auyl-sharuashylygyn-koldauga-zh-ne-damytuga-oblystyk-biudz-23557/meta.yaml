requisite: Жамбыл облысы әкімиятының 2005 жылғы 17 наурыздағы № 84 қаулысы. Жамбыл облыстық әділет департаментінде 2005 жылғы 8 сәуірде № 1600 тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

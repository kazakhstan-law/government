act_code: '23035'
requisite: Жамбыл облысы Қордай аудандық әкімиятының 2005 жылғы 28 қаңтардағы № 4 қаулысы. Жамбыл облыстық Әділет департаментінде 2005 жылғы 26 ақпанда № 1562 тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Жамбыл облысы Қордай ауданы әкімі аппаратының 15.11.2013 № 05-1357 хаты)

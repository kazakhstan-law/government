requisite: Жамбыл облысы әкімиятының 2005 жылғы 24 ақпандағы № 49 қаулысы. Жамбыл облыстық Әділет департаментінде 2005 жылғы 16 наурызда № 1577 тіркелді. Қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен

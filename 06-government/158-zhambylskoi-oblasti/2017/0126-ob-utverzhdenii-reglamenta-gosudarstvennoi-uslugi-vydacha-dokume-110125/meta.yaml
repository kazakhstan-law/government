act_code: '110125'
requisite: Постановление акимата Жамбылской области от 26 января 2017 года № 9. Зарегистрировано Департаментом юстиции Жамбылской области 2 марта 2017 года № 3331. Утратило силу постановлением акимата Жамбылской области от 5 февраля 2021 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача документов о прохождении подготовки, повышении квалификации и переподготовке кадров отрасли здравоохранения»
  kaz: «Денсаулық сақтау саласының кадрларын даярлықтан өткізу, олардың біліктілігін арттыру және қайта даярлау туралы құжаттарды беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

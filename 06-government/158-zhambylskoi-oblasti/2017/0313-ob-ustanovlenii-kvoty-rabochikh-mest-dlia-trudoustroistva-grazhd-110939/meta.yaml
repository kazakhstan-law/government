requisite: Постановление акимата Жуалынского района Жамбылской области от 13 марта 2017 года № 64. Зарегистрировано Департаментом юстиции Жамбылской области 29 марта 2017 года № 3369
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования и лиц, освобожденных из мест лишения свободы, лиц, состоявших на учете службы пробации на 2017 год
  kaz: 2017 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды және бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

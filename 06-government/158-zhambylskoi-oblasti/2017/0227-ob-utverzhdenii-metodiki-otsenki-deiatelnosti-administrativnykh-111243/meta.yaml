requisite: Постановление акимата Мойынкумского района Жамбылской области от 27 февраля 2017 года № 36. Зарегистрировано Департаментом юстиции Жамбылской области 6 апреля 2017 года № 3373. Утратило силу постановлением акимата Мойынкумского района Жамбылской области от 02.05.2018 № 159
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, сел, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, ауылдар, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

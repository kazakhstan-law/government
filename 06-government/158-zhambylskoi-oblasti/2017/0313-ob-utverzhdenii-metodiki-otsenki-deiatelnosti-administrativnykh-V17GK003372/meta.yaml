title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, города районного значения, сел, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, аудандық маңызы бар қала, ауылдар, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

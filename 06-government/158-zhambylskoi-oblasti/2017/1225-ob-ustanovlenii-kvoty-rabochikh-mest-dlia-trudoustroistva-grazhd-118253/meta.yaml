act_code: '118253'
requisite: Постановление акимата города Тараз Жамбылской области от 25 декабря 2017 года № 935. Зарегистрировано Департаментом юстиции Жамбылской области 16 января 2018 года № 3681
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования и для лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2018 год
  kaz: 2018 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтар үшін және бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

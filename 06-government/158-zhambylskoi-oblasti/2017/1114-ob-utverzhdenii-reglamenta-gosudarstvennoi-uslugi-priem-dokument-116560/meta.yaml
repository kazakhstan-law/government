  title:
    rus: О внесении изменений в постановление акимата Жамбылской области от 14 ноября 2017 года № 244 «Об утверждении регламента государственной услуги «Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием»
    kaz: «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Жамбыл облысы әкімдігінің 2017 жылғы 14 қарашадағы № 244 қаулысына өзгерістер енгізу туралы

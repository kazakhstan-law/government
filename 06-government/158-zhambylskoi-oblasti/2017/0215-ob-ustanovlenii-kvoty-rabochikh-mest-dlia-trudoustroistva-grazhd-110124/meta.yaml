requisite: Постановление акимата Кордайского района Жамбылской области от 15 февраля 2017 года № 43. Зарегистрировано Департаментом юстиции Жамбылской области 2 марта 2017 года № 3330
title:
  rus: Об установлении квоты рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования и для лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации на 2017 год
  kaz: 2017 жылға ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Жамбылского района Жамбылской области от 4 сентября 2017 года № 424. Зарегистрировано Департаментом юстиции Жамбылской области 25 сентября 2017 года № 3530. Утратило силу постановлением акимата Жамбылского района Жамбылской области от 9 сентября 2020 года № 446 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения государственных служащих аппаратов акима района, сельских округов и районных исполнительных органов, финансируемых из местного бюджета и его описания
  kaz: Жамбыл ауданы, ауылдық округ әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың мемлекеттік қызметшілеріне қызметтік куәлік беру қағидаларын және оның сипаттамасын бекіту туралы

  title:
    rus: О признании утратившим силу постановление акимата Жамбылского района от 04 сентября 2017 года № 424 «Об утверждении Правил выдачи служебного удостоверения государственных служащих аппаратов акима района, сельских округов и районных исполнительных органов, финансируемых из местного бюджета и его описания»
    kaz: «Жамбыл ауданы, ауылдық округ әкімі аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың мемлекеттік қызметшілеріне қызметтік куәлік беру қағидаларын және оның сипаттамасын бекіту туралы» Жамбыл ауданы әкімдігінің 2017 жылғы 04 қыркүйектегі № 424 қаулысының күші жойылды деп тану туралы

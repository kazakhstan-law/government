requisite: Постановление акимата города Тараз Жамбылской области от 7 марта 2017 года № 163. Зарегистрировано Департаментом юстиции Жамбылской области 29 марта 2017 года № 3366. Утратило силу постановлением акимата города Тараз Жамбылской области от 17.04.2018 №  855
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата акима города Тараз и городских исполнительных органов, финансируемых из местного бюджета
  kaz: Тараз қаласы әкімі аппараты мен жергілікті бюджеттен қаржыландырылатын қалалық атқарушы органдардың «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

requisite: Постановление акимата Таласского района Жамбылской области от 30 октября 2017 года № 294. Зарегистрировано Департаментом юстиции Жамбылской области 14 ноября 2017 года № 3583. Утратило силу постановлением акимата Таласского района Жамбылской области от 28 августа 2020 года № 293 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

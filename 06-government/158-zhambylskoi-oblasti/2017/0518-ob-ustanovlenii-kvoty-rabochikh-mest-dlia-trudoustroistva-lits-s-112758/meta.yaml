act_code: '112758'
requisite: Постановление акимата Жамбылского района Жамбылской области от 18 мая 2017 года № 235. Зарегистрировано Департаментом юстиции Жамбылской области 5 июня 2017 года № 3439
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпусниками организаций образования на 2017 год
  kaz: 2017 жылға пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына  квота белгілеу туралы

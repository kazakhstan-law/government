act_code: '112216'
requisite: Постановление акимата Шуского района Жамбылской области от 27 апреля 2017 года № 138. Зарегистрировано Департаментом юстиции Жамбылской области 15 мая 2017 года № 3433
title:
  rus: Об установлении квоты рабочих мест для трудоустройства лиц, состоящих на учете службы пробации, освобожденных из мест лишения свободы и граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования в Шуском районе на 2017 год
  kaz: 2017 жылға Шу ауданында пробация қызметінің есебінде тұрған, бас бостандығынан айыру орындарынан босатылған адамдарды және ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды жұмысқа орналастыру үшін жұмыс орындарына квота белгілеу туралы

requisite: Постановление акимата Сарысуского района Жамбылской области от 1 марта 2017 года № 30. Зарегистрировано Департаментом юстиции Жамбылской области 17 марта 2017 года № 3356. Утратило силу постановлением акимата Сарысуского района Жамбылской области от 27.03.2018 № 53
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппаратов акимов района, города районного значения, сельских округов и районных исполнительных органов, финансируемых из местного бюджета
  kaz: Аудан, аудандық маңызы бар қала, ауылдық округтер әкімдері аппараттары мен жергілікті бюджеттен қаржыландырылатын аудандық атқарушы органдардың «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы

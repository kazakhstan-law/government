  title:
    rus: О внесении изменений в постановление акимата Жамбылской области от 14 ноября 2017 года № 243 «Об утверждении регламента государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего и высшего образования»
    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі және жоғары білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Жамбыл облысы әкімдігінің 2017 жылғы 14 қарашадағы № 243 қаулысына өзгерістер енгізу туралы

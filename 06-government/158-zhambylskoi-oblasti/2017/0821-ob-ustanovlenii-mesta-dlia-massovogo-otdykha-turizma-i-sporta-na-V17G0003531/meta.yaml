  title:
    rus: О внесении изменения в постановление акимата Жамбылской области от 7 августа 2019 года № 168 «Об установлении мест для массового отдыха, туризма и спорта на водных объектах и водохозяйственных сооружениях Жамбылской области»
    kaz: «Жамбыл облысының су объектілері мен су шаруашылығы құрылыстарындағы көпшіліктің демалуына, туризм мен спортқа арналған жерлерді белгілеу туралы» Жамбыл облысы әкімдігінің 2019 жылғы 7 тамыздағы № 168 қаулысына өзгеріс енгізу туралы

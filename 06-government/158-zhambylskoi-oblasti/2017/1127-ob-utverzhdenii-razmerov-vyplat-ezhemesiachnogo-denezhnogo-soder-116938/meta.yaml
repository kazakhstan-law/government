act_code: '116938'
requisite: Постановление акимата Жамбылской области от 27 ноября 2017 года № 262. Зарегистрировано Департаментом юстиции Жамбылской области 13 декабря 2017 года № 3623
title:
  rus: Об утверждении размеров выплат ежемесячного денежного содержания спортсменам, входящим в состав сборных команд Республики Казахстан по видам спорта (национальных  сборных команд по видам спорта), их тренерам, а также спортсменам, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд Жамбылской области
  kaz: Жамбыл облысының спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін спортшыларға, олардың жаттықтырушыларына, сондай-ақ спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы

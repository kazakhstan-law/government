    kaz: «Жуалы ауданында 2017 жылға арналған мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыру және ата-ананың ақы төлеу мөлшерін бекіту туралы» Жуалы ауданы әкімдігінің 2017 жылғы 13 наурыздағы № 66 қаулысына өзгерістер енгізу туралы

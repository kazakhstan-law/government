    kaz: «2024 жылға арналған Жамбыл облысының акваөсіру (балық өсіру шаруашылығы) өнімінің өнімділігі мен сапасын арттыруға, сондай-ақ асыл тұқымды балық өсіруді дамытуға субсидиялар көлемін бекіту туралы» Жамбыл облысы әкімдігінің 2024 жылғы 11 маусымдағы № 146 қаулысына өзгеріс енгізу туралы

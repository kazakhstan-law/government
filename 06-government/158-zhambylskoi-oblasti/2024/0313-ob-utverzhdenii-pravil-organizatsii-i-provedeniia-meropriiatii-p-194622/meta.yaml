requisite: Постановление акимата города Тараз Жамбылской области от 13 марта 2024 года № 729. Зарегистрировано Департаментом юстиции Жамбылской области от 18 марта 2024 года № 5172-08
title:
  rus: Об утверждении Правил организации и проведения мероприятий по текущему или капитальному ремонту фасадов, кровли многоквартирных жилых домов, направленных на придание единого архитектурного облика городу Тараз
  kaz: Тараз қаласына бірыңғай сәулеттік келбет беруге бағытталған, көппәтерлі тұрғын үйлердің қасбеттерін, шатырларын ағымдағы немесе күрделі жөндеу жөніндегі іс-шараларды ұйымдастыру және жүргізу Қағидаларын бекіту туралы

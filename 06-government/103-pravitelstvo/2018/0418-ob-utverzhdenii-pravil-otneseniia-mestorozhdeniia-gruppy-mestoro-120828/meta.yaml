  title:
    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 18 апреля 2018 года № 204 «Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) углеводородного сырья к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных и порядка налогообложения в части налога на добычу полезных ископаемых»
    kaz: «Көмірсутек шикізаты кен орнын (кен орындарының бір тобын, кен орнының бір бөлігін) рентабельділігі төмен, өте тұтқыр, су басқан, дебиті аз және сарқылған кен орындарының санатына жатқызу қағидаларын және пайдалы қазбаларды өндіруге салынатын салық бөлігінде салық салу тәртібін бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 18 сәуірдегі № 204 қаулысына толықтыру енгізу туралы

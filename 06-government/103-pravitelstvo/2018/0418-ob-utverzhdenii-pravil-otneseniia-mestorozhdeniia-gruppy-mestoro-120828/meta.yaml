  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 18 апреля 2018 года № 204 «Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) углеводородного сырья к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных и порядка налогообложения в части налога на добычу полезных ископаемых» и от 27 июня 2019 года № 449 «Об утверждении перечня месторождений (группы месторождений, части месторождения) углеводородного сырья, относимых к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных, внесении изменений и дополнений в постановление Правительства Республики Казахстан от 18 апреля 2018 года № 204 «Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) углеводородного сырья к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных и порядка налогообложения в части налога на добычу полезных ископаемых» и признании утратившими силу некоторых решений Правительства Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Көмірсутек шикізаты кен орнын (кен орындарының бір тобын, кен орнының бір бөлігін) рентабельділігі төмен, тұтқырлығы жоғары, су басқан, дебиті аз және сарқылған кен орындарының санатына жатқызу қағидаларын және пайдалы қазбаларды өндіруге салынатын салық бөлігінде салық салу тәртібін бекіту туралы» 2018 жылғы 18 сәуірдегі № 204 және «Рентабельділігі төмен, өте тұтқыр, су басқан, дебиті аз және сарқылған кен орындары санатына жатқызылатын көмірсутек шикізаты кен орындарының (кен орындары тобының, кен орнының бір бөлігінің) тізбесін бекіту, «Көмірсутек шикізаты кен орнын (кен орындарының бір тобын, кен орнының бір бөлігін) рентабельділігі төмен, өте тұтқыр, су басқан, дебиті аз және сарқылған кен орындарының санатына жатқызу қағидаларын және пайдалы қазбаларды өндіруге салынатын салық бөлігінде салық салу тәртібін бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 18 сәуірдегі № 204 қаулысына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» 2019 жылғы 27 маусымдағы № 449 қаулыларына өзгерістер енгізу туралы

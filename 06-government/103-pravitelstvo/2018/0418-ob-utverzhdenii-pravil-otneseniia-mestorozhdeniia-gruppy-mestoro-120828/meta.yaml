title:
  rus: Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) углеводородов к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных и порядка налогообложения в части налога на добычу полезных ископаемых
  kaz: Көмірсутектер кен орнын (кен орындарының тобын, кен орнының бір бөлігін) рентабельділігі төмен, тұтқырлығы жоғары, су басқан, дебиті аз және игерілген санатқа жатқызу қағидаларын және пайдалы қазбаларды өндіру салығы бөлігінде салық салу тәртібін бекіту туралы

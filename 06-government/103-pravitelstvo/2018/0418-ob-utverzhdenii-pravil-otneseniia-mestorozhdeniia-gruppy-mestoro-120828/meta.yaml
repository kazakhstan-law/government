  requisite: Постановление Правительства Республики Казахстан от 27 июня 2019 года № 449. Утратило силу постановлением Правительства Республики Казахстан от 23 февраля 2026 года № 105 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении перечня месторождений (группы месторождений, части месторождения) углеводородов, относимых к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных, внесении изменений и дополнений в постановление Правительства Республики Казахстан от 18 апреля 2018 года № 204 «Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) углеводородов к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных и порядка налогообложения в части налога на добычу полезных ископаемых» и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Рентабельділігі төмен, тұтқырлығы жоғары, су басқан, дебиті аз және игерілген санатқа жатқызылатын көмірсутек кен орындарының (кен орындары тобының, кен орнының бір бөлігінің) тізбесін бекіту, «Көмірсутектер кен орнын (кен орындарының бір тобын, кен орнының бір бөлігін) рентабельділігі төмен, тұтқырлығы жоғары, су басқан, дебиті аз және игерілген санатқа жатқызу қағидаларын және пайдалы қазбаларды өндіру салығы бөлігінде салық салу тәртібін бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 18 сәуірдегі № 204 қаулысына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/132927/rus

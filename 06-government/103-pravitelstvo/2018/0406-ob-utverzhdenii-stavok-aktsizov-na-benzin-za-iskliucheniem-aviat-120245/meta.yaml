title:
  rus: Об утверждении ставок акцизов на бензин (за исключением авиационного), дизельное топливо, газохол, бензанол, нефрас, смесь легких углеводородов и экологическое топливо
  kaz: Бензинге (авиациялық бензинді қоспағанда), дизель отынына, газохолға, бензанолға, мұнай еріткішіне, жеңіл көмірсутектер қоспасына және экологиялық отынға арналған акциздер мөлшерлемелерін бекіту туралы

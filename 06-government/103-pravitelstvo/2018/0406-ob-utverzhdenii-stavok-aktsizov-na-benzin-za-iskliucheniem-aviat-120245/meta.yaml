  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 6 апреля 2018 года № 173 «Об утверждении ставок акцизов на бензин (за исключением авиационного) и дизельное топливо и признании утратившими силу некоторых решений Правительства Республики Казахстан»
    kaz: «Бензин (авиациялық бензинді қоспағанда) мен дизель отынына арналған акциздер мөлшерлемелерін бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 6 сәуірдегі № 173 қаулысына өзгерістер енгізу туралы

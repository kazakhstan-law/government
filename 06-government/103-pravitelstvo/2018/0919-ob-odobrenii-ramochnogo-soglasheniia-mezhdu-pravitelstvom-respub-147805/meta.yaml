act_code: '147805'
requisite: Постановление Правительства Республики Казахстан от 19 сентября 2018 года № 574 дсп
title:
  rus: Об одобрении Рамочного соглашения между Правительством Республики Казахстан в лице Министерства финансов Республики Казахстан, акционерным обществом «Фонд национального благосостояния «Самрук-Қазына», акционерным обществом «Национальный управляющий холдинг «Байтерек», акционерным обществом «Национальный управляющий холдинг «КазАгро», акционерным обществом «Фонд проблемных кредитов», Национальным Банком Республики Казахстан, акционерным обществом «Казахстанский фонд устойчивости», акционерным обществом «Цеснабанк», акционерным обществом «Финансовый холдинг» «Цесна» и господином Дәуреном Әділбекұлы Жақсыбек»
  kaz: Қазақстан Республикасы Үкіметінің атынан Қазақстан Республикасының Қаржы министрлігі, «Самұрық-Қазына» ұлттық әл-ауқат қоры» акционерлік қоғамы, «Бәйтерек» ұлттық басқарушы холдингі» акционерлік қоғамы, «ҚазАгро» ұлттық басқарушы холдингі» акционерлік қоғамы, «Проблемалық кредиттер қоры» акционерлік қоғамы, Қазақстан Республикасының Ұлттық банкі, «Қазақстанның орнықтылық қоры» акционерлік қоғамы, «Цеснабанк» акционерлік қоғамы, «Цесна» қаржы холдингі» акционерлік қоғамы мен Дәурен Әділбекұлы Жақсыбек мырзаның арасындағы негіздемелік келісімді мақұлдау туралы

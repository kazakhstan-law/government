act_code: '119823'
requisite: Постановление Правительства Республики Казахстан от 27 марта 2018 года № 138
title:
  rus: Об утверждении основных условий кредитования областных бюджетов, бюджетов городов Астаны и Алматы на содействие развитию предпринимательства в областных центрах, городах Астане, Алматы, Туркестан, Семей и моногородах на 2018 год
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттерiне облыс орталықтарында, Астана, Алматы, Түркістан, Семей қалаларында және моноқалаларда кәсіпкерлікті дамытуға жәрдемдесуге 2018 жылға кредит берудің негізгі шарттарын бекіту туралы

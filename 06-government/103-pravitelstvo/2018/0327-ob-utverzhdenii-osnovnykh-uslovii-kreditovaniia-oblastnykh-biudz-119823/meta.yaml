    rus: О внесении изменения в постановление Правительства Республики Казахстан от 27 марта 2018 года № 138 «Об утверждении основных условий кредитования областных бюджетов, бюджетов городов Астаны и Алматы на содействие развитию предпринимательства в областных центрах, городах Астане, Алматы, Туркестан, Семей и моногородах на 2018 год»

act_code: '123036'
requisite: Постановление Правительства Республики Казахстан от 28 июня 2018 года № 392
title:
  rus: Об утверждении формы и Правил заполнения и выдачи документа об условиях переработки товаров на/вне таможенной территории Евразийского экономического союза и переработки товаров для внутреннего потребления, внесения в него изменений (дополнений), отзыва (аннулирования) и (или) возобновления его действия, а также продления срока переработки товаров и признания отходов, образовавшихся в результате операций по переработке на таможенной территории Евразийского экономического союза и переработке для внутреннего потребления, непригодными для дальнейшего коммерческого использования
  kaz: Тауарларды Еуразиялық экономикалық одақтың кедендік аумағында/аумағынан тыс қайта өңдеу және ішкі тұтыну үшін қайта өңдеудің шарттары туралы құжаттың нысанын және оны толтыру мен беру, оған өзгерістер (толықтырулар) енгізу, оны кері қайтарып алу (жою) және (немесе) оның қолданылуын қайта бастау, сондай-ақ тауарларды қайта өңдеу мерзімін ұзарту және Еуразиялық экономикалық одақтың кедендік аумағында қайта өңдеу және ішкі тұтыну үшін қайта өңдеу бойынша операциялар нәтижесінде түзілген қалдықтарды одан әрі коммерциялық пайдалану үшін жарамсыз деп тану қағидаларын бекіту туралы

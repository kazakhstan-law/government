title:
  rus: Об утверждении перечня закрытых и обособленных военных городков, пограничных отделений и иных закрытых объектов, содержание служебных жилищ и централизованное отопление в которых обеспечиваются за счет государства
  kaz: Қызметтік тұрғынжайларды күтіп-ұстау және орталықтандырылған жылыту мемлекет есебінен қамтамасыз етілетін жабық және оқшауланған әскери қалашықтардың, шекара бөлімшелердің және өзге де жабық объектілердің тізбесін бекіту туралы

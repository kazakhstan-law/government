  requisite: Постановление Правительства Республики Казахстан от 1 сентября 2020 года № 548
  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и признании утратившим силу постановления Правительства Республики Казахстан от 13 июля 2012 года № 937 «Об утверждении натуральных норм снабжения мебелью и казарменным инвентарем воинских частей, учреждений и военных учебных заведений Вооруженных Сил, других войск и воинских формирований Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және «Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құралымдарының әскери бөлімдерін, мекемелерін және әскери оқу орындарын жиһазбен және казармалық мүкәммалмен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 13 шілдедегі № 937 қаулысының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/145919/rus

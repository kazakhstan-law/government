act_code: '124330'
requisite: Постановление Правительства Республики Казахстан от 3 сентября 2018 года № 543
title:
  rus: О признании утратившим силу постановления Правительства Республики Казахстан от 23 июля 2014 года № 816 «Об утверждении Правил аттестации субъектов транспортной деятельности на соответствие порядку и требованиям по проведению досмотра пассажиров и лиц, посещающих объекты транспортной инфраструктуры, вещей, находящихся при них, в том числе ручной клади и багажа»
  kaz: «Көлік қызметі субъектілерін жолаушылар мен көлік инфрақұрылымы объектілеріне келетін адамдарды, олардың алып жүретін заттарын, оның ішінде қол жүгі мен багажын тексеріп қарауды жүргізу тәртібі мен талаптарына сәйкестігіне аттестаттау қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 23 шілдедегі № 816 қаулысының күшін жою туралы

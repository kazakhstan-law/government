act_code: '121798'
requisite: Постановление Правительства Республики Казахстан от 21 мая 2018 года № 282. Утратило силу постановлением Правительства Республики Казахстан от 18 декабря 2025 года № 1102 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении критериев отнесения месторождения (группы месторождений по одному контракту на недропользование, части месторождения) твердых видов полезных ископаемых к категории низкорентабельных, а также Правил определения уровня рентабельности и уровня внутренней нормы рентабельности
  kaz: Пайдалы қазбалардың қатты түрлерінің кен орнын (жер қойнауын пайдалануға арналған бір келісімшарт бойынша кен орындары тобын, кен орнының бір бөлігін) рентабельділігі төмен санатқа жатқызу өлшемшарттарын, сондай-ақ Рентабельділік деңгейін және ішкі рентабельділік нормасының деңгейін айқындау қағидаларын бекіту туралы

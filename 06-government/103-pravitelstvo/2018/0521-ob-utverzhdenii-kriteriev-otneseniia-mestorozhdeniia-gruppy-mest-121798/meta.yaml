  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 21 мая 2018 года № 282 «Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) твердых видов полезных ископаемых, за исключением общераспространенных, к категории низкорентабельных и налогообложения в части налога на добычу полезных ископаемых»
    kaz: «Пайдалы қазбалардың кең таралғандарын қоспағанда, қатты түрлерiнiң кен орындарын (кен орындарының бiр тобын, кен орнының бiр бөлiгiн) рентабельділігі төмен санатқа жатқызу және пайдалы қазбаларды өндiру салығы бөлігінде салық салу қағидаларын бекiту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 21 мамырдағы № 282 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178181/rus

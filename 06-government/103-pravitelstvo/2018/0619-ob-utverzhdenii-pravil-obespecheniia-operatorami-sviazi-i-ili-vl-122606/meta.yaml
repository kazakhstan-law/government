act_code: '122606'
requisite: Постановление Правительства Республики Казахстан от 19 июня 2018 года № 358. Утратило силу постановлением Правительства Республики Казахстан от 7 ноября 2024 года № 926 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил обеспечения операторами связи и (или) владельцами сетей связи, осуществляющими деятельность на территории Республики Казахстан, за счет собственных или привлеченных средств функции своего телекоммуникационного оборудования для технического проведения оперативно-розыскных, контрразведывательных мероприятий и требований к сетям и средствам связи
  kaz: Қазақстан Республикасының аумағында қызметін жүзеге асыратын байланыс операторларының және (немесе) байланыс желілерін иеленушілердің жедел-іздестіру, қарсы барлау іс-шараларын техникалық тұрғыдан жүргізу үшін өзінің телекоммуникациялық жабдығының функцияларын өз қаражаты немесе тартылған қаражат есебінен қамтамасыз ету қағидаларын және байланыс желілері мен құралдарына қойылатын талаптарды бекіту туралы

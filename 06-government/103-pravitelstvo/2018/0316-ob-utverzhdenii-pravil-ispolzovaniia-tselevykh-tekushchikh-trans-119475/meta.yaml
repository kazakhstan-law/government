caused_by:
  code: '127840'
  requisite: Постановление Правительства Республики Казахстан от 29 декабря 2018 года № 914
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 16 марта 2018 года № 127 «Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2018 год областными бюджетами, бюджетами городов Астаны и Алматы на реализацию Плана мероприятий по обеспечению прав и улучшению качества жизни инвалидов в Республике Казахстан на 2012 – 2018 годы и на услуги по замене и настройке речевых процессоров к кохлеарным имплантам»
    kaz: «Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің Қазақстан Республикасында мүгедектердің құқықтарын қамтамасыз ету және өмір сүру сапасын жақсарту жөніндегі 2012 – 2018 жылдарға арналған іс-шаралар жоспарын іске асыруға және кохлеарлық импланттарға сөйлеу процессорларын ауыстыру және баптау жөніндегі көрсетілетін қызметтерге 2018 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 16 наурыздағы № 127 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/127840/rus

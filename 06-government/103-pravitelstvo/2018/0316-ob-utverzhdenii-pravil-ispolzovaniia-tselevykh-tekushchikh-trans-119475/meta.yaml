act_code: '119475'
requisite: Постановление Правительства Республики Казахстан от 16 марта 2018 года № 127
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2018 год областными бюджетами, бюджетами городов республиканского значения, столицы на реализацию Плана мероприятий по обеспечению прав и улучшению качества жизни инвалидов в Республике Казахстан на 2012 – 2018 годы и на услуги по замене и настройке речевых процессоров к кохлеарным имплантам
  kaz: Облыстық бюджеттердің, республикалық маңызы бар қалалардың, астана бюджеттерінің Қазақстан Республикасында мүгедектердің құқықтарын қамтамасыз ету және өмір сүру сапасын жақсарту жөніндегі 2012 – 2018 жылдарға арналған іс-шаралар жоспарын іске асыруға және кохлеарлық импланттарға сөйлеу процессорларын ауыстыру және теңшеу жөніндегі көрсетілетін қызметтерге 2018 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

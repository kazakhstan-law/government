    rus: Об утверждении Правил жилищного обеспечения сотрудника специального государственного органа, военнослужащего, а также сотрудника правоохранительного органа и органа гражданской защиты и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Арнаулы мемлекеттік органның қызметкерін, әскери қызметшіні, сондай-ақ құқық қорғау органының және азаматтық қорғау органының қызметкерін тұрғын үймен қамтамасыз ету қағидаларын бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

  code: '125171'
  requisite: Постановление Правительства Республики Казахстан от 16 октября 2018 года № 645
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 11 июля 2018 года № 420 «О некоторых вопросах реализации Указа Президента Республики Казахстан от 19 июня 2018 года № 702 «О некоторых вопросах административно-территориального устройства Республики Казахстан» и от 17 февраля 2017 года № 71 «О некоторых вопросах министерств здравоохранения и национальной экономики Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасының әкімшілік-аумақтық құрылысының кейбір мәселелері туралы» Қазақстан Республикасы Президентінің 2018 жылғы 19 маусымдағы № 702 Жарлығын іске асырудың кейбір мәселелері туралы» 2018 жылғы 11 шілдедегі № 420 және «Қазақстан Республикасы Денсаулық сақтау және Ұлттық экономика министрліктерінің кейбір мәселелерi туралы» 2017 жылғы 17 ақпандағы № 71 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/125171/rus

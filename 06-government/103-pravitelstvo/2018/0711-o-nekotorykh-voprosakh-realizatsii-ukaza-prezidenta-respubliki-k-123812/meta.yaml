act_code: '123812'
requisite: Постановление Правительства Республики Казахстан от 11 июля 2018 года № 420
title:
  rus: О некоторых вопросах реализации Указа Президента Республики Казахстан от 19 июня 2018 года № 702 «О некоторых вопросах административно-территориального устройства Республики Казахстан»
  kaz: «Қазақстан Республикасының әкімшілік-аумақтық құрылысының кейбір мәселелері туралы» Қазақстан Республикасы Президентінің 2018 жылғы 19 маусымдағы № 702 Жарлығын іске асырудың кейбір мәселелері туралы

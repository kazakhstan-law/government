title:
  rus: Об утверждении Правил документирования, управления документацией и использования систем электронного документооборота в государственных и негосударственных организациях
  kaz: Мемлекеттік және мемлекеттік емес ұйымдарда құжаттама жасау, құжаттаманы басқару және электрондық құжат айналымы жүйелерін пайдалану қағидаларын бекіту туралы

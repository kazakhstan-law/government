  requisite: Постановление Правительства Республики Казахстан от 30 ноября 2020 года № 809. Утратило силу постановлением Правительства Республики Казахстан от 11 сентября 2023 года № 780 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 31 декабря 2015 года № 1196 «Об утверждении Правил отнесения сведений к служебной информации ограниченного распространения и работы с ней» и от 31 октября 2018 года № 703 «Об утверждении Правил документирования, управления документацией и использования систем электронного документооборота в государственных и негосударственных организациях»
    kaz: Қазақстан Республикасы Үкіметінің «Мәліметтерді таратылуы шектелген қызметтік ақпаратқа жатқызу және онымен жұмыс істеу қағидаларын бекіту туралы» 2015 жылғы 31 желтоқсандағы № 1196 және «Мемлекеттік және мемлекеттік емес ұйымдарда құжаттама жасау, құжаттаманы басқару және электрондық құжат айналымы жүйелерін пайдалану қағидаларын бекіту туралы» 2018 жылғы 31 қазандағы № 703 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/149250/rus

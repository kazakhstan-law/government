requisite: Постановление Правительства Республики Казахстан от 6 ноября 2018 года № 723. Утратил силу постановлением Правительства Республики Казахстан от 1 сентября 2023 года № 758 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и проведения отчетов начальника департамента полиции области, города республиканского значения, столицы, городского, районного, районного в городе органа полиции и участкового инспектора полиции перед населением
  kaz: Облыстың, республикалық маңызы бар қаланың, астананың полиция департаменті, қалалық, аудандық, қаладағы аудандық полиция органы бастығының және учаскелік полиция инспекторының халық алдында есеп беруін ұйымдастыру мен өткізу қағидаларын бекіту туралы

  code: '141517'
  requisite: Постановление Правительства Республики Казахстан от 9 апреля 2020 года № 189
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 23 августа 2018 года № 513 «Об утверждении Правил предоставления государственных грантов для реализации новых бизнес-идей участникам Государственной программы развития продуктивной занятости и массового предпринимательства на 2017 – 2021 годы «Еңбек» и от 13 ноября 2018 года № 746 «Об утверждении Государственной программы развития продуктивной занятости и массового предпринимательства на 2017 – 2021 годы «Еңбек»
    kaz: Қазақстан Республикасы Үкіметінің «Нәтижелі жұмыспен қамтуды және жаппай кәсіпкерлікті дамытудың 2017 – 2021 жылдарға арналған «Еңбек» мемлекеттік бағдарламасына қатысушыларға жаңа бизнес-идеяларды іске асыруға арналған мемлекеттік гранттар беру қағидаларын бекіту туралы» 2018 жылғы 23 тамыздағы № 513 және «Нәтижелі жұмыспен қамтуды және жаппай кәсіпкерлікті дамытудың 2017 – 2021 жылдарға арналған «Еңбек» мемлекеттік бағдарламасын бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 13 қарашадағы № 746 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/141517/rus

title:
  rus: Об утверждении Правил предоставления государственных грантов для реализации новых бизнес-идей участникам Государственной программы развития продуктивной занятости и массового предпринимательства на 2017 – 2021 годы «Еңбек»
  kaz: Нәтижелі жұмыспен қамтуды және жаппай кәсіпкерлікті дамытудың 2017 – 2021 жылдарға арналған «Еңбек» мемлекеттік бағдарламасына қатысушыларға жаңа бизнес-идеяларды іске асыруға арналған мемлекеттік гранттар беру қағидаларын бекіту туралы

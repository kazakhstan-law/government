title:
  rus: Об утверждении перечня и критериев отбора предметов религиозного назначения, ввозимых религиозными объединениями, зарегистрированными в органах юстиции Республики Казахстан, которые освобождаются от налога на добавленную стоимость
  kaz: Қазақстан Республикасының әділет органдарында тіркелген діни бірлестіктер әкелетін, қосылған құн салығынан босатылатын діни мақсаттағы заттардың тізбесін және оларды іріктеу өлшемшарттарын бекіту туралы

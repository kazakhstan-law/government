  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 6 апреля 2018 года № 174 «Об утверждении перечня и критериев отбора предметов религиозного назначения, ввозимых религиозными объединениями, зарегистрированными в органах юстиции Республики Казахстан, которые освобождаются от налога на добавленную стоимость»
    kaz: «Қазақстан Республикасының әділет органдарында тіркелген діни бірлестіктер әкелетін, қосылған құн салығынан босатылатын діни мақсаттағы заттардың тізбесін және оларды іріктеу өлшемшарттарын бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 6 сәуірдегі № 174 қаулысына өзгерістер енгізу туралы

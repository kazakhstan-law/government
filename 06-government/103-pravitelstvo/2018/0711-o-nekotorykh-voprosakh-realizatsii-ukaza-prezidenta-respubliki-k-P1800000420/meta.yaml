  title:
    rus: О некоторых вопросах Министерства индустрии и инфраструктурного развития Республики Казахстан и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің кейбір мәселелері және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

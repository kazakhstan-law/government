  kaz: «Қазақстан Республикасының әкімшілік-аумақтық құрылысының кейбір мәселелері туралы» Қазақстан Республикасы Президентінің 2018 жылғы 19 маусымдағы № 702 Жарлығын іске асырудың кейбір мәселелері туралы

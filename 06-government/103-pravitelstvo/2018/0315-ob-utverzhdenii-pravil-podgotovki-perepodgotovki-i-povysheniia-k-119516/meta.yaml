  kaz: Мемлекеттік қызметшілерді даярлау, қайта даярлау және олардың біліктілігін арттыру қағидаларын, мемлекеттік қызметшілердің біліктілігін арттыруды жүзеге асыратын білім беру ұйымдарына қойылатын талаптарды бекіту туралы

  requisite: Постановление Правительства Республики Казахстан от 18 января 2024 года № 18. Утратило силу постановлением Правительства Республики Казахстан от 26 апреля 2024 года № 336 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 11 декабря 2018 года № 820 «О некоторых вопросах обеспечения долгосрочной тенговой ликвидности для решения задачи доступного кредитования» и признании утратившими силу  некоторых решений Правительства Республики Казахстан
    kaz: «Қолжетімді кредит беру міндетін шешу үшін ұзақ мерзімді теңгелік өтімділікті қамтамасыз етудің кейбір мәселелері туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 11 желтоқсандағы № 820 қаулысына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

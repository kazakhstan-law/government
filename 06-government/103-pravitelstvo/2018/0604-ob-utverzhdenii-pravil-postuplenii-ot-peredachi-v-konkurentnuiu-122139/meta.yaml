  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 8 ноября 2012 года № 1418 «Об утверждении Устава акционерного общества «Фонд национального благосостояния «Самрук-Қазына» и от 4 июня 2018 года № 323 «Об утверждении Правил поступлений от передачи в конкурентную среду активов национальных управляющих холдингов, национальных холдингов, национальных компаний и их дочерних, зависимых и иных юридических лиц, являющихся аффилированными с ними, в Национальный фонд Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Самұрық-Қазына» ұлттық әл-ауқат қоры» акционерлік қоғамының жарғысын бекіту туралы» 2012 жылғы 8 қарашадағы № 1418 және «Ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың және олардың еншілес, тәуелді және олармен үлестес болып табылатын өзге де заңды тұлғалардың активтерін бәсекелес ортаға беруден Қазақстан Республикасының Ұлттық қорына түсетін түсімдердің қағидаларын бекіту туралы» 2018 жылғы 4 маусымдағы № 323 қаулыларына өзгерістер енгізу туралы

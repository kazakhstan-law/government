title:
  rus: Об утверждении Правил поступлений от передачи в конкурентную среду активов национальных управляющих холдингов, национальных холдингов, национальных компаний и их дочерних, зависимых и иных юридических лиц, являющихся аффилированными с ними, в Национальный фонд Республики Казахстан
  kaz: Ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың және олардың еншілес, тәуелді және олармен үлестес болып табылатын өзге де заңды тұлғалардың активтерін бәсекелес ортаға беруден Қазақстан Республикасының Ұлттық қорына түсетін түсімдердің қағидаларын бекіту туралы

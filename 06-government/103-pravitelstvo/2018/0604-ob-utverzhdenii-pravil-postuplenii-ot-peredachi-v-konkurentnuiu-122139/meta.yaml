  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 4 июня 2018 года № 323 «Об утверждении Правил поступлений от передачи в конкурентную среду активов национальных управляющих холдингов, национальных холдингов, национальных компаний и их дочерних, зависимых и иных юридических лиц, являющихся аффилированными с ними, в Национальный фонд Республики Казахстан»
    kaz: «Ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың және олардың еншілес, тәуелді және олармен үлестес болып табылатын өзге де заңды тұлғалардың активтерін бәсекелес ортаға беруден Қазақстан Республикасының Ұлттық қорына түсетін түсімдердің қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 4 маусымдағы № 323 қаулысына өзгеріс енгізу туралы

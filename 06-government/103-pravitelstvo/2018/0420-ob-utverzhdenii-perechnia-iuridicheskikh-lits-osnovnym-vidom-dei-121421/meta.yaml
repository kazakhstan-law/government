act_code: '121421'
requisite: Постановление Правительства Республики Казахстан от 20 апреля 2018 года № 212. Утратило силу постановлением Правительства Республики Казахстан от 11 ноября 2025 года № 954 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении перечня юридических лиц, основным видом деятельности которых является осуществление заемных операций или выкуп прав требования и сто процентов голосующих акций (долей) которых принадлежат национальному управляющему холдингу, имеющих право на вычет суммы расходов по созданию провизии (резервов) против сомнительных и безнадежных активов, условных обязательств, за исключением активов и условных обязательств, предоставленных в пользу взаимосвязанных сторон либо третьим лицам по обязательствам взаимосвязанных сторон (кроме активов и условных обязательств кредитных товариществ), правил его формирования и правил создания провизий (резервов)
  kaz: Негізгі қызмет түрі қарыз операцияларын жүзеге асыру немесе талап ету құқықтарын сатып алу болып табылатын және дауыс беретін акцияларының (үлестерінің) жүз пайызы ұлттық басқарушы холдингке тиесілі, өзара байланысты тараптардың пайдасына не өзара байланысты тараптардың міндеттемелері бойынша үшінші тұлғаларға берілген активтер мен шартты міндеттемелерді (кредиттік серіктестіктердің активтері мен шартты міндеттемелерінен басқа) қоспағанда, күмәнді және үмітсіз активтерге, шартты міндеттемелерге қарсы провизиялар (резервтер) құру жөніндегі шығыстар сомасын шегеруге құқығы бар заңды тұлғалардың тізбесін, оны қалыптастыру қағидаларын және провизиялар (резервтер) құру қағидаларын бекіту туралы

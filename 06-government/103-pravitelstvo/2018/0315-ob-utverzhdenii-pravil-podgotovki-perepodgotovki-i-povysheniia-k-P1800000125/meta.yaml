  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 15 марта 2018 года № 125 «Об утверждении Правил подготовки, переподготовки и повышения квалификации государственных служащих, требований к организациям образования, осуществляющим повышение квалификации государственных служащих»
    kaz: «Мемлекеттік қызметшілерді даярлау, қайта даярлау және олардың біліктілігін арттыру қағидаларын, мемлекеттік қызметшілердің біліктілігін арттыруды жүзеге асыратын білім беру ұйымдарына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 15 наурыздағы № 125 қаулысына өзгерістер мен толықтырулар енгізу туралы

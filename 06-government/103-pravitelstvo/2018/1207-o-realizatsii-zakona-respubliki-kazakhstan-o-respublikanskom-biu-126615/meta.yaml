  requisite: Постановление Правительства Республики Казахстан от 21 февраля 2019 года № 83
  title:
    rus: О корректировке показателей республиканского бюджета на 2019 год, увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2018 года и использовании (доиспользовании) в 2019 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2018 году, и внесении изменений и дополнений в постановление Правительства Республики Казахстан от 7 декабря 2018 года № 808 «О реализации Закона Республики Казахстан «О республиканском бюджете на 2019 – 2021 годы»
    kaz: 2019 жылға арналған республикалық бюджеттің көрсеткіштерін түзету, 2018 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2018 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2019 жылы пайдалану (толық пайдалану) және «2019 – 2021 жылдарға арналған республикалық бюджет туралы» Қазақстан Республикасының Заңын іске асыру туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 7 желтоқсандағы № 808 қаулысына өзгерістер мен толықтырулар
  link: https://zan.gov.kz/client/#!/doc/129267/rus

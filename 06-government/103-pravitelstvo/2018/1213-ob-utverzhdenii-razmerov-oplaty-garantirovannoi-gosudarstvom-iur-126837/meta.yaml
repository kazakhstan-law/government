  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 13 декабря 2018 года № 834 «Об утверждении размера оплаты гарантированной государством юридической помощи, оказанной адвокатом, и возмещения расходов, связанных с правовым консультированием, защитой и представительством, а также проведением примирительных процедур»
    kaz: «Адвокат көрсеткен мемлекет кепілдік берген заң көмегіне ақы төлеудің, құқықтық консультация беруге, қорғауға және өкілдік етуге, сондай-ақ татуластыру рәсімдерін жүргізуге байланысты шығыстарды өтеу мөлшерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 13 желтоқсандағы № 834 қаулысына өзгерістер мен толықтыру енгізу туралы

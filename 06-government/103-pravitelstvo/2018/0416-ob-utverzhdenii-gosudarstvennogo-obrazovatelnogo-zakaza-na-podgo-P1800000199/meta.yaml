  requisite: Постановление Правительства Республики Казахстан от 23 июля 2020 года № 470
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 16 апреля 2018 года № 199 «Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также техническим и профессиональным, послесредним образованием в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку специалистов для Вооруженных сил, других войск и воинских формирований, а также специальных государственных органов), на 2018 – 2019, 2019 – 2020, 2020 – 2021 учебные года»
    kaz: «Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қарулы Күштер, басқа да әскерлер мен әскери құралымдар, сондай-ақ арнаулы мемлекеттік органдар үшін мамандар даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2018 – 2019, 2019 – 2020, 2020 – 2021 оқу жылдарына арналған мемлекеттік білім беру тапсырысын бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 16 сәуірдегі № 199 қаулысына өзгерістер енгізу туралы

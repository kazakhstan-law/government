  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 12 февраля 2018 года № 49 «Об утверждении Правил обеспечения служебным жилищем военнослужащих, исчисления размера, назначения, перерасчета, осуществления, прекращения, приостановления и возобновления жилищных выплат» и от 12 февраля 2018 года № 50 «Об утверждении Правил осуществления денежной компенсации»
    kaz: Қазақстан Республикасы Үкіметінің «Әскери қызметшілерді қызметтік тұрғынжаймен қамтамасыз ету, тұрғын үй төлемдерінің мөлшерін есептеу, оларды тағайындау, қайта есептеу, жүзеге асыру, тоқтату, тоқтата тұру және қайта бастау қағидаларын бекіту туралы» 2018 жылғы 12 ақпандағы № 49 және «Ақшалай өтемақыны жүзеге асыру қағидаларын бекіту туралы» 2018 жылғы 12 ақпандағы № 50 қаулыларына өзгерістер мен толықтырулар енгізу туралы

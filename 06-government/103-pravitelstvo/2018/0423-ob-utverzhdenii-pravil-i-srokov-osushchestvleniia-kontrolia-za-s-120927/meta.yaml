act_code: '120927'
requisite: Постановление Правительства Республики Казахстан от 23 апреля 2018 года № 213. Утратило силу постановлением Правительства Республики Казахстан от 17 октября 2025 года № 879 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил и сроков осуществления контроля за соблюдением порядка учета, хранения, оценки, дальнейшего использования и реализации имущества, обращенного (поступившего) в собственность государства, за полнотой и своевременностью поступления денег в бюджет в случае его реализации, а также порядка передачи имущества, обращенного (поступившего) в собственность государства
  kaz: Мемлекет меншігіне айналдырылған (түскен) мүлікті есепке алу, сақтау, бағалау, одан әрі пайдалану және өткізу тәртібінің сақталуын, ол өткізілген жағдайда ақшаның бюджетке толық және уақтылы түсуін, сондай-ақ мемлекет меншігіне айналдырылған (түскен) мүлікті беру тәртібінің сақталуын бақылауды жүзеге асыру қағидалары мен мерзімдерін бекіту туралы

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 23 апреля 2018 года № 213 «Об утверждении Правил и сроков осуществления контроля за соблюдением порядка учета, хранения, оценки, дальнейшего использования и реализации имущества, обращенного (поступившего) в собственность государства, за полнотой и своевременностью поступления денег в бюджет в случае его реализации, а также порядка передачи имущества, обращенного (поступившего) в собственность государства»
    kaz: «Мемлекет меншігіне айналдырылған (түскен) мүлікті есепке алу, сақтау, бағалау, одан әрі пайдалану және өткізу тәртібінің сақталуын, ол өткізілген жағдайда ақшаның бюджетке толық және уақтылы түсуін, сондай-ақ мемлекет меншігіне айналдырылған (түскен) мүлікті беру тәртібінің сақталуын бақылауды жүзеге асыру қағидалары мен мерзімдерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 23 сәуірдегі № 213 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/155913/rus

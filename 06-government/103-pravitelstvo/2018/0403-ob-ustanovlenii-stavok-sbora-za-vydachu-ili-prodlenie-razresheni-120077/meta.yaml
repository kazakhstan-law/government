    kaz: «Қазақстан Республикасына шетелдік жұмыс күшін тартуға рұқсатты бергені және (немесе) ұзартқаны үшін алым мөлшерлемелерін белгілеу туралы» Қазақстан Республикасы Үкіметінің 2018 жылғы 3 сәуірдегі № 157 қаулысына өзгерістер енгізу туралы

act_code: '120239'
requisite: Постановление Правительства Республики Казахстан от 4 апреля 2018 года № 163
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2018 год областными бюджетами, бюджетами городов Астаны и Алматы на доплату учителям за замещение на период обучения основного сотрудника
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2018 жылға арналған республикалық бюджеттен оқу кезеңінде негізгі қызметкерді алмастырғаны үшін мұғалімдерге қосымша ақы төлеуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

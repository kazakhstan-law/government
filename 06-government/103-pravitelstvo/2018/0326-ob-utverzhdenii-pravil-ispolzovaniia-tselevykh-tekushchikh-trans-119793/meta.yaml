act_code: '119793'
requisite: Постановление Правительства Республики Казахстан от 26 марта 2018 года № 136
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2018 год областными бюджетами, бюджетами городов Астаны и Алматы на доплату учителям, прошедшим стажировку по языковым курсам
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2018 жылға арналған республикалық бюджеттен тілдік курстар бойынша тағылымдамадан өткен мұғалімдерге қосымша ақы төлеуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

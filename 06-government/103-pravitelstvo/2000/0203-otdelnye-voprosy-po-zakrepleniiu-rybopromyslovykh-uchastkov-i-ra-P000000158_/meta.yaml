  rus: Отдельные вопросы по закреплению рыбопромысловых участков и распределения лимита вылова рыбы и других водных животных в рыбохозяйственных водоемах Республики Казахстан
  kaz: Қазақстан Республикасының балық шаруашылығы су айдындарында балық кәсіпшілігі учаскелерін бекітіп беру және балық пен басқа да су жануарларын аулаудың лимиттерін бөлу жөніндегі жекелеген мәселелер

  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и признании утратившим силу постановления Правительства Республики Казахстан от 14 декабря 2004 года № 1317 "Некоторые вопросы Республиканского государственного предприятия "Информационно-производственный центр" Министерства внутренних дел Республики Казахстан"
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және "Қазақстан Республикасы Ішкі істер министрлігінің "Ақпараттық-өндірістік орталық" республикалық мемлекеттік кәсіпорнының кейбір мәселелері" туралы Қазақстан Республикасы Үкіметінің 2004 жылғы 14 желтоқсандағы № 1317 қаулысының күші жойылды деп тану туралы

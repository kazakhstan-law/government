  title:
    rus: О создании Республиканского государственного учреждения "Центр коммуникаций" Канцелярии Премьер-Министра Республики Казахстан, выделении средств из резерва Правительства Республики Казахстан и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Қазақстан Республикасының Премьер-Министрі Кеңсесінің "Коммуникация орталығы" республикалық мемлекеттік мекемесін құру, Қазақстан Республикасы Үкіметінің резервінен қаражат бөлу және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

title:
  rus: О перечне должностей военнослужащих, сотрудников органов внутренних дел Республики Казахстан, имеющих право на денежную компенсацию на содержание жилища и коммунальные услуги
  kaz: Қазақстан Республикасы ішкі істер органдарының тұрғын үйді ұстауға және коммуналдық қызмет көрсетулерге ақшалай өтемақы алуға құқығы бар әскери қызметшілері, қызметкерлері лауазымдарының тізбесі туралы

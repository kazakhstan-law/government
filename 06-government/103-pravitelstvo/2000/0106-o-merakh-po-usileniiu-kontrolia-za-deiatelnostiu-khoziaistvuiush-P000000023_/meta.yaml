title:
  rus: О мерах по усилению контроля за деятельностью хозяйствующих субъектов, занятых сбором (заготовкой), хранением, переработкой и реализацией лома и отходов цветных и черных металлов
  kaz: Түсті және қара металдардың сынықтары мен қалдықтарын жинаумен (дайындаумен), сақтаумен, өңдеумен және сатумен айналысатын шаруашылық субъектілерінің қызметін бақылауды күшейту жөніндегі шаралар туралы

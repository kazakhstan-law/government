act_code: '7798'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2000 года N 1927 Утратило силу - постановлением Правительства РК от 11 января 2002 г. N 41
title:
  rus: О доплате за работу в сельской местности, за проживание в зонах экологического бедствия, за классное руководство, за проверку тетрадей, письменных работ, за заведование учебными кабинетами, углубленное преподавание предметов и других выплатах работникам государственных организаций образования
  kaz: Мемлекеттік білім беру ұйымдарының қызметкерлеріне ауылдық жерде жұмыс істегені үшін, экологиялық апат аймағында тұрғаны үшін, сынып жетекшілігі үшін, дәптерлер, жазба жұмыстарын тексергені үшін, оқу кабинеттерінің меңгерушілігі үшін, пәндерді тереңдетіп оқытқаны үшін қосымша ақы және басқа да төлемдер туралы

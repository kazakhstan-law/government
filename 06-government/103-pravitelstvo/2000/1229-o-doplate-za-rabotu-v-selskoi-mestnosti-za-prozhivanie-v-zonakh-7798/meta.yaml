  title:
    rus: О системе оплаты труда работников государственных учреждений, не являющихся государственными служащими и работников казенных предприятий
    kaz: Мемлекеттiк мекемелердiң мемлекеттiк қызметшi емес қызметкерлерiне және қазыналық кәсіпорындардың қызметкерлерiне еңбекақы төлеу жүйесi туралы

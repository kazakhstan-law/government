act_code: '7448'
requisite: Постановление Правительства Республики Казахстан от 28 ноября 2000 года № 1765
title:
  rus: Об утверждении Соглашения между Министерством государственных доходов Республики Казахстан и Таможенным комитетом при Правительстве Республики Таджикистан о сотрудничестве в борьбе с контрабандой и нарушениями таможенных правил, а также с незаконным оборотом оружия, боеприпасов, взрывчатых веществ, наркотических средств, психотропных веществ и прекурсоров
  kaz: Қазақстан Республикасының Мемлекеттік кіріс министрлігі мен Тәжікстан Республикасы Үкіметінің жанындағы Кеден комитетінің арасындағы Контрабандаға және кеден ережелерін бұзушылықтарға, сондай-ақ қару-жарақтың, оқ-дәрілердің, жарылғыш заттардың, есірткі құралдарының, психотроптық заттар мен прекурсорлардың заңсыз айналымына қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы

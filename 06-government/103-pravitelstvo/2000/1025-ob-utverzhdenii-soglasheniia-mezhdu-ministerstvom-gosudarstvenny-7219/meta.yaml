act_code: '7219'
requisite: Постановление Правительства Республики Казахстан от 26 октября 2000 года № 1602
title:
  rus: Об утверждении Соглашения между Министерством государственных доходов Республики Казахстан и Государственным таможенным комитетом Азербайджанской Республики о сотрудничестве в борьбе с контрабандой и нарушениями таможенных правил, а также с незаконным оборотом оружия, боеприпасов, взрывчатых веществ, наркотических средств, психотропных веществ и прекурсоров
  kaz: Қазақстан Республикасының Мемлекеттiк кiрiс министрлiгi мен Әзербайжан Республикасының Мемлекеттiк кеден комитетi арасындағы контрабандаға және кеден ережелерiн бұзушылықтарға, сондай-ақ қарудың, оқ-дәрiлердiң, жарылғыш заттардың, есiрткi құралдарының, психотропты заттар мен прекурсорлардың заңсыз айналымына қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы

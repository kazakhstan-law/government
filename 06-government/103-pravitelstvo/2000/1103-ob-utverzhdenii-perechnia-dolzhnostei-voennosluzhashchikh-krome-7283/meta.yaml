act_code: '7283'
requisite: Постановление Правительства Республики Казахстан от 3 ноября 2000 года N 1662. Утратило силу - постановлением Правительства РК от 29 мая 2002 г. N 593
title:
  rus: Об утверждении Перечня должностей военнослужащих (кроме военнослужащих срочной службы) Внутренних войск Министерства внутренних дел Республики Казахстан, имеющих право на денежную компенсацию для оплаты расходов на содержание жилища и коммунальные услуги
  kaz: Қазақстан Республикасының Iшкi iстер министрлігі Iшкi әскерлерiнiң тұрғын үйдi ұстауға және коммуналдық қызметтерге арналған шығыстарды төлеу үшiн ақшалай өтемақы алуға құқығы бар әскери қызметшiлерi (мерзiмдi қызметтiң әскери қызметшiлерiнен басқалары) лауазымдарының тiзбесiн бекiту туралы

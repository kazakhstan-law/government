title:
  rus: Об утверждении Перечня должностей военнослужащих (кроме военнослужащих срочной службы) Вооруженных Сил Республики Казахстан, имеющих право на денежную компенсацию для оплаты расходов на содержание жилища и коммунальные услуги
  kaz: Қазақстан Республикасы Қарулы Күштерiнiң тұрғын үйдi ұстау мен коммуналдық қызметтердiң шығындарын төлеу үшiн ақшалай өтемақы алуға құқығы бар әскери қызметшiлерi (мерзiмдi қызметтiң әскери қызметшiлерiнен басқалары) лауазымдарының тізбесін бекiту туралы

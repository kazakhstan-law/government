title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о приграничном сотрудничестве регионов Республики Казахстан и Российской Федерации на 1999-2007 годы
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясы Үкіметінің арасындағы Қазақстан Республикасы мен Ресей Федерациясы аймақтарының 1999-2007 жылдарға арналған шекара маңындағы ынтымақтастығы туралы келісімді бекіту туралы

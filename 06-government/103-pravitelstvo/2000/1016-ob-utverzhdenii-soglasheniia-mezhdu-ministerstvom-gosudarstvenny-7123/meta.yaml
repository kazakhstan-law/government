title:
  rus: Об утверждении Соглашения между Министерством государственных доходов Республики Казахстан и Государственным таможенным комитетом Азербайджанской Республики о сотрудничестве и взаимной помощи по вопросам задержания и возврата культурных ценностей, незаконно перемещаемых через границы
  kaz: Қазақстан Республикасының Мемлекеттік кіріс министрлігі мен Әзербайжан Республикасының Мемлекеттік кеден комитеті арасындағы Шекара арқылы заңсыз өткізілетін мәдени құндылықтарды ұстау және қайтару мәселелері жөніндегі ынтымақтастық пен өзара көмек туралы келісімді бекіту туралы

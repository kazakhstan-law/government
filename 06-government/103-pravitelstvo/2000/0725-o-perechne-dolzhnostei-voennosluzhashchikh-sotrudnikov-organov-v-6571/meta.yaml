title:
  rus: О перечне должностей военнослужащих, сотрудников органов военной прокуратуры Республики Казахстан, имеющих право на денежную компенсацию на содержание жилища и оплату коммунальных услуг
  kaz: Қазақстан Республикасы әскери прокуратура органдарының тұрғын үйді ұстауға және коммуналдық қызметтерді төлеуге ақшалай өтемақы алуға құқығы бар әскери қызметшілері, қызметкерлері лауазымдарының тізбесі туралы

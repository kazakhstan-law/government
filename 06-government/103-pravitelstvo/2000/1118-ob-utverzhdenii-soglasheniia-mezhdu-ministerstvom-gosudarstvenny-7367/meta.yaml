title:
  rus: Об утверждении Соглашения между Министерством государственных доходов Республики Казахстан и Таможенным комитетом при Правительстве Республики Таджикистан о сотрудничестве и взаимной помощи по вопросам задержания и возврата культурных ценностей, незаконно перемещаемых через границы
  kaz: Қазақстан Республикасының Мемлекеттік кiрiс министрлігi мен Тәжiкстан Республикасы Үкiметiнiң жанындағы Кеден комитетінің арасындағы шекаралар арқылы заңсыз тасымалданатын мәдени құндылықтарды ұстау және қайтару мәселелерi жөнiндегі ынтымақтастық және өзара көмек туралы келiсiмдi бекiту туралы

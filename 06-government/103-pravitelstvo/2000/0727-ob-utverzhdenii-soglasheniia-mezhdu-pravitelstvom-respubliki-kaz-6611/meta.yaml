act_code: '6611'
requisite: Постановление Правительства Республики Казахстан от 28 июля 2000 года N 1158
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан, Правительством Кыргызской Республики и Правительством Республики Узбекистан о содействии по созданию совместных предприятий, производственных объединений
  kaz: Қазақстан Республикасының Yкiметi, Қырғыз Республикасының Yкiметi және Өзбекстан Республикасының Үкiметi арасындағы бiрлескен кәсiпорындар, өндiрiстiк бiрлестiктер құру жөнiндегі көмек көрсету туралы келiсiмдi бекiту туралы

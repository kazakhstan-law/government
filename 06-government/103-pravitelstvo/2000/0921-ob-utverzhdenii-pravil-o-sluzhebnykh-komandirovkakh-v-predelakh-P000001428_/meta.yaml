  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 22 сентября 2000 года № 1428 "Об утверждении Правил о служебных командировках в пределах Республики Казахстан работников государственных учреждений, содержащихся за счет средств государственного бюджета, а также депутатов Парламента Республики Казахстан"

    rus: О внесении изменений и дополнений и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және олардың күші жойылды деп тану туралы

act_code: '5772'
requisite: Постановление Правительства Республики Казахстан от 18 апреля 2000 года N 597
title:
  rus: Об утверждении Правил выпуска, размещения, обращения, погашения и обслуживания государственных среднесрочных казначейских валютных обязательств Республики Казахстан со сроком обращения один год и более
  kaz: Қазақстан Республикасының айналыс мерзімі бір жыл және одан артық мемлекеттік орта мерзімді қазынашылық валюталық міндеттемелерін шығарудың, орналастырудың, олардың айналысының, өтеудің және оларға қызмет көрсетудің ережесін бекіту туралы

title:
  rus: Об утверждении Соглашения между Таможенным комитетом Министерства государственных доходов Республики Казахстан и Министерством государственных доходов Республики Армения о сотрудничестве и взаимной помощи по вопросам задержания и возврата культурных ценностей, незаконно перемещаемых через границы
  kaz: Қазақстан Республикасы Мемлекеттік кіріс министрлігінің Кеден комитеті мен Армения Республикасы Мемлекеттік кіріс министрлігінің арасындағы шекаралар арқылы заңсыз өткізілетін мәдени құндылықтарды ұстау және қайтару мәселелері жөніндегі ынтымақтастық пен өзара көмек туралы келісімді бекіту туралы

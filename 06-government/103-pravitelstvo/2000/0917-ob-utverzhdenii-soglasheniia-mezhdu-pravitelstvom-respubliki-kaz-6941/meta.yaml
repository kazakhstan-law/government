act_code: '6941'
requisite: Постановление Правительства Республики Казахстан от 18 сентября 2000 года N 1403
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Турецкой Республики о безвозмездной военной помощи и Исполнительного протокола между Министерством обороны Республики Казахстан и Генеральным штабом Турецкой Республики относительно финансовой помощи
  kaz: Қазақстан Республикасының Үкіметі мен Түрік Республикасының Үкіметі арасындағы өтеусіз әскери көмек жөніндегі келісімді және Қазақстан Республикасының Қорғаныс министрлігі мен Түрік Республикасының Бас штабы арасындағы қаржылай көмек жөніндегі атқару хаттамасын бекіту туралы

  title:
    rus: Об утверждении квалификационных требований, предъявляемых к деятельности по разработке, производству, ремонту, торговле, коллекционированию, экспонированию и приобретению гражданского и служебного оружия и патронов к нему и к деятельности по разработке, производству, торговле, использованию и приобретению гражданских пиротехнических веществ и изделий с их применением

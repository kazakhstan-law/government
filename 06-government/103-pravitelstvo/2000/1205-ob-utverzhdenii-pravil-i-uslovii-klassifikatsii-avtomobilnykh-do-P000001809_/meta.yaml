title:
  rus: Об утверждении правил и условий классификации автомобильных дорог и перечня автомобильных дорог общего пользования республиканского значения Республики Казахстан
  kaz: Қазақстан Республикасының автомобиль жолдарын жiктеу ережесi мен шарттарын және республикалық маңызы бар жалпы пайдаланымдағы автомобиль жолдарының тiзбесiн бекiту туралы

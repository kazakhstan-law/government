  title:
    rus: О включении в состав автомобильных дорог общего пользования республиканского значения автомобильных дорог Казталовка - Жанибек - граница Российской Федерации и Ленинский - Аксу - Коктобе - Большой Акжар - город Курчатов
    kaz: Казталов - Жәнiбек - Ресей Федерациясының шекарасы және Ленинск - Ақсу - Көктөбе - Yлкен Ақжар - Курчатов қаласы автомобиль жолдарын республикалық маңызы бар жалпы пайдаланымдағы автомобиль жолдарының құрамына енгiзу туралы

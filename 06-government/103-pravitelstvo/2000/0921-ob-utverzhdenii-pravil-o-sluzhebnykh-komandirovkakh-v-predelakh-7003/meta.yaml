    kaz: '"Мемлекеттiк бюджеттiң есебiнен ұсталатын мемлекеттiк мекемелер қызметкерлерiнiң, сондай-ақ, Қазақстан Республикасының Парламенті депутаттарының Қазақстан Республикасының шегiндегi қызметтiк iссапарлары туралы ереженi бекiту туралы" Қазақстан Республикасы Үкіметінің 2000 жылғы 22 қыркүйектегі № 1428 қаулысына өзгерістер енгізу туралы'

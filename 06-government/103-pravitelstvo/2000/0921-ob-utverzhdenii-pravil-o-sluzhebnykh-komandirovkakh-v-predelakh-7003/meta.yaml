  title:
    rus: Об утверждении Правил возмещения расходов на служебные командировки за счет бюджетных средств, в том числе в иностранные государства
    kaz: Бюджет қаражаты есебінен қызметтік іссапарларға, оның ішінде шет мемлекеттерге қызметтік іссапарларға арналған шығыстарды өтеу қағидаларын бекіту туралы

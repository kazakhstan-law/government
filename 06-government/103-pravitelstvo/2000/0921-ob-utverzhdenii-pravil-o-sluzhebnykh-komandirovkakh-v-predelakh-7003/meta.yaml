act_code: '7003'
requisite: Постановление Правительства Республики Казахстан от 22 сентября 2000 года N 1428
title:
  rus: Об утверждении Правил о служебных командировках в пределах Республики Казахстан работников государственных учреждений, содержащихся за счет средств государственного бюджета, а также депутатов Парламента Республики Казахстан
  kaz: Мемлекеттiк бюджеттiң есебiнен ұсталатын мемлекеттiк мекемелер қызметкерлерiнiң, сондай-ақ, Қазақстан Республикасының Парламенті депутаттарының Қазақстан Республикасының шегiндегi қызметтiк iссапарлары туралы ереженi бекiту туралы

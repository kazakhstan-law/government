caused_by:
  code: '128432'
  requisite: Постановление Правительства Республики Казахстан от 29 декабря 2018 года № 934
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 22 сентября 2000 года № 1428 «Об утверждении Правил о служебных командировках в пределах Республики Казахстан работников государственных учреждений, содержащихся за счет средств государственного бюджета, а также депутатов Парламента Республики Казахстан» и от 11 мая 2018 года № 256 «Об утверждении Правил возмещения расходов на служебные командировки за счет бюджетных средств, в том числе в иностранные государства»
    kaz: Қазақстан Республикасы Үкіметінің «Мемлекеттiк бюджеттiң есебiнен ұсталатын мемлекеттiк мекемелер қызметкерлерiнiң, сондай-ақ, Қазақстан Республикасының Парламенті депутаттарының Қазақстан Республикасының шегiндегi қызметтiк iссапарлары туралы ереженi бекiту туралы» 2000 жылғы 22 қыркүйектегі № 1428 және «Бюджет қаражаты есебінен қызметтік іссапарларға, оның ішінде шет мемлекеттерге қызметтік іссапарларға арналған шығыстарды өтеу қағидаларын бекіту туралы» 2018 жылғы 11 мамырдағы № 256 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/128432/rus

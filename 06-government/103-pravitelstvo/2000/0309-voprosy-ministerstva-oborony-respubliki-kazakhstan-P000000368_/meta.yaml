  key: P1400000707
  requisite: Постановление Правительства Республики Казахстан от 27 июня 2014 года № 707
  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 16 августа 2001 года № 1074 "Об утверждении Положения о Министерстве обороны Республики Казахстан" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: '"Қазақстан Республикасының Қорғаныс министрлігі туралы ереженi бекіту туралы" Қазақстан Республикасы Үкіметінің 2001 жылғы 16 тамыздағы № 1074 қаулысына өзгерiс енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/80925/rus

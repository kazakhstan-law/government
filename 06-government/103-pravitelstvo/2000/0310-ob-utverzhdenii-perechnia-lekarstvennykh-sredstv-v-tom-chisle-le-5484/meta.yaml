  title:
    rus: Об утверждении Правил освобождения от налога на добавленную стоимость товаров, импортируемых в Республику Казахстан
    kaz: Қазақстан Республикасына импортталатын тауарларды қосылған құн салығынан босату ережесiн бекiту туралы

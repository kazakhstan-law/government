act_code: '5484'
requisite: Постановление Правительства Республики Казахстан от 10 марта 2000 года N 378. Утратило силу постановлением Правительства Республики Казахстан от 26 января 2009 года N 56.
title:
  rus: Об утверждении Перечня лекарственных средств, в том числе лекарственных субстанций, изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, сурдотифлотехники и медицинской (ветеринарной) техники, материалов и комплектующих для производства лекарственных и диабетических средств, изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, и медицинской (ветеринарной) техники, освобождаемых от налога на добавленную стоимость
  kaz: Қосылған құн салығынан босатылатын дәрiлiк заттардың, оның iшiнде дәрiлiк субстанциялардың, протездiк-ортопедиялық бұйымдарды қоса алғанда, медициналық (ветеринарлық) мақсаттағы бұйымдардың, сурдотифлотехника мен медицина (ветеринария) техникасының, дәрi-дәрмек және диабеттiк құралдарды өндiруге арналған материалдар мен жиынтықтаушылардың, протездiк-ортопедиялық бұйымдарды қоса алғанда, медициналық (ветеринарлық) мақсаттағы бұйымдардың және медицина (ветеринария) техникасының тiзбесiн бекiту туралы

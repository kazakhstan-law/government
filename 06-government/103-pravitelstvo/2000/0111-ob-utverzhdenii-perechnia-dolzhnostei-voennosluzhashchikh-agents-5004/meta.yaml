act_code: '5004'
requisite: Постановление Правительства Республики Казахстан от 11 января 2000 года N 43. Утратило силу - постановлением Правительства РК от 4 апреля 2005 г. N 302 (P050302)
title:
  rus: Об утверждении Перечня должностей военнослужащих Агентства Республики Казахстан по чрезвычайным ситуациям и сотрудников Государственной противопожарной службы, которым в установленном порядке присвоено специальное звание, имеющих право на денежную компенсацию на содержание жилища и коммунальные услуги
  kaz: Қазақстан Республикасы Төтенше жағдайлар жөніндегі агенттігінің әскери қызметшілері мен Өртке қарсы мемлекеттік қызметтің белгіленген тәртіппен тұрғын үйді ұстауға және коммуналдық қызмет көрсетулерге ақшалай өтемақыға құқығы бар арнаулы атақ берілген қызметкерлері лауазымдарының тізбесін бекіту туралы

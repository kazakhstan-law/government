title:
  rus: Об утверждении Правил использования средств от реализации товаров и услуг, предоставляемых домами-интернатами для умственно-отсталых детей, психоневрологическими интернатами, домами-интернатами для престарелых и инвалидов общего типа
  kaz: Ақыл-есі кеміс балаларға арналған интернат үйлері, психоневрологиялық интернаттар, қарттар мен мүгедектерге арналған жалпы үлгідегі интернат үйлері ұсынатын тауарлар мен қызмет көрсетулерді сатудан түсетін қаражатты пайдалану ережесін бекіту туралы

act_code: '5691'
requisite: Постановление Правительства Республики Казахстан от 7 апреля 2000 года N 520.  (Утратило силу - постановлением Правительства РК от 20 декабря 2001 г. N 1665 (вводится в действие с 1 января 2002 г.)
title:
  rus: Об утверждении Правил о порядке исчисления и уплаты сбора за использование юридическими (кроме государственных предприятий, государственных учреждений и некоммерческих организаций) и физическими лицами слов "Казахстан", "Республика", "Национальный" (полных, а также любых производных от них) в их фирменных наименованиях, знаках обслуживания, товарных знаках
  kaz: Заңды (мемлекеттiк кәсiпорындардан, мемлекеттiк мекемелерден және коммерциялық емес ұйымдардан басқа) және жеке тұлғалардың өз фирмалық атауларында, қызмет көрсету белгілерiнде, тауарлық таңбаларында "Қазақстан", "Республика", "Ұлттық" деген (толық, сондай-ақ олардан туындайтын кез-келген басқа да) сөздердi пайдаланғаны үшiн алым есептеудiң және төлеуiнiң тәртiбi туралы ереженi бекiту туралы

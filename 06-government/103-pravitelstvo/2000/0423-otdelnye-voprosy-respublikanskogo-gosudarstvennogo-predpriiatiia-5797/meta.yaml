  title:
    rus: О Правилах проведения экспертизы предпроектной (технико-экономических обоснований) и проектной (проектно-сметной) документации на строительство независимо от источников финансирования, а также утверждения проектов, строящихся за счет государственных инвестиций
    kaz: '"Қаржыландыру көздерiне қарамастан құрылысқа арналған жобалау алдындағы (техника-экономикалық негiздемелер) және жобалау (жобалау-сметалық) құжаттамаға сараптама жүргiзу, сондай-ақ мемлекеттiк инвестициялар есебiнен салынып жатқан жобаларды бекiту ережесi туралы'

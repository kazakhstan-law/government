act_code: '5797'
requisite: Постановление Правительства Республики Казахстан от 24 апреля 2000 года N 632
title:
  rus: Отдельные вопросы Республиканского государственного предприятия "Государственная вневедомственная экспертиза проектов" Комитета по делам строительства Министерства энергетики, индустрии и торговли Республики Казахстан
  kaz: Қазақстан Республикасы Энергетика, индустрия және сауда министрлігінің Құрылыс істері жөніндегі комитеті "Жобалардың мемлекеттік ведомстводан тыс сараптамасы" республикалық мемлекеттік кәсіпорнының жекелеген мәселелері

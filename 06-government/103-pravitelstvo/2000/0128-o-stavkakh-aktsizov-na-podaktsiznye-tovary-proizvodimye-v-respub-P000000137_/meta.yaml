title:
  rus: О ставках акцизов на подакцизные товары, производимые в Республике Казахстан и ввозимые на таможенную территорию Республики Казахстан, реализуемые на территории Республики Казахстан
  kaz: Қазақстан Республикасында өндірілетін және Қазақстан Республикасының кеден аумағына әкелінетін, Қазақстан Республикасының аумағында сатылатын акцизделетін тауарларға арналған акциз ставкалары туралы

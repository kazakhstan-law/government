title:
  rus: Об утверждении Перечня участков недр (блоков) Республики Казахстан по твердым полезным ископаемым и углеводородному сырью, подлежащих выставлению на открытый конкурс инвестиционных программ Компетентным органом в 2000 году
  kaz: Құзыретті органның 2000 жылы инвестициялық бағдарламалардың ашық конкурсына қоюына жататын Қазақстан Республикасының қатты пайдалы қазбалар мен көмірсутегі шикізаты бойынша жер қойнауы учаскелерінің (блоктарының) тізбесін бекіту туралы

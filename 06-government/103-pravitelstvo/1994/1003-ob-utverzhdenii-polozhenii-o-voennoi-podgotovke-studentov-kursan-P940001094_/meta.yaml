title:
  rus: Об утверждении Положений о военной подготовке студентов (курсантов) высших учебных заведений по программе офицеров запаса, о военных кафедрах при высших учебных заведениях и перечня высших учебных заведений, в которых устанавливается военная подготовка студентов (курсантов) по программе офицеров запаса
  kaz: Жоғары оқу орындарының студенттерiн (курсанттарын) запастағы офицерлер бағдарламасы бойынша әскери даярлау туралы, жоғары оқу орындары жанындағы әскери кафедралар туралы ережелердi және запастағы офицерлер бағдарламасы бойынша студенттердiң (курсанттардың) әскери даярлығы белгiленген жоғары оқу орындарының тiзбесiн бекiту туралы

requisite: Постановление Кабинета Министров Республики Казахстан от 2 февраля 1994 года № 126. Утратило силу постановлением Правительства Республики Казахстан от 27 июля 2005 года № 781
title:
  rus: Об утверждении списка работ и профессий, дающих право на пенсию отдельным категориям рабочих управления "Спецшахтомонтаждегазация" производственного объединения "Карагандауголь" и комбината "Карагандашахтострой", независимо от возраста, при занятости на этих работах не менее 20 лет
  kaz: '"Қарағандыкөмір" өндірістік бірлестігінің "Арнайышахтамонтаждаугазсыздандыру" басқармасы мен "Қарағандышахтарқұрылысы" комбинаты жұмысшыларының жекелеген снаттарына осы жұмыстарда кемінде 20 жыл істегенде жасына қарамастан зейнетақы алуға құқық беретін жұмыстар мен мамандықтардың тізімін бекіту туралы'

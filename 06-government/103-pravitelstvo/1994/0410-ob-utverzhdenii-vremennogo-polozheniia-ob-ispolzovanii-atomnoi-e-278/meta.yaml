title:
  rus: Об утверждении временного положения об использовании атомной энегрии, ядерной деятельности, обращении с радиоактивными отходами и отработавшимим ядерными материалами, обеспечении радиационной безопасности населения Республики Казахстан
  kaz: Атом энергиясын, ядролық қызметті пайдалану, радиоактивті қалдықтар меня қолданылған ядролық материалдарды ұстау, Қазақстан Республикасы халқының радиациялық қәуіпсіздігін қамтамасыз ету туралы уақытша ережені бекіту туралы

act_code: '729'
requisite: Постановление Кабинета Министров Республики Казахстан от 11 июля 1994 г. N 777 Утратил силу - постановлением Правительства РК от 10.01.2002г. № 23 ~P020023
title:
  rus: Об утверждении Перечня видов работ в сфере архитектурно-градостроительной деятельности, подлежащих лицензированию, порядка государственного лицензирования архитектурно-градостроительной деятельности в Республике Казахстан и Положения о департаменте государственного лицензирования архитектурно-градостроительной деятельности при Министерстве строительства, жилья и застройки территорий Республики Казахстан
  kaz: Лицензиялауға жататын сәулет-қала құрылысы қызметiнiң жұмыс түрлерiнiң тiзбесiн, Қазақстан Республикасында сәулет-қала құрылысы қызметiн мемлекеттiк лицензиялау тәртiбiн және Қазақстан Республикасының құрылыс, тұрғын үй және аумақтарда құрылыс салу министрлiгi жанындағы сәулет-қала құрылысы қызметiн мемлекеттiк лицензиялау департаментi туралы ереженi бекiту туралы

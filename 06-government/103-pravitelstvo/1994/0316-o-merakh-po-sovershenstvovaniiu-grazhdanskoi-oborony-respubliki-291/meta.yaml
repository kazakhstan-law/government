  title:
    rus: О денежном содержании (заработной плате) военнослужащих Министерства обороны, органов национальной безопасности, сотрудников органов Государственного следственного комитета, органов внутренних дел и работников налоговой полиции органов налоговой службы Государственного налогового комитета Республики Казахстан, отдельных категорий лиц, не имеющих воинских и специальных званий
    kaz: Қазақстан Республикасы Қорғаныс министрлiгiнiң, ұлттық қауiпсiздiк органдарының әскери қызметкерлерiне, Мемлекеттiк тергеу комитетiнiң, iшкi iстер органдарының және Мемлекеттiк салық комитетi салық қызметi органдарының салық полициясы қызметкерлерiнiң, әскери және арнаулы атағы жоқ жекелеген санаттағы адамдарының ақшалай үлесi (жалақысы) туралы
  link: https://zan.gov.kz/client/#!/doc/107/rus

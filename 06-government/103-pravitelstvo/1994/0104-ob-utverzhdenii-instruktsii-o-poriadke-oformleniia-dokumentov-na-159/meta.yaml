requisite: Постановление Кабинета Министpов Республики Казахстан от 4 янваpя 1994 года № 20. Утратило силу постановлением Правительства Республики Казахстан от 21 января 2014 года № 19
title:
  rus: Об утверждении инструкции о порядке оформления документов на выход (выпуск) плавсредств, средств передвижения по льду с мест базирования и порядке оборудования причалов, пристаней и пунктов базирования плавстредств, средств передвижения по льду и правил пограничного режима в пунктах пропуска через государственную границу Республики Казахстан
  kaz: Жүзу құралдарының, мұз үстімен жүретін құралдардың орналасқан жерінен сапарға шығуына (шығарылуына) құжаттар ресімдеудің тәртібі және тоқтамаларды, айлақтар мен жүзу құралдарының, мұз үстімен жүретін құралдардың орналасқан пункттерін жабдықтау тәртібі туралы нұсқама мен Қазақстан Республикасының мемлекеттік шекарасы арқылы өткізу пункттеріндегі шекаралық режимнің ережелерін бекіту туралы

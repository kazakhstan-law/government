act_code: '13758'
requisite: Постановление Правительства Республики Казахстан от 12 декабря 2002 года № 1304
title:
  rus: Об утверждении Положения о казахстанской части совместных межправительственных комиссий (комитетов, советов) и их подкомиссий (подкомитетов, рабочих групп) по сотрудничеству с зарубежными странами
  kaz: Шет елдермен ынтымақтастық жөнiндегi бiрлескен үкiметаралық комиссиялардың (комитеттердiң, кеңестердiң) және олардың кіші комиссияларының (кіші комитеттерінің, жұмыс топтарының) қазақстандық бөлiгі туралы ереженi бекiту туралы

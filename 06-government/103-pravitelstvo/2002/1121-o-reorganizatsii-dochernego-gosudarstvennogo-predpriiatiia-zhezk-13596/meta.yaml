act_code: '13596'
requisite: Постановление Правительства Республики Казахстан от 21 ноября 2002 года N 1233
title:
  rus: О реорганизации Дочернего государственного предприятия "Жезказганредмет" Республиканского государственного предприятия "Национальный центр по комплексной переработке минерального сырья Республики Казахстан" Министерства индустрии и торговли Республики Казахстан
  kaz: Қазақстан Республикасы Индустрия және сауда министрлігінің "Қазақстан Республикасының минералдық шикізатты кешенді қайта өңдеу жөніндегі ұлттық орталығы" республикалық мемлекеттік кәсіпорнының "Жезқазғансирекмет" еншілес мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

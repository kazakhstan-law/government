act_code: '12462'
requisite: Постановление Правительства Республики Казахстан от 24 июня 2002 года N 688
title:
  rus: О создании государственных учреждений "Таможня "Семей" Таможенного комитета Министерства государственных доходов Республики Казахстан", "Таможня "Кордай" Таможенного комитета Министерства государственных доходов Республики Казахстан", "Таможня "Бейнеу" Таможенного комитета Министерства государственных доходов Республики Казахстан", "Таможня "Оскемен" Таможенного комитета Министерства государственных доходов Республики Казахстан"
  kaz: '"Қазақстан Республикасы Кедендiк бақылау агенттiгiнiң "Семей" кеденi", "Қазақстан Республикасы Кедендiк бақылау агенттiгiнiң "Қордай" кеденi", "Қазақстан Республикасы Кедендiк бақылау агенттiгiнiң "Бейнеу" кеденi", "Қазақстан Республикасы Кедендiк бақылау агенттiгiнiң "Өскемен" кеденi" мемлекеттiк мекемелерiн құру туралы'

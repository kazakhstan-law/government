    rus: Об утверждении Правил отнесения зданий и сооружений к технически сложным объектам и внесении изменения в постановление Правительства Республики Казахстан от 19 августа 2002 года № 918
    kaz: Ғимараттар мен құрылыстарды техникалық жағынан күрделі объектілерге жатқызу ережесін бекіту және Қазақстан Республикасы Үкіметінің 2002 жылғы 19 тамыздағы N 918 қаулысына өзгеріс енгізу туралы

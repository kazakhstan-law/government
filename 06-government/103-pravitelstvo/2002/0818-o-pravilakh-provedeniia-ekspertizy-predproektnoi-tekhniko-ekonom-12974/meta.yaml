  title:
    rus: Некоторые вопросы по проектному обеспечению строительства и дальнейшему совершенствованию системы государственных нормативов в области архитектурной, градостроительной, строительной деятельности и жилищно-коммунального хозяйства
    kaz: Құрылысты жобалық қамтамасыз ету және сәулет, қала құрылысы, құрылыс қызметi мен тұрғын үй-коммуналдық шаруашылық саласындағы мемлекеттiк нормативтер жүйесiн одан әрi жетiлдiру жөнiндегi кейбiр мәселелер

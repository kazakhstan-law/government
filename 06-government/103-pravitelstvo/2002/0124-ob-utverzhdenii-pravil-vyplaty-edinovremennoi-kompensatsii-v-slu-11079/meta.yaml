title:
  rus: Об утверждении Правил выплаты единовременной компенсации в случае гибели (смерти) или увечья сотрудника органов внутренних дел Республики Казахстан в период исполнения им служебных обязанностей или служебного долга
  kaz: Қазақстан Республикасының iшкi iстер органдары қызметкерінің қызметтiк мiндеттерiн немесе қызметтiк борышын атқару кезеңiнде оның қаза табуы (қайтыс болуы) немесе зақымдануы жағдайында бiржолғы өтемақы төлеудiң ережесiн бекiту туралы

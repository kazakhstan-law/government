act_code: '12263'
requisite: Постановление Правительства Республики Казахстан от 29 мая 2002 года № 593. Утратило силу постановлением Правительства Республики Казахстан от 28 августа 2012 года № 1091
title:
  rus: Об утверждении Правил о порядке выплаты денежной компенсации военнослужащим (за исключением военнослужащих срочной службы и курсантов военных (специальных) учебных заведений) для оплаты расходов на коммунальные услуги, за исключением централизованного отопления в закрытых и обособленных военных городках, на пограничных заставах и в комендатурах
  kaz: Әскери қызметшiлерге (мерзiмдi қызметтегi әскери қызметшiлерден және әскери (арнаулы) оқу орындарының курсанттарынан баспа) жабық және оқшауланған әскери қалашықтардағы, шекара заставаларындағы және комендатуралардағы орталықтандырылған жылудан басқа, коммуналдық қызметтер шығыстарын төлеу үшiн ақшалай өтемақы төлеу тәртiбi туралы ереженi бекiту туралы

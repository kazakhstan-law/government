  title:
    rus: О признании утратившими силу пункта 1 постановления Правительства Республики Казахстан от 5 апреля 2002 года № 407 «О мерах по реализации Закона Республики Казахстан «Об охранной деятельности» и постановления Правительства Республики Казахстан от 17 июня 2015 года № 454 «О внесении изменений в постановление Правительства Республики Казахстан от 5 апреля 2002 года № 407 «О мерах по реализации Закона Республики Казахстан «Об охранной деятельности»
    kaz: «Күзет қызметі туралы» Қазақстан Республикасының Заңын іске асыру жөніндегі шаралар туралы» Қазақстан Республикасы Үкіметінің 2002 жылғы 5 сәуірдегі № 407 қаулысы 1-тармағының және «Күзет қызметі туралы» Қазақстан Республикасының Заңын іске асыру жөніндегі шаралар туралы» Қазақстан Республикасы Үкіметінің 2002 жылғы 5 сәуірдегі № 407 қаулысына өзгерістер енгізу туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 17 маусымдағы № 454 қаулысының күші жойылды деп тану туралы

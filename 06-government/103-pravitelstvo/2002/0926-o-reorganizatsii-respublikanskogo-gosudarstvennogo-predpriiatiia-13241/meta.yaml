title:
  rus: О реорганизации Республиканского государственного предприятия Международный аэропорт Астана" Министерства транспорта и коммуникаций Республики Казахстан
  kaz: Қазақстан Республикасы Көлiк және коммуникациялар министрлігінiң "Астана халықаралық әуежайы" республикалық мемлекеттiк кәсiпорнын қайта ұйымдастыру туралы

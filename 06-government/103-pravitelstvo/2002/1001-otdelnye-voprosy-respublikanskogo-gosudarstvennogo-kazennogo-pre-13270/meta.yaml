title:
  rus: Отдельные вопросы Республиканского государственного казенного предприятия "Центр лекарственных средств "Дарi-дармек" Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігiнің "Дәрi-дәрмек" дәрiлiк құралдаp орталығы" республикалық мемлекеттiк қазыналық кәсіпорнының жекелеген мәселелерi

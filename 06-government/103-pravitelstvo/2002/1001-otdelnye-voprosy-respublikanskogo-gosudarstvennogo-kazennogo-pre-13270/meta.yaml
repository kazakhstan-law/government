  code: '41484'
  requisite: Постановление Правительства Республики Казахстан от 11 сентября 2008 года N 837
  title:
    rus: О создании дочерних государственных предприятий Республиканского государственного предприятия на праве хозяйственного ведения "Национальный центр экспертизы лекарственных средств, изделий медицинского назначения и медицинской техники" Министерства здравоохранения Республики Казахстан
    kaz: Қазақстан Республикасы Денсаулық сақтау министрлігінің "Дәрілік заттарды, медициналық мақсаттағы бұйымдарды және медицина техникасын сараптау ұлттық орталығы" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнының еншілес мемлекеттік кәсіпорындарын құру туралы
  link: https://zan.gov.kz/client/#!/doc/41484/rus

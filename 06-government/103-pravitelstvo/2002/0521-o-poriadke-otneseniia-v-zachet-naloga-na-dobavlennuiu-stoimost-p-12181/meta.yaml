requisite: Постановление Правительства Республики Казахстан от 22 мая 2002 года N 556. Утратило силу - постановлением Правительства РК от 26 мая 2005 г. N 516
title:
  rus: О порядке отнесения в зачет налога на добавленную стоимость, подлежащего уплате поставщикам товаров, импортируемых в Республику Казахстан, в отношении которых в соответствии с международным договором применяется иной порядок налогообложения экспорта и импорта товаров
  kaz: Халықаралық шартқа сәйкес оларға қатысты тауарлар экспорты мен импортына салық салудың өзгеше тәртібі қолданылатын, Қазақстан Республикасына импортталатын тауарларды берушілерге төленуге тиісті қосылған құн салығын есепке жатқызу тәртібі туралы

    kaz: Пестицидтерді (улы химикаттарды) аэрозольдік және фумигациялық әдістермен қолдану жөніндегі қызметті жүзеге асыратын жеке және заңды тұлғаларға қойылатын біліктілік талаптарын бекіту туралы

title:
  rus: Об утверждении Положения о прохождении военной службы по контракту на должностях солдат, матросов, сержантов и старшин в Вооруженных Силах, других войсках и воинских формированиях Республики Казахстан
  kaz: Қазақстан Республикасының Қарулы Күштерiнде, басқа да әскерлерi мен әскери құралымдарында солдаттар, матростар, сержанттар мен старшиналар лауазымдарында келiсiм-шарт бойынша әскери қызметтi өткеру туралы ереженi бекiту туралы

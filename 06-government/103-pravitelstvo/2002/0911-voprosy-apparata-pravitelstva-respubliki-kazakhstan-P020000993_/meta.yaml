  requisite: Постановление Правительства Республики Казахстан от 6 января 2023 года № 9
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 11 сентября 2002 года № 993 «Вопросы Канцелярии Премьер-Министра Республики Казахстан» и от 31 декабря 2021 года № 997 дсп «Об утверждении Положения о Государственной фельдъегерской службе Республики Казахстан, Правил организации деятельности Государственной фельдъегерской службы Республики Казахстан и предоставления услуг государственной фельдъегерской связи, а также перечня пользователей услуг государственной фельдъегерской связи и признании утратившими силу некоторых решений Правительства Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасының Премьер-Министрі Кеңсесінің мәселелері» туралы 2002 жылғы 11 қыркүйектегі № 993 және «Қазақстан Республикасының Мемлекеттік фельдъегерлік қызметі туралы ережені, Қазақстан Республикасы Мемлекеттік фельдъегерлік қызметінің жұмысын ұйымдастыру және мемлекеттік фельдъегерлік байланыстың көрсетілетін қызметтерін ұсыну қағидаларын, сондай-ақ мемлекеттік фельдъегерлік байланыстың көрсетілетін қызметтерін пайдаланушылар тізбесін бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» 2021 жылғы 31 желтоқсандағы № 997қбп қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178512/rus

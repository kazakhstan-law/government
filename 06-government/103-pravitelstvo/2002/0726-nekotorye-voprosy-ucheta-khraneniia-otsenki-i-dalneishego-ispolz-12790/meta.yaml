  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 26 июля 2002 года № 833 "Некоторые вопросы учета, хранения, оценки и дальнейшего использования имущества, обращенного (подлежащего обращению) в собственность государства по отдельным основаниям" и от 8 октября 2007 года № 919 "Об утверждении Правил управления бесхозяйными опасными отходами, признанными решением суда поступившими в республиканскую собственность"
    kaz: Қазақстан Республикасы Үкіметінің "Жекелеген негіздер бойынша мемлекет меншігіне айналдырылған (айналдырылуы тиіс) мүлікті есепке алудың, сақтаудың, бағалаудың және одан әрі пайдаланудың кейбір мәселелері" туралы 2002 жылғы 26 шілдедегі № 833 және "Сот шешімімен республикалық меншікке түсті деп танылған иесіз қауіпті қалдықтарды басқару ережесін бекіту туралы" 2007 жылғы 8 қазандағы № 919 қаулыларына өзгерістер енгізу туралы

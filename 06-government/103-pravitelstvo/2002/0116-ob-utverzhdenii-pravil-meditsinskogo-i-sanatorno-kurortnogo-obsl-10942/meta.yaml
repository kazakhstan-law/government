title:
  rus: Об утверждении Правил медицинского и санаторно-курортного обслуживания сотрудников органов внутренних дел и членов их семей, проживающих совместно с ними, а также пенсионеров органов внутренних дел
  kaz: Ішкi iстер органдарының қызметкерлерiне және олармен бiрге тұратын отбасы мүшелерiне, сондай-ақ ішкi істер органдарының зейнеткерлерiне медициналық және санаторлық-курорттық қызмет көрсету тәртiбiн бекiту туралы

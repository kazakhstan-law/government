act_code: '13680'
requisite: Постановление Правительства Республики Казахстан от 29 ноября 2002 года N 1270
title:
  rus: О создании государственных учреждений Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан
  kaz: Қазақстан Республикасының Әділет министрлігі Қылмыстық-атқару жүйесі комитетінің мемлекеттік мекемелерін құру туралы

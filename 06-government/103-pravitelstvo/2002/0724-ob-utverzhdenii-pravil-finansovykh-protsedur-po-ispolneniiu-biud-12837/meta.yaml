  kaz: Мемлекеттiк бюджет есебiнен ұсталатын мемлекеттiк мекемелер үшiн бюджеттiң атқарылуы және есептiлiк нысандарын жүргізу (мерзiмдiк және жылдық) жөнiндегі қаржылық рәсімдердің ережесін бекiту туралы

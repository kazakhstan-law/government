title:
  rus: Об утверждении Правил присвоения статуса племенного завода, племенного хозяйства, племенного центра и дистрибьютерного центра, а также проведения аттестации (переаттестации) деятельности субъектов в области племенного животноводства
  kaz: Acыл тұқымды мал зауыты, асыл тұқымды мал шаруашылығы, мал тұқымын асылдандыру орталығы және дистрибьютерлiк орталық мәртебесiн беру, сондай-ақ асыл тұқымды мал шаруашылығы саласындағы субъектілердiң қызметiне аттестаттау (қайта аттестаттау) өткiзу ережесiн бекiту туралы

act_code: '14020'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2002 года N 1435
title:
  rus: О номенклатуре товаров и услуг и их объемах (в процентном выражении), закупаемых организаторами конкурса у организаций, производящих товары и услуги, создаваемых общественными объединениями инвалидов Республики Казахстан на 2003 год
  kaz: Қазақстан Республикасы мүгедектерiнің қоғамдық бiрлестiктерi құратын ұйымдардан өндірiлетiн тауарлар мен көрсететiн қызметтерді конкурсты ұйымдастырушылар сатып алатын тауарлар мен көрсетілетiн қызметтердің 2003 жылға арналған номенклатурасы мен олардың көлемi (пайыз көрінісiнде) бекiту туралы

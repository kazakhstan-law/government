  kaz: Мұнай операцияларын жүзеге асыратын мердігерлермен келiсiм-шарттарда Ұлттық компанияның келiсiм-шарттары міндеттi үлестiк қатысуы арқылы мемлекеттiк мүдделерді білдіру ережесiн бекiту туралы

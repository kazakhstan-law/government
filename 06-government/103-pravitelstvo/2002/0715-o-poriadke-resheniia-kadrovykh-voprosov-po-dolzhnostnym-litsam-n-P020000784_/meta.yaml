  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 16 июля 2002 года № 784 "О некоторых вопросах совершенствования механизма решения кадровых вопросов по должностным лицам, назначаемым Правительством Республики Казахстан или по согласованию с ним"
    kaz: '"Қазақстан Республикасының Үкіметі тағайындайтын немесе онымен келісім бойынша тағайындалатын лауазымды адамдар бойынша кадр мәселелерін шешу тетігін жетілдірудің кейбір мәселелері туралы" Қазақстан Республикасы Үкіметінің 2002 жылғы 16 шілдедегі № 784 қаулысына өзгерістер енгізу туралы'

  kaz: Азаматтық пиротехникалық заттарды және олардың қолданылуымен жасалған бұйымдарды әзiрлеуге, өндiруге, жөндеуге, сатуға, сатып алуға, коллекциялауға, экспонаттауға байланысты қызметтi лицензиялау жөнiндегi бiлiктiлiк талаптарын бекiту туралы

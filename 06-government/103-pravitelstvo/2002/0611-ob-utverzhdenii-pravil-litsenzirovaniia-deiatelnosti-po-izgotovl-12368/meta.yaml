title:
  rus: Об утверждении Правил лицензирования деятельности по изготовлению, производству, переработке и оптовой реализации средств и препаратов дезинфекции, дезинсекции, дератизации, а также видов работ и услуг, связанных с их использованием
  kaz: Дезинфекциялау, дезинсекциялау, дератизациялау құралдары мен препараттарын дайындау, өндіру, қайта өңдеу және көтерме сату жөнiндегi қызметтi, сондай-ақ оларды пайдалануға байланысты жұмыстар мен көрсетiлетiн қызметтер түрлерiн лицензиялау ережесiн бекiту туралы

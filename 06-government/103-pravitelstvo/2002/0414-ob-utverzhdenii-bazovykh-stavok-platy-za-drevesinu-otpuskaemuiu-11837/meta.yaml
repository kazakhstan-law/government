    kaz: Қазақ КСР Министрлер Кабинетiнiң, Қазақстан Республикасы Министрлер Кабинетiнiң, Қазақстан Республикасы Үкiметiнiң, Қазақстан Республикасы Премьер-Министрiнiң кейбiр шешiмдерiнiң күшi жойылды деп тану және мемлекеттiк органдардың жекелеген нормативтiк құқықтық кесiмдерiнiң қолданылуын жою туралы

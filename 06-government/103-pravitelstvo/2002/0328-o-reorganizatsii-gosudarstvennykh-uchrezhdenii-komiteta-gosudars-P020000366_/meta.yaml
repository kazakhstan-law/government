title:
  rus: О реорганизации государственных учреждений Комитета государственного санитарно-эпидемиологического надзора Министерства здравоохранения Республики Казахстан "Актюбинская противочумная станция" и "Шымкентская противочумная станция"
  kaz: Қазақстан Республикасының Денсаулық сақтау министрлiгi Мемлекеттiк санитарлық-эпидемиологиялық қадағалау комитетiнiң "Ақтөбе обаға қарсы күрес станциясы" мен "Шымкент обаға қарсы күрес станциясы" мемлекеттiк мекемелерiн қайта ұйымдастыру туралы

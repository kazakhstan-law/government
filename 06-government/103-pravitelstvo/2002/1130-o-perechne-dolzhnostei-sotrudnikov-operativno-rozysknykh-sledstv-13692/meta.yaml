title:
  rus: О перечне должностей сотрудников оперативно-розыскных, следственных, строевых подразделений органов финансовой полиции Республики Казахстан, имеющих право на денежную компенсацию для оплаты расходов на содержание жилища и коммунальных услуг
  kaz: Қазақстан Республикасы қаржы полициясы органдарының жедел iздестiру, тергеу, саптық бөлiмшелерiнiң тұрғын жай ұстау және коммуналдық қызметтер шығыстарын төлеу үшiн ақшалай өтемақыға құқығы бар қызметкерлерi лауазымдарының тiзбесi туралы

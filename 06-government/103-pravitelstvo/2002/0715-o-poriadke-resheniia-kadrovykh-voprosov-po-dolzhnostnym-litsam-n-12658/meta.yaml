title:
  rus: О порядке решения кадровых вопросов по должностным лицам, назначаемым Правительством Республики Казахстан, Премьер-Министром Республики Казахстан, по согласованию с ним или по его представлению
  kaz: Қазақстан Республикасының Үкiметi, Қазақстан Республикасының Премьер-Министрі тағайындайтын, онымен келiсу бойынша немесе оның ұсынуымен тағайындалатын лауазымды адамдар бойынша кадр мәселелерiн шешу тәртібі туралы

    kaz: «Қазақстан Республикасының Үкіметі, Қазақстан Республикасының Премьер-Министрі тағайындайтын, онымен келісу бойынша немесе оның ұсынуымен тағайындалатын лауазымды адамдар бойынша кадр мәселелерін шешу тәртібі туралы» Қазақстан Республикасы Үкіметінің 2002 жылғы 16 шілдедегі № 784 қаулысына өзгеріс енгізу туралы

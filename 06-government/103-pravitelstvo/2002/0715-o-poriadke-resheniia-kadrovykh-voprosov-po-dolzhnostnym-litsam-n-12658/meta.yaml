  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 16 июля 2002 года № 784 «О порядке решения кадровых вопросов по должностным лицам, назначаемым Правительством Республики Казахстан, Премьер-Министром Республики Казахстан, по согласованию с ним или по его представлению» и от 29 декабря 2020 года № 908 «О некоторых вопросах приватизации на 2021 – 2025 годы»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасының Үкiметi, Қазақстан Республикасының Премьер-Министрі тағайындайтын, онымен келiсу бойынша немесе оның ұсынуымен тағайындалатын лауазымды адамдар бойынша кадр мәселелерiн шешу тәртібі туралы» 2002 жылғы 16 шілдедегі № 784 және «Жекешелендірудің 2021 – 2025 жылдарға арналған кейбір мәселелері туралы» 2020 жылғы 29 желтоқсандағы № 908 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/190761/rus

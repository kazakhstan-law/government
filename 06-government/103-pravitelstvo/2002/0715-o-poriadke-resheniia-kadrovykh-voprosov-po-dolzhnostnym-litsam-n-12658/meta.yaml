caused_by:
  code: '67016'
  requisite: Постановление Правительства Республики Казахстан от 31 июля 2012 года № 1011. Утратил силу постановлением Правительства Республики Казахстан от 22 февраля 2023 года № 149 (вводится в действие со дня его подписания)
  title:
    rus: Об утверждении Положения о Торговом представительстве Республики Казахстан в Российской Федерации, внесении дополнения в постановление Правительства Республики Казахстан от 16 июля 2002 года № 784 "О некоторых вопросах совершенствования механизма решения кадровых вопросов по должностным лицам, назначаемым Правительством Республики Казахстан или по согласованию с ним" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасының Ресей Федерациясындағы Сауда өкілдiгi туралы ережені бекіту, "Қазақстан Республикасының Үкiметi тағайындайтын немесе онымен келiсiм бойынша тағайындалатын лауазымды адамдар бойынша кадр мәселелерiн шешу тетiгiн жетiлдiрудiң кейбiр мәселелерi туралы" Қазақстан Республикасы Үкіметінің 2002 жылғы 16 шілдедегі № 784 қаулысына толықтыру енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/67016/rus

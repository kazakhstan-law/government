    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан в области пожарной безопасности
    kaz: Қазақстан Республикасы Үкіметінің өрт қауіпсіздігі саласындағы кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

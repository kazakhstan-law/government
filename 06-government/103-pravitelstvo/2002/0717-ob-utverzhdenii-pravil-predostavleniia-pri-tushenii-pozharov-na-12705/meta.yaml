act_code: '12705'
requisite: Постановление Правительства Республики Казахстан от 18 июля 2002 года № 801. Утратило силу постановлением Правительства Республики Казахстан от 2 апреля 2015 года № 173
title:
  rus: Об утверждении Правил предоставления при тушении пожаров на территориях организаций необходимых сил и средств, горюче-смазочных материалов, а также продуктов питания и мест отдыха для подразделений государственной противопожарной службы, участвующих в выполнении боевых действий по тушению пожаров и привлеченных к тушению пожаров сил
  kaz: Өрт сөндiру жөнiндегі жауынгерлiк iс-қимылдарды орындауға қатысатын мемлекеттік өртке қарсы қызмет бөлiмшелерi мен өрт сөндiруге тартылған күштер үшін ұйымдардың аумақтарында өрт cөндіpy кезiнде қажеттi күштер мен құралдарды, жанар-жағар май материалдарын, сондай-ақ тамақ өнiмдерiн және демалыс орындарын ұсыну ережесiн бекiту туралы

title:
  rus: Об утверждении размеров полевого довольствия работников, занятых на геологоразведочных, топографо- геодезических и изыскательских работах в полевых условиях, не подлежащих налогообложению
  kaz: Дала жағдайында геологиялық барлау, топографиялық-геодезиялық және iздестiру жүмыстарымен шұғылданатын қызметкерлердің далалық жабдықталым ақшасының салық салынуға жатпайтын мөлшерлерiн бекiту туралы

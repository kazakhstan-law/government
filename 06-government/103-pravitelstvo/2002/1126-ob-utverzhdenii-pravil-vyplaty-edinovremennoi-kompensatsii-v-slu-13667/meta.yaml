act_code: '13667'
requisite: Постановление Правительства Республики Казахстан от 26 ноября 2002 года N 1260. Утратило силу постановлением Правительства Республики Казахстан от 20 октября 2011 года № 1192 (вводится в действие по истечении десяти календарных дней со дня первого официального опубликования)
title:
  rus: Об утверждении Правил выплаты единовременной компенсации в случае гибели (смерти) или получения увечья сотрудником органов финансовой полиции Республики Казахстан в период исполнения им служебных обязанностей или служебного долга и для погребения умерших или погибших сотрудников и пенсионеров органов финансовой полиции
  kaz: Қазақстан Республикасы қаржы полициясы органдарының қызметкерi қызметтiк мiндеттерiн немесе қызметтiк борышын aтқapу қезеңiнде қаза тапқан (өлген) немесе мертiккен жағдайда және қайтыс болған немесе қаза болған қаржы полициясы органдарының қызметкерлерi мен зейнеткерлерiн жерлеу үшiн бiржолғы өтемақы төлеу ережесiн бекiту туралы

act_code: '1697'
requisite: Постановление Правительства Республики Казахстан от 21 сентября 1997 г. N 1366. Утратило силу - постановлением Правительства РК от 14 июня 2001 г. N 819
title:
  rus: Об утверждении Положения о порядке координации деятельности центральных исполнительных органов Республики Казахстан в области государственного внешнего заимствования и управления государственным внешним долгом по внешним займам Правительства Республики Казахстан, порядка и условий выдачи государственных гарантий Республики Казахстан и Положения о порядке регистрации государственных внешних займов и негосударственных внешних займов, имеющих государственные гарантии Республики Казахстан
  kaz: Қазақстан Республикасы орталық атқарушы органдарының мемлекеттiк сырттан қарыз алу және Қазақстан Республикасы Үкiметiнiң сыртқы заемдары бойынша мемлекеттiк сыртқы борыштарды басқару саласындағы қызметiн үйлестiрудiң тәртiбi туралы ереженi, Қазақстан Республикасының мемлекеттiк кепiлдiктерiн берудiң тәртiбi мен шарттарын және Қазақстан Республикасының мемлекеттiк кепiлдiгi бар, мемлекеттiк сыртқы заемдар мен мемлекеттiк емес сыртқы заемдарды тiркеудiң тәртiбi туралы ереженi бекiту туралы

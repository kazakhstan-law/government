title:
  rus: Об утверждении Правил и условий лицензирования производства этилового спирта и алкогольной продукции, хранения и реализации этилового спирта, а также хранения и оптовой реализации алкогольной продукции (кроме пива)
  kaz: Этил спиртi мен алкоголь өнiмiн өндiрудi, этил спиртiн сақтау мен сатуды, сондай-ақ алкоголь өнiмiн (сырадан басқа) сақтау мен көтерме сатуды лицензиялаудың ережесі мен шарттарын бекiту туралы

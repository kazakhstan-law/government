  kaz: Қазақстан Республикасының Ауыл шаруашылығы министрлiгiндегi Орман және аң шаруашылығы комитетiнiң мемлекеттiк орман күзетi және аң шаруашылығы қызметкерлерiне арналған айырым белгiлерiнiң, пiшiмдi киiмдердiң сипаттамасы және оларды беру нормаларын бекiту туралы

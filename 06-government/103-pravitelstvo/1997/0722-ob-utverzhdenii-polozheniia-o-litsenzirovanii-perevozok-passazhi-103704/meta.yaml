title:
  rus: Об утверждении Положения о лицензировании перевозок пассажиров и грузов воздушным транспортом и аэропортовской деятельности, связанной с обслуживанием воздушных судов, пассажиров и грузов в аэропортах Республики Казахстан
  kaz: Жолаушылар мен жүктердi әуе көлiгiмен тасымалдауды және Қазақстан Республикасының әуежайларында әуе кемелерiне, жолаушыларға және жүктерге қызмет көрсетуге байланысты әуежайлық қызметтердi лицензиялау туралы ереженi бекiту туралы

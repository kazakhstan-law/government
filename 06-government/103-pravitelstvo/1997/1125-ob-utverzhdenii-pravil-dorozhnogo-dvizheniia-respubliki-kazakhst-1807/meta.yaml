title:
  rus: Об утверждении Правил дорожного движения Республики Казахстан, Основных положений по допуску транспортных средств к эксплуатации и обязанностей должностных лиц и участников дорожного движения по обеспечению безопасности дорожного движения и Перечня оперативных и специальных служб, транспорт которых подлежит оборудованию специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам
  kaz: Қазақстан Республикасы Жол қозғалысының ережелерiн, Көлiк құралдарын пайдалануға жiберу жөнiндегi негiзгi ережелер мен жол қозғалысының қауiпсiздiгiн қамтамасыз ету бойынша лауазымды адамдар мен жол қозғалысына қатысушылардың мiндеттерiн және Арнайы түстiк-графикалық схемалар бойынша арнайы түстiк және дыбыстық белгiлермен жабдықталуға және боялуға жататын жедел және арнайы қызметтердiң, көлiктiң тiзбесiн бекiту туралы

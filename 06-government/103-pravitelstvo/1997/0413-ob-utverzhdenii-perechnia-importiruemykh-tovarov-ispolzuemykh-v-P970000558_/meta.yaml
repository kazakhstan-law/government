requisite: Постановление Правительства Республики Казахстан от 14 апреля 1997 года N 558. Утратило силу - постановлением Правительства РК от 19 марта 2003 г. N 269
title:
  rus: Об утверждении перечня импортируемых товаров, используемых в сельскохозяйственном производстве, а также импортируемых оборудования, сырья, материалов, запасных частей, медикаментов, за исключением освобожденных в соответствии с Законом Республики Казахстан "О налогах и других обязательных платежах в бюджет", по которым налог на добавленную стоимость уплачивается в порядке, устанавливаемом Министерством государственных доходов по согласованию с Министерством финансов Республики Казахстан
  kaz: Қосылған құнға салынатын салығы Қазақстан Республикасының Қаржы министрлігімен келісім бойынша Мемлекеттік кіріс министрлігі белгілеген тәртіппен төленетін "Салық және бюджетке төленетін басқа да міндетті төлемдер туралы" Қазақстан Республикасының Заңына сәйкес босатылғандарды қоспағанда, ауыл шаруашылығы өндірісінде пайдаланылатын импортталған тауарлардың, сондай-ақ импортталған жабдықтардың, шикізаттардың, материалдардың, қосалқы бөлшектердің, дәрі-дәрмектердің тізбесін бекіту туралы <*>

  title:
    rus: Об утверждении Правил импорта, экспорта, реализации и использования специальных технических средств для проведения специальных оперативно-розыскных мероприятий, а также специальных материалов и оборудования для их производства в Республике Казахстан
    kaz: Арнаулы жедел-iздестiру шараларын жүргiзуге арналған арнайы техникалық құралдарды, сондай-ақ оларды Қазақстан Республикасында өндiру үшiн арнайы материалдар мен жабдықтарды импорттау, экспорттау, өткiзу және пайдалану ережесiн бекiту туралы

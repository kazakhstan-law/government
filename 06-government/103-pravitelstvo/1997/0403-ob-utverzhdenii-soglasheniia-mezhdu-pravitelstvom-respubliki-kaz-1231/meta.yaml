act_code: '1231'
requisite: Постановление Правительства Республики Казахстан от 4 апреля 1997 г. N 476
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Федеративной Республики Германия о сотрудничестве в борьбе с организованной преступностью, терроризмом и другими опасными видами преступлений
  kaz: Қазақстан Республикасының Үкiметi мен Германия Федеративтiк Республикасының Үкiметi арасындағы Ұйымдасқан қылмысқа, терроризмге және қылмыстың басқа да қауiптi түрлерiне қарсы күрестегi ынтымақтастық туралы келiсiмдi бекiту туралы

requisite: Постановление Правительства Республики Казахстан от 4 марта 1997 г. N 299. Утратило силу - постановлением Правительства РК от 8 октября 2003 г. N 1037
title:
  rus: Об утверждении Правил о порядке определения подлежащих возмещению потерь сельскохозяйственного и лесохозяйственного производства и убытков, причиненных собственникам или землепользователям при изъятии сельскохозяйственных и лесных угодий для использования их в целях, не связанных с ведением сельского и лесного хозяйства
  kaz: Ауыл және орман шаруашылығын жүргiзуге қатысы жоқ мақсаттарға пайдалану үшiн ауыл шаруашылығы және орманды жерлердi алған кезде ауыл шаруашылығы мен орман шаруашылығы өндiрiсiне келтiрiлген зиянды және меншiк иелерi мен жер пайдаланушыларға келтiрiлген, өтеуге жататын шығындарды айқындау тәртiбi туралы Ереженi бекiту туралы

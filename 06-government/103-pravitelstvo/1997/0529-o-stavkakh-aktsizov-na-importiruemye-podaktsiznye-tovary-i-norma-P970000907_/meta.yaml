title:
  rus: О ставках акцизов на импортируемые подакцизные товары и нормах провоза физическими лицами через таможенную границу Республики Казахстан подакцизных товаров, которые не подлежат обложению акцизами
  kaz: Импортталатын акцизделетiн тауарларға арналған акциздердiң ставкалары және жеке адамдардың Қазақстан Республикасының кеден шекарасы арқылы алып өтетiн, акциз салуға жатпайтын акцизделетiн тауарлардың нормалары туралы

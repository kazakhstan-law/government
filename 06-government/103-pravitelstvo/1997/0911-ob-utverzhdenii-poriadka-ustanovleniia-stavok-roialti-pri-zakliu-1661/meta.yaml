  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан по вопросам налогообложения недропользователей и признании утратившим силу постановления Правительства Республики Казахстан от 1 июня 1995 года № 764
    kaz: Қазақстан Республикасы Yкiметінің жер қойнауын пайдаланушыларға салық салу мәселелерi бойынша кейбiр шешімдерiне өзгерiстер мен толықтырулар енгізу және Қазақстан Республикасы Үкiметінің 1995 жылғы 1 маусымдағы № 764 қаулысының күшi жойылды деп тану туралы

act_code: '1661'
requisite: Постановление Правительства Республики Казахстан от 12 сентября 1997 года № 1330. Утратило силу постановлением Правительства Республики Казахстан от 9 февраля 2005 года № 124
title:
  rus: Об утверждении Порядка установления ставок роялти при заключении контрактов на недропользование в Республике Казахстан, Порядка определения внутренней нормы прибыли для исчисления налога на сверхприбыль и Порядка определения подписного бонуса и исчисления бонуса коммерческого обнаружения при заключении контрактов на недропользование в Республике Казахстан
  kaz: Қазақстан Республикасында Жер қойнауын пайдалануға арналған келiсiм-шарттарды жасау кезiнде роялтидiң ставкасын белгiлеу тәртiбiн, Үстеме табысқа салық салуды есептеу үшiн пайданың iшкi нормаларын анықтау тәртiбiн және Қазақстан Республикасында жердi пайдалануға арналған келiсiм-шарттарды жасау кезiнде жазылу бонусын айқындау мен коммерциялық табу бонусын есептеу тәртiбiн бекiту туралы

act_code: '1805'
requisite: Постановление Правительства Республики Казахстан от 26 ноября 1997 года № 1659
title:
  rus: Об утверждении Положения о национальном операторе по экспорту и импорту урана и его соединений, ядерного топлива для атомных энергетических станций, специального оборудования и технологий, материалов двойного применения
  kaz: Уран мен оның қосылыстарының, атом энергетикасы станцияларына арналған ядролық отынның, арнаулы жабдықтар мен технологиялардың, қос мақсатта қолданылатын материалдардың экспорты мен импорты жөнiндегi ұлттық оператор туралы ереженi бекiту туралы

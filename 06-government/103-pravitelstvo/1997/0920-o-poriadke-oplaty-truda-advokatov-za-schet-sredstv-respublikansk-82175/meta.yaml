act_code: '82175'
requisite: Постановление Правительства Республики Казахстан от 21 сентября 1997 г. N 1361
title:
  rus: О порядке оплаты труда адвокатов за счет средств республиканского бюджета
  kaz: Республикалық бюджет қаражатының есебiнен адвокаттардың еңбегiне ақы төлеудiң ережесi туралы

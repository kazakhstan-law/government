  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 25 ноября 1997 года № 1650 "Об утверждении Правил дорожного движения Республики Казахстан, Основных положений по допуску транспортных средств к эксплуатации и обязанностей должностных лиц и участников дорожного движения по обеспечению безопасности дорожного движения и Перечня оперативных и специальных служб, транспорт которых подлежит оборудованию специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам"
    kaz: '"Қазақстан Республикасы Жол қозғалысының ережелерін, Көлік құралдарын пайдалануға жіберу жөніндегі негізгі ережелер мен жол қозғалысының қауіпсіздігін қамтамасыз ету бойынша лауазымды адамдар мен жол қозғалысына қатысушылардың міндеттерін және Арнайы түстік-графикалық схемалар бойынша арнайы түстік және дыбыстық белгілермен жабдықталуға және боялуға жататын жедел және арнайы қызметтердің, көліктің тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 1997 жылғы 25 қарашадағы № 1650 қаулысына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/61848/rus

title:
  rus: Вопросы Агентства по стратегическому планированию и реформам Республики Казахстан, создания республиканских государственных предприятий "Казпатент" и "Информационно-вычислительный центр Комитета по статистике и анализу Агентства по стратегическому планированию и реформам Республики Казахстан"
  kaz: Қазақстан Республикасының Стратегиялық жоспарлау және реформалар жөнiндегi агенттiгiнiң, "Қазпатент" және "Қазақстан Республикасының Стратегиялық жоспарлау және реформалар жөнiндегi агенттiгiнiң Статистика және талдау жөнiндегi комитетiнiң Ақпараттық-есептеу орталығы" республикалық мемлекеттiк кәсiпорындарын құру мәселелерi

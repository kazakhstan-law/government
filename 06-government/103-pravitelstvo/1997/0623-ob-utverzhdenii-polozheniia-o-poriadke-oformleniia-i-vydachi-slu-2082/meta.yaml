title:
  rus: Об утверждении Положения о порядке оформления и выдачи служебных удостоверений руководителям центральных исполнительных органов, ведомств Республики Казахстан, работникам Канцелярии Премьер-Министра Республики Казахстан
  kaz: Қазақстан Республикасының орталық атқарушы органдарының, ведомстволарының басшыларына, Қазақстан Республикасының Премьер-Министрi Кеңсесiнiң қызметкерлерiне қызмет куәлiктерiн ресiмдеудiң және берудiң тәртiбi туралы ереженi бекiту туралы

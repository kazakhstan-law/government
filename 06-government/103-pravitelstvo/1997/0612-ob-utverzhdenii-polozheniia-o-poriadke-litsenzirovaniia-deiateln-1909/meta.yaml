act_code: '1909'
requisite: Постановление Правительства Республики Казахстан от 13 июня 1997 года № 967. Утратило силу постановлением Правительства Республики Казахстан от 23 июня 2007 года № 528
title:
  rus: Об утверждении Положения о порядке лицензирования деятельности в области разработки, производства, ремонта и реализации криптографических средств защиты информации, специальных технических средств для проведения специальных оперативно-розыскных мероприятий и об утверждении квалификационных требований в Республике Казахстан
  kaz: Қазақстан Республикасында арнайы жедел-iздестiру шараларын жүргiзуге арналған ақпаратты қорғаудың криптографиялық құралдарын, арнаулы техникалық құралдарын әзiрлеу, шығару, жөндеу және сату саласындағы қызметтi лицензиялаудың тәртiбi және бiлiктiлiк талаптары туралы ереженi бекiту туралы

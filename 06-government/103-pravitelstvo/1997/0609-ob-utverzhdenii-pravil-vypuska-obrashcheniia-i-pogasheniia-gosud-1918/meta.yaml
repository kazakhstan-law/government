requisite: Постановление Правительства Республики Казахстан от 10 июня 1997 г. N 945. Утратило силу с момента последнего погашения государственных ценных бумаг, выпущенных до даты принятия настоящего постановления, - постановлением Правительства РК от 8 сентября 2004 г. N 941
title:
  rus: Об утверждении Правил выпуска, обращения и погашения государственных среднесрочных казначейских обязательств Республики Казахстан со сроком обращения два года и более
  kaz: Қазақстан Республикасының айналыс мерзiмi екi жыл және одан да көп мемлекеттiк орта мерзiмдi қазынашылық мiндеттемелерiн шығарудың, айналысқа қосудың және өтеудiң ережесiн бекiту туралы

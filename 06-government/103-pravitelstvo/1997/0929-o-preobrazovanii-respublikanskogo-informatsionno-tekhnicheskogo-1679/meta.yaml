title:
  rus: О преобразовании Республиканского информационно-технического центра Государственного комитета Республики Казахстан по чрезвычайным ситуациям в Республиканское государственное казенное предприятие по вычислительной технике, телекоммуникациям, информатике и ситуационному анализу Государственного комитета Республики Казахстан по чрезвычайным ситуациям
  kaz: Қазақстан Республикасы Төтенше жағдайлар жөнiндегi мемлекеттiк комитетiнiң Республикалық ақпараттық-техникалық орталығын Қазақстан Республикасы Төтенше жағдайлар жөнiндегi мемлекеттiк комитетiнiң Есептеу техникасы, телекоммуникациялар, ақпараттама және жағдайлық талдау жөнiндегi республикалық мемлекеттiк қазыналық кәсiпорны етiп қайта құру туралы

title:
  rus: Об утверждении Списка сезонных отраслей промышленности, работа в которых в течение полного сезона засчитывается в стаж для назначения пенсии за год работы, и Перечня работ, время выполнения которых засчитывается отдельным категориям медицинских работников учреждений здравоохранения в трудовой стаж для назначения пенсий в полуторном размере
  kaz: Өнеркәсiптiк толық маусым iшiндегi жұмысы жыл бойғы жұмыс үшiн зейнетақы тағайындауға арналған стажға есептелетiн маусымдық салаларының тiзiмi мен Орындалу уақыты денсаулық сақтау мекемелерi медициналық қызметкерлерiнiң жекелеген санаттарына зейнетақы тағайындау арналған еңбек стажының бiр жарым мөлшерiне есептелетiн жұмыстардың тiзбесiн бекiту туралы

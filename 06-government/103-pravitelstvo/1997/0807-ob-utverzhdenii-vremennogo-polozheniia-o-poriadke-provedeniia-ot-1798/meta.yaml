title:
  rus: Об утверждении Временного положения о порядке проведения открытых тендеров на право выполнять регулярные авиарейсы для оказания услуг по перевозке пассажиров, багажа и грузов на внутренних и международных авиалиниях
  kaz: Iшкi және халықаралық авиажелiлерiнде жолаушыларды, багажды және жүктердi тасымалдау бойынша қызметтер көрсетуге арналған жүйелi авиарейстердi орындау құқығына ашық тендерлер өткiзудiң тәртiбi туралы уақытша ереженi бекiту туралы

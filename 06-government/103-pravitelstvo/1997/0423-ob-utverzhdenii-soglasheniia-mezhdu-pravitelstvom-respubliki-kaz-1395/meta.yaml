act_code: '1395'
requisite: Постановление Правительства Республики Казахстан от 24 апреля 1997 г. N 652
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Венгерской Республики о сотрудничестве в борьбе с организованной преступностью, терроризмом, незаконным оборотом наркотических средств и психотропных веществ
  kaz: Қазақстан Республикасының Үкiметi мен Венгрия Республикасы Үкiметiнiң арасындағы Ұйымдасқан қылмысқа, терроризмге, есiрткi құралдары мен психотропты заттардың заңсыз айналымына қарсы күрестегi ынтымақтастық туралы келiсiмдi бекiту туралы

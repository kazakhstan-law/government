act_code: '82783'
requisite: Постановление Правительства Республики Казахстан от 27 августа 1997 г. N 1292
title:
  rus: О порядке проведения переписи государственных служащих, работников, осуществляющих техническое обслуживание и обеспечивающих функционирование государственных органов и их аппаратов и не являющихся государственными служащими, а также работников организаций образования и здравоохранения, финансируемых за счет средств государственного бюджета
  kaz: Мемлекеттiк қызметшiлердiң, техникалық қызмет көрсететiн және мемлекеттiк органдар мен олардың аппараттарының жұмысын қамтамасыз ететiн және мемлекеттiк қызметшi болып табылмайтын қызметкерлердiң, сондай-ақ мемлекеттiк бюджеттiң қаражаты есебiнен қаржыландырылатын бiлiм және денсаулық сақтау ұйымдары қызметкерлерiнiң санағын жүргiзудiң тәртiбi туралы

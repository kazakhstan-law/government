title:
  rus: Об утверждении Перечня продукции (работ, услуг), подлежащей обязательной сертификации на соответствие обязательным требованиям стандартов или иных нормативных документов, обеспечивающих ее безопасность для жизни, здоровья людей, имущества граждан и окружающей среды
  kaz: Стандарттардың немесе олардың адамдардың өмiрi, денсаулығы, азаматтардың мүлкi және қоршаған орта үшiн қауiпсiздiгiн қамтамасыз ететiн өзге де нормативтiк құжаттардың мiндеттi талаптарына сәйкестiгiне мiндеттi сертификаттауға жататын өнiмдердiң (жұмыстардың, қызмет көрсетулердiң) тiзбесiн бекiту туралы

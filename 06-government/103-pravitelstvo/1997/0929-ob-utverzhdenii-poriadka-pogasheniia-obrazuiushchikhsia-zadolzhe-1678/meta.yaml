act_code: '1678'
requisite: Постановление Правительства Республики Казахстан от 30 сентября 1997 г. N 1393. Утратило силу - постановлением Правительства РК от 18 июня 1998 г. N 554
title:
  rus: Об утверждении Порядка погашения образующихся задолженностей организаций, состоящих на республиканском бюджете, организациям (поставщикам товаров, работ и услуг) путем зачета их в счет погашения последними задолженностей по платежам в республиканский бюджет
  kaz: Республикалық бюджетте тұратын ұйымдардың ұйымдарға (тауарларды, жүмыстарды және қызмет көрсетулердi берушiлерге) пайда болған берешектерiн оларды соңғыларының республикалық бюджетке төленетiн төлемдер бойынша берешектерiн өтеуi есебiне есептеу жолымен өтеудiң тәртiбi туралы

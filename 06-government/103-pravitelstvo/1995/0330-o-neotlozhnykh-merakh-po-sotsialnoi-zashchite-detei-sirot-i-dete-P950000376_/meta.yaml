  kaz: Жетiм балалар мен ата-аналарының қамқорлығынсыз қалған балаларды әлеуметтiк қорғау жөнiндегi шұғыл шаралар туралы және бiлiм беру мекемелерiнiң балаларын, тәрбиеленушiлерiн, оқушылары мен студенттерiн киiндiруге және тамақтандыруға арналған шығындардың заттай мөлшерi туралы

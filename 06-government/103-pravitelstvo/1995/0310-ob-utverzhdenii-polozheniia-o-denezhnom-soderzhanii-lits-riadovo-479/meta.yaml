act_code: '479'
requisite: Постановление Кабинета Министров Республики Казахстан от 10 марта 1995 г. N 239. Утратило силу - постановлением Правительства Республики Казахстан от 16 июля 2002 года № 789
title:
  rus: Об утверждении Положения о денежном содержании лиц рядового и начальствующего состава органов внутренних дел, уголовно-исполнительной системы Министерства юстиции Республики Казахстан
  kaz: Қазақстан Республикасы iшкi iстер, Әділет министрлігінің қылмыстық-атқару жүйесі органдарының қатардағы және басшы құрамындағы адамдарға ақшалай төлем жасау туралы ереженi бекiту

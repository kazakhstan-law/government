title:
  rus: Об утверждении Модельного договора на осуществление разработки месторождения полезного ископаемого между Компетентным органом Правительства Республики Казахстан и горнодобывающим (нефтегазовым) предприятием
  kaz: Қазақстан Республикасы Үкiметiнiң құзырлы органы мен жұмыс iстеп тұрған тау-кен өндiру (мұнайгаз) кәсiпорны арасындағы Пайдалы қазба кенiшiнен кен өндiрудi жүзеге асырудың модельдiк шартын бекiту туралы

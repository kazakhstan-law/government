title:
  rus: О применении к импортируемым товарам акционерной компании "ДАЭКО" ставок таможенных пошлин и порядка обложения налогом на добавленную стоимость, действовавших соответственно до 11 января и 1 апреля 1995 года
  kaz: '"ДАЭКО" акционерлiк компаниясының импортталатын тауарларына кеден бажының ставкаларын және тиiсiнше 1995 жылдың 11 қаңтарына және 1 сәуiрiне дейiн қолданылған қосымша құн салығын салу тәртiбiн қолдану туралы'

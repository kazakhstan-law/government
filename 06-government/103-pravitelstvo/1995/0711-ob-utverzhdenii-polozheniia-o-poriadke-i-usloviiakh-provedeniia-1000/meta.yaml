title:
  rus: Об утверждении Положения о порядке и условиях проведения специализированного открытого аукциона по реализации ограниченного в распоряжении органами налоговой службы имущества в связи с задолженностью налогоплательщика - юридического лица перед государством по налогам, а также сборам и другим обязательным платежам в бюджет
  kaz: Заңды тұлға - салық төлеушiнiң салық, сондай-ақ алым және бюджетке төленетiн басқа да мiндеттi төлемдер бойынша мемлекет алдындағы берешегiне байланысты салық қызметi органдары билiк етуi шектелген мүлiктi сату жөнiнде мамандандырылған ашық аукцион өткiзудiң тәртiбi мен шарттары туралы Ереженi бекiту туралы

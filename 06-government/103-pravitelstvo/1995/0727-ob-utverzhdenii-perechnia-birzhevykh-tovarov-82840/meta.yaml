    kaz: '"Қазақстан Республикасынан тауарларды экспортқа шығару тәртiбiн оңайлату және Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiне өзгертулер мен толықтырулар енгiзу туралы" Қазақстан Республикасы Үкiметiнiң 1996 жылғы 5 желтоқсандағы N 1492 қаулысының 4 тармағының 4-шi абзацы мен 8 тармақтың күшiн жою туралы'

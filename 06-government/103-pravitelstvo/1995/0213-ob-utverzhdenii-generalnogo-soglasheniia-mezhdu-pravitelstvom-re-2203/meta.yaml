title:
  rus: Об утверждении Генерального соглашения между Правительством Республики Казахстан и Правительством Королевства Саудовская Аравия о сотрудничестве в торгово-экономической, инвестиционной, технической и культурной областях, а также в области спорта и по делам молодежи
  kaz: Қазақстан Республикасының Үкiметi мен Сауд Аравиясы Корольдiгiнiң Үкiметi арасындағы сауда-экономикалық, инвестициялық, техникалық және мәдени, сондай-ақ спорт және жастар iсi салаларындағы ынтымақтастық туралы Бас келiсiмдi бекiту туралы

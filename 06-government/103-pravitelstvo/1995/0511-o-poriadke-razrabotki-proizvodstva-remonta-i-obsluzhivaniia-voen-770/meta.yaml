  title:
    rus: Об утверждении квалификационных требований к лицензируемому виду деятельности по разработке, производству и реализации взрывчатых и пиротехнических веществ и изделий с их применением
    kaz: Жарылғыш және пиротехникалық заттар мен олар қолданылатын бұйымдарды дайындау, өндiру әрі сату жөніндегі лицензияланатын қызмет түрiне қойылатын бiлiктiлiк талаптарын бекiту туралы

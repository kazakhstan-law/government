title:
  rus: О типовой структуре аппарата акимов областей и города Алматы, перечне их самостоятельных исполнительных органов, лимитах общей численности работников, количества служебных легковых автомобилей, фонда оплаты труда и расходов на служебные командировки
  kaz: Облыстар мен Алматы қаласы әкiмдерi аппаратының үлгiлiк құрылымы, олардың дербес атқарушы органдарының тiзбесi, қызметкерлерiнiң жалпы санының лимиттерi, қызметтiк жеңiл автомобильдерiнiң саны, еңбекақы қоры және қызметтiк iссапарларға арналған шығындар туралы

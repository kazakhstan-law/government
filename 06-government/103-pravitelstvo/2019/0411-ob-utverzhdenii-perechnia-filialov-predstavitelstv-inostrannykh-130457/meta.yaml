title:
  rus: Об утверждении перечня филиалов (представительств) иностранных нефинансовых организаций, для которых статус нерезидента по валютному законодательству Республики Казахстан установлен условиями соглашений, заключенных от имени Республики Казахстан с иностранными организациями
  kaz: Қазақстан Республикасының валюталық заңнамасы бойынша бейрезидент мәртебесі Қазақстан Республикасының атынан шетелдік ұйымдармен жасалған келісімдердің талаптарында белгіленген шетелдік қаржылық емес ұйымдар филиалдарының (өкілдіктерінің) тізбесін бекіту туралы

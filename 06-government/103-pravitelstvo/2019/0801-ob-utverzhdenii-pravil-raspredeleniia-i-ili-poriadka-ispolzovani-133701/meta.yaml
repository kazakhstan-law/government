title:
  rus: Об утверждении Правил распределения и (или) порядка использования средств на возмещение ущерба работникам ликвидированных шахт, переданных товариществу с ограниченной ответственностью «Карагандаликвидшахт»
  kaz: «Қарағандышахтатарату» жауапкершілігі шектеулі серіктестігіне берілген, таратылған шахталардың жұмыскерлеріне келтірілген залалды өтеуге берілетін қаражатты бөлу қағидаларын және (немесе) оны пайдалану тәртібін бекіту туралы

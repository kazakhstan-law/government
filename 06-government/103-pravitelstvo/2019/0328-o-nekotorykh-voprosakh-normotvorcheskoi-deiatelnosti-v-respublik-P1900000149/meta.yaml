  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 29 декабря 2016 года № 907 «Об утверждении Правил законотворческой работы Правительства Республики Казахстан» и от 28 марта 2019 года № 149 «О некоторых вопросах нормотворческой деятельности в Республике Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Үкіметінің заң шығару жұмысының қағидаларын бекіту туралы» 2016 жылғы 29 желтоқсандағы № 907 және «Қазақстан Республикасындағы норма шығармашылығы қызметінің кейбір мәселелері туралы» 2019 жылғы 28 наурыздағы № 149 қаулыларына өзгерістер енгізу туралы

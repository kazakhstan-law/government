act_code: '134531'
requisite: Постановление Правительства Республики Казахстан от 6 сентября 2019 года № 664. Утратило силу постановлением Правительства Республики Казахстан от 3 августа 2023 года № 641 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил взаимодействия уполномоченного органа в области регулирования торговой деятельности с государственными органами и субъектами квазигосударственного сектора, пятьдесят и более процентов акций (долей участия в уставном капитале) которых принадлежат государству, по вопросам, связанным с членством Республики Казахстан во Всемирной торговой организации
  kaz: Қазақстан Республикасының Дүниежүзілік сауда ұйымына мүшелігіне байланысты мәселелер бойынша сауда қызметін реттеу саласындағы уәкілетті органның мемлекеттік органдармен және акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан да көп пайызы мемлекетке тиесілі квазимемлекеттік сектор субъектілерімен өзара іс-қимыл жасасу қағидаларын бекіту туралы

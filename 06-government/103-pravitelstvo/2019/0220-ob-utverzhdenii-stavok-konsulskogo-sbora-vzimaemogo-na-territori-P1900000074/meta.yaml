  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 20 февраля 2019 года № 74 «Об утверждении ставок консульского сбора, взимаемого на территории Республики Казахстан, и базовых минимальных и максимальных размеров ставок консульского сбора, взимаемого за пределами территории Республики Казахстан»
    kaz: «Қазақстан Республикасының аумағында алынатын консулдық алым мөлшерлемелерін және Қазақстан Республикасы аумағының шегінен тыс жерде алынатын консулдық алым мөлшерлемелерінің базалық ең төмен және ең жоғары мөлшерлерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2019 жылғы 20 ақпандағы № 74 қаулысына өзгерістер енгізу туралы

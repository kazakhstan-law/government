title:
  rus: Об утверждении Правил взаимодействия государственных органов Республики Казахстан в случае проведения расследования, предшествующего применению компенсирующей меры государством-членом Евразийского экономического союза в отношении товаров, происходящих из Республики Казахстан
  kaz: Қазақстан Республикасынан шығатын тауарларға қатысты Еуразиялық экономикалық одаққа мүше мемлекеттің өтемақы шарасын қолдануы алдында тергеп-тексеру жүргізілген жағдайда, Қазақстан Республикасы мемлекеттік органдарының өзара іс-қимыл жасасу қағидаларын бекіту туралы

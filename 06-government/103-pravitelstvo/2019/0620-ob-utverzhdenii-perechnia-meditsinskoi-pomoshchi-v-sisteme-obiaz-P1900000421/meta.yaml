  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 20 июня 2019 года № 421 «Об утверждении перечня медицинской помощи в системе обязательного социального медицинского страхования» и от 16 октября 2020 года № 672 «Об утверждении перечня гарантированного объема бесплатной медицинской помощи и признании утратившими силу некоторых решений Правительства Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Міндетті әлеуметтік медициналық сақтандыру жүйесіндегі медициналық көмектің тізбесін бекіту туралы» 2019 жылғы 20 маусымдағы № 421 және «Тегін медициналық көмектің кепілдік берілген көлемінің тізбесін бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» 2020 жылғы 16 қазандағы № 672 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/218769/rus

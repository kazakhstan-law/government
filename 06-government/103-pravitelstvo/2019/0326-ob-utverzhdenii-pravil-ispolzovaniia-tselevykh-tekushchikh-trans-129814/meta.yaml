act_code: '129814'
requisite: Постановление Правительства Республики Казахстан от 26 марта 2019 года № 134
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2019 год областными бюджетами, бюджетами городов республиканского значения, столицы на обеспечение прав и улучшение качества жизни инвалидов в Республике Казахстан и на услуги по замене и настройке речевых процессоров к кохлеарным имплантам
  kaz: Облыстық бюджеттердің, республикалық маңызы бар қалалардың, астана бюджеттерінің Қазақстан Республикасында мүгедектердің құқықтарын қамтамасыз етуге және өмір сүру сапасын жақсартуға және кохлеарлық импланттарға сөйлеу процессорларын ауыстыру және теңшеу жөніндегі көрсетілетін қызметтерге 2019 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалануы қағидаларын бекіту туралы

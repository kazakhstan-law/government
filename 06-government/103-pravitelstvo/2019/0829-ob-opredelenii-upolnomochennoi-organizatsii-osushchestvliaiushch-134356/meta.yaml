  requisite: Постановление Правительства Республики Казахстан от 17 февраля 2020 года № 64
  title:
    rus: О некоторых вопросах республиканского государственного предприятия на праве хозяйственного ведения «Қазарнаулыэкспорт (Казспецэкспорт)» Министерства индустрии и инфраструктурного развития Республики Казахстан и внесении изменений и дополнения в некоторые решения Правительства Республики Казахстан
    kaz: Қазақстан Республикасының Индустрия және инфрақұрылымдық даму министрлігі «Қазарнаулыэкспорт (Казспецэкспорт)» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнының кейбір мәселелері және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтыру енгізу туралы

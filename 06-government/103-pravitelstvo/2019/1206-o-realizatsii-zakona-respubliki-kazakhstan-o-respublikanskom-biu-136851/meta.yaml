  requisite: Постановление Правительства Республики Казахстан от 29 января 2020 года № 21
  title:
    rus: О корректировке показателей республиканского бюджета на 2020 год, увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2019 года и использовании (доиспользовании) в 2020 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2019 году, и внесении изменений и дополнений в постановление Правительства Республики Казахстан от 6 декабря 2019 года № 908 «О реализации Закона Республики Казахстан «О республиканском бюджете на 2020 – 2022 годы»
    kaz: 2020 жылға арналған республикалық бюджеттің көрсеткіштерін түзету, 2019 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2019 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2020 жылы пайдалану (толық пайдалану) және «2020 – 2022 жылдарға арналған республикалық бюджет туралы» Қазақстан Республикасының Заңын іске асыру туралы» Қазақстан Республикасы Үкіметінің 2019 жылғы 6 желтоқсандағы № 908 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/139692/rus

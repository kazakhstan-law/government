caused_by:
  code: '153161'
  requisite: Постановление Правительства Республики Казахстан от 25 февраля 2021 года № 96
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 9 сентября 2019 года № 668 «Об утверждении Правил взаимодействия государственных органов Республики Казахстан в случае проведения расследования, предшествующего применению компенсирующей меры государством-членом Евразийского экономического союза в отношении товаров, происходящих из Республики Казахстан» и от 10 сентября 2019 года № 679 «Об утверждении Правил взаимодействия государственных органов Республики Казахстан в случае проведения расследований, предшествующих применению торговых мер третьей стороной в отношении товаров, происходящих из Республики Казахстан, и о внесении изменений и дополнения в постановление Правительства Республики Казахстан от 31 декабря 2015 года № 1196 «Об утверждении Правил отнесения сведений к служебной информации ограниченного распространения и работы с ней»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасынан шығатын тауарларға қатысты Еуразиялық экономикалық одаққа мүше мемлекеттің өтемақы шарасын қолдануы алдында тергеп-тексеру жүргізілген жағдайда, Қазақстан Республикасы мемлекеттік органдарының өзара іс-қимыл жасасу қағидаларын бекіту туралы» 2019 жылғы 9 қыркүйектегі № 668 және «Үшінші тараптың Қазақстан Республикасынан шығатын тауарларға қатысты сауда шараларын қолдануы алдында тергеп тексеру жүргізілген жағдайда, Қазақстан Республикасы мемлекеттік органдарының өзара іс-қимыл жасау қағидаларын бекіту және «Мәліметтерді таратылуы шектелген қызметтік ақпаратқа жатқызу және онымен жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 31 желтоқсандағы № 1196 қаулысына өзгерістер мен толықтыру енгізу туралы» 2019 жылғы 10 қыркүйектегі № 679 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/153161/rus

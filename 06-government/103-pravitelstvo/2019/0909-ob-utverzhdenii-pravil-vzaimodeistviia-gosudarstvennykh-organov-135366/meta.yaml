  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и распоряжения Премьер-Министра Республики Казахстан
    kaz: Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiне және Қазақстан Республикасы Премьер-Министрінің өкімдеріне өзгерiстер мен толықтырулар енгiзу туралы

  kaz: Мемлекеттік қорғаныстық тапсырыс шеңберінде әскери мақсаттағы тауарларға (өнімдерге), қосарланған мақсаттағы (қолданыстағы) тауарларға (өнімдерге), әскери мақсаттағы жұмыстар мен әскери мақсаттағы көрсетілетін қызметтерге баға белгілеу қағидаларын бекіту туралы

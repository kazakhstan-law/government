  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 25 апреля 2015 года № 325 «Об утверждении Правил использования резервов Правительства Республики Казахстан и местных исполнительных органов и признании утратившими силу некоторых решений Правительства Республики Казахстан» и от 8 октября 2019 года № 743 «Об утверждении Правил оказания гуманитарной помощи»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Үкіметінің және жергілікті атқарушы органдардың резервтерін пайдалану қағидаларын бекіту туралы және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» 2015 жылғы 25 сәуірдегі № 325 және «Гуманитарлық көмек көрсету қағидаларын бекіту туралы» 2019 жылғы 8 қазандағы № 743 қаулыларына өзгерістер мен толықтырулар енгізу туралы

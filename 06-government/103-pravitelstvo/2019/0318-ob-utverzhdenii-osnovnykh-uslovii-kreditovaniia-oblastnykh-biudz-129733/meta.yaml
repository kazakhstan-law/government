act_code: '129733'
requisite: Постановление Правительства Республики Казахстан от 18 марта 2019 года № 118
title:
  rus: Об утверждении основных условий кредитования областных бюджетов, бюджетов городов республиканского значения, столицы на содействие развитию предпринимательства в областных центрах, городах Астане, Алматы, Шымкенте, Семее и моногородах на 2019 год
  kaz: Облыстық бюджеттерге, республикалық маңызы бар қалалардың, астананың бюджеттерiне облыс орталықтарында, Астана, Алматы, Шымкент, Семей қалаларында және моноқалаларда кәсіпкерлікті дамытуға жәрдемдесуге 2019 жылға кредит берудің негізгі шарттарын бекіту туралы

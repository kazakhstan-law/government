title:
  rus: Об определении лица, у которого будут приобретаться товары, работы, услуги по обеспечению технической поддержки и модернизации интегрированного таможенного компонента автоматизированной системы таможенного и налогового администрирования (ИС «АСТАНА-1»)
  kaz: Кедендік және салықтық әкімшілендірудің автоматтандырылған жүйесінің («АСТАНА-1» АЖ) интеграцияланған кедендік құрауыштарын жаңғыртуды және техникалық қолдауды қамтамасыз ету бойынша тауарлар, жұмыстар, көрсетілетін қызметтер сатып алынатын тұлғаны айқындау туралы

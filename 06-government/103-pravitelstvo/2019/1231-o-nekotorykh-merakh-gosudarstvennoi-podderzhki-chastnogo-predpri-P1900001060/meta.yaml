  requisite: Постановление Правительства Республики Казахстан от 31 января 2023 года № 64. Утратило силу постановлением Правительства Республики Казахстан от 26 апреля 2024 года № 336 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 11 декабря 2018 года № 820 «О некоторых вопросах обеспечения долгосрочной тенговой ликвидности для решения задачи доступного кредитования» и от 31 декабря 2019 года № 1060 «О некоторых мерах государственной поддержки частного предпринимательства»
    kaz: Қазақстан Республикасы Үкіметінің «Қолжетімді кредит беру міндетін шешу үшін ұзақ мерзімді теңгелік өтімділікті қамтамасыз етудің кейбір мәселелері туралы» 2018 жылғы 11 желтоқсандағы № 820 және «Жеке кәсіпкерлікті мемлекеттік қолдаудың кейбір шаралары туралы» 2019 жылғы 31 желтоқсандағы № 1060 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178429/rus

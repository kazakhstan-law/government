  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 26 марта 2019 года № 142 «О некоторых вопросах Министерства информации и общественного развития Республики Казахстан и Министерства цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасының Ақпарат және қоғамдық даму министрлігі мен Қазақстан Республикасының Цифрлық даму, қорғаныс және аэроғарыш өнеркәсібі министрлігінің кейбір мәселелері туралы» Қазақстан Республикасы Үкіметінің 2019 жылғы 26 наурыздағы № 142 қаулысына өзгерістер мен толықтыру енгізу туралы

  requisite: Постановление Правительства Республики Казахстан от 27 сентября 2021 года № 677
  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 3 июля 2019 года № 470 «Об утверждении Списка наркотических средств, психотропных веществ и прекурсоров, подлежащих контролю в Республике Казахстан, Сводной таблицы об отнесении наркотических средств, психотропных веществ, их аналогов и прекурсоров, обнаруженных в незаконном обороте, к небольшим, крупным и особо крупным размерам, Списка заместителей атомов водорода, галогенов и (или) гидроксильных групп в структурных формулах наркотических средств, психотропных веществ»
    kaz: «Қазақстан Республикасында бақылауға жататын есірткі, психотроптық заттар мен прекурсорлар тізімін, Заңсыз айналымда жүргені анықталған есірткі, психотроптық заттарды, сол тектестер мен прекурсорларды шағын, ірі және аса ірі мөлшерге жатқызу туралы жиынтық кестені, Есірткі, психотроптық заттардың құрылымдық формулаларындағы сутегі, галогендер және (немесе) гидроксильді топтар атомдарын алмастырғыштар тізімін бекіту туралы» Қазақстан Республикасы Үкіметінің 2019 жылғы 3 шілдедегі № 470 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/158948/rus

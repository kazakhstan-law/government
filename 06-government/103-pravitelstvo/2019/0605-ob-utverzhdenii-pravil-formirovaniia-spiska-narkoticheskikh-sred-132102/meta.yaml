act_code: '132102'
requisite: Постановление Правительства Республики Казахстан от 5 июня 2019 года № 366
title:
  rus: Об утверждении Правил формирования Списка наркотических средств, психотропных веществ и прекурсоров, подлежащих контролю в Республике Казахстан, Сводной таблицы об отнесении наркотических средств, психотропных веществ, их аналогов и прекурсоров, обнаруженных в незаконном обороте, к небольшим, крупным и особо крупным размерам, Списка заместителей атомов водорода, галогенов и (или) гидроксильных групп в структурных формулах наркотических средств, психотропных веществ
  kaz: Қазақстан Республикасында бақылауға жататын есірткі, психотроптық заттар мен прекурсорлар тізімін, Заңсыз айналымда жүргені анықталған есірткі, психотроптық заттарды, сол тектестер мен прекурсорларды шағын, ірі және аса ірі мөлшерге жатқызу туралы жиынтық кестені, Есірткі, психотроптық заттардың құрылымдық формулаларындағы сутегі, галогендер және (немесе) гидроксильді топтар атомдарын алмастырғыштар тізімін қалыптастыру қағидаларын бекіту туралы

  requisite: Постановление Правительства Республики Казахстан от 12 апреля 2023 года № 282
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 10 июля 2019 года № 497 «О мерах по реализации Указов Президента Республики Казахстан от 17 июня 2019 года № 17 и от 1 июля 2019 года № 46 «О мерах по дальнейшему совершенствованию системы государственного управления Республики Казахстан» и от 10 сентября 2019 года № 672 «Об утверждении Правил определения единого оператора маркировки и прослеживаемости товаров и требований к информационной системе маркировки и прослеживаемости товаров»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2019 жылғы 17 маусымдағы № 17 және 2019 жылғы 1 шілдедегі № 46 жарлықтарын іске асыру жөніндегі шаралар туралы» 2019 жылғы 10 шілдедегі № 497 және «Тауарларды таңбалау мен олардың қадағалануының бірыңғай операторын айқындау қағидаларын және тауарларды таңбалау мен олардың қадағалануының ақпараттық жүйесіне қойылатын талаптарды бекіту туралы» 2019 жылғы 10 қыркүйектегі № 672 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179639/rus

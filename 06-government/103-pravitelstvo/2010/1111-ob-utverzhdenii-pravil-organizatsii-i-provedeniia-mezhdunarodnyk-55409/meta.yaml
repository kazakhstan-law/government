act_code: '55409'
requisite: Постановление Правительства Республики Казахстан от 11 ноября 2010 года № 1190
title:
  rus: Об утверждении Правил организации и проведения международных мероприятий на межправительственном и межведомственном уровнях, заседаний совместных межправительственных комиссий (комитетов, советов) и их подкомиссий (подкомитетов, рабочих групп) по сотрудничеству с зарубежными странами, а также реализации договоренностей межправительственного и межведомственного уровня
  kaz: Үкіметаралық және ведомствоаралық деңгейлердегі халықаралық іс-шараларды, шетелдермен ынтымақтастық жөніндегі бірлескен үкіметаралық комиссиялардың (комитеттердің, кеңестердің) және олардың кіші комиссияларының (кіші комитеттерінің, жұмыс топтарының) отырыстарын ұйымдастыру мен өткізу, сондай-ақ үкіметаралық және ведомствоаралық деңгейдегі уағдаластықтарды іске асыру қағидасын бекіту туралы

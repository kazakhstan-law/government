  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 18 октября 2010 года № 1069 "Об утверждении Правил допуска эксплуатанта к авиационным работам" и от 13 сентября 2012 года № 1195 "Об утверждении стандартов государственных услуг в сфере гражданской авиации и внесении изменений в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: Қазақстан Республикасы Үкіметінің "Пайдаланушыны авиациялық жұмыстарға жіберу қағидасын бекіту туралы" 2010 жылғы 18 қазандағы № 1069 және "Азаматтық авиация саласындағы мемлекеттік қызмет стандарттарын бекіту және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына өзгерістер енгізу туралы" 2012 жылғы 13 қыркүйектегі № 1195 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/76391/rus

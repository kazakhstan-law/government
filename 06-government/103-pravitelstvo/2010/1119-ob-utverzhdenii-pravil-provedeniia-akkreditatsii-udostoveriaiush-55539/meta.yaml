  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 29 июля 2002 года № 843 «Об утверждении Правил осуществления учета иностранных периодических печатных изданий, распространяемых в Республике Казахстан» и от 19 ноября 2010 года № 1222 «Об утверждении Правил проведения аккредитации удостоверяющих центров»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасында таратылатын шетелдік мерзімді баспа басылымдарын есепке алуды жүзеге асыру қағидаларын бекіту туралы» 2002 жылғы 29 шілдедегі № 843 және «Куәландырушы орталықтарды аккредиттеуді жүргізу қағидасын бекіту туралы» 2010 жылғы 19 қарашадағы № 1222 қаулыларына өзгерістер енгізу туралы

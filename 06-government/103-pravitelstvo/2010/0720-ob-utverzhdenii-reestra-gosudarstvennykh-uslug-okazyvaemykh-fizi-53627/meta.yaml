  title:
    rus: Об утверждении стандарта государственной услуги "Выдача пропуска на въезд в пограничную зону иностранцам и лицам без гражданства" и внесении изменения в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: '"Шетелдіктердің және азаматтығы жоқ адамдардың шекаралық аймаққа кіруіне рұқсаттама беру" мемлекеттiк қызмет стандартын бекiту және "Жеке және заңды тұлғаларға көрсетiлетiн мемлекеттiк қызметтердiң тiзiлiмiн бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2010 жылғы 20 шiлдедегi № 745 қаулысына өзгерiс енгiзу туралы'

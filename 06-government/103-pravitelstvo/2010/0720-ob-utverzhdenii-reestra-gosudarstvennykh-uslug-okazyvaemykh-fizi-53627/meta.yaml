  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам" и от 31 августа 2012 года № 1119 "Об утверждении стандартов государственных услуг, оказываемых Министерством образования и науки Республики Казахстан, местными исполнительными органами в сфере образования и науки"
    kaz: Қазақстан Республикасы Үкіметінің "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" 2010 жылғы 20 шілдедегі № 745 және "Қазақстан Республикасы Білім және ғылым министрлігі, жергілікті атқарушы органдар көрсететін білім және ғылым саласындағы мемлекеттік қызмет стандарттарын бекіту туралы" 2012 жылғы 31 тамыздағы № 1119 қаулыларына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: Об утверждении стандарта государственной услуги "Проведение регистрации и перерегистрации лиц, осуществляющих миссионерскую деятельность" и о внесении изменения в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: '"Миссионерлік қызметті жүзеге асыратын тұлғаларды тіркеуді және қайта тіркеуді жүргізу" мемлекеттік қызмет стандартын бекіту және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына өзгеріс енгізу туралы'

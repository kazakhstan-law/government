  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам" и от 8 октября 2012 года № 1271 "Об утверждении стандартов государственных услуг в сфере санитарно-эпидемиологического благополучия населения"
    kaz: Қазақстан Республикасы Үкіметінің "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" 2010 жылғы 20 шілдедегі № 745 және "Халықтың санитариялық-эпидемиологиялық салауаттылығы саласындағы мемлекеттік қызмет стандарттарын бекіту туралы" 2012 жылғы 8 қазандағы № 1271 қаулыларына өзгерістер енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 30 декабря 2009 года № 2315 "О внесении изменения и дополнений в постановление Правительства Республики Казахстан от 30 июня 2007 года № 561 и об утверждении стандартов государственных услуг" и от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Үкіметінің 2007 жылғы 30 маусымдағы № 561 қаулысына өзгеріс пен толықтырулар енгізу туралы және мемлекеттік қызмет стандарттарын бекіту туралы» 2009 жылғы 30 желтоқсандағы № 2315 және «Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы» 2010 жылғы 20 шілдедегі № 745 қаулыларына өзгерістер мен толықтырулар енгізу туралы

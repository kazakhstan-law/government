  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам" и от 8 декабря 2011 года № 1498 "Об утверждении стандарта государственной услуги "Регистрация лиц, имеющих право осуществлять деятельность реабилитационного и (или) конкурсного управляющих и (или) администратора внешнего наблюдения, и снятие их с регистрации" и внесении дополнения в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: '"Жеке және заңды тұлғаларға көрсетiлетiн мемлекеттiк қызметтердiң тiзiлiмiн бекiту туралы» Қазақстан Республикасы Үкiметiнiң 2010 жылғы 20 шiлдедегi № 745 және "Оңалтушы және (немесе) конкурстық басқарушылардың және (немесе) сырттай байқау әкiмшiсiнiң қызметiн жүзеге асыруға құқығы бар тұлғаларды тiркеу және оларды тiркеуден алу" мемлекеттiк қызмет стандартын бекiту" және "Жеке және заңды тұлғаларға көрсетiлетiн мемлекеттiк қызметтердiң тiзiлiмiн бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2010 жылғы 20 шiлдедегi № 745 қаулысына толықтыру енгiзу туралы" Қазақстан Республикасы Үкiметiнiң 2011 жылғы 8 желтоқсандағы № 1498 қаулыларына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/70724/rus

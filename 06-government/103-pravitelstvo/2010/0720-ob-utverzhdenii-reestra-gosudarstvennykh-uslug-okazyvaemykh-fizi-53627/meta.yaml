  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицами" и от 4 апреля 2011 года № 351 "Об утверждении стандарта государственной услуги "Государственная регистрация, перерегистрация и внесение изменений в регистрационное досье лекарственных средств, изделий медицинского назначения и медицинской техники" и внесении дополнения и изменений в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745"
    kaz: Қазақстан Республикасы Үкіметінің "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" 2010 жылғы 20 шілдедегі № 745 және "Дәрілік заттарды, медициналық мақсаттағы бұйымдар мен медициналық техниканы мемлекеттік тіркеу, қайта тіркеу және олардың тіркеу құжатына өзгерістер енгізу" мемлекеттік қызмет стандартын бекіту және Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына толықтыру мен өзгерістер енгізу туралы" 2011 жылғы 4 сәуірдегі № 351 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/70954/rus

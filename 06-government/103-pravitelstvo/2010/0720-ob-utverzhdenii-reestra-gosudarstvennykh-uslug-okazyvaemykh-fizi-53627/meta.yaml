  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам" и от 31 августа 2012 года № 1129 "Об утверждении стандартов государственных услуг, оказываемых Министерством индустрии и новых технологий Республики Казахстан, в области технического регулирования и метрологии"
    kaz: Қазақстан Республикасы Үкіметінің "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" 2010 жылғы 20 шілдедегі № 745 және "Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігі техникалық реттеу және метрология саласында көрсететін мемлекеттік қызмет стандарттарын бекіту туралы" 2012 жылғы 31 тамыздағы № 1129 қаулыларына өзгерістер енгізу туралы

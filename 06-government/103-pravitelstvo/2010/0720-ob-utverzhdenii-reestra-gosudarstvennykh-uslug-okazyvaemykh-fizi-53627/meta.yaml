  requisite: Постановление Правительства Республики Казахстан от 23 мая 2011 года № 560. Утратило силу постановлением Правительства Республики Казахстан от 22 мая 2014 года № 533
  title:
    rus: Об утверждении стандарта государственной услуги "Государственная регистрация и перерегистрация продуктов детского питания, пищевых и биологически активных добавок к пище, генетически модифицированных объектов, красителей, средств дезинфекции, дезинсекции и дератизации, материалов и изделий, контактирующих с водой и продуктами питания, химических веществ, отдельных видов продукции и веществ, оказывающих вредное воздействие на здоровье человека" и внесении изменения и дополнений в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745
    kaz: '"Балалар тамағы өнімдерін, тағамға тағамдық және биологиялық белсенді қоспаларды, генетикалық түрлендірілген объектілерді, бояғыштарды, дезинфекция, дезинсекция және дератизация құралдарын, сумен және тамақ өнімдерімен жанасатын материалдар мен бұйымдарды, адам денсаулығына зиянды әсер ететін химиялық заттарды, өнімдер мен заттардың жекелеген түрлерін мемлекеттік тіркеу және қайта тіркеу" мемлекеттік қызмет стандартын бекіту және Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына өзгеріс пен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/58946/rus

  title:
    rus: Об утверждении стандартов государственных услуг в сфере земельных отношений, геодезии и картографии и внесении изменений в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: Жер қатынастары, геодезия және картография саласындағы мемлекеттік қызметтердің стандарттарын бекіту және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына өзгерістер енгізу туралы

act_code: '51555'
requisite: Постановление Правительства Республики Казахстан от 3 апреля 2010 года № 284
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областным бюджетам, бюджетам городов Астаны и Алматы на обеспечение проезда и на выплату единовременной материальной помощи к 65-летию Победы в Великой Отечественной войне
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне Ұлы Отан соғысындағы Жеңістің 65 жылдығына орай жол жүруді қамтамасыз етуге және біржолғы материалдық көмек төлеуге берілетін ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

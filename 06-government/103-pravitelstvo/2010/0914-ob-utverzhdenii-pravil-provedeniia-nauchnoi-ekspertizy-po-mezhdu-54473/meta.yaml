  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 30 апреля 2013 года № 436 "О создании Межведомственной комиссии по вопросам международных договоров Республики Казахстан" и от 14 сентября 2010 года № 938 "Об утверждении Правил проведения научной экспертизы по международным договорам, участницей которых намеревается стать Республика Казахстан, а также по проектам международных договоров"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасының халықаралық шарттары мәселелері жөніндегі ведомствоаралық комиссия құру туралы" 2013 жылғы 30 сәуірдегі № 436 және "Қазақстан Республикасы қатысушы болуға ниеттенетін халықаралық шарттар бойынша, сондай-ақ халықаралық шарттардың жобалары бойынша ғылыми сараптама жүргізу қағидасын бекіту туралы" 2010 жылғы 14 қыркүйектегі № 938 қаулыларына өзгерістер енгізу туралы

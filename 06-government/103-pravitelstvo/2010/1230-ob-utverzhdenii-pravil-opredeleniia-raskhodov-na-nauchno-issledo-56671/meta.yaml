  title:
    rus: Об утверждении Правил подтверждения внедрения результата научно-исследовательских, научно-технических и (или) опытно-конструкторских работ на территории Республики Казахстан и признании утратившим силу постановления Правительства Республики Казахстан от 30 декабря 2010 года № 1449 "Об утверждении Правил определения расходов на научно-исследовательские и опытно-конструкторские работы на территории Республики Казахстан, необходимые для выполнения работ по контракту"
    kaz: Қазақстан Республикасының аумағында ғылыми-зерттеу, ғылыми-техникалық және (немесе) тәжірибелік-конструкторлық жұмыстардың нәтижесін енгізуді растау қағидаларын бекіту және "Келiсiмшарт бойынша жұмыстарды орындау үшiн қажеттi Қазақстан Республикасының аумағындағы ғылыми-зерттеу және тәжiрибелiк-конструкторлық жұмыстарға арналған шығыстарды айқындау қағидасын бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2010 жылғы 30 желтоқсандағы № 1449 қаулысының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/66613/rus

title:
  rus: Об утверждении Правил определения расходов на научно-исследовательские и опытно-конструкторские работы на территории Республики Казахстан, необходимые для выполнения работ по контракту
  kaz: Келісімшарт бойынша жұмыстарды орындау үшін қажетті Қазақстан Республикасының аумағындағы ғылыми-зерттеу және тәжірибелік-конструкторлық жұмыстарға арналған шығыстарды айқындау қағидасын бекіту туралы

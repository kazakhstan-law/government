title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2010 год областным бюджетам, бюджетам городов Астаны и Алматы на содержание вновь вводимых объектов социального обеспечения
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне жаңадан іске қосылатын әлеуметтік қамсыздандыру объектілерін күтіп-ұстауға 2010 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

act_code: '57236'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2010 года № 1528. Утратило силу постановлением Правительства Республики Казахстан от 18 апреля 2018 года № 204 (вводится в действие с 1 января 2018 года)
title:
  rus: Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) углеводородного сырья к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных и порядка налогообложения в части налога на добычу полезных ископаемых
  kaz: Көмірсутек шикізаты кен орнын (кен орындарының бір тобын, кен орнының бір бөлігін) рентабельділігі төмен, өте тұтқыр, су басқан, дебиті аз және сарқылған кен орындарының санатына жатқызу қағидасын және пайдалы қазбаларды өндіруге салынатын салық бөлігінде салық салу тәртібін бекіту туралы

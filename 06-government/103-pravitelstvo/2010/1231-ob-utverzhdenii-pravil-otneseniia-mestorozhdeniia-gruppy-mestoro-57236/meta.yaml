  code: '67852'
  requisite: Постановление Правительства Республики Казахстан от 29 сентября 2012 года № 1248. Утратило силу постановлением Правительства Республики Казахстан от 18 апреля 2018 года № 204 (вводится в действие с 1 января 2018 года)
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 декабря 2010 года № 1528 "Об утверждении Правил отнесения контракта на недропользование, предусматривающего разработку месторождения углеводородного сырья, к категории низкорентабельных, а также месторождения (группы месторождений, части месторождений) углеводородного сырья к категории высоковязких, обводненных, малодебитных или выработанных и Ставок налога на добычу полезных ископаемых для недропользователей, разрабатывающих обводненные, малодебитные, выработанные, высоковязкие месторождения углеводородного сырья"
    kaz: '"Көмiрсутек шикiзаты кен орнын игерудi көздейтiн жер қойнауын пайдалануға арналған келiсiмшартты рентабельдiлiгi төмен санатқа, сондай-ақ көмiрсутек шикiзаты кен орнын (кен орындарының бiр тобын, кен орнының бiр бөлiгiн) өте тұтқыр, су басқан, дебитi аз немесе сарқылған кен орындарының санатына жатқызу қағидасын және Су басқан, дебитi аз, сарқылған, өте тұтқыр көмiрсутек шикiзаты кен орнын игеретiн жер қойнауын пайдаланушылар үшiн пайдалы қазбаларды өндiруге арналған салық ставкаларын бекiту туралы" Қазақстан Республикасы Үкiметiнің 2010 жылғы 31 желтоқсандағы № 1528 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/67852/rus

act_code: '106283'
requisite: Постановление Правительства Республики Казахстан от 23 ноября 2010 года № 1235. Утратило силу постановлением Правительства Республики Казахстан от 20 апреля 2018 года № 208 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня услуг по ремонту товара, ввезенного на территорию Республики Казахстан с территории государств-членов таможенного союза, включая его восстановление, замену составных частей, обороты по реализации которых освобождаются от налога на добавленную стоимость в таможенном союзе
  kaz: Кеден одағына мүше мемлекеттердің аумағынан Қазақстан Республикасының аумағына әкелінген, өткізу жөніндегі айналымдары кеден одағында қосылған құн салығынан босатылатын тауарды қалпына келтіруді, құрамдас бөлшектерін ауыстыруды қоса алғанда, оны жөндеу жөніндегі қызметтердің тізбесін бекіту туралы

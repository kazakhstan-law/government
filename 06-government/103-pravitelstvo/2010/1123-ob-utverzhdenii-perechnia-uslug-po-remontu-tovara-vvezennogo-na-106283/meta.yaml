  title:
    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 23 ноября 2010 года № 1235 «Об утверждении перечня услуг по ремонту товара, ввезенного на территорию Республики Казахстан с территории государств-членов таможенного союза, включая его восстановление, замену составных частей, обороты по реализации которых освобождаются от налога на добавленную стоимость в таможенном союзе»
    kaz: «Кеден одағына мүше мемлекеттердің аумағынан Қазақстан Республикасының аумағына әкелінген, өткізу жөніндегі айналымдары кеден одағында қосылған құн салығынан босатылатын тауарды қалпына келтіруді, құрамдас бөлшектерін ауыстыруды қоса алғанда, оны жөндеу жөніндегі қызметтердің тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2010 жылғы 23 қарашадағы № 1235 қаулысына толықтыру енгізу туралы

  code: '67515'
  requisite: Постановление Правительства Республики Казахстан от 31 августа 2012 года № 1131. Утратило силу постановлением Правительства Республики Казахстан от 5 марта 2014 № 185
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 8 февраля 2010 года № 76 "Об утверждении стандарта оказания государственной услуги "Постановка на учет граждан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде в местном исполнительном органе района (города областного значения), города республиканского значения, столицы"
    kaz: '"Ауданның (облыстық маңызы бар қаланың), республикалық маңызы бар қаланың, астананың жергілікті атқарушы органында мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке қою" мемлекеттік қызмет көрсету стандартын бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 8 ақпандағы № 76 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/67515/rus

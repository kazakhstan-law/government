title:
  rus: Об утверждении Правил прикомандирования в таможенные органы государственных ветеринарно-санитарных инспекторов и государственных инспекторов по карантину растений уполномоченного государственного органа в области ветеринарии и карантина растений
  kaz: Ветеринария және өсімдіктер карантині саласындағы уәкілетті мемлекеттік органның өсімдіктер карантині бойынша мемлекеттік ветеринариялық-санитариялық инспекторлары мен мемлекеттік инспекторларын кеден органдарына іссапарға жіберу ережесін бекіту туралы

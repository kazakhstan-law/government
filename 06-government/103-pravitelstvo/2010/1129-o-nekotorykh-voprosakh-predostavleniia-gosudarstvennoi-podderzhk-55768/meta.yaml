  title:
    rus: Об утверждении Правил возмещения части затрат субъектов индустриально-инновационной деятельности по продвижению отечественных обработанных товаров, услуг на внешние рынки, перечня отечественных обработанных товаров, услуг, по которым частично возмещаются затраты по их продвижению на внешние рынки, и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Отандық өңделген тауарларды, қызметтерді сыртқы нарықтарға жылжыту бойынша индустриялық-инновациялық қызмет субъектілері шығындарының бір бөлігін өтеу қағидаларын, сыртқы нарықтарға жылжыту бойынша шығындары ішінара өтелетін отандық өңделген тауарлардың, көрсетілетін қызметтердің тізбесін бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

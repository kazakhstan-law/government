  title:
    rus: Об утверждении Правил возмещения затрат экспортеров по продвижению обработанных отечественных товаров на внешние рынки, перечня обработанных отечественных товаров, по которым частично возмещаются затраты экспортеров по их продвижению на внешние рынки, и внесении изменения в постановление Правительства Республики Казахстан от 29 ноября 2010 года № 1265 "О некоторых вопросах предоставления государственной поддержки по выводу отечественной продукции на внешние рынки путем возмещения затрат экспортеров"
    kaz: Отандық өңделген тауарларды сыртқы нарықтарға ілгерілету бойынша экспорттаушылар шығындарының бір бөлігін өтеу қағидасын, сыртқы нарықтарға ілгерілету бойынша экспорттаушылардың шығындары ішінара өтелетін отандық өңделген тауарлар тізбесін бекіту және "Экспорттаушылардың шығындарын өтеу жолымен отандық өнімді сыртқы нарықтарға шығару бойынша мемлекеттік қолдау көрсетудің кейбір мәселелері туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 29 қарашадағы № 1265 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/59379/rus

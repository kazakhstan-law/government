act_code: '55768'
requisite: Постановление Правительства Республики Казахстан от 29 ноября 2010 года № 1265. Утратило силу постановлением Правительства Республики Казахстан от 2 августа 2012 года № 1017, за исключением пункта 4
title:
  rus: О некоторых вопросах предоставления государственной поддержки по выводу отечественной продукции на внешние рынки путем возмещения затрат экспортеров
  kaz: Экспорттаушылардың шығындарын өтеу жолымен отандық өнімді сыртқы нарықтарға шығару бойынша мемлекеттік қолдау көрсетудің кейбір мәселелері туралы

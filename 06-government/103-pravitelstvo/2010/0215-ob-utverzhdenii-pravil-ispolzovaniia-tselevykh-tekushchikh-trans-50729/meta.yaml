act_code: '50729'
requisite: Постановление Правительства Республики Казахстан от 15 февраля 2010 года № 91
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2010 года областными бюджетами, бюджетами городов Астаны и Алматы на обеспечение закладки и выращивания многолетних насаждений плодово-ягодных культур и винограда
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің жеміс-жидек дақылдарының және жүзімнің көп жылдық екпелерін отырғызу мен өсіруді қамтамасыз етуге 2010 жылғы республикалық бюджеттен бөлінетін ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

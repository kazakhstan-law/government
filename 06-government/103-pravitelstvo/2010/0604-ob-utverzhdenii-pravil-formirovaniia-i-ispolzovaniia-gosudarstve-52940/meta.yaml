  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 4 июня 2010 года № 514 "Об утверждении Правил ведения Государственного реестра судебных экспертов Республики Казахстан" и от 4 июня 2010 года № 515 "Об утверждении Правил ведения Государственного реестра методик судебно-экспертных исследований Республики Казахстан"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасы сот сарапшыларының мемлекеттік тізілімін жүргізу ережесін бекіту туралы" 2010 жылғы 4 маусымдағы № 514 және "Қазақстан Республикасының сот сараптамасы зерттеулері әдістемелерінің мемлекеттік тізілімін жүргізу ережесін бекіту туралы" 2010 жылғы 4 маусымдағы № 515 қаулыларына өзгерістер енгізу туралы

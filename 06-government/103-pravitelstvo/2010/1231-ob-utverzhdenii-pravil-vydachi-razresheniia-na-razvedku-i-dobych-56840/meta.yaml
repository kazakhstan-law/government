act_code: '56840'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2010 года № 1521. Утратило силу постановлением Правительства Республики Казахстан от 21 июля 2015 года № 552
title:
  rus: Об утверждении Правил выдачи разрешения на разведку и добычу производственно-технических подземных вод в объемах две тысячи и более кубических метров в сутки для их закачки в пласт в соответствии с технологической схемой добычи полезного ископаемого, либо на добычу подземных вод для целей водопонижения при эксплуатации горных выработок
  kaz: Тәулігіне екі мың және одан да көп текше метр көлеміндегі өндірістік-техникалық жерасты суларын пайдалы қазбаны өндірудің технологиялық схемасына сәйкес қаттарға айдау үшін барлау мен өндіруге не тау-кен қазбаларын пайдалану кезінде су деңгейін төмендету мақсатында жерасты суларын өндіруге арналған рұқсат беру қағидасын бекіту туралы

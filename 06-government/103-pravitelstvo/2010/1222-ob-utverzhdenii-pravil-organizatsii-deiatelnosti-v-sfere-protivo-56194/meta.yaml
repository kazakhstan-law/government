act_code: '56194'
requisite: Постановление Правительства Республики Казахстан от 22 декабря 2010 года № 1404
title:
  rus: Об утверждении Правил организации деятельности в сфере противодействия терроризму в Республике Казахстан
  kaz: Қазақстан Республикасында терроризмге қарсы іс-қимыл саласындағы қызметті ұйымдастыру қағидаларын бекіту туралы

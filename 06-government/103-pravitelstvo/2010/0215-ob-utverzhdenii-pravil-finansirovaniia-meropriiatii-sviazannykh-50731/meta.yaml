act_code: '50731'
requisite: Постановление Правительства Республики Казахстан от 15 февраля 2010 года № 97
title:
  rus: Об утверждении Правил финансирования мероприятий, связанных с субсидированием ставки вознаграждения по кредитам, выдаваемым финансовыми институтами предприятиям по переработке сельскохозяйственной продукции на пополнение их основных и оборотных средств, по лизингу оборудования
  kaz: Ауыл шаруашылығы өнімдерін қайта өңдеу кәсіпорындарына олардың негізгі және айналым қаражатын толықтыруға қаржы институттары беретін кредиттер бойынша, жабдықтар лизингі бойынша сыйақы ставкасын субсидиялауға байланысты іс-шараларды қаржыландыру ережесін бекіту туралы

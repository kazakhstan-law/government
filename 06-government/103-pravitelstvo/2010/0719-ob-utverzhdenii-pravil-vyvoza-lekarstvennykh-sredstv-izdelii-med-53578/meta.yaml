requisite: Постановление Правительства Республики Казахстан от 19 июля 2010 года № 736. Утратило силу постановлением Правительства Республики Казахстан от 27 января 2016 года № 31
title:
  rus: Об утверждении Правил вывоза лекарственных средств, изделий медицинского назначения и медицинской техники с территории Республики Казахстан в составе материально-технических средств медицинских и аварийно-спасательных организаций и формирований, выбывающих с территории Республики Казахстан для участия в ликвидации чрезвычайных ситуаций
  kaz: Дәрілік заттарды, медициналық мақсаттағы бұйымдарды және медициналық техниканы төтенше жағдайларды жоюға қатысу үшін Қазақстан Республикасының аумағынан кететін медициналық және авариялық-құтқару ұйымдары мен құралымдарының материалдық-техникалық құралдарының құрамында Қазақстан Республикасының аумағынан әкету ережесін бекіту туралы

act_code: '54728'
requisite: Постановление Правительства Республики Казахстан от 4 октября 2010 года № 1018. Утратило силу постановлением Правительства Республики Казахстан от 6 декабря 2016 года № 769
title:
  rus: Об утверждении формы и Правил составления и представления отчета недропользователей по исполнению обязательств по размеру расходов, направляемых на обучение, повышение квалификации и переподготовку работников, являющихся гражданами Республики Казахстан, задействованных при исполнении контракта, или обучение граждан Республики Казахстан по перечню специальностей, согласованному с компетентным органом
  kaz: Қазақстан Республикасының азаматтары болып табылатын, келісімшартты орындау кезінде тартылған қызметкерлерді оқытуға, олардың біліктілігін арттыруға және қайта даярлауға немесе құзыретті органмен келісілген мамандықтар тізбесі бойынша Қазақстан Республикасының азаматтарын оқытуға бағытталған шығыстар мөлшері жөніндегі міндеттемелерді орындау бойынша жер қойнауын пайдаланушылардың есептерін жасаудың және ұсынудың нысандары мен қағидасын бекіту туралы

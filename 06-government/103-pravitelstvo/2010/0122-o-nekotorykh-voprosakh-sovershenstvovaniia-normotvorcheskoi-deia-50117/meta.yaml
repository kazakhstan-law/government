  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и распоряжение Премьер-Министра Республики Казахстан от 2 февраля 2009 года № 15-р "О дальнейших мерах по совершенствованию законотворческой деятельности"

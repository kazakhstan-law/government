  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 19 ноября 2010 года № 1221 «Об утверждении Правил проведения конкурса на международные авиамаршруты и выдачи свидетельств на международные авиамаршруты для оказания услуг по перевозке пассажиров, багажа, грузов и почтовых отправлений»
    kaz: «Жолаушыларды, багажды, жүктер мен почта жөнелтiлiмдерiн тасымалдау жөнінде қызметтер көрсету үшiн халықаралық авиамаршруттарға арналған конкурс өткiзу және халықаралық авиамаршруттарға куәлiктер беру қағидаларын бекiту туралы» Қазақстан Республикасы Үкіметінің 2010 жылғы 19 қарашадағы № 1221 қаулысына өзгеріс енгізу туралы

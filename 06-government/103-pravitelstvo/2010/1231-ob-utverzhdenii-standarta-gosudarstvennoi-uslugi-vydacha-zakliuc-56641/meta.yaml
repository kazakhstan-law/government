  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 декабря 2010 года № 1508 "Об утверждении стандарта государственной услуги "Выдача заключения для включения компьютерных систем в государственный реестр контрольно-кассовых машин"
    kaz: '"Компьютер жүйелерiн бақылау-касса машиналарының мемлекеттiк тiзiлiмiне енгiзу үшiн қорытынды беру" мемлекеттiк қызмет стандартын бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 31 желтоқсандағы № 1508 қаулысына өзгерістер енгізу туралы'

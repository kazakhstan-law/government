title:
  rus: Об утверждении стандарта государственной услуги "Выдача заключений о соответствии компьютерной системы техническим требованиям для включения в государственный реестр контрольно-кассовых машин"
  kaz: '"Бақылау-касса машиналарының мемлекеттік тізіліміне енгізу үшін компьютер жүйесінің техникалық талаптарға сәйкестігі туралы қорытындылар беру" мемлекеттік қызмет стандартын бекіту туралы'

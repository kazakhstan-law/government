act_code: '52331'
requisite: Постановление Правительства Республики Казахстан от 6 мая 2010 года № 384
title:
  rus: Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным образованием в организациях образования, финансируемых из республиканского бюджета (за исключением подготовки специалистов в организациях образования Комитета национальной безопасности Республики Казахстан) на 2010/2011 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің білім беру ұйымдарында мамандар даярлауды қоспағанда) жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік білімі бар мамандар даярлауға 2010/2011 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы

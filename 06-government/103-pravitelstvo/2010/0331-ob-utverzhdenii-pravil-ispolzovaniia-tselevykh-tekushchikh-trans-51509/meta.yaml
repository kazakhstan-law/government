act_code: '51509'
requisite: Постановление Правительства Республики Казахстан от 31 марта 2010 года № 259
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов и целевых трансфертов на развитие областным бюджетам, бюджетам городов Астаны и Алматы и средств, выделяемых республиканским организациям в рамках реализации стратегии региональной занятости и переподготовки кадров
  kaz: Өңірлік жұмыспен қамту және кадрларды қайта даярлау стратегиясын іске асыру шеңберінде облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне берілетін ағымдағы нысаналы трансферттер мен нысаналы даму трансферттерін және республикалық ұйымдарға бөлінетін қаражатты пайдалану ережесін бекіту туралы

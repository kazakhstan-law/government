act_code: '55536'
requisite: Постановление Правительства Республики Казахстан от 18 ноября 2010 года № 1212. Утратило силу постановлением Правительства Республики Казахстан от 17 июля 2018 года № 437 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об утверждении перечня геологических, геоморфологических и гидрогеологических объектов государственного природно-заповедного фонда республиканского и международного значения, Правил их ограниченного хозяйственного использования на особо охраняемых природных территориях, а также перечня участков недр, представляющих особую экологическую, научную, культурную и иную ценность, отнесенных к категории особо охраняемых природных территорий республиканского значения
  kaz: Республикалық және халықаралық маңызы бар мемлекеттік табиғи-қорық қорының геологиялық, геоморфологиялық және гидрогеологиялық объектілерінің тізбесін, ерекше қорғалатын табиғи аумақтарда оларды шектеулі шаруашылық мақсатта пайдалану қағидасын, сондай-ақ республикалық маңызы бар ерекше қорғалатын табиғи аумақтар санатына жатқызылған айрықша экологиялық, ғылыми, мәдени және өзге де құндылықты білдіретін жер қойнауы учаскелерінің тізбесін бекіту туралы

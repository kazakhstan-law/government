  title:
    rus: Об утверждении стандартов государственных услуг, оказываемых Министерством окружающей среды и водных ресурсов Республики Казахстан, внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Қоршаған орта және су ресурстары министрлігі көрсететін мемлекеттік қызметтер стандарттарын бекіту, Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiнiң күшi жойылды деп тану туралы

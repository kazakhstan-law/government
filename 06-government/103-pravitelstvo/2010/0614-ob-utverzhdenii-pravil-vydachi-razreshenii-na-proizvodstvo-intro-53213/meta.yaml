  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 14 июня 2010 года № 572 "Об утверждении Правил выдачи разрешений на производство интродукции, реинтродукции и гибридизации животных, а также изъятие вновь акклиматизированных животных"
    kaz: '"Жануарларды интродукциялауды, реинтродукциялау мен будандандастыруды жүргізуге, сондай-ақ жаңадан жерсіндірілген жануарларды алып қоюға рұқсаттар беру қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 14 маусымдағы № 572 қаулысына өзгерістер енгізу туралы'

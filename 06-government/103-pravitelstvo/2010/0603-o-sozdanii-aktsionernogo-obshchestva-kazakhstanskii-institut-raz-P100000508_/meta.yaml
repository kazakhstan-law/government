  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 3 июня 2010 года № 508 «О создании акционерного общества «Казахстанский институт развития индустрии» и от 30 июля 2016 года № 450 «Об утверждении перечня национальных институтов развития и иных юридических лиц, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых прямо либо косвенно принадлежат государству, уполномоченных на реализацию мер государственной поддержки индустриально-инновационной деятельности»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстандық индустрияны дамыту институты» акционерлік қоғамын құру туралы» 2010 жылғы 3 маусымдағы № 508 және «Ұлттық даму институттарының және индустриялық-инновациялық қызметті мемлекеттік қолдау шараларын іске асыруға уәкілеттік берілген, дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан көп пайызы тікелей не жанама түрде мемлекетке тиесілі өзге де заңды тұлғалардың тізбесін бекіту туралы» 2016 жылғы 30 шілдедегі № 450 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/137537/rus

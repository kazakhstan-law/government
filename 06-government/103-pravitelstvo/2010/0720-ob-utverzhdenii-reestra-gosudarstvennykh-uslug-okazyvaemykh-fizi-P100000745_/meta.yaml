  title:
    rus: Об утверждении стандарта государственной услуги "Государственная регистрация, перерегистрация и внесение изменений в регистрационное досье лекарственных средств, изделий медицинского назначения и медицинской техники" и внесении дополнения и изменений в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745
    kaz: '"Дәрілік заттарды, медициналық мақсаттағы бұйымдар мен медициналық техниканы мемлекеттік тіркеу, қайта тіркеу және олардың тіркеу құжатына өзгерістер енгізу" мемлекеттік қызмет стандартын бекіту және Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына толықтыру мен өзгерістер енгізу туралы'

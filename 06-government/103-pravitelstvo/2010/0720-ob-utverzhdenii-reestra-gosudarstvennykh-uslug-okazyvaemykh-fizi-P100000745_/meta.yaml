  requisite: Постановление Правительства Республики Казахстан от 8 декабря 2011 года № 1498. Утратило силу постановлением Правительства Республики Казахстан от 5 марта 2014 года № 200
  title:
    rus: Об утверждении стандарта государственной услуги "Регистрация лиц, имеющих право осуществлять деятельность реабилитационного и (или) конкурсного управляющих и (или) администратора внешнего наблюдения, и снятие их с регистрации" и внесении дополнения в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: '"Оңалтушы және (немесе) конкурстық басқарушылардың және (немесе) сырттай байқау әкімшісінің қызметін жүзеге асыруға құқығы бар тұлғаларды тіркеу және оларды тіркеуден алу" мемлекеттік қызмет стандартын бекіту және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/62207/rus

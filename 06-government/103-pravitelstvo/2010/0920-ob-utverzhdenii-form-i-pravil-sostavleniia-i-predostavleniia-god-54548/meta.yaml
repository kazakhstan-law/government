  kaz: Тауарларды, жұмыстар мен қызметтерді сатып алудың жылдық, орта мерзімді, ұзақ мерзімді бағдарламаларын, жер қойнауын пайдаланушылардың сатып алынған тауарлар, жұмыстар мен қызметтер туралы және кадрлардағы жергілікті қамту жөніндегі міндеттемелердің орындалуы туралы есептерін жасаудың және ұсынудың нысандары мен қағидасын бекіту туралы

title:
  rus: Об утверждении Правил проведения конкурса на международные авиамаршруты и выдачи свидетельств на международные авиамаршруты для оказания услуг по перевозке пассажиров, багажа, грузов и почтовых отправлений
  kaz: Жолаушыларды, багажды, жүктер мен почта жөнелтiлiмдерiн тасымалдау жөнінде қызметтер көрсету үшiн халықаралық авиамаршруттарға арналған конкурс өткiзу және халықаралық авиамаршруттарға куәлiктер беру қағидаларын бекiту туралы

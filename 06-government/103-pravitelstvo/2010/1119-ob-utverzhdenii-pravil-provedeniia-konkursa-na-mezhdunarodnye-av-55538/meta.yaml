    kaz: «Жолаушыларды, багажды, жүктер мен почта жөнелтiлiмдерiн тасымалдау жөнінде қызметтер көрсету үшiн халықаралық авиамаршруттарға арналған конкурс өткiзу және халықаралық авиамаршруттарға куәлiктер беру қағидаларын бекiту туралы» Қазақстан Республикасы Үкіметінің 2010 жылғы 19 қарашадағы № 1221 қаулысына өзгерістер енгізу туралы

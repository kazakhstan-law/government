    kaz: '"Жолаушыларды, багажды, жүктер мен почта жөнелтілімдерін тасымалдау жөнінде қызметтер көрсету үшін авиамаршрутқа арналған конкурс өткізу және авиамаршруттарға куәліктер беру қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 19 қарашадағы № 1221 қаулысына өзгерістер енгізу туралы'

  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 31 декабря 2010 года № 1528 «Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) углеводородного сырья к категории низкорентабельных, высоковязких, обводненных, малодебитных и выработанных и порядка налогообложения в части налога на добычу полезных ископаемых»
    kaz: «Көмірсутек шикізаты кен орнын (кен орындарының бір тобын, кен орнының бір бөлігін) рентабельділігі төмен, өте тұтқыр, су басқан, дебиті аз және сарқылған кен орындарының санатына жатқызу қағидасын және пайдалы қазбаларды өндіруге салынатын салық бөлігінде салық салу тәртібін бекіту туралы» Қазақстан Республикасы Үкіметінің 2010 жылғы 31 желтоқсандағы № 1528 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/95396/rus

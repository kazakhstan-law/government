act_code: '50890'
requisite: Постановление Правительства Республики Казахстан от 25 февраля 2010 года № 123
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2010 года областными бюджетами и бюджетом города Астаны на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ
  kaz: Облыстық бюджеттердің және Астана қаласы бюджетінің көктемгі егіс және егін жинау жұмыстарын жүргізуге қажетті жанар-жағар май материалдары мен басқа да тауарлық-материалдық құндылықтардың құнын арзандатуға 2010 жылдың республикалық бюджетінен бөлінетін ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

act_code: '52012'
requisite: Постановление Правительства Республики Казахстан от 26 апреля 2010 года № 354
title:
  rus: Об утверждении Правил кредитования областных бюджетов, бюджетов городов Астаны и Алматы на строительство и (или) приобретение жилья, обеспечение занятости в области развития тепличного хозяйства на 2010 год в рамках Программы "Нұрлы көш" на 2009 - 2011 годы
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне 2009-2011 жылдарға арналған "Нұрлы көш" бағдарламасының шеңберінде тұрғын үй салуға және (немесе) сатып алуға, жылыжай шаруашылығын дамыту саласында жұмыспен қамтуды қамтамасыз етуге 2010 жылға кредит беру ережесін бекіту туралы

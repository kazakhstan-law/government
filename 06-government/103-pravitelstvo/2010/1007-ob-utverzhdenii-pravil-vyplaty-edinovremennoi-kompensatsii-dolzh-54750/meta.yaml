act_code: '54750'
requisite: Постановление Правительства Республики Казахстан от 7 октября 2010 года № 1034. Утратило силу постановлением Правительства Республики Казахстан от 20 октября 2011 года № 1192
title:
  rus: Об утверждении Правил выплаты единовременной компенсации должностному лицу таможенного органа при получении увечья, либо иного повреждения здоровья, исключающего для него возможность в дальнейшем заниматься профессиональной деятельностью, а также в случае его гибели (смерти) в связи с исполнением служебных обязанностей
  kaz: Кеден органының лауазымды адамына қызметтік міндеттерін орындауына байланысты, өзінің кәсіби қызметімен одан әрі айналысуына мүмкіндік бермейтіндей болып мертіккен не денсаулығына өзге де зақым келген кезде, сондай-ақ ол қаза тапқан (қайтыс болған) жағдайда біржолғы өтемақы төлеу қағидасын бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 22 апреля 2010 года № 337 "Об утверждении перечней родов и видов растений, по которым патентоспособность и хозяйственная полезность сорта оцениваются по данным государственного испытания или заявителя"
    kaz: '"Сорттың патент қабiлеттiлiгi мен шаруашылықта пайдалылығы мемлекеттiк сынақтың немесе өтiнiш берушiнiң деректерi бойынша бағаланатын өсiмдiктердiң тектерi мен түрлерiнiң тiзбесiн бекiту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 22 сәуірдегі № 337 қаулысына өзгерістер мен толықтырулар енгізу туралы'

act_code: '54979'
requisite: Постановление Правительства Республики Казахстан от 20 октября 2010 года № 1084. Утратило силу постановлением Правительства Республики Казахстан от 3 марта 2014 года № 171
title:
  rus: Об утверждении стандарта государственной услуги "Проведение ежегодного государственного технического осмотра тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, а также специальных машин повышенной проходимости"
  kaz: '"Тракторларды және олардың базасында жасалған өздігінен жүретін шассилер мен механизмдерді, монтаждалған арнайы жабдығы бар тіркемелерді қоса алғанда, олардың тіркемелерін, өздігінен жүретін ауыл шаруашылығы, мелиоративтік және жол-құрылысы машиналары мен механизмдерін, сондай-ақ өтімділігі жоғары арнайы машиналарды жыл сайынғы мемлекеттік техникалық байқаудан өткізу" мемлекеттік қызмет көрсету стандартын бекіту туралы'

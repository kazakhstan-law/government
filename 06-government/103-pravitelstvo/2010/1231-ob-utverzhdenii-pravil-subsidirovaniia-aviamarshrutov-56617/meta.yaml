  title:
    rus: Об утверждении Правил проведения конкурса на субсидируемые авиамаршруты и выдачи свидетельств на субсидируемые авиамаршруты для оказания услуг по перевозке пассажиров, багажа, грузов и почтовых отправлений и внесении изменений в постановление Правительства Республики Казахстан от 31 декабря 2010 года № 1511 "Об утверждении Правил субсидирования авиамаршрутов"
    kaz: Жолаушыларды, багажды, жүктер мен почта жөнелтiлiмдерiн тасымалдау бойынша қызметтер көрсету үшiн субсидияланатын авиамаршруттарға арналған конкурс өткізу және субсидияланатын авиамаршруттарға куәліктер беру қағидаларын бекіту туралы және "Авиамаршруттарды субсидиялау қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 31 желтоқсандағы № 1511 қаулысына өзгерістер енгізу туралы

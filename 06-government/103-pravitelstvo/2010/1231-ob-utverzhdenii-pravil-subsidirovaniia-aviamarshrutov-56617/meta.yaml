  requisite: Постановление Правительства Республики Казахстан от 25 июня 2019 года № 435
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 31 декабря 2010 года № 1511 «Об утверждении Правил субсидирования авиамаршрутов» и от 31 января 2013 года № 69 «Об утверждении Правил проведения конкурса на субсидируемые авиамаршруты и выдачи свидетельств на субсидируемые авиамаршруты для оказания услуг по перевозке пассажиров, багажа, грузов и почтовых отправлений и внесении изменений в постановление Правительства Республики Казахстан от 31 декабря 2010 года № 1511 «Об утверждении Правил субсидирования авиамаршрутов»
    kaz: Қазақстан Республикасы Үкіметінің «Авиамаршруттарды субсидиялау қағидасын бекіту туралы» 2010 жылғы 31 желтоқсандағы № 1511 және «Жолаушыларды, багажды, жүктер мен почта жөнелтiлiмдерiн тасымалдау бойынша қызметтер көрсету үшiн субсидияланатын авиамаршруттарға арналған конкурс өткізу және субсидияланатын авиамаршруттарға куәліктер беру қағидаларын бекіту туралы және «Авиамаршруттарды субсидиялау қағидасын бекіту туралы» Қазақстан Республикасы Үкіметінің 2010 жылғы 31 желтоқсандағы № 1511 қаулысына өзгерістер енгізу туралы» 2013 жылғы 31 қаңтардағы № 69 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/132900/rus

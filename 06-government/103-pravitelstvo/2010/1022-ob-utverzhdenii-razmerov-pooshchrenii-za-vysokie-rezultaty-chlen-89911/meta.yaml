  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 22 октября 2010 года № 1098 "Об утверждении размеров поощрений за высокие результаты членов национальных сборных команд Республики Казахстан на международных соревнованиях" и признании утратившим силу постановления Правительства Республики Казахстан от 19 февраля 2008 года № 167 "О некоторых вопросах материального стимулирования спортсменов и тренеров сборных команд Республики Казахстан за высокие спортивные результаты на Паралимпийских играх"
    kaz: '"Қазақстан Республикасының ұлттық құрама командаларының мүшелерін халықаралық жарыстардағы жоғары нәтижелері үшін көтермелеу мөлшерін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 22 қазандағы № 1098 қаулысына өзгеріс енгізу және "Қазақстан Республикасы құрама командаларының спортшылары мен жаттықтырушыларын Паралимпиялық ойындардағы жоғары спорттық нәтижелерi үшiн материалдық ынталандырудың кейбiр мәселелерi туралы" Қазақстан Республикасы Үкiметiнiң 2008 жылғы 19 ақпандағы № 167 қаулысының күшi жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/77293/rus

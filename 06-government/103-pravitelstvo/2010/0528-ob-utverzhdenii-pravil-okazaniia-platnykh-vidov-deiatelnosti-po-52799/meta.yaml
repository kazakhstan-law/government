requisite: Постановление Правительства Республики Казахстан от 28 мая 2010 года № 492. Утратило силу постановлением Правительства Республики Казахстан от 15 апреля 2016 года № 224
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в сфере сортоиспытания сельскохозяйственных растений и расходования ими денежных средств от реализации товаров (работ, услуг)
  kaz: Ауыл шаруашылығы өсімдіктерінің сорттарын сынау саласындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілген қызметті) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметті) өткізуден түскен ақша қаражатын жұмсау ережесін бекіту туралы

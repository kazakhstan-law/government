  title:
    rus: Об увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2010 года и использовании (доиспользовании) в 2011 году неиспользованных (недоиспользованных) сумм целевых трансфертов, выделенных из республиканского бюджета в 2010 году

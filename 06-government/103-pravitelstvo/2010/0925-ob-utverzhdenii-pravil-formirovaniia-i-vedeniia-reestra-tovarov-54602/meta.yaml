  kaz: Жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстардың және көрсетілетін қызметтердің және осы тізілімге енгізу үшін бағалау өлшемдерін қоса алғанда, оларды өндірушілердің тізілімін қалыптастыру және жүргізу қағидасын бекіту туралы

act_code: '51429'
requisite: Постановление Правительства Республики Казахстан от 29 марта 2010 года № 241
title:
  rus: Об утверждении Условий кредитования областных бюджетов, бюджетов городов Астаны и Алматы на строительство и приобретение жилья в рамках реализации Государственной программы жилищного строительства в Республике Казахстан на 2008 - 2010 годы
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне Қазақстан Республикасындағы тұрғын үй құрылысының 2008 - 2010 жылдарға арналған мемлекеттік бағдарламасын іске асыру шеңберінде тұрғын үй салуға және сатып алуға кредит беру шарттарын бекіту туралы

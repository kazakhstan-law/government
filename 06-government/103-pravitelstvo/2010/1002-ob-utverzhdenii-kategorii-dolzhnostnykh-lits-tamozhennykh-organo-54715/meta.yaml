title:
  rus: Об утверждении категорий должностных лиц таможенных органов, наделенных правом ношения, хранения огнестрельного оружия и пользования им, перечней специальных средств и видов огнестрельного оружия и боеприпасов, применяемых должностными лицами таможенных органов
  kaz: Атыс қаруын алып жүру, сақтау және оны пайдалану құқығы берілген кеден органдары лауазымды адамдарының санаттарын, кеден органдарының лауазымды адамдары қолданатын арнаулы құралдардың және атыс қаруы мен оқ-дәрі түрлерінің тізбелерін бекіту туралы

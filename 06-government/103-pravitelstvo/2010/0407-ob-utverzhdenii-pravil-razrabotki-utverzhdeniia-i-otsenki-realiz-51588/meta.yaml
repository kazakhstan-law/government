title:
  rus: Об утверждении Правил разработки, утверждения и оценки реализации стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний с участием государства в уставном капитале
  kaz: Ұлттық басқарушы холдингтердің, ұлттық холдингтердің және жарғылық капиталына мемлекет қатысатын ұлттық компаниялардың даму стратегиялары мен даму жоспарларын әзірлеу, бекіту және олардың іске асырылуын бағалау ережесін бекіту туралы

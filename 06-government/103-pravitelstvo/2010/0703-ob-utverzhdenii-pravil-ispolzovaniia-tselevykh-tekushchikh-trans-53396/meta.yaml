title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областными бюджетами, бюджетами городов Астаны и Алматы по обслуживанию населения по принципу "одного окна"
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің «жалғыз терезе» қағидаты бойынша халыққа қызмет көрсету жөніндегі ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

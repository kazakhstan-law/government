    rus: О внесении изменений в постановления Правительства Республики Казахстан от 31 июля 2010 года № 769 "Об утверждении Технического регламента "Требования к безопасности сигнализации, блокировки, связи и информатизации движения" и от 4 августа 2010 года № 794 "Об утверждении Технического регламента "Требования к безопасности железнодорожного транспорта и связанной с ним инфраструктуры"
    kaz: Қазақстан Республикасы Үкіметінің "Қозғалыс дабылының, бөгеуінің, байланысының және оны ақпараттандырудың қауіпсіздігіне қойылатын талаптар" техникалық регламентін бекіту туралы" 2010 жылғы 31 шілдедегі № 769 және "Темір жол көлігінің және оған байланысты инфрақұрылымның қауіпсіздігіне қойылатын талаптар" техникалық регламентін бекіту туралы" 2010 жылғы 4 тамыздағы № 794 қаулыларына өзгерістер енгізу туралы

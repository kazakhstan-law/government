  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 30 марта 2010 года № 243 "Об утверждении Правил предоставления субъектам малого предпринимательства в имущественный наем (аренду) или доверительное управление неиспользуемых объектов государственной собственности и занимаемых ими земельных участков для организации производственной деятельности и развития сферы услуг населению с последующей безвозмездной передачей в собственность"
    kaz: '"Өндірістік қызметті ұйымдастыру және халыққа қызметтер көрсету саласын дамыту үшін меншікке кейіннен өтеусіз бере отырып, мемлекеттік меншіктің пайдаланылмайтын объектілерін және олардың алып отырған жер учаскелерін шағын кәсіпкерлік субъектілеріне мүліктік жалға (жалдауға) немесе сенімгерлік басқаруға беру ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 30 наурыздағы № 243 қаулысына өзгерістер енгізу туралы'

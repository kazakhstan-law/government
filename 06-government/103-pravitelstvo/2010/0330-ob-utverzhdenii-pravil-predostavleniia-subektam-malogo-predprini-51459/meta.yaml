act_code: '51459'
requisite: Постановление Правительства Республики Казахстан от 30 марта 2010 года № 243. Утратило силу постановлением Правительства Республики Казахстан от 30 декабря 2015 года № 1140
title:
  rus: Об утверждении Правил предоставления субъектам малого предпринимательства в имущественный наем (аренду) или доверительное управление неиспользуемых объектов государственной собственности и занимаемых ими земельных участков для организации производственной деятельности и развития сферы услуг населению с последующей безвозмездной передачей в собственность
  kaz: Өндірістік қызметті ұйымдастыру және халыққа қызметтер көрсету саласын дамыту үшін меншікке кейіннен өтеусіз бере отырып, мемлекеттік меншіктің пайдаланылмайтын объектілерін және олардың алып отырған жер учаскелерін шағын кәсіпкерлік субъектілеріне мүліктік жалға (жалдауға) немесе сенімгерлік басқаруға беру ережесін бекіту туралы

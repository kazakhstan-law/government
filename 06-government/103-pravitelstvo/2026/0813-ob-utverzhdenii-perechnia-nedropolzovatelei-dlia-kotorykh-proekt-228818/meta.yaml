title:
  rus: Об утверждении перечня недропользователей, для которых проектом переработки твердых полезных ископаемых является комплекс мероприятий, предусматривающих создание новых, расширение и (или) модернизацию действующих производств по переработке твердых полезных ископаемых
  kaz: Пайдалы қатты қазбаларды қайта өңдеу бойынша жаңа өндірістер құруды, жұмыс істеп тұрғандарын кеңейтуді және (немесе) жаңғыртуды көздейтін іс-шаралар кешені пайдалы қатты қазбаларды қайта өңдеу жобасы болып табылатын жер қойнауын пайдаланушылардың тізбесін бекіту туралы

act_code: '224755'
requisite: Постановление Правительства Республики Казахстан от 30 апреля 2026 года № 351
title:
  rus: Об установлении требований и особенностей проведения оценки соответствия, а также выпуска в обращение транспортных средств, ввозимых из третьих стран представителями иностранных изготовителей, со дня изготовления которых прошло не более 3 лет
  kaz: Сәйкестікті бағалауды жүргізудің, сондай-ақ шетелдік дайындаушылардың өкілдері үшінші елдерден әкелетін, шығарылған күнінен бастап 3 жыл өтпеген көлік құралдарын айналысқа шығарудың талаптары мен ерекшеліктерін белгілеу туралы

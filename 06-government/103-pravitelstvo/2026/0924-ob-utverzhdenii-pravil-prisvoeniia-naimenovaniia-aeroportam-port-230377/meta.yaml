act_code: '230377'
requisite: Постановление Правительства Республики Казахстан от 24 сентября 2026 года № 838
title:
  rus: Об утверждении Правил присвоения наименования аэропортам, портам, железнодорожным вокзалам, железнодорожным станциям, станциям метрополитена, автовокзалам, автостанциям, физико-географическим и другим объектам государственной собственности на территории Республики Казахстан, а также переименования, уточнения и изменения транскрипции их наименований и присвоения собственных имен лиц государственным юридическим лицам, юридическим лицам с участием государства
  kaz: Қазақстан Республикасының аумағындағы әуежайларға, порттарға, теміржол вокзалдарына, теміржол станцияларына, метрополитен станцияларына, автовокзалдарға, автостанцияларға, физикалық-географиялық және мемлекет меншігіндегі басқа да объектілерге атау беру, сондай-ақ олардың атауын өзгерту, олардың атауларының транскрипциясын нақтылау мен өзгерту және мемлекеттік заңды тұлғаларға, мемлекет қатысатын заңды тұлғаларға жеке адамдардың есімдерін беру қағидаларын бекіту туралы

title:
  rus: Об утверждении Правил определения сметной стоимости строительства и договорной цены строительства в отношении строительных объектов, расположенных за пределами территории Республики Казахстан и финансируемых с привлечением государственных инвестиций
  kaz: Қазақстан Республикасының аумағынан тысқары орналасқан және мемлекеттік инвестицияларды тарта отырып қаржыландырылатын құрылыс объектілеріне қатысты құрылыстың сметалық құны мен құрылыстың шарттық бағасын айқындау қағидаларын бекіту туралы

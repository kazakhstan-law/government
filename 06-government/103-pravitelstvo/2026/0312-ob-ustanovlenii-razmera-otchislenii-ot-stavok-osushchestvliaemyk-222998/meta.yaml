act_code: '222998'
requisite: Постановление Правительства Республики Казахстан от 12 марта 2026 года № 167
title:
  rus: Об установлении размера отчислений от ставок, осуществляемых организатором игорного бизнеса, осуществляющим деятельность букмекерской конторы или тотализатора, направляемых единому оператору, осуществляющему деятельность по распределению внебюджетных денежных средств, направленных на развитие физической культуры и спорта, в фонд Национального олимпийского комитета Республики Казахстан на развитие олимпийских видов спорта и общественный фонд «Қазақстан халқына», а также на функционирование единой системы учета и обеспечение деятельности юридического лица, обеспечивающего функционирование единой системы учета, и определении пропорций направления отчислений
  kaz: Букмекерлік кеңсе немесе тотализатор қызметін жүзеге асыратын ойын бизнесін ұйымдастырушы жүзеге асыратын, дене шынықтыру мен спортты дамытуға бағытталған бюджеттен тыс ақша қаражатын бөлу жөніндегі қызметті жүзеге асыратын бірыңғай операторға, Қазақстан Республикасы Ұлттық олимпиада комитетінің қорына олимпиадалық спорт түрлерін дамытуға және «Қазақстан халқына» қоғамдық қорына, сондай-ақ бірыңғай есепке алу жүйесінің жұмыс істеуіне және бірыңғай есепке алу жүйесінің жұмыс істеуін қамтамасыз ететін заңды тұлғаның қызметін қамтамасыз етуге жіберілетін мөлшерлемелерден аударымдардың мөлшерін белгілеу және аударымдарды жіберу пропорциясын айқындау туралы

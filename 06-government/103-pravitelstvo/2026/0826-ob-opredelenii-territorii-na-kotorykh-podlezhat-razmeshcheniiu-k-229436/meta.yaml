act_code: '229436'
requisite: Постановление Правительства Республики Казахстан от 26 августа 2026 года № 767
title:
  rus: Об определении территорий, на которых подлежат размещению казино, залы игровых автоматов, букмекерские конторы и тотализаторы (кассы букмекерских контор и (или) тотализаторов), а также перечня отдельных территорий для размещения казино и залов игровых автоматов, в которые допускаются только иностранные граждане, лица без гражданства, работники игорного заведения и иные лица, находящиеся в игорном заведении в связи с выполнением трудовых (служебных) обязанностей
  kaz: Казино, ойын автоматтары залдары, букмекерлік кеңселер мен тотализаторлар (букмекерлік кеңселердің және (немесе) тотализаторлардың кассалары) орналастырылатын аумақтарды, сондай-ақ шетел азаматтарының, азаматтығы жоқ адамдардың, ойын мекемесінің жұмыскерлерінің және еңбек (қызметтік) міндеттерін орындаумен байланысты ойын мекемесінде болатын өзге де адамдардың ғана кіруіне жол берілетін казино мен ойын автоматтары залдарын орналастыру үшін жекелеген аумақтардың тізбесін айқындау туралы

act_code: '224052'
requisite: Постановление Правительства Республики Казахстан от 13 апреля 2026 года № 260
title:
  rus: Об утверждении перечня международных товарных бирж, на которых производятся приобретение и продажа товара в рамках финансирования физических и юридических лиц в качестве торгового посредника путем предоставления коммерческого кредита на условиях последующей продажи товара третьему лицу
  kaz: Тауарды үшінші тұлғаға кейіннен сату шарттарымен коммерциялық кредит беру арқылы сауда делдалы ретінде жеке және заңды тұлғаларды қаржыландыру шеңберінде тауарды сатып алу және сату жүргізілетін халықаралық тауар биржаларының тізбесін бекіту туралы

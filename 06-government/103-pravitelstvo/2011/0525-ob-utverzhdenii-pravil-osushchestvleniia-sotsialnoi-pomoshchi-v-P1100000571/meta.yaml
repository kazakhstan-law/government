requisite: Постановление Правительства Республики Казахстан от 25 мая 2011 года № 571
title:
  rus: Об утверждении Правил осуществления социальной помощи в виде ежемесячных выплат гражданам Республики Казахстан после завершения периода капитализации платежей по возмещению вреда, причиненного жизни и здоровью работников юридическими лицами, ликвидированными вследствие банкротства
  kaz: Қызметкерлердің өмірі мен денсаулығына келтірілген зиянды өтеу жөніндегі төлемдерді капиталдандыру кезеңі аяқталғаннан кейін банкроттық салдарынан таратылған заңды тұлғалардың Қазақстан Республикасының азаматтарына ай сайынғы төлемдер түріндегі әлеуметтік көмекті жүзеге асыру қағидаларын бекіту туралы

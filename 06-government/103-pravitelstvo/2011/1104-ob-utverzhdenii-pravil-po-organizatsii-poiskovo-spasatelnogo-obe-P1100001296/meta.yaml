  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 12 мая 2011 года № 506 «Об утверждении Правил использования воздушного пространства Республики Казахстан и внесении изменения в постановление Правительства Республики Казахстан от 31 декабря 2010 года № 1525 и о признании утратившими силу некоторых решений Правительства Республики Казахстан» и от 4 ноября 2011 года № 1296 «Об утверждении Правил по организации поисково-спасательного обеспечения полетов на территории Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасының әуе кеңістігін пайдалану қағидасын бекіту және Қазақстан Республикасы Үкіметінің 2010 жылғы 31 желтоқсандағы № 1525 қаулысына өзгеріс енгізу туралы және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» 2011 жылғы 12 мамырдағы № 506 қаулысына және «Қазақстан Республикасының аумағында ұшуды іздестіру-құтқарумен қамтамасыз етуді ұйымдастыру жөніндегі қағидаларды бекіту туралы» 2011 жылғы 4 қарашадағы № 1296 қаулысына өзгерістер енгізу туралы

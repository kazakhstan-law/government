act_code: '60708'
requisite: Постановление Правительства Республики Казахстан от 6 октября 2011 года № 1145
title:
  rus: Об утверждении Правил учета реквизированного имущества, переданного для нужд обеспечения мероприятий по ликвидации чрезвычайных ситуаций природного и техногенного характера, а также при проведении спасательных и аварийно-восстановительных работ
  kaz: Табиғи және техногендік сипаттағы төтенше жағдайларды жою жөніндегі іс-шараларды қамтамасыз ету мұқтажы үшін, сондай-ақ құтқару және авариялық-қалпына келтіру жұмыстарын жүргізу кезінде берілген реквизицияланған мүлікті есепке алу қағидасын бекіту туралы

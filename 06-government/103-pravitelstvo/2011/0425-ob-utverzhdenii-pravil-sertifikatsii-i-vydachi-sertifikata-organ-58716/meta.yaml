title:
  rus: Об утверждении Правил сертификации и выдачи сертификата организации по техническому обслуживанию и ремонту авиационной техники гражданской авиации
  kaz: Азаматтық авиацияның авиациялық техникасына техникалық қызмет көрсететін және оны жөндейтін ұйымды сертификаттау және сертификат беру қағидасын бекіту туралы

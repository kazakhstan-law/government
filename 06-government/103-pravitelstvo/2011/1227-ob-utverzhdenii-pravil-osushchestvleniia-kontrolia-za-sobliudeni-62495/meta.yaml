act_code: '62495'
requisite: Постановление Правительства Республики Казахстан от 27 декабря 2011 года № 1612. Утратило силу постановлением Правительства Республики Казахстан от 23 апреля 2018 года № 213 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления контроля за соблюдением порядка учета, хранения, оценки, дальнейшего использования и реализации имущества, обращенного (подлежащего обращению) в собственность государства, за полнотой и своевременностью поступления денег в бюджет в случае его реализации, а также порядка передачи имущества, обращенного (подлежащего обращению) в собственность государства
  kaz: Мемлекет меншiгiне айналдырылған (айналдыруға жататын) мүлiктi есепке алу, сақтау, бағалау, одан әрi пайдалану және өткiзу тәртiбiнiң сақталуын, ол сатылған жағдайда ақшаның бюджетке толық және уақтылы түсуiн, сондай-ақ мемлекет меншiгiне айналдырылған (айналдырылуға жататын) мүлiктi беру тәртiбiнiң сақталуын бақылауды жүзеге асыру қағидаларын бекіту туралы

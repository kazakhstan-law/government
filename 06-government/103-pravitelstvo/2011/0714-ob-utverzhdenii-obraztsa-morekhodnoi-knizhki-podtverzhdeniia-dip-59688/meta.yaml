  requisite: Постановление Правительства Республики Казахстан от 27 августа 2013 года № 863
  title:
    rus: Об утверждении образца удостоверения личности моряка Республики Казахстан и требований к его защите, Правил оформления, выдачи, замены, сдачи, изъятия и уничтожения удостоверения личности моряка Республики Казахстан и внесении изменений в постановление Правительства Республики Казахстан от 14 июля 2011 года № 797 "Об утверждении образца удостоверения личности моряка Республики Казахстан, мореходной книжки, подтверждения дипломов, Правил их оформления, выдачи, продления, а также изъятия"
    kaz: Қазақстан Республикасының теңізшісі жеке куәлігінің үлгісін және оны қорғауға қойылатын талаптарды, Қазақстан Республикасы теңізшісінің жеке куәлігін ресімдеу, беру, ауыстыру, тапсыру, алып қою және жою қағидаларын бекіту және "Қазақстан Республикасының теңізшісі жеке куәлігінің, теңізде жүзу кітапшасының, дипломдарды растаудың үлгісін, оларды ресімдеу, беру, мерзімін ұзарту, сондай-ақ алып қою қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 14 шілдедегі № 797 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/74157/rus

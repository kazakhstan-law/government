  title:
    rus: О некоторых вопросах по реализации указов Президента Республики Казахстан от 3 мая 2022 года № 886 «О некоторых вопросах административно-территориального устройства Республики Казахстан» и от 3 мая 2022 года № 887 «О некоторых вопросах административно-территориального устройства Республики Казахстан»

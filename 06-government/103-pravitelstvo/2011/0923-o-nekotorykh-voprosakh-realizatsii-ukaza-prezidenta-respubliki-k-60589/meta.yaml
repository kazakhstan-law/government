    kaz: '"Мемлекеттік күзетілуі тиіс объектілердің кейбір мәселелері" туралы Қазақстан Республикасы Үкіметінің 2011 жылғы 7 қазандағы № 1151 қаулысына өзгеріс енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы'

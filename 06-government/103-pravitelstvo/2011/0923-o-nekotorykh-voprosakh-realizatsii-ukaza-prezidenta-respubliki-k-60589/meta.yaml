  kaz: '"Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы" Қазақстан Республикасы Президентінің 2011 жылғы 10 тамыздағы № 136 Жарлығын іске асырудың кейбір мәселелері туралы'

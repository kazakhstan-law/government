  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 4 марта 2011 года № 232 "Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным образованием в организациях образования, финансируемых из республиканского бюджета (за исключением подготовки специалистов в организациях образования Комитета национальной безопасности Республики Казахстан) на 2011/2012 учебный год"
    kaz: '"Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің білім беру ұйымдарында мамандар даярлауды қоспағанда) жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік білімі бар мамандар даярлауға 2011/2012 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 4 наурыздағы № 232 қаулысына өзгерістер енгізу туралы'

act_code: '62886'
requisite: Постановление Правительства Республики Казахстан от 30 декабря 2011 года № 1733. Утратило силу постановлением Правительства Республики Казахстан от 11 апреля 2013 года № 332
title:
  rus: Об утверждении Правил исполнения налогового обязательства по налогу на добавленную стоимость юридическими лицами-нерезидентами, осуществляющими деятельность без образования постоянного учреждения, при временном ввозе на территорию Республики Казахстан товаров, не предусмотренных перечнем товаров, временный ввоз которых на территорию Республики Казахстан освобождается от уплаты налога на добавленную стоимость, утвержденным Правительством Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі бекіткен Қазақстан Республикасының аумағына уақытша әкелу қосылған құн салығын төлеуден босатылатын тауарлар тізбесінде көзделмеген тауарларды Қазақстан Республикасының аумағына уақытша әкелу кезінде қызметін тұрақты мекеме құрмай жүзеге асыратын резидент емес заңды тұлғалардың қосылған құн салығы бойынша салық міндеттемесін орындау қағидаларын бекіту туралы

requisite: Постановление Правительства Республики Казахстан от 2 декабря 2011 года № 1442. Утратило силу постановлением Правительства Республики Казахстан от 23 июля 2015 года № 573
title:
  rus: Об утверждении Правил предоставления в налоговый орган акимами поселков, аулов (сел), аульных (сельских) округов отчетов об использовании квитанций по сбору налогов на имущество, транспортные средства и земельного налога, уплачиваемых налогоплательщиком - физическим лицом, а также о сдаче сумм налогов в банк или организацию, осуществляющую отдельные виды банковских операций
  kaz: Кенттер, ауылдар (селолар), ауылдық (селолық) округтер әкімдерінің салық органына салық төлеуші жеке тұлға төлейтін мүлік, көлік құралы салықтары мен жер салығын жинау жөніндегі квитанцияларды пайдалану туралы, сондай-ақ салық сомасын банкке немесе банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымға тапсыру туралы есептер беру қағидаларын бекіту туралы

title:
  rus: Об утверждении Правил организации и проведения обязательного технического осмотра механических транспортных средств и прицепов к ним, периодичности прохождения обязательного технического осмотра механических транспортных средств и прицепов к ним, а также формы диагностической карты технического осмотра
  kaz: Механикалық көлік құралдарын және олардың тіркемелерін міндетті техникалық байқауды ұйымдастыру және жүргізу қағидасын, механикалық көлік құралдарын және олардың тіркемелерін міндетті техникалық байқаудан өткізудің кезеңділігін, сондай-ақ техникалық байқаудың диагностикалық картасының нысанын бекіту туралы

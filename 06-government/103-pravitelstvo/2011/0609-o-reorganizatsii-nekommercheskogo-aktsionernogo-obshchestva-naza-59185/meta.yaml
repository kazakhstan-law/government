title:
  rus: О реорганизации некоммерческого акционерного общества "Назарбаев Университет" и акционерного общества "Назарбаев Интеллектуальные школы"
  kaz: '"Назарбаев Университеті" коммерциялық емес акционерлік қоғамы мен "Назарбаев Зияткерлік мектептері" акционерлік қоғамын қайта ұйымдастыру туралы'

  title:
    rus: Об утверждении Единой программы поддержки и развития бизнеса "Дорожная карта бизнеса 2020", внесении изменений в постановление Правительства Республики Казахстан от 10 июня 2010 года № 556 "О некоторых мерах по реализации Программы "Дорожная карта бизнеса 2020" и признании утратившими силу некоторых решений Правительства Республики Казахстан"
    kaz: '"Бизнестің жол картасы-2020" бизнесті қолдау мен дамытудың бірыңғай бағдарламасын бекіту, "Бизнестің жол картасы 2020" іске асыру жөніндегі кейбір шаралар туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 10 маусымдағы № 556 қаулысына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы'

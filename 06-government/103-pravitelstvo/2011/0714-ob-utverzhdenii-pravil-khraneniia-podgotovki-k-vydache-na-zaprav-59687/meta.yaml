title:
  rus: Об утверждении Правил хранения, подготовки к выдаче на заправку и проведения контроля качества авиационных горюче-смазочных материалов и специальных жидкостей в организациях гражданской авиации Республики Казахстан
  kaz: Қазақстан Республикасының азаматтық авиация ұйымдарында авиациялық жанар-жағармай материалдары мен арнаулы сұйықтықтарды сақтаудың, құюға беруге дайындаудың және олардың сапасына бақылау жүргiзудiң қағидасын бекіту туралы

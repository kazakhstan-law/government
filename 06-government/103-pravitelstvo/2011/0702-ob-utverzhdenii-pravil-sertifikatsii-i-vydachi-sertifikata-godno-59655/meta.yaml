  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 2 июля 2011 года № 760 "Об утверждении Правил сертификации и выдачи сертификата годности аэродрома (вертодрома)" и 13 сентября 2012 года № 1195 "Об утверждении стандартов государственных услуг в сфере гражданской авиации и внесении изменений в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: Қазақстан Республикасы Үкіметінің "Әуеайлақтың (тiкұшақ айлағының) жарамдылығын сертификаттау және сертификат беру қағидасын бекiту туралы" 2011 жылғы 2 шілдедегі № 760 және "Азаматтық авиация саласындағы мемлекеттік қызмет стандарттарын бекіту және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына өзгерістер енгізу туралы" 2012 жылғы 13 қыркүйектегі № 1195 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/75472/rus

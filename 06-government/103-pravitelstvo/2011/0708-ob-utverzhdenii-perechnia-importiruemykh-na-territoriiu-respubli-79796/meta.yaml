  title:
    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 8 июля 2011 года № 782 «Об утверждении перечня импортируемых на территорию Республики Казахстан с территории государств-членов Таможенного союза товаров, предназначенных для промышленной переработки, и перечня готовой продукции, полученной при указанной промышленной переработке, а также перечня налогоплательщиков Республики Казахстан, импортирующих такие товары»
    kaz: «Қазақстан Республикасының аумағына Кеден одағына мүше мемлекеттердің аумағынан импортталатын, өнеркәсіптік қайта өңдеуге арналған тауарлар тізбесін және көрсетілген өнеркәсіптік қайта өңдеу кезінде алынған дайын өнім тізбесін, сондай-ақ Қазақстан Республикасының осындай тауарларды импорттайтын салық төлеушілерінің тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2011 жылғы 8 шілдедегі № 782 қаулысына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/108741/rus

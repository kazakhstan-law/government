act_code: '79796'
requisite: Постановление Правительства Республики Казахстан от 8 июля 2011 года № 782. Утратил силу постановлением Правительства Республики Казахстан от 28 декабря 2017 года № 902 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении перечня импортируемых на территорию Республики Казахстан с территории государств-членов Таможенного союза товаров, предназначенных для промышленной переработки, и перечня готовой продукции, полученной при указанной промышленной переработке, а также перечня налогоплательщиков Республики Казахстан, импортирующих такие товары
  kaz: Қазақстан Республикасының аумағына Кеден одағына мүше мемлекеттердің аумағынан импортталатын, өнеркәсіптік қайта өңдеуге арналған тауарлар тізбесін және көрсетілген өнеркәсіптік қайта өңдеу кезінде алынған дайын өнім тізбесін, сондай-ақ Қазақстан Республикасының осындай тауарларды импорттайтын салық төлеушілерінің тізбесін бекіту туралы

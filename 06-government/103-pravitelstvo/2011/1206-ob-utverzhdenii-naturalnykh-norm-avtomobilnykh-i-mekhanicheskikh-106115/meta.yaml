title:
  rus: Об утверждении натуральных норм автомобильных и механических транспортных средств для обслуживания государственных учреждений - противочумных станций Комитета государственного санитарно-эпидемиологического надзора Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігі Мемлекеттік санитарлық-эпидемиологиялық қадағалау комитетінің мемлекеттік мекемелері - обаға қарсы күрес станцияларына қызмет күрсетуге арналған автомобиль және механикалық көлік құралдарының заттай нормаларын бекіту туралы

  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 13 мая 2011 года № 512 "Об утверждении Правил профессиональной подготовки авиационного персонала, непосредственно участвующего в обеспечении безопасности полетов" и от 25 апреля 2011 года № 441 "Об утверждении сертификационных требований к авиационным учебным центрам"

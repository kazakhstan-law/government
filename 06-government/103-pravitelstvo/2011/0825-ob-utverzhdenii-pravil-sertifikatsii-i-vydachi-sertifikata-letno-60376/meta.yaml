  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 25 августа 2011 года № 962 "Об утверждении Правил сертификации и выдачи сертификата летной годности гражданского воздушного судна Республики Казахстан" и от 13 сентября 2012 года № 1195 "Об утверждении стандартов государственных услуг в сфере гражданской авиации и внесении изменений в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: Қазақстан Республикасы Үкiметiнiң "Қазақстан Республикасының азаматтық әуе кемесiнiң ұшуға жарамдылығын сертификаттау және сертификат беру қағидасын бекіту туралы" 2011 жылғы 25 тамыздағы № 962 және "Азаматтық авиация саласындағы мемлекеттік қызмет стандарттарын бекіту және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына өзгерістер енгізу туралы" 2012 жылғы 13 қыркүйектегі № 1195 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/76136/rus

act_code: '62744'
requisite: Постановление Правительства Республики Казахстан от 14 декабря 2011 года № 1533
title:
  rus: Об утверждении перечня товаров, за исключением подакцизных, материалов и оборудования, освобождаемых от уплаты таможенных пошлин, таможенных сборов и налога на добавленную стоимость, прямо связанных с производственным процессом строительства Второго участка газопровода "Казахстан - Китай" и ввозимых на территорию Республики Казахстан для использования в строительстве Второго участка газопровода "Казахстан - Китай" организацией, созданной на территории Республики Казахстан для целей реализации проекта Второго участка газопровода "Казахстан - Китай"
  kaz: Акцизделетіндерді қоспағанда, "Қазақстан - Қытай" газ құбыры Екінші учаскесінің жобасын іске асыру мақсатында "Қазақстан - Қытай" газ құбырының Екінші учаскесін салудың өндірістік процесіне тікелей байланысты және Қазақстан Республикасының аумағында құрылған ұйым "Қазақстан - Қытай" газ құбырының Екінші учаскесін салуда пайдалану үшін Қазақстан Республикасының аумағына әкелетін, кедендік баждарды, кедендік алымдарды және қосылған құн салығын төлеуден босатылатын тауарлардың, материалдар мен жабдықтардың тізбесін бекіту туралы

    kaz: '"Акцизделетіндерді қоспағанда, "Қазақстан - Қытай" газ құбыры Екінші учаскесінің жобасын іске асыру мақсатында "Қазақстан - Қытай" газ құбырының Екінші учаскесін салудың өндірістік процесіне тікелей байланысты және Қазақстан Республикасының аумағында құрылған ұйым "Қазақстан - Қытай" газ құбырының Екінші учаскесін салуда пайдалану үшін Қазақстан Республикасының аумағына әкелетін, кедендік баждарды, кедендік алымдарды және қосылған құн салығын төлеуден босатылатын тауарлардың, материалдар мен жабдықтардың тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 14 желтоқсандағы № 1533 қаулысына өзгерістер енгізу туралы'

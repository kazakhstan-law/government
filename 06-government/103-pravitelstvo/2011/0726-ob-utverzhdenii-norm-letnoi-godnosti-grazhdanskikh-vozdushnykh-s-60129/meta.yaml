  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 26 июля 2011 года № 859 "Об утверждении норм летной годности гражданских воздушных судов Республики Казахстан" и от 18 января 2012 года № 103 "Об утверждении Основных правил полетов в воздушном пространстве Республики Казахстан"
    kaz: Қазақстан Республикасы Үкiметiнiң "Қазақстан Республикасының азаматтық әуе кемелерiнiң ұшуға жарамдылығының нормаларын бекiту туралы" 2011 жылғы 26 шiлдедегi № 859 және "Қазақстан Республикасының әуе кеңiстiгiнде ұшудың негiзгi қағидаларын бекiту туралы" 2012 жылғы 18 қаңтардағы № 103 қаулыларына өзгерістер мен толықтырулар енгізу туралы

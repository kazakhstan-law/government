title:
  rus: Об утверждении Правил проведения ежегодного отчета о деятельности субъекта естественной монополии по предоставлению регулируемых услуг (товаров, работ) перед потребителями и иными заинтересованными лицами
  kaz: Тұтынушыларға және өзге де мүдделi тұлғаларға реттелiп көрсетiлетiн қызметтерді (тауарларды, жұмыстарды) ұсыну жөнiндегi табиғи монополия субъектiсiнiң қызметi туралы жыл сайынғы есептi өткiзу қағидаларын бекіту туралы

act_code: '59310'
requisite: Постановление Правительства Республики Казахстан от 22 июня 2011 года № 686. Утратило силу постановлением Правительства Республики Казахстан от 8 сентября 2015 года № 754
title:
  rus: Об утверждении Правил создания наблюдательного совета в государственных предприятиях на праве хозяйственного ведения, требований, предъявляемых к лицам, избираемым в состав наблюдательного совета, а также Правил конкурсного отбора членов наблюдательного совета и досрочного прекращения их полномочий
  kaz: Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындарда байқау кеңесін құру қағидасын, байқау кеңесінің құрамына сайланатын адамдарға қойылатын талаптарды, сондай-ақ Байқау кеңесінің мүшелерін конкурстық іріктеу және олардың өкілеттігін мерзімінен бұрын тоқтату қағидасын бекіту туралы

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 22 июня 2011 года № 686 "Об утверждении Правил создания наблюдательного совета в государственных предприятиях на праве хозяйственного ведения, требований, предъявляемых к лицам, избираемым в состав наблюдательного совета, а также Правил конкурсного отбора членов наблюдательного совета и досрочного прекращения их полномочий"
    kaz: '"Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындарда байқау кеңесін құру қағидасын, байқау кеңесінің құрамына сайланатын адамдарға қойылатын талаптарды, сондай-ақ Байқау кеңесінің мүшелерін конкурстық іріктеу және олардың өкілеттігін мерзімінен бұрын тоқтату қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 22 маусымдағы № 686 қаулысына өзгерістер енгізу туралы'

  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 14 апреля 2010 года № 302 "Об утверждении Плана мероприятий Правительства Республики Казахстан по реализации Государственной программы по форсированному индустриально-инновационному развитию Республики Казахстан на 2010 - 2014 годы" и от 4 марта 2011 года № 222 "Об утверждении Правил разработки и согласования Генеральной схемы организации территории Республики Казахстан"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасы Үкіметінің Қазақстан Республикасын үдемелі индустриялық-инновациялық дамыту жөніндегі 2010 – 2014 жылдарға арналған мемлекеттік бағдарламаны іске асыру жөніндегі іс-шаралар жоспарын бекіту туралы" 2010 жылғы 14 сәуірдегі № 302 және "Қазақстан Республикасының аумағын ұйымдастырудың бас схемасын әзірлеу және келісу қағидасын бекіту туралы" 2011 жылғы 4 наурыздағы № 222 қаулыларына өзгерістер мен толықтыру енгізу туралы

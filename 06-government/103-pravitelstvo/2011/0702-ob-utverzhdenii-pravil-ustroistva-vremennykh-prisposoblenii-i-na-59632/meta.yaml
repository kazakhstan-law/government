title:
  rus: Об утверждении Правил устройства временных приспособлений и наплавных сооружений для причаливания, швартовки и стоянки судов, плотов и иных плавучих объектов, посадки на суда и высадки с судов пассажиров, погрузки, выгрузки и хранения грузов
  kaz: Кемелердiң, салдардың және өзге де жүзу объектiлерiнiң айлаққа келуiне, арқандап байлануына және тоқтап тұруына арналған уақытша құрылғылар мен жүзбелi құрылыстарды орналастыру, жолаушыларды кемелерге отырғызу және кемелерден түсiру, жүктердi тиеу, түсiру және сақтау қағидасын бекiту туралы

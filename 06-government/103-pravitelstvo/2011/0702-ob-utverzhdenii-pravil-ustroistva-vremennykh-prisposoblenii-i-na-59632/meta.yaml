  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 2 июля 2011 года № 765 "Об утверждении Правил устройства временных приспособлений и наплавных сооружений для причаливания, швартовки и стоянки судов, плотов и иных плавучих объектов, посадки на суда и высадки с судов пассажиров, погрузки, выгрузки и хранения грузов"
    kaz: '"Кемелердің, салдардың және өзге де жүзу объектiлерiнiң айлаққа келуіне, арқандап байлануына және тоқтап тұруына арналған уақытша құрылғылар мен жүзбелі құрылыстарды орналастыру, жолаушыларды кемелерге отырғызу және кемелерден түсіру, жүктерді тиеу, түсіру және сақтау қағидасын бекіту туралы" Қазақстан Республикасы Үкiметiнiң 2011 жылғы 2 шілдедегі № 765 қаулысына өзгерістер енгізу туралы'

  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 30 декабря 2011 года № 1705 "Об утверждении Правил применения уплаты налога на добавленную стоимость методом зачета по товарам, импортируемым на территорию Республики Казахстан с территории государств-членов Таможенного союза"
    kaz: '"Қазақстан Республикасының аумағына Кеден одағына мүше мемлекеттердің аумағынан импортталатын тауарлар бойынша есепке жатқызу әдісімен қосылған құн салығын төлеуді қолдану қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 30 желтоқсандағы № 1705 қаулысына өзгеріс пен толықтыру енгізу туралы'

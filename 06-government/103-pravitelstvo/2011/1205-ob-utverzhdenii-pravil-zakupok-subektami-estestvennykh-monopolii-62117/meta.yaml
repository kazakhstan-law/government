  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 5 декабря 2011 года № 1467 "Об утверждении Правил закупок субъектами естественных монополий товаров, работ и услуг, затраты на которые учитываются при утверждении тарифов (цен, ставок сборов) или их предельных уровней и тарифных смет на регулируемые услуги" и от 19 января 2012 года № 107 "Об утверждении Правил предоставления равных условий доступа к регулируемым услугам (товарам, работам) в сфере естественных монополий"
    kaz: Қазақстан Республикасы Үкіметінің "Реттеліп көрсетiлетiн қызметтерге тарифтерді (бағаларды, алымдар ставкаларын) немесе олардың шекті деңгейлерін және тарифтік сметаларды бекіту кезінде шығындары ескерiлетiн тауарларды, жұмыстар мен қызметтерді табиғи монополиялар субъектiлерiнiң сатып алу қағидаларын бекіту туралы" 2011 жылғы 5 желтоқсандағы № 1467 және "Табиғи монополиялар саласындағы реттеліп көрсетілетін қызметтерге (тауарларға, жұмыстарға) қол жеткізудің тең жағдайларын ұсыну қағидаларын бекіту туралы" 2012 жылғы 19 қаңтардағы № 107 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/73629/rus

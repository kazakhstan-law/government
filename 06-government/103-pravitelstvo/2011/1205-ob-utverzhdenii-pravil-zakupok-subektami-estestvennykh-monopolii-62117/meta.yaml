title:
  rus: Об утверждении Правил закупок субъектами естественных монополий товаров, работ и услуг, затраты на которые учитываются при утверждении тарифов (цен, ставок сборов) или их предельных уровней и тарифных смет на регулируемые услуги
  kaz: Реттеліп көрсетiлетiн қызметтерге тарифтерді (бағаларды, алымдар ставкаларын) немесе олардың шекті деңгейлерін және тарифтік сметаларды бекіту кезінде шығындары ескерiлетiн тауарларды, жұмыстар мен қызметтерді табиғи монополиялар субъектiлерiнiң сатып алу қағидаларын бекіту туралы

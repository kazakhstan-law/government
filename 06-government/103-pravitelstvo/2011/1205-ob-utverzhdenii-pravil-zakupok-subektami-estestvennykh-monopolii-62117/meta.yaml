  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 5 декабря 2011 года № 1467 "Об утверждении Правил закупок субъектами естественных монополий товаров, работ и услуг, затраты на которые учитываются при утверждении тарифов (цен, ставок сборов) или их предельных уровней и тарифных смет на регулируемые услуги"
    kaz: '"Реттеліп көрсетілетін қызметтерге тарифтерді (бағаларды, алымдар ставкаларын) немесе олардың шекті деңгейлерін және тарифтік сметаларды бекіту кезінде шығындары ескерілетін тауарларды, жұмыстар мен қызметтерді табиғи монополиялар субъектілерінің сатып алу қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 5 желтоқсандағы № 1467 қаулысына өзгеріс пен толықтыру енгізу туралы'

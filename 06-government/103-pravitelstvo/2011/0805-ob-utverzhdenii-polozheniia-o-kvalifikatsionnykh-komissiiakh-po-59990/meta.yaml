  title:
    rus: О внесении изменения и дополнений в постановление Правительства Республики Казахстан от 5 августа 2011 года № 915 "Об утверждении Положения о квалификационных комиссиях по дипломированию и аттестации лиц командного состава судов и Правил дипломирования и аттестации лиц командного состава судов, подлежащих государственной регистрации в Государственном судовом реестре Республики Казахстан"
    kaz: '"Қазақстан Республикасының Мемлекеттік кеме тізілімінде мемлекеттік тіркеуге жататын кемелердің командалық құрамының адамдарына диплом беру және аттестаттау бойынша біліктілік комиссиялары туралы ережені және Кемелердің командалық құрамының адамдарына диплом беру және аттестаттау қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 5 тамыздағы № 915 қаулысына өзгеріс пен толықтырулар енгізу туралы'

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 5 августа 2011 года № 915 "Об утверждении Положения о квалификационных комиссиях по дипломированию и аттестации лиц командного состава и других членов экипажей судов и Правил дипломирования и аттестации лиц командного состава и других членов экипажей судов"
    kaz: '"Кемелердің командалық құрамының адамдарына және экипаждың басқа да мүшелеріне диплом беру және аттестаттау бойынша біліктілік комиссиялары туралы ережені және Кемелердің командалық құрамының адамдарына және экипаждың басқа да мүшелеріне диплом беру және аттестаттау қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 5 тамыздағы № 915 қаулысына өзгерістер енгізу'
  link: https://zan.gov.kz/client/#!/doc/69334/rus

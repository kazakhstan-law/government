  title:
    rus: Об утверждении стандартов государственных услуг «Выдача лицензии, переоформление, выдача дубликата лицензии на изыскательскую деятельность», «Выдача лицензии, переоформление, выдача дубликатов лицензии на деятельность по организации строительства жилых зданий за счет привлечения денег дольщиков» и внесении изменений в постановления Правительства Республики Казахстан от 7 октября 2010 года № 1036 «Об утверждении стандартов государственных услуг «Выдача лицензии, переоформление, выдача дубликата лицензии на проектную деятельность», «Выдача лицензии, переоформление, выдача дубликата лицензии на строительно-монтажные работы» и от 7 апреля 2011 года № 394 «Об утверждении стандартов государственных услуг в сфере социальной защиты, оказываемых местными исполнительными органами»
    kaz: '"Іздестіру қызметіне лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру", "Үлескерлердің ақшасын тарту есебінен тұрғын ғимараттар құрылысын ұйымдастыру жөніндегі қызметке лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру" мемлекеттік көрсетілетін қызмет стандарттарын бекіту және Қазақстан Республикасы Үкіметінің "Жобалау қызметіне лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру", "Құрылыс-монтаж жұмыстарына лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру" мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы" 2010 жылғы 7 қазандағы № 1036 және "Жергілікті атқарушы органдар көрсететін әлеуметтік қорғау саласындағы мемлекеттік қызметтердің стандарттарын бекіту туралы" 2011 жылғы 7 сәуірдегі № 394 қаулыларына өзгерістер енгізу туралы'

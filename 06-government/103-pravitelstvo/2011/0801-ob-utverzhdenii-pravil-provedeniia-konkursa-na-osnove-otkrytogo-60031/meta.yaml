title:
  rus: Об утверждении Правил проведения конкурса на основе открытого тендера по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по социально значимым межобластным сообщениям, убытки которых подлежат субсидированию за счет бюджетных средств
  kaz: Залалдары бюджет қаражаты есебінен субсидиялауға жататын әлеуметтік мәні бар облысаралық қатынастар бойынша темір жолда жолаушылар тасымалдауды жүзеге асыратын тасымалдаушыларды айқындау жөніндегі ашық тендер негізінде конкурс өткізу қағидасын бекіту туралы

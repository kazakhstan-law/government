  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 11 ноября 2004 года № 1188 "Об утверждении Правил субсидирования убытков перевозчика, связанных с осуществлением пассажирских перевозок по социально значимым сообщениям" и от 1 августа 2011 года № 886 "Об утверждении Правил проведения конкурса на основе открытого тендера по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по социально значимым межобластным сообщениям, убытки которых подлежат субсидированию за счет бюджетных средств"
    kaz: Қазақстан Республикасы Үкіметінің "Тасымалдаушының әлеуметтік мәні бар қатынастар бойынша жолаушылар тасымалдауды жүзеге асыруына байланысты залалдарын субсидиялау ережесін бекіту туралы" 2004 жылғы 11 қарашадағы № 1188 және "Залалдары бюджет қаражаты есебінен субсидиялауға жататын әлеуметтік мәні бар облысаралық қатынастар бойынша темір жолда жолаушылар тасымалдауды жүзеге асыратын тасымалдаушыларды айқындау жөніндегі ашық тендер негізінде конкурс өткізу қағидасын бекіту туралы" 2011 жылғы 1 тамыздағы № 886 қаулыларына өзгерістер және толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/69017/rus

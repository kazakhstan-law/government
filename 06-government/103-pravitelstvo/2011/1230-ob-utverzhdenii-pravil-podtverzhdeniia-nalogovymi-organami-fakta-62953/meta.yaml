title:
  rus: Об утверждении Правил подтверждения налоговыми органами факта уплаты налога на добавленную стоимость по импортированным товарам и акциза по импортированным подакцизным товарам с территории государств-членов Таможенного союза либо мотивированного отказа в подтверждении
  kaz: Салық органдарының Кеден одағына мүше мемлекеттердің аумағынан импортталған тауарлар бойынша қосылған құн салығын және импортталған акцизделетін тауарлар бойынша акцизді төлеу фактісін растау не растаудан дәлелді бас тарту қағидаларын бекіту туралы

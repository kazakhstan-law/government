  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 25 мая 2011 года № 571 "Об утверждении Правил осуществления ежемесячных выплат гражданам Республики Казахстан после завершения периода капитализации платежей по возмещению вреда, причиненного жизни и здоровью работников юридическими лицами, ликвидированными вследствие банкротства"
    kaz: '"Қызметкерлердің өмірі мен денсаулығына келтірілген зиянды өтеу жөніндегі төлемдерді капиталдандыру кезеңі аяқталғаннан кейін банкроттық салдарынан таратылған заңды тұлғалардың Қазақстан Республикасының азаматтарына ай сайынғы төлемдерді жүзеге асыру қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 25 мамырдағы № 571 қаулысына өзгерістер мен толықтыру енгізу туралы'

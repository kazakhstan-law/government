act_code: '57271'
requisite: Постановление Правительства Республики Казахстан от 10 февраля 2011 года № 115. Утратило силу постановлением Правительства Республики Казахстан от 28 августа 2015 года № 685
title:
  rus: Об утверждении Правил представления таможенным представителем отчетности, в том числе с использованием информационных технологий в таможенные органы, Правил ведения учета поступления товаров в магазин беспошлинной торговли и их реализации в этом магазине, а также представления таможенным органам отчетности о таких товарах и форм отчетов о применении таможенной процедуры переработки на/вне таможенной территории и для внутреннего потребления
  kaz: Кеден өкілінің кеден органдарына есептілікті ұсыну, оның ішінде ақпараттық технологияларды пайдалана отырып ұсыну қағидасын, Бажсыз сауда дүкеніне тауарлар түсуінің және оларды осы дүкенде өткізудің есебін жүргізу, сондай-ақ кеден органдарына мұндай тауарлар туралы есептілікті ұсыну қағидасын және кедендік аумақта/н тыс және ішкі тұтыну үшін қайта өңдеу кедендік рәсімін қолдану туралы есептердің нысандарын бекіту туралы

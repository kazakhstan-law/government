title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областными бюджетами, бюджетами городов Астаны и Алматы на 2011 год на субсидирование повышения урожайности продукции растениеводства
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің өсімдік шаруашылығы өнімінің шығымдылығын арттыруды субсидиялауға 2011 жылға арналған ағымдағы нысаналы трансферттерді пайдалану қағидасын бекіту туралы

title:
  rus: Об утверждении Правил прикомандирования в таможенные органы государственных ветеринарно-санитарных инспекторов и государственных инспекторов по карантину растений уполномоченного государственного органа в области ветеринарии и карантина растений
  kaz: Ветеринария және өсімдіктер карантині саласындағы уәкілетті мемлекеттік органның мемлекеттік ветеринариялық-санитариялық инспекторлары мен өсімдіктер карантині жөніндегі мемлекеттік инспекторларын кеден органдарына іссапарға жіберу қағидасын бекіту туралы

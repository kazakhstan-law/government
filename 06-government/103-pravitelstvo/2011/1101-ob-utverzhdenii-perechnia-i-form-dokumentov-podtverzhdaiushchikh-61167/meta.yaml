title:
  rus: Об утверждении перечня и форм документов, подтверждающих соответствие организатора игорного бизнеса квалификационным требованиям
  kaz: Ойын бизнесін ұйымдастырушының біліктілік талаптарына сәйкестігін растайтын құжаттардың тізбесі мен нысандарын бекіту туралы

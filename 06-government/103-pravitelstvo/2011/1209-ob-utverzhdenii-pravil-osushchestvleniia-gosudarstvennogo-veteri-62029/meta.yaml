act_code: '62029'
requisite: Постановление Правительства Республики Казахстан от 9 декабря 2011 года № 1506. Утратило силу постановлением Правительства Республики Казахстан от 31 октября 2015 года № 870
title:
  rus: Об утверждении Правил осуществления государственного ветеринарно-санитарного контроля и надзора, а также определения соответствия животных, продукции и сырья животного происхождения ветеринарным нормативам в объектах производства, осуществляющих выращивание животных, заготовку (убой), хранение, переработку и реализацию животных, продукции и сырья животного происхождения, включая экспортеров (импортеров)
  kaz: Экспорттаушыларды (импорттаушыларды) қоса алғанда, жануарлар өсіруді, жануарларды, жануарлардан алынатын өнімдер мен шикізатты дайындауды (союды), сақтауды, қайта өңдеуді және өткізуді жүзеге асыратын өндіріс объектілерінде мемлекеттік ветеринариялық-санитариялық бақылауды және қадағалауды жүзеге асыру, сондай-ақ жануарлардың, жануарлардан алынатын өнімдер мен шикізаттың ветеринариялық нормативтерге сәйкестігін айқындау қағидаларын бекіту туралы

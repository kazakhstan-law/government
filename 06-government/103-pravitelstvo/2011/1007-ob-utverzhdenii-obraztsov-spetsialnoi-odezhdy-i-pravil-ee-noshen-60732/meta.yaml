  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 7 октября 2011 года № 1153 "Об утверждении образцов специальной одежды и Правил ее ношения частными охранниками, работниками частных охранных организаций, охранных подразделений индивидуальных предпринимателей и юридических лиц, занимающих должность охранника"
    kaz: '"Жеке күзетшілердің, жеке күзет ұйымдарының, дара кәсіпкерлер мен заңды тұлғалардың күзет бөлімшелерінің күзетші лауазымындағы қызметкерлерінің арнаулы киім үлгілерін және оны кию қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 7 қазандағы № 1153 қаулысына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/65222/rus

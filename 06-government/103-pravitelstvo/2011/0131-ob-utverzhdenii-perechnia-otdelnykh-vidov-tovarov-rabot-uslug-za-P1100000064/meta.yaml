  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 января 2011 года № 64 "О некоторых вопросах осуществления государственных закупок у общественных объединений инвалидов Республики Казахстан и организаций, созданных общественными объединениями инвалидов Республики Казахстан
    kaz: '"Қазақстан Республикасы мүгедектерінің қоғамдық бірлестіктерінен және Қазақстан Республикасы мүгедектерінің қоғамдық бірлестіктері құрған ұйымдардан мемлекеттік сатып алуды жүзеге асырудың кейбір мәселелері туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 31 қаңтардағы № 64 қаулысына өзгерістер енгізу туралы'

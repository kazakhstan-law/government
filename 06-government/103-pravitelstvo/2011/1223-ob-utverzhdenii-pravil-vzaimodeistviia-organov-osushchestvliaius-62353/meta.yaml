requisite: Постановление Правительства Республики Казахстан от 23 декабря 2011 года № 1593. Утратило силу постановлением Правительства Республики Казахстан от 19 июня 2018 года № 358 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил взаимодействия органов, осуществляющих оперативно-розыскные мероприятия, и организаций при внедрении и эксплуатации аппаратно-программных и технических средств проведения оперативно-розыскных мероприятий на сетях телекоммуникаций Республики Казахстан
  kaz: Қазақстан Республикасының телекоммуникация желілерінде жедел-іздестіру іс-шараларын жүргізудің аппараттық-бағдарламалық және техникалық құралдарын енгізу мен пайдалану кезінде жедел-іздестіру іс-шараларын жүзеге асыратын органдардың және ұйымдардың өзара іс-қимыл жасау қағидаларын бекіту туралы

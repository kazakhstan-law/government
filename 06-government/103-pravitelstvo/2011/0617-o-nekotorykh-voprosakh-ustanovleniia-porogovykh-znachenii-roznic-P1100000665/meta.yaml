  kaz: Әлеуметтік маңызы бар азық-түлік тауарларына бөлшек сауда бағаларының шекті мәндерін және оларға бөлшек сауда бағаларының шекті рұқсат етілген мөлшерін белгілеудің кейбір мәселелері туралы

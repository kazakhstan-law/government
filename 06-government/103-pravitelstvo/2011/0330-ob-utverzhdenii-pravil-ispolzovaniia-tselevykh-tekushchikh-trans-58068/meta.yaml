act_code: '58068'
requisite: Постановление Правительства Республики Казахстан от 30 марта 2011 года № 297
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2011 года областными бюджетами, бюджетами городов Астаны и Алматы на поддержку семеноводства
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің тұқым шаруашылығын қолдауға 2011 жылғы республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалану қағидасын бекіту туралы

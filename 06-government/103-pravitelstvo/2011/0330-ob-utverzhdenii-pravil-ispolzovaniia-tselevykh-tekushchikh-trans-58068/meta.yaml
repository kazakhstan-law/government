  code: '60184'
  requisite: Постановление Правительства Республики Казахстан от 22 августа 2011 года № 938
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 4 марта 2011 года № 221 "Об утверждении Правил субсидирования из местных бюджетов на повышение урожайности и качества продукции растениеводства" и от 30 марта 2011 года № 297 "Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2011 года областными бюджетами, бюджетами городов Астаны и Алматы на поддержку семеноводства"
    kaz: Қазақстан Республикасы Үкiметiнiң «Өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға жергілікті бюджеттерден субсидиялау қағидасын бекіту туралы» 2011 жылғы 4 наурыздағы № 221 және «Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің тұқым шаруашылығын қолдауға 2011 жылғы республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалану қағидасын бекіту туралы» 2011 жылғы 30 наурыздағы № 297 қаулыларына өзгерiстер мен толықтыру енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/60184/rus

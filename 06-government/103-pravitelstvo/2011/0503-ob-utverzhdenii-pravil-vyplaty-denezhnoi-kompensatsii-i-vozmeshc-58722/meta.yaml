  code: '73286'
  requisite: Постановление Правительства Республики Казахстан от 3 июля 2013 года № 683
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 3 мая 2011 года № 474 "Об утверждении Правил возмещения разницы должностным лицам, направленным на работу в международные организации от Республики Казахстан, ранее занимавшим должности персонала дипломатической службы" и от 17 мая 2011 года № 530 "О приравнивании должностных лиц, направленных на работу в международные организации от Республики Казахстан, ранее занимавших должности персонала дипломатической службы, к персоналу загранучреждения Республики Казахстан в соответствующем иностранном государстве"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасынан халықаралық ұйымдарға жұмысқа жіберілген, бұрын дипломатиялық қызмет персоналы лауазымында болған лауазымды адамдарға айырманы өтеу қағидасын бекіту туралы" 2011 жылғы 3 мамырдағы № 474 және "Қазақстан Республикасынан халықаралық ұйымдарға жұмысқа жіберілген, бұрын дипломатиялық қызмет персоналы лауазымында болған лауазымды адамдарды тиісті шет мемлекеттегі Қазақстан Республикасының шет елдегі мекемесінің персоналына теңестіру туралы" 2011 жылғы 17 мамырдағы № 530 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/73286/rus

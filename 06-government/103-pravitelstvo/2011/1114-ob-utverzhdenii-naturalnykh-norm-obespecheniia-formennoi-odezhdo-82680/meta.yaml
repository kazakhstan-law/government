title:
  rus: Об утверждении натуральных норм обеспечения форменной одеждой со знаками различия (без погон) должностных лиц государственной лесной инспекции и государственной лесной охраны Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттік орман инспекциясы мен мемлекеттік орман күзетінің лауазымды адамдарын айырым белгілері бар (погонсыз) нысанды киіммен қамтамасыз етудің заттай нормаларын бекіту туралы

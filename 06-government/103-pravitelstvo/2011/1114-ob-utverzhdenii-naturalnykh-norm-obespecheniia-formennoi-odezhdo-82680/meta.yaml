  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 14 ноября 2011 года № 1339 "Об утверждении натуральных норм обеспечения должностных лиц, осуществляющих государственный контроль в области охраны, защиты, пользования лесным фондом, воспроизводства лесов и лесоразведения, форменной одеждой (без погон)"
    kaz: Орман қорын күзету, қорғау, пайдалану, ормандарды молықтыру мен орман өсіру саласында мемлекеттік бақылауды жүзеге асыратын лауазымды адамдарды нысанды киіммен (погонсыз) қамтамасыз етудің заттай нормаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 14 қарашадағы № 1339 қаулысына өзгерістер мен толықтыру енгізу туралы

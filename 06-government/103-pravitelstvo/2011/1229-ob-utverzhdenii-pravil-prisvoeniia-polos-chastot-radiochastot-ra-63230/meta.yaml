  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 29 декабря 2011 года № 1641 "Об утверждении Правил присвоения полос частот, радиочастот (радиочастотных каналов), регистрации и эксплуатации радиоэлектронных средств и высокочастотных устройств, а также проведения расчета электромагнитной совместимости радиоэлектронных средств гражданского назначения" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: '"Жиіліктер белдеулерін, радиожиіліктерді (радиожиілік арналарын) иелікке беру, радиоэлектрондық құралдар мен жоғары жиілікті құрылғыларды тіркеу және пайдалану, сондай-ақ азаматтық мақсаттағы радиоэлектрондық құралдардың электромагниттік үйлесімділігін есептеуді жүргізу қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 29 желтоқсандағы № 1641 қаулысына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/69462/rus

title:
  rus: Об утверждении Правил рассмотрения обращений собственников (правообладателей) стратегических объектов, реабилитационных или банкротных управляющих об обременении либо отчуждении стратегического объекта
  kaz: Стратегиялық объектiлер меншiк иелерiнiң (құқық иеленушiлерінiң), оңалтуды немесе банкроттықты басқарушылардың стратегиялық объектіге ауыртпалық салу не оны иелiктен шығару туралы өтiнiштерiн қарау қағидаларын бекіту туралы

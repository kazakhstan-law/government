  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 28 октября 2011 года № 1223 «Об утверждении Правил рассмотрения обращений собственников (правообладателей) стратегических объектов, реабилитационных или банкротных управляющих об обременении либо отчуждении стратегического объекта»
    kaz: «Стратегиялық объектiлер меншiк иелерiнiң (құқық иеленушiлерінiң), оңалтуды немесе банкроттықты басқарушылардың стратегиялық объектіге ауыртпалық салу не оны иелiктен шығару туралы өтiнiштерiн қарау қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2011 жылғы 28 қазандағы № 1223 қаулысына өзгеріс енгізу туралы

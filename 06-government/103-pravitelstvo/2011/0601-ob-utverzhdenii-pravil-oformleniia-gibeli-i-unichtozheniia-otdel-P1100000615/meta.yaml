title:
  rus: Об утверждении Правил оформления гибели и уничтожения отдельных видов государственного имущества, пришедшего в негодность вследствие физического и морального износа, в результате стихийных бедствий и аварий
  kaz: Дүлей зілзалалар мен авариялар салдарынан физикалық немесе моральдық тозуынан жарамсыз болған мемлекеттік мүліктің жекелеген түрлерінің бұзылуын және жойылуын ресімдеу қағидасын бекіту туралы

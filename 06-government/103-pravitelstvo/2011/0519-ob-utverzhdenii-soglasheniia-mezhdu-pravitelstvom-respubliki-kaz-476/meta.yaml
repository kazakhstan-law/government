act_code: '476'
requisite: Постановление Правительства Республики Казахстан от 19 мая 2011 года № 542
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Королевства Саудовская Аравия о сотрудничестве в области борьбы с терроризмом, организованной преступностью, незаконным оборотом наркотических средств, психотропных веществ и их прекурсоров
  kaz: Қазақстан Республикасының Үкіметі мен Сауд Арабиясы Корольдігінің Үкіметі арасындағы Терроризмге, ұйымдасқан қылмысқа, есірткі құралдарының, психотроптық заттардың және олардың прекурсорларының заңсыз айналымына қарсы күрес саласындағы ынтымақтастық туралы келісімді бекіту туралы

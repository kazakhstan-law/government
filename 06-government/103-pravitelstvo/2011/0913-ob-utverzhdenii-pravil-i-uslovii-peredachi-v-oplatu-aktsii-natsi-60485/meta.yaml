title:
  rus: Об утверждении Правил и условий передачи в оплату акций национального управляющего холдинга, национального холдинга, национальной компании государственного имущества, не подлежащего приватизации
  kaz: Жекешелендіруге жатпайтын мемлекеттік мүлікті ұлттық басқарушы холдингтің, ұлттық холдингтің, ұлттық компанияның акцияларын төлеуге беру қағидасы мен шарттарын бекіту туралы

  code: '68595'
  requisite: Постановление Правительства Республики Казахстан от 12 ноября 2012 года № 1431
  title:
    rus: Об утверждении Правил передачи морских портов, имеющих статус международного значения, в оплату акций национального управляющего холдинга, национального холдинга, национальной компании и внесении дополнения в постановление Правительства Республики Казахстан от 13 сентября 2011 года № 1045 "Об утверждении Правил и условий передачи в оплату акций национального управляющего холдинга, национального холдинга, национальной компании государственного имущества, не подлежащего приватизации"
    kaz: Халықаралық маңыздағы мәртебесі бар теңіз порттарын ұлттық басқарушы холдингтің, ұлттық холдингтің, ұлттық компанияның акцияларын төлеуге беру қағидаларын бекіту және "Жекешелендiруге жатпайтын мемлекеттiк мүлiктi ұлттық басқарушы холдингтiң, ұлттық холдингтiң, ұлттық компанияның акцияларын төлеуге беру қағидасы мен шарттарын бекiту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 13 қыркүйектегі № 1045 қаулысына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/68595/rus

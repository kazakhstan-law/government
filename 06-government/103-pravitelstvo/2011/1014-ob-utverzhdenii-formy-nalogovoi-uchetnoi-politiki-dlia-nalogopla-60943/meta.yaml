    kaz: '"Шағын бизнес субъектілеріне арналған арнаулы салық режимін, шаруа немесе фермер қожалықтарына арналған арнаулы салық режимін қолданатын салық төлеушілер үшін салықтық есепке алу саясатының нысанын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 14 қазандағы № 1174 қаулысына өзгерістер мен толықтырулар енгізу туралы'

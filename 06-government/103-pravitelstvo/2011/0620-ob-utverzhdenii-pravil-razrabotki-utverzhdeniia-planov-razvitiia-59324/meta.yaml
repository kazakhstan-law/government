  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 20 июня 2011 года № 673 "Об утверждении Правил разработки, утверждения планов развития контролируемых государством акционерных обществ и товариществ с ограниченной ответственностью, государственных предприятий, а также мониторинга и оценки их реализации"
    kaz: '"Мемлекет бақылайтын акционерлiк қоғамдардың және жауапкершiлiгi шектеулi серiктестiктердiң, мемлекеттiк кәсiпорындардың даму жоспарларын әзiрлеу, бекiту, сондай-ақ оларды iске асырудың мониторингi мен оны бағалау қағидасын бекiту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 20 маусымдағы № 673 қаулысына өзгерістер мен толықтырулар енгізу туралы'

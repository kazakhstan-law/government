title:
  rus: Об утверждении Правил разработки, утверждения планов развития контролируемых государством акционерных обществ и товариществ с ограниченной ответственностью, государственных предприятий, а также мониторинга и оценки их реализации
  kaz: Мемлекет бақылайтын акционерлік қоғамдардың және жауапкершілігі шектеулі серіктестіктердің, мемлекеттік кәсіпорындардың даму жоспарларын әзірлеу, бекіту, сондай-ақ оларды іске асырудың мониторингі мен оны бағалау қағидасын бекіту туралы

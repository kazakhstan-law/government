  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 2 июня 2011 года № 618 «Об утверждении Правил реализации ограниченного в распоряжении имущества налогоплательщика (налогового агента) в счет налоговой задолженности, плательщика – в счет задолженности по таможенным платежам»
    kaz: «Салық төлеушінің (салық агентінің) билік етуі шектелген мүлкін салық берешегі есебіне, төлеушінің – кедендік төлемдер бойынша берешектің есебіне өткізу қағидасын бекіту туралы» Қазақстан Республикасы Үкіметінің 2011 жылғы 2 маусымдағы № 618 қаулысына өзгерістер енгізу туралы

act_code: '59173'
requisite: Постановление Правительства Республики Казахстан от 2 июня 2011 года № 618. Утратило силу постановлением Правительства Республики Казахстан от 20 апреля 2018 года № 208 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил реализации ограниченного в распоряжении имущества налогоплательщика (налогового агента) в счет налоговой задолженности, плательщика – в счет задолженности по таможенным платежам и налогам, пеней
  kaz: Салық төлеушінің және (немесе) үшінші тұлғаның кепілге салған мүлкін, сондай-ақ салық төлеушінің (салық агентінің) билік етуі шектелген мүлкін – салық берешегі есебіне, төлеушінің – кедендік төлемдер және салықтар бойынша берешектің, өсімпұлдардың есебіне өткізу қағидаларын бекіту туралы

title:
  rus: Об утверждении Положения о квалификационных комиссиях по дипломированию и аттестации лиц командного состава судов и Правил дипломирования и аттестации лиц командного состава судов, подлежащих государственной регистрации в Государственном судовом реестре Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік кеме тізілімінде мемлекеттік тіркеуге жататын кемелердің командалық құрамының адамдарына диплом беру және аттестаттау бойынша біліктілік комиссиялары туралы ережені және Кемелердің командалық құрамының адамдарына диплом беру және аттестаттау қағидаларын бекіту туралы

title:
  rus: О принятии Государственного коммунального предприятия на праве хозяйственного ведения "Центр крови" Государственного учреждения "Управление здравоохранения города Астаны" из коммунальной собственности города Астаны в республиканскую собственность
  kaz: '"Астана қаласының денсаулық сақтау басқармасы" мемлекеттік мекемесінің "Қан орталығы" шаруашылық жүргізу құқығындағы мемлекеттік коммуналдық кәсіпорнын Астана қаласының коммуналдық меншігінен республикалық меншікке қабылдау туралы'

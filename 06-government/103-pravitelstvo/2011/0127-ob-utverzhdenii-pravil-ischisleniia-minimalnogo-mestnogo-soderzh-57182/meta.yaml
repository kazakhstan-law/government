title:
  rus: Об утверждении Правил исчисления минимального местного содержания в товарах, работах и услугах при проведении операций по недропользованию, включаемого в условия конкурса на предоставление права недропользования
  kaz: Жер қойнауын пайдалану құқығын беруге арналған конкурс шартына енгізілетін жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде тауарлардағы, жұмыстардағы және көрсетілетін қызметтердегі ең аз жергілікті қамтуды есептеу қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 27 января 2011 года № 36 "Об утверждении Правил исчисления минимального казахстанского содержания в товарах, работах и услугах при проведении операций по недропользованию, включаемого в условия конкурса на предоставление права недропользования"
    kaz: '"Жер қойнауын пайдалану құқығын беруге арналған конкурс шартына енгiзiлетiн жер қойнауын пайдалану жөнiндегi операцияларды жүргiзу кезiнде тауарлардағы, жұмыстардағы және көрсетiлетiн қызметтердегi ең аз қазақстандық қамтуды есептеу қағидасын бекiту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 27 қаңтардағы № 36 қаулысына өзгерістер енгізу туралы'

act_code: '63192'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2011 года № 1749. Утратило силу постановлением Правительства Республики Казахстан от 4 мая 2016 года № 271
title:
  rus: Об утверждении Правил выдачи и формы подтверждения местным исполнительным органом области, города республиканского значения, столицы, на основании которого осуществляется отнесение полученных (подлежащих получению) доходов к доходам, от видов деятельности организаций, осуществляющих деятельность на территории специальной экономической зоны
  kaz: Негізінде алынған (алынуға жататын) табыстарды арнайы экономикалық аймақ аумағында қызметін жүзеге асыратын ұйымдардың қызмет түрлерінен алынған табыстарға жатқызу жүзеге асырылатын облыстың, республикалық маңызы бар қаланың, астананың жергілікті атқарушы органының растаманы беру қағидаларын және оның нысанын бекіту туралы

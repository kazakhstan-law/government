  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 5 декабря 2011 года № 1458 "Об утверждении Правил выдачи работникам молока, лечебно-профилактического питания, специальной одежды, специальной обуви и других средств индивидуальной защиты, обеспечения работников средствами коллективной защиты, санитарно-бытовыми помещениями и устройствами за счет средств работодателя; норм выдачи работникам молока за счет средств работодателя; норм выдачи работникам лечебно-профилактического питания за счет средств работодателя"
    kaz: «Жұмыс берушінің қаражаты есебінен қызметкерлерге сүт, емдік-профилактикалық тағам, арнайы киім, арнайы аяқ киім және басқа да жеке қорғану құралдарын беру, ұжымдық қорғану құралдарымен, санитариялық-тұрмыстық үй-жайлармен және құрылғылармен қамтамасыз ету қағидаларын; жұмыс берушінің қаражаты есебінен қызметкерлерге сүт беру нормаларын; жұмыс берушінің қаражаты есебінен қызметкерлерге емдік-профилактикалық тағам беру нормаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2011 жылғы 5 желтоқсандағы № 1458 қаулысына өзгеріс енгізу туралы

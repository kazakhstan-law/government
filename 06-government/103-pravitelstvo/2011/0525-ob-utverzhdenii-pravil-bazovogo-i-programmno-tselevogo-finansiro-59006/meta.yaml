  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 25 мая 2011 года № 575 «Об утверждении Правил базового и программно-целевого финансирования научной и (или) научно-технической деятельности, а также грантового финансирования научной и (или) научно-технической деятельности и коммерциализации результатов научной и (или) научно-технической деятельности»
    kaz: «Ғылыми және (немесе) ғылыми-техникалық қызметті базалық және бағдарламалық-нысаналы қаржыландыру, сондай-ақ ғылыми және (немесе) ғылыми-техникалық қызмет пен ғылыми және (немесе) ғылыми-техникалық қызметтің нәтижелерін коммерцияландыруды гранттық қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2011 жылғы 25 мамырдағы № 575 қаулысына өзгерістер мен толықтырулар енгізу туралы

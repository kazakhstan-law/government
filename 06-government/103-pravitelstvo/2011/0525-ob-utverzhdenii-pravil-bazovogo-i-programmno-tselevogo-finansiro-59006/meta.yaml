    kaz: «Ғылыми және (немесе) ғылыми-техникалық қызметті базалық, гранттық, бағдарламалық-нысаналы қаржыландыру қағидасын бекіту туралы» Қазақстан Республикасы Үкіметінің 2011 жылғы 25 мамырдағы № 575 қаулысына өзгеріс енгізу туралы

    kaz: «Ғылыми және (немесе) ғылыми-техникалық қызметті базалық, гранттық және бағдарламалық-нысаналы қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2011 жылғы 25 мамырдағы № 575 қаулысына өзгерістер енгізу туралы

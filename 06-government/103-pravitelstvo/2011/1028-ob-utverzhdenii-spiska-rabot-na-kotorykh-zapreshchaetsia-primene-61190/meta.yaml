requisite: Постановление Правительства Республики Казахстан от 28 октября 2011 года № 1220. Утратило силу постановлением Правительства Республики Казахстан от 29 октября 2015 года № 862
title:
  rus: Об утверждении списка работ, на которых запрещается применение труда работников, не достигших восемнадцатилетнего возраста, предельных норм переноски и передвижения тяжести работниками, не достигшими восемнадцатилетнего возраста, и списка работ, на которых запрещается применение труда женщин, предельных норм подъема и перемещения вручную тяжести женщинами
  kaz: Жасы он сегiзге толмаған қызметкерлердiң еңбегiн пайдалануға тыйым салынатын жұмыстардың тiзiмiн, жасы он сегiзге толмаған қызметкерлер тасымалдайтын және қозғайтын жүктің шектi нормаларын және әйелдердiң еңбегiн пайдалануға тыйым салынатын жұмыстардың тiзiмiн, әйелдердің жүктi қолмен көтеруінің және алып жүруiнiң шектi нормаларын бекiту туралы

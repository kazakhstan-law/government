act_code: '59519'
requisite: Постановление Правительства Республики Казахстан от 1 июля 2011 года № 750
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2011 год областными бюджетами, бюджетами городов Астаны и Алматы на организацию и проведение идентификации сельскохозяйственных животных
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің ауыл шаруашылығы жануарларын бірдейлендіруді ұйымдастыру мен жүргізуге 2011 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалану қағидасын бекіту туралы

  code: '60731'
  requisite: Постановление Правительства Республики Казахстан от 7 октября 2011 года № 1146
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 31 декабря 2009 года № 2331 "Об утверждении Правил идентификации сельскохозяйственных животных" и от 1 июля 2011 года № 750 "Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2011 год областными бюджетами, бюджетами городов Астаны и Алматы на организацию и проведение идентификации сельскохозяйственных животных"
    kaz: Қазақстан Республикасы Үкіметінің «Ауыл шаруашылығы жануарларын бірдейлендіру ережесін бекіту туралы» 2009 жылғы 31 желтоқсандағы № 2331 және «Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің ауыл шаруашылығы жануарларын бірдейлендіруді ұйымдастыру мен жүргізуге 2011 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалану қағидасын бекіту туралы» 2011 жылғы 1 шілдедегі № 750 қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/60731/rus

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 11 мая 2011 года № 493 "Об утверждении Правил организации труда и отдыха водителей, а также применения тахографов" и от 5 сентября 2012 года № 1153 "Об утверждении стандартов государственных услуг Министерства транспорта и коммуникаций Республики Казахстан в сфере транспортного контроля и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан"
    kaz: Қазақстан Республикасы Үкiметiнiң "Жүргiзушiлердiң еңбегi мен тынығуын ұйымдастыру, сондай-ақ тахографтарды қолдану қағидасын бекiту туралы" 2011 жылғы 11 мамырдағы № 493 және "Қазақстан Республикасы Көлiк және коммуникация министрлiгiнiң көліктік бақылау саласындағы мемлекеттiк қызмет стандарттарын бекiту және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы" 2012 жылғы 5 қыркүйектегі № 1153 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/76209/rus

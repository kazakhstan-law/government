    kaz: Қазақстан Республикасы Көлiк және коммуникация министрлiгiнiң көліктік бақылау саласындағы мемлекеттiк қызмет стандарттарын бекiту және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

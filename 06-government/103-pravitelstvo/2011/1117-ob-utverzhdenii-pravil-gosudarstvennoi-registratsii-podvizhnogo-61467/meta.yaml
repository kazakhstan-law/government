  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 29 октября 2009 года № 1710 "Об утверждении стандартов государственных услуг Министерства транспорта и коммуникаций Республики Казахстан в сфере транспортного контроля" и от 17 ноября 2011 года № 1351 "Об утверждении Правил регистрации железнодорожного подвижного состава"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасы Көлік және коммуникация министрлігінің көліктік бақылау саласындағы мемлекеттік қызметтер стандарттарын бекіту туралы" 2009 жылғы 29 қазандағы № 1710 және "Темір жол жылжымалы құрамын тіркеу қағидаларын бекіту туралы" 2011 жылғы 17 қарашадағы № 1351 қаулыларына өзгерістер мен толықтырулар енгізу туралы

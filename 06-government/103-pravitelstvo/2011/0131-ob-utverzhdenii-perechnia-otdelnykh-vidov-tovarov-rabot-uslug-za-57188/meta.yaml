act_code: '57188'
requisite: Постановление Правительства Республики Казахстан от 31 января 2011 года № 64. Утратило силу постановлением Правительства Республики Казахстан от 31 декабря 2015 года № 1181
title:
  rus: Об утверждении перечня отдельных видов товаров, работ, услуг, закупаемых у общественных объединений инвалидов Республики Казахстан и организаций, созданных общественными объединениями инвалидов Республики Казахстан, производящих и (или) поставляющих товары, выполняющих работы, оказывающих услуги
  kaz: Тауарлар өндіретін және (немесе) беретін, жұмыстарды орындайтын, қызметтер көрсететін Қазақстан Республикасы мүгедектерінің қоғамдық бірлестіктерінен және Қазақстан Республикасы мүгедектерінің қоғамдық бірлестіктері құрған ұйымдардан сатып алынатын жекелеген тауарлар, жұмыстар, көрсетілетін қызметтер түрлерінің тізбесін бекіту туралы

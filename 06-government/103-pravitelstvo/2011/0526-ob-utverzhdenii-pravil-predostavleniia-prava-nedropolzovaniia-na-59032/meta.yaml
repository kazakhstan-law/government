  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 26 мая 2011 года № 581 "Об утверждении Правил предоставления права недропользования на строительство и (или) эксплуатацию подземных сооружений, не связанных с разведкой или добычей, а также осуществления строительства и (или) эксплуатации подземных сооружений, не связанных с разведкой или добычей"
    kaz: '"Барлаумен немесе өндірумен байланысты емес жерасты құрылыстарын салуға және (немесе) пайдалануға жер қойнауын пайдалану құқығын беру, сондай-ақ барлаумен немесе өндірумен байланысты емес жерасты құрылыстарын салуды және (немесе) пайдалануды жүзеге асыру қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 26 мамырдағы № 581 қаулысына өзгерістер енгізу туралы'

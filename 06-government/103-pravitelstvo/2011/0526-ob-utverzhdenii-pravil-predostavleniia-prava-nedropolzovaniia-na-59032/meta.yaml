title:
  rus: Об утверждении Правил предоставления права недропользования на строительство и (или) эксплуатацию подземных сооружений, не связанных с разведкой или добычей, а также осуществления строительства и (или) эксплуатации подземных сооружений, не связанных с разведкой или добычей
  kaz: Барлаумен немесе өндірумен байланысты емес жерасты құрылыстарын салуға және (немесе) пайдалануға жер қойнауын пайдалану құқығын беру, сондай-ақ барлаумен немесе өндірумен байланысты емес жерасты құрылыстарын салуды және (немесе) пайдалануды жүзеге асыру қағидасын бекіту туралы

title:
  rus: Об утверждении Правил базового и программно-целевого финансирования научной и (или) научно-технической деятельности, грантового финансирования научной и (или) научно-технической деятельности и коммерциализации результатов научной и (или) научно-технической деятельности, финансирования научных организаций, осуществляющих фундаментальные научные исследования
  kaz: Ғылыми және (немесе) ғылыми-техникалық қызметті базалық және бағдарламалық-нысаналы қаржыландыру, ғылыми және (немесе) ғылыми-техникалық қызмет пен ғылыми және (немесе) ғылыми-техникалық қызметтің нәтижелерін коммерцияландыруды гранттық қаржыландыру, іргелі ғылыми зерттеулерді жүзеге асыратын ғылыми ұйымдарды қаржыландыру қағидаларын бекіту туралы

title:
  rus: Об утверждении перечня медицинских противопоказаний, имеющихся у больных алкоголизмом, наркоманией и токсикоманией, в отношении которых не применяется направление в наркологические организации для принудительного лечения
  kaz: Мәжбүрлеп емдеуге арналған наркологиялық ұйымдарға жіберу қолданылмайтын алкоголизммен, нашақорлықпен және уытқұмарлықпен ауыратын науқастардың медициналық қарсы айғақтарының тізбесін бекіту туралы

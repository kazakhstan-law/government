  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 17 мая 2011 года № 523 "Об утверждении Правил организации и проведения обязательного технического осмотра механических транспортных средств и прицепов к ним, периодичности прохождения обязательного технического осмотра механических транспортных средств и прицепов к ним, а также формы диагностической карты технического осмотра"
    kaz: '"Механикалық көлік құралдарын және олардың тіркемелерін міндетті техникалық байқауды ұйымдастыру және жүргізу қағидасын, механикалық көлік құралдарын және олардың тіркемелерін міндетті техникалық байқаудан өткізудің кезеңділігін, сондай-ақ техникалық байқаудың диагностикалық картасының нысанын бекіту туралы" Қазақстан Республикасы Үкiметiнiң 2011 жылғы 17 мамырдағы № 523 қаулысына өзгерістер енгізу туралы'

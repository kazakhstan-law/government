title:
  rus: О передаче штатной численности общеобразовательных школ исправительных учреждений Комитета уголовно-исполнительной системы Министерства внутренних дел Республики Казахстан в ведение местных исполнительных органов
  kaz: Қазақстан Республикасы Ішкі істер министрлігі Қылмыстық-атқару жүйесі комитетінің түзеу мекемелеріндегі жалпы білім беру мектептерінің штат санын жергілікті атқарушы органдардың қарамағына беру туралы

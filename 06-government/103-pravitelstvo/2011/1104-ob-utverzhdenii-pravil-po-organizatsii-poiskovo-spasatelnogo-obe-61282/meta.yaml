act_code: '61282'
requisite: Постановление Правительства Республики Казахстан от 4 ноября 2011 года № 1296
title:
  rus: Об утверждении Правил по организации поисково-спасательного обеспечения полетов на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағында ұшуды іздестіру-құтқарумен қамтамасыз етуді ұйымдастыру жөніндегі қағидаларды бекіту туралы

title:
  rus: Об утверждении Правил выплаты денежной компенсации и возмещения разницы должностным лицам, направленным на работу в международные организации от Республики Казахстан, ранее занимавшим должности персонала дипломатической службы
  kaz: Қазақстан Республикасынан халықаралық ұйымдарға жұмысқа жіберілген, бұрын дипломатиялық қызмет персоналы лауазымында болған лауазымды адамдарға ақшалай өтемақыны төлеу және айырманы өтеу қағидаларын бекіту туралы

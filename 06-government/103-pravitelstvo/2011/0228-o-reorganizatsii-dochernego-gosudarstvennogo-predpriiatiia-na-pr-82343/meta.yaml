act_code: '82343'
requisite: Постановление Правительства Республики Казахстан от 28 февраля 2011 года № 195
title:
  rus: О реорганизации дочернего государственного предприятия на праве хозяйственного ведения "Центр по обеспечению безопасности полетов" Республиканского государственного предприятия на праве хозяйственного ведения "Казаэропроект" Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан
  kaz: Қазақстан Республикасы Көлік және коммуникация министрлігі Азаматтық авиация комитетінің "Қазаэрожоба" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнының "Ұшу қауіпсіздігін қамтамасыз ету орталығы" шаруашылық жүргізу құқығындағы еншілес мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

act_code: '58273'
requisite: Постановление Правительства Республики Казахстан от 9 марта 2011 года № 235
title:
  rus: Об утверждении Правил кредитования областных бюджетов, бюджетов городов Астаны и Алматы на строительство и (или) приобретение жилья через систему жилстройсбережений на 2011 год в рамках Программы жилищного строительства в Республике Казахстан на 2011 - 2014 годы
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне Қазақстан Республикасындағы тұрғын үй құрылысының 2011 - 2014 жылдарға арналған бағдарлама шеңберінде 2011 жылға арналған тұрғын үй құрылыс жинақтары жүйесі арқылы тұрғын үй салуға және (немесе) сатып алуға кредит беру қағидасын бекіту туралы

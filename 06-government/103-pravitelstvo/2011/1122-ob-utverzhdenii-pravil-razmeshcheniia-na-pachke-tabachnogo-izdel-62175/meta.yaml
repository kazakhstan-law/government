  kaz: Темекі бұйымының қорабына, темекі бұйымының қаптамасына шайырлы заттардың, никотиннің құрамы туралы, құрамының деңгейі туралы және жүйелік улар, канцерогендік және мутагендік заттар туралы мәліметтерді орналастыру қағидаларын және темекі шегудің зияны туралы ескертуді бекіту туралы

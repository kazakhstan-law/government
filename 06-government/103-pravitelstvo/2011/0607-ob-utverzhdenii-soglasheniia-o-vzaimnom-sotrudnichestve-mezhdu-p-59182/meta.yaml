  kaz: Қазақстан Республикасының Үкіметі мен Түркия Республикасының Үкіметі арасындағы Қазақстан Республикасында қазақстандық құрылысшы жұмысшыларды оқытуға арналған оқу орталығын құру жөніндегі өзара ынтымақтастық туралы келісімді бекіту туралы

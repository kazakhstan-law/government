act_code: '6204'
requisite: Постановление Правительства Республики Казахстан от 28 октября 2011 года № 1226
title:
  rus: О реорганизации Республиканского государственного казенного предприятия "Информационно-аналитический центр по проблемам занятости Министерства труда и социальной защиты населения Республики Казахстан" в акционерное общество "Информационно-аналитический центр по проблемам занятости"
  kaz: '"Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің Жұмыспен қамту проблемалары жөніндегі ақпараттық-талдау орталығы" республикалық мемлекеттік қазыналық кәсіпорнын "Жұмыспен қамту проблемалары жөніндегі ақпараттық-талдау орталығы" акционерлік қоғамына қайта ұйымдастыру туралы'

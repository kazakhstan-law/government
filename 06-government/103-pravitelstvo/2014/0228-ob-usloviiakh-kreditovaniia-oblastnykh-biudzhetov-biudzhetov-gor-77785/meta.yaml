act_code: '77785'
requisite: Постановление Правительства Республики Казахстан от 28 февраля 2014 года № 167
title:
  rus: Об условиях кредитования областных бюджетов, бюджетов городов Астаны и Алматы на проектирование, строительство и (или) приобретение жилья через систему жилищных строительных сбережений на 2014 год в рамках Программы "Доступное жилье - 2020"
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттерiне "Қолжетiмдi тұрғын үй - 2020" бағдарламасы шеңберiнде тұрғын үй құрылыс жинақтары жүйесi арқылы тұрғын үйлердi жобалауға, салуға және (немесе) сатып алуға кредит берудің 2014 жылға арналған шарттары туралы

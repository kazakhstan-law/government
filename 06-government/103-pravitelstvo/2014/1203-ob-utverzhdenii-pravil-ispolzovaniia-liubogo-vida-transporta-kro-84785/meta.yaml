act_code: '84785'
requisite: Постановление Правительства Республики Казахстан от 3 декабря 2014 года № 1270
title:
  rus: Об утверждении Правил использования любого вида транспорта (кроме транспортных средств представительств иностранных государств и международных организаций, обладающих дипломатическим иммунитетом) для преследования лиц, подозреваемых в совершении уголовного правонарушения, прибытия к месту происшествия, в период действия чрезвычайного или военного положения, в условиях вооруженного конфликта, при ликвидации чрезвычайных ситуаций, а также для доставления лиц, нуждающихся в экстренной медицинской помощи, в медицинские организации, если промедление может создать реальную угрозу жизни или здоровью людей, с возмещением материального ущерба собственникам в случае его причинения
  kaz: Қылмыстық құқық бұзушылық жасады деп күдік келтірілген адамның ізіне түсу, оқиға орнына бару, төтенше немесе соғыс жағдайы қолданылған кезеңде, қарулы қақтығыс жағдайында, төтенше жағдайларды жою кезінде, сондай-ақ меншік иелеріне материалдық залал келтірген жағдайда оның орнын толтыра отырып, егер кідірту адамдардың өмірі мен денсаулығына нақты қатер төндіруі мүмкін болатын болса, жедел медициналық көмекке мұқтаж адамдарды медицина ұйымдарына жеткізу үшін көліктің кез келген түрін (дипломатиялық иммунитеті бар шет мемлекеттер өкілдіктері мен халықаралық ұйымдардың көлік құралдарынан басқа) пайдалану қағидаларын бекіту туралы

requisite: Постановление Правительства Республики Казахстан от 21 июля 2014 года № 808. Утратило силу постановлением Правительства Республики Казахстан от 18 июня 2015 года № 457
title:
  rus: Об утверждении Типового положения о консультативно-совещательном органе при местных исполнительных органах по содействию деятельности органов и учреждений, исполняющих уголовные наказания и меры уголовно-правового воздействия, а также по организации социальной и иной помощи лицам, отбывшим уголовные наказания
  kaz: Қылмыстық жазаны және қылмыстық-құқықтық ықпал ету шараларын орындайтын органдар мен мекемелер қызметіне жәрдемдесу жөніндегі, сондай-ақ қылмыстық жазаларын өтеген адамдарға әлеуметтік және өзге де көмекті ұйымдастыру жөніндегі жергілікті атқарушы органдар жанындағы консультациялық-кеңесші орган туралы үлгілік ережені бекіту туралы

  requisite: Постановление Правительства Республики Казахстан от 31 августа 2016 года № 513
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 19 декабря 2014 года № 1351 «О некоторых вопросах лицензирования деятельности по разработке, производству, ремонту, торговле, коллекционированию, экспонированию и приобретению гражданского и служебного оружия и патронов к нему» и от 19 декабря 2014 года № 1352 «О некоторых вопросах лицензирования деятельности по разработке, производству, торговле, использованию и приобретению гражданских пиротехнических веществ и изделий с их применением»
    kaz: Қазақстан Республикасы Үкіметінің «Азаматтық және қызметтік қару мен оның патрондарын әзірлеу, өндіру, жөндеу, сату, коллекцияға жинау, экспонаттау және сатып алу жөніндегі қызметті лицензиялаудың кейбір мәселелері туралы» 2014 жылғы 19 желтоқсандағы № 1351 және «Азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдарды әзірлеу, өндіру, сату, пайдалану және сатып алу жөніндегі қызметті лицензиялаудың кейбір мәселелері туралы» 2014 жылғы 19 желтоқсандағы № 1352 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/106025/rus

title:
  rus: Об установлении квот на привлечение иностранной рабочей силы по приоритетным проектам "Строительство нитки "С" газопровода "Казахстан - Китай", "Строительство линейной части газопровода "Бейнеу - Бозой - Шымкент", "Строительство второй и третьей очереди "Жанажольского газоперерабатывающего завода" на 2014 год
  kaz: '"Қазақстан – Қытай" газ құбырының "С" желісін салу", "Бейнеу – Бозой – Шымкент" газ құбырының желілік бөлігін салу", "Жаңажол газ өңдеу зауытының" екінші және үшінші кезегін салу" басым жобалары бойынша шетелдік жұмыс күшін тартуға 2014 жылға арналған квоталарды белгілеу туралы'

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 13 мая 2014 года № 486 «Об утверждении Правил субсидирования затрат перерабатывающих предприятий на закуп сельскохозяйственной продукции для производства продуктов ее глубокой переработки и перечня сельскохозяйственной продукции, по которой устанавливаются гарантированная закупочная цена и закупочная цена»
    kaz: «Қайта өңдеуші кәсіпорындардың ауылшаруашылық өнімін тереңдете қайта өңдеп өнім шығаруы үшін оны сатып алу шығындарын субсидиялау қағидаларын және кепілдендірілген сатып алу бағасы мен сатып алу бағасы белгіленетін ауылшаруашылық өнімнің тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 13 мамырдағы № 486 қаулысына өзгерістер енгізу туралы

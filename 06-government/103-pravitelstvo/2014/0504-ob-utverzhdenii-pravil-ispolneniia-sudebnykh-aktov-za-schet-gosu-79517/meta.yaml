act_code: '79517'
requisite: Постановление Правительства Республики Казахстан от 4 мая 2014 года № 448. Утратило силу постановлением Правительства Республики Казахстан от 10 августа 2015 года № 636
title:
  rus: Об утверждении Правил исполнения судебных актов за счет государственного бюджета по возмещению вреда, причиненного в результате незаконного осуждения, незаконного привлечения к уголовной ответственности, незаконного применения в качестве меры пресечения заключения под стражу, домашнего ареста, подписки о невыезде, незаконного наложения административного взыскания в виде ареста или исправительных работ, незаконного помещения в психиатрическое или другое лечебное учреждение
  kaz: Заңсыз соттау, қылмыстық жауаптылыққа заңсыз тарту, бұлтартпау шарасы ретінде камауға, үйқамаққа алуды, ешқайда кетпеу туралы қолхат беруді заңсыз қолдану, қамаққа алу немесе түзеу жұмыстары түрінде әкімшілік жазаны заңсыз қолдану, психиатриялық немесе басқа да емдеу мекемесіне заңсыз орналастыру салдарынан келтірілген зиянды өтеу бойынша сот актілерін мемлекеттік бюджет есебінен орындау қағидаларын бекіту туралы

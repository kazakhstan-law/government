title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2014 - 2016 годы областными бюджетами, бюджетами городов Астаны и Алматы на оказание социальной защиты и помощи населению
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2014 - 2016 жылдарға арналған республикалық бюджеттен халықты әлеуметтік қорғауға және оған көмек көрсетуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

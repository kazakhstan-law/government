  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 18 февраля 2009 года № 183 "Об утверждении размеров и Правил предоставления мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты" и от 12 февраля 2014 года № 80 "Об утверждении стандарта государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты"
    kaz: Қазақстан Республикасы Үкіметінің "Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну мөлшерін және ережесін бекіту туралы" 2009 жылғы 18 ақпандағы № 183 және "Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы" 2014 жылғы 12 ақпандағы № 80 қаулыларына өзгерістер енгізу туралы

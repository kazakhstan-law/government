title:
  rus: Об утверждении Правил субсидирования обязательных пенсионных взносов получателям социальных выплат на случай потери дохода в связи с уходом за ребенком по достижении им возраста одного года из Государственного фонда социального страхования
  kaz: Мемлекеттік әлеуметтік сақтандыру қорынан бала бір жасқа толғанға дейін оның күтіміне байланысты табысынан айырылған жағдайда төленетін әлеуметтiк төлемдерді алушыларға міндетті зейнетақы жарналарын субсидиялау қағидаларын бекіту туралы

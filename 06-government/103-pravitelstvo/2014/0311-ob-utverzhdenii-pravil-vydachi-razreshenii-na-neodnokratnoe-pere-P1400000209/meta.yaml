  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 11 марта 2014 года № 209 «Об утверждении Правил выдачи разрешений на неоднократное пересечение Государственной границы Республики Казахстан казахстанскими судами для ведения промысловой деятельности в территориальных водах (море), внутренних водах и на континентальном шельфе, пространственные и временные пределы действия разрешений, а также Правил осуществления контроля за указанными судами»
    kaz: Қазақстандық кемелердің аумақтық суларда (теңізде), ішкі суларда және континенттік қайраңда кәсіпшілік қызметті жүргізу үшін Қазақстан Республикасының Мемлекеттік шекарасын бірнеше рет кесіп өтуіне рұқсаттар беру қағидаларын, рұқсаттар қолданылуының кеңістіктегі және уақыттық шектерін, сондай-ақ аталған кемелерге бақылауды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 11 наурыздағы № 209 қаулысына өзгерістер енгізу туралы

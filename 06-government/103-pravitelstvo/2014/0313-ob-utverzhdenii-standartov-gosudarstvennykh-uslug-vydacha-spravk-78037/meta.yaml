act_code: '78037'
requisite: Постановление Правительства Республики Казахстан от 13 марта 2014 года № 237. Утратило силу постановлением Правительства Республики Казахстан от 23 декабря 2015 года № 1034
title:
  rus: Об утверждении стандартов государственных услуг "Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан", "Выдача архитектурно-планировочного задания" и "Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования"
  kaz: '"Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау жөнінде анықтама беру", "Сәулет-жоспарлау тапсырмасын беру" және "Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертуге байланысты емес қолданыстағы ғимараттардың үй-жайларын (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру" мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы'

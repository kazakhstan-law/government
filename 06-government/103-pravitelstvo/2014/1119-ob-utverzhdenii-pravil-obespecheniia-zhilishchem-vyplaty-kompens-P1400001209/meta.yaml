  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 19 ноября 2014 года № 1209 «Об утверждении Правил обеспечения жилищем, выплаты компенсации за наем (аренду) жилища, а также категорий должностей сотрудников органов внутренних дел, имеющих право на получение компенсации»
    kaz: «Ішкі істер органдарының қызметкерлерін тұрғын үймен қамтамасыз ету, тұрғын үйді жалдау (жалға алу) үшін өтемақы төлеу қағидаларын, сондай-ақ өтемақы алуға құқығы бар ішкі істер органдарының қызметкерлері лауазымдарының санаттарын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 19 қарашадағы № 1209 қаулысына өзгеріс енгізу туралы

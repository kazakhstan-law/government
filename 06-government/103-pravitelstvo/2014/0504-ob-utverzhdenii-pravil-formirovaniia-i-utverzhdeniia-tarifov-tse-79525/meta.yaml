title:
  rus: Об утверждении Правил формирования и утверждения тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий, осуществляющих свою деятельность по договорам концессии
  kaz: Өз қызметін концессия шарттары бойынша жүзеге асыратын табиғи монополия субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) қалыптастыру және бекіту қағидаларын бекіту туралы

title:
  rus: Об утверждении стандарта государственной услуги "Выдача экспортеру зерна подтверждения о соблюдении экспортером зерна обязательств по поставке зерна в государственные ресурсы зерна"
  kaz: '"Астық экспорттаушыға мемлекеттік астық ресурстарына астықты жеткізу жөніндегі міндеттемелерді астық экспорттаушылардың сақтауы туралы растаманы беру" мемлекеттiк көрсетілетін қызмет стандартын бекіту туралы'

caused_by:
  code: '116132'
  requisite: Постановление Правительства Республики Казахстан от 23 ноября 2017 года № 766
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 13 апреля 2012 года № 459 «Об утверждении критериев отбора отечественных промышленных предприятий для включения в перечень отечественных промышленных предприятий, которым земельные участки предоставляются в собственность на безвозмездной основе, и о внесении дополнений в постановление Правительства Республики Казахстан от 26 ноября 2004 года № 1237 «Некоторые вопросы Министерства индустрии и новых технологий Республики Казахстан» и от 16 мая 2014 года № 497 «Об утверждении перечня отечественных промышленных предприятий, которым земельные участки предоставляются в собственность на безвозмездной основе»
    kaz: Қазақстан Республикасы Үкіметінің «Жер учаскелері меншікке өтеусіз негізде ұсынылатын отандық өнеркәсіп кәсіпорындарының тізбесіне енгізу үшін отандық өнеркәсіп кәсіпорындарын іріктеу өлшемдерін бекіту туралы және «Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігінің кейбір мәселелері» туралы Қазақстан Республикасы Үкіметінің 2004 жылғы 26 қарашадағы № 1237 қаулысына толықтырулар енгізу туралы» 2012 жылғы 13 сәуірдегі № 459 және «Жер учаскелері ақысыз негізде меншікке берілетін отандық өнеркәсіп кәсіпорындарының тізбесін бекіту туралы» 2014 жылғы 16 мамырдағы № 497 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/116132/rus

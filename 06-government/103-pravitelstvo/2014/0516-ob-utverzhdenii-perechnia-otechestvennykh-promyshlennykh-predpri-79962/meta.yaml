act_code: '79962'
requisite: Постановление Правительства Республики Казахстан от 16 мая 2014 года № 497
title:
  rus: Об утверждении перечня отечественных промышленных предприятий, которым земельные участки предоставляются в собственность на безвозмездной основе
  kaz: Жер учаскелері ақысыз негізде меншікке берілетін отандық өнеркәсіп кәсіпорындарының тізбесін бекіту туралы

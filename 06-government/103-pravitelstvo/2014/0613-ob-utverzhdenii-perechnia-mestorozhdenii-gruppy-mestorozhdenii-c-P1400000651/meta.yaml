    kaz: '"Рентабельділігі төмен кен орындары санатына жатқызылған пайдалы қазбалардың кең таралғандарын қоспағанда, қатты түрлері кен орындарының (кен орындары тобының, кен орнының бір бөлігінің) тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2014 жылғы 13 маусымдағы № 651 қаулысына өзгерістер енгізу туралы'

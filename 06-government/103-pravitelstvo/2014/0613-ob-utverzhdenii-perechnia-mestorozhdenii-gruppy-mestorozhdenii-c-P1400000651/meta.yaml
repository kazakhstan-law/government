  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 13 июня 2014 года № 651 «Об утверждении перечня месторождений (группы месторождений, части месторождения) твердых видов полезных ископаемых, за исключением общераспространенных, отнесенных к категории низкорентабельных»

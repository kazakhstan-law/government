act_code: '79961'
requisite: Постановление Правительства Республики Казахстан от 16 мая 2014 года № 499
title:
  rus: Об установлении квот на привлечение иностранной рабочей силы по приоритетному проекту "Реконструкция и модернизация Шымкентского НПЗ" на 2014 год и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы для реализации приоритетного проекта "Реконструкция и модернизация Шымкентского НПЗ"
  kaz: '"Шымкент МӨЗ реконструкциялау және жаңғырту" басым жобасы бойынша шетелдік жұмыс күшін тарту үшін 2014 жылға квота белгілеу және "Шымкент МӨЗ реконструкциялау және жаңғырту" басым жобасын іске асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру шарттарын бекіту туралы'

title:
  rus: Об утверждении Правил выдачи пропусков на выход в территориальные воды (море) и внутренние воды Республики Казахстан казахстанских маломерных самоходных и несамоходных (надводных и подводных) судов (средств) и средств передвижения по льду
  kaz: Қазақстандық шағын көлемді өздігінен жүзетін және өздігінен жүзбейтін (суүсті және суасты) кемелердің (құралдардың) және мұз үстімен жылжитын құралдардың Қазақстан Республикасының аумақтық суларына (теңізіне) және ішкі суларына шығуына рұқсаттамалар беру қағидаларын бекіту туралы

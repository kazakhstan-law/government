  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 27 мая 1999 года № 659 "О передаче прав по владению и пользованию государственными пакетами акций и государственными долями в организациях, находящихся в республиканской собственности" и от 24 сентября 2014 года № 1011 "Вопросы Министерства национальной экономики Республики Казахстан"
    kaz: Қазақстан Республикасы Үкіметінің "Республикалық меншіктегі ұйымдар акцияларының мемлекеттік пакеттері мен мемлекеттік үлестеріне иелік ету және пайдалану жөніндегі құқықтарды беру туралы" 1999 жылғы 27 мамырдағы № 659 және "Қазақстан Республикасы Ұлттық экономика министрлігінің мәселелері" туралы 2014 жылғы 24 қыркүйектегі № 1011 қаулыларына өзгерістер мен толықтырулар енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/97743/rus

title:
  rus: Об утверждении стандартов государственных услуг "Субсидирование по возмещению ставки вознаграждения по кредитам (лизингу) на поддержку сельского хозяйства" и "Субсидирование систем управления производством сельскохозяйственной продукции"
  kaz: '"Ауыл шаруашылығын қолдауға арналған кредиттер (лизинг) бойынша сыйақы мөлшерлемесін өтеу бойынша субсидиялау" және "Ауыл шаруашылығы өнімдері өндірісін басқару жүйелерін субсидиялау" мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы'

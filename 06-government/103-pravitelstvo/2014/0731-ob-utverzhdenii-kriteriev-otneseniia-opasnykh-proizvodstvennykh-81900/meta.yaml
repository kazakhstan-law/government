  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 16 июля 2014 года № 793 "Об утверждении Правил по определению страны происхождения товара, оформлению, удостоверению и выдаче сертификата о происхождении товара и признании утратившими силу некоторых решений Правительства Республики Казахстан" и от 31 июля 2014 года № 864 "Об утверждении Правил определения критериев отнесения опасных производственных объектов к декларируемым и разработки декларации промышленной безопасности опасного производственного объекта, критериев отнесения опасных производственных объектов к декларируемым"
    kaz: Қазақстан Республикасы Үкіметінің "Тауардың шығарылған елін айқындау, шығу тегі туралы сертификатты ресімдеу, куәландыру және беру қағидаларын бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы" 2014 жылғы 16 шілдедегі № 793 және "Қауіпті өндірістік объектілерді декларацияланатын объектілерге жатқызу критерийлерін айқындау және қауіпті өндірістік объектінің өнеркәсіптік қауіпсіздігі декларацияларын әзірлеу қағидаларын, қауіпті өндірістік объектілерді декларацияланатын объектілерге жатқызу критерийлерін бекіту туралы" 2014 жылғы 31 шілдедегі № 864 қаулыларына өзгерістер енгізу туралы

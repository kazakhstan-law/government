caused_by:
  code: '120568'
  requisite: Постановление Правительства Республики Казахстан от 13 апреля 2018 года № 191
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 21 ноября 2014 года № 1218 «Об утверждении Правил выплаты имущественного вреда, причиненного лицу, оправданному по суду, подозреваемому, обвиняемому, подсудимому, в отношении которых вынесено постановление суда, органа уголовного преследования о прекращении уголовного дела, в результате незаконных действий органа, ведущего уголовный процесс» и от 21 ноября 2014 года № 1219 «Об утверждении Правил принятия, хранения, реализации и обращения залога в доход государства»
    kaz: Қазақстан Республикасы Үкіметінің «Сот бойынша ақталған адамға, қылмыстық істі тоқтату туралы соттың, қылмыстық қудалау органының қаулысы шығарылған күдіктіге, айыпталушыға, сотталушыға қылмыстық процесті жүргізетін органның заңсыз іс-әрекеттерінің нәтижесінде келтірілген мүліктік зиянды төлеу қағидаларын бекіту туралы» 2014 жылғы 21 қарашадағы № 1218 және «Кепілді қабылдау, сақтау, өткізу және мемлекет кірісіне айналдыру қағидаларын бекіту туралы» 2014 жылғы 21 қарашадағы № 1219 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/120568/rus

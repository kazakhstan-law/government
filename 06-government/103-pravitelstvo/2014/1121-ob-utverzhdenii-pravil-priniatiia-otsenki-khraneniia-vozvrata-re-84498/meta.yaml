title:
  rus: Об утверждении Правил принятия, оценки, хранения, возврата, реализации, обращения взыскания на предмет залога и обращения залога в доход государства
  kaz: Кепіл нысанасын қабылдау, бағалау, сақтау, қайтару, өткізу, оған өндіріп алуды қолдану және кепілді мемлекет кірісіне айналдыру қағидаларын бекіту туралы

title:
  rus: Об утверждении перечня месторождений (группы месторождений, части месторождения) углеводородного сырья, относимых к категории низкорентабельных, высоковязких, обводненных, малодебетных и выработанных
  kaz: Рентабельділігі төмен, өте тұтқыр, су басқан, дебеті аз және сарқылған кен орындарының санатына жататын көмірсутек шикізаты кен орындарының (кен орындары тобының, кен орнының бір бөлігінің) тізбесін бекіту туралы

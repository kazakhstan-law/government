requisite: Постановление Правительства Республики Казахстан от 10 апреля 2014 года № 341. Утратило силу постановлением Правительства Республики Казахстан от 30 июня 2023 года № 528 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил выполнения гарантий государства получателям пенсионных выплат по сохранности обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов в едином накопительном пенсионном фонде в размере фактически внесенных обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов с учетом уровня инфляции
  kaz: Зейнетақы төлемдерін алушыларға бірыңғай жинақтаушы зейнетақы қорындағы міндетті зейнетақы жарналарының, міндетті кәсіптік зейнетақы жарналарының нақты енгізілген міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары мөлшерінде сақталуы бойынша мемлекет кепілдіктерін инфляцияның деңгейін ескере отырып, орындау қағидаларын бекіту туралы

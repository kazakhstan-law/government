  rus: Об установлении квот на привлечение иностранной рабочей силы по приоритетному проекту международного транзитного коридора "Западная Европа - Западный Китай" на 2014 - 2015 годы и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы для реализации приоритетного проекта международного транзитного коридора "Западная Европа - Западный Китай"
  kaz: '"Батыс Еуропа - Батыс Қытай" халықаралық транзит дәлізінің басым жобасы бойынша шетелдік жұмыс күшін тартуға 2014 - 2015 жылдарға арналған квоталарды белгілеу және "Батыс Еуропа - Батыс Қытай" халықаралық транзит дәлізінің басым жобасын іске асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру шарттарын бекіту туралы'

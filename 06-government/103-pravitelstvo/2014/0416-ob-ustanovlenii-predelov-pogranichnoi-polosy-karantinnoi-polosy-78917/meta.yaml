  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 16 апреля 2014 года № 356 «Об установлении пределов пограничной полосы, карантинной полосы и пограничной зоны и утверждении перечня приграничных территорий, входящих в пограничную зону, где исключаются или приостанавливаются действия отдельных режимных ограничений»
    kaz: «Шекаралық белдеудің, карантиндік белдеудің және шекаралық аймақтың шектерін белгілеу және жекелеген режимдік шектеулердің қолданысы алып тасталатын немесе тоқтатыла тұратын шекаралық аймаққа кіретін шекара маңы аумақтарының тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 16 сәуірдегі № 356 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 26 марта 2014 года № 266 «Об утверждении Правил превентивных посещений группами, формируемыми из участников национального превентивного механизма» и от 2 апреля 2014 года № 301 «Об утверждении Правил возмещения расходов участников национального превентивного механизма по превентивным посещениям»
    kaz: Қазақстан Республикасы Үкіметінің «Ұлттық алдын алу тетігінің қатысушыларынан құралатын топтардың алдын ала болу қағидаларын бекіту туралы» 2014 жылғы 26 наурыздағы № 266 және «Ұлттық алдын алу тетiгi қатысушыларының алдын ала болу бойынша шығыстарын өтеу қағидаларын бекіту туралы» 2014 жылғы 2 сәуірдегі № 301 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/117005/rus

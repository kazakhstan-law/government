act_code: '78255'
requisite: Постановление Правительства Республики Казахстан от 26 марта 2014 года № 260
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2014 год областными бюджетами, бюджетами городов Астаны и Алматы на апробирование подушевого финансирования начального, основного среднего и общего среднего образования
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2014 жылға арналған республикалық бюджеттен бастауыш, негізгі орта және жалпы орта білімді жан басына шаққандағы қаржыландыруды сынамалауға берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

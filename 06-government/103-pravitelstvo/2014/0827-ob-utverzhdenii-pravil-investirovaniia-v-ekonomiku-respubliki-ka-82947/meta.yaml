act_code: '82947'
requisite: Постановление Правительства Республики Казахстан от 27 августа 2014 года № 953. Утратило силу постановлением Правительства Республики Казахстан от 31 декабря 2015 года № 1179
title:
  rus: Об утверждении Правил инвестирования в экономику Республики Казахстан путем приобретения объектов приватизации, активов организаций группы акционерного общества "Фонд национального благосостояния "Самрук-Қазына", включая акции в рамках Программы вывода пакетов акций дочерних и зависимых организаций акционерного общества "Фонд национального благосостояния "Самрук-Қазына" на рынок ценных бумаг ("Народное ІРО"), а также в рамках первичного размещения государственных ценных бумаг Республики Казахстан, облигаций национальных управляющих холдингов, национальных компаний, национальных институтов развития Республики Казахстан, банков второго уровня Республики Казахстан и иных ценных бумаг, размещаемых на казахстанской фондовой бирже
  kaz: '"Самұрық-Қазына" ұлттық әл-ауқат қоры" акционерлік қоғамының еншілес және тәуелді ұйымдары акцияларының пакеттерін бағалы қағаздар нарығына шығару бағдарламасы ("Халықтық IPO") шеңберіндегі, сондай-ақ Қазақстан Республикасының мемлекеттік бағалы қағаздарын, Қазақстан Республикасының ұлттық басқарушы холдингтерінің, ұлттық компанияларының, ұлттық даму институттарының, Қазақстан Республикасының екiншi деңгейдегi банктерінiң облигацияларын және қазақстандық қор биржасында орналастырылатын өзге де бағалы қағаздарды алғашқы орналастыру шеңберіндегі акцияларды қоса алғанда, "Самұрық-Қазына" ұлттық әл-ауқат қоры" акционерлік қоғамының тобы ұйымдарының жекешелендіру объектілерін, активтерін сатып алу арқылы Қазақстан Республикасының экономикасына инвестициялау қағидаларын бекіту туралы'

title:
  rus: Об утверждении требований к техническим средствам, применяемым при досмотре пассажиров и лиц, посещающих объекты транспортной инфраструктуры, вещей, находящихся при них, в том числе ручной клади и багажа
  kaz: Жолаушыларды және көлік инфрақұрылымы объектілеріне келетін адамдарды, олардың алып жүретін заттарын, оның ішінде қол жүгі мен багажын тексеріп қарау кезінде қолданылатын техникалық құралдарға қойылатын талаптарды бекіту туралы

caused_by:
  code: '97835'
  requisite: Постановление Правительства Республики Казахстан от 31 декабря 2015 года № 1179
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 29 августа 2014 года № 959 "О некоторых вопросах реализации Закона Республики Казахстан от 30 июня 2014 года "Об амнистии граждан Республики Казахстан, оралманов и лиц, имеющих вид на жительство в Республике Казахстан, в связи с легализацией ими имущества" и признании утратившим силу постановления Правительства Республики Казахстан от 27 августа 2014 года № 953 "Об утверждении Правил инвестирования в экономику Республики Казахстан путем приобретения объектов приватизации, активов организаций группы акционерного общества "Фонд национального благосостояния "Самрук-Қазына", включая акции в рамках Программы вывода пакетов акций дочерних и зависимых организаций акционерного общества "Фонд национального благосостояния "Самрук-Қазына" на рынок ценных бумаг ("Народное ІРО"), а также в рамках первичного размещения государственных ценных бумаг Республики Казахстан, облигаций национальных управляющих холдингов, национальных компаний, национальных институтов развития Республики Казахстан, банков второго уровня Республики Казахстан и иных ценных бумаг, размещаемых на казахстанской фондовой бирже"
    kaz: '"Қазақстан Республикасының азаматтарына, оралмандарға және Қазақстан Республикасында тұруға ықтиярхаты бар адамдарға олардың мүлікті жария етуіне байланысты рақымшылық жасау туралы" 2014 жылғы 30 маусымдағы Қазақстан Республикасының Заңын іске асырудың кейбір мәселелері туралы" Қазақстан Республикасы Үкіметінің 2014 жылғы 29 тамыздағы № 959 қаулысына өзгерістер енгізу және "Самұрық-Қазына" ұлттық әл-ауқат қоры" акционерлік қоғамының еншілес және тәуелді ұйымдары акцияларының пакеттерін бағалы қағаздар нарығына шығару бағдарламасы ("Халықтық IPO") шеңберіндегі, сондай-ақ Қазақстан Республикасының мемлекеттік бағалы қағаздарын, Қазақстан Республикасының ұлттық басқарушы холдингтерінің, ұлттық компанияларының, ұлттық даму институттарының, Қазақстан Республикасының екiншi деңгейдегi банктерінiң облигацияларын және қазақстандық қор биржасында орналастырылатын өзге де бағалы қағаздарды алғашқы орналастыру шеңберіндегі акцияларды қоса алғанда, "Самұрық-Қазына" ұлттық әл-ауқат қоры" акционерлік қоғамының тобы ұйымдарының жекешелендіру объектілерін, активтерін сатып алу арқылы Қазақстан Республикасының экономикасына инвестициялау қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2014 жылғы 27 тамыздағы № 953 қаулысының күші жойылды деп тану туралы'

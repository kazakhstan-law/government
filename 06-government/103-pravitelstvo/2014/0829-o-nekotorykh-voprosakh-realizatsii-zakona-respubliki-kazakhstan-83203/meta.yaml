  requisite: Постановление Правительства Республики Казахстан от 21 ноября 2016 года № 717
  title:
    rus: О внесении изменений и дополнения в некоторые решения Правительства Республики Казахстан и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтыру енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

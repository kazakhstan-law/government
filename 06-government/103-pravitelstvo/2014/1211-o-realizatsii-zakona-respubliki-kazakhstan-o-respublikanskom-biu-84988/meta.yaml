  requisite: Постановление Правительства Республики Казахстан от 13 марта 2015 года № 139
  title:
    rus: Об увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2014 года и использовании (доиспользовании) в 2015 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2014 году, внесении изменений и дополнений в постановление Правительства Республики Казахстан от 11 декабря 2014 года № 1300 «О реализации Закона Республики Казахстан «О республиканском бюджете на 2015 – 2017 годы»
    kaz: 2014 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2014 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2015 жылы пайдалану (толық пайдалану), «2015 – 2017 жылдарға арналған республикалық бюджет туралы» Қазақстан Республикасының Заңын іске асыру туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 11 желтоқсандағы № 1300 қаулысына өзгерістер мен толықтырулар енгізу
  link: https://zan.gov.kz/client/#!/doc/87869/rus

act_code: '61366'
requisite: Постановление Правительства Республики Казахстан от 23 июня 2014 года № 693
title:
  rus: Об определении юридического лица, которому уступка банком, являющимся национальным институтом развития, контрольный пакет акций которого принадлежит национальному управляющему холдингу, прав требования по кредиту (займу) не признается доходом от снижения размеров провизий (резервов), и доходы которого от уступки права требования, полученные в связи с выкупом у банка, являющегося национальным институтом развития, контрольный пакет акций которого принадлежит национальному управляющему холдингу, прав требований по кредитам (займам), подлежат исключению из совокупного годового дохода
  kaz: Акцияларының бақылау пакеті ұлттық басқарушы холдингке тиесілі ұлттық даму институты болып табылатын банктің кредит (қарыз) бойынша талап ету құқықтарын басқаға бергені провизиялардың (резервтердің) мөлшерлерін азайтудан түсетін кіріс деп танылмайтын және талап ету құқығын беруден түсетін, акцияларының бақылау пакеті ұлттық басқарушы холдингке тиесілі ұлттық даму институты болып табылатын банктен кредиттер (қарыздар) бойынша талап ету құқықтарын сатып алуға байланысты алынған табыстары жиынтық жылдық табысынан алып тасталуға жататын заңды тұлғаны айқындау туралы

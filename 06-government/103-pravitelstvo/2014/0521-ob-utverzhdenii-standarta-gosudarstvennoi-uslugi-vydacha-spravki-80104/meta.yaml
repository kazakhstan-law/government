act_code: '80104'
requisite: Постановление Правительства Республики Казахстан от 21 мая 2014 года № 529. Утратило силу постановлением Правительства Республики Казахстан от 24 ноября 2015 года № 941
title:
  rus: Об утверждении стандарта государственной услуги "Выдача справки о постановке на специальный учет юридических лиц и индивидуальных предпринимателей, осуществляющих операции с драгоценными металлами, за исключением изделий из них, и сырьевыми товарами, содержащими драгоценные металлы"
  kaz: '"Бағалы металдармен, олардан жасалған өнімдерді қоспағанда, және құрамында бағалы металдары бар шикізат тауарларымен операцияларды жүзеге асыратын заңды тұлғалар мен дара кәсіпкерлерді арнайы есепке қою туралы анықтама беру" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'

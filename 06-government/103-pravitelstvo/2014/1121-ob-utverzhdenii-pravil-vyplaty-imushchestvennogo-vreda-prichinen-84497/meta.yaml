title:
  rus: Об утверждении Правил выплаты имущественного вреда, причиненного лицу, оправданному по суду, подозреваемому, обвиняемому, подсудимому, в отношении которых вынесено постановление суда, органа уголовного преследования о прекращении уголовного дела, в результате незаконных действий органа, ведущего уголовный процесс
  kaz: Сот бойынша ақталған адамға, қылмыстық істі тоқтату туралы соттың, қылмыстық қудалау органының қаулысы шығарылған күдіктіге, айыпталушыға, сотталушыға қылмыстық процесті жүргізетін органның заңсыз іс-әрекеттерінің нәтижесінде келтірілген мүліктік зиянды төлеу қағидаларын бекіту туралы

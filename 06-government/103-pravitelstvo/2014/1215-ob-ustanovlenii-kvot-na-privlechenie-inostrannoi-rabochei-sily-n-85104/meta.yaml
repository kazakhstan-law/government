act_code: '85104'
requisite: Постановление Правительства Республики Казахстан от 15 декабря 2014 года № 1317
title:
  rus: 'Об установлении квот на привлечение иностранной рабочей силы на 2014 и 2015 годы по приоритетному проекту "Строительство и эксплуатация многофункционального комплекса со встроенными офисными, гостиничными, жилыми, торгово-развлекательными помещениями и паркингом, расположенного по адресу: город Астана, улица Достык, дом 16" и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы для реализации приоритетного проекта "Строительство и эксплуатация многофункционального комплекса со встроенными офисными, гостиничными, жилыми, торгово-развлекательными помещениями и паркингом, расположенного по адресу: город Астана, улица Достык, дом 16"'
  kaz: '"Астана қаласы, Достық көшесі, 16-үйде орналасқан жапсарлас кеңсе, қонақүй, тұрғын, сауда ойын-сауық үй-жайлары және паркингі бар көпфункционалды кешенді салу және пайдалану" басым жобасы бойынша шетелдік жұмыс күшін тартуға 2014 және 2015 жылдарға арналған квоталарды белгілеу және "Астана қаласы, Достық көшесі, 16-үйде орналасқан жапсарлас кеңсе, қонақүй, тұрғын, сауда ойын-сауық үй-жайлары және паркингі бар көпфункционалды кешенді салу және пайдалану" басым жобасын іске асыру үшін шетелдік жұмыс күшін тартуға рұқсат берудің шарттарын бекіту туралы'

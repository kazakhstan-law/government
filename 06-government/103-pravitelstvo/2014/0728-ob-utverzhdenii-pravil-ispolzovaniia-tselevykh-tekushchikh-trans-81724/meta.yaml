title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2014 год областными бюджетами, бюджетами городов Астаны и Алматы на поддержку использования возобновляемых источников энергии
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2014 жылға арналған республикалық бюджеттен жаңартылатын энергия көздерін пайдалануды қолдауға берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

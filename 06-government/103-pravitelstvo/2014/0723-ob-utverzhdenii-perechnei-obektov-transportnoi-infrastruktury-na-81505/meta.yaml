title:
  rus: Об утверждении перечней объектов транспортной инфраструктуры, на которых производится досмотр, лиц, в отношении которых не производится досмотр, веществ и предметов, запрещенных к вносу на объекты транспортной инфраструктуры
  kaz: Тексеріп қарау жүргізілетін көлік инфрақұрылымы объектілерінің, оларға қатысты тексеріп қарау жүргізілмейтін адамдардың, көлік инфрақұрылымы объектілеріне әкелуге тыйым салынған заттар мен құралдардың тізбелерін бекіту туралы

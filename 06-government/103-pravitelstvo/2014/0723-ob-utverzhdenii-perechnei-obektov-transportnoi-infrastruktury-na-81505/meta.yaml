  requisite: Постановление Правительства Республики Казахстан от 24 октября 2014 года № 1134
  title:
    rus: О допуске аэропорта города Кызылорды к обеспечению международных полетов воздушных судов и о внесении изменения и дополнений в постановления Правительства Республики Казахстан от 9 июля 2013 года № 697 "Об утверждении перечня пунктов пропуска через Государственную границу Республики Казахстан и стационарных постов транспортного контроля на территории Республики Казахстан" и от 23 июля 2014 года № 817 "Об утверждении перечней объектов транспортной инфраструктуры, на которых производится досмотр, лиц, в отношении которых не производится досмотр, веществ и предметов, запрещенных к вносу на объекты транспортной инфраструктуры"
    kaz: Қызылорда қаласының әуежайына әуе кемелерінің халықаралық ұшуын қамтамасыз етуге рұқсат беру туралы және Қазақстан Республикасы Үкіметінің "Қазақстан Республикасының Мемлекеттік шекарасы арқылы өткізу пункттерінің және Қазақстан Республикасының аумағындағы стационарлық көліктік бақылау бекеттерінің тізбесін бекіту туралы" 2013 жылғы 9 шілдедегі № 697 және "Тексеріп қарау жүргізілетін көлік инфрақұрылымы объектілерінің, оларға қатысты тексеріп қарау жүргізілмейтін адамдардың, көлік инфрақұрылымы объектілеріне әкелуге тыйым салынған заттар мен құралдардың тізбелерін бекіту туралы" 2014 жылғы 23 шілдедегі № 817 қаулыларына өзгеріс пен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/106108/rus

act_code: '81902'
requisite: Постановление Правительства Республики Казахстан от 31 июля 2014 года № 865
title:
  rus: Об утверждении Правил возмещения затрат пунктам хранения материальных ценностей государственного материального резерва, а также возмещения затрат за материальные ценности государственного материального резерва, использованные для предупреждения и ликвидации чрезвычайных ситуаций и их последствий, оказания регулирующего воздействия на рынок, помощи беженцам и гуманитарной помощи
  kaz: '"Мемлекеттік материалдық резервтің материалдық құндылықтарын сақтау пункттеріне шығындарды өтеу, сондай-ақ мемлекеттік материалдық резервтің төтенше жағдайлар мен олардың салдарларының алдын алу және оларды жою, нарыққа реттеушілік ықпал ету, босқындарға көмек көрсету және гуманитарлық көмек көрсету үшін пайдаланылған материалдық құндылықтары үшін шығындарды өтеу қағидаларын бекіту туралы'

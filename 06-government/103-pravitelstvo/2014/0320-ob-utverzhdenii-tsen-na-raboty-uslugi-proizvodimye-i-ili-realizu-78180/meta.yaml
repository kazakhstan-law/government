act_code: '78180'
requisite: Постановление Правительства Республики Казахстан от 20 марта 2014 года № 251. Утратило силу постановлением Правительства Республики Казахстан от 18 июня 2015 года № 459
title:
  rus: Об утверждении цен на работы, услуги, производимые и (или) реализуемые Республиканскими государственными казенными предприятиями "Центр по недвижимости" Комитета регистрационной службы и оказания правовой помощи Министерства юстиции Республики Казахстан по государственному техническому обследованию зданий, сооружений и (или) их составляющих, по определению стоимости объектов налогообложения
  kaz: Ғимараттарды, құрылыстардың және (немесе) олардың құрамдас бөліктерін мемлекеттік техникалық тексеру бойынша, салық салу объектілерінің құнын айқындау бойынша Қазақстан Республикасы Әділет министрлігінің Тіркеу қызметі және құқықтық көмек көрсету комитетінің "Жылжымайтын мүлік орталығы" республикалық мемлекеттік қазыналық кәсіпорындары өндіретін және (немесе) өткізетін жұмыстарының, көрсетілетін қызметтерінің бағаларын бекіту туралы

act_code: '79284'
requisite: Постановление Правительства Республики Казахстан от 25 апреля 2014 года № 397
title:
  rus: Об установлении квоты на привлечение иностранной рабочей силы на 2014 год по приоритетному проекту "Добыча и переработка железной руды с получением передельного чугуна по инновационной технологии" и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы для реализации приоритетного проекта "Добыча и переработка железной руды с получением передельного чугуна по инновационной технологии"
  kaz: '"Инновациялық технология бойынша өңделген шойын ала отырып темір кенін өндіру және өңдеу" басым жобасы бойынша шетелдік жұмыс күшін тартуға 2014 жылға арналған квота белгілеу және "Инновациялық технология бойынша өңделген шойын ала отырып темір кенін өндіру және өңдеу" басым жобасын іске асыру үшін шетелдік жұмыс күшін тартуға рұқсат берудің шарттарын бекіту туралы'

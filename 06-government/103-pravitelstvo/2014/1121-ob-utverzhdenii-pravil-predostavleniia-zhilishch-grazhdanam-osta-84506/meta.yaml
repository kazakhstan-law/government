  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 21 ноября 2014 года № 1222 «Об утверждении Правил предоставления жилищ гражданам, оставшимся без жилища в результате чрезвычайной ситуации» и от 19 декабря 2014 года № 1358 «Об утверждении Правил возмещения вреда (ущерба), причиненного пострадавшим, вследствие чрезвычайных ситуаций природного характера»
    kaz: Қазақстан Республикасы Үкіметінің «Төтенше жағдай салдарынан тұрғын үйсіз қалған азаматтарға тұрғын үй беру қағидаларын бекіту туралы» 2014 жылғы 21 қарашадағы № 1222 және «Табиғи сипаттағы төтенше жағдайлар салдарынан зардап шеккендерге келтірілген зиянды (нұқсанды) өтеу қағидаларын бекіту туралы» 2014 жылғы 19 желтоқсандағы № 1358 қаулыларына өзгерістер мен толықтырулар енгізу туралы

requisite: Постановление Правительства Республики Казахстан от 23 июля 2014 года № 816. Утратило силу постановлением Правительства Республики Казахстан от 3 сентября 2018 года № 543 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил аттестации субъектов транспортной деятельности на соответствие порядку и требованиям по проведению досмотра пассажиров и лиц, посещающих объекты транспортной инфраструктуры, вещей, находящихся при них, в том числе ручной клади и багажа
  kaz: Көлік қызметі субъектілерін жолаушылар мен көлік инфрақұрылымы объектілеріне келетін адамдарды, олардың алып жүретін заттарын, оның ішінде қол жүгі мен багажын тексеріп қарауды жүргізу тәртібі мен талаптарына сәйкестігіне аттестаттау қағидаларын бекіту туралы

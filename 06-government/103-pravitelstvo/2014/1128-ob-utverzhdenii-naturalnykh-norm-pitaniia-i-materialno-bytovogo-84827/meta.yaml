  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 28 ноября 2014 года № 1255 «Об утверждении натуральных норм питания и материально-бытового обеспечения подозреваемых, обвиняемых, осужденных и детей, находящихся в домах ребенка учреждений уголовно-исполнительной системы и образцов формы одежды осужденных, а также Правил обеспечения бесплатным проездом, продуктами питания или деньгами на путь следования лиц, освобождаемых от отбывания наказания в виде ареста или лишения свободы, к месту жительства или работы»
    kaz: «Күдіктілерді, айыпталушыларды, сотталғандарды және қылмыстық-атқару жүйесі мекемелеріндегі балалар үйлеріндегі балаларды тамақтандырудың және материалдық-тұрмыстық қамтамасыз етудің заттай нормаларын және сотталғандардың киім нысандары үлгілерін, сондай-ақ Қамауға алу немесе бас бостандығынан айыру түріндегі жазаны өтеуден босатылатын адамдардың тұрғылықты жеріне немесе жұмысына жету үшін ақысыз жол жүрумен, тамақпен немесе ақшамен қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 28 қарашадағы № 1255 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/152749/rus

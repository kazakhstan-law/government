title:
  rus: Об утверждении натуральных норм питания и материально-бытового обеспечения подозреваемых, обвиняемых, осужденных и детей, находящихся в домах ребенка учреждений уголовно-исполнительной системы, и образцов формы одежды осужденных
  kaz: Күдіктілерді, айыпталушыларды, сотталғандарды және қылмыстық-атқару жүйесі мекемелерінің балалар үйлеріндегі балаларды тамақтандырудың және материалдық-тұрмыстық қамтамасыз етудің заттай нормаларын және сотталғандардың киім нысанының үлгілерін бекіту туралы

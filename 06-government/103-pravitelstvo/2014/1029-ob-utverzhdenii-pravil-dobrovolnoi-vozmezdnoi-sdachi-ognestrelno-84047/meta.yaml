act_code: '84047'
requisite: Постановление Правительства Республики Казахстан от 29 октября 2014 года № 1145
title:
  rus: Об утверждении Правил добровольной возмездной сдачи огнестрельного бесствольного и газового оружия с возможностью стрельбы патронами травматического действия физическими лицами, имеющими соответствующее разрешение органов внутренних дел на хранение и ношение оружия, а также передачи технически исправного и пригодного для дальнейшей эксплуатации добровольно возмездно сданного огнестрельного бесствольного и газового оружия с возможностью стрельбы патронами травматического действия в правоохранительные органы
  kaz: Жарақат салатын патрондармен ату мүмкіндігі бар ұңғысыз атыс қаруын және газды қаруды сақтауға және алып жүруге ішкі істер органдарының тиісті рұқсаты бар жеке тұлғалардың қаруды ерікті түрде өтеулі негізде тапсыру, сондай-ақ техникалық жағынан ақаусыз және одан әрі пайдалануға жарамды ерікті түрде өтеулі негізде тапсырылған, жарақат салатын патрондармен ату мүмкіндігі бар ұңғысыз атыс қаруын және газды қаруды құқық қорғау органдарына беру қағидаларын бекіту туралы

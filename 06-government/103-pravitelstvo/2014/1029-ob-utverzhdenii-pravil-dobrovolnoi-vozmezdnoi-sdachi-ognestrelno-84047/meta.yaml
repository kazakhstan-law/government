    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 29 октября 2014 года № 1145 «Об утверждении Правил добровольной возмездной сдачи огнестрельного бесствольного, газового оружия с возможностью стрельбы патронами травматического действия физическими лицами, имеющими соответствующее разрешение органов внутренних дел на хранение и ношение оружия»
    kaz: «Жарақат салатын патрондармен ату мүмкіндігі бар ұңғысыз атыс қаруын, газды қаруды сақтауға және алып жүруге ішкі істер органдарының тиісті рұқсаты бар жеке тұлғалардың қаруды ерікті түрде өтеулі негізде тапсыру қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 29 қазандағы № 1145 қаулысына өзгерістер мен толықтыру енгізу туралы

requisite: Постановление Правительства Республики Казахстан от 14 апреля 2014 года № 352. Утратило силу постановлением Правительства Республики Казахстан от 6 апреля 2018 года № 174 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня и критериев отбора предметов религиозного назначения, ввозимых религиозными объединениями, зарегистрированными в органах юстиции Республики Казахстан, которые освобождаются от налога на добавленную стоимость
  kaz: Қазақстан Республикасының әділет органдарында тіркелген діни бірлестіктер әкелетін, қосылған құн салығынан босатылатын діни мақсаттағы заттардың тізбесін және оларды іріктеу критерийлерін бекіту туралы

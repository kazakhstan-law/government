  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 24 февраля 2014 года № 129 «Об утверждении Правил исчисления выслуги лет военнослужащим, сотрудникам специальных государственных и правоохранительных органов, государственной фельдъегерской службы, а также лицам, права которых иметь воинские или специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года»
    kaz: «Әскери қызметшілерге, арнаулы мемлекеттік және құқық қорғау органдарының, мемлекеттік фельдъегерлік қызмет қызметкерлеріне, сондай-ақ әскери немесе арнайы атақтар, сыныптық шендер алу және нысанды киім киіп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдарға еңбек сіңірген жылдарын есептеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 24 ақпандағы № 129 қаулысына өзгеріс енгізу туралы

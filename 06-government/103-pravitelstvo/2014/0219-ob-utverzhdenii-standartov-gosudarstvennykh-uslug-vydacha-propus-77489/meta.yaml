act_code: '77489'
requisite: Постановление Правительства Республики Казахстан от 19 февраля 2014 года № 113. Утратило силу постановлением Правительства Республики Казахстан от 12 октября 2015 года № 821
title:
  rus: Об утверждении стандартов государственных услуг "Выдача пропуска на въезд в пограничную зону иностранцам и лицам без гражданства", "Оформление приглашений в Республику Казахстан по частным делам и с целью воссоединения семьи" и "Регистрация иностранцев и лиц без гражданства, временно пребывающих в Республике Казахстан"
  kaz: '"Шетелдіктердің және азаматтығы жоқ адамдардың шекаралық аймаққа кіруіне рұқсаттама беру", "Жеке істері бойынша және отбасының қайта қосылуы мақсатында Қазақстан Республикасына шақыруларды ресімдеу" және "Қазақстан Республикасында уақытша болатын шетелдіктер мен азаматтығы жоқ адамдарды тіркеу" мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы'

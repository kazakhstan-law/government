act_code: '81184'
requisite: Постановление Правительства Республики Казахстан от 5 июля 2014 года № 771. Утратило силу постановлением Правительства Республики Казахстан от 23 июля 2015 года № 573
title:
  rus: Об утверждении Правил и сроков направления уведомлений об устранении нарушений, выявленных по результатам проверки деятельности предыдущего администратора, отстраненного за эти нарушения, по результатам камерального контроля деятельности администратора, представления отчета об исполнении уведомления об устранении нарушений, выявленных по результатам камерального контроля деятельности администратора, а также форм уведомлений об устранении нарушений, выявленных по результатам проверки деятельности предыдущего администратора, отстраненного за эти нарушения, по результатам камерального контроля деятельности администратора, отчета об исполнении уведомления об устранении нарушений, выявленных по результатам камерального контроля деятельности администратора
  kaz: Қызметін тексеру нәтижелері бойынша анықталған бұзушылықтар үшін шеттетілген алдыңғы әкімшінің осы бұзушылықтарын, әкімшінің қызметін камералдық бақылау нәтижелері бойынша бұзушылықтарды жою туралы хабарламаларды жіберу, әкімшінің қызметін камералдық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламаның орындалуы туралы есепті беру қағидалары және мерзімдері, сондай-ақ қызметін тексеру нәтижелері бойынша анықталған бұзушылықтар үшін шеттетілген алдыңғы әкімшінің осы бұзушылықтарын, әкімшінің қызметін камералдық бақылау нәтижелері бойынша бұзушылықтарды жою туралы хабарламалардың, әкімшінің қызметін камералдық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламаның орындалуы туралы есептің нысандарын бекіту туралы

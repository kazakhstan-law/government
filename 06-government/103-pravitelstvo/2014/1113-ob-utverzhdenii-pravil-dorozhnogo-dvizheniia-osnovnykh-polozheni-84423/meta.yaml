  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 22 июня 2005 года № 607 «Вопросы Министерства внутренних дел Республики Казахстан» и от 13 ноября 2014 года № 1196 «Об утверждении Правил дорожного движения, Основных положений по допуску транспортных средств к эксплуатации, перечня оперативных и специальных служб, транспорт которых подлежит оборудованию специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Ішкі істер министрлігінің мәселелері» туралы 2005 жылғы 22 маусымдағы № 607 және «Жол жүрісі қағидаларын, Көлік құралдарын пайдалануға рұқсат беру жөніндегі негізгі ережелерді, көлігі арнайы жарық және дыбыс сигналдарымен жабдықталуға және арнайы түсті-графикалық схемалар бойынша боялуға тиіс жедел және арнайы қызметтер тізбесін бекіту туралы» 2014 жылғы 13 қарашадағы № 1196 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/115453/rus

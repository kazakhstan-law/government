  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 13 ноября 2014 года № 1196 «Об утверждении Правил дорожного движения, Основных положений по допуску транспортных средств к эксплуатации, перечня оперативных и специальных служб, транспорт которых подлежит оборудованию специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам»
    kaz: «Жол жүрісі қағидаларын, Көлік құралдарын пайдалануға рұқсат беру жөніндегі негізгі ережелерді, көлігі арнайы жарық және дыбыс сигналдарымен жабдықталуға және арнайы түсті-графикалық схемалар бойынша боялуға тиіс жедел және арнайы қызметтер тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 13 қарашадағы № 1196 қаулысына өзгеріс пен толықтыру енгізу туралы

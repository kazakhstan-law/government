requisite: Постановление Правительства Республики Казахстан от 19 ноября 2014 года № 1209. Утратило силу постановлением Правительства Республики Казахстан от 5 августа 2021 года № 524 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил обеспечения жилищем, выплаты компенсации за наем (аренду) жилища, а также категорий должностей сотрудников органов внутренних дел, имеющих право на получение компенсации
  kaz: Ішкі істер органдарының қызметкерлерін тұрғын үймен қамтамасыз ету, тұрғын үйді жалдау (жалға алу) үшін өтемақы төлеу қағидаларын, сондай-ақ өтемақы алуға құқығы бар ішкі істер органдарының қызметкерлері лауазымдарының санаттарын бекіту туралы

requisite: Постановление Правительства Республики Казахстан от 14 марта 2014 года № 240. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2016 года № 901.
title:
  rus: О вопросах оказания Министерством транспорта и коммуникаций Республики Казахстан государственных услуг в сферах деятельности аэродромов (вертодромов), иностранных перевозчиков, авиационных учебных центров и авиационного персонала, авиационной безопасности и использования воздушного пространства
  kaz: Қазақстан Республикасы Көлік және коммуникация министрлігінің әуеайлақтардың (тікұшақ айлақтарының), шетел тасымалдаушыларының, авиациялық оқу орталықтары мен авиация персоналының, авиациялық қауіпсіздік пен әуе кеңістігін пайдалану қызметтері саласында мемлекеттік қызметтер көрсету мәселелері туралы

act_code: '85025'
requisite: Постановление Правительства Республики Казахстан от 9 декабря 2014 года № 1291
title:
  rus: Об утверждении Правил изъятия, учета, хранения, передачи и уничтожения вещественных доказательств, изъятых документов, денег в национальной и иностранной валюте, наркотических средств, психотропных веществ по уголовным делам судом, органами прокуратуры, уголовного преследования и судебной экспертизы
  kaz: Соттың, прокуратура, қылмыстық қудалау және сот сараптамасы органдарының қылмыстық істер бойынша заттай дәлелдемелерді, алып қойылған құжаттарды, ұлттық және шетелдік валютадағы ақшаны, есірткіні, психотроптық заттарды алып қою, есепке алу, сақтау, беру және жою қағидаларын бекіту туралы

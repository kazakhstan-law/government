  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 9 декабря 2014 года № 1291 «Об утверждении Правил изъятия, учета, хранения, передачи и уничтожения вещественных доказательств, изъятых документов, денег в национальной и иностранной валюте, наркотических средств, психотропных веществ по уголовным делам судом, органами прокуратуры, уголовного преследования и судебной экспертизы»
    kaz: «Соттың, прокуратура, қылмыстық қудалау және сот сараптамасы органдарының қылмыстық істер бойынша заттай дәлелдемелерді, алып қойылған құжаттарды, ұлттық және шетелдік валютадағы ақшаны, есірткіні, психотроптық заттарды алып қою, есепке алу, сақтау, беру және жою қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 9 желтоқсандағы № 1291 қаулысына өзгерістер мен толықтыру енгізу туралы

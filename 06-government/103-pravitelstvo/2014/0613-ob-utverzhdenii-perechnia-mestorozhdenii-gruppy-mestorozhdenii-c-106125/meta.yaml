  title:
    rus: О внесении дополнений в постановления Правительства Республики Казахстан от 13 июня 2014 года № 651 "Об утверждении перечня месторождений (группы месторождений, части месторождения) твердых видов полезных ископаемых, за исключением общераспространенных, отнесенных к категории низкорентабельных", и от 18 июня 2014 года № 673 "Об утверждении перечня месторождений (группы месторождений, части месторождения) углеводородного сырья, относимых к категории низкорентабельных, высоковязких, обводненных, малодебетных и выработанных"
    kaz: Қазақстан Республикасы Үкіметінің «Рентабельділігі төмен кен орындары санатына жатқызылған пайдалы қазбалардың кең таралғандарын қоспағанда, қатты түрлерi кен орындарының (кен орындары тобының, кен орнының бір бөлігінің) тізбесін бекіту туралы» 2014 жылғы 13 маусымдағы № 651 және «Рентабельділігі төмен, өте тұтқыр, су басқан, дебеті аз және сарқылған кен орындарының санатына жататын көмірсутек шикізаты кен орындарының (кен орындары тобының, кен орнының бір бөлігінің) тізбесін бекіту туралы» 2014 жылғы 18 маусымдағы № 673 қаулыларына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/106064/rus

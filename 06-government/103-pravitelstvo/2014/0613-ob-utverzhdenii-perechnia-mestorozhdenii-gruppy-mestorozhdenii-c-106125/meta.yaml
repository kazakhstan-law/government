title:
  rus: Об утверждении перечня месторождений (группы месторождений, части месторождения) твердых видов полезных ископаемых, за исключением общераспространенных, отнесенных к категории низкорентабельных
  kaz: Рентабельділігі төмен кен орындары санатына жатқызылған пайдалы қазбалардың кең таралғандарын қоспағанда, қатты түрлерi кен орындарының (кен орындары тобының, кен орнының бір бөлігінің) тізбесін бекіту туралы

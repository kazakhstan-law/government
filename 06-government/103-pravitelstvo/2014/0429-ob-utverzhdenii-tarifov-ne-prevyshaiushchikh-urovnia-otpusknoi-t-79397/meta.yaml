    rus: О внесении изменения в постановление Правительства Республики Казахстан от 29 апреля 2014 года № 419 «Об утверждении тарифов, не превышающих уровня отпускной цены, установленного в утвержденном и согласованном с уполномоченным или местным исполнительным органом технико-экономического обоснования проекта строительства объекта по использованию возобновляемых источников энергии, и сроков его действия в соответствии с технико-экономическим обоснованием для энергопроизводящих организаций, использующих возобновляемые источники энергии»
    kaz: «Жаңартылатын энергия көздерін пайдаланатын энергия өндіруші ұйымдар үшін жаңартылатын энергия көздерін пайдалану объектісін салу жобасының уәкілетті немесе жергілікті атқарушы орган бекіткен және онымен келісілген техникалық экономикалық негіздемесінде белгіленген босату бағасының деңгейінен аспайтын тарифтерді және техникалық-экономикалық негіздемеге сәйкес оның қолданылу мерзімдерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 29 сәуірдегі № 419 қаулысына өзгеріс енгізу туралы

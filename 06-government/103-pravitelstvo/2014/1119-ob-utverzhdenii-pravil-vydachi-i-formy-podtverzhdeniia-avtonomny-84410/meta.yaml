title:
  rus: Об утверждении Правил выдачи и формы подтверждения автономным кластерным фондом, на основании которого осуществляется отнесение полученных (подлежащих получению) доходов к доходам от видов деятельности организаций, осуществляющих деятельность на территории специальной экономической зоны "Парк инновационных технологий"
  kaz: Дербес кластерлік қордың алынған (алынуға жататын) табыстарды "Инновациялық технологиялар паркі" арнайы экономикалық аймағының аумағында қызметін жүзеге асыратын ұйымдардың қызмет түрлерінен алынған табыстарға жатқызуды жүзеге асыруға негіз болатын растаманы беру қағидаларын және оның нысанын бекіту туралы

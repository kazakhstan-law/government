title:
  rus: Об увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2013 года и использовании (доиспользовании) в 2014 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2013 году
  kaz: 2013 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2013 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2014 жылы пайдалану (толық пайдалану) туралы

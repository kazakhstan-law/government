act_code: '79370'
requisite: Постановление Правительства Республики Казахстан от 29 мая 2014 года № 575. Утратило силу постановлением Правительства Республики Казахстан от 28 августа 2015 года № 680
title:
  rus: Об утверждении Правил субсидирования повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте
  kaz: Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауылшаруашылық дақылдарын қорғалған топырақта өңдеп өсіру шығындарын субсидиялау қағидаларын бекіту туралы

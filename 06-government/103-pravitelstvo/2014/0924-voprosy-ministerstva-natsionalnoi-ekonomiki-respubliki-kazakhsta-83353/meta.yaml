  title:
    rus: О создании государственного учреждения "Управление по защите прав потребителей Каратауского района города Шымкент Департамента по защите прав потребителей Южно-Казахстанской области Комитета по защите прав потребителей Министерства национальной экономики Республики Казахстан"
    kaz: '"Қазақстан Республикасы Ұлттық экономика министрлігінің Тұтынушылардың құқықтарын қорғау комитеті Оңтүстік Қазақстан облысы Тұтынушылардың құқықтарын қорғау департаментінің Шымкент қаласы Қаратау ауданы тұтынушылардың құқықтарын қорғау басқармасы" мемлекеттік мекемесін құру туралы'

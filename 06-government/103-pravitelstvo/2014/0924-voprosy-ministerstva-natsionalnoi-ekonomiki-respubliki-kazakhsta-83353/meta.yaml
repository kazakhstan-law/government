  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 24 сентября 2014 года № 1011 «Вопросы Министерства национальной экономики Республики Казахстан» и признании утратившими силу постановлений Правительства Республики Казахстан от 25 декабря 2015 года № 1068 «Об утверждении Правил разработки и оценки меморандума государственного органа, входящего в структуру Правительства Республики Казахстан, местного исполнительного органа области, города республиканского значения, столицы» и от 30 июля 2018 года № 475 «О внесении изменения в постановление Правительства Республики Казахстан от 25 декабря 2015 года № 1068 «Об утверждении Правил разработки и оценки меморандума государственного органа, входящего в структуру Правительства Республики Казахстан, местного исполнительного органа области, города республиканского значения, столицы»
    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігінің мәселелері туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 24 қыркүйектегі № 1011 қаулысына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Үкіметінің құрылымына кіретін мемлекеттік органның, облыстың, республикалық маңызы бар қаланың, астананың жергілікті атқарушы органының меморандумын әзірлеу және бағалау қағидаларын бекіту туралы» 2015 жылғы 25 желтоқсандағы № 1068 және «Қазақстан Республикасы Үкіметінің құрылымына кіретін мемлекеттік органның, облыстың, республикалық маңызы бар қаланың, астананың жергілікті атқарушы органының меморандумын әзірлеу және бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 25 желтоқсандағы № 1068 қаулысына өзгеріс енгізу туралы» 2018 жылғы 30 шілдедегі № 475 қаулыларының күші жойылды деп тану туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 24 сентября 2014 года № 1011 «Вопросы Министерства национальной экономики Республики Казахстан» и от 29 декабря 2018 года № 936 «О некоторых вопросах Министерства индустрии и инфраструктурного развития Республики Казахстан и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Ұлттық экономика министрлігінің мәселелері» туралы 2014 жылғы 24 қыркүйектегі № 1011 және «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің кейбір мәселелері және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы» 2018 жылғы 29 желтоқсандағы № 936 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/131216/rus

act_code: '82051'
requisite: Постановление Правительства Республики Казахстан от 5 августа 2014 года № 878. Утратило силу постановлением Правительства Республики Казахстан от 23 июня 2015 года № 475
title:
  rus: Об утверждении типовых форм договоров покупки расчетно-финансовым центром электрической энергии у энергопроизводящей организации, использующей возобновляемые источники энергии по фиксированным тарифам и тарифам, не превышающим уровня отпускной цены, установленного в утвержденном и согласованном с уполномоченным или местным исполнительным органом технико-экономическом обосновании проекта строительства объекта по использованию возобновляемых источников энергии, продажи расчетно-финансовым центром условным потребителям электрической энергии, произведенной объектами по использованию возобновляемых источников энергии
  kaz: Қаржы-есеп айырысу орталығының жаңартылатын энергия көздерін пайдаланатын энергия өндіруші ұйымнан электр энергиясын тіркелген тарифтер және жаңартылатын энергия көздерін пайдалану жөніндегі объектіні салу жобасының уәкілетті немесе жергілікті атқарушы орган бекіткен және олармен келісілген техникалық-экономикалық негіздемесінде белгіленген босату бағасының деңгейінен аспайтын тарифтер бойынша сатып алуы, қаржы-есеп айырысу орталығының жаңартылатын энергия көздерін пайдалану жөніндегі объектілер өндірген электр энергиясын шартты тұтынушыларға сатуы шарттарының үлгі нысандарын бекiту туралы

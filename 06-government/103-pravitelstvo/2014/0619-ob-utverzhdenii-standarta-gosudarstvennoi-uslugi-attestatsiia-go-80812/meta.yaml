act_code: '80812'
requisite: Постановление Правительства Республики Казахстан от 19 июня 2014 года № 676. Утратило силу постановлением Правительства Республики Казахстан от 28 августа 2015 года № 684
title:
  rus: Об утверждении стандарта государственной услуги "Аттестация государственных информационных систем и негосударственных информационных систем, интегрируемых с государственными информационными системами, на соответствие их требованиям информационной безопасности и принятым на территории Республики Казахстан стандартам"
  kaz: '"Мемлекеттік ақпараттық жүйелерді және мемлекеттік ақпараттық жүйелермен интеграцияланатын мемлекеттік емес ақпараттық жүйелерді олардың ақпараттық қауіпсіздік талаптарына және Қазақстан Республикасының аумағында қабылданған стандарттарға сәйкестігіне аттестаттау" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'

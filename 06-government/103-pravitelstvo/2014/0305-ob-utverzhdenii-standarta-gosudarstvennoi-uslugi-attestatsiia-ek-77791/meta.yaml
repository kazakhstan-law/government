title:
  rus: Об утверждении стандарта государственной услуги "Аттестация экспертов, осуществляющих экспертные работы и инжиниринговые услуги в сфере архитектурной, градостроительной и строительной деятельности"
  kaz: '"Сәулет, қала құрылысы және құрылыс қызметі саласында сараптамалық жұмыстар мен инжинирингтiк көрсетілетін қызметтерді жүзеге асыратын сарапшыларды аттестаттау" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'

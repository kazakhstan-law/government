title:
  rus: О создании Республиканского государственного казенного предприятия "Центр спортивной подготовки для лиц с ограниченными физическими возможностями" Агентства Республики Казахстан по делам спорта и физической культуры
  kaz: Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігінің "Дене мүмкіндіктері шектеулі тұлғаларға арналған спорттық даярлау орталығы" республикалық мемлекеттiк қазыналық кәсiпорнын құру туралы

title:
  rus: Об утверждении перечня должностей сотрудников органов внутренних дел, имеющих право при перемещениях и продвижениях по службе на подъемное пособие, возмещение затрат за проезд на транспорте и за перевозку собственного имущества
  kaz: Қызметін ауыстырған және жоғарылаған кезде көтерме жәрдемақыға, көліктің жолақысы үшін және жеке мүлкін тасымалдағаны үшін шығындардың орнын толтыруға құқығы бар ішкі істер органдары қызметкерлері лауазымдарының тізбесін бекіту туралы

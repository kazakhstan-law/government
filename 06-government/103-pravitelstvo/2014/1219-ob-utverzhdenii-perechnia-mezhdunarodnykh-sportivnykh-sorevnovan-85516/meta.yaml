act_code: '85516'
requisite: Постановление Правительства Республики Казахстан от 19 декабря 2014 года № 1345. Утратило силу постановлением Правительства Республики Казахстан от 27 марта 2020 года № 147 (вводится в действие со дня его подписания)
title:
  rus: Об утверждении перечня международных спортивных соревнований, размеров и Правил выплат денежных поощрений чемпионам и призерам международных спортивных соревнований, тренерам и членам сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта)
  kaz: Халықаралық спорттық жарыстардың тізбесін, халықаралық спорттық жарыстардың чемпиондары мен жүлдегерлеріне, спорт түрлері бойынша Қазақстан Республикасының құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) жаттықтырушылары мен мүшелеріне ақшалай көтермелеу төлемдерінің мөлшерін және оларды төлеу қағидаларын бекіту туралы

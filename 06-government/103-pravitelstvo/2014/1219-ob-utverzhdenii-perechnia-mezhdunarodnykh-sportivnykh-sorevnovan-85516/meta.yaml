  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 19 декабря 2014 года № 1345 «Об утверждении перечня международных спортивных соревнований, размеров и Правил выплат денежных поощрений чемпионам и призерам международных спортивных соревнований, тренерам и членам сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта)»
    kaz: «Халықаралық спорттық жарыстардың тізбесін, халықаралық спорттық жарыстардың чемпиондары мен жүлдегерлеріне, спорт түрлері бойынша Қазақстан Республикасының құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) жаттықтырушылары мен мүшелеріне ақшалай көтермелеу төлемдерінің мөлшерін және оларды төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 19 желтоқсандағы № 1345 қаулысына өзгерістер енгізу туралы

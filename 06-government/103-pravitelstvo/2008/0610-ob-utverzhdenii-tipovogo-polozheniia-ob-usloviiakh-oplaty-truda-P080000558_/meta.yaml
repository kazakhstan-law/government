title:
  rus: Об утверждении Типового положения об условиях оплаты труда и премирования руководящих работников национальных компаний, акционерных обществ, контрольные пакеты акций которых принадлежат государству
  kaz: Акцияларының бақылау пакеті мемлекетке тиесілі ұлттық компаниялардың, акционерлік қоғамдардың басшы қызметкерлерінің еңбегіне ақы төлеу мен сыйлықақы беру шарттары туралы үлгілік ережені бекіту туралы

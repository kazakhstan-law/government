  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 30 июня 2008 года № 651 "Об утверждении перечней стратегических объектов, переданных в уставный капитал и (или) находящихся в собственности национальных холдингов и (или) национальных компаний либо их аффилиированных лиц, а также иных юридических лиц с участием государства и стратегических объектов, находящихся в собственности юридических лиц, не аффилиированных с государством, а также физических лиц"
    kaz: '"Ұлттық холдингтердің және (немесе) ұлттық компаниялардың не олардың аффилиирленген тұлғаларының, сондай-ақ мемлекет қатысатын өзге де заңды тұлғалардың жарғылық капиталдарына берілген және (немесе) олардың меншігінде тұрған стратегиялық объектілердің және мемлекетпен аффилиирленбеген заңды тұлғалардың, сондай-ақ жеке тұлғалардың меншігінде тұрған стратегиялық объектілердің тізбелерін бекіту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 30 маусымдағы № 651 қаулысына өзгерістер мен толықтырулар енгізу туралы'

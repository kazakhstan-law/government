act_code: '41554'
requisite: Постановление Правительства Республики Казахстан от 18 сентября 2008 года № 860
title:
  rus: Об утверждении Правил предоставления жилых помещений, возмещения материального ущерба, предоставления необходимой помощи физическим лицам, пострадавшим в результате обстоятельств, послуживших основанием для введения чрезвычайного положения
  kaz: Төтенше жағдайды енгізуге негіз болған мән-жайлардың салдарынан зардап шеккен жеке тұлғаларға тұрғын үй-жайлар беру, материалдық залалды өтеу, қажетті көмек беру ережесін бекіту туралы

act_code: '38222'
requisite: Постановление Правительства Республики Казахстан от 11 марта 2008 года № 235
title:
  rus: О реорганизации Республиканского государственного предприятия на праве хозяйственного ведения "Спортивный комбинат имени Нуркена Абдирова" и Республиканского государственного казенного предприятия "Дирекция по строительству спортивных сооружений" Комитета по спорту Министерства туризма и спорта Республики Казахстан
  kaz: Қазақстан Республикасы Туризм және спорт министрлігі Спорт комитетінің "Нұркен Әбдіров атындағы спорт комбинаты" шаруашылық жүргізу құқығындағы республикалык мемлекеттік кәсіпорны мен "Спорт ғимараттарының құрылысын салу жөніндегі дирекция" республикалық мемлекеттік қазыналық кәсіпорнын қайта ұйымдастыру туралы

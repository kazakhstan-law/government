act_code: '41302'
requisite: Постановление Правительства Республики Казахстан от 26 августа 2008 года N 769
title:
  rus: Об утверждении Правил расходования средств на компенсацию затрат по поставкам топлива для энергопроизводящей организации в целях обеспечения стабильного электроснабжения потребителей южных регионов Казахстана
  kaz: Қазақстанның оңтүстік өңірлерінің тұтынушыларын электрмен тұрақты жабдықтауды қамтамасыз ету мақсатында энергия өндіретін ұйым үшін отын жеткізу бойынша шығындарды өтеуге арналған қаражатты жұмсау ережесін бекіту туралы

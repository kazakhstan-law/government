  requisite: Постановление Правительства Республики Казахстан от 3 июня 2016 года № 327
  title:
    rus: О внесении дополнений в постановления Правительства Республики Казахстан от 7 февраля 2008 года № 116 «Об утверждении Правил назначения, выплаты и размеров государственных стипендий обучающимся в организациях образования» и от 31 декабря 2015 года № 1193 «О системе оплаты труда гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий»
    kaz: Қазақстан Республикасы Үкіметінің «Білім беру ұйымдарында білім алушыларға мемлекеттік стипендияларды тағайындау, төлеу қағидаларын және олардың мөлшерлерін бекіту туралы» 2008 жылғы 7 ақпандағы № 116 және «Азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбекақы төлеу жүйесі туралы» 2015 жылғы 31 желтоқсандағы № 1193 қаулыларына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/102977/rus

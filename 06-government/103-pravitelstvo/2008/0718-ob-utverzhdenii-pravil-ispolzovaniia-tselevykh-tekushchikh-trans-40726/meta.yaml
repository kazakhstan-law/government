act_code: '40726'
requisite: Постановление Правительства Республики Казахстан от 18 июля 2008 года N 707
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2008 года областным бюджетом Карагандинской области на погашение оставшейся части задолженности по заработной плате работников Государственного акционерного общества "Карагандинский металлургический комбинат", образовавшейся до ноября 1995 года
  kaz: Қарағанды облысы облыстық бюджетінің "Қарағанды металлургия комбинаты" мемлекеттік акционерлік қоғамының қызметкерлеріне 1995 жылғы қарашаға дейін қалыптасқан жалақы бойынша берешектің қалған бөлігін өтеуге 2008 жылға арналған республикалық бюджеттен бөлінетін ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

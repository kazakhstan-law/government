act_code: '43578'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2008 года № 1355. Утратило силу постановлением Правительства Республики Казахстан от 19 марта 2012 года № 340
title:
  rus: Об утверждении перечня акционерных обществ и хозяйственных товариществ, сто процентов голосующих акций (долей участия) которых принадлежат государству, у которых государственные органы, осуществляющие права владения и пользования ими, приобретают товары, работы и услуги без применения норм Закона Республики Казахстан "О государственных закупках", регламентирующих выбор поставщика и заключение с ним договора о государственных закупках
  kaz: Дауыс беретін акцияларының (қатысу үлестерінің) жүз пайызы мемлекетке тиесілі, оларды иелену және пайдалану құқығын жүзеге асыратын мемлекеттік органдар "Мемлекеттік сатып алу туралы" Қазақстан Республикасы Заңының өнім берушіні таңдауды және олармен мемлекеттік сатып алу туралы шарт жасасуды регламенттейтін нормаларын қолданбай тауарларды, жұмыстарды және қызметтерді сатып алатын акционерлік қоғамдар мен шаруашылық серіктестіктердің тізбесін бекіту туралы

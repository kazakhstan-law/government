  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 января 2008 года № 80 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
    kaz: '"Заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуi және өткiзуi жөнiндегi қызметтi лицензиялау ережесiн және оған қойылатын бiлiктiлiк талаптарын бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2008 жылғы 31 қаңтардағы № 80 қаулысына өзгерістер енгізу туралы'

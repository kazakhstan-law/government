  requisite: Постановление Правительства Республики Казахстан от 3 сентября 2018 года № 544
  title:
    rus: О некоторых вопросах Актауского международного морского торгового порта, внесении изменений в некоторые решения Правительства Республики Казахстан и признании утратившим силу постановления Правительства Республики Казахстан от 31 июля 2003 года № 768 «О придании Актаускому морскому торговому порту статуса морского порта международного значения»
    kaz: Ақтау халықаралық теңіз сауда портының кейбір мәселелері, Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер енгізу және «Ақтау теңiз сауда портына халықаралық маңызы бар теңiз порты мәртебесiн беру туралы» Қазақстан Республикасы Үкіметінің 2003 жылғы 31 шілдедегі № 768 қаулысының күші жойылды деп тану туралы

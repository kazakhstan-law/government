  requisite: Постановление Правительства Республики Казахстан от 1 июля 2021 года № 455
  title:
    rus: Об отчуждении стратегического объекта и внесении дополнений в постановление Правительства Республики Казахстан от 30 июня 2008 года № 651 «Об утверждении перечней стратегических объектов, переданных в уставный капитал и (или) находящихся в собственности национальных холдингов и (или) национальных компаний либо их аффилированных лиц, а также иных юридических лиц с участием государства и стратегических объектов, находящихся в собственности юридических лиц, не аффилированных с государством, а также физических лиц»
    kaz: Стратегиялық объектіні иеліктен шығару және «Ұлттық холдингтердің және (немесе) ұлттық компаниялардың не олардың аффилиирленген тұлғаларының, сондай-ақ мемлекет қатысатын өзге де заңды тұлғалардың жарғылық капиталдарына берілген және (немесе) олардың меншігінде тұрған стратегиялық объектілердің және мемлекетпен аффилиирленбеген заңды тұлғалардың, сондай-ақ жеке тұлғалардың меншігінде тұрған стратегиялық объектілердің тізбелерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 30 маусымдағы № 651 қаулысына толықтырулар енгізу туралы

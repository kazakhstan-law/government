  requisite: Постановление Правительства Республики Казахстан от 31 октября 2022 года № 857
  title:
    rus: О принятии долей участия дочерних товариществ с ограниченной ответственностью «Институт ионосферы» и «Институт космической техники и технологий» из частной собственности в республиканскую собственность по договору дарения и внесении изменения и дополнений и изменения в некоторые решения Правительства Республики Казахстан
    kaz: «Ионосфера институты» және «Ғарыштық техника және технологиялар институты» жауапкершілігі шектеулі еншілес серіктестіктерінің қатысу үлестерін сыйға тарту шарты бойынша жеке меншіктен республикалық меншікке қабылдау және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгеріс пен толықтырулар енгізу туралы

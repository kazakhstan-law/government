caused_by:
  code: '152401'
  requisite: Постановление Правительства Республики Казахстан от 30 декабря 2020 года № 936
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 30 июля 2004 года № 810 «Об утверждении перечня объектов отраслей экономики, имеющих стратегическое значение, в отношении которых осуществляется государственный мониторинг собственности» и от 30 июня 2008 года № 651 «Об утверждении перечней стратегических объектов, переданных в уставный капитал и (или) находящихся в собственности национальных холдингов и (или) национальных компаний либо их аффилированных лиц, а также иных юридических лиц с участием государства и стратегических объектов, находящихся в собственности юридических лиц, не аффилированных с государством, а также физических лиц»
    kaz: Қазақстан Республикасы Үкіметінің «Экономиканың стратегиялық маңызы бар салаларының өздеріне қатысты меншіктің мемлекеттік мониторингі жүзеге асырылатын объектілерінің тізбесін бекіту туралы» 2004 жылғы 30 шілдедегі № 810 және «Ұлттық холдингтердің және (немесе) ұлттық компаниялардың не олардың аффилиирленген тұлғаларының, сондай-ақ мемлекет қатысатын өзге де заңды тұлғалардың жарғылық капиталдарына берілген және (немесе) олардың меншігінде тұрған стратегиялық объектілердің және мемлекетпен аффилиирленбеген заңды тұлғалардың, сондай-ақ жеке тұлғалардың меншігінде тұрған стратегиялық объектілердің тізбелерін бекіту туралы» 2008 жылғы 30 маусымдағы № 651 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/152401/rus

  title:
    rus: О принятии доли участия дочернего товарищества с ограниченной ответственностью «Астрофизический институт имени В.Г. Фесенкова» из частной собственности в республиканскую собственность по договору дарения и внесении дополнений в некоторые решения Правительства Республики Казахстан
    kaz: «В.Г. Фесенков атындағы астрофизикалық институт» еншілес жауапкершілігі шектеулі серіктестігінің қатысу үлесін сыйға тарту шарты бойынша жеке меншіктен республикалық меншікке қабылдау және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне толықтырулар енгізу туралы

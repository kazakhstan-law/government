  title:
    rus: О назначении Шукеева У.Е. председателем правления акционерного общества "Фонд национального благосостояния "Самрук-Казына" и внесении изменения в постановление Правительства Республики Казахстан от 17 октября 2008 года № 962 "О мерах по реализации Указа Президента Республики Казахстан от 13 октября 2008 года № 669"
    kaz: Ө.Е. Шөкеевті "Самұрық-Қазына" ұлттық әл-ауқат қоры" акционерлік қоғамының басқарма төрағасы етіп тағайындау және "Қазақстан Республикасы Президентінің 2008 жылғы 13 қазандағы № 669 Жарлығын іске асыру жөніндегі шаралар туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 17 қазандағы № 962 қаулысына өзгеріс енгізу туралы

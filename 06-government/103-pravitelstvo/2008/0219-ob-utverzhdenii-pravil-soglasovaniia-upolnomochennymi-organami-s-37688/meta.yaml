act_code: '37688'
requisite: Постановление Правительства Республики Казахстан от 19 февраля 2008 года N 158. Утратило силу постановлением Правительства Республики Казахстан от 15 июля 2024 года № 553 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил согласования уполномоченными органами соответствия процессов (стадий) разработки (создания), производства (изготовления), оборота, утилизации и уничтожения пищевой продукции, соответствия машин и оборудования, материалов и изделий, используемых при разработке (создании), производстве (изготовлении), обороте, утилизации и уничтожении, требованиям, установленным законодательством Республики Казахстан о безопасности пищевой продукции
  kaz: Қазақстан Республикасының тамақ өнімдерінің қауіпсіздігі туралы заңнамасында белгіленген талаптарға тамақ өнімдерін әзірлеу (жасау), өндіру (дайындау), айналымы, кәдеге жарату және жою процестерінің (сатыларының) сәйкестігін, әзірлеу (жасау), өндіру (дайындау), айналымы, кәдеге жарату және жою кезінде пайдаланылатын машиналар мен жабдықтардың, материалдар мен бұйымдардың сәйкестігін уәкілетті органдардың келісу ережесін бекіту туралы

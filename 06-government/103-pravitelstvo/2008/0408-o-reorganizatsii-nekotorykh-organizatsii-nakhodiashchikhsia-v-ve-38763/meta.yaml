  code: '99196'
  requisite: Постановление Правительства Республики Казахстан от 18 февраля 2016 года № 79. Утратил силу постановлением Правительства Республики Казахстан от 1 сентября 2023 года № 758 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении перечня государственных предприятий учреждений уголовно-исполнительной (пенитенциарной) системы, у которых приобретаются производимые, выполняемые, оказываемые ими товары, работы, услуги, а также перечня и объемов товаров, работ, услуг, приобретаемых у производящих, выполняющих, оказывающих их государственных предприятий учреждений уголовно исполнительной (пенитенциарной) системы, и внесении изменений в постановление Правительства Республики Казахстан от 31 декабря 2014 года № 1423 «Об утверждении норм минимального жизнеобеспечения населения, находящегося в зоне чрезвычайной ситуации»
    kaz: Өндіретін, орындайтын, көрсететін тауарлары, жұмыстары, қызметтері сатып алынатын қылмыстық-атқару жүйесі (пенитенциарлық) мекемелері мемлекеттік кәсіпорындарының тізбесін, сондай-ақ қылмыстық-атқару жүйесі (пенитенциарлық) мекемелерінің мемлекеттік кәсіпорындарынан сатып алынатын, олар өндіретін, орындайтын, көрсететін тауарлардың, жұмыстардың, қызметтердің тізбесі мен көлемін бекіту және «Төтенше жағдай аймағындағы халықтың ең төменгі тіршілігін қамтамасыз ету нормаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 31 желтоқсандағы № 1423 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/99196/rus

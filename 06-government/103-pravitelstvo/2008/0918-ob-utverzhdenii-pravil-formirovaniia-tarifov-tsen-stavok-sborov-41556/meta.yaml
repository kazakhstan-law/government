title:
  rus: Об утверждении Правил формирования тарифов (цен, ставок сборов) или их предельных уровней на регулируемые услуги (товары, работы) субъектов естественных монополий, осуществляющих свою деятельность по договорам концессии
  kaz: Өз қызметін концессия шарттары бойынша жүзеге асыратын табиғи монополия субъектілерінің реттеліп көрсетілетін қызметтерінің (тауарларының, жұмыстарының) тарифтерін (бағаларын, алымдар ставкаларын) немесе олардың шекті деңгейлерін қалыптастыру ережесін бекіту туралы

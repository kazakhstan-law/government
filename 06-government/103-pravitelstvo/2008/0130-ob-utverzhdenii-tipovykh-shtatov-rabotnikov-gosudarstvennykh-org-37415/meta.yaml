  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 30 января 2008 года № 77 «Об утверждении Типовых штатов работников государственных организаций образования и перечня должностей педагогических работников и приравненных к ним лиц»
    kaz: «Мемлекеттік білім беру ұйымдары қызметкерлерінің үлгі штаттарын және педагог қызметкерлер мен оларға теңестірілген адамдар лауазымдарының тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 30 қаңтардағы № 77 қаулысына өзгерістер енгізу туралы

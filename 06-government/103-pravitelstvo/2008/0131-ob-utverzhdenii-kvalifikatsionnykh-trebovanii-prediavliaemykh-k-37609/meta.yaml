    kaz: '"Босатылатын оқ-дәрілерді, қару-жарақтарды, әскери-техниканы, арнайы құралдарды жою (құрту, кәдеге жарату, көму) және қайта өңдеу жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 31 қаңтардағы № 82 қаулысына өзгерістер енгізу туралы'

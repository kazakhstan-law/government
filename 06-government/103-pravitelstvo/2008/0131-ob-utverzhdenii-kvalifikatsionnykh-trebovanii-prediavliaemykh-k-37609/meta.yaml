    rus: О внесении изменения в постановление Правительства Республики Казахстан от 31 января 2008 года № 82 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к деятельности по ликвидации (уничтожению, утилизации, захоронению) и переработке высвобождаемых боеприпасов, вооружений, военной техники, специальных средств"
    kaz: '"Босатылатын оқ-дәрілерді, қару-жарақтарды, әскери-техниканы, арнайы құралдарды жою (құрту, кәдеге жарату, көму) және қайта өңдеу жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 31 қаңтардағы № 82 қаулысына өзгеріс енгізу туралы'

title:
  rus: Об утверждении Правил уничтожения органами уголовного преследования наркотических средств, психотропных веществ, являющихся вещественными доказательствами по уголовным делам
  kaz: Қылмыстық қудалау органдарының қылмыстық істер бойынша заттай дәлелдемелер болып табылатын есірткі құралдарын, психотроптық заттарды жою ережесін бекіту туралы

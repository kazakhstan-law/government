title:
  rus: Об утверждении Технического регламента "Требования по оборудованию зданий, помещений и сооружений системами автоматического пожаротушения и автоматической пожарной сигнализации, оповещения и управления эвакуацией людей при пожаре"
  kaz: '"Ғимараттарды, үй-жайларды және құрылыстарды автоматты түрде өрт сөндіру және автоматты өрт дабылымен, өрт кезінде адамдарға хабарлау және оларды эвакуациялауды басқару жүйелерімен жабдықтау жөніндегі талаптар" техникалық регламентін бекіту туралы'

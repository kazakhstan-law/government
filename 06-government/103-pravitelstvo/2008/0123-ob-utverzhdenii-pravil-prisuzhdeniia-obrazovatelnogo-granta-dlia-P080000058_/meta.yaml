title:
  rus: Об утверждении Правил присуждения образовательного гранта для оплаты высшего или послевузовского образования с присуждением степени «бакалавр» или «магистр»
  kaz: «Бакалавр» немесе «магистр» дәрежелері берілетін жоғары немесе жоғары оқу орнынан кейінгі білім алуға ақы төлеу үшін білім беру грантын беру қағидаларын бекіту туралы

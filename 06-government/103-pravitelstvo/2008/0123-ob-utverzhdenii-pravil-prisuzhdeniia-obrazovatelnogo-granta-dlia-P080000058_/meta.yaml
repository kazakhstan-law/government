  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 23 января 2008 года № 58 «Об утверждении Правил присуждения образовательного гранта для оплаты высшего или послевузовского образования с присуждением степени «бакалавр» или «магистр»
    kaz: «Бакалавр» немесе «магистр» дәрежелері берілетін жоғары немесе жоғары оқу орнынан кейінгі білім алуға ақы төлеу үшін білім беру грантын беру ережелерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 23 қаңтардағы № 58 қаулысына өзгерістер мен толықтырулар енгізу туралы

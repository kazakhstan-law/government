title:
  rus: Об утверждении норм снабжения техническими средствами воспитания и другим культурно-просветительным имуществом, комплектами полиграфического оборудования типографий военных газет и журналов Вооруженных Сил, других войск и воинских формирований Республики Казахстан
  kaz: Қазақстан Республикасының Қарулы Күштерін, басқа да әскерлері мен әскери құралымдарын техникалық тәрбие құралдарымен және басқа да мәдени-ағарту мүлкімен, әскери газеттер мен журналдар баспаханаларының полиграфиялық жабдықтар жиынтықтарымен жабдықтау нормаларын бекіту туралы

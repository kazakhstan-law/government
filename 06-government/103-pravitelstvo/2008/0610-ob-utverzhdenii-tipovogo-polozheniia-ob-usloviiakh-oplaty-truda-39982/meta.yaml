  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 10 июня 2008 года № 558 "Об утверждении Типового положения об условиях оплаты труда и премирования руководящих работников национальных компаний, акционерных обществ, контрольные пакеты акций которых принадлежат государству" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: '"Акцияларының бақылау пакеті мемлекетке тиесілі ұлттық компаниялардың, акционерлік қоғамдардың басшы қызметкерлерінің еңбегіне ақы төлеу мен сыйлықақы беру шарттары туралы үлгілік ережені бекіту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 10 маусымдағы № 558 қаулысына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/68713/rus

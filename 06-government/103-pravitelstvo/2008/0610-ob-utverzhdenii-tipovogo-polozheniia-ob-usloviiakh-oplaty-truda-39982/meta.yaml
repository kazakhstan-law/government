caused_by:
  code: '84815'
  requisite: Постановление Правительства Республики Казахстан от 2 декабря 2014 года № 1266
  title:
    rus: Об определении лимитов отдельных видов административных расходов национальных управляющих холдингов (за исключением Фонда национального благосостояния), национальных холдингов и национальных компаний, контрольные пакеты акций которых принадлежат государству, а также национальных компаний, которые входят в состав национальных управляющих холдингов (за исключением национальных компаний, которые входят в состав группы Фонда национального благосостояния), национальных холдингов и механизма проведения их мониторинга и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Акцияларының бақылау пакеттері мемлекетке тиесілі ұлттық басқарушы холдингтердің (Ұлттық әл-ауқат қорын қоспағанда), ұлттық холдингтердің және ұлттық компаниялардың, сондай-ақ ұлттық басқарушы холдингтердің, ұлттық холдингтердің құрамына кіретін ұлттық компаниялардың (Ұлттық әл-ауқат қоры тобының құрамына кіретін ұлттық компанияларды қоспағанда) әкімшілік шығыстарының жекелеген түрлерінің лимиттерін және оларға мониторинг жүргізу тетігін айқындау және Қазақстан Республикасы Үкіметінің кейбiр шешiмдерiне өзгерiстер мен толықтырулар енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/84815/rus

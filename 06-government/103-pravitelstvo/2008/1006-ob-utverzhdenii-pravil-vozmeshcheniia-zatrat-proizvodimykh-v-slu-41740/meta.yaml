title:
  rus: Об утверждении Правил возмещения затрат, производимых в случае привлечения органов государственной противопожарной службы к тушению пожаров в организациях и на объектах, на которых в обязательном порядке должна быть создана противопожарная служба
  kaz: Міндетті түрде өртке қарсы қызмет құрылуға тиіс ұйымдар мен объектілерде өрттерді сөндіруге мемлекеттік өртке қарсы қызмет органдары тартылған жағдайда шығатын шығындарды өтеу ережесін бекіту туралы

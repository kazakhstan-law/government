act_code: '37362'
requisite: Постановление Правительства Республики Казахстан от 25 января 2008 года N 64
title:
  rus: Об утверждении Правил формирования, направления и распределения средств на оказание финансовой и материальной помощи обучающимся и воспитанникам организаций образования из семей, имеющих право на получение государственной адресной социальной помощи, а также из семей, не получающих государственную адресную социальную помощь, в которых среднедушевой доход ниже величины прожиточного минимума, и детям-сиротам, детям, оставшимся без попечения родителей, проживающим в семьях, детям из семей, требующих экстренной помощи в результате чрезвычайных ситуаций, и иным категориям обучающихся и воспитанников
  kaz: Білім беру ұйымдарының мемлекеттік атаулы әлеуметтік көмек алуға құқығы бар отбасылардан, сондай-ақ мемлекеттік атаулы әлеуметтік көмек алмайтын, жан басына шаққандағы табысы ең төменгі күнкөріс деңгейінің шамасынан төмен отбасылардан шыққан білім алушылары мен тәрбиеленушілеріне және жетім балаларға, ата-анасының қамқорлығынсыз қалып, отбасыларда тұратын балаларға, төтенше жағдайлардың салдарынан шұғыл жәрдемді талап ететін отбасылардан шыққан балаларға және өзге де санаттағы білім алушылар мен тәрбиеленушілерге қаржылай және материалдық көмек көрсетуге арналған қаражатты қалыптастыру, бағыттау және бөлу қағидаларын бекіту туралы

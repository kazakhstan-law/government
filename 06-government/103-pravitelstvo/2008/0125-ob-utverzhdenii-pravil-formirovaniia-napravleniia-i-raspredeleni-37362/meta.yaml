  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 25 января 2008 года № 64 "Об утверждении Правил расходования средств, выделяемых на оказание финансовой и материальной помощи социально незащищенным обучающимся и обучающимся из числа малообеспеченных семей"
    kaz: '"Әлеуметтік қорғалмаған білім алушылар мен күнкөрісі төмен отбасылардан шыққан білім алушыларға қаржылай және материалдық көмек көрсетуге бөлінетін қаражатты жұмсау ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 25 қаңтардағы № 64 қаулысына өзгерістер енгізу туралы'

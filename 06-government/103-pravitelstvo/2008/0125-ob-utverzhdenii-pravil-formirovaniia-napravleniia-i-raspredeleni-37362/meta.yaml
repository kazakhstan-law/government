  requisite: Постановление Правительства Республики Казахстан от 30 декабря 2020 года № 949
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 25 января 2008 года № 64 «Об утверждении Правил формирования, направления расходования и учета средств, выделяемых на оказание финансовой и материальной помощи обучающимся и воспитанникам государственных учреждений образования из семей, имеющих право на получение государственной адресной социальной помощи, а также из семей, не получающих государственную адресную социальную помощь, в которых среднедушевой доход ниже величины прожиточного минимума, и детям-сиротам, детям, оставшимся без попечения родителей, проживающим в семьях, детям из семей, требующих экстренной помощи в результате чрезвычайных ситуаций, и иным категориям обучающихся и воспитанников»
    kaz: «Мемлекеттік білім беру мекемелерінің мемлекеттік атаулы әлеуметтік көмек алуға құқығы бар отбасылардан, сондай-ақ мемлекеттік атаулы әлеуметтік көмек алмайтын, жан басына шаққандағы табысы ең төменгі күнкөріс деңгейінің шамасынан төмен отбасылардан шыққан білім алушылары мен тәрбиеленушілеріне және жетім балаларға, ата-анасының қамқорлығынсыз қалып, отбасыларда тұратын балаларға, төтенше жағдайлардың салдарынан шұғыл жәрдемді талап ететін отбасылардан шыққан балаларға және өзге де санаттағы білім алушылар мен тәрбиеленушілерге қаржылай және материалдық көмек көрсетуге бөлінетін қаражатты қалыптастыру, жұмсау бағыты мен оларды есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 25 қаңтардағы № 64 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/151711/rus

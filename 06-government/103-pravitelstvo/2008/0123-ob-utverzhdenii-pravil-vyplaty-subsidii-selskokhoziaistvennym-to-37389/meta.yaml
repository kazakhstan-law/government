act_code: '37389'
requisite: Постановление Правительства Республики Казахстан от 23 января 2008 года N 41. Утратило силу постановлением Правительства Республики Казахстан от 30 января 2009 года N 87.
title:
  rus: Об утверждении Правил выплаты субсидий сельскохозяйственным товаропроизводителям на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ на 2008 год
  kaz: Ауыл шаруашылығы тауарын өндірушілерге өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға, 2008 жылғы көктемгі егіс және егін жинау жұмыстарын жүргізу үшін қажетті жанар-жағармай материалдары мен басқа да тауар-материалдық құндылықтардың құнын арзандатуға субсидиялар төлеу ережесін бекіту туралы

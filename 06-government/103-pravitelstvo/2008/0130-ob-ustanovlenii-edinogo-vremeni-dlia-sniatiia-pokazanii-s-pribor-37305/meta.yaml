title:
  rus: Об установлении единого времени для снятия показаний с приборов учета электрической энергии, для целей коммерческого учета электроэнергии в единой электроэнергетической системе Республики Казахстан
  kaz: Қазақстан Республикасының бірыңғай электр энергетикалық жүйесіндегі электр энергиясын коммерциялық есепке алу мақсаттары үшін электр энергиясын есепке алу аспаптарының көрсеткіштерін түсіріп алу үшін бірыңғай уақытты белгілеу туралы

  title:
    rus: О внесении изменений и дополнений и признании утратившими силу некоторых решений Правительства Республики Казахстан и распоряжения Премьер-Министра Республики Казахстан от 7 апреля 2011 года № 44-р «О порядке организации и проведения спасательных и других неотложных работ в зонах возможных землетрясений»
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және кейбір шешімдері мен «Ықтимал жер сілкіністері аймақтарында құтқару және басқа да шұғыл жұмыстарды ұйымдастыру мен жүргізу тәртібі туралы» Қазақстан Республикасы Премьер-Министрінің 2011 жылғы 7 сәуірдегі № 44-ө өкімінің күші жойылды деп тану туралы

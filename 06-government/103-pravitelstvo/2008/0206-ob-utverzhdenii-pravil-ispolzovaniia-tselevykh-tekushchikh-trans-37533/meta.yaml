act_code: '37533'
requisite: Постановление Правительства Республики Казахстан от 6 февраля 2008 года N 111
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2008 год областным бюджетам, бюджетам городов Астаны и Алматы на содержание вновь вводимых объектов социального обеспечения
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне жаңадан пайдалануға берілетін әлеуметтік қамсыздандыру объектілерін ұстауға 2008 жылға арналған республикалық бюджеттен бөлінетін ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

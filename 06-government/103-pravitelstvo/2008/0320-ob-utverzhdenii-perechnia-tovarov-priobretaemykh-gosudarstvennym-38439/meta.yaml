title:
  rus: Об утверждении перечня товаров, приобретаемых государственными предприятиями, юридическими лицами, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых принадлежат государству, и аффилиированными с ними юридическими лицами с целью их последующей переработки
  kaz: Мемлекеттік кәсіпорындар, дауыс беретін акцияларының (жарғылық капиталындағы қатысу үлестерінің) елу және одан астам проценті мемлекетке тиесілі заңды тұлғалар және олармен аффилиирленген заңды тұлғалар кейіннен қайта өңдеу мақсатында сатып алатын тауарлардың тізбесін бекіту туралы

title:
  rus: О реорганизации некоторых организаций, находящихся в ведении Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан
  kaz: Қазақстан Республикасы Әділет министрлігі Қылмыстық-атқару жүйесі комитетінің қарамағындағы кейбір ұйымдарды қайта ұйымдастыру туралы

  kaz: Қазақстан Республикасы Білім және ғылым министрлігінің "Әл-Фараби атындағы Қазақ ұлттық университеті" шаруашылық жүргізу қүқығындағы республикалық мемлекеттік кәсіпорнының "Жану проблемалары институты" шаруашылық жүргізу құқығындағы еншілес мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

  title:
    rus: Об определении уполномоченной организации, осуществляющей импорт товаров (продукции) военного назначения, товаров (продукции) двойного назначения (применения), работ военного назначения и услуг военного назначения, реализацию (в том числе экспорт), ликвидацию посредством уничтожения, утилизации, захоронения и переработку неиспользуемого имущества, за исключением боеприпасов, оказание услуг по предоставлению имущественного найма (аренды) неиспользуемых оборонных объектов, участие в международных выставках в области оборонной промышленности и их организацию на территории Республики Казахстан
    kaz: Әскери мақсаттағы тауарларды (өнімдерді), қосарланған мақсаттағы (қолданыстағы) тауарларды (өнімдерді), әскери мақсаттағы жұмыстар мен әскери мақсаттағы көрсетілетін қызметтерді импорттауды, оқ-дәрілерді қоспағанда, пайдаланылмайтын мүлікті өткізуді (оның ішінде экспорттауды), құртып жіберу, кәдеге жарату, көму арқылы жоюды және қайта өңдеуді, пайдаланылмайтын қорғаныс объектілерін мүліктік жалдауға (жалға) беру жөнінде қызметтер көрсетуді, қорғаныс өнеркәсібі саласындағы халықаралық көрмелерге қатысуды және оларды Қазақстан Республикасының аумағында ұйымдастыруды жүзеге асыратын уәкілетті ұйымды айқындау туралы
  link: https://zan.gov.kz/client/#!/doc/134356/rus

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 17 июля 2008 года № 693 "О создании специализированной организации по вопросам концессии" и от 10 декабря 2010 года № 1343 "Об утверждении Правил представления, рассмотрения и отбора концессионных проектов, проведения конкурса по выбору концессионера, проведения мониторинга и оценки реализации концессионных проектов на условиях софинансирования из бюджета, и отбора концессионных проектов для предоставления или увеличения объемов лимита поручительств государства"
    kaz: Қазақстан Республикасы Үкіметінің "Концессия мәселелері жөнінде мамандандырылған ұйым құру туралы" 2008 жылғы 17 шілдедегі № 693 және "Концессиялық жобаларды ұсыну, қарау және іріктеу, концессионерді таңдау жөніндегі конкурсты өткізу, бюджеттен қоса қаржыландыру шартымен концессиялық жобаларға мониторинг жүргізу және олардың іске асырылуын бағалау және мемлекет кепілгерліктерін беру немесе лимит көлемін ұлғайту үшін концессиялық жобаларды іріктеу қағидаларын бекіту туралы" 2010 жылғы 10 желтоқсандағы № 1343 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/65376/rus

    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 17 июля 2008 года № 693 «О создании специализированной организации по вопросам концессии» и от 26 декабря 2017 года № 875 «Об утверждении перечня проектов государственно-частного партнерства особой значимости»

act_code: '41191'
requisite: Постановление Правительства Республики Казахстан от 16 августа 2008 года N 754
title:
  rus: Об утверждении Правил субсидирования ставки вознаграждения (интереса) по лизингу сельскохозяйственной техники, перерабатывающего оборудования и специальной техники, предоставляемых лизинговыми компаниями и банками второго уровня субъектам агропромышленного комплекса
  kaz: Агроөнеркәсіптік кешен субъектілеріне лизингтік компаниялар және екінші деңгейдегі банктер ұсынатын ауыл шаруашылығы техникасы, қайта өңдейтін жабдықтар мен арнайы техникалар лизингі бойынша сыйақы (мүдде) ставкасын субсидиялау ережесін бекіту туралы

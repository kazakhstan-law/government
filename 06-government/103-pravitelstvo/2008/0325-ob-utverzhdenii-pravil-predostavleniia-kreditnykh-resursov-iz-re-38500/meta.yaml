act_code: '38500'
requisite: Постановление Правительства Республики Казахстан от 25 марта 2008 года № 284
title:
  rus: Об утверждении Правил предоставления кредитных ресурсов из республиканского бюджета на 2008 год акционерному обществу "Достык Энерго" для урегулирования задолженности акционерного общества "Западно-Казахстанская распределительная электросетевая компания" перед хозяйствующими субъектами Российской Федерации
  kaz: Ресей Федерациясының шаруашылық жүргізуші субъектілері алдындағы "Батыс Қазақстан электр тарату желісі компаниясы" акционерлік қоғамының берешегін реттеу үшін "Достық Энерго" акционерлік қоғамына 2008 жылға арналған республикалық бюджеттен кредиттік ресурстар беру ережесін бекіту туралы

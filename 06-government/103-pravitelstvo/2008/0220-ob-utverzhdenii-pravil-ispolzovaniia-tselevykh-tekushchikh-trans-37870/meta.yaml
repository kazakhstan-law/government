act_code: '37870'
requisite: Постановление Правительства Республики Казахстан от 20 февраля 2008 года N 173
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2008 года областными бюджетами, бюджетами городов Астаны и Алматы на обеспечение закладки и выращивания многолетних насаждений плодовых культур и винограда
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2008 жылдың республикалық бюджетінен жеміс дақылдары мен жүзімнің көпжылдық екпелерін отырғызуды және өсіруді қамтамасыз етуге арналған ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

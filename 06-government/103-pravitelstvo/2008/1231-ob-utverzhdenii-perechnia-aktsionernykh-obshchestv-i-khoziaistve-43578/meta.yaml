    kaz: «Нұркен Әбдіров атындағы спорт комбинаты» жауапкершілігі шектеулі серіктестігінің мемлекеттік қатысу үлесін республикалық меншіктен Қарағанды облысының коммуналдық меншігіне беру туралы

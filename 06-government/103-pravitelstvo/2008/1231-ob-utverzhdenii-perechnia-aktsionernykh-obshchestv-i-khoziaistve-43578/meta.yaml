    rus: О некоторых вопросах акционерных обществ, находящихся в ведении Министерства по чрезвычайным ситуациям Республики Казахстан
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің қарамағындағы акционерлік қоғамдардың кейбір мәселелері туралы

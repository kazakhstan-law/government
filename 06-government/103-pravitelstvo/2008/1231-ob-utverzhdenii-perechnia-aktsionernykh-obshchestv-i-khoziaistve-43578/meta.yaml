    rus: О передаче государственной доли участия товарищества с ограниченной ответственностью "Целинная машиноиспытательная станция" из республиканской собственности в коммунальную собственность Акмолинской области
    kaz: '"Тың машина сынау станциясы" жауапкершілігі шектеулі серіктестігінің мемлекеттік қатысу үлесін республикалық меншіктен Ақмола облысының коммуналдық меншігіне беру туралы'

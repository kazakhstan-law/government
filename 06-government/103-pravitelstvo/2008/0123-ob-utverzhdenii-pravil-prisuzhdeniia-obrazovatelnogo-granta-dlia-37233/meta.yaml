  code: '64420'
  requisite: Постановление Правительства Республики Казахстан от 30 марта 2012 года № 390. Утратило силу постановлением Правительства Республики Казахстан от 7 сентября 2023 года № 772 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении Правил направления специалиста на работу, возмещения расходов, понесенных за счет бюджетных средств, предоставления права самостоятельного трудоустройства, освобождения от обязанности или прекращения обязанности по отработке гражданами Республики Казахстан, обучавшимися на основе государственного образовательного заказа, и внесении изменений и дополнений в постановление Правительства Республики Казахстан от 23 января 2008 года № 58 «Об утверждении Правил присуждения образовательного гранта»
    kaz: Маманды жұмысқа жіберу, бюджет қаражаты есебінен шеккен шығыстарды өтеу, өз бетінше жұмысқа орналасу құқығын беру, мемлекеттік білім беру тапсырысы негізінде білім алған Қазақстан Республикасының азаматтарын жұмыспен өтеу жөніндегі міндетінен босату немесе олардың міндетін тоқтату қағидаларын бекіту және «Білім беру грантын беру ережесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 23 қаңтардағы № 58 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/64420/rus

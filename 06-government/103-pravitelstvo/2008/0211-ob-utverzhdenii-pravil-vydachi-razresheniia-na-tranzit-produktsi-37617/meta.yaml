  title:
    rus: Об утверждении стандартов государственных услуг, оказываемых Министерством индустрии и новых технологий Республики Казахстан в области промышленности и экспортного контроля, внесении изменений в постановления Правительства Республики Казахстан от 11 февраля 2008 года № 130 "Об утверждении Правил выдачи разрешения на транзит продукции" и от 12 марта 2008 года № 244 "Об утверждении Правил оформления гарантийных обязательств импортеров (конечных пользователей) и проверок их исполнения"
    kaz: Қазақстан Республикасы Индустрия және жаңа технологиялар министрлiгi өнеркәсiп және экспорттық бақылау саласында көрсететін мемлекеттiк қызметтер стандарттарын бекiту, Қазақстан Республикасы Үкiметiнiң "Өнiмнiң транзитiне рұқсат беру ережесiн бекiту туралы" 2008 жылғы 11 ақпандағы № 130 және "Импорттаушылардың (түпкі пайдаланушылардың) кепілдік міндеттемелерін ресімдеу және олардың орындалуын тексеру ережесін бекіту туралы" 2008 жылғы 12 наурыздағы № 244 қаулыларына өзгерiстер енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/77187/rus

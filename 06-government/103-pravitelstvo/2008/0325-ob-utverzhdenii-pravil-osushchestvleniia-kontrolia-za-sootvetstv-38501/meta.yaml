act_code: '38501'
requisite: Постановление Правительства Республики Казахстан от 25 марта 2008 года № 285
title:
  rus: Об утверждении Правил осуществления контроля за соответствием пищевой продукции в процессах (на стадиях) ее разработки (создания), производства (изготовления), оборота, утилизации и уничтожения, за соответствием процессов (стадий) разработки (создания), производства (изготовления), оборота, утилизации и уничтожения пищевой продукции требованиям, установленным законодательством Республики Казахстан о безопасности пищевой продукции
  kaz: Қазақстан Республикасының тамақ өнімдерінің қауіпсіздігі туралы заңнамасында белгіленген талаптарға тамақ өнімдерін әзірлеу (жасау), өндіру (дайындау), айналымы, кәдеге жарату және жою процестеріндегі (сатыларындағы) олардың сәйкестігін, тамақ өнімдерін әзірлеу (жасау), өндіру (дайындау), айналымы, кәдеге жарату және жою процестерінің (сатыларының) сәйкестігін бақылауды жүзеге асыру ережесін бекіту туралы

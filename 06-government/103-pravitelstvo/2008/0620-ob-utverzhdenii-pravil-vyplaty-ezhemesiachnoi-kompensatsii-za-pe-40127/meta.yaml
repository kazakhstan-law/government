act_code: '40127'
requisite: Постановление Правительства Республики Казахстан от 20 июня 2008 года № 599
title:
  rus: Об утверждении Правил выплаты ежемесячной компенсации за первое полугодие 2008 года получателям государственной базовой пенсионной выплаты, государственных базовых социальных пособий по инвалидности, по случаю потери кормильца и по возрасту, а также форм решений и выписок об их назначении
  kaz: Мемлекеттік базалық зейнетақы төлемін, мүгедектігі бойынша, асыраушысынан айырылу жағдайы бойынша және жасына байланысты берілетін мемлекеттік базалық әлеуметтік жәрдемақыларды алушыларға 2008 жылдың бірінші жарты жылдығы үшін ай сайынғы өтемақы төлеу ережесін, сондай-ақ оларды тағайындау туралы шешімдер мен үзінді көшірмелердің нысандарын бекіту туралы

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 4 февраля 2008 года № 93 "Об утверждении Правил лицензирования и квалификационных требований к деятельности по разработке, производству, ремонту, приобретению и реализации боеприпасов, вооружения и военной техники, запасных частей, комплектующих изделий и приборов к ним, а также специальных материалов и оборудования для их производства, включая монтаж, наладку, использование, хранение, ремонт и сервисное обслуживание"
    kaz: '"Оқ-дәрілерді, қару-жарақ пен әскери техниканы, олардың қосалқы бөлшектерін, жинақтаушы бұйымдары мен аспаптарын, сондай-ақ монтаждауды, реттеуді, пайдалануды, сақтауды, жөндеуді және сервистік қызмет көрсетуді қоса алғанда, оларды өндіруге арналған арнайы материалдар мен жабдықтарды әзірлеу, өндіру, жөндеу, сатып алу және сату жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 4 ақпандағы № 93 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/65874/rus

act_code: '37423'
requisite: Постановление Правительства Республики Казахстан от 4 февраля 2008 года № 93. Утратило силу постановлением Правительства Республики Казахстан от 29 мая 2013 года № 531
title:
  rus: Об утверждении квалификационных требований, предъявляемых к деятельности по разработке, производству, ремонту, приобретению и реализации боеприпасов, вооружения и военной техники, запасных частей, комплектующих изделий и приборов к ним, а также специальных материалов и оборудования для их производства, включая монтаж, наладку, модернизацию, установку, использование, хранение, ремонт и сервисное обслуживание
  kaz: Монтаждауды, реттеуді, жаңартуды, орнатуды, пайдалануды, сақтауды, жөндеуді және сервистік қызмет көрсетуді қоса алғанда, оқ-дәрілерді, қару-жарақ пен әскери техниканы, олардың қосалқы бөлшектерін, жинақтаушы бұйымдары мен аспаптарын, сондай-ақ оларды өндіруге арналған арнайы материалдар мен жабдықтарды әзірлеу, өндіру, жөндеу, алу және өткізу жөніндегі қызметке қойылатын біліктілік талаптарын бекіту туралы

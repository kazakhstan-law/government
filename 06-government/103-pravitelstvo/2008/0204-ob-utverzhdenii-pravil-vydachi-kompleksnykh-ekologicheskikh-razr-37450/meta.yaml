act_code: '37450'
requisite: Постановление Правительства Республики Казахстан от 4 февраля 2008 года № 95. Утратило силу постановлением Правительства Республики Казахстан от 23 июня 2015 года № 475
title:
  rus: Об утверждении Правил выдачи комплексных экологических разрешений и перечня типов промышленных объектов, для которых возможно получение комплексных экологических разрешений вместо разрешений на эмиссии в окружающую среду
  kaz: Кешенді экологиялық рұқсаттар беру ережесін және қоршаған ортаға эмиссияларға рұқсаттардың орнына кешенді экологиялық рұқсаттар алу мүмкін болатын өнеркәсіп объектілері үлгілерінің тізбесін бекіту туралы

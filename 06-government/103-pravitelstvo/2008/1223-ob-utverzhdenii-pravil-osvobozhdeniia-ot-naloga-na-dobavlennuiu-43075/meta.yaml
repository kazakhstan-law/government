  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 23 декабря 2008 года № 1229 "Об утверждении Правил освобождения от налога на добавленную стоимость импорта товаров" и от 19 августа 2010 года № 824 "Об утверждении Правил освобождения от налога на добавленную стоимость импорта товаров в таможенном союзе и внесении изменений и дополнений в постановления Правительства Республики Казахстан от 23 декабря 2008 года № 1229 и от 26 января 2009 года № 56"
    kaz: Қазақстан Республикасы Үкіметінің "Тауарлар импортын қосылған құн салығынан босату ережесін бекіту туралы" 2008 жылғы 23 желтоқсандағы № 1229 және "Кеден одағында тауарлар импортын қосылған құн салығынан босату ережесін бекіту және Қазақстан Республикасы Үкіметінің 2008 жылғы 23 желтоқсандағы № 1229 және 2009 жылғы 26 қаңтардағы № 56 қаулыларына өзгерістер мен толықтырулар енгізу туралы" 2010 жылғы 19 тамыздағы № 824 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/62749/rus

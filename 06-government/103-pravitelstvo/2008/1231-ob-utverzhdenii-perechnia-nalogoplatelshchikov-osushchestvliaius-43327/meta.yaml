act_code: '43327'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2008 года № 1326. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2018 года № 922 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня налогоплательщиков, осуществляющих на территории Республики Казахстан деятельность в рамках контракта на недропользование, в соответствии с условиями которого освобождаются от налога на добавленную стоимость импортируемые товары
  kaz: Қазақстан Республикасының аумағында жер қойнауын пайдалану келісім-шарты шеңберінде қызметін жүзеге асыратын, сол келісім-шарттың талаптарына сәйкес импортталатын тауарлары қосылған құн салығынан босатылатын салық төлеушілердің тізбесін бекіту туралы

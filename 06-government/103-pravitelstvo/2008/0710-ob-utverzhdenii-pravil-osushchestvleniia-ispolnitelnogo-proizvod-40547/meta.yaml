act_code: '40547'
requisite: Постановление Правительства Республики Казахстан от 10 июля 2008 года № 678. Утратило силу постановлением Правительства Республики Казахстан от 2 апреля 2015 года № 180
title:
  rus: Об утверждении Правил осуществления исполнительного производства по взысканию с государства сумм капитализации соответствующих повременных платежей по возмещению вреда, причиненного жизни и здоровью работников, в случае отсутствия или недостаточности имущества у ликвидируемого юридического лица, признанного в установленном порядке ответственным за данный вред
  kaz: Қызметкерлердің өмірі мен денсаулығына келтірілген зиян үшін белгіленген тәртіппен жауапты деп танылған, таратылатын заңды тұлғаның мүлкі жоқ немесе жеткіліксіз болған жағдайда, осы зиянды өтеу жөніндегі тиісті мерзімдік төлемдерді капиталдандыру сомасын мемлекеттен өндіріп алу жөніндегі атқарушылық іс жүргізуді жүзеге асыру ережесін бекіту туралы

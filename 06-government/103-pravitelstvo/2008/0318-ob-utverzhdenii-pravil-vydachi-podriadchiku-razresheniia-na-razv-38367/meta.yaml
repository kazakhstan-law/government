act_code: '38367'
requisite: Постановление Правительства Республики Казахстан от 18 марта 2008 года № 261. Утратило силу постановлением Правительства Республики Казахстан от 31 декабря 2010 года № 1521
title:
  rus: Об утверждении Правил выдачи подрядчику разрешения на разведку и добычу производственно-технических подземных вод в объемах две тысячи и более кубических метров в сутки для их закачки в пласт в соответствии с технологической схемой добычи полезного ископаемого в Республике Казахстан
  kaz: Мердігерге Қазақстан Республикасында пайдалы қазбаны өндірудің технологиялық схемасына сәйкес жер қабатына айдау үшін тәулігіне екі мың және одан да астам текше метр көлеміндегі өндірістік-техникалық жерасты суларын барлауға және өндіруге рұқсат беру ережесін бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 7 февраля 2008 года № 116 «Об утверждении Правил назначения, выплаты и размеров государственных стипендий обучающимся в организациях образования» и от 12 марта 2012 года № 320 «Об утверждении размеров, источников, видов и Правил предоставления социальной помощи гражданам, которым оказывается социальная помощь»
    kaz: Қазақстан Республикасы Үкіметінің «Білім беру ұйымдарында білім алушыларға мемлекеттік стипендияларды тағайындау, төлеу қағидаларын және олардың мөлшерлерін бекіту туралы» 2008 жылғы 7 ақпандағы № 116 және «Әлеуметтік көмек көрсетілетін азаматтарға әлеуметтік көмектің мөлшерін, көздерін, түрлерін және оны беру қағидаларын бекіту туралы» 2012 жылғы 12 наурыздағы № 320 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/136175/rus

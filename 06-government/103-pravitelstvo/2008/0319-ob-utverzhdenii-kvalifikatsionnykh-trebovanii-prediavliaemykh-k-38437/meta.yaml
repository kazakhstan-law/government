  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 19 марта 2008 года № 270 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к лицензируемым видам деятельности в сфере использования атомной энергии"
    kaz: '"Атом энергиясын пайдалану саласындағы лицензияланатын қызмет түрлерін лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 19 наурыздағы № 270 қаулысына өзгерістер мен толықтырулар енгізу туралы'

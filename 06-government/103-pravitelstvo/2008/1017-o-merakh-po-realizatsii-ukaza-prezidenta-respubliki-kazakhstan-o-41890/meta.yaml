  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 17 октября 2008 года № 962 «О мерах по реализации Указа Президента Республики Казахстан от 13 октября 2008 года № 669» и от 25 мая 2013 года № 516 «О мерах по реализации Указа Президента Республики Казахстан от 22 мая 2013 года № 571 «О некоторых мерах по оптимизации системы управления институтами развития, финансовыми организациями и развития национальной экономики»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Президентінің 2008 жылғы 13 қазандағы № 669 Жарлығын іске асыру жөніндегі шаралар туралы» 2008 жылғы 17 қазандағы № 962 және «Даму институттарын, қаржы ұйымдарын басқару жүйесін оңтайландыру және ұлттық экономиканы дамыту жөніндегі кейбір шаралар туралы» Қазақстан Республикасы Президентінің 2013 жылғы 22 мамырдағы № 571 Жарлығын іске асыру жөніндегі шаралар туралы» 2013 жылғы 25 мамырдағы № 516 қаулыларына өзгерістер енгізу туралы

  requisite: Постановление Правительства Республики Казахстан от 26 февраля 2010 года № 139
  title:
    rus: О передаче и переименовании государственного учреждения "Байконырбаланс" Национального космического агентства Республики Казахстан из ведения Национального космического агентства Республики Казахстан в ведение Министерства финансов Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық ғарыш агенттігінің «Байқоңырбаланс» мемлекеттік мекемесін Қазақстан Республикасы Ұлттық ғарыш агенттігінің қарамағынан Қазақстан Республикасы Қаржы министрлігінің қарамағына беру және қайта атау туралы

    kaz: «Қазақстан Республикасы Қаржы министрлігі «Байқоңырбаланс» мемлекеттік мекемесінің кейбір мәселелері және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтыру енгізу туралы

  code: '49985'
  requisite: Постановление Правительства Республики Казахстан от 15 января 2010 года № 11
  title:
    rus: О передаче государственных учреждений - центров обслуживания населения Комитета регистрационной службы и оказания правовой помощи Министерства юстиции Республики Казахстан в ведение местных исполнительных органов
    kaz: Қазақстан Республикасы Әділет министрлігі Тіркеу қызметі және құқықтық көмек көрсету комитетінің халыққа қызмет көрсету орталықтары — мемлекеттік мекемелерін жергілікті атқарушы органдардың қарамағына беру туралы

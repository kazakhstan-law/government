  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 15 апреля 2008 года № 339 «Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений»
    kaz: «Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 15 сәуірдегі № 339 қаулысына өзгерістер мен толықтыру енгізу туралы

  requisite: Постановление Правительства Республики Казахстан от 15 июля 2011 года № 811
  title:
    rus: О корректировке показателей республиканского бюджета на 2011 год и о внесении изменений в постановление Правительства Республики Казахстан от 15 апреля 2008 года № 339 "Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений"
    kaz: 2011 жылға арналған республикалық бюджет көрсеткiштерiн түзету және "Министрлiктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттiк мекемелердегi адам санын ескере отырып, штат санының лимиттерiн бекiту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 15 сәуірдегі № 339 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/59785/rus

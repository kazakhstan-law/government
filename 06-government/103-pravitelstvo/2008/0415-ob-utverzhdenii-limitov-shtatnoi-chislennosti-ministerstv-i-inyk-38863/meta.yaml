  code: '115201'
  requisite: Постановление Правительства Республики Казахстан от 11 октября 2017 года № 635
  title:
    rus: О некоторых вопросах Министерства внутренних дел Республики Казахстан и внесении изменений в постановление Правительства Республики Казахстан от 15 апреля 2008 года № 339 «Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений»
    kaz: Қазақстан Республикасы Ішкі істер министрлігінің кейбір мәселелері және «Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 15 сәуірдегі № 339 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/115201/rus

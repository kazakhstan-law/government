  requisite: Постановление Правительства Республики Казахстан от 31 июля 2019 года № 563
  title:
    rus: О реорганизации республиканского государственного предприятия на праве хозяйственного ведения «Казахский научный центр карантинных и зоонозных инфекций имени Масгута Айкимбаева» Министерства здравоохранения Республики Казахстан
    kaz: Қазақстан Республикасы Денсаулық сақтау министрлігінің «Масғұт Айқымбаев атындағы Қазақ карантиндік және зооноздық инфекциялар ғылыми орталығы» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

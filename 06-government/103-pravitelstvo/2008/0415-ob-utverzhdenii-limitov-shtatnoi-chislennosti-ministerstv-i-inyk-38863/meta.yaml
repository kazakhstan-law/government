  code: '80107'
  requisite: Постановление Правительства Республики Казахстан от 21 мая 2014 года № 528
  title:
    rus: О переименовании государственного учреждения "Курсы повышения квалификации кадров Министерства труда и социальной защиты населения Республики Казахстан" и внесении изменений и дополнения в некоторые решения Правительства Республики Казахстан
    kaz: '"Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің Кадрлардың біліктілігін арттыру курсы" мемлекеттік мекемесін қайта атау және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтыру енгізу туралы'

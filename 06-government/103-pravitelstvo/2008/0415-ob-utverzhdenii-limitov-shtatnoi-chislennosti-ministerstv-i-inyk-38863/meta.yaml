  code: '60402'
  requisite: Постановление Правительства Республики Казахстан от 8 сентября 2011 года № 1029
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 15 декабря 2004 года № 1324 "О некоторых вопросах утверждения лимитов штатной численности местных исполнительных органов" и от 15 апреля 2008 года № 339 "Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений"
    kaz: Қазақстан Республикасы Үкіметінің "Жергілікті атқарушы органдардың штат санының лимиттерін бекітудің кейбір мәселелері туралы" 2004 жылғы 15 желтоқсандағы № 1324 және "Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы" 2008 жылғы 15 сәуірдегі № 339 қаулыларына өзгерістер енгізу туралы

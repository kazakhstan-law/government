  requisite: Постановление Правительства Республики Казахстан от 30 октября 2020 года № 728
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 15 апреля 2008 года № 339 «Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений» и от 18 февраля 2020 года № 67 «О реализации Указа Президента Республики Казахстан от 12 февраля 2020 года № 266 «Об увольнении в запас военнослужащих срочной воинской службы, выслуживших установленный срок воинской службы, в марте – июне и сентябре – декабре 2020 года, а также очередном призыве граждан Республики Казахстан на срочную воинскую службу в марте – августе и сентябре – декабре 2020 года»
    kaz: Қазақстан Республикасы Үкіметінің «Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы» 2008 жылғы 15 сәуірдегі № 339 және «Әскери қызметтің белгіленген мерзімін өткерген мерзімді әскери қызметтегі әскери қызметшілерді 2020 жылдың наурыз – маусымында және қыркүйек – желтоқсанында запасқа шығару, сондай-ақ Қазақстан Республикасының азаматтарын 2020 жылдың наурыз – тамызында және қыркүйек – желтоқсанында мерзімді әскери қызметке кезекті шақыру туралы» Қазақстан Республикасы Президентінің 2020 жылғы 12 ақпандағы № 266 Жарлығын іске асыру туралы» 2020 жылғы 18 ақпандағы № 67 қаулыларына өзгерістер енгізу туралы

    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігі Инвестиция комитетінің аумақтық департаменті – «Бурабай» арнайы экономикалық аймағының әкімшілігі» мемлекеттік мекемесін тарату туралы

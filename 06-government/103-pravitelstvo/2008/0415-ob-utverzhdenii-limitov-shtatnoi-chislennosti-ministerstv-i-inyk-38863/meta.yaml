    kaz: Кейбір республикалық мемлекеттік мекемелерді, республикалық мемлекеттік қазыналық кәсіпорындарды қайта ұйымдастыру және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

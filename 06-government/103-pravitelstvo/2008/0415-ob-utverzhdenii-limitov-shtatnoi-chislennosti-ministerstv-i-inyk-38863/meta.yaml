  title:
    rus: О создании некоммерческого акционерного общества «Центр Н. Назарбаева по развитию межконфессионального и межцивилизационного диалога» и реорганизации отдельных подведомственных организаций Министерства информации и общественного развития Республики Казахстан
    kaz: «Конфессияаралық және өркениетаралық диалогты дамыту жөніндегі Н. Назарбаев орталығы» коммерциялық емес акционерлік қоғамын құру және Қазақстан Республикасы Ақпарат және қоғамдық даму министрлігінің жекелеген ведомстволық бағынысты ұйымдарын қайта ұйымдастыру туралы

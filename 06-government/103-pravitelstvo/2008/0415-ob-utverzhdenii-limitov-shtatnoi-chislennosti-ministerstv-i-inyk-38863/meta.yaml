  title:
    rus: О ликвидации государственных учреждений "Центр реабилитации 1" и "Центр реабилитации 2" Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан
    kaz: Қазақстан Республикасы Әділет министрлігі Қылмыстық-атқару жүйесі комитетінің "Оңалту орталығы 1" және "Оңалту орталығы 2" мемлекеттік мекемелерін тарату туралы

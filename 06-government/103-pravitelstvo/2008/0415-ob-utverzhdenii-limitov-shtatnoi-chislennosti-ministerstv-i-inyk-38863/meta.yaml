  title:
    rus: О ликвидации Республиканского государственного казенного предприятия "Курсы повышения квалификации кадров Министерства труда и социальной защиты населения Республики Казахстан" и создании государственного учреждения "Курсы повышения квалификации кадров Министерства труда и социальной защиты населения Республики Казахстан"
    kaz: «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің кадрлардың біліктілігін арттыру курсы» республикалық мемлекеттік қазыналық кәсіпорнын тарату және «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің Кадрлардың біліктілігін арттыру курсы» мемлекеттік мекемесін құру туралы

  code: '73067'
  requisite: Постановление Правительства Республики Казахстан от 19 июня 2013 года № 630
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 15 апреля 2008 года № 339 "Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений" и от 19 мая 2012 года № 643 дсп "Об утверждении перечня должностей органов внутренних дел, уголовно-исполнительной системы, государственной противопожарной службы и таможенных органов Республики Казахстан, которым присваиваются специальные звания и соответствующие им предельные специальные звания"
    kaz: Қазақстан Республикасы Үкіметінің "Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы" 2008 жылғы 15 сәуірдегі № 339 және "Арнаулы атақтар мен оларға сәйкес келетін шекті арнаулы атақтар берілетін Қазақстан Республикасы ішкі істер органдары, қылмыстық-атқару жүйесі, мемлекеттік өртке қарсы қызметі және кеден органдары лауазымдарының тізбесін бекіту туралы" 2012 жылғы 19 мамырдағы № 643 қпү қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/73067/rus

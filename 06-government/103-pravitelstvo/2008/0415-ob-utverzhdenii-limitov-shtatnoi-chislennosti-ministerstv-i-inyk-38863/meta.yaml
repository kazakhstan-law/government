    kaz: Қазақстан Республикасы Денсаулық сақтау министрлігінің "С.Ж. Асфендияров атындағы Қазақ ұлттық медицина университеті" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

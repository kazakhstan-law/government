  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 15 апреля 2008 года № 339 «Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений» и от 26 декабря 2015 года № 1081дсп «О некоторых вопросах Министерства по делам государственной службы Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағыжәне оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы» 2008 жылғы 15 сәуірдегі № 339 және «Қазақстан Республикасының Мемлекеттік қызмет істері министрлігінің кейбір мәселелері туралы» 2015 жылғы 26 желтоқсандағы № 1081қпү қаулыларына өзгерістер мен толықтырулар енгізу туралы

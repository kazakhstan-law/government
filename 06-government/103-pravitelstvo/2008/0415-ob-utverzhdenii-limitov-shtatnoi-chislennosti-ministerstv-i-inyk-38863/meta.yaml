  title:
    rus: О ликвидации республиканского государственного учреждения "Дом дружбы - Центр межэтнических отношений" Министерства культуры и спорта Республики Казахстан и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Мәдениет және спорт министрлігінің "Достық үйі – Этносаралық қатынастар орталығы" республикалық мемлекеттік мекемесін тарату және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

  code: '160101'
  requisite: Постановление Правительства Республики Казахстан от 9 ноября 2021 года № 796
  title:
    rus: О переименовании республиканского государственного учреждения «Республиканский центр «Дошкольное детство» Министерства образования и науки Республики Казахстан и внесении изменений в некоторые решения Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Білім және ғылым министрлігінің «Мектепке дейінгі балалық шақ» республикалық орталығы» республикалық мемлекеттік мекемесінің атауын өзгерту және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер енгізу туралы

  code: '111534'
  requisite: Постановление Правительства Республики Казахстан от 25 апреля 2017 года № 223
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 15 апреля 2008 года № 339 «Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений» и от 15 ноября 2016 года № 704 «Некоторые вопросы Министерства оборонной и аэрокосмической промышленности Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы» 2008 жылғы 15 сәуірдегі № 339 және «Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің кейбір мәселелері» туралы 2016 жылғы 15 қарашадағы № 704 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/111534/rus

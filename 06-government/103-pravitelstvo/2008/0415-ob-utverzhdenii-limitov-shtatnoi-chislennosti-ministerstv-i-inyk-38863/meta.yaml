    kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман және аңшылық шаруашылығы комитетінің "Ақжайық" мемлекеттік табиғи резерваты" мемлекеттік мекемесін құрудың кейбір мәселелері туралы

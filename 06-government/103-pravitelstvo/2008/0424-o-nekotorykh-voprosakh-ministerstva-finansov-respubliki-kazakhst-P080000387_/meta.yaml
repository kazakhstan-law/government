  requisite: Постановление Правительства Республики Казахстан от 28 мая 2014 года № 563
  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 7 октября 2011 года № 1151 "Некоторые вопросы объектов, подлежащих государственной охране" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: '"Мемлекеттік күзетілуі тиіс объектілердің кейбір мәселелері" туралы Қазақстан Республикасы Үкіметінің 2011 жылғы 7 қазандағы № 1151 қаулысына өзгеріс енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы'

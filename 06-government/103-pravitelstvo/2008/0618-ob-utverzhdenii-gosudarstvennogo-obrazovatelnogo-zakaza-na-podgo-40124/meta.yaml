act_code: '40124'
requisite: Постановление Правительства Республики Казахстан от 18 июня 2008 года № 591
title:
  rus: Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным образованием в организациях образования, финансируемых из республиканского бюджета (за исключением подготовки специалистов в организациях образования Комитета национальной безопасности Республики Казахстан) на 2008/2009 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасының Ұлттық қауіпсіздік комитетінің білім беру ұйымдарында мамандар даярлауды қоспағанда) жоғарғы және жоғарғы оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік білімі бар мамандар даярлауға 2008/2009 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы

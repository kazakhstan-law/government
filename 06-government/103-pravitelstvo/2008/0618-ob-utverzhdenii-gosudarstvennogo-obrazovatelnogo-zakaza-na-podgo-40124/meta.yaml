  title:
    rus: О переименовании государственного учреждения "Высшее военное училище внутренних войск Министерства внутренних дел Республики Казахстан"
    kaz: '"Қазақстан Республикасы Ішкі істер министрлігі Ішкі әскерлерінің жоғары әскери училищесі" мемлекеттік мекемесін қайта атау туралы'

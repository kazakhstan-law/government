  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 31 декабря 2008 года № 1339 "Об утверждении перечня уполномоченных органов, ответственных за взимание поступлений в республиканский бюджет, за возврат из бюджета и (или) зачет излишне (ошибочно) уплаченных сумм и осуществляющих контроль за поступлениями в бюджет неналоговых поступлений, поступлений от продажи основного капитала, трансфертов, сумм погашения бюджетных кредитов, от продажи финансовых активов государства, займов"
    kaz: '"Республикалық бюджетке түсетін түсімдердің алынуына, артық (қате) төленген соманың бюджеттен қайтарылуына және (немесе) есепке алынуына және салықтық емес түсімдердің, негізгі капиталды сатудан түсетін түсімдердің, трансферттердің, бюджеттік кредиттерді өтеу, мемлекеттің қаржы активтерін сатудан түсетін соманың, қарыздардың бюджетке түсуін бақылауды жүзеге асыруға жауапты уәкілетті органдардың тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2008 жылғы 31 желтоқсандағы № 1339 қаулысына өзгеріс пен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/73053/rus

  title:
    rus: Об утверждении норматива отчисления части чистого дохода республиканских государственных предприятий и внесении изменения в постановление Правительства Республики Казахстан от 31 декабря 2008 года № 1339 "Об утверждении перечня уполномоченных органов, ответственных за взимание поступлений в республиканский бюджет, за возврат из бюджета и (или) зачет излишне (ошибочно) уплаченных сумм и осуществляющих контроль за поступлениями в бюджет неналоговых поступлений, поступлений от продажи основного капитала, трансфертов, сумм погашения бюджетных кредитов, от продажи финансовых активов государства, займов"
    kaz: Республикалық мемлекеттік кәсiпорындардың таза табысының бір бөлігін аудару нормативін бекіту және "Республикалық бюджетке түсетiн түсiмдердiң алынуына, артық (қате) төленген соманың бюджеттен қайтарылуына және (немесе) есепке алынуына және салықтық емес түсiмдердiң, негiзгi капиталды сатудан түсетiн түсiмдердiң, трансферттердiң, бюджеттiк кредиттердi өтеу, мемлекеттiң қаржы активтерiн сатудан түсетiн соманың, қарыздардың бюджетке түсуiн бақылауды жүзеге асыруға жауапты уәкiлеттi органдардың тiзбесiн бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2008 жылғы 31 желтоқсандағы № 1339 қаулысына өзгеріс енгізу туралы

  kaz: Қазақстан Республикасы Ақпараттандыру және байланыс агенттігінің "Телекоммуникация саласындағы техникалық сүйемелдеу және талдау орталығы" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнын құру туралы

  requisite: Постановление Правительства Республики Казахстан от 17 октября 2012 года № 1320. Утратил силу постановлением Правительства Республики Казахстан от 14 июля 2023 года № 592 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 5 февраля 2008 года № 104 "Об утверждении номенклатуры (списка) продукции, подлежащей экспортному контролю" и от 12 июня 2008 года № 578 "Об утверждении Правил лицензирования экспорта и импорта товаров, в том числе продукции, подлежащей экспортному контролю, а также деятельности при автоматическом лицензировании импорта отдельных товаров, квалификационных требований, предъявляемых к деятельности по лицензированию и перечня товаров, экспорт и импорт которых подлежат лицензированию"
    kaz: Қазақстан Республикасы Үкіметінің "Экспорттық бақылауға жататын өнімнің номенклатурасын (тізімін) бекіту туралы" 2008 жылғы 5 ақпандағы № 104 және "Тауарлардың, оның ішінде экспорттық бақылауға жататын өнімнің, экспорты мен импортын, сондай-ақ жекелеген тауарлардың импортын автоматты түрде лицензиялау кезіндегі қызметті лицензиялау ережесін, лицензиялау жөніндегі қызметке қойылатын біліктілік талаптарын және экспорты мен импорты лицензиялануға тиіс тауарлардың тізбесін бекіту туралы" 2008 жылғы 12 маусымдағы № 578 қаулыларына өзгерістер мен толықтырулар енгізу туралы"
  link: https://zan.gov.kz/client/#!/doc/68138/rus

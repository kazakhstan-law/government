  title:
    rus: О некоторых вопросах создания государственного учреждения "Государственный природный резерват "Акжайык" Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан
    kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман және аңшылық шаруашылығы комитетінің "Ақжайық" мемлекеттік табиғи резерваты" мемлекеттік мекемесін құрудың кейбір мәселелері туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 28 октября 2004 года № 1118 «Вопросы Министерства иностранных дел Республики Казахстан» и от 6 февраля 2008 года № 108 «О возмещении государственным служащим расходов на служебные заграничные командировки за счет средств республиканского и местных бюджетов»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Сыртқы істер министрлігінің мәселелері» туралы 2004 жылғы 28 қазандағы № 1118 және «Мемлекеттік қызметшілерге республикалық және жергілікті бюджеттер қаражаты есебінен қызметтік шетелдік іссапарларға арналған шығыстарды өтеу туралы» 2008 жылғы 6 ақпандағы № 108 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/107775/rus

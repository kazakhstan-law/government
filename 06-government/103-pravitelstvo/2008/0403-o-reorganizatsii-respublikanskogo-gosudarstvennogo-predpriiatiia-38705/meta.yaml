title:
  rus: О реорганизации Республиканского государственного предприятия на праве хозяйственного ведения "Казахский государственный научно-исследовательский и проектно-изыскательский институт Водоканалпроект" Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и торговли Республики Казахстан
  kaz: Қазақстан Республикасы Индустрия және сауда министрлігі Құрылыс және тұрғын-үй коммуналдық шаруашылық істері комитетінің "Суарнажоба" Қазақ мемлекеттік ғылыми-зерттеу және жобалау-іздестіру институты" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

  requisite: Постановление Правительства Республики Казахстан от 10 августа 2023 года № 661
  title:
    rus: О признании утратившими силу постановления Правительства Республики Казахстан от 2 июля 2004 года № 730 «Вопросы государственного мониторинга собственности в отраслях экономики, имеющих стратегическое значение» и пункта 6 изменений, которые вносятся в некоторые решения Правительства Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 24 апреля 2008 года № 387 «О некоторых вопросах Министерства финансов Республики Казахстан»
    kaz: «Экономиканың стратегиялық маңызы бар салаларындағы меншіктің мемлекеттік мониторингі мәселелерi» туралы Қазақстан Республикасы Үкіметінің 2004 жылғы 2 шілдедегі № 730 қаулысының және «Қазақстан Республикасы Қаржы министрлiгiнiң кейбiр мәселелерi туралы» Қазақстан Республикасы Үкіметінің 2008 жылғы 24 сәуірдегі № 387 қаулысымен бекітілген Қазақстан Республикасы Үкіметінің кейбір шешімдеріне енгізілетін өзгерістердің 6-тармағының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/184900/rus

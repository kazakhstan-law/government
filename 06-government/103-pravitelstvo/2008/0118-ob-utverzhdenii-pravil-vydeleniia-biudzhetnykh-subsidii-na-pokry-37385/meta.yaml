act_code: '37385'
requisite: Постановление Правительства Республики Казахстан от 18 января 2008 года № 27. Утратило силу постановлением Правительства Республики Казахстан от 27 октября 2011 года № 1211
title:
  rus: Об утверждении Правил выделения бюджетных субсидий на покрытие убытков, связанных с предоставлением услуг по обеспечению доступности театральных, концертных и культурно-досуговых мероприятий для населения, пропагандой классического, народного, музыкального и хореографического искусства
  kaz: Тұрғындар үшін театр, концерттік және мәдени-демалыс іс-шараларына қол жетімділікті қамтамасыз ету жөніндегі қызметтерді көрсетуге, классикалық, халықтық, музыкалық және хореографиялық өнерді насихаттауға байланысты шығындарды жабуға бюджеттік субсидиялар бөлу ережесін бекіту туралы

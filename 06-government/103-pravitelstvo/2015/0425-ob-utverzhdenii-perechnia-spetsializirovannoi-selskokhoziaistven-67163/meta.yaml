act_code: '67163'
requisite: Постановление Правительства Республики Казахстан от 25 апреля 2015 года № 316. Утратило силу постановлением Правительства Республики Казахстан от 15 марта 2019 года № 110 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня специализированной сельскохозяйственной техники, по которым юридические лица – производители сельскохозяйственной продукции, продукции аквакультуры (рыбоводства), а также глава и (или) члены крестьянского или фермерского хозяйства по используемой в процессе собственного производства сельскохозяйственной продукции не являются плательщиками налога на транспортные средства
  kaz: Ауыл шаруашылығы өнімін, акваөсіру (балық өсіру шаруашылығы) өнімін өндіруші заңды тұлғалар, сондай-ақ өзінің өндіру процесінде ауыл шаруашылығы өнімін пайдалану бойынша шаруа немесе фермер қожалығының басшысы және (немесе) мүшелері көлік құралдарына салық төлеуші болып табылмайтын мамандандырылған ауыл шаруашылығы техникаларының тізбесін бекіту туралы

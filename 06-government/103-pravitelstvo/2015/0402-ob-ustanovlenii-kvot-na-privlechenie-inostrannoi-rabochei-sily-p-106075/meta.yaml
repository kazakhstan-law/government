act_code: '106075'
requisite: Постановление Правительства Республики Казахстан от 2 апреля 2015 года № 183
title:
  rus: Об установлении квот на привлечение иностранной рабочей силы по приоритетным проектам «Строительство нитки «С» газопровода «Казахстан – Китай», «Строительство линейной части газопровода «Бейнеу – Бозой – Шымкент», «Строительство второй и третьей очереди Жанажольского газоперерабатывающего завода» и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы по приоритетным проектам «Строительство нитки «С» газопровода «Казахстан – Китай», «Строительство линейной части газопровода «Бейнеу – Бозой – Шымкент», «Строительство второй и третьей очереди Жанажольского газоперерабатывающего завода»
  kaz: «Қазақстан – Қытай» газ құбырының «С» желісін салу», «Бейнеу – Бозой – Шымкент» газ құбырының желілік бөлігін салу», «Жаңажол газ өңдеу зауытының екінші және үшінші кезегін салу» басым жобалары бойынша шетелдік жұмыс күшін тартуға квоталар белгілеу және «Қазақстан-Қытай» газ құбырының «С» желісін салу», «Бейнеу – Бозой – Шымкент» газ құбырының желілік бөлігін салу», «Жаңажол газ өңдеу зауытының екінші және үшінші кезегін салу» басым жобалары бойынша шетелдік жұмыс күшін тартуға рұқсаттар беру шарттарын бекіту туралы

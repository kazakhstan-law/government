    kaz: «Қазақстан – Қытай» газ құбырының «С» желісін салу», «Бейнеу – Бозой – Шымкент» газ құбырының желілік бөлігін салу», «Жаңажол газ өңдеу зауытының екінші және үшінші кезегін салу» басым жобалары бойынша шетелдік жұмыс күшін тартуға арналған квоталарды белгілеу туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 2 сәуірдегі № 183 қаулысына өзгерістер мен толықтыру енгізу туралы

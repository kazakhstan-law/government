act_code: '86908'
requisite: Постановление Правительства Республики Казахстан от 19 февраля 2015 года № 81
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областными бюджетами, бюджетами городов Астаны и Алматы на проведение мероприятий, посвященных семидесятилетию Победы в Великой Отечественной войне
  kaz: Ұлы Отан соғысындағы Жеңістің жетпіс жылдығына арналған іс-шараларды өткізуге берілетін ағымдағы нысаналы трансферттерді облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің пайдалану қағидаларын бекіту туралы

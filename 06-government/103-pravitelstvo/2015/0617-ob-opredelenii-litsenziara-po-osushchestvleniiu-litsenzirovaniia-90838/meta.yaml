title:
  rus: Об определении лицензиара по осуществлению лицензирования деятельности по разработке, производству, приобретению, реализации, хранению взрывчатых и пиротехнических (за исключением гражданских) веществ и изделий с их применением
  kaz: Жарылғыш және пиротехникалық заттар мен олар қолданылып жасалған бұйымдарды (азаматтықты қоспағанда) әзірлеу, өндіру, сатып алу, өткізу, сақтау жөніндегі қызметті лицензиялауды жүзеге асыру бойынша лицензиарды айқындау туралы

act_code: '89407'
requisite: Постановление Правительства Республики Казахстан от 21 апреля 2015 года № 247
title:
  rus: Об условиях кредитования областных бюджетов, бюджетов городов Астаны и Алматы на реконструкцию и строительство систем тепло-, водоснабжения и водоотведения на 2015 год с последующим кредитованием субъектов, оказывающих услуги по тепло-, водоснабжению и водоотведению
  kaz: Кейіннен жылумен, сумен жабдықтау және су бұру қызметтерін көрсететін субъектілерге кредит бере отырып, облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне жылумен, сумен жабдықтау және су бұру жүйелерін реконструкциялауға және салуға кредит берудің 2015 жылға арналған шарттары туралы

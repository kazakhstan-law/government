act_code: '92100'
requisite: Постановление Правительства Республики Казахстан от 27 июля 2015 года № 589
title:
  rus: Об определении лицензиара в сферах обеспечения информационной безопасности, специальных технических средств, предназначенных для проведения оперативно-розыскных мероприятий, и органа, уполномоченного на выдачу разрешения второй категории в области криптографической защиты информации
  kaz: Ақпараттық қауіпсіздікті қамтамасыз ету, жедел-іздестіру іс-шараларын жүргізуге арналған арнайы техникалық құралдар салаларындағы лицензиарды және ақпаратты криптографиялық қорғау саласында екінші санаттағы рұқсат беруге уәкілетті органды айқындау туралы

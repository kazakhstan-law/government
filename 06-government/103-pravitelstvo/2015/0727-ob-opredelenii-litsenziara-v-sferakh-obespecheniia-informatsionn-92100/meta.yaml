    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетін лицензиар етіп айқындау туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 27 шілдедегі № 589 қаулысына өзгерістер енгізу туралы

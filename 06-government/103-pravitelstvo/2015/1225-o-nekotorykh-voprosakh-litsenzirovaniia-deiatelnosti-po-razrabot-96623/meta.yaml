act_code: '96623'
requisite: Постановление Правительства Республики Казахстан от 25 декабря 2015 года № 1060
title:
  rus: О некоторых вопросах лицензирования деятельности по разработке, производству, ремонту, приобретению и реализации боеприпасов, вооружения и военной техники, запасных частей, комплектующих изделий и приборов к ним, а также специальных материалов и оборудования для их производства, включая монтаж, наладку, модернизацию, установку, использование, хранение, ремонт и сервисное обслуживание
  kaz: Монтаждауды, реттеуді, жаңғыртуды, орнатуды, пайдалануды, сақтауды, жөндеуді және сервистік қызмет көрсетуді қоса алғанда, оқ-дәрілерді, қару-жарақ пен әскери техниканы, олардың қосалқы бөлшектерін, жиынтықтаушы бұйымдары мен аспаптарын, сондай-ақ оларды өндіруге арналған арнайы материалдар мен жабдықтарды әзірлеу, өндіру, жөндеу, алу және өткізу жөніндегі қызметті лицензиялаудың кейбір мәселелері туралы

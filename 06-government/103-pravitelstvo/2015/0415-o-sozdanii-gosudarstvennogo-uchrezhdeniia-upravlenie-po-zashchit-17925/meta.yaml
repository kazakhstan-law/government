act_code: '17925'
requisite: Постановление Правительства Республики Казахстан от 15 апреля 2015 года № 237
title:
  rus: О создании государственного учреждения «Управление по защите прав потребителей Наурызбайского района города Алматы Департамента по защите прав потребителей города Алматы Комитета по защите прав потребителей Министерства национальной экономики Республики Казахстан»
  kaz: «Қазақстан Республикасы Ұлттық экономика министрлігінің Тұтынушылардың құқықтарын қорғау комитеті Алматы қаласы Тұтынушылардың құқықтарын қорғау департаментінің Алматы қаласы Наурызбай ауданы тұтынушылардың құқықтарын қорғау басқармасы» мемлекеттік мекемесін құру туралы

act_code: '92792'
requisite: Постановление Правительства Республики Казахстан от 7 августа 2015 года № 605
title:
  rus: Об определении лицензиара по осуществлению лицензирования деятельности по осуществлению научно-реставрационных работ на памятниках истории и культуры и (или) археологических работ и органов, которые осуществляют согласование выдачи лицензии на деятельность по осуществлению научно-реставрационных работ на памятниках истории и культуры и (или) археологических работ
  kaz: Тарих және мәдениет ескерткіштерінде ғылыми-реставрациялау жұмыстарын және (немесе) археологиялық жұмыстарды жүзеге асыру жөніндегі лицензиарды және тарих және мәдениет ескерткіштерінде ғылыми-реставрациялау жұмыстарын және (немесе) археологиялық жұмыстарды жүзеге асыру жөніндегі қызметке лицензия беруді келісуді жүзеге асыратын органдарды айқындау туралы

caused_by:
  code: '141814'
  requisite: Постановление Правительства Республики Казахстан от 15 апреля 2020 года № 206
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 7 августа 2015 года № 605 «Об определении лицензиара по осуществлению лицензирования деятельности по осуществлению археологических и (или) научно-реставрационных работ на памятниках истории и культуры и органов, которые осуществляют согласование выдачи лицензии на деятельность по осуществлению археологических и (или) научно-реставрационных работ на памятниках истории и культуры»
    kaz: «Тарих және мәдениет ескерткіштерінде археологиялық және (немесе) ғылыми-реставрациялау жұмыстарын жүзеге асыру жөніндегі қызметті лицензиялауды жүзеге асыру бойынша лицензиарды және тарих және мәдениет ескерткіштерінде археологиялық және (немесе) ғылыми-реставрациялау жұмыстарын жүзеге асыру жөніндегі қызметке лицензия беруді келісуді жүзеге асыратын органдарды айқындау туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 7 тамыздағы № 605 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/141814/rus

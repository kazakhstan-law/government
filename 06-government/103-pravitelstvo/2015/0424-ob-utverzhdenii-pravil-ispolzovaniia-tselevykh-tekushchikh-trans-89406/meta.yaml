act_code: '89406'
requisite: Постановление Правительства Республики Казахстан от 24 апреля 2015 года № 282
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2015 год областными бюджетами на апробирование подушевого финансирования начального, основного среднего и общего среднего образования
  kaz: Облыстық бюджеттердің 2015 жылға арналған республикалық бюджеттен бастауыш, негізгі орта және жалпы орта білім беруді жан басына шаққандағы қаржыландыруды сынамалауға берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

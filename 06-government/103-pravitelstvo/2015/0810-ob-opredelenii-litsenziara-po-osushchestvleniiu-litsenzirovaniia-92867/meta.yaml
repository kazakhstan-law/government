  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 10 августа 2015 года № 634 «Об определении лицензиара по осуществлению лицензирования деятельности по производству этилового спирта и алкогольной продукции, производству табачных изделий, деятельности по хранению и оптовой реализации алкогольной продукции, за исключением деятельности по хранению и оптовой реализации алкогольной продукции на территории ее производства, а также хранению и розничной реализации алкогольной продукции, за исключением деятельности по хранению и розничной реализации алкогольной продукции на территории ее производства, и государственного органа, осуществляющего согласование выдачи лицензии и (или) приложения к лицензии на осуществление деятельности в сфере производства алкогольной продукции в части соответствия заявителя требованиям законодательства Республики Казахстан»
    kaz: «Этил спирті мен алкоголь өнімін өндіру, темекі өнімдерін өндіру жөніндегі қызметті, алкоголь өнімін ол өндірілген аумақта сақтау және көтерме саудада сату жөніндегі қызметті қоспағанда, алкоголь өнімін сақтау және көтерме саудада сату, сондай-ақ алкоголь өнімін ол өндірілген аумақта сақтау және бөлшек саудада сату жөніндегі қызметті қоспағанда, алкоголь өнімін сақтау және бөлшек саудада сату жөніндегі қызметті лицензиялауды жүзеге асыру бойынша лицензиарды және алкоголь өнімін өндіруге арналған лицензия және (немесе) лицензияға қосымша беруді өтініш берушінің Қазақстан Республикасы заңнамасының талаптарына сәйкестігі бөлігінде келісуді жүзеге асыратын мемлекеттік органды айқындау туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 10 тамыздағы № 634 қаулысына өзгеріс енгізу туралы

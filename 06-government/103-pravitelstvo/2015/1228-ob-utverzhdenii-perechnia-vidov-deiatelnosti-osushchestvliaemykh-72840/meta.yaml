act_code: '72840'
requisite: Постановление Правительства Республики Казахстан от 28 декабря 2015 года № 1095
title:
  rus: Об утверждении перечня видов деятельности, осуществляемых государственными предприятиями, юридическими лицами, более пятидесяти процентов акций (долей участия в уставном капитале) которых принадлежат государству, и аффилированными с ними лицами
  kaz: Мемлекеттік кәсіпорындар, акцияларының (жарғылық капиталға қатысу үлестерiнiң) елу пайызынан астамы мемлекетке тиесілі заңды тұлғалар және олармен үлестес тұлғалар жүзеге асыратын қызмет түрлерінің тізбесін бекіту туралы

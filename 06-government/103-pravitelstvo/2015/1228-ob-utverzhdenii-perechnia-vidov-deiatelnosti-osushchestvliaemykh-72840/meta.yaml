caused_by:
  code: '225815'
  requisite: Постановление Правительства Республики Казахстан от 21 мая 2026 года № 419
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 28 декабря 2015 года № 1095 «Об утверждении перечня видов деятельности, осуществляемых государственными предприятиями, юридическими лицами, более пятидесяти процентов акций (долей участия в уставном капитале) которых принадлежат государству, и аффилированными с ними лицами» и от 28 марта 2023 года № 261 «О реорганизации акционерного общества «Республиканский центр «Казимпэкс»
    kaz: Қазақстан Республикасы Үкіметінің «Мемлекеттік кәсіпорындар, акцияларының (жарғылық капиталға қатысу үлестерiнiң) елу пайызынан астамы мемлекетке тиесілі заңды тұлғалар және олармен үлестес тұлғалар жүзеге асыратын қызмет түрлерінің тізбесін бекіту туралы» 2015 жылғы 28 желтоқсандағы № 1095 және «Қазимпэкс» республикалық орталығы» акционерлік қоғамын қайта ұйымдастыру туралы» 2023 жылғы 28 наурыздағы № 261 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/225815/rus

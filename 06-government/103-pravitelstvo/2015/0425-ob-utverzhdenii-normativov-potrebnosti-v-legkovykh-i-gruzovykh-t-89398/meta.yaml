act_code: '89398'
requisite: Постановление Правительства Республики Казахстан от 25 апреля 2015 года № 315. Утратило силу постановлением Правительства Республики Казахстан от 15 марта 2019 года № 110 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении нормативов потребности в легковых и грузовых транспортных средствах, используемых в сельскохозяйственной деятельности, по которым юридические лица - производители сельскохозяйственной продукции, продукции аквакультуры (рыбоводства), налогооблагаемый доход которых облагается по ставке, установленной пунктом 2 статьи 147 Налогового кодекса, применяющие общеустановленный порядок налогообложения, а также глава и (или) члены крестьянского или фермерского хозяйства не являются плательщиками налога на транспортные средства
  kaz: Салық салынатын табысына Салық кодексінің 147-бабының 2-тармағында белгіленген мөлшерлеме бойынша салық салынатын, жалпыға бірдей белгіленген салық салу тәртібін қолданатын ауыл шаруашылығы өнімдерін, акваөсіру (балық өсіру шаруашылығы)өнімдерін өндіруші заңды тұлғалар, сондай-ақ шаруа немесе фермер қожалығының басшысы және (немесе) мүшелері көлік құралдарына салық төлеуші болып табылмайтын ауыл шаруашылығы қызметінде пайдаланылатын жеңіл және жүк көлік құралдарына қажеттілік нормативтерін бекіту туралы

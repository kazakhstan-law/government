act_code: '97240'
requisite: Постановление Правительства Республики Казахстан от 30 декабря 2015 года № 1129. Утратило силу постановлением Правительства Республики Казахстан от 20 апреля 2018 года № 208 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня отдельных видов деятельности, при осуществлении которых на территории Республики Казахстан индивидуальные предприниматели и (или) юридические лица, за исключением налогоплательщиков, деятельность которых находится в местах отсутствия сети телекоммуникаций общего пользования, обязаны обеспечить применение контрольно-кассовых машин с функцией фиксации и (или) передачи данных
  kaz: Қызметі ортақ пайдаланылатын телекоммуникациялар желiсi жоқ жерлерде орналасқан салық төлеушілерді қоспағанда, дара кәсіпкерлер және (немесе) заңды тұлғалар Қазақстан Республикасының аумағында жүзеге асыру кезінде деректерді тіркеу және (немесе) беру функциясы бар бақылау-касса машиналарын қолдануды қамтамасыз етуге міндетті болатын жекелеген қызмет түрлерiнің тізбесін бекіту туралы

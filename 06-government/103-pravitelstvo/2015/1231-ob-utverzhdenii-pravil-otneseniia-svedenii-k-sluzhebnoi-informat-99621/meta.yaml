  requisite: Постановление Правительства Республики Казахстан от 10 сентября 2019 года № 679. Утратило силу постановлением Правительства Республики Казахстан от 3 августа 2023 года № 641 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении Правил взаимодействия государственных органов Республики Казахстан в случае проведения расследований, предшествующих применению торговых мер и мер по соображениям безопасности третьей стороной в отношении товаров, происходящих из Республики Казахстан, и внесении изменений и дополнения в постановление Правительства Республики Казахстан от 31 декабря 2015 года № 1196 «Об утверждении Правил отнесения сведений к служебной информации ограниченного распространения и работы с ней»
    kaz: Үшінші тараптың Қазақстан Республикасынан шығатын тауарларға қатысты сауда шараларын және қауіпсіздік пайымдаулары бойынша шараларды қолдануы алдында тергеп-тексеру жүргізілген жағдайда, Қазақстан Республикасы мемлекеттік органдарының өзара іс-қимыл жасау қағидаларын бекіту және «Мәліметтерді таратылуы шектелген қызметтік ақпаратқа жатқызу және онымен жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 31 желтоқсандағы № 1196 қаулысына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134617/rus

title:
  rus: Об утверждении Национального плана распределения квот на выбросы парниковых газов на 2016–2020 годы и внесении дополнения в постановление Правительства Республики Казахстан от 7 мая 2012 года № 586 «Об утверждении Правил распределения квот на выбросы парниковых газов»

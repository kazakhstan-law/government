act_code: '98098'
requisite: Постановление Правительства Республики Казахстан от 30 декабря 2015 года № 1140. Утратило силу постановлением Правительства Республики Казахстан от 11 июля 2023 года № 550
title:
  rus: Об утверждении Правил предоставления субъектам малого и среднего предпринимательства в имущественный наем (аренду) или доверительное управление неиспользуемых объектов государственной собственности и занимаемых ими земельных участков для организации производственной деятельности и развития сферы услуг населению с последующей безвозмездной передачей в собственность
  kaz: Өндірістік қызметті ұйымдастыру және халыққа қызметтер көрсету саласын дамыту үшін мемлекеттік меншіктің пайдаланылмайтын объектілерін және олардың алып жатқан жер учаскелерін кейіннен меншікке өтеусіз бере отырып, шағын және орта кәсіпкерлік субъектілеріне мүліктік жалға (жалдауға) немесе сенімгерлік басқаруға беру қағидаларын бекіту туралы

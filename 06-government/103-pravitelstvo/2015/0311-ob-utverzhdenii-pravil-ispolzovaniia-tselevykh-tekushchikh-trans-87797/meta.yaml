  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 11 марта 2015 года № 123 «Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2015 год областными бюджетами, бюджетами городов Астаны и Алматы на здравоохранение»
    kaz: «Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2015 жылға арналған республикалық бюджеттен денсаулық сақтауға берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 11 наурыздағы № 123 қаулысына өзгерістер енгізу туралы

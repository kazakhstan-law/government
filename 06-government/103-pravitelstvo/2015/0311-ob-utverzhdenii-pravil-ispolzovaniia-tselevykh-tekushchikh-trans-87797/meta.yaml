  title:
    rus: Об утверждении Правил закупа услуг по хранению и транспортировке лекарственных средств и медицинских изделий единым дистрибьютором в рамках гарантированного объема бесплатной медицинской помощи и системе обязательного социального медицинского страхования
    kaz: Бірыңғай дистрибьютордың тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттар мен медициналық бұйымдарды сақтау және тасымалдау жөніндегі көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы

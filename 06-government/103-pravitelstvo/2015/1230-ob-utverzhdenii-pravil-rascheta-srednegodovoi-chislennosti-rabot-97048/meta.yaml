    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 24 апреля 2008 года № 387 «О некоторых вопросах Министерства финансов Республики Казахстан» и от 30 декабря 2015 года № 1128 «Об утверждении Правил расчета среднегодовой численности работников и среднегодового дохода субъектов предпринимательства»

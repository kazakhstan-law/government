  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 24 апреля 2015 года № 287 «Об утверждении перечня товаров, экспорт и (или) импорт которых подлежат лицензированию, лицензиаров и государственных органов, которые осуществляют согласование выдачи лицензии»
    kaz: «Экспорты және (немесе) импорты лицензиялауға жататын тауарлардың, лицензиарлардың және лицензия беруге келісуді жүзеге асыратын мемлекеттік органдардың тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 24 сәуірдегі № 287 қаулысына өзгерістер енгізу туралы

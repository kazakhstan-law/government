act_code: '97236'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2015 года № 1118
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областными бюджетами, бюджетами городов Астаны и Алматы на 2015 год на поддержку субъектов агропромышленного комплекса в регионах в рамках Программы по развитию агропромышленного комплекса в Республике Казахстан на 2013 – 2020 годы «Агробизнес – 2020»
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің Қазақстан Республикасында агроөнеркәсіптік кешенді дамыту жөніндегі 2013 – 2020 жылдарға арналған «Агробизнес-2020» бағдарламасы шеңберінде өңірлерде агроөнеркәсіптік кешен субъектілерін қолдауға берілетін 2015 жылға арналған ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

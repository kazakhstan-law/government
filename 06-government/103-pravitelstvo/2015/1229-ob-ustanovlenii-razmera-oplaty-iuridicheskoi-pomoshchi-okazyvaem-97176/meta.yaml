  title:
    rus: О признании утратившими силу постановлений Правительства Республики Казахстан от 29 декабря 2015 года № 1110 «Об установлении размера оплаты юридической помощи, оказываемой адвокатом, и возмещения расходов, связанных с защитой и представительством» и от 31 декабря 2015 года № 1150 «Об утверждении Правил ведения учета бесплатной юридической помощи в виде правового консультирования, оказанной адвокатом»
    kaz: Қазақстан Республикасы Үкіметінің «Адвокат көрсететін заң көмегіне ақы төлеу және қорғау мен өкілдік етуге байланысты шығыстарды өтеу мөлшерін белгілеу туралы» 2015 жылғы 29 желтоқсандағы № 1110 және «Адвокат көрсеткен құқықтық консультация беру түріндегі тегін заң көмегін есепке алуды жүргізу қағидаларын бекіту туралы» 2015 жылғы 31 желтоқсандағы № 1150 қаулыларының күші жойылды деп тану туралы

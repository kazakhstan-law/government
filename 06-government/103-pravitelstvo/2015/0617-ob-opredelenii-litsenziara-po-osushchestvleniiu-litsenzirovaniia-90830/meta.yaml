title:
  rus: Об определении лицензиара по осуществлению лицензирования деятельности в сфере использования космического пространства и уполномоченного органа на выдачу разрешения второй категории "Свидетельство о государственной регистрации космических объектов и прав на них"
  kaz: Ғарыш кеңістігін пайдалану саласындағы қызметті лицензиялауды жүзеге асыру жөніндегі лицензиар мен "Ғарыш объектілерін және оларға құқықтарды мемлекеттік тіркеу туралы куәлік" екінші санаттағы рұқсатын беретін уәкілетті органды айқындау туралы

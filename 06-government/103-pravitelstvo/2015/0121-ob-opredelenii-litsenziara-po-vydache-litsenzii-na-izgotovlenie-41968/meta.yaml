caused_by:
  code: '214125'
  requisite: Постановление Правительства Республики Казахстан от 15 августа 2025 года № 631
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 21 января 2015 года № 12 «Об определении лицензиара по выдаче лицензии на изготовление Государственного Флага Республики Казахстан и Государственного Герба Республики Казахстан и уполномоченного органа на выдачу разрешений второй категории в сфере технического регулирования и метрологии» и от 10 июля 2019 года № 497 «О мерах по реализации Указов Президента Республики Казахстан от 17 июня 2019 года № 17 и от 1 июля 2019 года № 46 «О мерах по дальнейшему совершенствованию системы государственного управления Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасының Мемлекеттік туын және Қазақстан Республикасының Мемлекеттік Елтаңбасын дайындауға лицензия беру жөніндегі лицензиар мен техникалық реттеу және метрология саласындағы екінші санаттағы рұқсаттарды беруге уәкілетті органды белгілеу туралы» 2015 жылғы 21 қаңтардағы № 12 және «Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2019 жылғы 17 маусымдағы № 17 және 2019 жылғы 1 шілдедегі № 46 жарлықтарын іске асыру жөніндегі шаралар туралы» 2019 жылғы 10 шілдедегі № 497 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/214125/rus

caused_by:
  code: '200954'
  requisite: Постановление Правительства Республики Казахстан от 24 сентября 2024 года № 776
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 21 января 2015 года № 12 «Об определении лицензиара по выдаче лицензии на изготовление Государственного Флага Республики Казахстан и Государственного Герба Республики Казахстан и уполномоченного органа на выдачу разрешений второй категории в сфере технического регулирования и метрологии» и от 8 октября 2021 года № 718 «Об определении уполномоченных органов, осуществляющих государственный контроль и надзор за соблюдением требований соответствующих технических регламентов, определенных Правительством Республики Казахстан, на стадиях жизненного цикла продукции и признании утратившим силу постановления Правительства Республики Казахстан от 17 мая 2019 года № 296 «Об определении уполномоченного органа по обеспечению государственного контроля (надзора) за соблюдением требований технических регламентов»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасының Мемлекеттік туын және Қазақстан Республикасының Мемлекеттік Елтаңбасын дайындауға лицензия беру жөніндегі лицензиар мен техникалық реттеу және метрология саласындағы екінші санаттағы рұқсаттарды беруге уәкілетті органды белгілеу туралы» 2015 жылғы 21 қаңтардағы № 12 және «Өнімнің өмірлік циклі сатыларында Қазақстан Республикасының Үкіметі айқындаған тиісті техникалық регламенттер талаптарының сақталуына мемлекеттік бақылау мен қадағалауды жүзеге асыратын уәкілетті органдарды айқындау және «Техникалық регламенттер талаптарының сақталуына мемлекеттік бақылауды (қадағалауды) қамтамасыз ету жөніндегі уәкілетті органды айқындау туралы» Қазақстан Республикасы Үкіметінің 2019 жылғы 17 мамырдағы № 296 қаулысының күші жойылды деп тану туралы» 2021 жылғы 8 қазандағы № 718 қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/200954/rus

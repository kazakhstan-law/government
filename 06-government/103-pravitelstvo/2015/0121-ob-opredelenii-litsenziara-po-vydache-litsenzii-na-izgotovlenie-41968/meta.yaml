act_code: '41968'
requisite: Постановление Правительства Республики Казахстан от 21 января 2015 года № 12
title:
  rus: Об определении лицензиара по выдаче лицензии на изготовление Государственного Флага Республики Казахстан и Государственного Герба Республики Казахстан и уполномоченного органа на выдачу разрешений второй категории в сфере технического регулирования и метрологии
  kaz: Қазақстан Республикасының Мемлекеттік туын және Қазақстан Республикасының Мемлекеттік Елтаңбасын дайындауға лицензия беру жөніндегі лицензиар мен техникалық реттеу және метрология саласындағы екінші санаттағы рұқсаттарды беруге уәкілетті органды белгілеу туралы

  title:
    rus: Об утверждении формы свидетельства об аккредитации, Правил проведения аккредитации, оснований и порядка отмены аккредитации объединений субъектов частного предпринимательства и иных некоммерческих организаций и внесении изменений и дополнений в постановление Правительства от 28 декабря 2015 года № 1090 «Об утверждении Типового положения об экспертных советах по вопросам частного предпринимательства»
    kaz: Аккредиттеу туралы куәліктің нысанын, Жеке кәсіпкерлік субъектілерінің бірлестіктері мен өзге де коммерциялық емес ұйымдарды аккредиттеуді өткізу қағидаларын, аккредиттеудің күшін жою негіздері мен тәртібін бекіту және «Жеке кәсіпкерлік мәселелері жөніндегі сараптамалық кеңестер туралы үлгілік ережені бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 28 желтоқсандағы № 1090 қаулысына өзгерістер мен толықтырулар енгізу туралы

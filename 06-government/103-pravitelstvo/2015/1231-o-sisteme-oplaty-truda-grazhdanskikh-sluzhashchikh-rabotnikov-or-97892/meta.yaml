  code: '189058'
  requisite: Постановление Правительства Республики Казахстан от 24 ноября 2023 года № 1040
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 31 декабря 2015 года № 1193 «О системе оплаты труда гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий» и от 23 августа 2023 года № 718 «О внесении изменений в постановление Правительства Республики Казахстан от 31 декабря 2015 года № 1193 «О системе оплаты труда гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий»
    kaz: Қазақстан Республикасы Үкіметінің «Азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбекақы төлеу жүйесі туралы» 2015 жылғы 31 желтоқсандағы № 1193 және «Азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбекақы төлеу жүйесі туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 31 желтоқсандағы № 1193 қаулысына өзгерістер енгізу туралы» 2023 жылғы 23 тамыздағы № 718 қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/189058/rus

caused_by:
  code: '150043'
  requisite: Постановление Правительства Республики Казахстан от 15 декабря 2020 года № 856
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 31 декабря 2013 года № 1562 «Об утверждении перечня производств, работ, профессий работников, занятых на работах с вредными (особо вредными) условиями труда, в пользу которых агентами по уплате обязательных профессиональных пенсионных взносов за счет собственных средств осуществляются обязательные профессиональные пенсионные взносы» и от 31 декабря 2015 года № 1193 «О системе оплаты труда гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий»
    kaz: Қазақстан Республикасы Үкіметінің «Өндірістердің, жұмыстардың, пайдасына міндетті кәсіптік зейнетақы жарналарын төлеу жөніндегі агенттер меншікті қаражаты есебінен міндетті кәсіптік зейнетақы жарналарын жүзеге асыратын, еңбек жағдайлары зиянды жұмыстармен айналысатын жұмыскерлер кәсіптерінің тізбесін бекіту туралы» 2013 жылғы 31 желтоқсандағы № 1562 және «Азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбекақы төлеу жүйесі туралы» 2015 жылғы 31 желтоқсандағы № 1193 қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/150043/rus

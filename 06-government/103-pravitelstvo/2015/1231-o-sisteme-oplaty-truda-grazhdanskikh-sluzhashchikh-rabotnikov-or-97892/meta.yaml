  requisite: Постановление Правительства Республики Казахстан от 31 марта 2016 года № 170
  title:
    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 31 декабря 2015 года № 1193 «О системе оплаты труда гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий» и признании утратившим силу пункта 4 изменений и дополнений, которые вносятся в некоторые решения Правительства Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 28 марта 2014 года № 273 дсп
    kaz: «Азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбекақы төлеу жүйесі туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 31 желтоқсандағы № 1193 қаулысына толықтыру енгізу және Қазақстан Республикасы Үкіметінің 2014 жылғы 28 наурыздағы № 273 қпү  қаулысымен бекітілген Қазақстан Республикасы Үкіметінің кейбір шешімдеріне енгізілетін өзгерістер мен толықтырулардың 4-тармағының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/100848/rus

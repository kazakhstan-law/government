  requisite: Постановление Правительства Республики Казахстан от 17 ноября 2017 года № 754
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 29 июня 2015 года № 489 «Об определении лицензиара по осуществлению лицензирования деятельности в сферах нефти и газа, обслуживания физических и юридических лиц и внесении изменения в постановление Правительства Республики Казахстан от 26 декабря 2012 года № 1684 «О некоторых вопросах лицензирования деятельности по выполнению работ и оказанию услуг в области охраны окружающей среды»
    kaz: «Мұнай және газ, жеке және заңды тұлғаларға қызмет көрсету салаларындағы қызметті лицензиялауды жүзеге асыру жөніндегі лицензиарды айқындау және «Қоршаған ортаны қорғау саласындағы жұмыстарды орындау және қызметтерді көрсету жөніндегі қызметті лицензиялаудың кейбір мәселелері туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 26 желтоқсандағы № 1684 қаулысына өзгеріс енгізу туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 29 маусымдағы № 489 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/115997/rus

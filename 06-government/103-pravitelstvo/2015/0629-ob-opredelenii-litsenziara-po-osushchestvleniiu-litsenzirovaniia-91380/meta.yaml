title:
  rus: Об определении лицензиара по осуществлению лицензирования деятельности в сферах углеводородов, обслуживания физических и юридических лиц
  kaz: Көмірсутектер, жеке және заңды тұлғаларға қызмет көрсету салаларындағы қызметті лицензиялауды жүзеге асыру жөніндегі лицензиарды айқындау туралы

    rus: О внесении изменения в постановление Правительства Республики Казахстан от 31 мая 2012 года № 716 «Об утверждении Правил формирования резерва установленного количества и резерва объема квот национального плана распределения квот на выбросы парниковых газов» и признании утратившими силу некоторых решений Правительства Республики Казахстан

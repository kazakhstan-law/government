caused_by:
  code: '129116'
  requisite: Постановление Правительства Республики Казахстан от 12 февраля 2019 года № 58
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 29 июня 2015 года № 489 «Об определении лицензиара по осуществлению лицензирования деятельности в сферах нефти и газа, обслуживания физических и юридических лиц и внесении изменения в постановление Правительства Республики Казахстан от 26 декабря 2012 года № 1684 «О некоторых вопросах лицензирования деятельности по выполнению работ и оказанию услуг в области охраны окружающей среды» и от 29 декабря 2017 года № 918 «Об определении уполномоченного органа на выдачу разрешений второй категории и государственных органов, которые осуществляют согласование выдачи разрешений второй категории в сфере нефти и газа»
    kaz: Қазақстан Республикасы Үкіметінің «Мұнай және газ, жеке және заңды тұлғаларға қызмет көрсету салаларындағы қызметті лицензиялауды жүзеге асыру жөніндегі лицензиарды айқындау және «Қоршаған ортаны қорғау саласындағы жұмыстарды орындау және қызметтерді көрсету жөніндегі қызметті лицензиялаудың кейбір мәселелері туралы» 2012 жылғы 26 желтоқсандағы № 1684 қаулысына өзгеріс енгізу туралы» 2015 жылғы 29 маусымдағы № 489 және «Мұнай мен газ саласында екінші санаттағы рұқсаттарды беруге уәкілетті органды және екінші санаттағы рұқсаттарды беруді келісуді жүзеге асыратын мемлекеттік органдарды айқындау туралы» 2017 жылғы 29 желтоқсандағы № 918 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/129116/rus

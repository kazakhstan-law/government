act_code: '94321'
requisite: Постановление Правительства Республики Казахстан от 1 октября 2015 года № 813
title:
  rus: Об утверждении норм физического объема сельскохозяйственной продукции, закупленной от личного подсобного хозяйства, применяемых для определения размера суммы налога на добавленную стоимость, субсидируемой заготовительным организациям в сфере агропромышленного комплекса
  kaz: Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға субсидияланатын қосылған құн салығы сомасының мөлшерін айқындау үшін қолданылатын, жеке қосалқы шаруашылықтан сатып алынған ауыл шаруашылығы өнімінің нақты көлемінің нормаларын бекіту туралы

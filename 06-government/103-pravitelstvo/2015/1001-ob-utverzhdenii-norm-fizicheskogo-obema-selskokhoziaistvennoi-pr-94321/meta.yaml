    kaz: «Жеке қосалқы шаруашылықтан алынатын ауыл шаруашылығы өнімінің нақты көлемінің нормаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 1 қазандағы № 813 қаулысына өзгерістер енгізу туралы

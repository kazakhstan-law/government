    kaz: '"Әріптестік туралы негіздемелік келісімдер шеңберінде халықаралық қаржы ұйымдарымен бірлесіп жүзеге асырылатын Қазақстан Республикасының орнықты дамуына және өсуіне жәрдемдесу жөніндегі жобаларды іске асыруға Қазақстан Республикасының Ұлттық қорынан бөлінетін нысаналы трансферт қаражатын бөлу және пайдалану қағидалары туралы" Қазақстан Республикасы Үкіметінің 2015 жылғы 15 сәуірдегі № 241 қаулысына өзгеріс енгізу туралы'

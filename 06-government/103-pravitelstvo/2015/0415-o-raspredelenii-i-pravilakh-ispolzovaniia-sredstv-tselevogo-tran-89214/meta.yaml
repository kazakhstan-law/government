  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 15 апреля 2015 года № 241 «О распределении и Правилах использования средств целевого трансферта из Национального фонда Республики Казахстан на реализацию проектов по содействию устойчивому развитию и росту Республики Казахстан, осуществляемых совместно с международными финансовыми организациями в рамках рамочных соглашений о партнерстве»
    kaz: «Әріптестік туралы негіздемелік келісімдер шеңберінде халықаралық қаржы ұйымдарымен бірлесіп жүзеге асырылатын Қазақстан Республикасының орнықты дамуына және өсуіне жәрдемдесу жөніндегі жобаларды іске асыруға Қазақстан Республикасының Ұлттық қорынан бөлінетін нысаналы трансферт қаражатын бөлу және пайдалану қағидалары туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 15 сәуірдегі № 241 қаулысына өзгерістер мен толықтыру енгізу туралы

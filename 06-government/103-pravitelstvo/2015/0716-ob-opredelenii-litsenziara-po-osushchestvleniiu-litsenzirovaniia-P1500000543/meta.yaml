title:
  rus: Об определении лицензиара по осуществлению лицензирования деятельности по предоставлению услуг в области связи и органа, уполномоченного на выдачу разрешений второй категории в области связи
  kaz: Байланыс саласында қызметтер көрсету бойынша қызметті лицензиялауды жүзеге асыру жөніндегі лицензиарды және байланыс саласындағы екінші санаттағы рұқсаттарды беруге уәкілетті органды айқындау туралы

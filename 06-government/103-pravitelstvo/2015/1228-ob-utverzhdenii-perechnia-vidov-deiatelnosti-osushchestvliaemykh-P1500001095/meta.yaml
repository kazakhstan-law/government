    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 28 декабря 2015 года № 1095 «Об утверждении перечня видов деятельности, осуществляемых юридическими лицами, более пятидесяти процентов акций (долей участия в уставном капитале) которых принадлежат государству, и аффилиированными с ними лицами»

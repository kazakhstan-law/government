    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 28 декабря 2015 года № 1095 «Об утверждении перечня видов деятельности, осуществляемых юридическими лицами, более пятидесяти процентов акций (долей участия в уставном капитале) которых принадлежат государству, и аффилиированными с ними лицами»
    kaz: «Акцияларының (жарғылық капиталға қатысу үлестерiнiң) елу пайызынан астамы мемлекетке тиесілі заңды тұлғалар және олармен үлестес тұлғалар жүзеге асыратын қызмет түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 28 желтоқсандағы № 1095 қаулысына толықтырулар енгізу туралы

  title:
    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 28 декабря 2015 года № 1095 «Об утверждении перечня видов деятельности, осуществляемых государственными предприятиями, юридическими лицами, более пятидесяти процентов акций (долей участия в уставном капитале) которых принадлежат государству, и аффилированными с ними лицами»
    kaz: «Мемлекеттік кәсіпорындар, акцияларының (жарғылық капиталға қатысу үлестерінің) елу пайызынан астамы мемлекетке тиесілі  заңды тұлғалар және олармен үлестес тұлғалар жүзеге асыратын қызмет түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 28 желтоқсандағы № 1095 қаулысына толықтыру енгізу туралы

title:
  rus: Об утверждении Правил реализации приоритетного права Республики Казахстан на приобретение отчуждаемого права недропользования (его части) и (или) объекта, связанного с правом недропользования, национальным управляющим холдингом, национальной компанией
  kaz: Иеліктен шығарылатын жер қойнауын пайдалану құқығын (оның бір бөлігін) және (немесе) жер қойнауын пайдалану құқығымен байланысты объектіні ұлттық басқарушы холдингтің, ұлттық компанияның сатып алуына Қазақстан Республикасының басым құқығын іске асыру кағидаларын бекіту туралы

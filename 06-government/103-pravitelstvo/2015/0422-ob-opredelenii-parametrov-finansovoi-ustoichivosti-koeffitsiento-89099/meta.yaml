title:
  rus: Об определении параметров финансовой устойчивости (коэффициентов) Банка Развития Казахстана, их пороговых значений и утверждении методики расчета пороговых значений параметров финансовой устойчивости (коэффициентов) Банка Развития Казахстана
  kaz: Қазақстанның Даму Банкінің қаржылық тұрақтылығының параметрлерін (коэффициенттерін), олардың шекті мәндерін айқындау және Қазақстанның Даму Банкінің қаржылық тұрақтылығы параметрлерінің (коэффициенттерінің) шекті мәндерін есептеу әдістемесін бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 22 апреля 2015 года № 250 "Об определении параметров финансовой устойчивости (коэффициентов) Банка Развития Казахстана, их пороговых значений и утверждении методики расчета пороговых значений параметров финансовой устойчивости (коэффициентов) Банка Развития Казахстана"
    kaz: '"Қазақстанның Даму Банкінің қаржылық тұрақтылығының параметрлерін (коэффициенттерін), олардың шекті мәндерін айқындау және Қазақстанның Даму Банкінің қаржылық тұрақтылығы параметрлерінің (коэффициенттерінің) шекті мәндерін есептеу әдістемесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2015 жылғы 22 сәуірдегі № 250 қаулысына өзгерістер мен толықтыру енгізу туралы'

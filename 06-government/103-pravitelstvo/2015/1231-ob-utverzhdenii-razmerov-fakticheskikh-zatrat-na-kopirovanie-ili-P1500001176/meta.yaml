title:
  rus: Об утверждении размеров фактических затрат на копирование или печать и порядка их оплаты обладателю информации, а также порядка освобождения социально уязвимых слоев населения от оплаты фактических затрат на копирование или печать
  kaz: Көшірме жасауға немесе басып шығаруға жұмсалатын нақты шығындардың мөлшерін және оларды ақпарат иеленушіге төлеу тәртібін, сондай-ақ халықтың әлеуметтік жағынан осал топтарын көшірме жасауға немесе басып шығаруға жұмсалатын шығындарды төлеуден босату тәртібін бекіту туралы

act_code: '87070'
requisite: Постановление Правительства Республики Казахстан от 26 февраля 2015 года № 93
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2015 год областными бюджетами, бюджетами городов Астаны и Алматы на обеспечение иммунопрофилактики населения и на проведение профилактической дезинсекции и дератизации (за исключением дезинсекции и дератизации на территории природных очагов инфекционных и паразитарных заболеваний, а также в очагах инфекционных и паразитарных заболеваний)
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2015 жылға арналған республикалық бюджеттен халықтың иммундық профилактикасын қамтамасыз етуге және профилактикалық дезинсекция мен дератизация жүргізуге (инфекциялық және паразиттік аурулардың табиғи ошақтарының аумағындағы, сондай-ақ инфекциялық және паразиттік аурулардың ошақтарындағы дезинсекция мен дератизацияны қоспағанда) берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

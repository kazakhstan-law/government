  requisite: Постановление Правительства Республики Казахстан от 24 ноября 2016 года № 724
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 1 июня 2015 года № 395 «Об определении лицензиара по осуществлению лицензирования деятельности по распространению теле-, радиоканалов и органа, уполномоченного на выдачу разрешений второй категории в области средств массовой информации" и от 16 июня 2016 года № 353 "Некоторые вопросы Министерства информации и коммуникаций Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Теле-, радиоарналарды тарату жөніндегі қызметті лицензиялауды жүзеге асыру бойынша лицензиарды және бұқаралық ақпарат құралдары саласындағы екінші санаттағы рұқсаттарды беруге уәкілетті органды айқындау туралы» 2015 жылғы 1 маусымдағы № 395 және «Қазақстан Республикасы Ақпарат және коммуникациялар министрлігінің кейбір мәселелері» туралы 2016 жылғы 16 маусымдағы № 353 қаулыларына өзгерістер мен толықтыру енгізу туралы

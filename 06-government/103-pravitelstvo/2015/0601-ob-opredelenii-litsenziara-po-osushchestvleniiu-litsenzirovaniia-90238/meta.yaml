  kaz: Теле-, радиоарналарды тарату жөніндегі қызметті лицензиялауды жүзеге асыру бойынша лицензиарды және масс-медиа саласындағы екінші санаттағы рұқсаттарды беруге уәкілетті органды айқындау туралы

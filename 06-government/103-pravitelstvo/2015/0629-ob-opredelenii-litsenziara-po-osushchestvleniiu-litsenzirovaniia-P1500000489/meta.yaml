  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 29 июня 2015 года № 489 «Об определении лицензиара по осуществлению лицензирования деятельности в сферах углеводородов, обслуживания физических и юридических лиц» и от 29 декабря 2017 года № 918 «Об определении органа, уполномоченного на выдачу разрешений второй категории, и государственных органов, которые осуществляют согласование выдачи разрешений второй категории в сфере углеводородов, газа и газоснабжения»
    kaz: Қазақстан Республикасы Үкіметінің «Көмірсутектер, жеке және заңды тұлғаларға қызмет көрсету салаларындағы қызметті лицензиялауды жүзеге асыру жөніндегі лицензиарды айқындау туралы» 2015 жылғы 29 маусымдағы № 489 және «Көмірсутектер, газ және газбен жабдықтау саласында екінші санаттағы рұқсаттарды беруге уәкілетті органды және екінші санаттағы рұқсаттарды беруді келісуді жүзеге асыратын мемлекеттік органдарды айқындау туралы» 2017 жылғы 29 желтоқсандағы № 918 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164731/rus

  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 15 июля 2015 года № 522 «Об утверждении Правил применения специальной таможенной процедуры, особенностей ее применения, условий помещения товаров под специальную таможенную процедуру, ограничений по пользованию и распоряжению товарами, способов и порядка завершения действия специальной таможенной процедуры, а также перечня лиц, правомочных помещать под такую таможенную процедуру товары, ввозимые на территорию Республики Казахстан»
    kaz: «Арнайы кедендік рәсімді қолдану қағидаларын, оны қолдану ерекшеліктерін, тауарларды арнайы кедендік рәсіммен орналастыру шарттарын, тауарларды пайдалану және оларға билік ету жөніндегі шектеулерді, арнайы кедендік рәсімнің қолданылуының аяқталу тәсілдері мен тәртібін, сондай-ақ Қазақстан Республикасының аумағына әкелінетін тауарларды осындай кедендік рәсіммен орналастыруға құқылы тұлғалардың тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 15 шілдедегі № 522 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/112639/rus

act_code: '91881'
requisite: Постановление Правительства Республики Казахстан от 15 июля 2015 года № 522. Утратило силу постановлением Правительства Республики Казахстан от 16 ноября 2018 года № 775 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения специальной таможенной процедуры, особенностей ее применения, условий помещения товаров под специальную таможенную процедуру, ограничений по пользованию и распоряжению товарами, способов и порядка завершения действия специальной таможенной процедуры, а также перечня лиц, правомочных помещать под такую таможенную процедуру товары, ввозимые на территорию Республики Казахстан
  kaz: Арнайы кедендік рәсімді қолдану қағидаларын, оны қолдану ерекшеліктерін, тауарларды арнайы кедендік рәсіммен орналастыру шарттарын, тауарларды пайдалану және оларға билік ету жөніндегі шектеулерді, арнайы кедендік рәсімнің қолданылуының аяқталу тәсілдері мен тәртібін, сондай-ақ Қазақстан Республикасының аумағына әкелінетін тауарларды осындай кедендік рәсіммен орналастыруға құқылы тұлғалардың тізбесін бекіту туралы

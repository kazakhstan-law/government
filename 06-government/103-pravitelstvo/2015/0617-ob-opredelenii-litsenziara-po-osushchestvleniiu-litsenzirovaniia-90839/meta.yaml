caused_by:
  code: '159026'
  requisite: Постановление Правительства Республики Казахстан от 28 сентября 2021 года № 685
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 17 июня 2015 года № 445 «Об определении лицензиара по осуществлению лицензирования деятельности по производству, переработке, приобретению, хранению, реализации, использованию, уничтожению ядов и органа, уполномоченного на согласование выдачи лицензии на осуществление деятельности по производству, переработке, приобретению, хранению, реализации, использованию, уничтожению ядов в части соответствия заявителя требованиям законодательства Республики Казахстан» и от 23 декабря 2015 года № 1033 «О некоторых вопросах лицензирования деятельности в сфере промышленности и признании утратившими силу некоторых решений Правительства Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Уларды өндіру, өңдеу, сатып алу, сақтау, өткізу, пайдалану, жою жөніндегі қызметті лицензиялауды жүзеге асыру бойынша лицензиарды және уларды өндіру, өңдеу, сатып алу, сақтау, өткізу, пайдалану, жою жөніндегі қызметті жүзеге асыруға арналған лицензияны беруді келісетін уәкілетті органды айқындау туралы» 2015 жылғы 17 маусымдағы № 445 және «Өнеркәсiп саласындағы қызметті лицензиялаудың кейбір мәселелері және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» 2015 жылғы 23 желтоқсандағы № 1033 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/159026/rus

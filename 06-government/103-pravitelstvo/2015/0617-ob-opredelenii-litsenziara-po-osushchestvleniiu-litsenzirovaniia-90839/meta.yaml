act_code: '90839'
requisite: Постановление Правительства Республики Казахстан от 17 июня 2015 года № 445
title:
  rus: Об определении лицензиара по осуществлению лицензирования деятельности по производству, переработке, приобретению, хранению, реализации, использованию, уничтожению ядов и органа, уполномоченного на согласование выдачи лицензии на осуществление деятельности по производству, переработке, приобретению, хранению, реализации, использованию, уничтожению ядов в части соответствия заявителя требованиям законодательства Республики Казахстан
  kaz: Уларды өндіру, өңдеу, сатып алу, сақтау, өткізу, пайдалану, жою жөніндегі қызметті лицензиялауды жүзеге асыру бойынша лицензиарды және уларды өндіру, өңдеу, сатып алу, сақтау, өткізу, пайдалану, жою жөніндегі қызметті жүзеге асыруға арналған лицензияны беруді өтініш берушінің Қазақстан Республикасы заңнамасының талаптарына сәйкестігі бөлігінде келісетін уәкілетті органды айқындау туралы

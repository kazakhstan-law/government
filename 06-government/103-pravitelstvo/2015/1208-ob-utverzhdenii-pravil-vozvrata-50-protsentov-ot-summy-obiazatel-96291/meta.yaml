act_code: '96291'
requisite: Постановление Правительства Республики Казахстан от 8 декабря 2015 года № 974. Утратил силу постановлением Правительства Республики Казахстан от 15 июня 2023 года № 472 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил возврата 50 процентов от суммы обязательных пенсионных взносов, перечисленных за счет бюджетных средств до 1 января 2016 года в пользу военнослужащих (кроме военнослужащих срочной службы), сотрудников специальных государственных и правоохранительных органов, государственной фельдъегерской службы, а также лиц, права которых иметь специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года
  kaz: Әскери қызметшiлердің (мерзімді қызметтегі әскери қызметшілерден басқа), арнаулы мемлекеттік және құқық қорғау органдары, мемлекеттік фельдъегерлік қызмет қызметкерлерінің, сондай-ақ арнаулы атақтарға, сыныптық шендерге ие болу және нысанды киiм киiп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдардың пайдасына 2016 жылғы 1 қаңтарға дейін бюджет қаражаты есебінен аударылған міндетті зейнетақы жарналарының сомасынан 50 пайызын қайтару қағидаларын бекіту туралы

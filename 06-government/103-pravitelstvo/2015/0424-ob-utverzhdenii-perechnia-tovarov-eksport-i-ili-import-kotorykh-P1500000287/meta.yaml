  title:
    rus: О мерах по реализации Указа Президента Республики Казахстан от 3 января 2024 года № 426 «О мерах по дальнейшему совершенствованию системы государственного управления Республики Казахстан»
    kaz: «Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2024 жылғы 3 қаңтардағы № 426 Жарлығын іске асыру жөніндегі шаралар туралы

title:
  rus: Об утверждении перечня товаров, экспорт и (или) импорт которых осуществляются на основании разрешительных документов в соответствии с международными договорами и разрешительных документов, которые выдаются государственными органами
  kaz: Экспорты және (немесе) импорты халықаралық шарттарға сәйкес рұқсат беру құжаттары және мемлекеттік органдар беретін рұқсат беру құжаттары негізінде жүзеге асырылатын тауарлардың тізбесін бекіту туралы

act_code: '87763'
requisite: Постановление Правительства Республики Казахстан от 19 марта 2015 года № 147
title:
  rus: Об установлении квот на привлечение иностранной рабочей силы по приоритетному проекту "Реконструкция и модернизация Атырауского НПЗ" и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы для реализации приоритетного проекта "Реконструкция и модернизация Атырауского НПЗ"
  kaz: '"Атырау МӨЗ-ін реконструкциялау және жаңғырту" басым жобасы бойынша шетелдік жұмыс күшін тартуға квота белгілеу және "Атырау МӨЗ-ін реконструкциялау және жаңғырту" басым жобасын іске асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру шарттарын бекіту туралы'

  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 23 апреля 2015 года № 267 «Об утверждении Правил зачисления активов в Национальный фонд Республики Казахстан и использования Национального фонда Республики Казахстан, а также форм и Правил составления годового отчета о формировании и использовании Национального фонда Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық қорына активтерді есептеу және Қазақстан Республикасының Ұлттық қорын пайдалану қағидаларын, сондай-ақ Қазақстан Республикасы Ұлттық қорының қалыптастырылуы мен пайдаланылуы туралы жылдық есепті жасау нысандары мен қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 23 сәуірдегі № 267 қаулысына өзгерістер мен толықтыру енгізу туралы

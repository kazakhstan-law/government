act_code: '106073'
requisite: Постановление Правительства Республики Казахстан от 26 января 2015 года № 17
title:
  rus: Об установлении квот на привлечение иностранной рабочей силы по приоритетному проекту "Реконструкция и модернизация Шымкентского НПЗ" и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы для реализации приоритетного проекта "Реконструкция и модернизация Шымкентского НПЗ"
  kaz: '"Шымкент МӨЗ-ін реконструкциялау және жаңғырту" басым жобасы бойынша шетелдік жұмыс күшін тартуға квота белгілеу және "Шымкент МӨЗ-ін реконструкциялау және жаңғырту" басым жобасын іске асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру шарттарын бекіту туралы'

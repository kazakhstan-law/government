act_code: '86904'
requisite: Постановление Правительства Республики Казахстан от 18 февраля 2015 года № 68
title:
  rus: Об условиях кредитования областных бюджетов, бюджетов городов Астаны и Алматы на проектирование и (или) строительство жилья через систему жилищных строительных сбережений на 2015 год в рамках Программы развития регионов до 2020 года
  kaz: Өңірлерді дамытудың 2020 жылға дейінгі бағдарламасы шеңберінде облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне тұрғын үй құрылыс жинақтары жүйесі арқылы тұрғын үйлерді жобалауға және (немесе) салуға 2015 жылға кредит беру шарттары туралы

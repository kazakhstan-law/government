    kaz: Тауарды үшінші тұлғаға кейіннен сату шарттарымен коммерциялық кредит беру арқылы сауда делдалы ретінде жеке және заңды тұлғаларды қаржыландыру шеңберінде тауарды сатып алу және сату жүргізілетін халықаралық тауар биржаларының тізбесін бекіту туралы

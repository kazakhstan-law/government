title:
  rus: Об утверждении перечня международных товарных бирж, на которых производятся приобретение и продажа товара в рамках финансирования физических и юридических лиц в качестве торгового посредника путем предоставления коммерческого кредита на условиях последующей продажи товара третьему лицу
  kaz: Сауда делдалы ретіндегі жеке және заңды тұлғаларды тауарды кейіннен үшінші тұлғаға сату талаптарымен коммерциялық кредит беру жолымен қаржыландыру шеңберінде тауарды сатып алу және сату жүргізілетін халықаралық тауар биржаларының тізбесін бекіту туралы

title:
  rus: Об утверждении Правил финансирования республиканской бюджетной программы 035 "Разработка и экспертиза технико-экономических обоснований республиканских инвестиционных проектов", утвержденной Законом Республики Казахстан от 12 декабря 2002 года "О республиканском бюджете на 2003 год"
  kaz: '"2003 жылға арналған республикалық бюджет туралы" Қазақстан Республикасының 2002 жылғы 12 желтоқсандағы Заңымен бекiтiлген 035 "Республикалық инвестициялық жобалардың техникалық-экономикалық негiздемелерiн әзiрлеу мен оларға сараптама жүргізу" республикалық бюджеттiк бағдарламасын қаржыландыру ережесiн бекiту туралы'

  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и распоряжение Премьер-Министра Республики Казахстан от 2 февраля 2009 года № 15-р "О дальнейших мерах по совершенствованию законотворческой деятельности"
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне және "Заң шығару қызметін одан әрі жетілдіру жөніндегі шаралар туралы" Қазақстан Республикасы Премьер-Министрінің 2009 жылғы 2 ақпандағы № 15-ө өкіміне өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: Об утверждении стандартов государственных услуг в сфере физической культуры и спорта, оказываемых Агентством Республики Казахстан по делам спорта и физической культуры, местными исполнительными органами в сфере физической культуры и спорта и о внесении изменений в некоторые решения Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігі, жергілікті атқарушы органдар дене шынықтыру және спорт саласында көрсететін мемлекеттік көрсетілетін қызметтер стандарттарын бекіту және Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiне өзгерiстер енгiзу туралы

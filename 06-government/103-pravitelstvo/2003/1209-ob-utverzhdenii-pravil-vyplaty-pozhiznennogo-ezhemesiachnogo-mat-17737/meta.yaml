title:
  rus: Об утверждении Правил выплаты пожизненного ежемесячного материального обеспечения заслуженным спортсменам и тренерам
  kaz: Еңбек сіңірген спортшылар мен жаттықтырушыларға ай сайынғы материалдық қамсыздандыру түрiнде өмiр бойы төлем төлеудiң ережесiн бекiту туралы

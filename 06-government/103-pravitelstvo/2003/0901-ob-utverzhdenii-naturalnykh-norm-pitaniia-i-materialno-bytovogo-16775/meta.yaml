  title:
    rus: О внесении изменений и признании утратившими силу некоторых решений Кабинета Министров и Правительства Республики Казахстан по вопросам закрепления оснований, порядка и условий содержания лиц в учреждениях, обеспечивающих временную изоляцию от общества
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне адамдарды қоғамнан уақытша оқшаулауды қамтамасыз ететін мекемелерде ұстау негіздерін, тәртібі мен шарттарын бекіту мәселелері бойынша өзгерістер енгізу және Министрлер Кабинеті мен Үкіметтің кейбір шешімдерінің күші жойылды деп тану туралы

title:
  rus: Об утверждении натуральных норм питания и материально-бытового обеспечения подозреваемых, обвиняемых и осужденных, а также Правил оказания помощи осужденным, освобождаемым от отбывания наказания
  kaz: Күдіктілерді, айыпталушыларды және сотталғандарды тамақтандырудың және материалдық-тұрмыстық қамтамасыз етудің заттай нормаларын, сондай-ақ Жазасын өтеуден босатылатын сотталғандарға көмек көрсету ережесін бекіту туралы

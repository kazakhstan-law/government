title:
  rus: Об утверждении Правил и режима использования земель, включенных в пригородную зону столицы и городов республиканского значения
  kaz: Астананың және республикалық маңызы бар қалалардың қала маңы аймағына қосылған жердi пайдалану қағидалары мен режимiн бекіту туралы

    rus: Об утверждении форм идентификационных документов на земельный участок, внесении изменений и дополнений и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Жер учаскесіне сәйкестендіру құжаттарының нысандарын бекіту, Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және кейбір шешімдердің күші жойылды деп тану туралы

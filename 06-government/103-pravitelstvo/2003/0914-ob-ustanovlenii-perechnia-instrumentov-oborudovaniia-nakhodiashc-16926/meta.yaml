  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 15 сентября 2003 года № 939 «Об утверждении Перечня оборудования, используемого для производства (изготовления) наркотических средств, психотропных веществ и прекурсоров, подлежащего контролю»
    kaz: «Есiрткi құралдарын, психотроптық заттар мен прекурсорларды өндiру (дайындау) үшiн пайдаланылатын, бақылауға жататын жабдықтардың тiзбесiн бекiту туралы» Қазақстан Республикасы Үкіметінің 2003 жылғы 15 қыркүйектегі № 939 қаулысына өзгерістер енгізу туралы

title:
  rus: Об установлении перечня инструментов, оборудования, находящихся под специальным контролем и используемых для производства и изготовления наркотических средств, психотропных веществ
  kaz: Арнайы бақылаудағы және есiрткi, психотроптық заттарды өндiру мен дайындау үшiн пайдаланылатын аспаптардың, жабдықтардың тiзбесiн белгiлеу туралы

act_code: '16007'
requisite: Постановление Правительства Республики Казахстан от 1 июля 2003 года N 634. Утратило силу постановлением Правительства Республики Казахстан от 23 февраля 2007 года N 138
title:
  rus: Об утверждении Правил назначения пенсионных выплат военнослужащим, сотрудникам органов внутренних дел, Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан, органов финансовой полиции и противопожарной службы, которым присвоены специальные звания и на которых распространяется порядок, установленный законодательством Республики Казахстан для сотрудников органов внутренних дел
  kaz: Әскери қызметшiлерге, iшкi iстер органдарының, Қазақстан Республикасының Әдiлет министрлiгi Қылмыстық-атқару жүйесi комитетiнiң, қаржы полициясы мен өртке қарсы қызмет органдарының арнаулы атақтар берiлген және оларға Қазақстан Республикасының заңнамасында iшкi iстер органдары қызметкерлерi үшiн белгіленген тәртiп қолданылатын қызметкерлерiне зейнетақы төлемдерiн тағайындау ережесiн бекiту туралы

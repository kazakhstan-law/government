  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 21 апреля 2003 года № 376 "Об утверждении Правил проведения публичных слушаний при рассмотрении заявок на утверждение тарифов (цен, ставок сборов) или их предельных уровней на регулируемые услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектiлерiнiң реттелетiн қызметтерiне (тауарларына, жұмыстарына) арналған тарифтердi (бағаларды, алымдар ставкаларын) немесе олардың шектi деңгейлерiн бекiтуге берiлген өтiнiмдердi қарау кезiнде жария тыңдаулар өткiзу ережесiн бекiту туралы" Қазақстан Республикасы Үкіметінің 2003 жылғы 21 сәуірдегі № 376 қаулысына өзгерістер енгізу туралы'

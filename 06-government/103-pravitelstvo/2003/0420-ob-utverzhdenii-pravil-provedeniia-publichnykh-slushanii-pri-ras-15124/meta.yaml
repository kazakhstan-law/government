  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 21 апреля 2003 года № 376 "Об утверждении Правил проведения публичных слушаний при рассмотрении заявок на утверждение тарифов (цен, ставок сборов) или их предельных уровней на регулируемые услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерінің реттелетін қызметтеріне (тауарларына, жұмыстарына) арналған тарифтерді (бағаларды, алымдар ставкаларын) немесе олардың шекті деңгейлерін бекітуге берілген өтінімдерді қарау кезінде жария тыңдаулар өткізу ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2003 жылғы 21 сәуірдегі № 376 қаулысына өзгерістер енгізу туралы'

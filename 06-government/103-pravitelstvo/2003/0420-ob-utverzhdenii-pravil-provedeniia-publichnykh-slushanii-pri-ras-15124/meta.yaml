title:
  rus: Об утверждении Правил проведения публичных слушаний при рассмотрении заявок на утверждение тарифов (цен, ставок сборов) или их предельных уровней на регулируемые услуги (товары, работы) субъектов естественных монополий
  kaz: Табиғи монополиялар субъектiлерiнiң реттелiп көрсетілетін қызметтерiне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) немесе олардың шекті деңгейлерiн бекiтуге арналған өтiнiмдерді қарау кезiнде жария тыңдаулар өткiзу қағидаларын бекiту туралы

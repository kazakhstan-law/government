title:
  rus: Об утверждении Перечня специализированных служб, оказывающих необходимую помощь туристам, терпящим бедствие на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағында апатқа ұшыраған туристерге қажеттi көмек көрсететiн мамандандырылған қызметтердiң тiзбесiн бекiту туралы

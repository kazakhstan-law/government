  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 4 июня 2003 года № 530 "Об утверждении Правил регистрации, учета и выдачи разрешений на проведение аэросъемочных работ" и от 23 июня 2003 года № 593 "Об утверждении Правил осуществления государственного надзора в области геодезической и картографической деятельности, Правил формирования, сбора, хранения и использования документов Национального картографо-геодезического фонда Республики Казахстан, Правил об охране геодезических пунктов"
    kaz: Қазақстан Республикасы Үкіметінің "Аэротүсірілім жұмыстарын жүргізуге рұқсаттарды тіркеу, есепке алу және беру қағидаларын бекіту туралы" 2003 жылғы 4 маусымдағы № 530 және "Геодезиялық және картографиялық қызмет саласындағы мемлекеттiк қадағалауды жүзеге асыру ережесiн, Қазақстан Республикасы Ұлттық картографиялық-геодезиялық қорының құжаттарын қалыптастыру, жинау, сақтау және пайдалану ережесiн, Геодезиялық пункттерді қорғау туралы ереженi бекiту туралы" 2003 жылғы 23 маусымдағы № 593 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/70236/rus

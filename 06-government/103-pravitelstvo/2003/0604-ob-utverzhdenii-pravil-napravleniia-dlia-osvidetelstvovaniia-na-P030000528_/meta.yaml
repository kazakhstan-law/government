  title:
    rus: О признании утратившими силу постановлений Правительства Республики Казахстан от 4 июня 2003 года № 528 «Об утверждении Правил направления для освидетельствования на состояние опьянения, освидетельствования на состояние опьянения и оформления его результатов» и от 10 августа 2005 года № 826 «О внесении изменений в постановления Правительства Республики Казахстан от 24 декабря 1996 года № 1598 и от 4 июня 2003 года № 528»
    kaz: Қазақстан Республикасы Үкіметінің «Мас күйін куәландыруға жіберу, мас күйін куәландыру және оның нәтижелерiн ресiмдеу ережесiн бекiту туралы» 2003 жылғы 4 маусымдағы № 528 және «Қазақстан Республикасы Үкіметінің 1996 жылғы 24 желтоқсандағы № 1598 және 2003 жылғы 4 маусымдағы № 528 қаулыларына өзгерістер енгізу туралы» 2005 жылғы 10 тамыздағы № 826 қаулыларының күші жойылды деп тану туралы

act_code: '15465'
requisite: Постановление Правительства Республики Казахстан от 22 мая 2003 года № 477
title:
  rus: Об утверждении государственных образовательных заказов на подготовку специалистов со средним профессиональным образованием в организациях образования, получающих средства из республиканского бюджета, с высшим профессиональным и послевузовским профессиональным образованием внутри страны на 2003/2004 учебный год
  kaz: Ел ішінде республикалық бюджеттен қаражат алатын бiлiм беру ұйымдарында кәсiптiк орта бiлiмдi, кәсiптiк жоғары бiлiмдi және жоғары оқу орнынан кейiнгi кәсiптiк бiлiмдi мамандар даярлауға 2003/2004 оқу жылына арналған мемлекеттiк бiлiм беру тапсырыстарын бекiту туралы

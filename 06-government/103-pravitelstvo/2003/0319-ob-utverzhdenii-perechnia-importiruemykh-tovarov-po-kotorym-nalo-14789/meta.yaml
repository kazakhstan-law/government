    kaz: Қазақстан Республикасы Үкіметінің 2003 жылғы 19 наурыздағы N 269 қаулысына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

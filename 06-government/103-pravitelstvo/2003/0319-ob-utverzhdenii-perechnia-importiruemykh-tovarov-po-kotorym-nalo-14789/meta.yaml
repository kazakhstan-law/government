act_code: '14789'
requisite: Постановление Правительства Республики Казахстан от 19 марта 2003 года N 269. Утратило силу постановлением Правительства Республики Казахстан от 8 сентября 2015 года № 754
title:
  rus: Об утверждении Перечня импортируемых товаров, по которым налог на добавленную стоимость уплачивается методом зачета в порядке, установленном Кодексом Республики Казахстан от 12 июня 2001 года "О налогах и других обязательных платежах в бюджет" (Налоговый кодекс)", Законом Республики Казахстан от 10 декабря 2008 года "О введении в действие Кодекса Республики Казахстан "О налогах и других обязательных платежах в бюджет" (Налоговый кодекс)", и правил его формирования
  kaz: Қосылған құн салығы «Салық және бюджетке төленетін басқа да міндетті төлемдер туралы» Қазақстан Республикасының 2001 жылғы 12 маусымдағы Кодексінде (Салық кодексі), «Салық және бюджетке төленетін басқа да міндетті төлемдер туралы» Қазақстан Республикасының кодексін (Салық кодексі) қолданысқа енгізу туралы» Қазақстан Республикасының 2008 жылғы 10 желтоқсандағы Заңында белгіленген тәртіппен есепке алу әдісімен төленетін импортталатын тауарлардың тізбесін және оны қалыптастыру ережесін бекіту туралы

act_code: '17708'
requisite: Постановление Правительства Республики Казахстан от 5 декабря 2003 года N 1240
title:
  rus: О реорганизации Дочернего государственного предприятия "Казахский научно-исследовательский институт мониторинга окружающей среды и климата" Республиканского государственного предприятия "Казгидромет" Министерства охраны окружающей среды Республики Казахстан
  kaz: Қазақстан Республикасының Қоршаған ортаны қорғау министрлiгi "Қазгидромет" республикалық мемлекеттiк кәсiпорнының "Қазақ қоршаған ортаны қорғау және климат мониторингi ғылыми-зерттеу институты" еншiлес мемлекеттiк кәсiпорнын қайта ұйымдастыру туралы

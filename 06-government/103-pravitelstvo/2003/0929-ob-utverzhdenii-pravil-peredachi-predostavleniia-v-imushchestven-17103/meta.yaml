act_code: '17103'
requisite: Постановление Правительства Республики Казахстан от 30 сентября 2003 года N 1006. Утратило силу постановлением Правительства Республики Казахстан от 16 июля 2008 года N 687
title:
  rus: Об утверждении Правил передачи, предоставления в имущественный наем (аренду), реализации и утилизации оружия, военной техники, оборонных объектов и другого военного имущества Вооруженных Сил, других войск и воинских формирований Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерiнiң, басқа да әскерлерi мен әскери құралымдарының қару-жарағын, әскери техникасын, қорғаныс объектiлерi мен басқа да әскери мүлкiн беру, мүлiктiк жалдауға беру (жалға беру), сату және пайдаға асыру ережесiн бекiту туралы

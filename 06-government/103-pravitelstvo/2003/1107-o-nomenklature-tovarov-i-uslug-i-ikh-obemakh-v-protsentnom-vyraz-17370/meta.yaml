  kaz: Қазақстан Республикасы мүгедектерiнiң қоғамдық бiрлестiктерi құратын, тауарлар мен көрсетiлетiн қызметтердi өндiретiн ұйымдардан конкурсты ұйымдастырушылар сатып алатын тауарлар мен көрсетiлетiн қызметтердің 2004 жылға арналған номенклатурасы мен олардың көлемi (пайызбен көрсеткенде) туралы

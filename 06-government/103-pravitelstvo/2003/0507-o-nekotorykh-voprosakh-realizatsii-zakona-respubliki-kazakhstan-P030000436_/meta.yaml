  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 8 мая 2003 года № 436 "О некоторых вопросах реализации Закона Республики Казахстан "Об инвестициях" и от 25 мая 2012 года № 683 "Об утверждении Программы развития моногородов на 2012-2020 годы" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Үкіметінің "Инвестициялар туралы" Қазақстан Республикасының Заңын іске асырудың кейбір мәселелері туралы" 2003 жылғы 8 мамырдағы № 436 және "Моноқалаларды дамытудың 2012 - 2020 жылдарға арналған бағдарламасын бекіту туралы" 2012 жылғы 25 мамырдағы № 683 қаулыларына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

act_code: '15772'
requisite: Постановление Правительства Республики Казахстан от 6 июня 2003 года N 534
title:
  rus: Об утверждении Перечней участков недр (блоков) Республики Казахстан по углеводородному сырью, твердым полезным ископаемым, подземным водам и лечебным грязям, подлежащих выставлению Компетентным органом на открытый конкурс инвестиционных программ в 2003 году
  kaz: 2003 жылы Құзыреттi орган инвестициялық бағдарламалардың ашық конкурсына шығаруы тиiс Қазақстан Республикасының көмiрсутегi шикiзаты, қатты пайдалы қазбалар, жерасты сулары және емдiк балшықтар бойынша жер қойнауы учаскелерiнің (блоктарының) тiзбелерiн бекiту туралы

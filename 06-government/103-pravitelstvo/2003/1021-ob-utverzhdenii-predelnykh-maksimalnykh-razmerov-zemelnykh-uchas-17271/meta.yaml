  title:
    rus: О приостановлении действия постановления Правительства Республики Казахстан от 22 октября 2003 года № 1071 «Об утверждении предельных (максимальных) размеров земельных участков сельскохозяйственного назначения в пределах республики и одного административного района (города), области, которые могут находиться на праве частной собственности у гражданина Республики Казахстан для ведения крестьянского или фермерского хозяйства, негосударственного юридического лица Республики Казахстан без иностранного участия и его аффилированных лиц для ведения сельскохозяйственного производства»
    kaz: «Шаруа немесе фермер қожалығын жүргізу үшін Қазақстан Республикасы азаматының, ауыл шаруашылығы өндірісін жүргізу үшін шетелдік қатысуы жоқ Қазақстан Республикасының мемлекеттік емес заңды тұлғасының және оның үлестес тұлғаларының жеке меншік құқығында болуы мүмкін республика және бір әкімшілік аудан (қала), облыс шегіндегі ауыл шаруашылығы мақсатындағы жер учаскелерінің шекті (ең жоғарғы) мөлшерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2003 жылғы 22 қазандағы № 1071 қаулысының қолданысын тоқтата тұру туралы

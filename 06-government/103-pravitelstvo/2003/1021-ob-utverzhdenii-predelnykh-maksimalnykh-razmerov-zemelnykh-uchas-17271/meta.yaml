  requisite: Постановление Правительства Республики Казахстан от 24 ноября 2021 года № 839
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 22 октября 2003 года № 1071 «Об утверждении предельных (максимальных) размеров земельных участков сельскохозяйственного назначения в пределах одного административного района (города), которые могут находиться на праве частной собственности у гражданина Республики Казахстан для ведения крестьянского (фермерского) хозяйства, негосударственного юридического лица Республики Казахстан и его аффилиированных лиц для ведения товарного сельскохозяйственного производства, а также на праве временного землепользования у иностранцев, лиц без гражданства и иностранных юридических лиц для ведения товарного сельскохозяйственного производства»
    kaz: «Шаруа (фермер) қожалығын жүргізу үшін Қазақстан Республикасының азаматында, тауарлы ауыл шаруашылығы өндірісін жүргізу үшін Қазақстан Республикасының мемлекеттік емес заңды тұлғасында және оның үлестес тұлғасында жеке меншік құқығында, сондай-ақ тауарлы ауыл шаруашылығы өндірісін жүргізу үшін шетелдіктерде, азаматтығы жоқ адамдарда және шетелдік заңды тұлғаларда уақытша жер пайдалану құқығында болуы мүмкін ауыл шаруашылығы мақсатындағы жер учаскелерінің бір әкімшілік ауданның (қаланың) аумағындағы шекті (ең жоғарғы) мөлшерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2003 жылғы 22 қазандағы № 1071 қаулысына өзгерістер енгізу туралы

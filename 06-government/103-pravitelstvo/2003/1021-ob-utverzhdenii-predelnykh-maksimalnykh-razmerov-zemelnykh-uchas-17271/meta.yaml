act_code: '17271'
requisite: Постановление Правительства Республики Казахстан от 22 октября 2003 года N 1071. Действие постановления приостановлено до 31 декабря 2026 года постановлением Правительства Республики Казахстан от 29 декабря 2021 года № 947 (вводится в действие с 30 декабря 2021 года)
title:
  rus: Об утверждении предельных (максимальных) размеров земельных участков сельскохозяйственного назначения в пределах республики и одного административного района (города), области, которые могут находиться на праве частной собственности у гражданина Республики Казахстан для ведения крестьянского или фермерского хозяйства, негосударственного юридического лица Республики Казахстан без иностранного участия и его аффилированных лиц для ведения сельскохозяйственного производства
  kaz: Шаруа немесе фермер қожалығын жүргізу үшін Қазақстан Республикасы азаматының, ауыл шаруашылығы өндірісін жүргізу үшін шетелдік қатысуы жоқ Қазақстан Республикасының мемлекеттік емес заңды тұлғасының және оның үлестес тұлғаларының жеке меншік құқығында болуы мүмкін республика және бір әкімшілік аудан (қала), облыс шегіндегі ауыл шаруашылығы мақсатындағы жер учаскелерінің шекті (ең жоғарғы) мөлшерін бекіту туралы

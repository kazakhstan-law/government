title:
  rus: Об утверждении Правил проведения экспертизы сортовых и посевных качеств семян, в том числе семян, предназначенных для посева отечественными сельскохозяйственными товаропроизводителями
  kaz: Тұқымның, оның iшiнде отандық ауыл шаруашылығы тауарын өндiрушiлердiң себуiне арналған тұқымның сорттық және егiстiк сапасына сараптама жүргізу қағидаларын бекіту туралы

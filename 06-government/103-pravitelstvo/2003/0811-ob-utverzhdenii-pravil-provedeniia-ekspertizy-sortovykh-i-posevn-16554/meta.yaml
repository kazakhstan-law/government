  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 12 августа 2003 года № 805 "Об утверждении Правил экспертизы семян на сортовые и посевные качества, проводимой за счет средств республиканского бюджета, в том числе семян, предназначенных для посева отечественными сельскохозяйственными товаропроизводителями"
    kaz: '"Республикалық бюджеттің қаражаты есебінен жүргізілетін тұқымның, оның ішінде отандық ауыл шаруашылығы тауарын өндірушілердің себуіне арналған тұқымның сорттық және егістік сапасын сараптау ережесін бекіту туралы" Қазақстан Республикасы Үкiметiнiң 2003 жылғы 12 тамыздағы № 805 қаулысына өзгерістер енгізу туралы'

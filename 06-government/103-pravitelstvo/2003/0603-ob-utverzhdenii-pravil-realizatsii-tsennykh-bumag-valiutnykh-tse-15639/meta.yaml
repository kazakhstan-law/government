act_code: '15639'
requisite: Постановление Правительства Республики Казахстан от 4 июня 2003 года № 526. Утратило силу постановлением Правительства Республики Казахстан от 2 апреля 2015 года № 180
title:
  rus: Об утверждении Правил реализации ценных бумаг, валютных ценностей, ювелирных и других изделий из драгоценных металлов, драгоценных камней и жемчуга, а также лома таких изделий и антиквариата, изъятых у должника и переданных на хранение банкам и организациям, осуществляющим отдельные виды банковских операций
  kaz: Борышкерден алынған және банктер мен банктiк операциялардың жекелеген түрлерiн жүзеге асыратын ұйымдарға сақтауға берілген бағалы қағаздарды, валюта құндылықтарын, бағалы металдардан, асыл тастар мен iнжуден жасалған зергерлiк және басқа да бұйымдарды, сондай-ақ осындай бұйымдардың сынықтары мен антиквариатты сату ережесiн бекiту туралы

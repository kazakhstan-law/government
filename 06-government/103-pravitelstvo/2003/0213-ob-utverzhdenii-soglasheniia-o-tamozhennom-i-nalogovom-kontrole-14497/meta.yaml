title:
  rus: Об утверждении Соглашения о таможенном и налоговом контроле за производством и оборотом этилового спирта, алкогольной, спиртосодержащей и табачной продукции на территориях государств-членов ЕврАзЭС
  kaz: ЕурАзЭҚ-қа мүше мемлекеттердiң аумақтарында этил спиртiнiң, алкоголь, құрамында спирт бар және темекi өнiмдерiнiң өндiрiлуi мен олардың айналымын кедендiк және салықтық бақылау туралы келiсiмдi бекiту туралы

    kaz: 2002 жылғы 30 наурыздағы ЕурАзЭҚ-қа мүше мемлекеттердің аумақтарында этил спиртінің, алкоголь, құрамында спирт бар және темекі өнімдерінің өндірілуі мен олардың айналымын кедендік және салықтық бақылау туралы келісімге өзгерістер мен толықтырулар енгізу туралы хаттаманы бекіту туралы

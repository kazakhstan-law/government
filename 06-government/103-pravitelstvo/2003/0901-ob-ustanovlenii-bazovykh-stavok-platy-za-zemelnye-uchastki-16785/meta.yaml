  requisite: Постановление Правительства Республики Казахстан от 10 октября 2011 года № 1154
  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 2 сентября 2003 года № 890 "Об установлении базовых ставок платы за земельные участки при их предоставлении в частную собственность, при сдаче государством или государственными землепользователями в аренду, а также размера платы за продажу права аренды земельных участков"
    kaz: '"Жер учаскелері жеке меншікке берілген кезде, мемлекет немесе мемлекеттік жер пайдаланушылар жалға берген кезде олар үшін төлемақының базалық ставкаларын, сондай-ақ жер учаскелерін жалдау құқығын сату төлемақысының мөлшерін бекіту туралы" Қазақстан Республикасы Үкіметінің 2003 жылғы 2 қыркүйектегі № 890 қаулысына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/60722/rus

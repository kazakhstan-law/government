title:
  rus: О переименовании Республиканского государственного казенного предприятия "Академический ансамбль классического танца Республики Казахстан" Комитета культуры Министерства культуры, информации и общественного согласия Республики Казахстан
  kaz: Қазақстан Республикасының Мәдениет, ақпарат және қоғамдық келiсiм министрлiгі Мәдениет комитетінің "Қазақстан Республикасының академиялық классикалық би ансамблi" республикалық мемлекеттiк қазыналық кәсiпорнын қайта атау туралы

  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 20 сентября 2003 года № 958 "Об утверждении Правил ведения государственного земельного кадастра в Республике Казахстан" и от 6 июня 2006 года № 511 "Об утверждении форм идентификационных документов на земельный участок, внесении изменений и дополнений и признании утратившими силу некоторых решений Правительства Республики Казахстан"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасында мемлекеттiк жер кадастрын жүргiзудiң ережесiн бекiту туралы" 2003 жылғы 20 қыркүйектегі № 958 және "Жер учаскесіне сәйкестендіру құжаттарының нысандарын бекіту, Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және кейбір шешімдердің күші жойылды деп тану туралы" 2006 жылғы 6 маусымдағы № 511 қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/72271/rus

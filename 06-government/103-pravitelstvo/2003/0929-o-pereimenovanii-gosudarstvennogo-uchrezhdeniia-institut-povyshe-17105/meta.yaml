title:
  rus: О переименовании государственного учреждения "Институт повышения квалификации судей и работников судебной системы при Верховном Суде Республики Казахстан" в государственное учреждение "Судебная академия при Верховном Суде Республики Казахстан"
  kaz: '"Қазақстан Республикасы Жоғарғы Сотының жанындағы Судьялар мен сот жүйесі қызметкерлерінің біліктілігін арттыру институты" мемлекеттік мекемесін "Қазақстан Республикасы Жоғарғы Сотының жанындағы Сот академиясы" мемлекеттік мекемесі деп қайта атау туралы'

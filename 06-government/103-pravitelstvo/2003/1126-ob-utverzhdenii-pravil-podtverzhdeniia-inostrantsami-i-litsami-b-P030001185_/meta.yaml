  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 26 ноября 2003 года № 1185 "Об утверждении Правил подтверждения иностранцами и лицами без гражданства, претендующими на получение разрешений на постоянное проживание в Республике Казахстан, своей платежеспособности в период пребывания в Республике Казахстан"
    kaz: '"Қазақстан Республикасында тұрақты тұруға рұқсаттар алуға үмiткер шетелдіктердің және азаматтығы жоқ адамдардың Қазақстан Республикасында болу кезеңiнде өздерiнiң төлем жасау қабiлеттігін растау ережесiн бекiту туралы" Қазақстан Республикасы Үкіметінің 2003 жылғы 26 қарашадағы № 1185 қаулысына өзгеріс пен толықтыру енгізу туралы'

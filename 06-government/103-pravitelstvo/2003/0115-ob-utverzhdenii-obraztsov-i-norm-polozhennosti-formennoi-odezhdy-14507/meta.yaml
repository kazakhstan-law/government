  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 15 января 2003 года № 13 "Об утверждении образцов и норм положенности форменного и специального обмундирования сотрудников и курсантов пожарно-технических учебных заведений органов государственной противопожарной службы Министерства по чрезвычайным ситуациям Республики Казахстан"
    kaz: '"Қазақстан Республикасы Төтенше жағдайлар министрлігінің мемлекеттік өртке қарсы қызмет органдары қызметкерлерінің және өрт-техникалық оқу орындары курсанттарының нысандық және арнайы киім-кешектерінің үлгілері мен тиесілілігі нормаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2003 жылғы 15 қаңтардағы № 13 қаулысына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/8901/rus

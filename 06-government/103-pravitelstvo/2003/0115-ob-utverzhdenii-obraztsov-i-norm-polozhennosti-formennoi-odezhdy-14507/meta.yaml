title:
  rus: Об утверждении образцов и норм положенности форменной одежды и специального обмундирования для сотрудников государственной противопожарной службы
  kaz: Мемлекеттік өртке қарсы қызмет қызметкерлерінің нысандық киімінің және арнайы киім-кешектерінің үлгілері мен тиесілілік нормаларын бекіту туралы

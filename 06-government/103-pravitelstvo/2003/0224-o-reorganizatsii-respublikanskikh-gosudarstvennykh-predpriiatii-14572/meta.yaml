act_code: '14572'
requisite: Постановление Правительства Республики Казахстан от 24 февраля 2003 года N 189
title:
  rus: О реорганизации Республиканских государственных предприятий "Южно-Казахстанская гидрогеолого-мелиоративная экспедиция Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан" и "Кызылординская гидрогеолого-мелиоративная экспедиция Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан"
  kaz: '"Қазақстан Pecпубликасының Ауыл шаруашылығы министрлігі Су ресурстары жөніндегi комитетінің Оңтүстік Қазақстан гидрогеологиялық-мелиоративтiк экспедициясы" және "Қазақстан Республикасының Ауыл шаруашылығы министрлігі Су ресурстары жөнiндегі комитетiнің Қызылорда гидрогеологиялық-мелиоративтiк экспедициясы" республикалық мемлекеттiк кәсiпорындарын қайта ұйымдастыру туралы'

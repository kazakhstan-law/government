  title:
    rus: Об утверждении лимитов штатной численности государственных учреждений, подведомственных центральным исполнительным органам Республики Казахстан
    kaz: Қазақстан Республикасының орталық атқарушы органдарына ведомстволық бағыныстағы мемлекеттiк мекемелер штат санының лимиттерiн бекiту туралы

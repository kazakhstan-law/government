requisite: Постановление Правительства Республики Kазахстан от 4 апреля 2003 года N 327. Утратило силу постановлением Правительства Республики Казахстан от 30 марта 2010 года N 243
title:
  rus: Об утверждении Правил предоставления субъектам малого предпринимательства в имущественный наем (аренду) или доверительное управление с правом последующей безвозмездной передачи в собственность неиспользуемых объектов государственной собственности
  kaz: Шағын кәсiпкерлiк субъектiлерiне мемлекеттік меншiктiң пайдаланылмайтын объектiлерiн кейiннен меншікке өтеусiз беру құқығымен мүлiктiк жалға алуға (жалға беруге) немесе сенiмгерлiк басқаруға беру ережесiн бекiту туралы

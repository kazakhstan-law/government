title:
  rus: Об утверждении Правил подтверждения иностранцами и лицами без гражданства, претендующими на получение разрешений на постоянное проживание в Республике Казахстан, своей платежеспособности в период пребывания в Республике Казахстан
  kaz: Қазақстан Республикасында тұрақты тұруға рұқсаттар алуға үмiткер шетелдіктердің және азаматтығы жоқ адамдардың Қазақстан Республикасында болу кезеңiнде өздерiнiң төлем жасау қабiлеттігін растау ережесiн бекiту туралы

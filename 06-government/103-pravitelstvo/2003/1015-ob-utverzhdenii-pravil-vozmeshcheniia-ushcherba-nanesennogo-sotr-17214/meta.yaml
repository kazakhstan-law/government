requisite: Постановление Правительства Республики Казахстан от 15 октября 2003 года N 1056. Утратило силу Постановлением Правительства Республики Казахстан от 3 апреля 2025 года № 207 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил возмещения ущерба, нанесенного сотруднику или работнику дипломатической службы или членам его семьи во время пребывания за границей при исполнении им своих служебных обязанностей либо деятельности, связанной с ними
  kaz: Дипломатиялық қызмет қызметкерiне немесе жұмыскерiне немесе оның отбасы мүшелерiне шет елде болу уақытында өздерiнiң қызметтiк мiндеттерiн не соларға байланысты қызметтi атқару кезiнде келтірілген залалды өтеудің ережесін бекіту туралы

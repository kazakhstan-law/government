title:
  rus: Об утверждении Правил осуществления пенсионных выплат из пенсионных накоплений, сформированных за счет обязательных пенсионных взносов, добровольных профессиональных пенсионных взносов из накопительных пенсионных фондов, и Методики осуществления расчета размера пенсионных выплат по графику
  kaz: Жинақтаушы зейнетақы қорларынан мiндеттi зейнетақы жарналарының, ерiктi кәсіптiк зейнетақы жарналарының есебiнен қалыптасқан зейнетақы жинақтарынан төленетiн зейнетақы төлемдерiн жүзеге асыру ережесiн және Кесте бойынша зейнетақы төлемдерiнiң мөлшерiн есептеуді жүзеге асыру әдiстемесiн бекiту туралы

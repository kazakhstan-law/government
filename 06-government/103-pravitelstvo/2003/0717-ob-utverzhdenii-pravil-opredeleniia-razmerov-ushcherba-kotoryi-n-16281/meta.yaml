  code: '216650'
  requisite: Постановление Правительства Республики Казахстан от 15 октября 2025 года № 861
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 17 июля 2003 года № 701 «Об утверждении Правил определения размеров ущерба, который нанесен или может быть нанесен национальной безопасности Республики Казахстан или интересам государственных органов и организаций вследствие разглашения или утраты сведений, составляющих государственные секреты, а также ущерба, наносимого собственнику носителей сведений в результате их засекречивания»
    kaz: «Мемлекеттiк құпияларды құрайтын мәлiметтердi жария ету немесе жоғалту салдарынан Қазақстан Республикасының ұлттық қауiпсiздiгiне немесе мемлекеттiк органдар мен ұйымдардың мүдделерiне келтiрiлген немесе келтiрiлуі мүмкін зиянның, сондай-ақ мәлiметтер көздерiнiң иесiне оларды құпияландыру нәтижесiнде келтiрiлетiн зиянның мөлшерiн анықтау ережесiн бекiту туралы» Қазақстан Республикасы Үкіметінің 2003 жылғы 17 шілдедегі № 701 қаулысына өзгерістер енгізу туралы

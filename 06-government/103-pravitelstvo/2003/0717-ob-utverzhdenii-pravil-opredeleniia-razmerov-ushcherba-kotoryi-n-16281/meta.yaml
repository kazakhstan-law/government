act_code: '16281'
requisite: Постановление Правительства Республики Казахстан от 17 июля 2003 года № 701
title:
  rus: Об утверждении Правил определения размеров ущерба, который нанесен или может быть нанесен национальной безопасности Республики Казахстан или интересам государственных органов и организаций вследствие разглашения или утраты сведений, составляющих государственные секреты, а также ущерба, наносимого собственнику носителей сведений в результате их засекречивания
  kaz: Мемлекеттік құпиялар болып табылатын мәліметтерді жария ету немесе жоғалту салдарынан Қазақстан Республикасының ұлттық қауіпсіздігіне немесе мемлекеттік органдар мен ұйымдардың мүдделеріне келтірілген немесе келтірілуі мүмкін зиянның, сондай-ақ мәліметтер көздерінің иесіне оларды құпияландыру салдарынан келтірілетін зиянның мөлшерін айқындау қағидаларын бекiту туралы

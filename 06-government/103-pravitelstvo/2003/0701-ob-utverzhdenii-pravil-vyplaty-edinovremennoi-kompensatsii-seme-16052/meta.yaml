act_code: '16052'
requisite: Постановление Правительства Республики Казахстан от 2 июля 2003 года N 644. Утратило силу - постановлением Правительства РК от 27 октября 2005 года N 1079  (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении Правил выплаты единовременной компенсации семье погибшего (умершего) или его иждивенцам (наследникам) в случае гибели (смерти) должностного лица таможенного органа Республики Казахстан в связи с исполнением служебных обязанностей
  kaz: Қазақстан Республикасы кеден органының лауазымды адамы қызметтік міндеттерін атқаруына байланысты қаза тапқан (қайтыс болған) жағдайда қаза тапқан (қайтыс болған) адамның отбасына немесе оның асырауындағы адамдарға (мұрагерлеріне) біржолғы өтемақы төлеу ережесін бекіту туралы

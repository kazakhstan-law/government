title:
  rus: Об утверждении Перечня товаров, получение резидентами от нерезидентов платежей по экспорту которых подлежит лицензированию в случае, если срок между датой экспорта товаров и получением экспортной выручки превышает 365 дней
  kaz: Резиденттердiң резидент еместерден экспорт бойынша төлемдер алуы, егер тауар экспортталған күн мен экспорттық түсiмдi алу арасындағы мерзiм 365 күннен асып кеткен жағдайда лицензиялауға жататын тауарлардың тiзбесiн бекiту туралы

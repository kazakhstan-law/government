title:
  rus: Об утверждении Правил определения ежемесячного дохода, принимаемого для исчисления добровольных профессиональных пенсионных взносов, и Перечня профессий работников, в пользу которых вкладчиками за счет собственных средств осуществляются добровольные профессиональные пенсионные взносы
  kaz: Ерiктi кәсiптiк зейнетақы жарналарын есептеу үшiн қабылданатын ай сайынғы табысты белгілеу ережесiн және Салымшылар өз қаражаты есебiнен олардың пайдасына epiктi кәсiптiк зейнетақы жарналарын жүзеге асыратын қызметкерлер кәсiптерiнiң тiзбесiн бекiту туралы

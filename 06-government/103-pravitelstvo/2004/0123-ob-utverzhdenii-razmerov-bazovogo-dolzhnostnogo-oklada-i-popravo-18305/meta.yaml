  title:
    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 23 января 2004 года № 74 "Об установлении размеров базового должностного оклада, поправочного коэффициента, а также повышающего коэффициента для отдельных категорий государственных служащих"
    kaz: '"Базалық лауазымдық жалақының, түзету коэффициентінің, сондай-ақ мемлекеттік қызметшілердің жекелеген санаттарына арналған жоғарылату коэффициентінің мөлшерлерін белгілеу туралы" Қазақстан Республикасы Үкіметінің 2004 жылғы 23 қаңтардағы № 74 қаулысына толықтыру енгізу туралы'

  title:
    rus: О признании утратившими силу постановления Правительства Республики Казахстан от 17 марта 2003 года № 254 «Об утверждении Правил прекращения требований по кредитам, предоставленным из местного бюджета» и пункта 5 изменений, которые вносятся в некоторые решения Правительства Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 29 января 2004 года № 100 «Вопросы Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция)»
    kaz: «Жергiлiктi бюджеттен берiлген кредиттер бойынша талаптарды тоқтату ережесiн бекiту туралы» Қазақстан Республикасы Үкіметінің 2003 жылғы 17 наурыздағы № 254 қаулысының және «Қазақстан Республикасы Экономикалық және сыбайлас жемқорлық қылмысқа қарсы күрес жөнiндегi агенттiгінің (қаржы полициясы) мәселелерi» туралы Қазақстан Республикасы Үкіметінің 2004 жылғы 29 қаңтардағы № 100 қаулысымен бекітілген Қазақстан Республикасы Үкіметінің кейбір шешімдеріне енгізілетін өзгерістердің 5-тармағының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/162706/rus

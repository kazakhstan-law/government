title:
  rus: О создании государственного учреждения "Щучинская районная эксплуатационная часть" Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінiң "Щучинск аудандық пайдалану бөлiмі" мемлекеттiк мекемесiн құру туралы

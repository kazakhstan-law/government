  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 27 апреля 2004 года № 470 "О некоторых вопросах системы гарантирования исполнения обязательств по зерновым распискам" и от 5 сентября 2007 года № 769 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к деятельности по приемке, взвешиванию, сушке, очистке, хранению и отгрузке зерна"
    kaz: Қазақстан Республикасы Үкіметінің "Астық қолхаттары бойынша міндеттемелерді орындауға кепілдік беру жүйесінің кейбір мәселелері туралы" 2004 жылғы 27 сәуірдегі № 470 және "Астықты қабылдау, өлшеу, кептіру, тазалау, сақтау және тиеп жөнелту жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" 2007 жылғы 5 қыркүйектегі № 769 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/63248/rus

title:
  rus: Об утверждении государственных образовательных заказов на подготовку специалистов со средним профессиональным образованием в организациях образования, получающих средства из республиканского бюджета, с высшим профессиональным и послевузовским профессиональным образованием на 2004/2005 учебный год
  kaz: Республикалық бюджеттен қаражат алатын бiлiм беру ұйымдарында кәсiптiк орта бiлiмдi, кәсiптiк жоғары бiлiмдi және жоғары оқу орнынан кейiнгi кәсiптiк бiлiмдi мамандар даярлауға 2004/2005 оқу жылына арналған мемлекеттiк бiлiм беру тапсырыстарын бекiту туралы

act_code: '20606'
requisite: Постановление Правительства Республики Казахстан от 19 июля 2004 года N 769
title:
  rus: О некоторых вопросах распределения и использования целевых инвестиционных трансфертов областными бюджетами, бюджетами городов Астаны и Алматы в 2004 году на строительство жилья государственного коммунального жилищного фонда
  kaz: Облыстық бюджеттердiң, Астана және Алматы қалалары бюджеттерiнiң 2004 жылы мемлекеттiк коммуналдық тұрғын үй қорының тұрғын үй құрылысына мақсатты инвестициялық трансферттердi бөлуi мен пайдалануының кейбiр мәселелерi туралы

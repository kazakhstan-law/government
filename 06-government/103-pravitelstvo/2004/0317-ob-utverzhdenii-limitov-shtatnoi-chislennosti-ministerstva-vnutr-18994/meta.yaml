title:
  rus: Об утверждении лимитов штатной численности Министерства внутренних дел, Министерства юстиции, Агентства по борьбе с экономической и коррупционной преступностью (финансовая полиция) Республики Казахстан и подведомственных им государственных учреждений
  kaz: Қазақстан Республикасының Iшкi iстер, Әдiлет министрлiктерi, Экономикалық және сыбайлас жемқорлық қылмысқа қарсы күрес жөнiндегi агенттiгi (қаржы полициясы) және оларға ведомстволық бағыныстағы мемлекеттiк мекемелер штат санының лимиттерін бекiту туралы

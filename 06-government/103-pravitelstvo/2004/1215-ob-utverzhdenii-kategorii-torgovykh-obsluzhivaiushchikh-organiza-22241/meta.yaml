title:
  rus: Об утверждении категорий торговых (обслуживающих) организаций, обязанных принимать платежи с использованием платежных карточек при осуществлении торговых операций (оказании услуг) на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағында сауда операцияларын жүзеге асыру (қызметтер көрсету) кезiнде төлем карточкаларын пайдалана отырып, төлемдер қабылдауға мiндеттi сауда (қызмет көрсету) ұйымдарының санаттарын бекiту туралы

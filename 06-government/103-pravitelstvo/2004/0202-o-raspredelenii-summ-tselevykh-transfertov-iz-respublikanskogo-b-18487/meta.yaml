title:
  rus: О распределении сумм целевых трансфертов из республиканского бюджета 2004 года на обеспечение функционирования общеобразовательных учебных заведений, переданных с баланса закрытого акционерного общества "Национальная компания "Казакстан темiр жолы"
  kaz: '"Қазақстан темiр жолы" ұлттық компаниясы" жабық акционерлiк қоғамының теңгерiмiнен берiлген жалпы бiлiм беретiн оқу орындарының жұмыс iстeуiн қамтамасыз етуге 2004 жылға арналған республикалық бюджеттен мақсатты трансферттердiң сомаларын бөлу туралы'

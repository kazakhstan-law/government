title:
  rus: О целевых текущих трансфертах областным бюджетам, бюджетам городов Астаны и Алматы на закуп лекарственных средств, вакцин и других иммунобиологических препаратов
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттерiне дәрiлiк заттарды, вакциналарды және басқа да иммундық-биологиялық препараттарды сатып алуға берілетiн ағымдағы нысаналы трансферттер туралы

title:
  rus: Об утверждении форм, правил и сроков представления сведений, необходимых для осуществления мониторинга деятельности производителей нефтепродуктов, поставщиков нефти и лиц, осуществляющих реализацию с баз нефтепродуктов
  kaz: Мұнай өнiмдерiн өндiрушiлердiң, мұнайды жеткiзушiлердiң және мұнай өнiмдерiн базалардан сатуды жүзеге асыратын тұлғалардың қызметiне мониторингтi жүзеге асыру үшiн қажеттi мәлiметтердi ұсыну нысандарын, ережелерi мен мерзiмдерiн бекiту туралы

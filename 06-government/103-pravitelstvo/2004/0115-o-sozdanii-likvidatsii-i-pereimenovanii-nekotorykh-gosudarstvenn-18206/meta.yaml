title:
  rus: О создании, ликвидации и переименовании некоторых государственных учреждений Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлiгінiң кейбiр мемлекеттiк мекемелерiн құру, тарату және қайта атау туралы

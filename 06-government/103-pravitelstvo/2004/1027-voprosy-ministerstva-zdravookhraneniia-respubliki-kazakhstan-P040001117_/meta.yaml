  requisite: Постановление Правительства Республики Казахстан от 16 мая 2014 года № 501
  title:
    rus: О реорганизации Республиканского государственного предприятия на праве хозяйственного ведения "Алматинский государственный институт усовершенствования врачей" Министерства здравоохранения Республики Казахстан
    kaz: Қазақстан Республикасы Денсаулық сақтау министрлігінің "Алматы мемлекеттік дәрігерлер білімін жетілдіру институты" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнын қайта ұйымдастыру туралы
  link: https://zan.gov.kz/client/#!/doc/79965/rus

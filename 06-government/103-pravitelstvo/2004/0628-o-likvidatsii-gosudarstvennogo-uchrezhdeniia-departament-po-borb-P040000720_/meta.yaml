title:
  rus: О ликвидации государственного учреждения "Департамент по борьбе с экономической и коррупционной преступностью (финансовая полиция) на транспорте Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция)"
  kaz: '"Қазақстан Республикасы Экономикалық және сыбайлас жемқорлық қылмысқа қарсы күрес жөнiндегi агенттігінің (қаржы полициясы) Көліктегi экономикалық және сыбайлас жемқорлық қылмысқа қарсы күрес жөнiндегi департаментi (қаржы полициясы)" мемлекеттiк мекемесiн тарату туралы'

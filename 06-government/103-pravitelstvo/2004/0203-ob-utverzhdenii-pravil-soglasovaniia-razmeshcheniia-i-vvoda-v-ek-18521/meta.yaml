title:
  rus: Об утверждении Правил согласования, размещения и ввода в эксплуатацию предприятий и других сооружений, влияющих на состояние вод, а также условий производства строительных и других работ на водных объектах, водоохранных зонах и полосах
  kaz: Судың жай-күйiне әсер ететін кәсіпорындар мен басқа да құрылыстарды келісу, оларды орналастыру және пайдалануға беру ережесiн, сондай-ақ су объектiлерiнде, су қорғау аймақтары мен белдеулерiнде құрылыс және басқа да жұмыстар жүргiзу шарттарын бекiту туралы

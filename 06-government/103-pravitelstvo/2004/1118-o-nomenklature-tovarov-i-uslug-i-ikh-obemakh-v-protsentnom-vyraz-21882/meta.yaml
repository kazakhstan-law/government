  code: '23474'
  requisite: Постановление Правительства Республики Казахстан от 8 апреля 2005 года № 318. Утратило силу постановлением Правительства Республики Казахстан от 9 ноября 2010 года № 1177
  title:
    rus: Об утверждении перечня товаров, приобретение которых государственными предприятиями, юридическими лицами, пятьдесят и более процентов акций (долей) или контрольный пакет акций которых принадлежат государству, и аффилиированными с ними юридическими лицами (за исключением субъектов естественных монополий), с целью их последующей оптово-розничной реализации не является предметом государственных закупок
    kaz: Акцияларының (үлестерiнiң) елу және одан көп пайызы немесе акцияларының бақылау пакетi мемлекетке тиесiлi мемлекеттiк кәсiпорындардың, заңды тұлғалардың және олармен аффилиирленген заңды тұлғалардың (табиғи монополиялар субъектiлерiн қоспағанда) тауарларды кейiннен көтерме-бөлшек саудада сату мақсатында сатып алуы мемлекеттiк сатып алу мәнi болып табылмайтын тауарлардың тiзбесiн бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/23474/rus

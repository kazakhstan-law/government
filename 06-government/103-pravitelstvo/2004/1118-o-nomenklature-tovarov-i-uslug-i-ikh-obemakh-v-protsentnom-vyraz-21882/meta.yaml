act_code: '21882'
requisite: Постановление Правительства Республики Казахстан от 18 ноября 2004 года N 1213
title:
  rus: О номенклатуре товаров и услуг и их объемах (в процентном выражении), закупаемых организаторами конкурса у организаций, производящих товары и услуги, создаваемых общественными объединениями инвалидов Республики Казахстан, на 2005 год
  kaz: Қазақстан Республикасы мүгедектерiнiң қоғамдық бiрлестiктерi құратын, тауарлар мен қызметтердi өндiретiн ұйымдардан конкурсты ұйымдастырушылар сатып алатын тауарлар мен қызметтердiң 2005 жылға арналған номенклатурасы мен олардың көлемi (пайызбен көрсеткенде) туралы

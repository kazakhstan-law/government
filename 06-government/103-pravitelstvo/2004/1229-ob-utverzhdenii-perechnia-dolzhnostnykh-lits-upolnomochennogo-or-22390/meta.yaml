act_code: '22390'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2004 года № 1415. Утратило силу постановлением Правительства Республики Казахстан от 4 сентября 2015 года № 745
title:
  rus: Об утверждении Перечня должностных лиц уполномоченного органа и территориальных подразделений, осуществляющих государственный контроль и надзор в области охраны, воспроизводства и использования животного мира, а также работников государственных учреждений и организаций, осуществляющих непосредственную охрану животного мира, имеющих право на ношение форменной одежды со знаками различия (без погон)
  kaz: Айырым белгілері бар нысанды киiм (погонсыз) киiп жүруге құқығы бар жануарлар дүниесiн қорғау, өсiмiн молайту және пайдалану саласында мемлекеттiк бақылау мен қадағалауды жүзеге асыратын уәкiлеттi орган мен аумақтық бөлімшелердің лауазымды адамдарының, сондай-ақ жануарлар дүниесiн тiкелей қорғауды жүзеге асыратын мемлекеттiк мекемелер мен ұйымдар қызметкерлерiнiң тiзбесiн бекiту туралы

  title:
    rus: О создании государственных учреждений - управления юстиции Мунайлинского района Департамента юстиции Мангистауской области Министерства юстиции Республики Казахстан и Мунайлинской районной территориальной инспекции Комитета государственной инспекции в агропромышленном комплексе Министерства сельского хозяйства Республики Казахстан
    kaz: Қазақстан Республикасы Әділет министрлігі Маңғыстау облысының Әділет департаменті Мұнайлы ауданының Әділет басқармасы және Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешендегі мемлекеттік инспекция комитетінің Мұнайлы аудандық аумақтық инспекциясы мемлекеттік мекемелерін құру туралы

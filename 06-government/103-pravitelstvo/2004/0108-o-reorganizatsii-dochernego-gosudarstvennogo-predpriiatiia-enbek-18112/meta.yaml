title:
  rus: О реорганизации дочернего государственного предприятия "Енбек-Кокшетау" Республиканского государственного предприятия "Енбек-Астана" исправительных учреждений Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан
  kaz: Қазақстан Республикасы Әдiлет министрлiгiнiң Қылмыстық-атқару жүйесi комитетiнiң түзеу мекемелерi "Еңбек-Астана" республикалық мемлекеттiк кәсiпорнының "Еңбек-Көкшетау" еншiлес мемлекеттiк кәсiпорнын қайта ұйымдастыру туралы

requisite: Постановление Правительства Республики Казахстан от 5 февраля 2004 года N 139. Утратило силу постановлением Правительства Республики Казахстан от 30 декабря 2009 года N 2270
title:
  rus: Об утверждении Правил осуществления ограничительных мероприятий, в том числе карантина, и перечня инфекционных заболеваний, при угрозе возникновения и распространения которых вводятся ограничительные мероприятия, в том числе карантин
  kaz: Жұқпалы ауруларды шектеу iс-шараларын, оның iшiнде карантиндi жүзеге асыру ережесiн және жұқпалы аурулардың пайда болу және таралу қаупі төнген кезде шектеу iс-шаралары, оның ішiнде карантин енгізілетiн тiзбесiн бекiту туралы

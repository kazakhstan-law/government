title:
  rus: Об утверждении Правил введения временного государственного управления водохозяйственными сооружениями, имеющими важное стратегическое значение для экономики республики и региона
  kaz: Республика және өңiр экономикасы үшiн маңызды стратегиялық мәнi бар су шаруашылығы құрылыстарын уақытша мемлекеттiк басқаруды енгiзу ережесiн бекiту туралы

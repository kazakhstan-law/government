    kaz: Қазақстан Республикасы Экономикалық даму және сауда министрлігінің "Арнайы бағдарламалардың ғылыми-әдістемелік орталығы" республикалық мемлекеттік қазыналық кәсіпорнын тарату және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер енгізу туралы

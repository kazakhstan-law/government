    kaz: «1993 жылғы 22 қаңтардағы Азаматтық, отбасылық және қылмыстық істер бойынша құқықтық көмек пен құқықтық қатынастар туралы конвенцияны және 2002 жылғы 7 қазандағы Азаматтық, отбасылық және қылмыстық iстер бойынша құқықтық көмек пен құқықтық қатынастар туралы конвенцияны iске асыру жөнiндегi шаралар туралы» Қазақстан Республикасы Үкіметінің 2004 жылғы 31 желтоқсандағы № 1453 қаулысына өзгерістер мен толықтырулар енгізу туралы

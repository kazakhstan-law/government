act_code: '19070'
requisite: Постановление Правительства Республики Казахстан от 20 марта 2004 года N 363
title:
  rus: О некоторых вопросах распределения целевых трансфертов из республиканского бюджета областным бюджетам, бюджетам городов Астаны и Алматы на обеспечение сурдо- и тифлосредствами детей-инвалидов с нарушениями слуха и зрения, обучающихся в специализированных организациях образования, финансируемых из местных бюджетов
  kaz: Жергiлiктi бюджеттерден қаржыландырылатын, мамандандырылған бiлiм беру ұйымдарында оқитын, есту және көру қабiлетi бұзылған мүгедек балаларды сурдо және тифлоқұралдармен қамтамасыз ету үшiн республикалық бюджеттен облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттерiне мақсатты трансферттер бөлудiң кейбiр мәселелерi туралы

  title:
    rus: О реорганизации некоторых республиканских государственных казенных предприятий, находящихся в ведении Министерства юстиции Республики Казахстан и внесении изменений и дополнения в постановления Правительства Республики Казахстан от 28 октября 2004 года № 1120 "Вопросы Министерства юстиции Республики Казахстан" и от 11 июня 2007 года № 483 "О некоторых вопросах республиканской государственной собственности"
    kaz: Қазақстан Республикасы Әділет министрлігінің қарамағындағы кейбір республикалық мемлекеттік қазыналық кәсіпорындарды қайта ұйымдастыру және Қазақстан Республикасы Үкіметінің "Қазақстан Республикасы Әділет министрлігінің мәселелері" туралы 2004 жылғы 28 қазандағы № 1120 және "Республикалық мемлекеттік меншіктің кейбір мәселелері туралы" 2007 жылғы 11 маусымдағы № 483 қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/12950/rus

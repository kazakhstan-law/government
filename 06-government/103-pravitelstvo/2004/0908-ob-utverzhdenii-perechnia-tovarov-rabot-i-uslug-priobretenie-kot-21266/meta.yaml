title:
  rus: Об утверждении Перечня товаров, работ и услуг, приобретение которых организациями по основному предмету деятельности, осуществляемое в соответствии с международными соглашениями Республики Казахстан, не является предметом государственных закупок
  kaz: Қазақстан Республикасының халықаралық келiсiмдерiне сәйкес жүзеге асырылатын қызметтiң негiзгi мәнi бойынша оларды ұйымдардың сатып алуы мемлекеттiк сатып алудың мәнi болып табылмайтын тауарлардың, жұмыстар мен қызметтердiң тiзбесiн бекiту туралы

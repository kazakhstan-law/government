  requisite: Постановление Правительства Республики Казахстан от 18 февраля 2022 года № 71
  title:
    rus: О присвоении Кызылординскому гидроузлу на реке Сырдарья республиканского государственного предприятия на праве хозяйственного ведения «Казводхоз» Комитета по водным ресурсам Министерства экологии, геологии и природных ресурсов Республики Казахстан имени Сабыра Арыстанбаева и внесении изменений в постановления Правительства Республики Казахстан от 21 декабря 2004 года № 1344 «Об утверждении перечня водохозяйственных сооружений, находящихся в республиканской собственности» и от 29 декабря 2017 года № 933 «О перечне водохозяйственных сооружений, имеющих особое стратегическое значение, в том числе которые могут быть переданы в аренду и доверительное управление»
    kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Су ресурстары комитеті «Қазсушар» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнының Сырдария өзеніндегі Қызылорда гидроторабына Сабыр Арыстанбаевтың есімін беру және Қазақстан Республикасы Үкіметінің «Республикалық меншіктегі су шаруашылығы құрылыстарының тізбесін бекіту туралы» 2004 жылғы 21 желтоқсандағы № 1344 және «Ерекше стратегиялық маңызы бар, оның ішінде жалға және сенімгерлік басқаруға берілуі мүмкін су шаруашылығы құрылыстарының тізбесі туралы» 2017 жылғы 29 желтоқсандағы № 933 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164631/rus

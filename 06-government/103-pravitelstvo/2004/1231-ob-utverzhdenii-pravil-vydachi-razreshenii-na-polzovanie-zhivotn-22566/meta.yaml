    kaz: Қазақстан Республикасы Қоршаған орта және су ресурстары министрлігі көрсететін мемлекеттік қызметтер стандарттарын бекіту, Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiнiң күшi жойылды деп тану туралы

title:
  rus: Об утверждении Правил обеспечения государственных организаций здравоохранения медицинским оборудованием, изделиями медицинского и санитарно-гигиенического назначения и лекарственными средствами, закупаемыми централизованно за счет средств республиканского бюджета
  kaz: Мемлекеттік денсаулық сақтау ұйымдарын республикалық бюджет қаражаты есебiнен орталықтандырылып сатып алынатын медициналық жабдықтармен, медициналық және санитарлық-гигиеналық мақсаттағы бұйымдармен және дәрілік заттармен қамтамасыз ету ережесiн бекiту туралы

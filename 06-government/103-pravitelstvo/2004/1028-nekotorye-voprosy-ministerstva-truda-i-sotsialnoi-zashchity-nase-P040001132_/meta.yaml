    rus: О передаче Республиканского государственного казенного предприятия "Республиканский пансионат "Ардагер" для ветеранов войны и труда Министерства труда и социальной защиты населения Республики Казахстан" в коммунальную собственность города Алматы
    kaz: '"Қазақстан Республикасы Еңбек және халықты әлеуметтiк қорғау министрлігінiң соғыс және еңбек ардагерлерiне арналған "Ардагер" республикалық пансионаты" республикалық мемлекеттiк қазыналық кәсiпорнын Алматы қаласының коммуналдық меншiгiне беру туралы'

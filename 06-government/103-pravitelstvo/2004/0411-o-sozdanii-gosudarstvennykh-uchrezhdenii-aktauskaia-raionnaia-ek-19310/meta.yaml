title:
  rus: О создании государственных учреждений "Актауская районная эксплуатационная часть" Министерства обороны Республики Казахстан, "Шымкентская районная эксплуатационная часть" Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің "Ақтау аудандық пайдалану бөлімі", Қазақстан Республикасы Қорғаныс министрлігінің "Шымкент аудандық пайдалану бөлімі" мемлекеттік мекемелерін құру туралы

title:
  rus: Об утверждении Правил реализации местными исполнительными органами областей, городов Астаны и Алматы гражданам Республики Казахстан жилья, построенного в рамках реализации Государственной программы развития жилищного строительства в Республике Казахстан на 2005-2007 годы
  kaz: Облыстардың, Астана және Алматы қалалары жергiлiктi атқарушы органдарының Қазақстан Республикасында тұрғын үй құрылысын дамытудың 2005-2007 жылдарға арналған мемлекеттiк бағдарламасын iске асыру шеңберiнде салынған тұрғын үйдi Қазақстан Республикасының азаматтарына сату ережесiн бекiту туралы

act_code: '22563'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2004 года № 1451
title:
  rus: О распределении сумм целевых текущих трансфертов областным бюджетам, бюджетам городов Астаны и Алматы на материально-техническое оснащение государственных центров крови на местном уровне
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттерiне мемлекеттiк қан орталықтарын материалдық-техникалық жарақтандыруға жергiлiктi деңгейде берiлетiн нысаналы ағымдағы трансферттердiң сомасын бөлу туралы

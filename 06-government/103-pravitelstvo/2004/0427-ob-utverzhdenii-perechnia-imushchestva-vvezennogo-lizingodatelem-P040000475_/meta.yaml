title:
  rus: Об утверждении Перечня имущества, ввезенного лизингодателем в целях передачи в финансовый лизинг по договорам финансового лизинга, импорт которого освобождается от налога на добавленную стоимость, и правил его формирования
  kaz: Қаржы лизингі шарттары бойынша қаржы лизингiне беру мақсатында лизинг беруші әкелген, импорты қосылған құн салығынан босатылатын мүлiк тiзбесiн және оны қалыптастыру ережесiн бекiту туралы

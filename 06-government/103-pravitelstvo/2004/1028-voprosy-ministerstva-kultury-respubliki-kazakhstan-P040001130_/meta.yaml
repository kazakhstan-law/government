  title:
    rus: О создании специализированных советов по вопросам государственного корпоративного управления при Правительстве Республики Казахстан и о внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Үкіметінің жанынан мемлекеттік корпоративтік басқару мәселелері жөніндегі мамандандырылған кеңестер құру туралы және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

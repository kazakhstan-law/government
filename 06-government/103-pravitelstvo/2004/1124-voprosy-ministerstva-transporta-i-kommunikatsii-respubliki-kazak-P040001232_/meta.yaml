  requisite: Постановление Правительства Республики Казахстан от 1 февраля 2013 года № 79
  title:
    rus: О реорганизации дочернего государственного предприятия "Казахавтодор-Кокшетау" Республиканского государственного предприятия на праве хозяйственного ведения "Казахавтодор" Комитета автомобильных дорог Министерства транспорта и коммуникаций Республики Казахстан
    kaz: Қазақстан Республикасы Көлiк және коммуникация министрлiгi Автомобиль жолдары комитетiнiң "Қазақавтожол" шаруашылық жүргiзу құқығындағы республикалық мемлекеттiк кәсiпорнының "Қазақавтожол-Көкшетау" еншiлес мемлекеттiк кәсiпорнын қайта ұйымдастыру туралы
  link: https://zan.gov.kz/client/#!/doc/70731/rus

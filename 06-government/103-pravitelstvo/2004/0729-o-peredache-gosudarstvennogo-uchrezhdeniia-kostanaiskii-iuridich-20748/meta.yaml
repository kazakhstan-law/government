title:
  rus: О передаче государственного учреждения "Костанайский юридический институт Министерства внутренних дел Республики Казахстан" из ведения Министерства внутренних дел Республики Казахстан в ведение Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан
  kaz: '"Қазақстан Республикасы Ішкі істер министрлiгінiң Қостанай заң институты" мемлекеттік мекемесiн Қазақстан Республикасы Iшкi істер министрлiгінiң қарамағынан Қазақстан Республикасының Әдiлет министрлігі Қылмыстық-атқару жүйесi комитетiнiң қарамағына беру туралы'

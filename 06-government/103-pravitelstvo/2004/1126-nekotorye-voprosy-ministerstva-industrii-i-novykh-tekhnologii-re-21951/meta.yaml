  title:
    rus: Об утверждении Правил ввоза на территорию Республики Казахстан из стран, не входящих в Таможенный союз, и вывоза с территории Республики Казахстан в эти страны драгоценных металлов и сырьевых товаров, содержащих драгоценные металлы и о внесении дополнений в постановление Правительства Республики Казахстан от 26 ноября 2004 года № 1237 "Некоторые вопросы Министерства индустрии и новых технологий Республики Казахстан"
    kaz: Бағалы металдарды және құрамында бағалы металдар бар шикізат тауарларын Кеден одағына кірмейтін елдерден Қазақстан Республикасының аумағына әкелу және Қазақстан Республикасының аумағынан осы елдерге әкету қағидасын бекіту туралы және «Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігінің кейбір мәселелері» туралы Қазақстан Республикасы Үкіметінің 2004 жылғы 26 қарашадағы № 1237 қаулысына толықтырулар енгізу туралы

title:
  rus: Об утверждении Перечня специально уполномоченных органов, осуществляющих функции охраны окружающей среды, управления природопользованием и государственного контроля в этой области, и Правил организации их деятельности
  kaz: Қоршаған ортаны қорғау, табиғат пайдалануды басқару және осы салада мемлекеттік бақылау функцияларын жүзеге асыратын арнайы уәкiлетті органдардың тiзбесiн және олардың қызметiн ұйымдастыру ережесiн бекiту туралы

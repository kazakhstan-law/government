title:
  rus: Об утверждении Перечня автомобильных пунктов пропуска через Государственную границу Республики Казахстан и стационарных постов транспортного контроля на территории Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік шекарасы арқылы автомобиль өткiзу пункттерінің және Қазақстан Республикасының аумағындағы стационарлық көлiктiк бақылау посттарының тiзбесiн бекiту туралы

    kaz: '"Қазақстан Республикасы Мемлекеттiк қызмет iстерi агенттігінiң облыстардағы, Астана және Алматы қалаларындағы тәртiптiк кеңестерi және Қазақстан Республикасы Президентiнiң кейбiр жарлықтарына өзгерiстер мен толықтырулар енгiзу туралы" Қазақстан Республикасы Президентiнiң Жарлығын iске асыру туралы'

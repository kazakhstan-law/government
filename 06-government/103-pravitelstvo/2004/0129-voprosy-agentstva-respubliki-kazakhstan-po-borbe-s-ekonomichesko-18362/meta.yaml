title:
  rus: Вопросы Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция)
  kaz: Қазақстан Республикасы Экономикалық және сыбайлас жемқорлық қылмысқа қарсы күрес жөнiндегi агенттiгінің (қаржы полициясы) мәселелерi

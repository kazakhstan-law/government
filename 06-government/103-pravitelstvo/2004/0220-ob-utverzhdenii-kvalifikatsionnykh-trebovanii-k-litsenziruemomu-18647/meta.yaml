title:
  rus: Об утверждении квалификационных требований к лицензируемому виду деятельности по удостоверению соответствия открытого ключа электронной цифровой подписи закрытому ключу электронной цифровой подписи, а также по подтверждению достоверности регистрационного свидетельства
  kaz: Электрондық цифрлық қолтаңбаның ашық кiлтiнiң электрондық цифрлық қолтаңбаның жабық кiлтiне сәйкестiгiн куәландыру жөнiндегi, сондай-ақ тiркеу куәлiгiнiң шынайылығын растау жөнiндегi лицензияланатын қызмет түрiне қойылатын бiлiктiлiк талаптарын бекiту туралы

  requisite: Постановление Правительства Республики Казахстан от 19 августа 2020 года № 524
  title:
    rus: Об утверждении Протокола о внесении изменений в Протокол между Правительством Республики Казахстан, Правительством Кыргызской Республики, Правительством Российской Федерации и Правительством Республики Таджикистан о принципах и порядке взаимодействия по выполнению Соглашения между Республикой Казахстан, Кыргызской Республикой, Российской Федерацией, Республикой Таджикистан и Китайской Народной Республикой об укреплении доверия в военной области в районе границы от 26 апреля 1996 года и Соглашения между Республикой Казахстан, Кыргызской Республикой, Российской Федерацией, Республикой Таджикистан и Китайской Народной Республикой о взаимном сокращении вооруженных сил в районе границы от 24 апреля 1997 года, совершенный в городе Москве 23 ноября 2002 года
    kaz: 1996 жылғы 26 сәуірдегі Қазақстан Республикасы, Қырғыз Республикасы, Ресей Федерациясы, Тәжікстан Республикасы және Қытай Халық Республикасы арасындағы шекара ауданында әскери саладағы сенімділікті нығайту туралы келісімді және 1997 жылғы 24 сәуірдегі Қазақстан Республикасы, Қырғыз Республикасы, Ресей Федерациясы, Тәжікстан Республикасы және Қытай Халық Республикасы арасындағы шекара ауданында қарулы күштерді өзара қысқарту туралы келісімді орындау жөніндегі Қазақстан Республикасының Үкіметі, Қырғыз Республикасының Үкіметі, Ресей Федерациясының Үкіметі және Тәжікстан Республикасының Үкіметі арасындағы өзара іс-қимыл қағидаттары мен тәртібі туралы хаттамаға өзгерістер енгізу туралы 2002 жылғы 23 қарашада Мәскеу қаласында жасалған хаттаманы бекіту туралы

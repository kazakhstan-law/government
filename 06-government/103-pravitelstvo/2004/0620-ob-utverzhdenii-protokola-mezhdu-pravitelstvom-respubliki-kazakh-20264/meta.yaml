act_code: '20264'
requisite: Постановление Правительства Республики Казахстан от 21 июня 2004 года N 679
title:
  rus: Об утверждении Протокола между Правительством Республики Казахстан, Правительством Кыргызской Республики, Правительством Российской Федерации и Правительством Республики Таджикистан о принципах и порядке взаимодействия по выполнению Соглашения между Российской Федерацией, Республикой Казахстан, Кыргызской Республикой, Республикой Таджикистан и Китайской Народной Республикой об укреплении доверия в военной области в районе границы от 26 апреля 1996 года и Соглашения между Российской Федерацией, Республикой Казахстан, Кыргызской Республикой, Республикой Таджикистан и Китайской Народной Республикой о взаимном сокращении вооруженных сил в районе границы от 24 апреля 1997 года
  kaz: Ресей Федерациясы, Қазақстан Республикасы, Қырғыз Республикасы, Тәжiкстан Республикасы және Қытай Халық Республикасы арасындағы шекара ауданында әскери саладағы сенімдiлiкті нығайту туралы 1996 жылғы 26 сәуiрдегi келiсiмдi және Ресей Федерациясы, Қазақстан Республикасы, Қырғыз Республикасы, Тәжікстан Республикасы және Қытай Халық Республикасы арасындағы шекара ауданында қарулы күштердi өзара қысқарту туралы 1997 жылғы 24 сәуiрдегі келiсiмдi орындау жөніндегі Қазақстан Республикасының Yкiметi, Қырғыз Республикасының Yкiметi, Ресей Федерациясының Yкiметi, және Тәжiкстан Республикасының Үкiметi арасындағы өзара іс-қимыл қағидаттары мен тәртiбi туралы хаттаманы бекiту туралы

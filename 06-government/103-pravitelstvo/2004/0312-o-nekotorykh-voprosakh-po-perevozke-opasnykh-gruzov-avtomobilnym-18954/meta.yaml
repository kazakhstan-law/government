  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 12 марта 2004 года № 316 "О некоторых вопросах по перевозке опасных грузов автомобильным транспортом" и признании утратившим силу постановления Правительства Республики Казахстан от 27 июля 2012 года № 979 "Об утверждении стандартов государственных услуг Министерства транспорта и коммуникаций Республики Казахстан в сфере автомобильного транспорта и внесении изменений в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: '"Автомобиль көлiгiмен қауiптi жүктерді тасымалдау жөнiндегi кейбір мәселелер туралы" Қазақстан Республикасы Үкiметiнiң 2004 жылғы 12 наурыздағы № 316 қаулысына өзгерістер енгізу және "Қазақстан Республикасы Көлік және коммуникация министрлігінің автомобиль көлігі саласындағы мемлекеттік қызмет стандарттарын бекіту және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулысына өзгерістер енгізу туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 27 шілдедегі № 979 қаулысының күші жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/71668/rus

caused_by:
  code: '164712'
  requisite: Постановление Правительства Республики Казахстан от 23 февраля 2022 года № 79
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 15 декабря 2004 года № 1324 «О некоторых вопросах утверждения лимитов штатной численности местных исполнительных органов» и от 9 декабря 2021 года № 874 «О внесении изменений в постановления Правительства Республики Казахстан от 15 декабря 2004 года № 1324 «О некоторых вопросах утверждения лимитов штатной численности местных исполнительных органов» и от 15 апреля 2008 года № 339 «Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений»
    kaz: Қазақстан Республикасы Үкіметінің «Жергiлiктi атқарушы органдардың штат санының лимиттерiн бекiтудiң кейбiр мәселелерi туралы» 2004 жылғы 15 желтоқсандағы № 1324 және «Қазақстан Республикасы Үкіметінің «Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы» 2004 жылғы 15 желтоқсандағы № 1324 және «Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы» 2008 жылғы 15 сәуірдегі № 339 қаулыларына өзгерiстер енгiзу туралы» 2021 жылғы 9 желтоқсандағы № 874 қаулыларына өзгерiстер енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/164712/rus

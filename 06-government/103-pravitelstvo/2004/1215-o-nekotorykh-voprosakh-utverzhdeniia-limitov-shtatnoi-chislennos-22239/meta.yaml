  requisite: Постановление Правительства Республики Казахстан от 12 ноября 2012 года № 1436. Утратило силу постановлением Правительства Республики Казахстан от 27 июня 2025 года № 480 (вводится в действие со дня его подписания)
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 23 октября 2009 года № 1654 "Об утверждении типовой структуры местного государственного управления Республики Казахстан и признании утратившими силу некоторых решений Правительства Республики Казахстан" и от 15 декабря 2004 года № 1324 "О некоторых вопросах утверждения лимитов штатной численности местных исполнительных органов"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасының жергілікті мемлекеттік басқару үлгі құрылымын бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы" 2009 жылғы 23 қазандағы № 1654 және "Жергілікті атқарушы органдардың штат санының лимиттерін бекітудің кейбір мәселелері туралы" 2004 жылғы 15 желтоқсандағы № 1324 қаулыларына өзгерістер мен толықтырулар енгізу туралы

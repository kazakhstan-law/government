act_code: '18298'
requisite: Постановление Правительства Республики Казахстан от 22 января 2004 года № 65. Утратило силу постановлением Правительства Республики Казахстан от 2 октября 2010 года № 1014
title:
  rus: Об утверждении категорий должностных лиц таможенных органов, осуществляющих функции правоохранительных органов в соответствии с законодательными актами, наделенных правом ношения, хранения и пользования огнестрельным оружием, перечней видов огнестрельного оружия и боеприпасов и специальных средств, применяемых должностными лицами таможенных органов
  kaz: Заңнамалық кесiмдерге сәйкес құқық қорғау органдарының функцияларын жүзеге асыратын, атыс қаруын алып жүру, сақтау және пайдалану құқығы берiлген кеден органдары лауазымды адамдарының санаттарын және кеден органдарының лауазымды адамдары қолданатын атыс қаруы мен оқ-дәрiлер және арнаулы құралдар түрлерiнiң тізбелерiн бекiту туралы

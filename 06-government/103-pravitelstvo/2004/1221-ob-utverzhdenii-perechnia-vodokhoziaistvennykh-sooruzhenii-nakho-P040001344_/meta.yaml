  title:
    rus: О принятии государственного коммунального предприятия на праве хозяйственного ведения "Акмола су арнасы" при отделе жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог Коргалжынского района Акмолинской области из коммунальной собственности в республиканскую собственность
    kaz: Ақмола облысы Қорғалжын ауданының тұрғын үй-коммуналдық шаруашылығы, жолаушылар көлігі және автомобиль жолдары бөлімінің жанындағы "Ақмола су арнасы" шаруашылық жүргізу құқығындағы мемлекеттік коммуналдық кәсіпорнын коммуналдық меншіктен республикалық меншікке қабылдау туралы

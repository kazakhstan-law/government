act_code: '159255'
requisite: Постановление Правительства Республики Казахстан от 4 октября 2021 года № 703
title:
  rus: Об утверждении Правил формирования позиции Правительства Республики Казахстан по вопросам участия в Евразийском экономическом союзе, а также взаимодействия центральных исполнительных органов, государственных органов, непосредственно подчиненных и подотчетных Президенту Республики Казахстан, субъектов квазигосударственного сектора и Национальной палаты предпринимателей Республики Казахстан с Евразийской экономической комиссией
  kaz: Еуразиялық экономикалық одаққа қатысу мәселелері бойынша Қазақстан Республикасы Үкіметінің ұстанымын қалыптастыру, сондай-ақ орталық атқарушы органдардың, Қазақстан Республикасының Президентіне тікелей бағынатын және есеп беретін мемлекеттік органдардың, квазимемлекеттік сектор субъектілерінің және Қазақстан Республикасың Ұлттық кәсіпкерлер палатасының Еуразиялық экономикалық комиссиямен өзара іс-қимылы қағидаларын бекіту туралы

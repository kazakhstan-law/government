caused_by:
  code: '180771'
  requisite: Постановление Правительства Республики Казахстан от 25 апреля 2023 года № 322
  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 4 октября 2021 года № 703 «Об утверждении Правил формирования позиции Правительства Республики Казахстан по вопросам участия в Евразийском экономическом союзе, а также взаимодействия центральных исполнительных органов, государственных органов, непосредственно подчиненных и подотчетных Президенту Республики Казахстан, субъектов квазигосударственного сектора и Национальной палаты предпринимателей Республики Казахстан с Евразийской экономической комиссией»
    kaz: «Еуразиялық экономикалық одаққа қатысу мәселелері бойынша Қазақстан Республикасы Үкіметінің ұстанымын қалыптастыру, сондай-ақ орталық атқарушы органдардың, Қазақстан Республикасының Президентіне тікелей бағынатын және есеп беретін мемлекеттік органдардың, квазимемлекеттік сектор субъектілерінің және Қазақстан Республикасының Ұлттық кәсіпкерлер палатасының Еуразиялық экономикалық комиссиямен өзара іс-қимылы қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 4 қазандағы № 703 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/180771/rus

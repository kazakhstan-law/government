act_code: '153202'
requisite: Постановление Правительства Республики Казахстан от 26 февраля 2021 года № 98
title:
  rus: О мерах по реализации Указа Президента Республики Казахстан от 28 января 2021 года № 501 «О мерах по дальнейшему совершенствованию системы государственного управления Республики Казахстан»
  kaz: «Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2021 жылғы 28 қаңтардағы № 501 Жарлығын іске асыру жөніндегі шаралар туралы

caused_by:
  code: '165461'
  requisite: Постановление Правительства Республики Казахстан от 18 марта 2022 года № 143
  title:
    rus: О признании утратившими силу постановления Правительства Республики Казахстан от 3 мая 2017 года № 243 «Об утверждении Правил проведения оценки рисков легализации (отмывания) доходов и финансирования терроризма» и пункта 8 изменений и дополнений, которые вносятся в некоторые решения Правительства Республики Казахстан и распоряжения Премьер-Министра Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 26 февраля 2021 года № 98 «О мерах по реализации Указа Президента Республики Казахстан от 28 января 2021 года № 501 «О мерах по дальнейшему совершенствованию системы государственного управления Республики Казахстан»
    kaz: «Кірістерді заңдастыру (жылыстату) және терроризмді қаржыландыру тәуекелдеріне бағалау жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2017 жылғы 3 мамырдағы № 243 қаулысының және «Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2021 жылғы 28 қаңтардағы № 501 Жарлығын іске асыру жөніндегі шаралар туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 26 ақпандағы № 98 қаулысымен бекітілген Қазақстан Республикасы Үкіметінің кейбір шешімдеріне және Қазақстан Республикасы Премьер-Министрінің өкімдеріне енгізілетін өзгерістер мен толықтырулардың 8-тармағының күші жойылды деп тану туралы

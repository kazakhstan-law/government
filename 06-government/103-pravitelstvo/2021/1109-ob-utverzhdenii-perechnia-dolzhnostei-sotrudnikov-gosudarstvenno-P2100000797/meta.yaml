title:
  rus: Об утверждении перечня должностей сотрудников Государственной фельдъегерской службы Республики Казахстан, имеющих право при перемещении и продвижении по службе на подъемное пособие, возмещение затрат на проезд на транспорте и перевозку собственного имущества
  kaz: Қызмет бабымен орын ауыстыруы және ілгерілеуі кезінде көтерме жәрдемақыға, көлікпен жол жүруге және жеке мүлкін тасымалдауға арналған шығындардың өтелуіне құқығы бар Қазақстан Республикасының Мемлекеттік фельдъегерлік қызметі қызметкерлерінің лауазымдар тізбесін бекіту туралы

title:
  rus: Об утверждении Правил и особенностей зачисления, учета и использования пособий и социальных выплат за счет средств государственного бюджета и (или) средств Государственного фонда социального страхования, перечисляемых в виде электронных денег, а также мониторинга использования адресной социальной помощи
  kaz: Мемлекеттік бюджет қаражаты және (немесе) Мемлекеттік әлеуметтік сақтандыру қорының қаражаты есебінен электрондық ақша түрінде аударылатын жәрдемақылар мен әлеуметтік төлемдерді есепке жатқызу, есепке алу мен пайдалану, сондай-ақ атаулы әлеуметтік көмектің пайдаланылуын мониторингтеу қағидалары мен ерекшеліктерін бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 5 августа 2021 года № 524 «Об утверждении Правил обеспечения служебным жилищем сотрудников органов внутренних дел, исчисления размера, назначения, перерасчета, осуществления, прекращения, приостановления и возобновления жилищных выплат, а также категорий должностей сотрудников органов внутренних дел, имеющих право на получение жилищных выплат»
    kaz: «Ішкі істер органдарының қызметкерлерін қызметтік тұрғынжаймен қамтамасыз ету, тұрғын үй төлемдерінің мөлшерін есептеу, оларды тағайындау, қайта есептеу, жүзеге асыру, тоқтату, тоқтата тұру және қайта бастау қағидаларын, сондай-ақ тұрғын үй төлемдерін алуға құқығы бар ішкі істер органдарының қызметкерлері лауазымдарының санаттарын бекіту туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 5 тамыздағы № 524 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/181801/rus

act_code: '157790'
requisite: Постановление Правительства Республики Казахстан от 5 августа 2021 года № 524. Утратило силу постановлением Правительства Республики Казахстан от 11 июня 2026 года № 487 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил обеспечения служебным жилищем сотрудников органов внутренних дел, исчисления размера, назначения, перерасчета, осуществления, прекращения, приостановления и возобновления жилищных выплат, а также категорий должностей сотрудников органов внутренних дел, имеющих право на получение жилищных выплат
  kaz: Ішкі істер органдарының қызметкерлерін қызметтік тұрғынжаймен қамтамасыз ету, тұрғын үй төлемдерінің мөлшерін есептеу, оларды тағайындау, қайта есептеу, жүзеге асыру, тоқтату, тоқтата тұру және қайта бастау қағидаларын, сондай-ақ тұрғын үй төлемдерін алуға құқығы бар ішкі істер органдарының қызметкерлері лауазымдарының санаттарын бекіту туралы

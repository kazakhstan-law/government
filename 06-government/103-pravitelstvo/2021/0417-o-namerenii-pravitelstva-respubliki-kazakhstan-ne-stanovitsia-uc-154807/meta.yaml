act_code: '154807'
requisite: Постановление Правительства Республики Казахстан от 17 апреля 2021 года № 249
title:
  rus: О намерении Правительства Республики Казахстан не становиться участником Соглашения между Правительством Республики Казахстан и Правительством Республики Хорватия о торгово-экономическом сотрудничестве
  kaz: Қазақстан Республикасы Үкіметінің Қазақстан Республикасының Үкiметi мен Хорватия Республикасы Yкiметiнің арасындағы Сауда-экономикалық ынтымақтастық туралы келісімге қатысушы болмау ниеті туралы

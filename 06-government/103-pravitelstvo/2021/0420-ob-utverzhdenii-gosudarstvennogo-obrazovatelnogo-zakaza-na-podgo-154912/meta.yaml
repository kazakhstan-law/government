act_code: '154912'
requisite: Постановление Правительства Республики Казахстан от 20 апреля 2021 года № 253. Утратило силу постановлением Правительства Республики Казахстан от 16 августа 2023 года № 690 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении государственного образовательного заказа на подготовку кадров с высшим и послевузовским образованием, а также техническим и профессиональным, послесредним образованием в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку кадров для Вооруженных Сил Республики Казахстан, других войск и воинских формирований, а также специальных государственных органов), на 2021 – 2022, 2022 – 2023, 2023 – 2024 учебные годы
  kaz: Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасының Қарулы Күштері, басқа да әскерлері мен әскери құралымдары, сондай-ақ арнаулы мемлекеттік органдар үшін кадрларды даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға 2021 – 2022, 2022 – 2023, 2023 – 2024 оқу жылдарына арналған мемлекеттік білім беру тапсырысын бекіту туралы

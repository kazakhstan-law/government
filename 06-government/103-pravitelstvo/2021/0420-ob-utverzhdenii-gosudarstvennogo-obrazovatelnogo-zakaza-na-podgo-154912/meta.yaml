  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 20 апреля 2021 года № 253 «Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также техническим и профессиональным, послесредним образованием в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку специалистов для Вооруженных Сил Республики Казахстан, других войск и воинских формирований, а также специальных государственных органов), на 2021 – 2022, 2022 – 2023, 2023 – 2024 учебные годы»
    kaz: «Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасының Қарулы Күштері, басқа да әскерлер мен әскери құралымдар, сондай-ақ арнаулы мемлекеттік органдар үшін мамандар даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2021 – 2022, 2022 – 2023, 2023 – 2024 оқу жылдарына арналған мемлекеттік білім беру тапсырысын бекіту туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 20 сәуірдегі № 253 қаулысына өзгеріс енгізу туралы

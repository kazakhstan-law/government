act_code: '152750'
requisite: Постановление Правительства Республики Казахстан от 9 февраля 2021 года № 35
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2021 год областными бюджетами, бюджетами городов республиканского значения, столицы на обеспечение прав и улучшение качества жизни инвалидов в Республике Казахстан и на услуги по замене и настройке речевых процессоров к кохлеарным имплантам
  kaz: Облыстық бюджеттердің, республикалық маңызы бар қалалардың, астана бюджеттерінің Қазақстан Республикасында мүгедектердің құқықтарын қамтамасыз етуге және өмір сүру сапасын жақсартуға және кохлеарлық импланттарға сөйлеу процессорларын ауыстыру және теңшеу жөніндегі көрсетілетін қызметтерге 2021 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалануы қағидаларын бекіту туралы

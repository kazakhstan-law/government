  kaz: Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аймақтарды және Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аудандарды белгілеу қағидаларын және Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аймақтардың және Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аудандардың тізбесін бекіту туралы

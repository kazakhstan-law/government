act_code: '156347'
requisite: Постановление Правительства Республики Казахстан от 9 июня 2021 года № 392
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областным бюджетам, бюджетам городов республиканского значения, столицы на повышение заработной платы работников организаций в области здравоохранения местных исполнительных органов на 2021 год
  kaz: Облыстық бюджеттерге, республикалық маңызы бар қалалардың, астананың бюджеттеріне жергілікті атқарушы органдардың денсаулық сақтау саласындағы ұйымдар қызметкерлерінің жалақысын көтеруге берілетін 2021 жылға арналған ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

title:
  rus: Об установлении минимальных розничных цен на водки и водки особые, водки с защищенным наименованием места происхождения товара, крепкие ликероводочные изделия, коньяк и бренди
  kaz: Арақтарға және айрықша арақтарға, тауардың шығарылған жерінің атауы қорғалған арақтарға, күштілігі жоғары ликер-арақ бұйымдарына, коньяк пен брендиге арналған ең төмен бөлшек сауда бағаларын белгілеу туралы

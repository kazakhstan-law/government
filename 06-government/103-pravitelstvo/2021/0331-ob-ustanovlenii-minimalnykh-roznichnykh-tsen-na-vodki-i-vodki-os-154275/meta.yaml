    kaz: «Арақтарға және айрықша арақтарға, күштілігі жоғары ликер-арақ бұйымдарына арналған ең төмен бөлшек сауда бағаларын белгілеу туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 31 наурыздағы № 187 қаулысына өзгерістер енгізу туралы

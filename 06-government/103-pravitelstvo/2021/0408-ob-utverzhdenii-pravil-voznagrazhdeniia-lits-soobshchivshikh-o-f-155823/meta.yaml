act_code: '155823'
requisite: Постановление Правительства Республики Казахстан от 8 апреля 2021 года № 219
title:
  rus: Об утверждении Правил вознаграждения лиц, сообщивших о фактах нарушения применения контрольно-кассовой машины и оборудования (устройства), предназначенного для приема платежей с использованием платежных карточек, в случае подтверждения такого факта
  kaz: Бақылау-касса машинасын және төлем карточкаларын пайдалана отырып төлемдерді қабылдауға арналған жабдықты (құрылғыны) қолданудағы бұзушылық фактілері туралы хабарлаған адамдарға осындай факт расталған жағдайда сыйақы беру қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в некоторые решения Правительства Республики Казахстан и признании утратившим силу постановления Правительства Республики Казахстан от 24 августа 2021 года № 576 «Об утверждении Плана мероприятий на 2021 – 2023 годы по реализации Антикоррупционной стратегии Республики Казахстан на 2015 – 2025 годы»
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер енгізу және «Қазақстан Республикасының 2015 – 2025 жылдарға арналған сыбайлас жемқорлыққа қарсы стратегиясын іске асыру жөніндегі 2021 – 2023 жылдарға арналған іс-шаралар жоспарын бекіту туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 24 тамыздағы № 576 қаулысының күші жойылды деп тану туралы

title:
  rus: Об утверждении единого перечня открытых данных государственных органов, размещаемых на интернет-портале открытых данных
  kaz: Ашық деректердің интернет-порталында орналастырылатын мемлекеттік органдардың ашық деректерінің бірыңғай тізбесін бекіту туралы

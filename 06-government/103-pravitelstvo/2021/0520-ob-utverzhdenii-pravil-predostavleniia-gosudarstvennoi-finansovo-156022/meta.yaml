  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 20 мая 2021 года № 332 «Об утверждении Правил предоставления государственной финансовой поддержки расчетно-финансовому центру по поддержке возобновляемых источников энергии»
    kaz: «Жаңартылатын энергия көздерін қолдау жөніндегі қаржы-есеп айырысу орталығына мемлекеттік қаржылық қолдау ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 20 мамырдағы № 332 қаулысына өзгерістер енгізу туралы

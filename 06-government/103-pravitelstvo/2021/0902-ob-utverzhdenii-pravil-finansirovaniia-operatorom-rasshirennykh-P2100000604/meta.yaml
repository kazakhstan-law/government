  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 2 сентября 2021 года № 604 «Об утверждении Правил финансирования оператором расширенных обязательств производителей (импортеров) организации, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которой прямо или косвенно принадлежат государству и (или) национальному управляющему холдингу, для дальнейшего финансирования проектов в обрабатывающей отрасли, направленных на улучшение состояния окружающей среды»
    kaz: «Қоршаған ортаның жай-күйін жақсартуға бағытталған өңдеу саласындағы жобаларды одан әрі қаржыландыру үшін дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан көп пайызы тікелей немесе жанама түрде мемлекетке және (немесе) ұлттық басқарушы холдингке тиесілі ұйымды өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері операторының қаржыландыруы қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 2 қыркүйектегі № 604 қаулысына өзгерістер мен толықтыру енгізу туралы

act_code: '153155'
requisite: Постановление Правительства Республики Казахстан от 23 февраля 2021 года № 86
title:
  rus: Об утверждении основных условий кредитования областных бюджетов, бюджетов городов республиканского значения, столицы на содействие развитию предпринимательства в областных центрах, городах Нур-Султане, Алматы, Шымкенте, Семее и моногородах на 2021 год
  kaz: Облыстық бюджеттерге, республикалық маңызы бар қалалардың, астананың бюджеттерiне облыс орталықтарында, Нұр-Сұлтан, Алматы, Шымкент, Семей қалаларында және моноқалаларда кәсіпкерлікті дамытуға жәрдемдесуге 2021 жылға кредит берудің негізгі шарттарын бекіту туралы

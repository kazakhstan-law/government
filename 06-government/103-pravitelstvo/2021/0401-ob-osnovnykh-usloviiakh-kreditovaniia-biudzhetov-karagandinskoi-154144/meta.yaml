title:
  rus: Об основных условиях кредитования бюджетов Карагандинской, Мангистауской, Западно-Казахстанской областей и бюджета города Нур-Султана на реконструкцию и строительство систем тепло-, водоснабжения и водоотведения на 2021 год
  kaz: Қарағанды, Маңғыстау, Батыс Қазақстан облыстарының бюджеттеріне және Нұр-Сұлтан қаласының бюджетіне жылумен, сумен жабдықтау және су бұру жүйелерін реконструкциялауға және салуға 2021 жылға арналған кредит берудің негізгі шарттары туралы

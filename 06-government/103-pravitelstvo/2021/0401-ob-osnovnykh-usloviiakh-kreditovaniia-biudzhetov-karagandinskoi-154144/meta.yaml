    kaz: «Қарағанды облысының бюджетіне жылумен, сумен жабдықтау және су бұру жүйелерін реконструкциялауға және салуға 2021 жылға арналған кредит берудің негізгі шарттары туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 1 сәуірдегі № 202 қаулысына өзгерістер енгізу туралы

act_code: '158857'
requisite: Постановление Правительства Республики Казахстан от 22 сентября 2021 года № 660
title:
  rus: Об определении перечня государственных органов, ответственных за предоставление данных по категориям лиц, указанным в пункте 1 статьи 26 и пункте 1 статьи 26-1 Закона Республики Казахстан от 16 ноября 2015 года «Об обязательном социальном медицинском страховании», и иностранцам, временно пребывающим на территории Республики Казахстан и являющимся трудовыми мигрантами, а также членам их семей из государств – членов Евразийского экономического союза в некоммерческое акционерное общество «Государственная корпорация «Правительство для граждан» для дальнейшей передачи в информационную систему обязательного социального медицинского страхования
  kaz: Міндетті әлеуметтік медициналық сақтандыру туралы» 2015 жылғы 16 қарашадағы Қазақстан Республикасының Заңы 26-бабының 1-тармағында және 26-1-бабының 1-тармағында аталған адамдардың санаттары бойынша және Еуразиялық экономикалық одаққа мүше мемлекеттерден Қазақстан Республикасының аумағында уақытша болатын және еңбекші көшіп-қонушылар болып табылатын шетелдіктер, сондай-ақ олардың отбасы мүшелері бойынша деректерді міндетті әлеуметтік медициналық сақтандырудың ақпараттық жүйесіне одан әрі беру үшін «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» коммерциялық емес акционерлік қоғамына ұсынуға жауапты мемлекеттік органдардың тізбесін айқындау туралы

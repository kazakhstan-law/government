    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 15 января 2021 года № 9 «Об утверждении Правил установления запретных зон при арсеналах, базах и складах Вооруженных Сил, других войск и воинских формирований и запретных районов при арсеналах, базах и складах Вооруженных Сил, других войск и воинских формирований и перечня запретных зон при арсеналах, базах и складах Вооруженных Сил, других войск и воинских формирований и запретных районов при арсеналах, базах и складах Вооруженных Сил, других войск и воинских формирований»
    kaz: «Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аймақтарды және Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аудандарды белгілеу қағидаларын және Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аймақтардың және Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың арсеналдары, базалары мен қоймалары жанындағы тыйым салынған аудандардың тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2021 жылғы 15 қаңтардағы № 9 қаулысына өзгерістер мен толықтыру енгізу туралы

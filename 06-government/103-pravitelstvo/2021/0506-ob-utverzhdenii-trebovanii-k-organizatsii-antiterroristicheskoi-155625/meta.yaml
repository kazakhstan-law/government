  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 12 апреля 2021 года № 234 «Об утверждении Правил и критериев отнесения объектов к уязвимым в террористическом отношении» и от 6 мая 2021 года № 305 «Об утверждении требований к организации антитеррористической защиты объектов, уязвимых в террористическом отношении»
    kaz: Қазақстан Республикасы Үкіметінің «Объектілерді террористік тұрғыдан осал объектілерге жатқызу қағидалары мен өлшемшарттарын бекіту туралы» 2021 жылғы 12 сәуірдегі № 234 және «Террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыруға қойылатын талаптарды бекіту туралы» 2021 жылғы 6 мамырдағы № 305 қаулыларына өзгерістер енгізу туралы

  requisite: Постановление Правительства Республики Казахстан от 20 марта 2023 года № 240
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республике Казахстан от 3 июля 2019 года № 470 «Об утверждении Списка наркотических средств, психотропных веществ и прекурсоров, подлежащих контролю в Республике Казахстан, Сводной таблицы об отнесении наркотических средств, психотропных веществ, их аналогов и прекурсоров, обнаруженных в незаконном обороте, к небольшим, крупным и особо крупным размерам, Списка заместителей атомов водорода, галогенов и (или) гидроксильных групп в структурных формулах наркотических средств, психотропных веществ» и от 10 июня 2021 года № 396 «Об определении перечня сильнодействующих веществ, оказывающих вредное воздействие на жизнь и здоровье человека»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасында бақылауға жататын есірткі, психотроптық заттар мен прекурсорлар тізімін, Заңсыз айналымда жүргені анықталған есірткі, психотроптық заттарды, сол тектестер мен прекурсорларды шағын, ірі және аса ірі мөлшерге жатқызу туралы жиынтық кестені, Есірткі, психотроптық заттардың құрылымдық формулаларындағы сутегі, галогендер және (немесе) гидроксильді топтар атомдарын алмастырғыштар тізімін бекіту туралы» 2019 жылғы 3 шілдедегі № 470 және «Адамның өмірі мен денсаулығына зиянды әсерін тигізетін, күшті әсер ететін заттардың тізбесін айқындау туралы» 2021 жылғы 10 маусымдағы № 396 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179197/rus

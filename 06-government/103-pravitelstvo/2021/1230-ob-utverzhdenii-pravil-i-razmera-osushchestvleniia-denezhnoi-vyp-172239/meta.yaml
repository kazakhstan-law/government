act_code: '172239'
requisite: Постановление Правительства Республики Казахстан от 30 декабря 2021 года № 966
title:
  rus: Об утверждении Правил и размера осуществления денежной выплаты ветеранам дипломатической службы Республики Казахстан, занимавшим должность Чрезвычайного и Полномочного Посла Республики Казахстан, Постоянного (Полномочного) представителя Республики Казахстан при международной организации или имеющим дипломатический ранг Чрезвычайного и Полномочного Посла
  kaz: Қазақстан Республикасының Төтенше және Өкілетті Елшісі, Қазақстан Республикасының халықаралық ұйым жанындағы Тұрақты (Өкілетті) өкілі лауазымын атқарған немесе Төтенше және Өкілетті Елші дипломаттық дәрежесі бар Қазақстан Республикасының дипломатиялық қызмет ардагерлеріне ақшалай төлемді жүзеге асыру қағидаларын және мөлшерін бекіту туралы

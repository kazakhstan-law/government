act_code: '31020'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2006 года № 1324
title:
  rus: О передаче Государственного учреждения "Республиканская казахская средняя специализированная музыкальная школа-интернат для одаренных детей имени А. Жубанова" Министерства образования и науки Республики Казахстан в коммунальную собственность города Алматы
  kaz: Қазақстан Республикасы Бiлiм және ғылым министрлiгiнiң "A.Жұбанов атындағы дарынды балаларға арналған республикалық қазақ орта мамандандырылған музыка мектеп-интернаты" мемлекеттiк мекемесiн Алматы қаласының коммуналдық меншiгiне беру туралы

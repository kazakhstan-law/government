  requisite: Постановление Правительства Республики Казахстан от 18 октября 2013 года № 1118. Утратило силу постановлением Правительства Республики Казахстан от 2 июля 2015 года № 501
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 25 августа 2006 года № 819 "Об утверждении Правил назначения и осуществления выплаты государственных базовых социальных пособий по инвалидности, по случаю потери кормильца и по возрасту, пенсионных выплат из Государственного центра по выплате пенсий, государственной базовой пенсионной выплаты, государственных специальных пособий"
    kaz: '"Мүгедектiгi бойынша, асыраушысынан айрылу жағдайы бойынша және жасына байланысты берiлетiн мемлекеттiк базалық әлеуметтiк жәрдемақыларды, Зейнетақы төлеу жөнiндегi мемлекеттiк орталықтан төленетiн зейнетақы төлемдерiн, мемлекеттiк базалық зейнетақы төлемiн, мемлекеттiк арнайы жәрдемақыларды тағайындау және төлеудi жүзеге асыру ережесiн бекiту туралы" Қазақстан Республикасы Үкіметінің 2006 жылғы 25 тамыздағы № 819 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/74831/rus

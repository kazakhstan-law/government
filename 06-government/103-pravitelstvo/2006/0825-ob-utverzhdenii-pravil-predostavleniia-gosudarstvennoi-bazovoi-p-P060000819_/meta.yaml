title:
  rus: Об утверждении Правил предоставления государственной базовой пенсионной выплаты за счет бюджетных средств, а также назначения и осуществления пенсионных выплат, государственных базовых социальных пособий по инвалидности, по случаю потери кормильца и по возрасту, государственных специальных пособий из уполномоченной организации
  kaz: Мемлекеттiк базалық зейнетақы төлемiн бюджет қаражаты есебiнен беру, сондай-ақ уәкілетті ұйымнан төленетін зейнетақы төлемдерін, мүгедектігі бойынша, асыраушысынан айырылу жағдайы бойынша және жасына байланысты берілетін мемлекеттік базалық әлеуметтік жәрдемақыларды, мемлекеттік арнайы жәрдемақыларды тағайындау және төлеу қағидаларын бекіту туралы

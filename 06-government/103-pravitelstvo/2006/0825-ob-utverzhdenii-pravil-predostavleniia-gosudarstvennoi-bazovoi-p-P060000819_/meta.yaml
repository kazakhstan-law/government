  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 25 августа 2006 года № 819 "Об утверждении Правил предоставления государственной базовой пенсионной выплаты за счет бюджетных средств, а также назначения и осуществления пенсионных выплат, государственных базовых социальных пособий по инвалидности, по случаю потери кормильца и по возрасту, государственных специальных пособий из уполномоченной организации"
    kaz: '"Мемлекеттiк базалық зейнетақы төлемiн бюджет қаражаты есебiнен беру, сондай-ақ уәкілетті ұйымнан төленетін зейнетақы төлемдерін, мүгедектігі бойынша, асыраушысынан айырылу жағдайы бойынша және жасына байланысты берілетін мемлекеттік базалық әлеуметтік жәрдемақыларды, мемлекеттік арнайы жәрдемақыларды тағайындау және төлеу қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2006 жылғы 25 тамыздағы N 819 қаулысына өзгерістер енгізу туралы'

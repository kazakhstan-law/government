  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 7 июля 2006 года № 645 «О некоторых вопросах поддержки агропромышленного комплекса с участием специализированных организаций» и от 23 декабря 2006 года № 1247 «О мерах по реализации Указа Президента Республики Казахстан от 11 декабря 2006 года № 220»
    kaz: Қазақстан Республикасы Үкіметінің «Агроөнеркәсiптiк кешендi мамандандырылған ұйымдардың қатысуымен қолдаудың кейбiр мәселелерi туралы» 2006 жылғы 7 шілдедегі № 645 және «Қазақстан Республикасы Президентiнiң 2006 жылғы 11 желтоқсандағы № 220 Жарлығын iске асыру жөнiндегi iс-шаралар туралы» 2006 жылғы 23 желтоқсандағы № 1247 қаулыларына өзгерістер енгізу туралы

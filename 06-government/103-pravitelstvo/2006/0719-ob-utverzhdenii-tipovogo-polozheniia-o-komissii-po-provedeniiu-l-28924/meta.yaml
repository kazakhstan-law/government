title:
  rus: Об утверждении Типового положения о комиссии по проведению легализации недвижимого имущества, находящегося на территории Республики Казахстан, права на которое не оформлены в соответствии с законодательством Республики Казахстан
  kaz: Қазақстан Республикасының аумағында орналасқан, құқықтары Қазақстан Республикасының заңнамасына сәйкес ресiмделмеген жылжымайтын мүлiктi жария етудi жүргiзу жөнiндегi комиссия туралы үлгi ереженi бекiту туралы

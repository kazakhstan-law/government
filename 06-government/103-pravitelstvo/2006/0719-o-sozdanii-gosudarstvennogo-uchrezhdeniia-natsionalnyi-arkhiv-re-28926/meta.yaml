title:
  rus: О создании государственного учреждения "Национальный архив Республики Казахстан" Комитета информации и архивов Министерства культуры и информации Республики Казахстан
  kaz: Қазақстан Республикасы Мәдениет және ақпарат министрлiгi Ақпарат және мұрағат комитетiнiң "Қазақстан Республикасының Ұлттық мұрағаты" мемлекеттiк мекемесiн құру туралы

act_code: '30742'
requisite: Постановление Правительства Республики Казахстан от 22 декабря 2006 года № 1239
title:
  rus: Об утверждении перечня товаров, ввезенных юридическим лицом, его подрядчиками или субподрядчиками, осуществляющими деятельность в рамках концессионного соглашения, заключенного между Правительством Республики Казахстан и акционерным обществом "Досжан темір жолы" по строительству и эксплуатации новой железнодорожной линии "станция Шар - Усть-Каменогорск", импорт которых освобождается от налога на добавленную стоимость
  kaz: Қазақстан Республикасының Үкiметi мен "Досжан темiр жолы" акционерлiк қоғамы арасында жасалған "Шар станциясы - Өскемен" жаңа темiр жол желiсiн салу және пайдалану жөнiндегi концессиялық келiсiмнiң шеңберiнде қызметiн жүзеге асыратын заңды тұлға, оның мердiгерлерi немесе қосалқы мердiгерлерi әкелген, импорты қосылған құн салығынан босатылатын тауарлардың тiзбесiн бекiту туралы

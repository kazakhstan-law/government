title:
  rus: Об утверждении Правил возмещения затрат медицинских организаций за счет бюджетных средств и оказания платных услуг в организациях здравоохранения и порядка использования средств от платных услуг, осуществляемых государственными организациями здравоохранения
  kaz: Бюджет қаражатының есебiнен ұсталатын медицина ұйымдарының шығындарын өтеу және денсаулық сақтау ұйымдарында ақылы қызметтер көрсету ережелерi мен мемлекеттiк денсаулық сақтау ұйымдары жүзеге асыратын ақылы қызметтерден түскен қаражатты пайдалану тәртiбiн бекiту туралы

title:
  rus: Об утверждении перечня товаров, реализуемых на территорию специальной экономической зоны "Парк информационных технологий", потребляемых в процессе осуществления на территории специальной экономической зоны видов деятельности, обороты по реализации которых освобождены от налога на добавленную стоимость
  kaz: Сату бойынша айналымы қосылған құн салығынан босатылған қызмет түрлерін арнайы экономикалық аймақтың аумағында жүзеге асыру процесінде тұтынылатын "Ақпараттық технологиялар паркі" арнайы экономикалық аймағының аумағында сатылатын тауарлардың тізбесін бекіту туралы

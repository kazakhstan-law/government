act_code: '30233'
requisite: Постановление Правительства Республики Казахстан от 7 ноября 2006 года № 1059. Утратило силу постановлением Правительства Республики Казахстан от 31 июля 2009 года № 1167
title:
  rus: Об утверждении Правил оформления, представления и предварительной оценки материалов участников конкурса на соискание премии Президента Республики Казахстан "За достижения в области качества" и Правил оформления, представления и предварительной экспертной оценки материалов и продукции, представляемых на региональный и республиканский конкурсы-выставки "Алтын сапа"
  kaz: Қазақстан Республикасы Президентiнiң "Сапа саласындағы жетiстiктерi үшiн" сыйлығын алуға арналған конкурсқа қатысушылардың материалдарын ресiмдеу, ұсыну және алдын ала бағалау ережесiн және "Алтын сапа" өңiрлiк және республикалық көрме-конкурстарына ұсынылатын материалдар мен өнiмдi ресiмдеу, ұсыну және алдын ала сараптамалық бағалау ережесiн бекiту туралы

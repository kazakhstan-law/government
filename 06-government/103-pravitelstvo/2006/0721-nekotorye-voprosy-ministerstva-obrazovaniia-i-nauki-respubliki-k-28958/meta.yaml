    rus: О принятии доли участия товарищества с ограниченной ответственностью «Институт географии» из частной собственности в республиканскую собственность по договору дарения и преобразовании в акционерное общество «Институт географии и водной безопасности» Комитета науки Министерства образования и науки Республики Казахстан
    kaz: «География институты» жауапкершілігі шектеулі серіктестігінің қатысу үлесін сыйға тарту шарты бойынша жеке меншіктен республикалық меншікке қабылдау және Қазақстан Республикасының Білім және ғылым министрлігі Ғылым комитетінің «География және су қауіпсіздігі институты» акционерлік қоғамы етіп қайта ұйымдастыру туралы

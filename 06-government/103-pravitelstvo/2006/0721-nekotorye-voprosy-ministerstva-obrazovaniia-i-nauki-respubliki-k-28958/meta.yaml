  title:
    rus: О принятии доли участия в уставном капитале товарищества с ограниченной ответственностью «Центрально–Азиатский региональный гляциологический центр» категории 2 под эгидой ЮНЕСКО», передаваемой в республиканскую собственность по договору дарения, и внесении дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Сыйға тарту шарты бойынша республикалық меншікке берілетін «ЮНЕСКО аясындағы 2-санаттағы «Орталық Азия өңірлік гляциологиялық орталығы» жауапкершілігі шектеулі серіктестігінің жарғылық капиталының үлесін қабылдау және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне толықтырулар енгізу туралы

  title:
    rus: О признании утратившим силу постановления Правительства Республики Казахстан от 18 июня 2009 года № 935 "О некоторых вопросах Республиканского государственного предприятия "Казахский национальный университет имени аль-Фараби" Министерства образования и науки Республики Казахстан" и внесении изменения и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: '"Қазақстан Республикасы Білім және ғылым министрлігінің "Әл-Фараби атындағы Қазақ ұлттық университеті" республикалық мемлекеттік кәсіпорнының кейбір мәселелері туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 18 маусымдағы № 935 қаулысының күші жойылды деп тану және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгеріс пен толықтырулар енгізу туралы'

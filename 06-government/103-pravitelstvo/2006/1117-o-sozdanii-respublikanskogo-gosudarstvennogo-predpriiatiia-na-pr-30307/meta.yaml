act_code: '30307'
requisite: Постановление Правительства Республики Казахстан от 17 ноября 2006 года № 1085
title:
  rus: О создании Республиканского государственного предприятия на праве хозяйственного ведения "Государственный авиационный центр" Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан и о государственных закупках, имеющих важное стратегическое значение
  kaz: Қазақстан Республикасы Көлiк және коммуникация министрлiгi Азаматтық авиация комитетiнiң шаруашылық жүргізу құқығындағы "Мемлекеттiк авиациялық орталық" республикалық мемлекеттiк кәсiпорнын құру және маңызды стратегиялық мәнi бар мемлекеттiк сатып алу туралы

act_code: '30277'
requisite: Постановление Правительства Республики Казахстан от 11 ноября 2006 года № 1075. Утратило силу постановлением Правительства Республики Казахстан от 31 декабря 2008 года № 1326 (вводится в действие с 1 января 2009 года)
title:
  rus: Об утверждении перечня налогоплательщиков, осуществляющих на территории Республики Казахстан деятельность в рамках контракта на недропользование, в соответствии с условиями которого освобождаются от налога на добавленную стоимость импортируемые товары
  kaz: Қазақстан Республикасының аумағында жер қойнауын пайдалану келiсiм-шарты шеңберiнде қызметiн жүзеге асыратын, сол келiсiм-шарттың талаптарына сәйкес импортталатын тауарлары қосылған құн салығынан босатылатын салық төлеушiлердiң тiзбесiн бекiту туралы

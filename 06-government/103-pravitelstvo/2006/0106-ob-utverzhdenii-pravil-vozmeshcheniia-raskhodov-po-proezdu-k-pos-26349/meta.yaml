title:
  rus: Об утверждении Правил возмещения расходов по проезду к постоянному месту жительства и провозу имущества (в том числе скота), выделения средств для приобретения жилья по месту прибытия и выплаты единовременных пособий оралманам и членам их семей, прибывшим по квоте иммиграции
  kaz: Көшiп-келу квотасы бойынша келген оралмандарға және олардың отбасы мүшелеріне тұрақты тұратын жерiне бару және мүлкiн (оның iшiнде малын) апару жөнiндегi шығыстарын өтеу, келген жерi бойынша тұрғын үй сатып алу үшiн қаражат бөлу және бiржолғы жәрдемақылар төлеу ережесiн бекiту туралы

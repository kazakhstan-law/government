title:
  rus: Об утверждении перечня товаров собственного производства (работ, услуг) по видам деятельности, соответствующим целям создания специальной экономической зоны "Парк информационных технологий"
  kaz: '"Ақпараттық технологиялар паркі" арнайы экономикалық аймағын құру мақсаттарына сәйкес келетін қызмет түрлері бойынша өздері өндіретін тауарлардың (жұмыстардың, қызметтердің) тізбесін бекіту туралы'

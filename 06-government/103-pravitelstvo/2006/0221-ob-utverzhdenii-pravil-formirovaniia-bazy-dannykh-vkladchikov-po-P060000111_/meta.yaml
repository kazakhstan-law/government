title:
  rus: Об утверждении Правил формирования базы данных вкладчиков (получателей) по обязательным пенсионным взносам и единого списка физических лиц, заключивших договор о пенсионном обеспечении за счет обязательных пенсионных взносов, и Правил представления накопительными пенсионными фондами Государственному центру по выплате пенсий сведений о заключенных и прекративших действие с вкладчиками договорах о пенсионном обеспечении за счет обязательных пенсионных взносов с использованием электронного документооборота
  kaz: Мiндеттi зейнетақы жарналары бойынша салымшылардың (алушылардың) дерекқорын және мiндеттi зейнетақы жарналары есебiнен зейнетақымен қамсыздандыру туралы шарт жасасқан жеке тұлғалардың бiрыңғай тiзiмiн қалыптастыру қағидаларын және Жинақтаушы зейнетақы қорларының электронды құжат айналымын пайдалана отырып, Зейнетақы төлеу жөнiндегi мемлекеттiк орталыққа салымшылармен мiндеттi зейнетақы жарналары есебiнен зейнетақымен қамсыздандыру туралы жасалған және қолданылуы тоқтатылған шарттар туралы мәлiметтердi ұсыну қағидаларын бекiту туралы

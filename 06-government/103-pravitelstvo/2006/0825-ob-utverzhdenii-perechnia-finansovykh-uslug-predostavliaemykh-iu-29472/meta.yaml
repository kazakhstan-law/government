title:
  rus: Об утверждении перечня финансовых услуг, предоставляемых юридическими лицами-участниками регионального финансового центра города Алматы, доходы от оказания которых подлежат исключению из их совокупного годового дохода
  kaz: Алматы қаласының өңiрлiк қаржы орталығына қатысушы заңды тұлғалар ұсынатын, көрсетуден түсетiн кiрiс олардың жиынтық жылдық кiрiсiнен алып тастауға жататын қаржылық қызметтердiң тiзбесiн бекiту туралы

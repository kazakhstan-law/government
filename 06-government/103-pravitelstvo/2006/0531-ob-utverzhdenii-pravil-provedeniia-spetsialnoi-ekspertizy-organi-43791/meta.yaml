act_code: '43791'
requisite: Постановление Правительства Республики Казахстан от 31 мая 2006 года № 484 дсп
title:
  rus: Об утверждении Правил проведения специальной экспертизы организаций и аттестации их руководителей для получения разрешений на проведение работ, связанных с использованием сведений, составляющих государственные секреты, созданием средств защиты государственных секретов, а также с проведением мероприятий и (или) оказанием услуг по защите государственных секретов Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттік құпияларын құрайтын мәліметтерді пайдалануға, мемлекеттік құпияларды қорғау құралдарын жасауға, сондай-ақ мемлекеттік құпияларды қорғау жөніндегі іс-шараларды жүргізуге және (немесе) қызметтер көрсетуге байланысты жұмыстарды жүргізуге рұқсат алу үшін ұйымдарға арнайы сараптама жүргізу және олардың басшыларын аттестаттаудан өткізу ережесін бекіту туралы

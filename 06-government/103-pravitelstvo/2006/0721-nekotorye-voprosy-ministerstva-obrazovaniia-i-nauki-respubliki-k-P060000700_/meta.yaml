  requisite: Постановление Правительства Республики Казахстан от 7 февраля 2008 года N 119
  title:
    rus: О реорганизации дочернего государственного предприятия на праве хозяйственного ведения "Институт проблем горения" Республиканского государственного предприятия на праве хозяйственного ведения "Казахский национальный университет им. Аль-Фараби" Министерства образования и науки Республики Казахстан
    kaz: Қазақстан Республикасы Білім және ғылым министрлігінің "Әл-Фараби атындағы Қазақ ұлттық университеті" шаруашылық жүргізу қүқығындағы республикалық мемлекеттік кәсіпорнының "Жану проблемалары институты" шаруашылық жүргізу құқығындағы еншілес мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

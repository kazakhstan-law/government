  key: P2100000701
  requisite: Постановление Правительства Республики Казахстан от 1 октября 2021 года № 701
  title:
    rus: О принятии доли участия товарищества с ограниченной ответственностью «Институт Евразийской интеграции» из частной собственности в республиканскую собственность по договору дарения и внесении дополнений в некоторые решения Правительства Республики Казахстан
    kaz: «Еуразиялық интеграция институты» жауапкершілігі шектеулі серіктестігінің қатысу үлесін сыйға тарту шарты бойынша жеке меншіктен республикалық меншікке қабылдау және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/159152/rus

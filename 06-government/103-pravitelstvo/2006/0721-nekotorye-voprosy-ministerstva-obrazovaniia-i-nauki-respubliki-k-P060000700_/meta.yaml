  title:
    rus: О реорганизации некоторых дочерних государственных предприятий республиканского государственного предприятия на праве хозяйственного ведения "Центр наук о Земле, металлургии и обогащения" Комитета науки Министерства образования и науки Республики Казахстан
    kaz: Қазақстан Республикасы Білім және ғылым министрлігі Ғылым комитетінің "Жер туралы ғылымдар, металлургия және кен байыту орталығы" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнының кейбір еншілес мемлекеттік кәсіпорындарын қайта ұйымдастыру туралы

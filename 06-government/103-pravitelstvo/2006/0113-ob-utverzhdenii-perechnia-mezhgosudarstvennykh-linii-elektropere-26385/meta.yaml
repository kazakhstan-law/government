act_code: '26385'
requisite: Постановление Правительства Республики Казахстан от 13 января 2006 года № 37
title:
  rus: Об утверждении перечня межгосударственных линий электропередачи Республики Казахстан, соединяющих единую электроэнергетическую систему Республики Казахстан с электроэнергетическими системами сопредельных государств, и пунктов таможенного контроля при транзите электрической энергии
  kaz: Қазақстан Республикасының бiртұтас электр энергетикалық жүйесiн шектес мемлекеттердiң электр энергетикалық жүйелерiмен қосатын Қазақстан Республикасының мемлекетаралық электр берiлiсi желiлерiнiң және электр энергиясының транзитi кезiндегi кедендiк бақылау пункттерiнiң тiзбесiн бекiту туралы

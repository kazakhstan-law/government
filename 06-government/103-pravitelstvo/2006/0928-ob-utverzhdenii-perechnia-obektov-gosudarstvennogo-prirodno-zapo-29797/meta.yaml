  requisite: Постановление Правительства Республики Казахстан от 22 ноября 2024 года № 997
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 28 сентября 2006 года № 932 «Об утверждении перечня объектов государственного природно-заповедного фонда республиканского значения» и признании утратившим силу постановления Правительства Республики Казахстан от 21 июня 2007 года № 521 «Об утверждении перечня объектов охраны окружающей среды, имеющих особое экологическое, научное и культурное значение»
    kaz: «Республикалық маңызы бар мемлекеттiк табиғи-қорық қоры объектiлерiнiң тiзбесiн бекiту туралы» Қазақстан Республикасы Үкіметінің 2006 жылғы 28 қыркүйектегі № 932 қаулысына өзгерістер енгізу және «Экологиялық, ғылыми және мәдени ерекше маңызы бар қоршаған ортаны қорғау объектілерінің тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2007 жылғы 21 маусымдағы № 521 қаулысының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/203094/rus

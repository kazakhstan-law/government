act_code: '26703'
requisite: Постановление Правительства Республики Казахстан от 28 февраля 2006 года № 139
title:
  rus: О реорганизации государственного учреждения "Республиканский научно-практический центр психиатрии, психотерапии и наркологии" Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлiгiнiң "Республикалық психиатрия, психотерапия және наркология ғылыми-практикалық орталығы" мемлекеттiк мекемесiн қайта ұйымдастыру туралы

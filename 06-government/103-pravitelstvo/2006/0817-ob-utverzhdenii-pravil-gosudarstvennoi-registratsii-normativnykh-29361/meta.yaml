    rus: Об определении интернет-ресурса, осуществляющего официальное опубликование нормативных правовых актов центральных исполнительных и иных центральных государственных органов, руководителей ведомств центральных государственных органов, а также маслихатов, акиматов, акимов, ревизионных комиссий
    kaz: Орталық атқарушы және өзге де орталық мемлекеттік органдардың, орталық мемлекеттік органдардың ведомстволары басшыларының, сондай-ақ мәслихаттардың, әкімдіктердің, әкімдердің, тексеру комиссияларының нормативтік құқықтық актілерін ресми жариялау жүзеге асырылатын интернет-ресурсты айқындау туралы

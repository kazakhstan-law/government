title:
  rus: О реорганизации республиканского государственного предприятия на праве хозяйственного ведения "Региональная Дирекция по строительству водохозяйственных объектов в северных и центральных областях Казахстана "Северводстрой" Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлiгi Су ресурстары комитетiнiң "Солтүстiксуқұрылыс" Қазақстанның солтүстiк және орталық облыстарында су шаруашылығы объектiлерiнiң құрылысы жөнiндегi өңiрлiк дирекция" шаруашылық жүргiзу құқығындағы республикалық мемлекеттiк кәсiпорнын қайта ұйымдастыру туралы

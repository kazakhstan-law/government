title:
  rus: Некоторые вопросы создания государственного учреждения "Центр социально-психологической реабилитации наркозависимых лиц" Комитета по борьбе с наркобизнесом и контролю за оборотом наркотиков Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Iшкi iстер министрлiгi Есiрткi бизнесiне қарсы күрес және есiрткi айналымын бақылау комитетiнiң "Есiрткiге тәуелдi адамдарды әлеуметтiк-психологиялық оңалту орталығы" мемлекеттiк мекемесiн құрудың кейбiр мәселелерi

title:
  rus: Вопросы некоторых республиканских государственных предприятий Комитета науки Министерства образования и науки Республики Казахстан
  kaz: Қазақстан Республикасы Бiлiм және ғылым министрлiгi Ғылым комитетiнiң кейбiр республикалық мемлекеттiк кәсiпорындарының мәселелерi

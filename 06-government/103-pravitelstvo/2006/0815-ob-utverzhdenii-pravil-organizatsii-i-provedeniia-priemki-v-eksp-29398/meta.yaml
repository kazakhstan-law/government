  kaz: '"Мүлiктi жария етуге байланысты рақымшылық жасау туралы" Қазақстан Республикасының Заңына сәйкес жария етiлген жылжымайтын мүлiк объектiлерiн пайдалануға қабылдауды ұйымдастыру және жүргiзу ережесiн бекiту туралы'

title:
  rus: Об утверждении Правил организации и проведения приемки в эксплуатацию объектов недвижимого имущества, легализованных в соответствии с Законом Республики Казахстан "Об амнистии в связи с легализацией имущества"
  kaz: '"Мүлiктi жария етуге байланысты рақымшылық жасау туралы" Қазақстан Республикасының Заңына сәйкес жария етiлген жылжымайтын мүлiк объектiлерiн пайдалануға қабылдауды ұйымдастыру және жүргiзу ережесiн бекiту туралы'

  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 1 августа 2006 года № 726 "Об утверждении Правил предоставления прав на земельные участки под индивидуальное жилищное строительство" и признании утратившим силу постановления Правительства Республики Казахстан от 9 июля 2002 года № 748 "Об утверждении Правил предоставления оралманам земельных участков для индивидуального жилищного строительства"
    kaz: '"Жеке тұрғын үй құрылысы үшін жер учаскелеріне құқық беру ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2006 жылғы 1 тамыздағы № 726 қаулысына өзгеріс енгізу және "Оралмандарға жеке тұрғын үй салу үшін жер телімдерін беру ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2002 жылғы 9 шілдедегі № 748 қаулысының күші жойылды деп тану туралы'

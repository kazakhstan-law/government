  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 29 апреля 2006 года № 343 «Об утверждении Правил ведения Государственного реестра нормативных правовых актов, эталонного контрольного банка нормативных правовых актов Республики Казахстан» и от 21 октября 2013 года № 1124 «Об определении интернет-ресурса, осуществляющего официальное опубликование нормативных правовых приказов министров Республики Казахстан и иных руководителей центральных государственных органов, руководителей ведомств, нормативных правовых актов центральных и местных исполнительных органов, постановлений центральных государственных органов, нормативных постановлений Центральной избирательной комиссии, нормативных правовых решений маслихатов, а также нормативных правовых постановлений акиматов и нормативных правовых решений акимов, и внесении изменений в некоторые решения Правительства Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы нормативтік құқықтық кесiмдерiнiң мемлекеттік тiзiлiмiн, нормативтік құқықтық кесiмдерiнiң эталондық бақылау банкін жүргізу ережесін бекіту туралы» 2006 жылғы 29 сәуірдегі № 343 және «Қазақстан Республикасы министрлерінің және орталық мемлекеттік органдардың өзге де басшыларының, ведомстволар басшыларының нормативтік құқықтық бұйрықтарын, орталық және жергілікті атқарушы органдардың нормативтік құқықтық актілерін, орталық мемлекеттік органдардың қаулыларын, Орталық сайлау комиссиясының нормативтік қаулыларын, мәслихаттардың нормативтік құқықтық шешімдерін, сондай-ақ әкімдіктердің нормативтік құқықтық қаулылары мен әкімдердің нормативтік құқықтық шешімдерін ресми жариялау жүзеге асырылатын интернет-ресурсты айқындау және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер енгізу туралы» 2013 жылғы 21 қазандағы № 1124 қаулыларына өзгерістер енгізу туралы

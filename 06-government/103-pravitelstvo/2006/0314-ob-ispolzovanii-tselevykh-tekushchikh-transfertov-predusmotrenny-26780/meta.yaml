act_code: '26780'
requisite: Постановление Правительства Республики Казахстан от 14 марта 2006 года N 162
title:
  rus: Об использовании целевых текущих трансфертов, предусмотренных в республиканском бюджете на 2006 год, на обеспечение нуждающихся инвалидов обязательными гигиеническими средствами и предоставление услуг специалистами жестового языка, индивидуальными помощниками в соответствии с индивидуальной программой реабилитации инвалида
  kaz: 2006 жылға арналған республикалық бюджетте мұқтаж мүгедектердi мiндеттi гигиеналық құралдармен қамтамасыз етуге және мүгедектi оңалтудың жеке бағдарламасына сәйкес ымдау тiлi мамандарының, жеке көмекшiлердiң қызметтер көрсетуiне көзделген нысаналы ағымдағы трансферттердi пайдалану туралы

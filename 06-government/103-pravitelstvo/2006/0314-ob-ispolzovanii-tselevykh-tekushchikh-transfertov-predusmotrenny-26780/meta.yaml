caused_by:
  code: '89533'
  requisite: Постановление Правительства Республики Казахстан от 25 апреля 2015 года № 297
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 20 июля 2005 года № 754 "О некоторых вопросах реабилитации инвалидов" и от 19 февраля 2015 года № 82 "Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2015 год областными бюджетами, бюджетами городов Астаны и Алматы на оказание социальной защиты и помощи населению и признании утратившим силу постановления Правительства Республики Казахстан от 17 февраля 2014 года № 97 "Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2014 - 2016 годы областными бюджетами, бюджетами городов Астаны и Алматы на оказание социальной защиты и помощи населению" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Үкіметінің "Мүгедектерді оңалтудың кейбір мәселелері туралы" 2005 жылғы 20 шілдедегі № 754 және "Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2015 жылға арналған республикалық бюджеттен халықты әлеуметтік қорғауға және оған көмек көрсетуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту және "Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2014 - 2016 жылдарға арналған республикалық бюджеттен халықты әлеуметтік қорғауға және оған көмек көрсетуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2014 жылғы 17 ақпандағы № 97 қаулысының күші жойылды деп тану туралы" 2015 жылғы 19 ақпандағы № 82 қаулыларына өзгерістер мен толықтыру енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

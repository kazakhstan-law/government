  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 5 апреля 2006 года № 248 "Об утверждении Правил субсидирования стоимости услуг по подаче питьевой воды из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения"
    kaz: '"Ауыз сумен жабдықтаудың баламасыз көзi болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерiнен ауыз су беру жөнiндегi қызметтердiң құнын субсидиялау ережесiн бекiту туралы" Қазақстан Республикасы Үкіметінің 2006 жылғы 5 сәуірдегі № 248 қаулысына өзгерістер енгізу туралы'

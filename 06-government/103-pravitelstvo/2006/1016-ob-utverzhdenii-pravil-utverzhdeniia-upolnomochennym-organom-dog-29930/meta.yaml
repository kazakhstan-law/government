requisite: Постановление Правительства Республики Казахстан от 16 октября 2006 года № 996. Утратило силу постановлением Правительства Республики Казахстан от 14 мая 2009 года № 709
title:
  rus: Об утверждении Правил утверждения уполномоченным органом договора присоединения к сетям телекоммуникаций общего пользования доминирующего оператора связи других сетей телекоммуникаций, определяющего условия оказания услуг присоединения, а также связанные с этим обязательства по взаимодействию сетей и пропуску трафика
  kaz: Уәкілетті органның басқа телекоммуникация желiлерiн басым байланыс операторының жалпы пайдаланымдағы телекоммуникация желiлерiне қосу қызметтерiн көрсету шарттарын, сондай-ақ желiлердiң өзара iс-әрекет етуi және трафиктi өткiзу жөнiндегi онымен байланысты мiндеттемелердi айқындайтын қосылу шартын бекiту ережесiн бекiту туралы

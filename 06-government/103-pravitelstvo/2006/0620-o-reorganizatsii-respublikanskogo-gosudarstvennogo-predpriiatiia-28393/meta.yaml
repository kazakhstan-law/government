  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлiгi Су ресурстары комитетiнiң "Солтүстiксуқұрылыс" Қазақстанның солтүстiк және орталық облыстарында су шаруашылығы объектiлерiнiң құрылысы жөнiндегi өңiрлiк дирекция" шаруашылық жүргiзу құқығындағы республикалық мемлекеттiк кәсiпорнын қайта ұйымдастыру туралы

title:
  rus: Об утверждении типовой формы справки органа гидрометеорологической службы и (или) уполномоченного государственного органа в области чрезвычайных ситуаций природного и техногенного характера, подтверждающей факт неблагоприятного природного явления
  kaz: Гидрометеорология қызметi органының және (немесе) табиғи және техногендiк сипаттағы төтенше жағдайлар саласындағы уәкiлеттi мемлекеттiк органның қолайсыз табиғат құбылысы фактiсiн растайтын анықтамасының үлгi нысанын бекiту туралы

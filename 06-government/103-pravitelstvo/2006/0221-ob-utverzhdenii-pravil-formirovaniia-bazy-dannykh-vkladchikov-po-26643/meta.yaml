  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 21 февраля 2006 года № 111 "Об утверждении Правил формирования базы данных вкладчиков (получателей) по обязательным пенсионным взносам, единого списка физических лиц, заключивших договор о пенсионном обеспечении за счет обязательных пенсионных взносов, и Правил представления накопительными пенсионными фондами Государственному центру по выплате пенсий сведений о заключенных и прекративших действие с вкладчиками (получателями) договорах о пенсионном обеспечении за счет обязательных пенсионных взносов с использованием электронного документооборота"
    kaz: '"Мiндеттi зейнетақы жарналары бойынша салымшылардың (алушылардың) дерекқорын, мiндеттi зейнетақы жарналары есебiнен зейнетақымен қамсыздандыру туралы шарт жасасқан жеке тұлғалардың бiрыңғай тiзiмiн қалыптастыру ережесiн және Жинақтаушы зейнетақы қорларының электронды құжат айналымын пайдалана отырып, Зейнетақы төлеу жөнiндегi мемлекеттiк орталыққа салымшылармен (алушылармен) мiндеттi зейнетақы жарналары есебiнен зейнетақымен қамсыздандыру туралы жасалған және қолданылуы тоқтатылған шарттар туралы мәлiметтердi ұсыну ережесiн бекiту туралы" Қазақстан Республикасы Үкіметінің 2006 жылғы 21 ақпандағы № 111 қаулысына өзгерістер мен толықтыру енгізу туралы'

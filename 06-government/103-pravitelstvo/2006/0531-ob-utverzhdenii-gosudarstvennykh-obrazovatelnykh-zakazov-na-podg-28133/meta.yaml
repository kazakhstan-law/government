act_code: '28133'
requisite: Постановление Правительства Республики Казахстан от 31 мая 2006 года N 485
title:
  rus: Об утверждении государственных образовательных заказов на подготовку специалистов со средним профессиональным образованием в организациях образования, получающих средства из республиканского бюджета, с высшим профессиональным образованием, с послевузовским профессиональным образованием в высших учебных заведениях и научных организациях на 2006/2007 учебный год
  kaz: Республикалық бюджеттен қаражат алатын білім беру ұйымдарында кәсіптік орта білімді, кәсіптік жоғары білімді, жоғары оқу орындарында және ғылыми ұйымдарда жоғары оқу орнынан кейінгі кәсіптік білімді мамандар даярлауға 2006/2007 оқу жылына арналған мемлекеттік білім беру тапсырыстарын бекіту туралы

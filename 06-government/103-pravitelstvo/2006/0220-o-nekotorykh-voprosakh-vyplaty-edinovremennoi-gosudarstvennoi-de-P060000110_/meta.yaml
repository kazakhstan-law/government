title:
  rus: О некоторых вопросах выплаты единовременной государственной денежной компенсации гражданам, пострадавшим вследствие ядерных испытаний на Семипалатинском испытательном ядерном полигоне, и выдачи им удостоверений
  kaz: Семей ядролық сынақ полигонындағы ядролық сынақтардың салдарынан зардап шеккен азаматтарға бiржолғы мемлекеттiк ақшалай өтемақы төлеудiң және оларға куәлік берудің кейбiр мәселелерi туралы

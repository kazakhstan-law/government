title:
  rus: Об утверждении Правил осуществления туристской и рекреационной деятельности в государственных национальных природных парках
  kaz: Мемлекеттік ұлттық табиғи парктерде туристік және рекреациялық қызметті жүзеге асыру қағидаларын бекіту туралы

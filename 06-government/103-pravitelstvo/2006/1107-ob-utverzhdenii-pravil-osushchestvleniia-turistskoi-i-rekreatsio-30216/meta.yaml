  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 7 ноября 2006 года № 1063 «Об утверждении Правил осуществления туристской и рекреационной деятельности в государственных национальных природных парках и выдачи разрешения на использование под объекты строительства участков государственных национальных природных парков, предоставленных в пользование для осуществления туристской и рекреационной деятельности»
    kaz: «Мемлекеттік ұлттық табиғи парктерде туристік және рекреациялық қызметті жүзеге асыру және туристік және рекреациялық қызметті жүзеге асыру үшін пайдалануға берілген мемлекеттік ұлттық табиғи парктердің учаскелерін құрылыс объектілері үшін пайдалануға рұқсат беру қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2006 жылғы 7 қарашадағы № 1063 қаулысына өзгерістер енгізу туралы

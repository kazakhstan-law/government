  requisite: Постановление Правительства Республики Казахстан от 5 июля 2012 года № 910
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 7 ноября 2006 года № 1063 "Об утверждении Правил предоставления в аренду земельных участков на территории государственных национальных природных парков для осуществления регулируемого туризма и рекреации" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: '"Реттелмелі туризм мен рекреацияны жүзеге асыру үшін мемлекеттік ұлттық табиғи парктер аумағындағы жер учаскелерін жалға беру ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2006 жылғы 7 қарашадағы № 1063 қаулысына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы'

  kaz: '"Қазақстан Республикасының Қарулы Күштерiнде, басқа да әскерлерi мен әскери құралымдарында әскери қызмет өткеру ережелерiн бекiту туралы" Қазақстан Республикасы Президентiнiң 2006 жылғы 25 мамырдағы № 124 Жарлығын iске асыру жөнiндегi шаралар туралы'

  requisite: Постановление Правительства Республики Казахстан от 10 сентября 2015 года № 770
  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 24 апреля 2001 года № 545 "О мерах по реализации положений Конвенции, отменяющей требование легализации иностранных официальных документов (Гаага, 5 октября 1961 года)" и признании утратившим силу постановления Правительства Республики Казахстан от 13 марта 2013 года № 234 "Об утверждении стандарта государственной услуги "Апостилирование архивных справок и копий архивных документов, исходящих из специального государственного архива Комитета национальной безопасности Республики Казахстан"
    kaz: '"Шетелдік ресми құжаттарды заңдастыруды талап етудің күшін жоятын конвенция (Гаага, 1961 жылғы 5 қазан) ережелерін іске асыру жөніндегі шаралар туралы" Қазақстан Республикасы Үкіметінің 2001 жылғы 24 сәуірдегі № 545 қаулысына өзгеріс енгізу және "Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің арнайы мемлекеттік мұрағатынан шығатын мұрағаттық анықтамаларға және мұрағаттық құжаттардың көшірмелеріне апостиль қою" мемлекеттік қызмет көрсету стандартын бекіту туралы" Қазақстан Республикасы Үкіметінің 2013 жылғы 13 наурыздағы № 234 қаулысының күші жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/93685/rus

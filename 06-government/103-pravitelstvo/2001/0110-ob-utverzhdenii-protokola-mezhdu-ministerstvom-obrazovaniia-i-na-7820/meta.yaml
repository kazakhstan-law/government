title:
  rus: Об утверждении Протокола между Министерством образования и науки Республики Казахстан и Министерством народного образования Республики Узбекистан об обмене учебниками и учебно-методической литературой для общеобразовательных школ Республики Казахстан и Республики Узбекистан
  kaz: Қазақстан Республикасының Білім және ғылым министрлігі мен Өзбекстан Республикасының Халыққа білім беру министрлігі арасындағы Қазақстан Республикасының және Өзбекстан Республикасының жалпы орта білім беретін мектептері үшін оқулықтар мен оқу-әдістемелік әдебиеттер алмасу туралы хаттаманы бекіту туралы

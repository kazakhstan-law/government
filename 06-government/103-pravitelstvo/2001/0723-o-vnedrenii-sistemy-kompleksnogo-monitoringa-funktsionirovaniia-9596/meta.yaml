act_code: '9596'
requisite: Постановление Правительства Республики Казахстан от 24 июля 2001 года № 998. Утратило силу постановлением Правительства Республики Казахстан от 4 декабря 2012 года № 1546
title:
  rus: О внедрении системы комплексного мониторинга функционирования и эффективности управления объектами государственной собственности, а также объектами, в которых государство имеет долю собственности
  kaz: Мемлекеттік меншік объектілерінің, сондай-ақ меншігінде мемлекеттің үлесі бар объектілердің жұмыс істеуіне және оларды басқарудың тиімділігіне кешенді мониторинг жүйесін енгізу туралы

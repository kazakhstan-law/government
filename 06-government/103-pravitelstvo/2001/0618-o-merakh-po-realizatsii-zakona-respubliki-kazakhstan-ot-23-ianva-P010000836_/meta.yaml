  requisite: Постановление Правительства Республики Казахстан от 8 ноября 2013 года № 1188
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 19 июня 2001 года № 836 "О мерах по реализации Закона Республики Казахстан от 23 января 2001 года "О занятости населения" и от 13 января 2012 года № 45 "Об утверждении Правил установления квоты на привлечение иностранной рабочей силы в Республику Казахстан, Правил и условий выдачи разрешений иностранному работнику на трудоустройство и работодателям на привлечение иностранной рабочей силы и о внесении изменения в постановление Правительства Республики Казахстан от 19 июня 2001 года № 836 "О мерах по реализации Закона Республики Казахстан от 23 января 2001 года "О занятости населения"
    kaz: Қазақстан Республикасы Үкіметінің "Халықты жұмыспен қамту туралы" Қазақстан Республикасының 2001 жылғы 23 қаңтардағы Заңын іске асыру жөніндегі шаралар туралы" 2001 жылғы 19 маусымдағы № 836 және "Қазақстан Республикасына шетелдік жұмыс күшін тартуға арналған квотаны белгілеу қағидаларын және Шетелдік қызметкерге жұмысқа орналасуға және жұмыс берушілерге шетелдік жұмыс күшін тартуға рұқсат берудің қағидалары мен шарттарын бекіту және "Халықты жұмыспен қамту туралы" Қазақстан Республикасының 2001 жылғы 23 қаңтардағы Заңын іске асыру жөніндегі шаралар туралы" Қазақстан Республикасы Үкіметінің 2001 жылғы 19 маусымдағы № 836 қаулысына өзгеріс енгізу туралы" 2012 жылғы 13 қаңтардағы № 45 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/75196/rus

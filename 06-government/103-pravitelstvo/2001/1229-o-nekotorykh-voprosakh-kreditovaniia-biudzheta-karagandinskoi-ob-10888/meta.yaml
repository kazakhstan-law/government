act_code: '10888'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2001 года № 1763
title:
  rus: О некоторых вопросах кредитования бюджета Карагандинской области на ремонт и реконструкцию объектов водоснабжения и теплоснабжения, приобретение топлива для теплоисточников западного района города Темиртау
  kaz: Темiртау қаласы батыс аймағының сумен жабдықтау және жылумен жабдықтау объектiлерiн жөндеуге және қайта жаңартуға, жылу көздерi үшін отын сатып алуға Қарағанды облысының бюджетiн несиелендiрудің кейбiр мәселелерi туралы

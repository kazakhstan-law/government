title:
  rus: Об утверждении Правил использования средств, предусмотренных в республиканском бюджете на 2001 год на участие в реконструкции и расширении энергетических мощностей при подключении дополнительных нагрузок объектов центральных государственных органов
  kaz: Орталық мемлекеттiк органдар объектiлерiнiң қосымша жүктемелерiн қосу кезiнде энергетикалық қуаттарды қайта құруға және ұлғайтуға қатысуға 2001 жылға арналған республикалық бюджетте көзделген қаражатты пайдалану ережесiн бекiту туралы

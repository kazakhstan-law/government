act_code: '10744'
requisite: Постановление Правительства Республики Казахстан от 15 декабря 2001 года N 1647
title:
  rus: О заключении Соглашения между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки о сборах, взимаемых с государственных воздушных судов, и Соглашения между Правительством Республики Казахстан и Правительством Соединенных Штатов Америки о воздушном сообщении
  kaz: Қазақстан Республикасының Үкiметi мен Америка Құрама Штаттарының Үкiметi арасында мемлекеттiк әуе кемелерiнен алынатын алымдар туралы келiсiм және Қазақстан Республикасының Үкiметi мен Америка Құрама Штаттарының Yкiметi арасында әуе қатынасы туралы келiсiм жасасу туралы

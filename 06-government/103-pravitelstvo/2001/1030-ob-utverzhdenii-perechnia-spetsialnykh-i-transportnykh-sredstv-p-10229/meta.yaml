title:
  rus: Об утверждении Перечня специальных и транспортных средств, применяемых сотрудниками органов внутренних дел в целях прекращения общественно опасных деяний, задержания и доставления в органы внутренних дел лиц, их совершивших
  kaz: Қоғамға қауіпті іс-әрекеттерді тоқтату, оларды жасаған адамдарды ұстау және ішкі істер органдарына жеткізу мақсатында ішкі істер органдарының қызметкерлері қолданатын арнайы және көлік құралдарының тізбесін бекіту туралы

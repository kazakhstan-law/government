act_code: '8825'
requisite: Постановление Правительства Республики Казахстан от 10 мая 2001 года № 619. Утратило силу постановлением Правительства Республики Казахстан от 31 мая 2006 года № 484 дсп
title:
  rus: Об утверждении Правил проведения специальной экспертизы организаций и аттестации их руководителей для получения разрешений на проведение работ, связанных с использованием сведений, составляющих государственные секреты, созданием средств защиты государственных секретов, а также с проведением мероприятий и (или) оказанием услуг по защите государственных секретов Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттiк құпияларын құрайтын мәлiметтердi пайдаланумен, мемлекеттiк құпияларды қорғау құралдарын жасаумен, сондай-ақ мемлекеттiк құпияларды қорғау жөнiндегi iс-шараларды жүргiзумен және (немесе) қызметтер көрсетумен байланысты жұмыстар жүргiзуге рұқсат алу үшiн ұйымдарға арнайы сараптама жүргiзу және олардың басшыларын аттестаттаудан өткiзу ережесiн бекiту туралы

title:
  rus: Об утверждении Правил передачи в имущественный наем имущества, находящегося в хозяйственном ведении или оперативном управлении республиканских государственных предприятий, в том числе объектов государственной собственности, не подлежащих приватизации
  kaz: Республикалық мемлекеттiк кәсiпорындардың шаруашылық жүргiзуiндегі немесе жедел басқаруындағы мүлiктi, оның ішiнде жекешелендiруге жатпайтын мемлекеттiк меншiк объектiлерiн мүлiктiк жалға беру ережесiн бекiту туралы

title:
  rus: Об утверждении размеров выплат в случаях, когда постоянная работа протекает в пути или имеет разъездной характер, либо в связи со служебными поездками в пределах обслуживаемых участков, не подлежащих налогообложению
  kaz: Тұрақты жұмысы жолда өтетін немесе жүріп-тұру сипатында болатын не қызмет көрсететін учаскелер шегіндегі қызмет бабындағы сапарларымен байланысты жағдайларда төленетін, салық салынбайтын төлемдердің мөлшерлерін бекіту туралы

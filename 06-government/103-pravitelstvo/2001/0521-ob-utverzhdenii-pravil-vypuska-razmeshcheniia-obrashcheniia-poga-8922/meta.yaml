title:
  rus: Об утверждении Правил выпуска, размещения, обращения, погашения и обслуживания среднесрочных облигаций местного исполнительного органа Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы жергілікті атқарушы органының орта мерзімді облигацияларын шығарудың, орналастырудың, олардың айналысының, өтеудің және оларға қызмет көрсетудің ережесін бекіту туралы

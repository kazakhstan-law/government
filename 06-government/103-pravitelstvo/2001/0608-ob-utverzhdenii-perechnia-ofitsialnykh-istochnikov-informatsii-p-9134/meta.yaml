title:
  rus: Об утверждении Перечня официальных источников информации по рыночным ценам на отдельные виды товаров, подлежащих государственному контролю при применении трансфертных цен в международных деловых операциях
  kaz: Халықаралық іскерлік операцияларда трансферттік бағалар қолдану кезінде мемлекеттік бақылауға жататын тауарлардың жекелеген түрлеріне рыноктағы бағалары бойынша ресми ақпарат көздерінің тізбесін бекіту туралы

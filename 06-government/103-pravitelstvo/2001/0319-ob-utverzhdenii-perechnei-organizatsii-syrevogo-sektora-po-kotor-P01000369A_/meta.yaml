title:
  rus: Об утверждении перечней организаций сырьевого сектора, по которым сверхплановые налоговые и иные обязательные платежи в бюджет зачисляются в Национальный фонд Республики Казахстан
  kaz: Жоспардан тыс салықтық және бюджетке төленетін өзге де міндетті төлемдері Қазақстан Республикасының Ұлттық қорына есепке алынатын шикізат секторы ұйымдарының тізбелерін бекіту туралы

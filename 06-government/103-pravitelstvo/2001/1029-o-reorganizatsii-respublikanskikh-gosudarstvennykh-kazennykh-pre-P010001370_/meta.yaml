title:
  rus: О реорганизации республиканских государственных казенных предприятий "Республиканская клиника профессиональных заболеваний", "Профпатологическая клиника" Агентства Республики Казахстан по делам здравоохранения и Республиканского государственного казенного предприятия "Институт физиологии и гигиены труда" Министерства образования и науки Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау ісі жөніндегі агенттігінің "Республикалық кәсіби аурулар клиникасы", "Кәсіби патология клиникасы" республикалық мемлекеттік қазыналық кәсіпорындарын және Қазақстан Республикасы Білім және ғылым министрлігінің "Физиология және еңбек гигиенасы институты" республикалық мемлекеттік қазыналық кәсіпорнын қайта ұйымдастыру туралы

title:
  rus: Об утверждении Правил возмещения ставки вознаграждения (интереса) по лизингу сельскохозяйственной техники, осуществляемому за счет средств республиканского бюджета
  kaz: Республикалық бюджет қаражаты есебiнен жүзеге асырылатын ауыл шаруашылығы техникасының лизингi бойынша сыйақы (мүдде) ставкасын өтеу ережесiн бекiту туралы

title:
  rus: Об утверждении Правил премирования, оказания материальной помощи и установления надбавок к должностным окладам работников органов Республики Казахстан за счет средств государственного бюджета, а также выплаты бонусов административным государственным служащим
  kaz: Мемлекеттiк бюджет қаражаты есебінен Қазақстан Республикасы органдарының қызметкерлеріне сыйлықақы беру, материалдық көмек көрсету және лауазымдық жалақыларына үстемеақылар белгілеу, сондай-ақ мемлекеттік әкімшілік қызметшілерге бонустар төлеу қағидаларын бекіту туралы

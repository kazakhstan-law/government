title:
  rus: Об утверждении Правил приобретения (продажи), регистрации, проектирования, строительства (установки), эксплуатации на территории Республики Казахстан и ввоза из-за границы радиоэлектронных средств и высокочастотных устройств
  kaz: Қазақстан Республикасының аумағында радиоэлектрондық құралдар мен жоғары жиілікті құрылғыларды сатып алудың (сатудың), тіркеудің, жобалаудың, салудың (орнатудың), пайдаланудың және шетелден әкелудің ережесін бекіту туралы

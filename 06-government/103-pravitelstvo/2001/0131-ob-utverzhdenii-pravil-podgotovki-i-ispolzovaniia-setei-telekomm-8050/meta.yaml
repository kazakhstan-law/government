  code: '136697'
  requisite: Постановление Правительства Республики Казахстан от 4 декабря 2019 года № 902
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 января 2001 года № 164 «Об утверждении Правил подготовки и использования сетей телекоммуникаций общего пользования, ресурсов единой сети телекоммуникаций для нужд государственных органов, органов обороны, безопасности и охраны правопорядка Республики Казахстан»
    kaz: «Қазақстан Республикасы мемлекеттік органдарының, қорғаныс, қауіпсіздік және құқық тәртібін қорғау органдарының мұқтаждары үшін жалпы пайдаланыстағы телекоммуникациялар желілерін, біртұтас телекоммуникациялар желілерінің ресурстарын дайындау мен пайдаланудың ережесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2001 жылғы 31 қаңтардағы № 164 қаулысына өзгерістер енгізу туралы

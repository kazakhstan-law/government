act_code: '8050'
requisite: Постановление Правительства Республики Казахстан от 31 января 2001 года N 164
title:
  rus: Об утверждении Правил подготовки и использования сетей телекоммуникаций общего пользования, ресурсов единой сети телекоммуникаций для нужд государственных органов, органов обороны, безопасности и охраны правопорядка Республики Казахстан
  kaz: Қазақстан Республикасы мемлекеттік органдарының, қорғаныс, қауіпсіздік және құқықтық тәртіпті қорғау органдарының қажеттіліктері үшін ортақ пайдаланылатын телекоммуникация желілерін, телекоммуникациялардың бірыңғай желісінің ресурстарын дайындау және пайдалану қағидаларын бекіту туралы

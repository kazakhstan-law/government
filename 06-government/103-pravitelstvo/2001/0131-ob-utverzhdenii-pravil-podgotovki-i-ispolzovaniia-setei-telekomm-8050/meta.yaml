caused_by:
  code: '226181'
  requisite: Постановление Правительства Республики Казахстан от 8 июня 2026 года № 475
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 января 2001 года № 164 «Об утверждении Правил подготовки и использования сетей телекоммуникаций общего пользования, ресурсов единой сети телекоммуникаций для нужд государственных органов, органов обороны, безопасности и охраны правопорядка Республики Казахстан»
    kaz: «Қазақстан Республикасы мемлекеттік органдарының, қорғаныс, қауіпсіздік және құқықтық тәртіпті қорғау органдарының қажеттіліктері үшін ортақ пайдаланылатын телекоммуникация желілерін, телекоммуникациялардың бірыңғай желісінің ресурстарын дайындау және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2001 жылғы 31 қаңтардағы № 164 қаулысына өзгерістер енгізу туралы

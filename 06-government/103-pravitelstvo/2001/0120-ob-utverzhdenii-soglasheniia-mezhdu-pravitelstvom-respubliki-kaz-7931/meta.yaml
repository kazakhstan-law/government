act_code: '7931'
requisite: Постановление Правительства Республики Казахстан от 20 января 2001 года № 86
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации об открытии Консульства Республики Казахстан в городе Астрахани, Российская Федерация, и Консульства Российской Федерации в городе Уральске, Республика Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Ресей Федерациясы, Астрахань қаласында Қазақстан Республикасының Консулдығын және Қазақстан Республикасы, Орал қаласында Ресей Федерациясының Консулдығын ашу туралы келісімді бекіту туралы

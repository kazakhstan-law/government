title:
  rus: О лимитах штатной численности аппаратов акимов областей (города республиканского значения, столицы), районов (городов областного значения), поселков, аулов (сел), аульных (сельских) округов и предельном числе заместителей акима области (города республиканского значения, столицы), района (города областного значения), поселка, аула (села), аульного (сельского) округа
  kaz: Облыстар (республикалық маңызы бар қала, астана), аудандар (облыстық маңызы бар қалалар), кенттер, ауылдар (селолар), ауылдық (селолық) округтер әкiмдерiнiң аппараттары штат санының лимиттерi және облыс (республикалық маңызы бар қала, астана), аудан (облыстық маңызы бар қала), кент, ауыл (село), ауылдық (селолық) округтің әкiмi орынбасарларының шектi саны туралы

  title:
    rus: О внесении изменения и дополнений в постановление Правительства Республики Казахстан от 16 августа 2001 года № 1074 «Об утверждении Положения о Министерстве обороны Республики Казахстан» и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: «Қазақстан Республикасының Қорғаныс министрлігі туралы ереженi бекiту туралы» Қазақстан Республикасы Үкіметінің 2001 жылғы 16 тамыздағы № 1074 қаулысына өзгеріс пен толықтырулар енгiзу және Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiнiң күшi жойылды деп тану туралы

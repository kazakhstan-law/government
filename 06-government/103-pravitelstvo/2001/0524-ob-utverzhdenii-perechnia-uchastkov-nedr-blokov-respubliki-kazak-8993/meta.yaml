act_code: '8993'
requisite: Постановление Правительства Республики Казахстан от 25 мая 2001 года № 721
title:
  rus: Об утверждении Перечня участков недр (блоков) Республики Казахстан по твердым полезным ископаемым, углеводородному сырью, подземным водам и лечебным грязям, подлежащих выставлению Компетентным органом на открытый конкурс инвестиционных программ на получение права недропользования в 2001 году
  kaz: 2001 жылы жер қойнауын пайдалану құқығын алуға арналған инвестициялық бағдарламалардың ашық конкурсына Құзыретті органның шығаруына жататын Қазақстан Республикасының қатты пайдалы қазбалар, көмірсутегі шикізатты, жерасты сулары және шипалы балшықтары бойынша жер қойнауы учаскелерінің (блоктарының) тізбесін бекіту туралы

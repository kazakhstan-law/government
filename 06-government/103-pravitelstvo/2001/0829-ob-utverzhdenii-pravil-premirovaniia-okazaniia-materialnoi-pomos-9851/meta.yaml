  requisite: Постановление Правительства Республики Казахстан от 29 января 2026 года № 54
  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 29 августа 2001 года № 1127 «Об утверждении Правил премирования, оказания материальной помощи и установления надбавок к должностным окладам работников органов Республики Казахстан за счет средств государственного бюджета, а также выплаты бонусов административным государственным служащим»
    kaz: «Мемлекеттiк бюджет қаражаты есебінен Қазақстан Республикасы органдарының қызметкерлеріне сыйлықақы беру, материалдық көмек көрсету және лауазымдық жалақыларына үстемеақылар белгілеу, сондай-ақ мемлекеттік әкімшілік қызметшілерге бонустар төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2001 жылғы 29 тамыздағы № 1127 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/221688/rus

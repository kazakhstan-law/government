  title:
    rus: Об утверждении Правил исчисления выслуги лет военнослужащим, сотрудникам специальных государственных и правоохранительных органов, государственной фельдъегерской службы, а также лицам, права которых иметь воинские или специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года, и лицам, медицинские должности которых сокращены в органах внутренних дел Республики Казахстан с 1 июля 2022 года и 1 января 2023 года, имевшим на момент сокращения должности выслугу лет не менее двенадцати лет и шести месяцев непрерывной воинской службы, службы в специальных государственных и правоохранительных органах, государственной фельдъегерской службе, при условии продолжения ими работы в медицинских организациях, расположенных в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы
    kaz: Әскери қызметшiлердің, арнаулы мемлекеттік және құқық қорғау органдары, мемлекеттік фельдъегерлік қызмет қызметкерлерiнің, сондай-ақ арнаулы атақтарға, сыныптық шендерге ие болу және нысанды киiм киiп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдардың және Қазақстан Республикасының ішкі істер органдарындағы медициналық лауазымдары 2022 жылғы 1 шілдеден және 2023 жылғы 1 қаңтардан бастап қысқартылған, лауазымы қысқартылған кезде еңбек сіңірген жылдары үзіліссіз әскери қызметте, арнаулы мемлекеттік және құқық қорғау органдарындағы қызметте, мемлекеттік фельдъегерлік қызметте кемінде он екі жыл және алты ай болған адамдар қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде орналасқан медициналық ұйымдарда жұмысын жалғастырған жағдайда осындай адамдардың еңбек сіңірген жылдарын есептеу қағидаларын бекіту туралы

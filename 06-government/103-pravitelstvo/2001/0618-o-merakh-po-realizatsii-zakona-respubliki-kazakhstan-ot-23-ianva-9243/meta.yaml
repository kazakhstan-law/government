  title:
    rus: Об утверждении Правил установления квоты на привлечение иностранной рабочей силы в Республику Казахстан, Правил и условий выдачи разрешений иностранному работнику на трудоустройство, а также работодателям на привлечение иностранной рабочей силы и иностранных работников, переводимых в рамках внутрикорпоративного перевода, и о внесении изменения в постановление Правительства Республики Казахстан от 19 июня 2001 года № 836 "О мерах по реализации Закона Республики Казахстан от 23 января 2001 года "О занятости населения"
    kaz: Қазақстан Республикасына шетелдік жұмыс күшін тартуға арналған квотаны белгілеу қағидаларын, Шетелдік қызметкерге жұмысқа орналасуға, сондай-ақ жұмыс берушілерге шетелдік жұмыс күшін тартуға және корпоративішілік ауыстыру шеңберінде ауыстырылатын шетелдік қызметкерлерді тартуға рұқсаттар беру қағидалары мен шарттарын бекіту және "Халықты жұмыспен қамту туралы" 2001 жылғы 23 қаңтардағы Қазақстан Республикасының Заңын іске асыру жөніндегі шаралар туралы" Қазақстан Республикасы Үкіметінің 2001 жылғы 19 маусымдағы № 836 қаулысына өзгеріс енгізу туралы

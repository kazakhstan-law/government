title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Кабинетом Министров Украины о сотрудничестве по поставкам казахстанской нефти в Украину и ее транзита по территории Украины
  kaz: Қазақстан Республикасының Yкiметi мен Украина Министрлер Кабинетiнiң арасындағы Қазақстан мұнайының Украинаға жеткiзiлiмi және оның Украина аумағы бойынша транзиті жөнiндегi ынтымақтастық туралы келiсiмдi бекiту туралы

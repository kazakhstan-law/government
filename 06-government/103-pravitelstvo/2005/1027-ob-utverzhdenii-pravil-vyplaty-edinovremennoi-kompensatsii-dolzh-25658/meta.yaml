act_code: '25658'
requisite: Постановление Правительства Республики Казахстан от 27 октября 2005 года N 1079. Утратило силу постановлением Правительства Республики Казахстан от 7 октября 2010 года N 1034
title:
  rus: Об утверждении Правил выплаты единовременной компенсации должностному лицу таможенного органа при получении увечья либо иного повреждения здоровья, исключающего для него возможность в дальнейшем заниматься профессиональной деятельностью, а также в случае его гибели (смерти) в связи с исполнением служебных обязанностей
  kaz: Кеден органының лауазымды адамына қызметтiк мiндеттерiн орындауына байланысты, өзiнiң кәсiби қызметiмен одан әрi айналысуына мүмкiндiк бермейтiндей болып мертiккен не денсаулығына өзге де зақым келген кезде, сондай-ақ ол қаза тапқан (қайтыс болған) жағдайда бiржолғы өтемақы төлеу ережесiн бекiту туралы

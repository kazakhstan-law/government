act_code: '22941'
requisite: Постановление Правительства Республики Казахстан от 17 февраля 2005 года N 145
title:
  rus: Об утверждении Правил расходования средств на компенсацию повышения тарифов за электроэнергию, вырабатываемую энергопроизводящей организацией в целях покрытия дефицита электроэнергии и обеспечения стабильного энергоснабжения потребителей Южного Казахстана
  kaz: Оңтүстiк Қазақстанның электр энергиясына тапшылығын жабу және тұтынушыларын энергиямен тұрақты жабдықтауды қамтамасыз ету мақсатында энергия өндiретiн ұйым шығаратын электр энергиясы үшiн тарифтердiң көтерiлуiн өтеуге арналған қаражатты жұмсау ережесiн бекiту туралы

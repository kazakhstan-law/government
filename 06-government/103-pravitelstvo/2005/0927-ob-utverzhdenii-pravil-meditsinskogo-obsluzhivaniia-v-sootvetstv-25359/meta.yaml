title:
  rus: Об утверждении Правил медицинского обслуживания в соответствующих государственных учреждениях здравоохранения органов внутренних дел сотрудников уголовно-исполнительной системы органов юстиции и членов их семей, проживающих совместно с ними, а также пенсионеров уголовно- исполнительной системы органов юстиции
  kaz: Iшкi iстер органдарының тиiстi мемлекеттiк денсаулық сақтау мекемелерiнде әділет органдарының қылмыстық-атқару жүйесi қызметкерлерiне және олармен бiрге тұратын отбасы мүшелерiне, сондай-ақ әділет органдарының қылмыстық-атқару жүйесi зейнеткерлерiне медициналық қызмет көрсету ережесiн бекіту туралы

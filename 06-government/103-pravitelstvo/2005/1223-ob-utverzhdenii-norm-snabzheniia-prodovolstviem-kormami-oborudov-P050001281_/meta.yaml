    kaz: '"Қазақстан Республикасының Қарулы Күштерiн, басқа да әскерлерi мен әскери құралымдарын азық-түлiкпен, жабдықпен және асханалық-ас үйлік ыдыспен жабдықтаудың бейбiт уақытқа арналған нормаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2005 жылғы 23 желтоқсандағы № 1281 қаулысына өзгерістер енгізу туралы'

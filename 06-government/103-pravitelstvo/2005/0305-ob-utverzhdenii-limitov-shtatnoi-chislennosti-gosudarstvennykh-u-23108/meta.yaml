  title:
    rus: О ликвидации государственных учреждений "Учреждение УЛ-154/4", "Учреждение ЕЦ-166/13" и создании государственных учреждений "Центр реабилитации 1", "Центр реабилитации 2" Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан
    kaz: Қазақстан Республикасы Әділет министрлігі Қылмыстық-атқару жүйесі комитетінің "УЛ-154/4 мекемесі", "ЕЦ-166/13 мекемесі" мемлекеттік мекемелерін тарату және "Оңалту орталығы 1", "Оңалту орталығы 2" мемлекеттік мекемелерін құру туралы
  link: https://zan.gov.kz/client/#!/doc/34976/rus

act_code: '22851'
requisite: Постановление Правительства Республики Казахстан от 7 февраля 2005 года № 114. Утратило силу постановлением Правительства Республики Казахстан от 20 октября 2011 года № 1192 (вводится в действие по истечении десяти календарных дней со дня первого официального опубликования)
title:
  rus: Об утверждении Правил выплаты единовременной компенсации иждивенцам и наследникам сотрудника органов прокуратуры Республики Казахстан в случае гибели (смерти) в период исполнения им служебных обязанностей либо в течение года после увольнения со службы вследствие травмы или увечья, полученных при исполнении служебных обязанностей
  kaz: Қазақстан Республикасы прокуратура органдарының қызметкерi қызметтiк мiндеттерiн атқару кезеңiнде не қызметтiк мiндеттерiн атқару кезiнде алған жарақат немесе мертiгу салдарынан қызметтен босатылғаннан кейiнгi бiр жыл iшiнде қаза тапқан (қайтыс болған) жағдайда олардың асырауындағылары мен мұрагерлерiне бiржолғы өтемақы төлеу ережесiн бекiту туралы

  requisite: Постановление Правительства Республики Казахстан от 19 июля 2007 года № 613
  title:
    rus: О создании государственного учреждения "Республиканская школа-интернат для одаренных в спорте детей" в микрорайоне "Шанырак" города Алматы Комитета по спорту Министерства туризма и спорта Республики Казахстан
    kaz: Қазақстан Республикасы Туризм және спорт министрлігінің Спорт комитеті Алматы қаласының "Шаңырақ" шағын ауданындағы "Спорттағы дарынды балаларға арналған республикалық мектеп-интернаты" мемлекеттік мекемесін құру туралы
  link: https://zan.gov.kz/client/#!/doc/34116/rus

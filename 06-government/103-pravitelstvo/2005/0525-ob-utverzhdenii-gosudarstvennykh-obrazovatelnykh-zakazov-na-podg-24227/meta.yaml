act_code: '24227'
requisite: Постановление Правительства Республики Казахстан от 25 мая 2005 года № 508
title:
  rus: Об утверждении государственных образовательных заказов на подготовку специалистов со средним профессиональным образованием в организациях образования, получающих средства из республиканского бюджета, с высшим профессиональным образованием, с послевузовским профессиональным образованием в высших учебных заведениях и научных организациях на 2005/2006 учебный год
  kaz: Республикалық бюджеттен қаражат алатын бiлiм беру ұйымдарында кәсiптiк орта бiлiмдi, кәсiптiк жоғары бiлiмдi, жоғары оқу орындарында және ғылыми ұйымдарда жоғары оқу орнынан кейiнгi кәсiптiк бiлiмдi мамандар даярлауға 2005/2006 оқу жылына арналған мемлекеттiк бiлiм беру тапсырыстарын бекiту туралы

  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 15 декабря 2005 года № 1251 "Об утверждении Перечней селитебных территорий и особо важных объектов государственной собственности, защищаемых государственной противопожарной службой от пожаров" и от 15 апреля 2008 года № 339 "Об утверждении лимитов штатной численности министерств и иных центральных исполнительных органов с учетом численности их территориальных органов и подведомственных им государственных учреждений"
    kaz: Қазақстан Республикасы Үкіметінің "Мемлекеттік өртке қарсы қызмет өрттен қорғайтын қоныстану аумақтарының және мемлекеттік меншіктегі аса маңызды объектілердің тізбелерін бекіту туралы" 2005 жылғы 15 желтоқсандағы № 1251 және "Министрліктер мен өзге де орталық атқарушы органдардың олардың аумақтық органдарындағы және оларға ведомстволық бағыныстағы мемлекеттік мекемелердегі адам санын ескере отырып, штат санының лимиттерін бекіту туралы" 2008 жылғы 15 сәуірдегі № 339 қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/62613/rus

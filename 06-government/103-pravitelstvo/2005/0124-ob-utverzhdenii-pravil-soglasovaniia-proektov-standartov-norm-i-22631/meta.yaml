title:
  rus: Об утверждении Правил согласования проектов стандартов, норм и правил, устанавливающих требования пожарной безопасности, а также проектных решений на строительство объектов, на которые отсутствуют эти нормы и правила
  kaz: Өрт қауiпсiздігінiң талаптарын белгiлейтiн стандарттардың, нормалар мен ережелердiң жобаларын, сондай-ақ осындай нормалары мен ережелерi жоқ объектілердiң құрылысын салуға арналған жобалық шешiмдердi келiсу ережесiн бекiту туралы

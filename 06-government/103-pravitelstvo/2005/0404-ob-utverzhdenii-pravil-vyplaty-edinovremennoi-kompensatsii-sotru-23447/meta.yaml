act_code: '23447'
requisite: Постановление Правительства Республики Казахстан от 4 апреля 2005 года № 299. Утратило силу постановлением Правительства Республики Казахстан от 20 октября 2011 года № 1192
title:
  rus: Об утверждении Правил выплаты единовременной компенсации сотрудникам уголовно-исполнительной системы органов юстиции Республики Казахстан при получении увечья в период исполнения служебных обязанностей или служебного долга, а в случае их гибели (смерти) - лицам, имеющим право на ее получение
  kaz: Қазақстан Республикасы әдiлет органдарының қылмыстық-атқару жүйесi қызметкерлерiне қызметтік мiндеттерiн немесе қызметтiк борышын атқару кезеңiнде мертiккен кезде, ал олар қаза тапқан (қайтыс болған) жағдайда оны алуға құқығы бар адамдарға бiржолғы өтемақы төлеу ережесiн бекiту туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 22 июня 2005 года № 607 «Вопросы Министерства внутренних дел Республики Казахстан» и от 7 ноября 2014 года № 1180 «Об утверждении перечня электронных средств слежения, используемых службой пробации уголовно-исполнительной системы и сотрудниками полиции органов внутренних дел Республики Казахстан, и внесении изменений в постановления Правительства Республики Казахстан от 26 марта 2014 года № 266 «Об утверждении Правил превентивных посещений группами, формируемыми из участников национального превентивного механизма» и от 2 апреля 2014 года № 301 «Об утверждении Правил возмещения расходов участников национального превентивного механизма по превентивным посещениям»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Ішкі істер министрлігінің мәселелері» туралы 2005 жылғы 22 маусымдағы № 607 және «Қазақстан Республикасының ішкі істер органдарының қылмыстық-атқару жүйесінің пробация қызметі мен полиция қызметкерлері пайдаланатын электрондық бақылау құралдарының тізбесін бекіту және Қазақстан Республикасы Үкіметінің «Ұлттық алдын алу тетігінің қатысушыларынан құралатын топтардың алдын ала болу қағидаларын бекіту туралы» 2014 жылғы 26 наурыздағы № 266 және «Ұлттық алдын алу тетігі қатысушыларының алдын ала болу бойынша шығыстарын өтеу қағидаларын бекіту туралы» 2014 жылғы 2 сәуірдегі № 301 қаулыларына өзгерістер енгізу туралы» 2014 жылғы 7 қарашадағы № 1180 қаулыларына өзгерістер мен толықтырулар енгізу туралы

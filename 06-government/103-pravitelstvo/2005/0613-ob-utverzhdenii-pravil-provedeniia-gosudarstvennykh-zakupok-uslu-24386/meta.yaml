title:
  rus: Об утверждении Правил проведения государственных закупок услуг по проведению анализа эффективности управления активами, оценке стоимости объектов приватизации и их финансового состояния, выполнения инвестиционных обязательств
  kaz: Активтердi басқарудың тиiмділігiне талдау жүргiзу, жекешелендiру объектілерiнiң құнын және олардың қаржылық жай-күйiн бағалау жөнiндегі қызметтердi мемлекеттiк сатып алуды жүргiзу, инвестициялық мiндеттемелердi орындау ережесiн бекiту туралы

title:
  rus: Об утверждении перечня технических вспомогательных (компенсаторных) средств и специальных средств передвижения, предоставляемых инвалидам
  kaz: Мүгедектерге берілетін техникалық көмекші (орнын толтырушы) құралдар мен арнаулы жүріп-тұру құралдарының тізбесін бекіту туралы

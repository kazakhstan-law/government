  title:
    rus: О передаче и переименовании государственного учреждения "Республиканский научно-методический центр агрохимической службы" Министерства сельского хозяйства Республики Казахстан из ведения Министерства сельского хозяйства Республики Казахстан в ведение Агентства Республики Казахстан по управлению земельными ресурсами
    kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігінің "Агрохимия қызметі республикалық ғылыми-әдістемелік орталығы" мемлекеттік мекемесін Қазақстан Республикасы Ауыл шаруашылығы министрлігінің қарамағынан Қазақстан Республикасы Жер ресурстарын басқару агенттігінің қарамағына беру және қайта атау туралы

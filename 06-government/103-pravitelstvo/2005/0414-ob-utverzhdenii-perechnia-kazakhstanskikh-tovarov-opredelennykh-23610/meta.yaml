act_code: '23610'
requisite: Постановление Правительства Республики Казахстан от 14 апреля 2005 года № 355. Утратило силу постановлением Правительства Республики Казахстан от 19 января 2012 года № 133
title:
  rus: Об утверждении перечня казахстанских товаров, определенных в соответствии с таможенным законодательством Республики Казахстан, произведенных на территории, на которой действует таможенный режим "Свободный склад", и реализуемых на остальную часть таможенной территории Республики Казахстан, обороты по реализации которых освобождаются от налога на добавленную стоимость
  kaz: Қазақстан Республикасының кеден заңнамасына сәйкес айқындалған, "Еркiн қойма" кеден режимi қолданылатын аумақта өндiрiлген және Қазақстан Республикасы кеден аумағының қалған бөлiгiне сатылатын, сату бойынша айналымдар қосылған құн салығынан босатылатын қазақстандық тауарлардың тiзбесiн бекiту туралы

title:
  rus: Об утверждении Правил проведения конкурса по закреплению рыбохозяйственных водоемов и (или) участков и квалификационных требований, предъявляемых к участникам конкурса
  kaz: Балық шаруашылығы су айдындарын және (немесе) учаскелерін бекiтiп беру бойынша конкурс өткiзу ережесiн және конкурсқа қатысушыларға қойылатын бiлiктiлiк талаптарын бекiту туралы

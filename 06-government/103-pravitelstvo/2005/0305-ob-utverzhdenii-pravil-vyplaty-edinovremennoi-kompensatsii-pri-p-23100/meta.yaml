act_code: '23100'
requisite: Постановление Правительства Республики Казахстан от 5 марта 2005 года № 212. Утратило силу постановлением Правительства Республики Казахстан от 20 октября 2011 года № 1192
title:
  rus: Об утверждении Правил выплаты единовременной компенсации при получении увечья сотрудником органов государственной противопожарной службы в период исполнения им служебных обязанностей или служебного долга, а в случае его гибели (смерти) - лицам, имеющим право на ее получение
  kaz: Мемлекеттік өртке қарсы қызмет органдарының қызметкерi қызметтік мiндеттерiн немесе қызметтік борышын атқару кезеңiнде мертiккен жағдайда оған, ал ол қаза тапқан (қайтыс болған) жағдайда өтемақы алуға құқығы бар адамдарға бiржолғы өтемақы төлеу ережесiн бекiту туралы

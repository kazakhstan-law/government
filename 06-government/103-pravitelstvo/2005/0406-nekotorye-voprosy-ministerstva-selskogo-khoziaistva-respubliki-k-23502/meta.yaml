  requisite: Постановление Правительства Республики Казахстан от 25 декабря 2025 года № 1141
  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 6 апреля 2005 года № 310 «Некоторые вопросы Министерства сельского хозяйства Республики Казахстан», от 10 июля 2019 года № 497 «О мерах по реализации Указов Президента Республики Казахстан от 17 июня 2019 года № 17 и от 1 июля 2019 года № 46 «О мерах по дальнейшему совершенствованию системы государственного управления Республики Казахстан» и утверждении Плана мероприятий по реализации сельскохозяйственной продукции на внутреннем и внешних рынках
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Ауыл шаруашылығы министрлігінiң кейбiр мәселелерi» туралы Қазақстан Республикасы Үкіметінің 2005 жылғы 6 сәуірдегі № 310, «Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2019 жылғы 17 маусымдағы № 17 және 2019 жылғы 1 шілдедегі № 46 жарлықтарын іске асыру жөніндегі шаралар туралы» 2019 жылғы 10 шілдедегі № 497 қаулыларына өзгерістер мен толықтыру енгізу және Ішкі және сыртқы нарықтарда ауыл шаруашылығы өнімін өткізу жөніндегі іс-шаралар жоспарын бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/220007/rus

  requisite: Постановление Правительства Республики Казахстан от 2 ноября 2016 года № 652
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 6 апреля 2005 года № 310 "Некоторые вопросы Министерства сельского хозяйства Республики Казахстан" и от 28 октября 2015 года № 852 "Об определении лицензиара по осуществлению лицензирования деятельности по оказанию услуг по складской деятельности с выдачей зерновых расписок"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасы Ауыл шаруашылығы министрлігінің кейбір мәселелері" туралы 2005 жылғы 6 сәуірдегі № 310 және "Астық қолхаттарын бере отырып, қойма қызметі бойынша қызметтер көрсету жөніндегі қызметті лицензиялауды жүзеге асыру бойынша лицензиарды айқындау туралы" 2015 жылғы 28 қазандағы № 852 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/107384/rus

act_code: '25866'
requisite: Постановление Правительства Республики Казахстан от 21 ноября 2005 года № 1142
title:
  rus: Об утверждении Правил привлечения организаций, граждан и других лиц к выполнению работ оборонного характера, ликвидации последствий применения противником оружия, восстановлению поврежденных, разрушенных объектов, систем жизнеобеспечения населения, а также к участию в борьбе с пожарами, эпидемиями, эпизоотиями
  kaz: Ұйымдарды, азаматтарды және басқа адамдарды қорғаныс сипатындағы жұмыстарды орындауға, қарсылас жақтың қару қолдануының салдарын жоюға, зақымданған, қираған объектiлердi, халықтың тыныс-тiршiлiгiн қамтамасыз ету жүйесiн қалпына келтiруге, сондай-ақ өртке, эпидемияға, эпизоотияға қарсы күреске қатысуға тарту ережесiн бекiту туралы

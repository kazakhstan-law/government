act_code: '25913'
requisite: Постановление Правительства Республики Казахстан от 25 ноября 2005 года № 1162
title:
  rus: О предоставлении земельных участков в постоянное землепользование государственному учреждению "Барсакельмесский государственный природный заповедник" Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман және аңшылық шаруашылығы комитетінің "Барсакелмес мемлекеттік табиғи қорығы" мемлекеттік мекемесіне тұрақты жер пайдалануға жер учаскелерін беру туралы

act_code: '24654'
requisite: Постановление Правительства Республики Казахстан от 30 июня 2005 года N 657. Утратило силу постановлением Правительства Республики Казахстан от 18 ноября 2010 года N 1212
title:
  rus: Об утверждении перечня геологических, геоморфологических и гидрогеологических объектов государственного природно-заповедного фонда республиканского и международного значения, Правил их ограниченного хозяйственного использования на особо охраняемых природных территориях, а также перечня участков недр, представляющих особую экологическую, научную, культурную и иную ценность, отнесенных к категории особо охраняемых природных территорий республиканского значения
  kaz: Республикалық және халықаралық маңызы бар мемлекеттiк табиғи-қорық қорының геологиялық, геоморфологиялық және гидрогеологиялық объектiлерiнiң тiзбесiн, оларды ерекше қорғалатын табиғи аумақтарда шектеулi шаруашылық мақсатта пайдалану ережесiн, сондай-ақ айрықша экологиялық, ғылыми, мәдени және өзге де құндылықты бiлдiретiн, республикалық маңызы бар ерекше қорғалатын табиғи аумақтар санатына жатқызылған жер қойнауы учаскелерiнiң тiзбесiн бекiту туралы

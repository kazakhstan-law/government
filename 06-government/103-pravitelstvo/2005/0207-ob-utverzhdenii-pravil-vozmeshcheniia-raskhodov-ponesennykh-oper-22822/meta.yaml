act_code: '22822'
requisite: Постановление Правительства Республики Казахстан от 7 февраля 2005 года № 115
title:
  rus: Об утверждении Правил возмещения расходов, понесенных операторами связи при использовании их сетей и средств связи во время чрезвычайных ситуаций социального, природного и техногенного характера, введении чрезвычайного положения
  kaz: Әлеуметтік, табиғи және техногендік сипаттағы төтенше жағдайлар кезінде, төтенше жағдай енгізілген кезде байланыс операторларының желілері мен байланыс құралдары пайдаланылған жағдайда олардың шеккен шығыстарын өтеу қағидаларын бекіту туралы

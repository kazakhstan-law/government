  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 7 февраля 2005 года № 115 "Об утверждении Правил возмещения затрат, понесенных операторами связи при использовании их сетей и средств во время чрезвычайных ситуаций природного и техногенного характера"
    kaz: '"Табиғи және техногендік сипаттағы төтенше жағдайлар уақытында байланыс операторларының желілері мен құралдарын пайдалану кезінде оларға келтірілген шығындарды өтеу ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2005 жылғы 7 ақпандағы № 115 қаулысына өзгерістер енгізу туралы'

title:
  rus: Об утверждении норм снабжения топографическими и специальными картами, каталогами координат геодезических пунктов и имуществом топографической службы Вооруженных Сил, других войск и воинских формирований Республики Казахстан
  kaz: Қазақстан Республикасының Қарулы Күштерін, басқа да әскерлері мен әскери құралымдарын топографиялық және арнайы карталармен, геодезиялық пункттердің координаталары каталогтарымен және топографиялық қызметтің мүлкімен жабдықтау нормаларын бекіту туралы

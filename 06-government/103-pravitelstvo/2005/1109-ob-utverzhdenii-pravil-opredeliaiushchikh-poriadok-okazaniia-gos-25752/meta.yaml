act_code: '25752'
requisite: Постановление Правительства Республики Казахстан от 9 ноября 2005 года № 1110. Утратило силу постановлением Правительства Республики Казахстан от 26 апреля 2012 года № 525
title:
  rus: Об утверждении Правил, определяющих порядок оказания государственными учреждениями Вооруженных Сил Республики Казахстан, специализирующимися в области спорта, услуг, соответствующих их уставным целям и не относящихся к их основной деятельности, и использования денег от реализации таких услуг
  kaz: Қазақстан Республикасы Қарулы Күштерiнiң спорт саласында мамандандырылған мемлекеттiк мекемелерiнiң өздерiнiң жарғылық мақсатына сәйкес келетiн және негiзгі қызметiне жатпайтын қызметтердi көрсету және мұндай қызметтер көрсетудi iске асырудан түскен ақшаны пайдалану тәртiбiн айқындайтын ереженi бекiту туралы

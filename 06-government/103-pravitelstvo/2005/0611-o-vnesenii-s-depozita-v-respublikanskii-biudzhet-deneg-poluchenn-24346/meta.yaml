title:
  rus: О внесении с депозита в республиканский бюджет денег, полученных от взимания временных защитных пошлин при импорте отдельных видов кабельно-проводниковой продукции и временных антидемпинговых пошлин при импорте цемента из Кыргызской Республики
  kaz: Кәбiлдiк-өткiзгiш өнiмдердiң жекелеген түрлерiнiң импорты кезiнде уақытша корғаныштық баж және Қырғыз Республикасынан цемент импорты кезiнде демпингке қарсы уақытша баж алудан түскен ақшаны депозиттен республикалық бюджетке енгізу туралы

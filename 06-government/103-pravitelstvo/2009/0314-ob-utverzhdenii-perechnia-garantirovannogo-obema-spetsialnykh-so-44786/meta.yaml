  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 14 марта 2009 года № 330 "Об утверждении перечня гарантированного объема специальных социальных услуг" и от 28 октября 2011 года № 1222 "Об утверждении стандартов оказания специальных социальных услуг в области социальной защиты населения"
    kaz: Қазақстан Республикасы Үкіметінің "Арнаулы әлеуметтік қызметтердің кепілдік берілген көлемінің тізбесін бекіту туралы" 2009 жылғы 14 наурыздағы № 330 және "Халықты әлеуметтік қорғау саласында арнаулы әлеуметтік қызметтер көрсету стандарттарын бекіту туралы" 2011 жылғы 28 қазандағы № 1222 қаулыларына өзгерістер мен толықтырулар енгізу туралы

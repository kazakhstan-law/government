  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігінің "Агрохимия қызметі республикалық ғылыми-әдістемелік орталығы" мемлекеттік мекемесін Қазақстан Республикасы Ауыл шаруашылығы министрлігінің қарамағынан Қазақстан Республикасы Жер ресурстарын басқару агенттігінің қарамағына беру және қайта атау туралы

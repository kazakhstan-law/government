act_code: '46206'
requisite: Постановление Правительства Республики Казахстан от 28 мая 2009 года № 787. Утратило силу постановлением Правительства Республики Казахстан от 20 ноября 2019 года № 861 (вводится в действие с 1 января 2020 года)
title:
  rus: Об утверждении Типовых правил закупок товаров, работ и услуг, в том числе размещения гарантированного заказа, осуществляемых национальным управляющим холдингом, за исключением Фонда национального благосостояния, национальными холдингами, национальными компаниями и организациями, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых прямо или косвенно принадлежат национальному управляющему холдингу, за исключением Фонда национального благосостояния, национальному холдингу, национальной компании, а также социально-предпринимательскими корпорациями
  kaz: Ұлттық әл-ауқат қорын қоспағанда, ұлттық басқарушы холдинг, ұлттық холдингтер, ұлттық компаниялар және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан көп пайызы, Ұлттық әл-ауқат қорын қоспағанда, ұлттық басқарушы холдингке, ұлттық холдингке, ұлттық компанияға тікелей немесе жанама түрде тиесілі ұйымдар, сондай-ақ әлеуметтік-кәсіпкерлік корпорациялар жүзеге асыратын тауарларды, жұмыстарды және көрсетілетін қызметтерді сатып алудың, оның ішінде кепілдендірілген тапсырысты орналастырудың үлгілік қағидаларын бекіту туралы

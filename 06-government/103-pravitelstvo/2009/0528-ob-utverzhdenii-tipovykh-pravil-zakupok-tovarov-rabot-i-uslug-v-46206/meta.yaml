  title:
    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 28 мая 2009 года № 787 «Об утверждении Типовых правил закупок товаров, работ и услуг, осуществляемых национальным управляющим холдингом, национальными холдингами, национальными компаниями и организациями, пятьдесят и более процентов акций (долей участия) которых прямо или косвенно принадлежат национальному управляющему холдингу, национальному холдингу, национальной компании»
    kaz: «Ұлттық басқарушы холдинг, Ұлттық холдингтер, ұлттық компаниялар және акцияларының (қатысу үлестерінің) елу және одан да көп пайызы тікелей немесе жанама түрде ұлттық басқарушы холдингке, ұлттық холдингке, ұлттық компанияға тиесілі ұйымдар жүзеге асыратын тауарларды, жұмыстарды және көрсетілетін қызметтерді сатып алудың үлгі ережесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 28 мамырдағы № 787 қаулысына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/114330/rus

  title:
    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 28 мая 2009 года № 787 "Об утверждении Типовых правил закупок товаров, работ и услуг, осуществляемых национальным управляющим холдингом, национальными холдингами, национальными компаниями и организациями, пятьдесят и более процентов акций (долей участия) которых прямо или косвенно принадлежат национальному управляющему холдингу, национальному холдингу, национальной компании"
    kaz: '"Ұлттық басқарушы холдинг, Ұлттық холдингтер, ұлттық компаниялар және акцияларының (қатысу үлестерiнiң) елу және одан да көп пайызы тiкелей немесе жанама түрде ұлттық басқарушы холдингке, ұлттық холдингке, ұлттық компанияға тиесiлi ұйымдар жүзеге асыратын тауарларды, жұмыстарды және көрсетiлетiн қызметтердi сатып алудың үлгi ережесiн бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2009 жылғы 28 мамырдағы № 787 қаулысына толықтыру енгiзу туралы'

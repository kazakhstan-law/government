act_code: '43984'
requisite: Постановление Правительства Республики Казахстан от 2 февраля 2009 года № 98
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2009 года областными бюджетами, бюджетами городов Астаны и Алматы на обеспечение закладки и выращивания многолетних насаждений плодово-ягодных культур и винограда
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2009 жылдың республикалық бюджетінен жеміс-жидек дақылдары мен жүзімнің көпжылдық екпелерін отырғызуды және өсіруді қамтамасыз етуге арналған ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

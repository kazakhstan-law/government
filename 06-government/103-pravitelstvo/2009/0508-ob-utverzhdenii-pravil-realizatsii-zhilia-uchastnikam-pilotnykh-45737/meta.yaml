  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 2 декабря 2008 года № 1126 "Об утверждении Программы "Нұрлы көш" на 2009 - 2011 годы" и от 8 мая 2009 года № 674 "Об утверждении Правил реализации жилья участникам пилотных проектов Программы "Нұрлы көш"
    kaz: Қазақстан Республикасы Үкіметінің "2009 - 2011 жылдарға арналған "Нұрлы көш" бағдарламасын бекіту туралы" 2008 жылғы 2 желтоқсандағы № 1126 және "Нұрлы көш" бағдарламасының пилоттық жобаларына қатысушыларға тұрғын үй сату ережесін бекіту туралы" 2009 жылғы 8 мамырдағы № 674 қаулыларына өзгерістер енгізу туралы

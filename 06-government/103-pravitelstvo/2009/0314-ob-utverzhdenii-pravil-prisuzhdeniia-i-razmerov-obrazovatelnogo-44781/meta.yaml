  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 14 марта 2009 года № 317 "Об утверждении Правил присуждения и размеров образовательного гранта Первого Президента Республики Казахстан - Лидера Нации "Өркен" для оплаты обучения одаренных детей в специализированных организациях образования "Назарбаев Интеллектуальные школы"
    kaz: '"Назарбаев Зияткерлік мектептері" мамандандырылған білім беру ұйымдарында дарынды балалардың оқуын төлеу үшін Қазақстан Республикасы Тұңғыш Президентінің - Елбасының "Өркен" білім беру грантын тағайындау ережесі мен мөлшерін бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 14 наурыздағы № 317 қаулысына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/72787/rus

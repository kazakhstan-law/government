title:
  rus: Об утверждении Правил присуждения и размеров образовательного гранта Первого Президента Республики Казахстан – Елбасы "Өркен" для оплаты обучения одаренных детей в автономной организации образования "Назарбаев Интеллектуальные школы"
  kaz: '"Назарбаев Зияткерлік мектептері" дербес білім беру ұйымында дарынды балалардың оқуына ақы төлеу үшін Қазақстан Республикасы Тұңғыш Президентінің - Елбасының "Өркен" білім беру грантын тағайындау қағидалары мен мөлшерлерін бекіту туралы"'

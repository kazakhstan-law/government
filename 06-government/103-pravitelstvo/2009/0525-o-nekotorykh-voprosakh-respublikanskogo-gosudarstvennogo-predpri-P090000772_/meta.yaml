title:
  rus: О некоторых вопросах республиканского государственного предприятия на праве хозяйственного ведения "Национальный научно-исследовательский центр по проблемам промышленной безопасности" Комитета по государственному контролю за чрезвычайными ситуациями и промышленной безопасностью Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігі Төтенше жағдайларды және өнеркәсіптік қауіпсіздікті мемлекеттік бақылау комитетінің "Өнеркәсіп қауіпсіздігі проблемалары жөніндегі ұлттық ғылыми-зерттеу орталығы" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнының кейбір мәселелері туралы

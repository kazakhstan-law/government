  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 29 декабря 2009 года № 2223 "Об утверждении стандартов государственных услуг Министерства обороны Республики Казахстан" и от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасы Қорғаныс министрлігінің мемлекеттік қызметтер стандарттарын бекіту туралы" 2009 жылғы 29 желтоқсандағы № 2223 және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" 2010 жылғы 20 шілдедегі № 745 қаулыларына өзгерістер мен толықтырулар енгізу туралы

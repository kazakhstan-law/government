title:
  rus: Об утверждении Правил перевода пенсионных накоплений из нескольких накопительных пенсионных фондов в один, при наличии у вкладчика (получателя) двух и более договоров о пенсионном обеспечении за счет обязательных пенсионных взносов с различными накопительными пенсионными фондами
  kaz: Салымшыда (алушыда) міндетті зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы түрлі жинақтаушы зейнетақы қорларымен жасасқан екі және одан да көп шарты болған кезде зейнетақы жинақтарын бірнеше жинақтаушы зейнетақы қорынан біреуіне аудару ережесін бекіту туралы

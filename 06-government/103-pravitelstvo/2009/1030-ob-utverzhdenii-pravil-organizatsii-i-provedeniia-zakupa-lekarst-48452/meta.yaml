  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 30 октября 2009 года № 1729 «Об утверждении Правил организации и проведения закупа лекарственных средств, профилактических (иммунобиологических, диагностических, дезинфицирующих) препаратов, изделий медицинского назначения и медицинской техники, фармацевтических услуг по оказанию гарантированного объема бесплатной медицинской помощи и медицинской помощи в системе обязательного социального медицинского страхования» и от 8 июля 2015 года № 515 «Об утверждении Правил закупа услуг по хранению и транспортировке лекарственных средств и изделий медицинского назначения единым дистрибьютором в рамках гарантированного объема бесплатной медицинской помощи и системе обязательного социального медицинского страхования и внесении изменений и дополнений в некоторые решения  Правительства Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Тегін медициналық көмектің кепілдік берілген көлемін және міндетті әлеуметтік медициналық сақтандыру жүйесіндегі медициналық көмекті көрсету  бойынша дәрілік заттарды, профилактикалық (иммундық-биологиялық, диагностикалық, дезинфекциялық) препараттарды, медициналық мақсаттағы бұйымдар мен медициналық техниканы, фармацевтикалық қызметтер көрсетуді сатып алуды ұйымдастыру және өткізу қағидаларын бекіту туралы» 2009 жылғы 30 қазандағы № 1729  және «Бірыңғай дистрибьютордың тегін медициналық көмектің кепілдік берілген көлемі және міндетті әлеуметтік медициналық сақтандыру жүйесіндегі медициналық көмек шеңберінде дәрілік заттар мен медициналық мақсаттағы бұйымдарды сақтау және тасымалдау жөніндегі қызметтерді сатып алу қағидаларын бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы» 2015 жылғы 8 шілдедегі № 515 қаулыларына өзгерістер енгізу туралы

title:
  rus: Об утверждении ставок консульского сбора, взимаемого на территории Республики Казахстан, и базовых минимальных и максимальных размеров ставок консульского сбора, взимаемого за пределами территории Республики Казахстан
  kaz: Қазақстан Республикасы аумағында алынатын консулдық алым мөлшерлемелерін және Қазақстан Республикасы аумағының шегінен тыс жерде алынатын консулдық алым мөлшерлемелерінің базалық ең төмен және ең жоғары мөлшерлерін бекіту туралы

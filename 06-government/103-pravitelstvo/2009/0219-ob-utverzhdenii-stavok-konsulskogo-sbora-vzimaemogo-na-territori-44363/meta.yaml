  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 19 февраля 2009 года № 197 "Об утверждении базовых минимальных и максимальных размеров ставок консульских сборов, а также ставки консульского сбора за срочность"
    kaz: '"Консулдық алым ставкаларының, сондай-ақ жеделдігі үшін консулдық алым ставкасының ең төменгі және ең жоғары базалық мөлшерін бекіту туралы" Қазақстан Республикасы Үкiметiнiң 2009 жылғы 19 ақпандағы № 197 қаулысына өзгерiс енгiзу туралы'

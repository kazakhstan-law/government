  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 марта 2009 года № 449 "Об утверждении критериев распределения объектов I категории, подлежащих государственной экологической экспертизе, и для выдачи разрешений на эмиссии в окружающую среду между уполномоченным органом в области охраны окружающей среды и его территориальными подразделениями"
    kaz: '"Мемлекеттік экологиялық сараптамаға жататын және қоршаған ортаға эмиссияға рұқсат беру үшін I санаттағы объектілерді қоршаған ортаны қорғау саласындағы уәкілетті орган мен оның аумақтық бөлімшелері арасында бөлу өлшемлерін бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 31 наурыздағы № 449 қаулысына өзгерістер енгізу туралы'

title:
  rus: Об утверждении критериев распределения объектов I категории, подлежащих государственной экологической экспертизе, и для выдачи разрешений на эмиссии в окружающую среду между уполномоченным органом в области охраны окружающей среды и его территориальными подразделениями
  kaz: Мемлекеттік экологиялық сараптамаға жататын және қоршаған ортаға эмиссияға рұқсат беру үшін I санаттағы объектілерді қоршаған ортаны қорғау саласындағы уәкілетті орган мен оның аумақтық бөлімшелері арасында бөлу өлшемдерін бекіту туралы

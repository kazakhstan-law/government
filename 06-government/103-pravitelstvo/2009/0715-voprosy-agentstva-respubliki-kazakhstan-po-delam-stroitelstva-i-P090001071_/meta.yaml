  title:
    rus: О мерах по реализации Указа Президента Республики Казахстан от 10 августа 2011 года № 136 "О мерах по дальнейшему совершенствованию системы государственного управления Республики Казахстан" и о внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: '"Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы" Қазақстан Республикасы Президентінің 2011 жылғы 10 тамыздағы № 136 Жарлығын іске асыру жөніндегі шаралар туралы және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы'

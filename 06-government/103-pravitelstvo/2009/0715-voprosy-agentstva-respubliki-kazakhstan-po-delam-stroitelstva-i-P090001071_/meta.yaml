  title:
    rus: О реорганизации Республиканского государственного предприятия на праве хозяйственного ведения "Казахский научно-исследовательский и проектно-экспериментальный институт сейсмостойкого строительства и архитектуры (КазНИИССА)" Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства и Южно-Казахстанского дочернего государственного предприятия республиканского государственного предприятия на праве хозяйственного ведения "Казахский научно-исследовательский и проектно-экспериментальный институт сейсмостойкого строительства и архитектуры (КазНИИССА)" Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства
    kaz: Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігінің "Қазақ ғылыми-зерттеу және жобалау-эксперименталдық сейсмика төзімді құрылыс пен сәулет институты (ҚазҒЗСТҚСИ)" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнын және Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық icтерi агенттiгiнiң "Қазақ ғылыми-зерттеу және жобалау-эксперименталдық сейсмика төзiмдi құрылыс пен сәулет институты (КазҒЗСТҚСИ)" шаруашылық жүргізу құқығындағы республикалық мемлекеттiк кәсiпорнының Оңтүстік Қазақстан еншілес мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

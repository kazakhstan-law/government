  kaz: 2009 - 2011 жылдарға арналған зейнетақы төлемдерін алушыларға алушының зейнетақы төлемдерін алу құқығына ие болған сәттегі инфляция деңгейін ескере отырып, жинақтаушы зейнетақы қорларындағы міндетті зейнетақы жарналарының нақты енгізілген міндетті зейнетақы жарналары мөлшерінде сақталуы жөніндегі мемлекеттің кепілдіктерін орындау ережесін бекіту туралы

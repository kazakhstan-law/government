act_code: '47193'
requisite: Постановление Правительства Республики Казахстан от 31 июля 2009 года № 1167
title:
  rus: Об утверждении Правил оформления, представления и предварительной оценки материалов участников конкурса на соискание премии Президента Республики Казахстан "Алтын сапа" и Правил оформления, представления и предварительной экспертной оценки материалов и продукции, представляемых на региональный и республиканский конкурсы-выставки "Лучший товар Казахстана"
  kaz: Қазақстан Республикасы Президентінің «Алтын сапа» сыйлығын алуға арналған конкурсқа қатысушылардың материалдарын ресімдеу, ұсыну және алдын ала бағалау қағидаларын және «Қазақстанның үздік тауары» өңірлік және республикалық көрме-конкурстарына ұсынылатын материалдар мен өнімді ресімдеу, ұсыну және алдын ала сараптамалық бағалау қағидаларын бекіту туралы

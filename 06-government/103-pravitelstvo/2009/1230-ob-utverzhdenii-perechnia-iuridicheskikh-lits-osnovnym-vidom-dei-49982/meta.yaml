act_code: '49982'
requisite: Постановление Правительства Республики Казахстан от 30 декабря 2009 года № 2275. Утратило силу постановлением Правительства Республики Казахстан от 4 мая 2014 года № 445 (вводится в действие с 1 января 2013 года)
title:
  rus: Об утверждении перечня юридических лиц, основным видом деятельности которых является осуществление заемных операций или выкуп прав требования и сто процентов голосующих акций (долей участия) которых принадлежат национальному управляющему холдингу, имеющих право на вычет суммы расходов по созданию провизии (резервов) против сомнительных и безнадежных активов, условных обязательств, за исключением активов и условных обязательств, предоставленных в пользу взаимосвязанных лиц либо третьим лицам по обязательствам взаимосвязанных лиц (кроме активов и условных обязательств кредитных товариществ), правил его формирования и правил отнесения активов и условных обязательств к категории сомнительных и безнадежных
  kaz: Негізгі қызмет түрі қарыз операцияларын жүзеге асыру немесе талап құқықтарын сатып алу болып табылатын және дауыс беретін акцияларының (қатысу үлестерінің) жүз проценті ұлттық басқарушы холдингке тиесілі, өзара байланысты тұлғалардың пайдасына не өзара байланысты тұлғалардың міндеттемелері бойынша үшінші тұлғаларға берілген активтер мен шартты міндеттемелерді (кредиттік серіктестіктердің активтері мен шартты міндеттемелерінен басқа) қоспағанда, күмәнді және үмітсіз активтерге, шартты міндеттемелерге қарсы провизиялар (резервтер) құру жөніндегі шығыстар сомасын шегеруге құқығы бар заңды тұлғалардың тізбесін, оны қалыптастыру ережесін және активтер мен шартты міндеттемелерді күмәнді және үмітсіз санатқа жатқызу ережесін бекіту туралы

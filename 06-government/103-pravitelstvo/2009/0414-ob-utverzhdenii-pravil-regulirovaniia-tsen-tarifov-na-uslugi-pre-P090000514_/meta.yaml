  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 14 апреля 2009 года № 514 «Об утверждении Правил регулирования цен (тарифов) на услуги предоставления линий и каналов связи, каналов в кабельной канализации и площадей, необходимых для размещения технических средств для нужд уполномоченных государственных органов, Службы государственной охраны (за исключением нужд президентской связи), органов военного управления, национальной безопасности и внутренних дел Республики Казахстан, а также оператора информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: «Қазақстан Республикасының уәкілетті мемлекеттік органдарының, Мемлекеттік күзет қызметінің (президенттік байланыс қажеттілігін қоспағанда), әскери басқару, ұлттық қауіпсіздік және ішкі істер органдарының, сондай-ақ «электрондық үкімет» ақпараттық-коммуникациялық инфрақұрылымы операторының қажеттілігі үшін байланыс жолдары мен арналарын, кабельдік кәріздегі арналарды және техникалық құралдарды орналастыру үшін қажетті алаңдарды берудің көрсетілетін қызметтерінің бағасын (тарифін) реттеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 14 сәуірдегі № 514 қаулысына өзгерістер енгізу туралы

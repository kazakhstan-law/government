  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 26 ноября 2009 года № 1942 "Об утверждении Правил лицензирования деятельности в сфере товарных бирж и квалификационных требований к деятельности товарных бирж, биржевых брокеров и биржевых дилеров"
    kaz: '"Тауар биржалары саласындағы қызметті лицензиялау ережесін және тауар биржалары, биржалық брокерлер мен биржалық дилерлер қызметіне қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 26 қарашадағы № 1942 қаулысына өзгерістер енгізу туралы'

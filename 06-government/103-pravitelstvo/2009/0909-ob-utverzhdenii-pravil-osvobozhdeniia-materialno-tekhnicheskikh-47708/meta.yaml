act_code: '47708'
requisite: Постановление Правительства Республики Казахстан от 9 сентября 2009 года № 1336
title:
  rus: Об утверждении Правил освобождения материально-технических средств и услуг, приобретаемых в Республике Казахстан Соединенными Штатами Америки или от их имени, от налогов и других обязательных платежей в бюджет
  kaz: Америка Құрама Штаттары немесе оның атынан басқалар Қазақстан Республикасында сатып алатын материалдық-техникалық құралдар мен қызметтерді салық және бюджетке төленетін басқа да міндетті төлемдерден босату ережесін бекіту туралы

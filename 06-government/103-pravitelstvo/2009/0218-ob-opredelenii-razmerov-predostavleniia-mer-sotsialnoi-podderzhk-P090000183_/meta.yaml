  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 18 февраля 2009 года № 183 «Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 18 ақпандағы № 183 қаулысына өзгерiстер енгізу туралы

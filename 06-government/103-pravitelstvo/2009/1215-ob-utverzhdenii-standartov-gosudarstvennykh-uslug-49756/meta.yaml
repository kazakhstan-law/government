  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 15 декабря 2009 года № 2121 "Об утверждении стандартов государственных услуг" и от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: '"Мемлекеттік қызметтер стандарттарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 15 желтоқсандағы № 2121 және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" Қазақстан Республикасы Үкіметінің 2010 жылғы 20 шілдедегі № 745 қаулыларына өзгерістер мен толықтырулар енгізу туралы'

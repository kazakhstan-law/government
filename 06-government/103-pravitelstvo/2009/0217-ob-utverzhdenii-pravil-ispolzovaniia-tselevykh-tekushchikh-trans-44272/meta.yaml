title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2009 года областными бюджетами и бюджетом города Астаны на поддержку повышения урожайности и качества производимых сельскохозяйственных культур
  kaz: Облыстық бюджеттердің және Астана қаласы бюджетінің 2009 жылғы республикалық бюджеттен өндірілетін ауыл шаруашылығы дақылдарының шығымдылығын және сапасын арттыруды қолдауға бөлінетін ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

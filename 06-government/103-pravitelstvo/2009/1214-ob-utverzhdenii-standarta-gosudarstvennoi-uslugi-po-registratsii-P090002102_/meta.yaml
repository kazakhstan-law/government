  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 14 декабря 2009 года № 2102 "Об утверждении стандарта государственной услуги по регистрации и выдаче разрешений иностранцам и лицам без гражданства на постоянное жительство в Республике Казахстан"
    kaz: '"Шетелдіктер мен азаматтығы жоқ адамдарды тіркеу және оларға Қазақстан Республикасында тұрақты тұруға рұқсат беру бойынша мемлекеттік қызмет стандартын бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 14 желтоқсандағы № 2102 қаулысына өзгерістер енгізу туралы'

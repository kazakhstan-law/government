title:
  rus: Об утверждении стандарта государственной услуги "Регистрация, перерегистрация автотранспортных средств и выдача регистрационных номерных знаков, за исключением транспортных средств, регистрируемых Министерством сельского хозяйства"
  kaz: '"Ауыл шаруашылығы министрлігі тіркейтін көлік құралдарын қоспағанда, автокөлік құралдарын тіркеу, қайта тіркеу және нөмірлік тіркеу белгілерін беру" мемлекеттік қызмет стандартын бекіту туралы'

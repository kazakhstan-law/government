act_code: '45609'
requisite: Постановление Правительства Республики Казахстан от 30 апреля 2009 года № 603
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов и целевых трансфертов на развитие областным бюджетам, бюджетам городов Астаны и Алматы, перечисляемых для реализации стратегии региональной занятости и переподготовки кадров
  kaz: Өңірлік жұмыспен қамту және кадрларды қайта даярлау стратегиясын іске асыру үшін облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне аударылатын ағымдағы нысаналы трансферттер мен нысаналы даму трансферттерін пайдалану ережесін бекіту туралы

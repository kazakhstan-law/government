act_code: '44561'
requisite: Постановление Правительства Республики Казахстан от 3 марта 2009 года № 240. Утратил силу постановлением Правительства Республики Казахстан от 31 марта 2017 года № 149
title:
  rus: Об утверждении перечня юридических лиц, сто процентов голосующих акций которых принадлежат национальному управляющему холдингу, обороты по реализации заемных операций в денежной форме на условиях платности, срочности и возвратности которых освобождаются от налога на добавленную стоимость
  kaz: Дауыс беретін акцияларының жүз пайызы ұлттық басқарушы холдингке тиесілі, төлемдік, оралымдылық және қайтарымдық жағдайларында жүзеге асыратын ақшалай нысандағы қарыз операцияларын іске асыру жөніндегі айналымдары қосылған құн салығынан босатылатын заңды тұлғалардың тізбесін бекіту туралы

caused_by:
  code: '207671'
  requisite: Постановление Правительства Республики Казахстан от 4 марта 2025 года № 117
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 июля 2009 года № 1167 «Об утверждении Правил оформления, представления и предварительной оценки материалов участников конкурса на соискание премии Президента Республики Казахстан «Алтын сапа» и Правил оформления, представления и предварительной экспертной оценки материалов и продукции, представляемых на региональный и республиканский конкурсы-выставки «Лучший товар Казахстана»
    kaz: «Қазақстан Республикасы Президентінің «Алтын сапа» сыйлығын алуға арналған конкурсқа қатысушылардың материалдарын ресімдеу, ұсыну және алдын ала бағалау ережесін және «Қазақстанның үздік тауары» өңірлік және республикалық көрме-конкурстарына ұсынылатын материалдар мен өнімді ресімдеу, ұсыну және алдын ала сараптамалық бағалау ережесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 31 шілдедегі № 1167 қаулысына өзгерістер енгізу туралы

caused_by:
  code: '184902'
  requisite: Постановление Правительства Республики Казахстан от 10 августа 2023 года № 663
  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 31 июля 2009 года № 1167 «Об утверждении Правил оформления, представления и предварительной оценки материалов участников конкурса на соискание премии Президента Республики Казахстан «Алтын сапа» и Правил оформления, представления и предварительной экспертной оценки материалов и продукции, представляемых на региональный и республиканский конкурсы-выставки «Лучший товар Казахстана»
    kaz: «Қазақстан Республикасы Президентінің «Алтын сапа» сыйлығын алуға арналған конкурсқа қатысушылардың материалдарын ресімдеу, ұсыну және алдын ала бағалау ережесін және «Қазақстанның үздік тауары» өңірлік және республикалық көрме-конкурстарына ұсынылатын материалдар мен өнімді ресімдеу, ұсыну және алдын ала сараптамалық бағалау ережесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 31 шілдедегі № 1167 қаулысына өзгеріс енгізу туралы

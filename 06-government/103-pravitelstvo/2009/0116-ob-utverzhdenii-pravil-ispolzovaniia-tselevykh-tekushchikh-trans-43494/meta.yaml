act_code: '43494'
requisite: Постановление Правительства Республики Казахстан от 16 января 2009 года № 15
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2009 год областным бюджетам, бюджетам городов Астаны и Алматы на содержание вновь вводимых объектов социального обеспечения
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне жаңадан пайдалануға берілетін әлеуметтік қамсыздандыру объектілерін ұстауға 2009 жылға арналған республикалық бюджеттен бөлінетін ағымдағы нысаналы трансферттерді пайдалану ережесін бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 29 июня 2012 года № 884 "Об утверждении Правил определения предельных цен оптовой реализации товарного и сжиженного нефтяного газа на внутреннем рынке" и от 3 марта 2009 года № 238 "Об утверждении Правил ценообразования на регулируемых рынках"
    kaz: Қазақстан Республикасы Үкіметінің "Ішкі нарықта тауарлық және сұйытылған мұнай газын көтерме саудада өткізудің шекті бағаларын айқындау қағидаларын бекіту туралы" 2012 жылғы 29 маусымдағы № 884 және "Реттелетін нарықтардағы бағаны белгілеу ережесін бекіту туралы" 2009 жылғы 3 наурыздағы № 238 қаулыларына өзгерістер мен толықтырулар енгізу туралы

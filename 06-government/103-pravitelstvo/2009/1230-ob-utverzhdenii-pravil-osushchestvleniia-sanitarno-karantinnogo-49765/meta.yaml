title:
  rus: Об утверждении Правил осуществления санитарно-карантинного контроля над завозом и распространением инфекционных и паразитарных заболеваний на Государственной границе Республики Казахстан и обеспечения санитарной охраны границы и территории Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік шекарасында инфекциялық және паразиттік аурулардың енуіне және таралуына санитариялық-карантиндік бақылауды жүзеге асыру және Қазақстан Республикасының шекарасы мен аумағын санитариялық қорғауды қамтамасыз ету ережесін бекіту туралы

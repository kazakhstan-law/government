  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 14 апреля 2009 года № 513 "Об утверждении Правил лицензирования деятельности по предоставлению услуг в области связи, Правил проведения конкурсов для получения лицензий на осуществление деятельности в области связи и квалификационных требований, предъявляемых при лицензировании деятельности по предоставлению услуг в области связи"
    kaz: '"Байланыс саласында қызметтер көрсету жөніндегі қызметті лицензиялау ережесін, Байланыс саласындағы қызметті жүзеге асыруға лицензиялар алу үшін конкурстар өткізу ережесін және байланыс саласында қызметтер керсету жөніндегі қызметті лицензиялау кезінде қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 14 сәуірдегі № 513 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/61895/rus

  title:
    rus: О внесении изменения и дополнений в постановления Правительства Республики Казахстан от 26 февраля 2009 года № 220 "Об утверждении Правил исполнения бюджета и его кассового обслуживания" и от 28 мая 2009 года № 787 "Об утверждении Типовых правил закупок товаров, работ и услуг, осуществляемых национальным управляющим холдингом, национальными холдингами, национальными компаниями и организациями, пятьдесят и более процентов акций (долей участия) которых прямо или косвенно принадлежат национальному управляющему холдингу, национальному холдингу, национальной компании"
    kaz: Қазақстан Республикасы Үкіметінің "Бюджеттің атқарылуы және оған кассалық қызмет көрсету ережесін бекіту туралы" 2009 жылғы 26 ақпандағы № 220 және "Ұлттық басқарушы холдинг, Ұлттық холдингтер, ұлттық компаниялар және акцияларының (қатысу үлестерінің) елу және одан да көп пайызы тікелей немесе жанама түрде ұлттық басқарушы холдингке, ұлттық холдингке, ұлттық компанияға тиесілі ұйымдар жүзеге асыратын тауарларды, жұмыстарды және көрсетілетін қызметтерді сатып алудың үлгі ережесін бекіту туралы" 2009 жылғы 28 мамырдағы № 787 қаулыларына өзгеріс пен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/75709/rus

  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 26 февраля 2009 года № 220 "Об утверждении Правил исполнения бюджета и его кассового обслуживания" и от 17 апреля 2009 года № 545 "Об утверждении Правил рассмотрения, отбора, мониторинга и оценки реализации бюджетных инвестиционных проектов" и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Үкіметінің "Бюджеттің атқарылуы және оған кассалық қызмет көрсету ережесін бекіту туралы" 2009 жылғы 26 ақпандағы № 220 және "Бюджеттік инвестициялық жобаларды қарау, іріктеу, іске асыруды мониторингілеу және бағалау ережесін бекіту туралы" 2009 жылғы 17 сәуірдегі № 545 қаулыларына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

act_code: '44935'
requisite: Постановление Правительства Республики Казахстан от 20 марта 2009 года № 373. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2018 года № 922 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил определения суммы превышения налога на добавленную стоимость, подлежащей возврату, и критериев отнесения реализации товаров, работ, услуг, облагаемых по нулевой ставке, к постоянной реализации
  kaz: Қайтарылуға жататын қосылған құн салығының асып кеткен сомасын айқындау ережесін және нөлдік ставка бойынша салық салынатын тауарлар өткізуді, жұмыстар орындауды, қызметтер көрсетуді тұрақты өткізуге жатқызу өлшемдерін бекіту туралы

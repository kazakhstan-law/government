  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 15 июня 2009 года № 906 «Об утверждении Правил определения лимита правительственного долга и долга местного исполнительного органа, лимитов предоставления государственных гарантий и поручительств государства»

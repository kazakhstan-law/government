  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 26 января 2009 года № 56 "Об утверждении перечня лекарственных средств любых форм, в том числе лекарств-субстанций; изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, сурдотифлотехники и медицинской (ветеринарной) техники; материалов, оборудования и комплектующих для производства лекарственных средств любых форм, в том числе лекарств-субстанций, изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, и медицинской (ветеринарной) техники, импорт которых освобождается от налога на добавленную стоимость"
    kaz: '"Импорты қосылған құн салығынан босатылатын кез келген нысандағы дәрілік заттардың, оның ішінде дәрілер-субстанциялардың; протездік-ортопедиялық бұйымдарды, сурдотифлотехниканы және медициналық (ветеринариялық) техниканы қоса алғанда, медициналық (ветеринариялық) мақсаттағы бұйымдардың, кез келген нысандағы дәрілік заттарды, оның ішінде дәрілер-субстанцияларды, протездік-ортопедиялық бұйымдарды және медициналық (ветеринариялық) техниканы қоса алғанда, медициналық (ветеринариялық) мақсаттағы бұйымдарды өндіруге арналған материалдардың, жабдықтар мен жинақтаушы заттардың тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 26 қаңтардағы № 56 қаулысына өзгерістер мен толықтырулар енгізу туралы'

act_code: '43792'
requisite: Постановление Правительства Республики Казахстан от 26 января 2009 года № 56. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2018 года № 922 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня лекарственных средств любых форм, изделий медицинского назначения и медицинской техники, зарегистрированных в Государственном реестре лекарственных средств, изделий медицинского назначения и медицинской техники Республики Казахстан и незарегистрированных в Государственном реестре лекарственных средств, изделий медицинского назначения и медицинской техники Республики Казахстан, импортируемых на основании заключения (разрешительного документа), выданного уполномоченным органом в области здравоохранения; лекарственных средств, используемых (применяемых) в области ветеринарии; изделий ветеринарного назначения и ветеринарной техники, сурдотифлотехники, включая протезно-ортопедические изделия, специальных средств передвижения, предоставляемых инвалидам; материалов, оборудования и комплектующих для производства лекарственных средств любых форм, изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, и медицинской (ветеринарной) техники, импорт которых освобождается от налога на добавленную стоимость
  kaz: Импорты қосылған құн салығынан босатылатын Қазақстан Республикасының дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың мемлекеттік тізілімінде тіркелген және денсаулық сақтау саласындағы уәкілетті орган берген қорытынды (рұқсат құжаты) негізінде импортталатын, Қазақстан Республикасы дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың мемлекеттік тізілімінде тіркелмеген кез келген нысандағы дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың; ветеринария саласында пайдаланылатын (қолданылатын) дәрілік заттардың; ветеринариялық мақсаттағы бұйымдар мен ветеринариялық техниканың, мүгедектерге берілетін протездік-ортопедиялық бұйымдарды, арнайы қозғалыс құралдарын қоса алғанда, сурдотифлотехниканың; протездік-ортопедиялық бұйымдарды және медициналық (ветеринариялық) техниканы қоса алғанда, кез келген нысандағы дәрілік заттарды, медициналық (ветеринариялық) мақсаттағы бұйымдарды шығаруға арналған материалдардың, жабдықтар мен жинақтаушылардың тізбесін бекіту туралы

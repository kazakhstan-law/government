title:
  rus: Об утверждении Правил осуществления ограничительных мероприятий, в том числе карантина, на территории Республики Казахстан, а также особых условий и режимов проживания населения и ведения предпринимательской и (или) иной деятельности
  kaz: Қазақстан Республикасының аумағында шектеу іс-шараларын, оның ішінде карантинді, сондай-ақ халық тұрмысының және кәсіпкерлік және (немесе) өзге де қызметті жүргізудің ерекше шарттары мен режимдерін жүзеге асыру ережесін бекіту туралы

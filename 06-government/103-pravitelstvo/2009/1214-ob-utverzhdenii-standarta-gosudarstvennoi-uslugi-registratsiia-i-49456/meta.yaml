  title:
    rus: Об утверждении Правил выдачи пропусков на въезд в пограничную зону иностранцам и лицам без гражданства и изменений и дополнений, которые вносятся в некоторые решения Правительства Республики Казахстан
    kaz: Шетелдіктердің және азаматтығы жоқ адамдардың шекаралық аймаққа кіруіне рұқсаттама беру қағидаларын және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне енгізілетін өзгерістер мен толықтыруларды бекіту туралы

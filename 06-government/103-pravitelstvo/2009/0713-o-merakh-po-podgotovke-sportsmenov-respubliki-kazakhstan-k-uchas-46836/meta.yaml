requisite: Постановление Правительства Республики Казахстан от 13 июля 2009 года № 1059
title:
  rus: О мерах по подготовке спортсменов Республики Казахстан к участию в очередных XXI зимних Олимпийских играх 2010 года в Ванкувере (Канада), 16-х Азиатских играх 2010 года в Гуанчжоу (Китайская Народная Республика), 7-х зимних Азиатских играх 2011 года в городах Астане и Алматы (Республика Казахстан) и XXX Олимпийских играх 2012 года в Лондоне (Соединенное Королевство Великобритании и Северной Ирландии)
  kaz: Қазақстан Республикасының спортшыларын кезекті 2010 жылғы Ванкувердегі (Канада) XXI қысқы Олимпиада ойындарына, 2010 жылғы Гуанчжоудағы (Қытай Халық Республикасы) 16-шы Азия ойындарына, 2011 жылғы Астана және Алматы қалаларындағы (Қазақстан Республикасы) 7-ші қысқы Азия ойындарына және 2012 жылғы Лондондағы (Ұлыбритания және Солтүстік Ирландия Құрама Корольдігі) ХХХ Олимпиада ойындарына қатысуға даярлау жөніндегі шаралар туралы

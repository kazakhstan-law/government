title:
  rus: О ликвидации Республиканского государственного казенного предприятия "Республиканский противоэпизоотический отряд" Комитета государственной инспекции в агропромышленном комплексе Министерства сельского хозяйства Республики Казахстан и создании Государственного учреждения "Республиканский противоэпизоотический отряд" Комитета государственной инспекции в агропромышленном комплексе Министерства сельского хозяйства Республики Казахстан с филиалами
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешендегі мемлекеттік инспекция комитетінің «Республикалық эпизоотияға қарсы отряд» республикалық мемлекеттік қазыналық кәсіпорнын тарату және Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешендегі мемлекеттік инспекция комитетінің «Республикалық эпизоотияға қарсы отряд» мемлекеттік мекемесін филиалдарымен бірге құру туралы

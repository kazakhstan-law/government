title:
  rus: Об утверждении Правил определения доли имущества лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости уставного (акционерного) капитала или акций (долей участия) юридического лица или консорциума на дату реализации акций (долей участия)
  kaz: Акцияларды (қатысу үлестерін) өткізу күніне заңды тұлғаның немесе консорциумның жарғылық (акционерлік) капиталы немесе акциялары (қатысу үлестері) құнында жер қойнауын пайдаланушылар (жер қойнауын пайдаланушы) болып табылатын (табылған) тұлғалардың (тұлғаның) мүлкінің үлесін айқындау ережесін бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 18 февраля 2009 года № 183 "Об утверждении размеров и Правил предоставления мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты" и от 31 января 2011 года № 51 "Об утверждении стандарта государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты"
    kaz: Қазақстан Республикасы Үкіметінің "Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну мөлшерін және ережесін бекіту туралы" 2009 жылғы 18 ақпандағы № 183 және "Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызмет стандартын бекіту туралы" 2011 жылғы 31 қаңтардағы № 51 қаулыларына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/60444/rus

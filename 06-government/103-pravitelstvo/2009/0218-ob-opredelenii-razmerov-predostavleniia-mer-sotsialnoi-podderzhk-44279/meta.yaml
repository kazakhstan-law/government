  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 18 февраля 2009 года № 183 "Об утверждении размеров и Правил предоставления мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты"
    kaz: '"Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну мөлшерін және ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 18 ақпандағы № 183 қаулысына өзгеріс енгізу туралы'

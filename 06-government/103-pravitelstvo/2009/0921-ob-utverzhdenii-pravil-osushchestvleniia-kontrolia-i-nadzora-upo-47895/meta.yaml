title:
  rus: Об утверждении Правил осуществления контроля и надзора уполномоченным государственным органом по делам архитектуры, градостроительства и строительства за деятельностью местных исполнительных органов в сфере архитектурной, градостроительной и строительной деятельности
  kaz: Сәулет, қала құрылысы және құрылыс қызметі саласындағы жергілікті атқарушы органдардың қызметін сәулет, қала құрылысы және құрылыс істері жөніндегі уәкілетті мемлекеттік органның бақылауды және қадағалауды жүзеге асыру қағидаларын бекіту туралы

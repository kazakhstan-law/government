  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 21 сентября 2009 года № 1415 "Об утверждении Правил осуществления контроля и надзора уполномоченным государственным органом по делам архитектуры, градостроительства и строительства за деятельностью местных исполнительных органов в сфере архитектурной, градостроительной и строительной деятельности, государственного архитектурно-строительного контроля и надзора, лицензирования"
    kaz: '"Сәулет, қала құрылысы және құрылыс қызметі, мемлекеттік сәулет-құрылыс бақылау және қадағалау, лицензиялау саласындағы жергілікті атқарушы органдардың қызметін сәулет, қала құрылысы және құрылыс істері жөніндегі уәкілетті мемлекеттік органның бақылауды және қадағалауды жүзеге асыру қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 21 қыркүйектегі № 1415 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/66389/rus

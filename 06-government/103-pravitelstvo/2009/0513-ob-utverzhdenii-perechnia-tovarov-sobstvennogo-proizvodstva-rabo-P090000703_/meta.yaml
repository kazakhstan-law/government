  title:
    rus: О внесении изменения и дополнений в постановление Правительства Республики Казахстан от 13 мая 2009 года № 703 "Об утверждении перечня товаров собственного производства (работ, услуг) по видам деятельности, соответствующим целям создания специальных экономических зон"
    kaz: '"Арнайы экономикалық аймақтар құру мақсаттарына сәйкес келетiн қызмет түрлерi бойынша өздерi өндiретiн тауарлардың (жұмыстардың, қызметтердiң) тiзбесiн бекiту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 13 мамырдағы № 703 қаулысына өзгеріс пен толықтырулар енгізу туралы'

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 30 декабря 2009 года № 2315 "О внесении изменения и дополнений в постановление Правительства Республики Казахстан от 30 июня 2007 года № 561 и об утверждении стандартов государственных услуг"
    kaz: '"Қазақстан Республикасы Үкiметiнiң 2007 жылғы 30 маусымдағы № 561 қаулысына өзгерiс пен толықтырулар енгiзу туралы және мемлекеттiк қызмет стандарттарын бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2009 жылғы 30 желтоқсандағы № 2315 қаулысына өзгерістер енгізу туралы'

  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 22 октября 2009 года № 1647 "Об утверждении Правил по определению страны происхождения товара, составлению и выдаче акта экспертизы о происхождении товара и оформлению, удостоверению и выдаче сертификата о происхождении товара"
    kaz: '"Тауар шығарылған елді анықтау, тауардың шығу тегі туралы сараптама актісін жасау және беру әрі тауардың шығу тегі туралы сертификатты ресімдеу, куәландыру және беру жөніндегі ережені бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 22 қазандағы № 1647 қаулысына өзгерістер мен толықтыру енгізу туралы'

title:
  rus: Об утверждении Правил по определению страны происхождения товара, составлению и выдаче акта экспертизы о происхождении товара и оформлению, удостоверению и выдаче сертификата о происхождении товара
  kaz: Тауар шығарылған елді анықтау, тауардың шығу тегі туралы сараптама актісін жасау және беру әрі тауардың шығу тегі туралы сертификатты ресімдеу, куәландыру және беру жөніндегі ережені бекіту туралы

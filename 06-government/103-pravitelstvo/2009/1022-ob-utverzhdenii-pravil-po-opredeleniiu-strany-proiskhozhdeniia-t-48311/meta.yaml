  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 22 октября 2009 года № 1647 "Об утверждении Правил по определению страны происхождения товара, составлению и выдаче акта экспертизы о происхождении товара и оформлению, удостоверению и выдаче сертификата о происхождении товара"
    kaz: '"Тауар шығарылған елдi анықтау, тауардың шығу тегi туралы сараптама актiсiн жасау және беру әрi тауардың шығу тегi туралы сертификатты ресiмдеу, куәландыру және беру жөнiндегi ереженi бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2009 жылғы 22 қазандағы № 1647 қаулысына өзгерістер мен толықтырулар енгізу туралы'

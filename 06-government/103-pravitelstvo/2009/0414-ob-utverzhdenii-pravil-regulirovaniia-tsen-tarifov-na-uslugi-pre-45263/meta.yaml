  requisite: Постановление Правительства Республики Казахстан от 23 мая 2016 года № 299
  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 14 апреля 2009 года № 514 «Об утверждении Правил регулирования цен (тарифов) на услуги предоставления линий и каналов связи, каналов в кабельной канализации и площадей, необходимых для размещения технических средств для нужд уполномоченных государственных органов, органов военного управления, национальной безопасности и внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы уәкілетті мемлекеттік органдарының, әскери басқару, ұлттық қауіпсіздік және ішкі істер органдарының мұқтаждықтары үшін техникалық құралдарды орналастыруға қажетті байланыс жолдары мен арналарын, кабель кәріздеріндегі арналар мен алаңдарды беру қызметтеріне бағаларды (тарифтерді) реттеу ережесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 14 сәуірдегі № 514 қаулысына өзгерістер мен толықтырулар енгізу туралы

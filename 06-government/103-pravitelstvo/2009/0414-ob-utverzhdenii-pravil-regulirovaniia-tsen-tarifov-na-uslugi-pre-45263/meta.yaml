caused_by:
  code: '120023'
  requisite: Постановление Правительства Республики Казахстан от 3 апреля 2018 года № 156
  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 14 апреля 2009 года № 514 «Об утверждении Правил регулирования цен (тарифов) на услуги предоставления линий и каналов связи, каналов в кабельной канализации и площадей, необходимых для размещения технических средств для нужд уполномоченных государственных органов, органов военного управления, национальной безопасности и внутренних дел Республики Казахстан, а также оператора информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: «Қазақстан Республикасы уәкілетті мемлекеттік органдарының, әскери басқару, ұлттық қауіпсіздік және ішкі істер органдарының, сондай-ақ «электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымы операторының мұқтаждықтары үшін техникалық құралдарды орналастыруға қажетті байланыс жолдары мен арналарын, кәбілдік кәріздердегі арналарды және алаңдарды берудің көрсетілетін қызметтеріне бағаларды (тарифтерді) реттеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 14 cәуірдегі № 514 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/120023/rus

  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан по вопросам Службы государственной охраны Республики Казахстан
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне Қазақстан Республикасы Мемлекеттік күзет қызметі мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

act_code: '49867'
requisite: Постановление Правительства Республики Казахстан от 30 декабря 2009 года № 2302. Утратило силу постановлением Правительства Республики Казахстан от 27 июля 2015 года № 592
title:
  rus: Об утверждении Правил использования денег от физических и юридических лиц, в том числе пенсионных выплат и государственных социальных пособий, зачисляемых на контрольный счет наличности государственного психиатрического учреждения специализированного типа с интенсивным наблюдением, для использования психически больными, находящимися на принудительном лечении в учреждении
  kaz: Мекемеде мәжбүрлеп емдеуде жатқан психикалық науқастың пайдалануы үшін жеке және заңды тұлғалардан түсетін ақшаны, оның ішінде жіті байқау жасалатын мамандарылған үлгідегі мемлекеттік психиатриялық мекеменің қолма-қол ақшасын бақылау шотына есепке алынатын зейнетақы төлемдері мен мемлекеттік әлеуметтік жәрдемақыларды пайдалану ережесін бекіту туралы

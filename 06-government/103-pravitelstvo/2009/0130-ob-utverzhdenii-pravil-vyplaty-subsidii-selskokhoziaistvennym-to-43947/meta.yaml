title:
  rus: Об утверждении Правил выплаты субсидий сельскохозяйственным товаропроизводителям на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ на 2009 год
  kaz: Ауыл шаруашылығы тауарын өндірушілерге 2009 жылғы көктемгі егіс және егін жинау жұмыстарын жүргізуге қажетті жанар-жағар май материалдары мен басқа да тауарлық-материалдық құндылықтардың құнын арзандатуға субсидиялар төлеу ережесін бекіту туралы

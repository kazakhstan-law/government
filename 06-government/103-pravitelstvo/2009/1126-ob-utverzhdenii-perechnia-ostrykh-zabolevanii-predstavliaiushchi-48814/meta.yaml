title:
  rus: Об утверждении перечня острых заболеваний, представляющих опасность для окружающих, при которых иностранцы и лица без гражданства, находящиеся на территории Республики Казахстан, имеют право на получение гарантированного объема бесплатной медицинской помощи
  kaz: Қазақстан Республикасының аумағында жүрген шетелдіктер мен азаматтығы жоқ адамдар тегін медициналық көмектің кепілдік берілген көлемін алуға құқылы болатын айналасындағылар үшін қауіпті төндіретін қатты аурулардың тізбесін бекіту туралы

  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 30 декабря 2009 года № 2301 "Об утверждении квалификационных требований и Правил лицензирования медицинской и фармацевтической деятельности и внесении изменений в постановление Правительства Республики Казахстан от 29 декабря 1995 года № 1894"
    kaz: '"Медициналық және фармацевтикалық қызметтің біліктілік талаптары мен лицензиялау ережесін бекіту және Қазақстан Республикасы Үкіметінің 1995 жылғы 29 желтоқсандағы № 1894 қаулысына езгерістер енгізу туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 30 желтоқсандағы № 2301 қаулысына өзгерістер мен толықтырулар енгізу туралы'

act_code: '44132'
requisite: Постановление Правительства Республики Казахстан от 11 февраля 2009 года № 133. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2018 года № 922 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня лекарственных средств любых форм, в том числе лекарственных субстанций, а также материалов и комплектующих для их производства; изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, сурдотифлотехники и медицинской (ветеринарной) техники; материалов и комплектующих для производства лекарственных средств любых форм, в том числе лекарственных субстанций, изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, и медицинской (ветеринарной) техники, обороты по реализации которых освобождаются от налога на добавленную стоимость
  kaz: Сату жөніндегі айналымдары қосылған құн салығынан босатылатын кез келген нысандағы дәрілік заттардың, оның ішінде дәрілік субстанциялардың, сондай-ақ оларды шығаруға арналған материалдар мен жинақтаушылардың; протездік-ортопедиялық бұйымдарды, сурдотифлотехниканы және медициналық (ветеринариялық) техниканы қоса алғанда, медициналық (ветеринариялық) мақсаттағы бұйымдардың; кез келген нысандағы дәрілік заттарды, оның ішінде дәрілік субстанцияларды, протездік-ортопедиялық бұйымдарды және медициналық (ветеринариялық) техниканы қоса алғанда, медициналық (ветеринариялық) мақсаттағы бұйымдарды шығаруға арналған материалдар мен жинақтаушылардың тізбесін бекіту туралы

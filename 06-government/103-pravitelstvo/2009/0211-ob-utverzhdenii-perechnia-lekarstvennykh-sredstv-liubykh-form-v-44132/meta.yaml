  requisite: Постановление Правительства Республики Казахстан от 30 марта 2012 года № 399. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2018 года № 922 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 11 февраля 2009 года № 133 "Об утверждении перечня лекарственных средств любых форм, в том числе лекарств-субстанций, а также материалов и комплектующих для их производства; изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, сурдотифлотехники и медицинской (ветеринарной) техники; материалов и комплектующих для производства лекарственных средств любых форм, в том числе лекарств-субстанций, изделий медицинского (ветеринарного) назначения, включая протезно-ортопедические изделия, и медицинской (ветеринарной) техники, обороты по реализации которых освобождаются от налога на добавленную стоимость и перечня медицинских (ветеринарных) услуг, за исключением косметологических, санаторно-курортных, обороты по реализации которых освобождаются от налога на добавленную стоимость"
    kaz: '"Сату жөніндегі айналымдары қосылған құн салығынан босатылатын кез келген нысандағы дәрілік заттардың, оның ішінде дәрілердің-субстанциялардың, сондай-ақ оларды өндіруге арналған материалдар мен жинақтаушылардың; протездік-ортопедиялық бұйымдарды, сурдотифлотехниканы және медициналық (ветеринариялық) техниканы қоса алғанда, медициналық (ветеринариялық) мақсаттағы бұйымдардың; кез келген нысандағы дәрілік заттарды, оның ішінде дәрілерді-субстанцияларды, протездік-ортопедиялық бұйымдарды және медициналық (ветеринариялық) техниканы қоса алғанда, медициналық (ветеринариялық) бұйымдарды өндіруге арналған материалдар мен жинақтаушылардың тізбесін және сату жөніндегі айналымдары қосылған құн салығынан босатылатын косметологиялық, санаторийлік-курорттық қызметтерді қоспағанда, медициналық (ветеринариялық) қызметтердің тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 11 ақпандағы № 133 қаулысына өзгерістер енгізу туралы'

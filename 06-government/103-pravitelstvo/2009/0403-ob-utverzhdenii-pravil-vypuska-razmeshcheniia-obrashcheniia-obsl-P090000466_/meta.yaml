  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 3 апреля 2009 года № 466 «Об утверждении Правил выпуска, размещения, обращения, обслуживания и погашения государственных казначейских обязательств Республики Казахстан»
    kaz: «Қазақстан Республикасының мемлекеттік қазынашылық міндеттемелерін шығарудың, орналастырудың, айналысқа қосудың, қызмет көрсетудің және өтеудің ережесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 3 сәуірдегі № 466 қаулысына өзгеріс пен толықтыру енгізу туралы

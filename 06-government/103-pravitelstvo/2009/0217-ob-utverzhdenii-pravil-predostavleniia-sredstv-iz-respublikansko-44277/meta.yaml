act_code: '44277'
requisite: Постановление Правительства Республики Казахстан от 17 февраля 2009 года № 171
title:
  rus: Об утверждении Правил предоставления средств из республиканского бюджета на субсидирование ставки вознаграждения (интереса) по кредитам, выдаваемым финансовыми институтами предприятиям по переработке сельскохозяйственной продукции на пополнение их основных и оборотных средств, по лизингу оборудования
  kaz: Ауыл шаруашылығы өнімдерін қайта өңдеу кәсіпорындарына олардың негізгі және айналым қаражатын толықтыруға қаржы институттары беретін кредиттер бойынша, жабдықтар лизингі бойынша сыйақы (мүдде) ставкасын субсидиялауға республикалық бюджеттен қаражат беру ережесін бекіту туралы

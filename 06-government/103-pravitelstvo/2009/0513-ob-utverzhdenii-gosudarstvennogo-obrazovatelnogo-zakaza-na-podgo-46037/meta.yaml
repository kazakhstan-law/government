act_code: '46037'
requisite: Постановление Правительства Республики Казахстан от 13 мая 2009 года № 704
title:
  rus: Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования, финансируемых из республиканского бюджета (за исключением подготовки специалистов в организациях образования Комитета национальной безопасности Республики Казахстан) на 2009/2010 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің білім беру ұйымдарында мамандар даярлауды қоспағанда) жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2009/2010 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы

title:
  rus: Об утверждении Правил присвоения учетных номеров объектам производства, осуществляющим выращивание животных, заготовку (убой), хранение, переработку и реализацию животных, продукции и сырья животного происхождения, а также организациям по производству, хранению и реализации ветеринарных препаратов, кормов и кормовых добавок
  kaz: Жануарлар өсіруді, жануарларды, жануарлардан алынатын өнімдер мен шикізатты дайындауды (союды), сақтауды, қайта өңдеуді және өткізуді жүзеге асыратын өндіріс объектілеріне, сондай-ақ ветеринариялық препараттарды, жемшөп пен жемшөп қоспаларын өндіру, сақтау және өткізу жөніндегі ұйымдарға есептік нөмірлер беру ережесін бекіту туралы

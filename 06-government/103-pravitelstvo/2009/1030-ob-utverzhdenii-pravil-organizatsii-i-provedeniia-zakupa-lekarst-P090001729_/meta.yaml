  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 30 октября 2009 года № 1729 «Об утверждении Правил организации и проведения закупа лекарственных средств, профилактических (иммунобиологических, диагностических, дезинфицирующих) препаратов, изделий медицинского назначения и медицинской техники, фармацевтических услуг по оказанию гарантированного объема бесплатной медицинской помощи и медицинской помощи в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемін және міндетті әлеуметтік медициналық сақтандыру жүйесіндегі медициналық көмекті көрсету бойынша дәрілік заттарды, профилактикалық (иммундық-биологиялық, диагностикалық, дезинфекциялық) препараттарды, медициналық мақсаттағы бұйымдар мен медициналық техниканы, фармацевтикалық қызметтер көрсетуді сатып алуды ұйымдастыру және өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2009 жылғы 30 қазандағы № 1729 қаулысына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/116592/rus

act_code: '46674'
requisite: Постановление Правительства Республики Казахстан от 26 июня 2009 года № 984. Утратил силу постановлением Правительства Республики Казахстан от 28 декабря 2018 года № 902 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил уведомления операторами сотовой связи соответствующих органов, осуществляющих оперативно-розыскную деятельность, в случае обнаружения в своей сети нескольких абонентских устройств с идентичными идентификационными кодами
  kaz: Ұялы байланыс операторларының өз желісінде бірдей сәйкестендіру кодтары бар бірнеше абоненттік құрылғыларды байқаған жағдайда, жедел-іздестіру қызметін жүзеге асыратын тиісті органдарды хабардар ету ережесін бекіту туралы

title:
  rus: Об утверждении Правил организации и проведения закупа медицинских услуг по оказанию гарантированного объема бесплатной медицинской помощи
  kaz: Тегін медициналық көмектің кепілдік берілген көлемін көрсету бойынша медициналық қызметтерді сатып алуды ұйымдастыру және жүргізу ережесін бекіту туралы

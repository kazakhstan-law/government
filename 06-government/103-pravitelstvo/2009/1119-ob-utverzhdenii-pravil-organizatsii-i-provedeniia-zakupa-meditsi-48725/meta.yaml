  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 19 ноября 2009 года № 1888 "Об утверждении Правил организации и проведения закупа медицинских услуг по оказанию гарантированного объема бесплатной медицинской помощи" и от 7 декабря 2009 года № 2030 "Об утверждении Правил возмещения затрат организациям здравоохранения за счет бюджетных средств"
    kaz: Қазақстан Республикасы Үкіметінің "Тегін медициналық көмектің кепілдік берілген көлемін көрсету бойынша медициналық қызметтерді сатып алуды ұйымдастыру және жүргізу ережесін бекіту туралы" 2009 жылғы 19 қарашадағы № 1888 және "Денсаулық сақтау ұйымдарының шығындарын бюджет қаражатының есебінен өтеу ережесін бекіту туралы" 2009 жылғы 7 желтоқсандағы № 2030 қаулыларына өзгерістер мен толықтырулар енгізу туралы

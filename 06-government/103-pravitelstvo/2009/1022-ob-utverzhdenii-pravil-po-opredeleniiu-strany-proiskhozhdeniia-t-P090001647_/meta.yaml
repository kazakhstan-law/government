  title:
    rus: Об определении органа (организации), уполномоченного на выдачу сертификата о происхождении товара для внутреннего обращения, и о внесении изменений в некоторые решения Правительства Республики Казахстан
    kaz: Ішкі айналымға арналған тауардың шығу тегі туралы сертификатты беруге уәкілетті органды (ұйымды) айқындау және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер енгізу туралы

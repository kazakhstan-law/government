title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в сферах лесного хозяйства, особо охраняемых природных территорий и расходования ими полученных при этом денежных средств
  kaz: Орман шаруашылығы, ерекше қорғалатын табиғи аумақтар салаларындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың бұл ретте алған ақша қаражатын жұмсау ережесін бекіту туралы

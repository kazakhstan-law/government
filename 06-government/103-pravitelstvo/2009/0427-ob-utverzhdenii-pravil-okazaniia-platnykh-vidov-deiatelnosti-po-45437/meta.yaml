  title:
    rus: О внесении дополнения в постановление Правительства Республики Казахстан от 27 апреля 2009 года № 586 "Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в сферах лесного хозяйства, особо охраняемых природных территорий и расходования ими полученных при этом денежных средств"
    kaz: '"Орман шаруашылығы, ерекше қорғалатын табиғи аумақтар салаларындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың бұл ретте алған ақша қаражатын жұмсау ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2009 жылғы 27 сәуірдегі № 586 қаулысына толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/59950/rus

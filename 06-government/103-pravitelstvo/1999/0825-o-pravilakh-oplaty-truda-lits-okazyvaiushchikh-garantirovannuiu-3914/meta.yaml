title:
  rus: О Правилах оплаты труда лиц, оказывающих гарантированную государством юридическую помощь, учета юридической помощи, оказанной адвокатом, и возмещения расходов, связанных с консультированием, защитой и представительством, а также размере оплаты его труда
  kaz: Мемлекет кепілдік берген заң көмегін көрсететін тұлғаларға еңбекақы төлеу, адвокат көрсеткен заң көмегін есепке алу және консультация беруге, қорғауға және өкілдік етуге байланысты шығыстарды өтеу қағидалары, сондай-ақ оның еңбекақы мөлшері туралы

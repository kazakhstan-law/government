act_code: '3616'
requisite: Постановление Правительства Республики Казахстан от 5 июля 1999 года № 929
title:
  rus: Об утверждении Меморандума между Таможенным комитетом Министерства государственных доходов Республики Казахстан и Таможенным управлением Исламской Республики Иран о сотрудничестве в борьбе с контрабандой и таможенными правонарушениями
  kaz: Қазақстан Республикасы Мемлекеттік кіріс Министрлігінің Кеден комитеті мен Иран Ислам Республикасы Кеден басқармасының арасындағы Контрабандамен және кедендік құқық бұзушылықтармен күрестегі ынтымақтастық туралы меморандумды бекіту туралы

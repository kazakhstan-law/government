  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 30 декабря 1999 года № 2021 "Об утверждении Перечня должностей работников, лиц, осуществляющих техническое обслуживание и обеспечивающих функционирование государственных органов и не являющихся государственными служащими"
    kaz: '"Техникалық қызмет көрсетуді жүзеге асыратын және мемлекеттік органдардың жұмыс істеуін қамтамасыз ететін және мемлекеттік қызметші болып табылмайтын қызметкерлер, тұлғалар лауазымдарының тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 1999 жылғы 30 желтоқсандағы № 2021 қаулысына өзгерістер енгізу туралы'

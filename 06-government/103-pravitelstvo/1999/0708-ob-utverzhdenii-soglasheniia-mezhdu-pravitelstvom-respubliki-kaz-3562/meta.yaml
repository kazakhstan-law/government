title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан, Правительством Кыргызской Республики, Правительством Республики Таджикистан и Правительством Республики Узбекистан об оказании медицинской помощи гражданам государств-участников Договора о создании единого экономического пространства
  kaz: Қазақстан Республикасы Үкіметінің, Қырғыз Республикасы Үкіметінің, Тәжікстан Республикасы Үкіметінің және Өзбекстан Республикасы Үкіметінің арасындағы Біртұтас экономикалық кеңістік құру туралы шартқа қатысушы мемлекеттердің азаматтарына медициналық көмек көрсету туралы келісімді бекіту туралы

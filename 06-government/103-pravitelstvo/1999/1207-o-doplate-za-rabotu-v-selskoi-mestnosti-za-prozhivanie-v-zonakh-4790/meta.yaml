  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 7 декабря 1999 года N 1876 "О доплате за работу в сельской местности, за проживание в зонах экологического бедствия, за классное руководство, за проверку тетрадей, письменных работ, за заведование учебными кабинетами, углубленное преподавание предметов и других выплатах работникам организаций образования"
    kaz: '"Бiлiм беру ұйымдарының қызметкерлерiне селолық жерлерде жұмыс iстегенi үшiн, экологиялық апат аймағында тұрғаны үшiн, сынып жетекшiлiгі үшiн, жазба жұмыстарын, дәптерлерiн тексергенi үшiн, оқу кабинетiнiң меңгерушiлігі үшiн, пәндердi тереңдетiп оқытқаны үшiн қосымша ақы мен басқа да төлемдер туралы" Қазақстан Республикасы Yкiметiнiң 1999 жылғы 7 желтоқсандағы N 1876 қаулысына өзгерiс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/5089/rus

act_code: '4790'
requisite: Постановление Правительства Республики Казахстан от 7 декабря 1999 года N 1876. Утратило силу - постановлением Правительства РК от 29 декабря 2000 г. N 1927
title:
  rus: О доплате за работу в сельской местности, за проживание в зонах экологического бедствия, за классное руководство, за проверку тетрадей, письменных работ, за заведование учебными кабинетами, углубленное преподавание предметов и других выплат работникам организаций образования
  kaz: Білім беру ұйымдарының қызметкерлеріне селолық жерлерде жұмыс істегені үшін, экологиялық апат аймағында тұрғаны үшін, сынып жетекшілігі үшін, жазба жұмыстарын, дәптерлерін тексергені үшін, оқу кабинетінің меңгерушілігі үшін, пәндерді тереңдетіп оқытқаны үшін қосымша ақы мен басқа да төлемдер туралы

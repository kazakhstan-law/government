  title:
    rus: О переименовании государственных учреждений - территориальных органов Комитета казначейства Министерства финансов Республики Казахстан, внесении изменений и дополнений и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасының Қаржы министрлiгi Қазынашылық комитетiнiң аумақтық органдары - мемлекеттiк мекемелерiн қайта атау, Қазақстан Республикасы Yкiметiнiң кейбiр шешiмдерiне өзгерiстер мен толықтырулар енгiзу және күшi жойылды деп тану туралы

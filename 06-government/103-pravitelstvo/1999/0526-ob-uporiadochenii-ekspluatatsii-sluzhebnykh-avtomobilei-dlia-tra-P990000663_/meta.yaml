  title:
    rus: О внесении дополнений в постановления Правительства Республики Казахстан от 27 мая 1999 года № 663 "Об упорядочении эксплуатации служебных автомобилей для транспортного обслуживания государственных органов Республики Казахстан" и от 31 марта 2011 года № 335 "О нормах площадей для размещения аппарата и специфических помещений государственных органов и нормах положенности за пользование телефонной связью и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасының мемлекеттiк органдарына көлiк қызметiн көрсету үшiн қызметтiк автомобильдердi пайдалануды ретке келтiру туралы" 1999 жылғы 27 мамырдағы № 663 және "Мемлекеттiк органдардың аппаратын және ерекше үй-жайларын орналастыруға арналған алаңдар нормалары мен телефон байланысын пайдалану үшiн тиесiлiлiк нормалары және Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiне өзгерiстер мен толықтырулар енгiзу туралы" 2011 жылғы 31 наурыздағы № 335 қаулыларына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/60720/rus

  title:
    rus: О внесении изменений и дополнения в постановления Правительства Республики Казахстан от 27 мая 1999 года № 663 "Об упорядочении эксплуатации служебных автомобилей для транспортного обслуживания государственных органов Республики Казахстан" и от 24 февраля 2000 года № 288 "Об упорядочении эксплуатации специальных транспортных средств для обслуживания государственных учреждений, финансируемых из республиканского бюджета"
    kaz: '"Қазақстан Республикасының мемлекеттiк органдарына көлiк қызметiн көрсету үшiн қызметтiк автомобильдердi пайдалануды ретке келтiру туралы" Қазақстан Республикасы Үкiметiнiң 1999 жылғы 27 мамырдағы № 663 және "Республикалық бюджеттен қаржыландырылатын мемлекеттiк мекемелерге қызмет көрсетуге арналған арнайы көлiк құралдарын пайдалануды реттеу туралы" Қазақстан Республикасы Үкiметiнiң 2000 жылғы 24 ақпандағы № 288 қаулыларына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/68611/rus

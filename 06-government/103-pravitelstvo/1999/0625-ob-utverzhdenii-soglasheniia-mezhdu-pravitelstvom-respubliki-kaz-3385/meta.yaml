act_code: '3385'
requisite: Постановление Правительства Республики Казахстан от 26 июня 1999 года № 866
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Грузии о сотрудничестве в области подготовки и аттестации научных и научно-педагогических кадров высшей квалификации
  kaz: Қазақстан Республикасы Үкіметі мен Грузия Үкіметі арасындағы жоғары дәрежелі ғылыми және ғылыми-педагогикалық мамандар даярлау мен аттестациялау саласындағы ынтымақтастық туралы келісімді бекіту туралы

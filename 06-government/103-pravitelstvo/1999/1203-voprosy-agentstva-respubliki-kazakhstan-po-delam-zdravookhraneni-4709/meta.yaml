    rus: О реорганизации республиканских государственных казенных предприятий "Республиканская клиника профессиональных заболеваний", "Профпатологическая клиника" Агентства Республики Казахстан по делам здравоохранения и Республиканского государственного казенного предприятия "Институт физиологии и гигиены труда" Министерства образования и науки Республики Казахстан

  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан по вопросам экспортного контроля
    kaz: Қазақстан Республикасы Үкіметінің экспорттық бақылау мәселелері жөніндегі кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

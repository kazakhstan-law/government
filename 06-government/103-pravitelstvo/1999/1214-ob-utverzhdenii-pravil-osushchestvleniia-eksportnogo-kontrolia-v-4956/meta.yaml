  kaz: Қазақстан Республикасында экспорттық бақылауды жүзеге асырудың тәртібі мен Қазақстан Республикасына әкелінетін экспорттық бақылауға жататын өнімді пайдалану жөніндегі міндеттемелерді ресімдеу және олардың атқарылуын бақылаудың тәртібін бекіту туралы

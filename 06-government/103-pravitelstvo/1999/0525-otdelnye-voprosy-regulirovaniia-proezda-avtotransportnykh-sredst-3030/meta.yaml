title:
  rus: Отдельные вопросы регулирования проезда автотранспортных средств по территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағы бойынша автокөлік құралдарының жүріп өтуін реттеудің жекелеген мәселелері

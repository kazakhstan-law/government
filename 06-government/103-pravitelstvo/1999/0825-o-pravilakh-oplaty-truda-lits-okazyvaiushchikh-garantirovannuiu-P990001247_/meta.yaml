  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 26 августа 1999 года № 1247 "О Правилах оплаты юридической помощи, оказываемой адвокатами, и возмещения расходов, связанных с защитой и представительством, за счет средств республиканского бюджета"
    kaz: '"Республикалық бюджет қаражаты есебiнен адвокаттар көрсететiн заң көмегiне ақы төлеу және қорғау мен өкiлдiк етуге байланысты шығыстарды өтеудiң ережелерi туралы" Қазақстан Республикасы Үкіметінің 1999 жылғы 26 тамыздағы № 1247 қаулысына өзгерістер енгізу туралы'

act_code: '5005'
requisite: Постановление Правительства Республики Казахстан от 19 декабря 1999 года N 1930
title:
  rus: Об утверждении Списка N 1 производств, работ, профессий, должностей и показателей на подземных и открытых горных работах, на работах с особо вредными и особо тяжелыми условиями труда и Списка N 2 производств, работ, профессий, должностей и показателей на работах с вредными и тяжелыми условиями труда
  kaz: Жерасты және ашық кен жұмыстарындағы, еңбек жағдайлары ерекше зиянды және ерекше ауыр жұмыстардағы өндірістердің, жұмыстардың, кәсіптердің, лауазымдар мен көрсеткіштердің N 1 Тізімін және Еңбек жағдайлары зиянды және ауыр жұмыстардағы өндірістердің, жұмыстардың, кәсіптердің, лауазымдар мен көрсеткіштердің N 2 Тізімін бекіту туралы

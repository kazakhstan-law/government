act_code: '2391'
requisite: Постановление Правительства Республики Казахстан от 3 марта 1999 года № 195
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан, Правительством Кыргызской Республики, Правительством Республики Таджикистан и Правительством Республики Узбекистан о порядке и условиях привлечения научных организаций, ученых и специалистов государств-участников к выполнению национальных научно-технологических программ
  kaz: Қазақстан Республикасы Үкіметі, Қырғыз Республикасы Үкіметі, Тәжікстан Республикасы Үкіметі және Өзбекстан Республикасы Үкіметі арасындағы қатысушы мемлекеттердің ғылыми ұйымдарын, ғалымдары мен мамандарын ұлттық ғылыми-технологиялық бағдарламаларды орындауға тартудың тәртібі мен шарттары туралы келісімді бекіту туралы

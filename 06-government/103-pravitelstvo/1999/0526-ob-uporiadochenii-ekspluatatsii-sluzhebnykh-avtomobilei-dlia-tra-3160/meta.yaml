  title:
    rus: О нормах площадей для размещения аппарата и специфических помещений государственных органов и нормах положенности за пользование телефонной связью и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Мемлекеттік органдардың аппаратын және ерекше үй-жайларын орналастыруға арналған алаңдар нормалары мен телефон байланысын пайдалану үшін тиесілілік нормалары және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

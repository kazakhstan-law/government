  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 27 мая 1999 года № 663 "Об упорядочении эксплуатации служебных автомобилей для транспортного обслуживания государственных органов Республики Казахстан" и от 24 февраля 2000 года № 288 "Об упорядочении эксплуатации специальных транспортных средств для обслуживания государственных учреждений, финансируемых из республиканского бюджета"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасының мемлекеттік органдарына көлік қызметін көрсету үшін қызметтік автомобильдерді пайдалануды ретке келтіру туралы" 1999 жылғы 27 мамырдағы № 663 және "Республикалық бюджеттен қаржыландырылатын мемлекеттік мекемелерге қызмет көрсетуге арналған арнайы көлік құралдарын пайдалануды реттеу туралы" 2000 жылғы 24 ақпандағы № 288 қаулыларына өзгерістер мен толықтырулар енгізу туралы

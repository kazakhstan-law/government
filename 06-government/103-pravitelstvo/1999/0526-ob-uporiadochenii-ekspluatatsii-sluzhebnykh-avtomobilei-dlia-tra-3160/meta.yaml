title:
  rus: Об упорядочении эксплуатации служебных автомобилей для транспортного обслуживания государственных органов Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттiк органдарына көлiк қызметiн көрсету үшiн қызметтiк автомобильдердi пайдалануды ретке келтiру туралы

  code: '82135'
  requisite: Постановление Правительства Республики Казахстан от 11 марта 2003 года N 229
  title:
    rus: Об утверждении Протокола о присоединении Республики Таджикистан к Соглашению между Правительством Республики Беларусь, Правительством Республики Казахстан, Правительством Кыргызской Республики и Правительством Российской Федерации о взаимном признании и эквивалентности документов об образовании, ученых степенях и званиях от 24 ноября 1998 года и Протокола о внесении изменений и дополнений в Соглашение между Правительством Республики Беларусь, Правительством Республики Казахстан, Правительством Кыргызской Республики и Правительством Российской Федерации о взаимном признании и эквивалентности документов об образовании, ученых степенях и званиях от 24 ноября 1998 года
    kaz: 1998 жылғы 24 қарашадағы Беларусь Республикасының Үкiметi, Қазақстан Республикасының Үкiметi, Қырғыз Республикасының Үкiметi және Ресей Федерациясының Yкiметi арасындағы бiлiм, ғылыми дәрежелер мен атақтар жөнiндегi құжаттарды өзара тану және олардың баламалығы туралы келiсiмге Тәжікстан Республикасының қосылуы туралы хаттаманы және 1998 жылғы 24 қарашадағы Беларусь Республикасының Үкiметi, Қазақстан Республикасының Үкiметi, Қырғыз Республикасының Үкiметi және Ресей Федерациясының Үкiметi арасындағы бiлiм, ғылыми дәрежелер мен атақтар жөнiндегi құжаттарды өзара тану және олардың баламалығы туралы келiсiмге өзгерiстер мен толықтырулар енгiзу туралы хаттаманы бекiту туралы
  link: https://zan.gov.kz/client/#!/doc/82135/rus

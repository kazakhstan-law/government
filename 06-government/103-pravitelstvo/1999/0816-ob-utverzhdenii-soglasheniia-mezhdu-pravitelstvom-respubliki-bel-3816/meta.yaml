title:
  rus: Об утверждении Соглашения между Правительством Республики Беларусь, Правительством Республики Казахстан, Правительством Кыргызской Республики и Правительством Российской Федерации о взаимном признании и эквивалентности документов об образовании, ученых степенях и званиях
  kaz: Беларусь Республикасының Үкіметі, Қазақстан Республикасының Үкіметі, Қырғыз Республикасының Үкіметі және Ресей Федерациясының Үкіметі арасындағы Білім туралы құжаттарды, ғылыми дәрежелерді және атақтарды өзара тану және баламдылығы туралы келісімді бекіту жөнінде

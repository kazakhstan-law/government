title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Исламской Республики Иран о сотрудничестве в борьбе с организованной преступностью и терроризмом
  kaz: Қазақстан Республикасының Үкіметі мен Иран Ислам Республикасының Үкіметі арасындағы Ұйымдасқан қылмысқа және терроризмге қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы

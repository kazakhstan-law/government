title:
  rus: Об утверждении Положения о порядке изменения, восстановления и аннулирования записей актов гражданского состояния, формы книг регистрации актов гражданского состояния и формы свидетельств, выдаваемых на основании записей в этих книгах, и Правил о порядке регистрации актов гражданского состояния в Республике Казахстан
  kaz: Қазақстан Республикасында азаматтық хал актілері жазбаларын өзгерту, қалпына келтіру және жою туралы ережені, азаматтық хал актілерін тіркеу кітаптарының нысандарын және осы кітаптардағы жазбалардың негізінде берілетін куәліктердің нысандарын және Қазақстан Республикасында азаматтық хал актілерін тіркеу тәртібі туралы ережелерді бекіту туралы

title:
  rus: Об утверждении Соглашения между Министерством сельского хозяйства Республики Казахстан и Министерством земледелия Венгерской Республики о сотрудничестве в области сельского хозяйства и перерабатывающей промышленности
  kaz: Қазақстан Республикасының Ауыл шаруашылығы министрлігі мен Венгрия Республикасының Егін шаруашылығы министрлігі арасындағы Ауыл шаруашылығы және ұқсату өнеркәсібі саласындағы ынтымақтастық туралы келісімді бекіту туралы

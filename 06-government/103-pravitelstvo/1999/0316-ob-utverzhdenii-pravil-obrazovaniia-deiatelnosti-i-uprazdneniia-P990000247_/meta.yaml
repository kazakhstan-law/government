  title:
    rus: 'О внесении изменений в постановление Правительства Республики Казахстан от 16 марта 1999 года № 247 «Об утверждении Инструкции о порядке создания, деятельности и ликвидации  консультативно-совещательных органов при Правительстве Республики Казахстан и рабочих групп» '
    kaz: «Қазақстан Республикасы Үкіметінің жанындағы консультациялық-кеңесші органдар мен жұмыс топтарын құру тәртібі, қызметі мен таратылуы туралы нұсқаулықты бекіту туралы» Қазақстан Республикасы Үкіметінің 1999 жылғы 16 наурыздағы № 247 қаулысына өзгерістер енгізу туралы

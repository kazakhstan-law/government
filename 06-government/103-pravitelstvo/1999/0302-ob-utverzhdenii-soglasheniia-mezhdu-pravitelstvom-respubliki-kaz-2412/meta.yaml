act_code: '2412'
requisite: Постановление Правительства Республики Казахстан от 2 марта 1999 года № 191
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в области использования космической и авиационной техники, технологий и дистанционного зондирования Земли
  kaz: Қазақстан Республикасы Үкіметі мен Ресей Федерациясы Үкіметі арасындағы ғарыштық және авиациялық техниканы, технологияларды пайдалану және Жерді дистанциялық барлау саласындағы ынтымақтастық туралы Келісімді бекіту туралы

  rus: Об утверждении Положений об органах опеки и попечительства Республики Казахстан, о патронате и Правил организации централизованного учета детей, оставшихся без попечения родителей
  kaz: Қазақстан Республикасының қорғаншылық және қамқоршылық органдары туралы және Патронат туралы ережелерді және Ата-анасының қамқорлығынсыз қалған балаларды орталықтандырылған есепке алуды ұйымдастыру ережесін бекіту туралы

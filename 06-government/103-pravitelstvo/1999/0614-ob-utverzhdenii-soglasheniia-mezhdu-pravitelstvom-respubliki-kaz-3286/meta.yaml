act_code: '3286'
requisite: Постановление Правительства Республики Казахстан от 15 июня 1999 года № 768
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Российской Федерации о сотрудничестве в борьбе против незаконного оборота наркотических средств, психотропных веществ и злоупотребления ими
  kaz: Қазақстан Республикасының Үкіметі мен Ресей Федерациясының Үкіметі арасындағы Есірткі құралдарының, жүйкеге әсер ететін заттардың заңсыз айналымына және оларды теріс пайдалануға қарсы күрестегі ынтымақтастық туралы келісімді бекіту туралы

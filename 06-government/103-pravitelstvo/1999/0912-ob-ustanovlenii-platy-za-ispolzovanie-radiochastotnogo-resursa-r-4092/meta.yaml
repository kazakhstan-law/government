requisite: Постановление Правительства Республики Казахстан от 13 сентября 1999 года N 1387. Утратило силу - постановлением Правительства РК от 15 июня 2001 г. N 825
title:
  rus: Об установлении платы за использование радиочастотного ресурса Республики Казахстан, включая платежи, связанные с вводом в эксплуатацию радиоэлектронных средств и высокочастотных устройств на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағында радиоэлектронды құралдар мен жоғары жиілікті құрылғыларды пайдалануға қосуға байланысты төлемдерді қоса алғанда, Қазақстан Республикасының радиожиілік ресурсын пайдалану үшін ақы белгілеу туралы

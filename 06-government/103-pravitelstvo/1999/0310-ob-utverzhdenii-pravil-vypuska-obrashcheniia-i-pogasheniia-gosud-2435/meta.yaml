act_code: '2435'
requisite: Постановление Правительства Республики Казахстан от 10 марта 1999 года N 220. Утратило силу с момента последнего погашения государственных ценных бумаг, выпущенных до даты принятия настоящего постановления, - постановлением Правительства РК от 8 сентября 2004 г. N 941
title:
  rus: Об утверждении Правил выпуска, обращения и погашения государственных индексированных казначейских обязательств Республики Казахстан со сроком обращения три месяца и более
  kaz: Қазақстан Республикасының айналым мерзімі үш ай және одан астам мемлекеттік индекстелген қазынашылық міндеттемелерін шығарудың, олардың айналымының және өтелуінің тәртібін бекіту туралы

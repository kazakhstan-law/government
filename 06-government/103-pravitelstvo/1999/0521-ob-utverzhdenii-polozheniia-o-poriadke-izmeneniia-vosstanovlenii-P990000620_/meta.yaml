    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и признании утратившим силу постановления Кабинета Министров Республики Казахстан от 12 января 1993 года N 31
    kaz: Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiне өзгерiстер мен толықтырулар енгізу және Қазақстан Республикасы Министрлер Кабинетiнiң 1993 жылғы 12 қаңтардағы N 31 қаулысының күшi жойылды деп тану туралы

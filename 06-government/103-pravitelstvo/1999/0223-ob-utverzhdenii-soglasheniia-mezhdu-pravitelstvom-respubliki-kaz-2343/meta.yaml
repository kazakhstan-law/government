act_code: '2343'
requisite: Постановление Правительства Республики Казахстан от 23 февраля 1999 года № 148
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Республики Узбекистан о сотрудничестве в области поисков, разведки и разработки месторождений нефти и газа
  kaz: Қазақстан Республикасының Үкіметі мен Өзбекстан Республикасының Үкіметі арасындағы Мұнай және газ кен орындарын іздеу, барлау және игеру саласындағы ынтымақтастық жөніндегі келісімді бекіту туралы

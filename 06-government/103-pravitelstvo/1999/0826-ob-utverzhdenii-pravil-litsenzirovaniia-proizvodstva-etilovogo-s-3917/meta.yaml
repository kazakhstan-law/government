title:
  rus: Об утверждении Правил лицензирования производства этилового спирта и алкогольной продукции, хранения и оптовой реализации алкогольной продукции (кроме пива), а также розничной торговли алкогольной продукцией (кроме пива)
  kaz: Этил спирті мен алкоголь өнімін өндіруді, алкоголь өнімін (сырадан басқа) сақтау мен көтерме сатуды, сондай-ақ алкоголь (сырадан басқа) өнімімен бөлшек сауда жасауды лицензиялаудың тәртібін бекіту туралы

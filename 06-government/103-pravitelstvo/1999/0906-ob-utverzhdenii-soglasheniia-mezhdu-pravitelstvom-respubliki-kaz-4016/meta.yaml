act_code: '4016'
requisite: Постановление Правительства Республики Казахстан от 7 сентября 1999 года № 1317
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан и Правительством Литовской Республики о предоставлении транспортных и других услуг для выполнения перевозок грузов Республики Казахстан через Клайпедский государственный морской порт
  kaz: Қазақстан Республикасының Үкіметі мен Литва Республикасының Үкіметі арасындағы Қазақстан Республикасының жүктерін Клайпеда мемлекеттік теңіз порты арқылы тасымалдауды орындау үшін көліктік және басқа қызметтер көрсету туралы келісімді бекіту туралы

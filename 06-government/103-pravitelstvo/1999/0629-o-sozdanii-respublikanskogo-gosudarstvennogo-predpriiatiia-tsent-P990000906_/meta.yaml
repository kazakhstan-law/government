  kaz: '"Қазақстан Республикасының Әдiлет министрлiгi Тiркеу қызметi комитетiнiң Ақмола облысы бойынша жылжымайтын мүлiк жөнiндегi орталығы" республикалық мемлекеттік кәсiпорнын құру туралы'

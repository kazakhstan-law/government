  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 5 августа 2024 года № 626 «Об утверждении Правил, форм поддержки и других условий, необходимых для оказания государственной нефинансовой поддержки субъектам частного предпринимательства, предоставляемых в различных отраслях экономики, которые относятся к компетенциям нескольких отраслевых государственных органов»
    kaz: «Жеке кәсіпкерлік субъектілерін бірнеше салалық мемлекеттік органның құзыретіне жататын экономиканың әртүрлі салаларында ұсынылатын мемлекеттік қаржылай емес қолдау тәртібін, нысандарын және оларға қолдау көрсетуге қажетті басқа да шарттарды бекіту туралы» Қазақстан Республикасы Үкіметінің 2024 жылғы 5 тамыздағы № 626 қаулысына өзгерістер енгізу туралы

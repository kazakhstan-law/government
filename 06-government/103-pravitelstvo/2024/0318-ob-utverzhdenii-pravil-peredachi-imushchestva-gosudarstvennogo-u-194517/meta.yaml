act_code: '194517'
requisite: Постановление Правительства Республики Казахстан от 18 марта 2024 года № 194
title:
  rus: Об утверждении Правил передачи имущества государственного учреждения правоохранительным и специальным государственным органам Республики Казахстан, Вооруженным Силам Республики Казахстан, другим войскам и воинским формированиям для принятия мер по предупреждению и ликвидации чрезвычайной ситуации социального характера, а также при введении чрезвычайного или военного положения
  kaz: Мемлекеттік мекеменің мүлкін әлеуметтік сипаттағы төтенше жағдайдың алдын алу және оларды жою жөніндегі шараларды қабылдау үшін, сондай-ақ төтенше жағдай немесе соғыс жағдайы енгізілген кезде Қазақстан Республикасының құқық қорғау органдары мен арнаулы мемлекеттік органдарына, Қазақстан Республикасының Қарулы Күштеріне, басқа да әскерлер мен әскери құралымдарға беру қағидаларын бекіту туралы

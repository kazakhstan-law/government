title:
  rus: О реорганизации республиканского государственного предприятия на праве хозяйственного ведения «Казводхоз» Комитета водного хозяйства Министерства водных ресурсов и ирригации Республики Казахстан и республиканского государственного предприятия на праве хозяйственного ведения «Нуринский групповой водопровод» Комитета водного хозяйства Министерства водных ресурсов и ирригации Республики Казахстан

  code: '207866'
  requisite: Постановление Правительства Республики Казахстан от 7 марта 2025 года № 131
  title:
    rus: Об увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2024 года и использовании (доиспользовании) в 2025 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2024 году, и внесении изменений и дополнений в постановление Правительства Республики Казахстан от 10 декабря 2024 года № 1046 «О реализации Закона Республики Казахстан «О республиканском бюджете на 2025 – 2027 годы»
    kaz: 2024 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2024 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2025 жылы пайдалану (толық пайдалану) және «2025 – 2027 жылдарға арналған республикалық бюджет туралы» Қазақстан Республикасының Заңын іске асыру туралы» Қазақстан Республикасы Үкіметінің 2024 жылғы 10 желтоқсандағы № 1046 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/207866/rus

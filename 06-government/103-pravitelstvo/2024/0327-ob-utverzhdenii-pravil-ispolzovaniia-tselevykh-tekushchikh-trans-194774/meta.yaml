title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2024 год областными бюджетами, бюджетами городов республиканского значения, столицы на обеспечение прав и улучшение качества жизни лиц с инвалидностью в Республике Казахстан
  kaz: Облыстық бюджеттердің, республикалық маңызы бар қалалар, астана бюджеттерінің Қазақстан Республикасында мүгедектігі бар адамдардың құқықтарын қамтамасыз етуге және өмір сүру сапасын жақсартуға 2024 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалануы қағидаларын бекіту туралы

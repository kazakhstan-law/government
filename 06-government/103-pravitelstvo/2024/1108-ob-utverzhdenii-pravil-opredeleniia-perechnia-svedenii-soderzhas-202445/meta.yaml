act_code: '202445'
requisite: Постановление Правительства Республики Казахстан от 8 ноября 2024 года № 939. Утратило силу постановлением Правительства Республики Казахстан от 8 октября 2025 года № 829 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил определения перечня сведений, содержащихся на материальных носителях с дактилоскопической информацией, при оформлении документов, удостоверяющих личность, виз Республики Казахстан, выдаче разрешения на постоянное или временное проживание в Республике Казахстан, а также сведений, содержащихся в дактилоскопической информации иностранцев и лиц без гражданства, подлежащих выдворению за пределы Республики Казахстан либо подпадающих под действие международных договоров о реадмиссии, ратифицированных Республикой Казахстан
  kaz: Қазақстан Республикасының жеке басты куәландыратын құжаттарын, визаларын ресімдеу, Қазақстан Республикасында тұрақты немесе уақытша тұруға рұқсат беру кезінде дактилоскопиялық ақпараты бар материалдық жеткізгіштерде қамтылатын мәліметтердің, сондай-ақ Қазақстан Республикасының шегінен тысқары жерлерге шығарып жіберілуге жататын не Қазақстан Республикасы ратификациялаған реадмиссия туралы халықаралық шарттардың күші қолданылатын шетелдіктер мен азаматтығы жоқ адамдардың дактилоскопиялық ақпаратында қамтылатын мәліметтердің тізбесін айқындау қағидаларын бекіту туралы

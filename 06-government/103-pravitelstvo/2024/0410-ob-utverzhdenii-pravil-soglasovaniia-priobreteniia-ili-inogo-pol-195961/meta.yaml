act_code: '195961'
requisite: Постановление Правительства Республики Казахстан от 10 апреля 2024 года № 266
title:
  rus: Об утверждении Правил согласования приобретения или иного получения в собственность физическими и юридическими лицами более 10 процентов голосующих акций, а также долей, паев организации, владеющей и (или) осуществляющей деятельность по управлению или эксплуатации линии связи в качестве оператора междугородной и (или) международной связи
  kaz: Қалааралық және (немесе) халықаралық байланыс операторы ретiнде байланыс желісін иеленетін және (немесе) оны басқару немесе пайдалану жөнiндегi қызметтi жүзеге асыратын ұйымның дауыс беретін акцияларының, сондай-ақ үлестерінің, пайларының 10 пайыздан астамын жеке және заңды тұлғалардың сатып алуын немесе меншiкке өзгеше алуын келісу қағидаларын бекіту туралы

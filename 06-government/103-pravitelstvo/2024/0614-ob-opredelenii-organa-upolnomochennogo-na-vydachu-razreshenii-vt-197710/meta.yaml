act_code: '197710'
requisite: Постановление Правительства Республики Казахстан от 14 июня 2024 года № 473
title:
  rus: Об определении органа, уполномоченного на выдачу разрешений второй категории, и государственных органов, которые осуществляют согласование выдачи разрешений второй категории на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации лома и отходов цветных и чёрных металлов
  kaz: Түсті және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, қайта өңдеу және өткізу жөніндегі қызметті жүзеге асыруға арналған екінші санаттағы рұқсаттарды беруге уәкілетті органды және екінші санаттағы рұқсаттардың берілуін келісуді жүзеге асыратын мемлекеттік органдарды айқындау туралы

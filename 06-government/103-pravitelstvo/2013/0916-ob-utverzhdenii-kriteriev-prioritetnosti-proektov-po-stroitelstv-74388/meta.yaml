title:
  rus: Об утверждении критериев приоритетности проектов по строительству и реконструкции автомобильных дорог общего пользования международного и республиканского значения и строительству, реконструкции, а также капитальному и среднему ремонту автомобильных дорог областного и районного значения
  kaz: Жалпыға ортақ пайдаланылатын халықаралық және республикалық маңызы бар автомобиль жолдарын салу мен реконструкциялау жөніндегі және облыстық және аудандық маңызы бар автомобиль жолдарын салу, реконструкциялау, сондай-ақ күрделі және орташа жөндеу жөніндегі жобалардың басымдығы критерийлерін бекіту туралы

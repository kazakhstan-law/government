title:
  rus: Об утверждении стандарта государственной услуги "Проведение квалификационного экзамена и выдача лицензии, переоформление, выдача дубликатов лицензии на право занятия деятельностью частного судебного исполнителя"
  kaz: '"Жеке сот орындаушыcы қызметiмен айналысу құқығына біліктілік емтиханын өткізу және лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" мемлекеттiк көрсетілетін қызмет стандартын бекіту туралы'

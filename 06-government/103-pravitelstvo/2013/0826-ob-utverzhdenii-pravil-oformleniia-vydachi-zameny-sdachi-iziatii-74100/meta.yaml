  kaz: Қазақстан Республикасы азаматының паспортын, Қазақстан Республикасы азаматының жеке куәлігін, шетелдіктің Қазақстан Республикасында тұруына ықтиярхатты, азаматтығы жоқ адамның куәлігін, босқын куәлігін және жол жүру құжатын ресімдеу, беру, ауыстыру, тапсыру, алып қою және жою қағидаларын бекіту туралы

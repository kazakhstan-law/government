requisite: Постановление Правительства Республики Казахстан от 26 августа 2013 года № 852. Утратил силу постановлением Правительства Республики Казахстан от 1 сентября 2023 года № 758 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оформления, выдачи, замены, сдачи, изъятия и уничтожения паспорта гражданина Республики Казахстан, удостоверения личности гражданина Республики Казахстан, вида на жительство иностранца в Республике Казахстан, удостоверения лица без гражданства, удостоверения беженца и проездного документа
  kaz: Қазақстан Республикасы азаматының паспортын, Қазақстан Республикасы азаматының жеке куәлігін, шетелдіктің Қазақстан Республикасында тұруына ықтиярхатты, азаматтығы жоқ адамның куәлігін, босқын куәлігін және жол жүру құжатын ресімдеу, беру, ауыстыру, тапсыру, алып қою және жою қағидаларын бекіту туралы

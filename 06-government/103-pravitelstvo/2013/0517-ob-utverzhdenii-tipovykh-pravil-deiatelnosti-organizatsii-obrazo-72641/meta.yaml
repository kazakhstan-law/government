title:
  rus: Об утверждении Типовых правил деятельности организаций образования соответствующих типов, в том числе Типовых правил организаций образования, реализующих дополнительные образовательные программы для детей
  kaz: Тиісті үлгідегі білім беру ұйымдары қызметінің үлгілік қағидаларын, оның ішінде балаларға арналған қосымша білім беру бағдарламаларын іске асыратын білім беру ұйымдары қызметінің үлгілік қағидаларын бекіту туралы

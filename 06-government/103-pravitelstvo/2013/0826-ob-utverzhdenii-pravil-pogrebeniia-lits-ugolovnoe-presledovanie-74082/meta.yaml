act_code: '74082'
requisite: Постановление Правительства Республики Казахстан от 26 августа 2013 года № 858
title:
  rus: Об утверждении Правил погребения лиц, уголовное преследование в отношении которых в связи с их участием в террористической деятельности прекращено из-за их смерти, наступившей в результате совершения ими акта терроризма, а также при пресечении совершаемого ими акта терроризма
  kaz: Терроризм актісін жасауы салдарынан, сондай-ақ олар жасаған терроризм актісінің жолын кесу кезінде өлгендіктен, террористік іс-әрекетке қатысуына байланысты өздеріне қатысты кылмыстық қуғындау тоқтатылған адамдарды жерлеу қағидаларын бекіту туралы

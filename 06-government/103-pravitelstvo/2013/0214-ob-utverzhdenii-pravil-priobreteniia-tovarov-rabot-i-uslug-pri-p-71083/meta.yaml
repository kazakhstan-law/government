  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 14 февраля 2013 года № 133 "Об утверждении Правил приобретения товаров, работ и услуг при проведении операций по недропользованию посредством государственной информационной системы "Реестр товаров, работ и услуг, используемых при проведении операций по недропользованию, и их производителей" и от 14 февраля 2013 года № 134 "Об утверждении Правил приобретения товаров, работ и услуг при проведении операций по недропользованию"
    kaz: Қазақстан Республикасы Үкіметінің "Жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстар мен көрсетілетін қызметтердің және оларды өндірушілердің тізілімі" мемлекеттік ақпараттық жүйесі арқылы жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы" 2013 жылғы 14 ақпандағы № 133 және "Жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы" 2013 жылғы 14 ақпандағы № 134 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/80439/rus

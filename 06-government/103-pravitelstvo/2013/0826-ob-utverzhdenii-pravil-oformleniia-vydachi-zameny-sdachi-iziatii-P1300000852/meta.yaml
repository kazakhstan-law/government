  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 26 августа 2013 года № 852 «Об утверждении Правил оформления, выдачи, замены, сдачи, изъятия и уничтожения паспорта гражданина Республики Казахстан, удостоверения личности гражданина Республики Казахстан, вида на жительство иностранца в Республике Казахстан, удостоверения лица без гражданства и удостоверения беженца»
    kaz: «Қазақстан Республикасы азаматының паспортын, Қазақстан Республикасы азаматының жеке куәлігін, шетелдіктің Қазақстан Республикасында тұруына ықтиярхатты, азаматтығы жоқ адамның куәлігі мен босқын куәлігін ресімдеу, беру, ауыстыру, тапсыру, алып қою және жою қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2013 жылғы 26 тамыздағы № 852 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/140181/rus

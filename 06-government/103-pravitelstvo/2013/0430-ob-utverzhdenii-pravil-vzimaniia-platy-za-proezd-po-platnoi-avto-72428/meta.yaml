  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 30 апреля 2013 года № 427 "Об утверждении Правил взимания в пользу концессионера или юридического лица по управлению автомобильными дорогами платы за проезд по автомобильным дорогам, переданным для организации платного проезда концессионеру или юридическому лицу по управлению автомобильными дорогами"
    kaz: '"Ақылы жүруді ұйымдастыру үшін концессионерге немесе автомобиль жолдарын басқару жөніндегі заңды тұлғаға берілген автомобиль жолдары бойынша жүргені үшін концессионердің немесе автомобиль жолдарын басқару жөніндегі заңды тұлғаның пайдасына ақы алу қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2013 жылғы 30 сәуірдегі № 427 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/74016/rus

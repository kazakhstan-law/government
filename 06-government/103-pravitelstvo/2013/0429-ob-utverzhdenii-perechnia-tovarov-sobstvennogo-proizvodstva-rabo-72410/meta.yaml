act_code: '72410'
requisite: Постановление Правительства Республики Казахстан от 29 апреля 2013 года № 404
title:
  rus: Об утверждении перечня товаров собственного производства (работ, услуг) от видов деятельности, соответствующих целям создания специальной экономической зоны "Парк инновационных технологий", для организаций, осуществляющих деятельность на территории специальной экономической зоны "Парк инновационных технологий" и зарегистрированных по месту нахождения в налоговом органе
  kaz: '"Инновациялық технологиялар паркі" арнайы экономикалық аймағының аумағында қызметін жүзеге асыратын және орналасқан жері бойынша салық органында тіркелген ұйымдар үшін "Инновациялық технологиялар паркі" арнайы экономикалық аймағын құру мақсаттарына сәйкес келетін қызмет түрлерiнен меншікті өндіріс тауарларының (жұмыстардың, көрсетілетін қызметтердiң) тiзбесiн бекiту туралы'

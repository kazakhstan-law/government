act_code: '73574'
requisite: Постановление Правительства Республики Казахстан от 22 июля 2013 года № 733. Утратило силу постановлением Правительства Республики Казахстан от 23 июня 2014 года № 693
title:
  rus: Об определении юридического лица, которому банк, являющийся национальным институтом развития, контрольный пакет акций которого принадлежит национальному управляющему холдингу, уступает права требования по кредиту (займу), и доходы которого от уступки права требования, полученные в связи с выкупом у банка, являющегося национальным институтом развития, контрольный пакет акций которого принадлежит национальному управляющему холдингу, прав требований по кредитам (займам), подлежат исключению из совокупного годового дохода
  kaz: Акцияларының бақылау пакеті ұлттық басқарушы холдингке тиесілі ұлттық даму институты болып табылатын банк кредит (қарыз) бойынша талап ету құқықтарын басқаға беретін және талап ету құқығын басқаға беруден түсетін, акцияларының бақылау пакеті ұлттық басқарушы холдингке тиесілі ұлттық даму институты болып табылатын банктен кредиттер (қарыздар) бойынша талап ету құқықтарын сатып алуға байланысты алынған табыстары жиынтық жылдық табысынан алып тасталуға жататын заңды тұлғаны айқындау туралы

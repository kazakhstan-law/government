  requisite: Постановление Правительства Республики Казахстан от 23 апреля 2015 года № 258
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 17 сентября 2013 года № 977 "Об утверждении Правил открытия (закрытия), функционирования (эксплуатации), категорирования, классификации, обустройства, а также требований по техническому оснащению и организации работы пунктов пропуска через Государственную границу Республики Казахстан"
    kaz: '"Қазақстан Республикасының Мемлекеттік шекарасы арқылы өткізу пункттерін ашу (жабу), олардың жұмыс істеуі (пайдаланылуы), оларды санаттарға бөлу, жіктеу, жайластыру қағидаларын, сондай-ақ техникалық жарақтандыру және жұмысын ұйымдастыру жөніндегі талаптарды бекіту туралы" Қазақстан Республикасы Үкіметінің 2013 жылғы 17 қыркүйектегі № 977 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/89081/rus

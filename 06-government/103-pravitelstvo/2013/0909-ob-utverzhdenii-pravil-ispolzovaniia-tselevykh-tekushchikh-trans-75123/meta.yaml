act_code: '75123'
requisite: Постановление Правительства Республики Казахстан от 9 сентября 2013 года № 943
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областными бюджетами, бюджетами городов Астаны и Алматы на 2013 год на удешевление сельскохозяйственным товаропроизводителям стоимости биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің ауыл шаруашылығы тауарын өндірушілерге өсімдіктерді қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған биоагенттердің (энтомофагтардың) және биопрепараттардың құнын арзандатуға берілетін 2013 жылға арналған ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

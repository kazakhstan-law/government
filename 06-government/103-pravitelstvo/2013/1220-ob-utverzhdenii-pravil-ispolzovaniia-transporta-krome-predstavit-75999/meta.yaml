  code: '150635'
  requisite: Постановление Правительства Республики Казахстан от 25 декабря 2020 года № 893
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 20 декабря 2013 года № 1357 «Об утверждении Правил использования транспорта (кроме представительств иностранных государств и международных организаций, обладающих дипломатическим иммунитетом) для прибытия в зону чрезвычайной ситуации социального характера, а также доставления лиц, нуждающихся в экстренной медицинской помощи, в лечебные учреждения, если промедление может создать реальную угрозу жизни или здоровью людей, с возмещением материального ущерба собственникам в случае его причинения»
    kaz: «Әлеуметтік сипаттағы төтенше жағдай аймағына бару үшін, сондай-ақ, егер кідірту адамдардың өміріне немесе денсаулығына нақты қатер төндіруі мүмкін болса, шұғыл медициналық көмекке мұқтаж адамдарды емдеу мекемелеріне жеткізу үшін, меншік иелеріне материалдық залал келтірілген жағдайда оны өтей отырып, көлікті (дипломатиялық иммунитеті бар шет мемлекеттер мен халықаралық ұйымдардың өкілдіктерінен басқа) пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2013 жылғы 20 желтоқсандағы № 1357 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/150635/rus

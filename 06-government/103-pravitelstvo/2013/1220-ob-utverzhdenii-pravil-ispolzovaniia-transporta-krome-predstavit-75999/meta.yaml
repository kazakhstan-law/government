act_code: '75999'
requisite: Постановление Правительства Республики Казахстан от 20 декабря 2013 года № 1357
title:
  rus: Об утверждении Правил использования транспорта (кроме представительств иностранных государств и международных организаций, обладающих дипломатическим иммунитетом) для прибытия в зону чрезвычайной ситуации социального характера, а также доставления лиц, нуждающихся в экстренной медицинской помощи, в медицинскую организацию, если промедление может создать реальную угрозу жизни или здоровью людей, с возмещением материального ущерба собственникам в случае его причинения
  kaz: Әлеуметтік сипаттағы төтенше жағдай аймағына бару үшін, сондай-ақ, егер кідірту адамдардың өміріне немесе денсаулығына нақты қатер төндіруі мүмкін болса, шұғыл медициналық көмекке мұқтаж адамдарды медициналық ұйымға жеткізу үшін меншік иелеріне материалдық залал келтірілген жағдайда оны өтей отырып, көлікті (дипломатиялық иммунитеті бар шет мемлекеттер мен халықаралық ұйымдардың өкілдіктерінен басқа) пайдалану қағидаларын бекіту туралы

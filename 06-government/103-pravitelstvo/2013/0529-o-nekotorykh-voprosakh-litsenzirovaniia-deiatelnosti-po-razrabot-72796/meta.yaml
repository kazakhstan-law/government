act_code: '72796'
requisite: Постановление Правительства Республики Казахстан от 29 мая 2013 года № 531.  Утратило силу постановлением Правительства Республики Казахстан от 28 декабря 2016 года № 868
title:
  rus: О некоторых вопросах лицензирования деятельности по разработке, производству, ремонту, приобретению и реализации боеприпасов, вооружения и военной техники, запасных частей, комплектующих изделий и приборов к ним, а также специальных материалов и оборудования для их производства, включая монтаж, наладку, модернизацию, установку, использование, хранение, ремонт и сервисное обслуживание
  kaz: Монтаждауды, реттеудi, жаңғыртуды, орнатуды, пайдалануды, сақтауды, жөндеудi және сервистiк қызмет көрсетудi қоса алғанда, оқ-дәрiлердi, қару-жарақ пен әскери техниканы, олардың қосалқы бөлшектерiн, жиынтықтаушы бұйымдары мен аспаптарын, сондай-ақ оларды өндiруге арналған арнайы материалдар мен жабдықтарды әзiрлеу, өндiру, жөндеу, алу және өткiзу жөніндегі қызметті лицензиялаудың кейбір мәселелері туралы

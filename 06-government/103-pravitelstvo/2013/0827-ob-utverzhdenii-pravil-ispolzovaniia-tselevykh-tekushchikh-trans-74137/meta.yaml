act_code: '74137'
requisite: Постановление Правительства Республики Казахстан от 27 августа 2013 года № 872
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областными бюджетами, бюджетами городов Астаны и Алматы на 2013 год на повышение доступности товаров, работ и услуг для субъектов агропромышленного комплекса
  kaz: Агроөнеркәсіптік кешен субъектілері үшін тауарлардың, жұмыстардың және көрсетілетін қызметтердің қолжетімділігін арттыруға берілетін 2013 жылға арналған ағымдағы нысаналы трансферттерді облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің пайдалану қағидаларын бекіту туралы

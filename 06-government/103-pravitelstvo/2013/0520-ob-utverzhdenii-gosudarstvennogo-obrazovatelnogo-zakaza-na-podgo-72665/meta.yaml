  requisite: Постановление Правительства Республики Казахстан от 25 ноября 2013 года № 1256
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 20 мая 2013 года № 500 "Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку специалистов для Вооруженных сил, других войск и воинских формирований, а также специальных государственных органов), на 2013-2014 учебный год"
    kaz: '"Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қарулы Күштер, басқа да әскерлер мен әскери құралымдар, сондай-ақ арнаулы мемлекеттік органдар үшін мамандар даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2013 - 2014 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы" Қазақстан Республикасы Үкіметінің 2013 жылғы 20 мамырдағы № 500 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/75471/rus

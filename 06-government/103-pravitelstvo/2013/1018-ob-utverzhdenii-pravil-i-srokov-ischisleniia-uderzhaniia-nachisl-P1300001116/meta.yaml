title:
  rus: Об утверждении Правил и сроков исчисления, удержания (начисления) и перечисления обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов в единый накопительный пенсионный фонд и взысканий по ним
  kaz: Міндетті зейнетақы жарналарын, міндетті кәсіптік зейнетақы жарналарын есептеу, ұстап қалу (есебіне жазу) және бірыңғай жинақтаушы зейнетақы қорына аудару және олар бойынша өндіріп алу қағидалары мен мерзімдерін бекіту туралы

  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 18 октября 2013 года № 1116 «Об утверждении Правил и сроков исчисления, удержания (начисления) и перечисления обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов в единый накопительный пенсионный фонд и взысканий по ним»
    kaz: «Міндетті зейнетақы жарналарын, міндетті кәсіптік зейнетақы жарналарын есептеу, ұстап қалу (есебіне жазу) және бірыңғай жинақтаушы зейнетақы қорына аудару және олар бойынша өндіріп алу қағидалары мен мерзімдерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2013 жылғы 18 қазандағы № 1116 қаулысына өзгерістер мен толықтыру енгізу туралы

requisite: Постановление Правительства Республики Казахстан от 29 января 2013 года № 57. Утратило силу постановлением Правительства Республики Казахстан от 10 августа 2015 года № 634
title:
  rus: О некоторых вопросах лицензирования деятельности по производству этилового спирта, производству алкогольной продукции, хранению, оптовой и (или) розничной реализации алкогольной продукции, за исключением деятельности по хранению, оптовой и (или) розничной реализации алкогольной продукции на территории ее производства
  kaz: Алкоголь өнімдерін өндіру аумағында оны сақтау, көтерме және (немесе) бөлшек саудада сату жөніндегі қызметті қоспағанда, этил спиртін өндіру, алкоголь өнімін өндіру, алкоголь өнімін сақтау, көтерме және (немесе) бөлшек саудада сату жөніндегі қызметті лицензиялаудың кейбір мәселелері туралы

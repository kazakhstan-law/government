  kaz: Өткізу пункттерін ашу (жабу), олардың жұмыс істеуі (пайдаланылуы), оларды санаттарға бөлу, жіктеу, жайластыру қағидаларын, сондай-ақ техникалық жарақтандыру, жаңғырту және олардың жұмысын ұйымдастыру, сервистік инфрақұрылым жөніндегі талаптарды бекіту туралы

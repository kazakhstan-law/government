act_code: '74615'
requisite: Постановление Правительства Республики Казахстан от 5 октября 2013 года № 1058. Утратил силу постановлением Правительства Республики Казахстан от 30 июня 2023 года № 528
title:
  rus: Об утверждении Правил перечисления обязательных пенсионных взносов, удержанных и не перечисленных агентами с доходов бывших работников, местонахождение которых не известно, в связи с отсутствием по состоянию на 1 января 2005 года социального индивидуального кода и (или) регистрационного номера налогоплательщика, и (или) договора о пенсионном обеспечении с накопительными пенсионными фондами
  kaz: 2005 жылғы 1 қаңтардағы жағдай бойынша әлеуметтік жеке кодының және (немесе) салық төлеушінің тіркеу нөмірінің және (немесе) жинақтаушы зейнетақы қорларымен жасалған зейнетақымен қамсыздандыру туралы шартының болмауына байланысты тұрған жері белгісіз бұрынғы қызметкерлердің табыстарынан агенттер ұстап қалған және аудармаған міндетті зейнетақы жарналарын аудару қағидаларын бекіту туралы

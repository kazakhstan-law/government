title:
  rus: Об утверждении стандарта государственной услуги "Апостилирование архивных справок и копий архивных документов, исходящих из специального государственного архива Комитета национальной безопасности Республики Казахстан"
  kaz: '"Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің арнайы мемлекеттік мұрағатынан шығатын мұрағаттық анықтамаларға және мұрағаттық құжаттардың көшірмелеріне апостиль қою" мемлекеттік қызмет көрсету стандартын бекіту туралы'

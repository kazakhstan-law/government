  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 4 июля 2013 года № 684 «Об утверждении образцов паспорта гражданина Республики Казахстан, удостоверения личности гражданина Республики Казахстан, вида на жительство иностранца в Республике Казахстан, удостоверения лица без гражданства, удостоверения беженца, проездного документа и требований к их защите»
    kaz: «Қазақстан Республикасының азаматы паспортының, Қазақстан Республикасының азаматы жеке куәлігінің, шетелдіктің Қазақстан Республикасында тұруына ықтиярхаттың, азаматтығы жоқ адам куәлігінің, босқын куәлігінің, жол жүру құжатының үлгілерін және оларды қорғауға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Үкіметінің 2013 жылғы 4 шілдедегі № 684 қаулысына өзгерістер енгізу туралы

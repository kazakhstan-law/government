act_code: '71812'
requisite: Постановление Правительства Республики Казахстан от 29 марта 2013 года № 298
title:
  rus: Об установлении квот на привлечение иностранной рабочей силы по приоритетному проекту "Реконструкция и модернизация Атырауского НПЗ" на 2013 год и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы для реализации приоритетного проекта "Реконструкция и модернизация Атырауского НПЗ"
  kaz: '"Атырау МӨЗ-ін реконструкциялау және жаңғырту" басым жобасы бойынша шетелдік жұмыс күшін тартуға 2013 жылға арналған квоталар белгілеу және "Атырау МӨЗ-ін реконструкциялау және жаңғырту" басым жобасын іске асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру шарттарын бекіту туралы'

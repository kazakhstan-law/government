  code: '135866'
  requisite: Постановление Правительства Республики Казахстан от 6 ноября 2019 года № 832
  title:
    rus: Об утверждении Правил передачи, реализации, ликвидации посредством уничтожения, утилизации, захоронения и переработки неиспользуемого имущества, а также предоставления в имущественный наем (аренду) неиспользуемых оборонных объектов
    kaz: Пайдаланылмайтын мүлікті беру, өткізу, құртып жіберу, кәдеге жарату, көму арқылы жою және қайта өңдеу, сондай-ақ пайдаланылмайтын қорғаныс объектілерін мүліктік жалдауға (жалға) беру қағидаларын бекіту туралы

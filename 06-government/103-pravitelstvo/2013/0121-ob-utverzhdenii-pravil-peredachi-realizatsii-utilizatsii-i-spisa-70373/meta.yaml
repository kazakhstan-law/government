act_code: '70373'
requisite: Постановление Правительства Республики Казахстан от 21 января 2013 года № 16
title:
  rus: Об утверждении Правил передачи, реализации, утилизации и списания имущества, а также предоставления в имущественный наем (аренду) недвижимого имущества специальных государственных органов Республики Казахстан
  kaz: Қазақстан Республикасы арнаулы мемлекеттік органдарының мүліктерін беру, өткізу, кәдеге жарату және есептен шығару, сондай-ақ жылжымайтын мүлкін мүліктік жалдауға (жалға алуға) беру қағидаларын бекіту туралы

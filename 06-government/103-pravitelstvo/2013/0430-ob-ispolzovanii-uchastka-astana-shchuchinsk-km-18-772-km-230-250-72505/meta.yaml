    kaz: '"І-а санатты "Астана-Петропавл" жалпы пайдаланымдағы республикалық маңызы бар автомобиль жолының "Астана-Щучье" 18+772 км - 230+250 км учаскесін ақылы негізде пайдалану туралы" Қазақстан Республикасы Үкіметінің 2013 жылғы 30 сәуірдегі № 429 қаулысына өзгерістер мен толықтыру енгізу туралы'

  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 21 июня 2004 года № 683 "Об утверждении Правил исчисления и перечисления социальных отчислений" и от 18 октября 2013 года № 1116 "Об утверждении Правил и сроков исчисления, удержания (начисления) и перечисления обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов в единый накопительный пенсионный фонд"
    kaz: Қазақстан Республикасы Үкіметінің "Әлеуметтік аударымдарды есептеу және аудару ережесiн бекiту туралы" 2004 жылғы 21 маусымдағы № 683 және "Міндетті зейнетақы жарналарын, міндетті кәсіптік зейнетақы жарналарын есептеу, ұстап қалу (есебіне жазу) және бірыңғай жинақтаушы зейнетақы қорына аудару қағидалары мен мерзімдерін бекіту туралы" 2013 жылғы 18 қазандағы № 1116 қаулыларына өзгерістер енгізу туралы

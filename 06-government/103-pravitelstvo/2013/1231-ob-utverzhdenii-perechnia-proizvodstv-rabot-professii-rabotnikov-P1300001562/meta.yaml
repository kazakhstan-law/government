  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 31 декабря 2013 года № 1562 «Об утверждении перечня производств, работ, профессий работников, занятых на работах с вредными условиями труда, в пользу которых агентами по уплате обязательных профессиональных пенсионных взносов за счет собственных средств осуществляются обязательные профессиональные пенсионные взносы»
    kaz: «Өндірістердің, жұмыстардың, пайдасына міндетті кәсіптік зейнетақы жарналарын төлеу жөніндегі агенттер меншікті қаражаты есебінен міндетті кәсіптік зейнетақы жарналарын жүзеге асыратын, еңбек жағдайлары зиянды жұмыстармен айналысатын жұмыскерлер кәсіптерінің тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2013 жылғы 31 желтоқсандағы № 1562 қаулысына өзгеріс енгізу туралы

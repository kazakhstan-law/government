caused_by:
  code: '84766'
  requisite: Постановление Правительства Республики Казахстан от 28 ноября 2014 года № 1253
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 12 октября 2012 года № 1301 "Об утверждении Правил выплаты единовременных компенсаций в случае гибели (смерти) сотрудника специального государственного органа, установления инвалидности или получения им увечья" и от 27 августа 2013 года № 868 "Об утверждении Правил выплаты единовременной компенсации в случае гибели (смерти) военнослужащего в период прохождения им воинской службы или военнообязанного, призванного на воинские сборы, при установлении ему инвалидности или в случае получения им увечья, связанного с исполнением обязанностей воинской службы"
    kaz: Қазақстан Республикасы Үкіметінің "Арнаулы мемлекеттік органның қызметкері қаза тапқан (қайтыс болған), оған мүгедектік белгіленген немесе мертіккен жағдайда берілетін біржолғы өтемақыларды төлеу қағидаларын бекіту туралы" 2012 жылғы 12 қазандағы № 1301 және "Әскери қызметін өткеру кезеңінде әскери қызметші немесе әскери жиындарға шақырылған әскери міндетті қаза тапқан (қайтыс болған) жағдайда, оған мүгедектік белгіленген кезде немесе ол әскери қызмет міндеттерін орындауға байланысты мертіккен жағдайда біржолғы өтемақы төлеу қағидаларын бекіту туралы" 2013 жылғы 27 тамыздағы № 868 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/84766/rus

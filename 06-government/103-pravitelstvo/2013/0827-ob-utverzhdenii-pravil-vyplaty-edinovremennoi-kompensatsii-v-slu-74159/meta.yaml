  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 27 августа 2013 года № 868 «Об утверждении Правил выплаты единовременной компенсации в случае гибели (смерти) военнослужащего в период прохождения им воинской службы или военнообязанного, призванного на воинские сборы, при установлении ему инвалидности или в случае получения им увечья, связанного с исполнением обязанностей воинской службы»
    kaz: «Әскери қызметін өткеру кезеңінде әскери қызметші немесе әскери жиындарға шақырылған әскери міндетті қаза тапқан (қайтыс болған) жағдайда, оған мүгедектік белгіленген кезде немесе ол әскери қызмет міндеттерін орындауға байланысты мертіккен жағдайда біржолғы өтемақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2013 жылғы 27 тамыздағы № 868 қаулысына өзгеріс енгізу туралы

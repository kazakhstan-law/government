act_code: '74159'
requisite: Постановление Правительства Республики Казахстан от 27 августа 2013 года № 868
title:
  rus: Об утверждении Правил выплаты единовременной компенсации в случае гибели (смерти) военнослужащего в период прохождения им воинской службы, военнослужащего, проходящего воинскую службу в резерве в периоды нахождения на занятиях или сборах по боевой подготовке, сборах при кризисных ситуациях, или военнообязанного, призванного на воинские сборы, при установлении ему инвалидности или в случае получения им увечья, связанного с исполнением обязанностей воинской службы
  kaz: Әскери қызметін өткеру кезеңінде әскери қызметші, жауынгерлік даярлық бойынша сабақтарда немесе жиындарда, дағдарыстық ахуалдар кезіндегі жиындарда болған кезеңдерде резервте әскери қызмет өткеріп жүрген әскери қызметші немесе әскери жиындарға шақырылған әскери міндетті қаза тапқан (қайтыс болған) жағдайда, оған мүгедектік белгіленген кезде немесе ол әскери қызмет міндеттерін орындауға байланысты мертіккен жағдайда біржолғы өтемақы төлеу қағидаларын бекіту туралы

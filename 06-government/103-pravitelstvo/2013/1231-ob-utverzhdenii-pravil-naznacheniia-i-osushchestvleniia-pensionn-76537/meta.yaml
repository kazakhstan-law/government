  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 31 декабря 2013 года № 1500 «Об утверждении Правил назначения и осуществления пенсионных выплат военнослужащим, сотрудникам специальных государственных и правоохранительных органов, государственной фельдъегерской службы, а также лицам, права которых иметь специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года»
    kaz: «Әскери қызметшiлерге, арнаулы мемлекеттік және құқық қорғау органдарының, мемлекеттік фельдъегерлік қызмет қызметкерлеріне, сондай-ақ арнаулы атақтар, сыныптық шендер алу және нысанды киiм киiп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдарға зейнетақы төлемдерiн тағайындау және жүзеге асыруқағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2013 жылғы 31 желтоқсандағы № 1500 қаулысына өзгерістер мен толықтырулар енгізу туралы

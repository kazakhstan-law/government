    rus: О внесении изменений в постановления Правительства Республики Казахстан от 8 ноября 2013 года № 1181 "Об утверждении форм, размеров, описания, конструкций и Правил установки пограничных знаков" и от 29 ноября 2013 года № 1275 "Об утверждении Правил выдачи пропусков на въезд и пребывание в пограничной полосе"

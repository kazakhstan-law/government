title:
  rus: Об утверждении Правил возмещения вреда физическим и юридическим лицам, причиненного при пресечении акта терроризма правомерными действиями должностных лиц государственных органов, осуществляющих противодействие терроризму
  kaz: Терроризмге қарсы іс-қимылды жүзеге асыратын мемлекеттік органдардың лауазымды адамдарының құқыққа сыйымды әрекеттерімен терроризм актісінің жолын кесу кезінде жеке және заңды тұлғаларға келтірілген зиянды өтеу қағидаларын бекіту туралы

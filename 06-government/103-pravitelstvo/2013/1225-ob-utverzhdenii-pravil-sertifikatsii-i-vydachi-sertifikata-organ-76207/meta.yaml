act_code: '76207'
requisite: Постановление Правительства Республики Казахстан от 25 декабря 2013 года № 1397. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2016 года № 901.
title:
  rus: Об утверждении Правил сертификации и выдачи сертификата органа обслуживания воздушного движения и (или) службы эксплуатации радиотехнического оборудования и связи аэронавигационной организации, а также сертификационных требований, предъявляемых к органам обслуживания воздушного движения и (или) службам эксплуатации радиотехнического оборудования и связи аэронавигационной организации
  kaz: Аэронавигациялық ұйымның әуе қозғалысына қызмет көрсету органын және (немесе) радиотехникалық жабдықты пайдалану және байланыс қызметін сертификаттау және сертификат беру қағидаларын, сондай-ақ аэронавигациялық ұйымның әуе қозғалысына қызмет көрсету органдарына және (немесе) радиотехникалық жабдықты пайдалану және байланыс қызметтеріне қойылатын сертификаттық талаптарды бекіту туралы

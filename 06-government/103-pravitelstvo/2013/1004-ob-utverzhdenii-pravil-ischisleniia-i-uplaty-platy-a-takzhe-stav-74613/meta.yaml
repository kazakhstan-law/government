act_code: '74613'
requisite: Постановление Правительства Республики Казахстан от 4 октября 2013 года № 1055
title:
  rus: Об утверждении Правил исчисления и уплаты платы, а также ставок за размещение наружной (визуальной) рекламы на открытом пространстве за пределами помещений в городах районного значения, селах, поселках, в полосе отвода автомобильных дорог общего пользования, проходящих через территории городов районного значения, сел, поселков, сельских округов, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования
  kaz: Сыртқы (көрнекі) жарнаманы аудандық маңызы бар қалалардағы, ауылдардағы, кенттердегі үй-жайлардың шегінен тыс ашық кеңістікте, аудандық маңызы бар қалалар, ауылдар, кенттер, ауылдық округтер аумағы арқылы өтетін жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлiнген белдеуiнде, елді мекендерден тыс үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлiнген белдеуiнен тыс жерлерде орналастырғаны үшін төлемақыны есептеу және төлеу қағидаларын, сондай-ақ оның мөлшерлемелерін бекіту туралы

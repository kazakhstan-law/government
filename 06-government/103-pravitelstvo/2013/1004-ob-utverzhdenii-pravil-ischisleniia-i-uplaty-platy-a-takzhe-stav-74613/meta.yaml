caused_by:
  code: '104767'
  requisite: Постановление Правительства Республики Казахстан от 22 июля 2016 года № 419
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 4 октября 2013 года № 1055 «Об утверждении Правил исчисления и уплаты платы, а также ставок за размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования республиканского и областного значения в пределах территории городов районного значения, сел, поселков, а также на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования районного значения, на открытом пространстве за пределами помещений в городах районного значения, селах, поселках и на транспортных средствах, зарегистрированных в районе»
    kaz: «Сыртқы (көрнекі) жарнаманы аудандық маңызы бар қалалар, ауылдар, кенттер аумағы шегінде республикалық және облыстық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлiнген белдеуiндегі жарнаманы тұрақты орналастыру объектілерінде, сондай-ақ аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуіндегі жарнаманы тұрақты орналастыру объектілерінде, аудандық маңызы бар қалалардағы, ауылдардағы, кенттердегі үй-жайлардың шегінен тыс ашық кеңістікте және ауданда тіркелген көлік құралдарында орналастырғаны үшін төлемақыны есептеу және төлеу қағидаларын, сондай-ақ мөлшерлемелерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2013 жылғы 4 қазандағы № 1055 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/104767/rus

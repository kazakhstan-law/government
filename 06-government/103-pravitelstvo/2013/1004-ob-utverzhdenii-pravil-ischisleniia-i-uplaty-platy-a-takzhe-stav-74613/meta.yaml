  code: '79903'
  requisite: Постановление Правительства Республики Казахстан от 22 мая 2014 года № 532
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 4 октября 2013 года № 1055 "Об утверждении Правил взимания и ставок платы за размещение наружной (визуальной) рекламы на объектах стационарного размещения рекламы в полосе отвода автомобильных дорог общего пользования районного значения, на открытом пространстве за пределами помещений в городах районного значения, селах, поселках и на транспортных средствах, зарегистрированных в районе"
    kaz: '"Сыртқы (көрнекі) жарнаманы аудандық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуіндегі жарнаманы тұрақты орналастыру объектілерінде, аудандық маңызы бар қалалардағы, ауылдардағы, кенттердегі үй-жайлардың шегінен тыс ашық кеңістікте және ауданда тіркелген көлік құралдарында орналастырғаны үшін төлемақы алу қағидаларын және мөлшерлемелерін бекіту туралы" Қазақстан Республикасы Үкіметінің 2013 жылғы 4 қазандағы № 1055 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/79903/rus

title:
  rus: Об утверждении Списка сезонных отраслей промышленности, работа в которых в течение полного сезона засчитывается в стаж для назначения пенсионных выплат по возрасту за год работы, и Перечня работ в организациях, осуществляющих судебно-медицинскую экспертизу и патолого-анатомическую диагностику, для льготного исчисления трудового стажа для назначения пенсионных выплат по возрасту в полуторном размере
  kaz: Толық маусым ішіндегі жұмыс жасына байланысты зейнетақы төлемдерін тағайындау үшін бір жылғы жұмыс өтіліне есепке алынатын өнеркәсiптiң маусымдық салаларының тiзiмiн және Жасына байланысты зейнетақы төлемдерін бiр жарым есе мөлшерде тағайындауға еңбек өтілін жеңілдікпен есептеу үшін сот-медициналық сараптаманы және патологиялық-анатомиялық диагностиканы жүзеге асыратын ұйымдардағы жұмыстар тiзбесiн бекiту туралы

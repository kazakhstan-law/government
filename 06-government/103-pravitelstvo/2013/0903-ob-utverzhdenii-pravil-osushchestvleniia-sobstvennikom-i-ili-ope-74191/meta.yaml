  title:
    rus: О внесении дополнений в постановления Правительства Республики Казахстан от 3 сентября 2013 года № 909 «Об утверждении Правил осуществления собственником и (или) оператором, а также третьим лицом мер по защите персональных данных» и от 12 июля 2019 года № 501 «О мерах по реализации Указа Президента Республики Казахстан от 17 июня 2019 года № 24 «О мерах по дальнейшему совершенствованию системы государственного управления Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Меншік иесінің және (немесе) оператордың, сондай-ақ үшінші тұлғаның дербес деректерді қорғау жөніндегі шараларды жүзеге асыру қағидаларын бекіту туралы» 2013 жылғы 3 қыркүйектегі № 909 және «Қазақстан Республикасының мемлекеттік басқару жүйесін одан әрі жетілдіру жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2019 жылғы 17 маусымдағы № 24 Жарлығын іске асыру жөніндегі шаралар туралы» 2019 жылғы 12 шілдедегі № 501 қаулыларына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/166618/rus

act_code: '73865'
requisite: Постановление Правительства Республики Казахстан от 6 августа 2013 года № 797. Утратило силу постановлением Правительства Республики Казахстан от 10 августа 2015 года № 624
title:
  rus: Об утверждении Правил взаимодействия Единого контакт-центра по вопросам оказания государственных услуг с центральными государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, районов, городов областного значения, акимами районов в городе, городов районного значения, поселков, сел, сельских округов, а также услугодателями
  kaz: Мемлекеттік қызметтер көрсету мәселелері жөніндегі бірыңғай байланыс орталығының орталық мемлекеттік органдармен, облыстардың, республикалық маңызы бар қалалардың, астананың, аудандардың, облыстық маңызы бар қалалардың жергілікті атқарушы органдарымен, қаладағы аудандардың, аудандық маңызы бар қалалардың, кенттердің, ауылдардың, ауылдық округтердің әкімдерімен, сондай-ақ көрсетілетін қызметті берушілермен өзара іс-қимыл қағидаларын бекіту туралы

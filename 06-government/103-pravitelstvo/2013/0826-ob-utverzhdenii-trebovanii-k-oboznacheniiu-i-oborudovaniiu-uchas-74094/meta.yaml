act_code: '74094'
requisite: Постановление Правительства Республики Казахстан от 26 августа 2013 года № 843
title:
  rus: Об утверждении требований к обозначению и оборудованию участков путей международного железнодорожного и автомобильного сообщения от Государственной границы Республики Казахстан до пунктов пропуска, правил следования по ним, а также требований к оборудованию казахстанской части периметра международного центра приграничного сотрудничества, расположенного на Государственной границе Республики Казахстан
  kaz: Халықаралық теміржол және автомобиль қатынасы жолдарының Қазақстан Республикасының Мемлекеттік шекарасынан өткізу пункттеріне дейінгі учаскелерін белгілеуге және жабдықтауға қойылатын талаптарды және олар бойынша жүру қағидаларын, сондай-ақ Қазақстан Республикасының Мемлекеттік шекарасында орналасқан халықаралық шекара маңы ынтымақтастығы орталығы периметрінің қазақстандық бөлігін жабдықтауға қойылатын талаптарды бекіту туралы

title:
  rus: Об утверждении Правил приобретения товаров, работ и услуг при проведении операций по недропользованию посредством государственной информационной системы "Реестр товаров, работ и услуг, используемых при проведении операций по недропользованию, и их производителей"
  kaz: '"Жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстар мен көрсетілетін қызметтердің және оларды өндірушілердің тізілімі" мемлекеттік ақпараттық жүйесі арқылы жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы'

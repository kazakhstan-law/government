act_code: '71850'
requisite: Постановление Правительства Республики Казахстан от 19 марта 2013 года № 263
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2013 года областными бюджетами, бюджетами городов Астаны и Алматы на материально-техническое оснащение государственных ветеринарных организаций
  kaz: Облыстық бюджеттердiң, Астана және Алматы қалалары бюджеттерiнiң 2013 жылғы республикалық бюджеттен мемлекеттік ветеринариялық ұйымдарды материалдық-техникалық жарақтандыруға берілетін ағымдағы нысаналы трансферттердi пайдалану қағидаларын бекiту туралы

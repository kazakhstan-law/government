  code: '76366'
  requisite: Постановление Правительства Республики Казахстан от 13 декабря 2013 года № 1335
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 7 декабря 2012 года № 1563 "Об утверждении натуральных норм обеспечения государственных ветеринарных организаций, созданных местными исполнительными органами" и от 19 марта 2013 года № 263 "Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2013 года областными бюджетами, бюджетами городов Астаны и Алматы на материально-техническое оснащение государственных ветеринарных организаций"
    kaz: Қазақстан Республикасы Үкіметінің "Жергілікті атқарушы органдар құрған мемлекеттік ветеринариялық ұйымдарды қамтамасыз етудің заттай нормаларын бекіту туралы" 2012 жылғы 7 желтоқсандағы № 1563 және "Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2013 жылғы республикалық бюджеттен мемлекеттік ветеринариялық ұйымдарды материалдық-техникалық жарақтандыруға берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы" 2013 жылғы 19 наурыздағы № 263 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/76366/rus

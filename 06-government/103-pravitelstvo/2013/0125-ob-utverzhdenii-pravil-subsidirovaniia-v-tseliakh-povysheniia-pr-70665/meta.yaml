  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 25 января 2013 года № 35 "Об утверждении Правил субсидирования на поддержку племенного животноводства" и от 25 января 2013 года № 36 "Об утверждении Правил субсидирования в целях повышения продуктивности и качества продукции животноводства"
    kaz: Қазақстан Республикасы Үкіметінің "Асыл тұқымды мал шаруашылығын қолдауға арналған субсидиялау қағидаларын бекіту туралы" 2013 жылғы 25 қаңтардағы № 35 және "Мал шаруашылығы өнімінің өнімділігі мен сапасын арттыру мақсатында субсидиялау қағидаларын бекіту туралы" 2013 жылғы 25 қаңтардағы № 36 қаулыларына өзгерістер енгізу туралы

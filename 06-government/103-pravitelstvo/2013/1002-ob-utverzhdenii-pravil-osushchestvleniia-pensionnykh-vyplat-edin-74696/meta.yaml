act_code: '74696'
requisite: Постановление Правительства Республики Казахстан от 2 октября 2013 года № 1042. Утратил силу постановлением Правительства Республики Казахстан от 30 июня 2023 года № 528
title:
  rus: Об утверждении Правил осуществления пенсионных выплат, единовременных пенсионных выплат в целях улучшения жилищных условий и (или) оплаты лечения, сформированных за счет обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов из единого накопительного пенсионного фонда, возврата их в единый накопительный пенсионный фонд, методики осуществления расчета размера пенсионных выплат, методики определения коэффициента замещения среднемесячного дохода получателя пенсионными выплатами, методики определения порога минимальной достаточности пенсионных накоплений
  kaz: Бірыңғай жинақтаушы зейнетақы қорынан міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары есебінен қалыптастырылған зейнетақы төлемдерін, тұрғын үй жағдайларын жақсарту және (немесе) емделуге ақы төлеу мақсатында біржолғы зейнетақы төлемдерін жүзеге асыру, оларды бірыңғай жинақтаушы зейнетақы қорына қайтару қағидаларын, зейнетақы төлемдерінің мөлшерін есептеуді жүзеге асыру әдістемесін, алушының орташа айлық кірісін зейнетақы төлемдерімен алмастыру коэффициентін айқындау әдістемесін, зейнетақы жинақтарының ең төмен жеткілікті шегін айқындау әдістемесін бекіту туралы

  title:
    rus: Об определении уполномоченных операторов по целевому использованию единовременных пенсионных выплат из единого накопительного пенсионного фонда в целях улучшения жилищных условий и (или) оплаты лечения и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Бірыңғай жинақтаушы зейнетақы қорынан төленетін біржолғы зейнетақы төлемдерін тұрғын үй жағдайларын жақсарту және (немесе) емделуге ақы төлеу мақсатында нысаналы пайдалану жөніндегі уәкілетті операторларды айқындау және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 1 декабря 2011 года № 1420 "Об утверждении Правил предоставления и пользования жилищем из государственного жилищного фонда или жилищем, арендованным местным исполнительным органом в частном жилищном фонде" и от 2 июля 2013 года № 673 "Об утверждении Правил приватизации жилищ из государственного жилищного фонда"
    kaz: Қазақстан Республикасы Үкіметінің "Мемлекеттiк тұрғын үй қорынан тұрғын үй немесе жеке тұрғын үй қорынан жергiлiктi атқарушы орган жалдаған тұрғын үй беру және пайдалану қағидаларын бекiту туралы" 2011 жылғы 1 желтоқсандағы № 1420 және "Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйлерді жекешелендіру қағидаларын бекіту туралы" 2013 жылғы 2 шілдедегі № 673 қаулыларына өзгерістер мен толықтырулар енгізу туралы

caused_by:
  code: '100850'
  requisite: Постановление Правительства Республики Казахстан от 31 марта 2016 года № 173
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 13 января 2012 года № 45 «Об утверждении Правил установления квоты на привлечение иностранной рабочей силы в Республику Казахстан, Правил и условий выдачи разрешений иностранному работнику на трудоустройство и работодателям на привлечение иностранной рабочей силы и о внесении изменения в постановление Правительства Республики Казахстан от 19 июня 2001 года № 836 «О мерах по реализации Закона Республики Казахстан  от 23 января 2001 года «О занятости населения» и от 2 июля 2013 года № 673 «Об утверждении Правил приватизации жилищ из государственного жилищного фонда»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасына шетелдік жұмыс күшін тартуға арналған квотаны белгілеу қағидаларын және Шетелдік қызметкерге жұмысқа орналасуға және жұмыс берушілерге шетелдік жұмыс күшін тартуға рұқсат берудің қағидалары мен шарттарын бекіту және «Халықты жұмыспен қамту туралы» Қазақстан Республикасының 2001 жылғы 23 қаңтардағы Заңын іске асыру жөніндегі шаралар туралы» Қазақстан Республикасы Үкіметінің 2001 жылғы 19 маусымдағы № 836 қаулысына өзгеріс енгізу туралы» 2012 жылғы 13 қаңтардағы № 45 және «Мемлекеттiк тұрғын үй қорынан берілетін тұрғын үйлерді жекешелендiру қағидаларын бекіту туралы» 2013 жылғы 2 шілдедегі № 673 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/100850/rus

title:
  rus: Об утверждении Правил разработки, рассмотрения и отбора бюджетных инвестиций, направленных на реализацию особо важных и требующих оперативной реализации задач, имеющих положительные предложения Республиканской бюджетной комиссии
  kaz: Аса маңызды және жедел іске асыруды талап ететін міндеттерді іске асыруға бағытталған, Республикалық бюджет комиссиясының оң ұсыныстары бар бюджеттік инвестицияларды әзірлеу, қарау және іріктеу қағидаларын бекіту туралы

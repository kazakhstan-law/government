act_code: '65675'
requisite: Постановление Правительства Республики Казахстан от 24 мая 2012 года № 670
title:
  rus: Об утверждении Правил применения специальных средств и служебного оружия государственными инспекторами по охране животного мира и инспекторами специализированных организаций по охране животного мира, а также применения служебного оружия егерями
  kaz: Жануарлар дүниесiн қорғау жөнiндегi мемлекеттік инспекторлардың және жануарлар дүниесiн қорғаумен айналысатын мамандандырылған ұйымдар инспекторларының арнайы құралдар мен қызметтік қаруды қолдану, сондай-ақ қорықшылардың қызметтік қаруды қолдану қағидаларын бекіту туралы

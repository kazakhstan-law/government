act_code: '67132'
requisite: Постановление Правительства Республики Казахстан от 20 июля 2012 года № 953. Утратило силу постановлением Правительства Республики Казахстан от 4 сентября 2015 года № 745
title:
  rus: Об утверждении Правил предоставления лесопользователям участков под объекты строительства на землях государственного лесного фонда, где лесные ресурсы предоставлены в долгосрочное лесопользование для оздоровительных, рекреационных, историко-культурных, туристских и спортивных целей; нужд охотничьего хозяйства; побочного лесного пользования и выдачи разрешения на использование этих участков под строительство таких объектов
  kaz: Орман ресурстары сауықтыру, рекреакциялық, тарихи-мәдени, туристік және спорттық мақсаттар; аңшылық шаруашылығының мұқтаждары; жанама орман пайдалану үшін ұзақ мерзімді орман пайдалануға берілген мемлекеттік орман қоры жерлерінде орман пайдаланушыларға құрылыс объектілерін салуға учаскелер беру және осы учаскелерді осындай объектілер салуға пайдалануға рұқсат беру қағидаларын бекіту туралы

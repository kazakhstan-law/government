  requisite: Постановление Правительства Республики Казахстан от 18 января 2022 года № 20
  title:
    rus: О некоторых вопросах подведомственных организаций Министерства экологии, геологии и природных ресурсов Республики Казахстан и принятии доли участия в уставном капитале товарищества с ограниченной ответственностью «Оператор РОП» из частной собственности в республиканскую собственность по договору дарения
    kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің ведомстволық бағынысты ұйымдарының кейбір мәселелері және сыйға тарту шарты бойынша «ӨКМ Операторы» жауапкершілігі шектеулі серіктестігінің жарғылық капиталындағы қатысу үлесін жеке меншіктен республикалық меншікке қабылдау туралы

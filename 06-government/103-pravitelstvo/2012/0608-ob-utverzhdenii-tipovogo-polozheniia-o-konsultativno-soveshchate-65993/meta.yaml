title:
  rus: Об утверждении Типового положения о консультативно-совещательном органе по содействию деятельности учреждений, исполняющих уголовные наказания и иные меры уголовно-правового воздействия, а также по организации социальной и иной помощи лицам, отбывшим уголовные наказания
  kaz: Қылмыстық жазаны және қылмыстық-құқықтық ықпал етудің өзге де шараларын атқаратын мекемелердің қызметіне жәрдемдесу, сондай-ақ қылмыстық жазасын өтеген адамдарға әлеуметтiк және өзге де көмекті ұйымдастыру жөніндегі консультативтік-кеңесші орган туралы үлгі ережені бекіту туралы

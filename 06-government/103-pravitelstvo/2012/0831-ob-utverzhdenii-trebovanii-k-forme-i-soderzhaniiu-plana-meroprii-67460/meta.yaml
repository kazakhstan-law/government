title:
  rus: Об утверждении требований к форме и содержанию плана мероприятий по энергосбережению и повышению энергоэффективности, разрабатываемого субъектом Государственного энергетического реестра по итогам энергоаудита
  kaz: Энергия аудитінің қорытындысы бойынша Мемлекеттік энергетикалық тізілім субъектісі әзірлейтін, энергия үнемдеу және энергия тиімділігін арттыру жөніндегі іс-шаралар жоспарының нысаны мен мазмұнына қойылатын талаптарды бекіту туралы

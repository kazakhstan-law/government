title:
  rus: Об утверждении Правил исчисления размера, назначения, перерасчета, осуществления, прекращения, приостановления и возобновления жилищных выплат сотрудникам специальных государственных органов Республики Казахстан
  kaz: Қазақстан Республикасы арнаулы мемлекеттік органдарының қызметкерлеріне тұрғын үй төлемдерінің мөлшерін есептеу, оларды тағайындау, қайта есептеу, жүзеге асыру, тоқтату, тоқтата тұру және қайта бастау қағидаларын бекiту туралы

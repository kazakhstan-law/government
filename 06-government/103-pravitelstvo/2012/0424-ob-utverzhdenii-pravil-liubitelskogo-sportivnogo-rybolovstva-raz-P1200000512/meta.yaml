title:
  rus: Об утверждении Правил любительского (спортивного) рыболовства, разрешаемого для нужд местного населения, проживающего в охранной зоне Маркакольского государственного природного заповедника
  kaz: Марқакөл мемлекеттік табиғи қорығының күзету аймағында тұратын жергілікті халықтың мұқтажы үшін рұқсат етілетін әуесқойлық (спорттық) балық аулау қағидаларын бекіту туралы

  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 16 января 2012 года № 72 "Об утверждении Правил предоставления услуг почтовой связи и Правил применения почтового штемпеля на почтовых отправлениях" и признании утратившим силу постановления Правительства Республики Казахстан от 17 июля 2002 года № 798 "О перечне предметов, запрещенных к пересылке по почте"
    kaz: '"Почта байланысы қызметтерін көрсету қағидаларын және Почта жөнелтімдеріне почта мөртабанын қолдану қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 16 қаңтардағы № 72 қаулысына өзгеріс енгізу және "Почта арқылы жiберуге тыйым салынған заттардың тiзбесi туралы" Қазақстан Республикасы Үкіметінің 2002 жылғы 17 шілдедегі № 798 қаулысының күші жойылды деп тану туралы'

title:
  rus: Об утверждении Правил отнесения социально значимых и (или) промышленно-инновационных проектов, реализуемых Фондом национального благосостояния или организацией, входящей в группу Фонда национального благосостояния, к низкорентабельным
  kaz: Ұлттық әл-ауқат қоры немесе Ұлттық әл-ауқат қорының тобына кіретін ұйым іске асыратын әлеуметтік маңызы бар және (немесе) өнеркәсіптік-инновациялық жобаларды рентабельділігі төмен жобаларға жатқызу қағидаларын бекіту туралы

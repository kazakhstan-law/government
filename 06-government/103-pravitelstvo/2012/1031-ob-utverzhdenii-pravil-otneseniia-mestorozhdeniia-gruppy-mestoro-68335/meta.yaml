title:
  rus: Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) твердых видов полезных ископаемых, за исключением общераспространенных, к категории низкорентабельных и налогообложения в части налога на добычу полезных ископаемых
  kaz: Пайдалы қазбалардың кең таралғандарын қоспағанда, қатты түрлерiнiң кен орнын (кен орындарының бiр тобын, кен орнының бiр бөлiгiн) рентабельділігі төмен санатқа жатқызу және пайдалы қазбаларды өндiруге арналған салық бөлігінде салық салу қағидаларын бекiту туралы

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 31 октября 2012 года № 1379 «Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) твердых видов полезных ископаемых, за исключением общераспространенных, к категории низкорентабельных и налогообложения в части налога на добычу полезных ископаемых»
    kaz: «Пайдалы қазбалардың кең таралғандарын қоспағанда, қатты түрлерiнiң кен орнын (кен орындарының бір тобын, кен орнының бiр бөлiгiн) рентабельділігі төмен санатқа жатқызу және пайдалы қазбаларды өндiруге арналған салық бөлігінде салық салу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 31 қазандағы № 1379 қаулысына өзгерістер енгізу туралы

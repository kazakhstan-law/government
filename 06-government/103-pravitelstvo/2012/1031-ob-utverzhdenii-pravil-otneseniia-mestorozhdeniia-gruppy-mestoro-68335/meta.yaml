  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 31 октября 2012 года № 1379 «Об утверждении Правил отнесения месторождения (группы месторождений, части месторождения) твердых видов полезных ископаемых, за исключением общераспространенных, к категории низкорентабельных и налогообложения в части налога на добычу полезных ископаемых» и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: «Пайдалы қазбалардың кең таралғандарын қоспағанда, қатты түрлерiнiң кен орнын (кен орындарының бiр тобын, кен орнының бiр бөлiгiн) рентабельділігі төмен санатқа жатқызу және пайдалы қазбаларды өндiруге арналған салық бөлігінде салық салу қағидаларын бекiту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 31 қазандағы № 1379 қаулысына өзгеріс енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

requisite: Постановление Правительства Республики Казахстан от 30 июня 2012 года № 893. Утратило силу постановлением Правительства Республики Казахстан от 7 сентября 2015 года № 750
title:
  rus: Об утверждении Правил проведения квалификационных проверок знаний правил технической эксплуатации и правил безопасности руководителей, специалистов организаций, осуществляющих производство, передачу и распределение электрической и тепловой энергии и их покупку в целях энергоснабжения, для осуществления контроля технического состояния и безопасности эксплуатации электро- и энергоустановок
  kaz: Электр және энергия қондырғыларының техникалық жай-күйі мен оларды пайдалану қауіпсіздігін бақылауды жүзеге асыру үшін электр және жылу энергиясын өндіруді, беру мен бөлуді және оларды энергиямен жабдықтау мақсатында сатып алуды жүзеге асыратын ұйымдар басшыларының, мамандарының техникалық пайдалану қағидаларын және қауіпсіздік қағидаларын білуіне біліктілік тексеру жүргізу қағидаларын бекіту туралы

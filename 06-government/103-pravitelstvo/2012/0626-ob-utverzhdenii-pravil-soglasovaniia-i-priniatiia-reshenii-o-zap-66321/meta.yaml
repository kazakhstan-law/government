act_code: '66321'
requisite: Постановление Правительства Республики Казахстан от 26 июня 2012 года № 838
title:
  rus: Об утверждении Правил согласования и принятия решений о запусках космических объектов с территории Республики Казахстан, а также за ее пределами в случае их осуществления казахстанскими участниками космической деятельности
  kaz: Қазақстан Республикасының аумағынан ғарыш объектілерін ұшыру, сондай-ақ оны одан тыс жерлерде ғарыш қызметіне қазақстандық қатысушылар жүзеге асыратын жағдайда ұшыру туралы шешімдерді келісу және қабылдау қағидаларын бекіту туралы

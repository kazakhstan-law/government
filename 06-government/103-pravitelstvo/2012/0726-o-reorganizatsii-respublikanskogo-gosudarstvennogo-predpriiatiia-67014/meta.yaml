title:
  rus: О реорганизации Республиканского государственного предприятия на праве хозяйственного ведения "Казахский научно-исследовательский институт экологии и климата" Министерства охраны окружающей среды Республики Казахстан
  kaz: Қазақстан Республикасы Қоршаған ортаны қорғау министрлігінің "Қазақ экология және климат ғылыми-зерттеу институты" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнын қайта ұйымдастыру туралы

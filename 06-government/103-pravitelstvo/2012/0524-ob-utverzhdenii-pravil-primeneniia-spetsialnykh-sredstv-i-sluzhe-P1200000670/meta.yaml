  title:
    rus: О признании утратившими силу постановлений Правительства Республики Казахстан от 24 мая 2012 года № 670 «Об утверждении Правил применения специальных средств и служебного оружия государственными инспекторами по охране животного мира и инспекторами специализированных организаций по охране животного мира, а также применения служебного оружия егерями» и от 24 февраля 2016 года № 106 «О внесении изменения в постановление Правительства Республики Казахстан от 24 мая 2012 года № 670 «Об утверждении Правил применения специальных средств и служебного оружия государственными инспекторами по охране животного мира и инспекторами специализированных организаций по охране животного мира, а также применения служебного оружия егерями»
    kaz: Қазақстан Республикасы Үкіметінің «Жануарлар дүниесiн қорғау жөнiндегi мемлекеттік инспекторлардың және жануарлар дүниесiн қорғаумен айналысатын мамандандырылған ұйымдар инспекторларының арнайы құралдар мен қызметтік қаруды қолдану, сондай-ақ қорықшылардың қызметтік қаруды қолдану қағидаларын бекіту туралы» 2012 жылғы 24 мамырдағы № 670 және «Жануарлар дүниесiн қорғау жөнiндегi мемлекеттік инспекторлардың және жануарлар дүниесiн қорғаумен айналысатын мамандандырылған ұйымдар инспекторларының арнайы құралдар мен қызметтік қаруды қолдану, сондай-ақ қорықшылардың қызметтік қаруды қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 24 мамырдағы № 670 қаулысына өзгеріс енгізу туралы» 2016 жылғы 24 ақпандағы № 106 қаулыларының күші жойылды деп тану туралы

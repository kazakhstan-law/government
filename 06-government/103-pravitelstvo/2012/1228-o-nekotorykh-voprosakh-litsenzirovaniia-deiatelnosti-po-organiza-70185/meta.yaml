  title:
    rus: Об утверждении стандартов государственных услуг в сфере лотерейной деятельности и игорного бизнеса и о внесении изменений в некоторые решения Правительства Республики Казахстан
    kaz: Лотерея қызметі және ойын бизнесі саласындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы және Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiне өзгерiстер енгiзу туралы

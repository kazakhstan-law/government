title:
  rus: О некоторых вопросах лицензирования деятельности по организации и проведению лотерей, а также в сфере игорного бизнеса
  kaz: Лотереяларды ұйымдастыру және өткізу, сондай-ақ ойын бизнесі саласындағы қызметті лицензиялаудың кейбір мәселелері туралы

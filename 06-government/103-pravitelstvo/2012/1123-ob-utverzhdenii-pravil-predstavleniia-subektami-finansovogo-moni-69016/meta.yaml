  rus: Об утверждении Правил представления субъектами финансового мониторинга сведений и информации об операциях, подлежащих финансовому мониторингу, и признаков определения подозрительной операции
  kaz: Қаржы мониторингі субъектілерінің қаржы мониторингіне жататын операциялар туралы мәліметтер мен ақпарат беру қағидаларын және күдікті операцияны айқындау белгілерін бекіту туралы

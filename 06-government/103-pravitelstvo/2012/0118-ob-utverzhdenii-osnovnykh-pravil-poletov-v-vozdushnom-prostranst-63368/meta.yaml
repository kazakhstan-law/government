  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 4 ноября 2011 года № 1296 "Об утверждении Правил по организации поисково-спасательного обеспечения полетов на территории Республики Казахстан" и от 18 января 2012 года № 103 "Об утверждении Основных правил полетов в воздушном пространстве Республики Казахстан"
    kaz: Қазақстан Республикасы Үкiметiнiң "Қазақстан Республикасының аумағында ұшуды іздестіру-құтқарумен қамтамасыз етуді ұйымдастыру жөніндегі қағидаларды бекіту туралы" 2011 жылғы 4 қарашадағы № 1296 және "Қазақстан Республикасының әуе кеңiстiгiнде ұшудың негiзгi қағидаларын бекiту туралы" 2012 жылғы 18 қаңтардағы № 103 қаулыларына өзгерістер енгізу туралы

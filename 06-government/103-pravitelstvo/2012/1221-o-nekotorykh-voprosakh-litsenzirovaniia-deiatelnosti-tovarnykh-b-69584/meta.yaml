title:
  rus: О некоторых вопросах лицензирования деятельности товарных бирж, биржевых брокеров и биржевых дилеров
  kaz: Тауар биржаларының, биржалық брокерлер мен биржалық дилерлердің қызметін лицензиялаудың кейбір мәселелері туралы

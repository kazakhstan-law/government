  title:
    rus: Об утверждении стандартов государственных услуг, оказываемых Министерством экономики и бюджетного планирования Республики Казахстан, и о внесении изменений в постановление Правительства Республики Казахстан от 21 декабря 2012 года № 1653 "О некоторых вопросах лицензирования деятельности товарных бирж, биржевых брокеров и биржевых дилеров" и о признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрлігі көрсететін мемлекеттік қызметтер стандарттарын бекіту туралы және "Тауар биржаларының, биржалық брокерлер мен биржалық дилерлердің қызметін лицензиялаудың кейбір мәселелері туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 21 желтоқсандағы № 1653 қаулысына өзгерістер енгізу туралы және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

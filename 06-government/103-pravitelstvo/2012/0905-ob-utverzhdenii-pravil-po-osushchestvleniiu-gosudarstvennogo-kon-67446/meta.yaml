requisite: Постановление Правительства Республики Казахстан от 5 сентября 2012 года № 1145. Утратило силу постановлением Правительства Республики Казахстан от 4 сентября 2015 года № 745
title:
  rus: Об утверждении Правил по осуществлению государственного контроля и надзора в области охраны, защиты, пользования лесным фондом, воспроизводства лесов и лесоразведения должностными лицами государственной лесной инспекции Республики Казахстан
  kaz: Қазақстан Республикасы мемлекеттік орман инспекциясы лауазымды адамдарының орман қорын күзету, қорғау, пайдалану, ормандарды молықтыру және орман өсіру саласындағы мемлекеттік бақылау мен қадағалауды жүзеге асыруы жөніндегі қағидаларды бекіту туралы

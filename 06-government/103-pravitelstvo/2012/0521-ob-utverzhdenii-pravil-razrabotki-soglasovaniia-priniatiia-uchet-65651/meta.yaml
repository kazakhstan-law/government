act_code: '65651'
requisite: Постановление Правительства Республики Казахстан от 21 мая 2012 года № 651. Утратило силу постановлением Правительства Республики Казахстан от 16 ноября 2018 года № 772
title:
  rus: Об утверждении Правил разработки, согласования, принятия, учета, изменения и отмены военных стандартов на товары (продукцию), работы и услуги военного и двойного назначения, используемых для нужд Вооруженных Сил, других войск и воинских формирований Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құралымдарының мұқтаждары үшін пайдаланылатын әскери және қосарланған мақсаттағы тауарларға (өнімге), жұмыстар мен көрсетілетін қызметтерге әскери стандарттарды әзірлеу, келісу, қабылдау, есепке алу, өзгерту және күшін жою қағидаларын бекіту туралы

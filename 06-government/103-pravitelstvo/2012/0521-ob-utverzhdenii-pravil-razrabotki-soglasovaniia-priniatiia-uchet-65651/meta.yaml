  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 21 мая 2012 года № 651 "Об утверждении Правил разработки, согласования, принятия, учета, изменения и отмены военных стандартов на товары (продукцию), работы и услуги военного и двойного назначения, используемых для нужд Вооруженных Сил, других войск и воинских формирований Республики Казахстан"
    kaz: '"Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құралымдарының мұқтаждары үшін пайдаланылатын әскери және қосарланған мақсаттағы тауарларға (өнімге), жұмыстар мен көрсетілетін қызметтерге әскери стандарттарды әзірлеу, келісу, қабылдау, есепке алу, өзгерту және күшін жою қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 21 мамырдағы № 651 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/77292/rus

act_code: '64840'
requisite: Постановление Правительства Республики Казахстан от 19 апреля 2012 года № 493
title:
  rus: Об установлении размеров возмещения расходов, связанных с подготовкой к перевозке тела, перевозкой тела, погребением, изготовлением и установкой надгробного памятника военнослужащим, погибшим при прохождении воинской службы или умершим в результате увечья (ранения, травмы, контузии), заболевания, полученных в результате исполнения обязанностей воинской службы
  kaz: Әскери қызмет өткеру кезiнде қаза тапқан немесе әскери қызмет міндеттерін орындау нәтижесінде алған мертiгуден (жараланудан, жарақаттанудан, контузия алудан), ауырудан қайтыс болған әскери қызметшiлердің мәйiтін тасымалдауға дайындаумен, мәйiтті тасымалдаумен, жерлеумен, құлпытасын жасаумен және орнатумен байланысты шығыстарды өтеу мөлшерін бекіту туралы

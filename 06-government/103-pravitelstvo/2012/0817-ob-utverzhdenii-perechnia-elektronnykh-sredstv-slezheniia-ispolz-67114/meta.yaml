title:
  rus: Об утверждении перечня электронных средств слежения, используемых при осуществлении надзора за лицами, отбывающими наказание в виде ограничения свободы
  kaz: Бас бостандығын шектеу түріндегі жазасын өтеуші адамдарды қадағалауды жүзеге асыру кезінде пайдаланылатын электрондық бақылау құралдарының тізбесін бекіту туралы

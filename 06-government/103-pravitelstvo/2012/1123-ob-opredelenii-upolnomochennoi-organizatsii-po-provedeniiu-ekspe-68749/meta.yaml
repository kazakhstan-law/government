  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 23 ноября 2012 года № 1479 "Об определении уполномоченной организации по проведению экспертизы драгоценных камней, в том числе необработанных природных алмазов и ювелирных изделий из драгоценных металлов и драгоценных камней, и утверждении Правил ввоза на территорию Республики Казахстан из стран, не входящих в Таможенный союз, и вывоза с территории Республики Казахстан в эти страны драгоценных камней, ювелирных изделий из драгоценных металлов и драгоценных камней, ввоза на территорию Республики Казахстан и вывоза с территории Республики Казахстан необработанных природных алмазов с учетом схемы сертификации Кимберлийского процесса, а также клеймения изделий из драгоценных металлов и драгоценных камней"
    kaz: '"Асыл тастарға, оның ішінде өңделмеген табиғи алмастарға және бағалы металдар мен асыл тастардан жасалған зергерлік бұйымдарға сараптама жүргізу жөніндегі уәкілетті ұйымды айқындау және Асыл тастарды, бағалы металдар мен асыл тастардан жасалған зергерлік бұйымдарды Кеден одағына кірмейтін елдерден Қазақстан Республикасының аумағына әкелу және Қазақстан Республикасының аумағынан осы елдерге әкету, Кимберлей үдерісінің сертификаттау схемасын ескере отырып, өңделмеген табиғи алмасты Қазақстан Республикасының аумағына әкелу және Қазақстан Республикасының аумағынан әкету, сондай-ақ бағалы металдар мен асыл тастардан жасалған бұйымдарды таңбалау қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 23 қарашадағы № 1479 қаулысына өзгерістер мен толықтырулар енгізу туралы'

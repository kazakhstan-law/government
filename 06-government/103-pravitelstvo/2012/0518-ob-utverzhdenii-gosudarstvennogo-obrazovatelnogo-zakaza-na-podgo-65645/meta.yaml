  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 18 мая 2012 года № 640 "Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку специалистов для Вооруженных сил, других войск и воинских формирований) на 2012/2013 учебный год"
    kaz: '"Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қарулы Күштер, басқа да әскерлер мен әскери құралымдар үшін мамандар даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2012/2013 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 18 мамырдағы № 640 қаулысына өзгерістер енгізу туралы'

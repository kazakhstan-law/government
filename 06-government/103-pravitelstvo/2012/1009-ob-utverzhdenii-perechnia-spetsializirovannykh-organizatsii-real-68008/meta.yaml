  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 9 октября 2012 года № 1279 «Об утверждении перечня специализированных организаций, осуществляющих закупочные и товарные интервенции, а также размера их вознаграждения»
    kaz: «Сатып алу және тауар интервенцияларын жүзеге асыратын мамандандырылған ұйымдардың тізбесін, сондай-ақ оларға сыйақы мөлшерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 9 қазандағы № 1279 қаулысына өзгерістер енгізу туралы

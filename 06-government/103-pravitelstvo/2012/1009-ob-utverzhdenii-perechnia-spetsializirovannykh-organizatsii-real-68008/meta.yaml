  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 9 октября 2012 года № 1279 «Об утверждении перечня специализированных организаций, реализующих механизмы стабилизации цен на социально значимые продовольственные товары, за исключением мер по установлению предельных цен на социально значимые продовольственные товары»
    kaz: «Әлеуметтік маңызы бар азық-түлік тауарларына шекті бағаларды белгілеу жөніндегі шараларды қоспағанда, әлеуметтік маңызы бар азық-түлік тауарлары бағаларын тұрақтандыру тетіктерін іске асыратын мамандандырылған ұйымдардың тiзбесiн бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 9 қазандағы № 1279 қаулысына өзгеріс пен толықтырулар енгізу туралы

title:
  rus: Об утверждении перечня специализированных организаций, реализующих механизмы стабилизации цен на социально значимые продовольственные товары, за исключением мер по установлению предельных цен на социально значимые продовольственные товары
  kaz: Әлеуметтік маңызы бар азық-түлік тауарларына шекті бағаларды белгілеу жөніндегі шараларды қоспағанда, әлеуметтік маңызы бар азық-түлік тауарлары бағаларын тұрақтандыру тетіктерін іске асыратын мамандандырылған ұйымдардың тiзбесiн бекiту туралы

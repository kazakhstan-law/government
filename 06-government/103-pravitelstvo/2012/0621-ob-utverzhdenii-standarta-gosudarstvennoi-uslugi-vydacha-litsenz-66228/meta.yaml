title:
  rus: Об утверждении стандарта государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление аудиторской деятельности"
  kaz: '"Аудиторлық қызметті жүзеге асыруға лицензия беру, қайта ресiмдеу, лицензияның телнұсқаларын беру" мемлекеттік қызмет стандартын бекіту туралы'

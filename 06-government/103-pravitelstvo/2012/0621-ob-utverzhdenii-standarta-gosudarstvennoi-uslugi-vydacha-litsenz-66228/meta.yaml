  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 21 июня 2012 года № 813 "Об утверждении стандарта государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление аудиторской деятельности" и от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: Қазақстан Республикасы Үкіметінің "Аудиторлық қызметті жүзеге асыруға лицензия беру, қайта ресiмдеу, лицензияның телнұсқаларын беру" мемлекеттік қызмет стандартын бекіту туралы" 2012 жылғы 21 маусымдағы № 813 және "Жеке және заңды тұлғаларға көрсетiлетiн мемлекеттiк қызметтердiң тiзiлiмiн бекiту туралы" 2010 жылғы 20 шiлдедегi № 745 қаулыларына өзгерістер енгізу туралы

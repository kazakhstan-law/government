title:
  rus: Об утверждении Правил ежегодного государственного технического осмотра тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, специальных машин повышенной проходимости
  kaz: Тракторларды және олардың базасында жасалған өздiгiнен жүретiн шассилер мен механизмдердi, монтаждалған арнаулы жабдығы бар тiркемелердi қоса алғанда, олардың тiркемелерiн, өздiгiнен жүретiн ауылшаруашылық, мелиорациялық және жол-құрылысы машиналары мен механизмдерiн, жүріп өту мүмкіндігі жоғары арнайы машиналарды жыл сайынғы мемлекеттiк техникалық байқаудан өткізу қағидаларын бекіту туралы

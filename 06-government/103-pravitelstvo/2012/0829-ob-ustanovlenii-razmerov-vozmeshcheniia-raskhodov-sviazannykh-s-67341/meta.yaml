act_code: '67341'
requisite: Постановление Правительства Республики Казахстан от 29 августа 2012 года № 1102
title:
  rus: Об установлении размеров возмещения расходов, связанных с подготовкой к перевозке тела, перевозкой тела, погребением, изготовлением и установкой надгробного памятника, сотрудникам специальных государственных органов, погибшим при прохождении службы или умершим в результате увечья (ранения, травмы, контузии), заболевания
  kaz: Қызмет өткеру кезінде қаза тапқан немесе мертігу (жаралану, жарақат алу, контузия), ауруы салдарынан қайтыс болған арнаулы мемлекеттік органдар қызметкерлерінің мәйіттерін жеткізуді әзірлеуге, мәйіттерін жеткізуге, жерлеуге, құлпытас дайындауға және оны орнатуға байланысты шығыстарды өтеу мөлшерін белгілеу туралы

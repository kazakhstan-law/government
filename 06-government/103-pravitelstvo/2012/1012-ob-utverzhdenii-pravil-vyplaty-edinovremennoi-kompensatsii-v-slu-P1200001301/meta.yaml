  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 12 октября 2012 года № 1301 «Об утверждении Правил выплаты единовременных компенсаций в случае гибели (смерти) сотрудника специального государственного органа, установления инвалидности или получения им увечья»
    kaz: «Арнаулы мемлекеттік органның қызметкері қаза тапқан (қайтыс болған), оған мүгедектік белгіленген немесе мертіккен жағдайда берілетін біржолғы өтемақыларды төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 12 қазандағы № 1301 қаулысына өзгерістер енгізу туралы

act_code: '67619'
requisite: Постановление Правительства Республики Казахстан от 18 сентября 2012 года № 1214. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2018 года № 922 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня налогоплательщиков, осуществляющих деятельность в рамках межправительственного соглашения о сотрудничестве в газовой отрасли, обороты которых по реализации на территории другого государства-члена Таможенного союза продуктов переработки из давальческого сырья, ранее вывезенного этими налогоплательщиками с территории Республики Казахстан и переработанного на территории такого другого государства-члена Таможенного союза, облагаются налогом на добавленную стоимость по нулевой ставке
  kaz: Салық төлеушілердің Қазақстан Республикасы аумағынан бұрын әкеткен және Кеден одағына мүше осындай басқа мемлекет аумағында өңдеген алыс-беріс шикізатынан өңделген өнімдерін Кеден одағына мүше басқа мемлекеттің аумағында өткізуі бойынша айналымдарына нөлдік ставка бойынша қосылған құн салығы салынатын газ саласындағы ынтымақтастық туралы үкіметаралық келісімнің шеңберінде қызметін жүзеге асыратын салық төлеушілердің тізбесін бекіту туралы

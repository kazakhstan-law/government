act_code: '66325'
requisite: Постановление Правительства Республики Казахстан от 26 июня 2012 года № 849. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2018 года № 922 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня налогоплательщиков, осуществляющих на территории Республики Казахстан деятельность в рамках контракта на недропользование, обороты по реализации нестабильного конденсата которых с территории Республики Казахстан на территорию других государств-членов Таможенного союза облагаются налогом на добавленную стоимость по нулевой ставке
  kaz: Жер қойнауын пайдалануға арналған келісімшарт шеңберінде қызметін Қазақстан Республикасының аумағында жүзеге асыратын, тұрақты емес конденсатты Қазақстан Республикасының аумағынан Кеден одағына мүше басқа мемлекеттердің аумағына өткізу жөніндегі айналымына нөлдік ставка бойынша қосымша құн салығы салынатын салық төлеушілердің тізбесін бекіту туралы

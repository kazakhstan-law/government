act_code: '63090'
requisite: Постановление Правительства Республики Казахстан от 19 января 2012 года № 133
title:
  rus: Об утверждении перечня товаров, произведенных на территории свободного склада и реализуемых владельцем свободного склада на территории Республики Казахстан, обороты по реализации которых освобождаются от налога на добавленную стоимость и перечня товаров, произведенных на территории свободного склада и реализуемых с данной территории на остальную часть территории Республики Казахстан, обороты по реализации которых освобождаются от налога на добавленную стоимость
  kaz: Еркін қойма аумағында өндiрiлген және Қазақстан Республикасының аумағында еркін қойма иесі өткізетін, өткізу бойынша айналымдары қосылған құн салығынан босатылатын тауарлардың тiзбесiн және еркiн қойма аумағында өндірілген және Қазақстан Республикасы аумағының қалған бөлiгiне өткізілетін, өткізу бойынша айналымдары қосылған құн салығынан босатылатын тауарлардың тiзбесiн бекіту туралы

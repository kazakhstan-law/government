title:
  rus: Об утверждении Правил предоставления сведений о товарах, освобождаемых от уплаты таможенных пошлин и налогов в рамках Соглашения между Правительством Республики Казахстан и Правительством Французской Республики об условиях создания и использования космической системы дистанционного зондирования Земли и сборочно-испытательного комплекса космических аппаратов от 6 октября 2009 года
  kaz: 2009 жылғы 6 қазандағы Қазақстан Республикасының Үкiметi мен Француз Республикасының Үкіметі арасындағы Жерді қашықтықтан зондтаудың ғарыш жүйесі мен ғарыш аппараттарының құрастыру-сынау кешенін құру және пайдалану шарттары туралы келісім шеңберінде кедендік баждар мен салықтарды төлеуден босатылатын тауарлар туралы мәліметтерді ұсыну қағидаларын бекіту туралы

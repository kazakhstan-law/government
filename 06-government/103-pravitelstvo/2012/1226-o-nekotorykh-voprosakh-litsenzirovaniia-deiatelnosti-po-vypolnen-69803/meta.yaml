title:
  rus: О некоторых вопросах лицензирования деятельности по выполнению работ и оказанию услуг в области охраны окружающей среды
  kaz: Қоршаған ортаны қорғау саласындағы жұмыстарды орындау және қызметтерді көрсету жөніндегі қызметті лицензиялаудың кейбір мәселелері туралы

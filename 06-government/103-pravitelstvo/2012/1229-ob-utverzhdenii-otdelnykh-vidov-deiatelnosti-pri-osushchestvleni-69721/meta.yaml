act_code: '69721'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2012 года № 1743. Утратило силу постановлением Правительства Республики Казахстан от 29 октября 2014 года № 1147
title:
  rus: Об утверждении отдельных видов деятельности, при осуществлении которых на территории Республики Казахстан индивидуальные предприниматели или юридические лица обязаны обеспечить установку в местах осуществления своей деятельности оборудования (устройства), предназначенного для приема платежей с использованием платежных карточек, а также принимать платежи с использованием платежных карточек
  kaz: Қазақстан Республикасыңың аумағында жүзеге асыру кезінде дара кәсіпкерлер немесе заңды тұлғалар өз қызметін жүзеге асыратын жерлерде төлем карточкаларын пайдалана отырып, төлемдерді қабылдауға арналған жабдық (қондырғы) орнатуды қамтамасыз етуге, сондай-ақ төлем карточкаларын пайдалана отырып, төлемдерді қабылдауға міндетті жекелеген қызмет түрлерін бекіту туралы

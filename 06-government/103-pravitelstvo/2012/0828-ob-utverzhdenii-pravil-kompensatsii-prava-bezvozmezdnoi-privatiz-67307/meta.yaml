title:
  rus: Об утверждении Правил компенсации права безвозмездной приватизации служебного жилища, которое не подлежит приватизации, в том числе вследствие его расположения в закрытых и обособленных военных городках, пограничных заставах и в комендатурах
  kaz: Жекешелендіруге жатпайтын, оның ішінде оның жабық және оқшауланған әскери қалашықтарда, шекара заставалары мен комендатураларда орналасуы салдарынан қызметтік тұрғын үйді өтеусіз жекешелендіру құқығын өтеу қағидаларын бекіту туралы

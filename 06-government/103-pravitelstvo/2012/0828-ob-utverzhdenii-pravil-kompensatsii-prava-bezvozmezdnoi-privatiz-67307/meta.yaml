  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 28 августа 2012 года № 1092 «Об утверждении Правил компенсации права безвозмездной приватизации служебного жилища, которое не подлежит приватизации, в том числе вследствие его расположения в закрытых и обособленных военных городках, пограничных заставах и в комендатурах»
    kaz: «Жекешелендіруге жатпайтын, оның ішінде оның жабық және оқшауланған әскери қалашықтарда, шекара заставалары мен комендатураларда орналасуы салдарынан қызметтік тұрғын үйді өтеусіз жекешелендіру құқығын өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 28 тамыздағы № 1092 қаулысына өзгеріс енгізу туралы

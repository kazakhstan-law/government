title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2012 года областными бюджетами на субсидирование повышения продуктивности и качества продукции животноводства
  kaz: Облыстық бюджеттердiң мал шаруашылығы өнiмдерiнiң өнiмдiлiгiн және сапасын арттыруды субсидиялауға 2012 жылғы республикалық бюджеттен берiлетiн ағымдағы нысаналы трансферттердi пайдалану қағидаларын бекiту туралы

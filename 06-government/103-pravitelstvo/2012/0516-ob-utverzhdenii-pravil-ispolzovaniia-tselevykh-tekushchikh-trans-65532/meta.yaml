  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 24 апреля 2012 года № 516 "Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2012 года областными бюджетами, бюджетами городов Астаны и Алматы на поддержку племенного животноводства" и от 16 мая 2012 года № 625 "Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2012 года областными бюджетами на субсидирование повышения продуктивности и качества продукции животноводства"
    kaz: Қазақстан Республикасы Үкіметінің "Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне асыл тұқымды мал шаруашылығын қолдауға 2012 жылға арналған республикалық бюджеттен берiлетiн ағымдағы нысаналы трансферттердi пайдалану қағидаларын бекiту туралы" 2012 жылғы 24 сәуірдегі № 516 және "Облыстық бюджеттердiң мал шаруашылығы өнiмдерiнiң өнiмдiлiгiн және сапасын арттыруды субсидиялауға 2012 жылғы республикалық бюджеттен берiлетiн ағымдағы нысаналы трансферттердi пайдалану қағидаларын бекіту туралы" 2012 жылғы 16 мамырдағы № 625 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/67622/rus

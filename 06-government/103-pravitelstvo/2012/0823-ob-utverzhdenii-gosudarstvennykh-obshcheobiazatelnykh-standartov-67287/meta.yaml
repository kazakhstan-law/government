  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 13 мая 2016 года № 292 «О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 23 августа 2012 года № 1080 «Об утверждении государственных общеобязательных стандартов образования соответствующих уровней образования»
    kaz: «Білім берудің тиісті деңгейлерінің мемлекеттік жалпыға міндетті білім беру стандарттарын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 23 тамыздағы № 1080 қаулысына өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 13 мамырдағы № 292 қаулысына өзгерістер енгізу туралы

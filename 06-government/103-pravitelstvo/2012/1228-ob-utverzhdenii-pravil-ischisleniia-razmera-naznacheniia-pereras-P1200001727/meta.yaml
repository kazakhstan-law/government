  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 28 декабря 2012 года № 1727 «Об утверждении Правил исчисления размера, назначения, перерасчета, осуществления, прекращения, приостановления и возобновления жилищных выплат сотрудникам специальных государственных органов Республики Казахстан»
    kaz: «Қазақстан Республикасы арнаулы мемлекеттік органдарының қызметкерлеріне тұрғын үй төлемдерінің мөлшерін есептеу, оларды тағайындау, қайта есептеу, жүзеге асыру, тоқтату, тоқтата тұру және қайта бастау қағидаларын бекiту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 28 желтоқсандағы № 1727 қаулысына өзгеріс енгізу туралы

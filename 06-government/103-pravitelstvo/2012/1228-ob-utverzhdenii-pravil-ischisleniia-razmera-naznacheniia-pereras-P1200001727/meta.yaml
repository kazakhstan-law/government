  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 28 декабря 2012 года № 1727 «Об утверждении Правил определения размера, назначения, перерасчета, осуществления и прекращения жилищных выплат сотрудникам специальных государственных органов Республики Казахстан»
    kaz: «Қазақстан Республикасы арнаулы мемлекеттік органдарының қызметкерлеріне тұрғын үй төлемдерінің мөлшерін айқындау, тағайындау, қайта есептеу, жүзеге асыру және тоқтату қағидаларын бекiту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 28 желтоқсандағы № 1727 қаулысына өзгерістер мен толықтыру енгізу туралы

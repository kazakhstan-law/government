act_code: '67362'
requisite: Постановление Правительства Республики Казахстан от 31 августа 2012 года № 1112. Утратило силу постановлением Правительства Республики Казахстан от 24 ноября 2015 года № 941
title:
  rus: Об утверждении Правил использования сетей телерадиовещания для оповещения населения об угрозе жизни, здоровью людей и порядке действий в сложившейся обстановке при чрезвычайных ситуациях природного и техногенного характера, а также в интересах обороны, национальной безопасности и охраны правопорядка
  kaz: Адамдардың өмiрiне, денсаулығына төнген қауiп-қатер және табиғи және техногендiк сипаттағы төтенше жағдайлар кезiнде қалыптасқан жағдайдағы iс-қимылдар тәртiбi туралы халықты хабардар ету, сондай-ақ қорғаныс, ұлттық қауiпсiздiк және құқықтық тәртiптi қорғау мүдделерiнде телерадио хабарларын тарату желiлерiн пайдалану қағидаларын бекiту туралы

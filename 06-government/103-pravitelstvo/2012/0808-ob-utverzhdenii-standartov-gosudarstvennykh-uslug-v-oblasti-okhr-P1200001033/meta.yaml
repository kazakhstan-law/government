title:
  rus: Об утверждении стандартов государственных услуг в области охраны окружающей среды, оказываемых Министерством охраны окружающей среды Республики Казахстан и местными исполнительными органами
  kaz: Қазақстан Республикасы Қоршаған ортаны қорғау министрлігі және жергілікті атқарушы органдар көрсететін қоршаған ортаны қорғау саласындағы мемлекеттік қызмет стандарттарын бекіту туралы

act_code: '65923'
requisite: Постановление Правительства Республики Казахстан от 1 июня 2012 года № 729
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2012 год областными бюджетами, бюджетами городов Астаны и Алматы на организацию и проведение идентификации сельскохозяйственных животных
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттерiне ауыл шаруашылығы малдарын бiрдейлендiрудi ұйымдастыру және жүргiзуге 2012 жылға арналған республикалық бюджеттен берiлетiн ағымдағы нысаналы трансферттердi пайдалану қағидаларын бекiту туралы

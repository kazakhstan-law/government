  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 31 мая 2012 года № 705 "Об утверждении Правил выдачи административным органом разрешений на ввоз в Республику Казахстан и вывоз за ее пределы видов животных, их частей и дериватов, находящихся под угрозой исчезновения"
    kaz: '"Әкiмшiлiк органның құрып кету қаупi төнген жануарлар түрлерiн, олардың бөлiктерi мен дериваттарын Қазақстан Республикасына әкелуге және одан тысқары жерлерге әкетуге рұқсат беру қағидаларын бекiту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 31 мамырдағы № 705 қаулысына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/74798/rus

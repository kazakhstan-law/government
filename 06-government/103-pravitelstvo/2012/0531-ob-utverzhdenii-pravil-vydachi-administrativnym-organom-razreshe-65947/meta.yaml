act_code: '65947'
requisite: Постановление Правительства Республики Казахстан от 31 мая 2012 года № 705. Утратило силу постановлением Правительства Республики Казахстан от 29 декабря 2015 года № 1108
title:
  rus: Об утверждении Правил выдачи административным органом разрешений на ввоз на территорию Республики Казахстан и вывоз с территории Республики Казахстан видов животных, подпадающих под действие Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения
  kaz: Әкiмшiлiк органның Құрып кету қаупi төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенция қолданылатын жануарлар түрлерiн Қазақстан Республикасының аумағына әкелуге және Қазақстан Республикасының аумағынан әкетуге рұқсаттар беру қағидаларын бекiту туралы

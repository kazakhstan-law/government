act_code: '64047'
requisite: Постановление Правительства Республики Казахстан от 12 марта 2012 года № 322
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2012 года областными бюджетами, бюджетами городов Астаны и Алматы на поддержку семеноводства, нормативов бюджетных субсидий на закладку маточников многолетних насаждений плодово-ягодных культур и винограда и 1 тонну элитных семян сельскохозяйственных растений на 2012 год
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің тұқым шаруашылығын қолдауға 2012 жылғы республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын, жеміс-жидек дақылдары мен жүзімнің көп жылдық екпелерінің аналықтарын отырғызуға және ауыл шаруашылығы өсімдіктерінің элиталық тұқымының 1 тоннасына берілетін бюджеттік субсидиялардың 2012 жылға арналған нормативтерін бекіту туралы

    kaz: «Көшіп келушілердің Қазақстан Республикасына келуінің (кетуінің) және олардың Қазақстан Республикасында болуының кейбір мәселелері туралы» Қазақстан Республикасы Үкіметінің 2020 жылғы 17 сәуірдегі № 220 қаулысына өзгеріс енгізу туралы

  requisite: Постановление Правительства Республики Казахстан от 18 сентября 2019 года № 693
  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 21 января 2012 года № 148 «Об утверждении Правил въезда и пребывания иммигрантов в Республике Казахстан, а также их выезда из Республики Казахстан и Правил осуществления миграционного контроля, а также учета иностранцев и лиц без гражданства, незаконно пересекающих Государственную границу Республики Казахстан, незаконно пребывающих на территории Республики Казахстан, а также лиц, которым запрещен въезд на территорию Республики Казахстан»
    kaz: «Көшіп келушілердің Қазақстан Республикасына келуінің және онда болуының, сондай-ақ олардың Қазақстан Республикасынан кетуінің қағидаларын және Көші-қон бақылауын жүзеге асыру, сондай-ақ Қазақстан Республикасының Мемлекеттік шекарасынан заңсыз өтетін, Қазақстан Республикасының аумағында заңсыз болатын шетелдіктер мен азаматтығы жоқ адамдарды, сондай-ақ Қазақстан Республикасының аумағына келуге тыйым салынған адамдарды есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 21 қаңтардағы № 148 қаулысына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134733/rus

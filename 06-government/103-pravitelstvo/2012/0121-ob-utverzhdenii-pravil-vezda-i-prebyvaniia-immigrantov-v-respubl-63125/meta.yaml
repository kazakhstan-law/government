  requisite: Постановление Правительства Республики Казахстан от 4 февраля 2014 года № 54
  title:
    rus: Об утверждении стандарта государственной услуги "Оформление документов на выезд за пределы Республики Казахстан на постоянное место жительства" и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: '"Қазақстан Республикасының шегінен тыс тұрақты тұрғылықты жерге кетуге арналған құжаттарды ресімдеу" мемлекеттік көрсетілетін қызмет стандартын бекіту және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы'

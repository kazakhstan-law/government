  requisite: Постановление Правительства Республики Казахстан от 27 января 2020 года № 10
  title:
    rus: О приостановлении действия пункта 26-1 Правил въезда и пребывания иммигрантов в Республике Казахстан, а также их выезда из Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 21 января 2012 года № 148
    kaz: Қазақстан Республикасы Үкіметінің 2012 жылғы 21 қаңтардағы № 148 қаулысымен бекітілген Көшіп келушілердің Қазақстан Республикасына келуінің және онда болуының, сондай-ақ олардың Қазақстан Республикасынан кетуінің қағидаларының 26-1-тармағының қолданылуын тоқтата тұру туралы

title:
  rus: Об утверждении Правил деятельности учебных центров по переподготовке и повышению квалификации кадров, осуществляющих энергоаудит и (или) экспертизу энергосбережения и повышения энергоэффективности, а также созданию, внедрению и организации системы энергоменеджмента
  kaz: Энергия аудитін және (немесе) энергия үнемдеу және энергия тиімділігін арттыру сараптамасын жүзеге асыратын кадрларды қайта даярлау және олардың біліктілігін арттыру, сондай-ақ энергия менеджменті жүйесін құру, енгізу және ұйымдастыру жөніндегі оқу орталықтары қызметінің қағидаларын бекіту туралы

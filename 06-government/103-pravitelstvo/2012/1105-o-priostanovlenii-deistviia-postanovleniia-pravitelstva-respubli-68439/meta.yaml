act_code: '68439'
requisite: Постановление Правительства Республики Казахстан от 5 ноября 2012 года № 1402
title:
  rus: О приостановлении действия постановления Правительства Республики Казахстан от 30 декабря 2009 года № 2275 и утверждении перечня юридических лиц, основным видом деятельности которых является осуществление заемных операций или выкуп прав требования и сто процентов голосующих акций (долей участия) которых принадлежат национальному управляющему холдингу, имеющих право на вычет провизий (резервов) против сомнительных и безнадежных активов, условных обязательств, за исключением активов и условных обязательств, предоставленных в пользу взаимосвязанных сторон либо третьим лицам по обязательствам взаимосвязанных сторон (кроме активов и условных обязательств кредитных товариществ), правил его формирования и правил отнесения активов и условных обязательств к категории сомнительных и безнадежных и создания провизий (резервов) против них
  kaz: Қазақстан Республикасы Үкіметінің 2009 жылғы 30 желтоқсандағы № 2275 қаулысының қолданысын тоқтата тұру және негізгі қызмет түрі қарыз операцияларын жүзеге асыру немесе талап құқықтарын сатып алу болып табылатын және дауыс беретін акцияларының (қатысу үлестерінің) жүз проценті ұлттық басқарушы холдингке тиесілі, өзара байланысты тараптардың пайдасына не өзара байланысты тараптардың міндеттемелері бойынша үшінші тұлғаларға берілген активтер мен шартты міндеттемелерді (кредиттік серіктестіктердің активтері мен шартты міндеттемелерінен басқа) қоспағанда, күмәнді және үмітсіз активтерге, шартты міндеттемелерге қарсы провизияларды (резервтерді) шегеруге құқығы бар заңды тұлғалардың тізбесін, оны қалыптастыру ережесін, активтер мен шартты міндеттемелерді күмәнді және үмітсіз санатқа жатқызу және оларға қарсы провизиялар (резервтер) құру қағидаларын бекіту туралы

act_code: '63613'
requisite: Постановление Правительства Республики Казахстан от 25 января 2012 года № 168. Утратило силу постановлением Правительства Республики Казахстан от 30 декабря 2015 года № 1127
title:
  rus: Об утверждении Санитарных правил "Санитарно-эпидемиологические требования к атмосферному воздуху в городских и сельских населенных пунктах, почвам и их безопасности, содержанию территорий городских и сельских населенных пунктов, условиям работы с источниками физических факторов, оказывающих воздействие на человека"
  kaz: '"Қалалық және ауылдық елді мекендердегі атмосфералық ауаға, топыраққа және олардың қауіпсіздігіне, қалалық және ауылдық елді мекендердің аумақтарын күтіп-ұстауға, адамға әсер ететін физикалық факторлардың көздерімен жұмыс істеу жағдайларына қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық қағидаларын бекіту туралы'

act_code: '65136'
requisite: Постановление Правительства Республики Казахстан от 26 апреля 2012 года № 525. Утратило силу постановлением Правительства Республики Казахстан от 4 декабря 2017 года № 807 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями Вооруженных Сил Республики Казахстан, специализирующимися в области спорта, и расходования ими денег от реализации товаров (работ, услуг)
  kaz: Қазақстан Республикасы Қарулы Күштерінің спорт саласында мамандандырылған мемлекеттік мекемелерінің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы

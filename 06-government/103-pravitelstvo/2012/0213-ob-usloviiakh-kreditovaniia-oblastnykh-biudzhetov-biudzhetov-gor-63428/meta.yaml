act_code: '63428'
requisite: Постановление Правительства Республики Казахстан от 13 февраля 2012 года № 218
title:
  rus: Об условиях кредитования областных бюджетов, бюджетов городов Астаны и Алматы на проектирование, строительство и (или) приобретение жилья через систему жилстройсбережений на 2012 год в рамках Программы жилищного строительства в Республике Казахстан на 2011 - 2014 годы
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне Қазақстан Республикасындағы тұрғын үй құрылысының 2011 - 2014 жылдарға арналған бағдарламасы шеңберінде 2012 жылға арналған тұрғын үй құрылыс жинақтары жүйесі арқылы тұрғын үйді жобалауға, салуға және (немесе) сатып алуға кредит беру шарттарын бекіту туралы

  title:
    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 18 января 2012 года № 104 "Об утверждении Санитарных правил "Санитарно-эпидемиологические требования к водоисточникам, местам водозабора для хозяйственно-питьевых целей, хозяйственно-питьевому водоснабжению и местам культурно-бытового водопользования и безопасности водных объектов"
    kaz: '"Су көздеріне, шаруашылық-ауыз су мақсаты үшін су жинау орындарына, шаруашылық-ауыз сумен жабдықтауға, суды мәдени-тұрмыстық пайдалану орындарына және су объектілерінің қауіпсіздігіне қойылатын санитариялық- эпидемиологиялық талаптар" санитариялық қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 18 қаңтардағы № 104 қаулысына толықтырулар енгізу туралы'

  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 23 ноября 2012 года № 1484 «Об утверждении Правил представления субъектами финансового мониторинга сведений и информации об операциях, подлежащих финансовому мониторингу, и признаков определения подозрительной операции»
    kaz: «Қаржы мониторингі субъектілерінің қаржы мониторингіне жататын операциялар туралы мәліметтер мен ақпарат беру қағидаларын және күдікті операцияны айқындау белгілерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 23 қарашадағы № 1484 қаулысына өзгерістер мен толықтырулар енгізу туралы

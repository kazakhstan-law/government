  title:
    rus: Об утверждении Типового положения о государственном органе и внесении изменений и дополнения в постановления Правительства Республики Казахстан от 30 сентября 2011 года № 1125 «Об утверждении Правил по разработке и утверждению положения о структурном подразделении государственного органа» и от 25 декабря 2012 года № 1672 «Об утверждении Инструкции по разработке и утверждению положения о государственном органе»
    kaz: Мемлекеттік орган туралы үлгі ережені бекіту және Қазақстан Республикасы Үкіметінің «Мемлекеттік органның құрылымдық бөлімшесі туралы ережені әзірлеу және бекіту жөніндегі қағиданы бекіту туралы» 2011 жылғы 30 қыркүйектегі № 1125 және «Мемлекеттік орган туралы ережені әзірлеу және бекіту жөніндегі нұсқаулықты бекіту туралы» 2012 жылғы 25 желтоқсандағы № 1672 қаулыларына өзгерістер мен толықтыру енгізу туралы

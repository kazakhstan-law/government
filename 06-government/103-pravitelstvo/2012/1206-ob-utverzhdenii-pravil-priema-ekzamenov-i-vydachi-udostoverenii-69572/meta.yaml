requisite: Постановление Правительства Республики Казахстан от 6 декабря 2012 года № 1556. Утратило силу постановлением Правительства Республики Казахстан от 31 октября 2015 года № 870
title:
  rus: Об утверждении Правил приема экзаменов и выдачи удостоверений на право управления тракторами и изготовленными на их базе самоходными шасси и механизмами, самоходными сельскохозяйственными, мелиоративными и дорожно-строительными машинами, а также специальными машинами повышенной проходимости
  kaz: Тракторларды және олардың базасында жасалған өздігінен жүретін шассилер мен механизмдерді, өздігінен жүретін ауылшаруашылық, мелиорациялық және жол құрылысы машиналарын, сондай-ақ жүріп өту мүмкіндігі жоғары арнайы машиналарды жүргізу құқығына емтихандар қабылдау және куәліктер беру қағидаларын бекіту туралы

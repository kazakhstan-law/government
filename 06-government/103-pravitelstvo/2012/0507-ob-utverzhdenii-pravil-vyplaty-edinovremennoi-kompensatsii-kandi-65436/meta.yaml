act_code: '65436'
requisite: Постановление Правительства Республики Казахстан от 7 мая 2012 года № 581. Утратило силу постановлением Правительства Республики Казахстан от 24 ноября 2015 года № 941
title:
  rus: Об утверждении Правил выплаты единовременной компенсации кандидату в космонавты, космонавту при установлении инвалидности, наступившей в результате травмы, увечья, заболевания, полученных при исполнении служебных обязанностей, а также в случае его гибели (смерти) в связи с исполнением служебных обязанностей
  kaz: Ғарышкерлікке кандидатқа, ғарышкерге қызметтiк мiндеттерiн атқару кезінде алған жарақатының, мертігуінің, ауруының салдарынан болған мүгедектік белгіленген кезде, сондай-ақ ол қызметтік міндеттерін атқаруға байланысты қаза тапқан (қайтыс болған) жағдайда, бiржолғы өтемақы төлеу қағидаларын бекіту туралы

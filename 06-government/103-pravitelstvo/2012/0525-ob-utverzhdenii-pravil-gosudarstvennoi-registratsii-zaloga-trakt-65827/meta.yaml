act_code: '65827'
requisite: Постановление Правительства Республики Казахстан от 25 мая 2012 года № 677. Утратило силу постановлением Правительства Республики Казахстан от 31 октября 2015 года № 870
title:
  rus: Об утверждении Правил государственной регистрации залога тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, специальных машин повышенной проходимости
  kaz: Тракторларды және олардың базасында жасалған өздiгiнен жүретiн шассилер мен механизмдердi, монтаждалған арнаулы жабдығы бар тiркемелердi қоса алғанда, олардың тiркемелерiн, өздiгiнен жүретiн ауылшаруашылық, мелиорациялық және жол-құрылысы машиналары мен механизмдерiн, жүрiп өту мүмкiндiгi жоғары арнайы машиналарды кепiлге қоюды мемлекеттiк тiркеу қағидаларын бекiту туралы

  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 25 мая 2012 года № 677 "Об утверждении Правил государственной регистрации залога тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, специальных машин повышенной проходимости" и от 25 мая 2012 года № 681 "Об утверждении Правил государственной регистрации тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, специальных машин повышенной проходимости"
    kaz: Қазақстан Республикасы Үкіметінің "Тракторларды және олардың базасында жасалған өздiгiнен жүретiн шассилер мен механизмдердi, монтаждалған арнаулы жабдығы бар тiркемелердi қоса алғанда, олардың тiркемелерiн, өздiгiнен жүретiн ауылшаруашылық, мелиорациялық және жол-құрылысы машиналары мен механизмдерiн, жүрiп өту мүмкiндiгi жоғары арнайы машиналарды кепiлге қоюды мемлекеттiк тiркеу қағидаларын бекiту туралы" 2012 жылғы 25 мамырдағы № 677 және "Тракторларды және олардың базасында жасалған өздiгiнен жүретiн шассилер мен механизмдердi, монтаждалған арнаулы жабдығы бар тiркемелердi қоса алғанда, олардың тiркемелерiн, өздiгiнен жүретiн ауылшаруашылық, мелиорациялық және жол-құрылысы машиналары мен механизмдерiн, жүрiп өту мүмкiндiгi жоғары арнайы машиналарды мемлекеттiк тiркеу қағидаларын бекiту туралы" 2012 жылғы 25 мамырдағы № 681 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/73573/rus

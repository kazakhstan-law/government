act_code: '67637'
requisite: Постановление Правительства Республики Казахстан от 18 сентября 2012 года № 1213
title:
  rus: Об утверждении Правил возмещения ущерба, причиненного здоровью и имуществу сотрудника или военнослужащего органов национальной безопасности, а также ущерба, причиненного здоровью и имуществу членов семьи и близких родственников сотрудника или военнослужащего органов национальной безопасности в связи с выполнением ими служебных обязанностей
  kaz: Ұлттық қауіпсіздік органдары қызметкерінің немесе әскери қызметшісінің денсаулығына және мүлкіне келтірілген залалды, сондай-ақ ұлттық қауіпсіздік органдары қызметкерінің немесе әскери қызметшісінің қызметтік міндеттерін орындауына байланысты олардың отбасы мүшелерінің және жақын туыстарының денсаулығына және мүлкіне келтірілген залалды өтеу қағидаларын бекіту туралы

  requisite: Постановление Правительства Республики Казахстан от 10 августа 2023 года № 666
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 18 сентября 2012 года № 1213 «Об утверждении Правил возмещения ущерба, причиненного здоровью и имуществу сотрудника или военнослужащего специальных государственных органов, а также ущерба, причиненного здоровью и имуществу членов семьи и близких родственников сотрудника или военнослужащего специальных государственных органов в связи с выполнением ими служебных обязанностей»
    kaz: «Арнаулы мемлекеттік органдар қызметкерінің немесе әскери қызметшісінің денсаулығына және мүлкіне келтірілген залалды, сондай-ақ арнаулы мемлекеттік органдар қызметкерінің немесе әскери қызметшісінің қызметтік міндеттерін орындауына байланысты олардың отбасы мүшелерінің және жақын туыстарының денсаулығына және мүлкіне келтірілген залалды өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 18 қыркүйектегі № 1213 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/184905/rus

requisite: Постановление Правительства Республики Казахстан от 9 августа 2012 года № 1036. Утратило силу постановлением Правительства Республики Казахстан от 25 декабря 2015 года № 1063
title:
  rus: Об утверждении Правил предоставления инновационных грантов на приобретение технологий, проведение промышленных исследований, поддержку деятельности по производству высокотехнологичной продукции на начальном этапе развития, патентование в зарубежных странах и (или) региональных патентных организациях
  kaz: Технологияларды сатып алуға, өнеркәсіптік зерттеулер жүргізуге, бастапқы даму кезеңінде жоғары технологиялық өнiм өндiру жөніндегі қызметті қолдауға, шет елдерде және (немесе) өңірлік патенттік ұйымдарда патенттеуге инновациялық гранттар беру қағидаларын бекіту туралы

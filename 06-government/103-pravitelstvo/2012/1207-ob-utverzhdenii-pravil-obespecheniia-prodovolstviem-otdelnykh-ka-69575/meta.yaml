  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 7 декабря 2012 года № 1564 "Об утверждении Правил и натуральных норм обеспечения продовольствием отдельных категорий сотрудников специальных государственных органов Республики Казахстан с учетом особенностей прохождения службы" и признании утратившим силу постановления Правительства Республики Казахстан от 17 сентября 2012 года № 1205 "Об утверждении размера денежной компенсации курсантам первых и вторых курсов специальных (военных) учебных заведений за почтовые отправления"
    kaz: '"Қазақстан Республикасының арнаулы мемлекеттік органдарының жекелеген санаттағы қызметкерлерін қызметті өткеру ерекшеліктерін ескере отырып, азық-түлікпен қамтамасыз ету қағидалары мен заттай нормаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 7 желтоқсандағы № 1564 қаулысына өзгерістер енгізу және "Арнаулы (әскери) оқу орындарының бірінші және екінші курстарының курсанттарына пошталық жөнелтілімдері үшін ақшалай өтемақының мөлшерін бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 17 қыркүйектегі № 1205 қаулысының күші жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/93212/rus

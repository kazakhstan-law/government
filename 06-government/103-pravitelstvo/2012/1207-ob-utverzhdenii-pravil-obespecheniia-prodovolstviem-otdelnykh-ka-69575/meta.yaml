title:
  rus: Об утверждении Правил обеспечения продовольствием отдельных категорий сотрудников специальных государственных органов Республики Казахстан
  kaz: Қазақстан Республикасының арнаулы мемлекеттік органдарының жекелеген санаттағы қызметкерлерін азық-түлікпен қамтамасыз ету қағидаларын бекіту туралы

    kaz: '"Арнаулы мемлекеттік органдардың қызметкерлері мен олардың отбасы мүшелеріне Қазақстан Республикасының аумағында көлікпен жол жүру және мүлікті тасымалдау шығындарын өтеу қағидалары мен нормаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 12 қазандағы № 1299 қаулысына өзгерістер енгізу туралы'

title:
  rus: Об утверждении Правил выплаты единовременной компенсации в случае гибели (смерти) сотрудника специального государственного органа Республики Казахстан, установления инвалидности или получения им увечья
  kaz: Қазақстан Республикасының арнаулы мемлекеттік органының қызметкері қаза тапқан (қайтыс болған), оған мүгедектік белгіленген немесе ол мертіккен жағдайда біржолғы өтемақы төлеу қағидаларын бекіту туралы

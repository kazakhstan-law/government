title:
  rus: Об утверждении Правил сохранения социального обеспечения, всех льгот и преимуществ при выходе на пенсию лиц, права которых иметь специальные звания и классные чины, а также носить форменную одежду упразднены
  kaz: Арнаулы атақтарды және сыныптық шендерді иелену, сондай-ақ нысанды киім киіп жүру құқықтары жойылған адамдарға зейнеткерлікке шыққан кезде әлеуметтік қамсыздандыруды, барлық жеңілдіктер мен артықшылықтарды сақтау қағидаларын бекіту туралы

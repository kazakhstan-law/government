key: P1200000148
akn: /akn/kz/act/2012-01-21/P1200000148
act_code: '63125'
requisite: Постановление Правительства Республики Казахстан от 21 января 2012 года № 148
title:
  rus: Об утверждении Правил въезда и пребывания иммигрантов в Республике Казахстан, а также их выезда из Республики Казахстан и Правил осуществления миграционного контроля, а также учета иностранцев и лиц без гражданства, незаконно пересекающих Государственную границу Республики Казахстан, незаконно пребывающих на территории Республики Казахстан, а также лиц, которым запрещен въезд на территорию Республики Казахстан
  kaz: Көшіп келушілердің Қазақстан Республикасына келуінің және онда болуының, сондай-ақ олардың Қазақстан Республикасынан кетуінің қағидаларын және Көші-қон бақылауын жүзеге асыру, сондай-ақ Қазақстан Республикасының Мемлекеттік шекарасынан заңсыз өтетін, Қазақстан Республикасының аумағында заңсыз болатын шетелдіктер мен азаматтығы жоқ адамдарды, сондай-ақ Қазақстан Республикасының аумағына келуге тыйым салынған адамдарды есепке алу қағидаларын бекіту туралы

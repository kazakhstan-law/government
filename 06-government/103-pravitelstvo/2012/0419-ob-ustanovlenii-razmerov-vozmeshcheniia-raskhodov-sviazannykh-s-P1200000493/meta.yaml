  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 19 апреля 2012 года № 493 «Об установлении размеров возмещения расходов, связанных с подготовкой к перевозке тела, перевозкой тела, погребением, изготовлением и установкой надгробного памятника военнослужащим, военнообязанным, призванным на воинские сборы, погибшим при прохождении воинской службы или умершим в результате увечья (ранения, травмы, контузии), заболевания, полученных в результате исполнения обязанностей воинской службы»
    kaz: «Әскери қызмет өткеру кезінде қаза тапқан немесе әскери қызмет міндеттерін орындау нәтижесінде алған мертігуден (жараланудан, жарақаттанудан, контузия алудан), ауырудан қайтыс болған әскери қызметшілердің, әскери жиындарға шақырылған әскери міндеттілердің мәйітін тасымалдауға дайындаумен, мәйітті тасымалдаумен, жерлеумен, құлпытасын жасаумен және орнатумен байланысты шығыстарды өтеу мөлшерін бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 19 сәуірдегі № 493 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209795/rus

title:
  rus: Об утверждении Правил выполнения гарантий государства получателям пенсионных выплат по сохранности обязательных пенсионных взносов в накопительных пенсионных фондах в размере фактически внесенных обязательных пенсионных взносов с учетом уровня инфляции на момент приобретения получателем права на пенсионные выплаты
  kaz: Зейнетақы төлемдерін алушыларға жинақтаушы зейнетақы қорларындағы міндетті зейнетақы жарналарының нақты енгізілген міндетті зейнетақы жарналары мөлшерінде сақталуы жөніндегі мемлекеттің кепілдіктерін алушының зейнетақы төлемдеріне құқықты иеленуі кезіндегі инфляцияның деңгейін ескере отырып орындау қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 5 июля 2012 года № 913 "Об утверждении Правил и условий передачи попутного газа инвесторам в рамках государственно-частного партнерства в сфере газа и газоснабжения"
    kaz: '"Газ және газбен жабдықтау саласындағы мемлекеттік-жеке меншік әріптестік шеңберінде ілеспе газды инвесторларға берудің қағидалары мен шарттарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 5 шілдедегі № 913 қаулысына өзгерістер енгізу туралы'

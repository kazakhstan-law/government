  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 7 февраля 2012 года № 211 "Об утверждении стандарта государственной услуги "Проведение регистрации и перерегистрации лиц, осуществляющих миссионерскую деятельность" и о внесении изменения в постановление Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам" и от 15 октября 2012 года № 1311 "Об утверждении стандартов государственных услуг в сфере религиозной деятельности"
    kaz: Қазақстан Республикасы Үкіметінің "Миссионерлiк қызметтi жүзеге асыратын тұлғаларды тiркеудi және қайта тiркеудi жүргiзу" мемлекеттiк қызмет стандартын бекiту және "Жеке және заңды тұлғаларға көрсетiлетiн мемлекеттiк қызметтердiң тiзiлiмiн бекiту туралы" Қазақстан Республикасы Үкiметiнiң 2010 жылғы 20 шiлдедегi № 745 қаулысына өзгерiс енгiзу туралы" 2012 жылғы 7 ақпандағы № 211 және "Дiни қызмет саласында мемлекеттiк қызмет көрсету стандарттарын бекiту туралы" 2012 жылғы 15 қазандағы № 1311 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/72517/rus

act_code: '70121'
requisite: Постановление Правительства Республики Казахстан от 4 декабря 2012 года № 1546
title:
  rus: Об утверждении Правил осуществления мониторинга эффективности управления государственным имуществом, в том числе государственными предприятиями и юридическими лицами с участием государства
  kaz: Мемлекеттік мүлікті, оның ішінде мемлекеттік кәсіпорындардың және мемлекет қатысатын заңды тұлғалардың басқару тиімділігінің мониторингін жүзеге асыру қағидаларын бекіту туралы

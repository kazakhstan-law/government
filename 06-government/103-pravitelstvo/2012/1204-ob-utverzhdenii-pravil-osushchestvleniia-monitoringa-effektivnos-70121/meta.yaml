  title:
    rus: О внесении изменений и дополнений и признании утратившими силу некоторых решений Правительства Республики Казахстан по вопросам учета государственного имущества
    kaz: Мемлекеттік мүлікті есепке алу мәселелері бойынша Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және кейбір шешімдерінің күші жойылды деп тану туралы

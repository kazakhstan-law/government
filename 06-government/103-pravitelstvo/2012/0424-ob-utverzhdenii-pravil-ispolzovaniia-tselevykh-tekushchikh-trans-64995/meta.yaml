act_code: '64995'
requisite: Постановление Правительства Республики Казахстан от 24 апреля 2012 года № 516
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета 2012 года областными бюджетами, бюджетами городов Астаны и Алматы на поддержку племенного животноводства
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне асыл тұқымды мал шаруашылығын қолдауға 2012 жылға арналған республикалық бюджеттен берiлетiн ағымдағы нысаналы трансферттердi пайдалану қағидаларын бекiту туралы

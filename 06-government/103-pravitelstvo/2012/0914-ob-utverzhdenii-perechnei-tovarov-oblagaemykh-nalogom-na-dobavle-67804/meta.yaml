title:
  rus: Об утверждении перечней товаров, облагаемых налогом на добавленную стоимость по нулевой ставке, реализуемых на территории специальной экономической зоны, полностью потребляемых при осуществлении деятельности, отвечающей целям создания специальных экономических зон
  kaz: Арнайы экономикалық аймақтарды құру мақсатына сай келетiн қызметті жүзеге асыру кезiнде толығымен тұтынылатын, арнайы экономикалық аймақтың аумағында өткiзілетін, нөлдiк мөлшерлеме бойынша қосылған құн салығы салынатын тауарлардың тiзбесiн бекiту туралы

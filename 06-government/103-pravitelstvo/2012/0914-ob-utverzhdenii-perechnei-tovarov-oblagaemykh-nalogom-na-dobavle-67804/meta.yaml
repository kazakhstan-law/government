  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 14 сентября 2012 года № 1197 «Об утверждении Перечней товаров, облагаемых налогом на добавленную стоимость по нулевой ставке, реализуемых на территории специальной экономической зоны, полностью потребляемых при осуществлении деятельности, отвечающей целям создания специальных экономических зон»
    kaz: «Арнайы экономикалық аймақтарды құру мақсатына сай келетiн қызметті жүзеге асыру кезiнде толығымен тұтынылатын тауарларды арнайы экономикалық аймақтың аумағында өткiзуге, нөлдiк мөлшерлеме бойынша қосылған құн салығы салынатын тауарлар тiзбесiн бекiту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 14 қыркүйектегі № 1197 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/105054/rus

title:
  rus: Об утверждении Условий кредитования областных бюджетов, бюджетов городов Астаны и Алматы на содействие развитию предпринимательства на селе на 2012 год в рамках Программы занятости 2020
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне Жұмыспен қамту 2020 бағдарламасы шеңберінде ауылда кәсіпкерлікті дамытуға жәрдемдесу үшін 2012 жылға кредит беру шарттарын бекіту туралы

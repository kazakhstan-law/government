  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 15 июня 1999 года № 751 "Об утверждении перечня государственных учреждений Комитета национальной безопасности Республики Казахстан, финансируемых из республиканского бюджета" и от 12 октября 2012 года № 1293 "Об утверждении перечня закрытых и обособленных военных городков, пограничных застав и комендатур, содержание жилищ и централизованное отопление в которых обеспечиваются за счет государства"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің республикалық бюджеттен қаржыландырылатын мемлекеттік мекемелерінің тізбесін бекіту туралы" 1999 жылғы 15 маусымдағы № 751 және "Тұрғын жайларды күтіп ұстау және орталықтандырылған жылыту мемлекет есебінен қамтамасыз етілетін жабық және оқшауланған әскери қалашықтардың, шекара заставалары мен комендатуралардың тізбесін бекіту туралы" 2012 жылғы 12 қазандағы № 1293 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/71503/rus

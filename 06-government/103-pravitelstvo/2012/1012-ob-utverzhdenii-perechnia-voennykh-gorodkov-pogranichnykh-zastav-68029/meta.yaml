title:
  rus: Об утверждении перечня военных городков, пограничных застав и иных закрытых объектов, содержание жилищ и централизованное отопление в которых обеспечиваются за счет государства
  kaz: Тұрғынжайларды күтіп-ұстау және орталықтандырылған жылыту мемлекет есебінен қамтамасыз етілетін әскери қалашықтардың, шекара заставалары мен өзге де жабық объектілердің тізбесін бекіту туралы

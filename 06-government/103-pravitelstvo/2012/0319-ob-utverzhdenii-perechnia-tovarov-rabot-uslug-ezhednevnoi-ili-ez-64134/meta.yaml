title:
  rus: Об утверждении перечня товаров, работ, услуг ежедневной или еженедельной потребности, приобретаемых заказчиками для обеспечения бесперебойной деятельности, а также из одного источника на период до подведения итогов конкурса либо аукциона и вступления в силу договора о государственных закупках
  kaz: Үздіксіз қызметті қамтамасыз ету үшін тапсырыс берушілер сатып алатын, сондай-ақ конкурстың немесе аукционның қорытындылары шығарылғанға және мемлекеттік сатып алу туралы шарт күшіне енгенге дейінгі кезеңге бір көзден сатып алатын күнделікті немесе апта сайынғы қажеттi тауарлардың, жұмыстардың, көрсетiлетiн қызметтердiң тiзбесiн бекiту туралы

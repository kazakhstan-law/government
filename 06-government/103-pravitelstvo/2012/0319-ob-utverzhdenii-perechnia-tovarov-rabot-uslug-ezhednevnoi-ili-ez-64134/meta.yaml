  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 19 марта 2012 года № 341 "Об утверждении перечня товаров, работ, услуг ежедневной или еженедельной потребности, приобретаемых заказчиками для обеспечения бесперебойной деятельности, а также из одного источника на период до подведения итогов конкурса и вступления в силу договора о государственных закупках"
    kaz: '"Үздіксіз қызметті қамтамасыз ету үшін тапсырыс берушілер сатып алатын, сондай-ақ конкурстың қорытындысы шығарылғанға және мемлекеттік сатып алу туралы шарт күшіне енгенге дейінгі кезеңге бір көзден сатып алатын күнделікті немесе апта сайынғы қажетті тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 19 наурыздағы № 341 қаулысына өзгерістер енгізу туралы'

  kaz: Арнаулы мемлекеттік органдардың қызметкерлеріне (арнаулы (әскери) оқу орындарының курсанттарынан, тыңдаушыларынан басқа) тұрғын үйдi ұстауға және коммуналдық қызмет көрсетулерге төлем жасауға ақшалай өтемақы төлеу қағидаларын бекіту туралы

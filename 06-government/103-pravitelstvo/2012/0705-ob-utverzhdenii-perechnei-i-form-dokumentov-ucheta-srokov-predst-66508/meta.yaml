title:
  rus: Об утверждении перечней и форм документов учета, сроков представления отчетности по вопросам соблюдения требований, предъявляемых к деятельности по оказанию услуг по складской деятельности с выдачей хлопковых расписок, ведения мониторинга хлопкового рынка
  kaz: Есеп құжаттарының тізбесі мен нысандарын, мақта қолхаттарын беру арқылы қойма қызметі бойынша қызметтер көрсету жөніндегі қызметке қойылатын талаптарды сақтау, мақта нарығының мониторингін жүргізу мәселелері бойынша есеп беру мерзімдерін бекiту туралы

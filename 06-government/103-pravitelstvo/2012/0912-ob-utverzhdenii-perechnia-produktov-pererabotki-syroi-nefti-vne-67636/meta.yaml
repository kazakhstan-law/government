act_code: '67636'
requisite: Постановление Правительства Республики Казахстан от 12 сентября 2012 года № 1191
title:
  rus: Об утверждении перечня продуктов переработки сырой нефти вне таможенной территории, при неосуществлении фактического ввоза в Республику Казахстан которых юридическое лицо не является плательщиком рентного налога на экспорт и применяется понижающий коэффициент 0,5 к установленным ставкам налога на добычу полезных ископаемых
  kaz: Қазақстан Республикасына нақты әкелу жүзеге асырылмаған кезде заңды тұлға экспортқа рента салығын төлеуші болып табылмайтын және пайдалы қазбаларды өндіруге белгіленген салық ставкаларына 0,5 төмендеткіш коэффициенті қолданылатын жағдайда шикі мұнайды кедендік аумақтан тыс өңдеу өнімдерінің тізбесін бекіту туралы

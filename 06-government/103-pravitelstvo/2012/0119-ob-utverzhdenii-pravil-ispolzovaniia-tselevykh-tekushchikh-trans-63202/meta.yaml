  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 19 января 2012 года № 115 "Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2012 год областными бюджетами, бюджетами городов Астаны и Алматы на здравоохранение"
    kaz: '"Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2012 жылға арналған республикалық бюджеттен денсаулық сақтауға берілетін нысаналы ағымдағы трансферттерді пайдалану қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2012 жылғы 19 қаңтардағы № 115 қаулысына өзгерістер мен толықтырулар енгізу туралы'

  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам" и от 22 августа 2012 года № 1068 "Об утверждении стандартов государственных услуг, оказываемых Министерством по чрезвычайным ситуациям Республики Казахстан"
    kaz: Қазақстан Республикасы Үкіметінің "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" 2010 жылғы 20 шілдедегі № 745 және "Қазақстан Республикасы Төтенше жағдайлар министрлігі көрсететін мемлекеттік қызметтердің стандарттарын бекіту туралы" 2012 жылғы 22 тамыздағы № 1068 қаулыларына өзгерістер енгізу туралы

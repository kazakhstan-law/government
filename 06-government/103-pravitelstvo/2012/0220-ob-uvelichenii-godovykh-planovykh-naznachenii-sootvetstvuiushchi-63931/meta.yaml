title:
  rus: Об увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2011 года и использовании (доиспользовании) в 2012 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2011 году
  kaz: 2011 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2011 жылы республикалық бюджеттен бөлінген нысаналы трансферттердің пайдаланылмаған (түгел пайдаланылмаған) сомасын 2012 жылы пайдалану (түгел пайдалану) туралы

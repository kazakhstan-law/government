  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 15 мая 2012 года № 620 «Об утверждении Правил организации и проведения призыва граждан Республики Казахстан на воинскую службу»
    kaz: «Қазақстан Республикасының азаматтарын әскери қызметке шақыруды ұйымдастыру мен жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 15 мамырдағы № 620 қаулысына өзгерістер мен толықтырулар енгізу туралы

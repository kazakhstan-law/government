  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 30 декабря 2009 года № 2314 "Об утверждении Правил предоставления жилищной помощи" и от 26 июня 2012 года № 856 "Об утверждении Правил постановки на учет граждан Республики Казахстан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованным местным исполнительным органом в частном жилищном фонде"
    kaz: Қазақстан Республикасы Үкіметінің "Тұрғын үй көмегін көрсету ережесін бекіту туралы" 2009 жылғы 30 желтоқсандағы № 2314 және "Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж Қазақстан Республикасының азаматтарын есепке қою қағидаларын бекіту туралы" 2012 жылғы 26 маусымдағы № 856 қаулыларына өзгерістер енгізу туралы

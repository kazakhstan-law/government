  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 26 июня 2012 года № 856 «Об утверждении Правил постановки на учет граждан Республики Казахстан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде»
    kaz: «Мемлекеттік тұрғын үй қорынан тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж Қазақстан Республикасының азаматтарын есепке қою қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 26 маусымдағы № 856 қаулысына өзгерістер енгізу туралы

title:
  rus: О некоторых вопросах консультативно-совещательных органов при Правительстве Республики Казахстан
  kaz: Қазақстан Республикасы Үкіметінің жанындағы консультативтік-кеңесші органдардың кейбiр мәселелерi туралы

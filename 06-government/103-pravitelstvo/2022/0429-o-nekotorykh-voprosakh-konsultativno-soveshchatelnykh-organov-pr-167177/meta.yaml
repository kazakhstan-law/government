  code: '184586'
  requisite: Постановление Правительства Республики Казахстан от 2 августа 2023 года № 628
  title:
    rus: О признании утратившими силу пункта 7 изменений и дополнений, которые вносятся в некоторые решения Правительства Республики Казахстан и распоряжения Премьер-Министра Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 29 апреля 2022 года № 268 «О некоторых вопросах консультативно-совещательных органов при Правительстве Республики Казахстан», и некоторых распоряжений Премьер-Министра Республики Казахстан
    kaz: «Қазақстан Республикасы Үкіметінің жанындағы консультативтік-кеңесші органдардың кейбір мәселелері туралы» Қазақстан Республикасы Үкіметінің 2022 жылғы 29 сәуірдегі № 268 қаулысымен бекітілген Қазақстан Республикасы Үкіметінің кейбір шешімдеріне және Қазақстан Республикасы Премьер-Министрінің өкімдеріне енгізілетін өзгерістер мен толықтырулардың 7-тармағының және Қазақстан Республикасы Премьер-Министрінің кейбір өкімдерінің күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/184586/rus

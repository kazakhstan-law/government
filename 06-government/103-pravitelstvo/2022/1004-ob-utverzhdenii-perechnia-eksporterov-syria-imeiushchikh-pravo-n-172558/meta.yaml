    kaz: «Гуманитарлық көмек көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2019 жылғы 8 қазандағы № 743 қаулысына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы

title:
  rus: Об утверждении перечня экспортеров сырья, имеющих право на применение упрощенного порядка возврата превышения налога на добавленную стоимость при конвертации не менее 50 процентов валютной выручки, поступившей за налоговый период
  kaz: Салықтық кезең үшін түскен валюталық түсімнің кемінде 50 пайызын айырбастаған кезде қосылған құн салығының асып кетуін қайтарудың оңайлатылған тәртібін қолдануға құқығы бар шикізат экспорттаушылардың тізбесін бекіту туралы

  requisite: Постановление Правительства Республики Казахстан от 13 мая 2024 года № 370
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 27 мая 1999 года № 659 «О передаче прав по владению и пользованию государственными пакетами акций и государственными долями в организациях, находящихся в республиканской собственности» и от 19 августа 2022 года № 581 «Некоторые вопросы Министерства просвещения Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Республикалық меншіктегі ұйымдар акцияларының мемлекеттік пакеттері мен мемлекеттік үлестеріне иелік ету және пайдалану жөніндегі құқықтарды беру туралы» 1999 жылғы 27 мамырдағы № 659 және «Қазақстан Республикасы Оқу-ағарту министрлігінің кейбір мәселелері» туралы 2022 жылғы 19 тамыздағы № 581 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/196623/rus

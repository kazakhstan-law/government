  title:
    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и признании утратившим силу постановления Правительства Республики Казахстан от 7 марта 2012 года № 297 «Об утверждении норм питания, обеспечения одеждой, обувью и мягким инвентарем несовершеннолетних, содержащихся в специальных учреждениях и организациях»
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу және «Арнаулы мекемелер мен ұйымдарда ұсталушы кәмелетке толмағандарды тамақпен, киіммен, аяқ киіммен және жұмсақ мүкәммалмен қамтамасыз ету нормаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2012 жылғы 7 наурыздағы № 297 қаулысының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/223083/rus

title:
  rus: Об установлении размера и утверждении Правил выплаты ежемесячной пожизненной стипендии академику Национальной академии наук Республики Казахстан, достигшему пенсионного возраста
  kaz: Қазақстан Республикасы Ұлттық ғылым академиясының зейнеткерлік жасқа толған академигіне өмір бойғы ай сайынғы стипендияның мөлшерін белгілеу және оны төлеу қағидаларын бекіту туралы

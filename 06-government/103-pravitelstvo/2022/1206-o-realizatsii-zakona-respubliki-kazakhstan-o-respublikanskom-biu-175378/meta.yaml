  requisite: Постановление Правительства Республики Казахстан от 28 февраля 2023 года № 166
  title:
    rus: О корректировке показателей республиканского бюджета на 2023 год, увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2022 года и использовании (доиспользовании) в 2023 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2022 году, и внесении изменений и дополнений в постановление Правительства Республики Казахстан от 6 декабря 2022 года № 987 «О реализации Закона Республики Казахстан «О республиканском бюджете на 2023 – 2025 годы»
    kaz: 2023 жылға арналған республикалық бюджеттің көрсеткіштерін түзету, 2022 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы мақсаттарын ұлғайту және 2022 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2023 жылы пайдалану (толық пайдалану) және «2023 – 2025 жылдарға арналған республикалық бюджет туралы» Қазақстан Республикасының Заңын іске асыру туралы» Қазақстан Республикасы Үкіметінің 2022 жылғы 6 желтоқсандағы № 987 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178937/rus

title:
  rus: Об утверждении перечня национальных институтов развития и иных юридических лиц, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых прямо либо косвенно принадлежат государству, уполномоченных на реализацию мер государственного стимулирования промышленности
  kaz: Өнеркәсіпті мемлекеттік ынталандыру шараларын іске асыруға уәкілеттік берілген ұлттық даму институттарының және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан көп пайызы тікелей не жанама түрде мемлекетке тиесілі өзге де заңды тұлғалардың тізбесін бекіту туралы

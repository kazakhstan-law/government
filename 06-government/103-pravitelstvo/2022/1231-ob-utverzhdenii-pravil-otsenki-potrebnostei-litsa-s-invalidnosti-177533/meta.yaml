title:
  rus: Об утверждении Правил оценки потребностей лица с инвалидностью согласно классификатору технических вспомогательных (компенсаторных) средств, специальных средств передвижения и услуг, предоставляемых лицам с инвалидностью
  kaz: Мүгедектігі бар адамдарға берілетін техникалық көмекші (орнын толтырушы) құралдардың, арнаулы жүріп-тұру құралдарының және көрсетілетін қызметтердің сыныптауышына сәйкес мүгедектігі бар адамның қажеттіліктерін бағалау қағидаларын бекіту туралы

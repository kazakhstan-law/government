act_code: '175581'
requisite: Постановление Правительства Республики Казахстан от 19 декабря 2022 года № 1024
title:
  rus: Об утверждении Правил возмещения ущерба, причиненного здоровью и имуществу сотрудника правоохранительного органа, органа гражданской защиты, государственной фельдъегерской службы Республики Казахстан, а также ущерба, причиненного здоровью и имуществу членов семьи и близких родственников сотрудника правоохранительного органа, органа гражданской защиты, государственной фельдъегерской службы Республики Казахстан в связи с исполнением им служебных обязанностей
  kaz: Қазақстан Республикасының құқық қорғау органы, азаматтық қорғау органы, мемлекеттік фельдъегерлік қызметі қызметкерiнiң денсаулығы мен мүлкiне келтiрiлген залалды, сондай-ақ Қазақстан Республикасының құқық қорғау органы, азаматтық қорғау органы, мемлекеттік фельдъегерлік қызметі қызметкерiнiң қызметтiк мiндеттерiн атқаруына байланысты оның отбасы мүшелерi мен жақын туыстарының денсаулығы мен мүлкiне келтiрiлген залалды өтеу қағидаларын бекiту туралы

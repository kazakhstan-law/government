act_code: '164919'
requisite: Постановление Правительства Республики Казахстан от 2 марта 2022 года № 98
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2022 год областными бюджетами, бюджетами городов республиканского значения, столицы на обеспечение прав и улучшение качества жизни инвалидов в Республике Казахстан и услуги по замене и настройке речевых процессоров к кохлеарным имплантам
  kaz: Облыстық бюджеттердің, республикалық маңызы бар қалалар, астана бюджеттерінің Қазақстан Республикасында мүгедектердің құқықтарын қамтамасыз етуге және өмір сүру сапасын жақсартуға және кохлеарлық импланттарға сөйлеу процессорларын ауыстыру және теңшеу жөніндегі көрсетілетін қызметтерге 2022 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалануы қағидалары

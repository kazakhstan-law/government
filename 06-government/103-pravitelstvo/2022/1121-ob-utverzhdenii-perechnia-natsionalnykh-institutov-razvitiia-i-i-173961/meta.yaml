caused_by:
  code: '186296'
  requisite: Постановление Правительства Республики Казахстан от 19 сентября 2023 года № 812
  title:
    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 21 ноября 2022 года № 932 «Об утверждении перечня национальных институтов развития и иных юридических лиц, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых прямо либо косвенно принадлежат государству, единого оператора по продвижению несырьевого экспорта, уполномоченного на реализацию мер государственного стимулирования промышленности»
    kaz: «Өнеркәсіпті мемлекеттік ынталандыру шараларын іске асыруға уәкілеттік берілген ұлттық даму институттарының және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан да көп пайызы тікелей не жанама түрде мемлекетке тиесілі өзге де заңды тұлғалардың, шикізаттық емес экспортты ілгерілету жөніндегі бірыңғай оператордың тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2022 жылғы 21 қарашадағы № 932 қаулысына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/186296/rus

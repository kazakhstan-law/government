act_code: '167933'
requisite: Постановление Правительства Республики Казахстан от 20 мая 2022 года № 321
title:
  rus: Об определении национального института развития в области инновационного развития и перечня иных юридических лиц, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых прямо либо косвенно принадлежат государству, уполномоченных на реализацию мер государственной поддержки инновационной деятельности
  kaz: Инновациялық даму саласындағы ұлттық даму институтын және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан көп пайызы тікелей не жанама түрде мемлекетке тиесілі, инновациялық қызметті мемлекеттік қолдау шараларын іске асыруға уәкілеттік берілген өзге де заңды тұлғалардың тізбесін айқындау туралы

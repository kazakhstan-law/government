title:
  rus: О некоторых вопросах реализации Указа Президента Республики Казахстан от 13 апреля 2022 года № 872 «О мерах по дебюрократизации деятельности государственного аппарата»
  kaz: Мемлекеттік аппараттың қызметін бюрократиядан арылту жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2022 жылғы 13 сәуірдегі № 872 Жарлығын іске асырудың кейбір мәселелері туралы

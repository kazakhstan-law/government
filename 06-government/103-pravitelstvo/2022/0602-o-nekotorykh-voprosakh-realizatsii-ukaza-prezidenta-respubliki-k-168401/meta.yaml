  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 6 октября 2016 года № 569 «Об утверждении Правил разработки, согласования проектов подзаконных нормативных правовых актов» и от 2 июня 2022 года № 355 «О некоторых вопросах реализации Указа Президента Республики Казахстан от 13 апреля 2022 года № 872 «О мерах по дебюрократизации деятельности государственного аппарата»
    kaz: Қазақстан Республикасы Үкіметінің «Заңға тәуелді нормативтік құқықтық актілердің жобаларын әзірлеу, келісу қағидаларын бекіту туралы» 2016 жылғы 6 қазандағы № 569 және «Мемлекеттік аппараттың қызметін бюрократиядан арылту жөніндегі шаралар туралы» Қазақстан Республикасы Президентінің 2022 жылғы 13 сәуірдегі № 872 Жарлығын іске асырудың кейбір мәселелері туралы» 2022 жылғы 2 маусымдағы № 355 қаулыларына өзгерістер енгізу туралы

act_code: '164972'
requisite: Постановление Правительства Республики Казахстан от 3 марта 2022 года № 107
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областным бюджетам, бюджетам городов республиканского значения, столицы на повышение заработной платы работников организаций в области здравоохранения местных исполнительных органов на 2022 год
  kaz: Облыстық бюджеттерге, республикалық маңызы бар қалалардың, астананың бюджеттеріне жергілікті атқарушы органдардың денсаулық сақтау саласындағы ұйымдары қызметкерлерінің жалақысын көтеруге берілетін 2022 жылға арналған ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

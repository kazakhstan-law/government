  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 30 июня 2022 года № 453 «Об утверждении Правил определения государственного предприятия, акционерного общества, товарищества с ограниченной ответственностью субъектом специального права»
    kaz: «Мемлекеттік кәсіпорынды, акционерлік қоғамды, жауапкершілігі шектеулі серіктестікті арнайы құқық субъектісі ретінде айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2022 жылғы 30 маусымдағы № 453 қаулысына өзгерістер енгізу туралы

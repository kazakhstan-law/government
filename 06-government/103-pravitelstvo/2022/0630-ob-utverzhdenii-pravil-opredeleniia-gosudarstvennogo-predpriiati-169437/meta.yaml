act_code: '169437'
requisite: Постановление Правительства Республики Казахстан от 30 июня 2022 года № 453
title:
  rus: Об утверждении Правил определения государственного предприятия, акционерного общества, товарищества с ограниченной ответственностью, сто процентов акций (долей участия в уставном капитале) которых прямо или косвенно принадлежат государству, субъектом специального права
  kaz: Мемлекеттік кәсіпорынды, акцияларының (жарғылық капиталға қатысу үлестерінің) жүз пайызы тікелей немесе жанама түрде мемлекетке тиесілі акционерлік қоғамды, жауапкершілігі шектеулі серіктестікті арнайы құқық субъектісі ретінде айқындау қағидаларын бекіту туралы

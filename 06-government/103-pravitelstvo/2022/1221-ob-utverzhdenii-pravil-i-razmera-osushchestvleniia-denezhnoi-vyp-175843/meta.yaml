act_code: '175843'
requisite: Постановление Правительства Республики Казахстан от 21 декабря 2022 года № 1047
title:
  rus: Об утверждении Правил и размера осуществления денежной выплаты сотрудникам правоохранительных органов, органов гражданской защиты, государственной фельдъегерской службы, курсантам, слушателям, сотрудникам специальных государственных органов, военнослужащим, уволенным по состоянию здоровья в результате увечья (травмы, ранения, контузии), полученного при исполнении служебных обязанностей (обязанностей воинской службы)
  kaz: Қызметтік міндеттерін (әскери қызмет міндеттерін) атқару кезінде мертігуі (жарақаттануы, жаралануы, контузия алуы) салдарынан денсаулық жағдайы бойынша қызметтен шығарылған құқық қорғау органдарының, азаматтық қорғау органдарының, мемлекеттік фельдъегерлік қызметтің қызметкерлеріне, арнаулы мемлекеттік органдардың курсанттарына, тыңдаушыларына, қызметкерлеріне, әскери қызметшілерге ақшалай төлемді жүзеге асыру қағидалары мен мөлшерін бекіту туралы

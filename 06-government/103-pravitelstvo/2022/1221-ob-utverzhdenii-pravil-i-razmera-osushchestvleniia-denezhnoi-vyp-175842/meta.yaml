  requisite: Постановление Правительства Республики Казахстан от 9 октября 2025 года № 837
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 20 октября 2011 года № 1192 «Некоторые вопросы реализации Закона Республики Казахстан «О правоохранительной службе» и от 21 декабря 2022 года № 1048 «Об утверждении Правил и размера осуществления денежной выплаты членам семьи погибшего (умершего) сотрудника правоохранительного органа, органа гражданской защиты, государственной фельдъегерской службы, курсанта, слушателя, сотрудника специального государственного органа, военнослужащего, проходившего воинскую службу по контракту, военнослужащего срочной службы, курсанта, кадета, военнообязанного, призванного на воинские сборы, военнослужащего, проходившего воинскую службу в резерве в периоды нахождения на занятиях или сборах по боевой подготовке, сборах при кризисных ситуациях, в результате увечья (травмы, ранения, контузии), полученного при исполнении служебных обязанностей (обязанностей воинской службы), в периоды нахождения на занятиях или сборах по боевой подготовке, сборах при кризисных ситуациях»
    kaz: Қазақстан Республикасы Үкіметінің «Құқық қорғау қызметі туралы» Қазақстан Республикасының Заңын іске асырудың кейбір мәселелері» туралы 2011 жылғы 20 қазандағы № 1192 және «Қызметтік міндеттерін (әскери қызмет міндеттерін) атқару кезінде мертігуі (жарақаттануы, жаралануы, контузия алуы) салдарынан қаза тапқан (қайтыс болған) құқық қорғау органы, азаматтық қорғау органы, мемлекеттік фельдъегерлік қызмет қызметкерінің, арнаулы мемлекеттік орган курсантының, тыңдаушысының, қызметкерінің, келісімшарт бойынша әскери қызмет өткерген әскери қызметшінің, мерзімді қызмет әскери қызметшісінің, курсанттың, кадеттің, әскери жиынға шақырылған әскери міндеттінің, жауынгерлік даярлық бойынша сабақтарда немесе жиындарда, дағдарыстық ахуалдар кезіндегі жиындарда болған кезеңде резервте әскери қызмет өткеріп жүрген әскери қызметшінің отбасы мүшелеріне ақшалай төлемді жүзеге асыру қағидалары мен мөлшерін бекіту туралы» 2022 жылғы 21 желтоқсандағы № 1048 қаулыларына өзгерістер мен толықтырулар енгізу туралы

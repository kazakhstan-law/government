act_code: '175842'
requisite: Постановление Правительства Республики Казахстан от 21 декабря 2022 года № 1048
title:
  rus: Об утверждении Правил и размера осуществления денежной выплаты членам семьи погибшего (умершего) сотрудника правоохранительного органа, органа гражданской защиты, государственной фельдъегерской службы, курсанта, слушателя, сотрудника специального государственного органа, военнослужащего, проходившего воинскую службу по контракту, военнослужащего срочной службы, курсанта, кадета, военнообязанного, призванного на воинские сборы, военнослужащего, проходившего воинскую службу в резерве в периоды нахождения на занятиях или сборах по боевой подготовке, сборах при кризисных ситуациях, в результате увечья (травмы, ранения, контузии), полученного при исполнении служебных обязанностей (обязанностей воинской службы), в периоды нахождения на занятиях или сборах по боевой подготовке, сборах при кризисных ситуациях
  kaz: Қызметтік міндеттерін (әскери қызмет міндеттерін) атқару кезінде мертігуі (жарақаттануы, жаралануы, контузия алуы) салдарынан қаза тапқан (қайтыс болған) құқық қорғау органы, азаматтық қорғау органы, мемлекеттік фельдъегерлік қызмет қызметкерінің, арнаулы мемлекеттік орган курсантының, тыңдаушысының, қызметкерінің, келісімшарт бойынша әскери қызмет өткерген әскери қызметшінің, мерзімді қызмет әскери қызметшісінің, курсанттың, кадеттің, әскери жиынға шақырылған әскери міндеттінің, жауынгерлік даярлық бойынша сабақтарда немесе жиындарда, дағдарыстық ахуалдар кезіндегі жиындарда болған кезеңде резервте әскери қызмет өткеріп жүрген әскери қызметшінің отбасы мүшелеріне ақшалай төлемді жүзеге асыру қағидалары мен мөлшерін бекіту туралы

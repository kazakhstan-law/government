act_code: '169161'
requisite: Постановление Правительства Республики Казахстан от 22 июня 2022 года № 412. Утратило силу постановлением Правительства Республики Казахстан от 20 июня 2023 года № 487 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил сохранения льгот на пенсионные выплаты за выслугу лет лицам, медицинские должности которых сокращены в органах внутренних дел Республики Казахстан с 1 июля 2022 года и 1 января 2023 года, имевшим на момент сокращения должности выслугу лет не менее двенадцати лет и шести месяцев непрерывной воинской службы, службы в специальных государственных и правоохранительных органах, государственной фельдъегерской службе, при условии продолжения ими работы в медицинских организациях, расположенных в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы
  kaz: Қазақстан Республикасының ішкі істер органдарындағы медициналық лауазымдары 2022 жылғы 1 шілдеден және 2023 жылғы 1 қаңтардан бастап қысқартылған, лауазымы қысқартылған кезде еңбек сіңірген жылдары үзіліссіз әскери қызметте, арнаулы мемлекеттік және құқық қорғау органдарындағы қызметте, мемлекеттік фельдъегерлік қызметте кемінде он екі жыл және алты ай болған адамдар қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде орналасқан медициналық ұйымдарда жұмысын жалғастырған жағдайда оларға еңбек сіңірген жылдары үшін зейнетақы төлемдеріне жеңілдіктерді сақтау қағидаларын бекіту туралы

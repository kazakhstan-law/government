title:
  rus: Об утверждении Положений о порядке заключения контрактов на проведение операций по недропользованию в Республике Казахстан и о порядке выдачи разрешений на передачу права недропользования в залог
  kaz: Қазақстан Республикасында жер қойнауын пайдалану жөнiнде операциялар жүргiзуге арналған келiсiм-шарттарды жасасудың тәртiбi туралы және Жер қойнауын пайдалану құқығын кепiлге беруге рұқсат берудiң тәртiбi туралы ережелердi бекiту туралы

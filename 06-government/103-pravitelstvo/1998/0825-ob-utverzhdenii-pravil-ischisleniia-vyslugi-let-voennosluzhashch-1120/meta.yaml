act_code: '1120'
requisite: Постановление Правительства Республики Казахстан от 26 августа 1998 года № 803. Утратило силу постановлением Правительства Республики Казахстан от 24 февраля 2014 года № 129
title:
  rus: Об утверждении Правил исчисления выслуги лет военнослужащим, сотрудникам правоохранительных органов, а также лицам, права которых иметь воинские или специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года, назначения и выплаты единовременных пособий
  kaz: Әскери қызметшiлерге, құқық қорғау органдарының қызметкерлеріне, сондай-ақ әскери немесе арнаулы атақтар, сыныптық шендер алу және нысанды киім киіп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдарға еңбек сіңірген жылдарын есептеу, біржолғы жәрдемақылар тағайындау және оны төлеу ережесін бекіту туралы

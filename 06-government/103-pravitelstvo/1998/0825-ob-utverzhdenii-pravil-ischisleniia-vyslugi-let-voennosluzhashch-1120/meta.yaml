  title:
    rus: О порядке прикомандирования военнослужащих, сотрудников органов внутренних дел, финансовой полиции, прокуратуры к отдельным государственным органам Республики Казахстан
    kaz: Әскери қызметшілердi, iшкі істер органдарының, қаржы полициясының, прокуратураның қызметкерлерiн Қазақстан Республикасының жекелеген мемлекеттiк органдарына іссапарға жiберу тәртiбi туралы

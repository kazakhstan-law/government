title:
  rus: Об утверждении Правил государственной регистрации нормативных правовых актов центральных исполнительных и иных центральных государственных органов как входящих, так и не входящих в состав Правительства Республики Казахстан, и актов местных представительных и исполнительных органов Республики Казахстан
  kaz: Қазақстан Республикасының Қазақстан Республикасы Үкіметінің құрамына кіретін де, кірмейтін де орталық атқарушы және өзге де орталық мемлекеттік органдарының нормативтік құқықтық актілері мен жергілікті өкілді және атқарушы органдарының актілерін мемлекеттік тіркеудің тәртібін бекіту туралы

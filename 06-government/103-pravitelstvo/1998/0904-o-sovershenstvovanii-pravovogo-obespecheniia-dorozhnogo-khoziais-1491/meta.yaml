  title:
    rus: Об утверждении стандартов государственных услуг Министерства транспорта и коммуникаций Республики Казахстан и местных исполнительных органов в сфере автомобильных дорог и внесении изменений и дополнений в постановления Правительства Республики Казахстан от 5 сентября 1998 года № 845 "О совершенствовании правового обеспечения дорожного хозяйства" и от 20 июля 2010 года № 745 "Об утверждении реестра государственных услуг, оказываемых физическим и юридическим лицам"
    kaz: '"Қазақстан Республикасы Көлік және коммуникация министрлігі мен жергілікті атқарушы органдардың автомобиль жолдары саласындағы мемлекеттік қызмет стандарттарын бекіту және Қазақстан Республикасы Үкіметінің "Жол шаруашылығын құқықтық қамтамасыз етуді жетілдіру туралы» 1998 жылғы 5 қыркүйектегі № 845 және "Жеке және заңды тұлғаларға көрсетілетін мемлекеттік қызметтердің тізілімін бекіту туралы" 2010 жылғы 20 шілдедегі № 745 қаулыларына өзгерістер мен толықтырулар енгізу туралы'

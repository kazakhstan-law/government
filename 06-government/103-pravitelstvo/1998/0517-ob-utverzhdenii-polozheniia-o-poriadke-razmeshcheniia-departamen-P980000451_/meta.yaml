title:
  rus: Об утверждении Положения о порядке размещения Департаментом казначейства Министерства финансов Республики Казахстан временно свободных денег со счетов органов казначейства во вклады в банках Республики Казахстан
  kaz: Қазақстан Республикасы Қаржы министрлiгi Қазынашылық департаментiнiң қазынашылық органдарының шоттарынан уақытша бос ақшаны Қазақстан Республикасының банктерiндегi салымдарға орналастыруының тәртiбi туралы ереженi бекiту туралы

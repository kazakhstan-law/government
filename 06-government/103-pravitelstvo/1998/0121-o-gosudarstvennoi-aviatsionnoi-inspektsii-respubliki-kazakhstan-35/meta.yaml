title:
  rus: О Государственной авиационной инспекции Республики Казахстан по надзору за безопасностью полетов воздушных судов гражданской и экспериментальной авиации (Госавианадзор) и Государственном авиационном регистре Республики Казахстан (Госавиарегистр)
  kaz: Қазақстан Республикасының Азаматтық және эксперименттiк авиация әуе кемелерiнiң ұшу қауiпсiздiгiн қадағалау жөнiндегi мемлекеттiк авиациялық инспекциясы (Мемавиақадағалау) және Қазақстан Республикасының мемлекеттiк авиациялық регистрi (Мемавиарегистр) туралы

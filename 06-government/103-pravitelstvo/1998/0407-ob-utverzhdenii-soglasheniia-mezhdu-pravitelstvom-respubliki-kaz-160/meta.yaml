act_code: '160'
requisite: Постановление Правительства Республики Казахстан от 8 апреля 1998 года № 305
title:
  rus: Об утверждении Соглашения между Правительством Республики Казахстан, Национальным Банком Республики Казахстан и Правительством Республики Беларусь, Национальным Банком Республики Беларусь о мерах по обеспечению взаимной конвертируемости и стабилизации курсов казахстанского тенге и белорусского рубля
  kaz: Қазақстан Республикасының Үкiметi, Қазақстан Республикасының Ұлттық Банкi мен Беларусь Республикасы Үкiметiнiң, Беларусь Республикасы Ұлттық Банкiнiң арасындағы қазақстандық теңге мен беларусь рублiнiң өзара өтiмдiлiгi мен бағамдарының тұрақтылығын қамтамасыз ету жөнiндегi шаралар туралы келiсiмдi бекiту туралы

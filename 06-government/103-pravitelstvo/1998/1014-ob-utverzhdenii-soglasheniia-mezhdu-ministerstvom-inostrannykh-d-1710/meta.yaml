act_code: '1710'
requisite: Постановление Правительства Республики Казахстан от 15 октября 1998 года № 1042
title:
  rus: Об утверждении Соглашения между Министерством иностранных дел Республики Казахстан и Министерством иностранных дел Кыргызской Республики о делегировании полномочий по защите прав и интересов граждан и юридических лиц Кыргызской Республики за рубежом и выдаче виз для въезда в Кыргызскую Республику
  kaz: Қазақстан Республикасының Сыртқы істер министрлігі мен Қырғыз Республикасының Сыртқы істер министрлігі арасындағы Қырғыз Республикасының шетелдердегі азаматтары мен заңды ұйымдарының құқықтары мен мүдделерін қорғау жөніндегі және Қырғыз Республикасына келу үшін визалар беру жөніндегі өкілеттіктерін беру туралы келісімді бекіту туралы

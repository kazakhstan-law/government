title:
  rus: Об утверждении Соглашения между Министерством образования, культуры и здравоохранения Республики Казахстан и Государственным Управлением по делам туризма Китайской Народной Республики о сотрудничестве в области туризма
  kaz: Қазақстан Республикасының Бiлiм, мәдениет және денсаулық сақтау министрлiгi мен Қытай Халық Республикасы Туризм iстерi жөнiндегi мемлекеттiк басқармасы арасындағы туризм саласы бойынша ынтымақтастық туралы келiсiмдi бекiту туралы

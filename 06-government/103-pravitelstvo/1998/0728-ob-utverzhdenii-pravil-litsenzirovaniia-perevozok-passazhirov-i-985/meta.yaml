    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан по вопросам лицензирования деятельности на транспорте в Республике Казахстан
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне Қазақстан Республикасында көліктегі қызметті лицензиялау мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы

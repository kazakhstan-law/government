act_code: '106'
requisite: Постановление Правительства Республики Казахстан от 11 марта 1998 года № 198
title:
  rus: Об утверждении Порядка государственной регистрации начинающихся, продолжающихся и законченных научно-исследовательских, опытно-конструкторских и проектно-технологических работ, содержащих сведения, составляющие государственные секреты, проводимых в Республике Казахстан
  kaz: Қазақстан Республикасында жүргiзiлетiн, басталған, жалғастырылып жатқан және аяқталған мемлекеттiк құпиялардан тұратын мәлiметтерi бар ғылыми-зерттеу, тәжiрибе-конструкторлық және жобалау-технологиялық жұмыстарды мемлекеттiк тiркеудiң тәртiбiн бекiту туралы

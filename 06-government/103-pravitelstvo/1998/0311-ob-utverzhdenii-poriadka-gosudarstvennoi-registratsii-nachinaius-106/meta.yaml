  kaz: Қазақстан Республикасында жүргiзiлетiн, басталған, жалғастырылып жатқан және аяқталған мемлекеттiк құпиялардан тұратын мәлiметтерi бар ғылыми-зерттеу, тәжiрибе-конструкторлық және жобалау-технологиялық жұмыстарды мемлекеттiк тiркеудiң тәртiбiн бекiту туралы

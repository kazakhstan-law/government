  rus: Об утверждении Правил лицензирования деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов
  kaz: Заңды тұлғалардың түстi және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және сату жөнiндегi қызметiн лицензиялаудың Тәртiбiн бекiту туралы

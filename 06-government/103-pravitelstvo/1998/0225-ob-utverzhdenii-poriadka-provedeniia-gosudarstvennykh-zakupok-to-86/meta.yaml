title:
  rus: Об утверждении Порядка проведения государственных закупок товаров, работ и услуг, Положения о конкурсной комиссии по определению поставщиков товаров, работ и услуг, приобретаемых в процессе государственных закупок, и форм конкурсной документации
  kaz: Тауарларды, жұмыстарды және қызмет көрсетулердi мемлекеттiк сатып алуды жүргiзудiң тәртiбiн, Мемлекеттiк сатып алу процесiнде алынатын тауарларды, жұмыстарды және қызмет көрсетулердi берушiлердi анықтау жөнiндегi конкурстық комиссия туралы ереженi және конкурстық құжаттаманың нысандарын бекiту туралы

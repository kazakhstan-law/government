  title:
    rus: Об утверждении Правил размещения Министерством финансов Республики Казахстан временно свободных бюджетных денег со счетов органов казначейства во вклады (депозиты) в Национальном Банке Республики Казахстан
    kaz: Қазақстан Респүбликасы Қаржы министрлiгiнiң уақытша бос бюджеттiк ақшаны қазынашылық органдарының шоттарынан Қазақстан Республикасының Ұлттық Банкiндегi салымдарға (депозиттерге) орналастыруының ережесiн бекіту туралы

title:
  rus: Об утверждении формы Договора выкупа занимаемого жилища, приравненного к служебному, работником центрального аппарата государственного органа, содержащегося за счет республиканского бюджета и передислоцированного в город Астану
  kaz: Республикалық бюджет есебiнен ұсталатын және Астана қаласына қоныс аударған мемлекеттiк органның орталық аппараты қызметкерiнiң өзi тұрып жатқан қызметтiкке теңестiрiлген тұрғын үйдi сатып алу шартының нысанын бекiту туралы

act_code: '149252'
requisite: Постановление Правительства Республики Казахстан от 2 декабря 2020 года № 810
title:
  rus: О принятии государственного коммунального казенного предприятия «Государственный академический казахский музыкально-драматический театр имени К. Куанышбаева» акимата города Нур-Султана из коммунальной собственности в республиканскую собственность
  kaz: Нұр-Сұлтан қаласы әкімдігінің «Қ. Қуанышбаев атындағы мемлекеттік академиялық қазақ музыкалық драма театры» мемлекеттік коммуналдық қазыналық кәсіпорнын коммуналдық меншіктен республикалық меншікке қабылдау туралы

title:
  rus: Об отмене постановления Правительства Республики Казахстан от 26 декабря 2016 года № 851 «О реорганизации республиканского государственного казенного предприятия «Национальный научно-практический, образовательный и оздоровительный центр «Бобек» Министерства образования и науки Республики Казахстан»
  kaz: «Қазақстан Республикасы Білім және ғылым министрлігінің «Бөбек» ұлттық ғылыми-практикалық, білім беру және сауықтыру орталығы» республикалық мемлекеттік қазыналық кәсіпорнын қайта ұйымдастыру туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 26 желтоқсандағы № 851 қаулысының күшін жою туралы

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 16 июля 2002 года № 784 «О порядке решения кадровых вопросов по должностным лицам, назначаемым Правительством Республики Казахстан, Премьер-Министром Республики Казахстан, по согласованию с ним или по его представлению» и от 29 мая 2020 года № 336 «Об утверждении перечня государственных организаций высшего и (или) послевузовского образования, первые руководители которых назначаются на должности и освобождаются от должностей Правительством Республики Казахстан, правил их назначения на должности, освобождения от должностей и аттестации»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасының Үкiметi, Қазақстан Республикасының Премьер-Министрі тағайындайтын, онымен келiсу бойынша немесе оның ұсынуымен тағайындалатын лауазымды адамдар бойынша кадр мәселелерiн шешу тәртібі туралы» 2002 жылғы 16 шілдедегі № 784 және «Бірінші басшыларын Қазақстан Республикасының Үкіметі лауазымға тағайындайтын және лауазымынан босататын мемлекеттік жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының тізбесін және оларды лауазымға тағайындау, лауазымынан босату және аттестаттау қағидаларын бекіту туралы» 2020 жылғы 29 мамырдағы № 336 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/158943/rus

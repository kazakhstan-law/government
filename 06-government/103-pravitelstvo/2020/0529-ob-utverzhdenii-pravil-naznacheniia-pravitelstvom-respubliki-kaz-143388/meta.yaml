title:
  rus: Об утверждении Правил назначения Правительством Республики Казахстан на должности, освобождения от должностей и аттестации первых руководителей отдельных государственных организаций высшего и (или) послевузовского образования
  kaz: Жекелеген мемлекеттік жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының Қазақстан Республикасының Үкіметі тағайындайтын бірінші басшыларын лауазымға тағайындау, лауазымынан босату және аттестаттау қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 29 мая 2020 года № 336 «Об утверждении перечня государственных организаций высшего и (или) послевузовского образования, первые руководители которых назначаются на должности и освобождаются от должностей Правительством Республики Казахстан, правил их назначения на должности, освобождения от должностей и аттестации»
    kaz: «Бірінші басшыларын Қазақстан Республикасының Үкіметі лауазымға тағайындайтын және лауазымынан босататын мемлекеттік жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының тізбесін және оларды лауазымға тағайындау, лауазымынан босату және аттестаттау қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2020 жылғы 29 мамырдағы № 336 қаулысына өзгерістер енгізу туралы

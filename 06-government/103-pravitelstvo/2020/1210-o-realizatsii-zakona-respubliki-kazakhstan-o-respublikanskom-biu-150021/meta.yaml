  requisite: Постановление Правительства Республики Казахстан от 23 февраля 2021 года № 84
  title:
    rus: О корректировке показателей республиканского бюджета на 2021 год, увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2020 года и использовании (доиспользовании) в 2021 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2020 году, и внесении изменений и дополнений в постановление Правительства Республики Казахстан от 10 декабря 2020 года № 840 «О реализации Закона Республики Казахстан «О республиканском бюджете на 2021 – 2023 годы»
    kaz: 2021 жылға арналған республикалық бюджеттің көрсеткіштерін түзету, 2020 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2020 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2021 жылы пайдалану (толық пайдалану) және «2021 – 2023 жылдарға арналған республикалық бюджет туралы» Қазақстан Республикасының Заңын іске асыру туралы» Қазақстан Республикасы Үкіметінің 2020 жылғы 10 желтоқсандағы № 840 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/153120/rus

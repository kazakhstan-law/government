title:
  rus: Об утверждении основных условий кредитования областных бюджетов, бюджетов городов республиканского значения, столицы на содействие развитию предпринимательства в областных центрах, городах Нур-Султане, Алматы, Шымкенте, Семее и моногородах на 2020 год
  kaz: Облыстық бюджеттерге, республикалық маңызы бар қалалардың, астананың бюджеттерiне облыс орталықтарында, Нұр-Сұлтан, Алматы, Шымкент, Семей қалаларында және моноқалаларда кәсіпкерлікті дамытуға жәрдемдесуге 2020 жылға кредит берудің негізгі шарттарын бекіту туралы

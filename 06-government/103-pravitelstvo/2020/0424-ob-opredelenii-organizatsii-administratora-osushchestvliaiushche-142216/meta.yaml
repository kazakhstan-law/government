act_code: '142216'
requisite: Постановление Правительства Республики Казахстан от 24 апреля 2020 года № 248. Утратил силу постановлением Правительства Республики Казахстан от 8 сентября 2023 года № 775 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении организации (администратора), осуществляющей мероприятия по награждению детей и молодежи в возрасте от четырнадцати до двадцати девяти лет знаком отличия за проявленный патриотизм и активную гражданскую позицию
  kaz: Он төрт жастан жиырма тоғыз жасқа дейінгі балалар мен жастарды патриоттық танытқаны және белсенді азаматтық ұстанымы үшін ерекшелік белгісімен наградтау жөніндегі іс-шараларды жүзеге асыратын ұйымды (әкімшіні) айқындау туралы

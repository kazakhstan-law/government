act_code: '140765'
requisite: Постановление Правительства Республики Казахстан от 27 марта 2020 года № 153. Утратило силу постановлением Правительства Республики Казахстан от 11 августа 2023 года № 670 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выплат денежных поощрений чемпионам и призерам международных спортивных соревнований, тренерам и членам сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта) и их возврата
  kaz: Халықаралық спорттық жарыстардың чемпиондары мен жүлдегерлеріне, жаттықтырушыларға және спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) мүшелеріне ақшалай көтермелеуді төлеу және оны қайтару қағидаларын бекіту туралы

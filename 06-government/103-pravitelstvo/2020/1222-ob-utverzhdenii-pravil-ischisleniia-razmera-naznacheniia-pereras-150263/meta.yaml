act_code: '150263'
requisite: Постановление Правительства Республики Казахстан от 22 декабря 2020 года № 872. Утратило силу постановлением Правительства Республики Казахстан от 11 июня 2026 года № 487 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил исчисления размера, назначения, перерасчета, осуществления, прекращения, приостановления и возобновления жилищных выплат сотрудникам оперативно-следственных подразделений уполномоченного органа по противодействию коррупции
  kaz: Сыбайлас жемқорлыққа қарсы іс-қимыл жөніндегі уәкілетті органның жедел-тергеу бөлімшелерінің қызметкерлеріне тұрғын үй төлемдерінің мөлшерін есептеу, оларды тағайындау, қайта есептеу, жүзеге асыру, тоқтату, тоқтата тұру және қайта бастау қағидаларын бекіту туралы

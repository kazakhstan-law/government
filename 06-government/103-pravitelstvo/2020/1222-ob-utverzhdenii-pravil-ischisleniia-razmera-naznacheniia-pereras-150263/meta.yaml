  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 22 декабря 2020 года № 872 «Об утверждении Правил исчисления размера, назначения, перерасчета, осуществления, прекращения, приостановления и возобновления жилищных выплат сотрудникам оперативно-следственных подразделений уполномоченного органа по противодействию коррупции»
    kaz: «Сыбайлас жемқорлыққа қарсы іс-қимыл жөніндегі уәкілетті органның жедел-тергеу бөлімшелерінің қызметкерлеріне тұрғын үй төлемдерінің мөлшерін есептеу, оларды тағайындау, қайта есептеу, жүзеге асыру, тоқтату, тоқтата тұру және қайта бастау қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2020 жылғы 22 желтоқсандағы № 872 қаулысына өзгерістер мен толықтырулар енгізу туралы

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 8 сентября 2020 года № 560 «Об утверждении Типового положения об отделах по контролю за рассмотрением обращений аппаратов акимов областей, городов республиканского значения и столицы»
    kaz: «Облыстардың, республикалық маңызы бар қалалардың және астананың әкімдері аппараттарының жолданымдарды қарауды бақылау бөлімдері туралы үлгілік ережені бекіту туралы» Қазақстан Республикасы Үкіметінің 2020 жылғы 8 қыркүйектегі № 560 қаулысына өзгерістер енгізу туралы

act_code: '142343'
requisite: Постановление Правительства Республики Казахстан от 29 апреля 2020 года № 257
title:
  rus: Об утверждении Соглашения в форме обмена письмами между Правительством Республики Казахстан и структурой Организации Объединенных Наций по вопросам гендерного равенства и расширения прав и возможностей женщин «ООН-Женщины» относительно правового статуса странового офиса «ООН-Женщины» в Республике Казахстан
  kaz: Қазақстан Республикасының Үкіметі мен Біріккен Ұлттар Ұйымының «БҰҰ-Әйелдер» гендерлік теңдік және әйелдердің құқықтары мен мүмкіндіктерін кеңейту мәселелері жөніндегі құрылымы арасындағы «БҰҰ-Әйелдер» елдік офисінің Қазақстан Республикасындағы құқықтық мәртебесіне қатысты хаттармен алмасу нысанындағы келісімді бекіту туралы

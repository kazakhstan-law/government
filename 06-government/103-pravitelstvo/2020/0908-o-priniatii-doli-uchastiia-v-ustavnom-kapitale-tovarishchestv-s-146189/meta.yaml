title:
  rus: О принятии доли участия в уставном капитале товариществ с ограниченной ответственностью «Казахский научно-исследовательский институт водного хозяйства» и «Научно-производственный центр рыбного хозяйства» из частной собственности в республиканскую собственность по договору дарения
  kaz: «Қазақ су шаруашылығы ғылыми-зерттеу институты» және «Балық шаруашылығы ғылыми-өндірістік орталығы» жауапкершілігі шектеулі серіктестіктерінің жарғылық капиталдарына қатысу үлестерін cыйға тарту шарты бойынша жеке меншіктен республикалық меншікке қабылдау туралы

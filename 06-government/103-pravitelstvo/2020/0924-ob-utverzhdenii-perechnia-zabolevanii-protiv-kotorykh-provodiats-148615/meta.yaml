  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 24 сентября 2020 года № 612 «Об утверждении перечня заболеваний, против которых проводятся обязательные профилактические прививки в рамках гарантированного объема медицинской помощи, правил, сроков их проведения и групп населения, подлежащих профилактическим прививкам»
    kaz: «Медициналық көмектің кепілдік берілген көлемі шеңберінде оларға қарсы міндетті профилактикалық екпелер жүргізілетін аурулардың тізбесін, екпелерді жүргізу қағидаларын, мерзімдерін және халықтың профилактикалық екпелерге жататын топтарын бекіту туралы» Қазақстан Республикасы Үкіметінің 2020 жылғы 24 қыркүйектегі № 612 қаулысына өзгерістер енгізу туралы

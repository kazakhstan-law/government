act_code: '146928'
requisite: Постановление Правительства Республики Казахстан от 30 сентября 2020 года № 623. Утратило силу постановлением Правительства Республики Казахстан от 3 августа 2023 года № 638 (вводится в действие со дня его подписания)
title:
  rus: Об определении предельного размера стоимости контрольного (идентификационного) знака, средства идентификации, применяемых в маркировке табачных изделий, изделий с нагреваемым табаком, никотиносодержащих жидкостей для использования в электронных сигаретах
  kaz: Темекі өнімдерін, қыздырылатын темекісі бар бұйымдарды, электрондық сигареттерде пайдалануға арналған құрамында никотині бар сұйықтықты таңбалау таңбалауда қолданылатын бақылау (сәйкестендіру) белгісі, сәйкестендіру құралдары құнының шекті мөлшерін айқындау туралы

act_code: '140268'
requisite: Постановление Правительства Республики Казахстан от 16 марта 2020 года № 115
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов областными бюджетами, бюджетами городов республиканского значения, столицы на проведение праздничных мероприятий, посвященных 75-летию Победы в Великой Отечественной войне
  kaz: Облыстық бюджеттердің, республикалық маңызы бар қалалардың, астана бюджеттерінің Ұлы Отан соғысындағы Жеңістің 75 жылдығына арналған мерекелік іс-шараларды өткізуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

act_code: '140270'
requisite: Постановление Правительства Республики Казахстан от 16 марта 2020 года № 116
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2020 год областными бюджетами, бюджетами городов республиканского значения, столицы на обеспечение прав, улучшение качества жизни инвалидов в Республике Казахстан и услуги по замене и настройке речевых процессоров к кохлеарным имплантам
  kaz: Облыстық бюджеттердің, республикалық маңызы бар қалалардың, астана бюджеттерінің Қазақстан Республикасында мүгедектердің құқықтарын қамтамасыз етуге және өмір сүру сапасын жақсартуға және кохлеарлық импланттарға сөйлеу процессорларын ауыстыру және теңшеу жөніндегі көрсетілетін қызметтерге 2020 жылға арналған республикалық бюджеттен берілетін ағымдағы нысаналы трансферттерді пайдалануы қағидаларын бекіту туралы

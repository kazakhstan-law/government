caused_by:
  code: '179212'
  requisite: Постановление Правительства Республики Казахстан от 15 марта 2023 года № 214
  title:
    rus: Об утверждении Типового регламента личного приема физических лиц и представителей юридических лиц должностными лицами центральных государственных органов и аппаратов акимов областей, городов республиканского значения, столицы, внесении изменений в постановление Правительства Республики Казахстан от 8 сентября 2020 года № 560 «Об утверждении Типового регламента личного приема физических лиц и представителей юридических лиц должностными лицами аппаратов акимов областей, городов республиканского значения и столицы и Типового положения об отделах по контролю за рассмотрением обращений аппаратов акимов областей, городов республиканского значения и столицы» и признании утратившими силу некоторых решений Правительства Республики Казахстан
    kaz: Орталық мемлекеттік органдардың және облыстардың, республикалық маңызы бар қалалардың, астананың әкімдері аппараттарының лауазымды адамдарының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдауының үлгілік регламентін бекіту, «Облыстардың, республикалық маңызы бар қалалардың және астананың әкімдері аппараттарының лауазымды адамдарының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдауының үлгілік регламенті мен Облыстардың, республикалық маңызы бар қалалардың және астананың әкімдері аппараттарының өтініштерді қарауды бақылау бөлімдері туралы үлгілік ережені бекіту туралы» Қазақстан Республикасы Үкіметінің 2020 жылғы 8 қыркүйектегі № 560 қаулысына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/179212/rus

act_code: '139284'
requisite: Постановление Правительства Республики Казахстан от 31 января 2020 года № 26
title:
  rus: Об отмене постановлений Правительства Республики Казахстан от 22 декабря 2008 года № 1196 «О создании Республиканского государственного казенного предприятия «Межрегиональный профессиональный центр по подготовке и переподготовке кадров технического и обслуживающего труда для машиностроительной отрасли» Министерства образования и науки Республики Казахстан» и от 6 сентября 2010 года № 900 «О создании государственного учреждения «Карагандинская республиканская специальная школа-интернат для детей с нарушением зрения»
  kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Білім және ғылым министрлігінің «Машина жасау саласына арналған техникалық және қызмет көрсету еңбегінің кадрларын даярлау және қайта даярлау жөніндегі өңіраралық кәсіптік орталық» республикалық мемлекеттік қазыналық кәсіпорнын құру туралы» 2008 жылғы 22 желтоқсандағы № 1196 және «Көру қабілеті бұзылған балаларға арналған Қарағанды республикалық арнайы мектеп-интернаты» мемлекеттік мекемесін құру туралы» 2010 жылғы 6 қыркүйектегі № 900 қаулыларының күшін жою туралы

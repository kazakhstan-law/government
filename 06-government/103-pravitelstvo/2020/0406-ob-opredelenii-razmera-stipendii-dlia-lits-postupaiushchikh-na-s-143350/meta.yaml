title:
  rus: Об определении размера стипендии для лиц, поступающих на службу в органы прокуратуры, антикоррупционную службу и службу экономических расследований и проходящих первоначальную профессиональную подготовку в организациях образования правоохранительных органов
  kaz: Прокуратура органдарына қызметке, сыбайлас жемқорлыққа қарсы қызметке және экономикалық тергеп-тексеру қызметіне кіретін және құқық қорғау органдарының білім беру ұйымдарында алғашқы кәсіби даярлықтан өтетін адамдар үшін стипендияның мөлшерін айқындау туралы

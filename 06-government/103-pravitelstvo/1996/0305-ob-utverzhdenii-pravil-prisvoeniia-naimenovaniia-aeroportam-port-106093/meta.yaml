  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 5 марта 1996 года № 281 «Об утверждении Правил присвоения наименования аэропортам, портам, железнодорожным вокзалам, железнодорожным станциям, станциям метрополитена, автовокзалам, автостанциям, физико-географическим и другим объектам государственной собственности на территории Республики Казахстан, а также переименования, уточнения и изменения транскрипции их наименований и присвоения собственных имен лиц государственным юридическим лицам, юридическим лицам с участием государства»
    kaz: «Қазақстан Республикасының аумағындағы әуежайларға, порттарға, теміржол вокзалдарына, теміржол стансаларына, метрополитен стансаларына, автовокзалдарға, автостансаларға, физикалық-географиялық және мемлекет меншігіндегі басқа да объектілерге атау беру, сондай-ақ оларды қайта атау, олардың атауларының транскрипциясын нақтылау мен өзгерту және мемлекеттік заңды тұлғаларға, мемлекет қатысатын заңды тұлғаларға жеке адамдардың есімін беру қағидаларын бекіту туралы» Қазақстан Республикасы Үкiметiнiң 1996 жылғы 5 наурыздағы № 281 қаулысына өзгерістер мен толықтыру енгізу туралы

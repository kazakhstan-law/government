caused_by:
  code: '72405'
  requisite: Постановление Правительства Республики Казахстан от 24 апреля 2013 года № 395
  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 5 марта 1996 года № 281 "Об утверждении Порядка наименования и переименования организаций, железнодорожных станций, аэропортов, а также физико-географических объектов Республики Казахстан и изменении транскрипции их названий"
    kaz: '"Қазақстан Республикасындағы ұйымдарды, темiр жол станцияларын, әуежайларды, сондай-ақ физикалық-географиялық объектiлердi атау мен қайта атаудың және олардың атауларының транскрипциясын өзгертудiң Тәртібін бекіту туралы" Қазақстан Республикасы Үкіметінің 1996 жылғы 5 наурыздағы № 281 қаулысына өзгерістер енгізу туралы'

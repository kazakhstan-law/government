act_code: '2936'
requisite: Постановление Правительства Республики Казахстан от 26 сентября 1996 г. N 1175. Утратило силу - постановлением Правительства РК от 22 мая 1999 г. N 620 ~P990620.
title:
  rus: Об утверждении Положения о порядке изменения, восстановления и аннулирования записей актов гражданского состояния и сроках хранения книг регистрации актов гражданского состояния и о порядке рассмотрения ходатайств о перемене гражданами Республики Казахстан фамилий, имен и отчеств
  kaz: Азаматтық хал актiлерiнiң жазбаларын өзгерту, қалпына келтiру мен жою тәртiбi және азаматтық хал актiлерiн тiркеу кiтаптарын сақтау мерзiмдерi туралы және Қазақстан Республикасы азаматтарының тегiн, есiмiн және әкесiнiң атын өзгерту жөнiндегi өтiнiмдердi қарау тәртiбi туралы ережелердi бекiту туралы

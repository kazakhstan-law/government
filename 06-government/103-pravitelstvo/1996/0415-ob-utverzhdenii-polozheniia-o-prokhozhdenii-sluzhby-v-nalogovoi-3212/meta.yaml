title:
  rus: Об утверждении Положения о прохождении службы в налоговой полиции налоговой службы Министерства финансов Республики Казахстан
  kaz: Қазақстан Республикасы Қаржы министрлiгiнiң салық қызметiнiң салық полициясында қызмет өткеру туралы ереженi бекiту туралы<*>

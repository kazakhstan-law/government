requisite: Постановление Правительства Республики Казахстан от 19 сентября 1996 г. N 1142 (САПП Республики Казахстан, 1996 г., N 38, ст. 358) (Утратило силу - постановлением Правительства РК от 11 января 2002 г. N 41 ~P020041 )
title:
  rus: Об утверждении Положения о порядке выплаты процентных надбавок за выслугу лет к должностным окладам работников, осуществляющих техническое обслуживание и обеспечивающих функционирование государственных органов и их аппаратов и не являющихся государственными служащими
  kaz: Техникалық қызмет көрсететiн және мемлекеттiк органдар мен олардың аппараттарының жұмысын қамтамасыз ететiн және мемлекеттiк қызметшi болып табылмайтын қызметкерлердiң лауазымдық жалақыларына еңбек сiңiрген жылдарына проценттiк үстеме ақы төлеу тәртiбi туралы Ереженi бекiту туралы

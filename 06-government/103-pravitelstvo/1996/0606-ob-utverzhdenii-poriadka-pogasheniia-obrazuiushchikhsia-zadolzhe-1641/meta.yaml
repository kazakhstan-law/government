title:
  rus: Об утверждении Порядка погашения образующихся задолженностей учреждений, состоящих на республиканском и местных бюджетах, организациям (поставщикам) путем зачета их в счет погашения последними задолженностей по платежам в бюджеты
  kaz: Республикалық және жергiлiктi бюджеттерде тұратын мекемелердiң ұйымдарға (берушiлерге) пайда болған берешектерiн, оларды соңғыларының бюджетке төленетiн төлемдер жөнiндегi берешектерiн өтеуi есебiне есептеу арқылы өтеудiң тәртiбiн бекiту туралы

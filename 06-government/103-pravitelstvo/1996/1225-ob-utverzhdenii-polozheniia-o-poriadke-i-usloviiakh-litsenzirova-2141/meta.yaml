title:
  rus: Об утверждении Положения о порядке и условиях лицензирования перевозок опасных грузов, международных перевозок пассажиров и грузов автомобильным транспортом и квалификационных требований в Республике Казахстан
  kaz: Қазақстан Республикасында автомобиль көлiгiмен қауiптi жүктердi тасымалдауды, жолаушылар мен жүктердi халықаралық тасымалдауды лицензиялаудың тәртiбi мен шарттары және бiлiктiлiк талаптары туралы ереженi бекiту туралы

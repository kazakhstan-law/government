title:
  rus: О мерах по реализации условий для вступления в силу Соглашения о займе между Республикой Казахстан и Международным Банком Реконструкции и Развития по Проекту усовершенствования ирригационной и дренажной систем
  kaz: Жердi суландыру және дренаж жүйелерiн жетiлдiру жобасы бойынша Қазақстан Республикасы мен Халықаралық Қайта құру және Даму Банкi арасындағы Займ туралы келiсiмнiң күшiне енуiне арналған шарттарды жүзеге асыру жөнiндегi шаралар туралы

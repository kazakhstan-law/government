title:
  rus: Об утверждении Перечня импортируемого оборудования и медикаментов, по которым налог на добавленную стоимость уплачивается в порядке, устанавливаемом Главной налоговой инспекцией Министерства финансов по согласованию с Таможенным комитетом Республики Казахстан
  kaz: Қазақстан Республикасы Қарржы министрлiгiнiң және Кеден комитетiнiң келiсiмi бойынша Мемлекеттiк салық комитетi белгiлеген тәртiппен қосылған құнға салынатын салық төленетiн импортталатын жабдықтар мен медикаменттердiң тiзбесiн бекiту туралы<*>

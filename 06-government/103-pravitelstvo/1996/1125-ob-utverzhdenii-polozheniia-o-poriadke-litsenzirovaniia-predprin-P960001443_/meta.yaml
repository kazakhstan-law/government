title:
  rus: Об утверждении Положения о порядке лицензирования предпринимательской деятельности в сфере почтовой связи и телекоммуникаций, использования радиочастотного спектра в Республике Казахстан
  kaz: Қазақстан Республикасында почта байланысы мен телекоммуникациялар саласындағы кәсiпкерлiк қызметтi лицензиялау, радиожиiлiк спектрiн пайдалану тәртiбi туралы ереженi бекiту туралы

act_code: '3423'
requisite: Постановление Министерства строительства, жилья и застройки территорий Республики Казахстан от 28 мая 1996 г. N 5-3 Зарегистрирован в Министерстве юстиции Республики Казахстан 06.09.1996 г. за N 195. Утратило силу - приказом Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и торговли Республики Казахстан от 27 декабря 2005 года N 400
title:
  rus: Об утверждении "Основных положений по определению сметной стоимости строительства предприятий, зданий и сооружений, составлению сводных сметных расчетов и договорных цен на строительную продукцию в Республике Казахстан"
  kaz: Қазақстан Республикасында құрылыс өнiмдерiне келiсiмдi баға қойғанда жинақталған сметалық есептесу жасағанда кәсiпорындарда, құрылыс пен ғимараттарды салғанда сметалық бағаны анықтаудың негiзгi Ережелерi

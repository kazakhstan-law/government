act_code: '113'
requisite: Постановление Правительства Республики Казахстан от 19 декабря 1996 г. N 1563
title:
  rus: О Комитете по использованию воздушного пространства и деятельности гражданской авиации при Министерстве транспорта и коммуникаций Республики Казахстан
  kaz: Қазақстан Республикасының Көлiк және коммуникациялар министрлiгi жанындағы әуе кеңiстiгiн пайдалану және азаматтық авиация қызметi жөнiндегi комитет туралы

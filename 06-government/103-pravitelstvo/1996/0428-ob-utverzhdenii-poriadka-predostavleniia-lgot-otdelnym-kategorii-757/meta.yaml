  title:
    rus: О мерах по обеспечению лекарственными средствами по видам заболеваний и специализированными продуктами детского и лечебного питания отдельных категорий населения
    kaz: Тұрғындардың жекелеген санаттарын науқастарының түрлерi бойынша дәрi-дәрмекпен және балаларға арналған және шипалы тағамдық арнаулы азық-түлiкпен қамтамасыз ету жөнiндегi шаралар туралы

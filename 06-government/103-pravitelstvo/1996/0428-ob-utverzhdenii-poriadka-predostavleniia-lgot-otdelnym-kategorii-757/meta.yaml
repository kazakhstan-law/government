title:
  rus: Об утверждении порядка предоставления льгот отдельным категориям граждан и возмещения министерствам, государственным комитетам, центральным, местным исполнительным органам и иным юридическим лицам расходов, связанных с ними
  kaz: Азаматтардың жекелеген санаттарына жеңiлдiк беру мен министрлiктерге, мемлекеттiк комитеттерге, орталық, жергiлiктi атқарушы органдарға және заңды тұлғаларға оған байланысты шығындарды өтеудiң тәртiбiн бекiту туралы

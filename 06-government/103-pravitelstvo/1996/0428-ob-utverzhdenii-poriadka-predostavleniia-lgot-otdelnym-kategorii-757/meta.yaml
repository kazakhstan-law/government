  kaz: Азаматтардың жекелеген санаттарына жеңiлдiк беру мен министрлiктерге, мемлекеттiк комитеттерге, орталық, жергiлiктi атқарушы органдарға және заңды тұлғаларға оған байланысты шығындарды өтеудiң тәртiбiн бекiту туралы

title:
  rus: Об утверждении Порядка выдачи лицензий на право ведения образовательной деятельности учреждениям образования, Порядка выдачи документов об окончании учреждений образования и квалификационных требований при лицензировании образовательной деятельности
  kaz: Бiлiм беру мекемелерiнiң бiлiм беру қызметiн жүргiзу құқығына лицензия беру тәртiбiн, бiлiм беру мекемелерiн бiтiргенi және бiлiм беру қызметiн лицензиялау кезiндегi бiлiктiлiк талаптары туралы құжаттарды беру тәртiбiн бекiту туралы

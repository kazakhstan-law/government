title:
  rus: О порядке уплаты и размерах пошлин за патентование изобретений, промышленных образцов и полезных моделей, регистрацию товарных знаков и знаков обслуживания, регистрацию и предоставление права пользования наименованием места происхождения товара
  kaz: Өнертабыстарды, өнеркәсiптiк үлгiлер мен пайдалы модельдердi патенттеу, тауар таңбалары мен қызмет көрсету белгiлерiн тiркеу, тауардың шыққан жерiнiң атын пайдалану хұқығын тiркеу және беру үшiн алынатын баж салықтарын төлеудiң тәртiбi мен мөлшерi туралы

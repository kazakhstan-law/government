title:
  rus: Об утверждении Положения о порядке приобретения, проектирования, строительства (установки), эксплуатации на территории Республики Казахстан и ввоза из-за границы радиоэлектронных средств и высокочастотных устройств
  kaz: Қазақстан Республикасының аумағында радиоэлектрондық құралдарды және жоғары жиiлiктегi құрылғыларды алу, жобалау, жасау (орнату), пайдалану және шет елдерден әкелу тәртiбi туралы ереженi бекiту туралы

act_code: '31595'
requisite: Постановление Правительства Республики Казахстан от 31 января 2007 года № 74
title:
  rus: Об использовании целевых текущих трансфертов, предусмотренных в республиканском бюджете на 2007 год, на обеспечение нуждающихся инвалидов обязательными гигиеническими средствами и предоставление услуг специалистами жестового языка, индивидуальными помощниками в соответствии с индивидуальной программой реабилитации инвалида
  kaz: 2007 жылға арналған республикалық бюджетте мұқтаж мүгедектердi мiндеттi гигиеналық құралдармен қамтамасыз етуге және мүгедектi оңалтудың жеке бағдарламасына сәйкес ымдау тiлi мамандарының, жеке көмекшiлердiң қызметтер көрсетуiне көзделген ағымдағы нысаналы трансферттердi пайдалану туралы

title:
  rus: Об утверждении государственного образовательного заказа на подготовку специалистов с высшим профессиональным и послевузовским профессиональным образованием, а также со средним профессиональным образованием в организациях, финансируемых за счет бюджетных средств на 2007/2008 учебный год
  kaz: Кәсіптік жоғары білім беру мен жоғары оқу орнынан кейінгі кәсіптік білімі бар, сондай-ақ бюджет қаражаты есебінен қаржыландырылатын ұйымдарда кәсіптік орта білімі бар мамандар даярлауға 2007/2008 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы

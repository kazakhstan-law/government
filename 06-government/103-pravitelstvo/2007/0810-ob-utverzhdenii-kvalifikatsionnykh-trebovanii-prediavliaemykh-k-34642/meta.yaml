  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 10 августа 2007 года № 686 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к осуществлению охранной деятельности, к деятельности по монтажу, наладке и техническому обслуживанию средств охранной сигнализации, за исключением деятельности при выполнении строительно-монтажных работ"
    kaz: '"Күзет қызметін, құрылыс-монтаж жұмыстарын орындау кезіндегі қызметті қоспағанда, күзет дабылы құралдарын монтаждау, ретке келтіру және оларға техникалық қызмет көрсету жөніндегі қызметті лицензиялау ережесін және оларды жүзеге асыруға қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 10 тамыздағы № 686 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/61843/rus

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 29 октября 2004 года № 1132 "Некоторые вопросы Министерства труда и социальной защиты населения Республики Казахстан" и от 29 декабря 2007 года № 1400 "О системе оплаты труда гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасы Еңбек және халықты әлеуметтiк қорғау министрлiгінiң кейбiр мәселелерi" туралы 2004 жылғы 29 қазандағы № 1132 және "Азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбекақы төлеу жүйесі туралы" 2007 жылғы 29 желтоқсандағы № 1400 қаулыларына өзгерістер мен толықтырулар енгізу туралы

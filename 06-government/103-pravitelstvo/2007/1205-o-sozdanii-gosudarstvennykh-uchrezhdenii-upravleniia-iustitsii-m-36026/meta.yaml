  kaz: Қазақстан Республикасы Әділет министрлігі Маңғыстау облысының Әділет департаменті Мұнайлы ауданының Әділет басқармасы және Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешендегі мемлекеттік инспекция комитетінің Мұнайлы аудандық аумақтық инспекциясы мемлекеттік мекемелерін құру туралы

title:
  rus: О реорганизации республиканских государственных казенных предприятий Комитета по государственному контролю за чрезвычайными ситуациями и промышленной безопасностью Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігі Төтенше жағдайларды және өнеркәсіптік қауіпсіздікті мемлекеттік бақылау комитетінің республикалық мемлекеттік қазыналық кәсіпорындарын қайта ұйымдастыру туралы

  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігі Төтенше жағдайларды және өнеркәсіптік қауіпсіздікті мемлекеттік бақылау комитетінің республикалық мемлекеттік қазыналық кәсіпорындарын қайта ұйымдастыру туралы

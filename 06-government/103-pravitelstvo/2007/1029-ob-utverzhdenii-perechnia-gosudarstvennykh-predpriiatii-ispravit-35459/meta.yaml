  title:
    rus: О внесении изменения и дополнений в постановление Правительства Республики Казахстан от 29 октября 2007 года № 1002 "Об утверждении перечня государственных предприятий исправительных учреждений, у которых приобретаются органами уголовно-исполнительной системы производимые, выполняемые, оказываемые ими товары, работы, услуги, а также перечня и объемов товаров, работ, услуг, приобретаемых у производящих, выполняющих, оказывающих их государственных предприятий исправительных учреждений"
    kaz: '"Өндіретін, орындайтын, көрсететін тауарларын, жұмыстарын, қызметтерін қылмыстық-атқару жүйесінің органдары сатып алатын түзеу мекемелері мемлекеттік кәсіпорындарының тізбесін, сондай-ақ оларды өндіретін, орындайтын, көрсететін түзеу мекемелерінің мемлекеттік кәсіпорындарынан сатып алынатын тауарлардың, жұмыстардың, қызметтердің тізбесі мен көлемін бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 29 қазандағы № 1002 қаулысына өзгеріс пен толықтырулар енгізу туралы'

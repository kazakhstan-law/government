act_code: '35459'
requisite: Постановление Правительства Республики Казахстан от 29 октября 2007 года № 1002. Утратило силу постановлением Правительства Республики Казахстан от 18 февраля 2016 года № 79
title:
  rus: Об утверждении перечня государственных предприятий исправительных учреждений, у которых приобретаются органами уголовно-исполнительной системы производимые, выполняемые, оказываемые ими товары, работы, услуги, а также перечня и объемов товаров, работ, услуг, приобретаемых у производящих, выполняющих, оказывающих их государственных предприятий исправительных учреждений
  kaz: Өндіретін, орындайтын, көрсететін тауарларын, жұмыстарын, қызметтерін қылмыстық-атқару жүйесінің органдары сатып алатын түзеу мекемелері мемлекеттік кәсіпорындарының тізбесін, сондай-ақ оларды өндіретін, орындайтын, көрсететін түзеу мекемелерінің мемлекеттік кәсіпорындарынан сатып алынатын тауарлардың, жұмыстардың, қызметтердің тізбесі мен көлемін бекіту туралы

title:
  rus: Об утверждении Правил использования (установления, размещения) Государственного Флага, Государственного Герба Республики Казахстан и их изображений, а также текста Государственного Гимна Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік Туын, Мемлекеттік Елтаңбасын және олардың бейнелерін, сондай-ақ Қазақстан Республикасы Мемлекеттік Әнұранының мәтінін пайдалану (орнату, орналастыру) қағидаларын бекіту туралы

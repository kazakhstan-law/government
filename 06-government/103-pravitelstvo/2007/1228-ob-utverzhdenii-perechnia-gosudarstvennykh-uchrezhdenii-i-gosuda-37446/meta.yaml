title:
  rus: Об утверждении перечня государственных учреждений и государственных предприятий социальной сферы, расположенных в сельских населенных пунктах, осуществляющих приобретение товаров, работ, услуг без применения норм Закона Республики Казахстан "О государственных закупках"
  kaz: '"Мемлекеттік сатып алу туралы" Қазақстан Республикасы Заңының нормаларын қолданбай тауарларды, жұмыстарды, көрсетілетін қызметтерді сатып алуды жүзеге асыратын ауылдық елді мекендерде орналасқан әлеуметтік саланың мемлекеттік мекемелері мен мемлекеттік кәсіпорындарының тізбесін бекіту туралы'

act_code: '33349'
requisite: Постановление Правительства Республики Казахстан 23 мая 2007 года № 413
title:
  rus: Об утверждении Правил исключения из-под контроля лекарственных препаратов, содержащих малое количество наркотических средств, психотропных веществ и прекурсоров, из которых указанные средства и вещества не могут быть извлечены легкодоступными способами, и списка указанных препаратов
  kaz: Құрамында есірткі құралдарының, психотроптық заттар мен прекурсорлардың аз мөлшері бар, олардан көрсетілген құралдар мен заттар оңай қол жеткізілетін тәсілдермен алынуы мүмкін емес дәрілік препараттарды бақылаудан алу ережесін және көрсетілген препараттардың тізімін бекіту туралы

  title:
    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 23 мая 2007 года № 413 «Об утверждении Правил исключения из-под контроля лекарственных препаратов, содержащих малое количество наркотических средств, психотропных веществ и прекурсоров, из которых указанные средства и вещества не могут быть извлечены легкодоступными способами, и списка указанных препаратов»
    kaz: «Құрамында есірткі құралдарының, психотроптық заттар мен прекурсорлардың аз мөлшері бар, олардан көрсетілген құралдар мен заттар оңай қол жеткізілетін тәсілдермен алынуы мүмкін емес дәрілік препараттарды бақылаудан алу ережесін және көрсетілген препараттардың тізімін бекіту туралы» Қазақстан Республикасы Үкіметінің 2007 жылғы 23 мамырдағы № 413 қаулысына толықтырулар енгізу туралы

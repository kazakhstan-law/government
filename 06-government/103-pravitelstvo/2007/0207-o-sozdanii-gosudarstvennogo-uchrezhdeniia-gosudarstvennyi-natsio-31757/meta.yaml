act_code: '31757'
requisite: Постановление Правительства Республики Казахстан от 7 февраля 2007 года № 88
title:
  rus: О создании государственного учреждения "Государственный национальный природный парк "Көлсай көлдері" Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлiгi Орман және аңшылық шаруашылығы комитетiнiң "Көлсай көлдерi" мемлекеттiк ұлттық табиғи паркi" мемлекеттiк мекемесiн құру туралы

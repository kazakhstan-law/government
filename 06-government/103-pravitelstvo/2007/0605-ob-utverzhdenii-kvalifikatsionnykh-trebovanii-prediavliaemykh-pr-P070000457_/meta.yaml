  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 5 июня 2007 года № 457 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к деятельности по выполнению работ и оказанию услуг в области охраны окружающей среды"
    kaz: '"Қоршаған ортаны қорғау саласындағы жұмыстарды орындау және қызметтерді көрсету жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 5 маусымдағы № 457 қаулысына өзгерістер енгізу туралы'

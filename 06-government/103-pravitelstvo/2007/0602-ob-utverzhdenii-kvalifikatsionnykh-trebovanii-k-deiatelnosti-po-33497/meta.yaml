  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 2 июня 2007 года № 449 "Об утверждении Правил лицензирования и квалификационных требований к деятельности по первичной переработке хлопка-сырца в хлопок-волокно"
    kaz: '"Шитті мақтаны талшықты мақтаға бастапқы қайта өңдеу жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 2 маусымдағы № 449 қаулысына өзгерістер енгізу туралы'

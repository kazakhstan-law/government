  kaz: Сәйкестендіру нөмірін қалыптастыру ережесін, Жеке және заңды тұлғалардың (филиалдар мен өкілдіктердің), сондай-ақ дара кәсіпкерлердің сәйкестендіру нөмірін қалыптастыру және бұрын берілген құжаттарын қайта ресімдеу үшін өтініш жасау ережесін бекіту туралы

title:
  rus: Об утверждении Правил формирования идентификационного номера, Правил обращения физических и юридических лиц (филиалов и представительств), а также индивидуальных предпринимателей для формирования идентификационного номера и переоформления ранее выданных документов
  kaz: Сәйкестендіру нөмірін қалыптастыру ережесін, Жеке және заңды тұлғалардың (филиалдар мен өкілдіктердің), сондай-ақ дара кәсіпкерлердің сәйкестендіру нөмірін қалыптастыру және бұрын берілген құжаттарын қайта ресімдеу үшін өтініш жасау ережесін бекіту туралы

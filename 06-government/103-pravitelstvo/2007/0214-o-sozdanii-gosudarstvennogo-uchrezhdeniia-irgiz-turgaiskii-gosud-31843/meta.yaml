act_code: '31843'
requisite: Постановление Правительства Республики Казахстан от 14 февраля 2007 года № 109
title:
  rus: О создании государственного учреждения "Иргиз-Тургайский государственный природный резерват" Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман және аңшылық шаруашылығы комитетінің "Ырғыз-Торғай мемлекеттік табиғи резерваты" мемлекеттік мекемесін құру туралы

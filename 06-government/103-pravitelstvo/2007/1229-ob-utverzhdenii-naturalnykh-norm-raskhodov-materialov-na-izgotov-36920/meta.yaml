title:
  rus: Об утверждении натуральных норм расходов материалов на изготовление микрофильмов и фотокопий документов, реставрацию документов, картонажные работы, выполняемые государственными архивными учреждениями Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттік мұрағат мекемелері орындайтын микрофильмдерді және құжаттардың фотокөшірмелерін дайындауға, құжаттарды реставрациялауға, қатырма қағаз жұмыстарына арналған материалдардың заттай шығыс нормаларын бекіту туралы

title:
  rus: Об утверждении Правил выдачи разрешений на производство работ с использованием озоноразрушающих веществ, ремонт, монтаж, обслуживание оборудования, содержащего озоноразрушающие вещества
  kaz: Озон қабатын бұзатын заттарды пайдалана отырып жұмыстар жүргізуге, құрамында озон қабатын бұзатын заттар бар жабдықтарды жөндеуге, монтаждауға, оларға қызмет көрсетуге рұқсат беру қағидаларын бекіту туралы

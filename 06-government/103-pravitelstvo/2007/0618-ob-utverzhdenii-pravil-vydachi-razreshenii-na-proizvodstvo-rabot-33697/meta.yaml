  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 18 июня 2007 года № 508 "Об утверждении Правил выдачи разрешений на импорт, экспорт озоноразрушающих веществ и содержащей их продукции, производство работ с использованием озоноразрушающих веществ, ремонт, монтаж, обслуживание оборудования, содержащего озоноразрушающие вещества"
    kaz: '"Озон қабатын бұзатын және құрамында солардың өнімдері бар заттарды импорттауға, экспорттауға, озон қабатын бұзатын заттарды пайдалана отырып жұмыстар жүргізуге, құрамында озон қабатын бұзатын заттар бар жабдықтарды жөндеуге, монтаждауға, оларға қызмет көрсетуге рұқсат беру ережесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 18 маусымдағы № 508 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/66607/rus

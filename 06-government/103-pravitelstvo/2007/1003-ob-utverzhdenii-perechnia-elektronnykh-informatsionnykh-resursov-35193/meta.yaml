title:
  rus: Об утверждении перечня электронных информационных ресурсов о государственных органах, размещаемых на интернет-ресурсах государственных органов
  kaz: Мемлекеттік органдардың интернет-ресурстарына орналастырылатын мемлекеттік органдар туралы электрондық ақпараттық ресурстардың тізбесін бекіту туралы

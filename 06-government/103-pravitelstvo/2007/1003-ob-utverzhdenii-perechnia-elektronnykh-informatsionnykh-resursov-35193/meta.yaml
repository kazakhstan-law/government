  code: '85593'
  requisite: Постановление Правительства Республики Казахстан от 29 декабря 2014 года № 1386. Утратило силу постановлением Правительства Республики Казахстан от 2 июня 2021 года № 367 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: Об определении интернет-ресурса для опубликования вступивших в силу, а также временно применяемых международных договоров Республики Казахстан и внесении изменения и дополнения в постановления Правительства Республики Казахстан от 13 июля 2007 года № 598 "Об утверждении Правил размещения электронных информационных ресурсов на интернет-ресурсах государственных органов" и от 3 октября 2007 года № 891 "Об утверждении перечня электронных информационных ресурсов о государственных органах, размещаемых на интернет-ресурсах государственных органов"
    kaz: Қазақстан Республикасының күшіне енген, сондай-ақ уақытша қолданылатын халықаралық шарттарын жариялауға арналған интернет-ресурсты айқындау және Қазақстан Республикасы Үкіметінің "Электрондық ақпараттық ресурстарды мемлекеттік органдардың интернет-ресурстарына орналастыру ережесін бекіту туралы" 2007 жылғы 13 шілдедегі № 598 және "Мемлекеттік органдардың интернет-ресурстарына орналастырылатын мемлекеттік органдар туралы электрондық ақпараттық ресурстардың тізбесін бекіту туралы" 2007 жылғы 3 қазандағы № 891 қаулыларына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/85593/rus

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 23 августа 2007 года № 731 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к деятельности по хранению, оптовой и (или) розничной реализации алкогольной продукции, за исключением деятельности по хранению, оптовой и (или) розничной реализации алкогольной продукции на территории ее производства"
    kaz: '"Алкоголь өнімдерін өндіру аумағында оларды сақтауды, көтерме және (немесе) бөлшек саудада сатуды қоспағанда, алкоголь өнімін сақтау, көтерме және (немесе) бөлшек саудада сату жөніндегі қызметті лицензиялау ережесі мен оған қойылатын біліктілік талаптарды бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 23 тамыздағы № 731 қаулысына өзгерістер енгізу туралы'

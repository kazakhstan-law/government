    kaz: Мемлекеттік кітапханалардың, мемлекеттік мұражайлар мен мұражай-қорықтардың тауарларды (жұмыстарды, қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, қызметтерді) өткізуден түскен ақшаны жұмсау ережесін бекіту туралы

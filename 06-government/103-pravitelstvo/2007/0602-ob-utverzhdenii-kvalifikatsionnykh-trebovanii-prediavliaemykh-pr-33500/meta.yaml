  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 2 июня 2007 года № 454 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к адвокатской и нотариальной видам деятельности"
    kaz: '"Адвокаттық және нотариаттық қызмет түрлерін лицензиялау ережесін және оларға қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 2 маусымдағы № 454 қаулысына өзгерістер енгізу туралы'

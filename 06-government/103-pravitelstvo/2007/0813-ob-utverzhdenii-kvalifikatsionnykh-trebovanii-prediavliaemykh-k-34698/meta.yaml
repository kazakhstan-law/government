act_code: '34698'
requisite: Постановление Правительства Республики Казахстан от 13 августа 2007 года № 692. Утратило силу постановлением Правительства Республики Казахстан от 6 декабря 2012 года № 1554
title:
  rus: Об утверждении квалификационных требований, предъявляемых к деятельности по разработке, производству, ремонту, торговле, коллекционированию, экспонированию и приобретению гражданского и служебного оружия и патронов к нему и к деятельности по разработке, производству, торговле, использованию и приобретению гражданских пиротехнических веществ и изделий с их применением
  kaz: Азаматтық және қызметтік қару мен оның патрондарын әзірлеу, жасау, жөндеу, сату, коллекциялау, экспонаттау және сатып алу жөніндегі қызметке және азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдарды әзірлеу, жасау, сату, пайдалану және сатып алу жөніндегі қызметке қойылатын біліктілік талаптарын бекіту туралы

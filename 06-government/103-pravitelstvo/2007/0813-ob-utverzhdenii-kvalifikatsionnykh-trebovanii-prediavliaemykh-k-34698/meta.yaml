  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 13 августа 2007 года № 692 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к деятельности по разработке, производству, ремонту, торговле, приобретению, коллекционированию, экспонированию огнестрельного гражданского и служебного оружия и патронов к нему, холодного оружия, а также газового оружия и патронов к нему, и к деятельности по разработке, производству, торговле, приобретению гражданских пиротехнических веществ и изделий с их применением"
    kaz: '"Азаматтық және қызметтік атыс қаруы мен оның патрондарын, суық қаруды, сондай-ақ газ қаруы мен оның патрондарын әзірлеу, жасау, жөндеу, сату, сатып алу, коллекциялау, экспонаттау жөніндегі және азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдарды әзірлеу, жасау, сату, сатып алу жөніндегі қызметті лицензиялау ережелерін және оларға қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 13 тамыздағы № 692 қаулысына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/62063/rus

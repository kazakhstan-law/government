title:
  rus: Об утверждении Технического регламента о требованиях к выбросам вредных (загрязняющих) веществ автотранспортных средств, выпускаемых в обращение на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағында айналымға шығарылатын автокөлік құралдарының зиянды (ластаушы) заттар шығарындыларына қойылатын талаптар туралы техникалық регламентті бекіту туралы

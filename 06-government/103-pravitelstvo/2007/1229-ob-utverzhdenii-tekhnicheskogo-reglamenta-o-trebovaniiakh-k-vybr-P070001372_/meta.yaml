  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 29 декабря 2007 года № 1372 "Об утверждении Технического регламента о требованиях к выбросам вредных (загрязняющих) веществ автотранспортных средств, выпускаемых в обращение на территории Республики Казахстан"
    kaz: '"Қазақстан Республикасының аумағында айналымға шығарылатын автокөлік құралдарының зиянды (ластаушы) заттар шығарындыларына қойылатын талаптар туралы техникалық регламентті бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 29 желтоқсандағы № 1372 қаулысына өзгерістер енгізу туралы'

title:
  rus: О предоставлении земельных участков в постоянное землепользование государственному учреждению "Западно-Алтайский государственный природный заповедник" Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман және аңшылық шаруашылығы комитетінің "Батыс Алтай мемлекеттік табиғи қорығы" мемлекеттік мекемесіне тұрақты жер пайдалануға жер учаскелерін беру туралы

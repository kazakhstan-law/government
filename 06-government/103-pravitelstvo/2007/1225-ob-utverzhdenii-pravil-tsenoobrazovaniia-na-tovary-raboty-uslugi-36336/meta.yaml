act_code: '36336'
requisite: Постановление Правительства Республики Казахстан от 25 декабря 2007 года N 1286. Утратило силу постановлением Правительства Республики Казахстан от 3 марта 2009 года N 238.
title:
  rus: Об утверждении Правил ценообразования на товары (работы, услуги) субъектов рынка, занимающих доминирующее (монопольное) положение на товарных рынках в области железнодорожного транспорта, электро- и теплоэнергетики, транспортировки нефти, нефтепродуктов и газа, гражданской авиации, портовой деятельности, телекоммуникаций и почтовой связи
  kaz: Темір жол көлігі, электр және жылу энергетикасы, мұнайды, мұнай өнімдері мен газды тасымалдау, азаматтық авиация, порт қызметтері, телекоммуникация және почта байланысы саласындағы тауар нарықтарында үстем (монополиялық) жағдайға ие нарық субъектілерінің тауарларына (жұмыстарына, көрсетілетін қызметтеріне) баға түзу ережесін бекіту туралы

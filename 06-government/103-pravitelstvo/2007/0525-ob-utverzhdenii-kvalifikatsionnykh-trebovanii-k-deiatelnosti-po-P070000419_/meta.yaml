    rus: О внесении изменений в постановление Правительства Республики Казахстан от 25 мая 2007 года № 419 "Вопросы лицензирования и квалификационных требований к деятельности по оценке имущества (за исключением объектов интеллектуальной собственности, стоимости нематериальных активов) и оценке интеллектуальной собственности, стоимости нематериальных активов"

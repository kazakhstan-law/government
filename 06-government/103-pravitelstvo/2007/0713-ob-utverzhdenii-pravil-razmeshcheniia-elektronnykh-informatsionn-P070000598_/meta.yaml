  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 13 июля 2007 года № 598 "Об утверждении Правил размещения электронных информационных ресурсов на интернет-ресурсах государственных органов" и от 3 октября 2007 года № 891 "Об утверждении перечня электронных информационных ресурсов о государственных органах, размещаемых на интернет-ресурсах государственных органов"
    kaz: Қазақстан Республикасы Үкіметінің "Электрондық ақпараттық ресурстарды мемлекеттік органдардың интернет-ресурстарына орналастыру ережесін бекіту туралы" 2007 жылғы 13 шілдедегі № 598 және "Мемлекеттік органдардың интернет-ресурстарына орналастырылатын мемлекеттік органдар туралы электрондық ақпараттық ресурстардың тізбесін бекіту туралы" 2007 жылғы 3 қазандағы № 891 қаулыларына өзгерістер мен толықтырулар енгізу туралы

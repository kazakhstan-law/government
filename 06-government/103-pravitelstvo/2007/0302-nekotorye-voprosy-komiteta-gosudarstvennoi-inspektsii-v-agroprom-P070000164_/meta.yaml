  title:
    rus: О некоторых вопросах по реализации указов Президента Республики Казахстан от 3 мая 2022 года № 886 «О некоторых вопросах административно-территориального устройства Республики Казахстан» и от 3 мая 2022 года № 887 «О некоторых вопросах административно-территориального устройства Республики Казахстан»
    kaz: Қазақстан Республикасы Президентінің «Қазақстан Республикасының әкімшілік-аумақтық құрылысының кейбір мәселелері туралы» 2022 жылғы 3 мамырдағы № 886 және «Қазақстан Республикасының әкімшілік-аумақтық құрылысының кейбір мәселелері туралы» 2022 жылғы 3 мамырдағы № 887 жарлықтарын іске асыру жөніндегі кейбір мәселелер туралы

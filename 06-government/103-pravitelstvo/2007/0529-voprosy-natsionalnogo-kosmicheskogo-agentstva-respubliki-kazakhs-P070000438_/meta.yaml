  title:
    rus: О реорганизации дочернего государственного предприятия "Инфракос-Экос" Республиканского государственного предприятия "Инфракос" Национального космического агентства Республики Казахстан и о внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Ұлттық ғарыш агенттігі "Инфракос" республикалық мемлекеттік кәсіпорнының "Инфракос-Экос" еншілес мемлекеттік кәсіпорнын қайта ұйымдастыру туралы және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы

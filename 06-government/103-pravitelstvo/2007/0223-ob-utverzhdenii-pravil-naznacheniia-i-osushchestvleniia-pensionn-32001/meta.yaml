act_code: '32001'
requisite: Постановление Правительства Республики Казахстан от 23 февраля 2007 года № 138. Утратило силу постановлением Правительства Республики Казахстан от 31 декабря 2013 года № 1500
title:
  rus: Об утверждении Правил назначения и осуществления пенсионных выплат, государственной базовой пенсионной выплаты, выплат государственных базовых социальных пособий военнослужащим, сотрудникам специальных государственных и правоохранительных органов, которым присвоены специальные звания и классные чины, за исключением таможенных органов, а также лицам, права которых иметь воинские или специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года
  kaz: Кеден органдарын қоспағанда, әскери қызметшілерге, арнаулы мемлекеттік және құқық қорғау органдарының арнаулы атақтар мен сыныптық шендер берілген қызметкерлеріне, сондай-ақ әскери және арнаулы атақтар, сыныптық шендер алу және нысанды киім киіп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдарға зейнетақы төлемдерін, мемлекеттік базалық зейнетақы төлемін, мемлекеттік базалық әлеуметтік жәрдемақыларды тағайындау мен төлеуді жүзеге асыру ережесін бекіту туралы

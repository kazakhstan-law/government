    kaz: '"Тарих пен мәдениет ескерткіштеріне археологиялық және (немесе) ғылыми-қалпына келтіру жұмыстарын жүзеге асыру жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 14 маусымдағы № 495 қаулысына өзгерістер енгізу туралы'

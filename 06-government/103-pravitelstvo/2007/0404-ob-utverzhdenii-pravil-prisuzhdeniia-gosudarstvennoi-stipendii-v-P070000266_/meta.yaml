    kaz: «Қазақстан Республикасының Тұңғыш Президенті – Елбасының мәдениет саласындағы мемлекеттік стипендиясын беру қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2007 жылғы 4 сәуірдегі № 266 қаулысына өзгерістер енгізу туралы

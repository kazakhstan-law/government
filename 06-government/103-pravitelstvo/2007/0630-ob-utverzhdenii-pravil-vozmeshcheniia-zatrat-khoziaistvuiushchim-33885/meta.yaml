  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 30 июня 2007 года № 556 "Об утверждении Правил возмещения затрат хозяйствующим субъектам, осуществляющим хранение государственного резерва, а также возмещения затрат за материальные ценности государственного резерва, выпускаемые для предупреждения и ликвидации последствий чрезвычайных ситуаций, оказания регулирующего воздействия на рынок и гуманитарной помощи" и от 26 февраля 2009 года № 220 "Об утверждении Правил исполнения бюджета и его кассового обслуживания"
    kaz: Қазақстан Республикасы Үкіметінің "Мемлекеттік резервті сақтауды жүзеге асыратын шаруашылық жүргізуші субъектілердің шығындарын өтеу, сондай-ақ төтенше жағдайлардың алдын алу және олардың зардаптарын жою, нарыққа реттеушілік ықпал ету және ізгілік көмек көрсету үшін шығарылатын мемлекеттік резервтің материалдық қүндылықтары үшін шығындарды өтеу ережесін бекіту туралы" 2007 жылғы 30 маусымдағы № 556 және "Бюджеттің атқарылуы және оған кассалық қызмет көрсету ережесін бекіту туралы" 2009 жылғы 26 ақпандағы № 220 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/78501/rus

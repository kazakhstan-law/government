act_code: '33885'
requisite: Постановление Правительства Республики Казахстан от 30 июня 2007 года № 556. Утратило силу постановлением Правительства Республики Казахстан от 31 июля 2014 года № 865
title:
  rus: Об утверждении Правил возмещения затрат хозяйствующим субъектам, осуществляющим хранение государственного резерва, а также возмещения затрат за материальные ценности государственного резерва, выпускаемые для предупреждения и ликвидации последствий чрезвычайных ситуаций, оказания регулирующего воздействия на рынок и гуманитарной помощи
  kaz: Мемлекеттік резервті сақтауды жүзеге асыратын шаруашылық жүргізуші субъектілердің шығындарын өтеу, сондай-ақ төтенше жағдайлардың алдын алу және олардың зардаптарын жою, нарыққа реттеушілік ықпал ету және ізгілік көмек көрсету үшін шығарылатын мемлекеттік резервтің материалдық құндылықтары үшін шығындарды өтеу ережесін бекіту туралы

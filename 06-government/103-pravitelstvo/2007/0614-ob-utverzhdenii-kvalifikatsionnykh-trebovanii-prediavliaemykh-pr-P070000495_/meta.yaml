title:
  rus: Об утверждении квалификационных требований, предъявляемых при лицензировании деятельности по осуществлению археологических и (или) научно-реставрационных работ на памятниках истории и культуры
  kaz: Тарих пен мәдениет ескерткіштеріне археологиялық және (немесе) ғылыми-қалпына келтіру жұмыстарын жүзеге асыру жөніндегі қызметті лицензиялау кезінде қойылатын біліктілік талаптарын бекіту туралы

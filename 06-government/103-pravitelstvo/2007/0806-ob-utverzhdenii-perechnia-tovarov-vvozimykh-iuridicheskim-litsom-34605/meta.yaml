act_code: '34605'
requisite: Постановление Правительства Республики Казахстан от 6 августа 2007 года № 661
title:
  rus: Об утверждении перечня товаров, ввозимых юридическим лицом, его подрядчиками или субподрядчиками, осуществляющими деятельность в рамках концессионного договора, заключенного с Правительством Республики Казахстан, о строительстве и эксплуатации межрегиональной линии электропередачи "Северный Казахстан - Актюбинская область", импорт которых в рамках реализации инфраструктурного проекта освобождается от налога на добавленную стоимость
  kaz: '"Солтүстік Қазақстан - Ақтөбе облысы" өңіраралық электр берілісі желісін салу және пайдалану туралы Қазақстан Республикасының Үкіметімен жасалған концессиялық шарт шеңберіндегі қызметті жүзеге асыратын заңды тұлға, оның мердігерлері немесе қосалқы мердігерлері әкелетін, импорты инфрақұрылымдық жобаны іске асыру шеңберінде қосылған құн салығынан босатылатын тауарлардың тізбесінен бекіту туралы'

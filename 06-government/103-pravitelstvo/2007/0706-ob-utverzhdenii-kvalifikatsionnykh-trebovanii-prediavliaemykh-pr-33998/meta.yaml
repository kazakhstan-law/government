  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 6 июля 2007 года № 574 "Об утверждении Правил лицензирования и квалификационных требований к деятельности по производству землеустроительных, топографо-геодезических и картографических работ"
    kaz: '"Жерге орналастыру, топография-геодезиялық және картографиялық жұмыстар жүргізу жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 6 шілдедегі № 574 қаулысына өзгерістер енгізу туралы'

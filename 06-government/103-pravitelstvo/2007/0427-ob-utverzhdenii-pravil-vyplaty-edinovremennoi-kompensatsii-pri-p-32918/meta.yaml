act_code: '32918'
requisite: Постановление Правительства Республики Казахстан от 27 апреля 2007 года № 336
title:
  rus: Об утверждении Правил выплаты единовременной компенсации при получении увечья (травмы, ранения, контузии, профессионального заболевания) или гибели (смерти) судьи в связи с исполнением служебных обязанностей
  kaz: Судьяға қызметтік міндеттерін орындауына байланысты мертіккен (жарақаттанған, жараланған, контузия алған, кәсіптік ауруға шалдыққан) немесе қаза тапқан (қайтыс болған) жағдайда біржолғы өтемақы төлеу қағидаларын бекіту туралы

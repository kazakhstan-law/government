act_code: '31454'
requisite: Постановление Правительства Республики Казахстан от 26 января 2007 года № 61
title:
  rus: О реорганизации Республиканского государственного предприятия на праве хозяйственного ведения "Институт экономических исследований" Министерства экономики и бюджетного планирования Республики Казахстан
  kaz: Қазақстан Республикасы Экономика және бюджеттiк жоспарлау министрлiгiнiң "Экономикалық зерттеулер институты" шаруашылық жүргiзу құқығындағы республикалық мемлекеттiк кәсiпорнын қайта ұйымдастыру туралы

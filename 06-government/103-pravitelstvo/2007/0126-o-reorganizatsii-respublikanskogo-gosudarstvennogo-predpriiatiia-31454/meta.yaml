caused_by:
  code: '58979'
  requisite: Постановление Правительства Республики Казахстан от 19 мая 2011 года № 544
  title:
    rus: О ликвидации республиканского государственного казенного предприятия "Научно-методический центр специальных программ" Министерства экономического развития и торговли Республики Казахстан и внесении изменений в некоторые решения Правительства Республики Казахстан
    kaz: Қазақстан Республикасы Экономикалық даму және сауда министрлігінің "Арнайы бағдарламалардың ғылыми-әдістемелік орталығы" республикалық мемлекеттік қазыналық кәсіпорнын тарату және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/58979/rus

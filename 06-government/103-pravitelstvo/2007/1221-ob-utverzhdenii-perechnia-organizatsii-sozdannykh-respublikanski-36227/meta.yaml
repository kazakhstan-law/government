title:
  rus: Об утверждении перечня организаций, созданных республиканскими общественными объединениями инвалидов, перечня производимых, выполняемых, оказываемых ими товаров, работ, услуг, Правил приобретения заказчиками у них товаров, работ, услуг
  kaz: Мүгедектердің республикалық коғамдық бірлестіктері құрған ұйымдардың тізбесін, олар өндіретін тауарлардың, орындайтын жұмыстардың, көрсететін қызметтердің тізбесін, Тапсырыс берушілердің олардан осындай тауарларды, жұмыстарды, көрсетілетін қызметтерді сатып алу ережесін бекіту туралы

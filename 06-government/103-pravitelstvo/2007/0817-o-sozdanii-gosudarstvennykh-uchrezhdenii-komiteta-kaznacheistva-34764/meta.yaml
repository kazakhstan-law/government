title:
  rus: О создании государственных учреждений Комитета казначейства и Налогового комитета Министерства финансов Республики Казахстан
  kaz: Қазақстан Республикасы Қаржы министрлігінің Қазынашылық комитеті мен Салық комитетінің мемлекеттік мекемелерін құру туралы

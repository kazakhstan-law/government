title:
  rus: Об утверждении квалификационных требований, предъявляемых к деятельности по хранению, оптовой и (или) розничной реализации алкогольной продукции, за исключением деятельности по хранению, оптовой и (или) розничной реализации алкогольной продукции на территории ее производства
  kaz: Алкоголь өнімдерін ендіру аумағында оларды сақтау, көтерме және (немесе) бөлшек саудада сату жөніндегі қызметті қоспағанда, алкоголь өнімін сақтау, көтерме және (немесе) бөлшек саудада сату жөніндегі қызметке қойылатын біліктілік талаптарын бекіту туралы

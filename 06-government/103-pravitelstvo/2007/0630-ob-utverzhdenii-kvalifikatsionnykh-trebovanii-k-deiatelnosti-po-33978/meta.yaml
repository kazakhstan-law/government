  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 30 июня 2007 года № 551 "Об утверждении Правил лицензирования и квалификационных требований к деятельности по организации и проведению лотерей (кроме государственных (национальных) в Республике Казахстан"
    kaz: '"Қазақстан Республикасында лотереяларды (мемлекеттік (ұлттық) лотереядан басқа) ұйымдастыру және өткізу жөніндегі қызметті лицензиялау ережесі мен оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 30 маусымдағы № 551 қаулысына өзгерістер енгізу туралы'

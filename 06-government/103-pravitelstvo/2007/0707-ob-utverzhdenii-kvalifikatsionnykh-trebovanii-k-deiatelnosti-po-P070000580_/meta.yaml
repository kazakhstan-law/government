  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 7 июля 2007 года № 580 "Об утверждении Правил лицензирования и квалификационных требований к деятельности по заготовке древесины на участках государственного лесного фонда, осуществляемой лесопользователями"
    kaz: '"Мемлекеттік орман қорының учаскелерінде орман пайдаланушылар жүзеге асыратын сүрек дайындау жөніндегі қызметті лицензиялау ережесін және оған қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 7 шілдедегі № 580 қаулысына өзгерістер енгізу туралы'

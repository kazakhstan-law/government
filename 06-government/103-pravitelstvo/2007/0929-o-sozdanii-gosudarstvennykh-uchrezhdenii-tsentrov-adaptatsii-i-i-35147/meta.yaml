title:
  rus: О создании государственных учреждений-центров адаптации и интеграции оралманов Комитета по миграции Министерства труда и социальной защиты населения Республики Казахстан
  kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің Көші-қон комитеті оралмандарды бейімдеу және кіріктіру орталықтары - мемлекеттік мекемелерін құру туралы

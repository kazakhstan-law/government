  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 18 июня 2007 года № 508 "Об утверждении Правил выдачи разрешений на импорт, экспорт озоноразрушающих веществ и содержащей их продукции, производство работ с использованием озоноразрушающих веществ, ремонт, монтаж, обслуживание оборудования, содержащего озоноразрушающие вещества" и от 31 марта 2009 года № 449 "Об утверждении критериев распределения объектов I категории, подлежащих государственной экологической экспертизе, и для выдачи разрешений на эмиссии в окружающую среду между уполномоченным органом в области охраны окружающей среды и его территориальными подразделениями"
    kaz: Қазақстан Республикасы Үкіметінің "Озон қабатын бұзатын және құрамында солардың өнімдері бар заттарды импорттауға, экспорттауға, озон қабатын бұзатын заттарды пайдалана отырып жұмыстар жүргізуге, құрамында озон қабатын бұзатын заттар бар жабдықтарды жөндеуге, монтаждауға, оларға қызмет көрсетуге рұқсат беру ережесін бекіту туралы" 2007 жылғы 18 маусымдағы № 508 және "Мемлекеттік экологиялық сараптамаға жататын және қоршаған ортаға эмиссияға рұқсат беру үшін I санаттағы объектілерді қоршаған ортаны қорғау саласындағы уәкілетті орган мен оның аумақтық бөлімшелері арасында бөлу өлшемдерін бекіту туралы" 2009 жылғы 31 наурыздағы № 449 қаулыларына өзгерістер енгізу туралы

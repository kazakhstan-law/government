  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 19 ноября 2007 года № 1106 "Об утверждении Перечня специализированных организаций (агентов), осуществляющих закуп сельскохозяйственной продукции и продуктов ее глубокой переработки у отечественных производителей, а также услуг по их хранению, переработке, перевозке"
    kaz: '"Отандық өндірушілерден ауыл шаруашылығы өнімін және оның терең қайта өңдеу өнімдерін сатып алуды, сондай-ақ оларды сақтау, қайта өңдеу, тасымалдау жөніндегі қызметтерді жүзеге асыратын мамандандырылған ұйымдардың (агенттердің) тізбесін бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 19 қарашадағы № 1106 қаулысына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/65531/rus

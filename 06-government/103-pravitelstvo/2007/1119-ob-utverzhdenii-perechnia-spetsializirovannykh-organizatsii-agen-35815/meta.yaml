title:
  rus: Об утверждении перечня специализированных организаций (агентов), осуществляющих закупочные и товарные интервенции, а также закуп услуг по хранению, переработке, перевозке продовольственных товаров
  kaz: Сатып алу және тауар интервенцияларын, сондай-ақ азық-түлік тауарларын сақтау, өңдеу, тасымалдау бойынша көрсетілетін қызметтерді сатып алуды жүзеге асыратын мамандандырылған ұйымдардың (агенттердің) тізбесін бекіту туралы

  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 29 декабря 2007 года № 1372 "Об утверждении Технического регламента о требованиях к выбросам вредных (загрязняющих) веществ автотранспортных средств, выпускаемых в обращение на территории Республики Казахстан" и от 24 сентября 2010 года № 977 "О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 29 декабря 2007 года № 1372 и от 1 марта 2010 года № 153"
    kaz: Қазақстан Республикасы Үкіметінің "Қазақстан Республикасының аумағында айналымға шығарылатын автокөлік құралдарының зиянды (ластаушы) заттар шығарындыларына қойылатын талаптар туралы техникалық регламентті бекіту туралы" 2007 жылғы 29 желтоқсандағы № 1372 және "Қазақстан Республикасы Үкіметінің 2007 жылғы 29 желтоқсандағы № 1372 және 2010 жылғы 1 наурыздағы № 153 қаулыларына өзгерістер мен толықтырулар енгізу туралы" 2010 жылғы 24 қыркүйектегі № 977 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/59467/rus

    kaz: '"Азаматтық және қызметтік қару мен оның патрондарына криминалистік талаптар мен сынау әдістерін бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 29 қарашадағы № 1146 қаулысына өзгерістер мен толықтырулар енгізу туралы'

  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 29 августа 2007 года № 757 "Об утверждении Правил лицензирования и квалификационных требований, предъявляемых к видам деятельности по производству (формуляции), реализации и применению пестицидов (ядохимикатов) аэрозольным и фумигационным способами"
    kaz: '"Пестицидтерді (улы химикаттарды) өндіру (формуляциялау), өткізу және аэрозольдік және фумигациялық тәсілдермен қолдану жөніндегі қызмет түрлерін лицензиялау ережесін және оларға қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Үкіметінің 2007 жылғы 29 тамыздағы № 757 қаулысына өзгерістер енгізу туралы'

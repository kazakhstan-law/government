title:
  rus: Об утверждении перечня фондовых бирж, необходимого для применения норм Закона Республики Казахстан "О государственных закупках", а также требований к форме и содержанию документов, предоставляемых ими
  kaz: '"Мемлекеттік сатып алу туралы" Қазақстан Республикасы Заңының нормаларын қолдану үшін қажет қор биржаларының тізбесін, сондай-ақ олар ұсынатын құжаттардың нысаны мен мазмұнына қойылатын талаптарды бекіту туралы'

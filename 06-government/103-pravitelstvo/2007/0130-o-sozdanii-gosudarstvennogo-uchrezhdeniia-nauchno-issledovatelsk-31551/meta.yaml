title:
  rus: О создании государственного учреждения "Научно-исследовательский и аналитический центр по вопросам религии" Министерства юстиции Республики Казахстан
  kaz: Қазақстан Республикасы Әдiлет министрлiгiнiң "Дiн мәселелерi жөнiндегi ғылыми-зерттеу және талдау орталығы" мемлекеттiк мекемесiн құру туралы

act_code: '31756'
requisite: Постановление Правительства Республики Казахстан от 7 февраля 2007 года № 87. Утратило силу постановлением Правительства Республики Казахстан от 23 января 2008 года № 41
title:
  rus: Об утверждении Правил выплаты субсидий сельскохозяйственным товаропроизводителям на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, и повышение урожайности и качества продукции растениеводства на 2007 год
  kaz: Ауыл шаруашылығы тауарын өндірушілерге 2007 жылғы көктемгі егіс және егін жинау жұмыстарын жүргізу үшін қажетті жанар-жағармай материалдары мен басқа да тауар-материалдық құндылықтардың құнын арзандатуға және өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға субсидия төлеу ережесін бекіту туралы

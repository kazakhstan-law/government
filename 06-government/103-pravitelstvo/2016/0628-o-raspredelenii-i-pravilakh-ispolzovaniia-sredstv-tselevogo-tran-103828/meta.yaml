act_code: '103828'
requisite: Постановление Правительства Республики Казахстан от 28 июня 2016 года № 374
title:
  rus: О распределении и Правилах использования средств целевого трансферта из Национального фонда Республики Казахстан на реализацию проектов по содействию устойчивому развитию и росту Республики Казахстан, осуществляемых совместно с международными финансовыми организациями в рамках рамочных соглашений о партнерстве
  kaz: Әріптестік туралы негіздемелік келісімдер шеңберінде халықаралық қаржы ұйымдарымен бірлесіп жүзеге асырылатын Қазақстан Республикасының орнықты дамуына және өсуіне жәрдемдесу жөніндегі жобаларды іске асыруға Қазақстан Республикасының Ұлттық қорынан берілетін нысаналы трансферт қаражатын бөлу және пайдалану қағидалары туралы

  requisite: Постановление Правительства Республики Казахстан от 22 февраля 2017 года № 87
  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 6 декабря 2016 года № 775 «О реализации Закона Республики Казахстан «О республиканском бюджете на 2017 – 2019 годы», увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2016 года и использовании (доиспользовании) в 2017 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2016 году
    kaz: «2017 – 2019 жылдарға арналған республикалық бюджет туралы» Қазақстан Республикасының Заңын іске асыру туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 6 желтоқсандағы № 775 қаулысына өзгерістер мен толықтырулар енгізу және 2016 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2016 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2017 жылы пайдалану (толық пайдалану) туралы
  link: https://zan.gov.kz/client/#!/doc/110033/rus

  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 30 апреля 2016 года № 262 «Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2016 год областными бюджетами, бюджетами городов Астаны и Алматы на апробирование подушевого финансирования организаций среднего образования»
    kaz: «Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2016 жылға арналған республикалық бюджеттен орта білім беру ұйымдарын жан басына шаққандағы қаржыландыруды сынақтан өткізуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 30 сәуірдегі № 262 қаулысына өзгеріс енгізу туралы

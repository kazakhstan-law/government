  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 21 октября 2016 года № 607 «Об утверждении Правил функционирования системы гарантирования прав граждан Республики Казахстан в сфере выездного туризма, суммы денег, подлежащих обеспечению банковской гарантией для туроператоров и туроператоров-фрахтователей, осуществляющих деятельность в сфере выездного туризма, суммы денег, подлежащих перечислению на банковский счет, открытый специально для администратора системы гарантирования прав граждан Республики Казахстан в сфере выездного туризма»
    kaz: «Қазақстан Республикасы азаматтарының шығу туризмі саласындағы құқықтарына кепілдік беру жүйесінің жұмыс істеу қағидаларын, шығу туризмі саласындағы қызметін жүзеге асыратын туроператорлар мен туроператор-әуе кемесімен жалданушылар үшін банктік кепілдіктермен қамтамасыз етуге жататын ақша сомасын, Қазақстан Республикасы азаматтарының шығу туризмі саласындағы құқықтарына кепілдік беру жүйесі әкімшісі үшін арнайы ашылған банктік шотқа аударылуы тиіс ақша сомасын бекіту туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 21 қазандағы № 607 қаулысына өзгерістер мен толықтырулар енгізу туралы

act_code: '107055'
requisite: Постановление Правительства Республики Казахстан от 21 октября 2016 года № 607. Утратило силу постановлением Правительства Республики Казахстан от 1 сентября 2023 года № 752 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил функционирования системы гарантирования прав граждан Республики Казахстан в сфере выездного туризма, суммы денег, подлежащих обеспечению банковской гарантией для туроператоров и туроператоров-фрахтователей, осуществляющих деятельность в сфере выездного туризма, суммы денег, подлежащих перечислению на банковский счет, открытый специально для администратора системы гарантирования прав граждан Республики Казахстан в сфере выездного туризма
  kaz: Қазақстан Республикасы азаматтарының шығу туризмі саласындағы құқықтарына кепілдік беру жүйесінің жұмыс істеу қағидаларын, шығу туризмі саласында қызметін жүзеге асыратын туроператорлар мен туроператорлар-әуе кемесімен жалданушылар үшін банктік кепілдіктермен қамтамасыз етуге жататын ақша сомасын, Қазақстан Республикасы азаматтарының шығу туризмі саласындағы құқықтарына кепілдік беру жүйесі әкімшісі үшін арнайы ашылған банктік шотқа аударылуы тиіс ақша сомасын бекіту туралы

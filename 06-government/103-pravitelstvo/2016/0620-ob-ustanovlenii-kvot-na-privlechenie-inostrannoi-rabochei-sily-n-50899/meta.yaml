act_code: '50899'
requisite: Постановление Правительства Республики Казахстан от 20 июня 2016 года № 359
title:
  rus: 'Об установлении квот на привлечение иностранной рабочей силы на 2016 и 2017 годы по приоритетному проекту «Строительство и эксплуатация многофункционального комплекса со встроенными офисными, гостиничными, жилыми, торгово-развлекательными помещениями и паркингом, расположенного по адресу: город Астана, улица Достык, дом 16» и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы на 2016 и 2017 годы для реализации приоритетного проекта «Строительство и эксплуатация многофункционального комплекса со встроенными офисными, гостиничными, жилыми, торгово-развлекательными помещениями и паркингом, расположенного по адресу: город Астана, улица Достык, дом 16»'
  kaz: «Астана қаласы, Достық көшесі, 16-үйде орналасқан жапсарлас кеңсе, қонақүй, тұрғын, сауда ойын-сауық үй-жайлары және паркингі бар көпфункционалды кешенді салу және пайдалану» басым жобасы бойынша шетелдік жұмыс күшін тартуға 2016 және 2017 жылдарға арналған квоталарды белгілеу және «Астана қаласы, Достық көшесі, 16-үй мекенжайы бойынша орналасқан жапсарлас кеңсе, қонақүй, тұрғын үй, сауда ойын-сауық үй-жайлары және паркингі бар көпфункционалды кешенді салу және пайдалану» басым жобасын іске асыру үшін шетелдік жұмыс күшін тартуға 2016 және 2017 жылдарға арналған рұқсат беру шарттарын бекіту туралы

    kaz: «Бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтері есебінен сатып алуға рұқсат етілген қаржы құралдарының тізбесін бекіту туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 18 наурыздағы № 149 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 14 января 2016 года № 13 «О некоторых вопросах реализации государственной поддержки инвестиций» и признании утратившим силу постановления Правительства Республики Казахстан от 29 декабря 2015 года № 1120 «Об утверждении Правил предоставления инвестиционной субсидии»
    kaz: «Инвестицияларды мемлекеттік қолдауды іске асырудың кейбір мәселелері туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 14 қаңтардағы № 13 қаулысына өзгерістер мен толықтыру енгізу және «Инвестициялық субсидия беру қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2015 жылғы 29 желтоқсандағы № 1120 қаулысының күші жойылды деп тану туралы

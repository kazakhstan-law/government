act_code: '99963'
requisite: Постановление Правительства Республики Казахстан от 4 марта 2016 года № 133
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2016 год областными бюджетами, бюджетами городов Астаны и Алматы на внедрение обусловленной денежной помощи по проекту «Өрлеу»
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2016 жылға арналған республикалық бюджеттен «Өрлеу» жобасы бойынша шартты ақшалай көмекті ендіруге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

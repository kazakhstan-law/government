    rus: О внесении изменений и дополнения в постановление Правительства Республики Казахстан от 2 декабря 2016 года № 762 «Об утверждении Правил проведения конкурса на получение права официального опубликования законодательных актов периодическими печатными изданиями»
    kaz: «Мерзімді баспа басылымдарының заңнамалық актiлердi ресми жариялау құқығын алуға конкурс өткiзу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 2 желтоқсандағы № 762 қаулысына өзгерістер мен толықтыру енгізу туралы

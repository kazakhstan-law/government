title:
  rus: Об утверждении Правил проведения конкурса на получение права официального опубликования законодательных актов и итоговых решений Конституционного Суда периодическими печатными изданиями
  kaz: Мерзімді баспа басылымдарының заңдарды және Конституциялық Соттың қорытынды шешімдерін ресми жариялау құқығын алуына конкурс өткiзу қағидаларын бекіту туралы

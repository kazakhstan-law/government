  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 10 декабря 2002 года № 1300 «О Регламенте Правительства Республики Казахстан» и от 29 декабря 2016 года № 907 «Об утверждении Правил организации законопроектной работы в уполномоченных органах Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Үкіметінің Регламенті туралы» 2002 жылғы 10 желтоқсандағы № 1300 және «Қазақстан Республикасының уәкiлеттi органдарында заң жобалау жұмыстарын ұйымдастыру қағидаларын бекіту туралы» 2016 жылғы 29 желтоқсандағы № 907 қаулыларына өзгерістер мен толықтырулар енгізу туралы

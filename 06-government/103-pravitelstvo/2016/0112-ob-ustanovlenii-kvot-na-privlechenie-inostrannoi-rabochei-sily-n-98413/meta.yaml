title:
  rus: Об установлении квот на привлечение иностранной рабочей силы на 2016 год по приоритетному проекту «Строительство торгово-развлекательного центра «Mega silk way» и утверждении условий выдачи разрешений на привлечение иностранной рабочей силы для реализации приоритетного проекта «Строительство торгово-развлекательного центра «Mega silk way»
  kaz: «Mega silk way» сауда-ойын-сауық орталығын салу» басым жобасы бойынша шетелдік жұмыс күшін тартуға 2016 жылға арналған квоталарды белгілеу және «Mega silk way» сауда-ойын-сауық орталығын салу» басым жобасын іске асыру үшін шетелдiк жұмыс күшiн тартуға рұқсат беру шарттарын бекіту туралы

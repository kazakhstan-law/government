title:
  rus: Об утверждении Правил и сроков представления физическими и юридическими лицами, участвующими в выполнении функций по управлению государственным имуществом, отчетов обо всех сделках имущественного характера и финансовой деятельности, связанных с государственной собственностью
  kaz: Мемлекеттік мүлікті басқару жөніндегі функцияларды орындауға қатысатын жеке және заңды тұлғалардың мемлекеттік меншікпен байланысты мүліктік сипаттағы барлық мәмілелер және қаржылық қызмет туралы есептер беруінің қағидалары мен мерзімдерін бекіту туралы

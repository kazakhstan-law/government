  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 2 декабря 2016 года № 762 «Об утверждении Правил проведения конкурса на получение права официального опубликования законодательных актов и итоговых решений Конституционного Суда периодическими печатными изданиями»

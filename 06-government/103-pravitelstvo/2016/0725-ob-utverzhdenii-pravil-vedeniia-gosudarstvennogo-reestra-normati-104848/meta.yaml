  title:
    rus: О внесении изменения в постановление Правительства Республики Казахстан от 25 июля 2016 года № 439 «Об утверждении Правил ведения Государственного реестра нормативных правовых актов Республики Казахстан, Эталонного контрольного банка нормативных правовых актов Республики Казахстан»
    kaz: «Қазақстан Республикасы нормативтiк құқықтық актілерінің мемлекеттiк тізілімін, Қазақстан Республикасы нормативтiк құқықтық актілерінің эталондық бақылау банкін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 25 шілдедегі № 439 қаулысына өзгеріс енгізу туралы

title:
  rus: Об утверждении Правил ведения Государственного реестра нормативных правовых актов Республики Казахстан, Эталонного контрольного банка нормативных правовых актов Республики Казахстан
  kaz: Қазақстан Республикасы нормативтiк құқықтық актілерiнiң мемлекеттiк тiзiлiмiн, Қазақстан Республикасы нормативтiк құқықтық актілерiнiң эталондық бақылау банкiн жүргiзу қағидаларын бекiту туралы

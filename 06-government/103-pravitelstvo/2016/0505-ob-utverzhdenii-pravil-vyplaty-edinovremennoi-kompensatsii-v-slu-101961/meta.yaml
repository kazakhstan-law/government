act_code: '101961'
requisite: Постановление Правительства Республики Казахстан от 5 мая 2016 года № 277
title:
  rus: Об утверждении Правил выплаты единовременной компенсации в случаях гибели (смерти) лица из числа гражданского персонала в период миротворческой операции, а также в результате увечья (ранения, травмы, контузии), заболевания, полученных в результате участия в миротворческой операции, установления инвалидности или получения увечья (ранения, травмы, контузии) в период миротворческой операции
  kaz: Азаматтық персонал қатарындағы адам бітімгершілік операция кезеңінде, сондай-ақ бітімгершілік операцияға қатысу нәтижесінде мертігуі (жаралануы, жарақаттануы, контузия алуы), ауыруы салдарынан қаза тапқан (қайтыс болған), бітімгершілік операция кезеңінде мүгедектік белгіленген немесе мертіккен (жараланған, жарақаттанған, контузия алған) жағдайларда біржолғы өтемақы төлеу қағидаларын бекіту туралы

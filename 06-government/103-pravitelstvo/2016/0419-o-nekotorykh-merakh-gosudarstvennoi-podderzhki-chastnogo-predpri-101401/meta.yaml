  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 19 апреля 2016 года № 234 «О некоторых мерах государственной поддержки частного предпринимательства» и от 11 декабря 2018 года № 820 «О некоторых вопросах обеспечения долгосрочной тенговой ликвидности для решения задачи доступного кредитования»
    kaz: Қазақстан Республикасы Үкіметінің «Жеке кәсіпкерлікті мемлекеттік қолдаудың кейбір шаралары туралы» 2016 жылғы 19 сәуірдегі № 234 және «Қолжетімді кредит беру міндетін шешу үшін ұзақ мерзімді теңгелік өтімділікті қамтамасыз етудің кейбір мәселелері туралы» 2018 жылғы 11 желтоқсандағы № 820 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134492/rus

  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 31 марта 2015 года № 168 «Об утверждении Единой программы поддержки и развития бизнеса «Дорожная карта бизнеса 2020», внесении изменений в постановление Правительства Республики Казахстан от 10 июня 2010 года № 556 «О некоторых мерах по реализации Программы «Дорожная карта бизнеса 2020» и признании утратившими силу некоторых решений Правительства Республики Казахстан» и от 19 апреля 2016 года № 234 «О некоторых мерах государственной поддержки частного предпринимательства»
    kaz: Қазақстан Республикасы Үкіметінің «Бизнестің жол картасы-2020» бизнесті қолдау мен дамытудың бірыңғай бағдарламасын бекіту, «Бизнестің жол картасы 2020» іске асыру жөніндегі кейбір шаралар туралы» Қазақстан Республикасы Үкіметінің 2010 жылғы 10 маусымдағы № 556 қаулысына өзгерістер енгізу және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» 2015 жылғы 31 наурыздағы № 168 және «Жеке кәсіпкерлікті мемлекеттік қолдаудың кейбір шаралары туралы» 2016 жылғы 19 сәуірдегі № 234 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/117721/rus

act_code: '106069'
requisite: Постановление Правительства Республики Казахстан от 18 февраля 2016 года № 70
title:
  rus: Об условиях кредитования областных бюджетов, бюджетов городов Астаны и Алматы на проектирование и (или) строительство жилья на 2016 год в рамках Программы развития регионов до 2020 года
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттеріне Өңірлерді дамытудың 2020 жылға дейінгі бағдарламасы шеңберінде тұрғын үй жобалауға және (немесе) салуға 2016 жылға арналған кредит беру шарттары туралы

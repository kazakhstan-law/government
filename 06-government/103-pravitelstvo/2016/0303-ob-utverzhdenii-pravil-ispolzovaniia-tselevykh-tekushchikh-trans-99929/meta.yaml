act_code: '99929'
requisite: Постановление Правительства Республики Казахстан от 3 марта 2016 года № 127
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2016 год областными бюджетами, бюджетами городов Астаны и Алматы на проведение профилактической дезинсекции и дератизации (за исключением дезинсекции и дератизации на территории природных очагов инфекционных и паразитарных заболеваний, а также в очагах инфекционных и паразитарных заболеваний)
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2016 жылға арналған республикалық бюджеттен профилактикалық дезинсекция мен дератизация жүргізуге (инфекциялық және паразиттік аурулардың табиғи ошақтарының аумағындағы, сондай-ақ инфекциялық және паразиттік аурулардың ошақтарындағы дезинсекция мен дератизацияны қоспағанда) берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

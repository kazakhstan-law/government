  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 18 февраля 2016 года № 78 «Об утверждении Правил медицинского и санаторно-курортного обслуживания сотрудников и членов их семей, проживающих совместно с ними, пенсионеров правоохранительных органов, а также детей сотрудников, погибших при исполнении служебных обязанностей, до достижения ими совершеннолетия, в соответствующих государственных организациях здравоохранения»
    kaz: «Құқық қорғау органдарының қызметкерлеріне және олармен бірге тұратын отбасы мүшелеріне, зейнеткерлеріне, сондай-ақ қызметтік міндеттерін атқару кезінде қаза тапқан қызметкерлердің балаларына олар кәмелеттік жасқа толғанға дейін тиісті мемлекеттік денсаулық сақтау ұйымдарында медициналық және санаторий-курорттық қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2016 жылғы 18 ақпандағы № 78 қаулысына өзгерістер енгізу туралы

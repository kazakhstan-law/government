act_code: '106078'
requisite: Постановление Правительства Республики Казахстан от 18 июня 2016 года № 354
title:
  rus: Об утверждении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку специалистов для Вооруженных сил, других войск и воинских формирований, а также специальных государственных органов), на 2016-2017 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қарулы Күштер, басқа да әскерлер мен әскери құралымдар, сондай-ақ арнаулы мемлекеттік органдар үшін мамандар даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2016 – 2017 оқу жылына арналған мемлекеттік білім беру тапсырысын бекіту туралы

requisite: Постановление Правительства Республики Казахстан от 18 февраля 2016 года № 80. Утратило силу постановлением Правительства Республики Казахстан от 1 сентября 2023 года № 752 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения конкурса на определение юридического лица, осуществляющего функции администратора системы гарантирования прав граждан Республики Казахстан в сфере выездного туризма
  kaz: Қазақстан Республикасы азаматтарының шығу туризмі саласындағы құқықтарына кепілдік беру жүйесі әкімшісінің функциясын жүзеге асыратын заңды тұлғаны айқындауға арналған конкурсты өткізу қағидаларын бекіту туралы

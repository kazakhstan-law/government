act_code: '107904'
requisite: Постановление Правительства Республики Казахстан от 2 декабря 2016 года № 761
title:
  rus: Об утверждении Правил неоднократного пересечения Государственной границы Республики Казахстан вне выделенных воздушных коридоров без прохождения пограничного, таможенного (в части совершения таможенных операций, связанных с прибытием (убытием) судов) и иных видов контроля для казахстанских воздушных судов, осуществляющих доставку людей, грузов и товаров с территории Республики Казахстан на искусственные острова, установки и сооружения, плавучие буровые установки, включая плавучие гостиницы, расположенные в водном пространстве над континентальным шельфом, либо с искусственных островов, установок и сооружений, плавучих буровых установок, включая плавучие гостиницы, на территорию Республики Казахстан
  kaz: Құрлықтық қайраң үстіндегі су кеңістігінде орналасқан қалқымалы қонақүйлерді қоса алғанда, Қазақстан Республикасының аумағынан жасанды аралдарға, қондырғылар мен құрылыстарға, қалқымалы бұрғылау қондырғыларына не қалқымалы қонақүйлерді қоса алғанда, жасанды аралдардан, қондырғылар мен құрылыстардан, қалқымалы бұрғылау қондырғыларынан Қазақстан Республикасының аумағына адамдарды, жүктер мен тауарларды жеткізуді жүзеге асыратын қазақстандық әуе кемелері үшін шекаралық, кедендік бақылаудан (кемелердің келуімен (кетуімен) байланысты кедендік операцияларды жүргізу бөлігінде) және бақылаудың өзге де түрлерінен өтпей Қазақстан Республикасының Мемлекеттік шекарасын бөлінген әуе дәліздерінен тыс бірнеше мәрте кесіп өту қағидаларын бекіту туралы

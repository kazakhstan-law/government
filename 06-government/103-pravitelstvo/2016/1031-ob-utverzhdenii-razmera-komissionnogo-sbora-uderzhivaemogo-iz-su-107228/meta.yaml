act_code: '107228'
requisite: Постановление Правительства Республики Казахстан от 31 октября 2016 года № 636. Утратило силу постановлением Правительства Республики Казахстан от 1 сентября 2023 года № 752 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размера комиссионного сбора, удерживаемого из суммы денег, подлежащих перечислению на банковский счет, открытый специально для администратора системы гарантирования прав граждан Республики Казахстан в сфере выездного туризма
  kaz: Қазақстан Республикасы азаматтарының шығу туризмі саласындағы құқықтарына кепілдік беру жүйесінің әкімшісі үшін арнайы ашылған банктік шотқа аударылуға жататын ақша сомасынан ұсталатын комиссиялық алым мөлшерін бекіту туралы

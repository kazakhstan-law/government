  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 13 октября 2016 года № 589 «Об утверждении Правил ведения Государственного фонда экологической информации» и от 24 января 2017 года № 13 «Об утверждении Правил предоставления информации центральными государственными органами и местными исполнительными органами для составления Национального доклада о состоянии окружающей среды и об использовании природных ресурсов Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Мемлекеттік экологиялық ақпарат қорын жүргізу қағидаларын бекіту туралы» 2016 жылғы 13 қазандағы № 589 және «Қоршаған ортаның жай-күйі және Қазақстан Республикасының табиғи ресурстарын пайдалану туралы ұлттық баяндаманы жасау үшін орталық мемлекеттік органдар мен жергілікті атқарушы органдардың ақпарат ұсыну қағидаларын бекіту туралы» 2017 жылғы 24 қаңтардағы № 13 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/147032/rus

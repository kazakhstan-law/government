title:
  rus: Об утверждении Правил выдачи разрешений на неоднократное пересечение Государственной границы Республики Казахстан казахстанскими и иностранными судами и казахстанскими воздушными судами, задействованными в операциях по недропользованию и обеспечении операций по недропользованию
  kaz: Жер қойнауын пайдалану жөніндегі операцияларға және жер қойнауын пайдалану жөніндегі операцияларды қамтамасыз етуге тартылған қазақстандық және шетелдік кемелер мен қазақстандық әуе кемелерінің Қазақстан Республикасының Мемлекеттік шекарасын бірнеше рет кесіп өтуіне рұқсаттар беру қағидаларын бекіту туралы

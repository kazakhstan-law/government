  title:
    rus: О создании Ащиозекского государственного природного заказника республиканского значения и республиканского государственного учреждения «Государственный природный резерват «Бокейорда» Комитета лесного хозяйства и животного мира Министерства экологии, геологии и природных ресурсов Республики Казахстан»

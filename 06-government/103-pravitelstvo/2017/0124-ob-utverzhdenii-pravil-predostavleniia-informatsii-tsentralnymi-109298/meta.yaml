title:
  rus: Об утверждении Правил предоставления информации центральными государственными органами и местными исполнительными органами для составления Национального доклада о состоянии окружающей среды и об использовании природных ресурсов Республики Казахстан
  kaz: Қоршаған ортаның жай-күйі және Қазақстан Республикасының табиғи ресурстарын пайдалану туралы ұлттық баяндаманы жасау үшін орталық мемлекеттік органдар мен жергілікті атқарушы органдардың ақпарат ұсыну қағидаларын бекіту туралы

act_code: '109697'
requisite: Постановление Правительства Республики Казахстан от 13 февраля 2017 года № 52
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2017 год областными бюджетами, бюджетами городов Астаны и Алматы на внедрение обусловленной денежной помощи по проекту «Өрлеу»
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2017 жылға арналған республикалық бюджеттен «Өрлеу» жобасы бойынша шартты ақшалай көмекті ендіруге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

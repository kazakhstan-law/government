act_code: '110159'
requisite: Постановление Правительства Республики Казахстан от 31 марта 2017 года № 145
title:
  rus: Об утверждении основных условий кредитования областных бюджетов, бюджетов городов Астаны и Алматы на содействие развитию предпринимательства в областных центрах, городах Астаны и Алматы, Туркестан, Семей и моногородах на 2017 год
  kaz: Облыстық бюджеттерге, Астана және Алматы қалаларының бюджеттерiне облыс орталықтарында, Астана, Алматы, Түркістан, Семей қалаларында және моноқалаларда кәсіпкерлікті дамытуға жәрдемдесуге 2017 жылға кредит берудің негізгі шарттарын бекіту туралы

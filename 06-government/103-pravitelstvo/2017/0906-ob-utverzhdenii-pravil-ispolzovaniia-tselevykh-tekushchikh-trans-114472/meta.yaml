act_code: '114472'
requisite: Постановление Правительства Республики Казахстан от 6 сентября 2017 года № 543
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2017 год областными бюджетами, бюджетами городов Астаны и Алматы на доплату учителям, прошедшим стажировку по языковым курсам
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2017 жылға арналған республикалық бюджеттен тілдік курстар бойынша тағылымдамадан өткен мұғалімдерге қосымша ақы төлеуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

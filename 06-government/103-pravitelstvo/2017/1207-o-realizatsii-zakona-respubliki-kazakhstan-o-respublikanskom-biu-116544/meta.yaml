  title:
    rus: Об увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2017 года и использовании (доиспользовании) в 2018 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2017 году
    kaz: 2017 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту және 2017 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2018 жылы пайдалану (толық пайдалану) туралы

requisite: Постановление Правительства Республики Казахстан от 29 ноября 2017 года № 788. Утратило силу постановлением Правительства Республики Казахстан от 14 октября 2019 года № 759 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления выбора исполнителей государственного оборонного заказа из числа организаций, включенных в реестр отечественных товаропроизводителей и отечественных поставщиков работ, услуг, операторами по исполнению государственного оборонного заказа
  kaz: Мемлекеттік қорғаныстық тапсырысты орындау жөніндегі операторлардың отандық тауар өндірушілер мен жұмыстарды, көрсетілетін қызметтерді отандық берушілер тізіліміне енгізілген ұйымдар арасынан мемлекеттік қорғаныстық тапсырысты орындаушыларды таңдауды жүзеге асыруы қағидаларын бекіту туралы

  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 25 апреля 2015 года № 325 «Об утверждении Правил использования резервов Правительства Республики Казахстан и местных исполнительных органов и признании утратившими силу некоторых решений Правительства Республики Казахстан» и от 24 августа 2017 года № 503 «Об утверждении Правил составления и представления годового отчета об исполнении республиканского бюджета»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Үкіметінің және жергілікті атқарушы органдардың резервтерін пайдалану қағидаларын бекіту туралы және Қазақстан Республикасы Үкіметінің кейбір шешімдерінің күші жойылды деп тану туралы» 2015 жылғы 25 сәуірдегі № 325 және «Республикалық бюджеттің атқарылуы туралы жылдық есепті жасау және ұсыну қағидаларын бекіту туралы» 2017 жылғы 24 тамыздағы № 503 қаулыларына өзгерістер енгізу туралы

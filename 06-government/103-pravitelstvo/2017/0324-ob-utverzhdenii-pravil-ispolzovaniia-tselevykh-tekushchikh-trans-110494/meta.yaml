  title:
    rus: О внесении изменений в постановление Правительства Республики Казахстан от 24 марта 2017 года № 129 «Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2017 год областными бюджетами, бюджетами городов Астаны и Алматы на здравоохранение»
    kaz: «Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2017 жылға арналған республикалық бюджеттен денсаулық сақтауға берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2017 жылғы 24 наурыздағы № 129 қаулысына өзгерістер енгізу туралы

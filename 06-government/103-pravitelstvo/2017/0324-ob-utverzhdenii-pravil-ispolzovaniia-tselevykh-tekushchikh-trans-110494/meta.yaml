act_code: '110494'
requisite: Постановление Правительства Республики Казахстан от 24 марта 2017 года № 129
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2017 год областными бюджетами, бюджетами городов Астаны и Алматы на здравоохранение
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2017 жылға арналған республикалық бюджеттен денсаулық сақтауға берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

act_code: '115455'
requisite: Постановление Правительства Республики Казахстан от 23 октября 2017 года № 671
title:
  rus: Об утверждении Правил освобождения от прохождения пограничного, таможенного и иных видов контроля при пересечении Государственной границы Республики Казахстан в отношении железнодорожных транспортных средств, следующих безостановочно транзитом через Республику Казахстан
  kaz: Қазақстан Республикасы арқылы транзитпен аялдамай жүріп өтетін теміржол көлігі құралдарына қатысты Қазақстан Республикасының Мемлекеттік шекарасын кесіп өту кезінде шекаралық, кедендік және өзге де бақылау түрлерінен өтуден босату қағидаларын бекіту туралы

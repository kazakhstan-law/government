title:
  rus: Об установлении исходных линий для отсчета ширины территориальных вод (моря) Республики Казахстан на Каспийском море, а также географических точек (с указанием основных геодезических данных) для определения внешнего предела территориальных вод (моря)
  kaz: Каспий теңізіндегі Қазақстан Республикасының аумақтық суларының (теңізінің) енін есептеп шығару үшін бастапқы сызықтарды, сондай-ақ аумақтық сулардың (теңіздің) сыртқы шегін айқындау үшін географиялық нүктелерді (негізгі геодезиялық деректерді көрсете отырып) белгілеу туралы

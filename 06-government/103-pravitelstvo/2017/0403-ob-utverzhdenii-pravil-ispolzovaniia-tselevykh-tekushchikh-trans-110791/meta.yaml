act_code: '110791'
requisite: Постановление Правительства Республики Казахстан от 3 апреля 2017 года № 159
title:
  rus: Об утверждении Правил использования целевых текущих трансфертов из республиканского бюджета на 2017 год областными бюджетами, бюджетами городов Астаны и Алматы на доплату учителям за замещение на период обучения основного сотрудника
  kaz: Облыстық бюджеттердің, Астана және Алматы қалалары бюджеттерінің 2017 жылға арналған республикалық бюджеттен оқу кезеңінде негізгі қызметкерді алмастырғаны үшін мұғалімдерге қосымша ақы төлеуге берілетін ағымдағы нысаналы трансферттерді пайдалану қағидаларын бекіту туралы

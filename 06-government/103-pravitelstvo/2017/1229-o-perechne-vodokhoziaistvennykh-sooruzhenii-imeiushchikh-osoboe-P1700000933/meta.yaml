  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 21 декабря 2004 года № 1344 «Об утверждении перечня водохозяйственных сооружений, находящихся в республиканской собственности» и от 29 декабря 2017 года № 933 «О перечне водохозяйственных сооружений, имеющих особое стратегическое значение, в том числе которые могут быть переданы в аренду и доверительное управление»
    kaz: Қазақстан Республикасы Үкіметінің «Республикалық меншіктегі су шаруашылығы құрылыстарының тізбесін бекіту туралы» 2004 жылғы 21 желтоқсандағы № 1344 және «Ерекше стратегиялық маңызы бар, оның ішінде жалға және сенімгерлік басқаруға берілуі мүмкін су шаруашылығы құрылыстарының тізбесі туралы» 2017 жылғы 29 желтоқсандағы № 933 қаулыларына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/208336/rus

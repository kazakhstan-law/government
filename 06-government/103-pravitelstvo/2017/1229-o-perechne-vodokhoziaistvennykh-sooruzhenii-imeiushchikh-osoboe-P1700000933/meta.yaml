  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 29 декабря 2017 года № 933 «О перечне водохозяйственных сооружений, имеющих особое стратегическое значение, в том числе которые могут быть переданы в аренду и доверительное управление» и от 29 декабря 2020 года № 908 «О некоторых вопросах приватизации на 2021 − 2025 годы»
    kaz: Қазақстан Республикасы Үкіметінің «Ерекше стратегиялық маңызы бар, оның ішінде жалға және сенімгерлік басқаруға берілуі мүмкін су шаруашылығы құрылыстарының тізбесі туралы» 2017 жылғы 29 желтоқсандағы № 933 және «Жекешелендірудің 2021 – 2025 жылдарға арналған кейбір мәселелері туралы» 2020 жылғы 29 желтоқсандағы № 908 қаулыларына өзгерістер мен толықтырулар енгізу туралы

title:
  rus: Об утверждении перечней приоритетных видов деятельности специальных экономических зон и объектов, строительство которых предназначено для осуществления приоритетных видов деятельности специальных экономических зон, а также Правил включения приоритетных видов деятельности в перечень приоритетных видов деятельности специальных экономических зон и объектов строительства в перечень объектов, строительство которых предназначено для осуществления приоритетных видов деятельности специальных экономических зон
  kaz: Құрылысы арнайы экономикалық аймақтар қызметінің басым түрлерін жүзеге асыруға арналған арнайы экономикалық аймақтар мен объектілер қызметінің басым түрлерінің тізбелерін, сондай-ақ Қызметтің басым түрлерін арнайы экономикалық аймақтар қызметінің басым түрлерінің тізбесіне және құрылыс объектілерін құрылысы арнайы экономикалық аймақтар қызметінің басым түрлерін жүзеге асыруға арналған объектілер тізбесіне қосу қағидаларын бекіту туралы

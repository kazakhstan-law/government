title:
  rus: О некоторых вопросах Министерства труда и социальной защиты населения Республики Казахстан
  kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтiк қорғау министрлiгінiң кейбiр мәселелерi туралы

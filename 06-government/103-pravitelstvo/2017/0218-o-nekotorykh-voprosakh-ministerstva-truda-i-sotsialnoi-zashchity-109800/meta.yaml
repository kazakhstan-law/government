  requisite: Постановление Правительства Республики Казахстан от 23 февраля 2023 года № 157
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 18 октября 2013 года № 1116 «Об утверждении Правил и сроков исчисления, удержания (начисления) и перечисления обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов в единый накопительный пенсионный фонд и взысканий по ним» и от 18 февраля 2017 года № 81 «Некоторые вопросы Министерства труда и социальной защиты населения Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Міндетті зейнетақы жарналарын, міндетті кәсіптік зейнетақы жарналарын есептеу, ұстап қалу (есебіне жазу) және бірыңғай жинақтаушы зейнетақы қорына аудару және олар бойынша өндіріп алу қағидалары мен мерзімдерін бекіту туралы» 2013 жылғы 18 қазандағы № 1116 және «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің кейбір мәселелері туралы» 2017 жылғы 18 ақпандағы № 81 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178826/rus

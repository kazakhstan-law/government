  requisite: Постановление Правительства Республики Казахстан от 16 марта 2022 года № 129
  title:
    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 17 февраля 2017 года № 71 «О некоторых вопросах министерств здравоохранения и национальной экономики Республики Казахстан» и признании утратившими силу постановлений Правительства Республики Казахстан от 13 июня 2005 года № 592 «Об утверждении перечня заболеваний, препятствующих содержанию и обучению несовершеннолетних в специальных организациях образования и организациях образования с особым режимом содержания» и от 8 ноября 2011 года № 1309 «Об утверждении списка тяжелых форм некоторых хронических заболеваний»
    kaz: «Қазақстан Республикасы Денсаулық сақтау және Ұлттық экономика министрлiктерінің кейбiр мәселелерi туралы» Қазақстан Республикасы Үкіметінің 2017 жылғы 17 ақпандағы № 71 қаулысына толықтырулар енгізу және Қазақстан Республикасы Үкіметінің «Кәмелетке толмағандарды арнаулы бiлiм беру ұйымдары мен ерекше режимде ұстайтын бiлiм беру ұйымдарында бағып-күтуге және оқытуға кедергi болатын аурулардың тiзбесiн бекiту туралы» 2005 жылғы 13 маусымдағы № 592 және «Кейбір созылмалы аурулардың ауыр нысандарының тізімін бекіту туралы» 2011 жылғы 8 қарашадағы № 1309 қаулыларының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/165305/rus

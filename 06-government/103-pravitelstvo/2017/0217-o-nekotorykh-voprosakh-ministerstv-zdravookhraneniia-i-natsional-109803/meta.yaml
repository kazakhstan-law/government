  title:
    rus: О внесений изменений и дополнений в постановления Правительства Республики Казахстан от 17 февраля 2017 года № 71 «О некоторых вопросах министерств здравоохранения и национальной экономики Республики Казахстан» и от 29 декабря 2018 года № 936 «О некоторых вопросах Министерства индустрии и инфраструктурного развития Республики Казахстан и внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Денсаулық сақтау және Ұлттық экономика министрлiктерінің кейбiр мәселелерi туралы» 2017 жылғы 17 ақпандағы № 71 және «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің кейбір мәселелері және Қазақстан Республикасы Үкіметінің кейбір шешімдеріне өзгерістер мен толықтырулар енгізу туралы» 2018 жылғы 29 желтоқсандағы № 936 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161343/rus

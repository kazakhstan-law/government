title:
  rus: Об утверждении перечней объектов, в том числе стратегических, находящихся в государственной собственности и собственности субъектов квазигосударственного сектора, не подлежащих отчуждению
  kaz: Иеліктен шығаруға жатпайтын, мемлекеттік меншіктегі және квазимемлекеттік сектор субъектілерінің меншігіндегі объектілердің, оның ішінде стратегиялық объектілердің тізбелерін бекіту туралы

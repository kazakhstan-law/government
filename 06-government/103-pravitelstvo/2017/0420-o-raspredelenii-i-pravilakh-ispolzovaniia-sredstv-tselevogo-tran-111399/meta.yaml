  title:
    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 20 апреля 2017 года № 211 «О распределении и Правилах использования средств целевого трансферта из Национального фонда Республики Казахстан на реализацию проектов по содействию устойчивому развитию и росту Республики Казахстан, осуществляемых совместно с международными финансовыми организациями в рамках рамочных соглашений о партнерстве»
    kaz: «Әріптестік туралы негіздемелік келісімдер шеңберінде халықаралық қаржы ұйымдарымен бірлесіп жүзеге асырылатын Қазақстан Республикасының орнықты дамуына және өсуіне жәрдемдесу жөніндегі жобаларды іске асыруға Қазақстан Республикасының Ұлттық қорынан берілетін нысаналы трансферт қаражатын бөлу және пайдалану қағидалары туралы» Қазақстан Республикасы Үкіметінің 2017 жылғы 20 сәуірдегі № 211 қаулысына толықтырулар енгізу туралы

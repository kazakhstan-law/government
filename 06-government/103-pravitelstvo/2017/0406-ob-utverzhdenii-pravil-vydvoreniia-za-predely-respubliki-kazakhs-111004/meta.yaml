    kaz: «Шетелдікті немесе азаматтығы жоқ адамды Қазақстан Республикасының шегінен тыс мәжбүрлеу тәртібімен шығарып жіберу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2017 жылғы 6 сәуірдегі № 175 қаулысына өзгерістер енгізу туралы

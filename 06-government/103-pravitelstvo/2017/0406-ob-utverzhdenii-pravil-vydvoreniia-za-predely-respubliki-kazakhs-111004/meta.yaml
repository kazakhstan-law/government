act_code: '111004'
requisite: Постановление Правительства Республики Казахстан от 6 апреля 2017 года № 175
title:
  rus: Об утверждении Правил выдворения за пределы Республики Казахстан иностранца или лица без гражданства в принудительном порядке, а также содержания в специальном учреждении органов внутренних дел выдворяемого лица, в отношении которого вынесено решение суда о превентивном ограничении свободы передвижения
  kaz: Шетелдікті немесе азаматтығы жоқ адамды Қазақстан Республикасының шегінен тыс мәжбүрлеу тәртібімен шығарып жіберу, сондай-ақ жүріп-тұру еркіндігін алдын ала шектеу туралы өзіне қатысты сот шешімі шығарылған шығарып жіберілетін адамды ішкі істер органдарының арнаулы мекемесінде ұстау қағидаларын бекіту туралы

act_code: '211341'
requisite: Постановление Правительства Республики Казахстан от 17 июня 2025 года № 449
title:
  rus: Об утверждении Правил выпуска государственных ценных бумаг в национальной валюте для обращения на территории Международного финансового центра «Астана» и заимствования у международных финансовых организаций местным исполнительным органом города республиканского значения с особым статусом, определенным законом Республики Казахстан, для финансирования проектов, отнесенных к «зеленым» согласно экологическому законодательству Республики Казахстан
  kaz: «Астана» халықаралық қаржы орталығының аумағында айналысқа жіберу үшін ұлттық валютада мемлекеттік бағалы қағаздарды шығару және Қазақстан Республикасының экология заңнамасына сәйкес «жасылға» жатқызылған жобаларды қаржыландыру үшін Қазақстан Республикасының заңында айқындалған ерекше мәртебесі бар республикалық маңызы бар қаланың жергілікті атқарушы органының халықаралық қаржы ұйымдарынан қарыз алуы қағидаларын бекіту туралы

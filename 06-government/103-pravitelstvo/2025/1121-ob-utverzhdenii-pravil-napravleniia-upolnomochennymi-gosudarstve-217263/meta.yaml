act_code: '217263'
requisite: Постановление Правительства Республики Казахстан от 21 ноября 2025 года № 993
title:
  rus: Об утверждении Правил направления уполномоченными государственными органами в уполномоченный орган в области налоговой политики обоснования необходимости предоставления (продления) налоговой льготы по курируемым отраслям, критериев достижения социально-экономических целей применения налоговых льгот и порядка их установления
  kaz: Уәкілетті мемлекеттік органдардың салық саясаты саласындағы уәкілетті органға жетекшілік ететін салалар бойынша салықтық жеңілдік беру (ұзарту) қажеттігінің негіздемесін жіберу қағидаларын, салықтық жеңілдіктерді қолданудың әлеуметтік-экономикалық мақсаттарына қол жеткізу өлшемшарттары мен оларды белгілеу тәртібін бекіту туралы

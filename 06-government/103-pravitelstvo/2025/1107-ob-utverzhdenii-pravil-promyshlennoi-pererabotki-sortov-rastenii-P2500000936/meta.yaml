  rus: Об утверждении Правил промышленной переработки сортов растения конопли (каннабиса), разрешенных к культивированию в промышленных целях, не связанных с производством или изготовлением наркотических средств и психотропных веществ
  kaz: Есірткі және психотроптық заттарды өндірумен немесе дайындаумен байланысты емес өнеркәсіптік мақсаттарда өсіруге рұқсат етілген сора (каннабис) өсімдігінің сұрыптарын өнеркәсіптік қайта өңдеу қағидаларын бекіту туралы

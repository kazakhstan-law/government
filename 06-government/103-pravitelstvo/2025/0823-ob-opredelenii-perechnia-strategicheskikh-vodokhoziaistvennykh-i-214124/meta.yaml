  title:
    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 23 августа 2025 года № 671 «Об определении перечня стратегических водохозяйственных и гидротехнических сооружений, в том числе которые могут быть переданы в имущественный наем (аренду) или доверительное управление»
    kaz: «Стратегиялық су шаруашылығы құрылысжайлары мен гидротехникалық құрылысжайлардың, оның ішінде мүліктік жалдауға (жалға) немесе сенімгерлік басқаруға берілуі мүмкін құрылысжайлардың тізбесін айқындау туралы» Қазақстан Республикасы Үкіметінің 2025 жылғы 23 тамыздағы № 671 қаулысына толықтырулар енгізу туралы

title:
  rus: Об определении перечня стратегических водохозяйственных и гидротехнических сооружений, в том числе которые могут быть переданы в имущественный наем (аренду) или доверительное управление
  kaz: Стратегиялық су шаруашылығы құрылысжайлары мен гидротехникалық құрылысжайлардың, оның ішінде мүліктік жалдауға (жалға) немесе сенімгерлік басқаруға берілуі мүмкін құрылысжайлардың тізбесін айқындау туралы

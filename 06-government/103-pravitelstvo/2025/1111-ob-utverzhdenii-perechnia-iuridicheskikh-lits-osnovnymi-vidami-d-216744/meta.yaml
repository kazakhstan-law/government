act_code: '216744'
requisite: Постановление Правительства Республики Казахстан от 11 ноября 2025 года № 954
title:
  rus: Об утверждении перечня юридических лиц, основными видами деятельности которых являются осуществление заемных операций или выкуп прав требования, сто процентов голосующих акций (долей) которых принадлежат национальному управляющему холдингу, имеющих право на вычет суммы расходов по созданию провизий (резервов) против сомнительных и безнадежных активов, условных обязательств, за исключением активов и условных обязательств, предоставленных в пользу взаимосвязанных сторон либо третьим лицам по обязательствам взаимосвязанных сторон (кроме активов и условных обязательств кредитных товариществ), правил его формирования и Правил создания провизий (резервов)
  kaz: Негізгі қызмет түрі қарыз операцияларын жүзеге асыру немесе талап ету құқықтарын сатып алу болып табылатын және дауыс беретін акцияларының (үлестерінің) жүз пайызы ұлттық басқарушы холдингке тиесілі, өзара байланысты тараптар пайдасына не өзара байланысты тараптардың міндеттемелері бойынша үшінші тұлғаларға берілген активтер мен шартты міндеттемелерді (кредиттік серіктестіктердің активтері мен шартты міндеттемелерінен басқа) қоспағанда, күмәнді және үмітсіз активтерге, шартты міндеттемелерге қарсы провизия (резерв) құру жөніндегі шығыстар сомасын шегеруге құқығы бар заңды тұлғалардың тізбесін, оны қалыптастыру қағидаларын және Провизия (резерв) құру қағидаларын бекіту туралы

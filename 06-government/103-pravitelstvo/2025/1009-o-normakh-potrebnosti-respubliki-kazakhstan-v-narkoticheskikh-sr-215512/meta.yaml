title:
  rus: О нормах потребности Республики Казахстан в наркотических средствах и психотропных веществах на 2026 год для утверждения международных квот для Республики Казахстан Международным комитетом по контролю над наркотиками Организации Объединенных Наций
  kaz: Қазақстан Республикасына арналған халықаралық квоталарды Біріккен Ұлттар Ұйымының Есірткіні бақылау жөніндегі халықаралық комитетінің бекітуі үшін Қазақстан Республикасының есірткі және психотроптық заттарға қажеттілігінің 2026 жылға арналған нормалары туралы

act_code: '221316'
requisite: Постановление Правительства Республики Казахстан от 31 декабря 2025 года № 1204
title:
  rus: Об утверждении перечня лекарственных средств, медицинских изделий, комплектующих медицинских изделий, а также технических вспомогательных (компенсаторных) средств в соответствии с законодательством Республики Казахстан о социальной защите, ставка налога на добавленную стоимость которых применяется к размеру облагаемого оборота по реализации и импорту
  kaz: Қосылған құн салығының мөлшерлемесі өткізу бойынша салық салынатын айналымның және импорттың мөлшеріне қолданылатын дәрілік заттардың, медициналық бұйымдардың, жиынтықтауыш медициналық бұйымдардың, сондай-ақ Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес техникалық көмекші (компенсаторлық) құралдардың тізбесін бекіту туралы

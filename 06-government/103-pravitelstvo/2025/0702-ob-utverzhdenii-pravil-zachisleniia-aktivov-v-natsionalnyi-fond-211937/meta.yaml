  requisite: Постановление Правительства Республики Казахстан от 6 апреля 2026 года № 230
  title:
    rus: О внесении изменения и дополнения в постановление Правительства Республики Казахстан от 2 июля 2025 года № 500 «Об утверждении Правил зачисления активов в Национальный фонд Республики Казахстан, использования Национального фонда Республики Казахстан, а также форм и Правил составления годового отчета о формировании и использовании Национального фонда Республики Казахстан»
    kaz: «Активтерді Қазақстан Республикасының Ұлттық қорына есепке жатқызу, Қазақстан Республикасының Ұлттық қорын пайдалану қағидаларын, сондай-ақ Қазақстан Республикасының Ұлттық қорын қалыптастыру және пайдалану туралы жылдық есептің нысандары мен оны жасау қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2025 жылғы 2 шiлдедегi № 500 қаулысына өзгеріс пен толықтыру енгізу туралы

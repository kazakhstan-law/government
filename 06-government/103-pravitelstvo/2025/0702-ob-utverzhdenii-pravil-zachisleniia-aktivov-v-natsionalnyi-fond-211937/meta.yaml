    rus: О внесении изменений и дополнений в некоторые решения Правительства Республики Казахстан и распоряжения Премьер-Министра Республики Казахстан
    kaz: Қазақстан Республикасы Үкіметінің кейбір шешімдеріне және Қазақстан Республикасы Премьер-Министрінің кейбір өкімдеріне өзгерістер мен толықтырулар енгізу туралы

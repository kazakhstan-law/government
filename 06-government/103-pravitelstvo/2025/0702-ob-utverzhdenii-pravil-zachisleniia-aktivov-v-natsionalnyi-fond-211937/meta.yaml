title:
  rus: Об утверждении Правил зачисления активов в Национальный фонд Республики Казахстан, использования Национального фонда Республики Казахстан, а также форм и Правил составления годового отчета о формировании и использовании Национального фонда Республики Казахстан
  kaz: Активтерді Қазақстан Республикасының Ұлттық қорына есепке жатқызу, Қазақстан Республикасының Ұлттық қорын пайдалану қағидаларын, сондай-ақ Қазақстан Республикасының Ұлттық қорын қалыптастыру және пайдалану туралы жылдық есептің нысандары мен оны жасау қағидаларын бекіту туралы

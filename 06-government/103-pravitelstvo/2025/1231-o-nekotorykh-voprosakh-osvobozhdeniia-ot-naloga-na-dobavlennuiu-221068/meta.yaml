  requisite: Постановление Правительства Республики Казахстан от 24 июня 2026 года № 542
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 31 декабря 2025 года № 1203 «О некоторых вопросах освобождения от налога на добавленную стоимость в сфере здравоохранения» и от 31 декабря 2025 года № 1204 «Об утверждении перечня лекарственных средств, медицинских изделий, комплектующих медицинских изделий, а также технических вспомогательных (компенсаторных) средств в соответствии с законодательством Республики Казахстан о социальной защите, ставка налога на добавленную стоимость которых применяется к размеру облагаемого оборота по реализации и импорту»
    kaz: Қазақстан Республикасы Үкіметінің «Денсаулық сақтау саласындағы қосылған құн салығынан босатудың кейбір мәселелері туралы» 2025 жылғы 31 желтоқсандағы № 1203  және «Қосылған құн салығының мөлшерлемесі өткізу бойынша салық салынатын айналымның және импорттың мөлшеріне қолданылатын дәрілік заттардың, медициналық бұйымдардың, жиынтықтауыш медициналық бұйымдардың, сондай-ақ Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес техникалық көмекші (компенсаторлық) құралдардың тізбесі бекіту туралы» 2025 жылғы 31 желтоқсандағы № 1204 қаулыларына өзгерістер мен толықтырулар енгізу туралы

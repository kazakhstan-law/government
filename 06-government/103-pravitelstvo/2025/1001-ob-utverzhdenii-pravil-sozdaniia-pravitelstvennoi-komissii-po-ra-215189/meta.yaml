    rus: О внесении изменений в постановление Правительства Республики Казахстан от 1 октября 2025 года № 813 «Об утверждении Правил создания правительственной комиссии по расследованию несчастных случаев, не связанных с трудовой деятельностью и аварией на опасном производственном объекте, при которых погибло пять и более человек»

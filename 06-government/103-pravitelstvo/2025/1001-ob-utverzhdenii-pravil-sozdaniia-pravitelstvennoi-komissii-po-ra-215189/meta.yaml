title:
  rus: Об утверждении Правил создания правительственной комиссии по расследованию несчастных случаев, не связанных с трудовой деятельностью и аварией на опасном производственном объекте, при которых погибло пять и более человек
  kaz: Бес және одан да көп адам қаза тапқан қауіпті өндірістік объектідегі еңбек қызметіне және аварияға байланысты емес жазатайым оқиғаларды тергеп-тексеру жөнінде үкіметтік комиссия құру қағидаларын бекіту туралы

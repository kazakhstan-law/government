title:
  rus: Об утверждении требований к условиям культивирования и определению допустимого содержания тетрагидроканнабинола в растении конопли (каннабиса), разрешенном к культивированию в промышленных целях, не связанных с производством или изготовлением наркотических средств и психотропных веществ
  kaz: Есірткі және психотроптық заттарды өндірумен немесе дайындаумен байланысты емес өнеркәсіптік мақсаттарда өсіруге рұқсат етілген сора (каннабис) өсімдігін өсіру шарттарына және ондағы тетрагидроканнабинолдың жол берілетін құрамын айқындауға қойылатын талаптарды бекіту туралы

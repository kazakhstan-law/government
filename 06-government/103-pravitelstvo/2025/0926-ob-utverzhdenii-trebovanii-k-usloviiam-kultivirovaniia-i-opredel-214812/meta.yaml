  code: '223939'
  requisite: Постановление Правительства Республики Казахстан от 11 апреля 2026 года № 259
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 22 сентября 2025 года № 780 «Об утверждении сортов растения конопли (каннабиса), разрешенных к культивированию в промышленных целях, не связанных с производством или изготовлением наркотических средств и психотропных веществ» и от 26 сентября 2025 года № 797 «Об утверждении требований к условиям культивирования и определению допустимого содержания тетрагидроканнабинола в растении конопли (каннабиса), разрешенном к культивированию в промышленных целях, не связанных с производством или изготовлением наркотических средств и психотропных веществ»
    kaz: Қазақстан Республикасы Үкіметінің «Есірткі және психотроптық заттарды өндірумен немесе дайындаумен байланысты емес өнеркәсіптік мақсаттарда өсіруге рұқсат етілген сора (каннабис) өсімдігінің сорттарын бекіту туралы» 2025 жылғы 22 қыркүйектегі № 780 және «Есірткі және психотроптық заттарды өндірумен немесе дайындаумен байланысты емес өнеркәсіптік мақсаттарда өсіруге рұқсат етілген сора (каннабис) өсімдігін өсіру шарттарына және ондағы тетрагидроканнабинолдың жол берілетін құрамын айқындауға қойылатын талаптарды бекіту туралы» 2025 жылғы 26 қыркүйектегі № 797 қаулыларына өзгерiстер енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/223939/rus

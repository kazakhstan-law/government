act_code: '210262'
requisite: Постановление Правительства Республики Казахстан от 2 мая 2025 года № 303
title:
  rus: Об утверждении Правил проведения экспертизы проектов общестранового значения, предлагаемых к финансированию за счет средств Национального фонда Республики Казахстан путем приобретения долговых ценных бумаг Фонда национального благосостояния и национального управляющего холдинга, созданного в рамках мер по оптимизации системы управления институтами развития, финансовыми организациями и развитию национальной экономики, а также рассмотрения наличия альтернативных источников финансирования таких проектов
  kaz: Ұлттық әл-ауқат қорының және даму институттарын, қаржы ұйымдарын басқару жүйесін оңтайландыру және ұлттық экономиканы дамыту жөніндегі шаралар шеңберінде құрылған ұлттық басқарушы холдингтің борыштық бағалы қағаздарын сатып алу арқылы Қазақстан Республикасы Ұлттық қорының қаражаты есебінен қаржыландыру ұсынылатын жалпы ел үшін маңызы бар жобаларға сараптама жүргізу, сондай-ақ осындай жобаларды қаржыландырудың балама көздерінің бар-жоғын қарау қағидаларын бекіту туралы

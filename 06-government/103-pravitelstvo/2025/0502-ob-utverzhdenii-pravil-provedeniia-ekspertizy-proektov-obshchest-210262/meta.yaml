  title:
    rus: О внесении изменений и дополнений в постановление Правительства Республики Казахстан от 2 мая 2025 года № 303 «Об утверждении Правил проведения экспертизы проектов общестранового значения, предлагаемых к финансированию за счет средств Национального фонда Республики Казахстан путем приобретения долговых ценных бумаг Фонда национального благосостояния, а также рассмотрения наличия альтернативных источников финансирования таких проектов»
    kaz: «Ұлттық әл-ауқат қорының борыштық бағалы қағаздарын сатып алу арқылы Қазақстан Республикасы Ұлттық қорының қаражаты есебінен қаржыландыруға ұсынылатын жалпы ел үшін маңызы бар жобаларға сараптама жүргізу, сондай-ақ осындай жобаларды қаржыландырудың балама көздерінің бар-жоғын қарау қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2025 жылғы 2 мамырдағы № 303 қаулысына өзгерістер мен толықтырулар енгізу туралы

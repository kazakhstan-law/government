  requisite: Постановление Правительства Республики Казахстан от 10 марта 2026 года № 158
  title:
    rus: О корректировке показателей республиканского бюджета на 2026 год, увеличении годовых плановых назначений соответствующих бюджетных программ за счет остатков бюджетных средств 2025 года, использовании (доиспользовании) в 2026 году неиспользованных (недоиспользованных) сумм целевых трансфертов на развитие, выделенных из республиканского бюджета в 2025 году, и внесении изменений и дополнений в постановление Правительства Республики Казахстан от 10 декабря 2025 года № 1074 «О реализации Закона Республики Казахстан «О республиканском бюджете на 2026 – 2028 годы»
    kaz: 2026 жылға арналған республикалық бюджеттің көрсеткіштерін түзету, 2025 жылғы бюджет қаражатының қалдықтары есебінен тиісті бюджеттік бағдарламалардың жылдық жоспарлы тағайындауларын ұлғайту, 2025 жылы республикалық бюджеттен бөлінген нысаналы даму трансферттерінің пайдаланылмаған (толық пайдаланылмаған) сомаларын 2026 жылы пайдалану (толық пайдалану) және «2026 – 2028 жылдарға арналған республикалық бюджет туралы» Қазақстан Республикасының Заңын іске асыру туралы» Қазақстан Республикасы Үкіметінің 2025 жылғы 10 желтоқсандағы № 1074 қаулысына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/223082/rus

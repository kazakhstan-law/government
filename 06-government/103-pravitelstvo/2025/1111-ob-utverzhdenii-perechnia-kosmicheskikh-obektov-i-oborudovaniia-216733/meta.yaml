act_code: '216733'
requisite: Постановление Правительства Республики Казахстан от 11 ноября 2025 года № 956
title:
  rus: Об утверждении перечня космических объектов и оборудования объектов наземной космической инфраструктуры, ввозимых участниками космической деятельности, импорт которых освобождается от налога на добавленную стоимость, и формы подтверждения о ввозе космических объектов и оборудования объектов наземной космической инфраструктуры для целей космической деятельности
  kaz: Ғарыш қызметіне қатысушылар әкелетін, импорты қосылған құн салығынан босатылатын ғарыш объектілері мен жерүсті ғарыш инфрақұрылымы объектілері жабдықтарының тізбесін және ғарыш қызметінің мақсаттары үшін ғарыш объектілері мен жерүсті ғарыш инфрақұрылымы объектілерінің жабдықтарын әкелу туралы растау нысанын бекіту туралы

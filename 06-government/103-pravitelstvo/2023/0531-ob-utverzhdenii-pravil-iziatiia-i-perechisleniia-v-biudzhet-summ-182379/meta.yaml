act_code: '182379'
requisite: Постановление Правительства Республики Казахстан от 31 мая 2023 года № 431
title:
  rus: Об утверждении Правил изъятия и перечисления в бюджет сумм обязательных пенсионных взносов, дополнительно установленных для судей Конституционного Суда Республики Казахстан, судей, в случае освобождения судьи от должности по отрицательным мотивам
  kaz: Судья теріс себептер бойынша лауазымынан босатылған жағдайда Қазақстан Республикасы Конституциялық Сотының судьялары, судьялар үшін қосымша белгіленген міндетті зейнетақы жарналарының сомаларын алып қою және бюджетке аудару қағидаларын бекіту туралы

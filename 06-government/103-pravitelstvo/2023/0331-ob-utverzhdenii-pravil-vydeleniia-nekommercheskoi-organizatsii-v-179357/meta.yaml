    kaz: «Қазақстан халқына» қоғамдық қоры түріндегі коммерциялық емес ұйымға «Самұрық-Қазына» ұлттық әл-ауқат қоры» акционерлік қоғамының таза кірісінің кемінде жеті пайызы мөлшерінде қаражат бөлу қағидаларын бекіту туралы» Қазақстан Республикасы Үкіметінің 2023 жылғы 31 наурыздағы № 273 қаулысына толықтыру енгізу туралы

act_code: '179357'
requisite: Постановление Правительства Республики Казахстан от 31 марта 2023 года № 273
title:
  rus: Об утверждении Правил выделения некоммерческой организации в лице общественного фонда «Қазақстан халқына» средств в размере не менее семи процентов от чистого дохода акционерного общества «Фонд национального благосостояния «Самрук-Қазына»
  kaz: «Қазақстан халқына» қоғамдық қоры түріндегі коммерциялық емес ұйымға «Самұрық-Қазына» ұлттық әл-ауқат қоры» акционерлік қоғамының таза кірісінің кемінде жеті пайызы мөлшерінде қаражат бөлу қағидаларын бекіту туралы

  title:
    rus: О внесении дополнений в постановление Правительства Республики Казахстан от 4 октября 2023 года № 862 «Некоторые вопросы Министерства транспорта Республики Казахстан» и признании утратившим силу постановления Правительства Республики Казахстан от 11 мая 2014 года № 469 «Об утверждении условий, на которых иностранцы и лица без гражданства могут входить в состав экипажа судна, плавающего под Государственным флагом Республики Казахстан»
    kaz: «Қазақстан Республикасы Көлік министрлігінің кейбір мәселелері туралы» Қазақстан Республикасы Үкіметінің 2023 жылғы 4 қазандағы № 862 қаулысына толықтырулар енгізу және «Қазақстан Республикасының Мемлекеттік туын көтерiп жүзетін кеме экипажының құрамына шетелдiктер мен азаматтығы жоқ адамдардың кiру мүмкiндiгiнің шарттарын бекіту туралы» Қазақстан Республикасы Үкіметінің 2014 жылғы 11 мамырдағы № 469 қаулысының күші жойылды деп тану туралы

act_code: '178336'
requisite: Постановление Правительства Республики Казахстан от 26 января 2023 года № 48
title:
  rus: Об утверждении Правил передачи имущества между правоохранительными и специальными государственными органами, Вооруженными Силами Республики Казахстан, другими войсками и воинскими формированиями во время введения чрезвычайного или военного положения на всей территории Республики Казахстан и в отдельных ее местностях
  kaz: Қазақстан Республикасының бүкіл аумағында және оның жекелеген жергілікті жерлерінде төтенше жағдай немесе соғыс жағдайы енгізілген кезде құқық қорғау органдары және арнаулы мемлекеттік органдар, Қазақстан Республикасының Қарулы Күштері, басқа да әскерлер мен әскери құралымдар арасында мүлікті беру қағидаларын бекіту туралы

act_code: '179695'
requisite: Постановление Правительства Республики Казахстан от 13 апреля 2023 года № 292. Утратил силу постановлением Правительства Республики Казахстан от 17 июня 2025 года № 449 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выпуска государственных ценных бумаг в национальной валюте для обращения на площадке Международного финансового центра «Астана» местным исполнительным органом города республиканского значения с особым статусом, определенным законодательным актом Республики Казахстан, для финансирования «зеленых» проектов в рамках реализации целей устойчивого развития
  kaz: Қазақстан Республикасының заңнамалық актісінде айқындалған ерекше мәртебесі бар республикалық маңызы бар қаланың жергілікті атқарушы органының орнықты даму мақсаттарын іске асыру шеңберінде «жасыл» жобаларды қаржыландыру үшін «Астана» халықаралық қаржы орталығының алаңында айналысқа түсетін ұлттық валютадағы мемлекеттік бағалы қағаздарды шығару қағидаларын бекіту туралы

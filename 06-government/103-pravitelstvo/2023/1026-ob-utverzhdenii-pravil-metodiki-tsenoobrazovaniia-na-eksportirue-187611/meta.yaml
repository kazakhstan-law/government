act_code: '187611'
requisite: Постановление Правительства Республики Казахстан от 26 октября 2023 года № 944
title:
  rus: Об утверждении Правил (методики) ценообразования на экспортируемую сырую нефть и газовый конденсат при их реализации недропользователями, осуществляющими деятельность по контракту на недропользование, утвержденному Президентом Республики Казахстан, либо соглашениям (контрактам) о разделе продукции, заключенным с Правительством Республики Казахстан или компетентным органом до 1 января 2009 года и, прошедшими обязательную налоговую экспертизу, с использованием портов Средиземного моря по маршруту железнодорожная станция Республики Казахстан и (или) порт Актау – Баку – Джейхан
  kaz: Қызметін Қазақстан Республикасының Президенті бекіткен жер қойнауын пайдалануға арналған келісімшарт не Қазақстан Республикасының Үкіметімен немесе құзыретті органмен 2009 жылғы 1 қаңтарға дейін жасалған өнімді бөлу туралы келісімдер (келісімшарттар) бойынша жүзеге асыратын және міндетті салық сараптамасынан өткен жер қойнауын пайдаланушылар Қазақстан Республикасының теміржол станциясы және (немесе) Ақтау порты – Баку – Джейхан бағыты бойынша Жерорта теңізінің порттарын пайдалану арқылы өткізген кезде экспортталатын шикі мұнай мен газ конденсатына баға белгілеу қағидаларын (әдістемесін) бекіту туралы

title:
  rus: Об утверждении Правил и сроков исчисления (начисления) и перечисления обязательных пенсионных взносов работодателя в единый накопительный пенсионный фонд и взыскания по ним
  kaz: Жұмыс берушінің міндетті зейнетақы жарналарын есептеу (есепке жазу) және бірыңғай жинақтаушы зейнетақы қорына аудару және олар бойынша өндіріп алу қағидалары мен мерзімдерін бекіту туралы

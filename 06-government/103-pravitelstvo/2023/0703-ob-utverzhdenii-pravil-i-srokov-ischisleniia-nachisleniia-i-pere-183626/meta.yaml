  code: '202447'
  requisite: Постановление Правительства Республики Казахстан от 8 ноября 2024 года № 945
  title:
    rus: О внесении изменений и дополнений в постановления Правительства Республики Казахстан от 30 июня 2023 года № 525 «Об утверждении Правил и сроков исчисления, удержания (начисления) и перечисления обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов в единый накопительный пенсионный фонд и взыскания по ним» и от 3 июля 2023 года № 540 «Об утверждении Правил и сроков исчисления (начисления) и перечисления обязательных пенсионных взносов работодателя в единый накопительный пенсионный фонд и взыскания по ним»
    kaz: Қазақстан Республикасы Үкіметінің «Міндетті зейнетақы жарналарын, міндетті кәсіптік зейнетақы жарналарын есептеу, ұстап қалу (есепке жазу) және бірыңғай жинақтаушы зейнетақы қорына аудару және олар бойынша өндіріп алу қағидалары мен мерзімдерін бекіту туралы» 2023 жылғы 30 маусымдағы № 525 және «Жұмыс берушінің міндетті зейнетақы жарналарын есептеу (есепке жазу) және бірыңғай жинақтаушы зейнетақы қорына аудару және олар бойынша өндіріп алу қағидалары мен мерзімдерін бекіту туралы» 2023 жылғы 3 шілдедегі № 540 қаулыларына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202447/rus

act_code: '178306'
requisite: Постановление Правительства Республики Казахстан от 25 января 2023 года № 42
title:
  rus: Об утверждении предельных (максимальных) размеров земельных участков сельскохозяйственного назначения по видам сельскохозяйственных угодий в пределах республики и одного административного района (города), области, которые могут находиться на праве временного землепользования у гражданина Республики Казахстан для ведения крестьянского или фермерского хозяйства, негосударственного юридического лица Республики Казахстан без иностранного участия и его аффилированных лиц для ведения сельскохозяйственного производства
  kaz: Уақытша жер пайдалану құқығымен Қазақстан Республикасының азаматында шаруа немесе фермер қожалығын жүргізу үшін, шетелдік қатысуы жоқ Қазақстан Республикасының мемлекеттік емес заңды тұлғасында және оның үлестес тұлғаларында ауыл шаруашылығы өндірісін жүргізу үшін болуы мүмкін республиканың және бiр әкiмшiлiк ауданның (қаланың), облыстың шегінде ауыл шаруашылығы алқаптарының түрлері бойынша ауыл шаруашылығы мақсатындағы жер учаскелерiнiң шектi (ең жоғары) мөлшерiн бекіту туралы

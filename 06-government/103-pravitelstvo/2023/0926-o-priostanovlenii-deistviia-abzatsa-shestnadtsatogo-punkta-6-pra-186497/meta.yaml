title:
  rus: О приостановлении действия абзаца шестнадцатого пункта 6 Правил въезда и пребывания иммигрантов в Республике Казахстан, а также их выезда из Республики Казахстан, утверждённых постановлением Правительства Республики Казахстан от 21 января 2012 года № 148
  kaz: Қазақстан Республикасы Үкіметінің 2012 жылғы 21 қаңтардағы № 148 қаулысымен бекітілген Көшіп келушілердің Қазақстан Республикасына келуінің және онда болуының, сондай-ақ олардың Қазақстан Республикасынан кетуінің қағидаларының 6-тармағы он алтыншы абзацының қолданысын тоқтата тұру туралы

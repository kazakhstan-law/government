  code: '215195'
  requisite: Постановление Правительства Республики Казахстан от 3 октября 2025 года № 820
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 18 февраля 2017 года № 81 «Некоторые вопросы Министерства труда и социальной защиты населения Республики Казахстан» и от 15 июня 2023 года № 472 «Об утверждении Правил возврата 50 процентов от суммы обязательных пенсионных взносов, перечисленных за счет бюджетных средств до 1 января 2016 года, в пользу военнослужащих (кроме военнослужащих срочной службы), сотрудников специальных государственных и правоохранительных органов, государственной фельдъегерской службы, а также лиц, права которых иметь специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года»
    kaz: Қазақстан Республикасы Үкіметінің «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің кейбір мәселелері туралы» 2017 жылғы 18 ақпандағы № 81 және «Әскери қызметшілердің (мерзімді қызметтегі әскери қызметшілерден басқа), арнаулы мемлекеттік органдар және құқық қорғау органдары, мемлекеттік фельдъегерлік қызмет қызметкерлерінің, сондай-ақ арнаулы атақтарға, сыныптық шендерге ие болу және нысанды киім киіп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдардың пайдасына 2016 жылғы 1 қаңтарға дейін бюджет қаражаты есебінен аударылған міндетті зейнетақы жарналары сомасының 50 пайызын қайтару қағидаларын бекіту туралы» 2023 жылғы 15 маусымдағы № 472 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215195/rus

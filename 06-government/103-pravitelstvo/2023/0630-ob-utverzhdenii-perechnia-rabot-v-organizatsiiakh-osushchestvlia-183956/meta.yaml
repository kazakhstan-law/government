act_code: '183956'
requisite: Постановление Правительства Республики Казахстан от 30 июня 2023 года № 524
title:
  rus: Об утверждении перечня работ в организациях, осуществляющих судебно-медицинскую экспертизу и патологоанатомическую диагностику, для льготного исчисления трудового стажа при назначении пенсионных выплат по возрасту в полуторном размере и списка сезонных отраслей промышленности, работа в которых в течение полного сезона засчитывается в льготный трудовой стаж, при назначении пенсионных выплат по возрасту за год работы
  kaz: Жасына байланысты зейнетақы төлемдерін бір жарым есе мөлшерде тағайындаған кезде еңбек өтілін жеңілдікпен есептеу үшін сот-медициналық сараптаманы және патологиялық-анатомиялық диагностиканы жүзеге асыратын ұйымдардағы жұмыстар тізбесін және жасына байланысты бір жылдық жұмыс үшін зейнетақы төлемдерін тағайындан кезде толық маусым ішінде істеген жұмысы жеңілдікті еңбек өтіліне есептелетін өнеркәсіптің маусымдық салаларының тізімін бекіту туралы

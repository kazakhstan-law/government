title:
  rus: Об определении перечня лиц, для которых не требуются разрешения местных исполнительных органов на привлечение иностранной рабочей силы для осуществления трудовой деятельности
  kaz: Еңбек қызметін жүзеге асыру үшін шетелдік жұмыс күшін тартуға жергілікті атқарушы органдардың рұқсаты талап етілмейтін адамдардың тізбесін айқындау туралы

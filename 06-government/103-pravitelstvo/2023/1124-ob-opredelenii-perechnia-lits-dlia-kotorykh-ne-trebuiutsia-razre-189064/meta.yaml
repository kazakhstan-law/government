caused_by:
  code: '228003'
  requisite: Постановление Правительства Республики Казахстан от 21 июля 2026 года № 643
  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 31 декабря 2015 года № 1193 «О системе оплаты труда гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий» и от 24 ноября 2023 года № 1041 «Об определении перечня лиц, для которых не требуются разрешения местных исполнительных органов на привлечение иностранной рабочей силы для осуществления трудовой деятельности»
    kaz: Қазақстан Республикасы Үкіметінің «Азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбекақы төлеу жүйесі туралы» 2015 жылғы 31 желтоқсандағы № 1193 және «Еңбек қызметін жүзеге асыру үшін шетелдік жұмыс күшін тартуға жергілікті атқарушы органдардың рұқсаты талап етілмейтін адамдардың тізбесін айқындау туралы» 2023 жылғы 24 қарашадағы № 1041 қаулыларына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/228003/rus

act_code: '177423'
requisite: Постановление Правительства Республики Казахстан от 9 января 2023 года № 13
title:
  rus: Об утверждении Правил, условий и сроков применения ставки сбора за первичную регистрацию отдельных категорий транспортных средств, ввезенных на территорию Республики Казахстан до 1 сентября 2022 года, и освобождения физических лиц, осуществивших ввоз таких транспортных средств от расширенных обязательств производителей (импортеров), а также категорий транспортных средств
  kaz: Қазақстан Республикасының аумағына 2022 жылғы 1 қыркүйекке дейін әкелінген көлік құралдарының жекелеген санаттарын бастапқы тіркегені үшін алым мөлшерлемесін қолдану және осындай көлік құралдарын әкелуді жүзеге асырған жеке тұлғаларды, сондай-ақ көлік құралдарының санаттарын өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелерінен босату шарттары мен мерзімдерін, қағидаларын бекіту туралы

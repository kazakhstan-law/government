title:
  rus: Об утверждении перечня финансовых инструментов, разрешенных к приобретению за счет пенсионных активов единого накопительного пенсионного фонда, находящихся в доверительном управлении Национального Банка Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық Банкінің сенімгерлік басқаруындағы бірыңғай жинақтаушы зейнетақы қорының зейнетақы активтері есебінен сатып алуға рұқсат етілген қаржы құралдарының тізбесін бекіту туралы

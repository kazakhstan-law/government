  title:
    rus: О внесении изменений в постановления Правительства Республики Казахстан от 6 июля 2000 года № 1021 «Об утверждении Перечня государственных высших учебных заведений, не подлежащих приватизации» и от 4 октября 2023 года № 866 «О некоторых вопросах Министерства культуры и информации Республики Казахстан»

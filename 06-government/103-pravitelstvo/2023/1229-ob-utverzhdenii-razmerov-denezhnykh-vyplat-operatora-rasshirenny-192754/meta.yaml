act_code: '192754'
requisite: Постановление Правительства Республики Казахстан от 29 декабря 2023 года № 1250
title:
  rus: Об утверждении размеров денежных выплат оператора расширенных обязательств производителей (импортеров) за счет денег, поступивших на его банковский счет от производителей и импортеров, субъектам предпринимательства, осуществляющим сбор, транспортировку, подготовку к повторному использованию, сортировку, обработку, переработку, обезвреживание и (или) утилизацию отходов, образующихся после утраты потребительских свойств продукции (товаров), на которую (которые) распространяются расширенные обязательства производителей (импортеров)
  kaz: Өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері операторының өзінің банктік шотына өндірушілерден және импорттаушылардан түскен ақшаның есебінен өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері қолданылатын өнімнің (тауарлардың) тұтынушылық қасиеттері жоғалғаннан кейін түзілетін қалдықтарды жинауды, тасымалдауды, қайтадан пайдалануға дайындауды, сұрыптауды, өңдеуді, қайта өңдеуді, залалсыздандыруды және (немесе) кәдеге жаратуды жүзеге асыратын кәсіпкерлік субъектілеріне ақшалай төлемдерінің мөлшерлерін бекіту туралы

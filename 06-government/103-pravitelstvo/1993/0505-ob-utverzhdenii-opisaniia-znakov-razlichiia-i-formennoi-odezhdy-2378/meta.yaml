title:
  rus: Об утверждении описания знаков различия и форменной одежды, норм их выдачи и табеля должностных категорий работников Министерства экологии и биоресурсов Республики Казахстан, имеющих право на получение форменного обмундирования
  kaz: Қазақстан Республикасы Экология және биоресурстар министрлiгi қызметкерлерiнiң айырым белгiлерi және формалы киiмдердiң сипаттамасы, оларды беру нормалары мен формалы киiм-кешек алуға құқы бар лауазымды категориялардың табелiн бекiту туралы

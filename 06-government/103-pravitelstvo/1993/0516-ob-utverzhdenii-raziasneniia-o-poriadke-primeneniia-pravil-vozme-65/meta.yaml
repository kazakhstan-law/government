requisite: ПОСТАНОВЛЕНИЕ МИНИСТРА ТРУДА РЕСПУБЛИКИ КАЗАХСТАН И МИНИСТРА СОЦИАЛЬНОЙ ЗАЩИТЫ РЕСПУБЛИКИ КАЗАХСТАН от 17 мая 1993 г. N 27/3. Зарегистрировано в Министерстве юстиции Республики Казахстан 03.10.1994 г. N 37. Утратило силу - приказом Министра труда и социальной защиты населения РК от 16.01.1998г. N 5-п
title:
  rus: Об утверждении Разъяснения "О порядке применения Правил возмещения предприятиями, учреждениями, организациями всех форм собственности ущерба, причиненного рабочим и служащим увечьем или иным повреждением здоровья, связанным с исполнением ими трудовых обязанностей"
  kaz: '"Жұмысшылар мен қызметкерлердiң еңбек мiндеттерiн орындау кезiнде, зақымдануы салдарынан денсаулығының бұзылуына немесе жарымжан болуына себепкер кәсiпорындар, мекемелер, ұйымдар тарапынан келтiрiлген зиянның барлық түрi бойынша орнын өтеудiң Қағидасын қолданудың тәртiбi туралы" Түсiндiрменi бекiту туралы'

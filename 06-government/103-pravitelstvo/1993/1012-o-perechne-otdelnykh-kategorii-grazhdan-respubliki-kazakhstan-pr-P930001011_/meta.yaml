title:
  rus: О Перечне отдельных категорий граждан Республики Казахстан призывного возраста, которым предоставляется отсрочка от призыва на срочную военную службу
  kaz: Қазақстан Республикасының мерзiмдi әскери қызметке шақырудан кейiнге қалдырылатын әскерге шақыру жасындағы азаматтарының жекелеген санаттарының тiзбесi туралы

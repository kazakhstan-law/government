  title:
    rus: Об утверждении базовых ставок платы за древесину, отпускаемую на корню, Правил исчисления и внесения в бюджет платы за лесные пользования, а также изменений и дополнений в некоторые решения Правительства Республики Казахстан
    kaz: Өсiп тұрған сүрек үшiн төлемнiң базалық ставкаларын, Орманды пайдаланғаны үшiн төлемдi есептеу және бюджетке енгізу ережесiн, сондай-ақ Қазақстан Республикасы Үкiметiнiң кейбiр шешiмдерiне өзгерiстер мен толықтыруларды бекiту туралы

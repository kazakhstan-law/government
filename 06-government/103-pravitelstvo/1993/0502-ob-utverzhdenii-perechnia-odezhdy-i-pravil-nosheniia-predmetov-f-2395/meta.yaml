  kaz: Қазақстан Республикасы Қаржы министрлiгiнiң Бас кеден басқармасы мекемелерiнiң басшы және жедел құрамының киiм нысандары туралы Ереже және нысандық киiм, аяқкиiм заттары мен жабдықтарын киiп және тағып жүру тәртiбiн бекiту туралы

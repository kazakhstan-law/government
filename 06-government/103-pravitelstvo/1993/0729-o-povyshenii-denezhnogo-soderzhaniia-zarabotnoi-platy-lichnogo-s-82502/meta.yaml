act_code: '82502'
requisite: Постановление Кабинета Министров Республики Казахстан от 30 июля 1993 г. № 649
title:
  rus: О повышении денежного содержания (заработной платы) личного состава Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауiпсiздiк комитетi жеке құрамының ақшалай үлесiн (айлық ақысын) арттыру туралы

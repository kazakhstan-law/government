title:
  rus: Об особенностях прохождения военной службы военнослужащими - народными депутатами, освобожденными от выполнения служебных обязанностей вследствие избрания их в состав Верховного Совета Республики Казахстан и местных советов народных депутатов или их органов
  kaz: Қазақстан Республикасының жоғарғы Кеңесi мен халық депутаттары жергiлiктi Кеңестерiнiң немесе олардың органдарының құрамына сайлануы нәтижесiнде қызмет мiндеттерiн орындаудан босатылған әскери қызметшiлердiң - халық депутаттарының әскери қызметтi өткеруiнiң ерекшелiктерi туралы

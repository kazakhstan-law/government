title:
  rus: Об утверждении Положения и порядке исчисления выслуги лет, назначения и выплаты пенсий и пособий военнослужащим, лицам начальствующего и рядового состава органов внутренних дел и их семьям
  kaz: Әскери қызметшiлерге, iшкi iстер органдарының басшы және қатардағы құрамының адамдары мен олардың отбасыларына қызмет еткен жылдарын есептеу, зейнетақы мен жәрдемақы тағайындау және төлеу тәртiбi туралы Ереженi бекiту туралы

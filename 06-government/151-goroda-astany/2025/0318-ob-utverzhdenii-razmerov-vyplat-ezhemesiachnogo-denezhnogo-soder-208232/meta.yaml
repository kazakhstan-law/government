act_code: '208232'
requisite: Постановление акимата города Астаны от 18 марта 2025 года № 112-754. Зарегистрировано Департаментом юстиции города Астаны 18 марта 2025 года № 1406-01. Утратило силу постановлением акимата города Астаны от 28 ноября 2025 года № 112-4655 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размеров выплат ежемесячного денежного содержания спортсменам города Астаны, входящим в состав сборных команд Республики Казахстан, по видам спорта (национальных сборных команд по видам спорта), их тренерам, а также спортсменам города Астаны, выступающим в составах сборных команд Республики Казахстан (национальных сборных команд) по игровым видам спорта, их тренерам и руководителям клубных команд
  kaz: Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамына кіретін Астана қаласының спортшыларына, олардың жаттықтырушыларына, сондай-ақ Астана қаласында спорттың ойналатын түрлері бойынша Қазақстан Республикасы құрама командаларының (ұлттық құрама командалардың) құрамдарында қатысатын спортшыларға, олардың жаттықтырушыларына және клубтық командалардың жетекшілеріне ай сайынғы ақшалай жабдықталым төлемдерінің мөлшерін бекіту туралы

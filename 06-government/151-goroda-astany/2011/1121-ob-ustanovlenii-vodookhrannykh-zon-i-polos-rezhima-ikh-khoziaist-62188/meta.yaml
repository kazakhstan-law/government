  requisite: Постановление акимата Алматинской области от 18 марта 2026 года № 68
  title:
    rus: О внесении изменения в постановление акимата Алматинской области  от 21 ноября 2011 года № 246 «Об установлении водоохранных зон и полос, режима их хозяйственного использования в пределах административных границ Алматинской области на реках Большая Алматинка, Тургень, Чилик, Аксай, Ащибулак, Шарын, Текес, Курты, Узынкаргалы, Копа, Жирен-Айгыр, Чемолган, Каркара, Ассы, Кастек, Таргап, Кукузек, Бельбулак, на Куртинском, Бартогайском водохранилищах»
    kaz: Алматы облысы әкімдігінің 2011 жылғы 21 қарашадағы «Алматы облысының әкімшілік шекарасындағы Үлкен Алматы, Түрген, Шелек, Ақсай, Ащыбұлақ, Шарын, Текес, Күрті, Ұзынқарғалы, Қопа, Жирен-Айғыр, Шамалған, Қарқара, Ассы, Қастек, Тарғап, Көкөзек, Белбұлақ өзендерінің, және Күрті, Бартоғай су қоймаларында су қорғау аймақтары мен белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы» № 246 қаулысына өзгеріс енгізу туралы

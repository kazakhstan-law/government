  requisite: Постановление акимата Алматинской области от 18 декабря 2025 года № 381
  title:
    rus: О внесении изменений в постановление акимата Алматинской области от 21 ноября 2011 года № 246 «Об установлении водоохранных зон и полос, режима их хозяйственного использования в пределах административных границ Алматинской области на реках Большая Алматинка, Тургень, Чилик, Аксай, Ащибулак, Шарын, Текес, Курты, Аксу, Баскан, Усек, Тентек, Чиже, Сарканд, Лепсы, Хоргос, Борохудзир, Биен, Кызылагаш, Акешки, Чинжалы, Муканчи, Узынкаргалы, Копа, Жирен-Айгыр, Чемолган, Биже, Каркара, Ассы, Жаманты, Кастек, Таргап, Кукузек, Бельбулак, на озерах Сасыкколь, Жаланашколь и Куртинском, Бартогайском водохранилищах»
    kaz: Алматы облысы әкімдігінің 2011 жылғы 21 қарашадағы «Алматы облысының әкімшілік шекарасындағы Үлкен Алматы, Түрген, Шелек, Ақсай, Ащыбұлақ, Шарын, Текес, Күрті, Ақсу, Басқан, Үсек, Тентек, Шіже, Сарқан, Лепсі, Қорғас, Борохудзир, Бүиен, Қызылағаш, Ақешкі, Шынжалы, Мақаншы, Ұзынқарғалы, Қопа, Жирен-Айғыр, Шамалған, Біже, Қарқара, Ассы, Жаманты, Қастек, Тарғап, Көкөзек, Белбұлақ, өзендерінің, Сасықкөл, Жалаңашкөл көлдерінің және Күрті, Бартоғай су қоймаларында су қорғау аймақтары мен белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы» № 246 қаулысына өзгерістер енгізу туралы

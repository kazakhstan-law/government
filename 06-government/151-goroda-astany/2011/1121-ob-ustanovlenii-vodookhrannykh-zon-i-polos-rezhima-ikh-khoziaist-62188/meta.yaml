act_code: '62188'
requisite: Постановление акимата Алматинской области от 21 ноября 2011 года № 246. Зарегистрировано Департаментом юстиции Алматинской области 22 декабря 2011 года № 2083
title:
  rus: Об установлении водоохранных зон и полос, режима их хозяйственного использования в пределах административных границ Алматинской области на реках Большая Алматинка, Тургень, Чилик, Аксай, Ащибулак, Шарын, Текес, Курты, Узынкаргалы, Копа, Жирен-Айгыр, Чемолган, Каркара, Ассы, Кастек, Таргап, Кукузек, Бельбулак, на Куртинском, Бартогайском водохранилищах
  kaz: Алматы облысының әкімшілік шекарасындағы Үлкен Алматы, Түрген, Шелек, Ақсай, Ащыбұлақ, Шарын, Текес, Күрті, Ұзынқарғалы, Қопа, Жирен-Айғыр, Шамалған, Қарқара, Ассы, Қастек, Тарғап, Көкөзек, Белбұлақ, өзендерінің және Күрті, Бартоғай су қоймаларында су қорғау аймақтары мен белдеулерін және оларды шаруашылыққа пайдалану режимін белгілеу туралы

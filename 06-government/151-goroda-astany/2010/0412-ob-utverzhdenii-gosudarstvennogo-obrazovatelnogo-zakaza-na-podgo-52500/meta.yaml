  title:
    rus: О внесении изменений в постановление акимата города Астаны от 12 апреля 2010 года № 22-290п "Об утверждении государственного образовательного заказа на подготовку кадров в рамках Дорожной карты на 2010-2011 учебный год за счет целевых текущих трансфертов из республиканского бюджета"
    kaz: '"Республикалық бюджеттен мақсатты ағымдағы трансферттер есебінен 2010-2011 оқу жылына Жол картасы шеңберінде кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын бекіту туралы" Астана қаласы әкімдігінің 2010 жылғы 12 сәуірдегі № 22-290қ қаулысына өзгерістер енгізу туралы'

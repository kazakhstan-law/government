requisite: Постановление акимата города Астаны от 19 октября 2017 года № 107-2153. Зарегистрировано Департаментом юстиции города Астаны 27 октября 2017 года № 1138. Утратило силу постановлением акимата города Астаны от 30 мая 2018 года № 107-962 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

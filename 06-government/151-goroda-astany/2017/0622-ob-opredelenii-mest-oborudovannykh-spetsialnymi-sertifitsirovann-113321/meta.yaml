  title:
    rus: О внесении изменений в постановление акимата города Астаны от 22 июня 2017 года № 108-1325 «Об определении мест, оборудованных специальными сертифицированными устройствами, предназначенными для взимания оплаты за парковку и учета времени парковки транспортных средств в столице»
    kaz: Астана қаласы әкімдігінің 2017 жылғы 22 маусымдағы № 108-1325 «Астанада көлік құралдарын орынтұраққа қойғаны үшін ақы алуға және олардың орынтұрақта тұрған уақытын есептеуге арналған сертификатталған арнайы құрылғылармен жабдықталған орындарды айқындау туралы» қаулысына өзгерістер енгізу туралы

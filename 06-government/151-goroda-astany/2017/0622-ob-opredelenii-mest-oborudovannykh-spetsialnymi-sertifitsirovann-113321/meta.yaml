title:
  rus: Об определении мест, оборудованных специальными сертифицированными устройствами, предназначенными для взимания оплаты за парковку и учета времени парковки транспортных средств в городе Нур-Султан
  kaz: Нұр-Сұлтан қаласында көлік құралдарын орынтұраққа қойғаны үшін ақы алуға және олардың орынтұрақта тұрған уақытын есептеуге арналған сертификатталған арнайы құрылғылармен жабдықталған орындарды айқындау туралы

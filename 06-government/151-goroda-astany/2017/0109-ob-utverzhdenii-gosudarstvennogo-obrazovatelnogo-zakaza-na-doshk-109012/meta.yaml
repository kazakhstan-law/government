  title:
    rus: О внесении изменений и дополнения в постановление акимата города Астаны от 9 января 2017 года № 107-1 «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в расчете на одного воспитанника на 2017 год в дошкольных организациях города Астаны»
    kaz: Астана қаласы әкімдігінің 2017 жылғы 9 қаңтардағы № 107-1 «Астана қаласының мектепке дейінгі ұйымдарындағы 2017 жылға бір тәрбиеленушіге мектепке дейінгі тәрбиелеу мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыруды және ата-ананың ақы төлеу көлемін бекіту туралы» қаулысына өзгерістер мен толықтыру енгізу туралы

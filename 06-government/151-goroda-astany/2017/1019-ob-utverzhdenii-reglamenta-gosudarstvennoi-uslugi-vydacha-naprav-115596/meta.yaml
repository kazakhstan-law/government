act_code: '115596'
requisite: Постановление акимата города Астаны от 19 октября 2017 года № 107-2152. Зарегистрировано Департаментом юстиции города Астаны 27 октября 2017 года № 1137. Утратило силу постановлением акимата города Нур-Султана от 9 октября 2020 года № 107-2157 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача направления детям с ограниченными возможностями в специальные коррекционные и другие организации для получения медицинских, специальных образовательных и специальных социальных услуг»
  kaz: «Кемтар балаларға арнаулы түзеу ұйымдары мен басқа да ұйымдарға медициналық, арнаулы білім және арнаулы әлеуметтік қызметтерді алуы үшін жолдама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

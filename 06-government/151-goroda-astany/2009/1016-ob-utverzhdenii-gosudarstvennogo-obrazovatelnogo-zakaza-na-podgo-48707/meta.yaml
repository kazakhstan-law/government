  title:
    rus: О внесении изменений и дополнения в постановление акимата города Астаны от 16 октября 2009 года № 22-966п "Об утверждении государственного образовательного заказа на подготовку кадров в рамках Дорожной карты на 2009-2010 учебный год за счет целевых текущих трансфертов из республиканского бюджета"
    kaz: '"Республикалық бюджеттен мақсатты ағымдағы трансферттер есебінен 2009-2010 оқу жылына Жол картасы аясында кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын бекіту туралы" Астана қаласы әкімдігінің 2009 жылғы 16 қазандағы № 22-966қ қаулысына өзгерістер мен толықтыру енгізу туралы'

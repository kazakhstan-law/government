  kaz: 2006 жылдың сәуір-маусым және қазан-желтоқсан айларында Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құрамаларының қатарына 18-27 жас аралығындағы азаматтарды шақыруды жүргізу туралы

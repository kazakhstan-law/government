    kaz: Астана қаласы әкімдігінің 2006 жылғы 3 мамырдағы N 33-10-386қ "2006 жылдың сәуір-маусым және қазан-желтоқсан айларында Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құрамаларының қатарына 18-27 жас аралығындағы азаматтарды шақыруды жүргізу туралы" қаулысына өзгерістер енгізу туралы

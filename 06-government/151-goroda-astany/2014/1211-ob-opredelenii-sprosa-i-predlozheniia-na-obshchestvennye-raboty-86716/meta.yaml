act_code: '86716'
requisite: Постановление акимата Есильского района Акмолинской области от 11 декабря 2014 года № а-12/483. Зарегистрировано Департаментом юстиции Акмолинской области 8 января 2015 года № 4563
title:
  rus: Об определении спроса и предложения на общественные работы и утверждение перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источники финансирования в Есильском районе на 2015 год
  kaz: Есіл ауданы бойынша 2015 жылға қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбегіне төленетін ақының мөлшерін және олардың қаржыландыру көздерін бекіту туралы

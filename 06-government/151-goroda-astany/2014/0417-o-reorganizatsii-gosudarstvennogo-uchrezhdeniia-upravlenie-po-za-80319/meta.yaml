requisite: Постановление акимата города Астаны от 17 апреля 2014 года № 107-610. Зарегистрировано Департаментом юстиции города Астаны 23 мая 2014 года № 814. Утратило силу постановлением акимата города Нур-Султана от 16 марта 2021 года № 107-900 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

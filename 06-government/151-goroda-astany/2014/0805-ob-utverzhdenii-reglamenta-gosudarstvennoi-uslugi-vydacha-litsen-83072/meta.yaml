requisite: Постановление акимата города Астаны от 5 августа 2014 года № 102-1257. Зарегистрировано Департаментом юстиции города Астаны 5 сентября 2014 года № 837. Утратило силу постановлением акимата города Астаны от 7 декабря 2015 года № 102-2238
title:
  rus: Об утверждении Регламента государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление деятельности по производству (формуляции) пестицидов (ядохимикатов), реализации пестицидов (ядохимикатов), применению пестицидов (ядохимикатов) аэрозольным и фумигационным способами"
  kaz: '"Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдiк және фумигациялық тәсiлдермен қолдану жөніндегі қызметті жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқасын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'

act_code: '85166'
requisite: Постановление акимата города Астаны от 4 ноября 2014 года № 111-1817. Зарегистрировано Департаментом юстиции города Астаны 15 декабря 2014 года № 863. Утратило силу постановлением акимата города Астаны от 22 мая 2024 года № 502-1707 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов, за исключением деятельности по реализации лома и отходов цветных и черных металлов, образовавшихся у юридических лиц в ходе собственного производства и в результате приобретения имущественного комплекса, в составе которого находились лом и (или) отходы цветных и (или) черных металлов, лицензиатам"
  kaz: Астана қаласында "Заңды тұлғаларда өз өндірісі барысында және құрамында түстi және (немесе) қара металл сынықтары және (немесе) қалдықтары болған мүліктік кешенді сатып алу  нәтижесінде пайда болған түстi және қара металл сынықтары мен қалдықтарын өткізу жөніндегі қызметті қоспағанда, заңды тұлғалардың түстi және қара металл сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және лицензиаттарға өткiзу жөніндегі қызметті жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" мемлекеттік қызмет Регламентін бекіту туралы

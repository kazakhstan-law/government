act_code: '77826'
requisite: Постановление акимата города Астаны от 28 января 2014 года № 107-120. Зарегистрировано Департаментом юстиции города Астаны 28 февраля 2014 года № 801. Утратило силу постановлением акимата города Астаны от 21 августа 2017 года № 107-1683 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении государственного образовательного заказа на подготовку специалистов с техническим и профессиональным образованием на 2011-2015 учебные годы в рамках Дорожной карты занятости 2020 за счет целевых текущих трансфертов из республиканского бюджета
  kaz: Республикалық бюджеттен нысаналы ағымдағы трансферттер есебінен Жұмыспен қамту 2020 жол картасы бағдарламасы шеңберінде 2011-2015 оқу жылына техникалық және кәсіптік білімі бар мамандарды даярлауға арналған мемлекеттік білім беру тапсырысын бекіту туралы

act_code: '75755'
requisite: Постановление акимата города Астаны от 4 ноября 2013 года № 102-1874. Зарегистрировано Департаментом юстиции города Астаны 6 декабря 2013 года № 793. Утратило силу постановлением акимата города Астаны от 31 января 2014 года № 06-134
title:
  rus: Об установлении норм субсидий на удобрения, горюче-смазочные материалы и товарно-материальные ценности для проведения весенне-полевых и уборочных работ, перечень приоритетных сельскохозяйственных культур города Астаны на 2013 год
  kaz: 2013 жылға арналған Астана қаласының көктемгі егіс және егін жинау жұмыстарын жүргізуге тыңайтқыштарды, жанар-жағар май материалдары мен тауарлық-материалдық құндылықтарды субсидиялау нормаларын, басым ауыл шаруашылығы дақылдарының тізбесін белгілеу туралы

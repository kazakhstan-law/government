act_code: '76822'
requisite: Постановление акимата Есильского района Акмолинской области от 20 декабря 2013 года № а-12/553. Зарегистрировано Департаментом юстиции Акмолинской области 15 января 2014 года № 3964. Утратило силу постановлением акимата Есильского района Акмолинской области от 22 июня 2015 года № а-6/264
title:
  rus: Об определении спроса и предложения на общественные работы и утверждение перечня организаций, видов, объемов, конкретных условий общественных работ, размеров оплаты труда участников и источники их финансирования в Есильском районе на 2014 год
  kaz: 2014 жылға Есіл ауданында арналған қоғамдық жұмыстарға сұраныс пен ұсынысты айқындау, ұйымдардың тізбесін, қоғамдық жұмыстардың түрлерін, көлемі мен нақты жағдайларын, қатысушылардың еңбекақысының мөлшері және оларды қаржыландыру көздерін бекіту туралы

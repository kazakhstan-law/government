act_code: '73129'
requisite: Постановление акимата города Астаны от 29 мая 2013 года № 111-860. Зарегистрировано Департаментом юстиции города Астаны 18 июня 2013 года № 781. Утратило силу постановлением акимата города Астаны от 10 сентября 2014 года № 111-1505
title:
  rus: Об утверждении Регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на осуществление вида деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов"
  kaz: '"Заңды тұлағалардың түсті және қара металл сынықтары мен қалдықтарын жинауы (дайындауы), сақтауы, қайта өңдеуі және өткізу жөніндегі қызмет түрін жүзеге асыруға лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" электрондық мемлекеттік қызмет регламентін бекіту туралы'

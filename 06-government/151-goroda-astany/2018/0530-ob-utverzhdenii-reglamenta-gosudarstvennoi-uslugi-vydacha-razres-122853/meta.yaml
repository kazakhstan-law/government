requisite: Постановление акимата города Астаны от 30 мая 2018 года № 107-962. Зарегистрировано Департаментом юстиции города Астаны 18 июня 2018 года № 1179. Утратило силу постановлением акимата города Нур-Султана от 9 октября 2020 года № 107-2157 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:

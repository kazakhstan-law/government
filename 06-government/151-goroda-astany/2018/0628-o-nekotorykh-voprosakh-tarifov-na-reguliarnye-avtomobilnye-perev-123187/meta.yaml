    kaz: «Астана қаласы бойынша қалалық және қала маңы қатынастарында жолаушылар мен багажды тұрақты автомобиль көлігімен тасымалдау тарифтерінің кейбір мәселелері туралы» Астана қаласы әкімдігінің 2018 жылғы 28 маусымдағы № 503-1230 қаулысына толықтырулар енгізу туралы

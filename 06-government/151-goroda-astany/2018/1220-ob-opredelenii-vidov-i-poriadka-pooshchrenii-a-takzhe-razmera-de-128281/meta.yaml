requisite: Постановление акимата города Астаны от 20 декабря 2018 года № 17-2028. Зарегистрировано Департаментом юстиции города Астаны 25 декабря 2018 года № 1195. Утратило силу постановлением акимата города Астаны от 30 июня 2026 года № 01-2235 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)

  title:
    rus: О внесении изменения в постановление акимата города Астаны от 8 января 2018 года № 107-12 «Об утверждении Регламента государственной услуги «Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием»
    kaz: «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Астана қаласы әкімдігінің 2018 жылғы 8 қаңтардағы № 107-12 қаулысына өзгеріс енгізу туралы

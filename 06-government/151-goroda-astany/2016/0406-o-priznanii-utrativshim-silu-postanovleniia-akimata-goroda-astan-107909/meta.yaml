act_code: '107909'
requisite: Постановление акимата города Астаны от 6 апреля 2016 года № 04-666
title:
  rus: О признании утратившим силу постановления акимата города Астаны от 3 июня 2015 года № 04-877 «Об утверждении Методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима города Астаны» и руководителей исполнительных органов города Астаны, финансируемых из местного бюджета»
  kaz: «Жергілікті бюджеттен қаржыланатын «Астана қаласы әкімінің аппараты» мемлекеттік мекемесі мен Астана қаласының атқарушы органдары басшылары «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы» Астана қаласы әкімдігінің 2015 жылғы 3 маусымдағы № 04-877 қаулысының күшін жою туралы

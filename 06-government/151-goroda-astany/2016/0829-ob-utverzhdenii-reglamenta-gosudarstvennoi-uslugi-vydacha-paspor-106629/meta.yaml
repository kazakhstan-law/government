act_code: '106629'
requisite: Постановление акимата города Астаны от 29 августа 2016 года № 186-1552. Зарегистрировано Департаментом юстиции города Астаны 29 сентября 2016 года № 1064. Утратило силу постановлением акимата города Нур-Султана от 15 апреля 2021 года № 509-1289 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги «Выдача паспорта готовности энергопроизводящим и энергопередающим организациям с установленной электрической мощностью 5 МВт и менее, свыше 5 МВт или с установленной тепловой мощностью 100 Гкал/час и выше,а также имеющим на своем балансе электрические сети напряжением 35 кВ и ниже, 110 кВ и выше к работе в осенне-зимних условиях»
  kaz: «Белгіленген электр қуаты 5 МВт және одан төмен, 5 МВт- тан жоғары немесе белгіленген жылу қуаты 100 Гкал/сағ және одан жоғары, сондай – ақ өз балансындакернеуі 35 кВ және одан төмен, 110 кВ және одан жоғары электр желілері бар энергия өндіруші және энергия беруші ұйымдарға күзгі-қысқы жағдайларда жұмысқа әзірлік паспортын беру» мемлекеттік көрсетілетін қызмет регламентінбекіту туралы

requisite: Постановление акимата города Астаны от 22 августа 2016 года № 112-1470. Зарегистрировано Департаментом юстиции города Астаны 13 сентября 2016 года № 1058. Утратило силу постановлением акимата города Нур-Султана от 28 апреля 2021 года № 01-1491 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: 'Об утверждении Регламента государственной услуги «Присвоение спортивных разрядов: спортсмен 2 разряда, спортсмен 3 разряда, спортсмен 1 юношеского разряда, спортсмен 2 юношеского разряда, спортсмен 3 юношеского разряда и квалификационных категорий: тренер высшего уровня квалификации второй категории, тренер среднего уровня квалификации второй категории, методист высшего уровня квалификации второй категории, методист среднего уровня квалификации второй категории, инструктор-спортсмен высшего уровня квалификации второй категории, спортивный судья»'
  kaz: «2-разрядты спортшы, 3-разрядты спортшы, 1-жасөспiрiмдiк-разрядты спортшы, 2-жасөспiрiмдiк-разрядты спортшы, 3-жасөспiрiмдiк-разрядты спортшы спорттық разрядтарын және бiлiктiлiгi жоғары деңгейдегi екiншi санатты жаттықтырушы, бiлiктiлiгi орта деңгейдегi екiншi санатты жаттықтырушы, бiлiктiлiгi жоғары деңгейдегi екiншi санатты әдіскер, біліктілігі орта деңгейдегі екінші санатты әдіскер, бiлiктiлiгi жоғары деңгейдегi екiншi санатты нұсқаушы-спортшы, спорт төрешiсi бiлiктiлiк санаттарын беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

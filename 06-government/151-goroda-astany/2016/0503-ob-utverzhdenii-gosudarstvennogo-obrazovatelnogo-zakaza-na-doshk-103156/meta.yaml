  title:
    rus: О внесении дополнений в постановление акимата города Астаны от 3 мая 2016 года № 107-862  «Об утверждении государственного образовательного заказа на дошкольное воспитание и обучение, размера подушевого финансирования и родительской платы в расчете на одного воспитанника на 2016 год в дошкольных организациях города Астаны»
    kaz: «Астана қаласының мектепке дейінгі ұйымдарындағы 2016 жылға бір тәрбиеленушіге мектепке дейінгі тәрбиелеу мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыруды және ата-ананың ақы төлеу көлемін бекіту туралы» Астана қаласы әкімдігінің 2016  жылғы 3 мамырдағы  № 107-862 қаулысына толықтырулар  енгізу туралы

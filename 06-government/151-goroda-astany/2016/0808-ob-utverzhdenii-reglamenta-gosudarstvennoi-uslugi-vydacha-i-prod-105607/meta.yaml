act_code: '105607'
requisite: Постановление акимата города Астаны от 8 августа 2016 года № 158-1422. Зарегистрировано Департаментом юстиции города Астаны 23 августа 2016 года № 1048. Утратило силу постановлением акимата города Астаны от 2 мая 2017 года № 158-880 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача и продление разрешения иностранному работнику на трудоустройство и работодателям на привлечение иностранной рабочей силы для осуществления трудовой деятельности на территории соответствующей административно-территориальной единицы»
  kaz: «Шетелдік қызметкерге жұмысқа орналасуға және жұмыс берушілерге тиісті әкімшілік-аумақтық бірлік аумағында еңбек қызметін жүзеге асыру үшін шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

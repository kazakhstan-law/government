requisite: Постановление Акимата города Астаны от 22 июня 2012 года № 102-829. Зарегистрировано Департаментом юстиции города Астаны 16 июля 2012 года № 735. Утратило силу постановлением акимата города Астаны от 31 января 2014 года № 06-134
title:
  rus: Об установлении норм субсидий на удобрения, горюче-смазочные материалы и товарно-материальные ценности для проведения весенне-полевых и уборочных работ, перечень приоритетных сельскохозяйственных культур города Астаны на 2012 год
  kaz: 2012 жылға арналған Астана қаласының көктемгі егіс және егін жинау жұмыстарын жүргізуге қажетті тыңайтқыштарды, жанар-жағармай материалдарына және тауар материалдарының құндылықтарын субсидиялау нормаларын, басым ауыл шаруашылығы дақылдарының тізбесін белгілеу туралы

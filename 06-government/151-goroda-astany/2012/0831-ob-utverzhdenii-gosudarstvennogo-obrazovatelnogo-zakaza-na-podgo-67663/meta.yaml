requisite: Постановление акимата города Астаны от 31 августа 2012 года № 107-1278. Зарегистрировано Департаментом юстиции города Астаны 21 сентября 2012 года № 743. Утратило силу постановлением акимата города Астаны от 21 августа 2017 года № 107-1683 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении государственного образовательного заказа на подготовку  специалистов с техническим и профессиональным образованием на 2012 - 2015 учебные годы в рамках Программы занятости 2020 за счет целевых текущих трансфертов из республиканского бюджета
  kaz: Республикалық бюджеттен нысаналы ағымдағы трансферттер есебінен Жұмыспен қамту 2020 бағдарламасы шеңберінде 2012 - 2015 оқу жылдарына техникалық және кәсіптік білімі бар мамандарды даярлауға арналған мемлекеттік білім беру тапсырысын бекіту туралы

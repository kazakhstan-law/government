requisite: Постановление Акимата города Астаны от 29 мая 2007 года N 33-430п. Зарегистрировано в Департаменте юстиции города Астаны 26 июня 2007 года N 467. Утратило силу постановлением Акимата города Астаны от 23 июня 2008 года N 33-716п.
title:
  rus: О проведении призыва граждан в возрасте от 18 до 27 лет в ряды Вооруженных Сил, других войск и воинских формирований Республики Казахстан в апреле-июне и октябре-декабре 2007 года.
  kaz: 2007 жылдың сәуір-маусым және қазан-желтоқсан айларында Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құрамаларының қатарына 18-27 жас аралығындағы азаматтарды шақыруды жүргізу туралы

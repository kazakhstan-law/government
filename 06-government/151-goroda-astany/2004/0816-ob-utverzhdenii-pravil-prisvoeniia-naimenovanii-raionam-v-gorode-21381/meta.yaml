  title:
    rus: О внесении дополнений и изменений в постановление акимата города Астаны от 17 августа 2004 года № 3-1-1639п "Об утверждении Правил присвоения наименований районам в городе, улицам, проспектам и иным составным частям города, изменения транскрипции их названий, присвоения порядковых номеров земельным участкам, зданиям и сооружениям, установки и эксплуатации указателей"
    kaz: '"Қаладағы аудандарға, көшелерге, даңғылдарға және қаланың өзге де құрамдас бөліктеріне атау беру, олардың атауларының транскрипцияларын өзгерту, жер учаскелеріне, ғимараттар мен орын-жайларға реттік нөмірлер беру, көрсеткіштерді орнату және пайдалану ережесін бекіту туралы" Астана қаласы әкімдігінің 2004 жылғы 17 тамыздағы N 3-1-1639қ қаулысына толықтырулар мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/43585/rus

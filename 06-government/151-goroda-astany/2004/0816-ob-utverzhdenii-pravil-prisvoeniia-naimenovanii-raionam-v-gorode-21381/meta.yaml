requisite: "Постановление Акимата города Астаны от 17 августа 2004 года N 3-1-1639п.\r\nЗарегистрировано Департаментом юстиции города Астаны 30 сентября 2004 года N 350. Утратило силу постановлением акимата города Астаны от 15 мая 2013 года № 120-753"
title:
  rus: Об утверждении Правил присвоения наименований районам в городе, улицам, проспектам и иным составным частям города, изменения транскрипции их названий, присвоения порядковых номеров земельным участкам, зданиям и сооружениям, установки и эксплуатации указателей
  kaz: Қаладағы аудандарға, көшелерге, даңғылдарға және қаланың өзге де құрамдас бөліктеріне атау беру, олардың атауларының транскрипцияларын өзгерту, жер учаскелеріне, ғимараттар мен орын-жайларға реттік нөмірлер беру, көрсеткіштерді орнату және пайдалану ережесін бекіту туралы

act_code: '21578'
requisite: Постановление Акимата города Астаны от 7 октября 2004 года N 3-1-1766п. Зарегистрировано Департаментом юстиции города Астаны 18 октября 2004 года N 353. Утратил силу - постановление Акимата города Астаны от 2 июня 2005 года N 3-1-379п.
title:
  rus: Об утверждении Правил оказания социальной помощи на проезд на внутригородском транспорте общего пользования (кроме такси) для студентов высших и средних учебных заведений города Астаны из числа талантливой и общественно активной молодежи из многодетных семей и сирот
  kaz: Көп балалы отбасылары мен жетiмдер қатарындағы талантты және қоғамдық белсендi жастары iшiндегi Астана қаласының жоғарғы және орта оқу орындарының студенттерiне қалаішілік жалпы қолданыстағы көлiкте (таксиден басқа) жол жүруiне әлеуметтiк көмек көрсету Ережесiн бекiту туралы

requisite: Постановление Акимата города Астаны от 1 сентября 2004 года N 3-1-1692п. Зарегистрировано Департаментом юстиции города Астаны 17 сентября 2004 года N 349. Утратило силу постановлением акимата города Астаны от 29 июля 2011 года № 26-731п
title:
  rus: Об утверждении Положения о комиссии по вопросам недропользования общераспространенными полезными ископаемыми на территории города Астаны и Инструкции по подготовке и организации конкурса инвестиционных программ на получение права недропользования
  kaz: Астана қаласы аумағында кең тараған пайдалы қазбалары бар жер қойнауын пайдалану мәселелері жөніндегі комиссия туралы Ережені және жер қойнауын пайдалану құқығын алуға инвестициялық бағдарламалар конкурсын әзірлеу және ұйымдастыру жөніндегі Нұсқаулықты бекіту туралы

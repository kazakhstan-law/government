  title:
    rus: О внесении изменений в постановление акимата города Астаны от 6 августа 2015 года № 107-1347 «Об утверждении Регламента государственной услуги «Выдача справок органов, осуществляющих функции по опеке или попечительству для оформления сделок с имуществом, принадлежащим на праве собственности несовершеннолетним детям»
    kaz: «Кәмелетке толмаған балаларға меншік құқығында тиесілі мүлікпен жасалатын мәмілелерді ресімдеу үшін қорғаншылық немесе қамқоршылық бойынша функцияларды жүзеге асыратын органдардың анықтамаларын беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Астана қаласы әкімдігінің 2015 жылғы 6 тамыздағы № 107-1347 қаулысына өзгерістер енгізу туралы

requisite: Постановление акимата города Астаны от 6 августа 2015 года № 107-1347. Зарегистрировано Департаментом юстиции города Астаны 9 сентября 2015 года № 942. Утратил силу постановлением акимата города Нур-Султана от 8 апреля 2019 года № 107-447 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги «Выдача справок органов, осуществляющих функции по опеке или попечительству для оформления сделок с имуществом, принадлежащим на праве собственности несовершеннолетним детям»
  kaz: «Кәмелетке толмаған балаларға меншік құқығында тиесілі мүлікпен жасалатын мәмілелерді ресімдеу үшін қорғаншылық немесе қамқоршылық бойынша функцияларды жүзеге асыратын органдардың анықтамаларын беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

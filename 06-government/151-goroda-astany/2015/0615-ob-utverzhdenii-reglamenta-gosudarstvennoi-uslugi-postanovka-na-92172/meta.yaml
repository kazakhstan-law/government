  title:
    rus: О внесении изменений в постановление акимата города Астаны от 15 июня 2015 года № 182-976 «Об утверждении Регламента государственной услуги «Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде»
    kaz: «Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Астана қаласы әкімдігінің 2015 жылғы 15 маусымдағы № 182-976 қаулысына өзгерістер енгізу туралы

act_code: '93469'
requisite: Постановление акимата города Астаны от 24 июля 2015 года № 113-1260. Зарегистрировано Департаментом юстиции города Астаны от 3 сентября 2015 года № 939. Утратило силу постановлением акимата города Астаны от 28 февраля 2018 года № 206-401 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги «Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения, определяемом Правительством Республики Казахстан»
  kaz: «Қазақстан Республикасының Үкіметі айқындайтын тәртіппен сыйға тарту шарты бойынша мемлекеттік емес заңды тұлғалардың және жеке тұлғалардың мүлік құқықтарын Қазақстан Республикасының қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

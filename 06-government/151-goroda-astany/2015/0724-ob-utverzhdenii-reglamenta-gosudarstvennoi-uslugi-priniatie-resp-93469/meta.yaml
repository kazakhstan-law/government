  title:
    rus: О внесении изменений в постановление акимата города Астаны от 24 июля 2015 года № 113-1260 «Об утверждении Регламента государственной услуги «Принятие Республикой Казахстан прав на имущество негосударственных юридических лиц и физических лиц по договору дарения, определяемом Правительством Республики Казахстан»
    kaz: «Қазақстан Республикасының Үкіметі айқындайтын тәртіппен сыйға тарту шарты бойынша мемлекеттік емес заңды тұлғалардың және жеке тұлғалардың мүлік құқықтарын Қазақстан Республикасының қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Астана қаласы әкімдігінің 2015 жылғы 24 шілдедегі № 113-1260 қаулысына өзгерістер енгізу туралы

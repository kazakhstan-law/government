title:
  rus: Об утверждении норм потребления коммунальных услуг по электроснабжению, теплоснабжению, водоснабжению и водоотведению, газоснабжению по городу Астане для потребителей, не имеющих приборов учета
  kaz: Астана қаласы бойынша есептеу аспаптары жоқ тұтынушылар үшін электрмен жабдықтау, жылумен жабдықтау, сумен жабдықтау және су бұру, газбен жабдықтау бойынша коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы

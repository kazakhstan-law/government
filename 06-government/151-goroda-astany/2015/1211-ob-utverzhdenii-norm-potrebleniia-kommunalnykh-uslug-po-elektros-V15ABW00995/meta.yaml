  title:
    rus: О внесении изменения в постановление акимата города Астаны от 11 декабря 2015 года № 367-2307 «Об утверждении норм потребления коммунальных услуг по электроснабжению, теплоснабжению, водоснабжению и водоотведению, газоснабжению по городу Астане для потребителей, не имеющих приборов учета»
    kaz: «Астана қаласы бойынша есептеу аспаптары жоқ тұтынушылар үшін электрмен жабдықтау, жылумен жабдықтау, сумен жабдықтау және су бұру, газбен жабдықтау бойынша коммуналдық көрсетілетін қызметтерді тұтыну нормаларын бекіту туралы» Астана қаласы әкімдігінің 2015 жылғы 11 желтоқсандағы № 367-2307 қаулысына өзгеріс енгізу туралы

  title:
    rus: О внесении изменений и дополнения в постановление акимата города Астаны от 10 июня 2015 года № 182-933 «Об утверждении Регламента государственной услуги «Выдача справки о наличии (отсутствии) в постоянном пользовании жилища из коммунального жилищного фонда или жилища, арендованного местным исполнительным органом в частном жилищном фонде, гражданам, нуждающимся в жилище из жилищного фонда государственного предприятия либо государственного учреждения»
    kaz: «Мемлекеттік кәсіпорынның немесе мемлекеттік мекеменің тұрғын үй қорынан тұрғын үйге мұқтаж азаматтарға тұрақты пайдалануында коммуналдық тұрғын үй қорынан берілген тұрғын үйдің немесе жергілікті атқарушы орган жеке тұрғын үй қорынан жалдаған тұрғын үйдің болуы (болмауы) туралы анықтама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Астана қаласы әкімдігінің 2015 жылғы 10 маусымдағы № 182-933 қаулысына өзгерістер және толықтыру енгізу туралы

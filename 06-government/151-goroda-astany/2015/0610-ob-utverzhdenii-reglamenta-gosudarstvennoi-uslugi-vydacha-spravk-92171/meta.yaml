act_code: '92171'
requisite: Постановление акимата города Астаны от 10 июня 2015 года № 182-933. Зарегистрировано Департаментом юстиции города Астаны 23 июля 2015 года № 923. Утратило силу постановлением акимата города Нур-Султана от 5 августа 2020 года № 158-1535 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги «Выдача справки о наличии (отсутствии) в постоянном пользовании жилища из коммунального жилищного фонда или жилища, арендованного местным исполнительным органом в частном жилищном фонде, гражданам, нуждающимся в жилище из жилищного фонда государственногопредприятия либо государственного учреждения»
  kaz: «Мемлекеттік кәсіпорынның немесе мемлекеттік мекеменің тұрғын үй қорынан тұрғын үйге мұқтаж азаматтарға тұрақты пайдалануында коммуналдық тұрғын үй қорынан берілген тұрғын үйдің немесе жергілікті атқарушы орган жеке тұрғын үй қорынан жалдаған тұрғын үйдің болуы (болмауы) туралы анықтама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

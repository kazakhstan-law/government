  title:
    rus: О внесении изменений в постановление акимата города Астаны от 10 марта 2015 года № 06-346 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями кандидатам в Президенты Республики Казахстан»
    kaz: Астана қаласы әкімдігінің 2015 жылғы 10 наурыздағы № 06-346 «Қазақстан Республикасының Президенттігіне кандидаттарға үгіттеу баспа материалдарын орналастыруға орындар белгілеу және сайлаушылармен кездесу өткізу үшін үй-жай беру туралы» қаулысына өзгерістер енгізу туралы

  requisite: Постановление акимата города Нур-Султана от 29 апреля 2019 года № 1-525. Зарегистрировано Департаментом юстиции города Астаны 29 апреля 2019 года № 1225. Утратило силу постановлением акимата города Астаны от 15 февраля 2023 года № 1-304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в постановление акимата города Астаны от 10 марта 2015 года № 06-346 «Об определении мест для размещения агитационных печатных материалов и предоставлении помещений для встреч с избирателями кандидатам в Президенты Республики Казахстан»
    kaz: «Қазақстан Республикасының Президенттігіне кандидаттарға үгіттеу баспа материалдарын орналастыруға орындар белгілеу және сайлаушылармен кездесу өткізу үшін үй-жай беру туралы» Астана қаласы әкімдігінің 2015 жылғы 10 наурыздағы № 06-346 қаулысына өзгерістер енгізу туралы

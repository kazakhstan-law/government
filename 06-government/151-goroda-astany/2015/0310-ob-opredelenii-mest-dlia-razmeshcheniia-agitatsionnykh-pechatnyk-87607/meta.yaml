act_code: '87607'
requisite: Постановление акимата города Астаны от 10 марта 2015 года № 06-346. Зарегистрировано Департаментом юстиции города Астаны 11 марта 2015 года № 888. Утратило силу постановлением акимата города Астаны от 15 февраля 2023 года № 1-304 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении мест для размещения агитационных печатных материалов для всех кандидатов на территории города Астаны
  kaz: Астана қаласының аумағында барлық кандидаттар үшін үгіттік баспа материалдарын орналастыру үшін орындарын белгілеу туралы

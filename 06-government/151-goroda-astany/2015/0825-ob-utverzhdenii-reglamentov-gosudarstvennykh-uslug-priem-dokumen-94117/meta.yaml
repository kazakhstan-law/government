act_code: '94117'
requisite: Постановление акимата города Астаны от 25 августа 2015 года № 107-1485. Зарегистрировано Департаментом юстиции города Астаны 23 сентября 2015 года № 944. Утратило силу постановлением акимата города Нур-Султана от 9 октября 2020 года № 107-2157 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг «Прием документов и зачисление в организации дополнительного образования для детей по предоставлению им дополнительного образования» и «Прием документов и выдача  направлений на предоставление отдыха детям из малообеспеченных семей в загородных и пришкольных лагерях»
  kaz: «Балаларға қосымша білім беру бойынша қосымша білім беру ұйымдарына құжаттар қабылдау және оқуға қабылдау» және «Аз қамтылған отбасылардағы балалардың қала сыртындағы  және мектеп жанындағы лагерьлерде демалуы үшін құжаттар қабылдау  және жолдама беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы

requisite: Постановление акимата города Астаны от 7 декабря 2015 года № 102-2238. Зарегистрировано Департаментом юстиции города Астаны 8 января 2016 года № 989. Утратило силу постановлением акимата города Нур-Султана от 23 октября 2020 года № 505-2431 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги «Выдача лицензии на осуществление деятельности по производству (формуляции) пестицидов (ядохимикатов),реализации пестицидов (ядохимикатов), применению пестицидов (ядохимикатов) аэрозольным и фумигационным способами»
  kaz: «Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдiк және фумигациялық тәсiлдермен қолдануға байланысты қызметті жүзеге асыруға лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

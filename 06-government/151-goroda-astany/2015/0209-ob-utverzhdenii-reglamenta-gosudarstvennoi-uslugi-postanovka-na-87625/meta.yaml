act_code: '87625'
requisite: Постановление от 09.02.2015 №182-194, Акимат г. Астаны
title:
  rus: Об утверждении регламента государственной услуги «Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении  жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде». Утратило силу постановлением акимата г.Астаны от 15.06.2015 № 182-976 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования).
  kaz: «Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы. Күші жойылды - Астана қаласы әкімдігінің 15.06.2015 № 182-976 қаулысымен (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі).

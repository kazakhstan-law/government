act_code: '90754'
requisite: Постановление акимата города Астаны от 3 июня 2015 года № 04-877. Зарегистрировано Департаментом юстиции города Астаны 19 июня 2015 года № 917. Утратил силу постановлением акимата города Астаны от 6 апреля 2016 года № 04-666
title:
  rus: Об утверждении Методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» Государственного учреждения «Аппарат акима города Астаны» и руководителей исполнительных органов города Астаны, финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыланатын «Астана қаласы әкімінің аппараты» мемлекеттік мекемесі мен Астана қаласының атқарушы органдары басшылары  «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы

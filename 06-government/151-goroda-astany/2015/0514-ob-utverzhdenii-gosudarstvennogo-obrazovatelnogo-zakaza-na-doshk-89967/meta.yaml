  kaz: Астана қаласының мектепке дейінгі ұйымдарындағы 2015 жылға бір тәрбиеленушіге мектепке дейінгі тәрбиелеу мен оқытуға мемлекеттік білім беру тапсырысын, жан басына шаққандағы қаржыландыруды және ата-ананың ақы төлеу көлемін бекіту туралы

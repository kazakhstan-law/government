act_code: '91029'
requisite: Постановление акимата города Астаны от 1 июня 2015 года № 102-837. Зарегистрировано Департаментом юстиции города Астаны 25 июня 2015 года № 920. Утратил силу постановлением акимата города Нур-Султана от 15 июня 2022 года № 1-1792 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении форм и сроков предоставления страхователем, страховщиком, агентом и обществом взаимного страхования в растениеводстве информации и документов, необходимых для осуществления местным исполнительным органом в области растениеводства своих контрольных функций
  kaz: Жергілікті атқарушы орган өсімдік шаруашылығы саласындағы өздерiнiң бақылау функцияларын жүзеге асыру үшiн сақтанушының, сақтандырушының, агенттің және өсімдік шаруашылығындағы өзара сақтандыру қоғамының қажеттi ақпарат пен құжаттарды ұсыну нысандары мен мерзiмдерiн орнату туралы

  title:
    rus: О внесении изменений и дополнений в постановление акимата города Астаны от 31 декабря 2015 года № 06-2420 «Об утверждении регламентов государственных услуг по вопросам регистрации актов гражданского состояния»
    kaz: «Азаматтық хал актілерін тіркеу мәселелері бойынша мемлекеттік көрсетілетін қызмет регламенттерін бекіту туралы» Астана қаласы әкімдігінің 2015 жылғы 31 желтоқсандағы № 06-2420 қаулысына өзгерістер мен толықтырулар енгізу туралы

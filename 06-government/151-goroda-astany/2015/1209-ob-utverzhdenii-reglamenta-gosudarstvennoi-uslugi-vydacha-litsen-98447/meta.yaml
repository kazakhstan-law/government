title:
  rus: Об утверждении Регламента государственной услуги «Выдача лицензии на осуществление деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов»
  kaz: «Заңды тұлғалардың түстi және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және өткiзу бойынша қызметті жүзеге асыруына лицензия беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы

    kaz: «Денсаулық сақтау саласындағы шаруашылық жүргізу құқығындағы мемлекеттік коммуналдық кәсіпорындардағы байқау кеңестері туралы» Астана қаласы әкімдігінің 2015 жылғы 19 маусымдағы № 106-1029 қаулысына өзгерістер мен толықтыру енгізу туралы

  title:
    rus: О признании утратившим силу постановления акимата города Астаны от 12 июня 2023 года № 1-1114 «Об утверждении Регламента личного приема физических лиц и представителей юридических лиц акимом города Астаны, первым заместителем акима, заместителями акима, руководителем государственного учреждения «Аппарат акима города Астаны»
    kaz: «Астана қаласының әкімі, әкімнің бірінші орынбасары, әкімнің орынбасарлары, «Астана қаласы әкімінің аппараты» мемлекеттік мекемесі басшысының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдау регламентін бекіту туралы» Астана қаласы әкімдігінің 2023 жылғы 12 маусымдағы № 1-1114 қаулысының күші жойылды деп тану туралы

act_code: '182891'
requisite: Постановление акимата города Астаны от 12 июня 2023 года № 1-1114. Зарегистрировано Департаментом юстиции города Астаны 13 июня 2023 года № 1343-01. Утратило силу постановлением акимата города Астаны от 27 августа 2026 года № 01-3018 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента личного приема физических лиц и представителей юридических лиц акимом города Астаны, первым заместителем акима, заместителями акима, руководителем государственного учреждения «Аппарат акима города Астаны»
  kaz: Астана қаласының әкімі, әкімнің бірінші орынбасары, әкімнің орынбасарлары, «Астана қаласы әкімінің аппараты» мемлекеттік мекемесі басшысының жеке тұлғаларды және заңды тұлғаларды өкілдерін жеке қабылдау регламентін бекіту туралы

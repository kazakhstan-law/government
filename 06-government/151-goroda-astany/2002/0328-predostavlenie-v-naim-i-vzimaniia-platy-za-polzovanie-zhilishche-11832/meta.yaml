act_code: '11832'
requisite: Постановление акимата города Астаны от 28 марта 2002 года N 3-1-516п. Зарегистрировано управлением юстиции г. Астаны 11 апреля 2002 года N 186. Утратило силу постановлением акимата города Астаны от 6 февраля 2012 года № 06-178
title:
  rus: Предоставление в найм и взимания платы за пользование жилищем из государственного коммунального жилищного фонда, находящегося на праве хозяйственного ведения государственного коммунального предприятия
  kaz: Мемлекеттiк коммуналдық кәсiпорынның шаруашылық жүргiзу құқығындағы мемлекеттiк коммуналдық тұрғын үй қорының тұрғын үй-жайларын жалға беру және пайдаланғаны үшiн өтемақы алу

  code: '42694'
  requisite: Постановление Акимата города Астаны от 7 ноября 2008 года N 17-1277п. Зарегистрировано в Департаменте юстиции города Астаны 3 декабря 2008 года N 552. Утратило силу постановлением акимата города Астаны от 6 февраля 2012 года № 06-178
  title:
    rus: О внесении изменений и дополнений в постановление акимата города Астаны от 28 марта 2002 года № 3-1-516п "Предоставление в найм и взимание платы за пользование жилищем из государственного коммунального жилищного фонда, находящегося на праве хозяйственного ведения государственного коммунального предприятия"
    kaz: '"Мемлекеттік коммуналдық кәсіпорынның шаруашылық жүргізу құқығындағы мемлекеттік коммуналдық тұрғын үй қорынан тұрғын-жайларды жалға беру және оны пайдалану үшін төлемақы алу туралы" Астана қаласы әкімдігінің 2002 жылғы 28 наурыздағы N 3-1-516қ қаулысына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/42694/rus
